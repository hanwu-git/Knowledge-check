    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"chapter":"上册 第一章 有理数","name":"正数与负数","formula":"正数 > 0，负数 < 0","explanation":"【定义】\n大于0的数叫做正数，在正数前面加上负号\"-\"的数叫做负数。\n\n【注意】\n1. 0既不是正数，也不是负数\n2. 正数和负数表示相反意义的量\n3. \"-\"号读作\"负\"\n\n【应用场景】\n- 温度：零上为正，零下为负\n- 海拔：高于海平面为正，低于为负\n- 收支：收入为正，支出为负","id":"g1_math_u001","semester":"upper"},{"chapter":"上册 第一章 有理数","name":"有理数的概念","formula":"整数和分数统称为有理数","explanation":"【定义】\n整数和分数统称为有理数。\n\n【分类】\n1. 按定义分：\n   - 整数：正整数、0、负整数\n   - 分数：正分数、负分数\n\n2. 按性质分：\n   - 正有理数：正整数、正分数\n   - 0\n   - 负有理数：负整数、负分数\n\n【注意】\n有限小数和无限循环小数都可以化成分数，所以它们都是有理数。","id":"g1_math_u002","semester":"upper"},{"chapter":"上册 第一章 有理数","name":"数轴","formula":"数轴三要素：原点、正方向、单位长度","explanation":"【定义】\n规定了原点、正方向和单位长度的直线叫做数轴。\n\n【三要素】\n1. 原点：表示数0的点\n2. 正方向：通常向右为正方向\n3. 单位长度：根据需要选取\n\n【性质】\n1. 任何一个有理数都可以用数轴上的一个点来表示\n2. 数轴上右边的数总比左边的数大\n3. 正数在原点右边，负数在原点左边","id":"g1_math_u003","semester":"upper"},{"chapter":"上册 第一章 有理数","name":"相反数","formula":"a的相反数是 -a","explanation":"【定义】\n只有符号不同的两个数叫做互为相反数。\n\n【性质】\n1. 0的相反数是0\n2. 数a的相反数是 -a\n3. 互为相反数的两个数的和为0：a + (-a) = 0\n4. 互为相反数的两个数在数轴上关于原点对称\n\n【求法】\n在一个数的前面添上\"-\"号，就得到这个数的相反数。","id":"g1_math_u004","semester":"upper"},{"chapter":"上册 第一章 有理数","name":"绝对值","formula":"|a| = a (a≥0)，|a| = -a (a<0)","explanation":"【定义】\n数轴上表示数a的点与原点的距离叫做数a的绝对值，记作|a|。\n\n【性质】\n1. 一个正数的绝对值是它本身\n2. 一个负数的绝对值是它的相反数\n3. 0的绝对值是0\n4. 任何数的绝对值都是非负数：|a| ≥ 0\n\n【应用】\n- 比较两个负数的大小：绝对值大的反而小\n- 距离问题","id":"g1_math_u005","semester":"upper"},{"chapter":"上册 第一章 有理数","name":"有理数比较大小","formula":"正数 > 0 > 负数","explanation":"【比较法则】\n1. 正数都大于0，负数都小于0\n2. 正数大于一切负数\n3. 两个正数比较，绝对值大的数大\n4. 两个负数比较，绝对值大的反而小\n\n【数轴比较法】\n在数轴上表示的两个数，右边的数总比左边的数大。\n\n【作差比较法】\n若 a - b > 0，则 a > b\n若 a - b = 0，则 a = b\n若 a - b < 0，则 a < b","id":"g1_math_u006","semester":"upper"},{"chapter":"上册 第二章 有理数的运算","name":"有理数的加法","formula":"同号相加，符号不变，绝对值相加","explanation":"【加法法则】\n1. 同号两数相加，取相同的符号，并把绝对值相加\n2. 绝对值不相等的异号两数相加，取绝对值较大的加数的符号，并用较大的绝对值减去较小的绝对值\n3. 互为相反数的两个数相加得0\n4. 一个数同0相加，仍得这个数\n\n【运算律】\n1. 加法交换律：a + b = b + a\n2. 加法结合律：(a + b) + c = a + (b + c)","id":"g1_math_u007","semester":"upper"},{"chapter":"上册 第二章 有理数的运算","name":"有理数的减法","formula":"a - b = a + (-b)","explanation":"【减法法则】\n减去一个数，等于加上这个数的相反数。\n即：a - b = a + (-b)\n\n【注意】\n1. 减法可以转化为加法进行运算\n2. 转化时要注意\"两变\"：减号变加号，减数变相反数\n\n【运算步骤】\n1. 将减法转化为加法\n2. 按加法法则进行计算\n\n【举例】\n5 - (-3) = 5 + 3 = 8","id":"g1_math_u008","semester":"upper"},{"chapter":"上册 第二章 有理数的运算","name":"有理数的乘法","formula":"同号得正，异号得负，绝对值相乘","explanation":"【乘法法则】\n1. 两数相乘，同号得正，异号得负，并把绝对值相乘\n2. 任何数同0相乘，都得0\n\n【多个数相乘】\n1. 几个不是0的数相乘，负因数的个数是偶数时，积是正数；负因数的个数是奇数时，积是负数\n2. 几个数相乘，有一个因数为0，积就为0\n\n【运算律】\n1. 乘法交换律：ab = ba\n2. 乘法结合律：(ab)c = a(bc)\n3. 分配律：a(b + c) = ab + ac","id":"g1_math_u009","semester":"upper"},{"chapter":"上册 第二章 有理数的运算","name":"有理数的除法","formula":"a ÷ b = a × 1/b (b≠0)","explanation":"【除法法则】\n除以一个不等于0的数，等于乘这个数的倒数。\n即：a ÷ b = a × (1/b)  (b ≠ 0)\n\n【符号法则】\n两数相除，同号得正，异号得负，并把绝对值相除。\n0除以任何一个不等于0的数，都得0。\n\n【倒数】\n乘积是1的两个数互为倒数。\n注意：0没有倒数。","id":"g1_math_u010","semester":"upper"},{"chapter":"上册 第二章 有理数的运算","name":"有理数的乘方","formula":"aⁿ = a × a × ... × a (n个a)","explanation":"【定义】\n求n个相同因数的积的运算，叫做乘方。乘方的结果叫做幂。\n\n【相关概念】\n在 aⁿ 中，a叫做底数，n叫做指数。\n\n【性质】\n1. 正数的任何次幂都是正数\n2. 负数的奇次幂是负数，负数的偶次幂是正数\n3. 0的任何正整数次幂都是0\n4. 任何数的0次幂都是1（0除外）\n\n【注意】\n(-a)² 与 -a² 不同：(-3)² = 9，-3² = -9","id":"g1_math_u011","semester":"upper"},{"chapter":"上册 第二章 有理数的运算","name":"有理数的混合运算","formula":"先乘方，再乘除，最后加减","explanation":"【运算顺序】\n1. 先乘方，再乘除，最后加减\n2. 同级运算，从左到右进行\n3. 如有括号，先做括号内的运算，按小括号、中括号、大括号依次进行\n\n【运算技巧】\n1. 巧用运算律（交换律、结合律、分配律）\n2. 注意符号的处理\n3. 能约分的先约分\n4. 适时使用简便算法","id":"g1_math_u012","semester":"upper"},{"chapter":"上册 第二章 有理数的运算","name":"科学记数法","formula":"a × 10ⁿ (1 ≤ a < 10)","explanation":"【定义】\n把一个大于10的数表示成 a × 10ⁿ 的形式（其中a大于或等于1且小于10，n是正整数），这种记数方法叫做科学记数法。\n\n【n的确定】\n对于整数位数为m的数，n = m - 1\n\n【举例】\n- 567000000 = 5.67 × 10⁸\n- -123000 = -1.23 × 10⁵\n\n【还原】\n将科学记数法表示的数还原，就是把小数点向右移动n位。","id":"g1_math_u013","semester":"upper"},{"chapter":"上册 第二章 有理数的运算","name":"近似数","formula":"四舍五入法","explanation":"【近似数】\n与实际接近的数叫做近似数。\n\n【精确度】\n近似数与准确数的接近程度，可以用精确度表示。\n\n【四舍五入法】\n对要保留的数位后一位进行判断：\n- 小于5则舍去\n- 大于或等于5则进1\n\n【常见精确度】\n1. 精确到个位、十位、百位...\n2. 精确到0.1、0.01、0.001...\n3. 保留一位小数、两位小数...\n\n【有效数字】\n从左边第一个不是0的数字起，到末位数字止，所有数字都是这个数的有效数字。","id":"g1_math_u014","semester":"upper"},{"chapter":"上册 第三章 整式的加减","name":"单项式","formula":"单项式：数字与字母的积","explanation":"【定义】\n由数字或字母的积组成的代数式叫做单项式。单独的一个数或一个字母也叫做单项式。\n\n【相关概念】\n1. 系数：单项式中的数字因数\n2. 次数：单项式中所有字母的指数的和\n\n【举例】\n- 3x²：系数是3，次数是2\n- -5ab：系数是-5，次数是2\n- πr²：系数是π，次数是2\n\n【注意】\n1. 单独一个非零数的次数是0\n2. π是常数，不是字母","id":"g1_math_u015","semester":"upper"},{"chapter":"上册 第三章 整式的加减","name":"多项式","formula":"多项式：几个单项式的和","explanation":"【定义】\n几个单项式的和叫做多项式。其中每个单项式叫做多项式的项，不含字母的项叫做常数项。\n\n【相关概念】\n1. 项：多项式中的每个单项式\n2. 常数项：不含字母的项\n3. 次数：多项式里次数最高的项的次数\n\n【举例】\n多项式 3x² - 2x + 5\n- 项：3x², -2x, 5\n- 常数项：5\n- 次数：2（二次三项式）\n\n【注意】\n多项式的次数不是所有项的次数之和，而是最高次项的次数。","id":"g1_math_u016","semester":"upper"},{"chapter":"上册 第三章 整式的加减","name":"整式","formula":"单项式和多项式统称为整式","explanation":"【定义】\n单项式和多项式统称为整式。\n\n【分类】\n整式\n├── 单项式\n│   ├── 数字单项式（如 5, -3）\n│   └── 字母单项式（如 a, 2xy）\n└── 多项式\n    ├── 二项式（两个单项式的和）\n    ├── 三项式（三个单项式的和）\n    └── ...\n\n【判断要点】\n1. 分母中不能含有字母\n2. 单项式是积的形式，多项式是和的形式\n3. 整式中可以有加、减、乘、乘方运算，但不能有除法（除数含字母）","id":"g1_math_u017","semester":"upper"},{"chapter":"上册 第三章 整式的加减","name":"合并同类项","formula":"同类项：字母相同，相同字母的指数也相同","explanation":"【同类项定义】\n所含字母相同，并且相同字母的指数也相同的项叫做同类项。几个常数项也是同类项。\n\n【合并同类项法则】\n把同类项的系数相加，字母和字母的指数不变。\n\n【步骤】\n1. 找出同类项\n2. 利用加法交换律、结合律把同类项放在一起\n3. 合并同类项\n\n【举例】\n3x² + 2x + 5x² - x = (3+5)x² + (2-1)x = 8x² + x","id":"g1_math_u018","semester":"upper"},{"chapter":"上册 第三章 整式的加减","name":"去括号","formula":"括号前是\"+\"，去括号不变号；是\"-\"，全变号","explanation":"【去括号法则】\n1. 如果括号外的因数是正数，去括号后原括号内各项的符号与原来的符号相同\n2. 如果括号外的因数是负数，去括号后原括号内各项的符号与原来的符号相反\n\n【记忆口诀】\n\"+\"号，不变号；\"-\"号，全变号。\n\n【举例】\n+ (a + b - c) = a + b - c\n- (a + b - c) = -a - b + c\n2(3x - 1) = 6x - 2\n-3(2x + 1) = -6x - 3","id":"g1_math_u019","semester":"upper"},{"chapter":"上册 第三章 整式的加减","name":"整式的加减","formula":"先去括号，再合并同类项","explanation":"【运算法则】\n几个整式相加减，通常用括号把每一个整式括起来，再用加减号连接，然后去括号，合并同类项。\n\n【一般步骤】\n1. 列出代数式\n2. 去括号\n3. 合并同类项\n4. 化简结果\n\n【举例】\n求 2x² - 3x + 1 与 -x² + 2x - 3 的和\n= (2x² - 3x + 1) + (-x² + 2x - 3)\n= 2x² - 3x + 1 - x² + 2x - 3\n= x² - x - 2","id":"g1_math_u020","semester":"upper"},{"chapter":"上册 第四章 一元一次方程","name":"方程的概念","formula":"含有未知数的等式叫做方程","explanation":"【定义】\n含有未知数的等式叫做方程。\n\n【方程的两个要素】\n1. 必须是等式（含有等号\"=\"）\n2. 必须含有未知数（通常用x, y, z等字母表示）\n\n【方程的解】\n使方程左右两边相等的未知数的值，叫做方程的解。\n\n【解方程】\n求方程的解的过程叫做解方程。\n\n【一元一次方程】\n只含有一个未知数（元），未知数的次数都是1，等号两边都是整式，这样的方程叫做一元一次方程。","id":"g1_math_u021","semester":"upper"},{"chapter":"上册 第四章 一元一次方程","name":"一元一次方程","formula":"ax + b = 0 (a≠0)","explanation":"【定义】\n只含有一个未知数（元），未知数的次数都是1，等号两边都是整式，这样的方程叫做一元一次方程。\n\n【一般形式】\nax + b = 0  (a ≠ 0)\n\n【判断要点】\n1. 只含有一个未知数\n2. 未知数的次数都是1\n3. 是整式方程（分母不含未知数）\n4. 化简后未知数的系数不为0\n\n【举例】\n- 2x + 3 = 7 是一元一次方程\n- x² = 4 不是（次数是2）\n- 1/x = 2 不是（分母含未知数）","id":"g1_math_u022","semester":"upper"},{"chapter":"上册 第四章 一元一次方程","name":"等式的性质","formula":"等式两边同时加、减、乘、除（不为0），结果仍相等","explanation":"【等式的性质1】\n等式两边加（或减）同一个数（或式子），结果仍相等。\n即：如果 a = b，那么 a ± c = b ± c\n\n【等式的性质2】\n等式两边乘同一个数，或除以同一个不为0的数，结果仍相等。\n即：如果 a = b，那么 ac = bc\n如果 a = b (c ≠ 0)，那么 a/c = b/c\n\n【注意】\n1. 等式两边同时除以的数不能为0\n2. 等式两边不能同时乘0（虽然结果仍为0，但失去意义）","id":"g1_math_u023","semester":"upper"},{"chapter":"上册 第四章 一元一次方程","name":"解一元一次方程","formula":"移项 → 合并 → 系数化为1","explanation":"【一般步骤】\n1. 去分母：在方程两边都乘各分母的最小公倍数\n2. 去括号：先去小括号，再去中括号，最后去大括号\n3. 移项：把含有未知数的项移到方程一边，其他项移到另一边\n4. 合并同类项：把方程化成 ax = b (a ≠ 0) 的形式\n5. 系数化为1：在方程两边都除以未知数的系数a，得到解 x = b/a\n\n【注意】\n1. 移项要变号\n2. 去分母时不要漏乘不含分母的项\n3. 去括号时注意符号","id":"g1_math_u024","semester":"upper"},{"chapter":"上册 第四章 一元一次方程","name":"一元一次方程的实际应用","formula":"审题 → 设元 → 列方程 → 解方程 → 检验 → 作答","explanation":"【一般步骤】\n1. 审：审题，分析题意，找出等量关系\n2. 设：设未知数（直接设或间接设）\n3. 列：根据等量关系列出方程\n4. 解：解方程，求出未知数的值\n5. 验：检验解是否符合实际意义\n6. 答：写出答案\n\n【常见类型】\n1. 行程问题：路程 = 速度 × 时间\n2. 工程问题：工作量 = 工作效率 × 工作时间\n3. 利润问题：利润 = 售价 - 成本\n4. 配套问题、分配问题等","id":"g1_math_u025","semester":"upper"},{"chapter":"上册 第五章 几何图形初步","name":"立体图形与平面图形","formula":"点动成线，线动成面，面动成体","explanation":"【几何图形】\n从实物中抽象出的各种图形统称为几何图形。\n\n【分类】\n1. 立体图形：各部分不都在同一平面内\n   - 柱体：圆柱、棱柱\n   - 锥体：圆锥、棱锥\n   - 球体\n\n2. 平面图形：各部分都在同一平面内\n   - 三角形、四边形、圆等\n\n【联系】\n1. 立体图形的展开图是平面图形\n2. 从不同方向看立体图形，得到平面图形（三视图）\n3. 点动成线，线动成面，面动成体","id":"g1_math_u026","semester":"upper"},{"chapter":"上册 第五章 几何图形初步","name":"直线、射线、线段","formula":"两点确定一条直线","explanation":"【直线】\n- 表示方法：直线AB或直线l\n- 特征：没有端点，向两方无限延伸，不可度量\n- 性质：两点确定一条直线\n\n【射线】\n- 表示方法：射线OA（O是端点）\n- 特征：有一个端点，向一方无限延伸，不可度量\n\n【线段】\n- 表示方法：线段AB或线段a\n- 特征：有两个端点，可以度量\n- 性质：两点之间，线段最短\n\n【两点的距离】\n连接两点间的线段的长度，叫做这两点的距离。","id":"g1_math_u027","semester":"upper"},{"chapter":"上册 第五章 几何图形初步","name":"线段的中点","formula":"点M是AB中点 ⇔ AM = MB = ½AB","explanation":"【定义】\n把一条线段分成两条相等的线段的点，叫做这条线段的中点。\n\n【几何语言】\n∵ 点M是线段AB的中点\n∴ AM = MB = ½AB\n（或 AB = 2AM = 2MB）\n\n【线段的等分点】\n- 二等分点（中点）：2段\n- 三等分点：3段\n- 四等分点：4段\n- ...\n\n【画法】\n1. 度量法\n2. 尺规作图法","id":"g1_math_u028","semester":"upper"},{"chapter":"上册 第五章 几何图形初步","name":"角的概念","formula":"有公共端点的两条射线组成的图形叫做角","explanation":"【定义】\n有公共端点的两条射线组成的图形叫做角。这个公共端点是角的顶点，这两条射线是角的两条边。\n\n【另一种定义】\n角也可以看作由一条射线绕着它的端点旋转而形成的图形。\n\n【表示方法】\n1. 用三个大写字母表示：∠AOB（顶点在中间）\n2. 用一个大写字母表示：∠O（顶点处只有一个角时）\n3. 用数字表示：∠1\n4. 用希腊字母表示：∠α\n\n【分类】\n锐角（0°<α<90°）、直角（90°）、钝角（90°<α<180°）、平角（180°）、周角（360°）","id":"g1_math_u029","semester":"upper"},{"chapter":"上册 第五章 几何图形初步","name":"角的度量与比较","formula":"1° = 60′，1′ = 60″","explanation":"【角度制】\n1周角 = 360°，1平角 = 180°\n1° = 60′（分），1′ = 60″（秒）\n\n【角的比较方法】\n1. 度量法：用量角器量出度数，再比较\n2. 叠合法：把两个角叠合在一起比较\n\n【角的运算】\n1. 加减法：度、分、秒分别相加减，满60进1，不够减借1当60\n2. 乘除法：分别乘除，满60进1\n\n【角平分线】\n从一个角的顶点出发，把这个角分成相等的两个角的射线，叫做这个角的平分线。","id":"g1_math_u030","semester":"upper"},{"chapter":"下册 第五章 相交线与平行线","name":"相交线","formula":"对顶角相等","explanation":"【相交线】\n两条直线相交，形成四个角。\n\n【对顶角】\n两个角有公共顶点，且一个角的两边分别是另一个角两边的反向延长线，这样的两个角叫做对顶角。\n性质：对顶角相等。\n\n【邻补角】\n两个角有公共顶点和一条公共边，另一边互为反向延长线。\n性质：邻补角互补（和为180°）。\n\n【注意】\n对顶角一定相等，但相等的角不一定是对顶角。","id":"g1_math_l001","semester":"lower"},{"chapter":"下册 第五章 相交线与平行线","name":"垂线","formula":"过一点有且只有一条直线与已知直线垂直","explanation":"【定义】\n当两条直线相交所成的四个角中，有一个角是直角时，这两条直线互相垂直。其中一条直线叫做另一条直线的垂线，它们的交点叫做垂足。\n\n【表示方法】\nAB ⊥ CD，读作\"AB垂直于CD\"\n\n【性质1】\n在同一平面内，过一点有且只有一条直线与已知直线垂直。\n\n【性质2】\n连接直线外一点与直线上各点的所有线段中，垂线段最短。\n简称：垂线段最短。\n\n【点到直线的距离】\n直线外一点到这条直线的垂线段的长度，叫做点到直线的距离。","id":"g1_math_l002","semester":"lower"},{"chapter":"下册 第五章 相交线与平行线","name":"同位角、内错角、同旁内角","formula":"三线八角","explanation":"【定义】\n两条直线被第三条直线所截，形成八个角，简称\"三线八角\"。\n\n【同位角】\n在截线的同旁，被截两直线的同一侧。\n形状像\"F\"型。\n\n【内错角】\n在截线的两旁，被截两直线之间。\n形状像\"Z\"型。\n\n【同旁内角】\n在截线的同旁，被截两直线之间。\n形状像\"U\"型。\n\n【注意】\n这三类角都是位置关系的角，不一定相等或互补，只有在两直线平行时才有特殊关系。","id":"g1_math_l003","semester":"lower"},{"chapter":"下册 第五章 相交线与平行线","name":"平行线的判定","formula":"同位角相等，两直线平行","explanation":"【平行线定义】\n在同一平面内，不相交的两条直线叫做平行线。\n\n【平行公理】\n经过直线外一点，有且只有一条直线与这条直线平行。\n\n【推论】\n如果两条直线都与第三条直线平行，那么这两条直线也互相平行。\n即：若 a∥c，b∥c，则 a∥b\n\n【判定方法】\n1. 同位角相等，两直线平行\n2. 内错角相等，两直线平行\n3. 同旁内角互补，两直线平行\n4. 平行于同一条直线的两条直线平行\n5. 垂直于同一条直线的两条直线平行","id":"g1_math_l004","semester":"lower"},{"chapter":"下册 第五章 相交线与平行线","name":"平行线的性质","formula":"两直线平行，同位角相等","explanation":"【平行线的性质】\n1. 两直线平行，同位角相等\n2. 两直线平行，内错角相等\n3. 两直线平行，同旁内角互补\n\n【注意区分判定和性质】\n- 判定：由角的关系 → 两直线平行（证平行）\n- 性质：由两直线平行 → 角的关系（用平行）\n\n【两条平行线的距离】\n同时垂直于两条平行线，并且夹在这两条平行线间的线段的长度，叫做这两条平行线的距离。\n\n【平移】\n平移不改变图形的形状和大小，平移前后对应线段平行（或在同一直线上）且相等。","id":"g1_math_l005","semester":"lower"},{"chapter":"下册 第五章 相交线与平行线","name":"平移","formula":"平移前后，图形的形状和大小完全相同","explanation":"【定义】\n把一个图形整体沿某一直线方向移动，会得到一个新的图形，图形的这种移动叫做平移。\n\n【性质】\n1. 平移前后，图形的形状和大小完全相同\n2. 平移前后，对应点所连的线段平行（或在同一直线上）且相等\n3. 平移前后，对应线段平行（或在同一直线上）且相等\n4. 平移前后，对应角相等\n\n【平移的两个要素】\n1. 平移方向\n2. 平移距离\n\n【画法】\n1. 找关键点\n2. 平移各关键点\n3. 按原顺序连接各对应点","id":"g1_math_l006","semester":"lower"},{"chapter":"下册 第六章 实数","name":"平方根","formula":"若x²=a，则x是a的平方根","explanation":"【定义】\n如果一个数的平方等于a，那么这个数叫做a的平方根或二次方根。\n即：如果 x² = a，那么 x 叫做 a 的平方根。\n\n【表示方法】\n正数a的平方根表示为 ±√a，读作\"正负根号a\"。\n\n【性质】\n1. 正数有两个平方根，它们互为相反数\n2. 0的平方根是0\n3. 负数没有平方根\n\n【算术平方根】\n正数a的正的平方根叫做a的算术平方根，记作√a。\n0的算术平方根是0。\n\n【开平方】\n求一个数a的平方根的运算，叫做开平方。","id":"g1_math_l007","semester":"lower"},{"chapter":"下册 第六章 实数","name":"立方根","formula":"若x³=a，则x是a的立方根","explanation":"【定义】\n如果一个数的立方等于a，那么这个数叫做a的立方根或三次方根。\n即：如果 x³ = a，那么 x 叫做 a 的立方根。\n\n【表示方法】\n表示为 ∛a，读作\"三次根号a\"。\n\n【性质】\n1. 正数的立方根是正数\n2. 负数的立方根是负数\n3. 0的立方根是0\n4. 任何数都有唯一的立方根\n\n【开立方】\n求一个数的立方根的运算，叫做开立方。\n\n【对比平方根】\n- 平方根：正数有两个，负数没有\n- 立方根：任何数都有一个","id":"g1_math_l008","semester":"lower"},{"chapter":"下册 第六章 实数","name":"实数","formula":"有理数和无理数统称为实数","explanation":"【定义】\n有理数和无理数统称为实数。\n\n【分类】\n实数\n├── 有理数：有限小数或无限循环小数\n│   ├── 整数\n│   └── 分数\n└── 无理数：无限不循环小数\n    - 含π的数\n    - 开方开不尽的数\n    - 有规律但不循环的小数\n\n【实数与数轴】\n实数与数轴上的点一一对应。\n\n【实数的性质】\n1. 实数a的相反数是 -a\n2. 实数a的绝对值：\n   |a| = a (a≥0)，|a| = -a (a<0)\n3. 实数的运算律与有理数相同","id":"g1_math_l009","semester":"lower"},{"chapter":"下册 第七章 平面直角坐标系","name":"平面直角坐标系","formula":"横轴x轴，纵轴y轴，交点为原点","explanation":"【定义】\n在平面内画两条互相垂直、原点重合的数轴，组成平面直角坐标系。\n\n【相关概念】\n- 横轴（x轴）：水平的数轴，向右为正方向\n- 纵轴（y轴）：竖直的数轴，向上为正方向\n- 原点：两轴的交点\n- 坐标平面：坐标系所在的平面\n- 象限：x轴和y轴把平面分成四个部分\n  - 第一象限（+，+）\n  - 第二象限（-，+）\n  - 第三象限（-，-）\n  - 第四象限（+，-）\n\n【点的坐标】\n用有序数对 (x, y) 表示点的位置。\n注意：x轴和y轴上的点不属于任何象限。","id":"g1_math_l010","semester":"lower"},{"chapter":"下册 第七章 平面直角坐标系","name":"点的坐标","formula":"P(x, y)，横坐标x，纵坐标y","explanation":"【点的坐标】\n在平面直角坐标系中，点P对应一个有序数对 (x, y)，x叫做点P的横坐标，y叫做点P的纵坐标。\n\n【特殊点的坐标特征】\n1. 原点：(0, 0)\n2. x轴上的点：纵坐标为0，即 (x, 0)\n3. y轴上的点：横坐标为0，即 (0, y)\n4. 第一象限：x > 0, y > 0\n5. 第二象限：x < 0, y > 0\n6. 第三象限：x < 0, y < 0\n7. 第四象限：x > 0, y < 0\n\n【对称点的坐标】\n- 关于x轴对称：(x, y) → (x, -y)\n- 关于y轴对称：(x, y) → (-x, y)\n- 关于原点对称：(x, y) → (-x, -y)","id":"g1_math_l011","semester":"lower"},{"chapter":"下册 第七章 平面直角坐标系","name":"坐标方法的简单应用","formula":"用坐标表示位置和平移","explanation":"【用坐标表示地理位置】\n步骤：\n1. 建立坐标系，选择适当的参照点为原点，确定x轴、y轴的正方向\n2. 根据具体问题确定单位长度\n3. 在坐标平面内画出这些点，写出各点的坐标和各个地点的名称\n\n【用坐标表示平移】\n1. 左右平移：\n   - 向右平移a个单位：(x, y) → (x + a, y)\n   - 向左平移a个单位：(x, y) → (x - a, y)\n\n2. 上下平移：\n   - 向上平移b个单位：(x, y) → (x, y + b)\n   - 向下平移b个单位：(x, y) → (x, y - b)\n\n【记忆口诀】\n右加左减x坐标，上加下减y坐标。","id":"g1_math_l012","semester":"lower"},{"chapter":"下册 第八章 二元一次方程组","name":"二元一次方程组","formula":"含有两个未知数，每个未知数次数都是1","explanation":"【二元一次方程定义】\n含有两个未知数，并且含有未知数的项的次数都是1的整式方程，叫做二元一次方程。\n\n【二元一次方程组定义】\n把具有相同未知数的两个二元一次方程合在一起，就组成了一个二元一次方程组。\n\n【二元一次方程的解】\n使二元一次方程两边相等的两个未知数的值，叫做二元一次方程的解。\n注意：二元一次方程有无数个解。\n\n【二元一次方程组的解】\n二元一次方程组的两个方程的公共解，叫做二元一次方程组的解。\n\n【一般形式】\n{a₁x + b₁y = c₁\n{a₂x + b₂y = c₂","id":"g1_math_l013","semester":"lower"},{"chapter":"下册 第八章 二元一次方程组","name":"代入消元法","formula":"用一个未知数表示另一个，代入另一个方程","explanation":"【定义】\n把二元一次方程组中一个方程的一个未知数用含另一个未知数的式子表示出来，再代入另一个方程，实现消元，进而求得这个二元一次方程组的解。这种方法叫做代入消元法，简称代入法。\n\n【步骤】\n1. 从方程组中选一个系数比较简单的方程，将这个方程中的一个未知数用含另一个未知数的式子表示出来\n2. 将变形后的关系式代入另一个方程，消去一个未知数，得到一个一元一次方程\n3. 解这个一元一次方程，求得一个未知数的值\n4. 将求得的未知数的值代入变形后的关系式，求出另一个未知数的值\n5. 写出方程组的解","id":"g1_math_l014","semester":"lower"},{"chapter":"下册 第八章 二元一次方程组","name":"加减消元法","formula":"使未知数系数相等或相反，相加或减消元","explanation":"【定义】\n两个二元一次方程中同一未知数的系数相反或相等时，把这两个方程的两边分别相加或相减，就能消去这个未知数，得到一个一元一次方程。这种方法叫做加减消元法，简称加减法。\n\n【步骤】\n1. 方程组的两个方程中，如果同一未知数的系数既不相等也不互为相反数，就要用适当的数去乘方程的两边，使同一个未知数的系数相等或互为相反数\n2. 把两个方程的两边分别相加或相减，消去一个未知数，得到一个一元一次方程\n3. 解这个一元一次方程\n4. 将求出的未知数的值代入原方程组中的任意一个方程，求出另一个未知数的值\n5. 写出方程组的解","id":"g1_math_l015","semester":"lower"},{"chapter":"下册 第八章 二元一次方程组","name":"二元一次方程组的实际应用","formula":"审题 → 设元 → 列方程组 → 解方程组 → 检验 → 作答","explanation":"【一般步骤】\n1. 审：审题，分析题意，找出等量关系\n2. 设：设两个未知数（直接设或间接设）\n3. 列：根据等量关系列出方程组（两个方程）\n4. 解：解方程组，求出未知数的值\n5. 验：检验解是否符合实际意义\n6. 答：写出答案\n\n【常见类型】\n1. 行程问题：相遇、追及\n2. 工程问题：合作、分工\n3. 利润问题：进价、售价、利润\n4. 配套问题：数量比例\n5. 数字问题：数位关系\n\n【关键】\n找到两个等量关系，列出两个方程。","id":"g1_math_l016","semester":"lower"},{"chapter":"下册 第九章 不等式与不等式组","name":"不等式及其解集","formula":"用不等号表示大小关系的式子","explanation":"【不等式定义】\n用不等号（>、<、≥、≤、≠）表示大小关系的式子，叫做不等式。\n\n【不等式的解】\n使不等式成立的未知数的值叫做不等式的解。\n\n【解集】\n一个含有未知数的不等式的所有解，组成这个不等式的解集。\n\n【解不等式】\n求不等式的解集的过程叫做解不等式。\n\n【解集在数轴上的表示】\n- x > a：空心圆圈，向右画\n- x < a：空心圆圈，向左画\n- x ≥ a：实心圆点，向右画\n- x ≤ a：实心圆点，向左画\n\n【一元一次不等式】\n含有一个未知数，未知数的次数是1的不等式，叫做一元一次不等式。","id":"g1_math_l017","semester":"lower"},{"chapter":"下册 第九章 不等式与不等式组","name":"不等式的性质","formula":"两边加/减，方向不变；乘除正数，方向不变；乘除负数，方向改变","explanation":"【不等式的性质1】\n不等式两边加（或减）同一个数（或式子），不等号的方向不变。\n即：如果 a > b，那么 a ± c > b ± c\n\n【不等式的性质2】\n不等式两边乘（或除以）同一个正数，不等号的方向不变。\n即：如果 a > b，c > 0，那么 ac > bc（或 a/c > b/c）\n\n【不等式的性质3】\n不等式两边乘（或除以）同一个负数，不等号的方向改变。\n即：如果 a > b，c < 0，那么 ac < bc（或 a/c < b/c）\n\n【注意】\n1. 性质3是重点也是难点，乘除负数时不等号要变向\n2. 不能两边同时乘0","id":"g1_math_l018","semester":"lower"},{"chapter":"下册 第九章 不等式与不等式组","name":"一元一次不等式的解法","formula":"去分母 → 去括号 → 移项 → 合并 → 系数化为1","explanation":"【一般步骤】\n1. 去分母：在不等式两边都乘各分母的最小公倍数（注意乘负数要变号）\n2. 去括号：先去小括号，再去中括号，最后去大括号\n3. 移项：把含有未知数的项移到不等式一边，其他项移到另一边\n4. 合并同类项：把不等式化成 ax > b 或 ax < b 的形式\n5. 系数化为1：在不等式两边都除以未知数的系数\n   - 系数为正：不等号方向不变\n   - 系数为负：不等号方向要改变\n\n【注意】\n1. 去分母时不要漏乘不含分母的项\n2. 系数化为1时，注意不等号方向是否改变","id":"g1_math_l019","semester":"lower"},{"chapter":"下册 第九章 不等式与不等式组","name":"一元一次不等式组","formula":"几个一元一次不等式合在一起","explanation":"【定义】\n把两个一元一次不等式合起来，就组成一个一元一次不等式组。\n\n【不等式组的解集】\n几个不等式的解集的公共部分，叫做由它们所组成的不等式组的解集。\n\n【解不等式组】\n求不等式组的解集的过程叫做解不等式组。\n\n【解集口诀】\n1. 同大取大：x > a, x > b (a > b) → x > a\n2. 同小取小：x < a, x < b (a < b) → x < a\n3. 大小小大中间找：x < a, x > b (a > b) → b < x < a\n4. 大大小小找不到：x > a, x < b (a > b) → 无解\n\n【步骤】\n1. 分别解各不等式\n2. 在数轴上表示各解集\n3. 找公共部分，写出不等式组的解集","id":"g1_math_l020","semester":"lower"},{"chapter":"下册 第十章 数据的收集、整理与描述","name":"统计调查","formula":"全面调查和抽样调查","explanation":"【统计调查的方式】\n1. 全面调查（普查）：考察全体对象的调查\n2. 抽样调查：只抽取一部分对象进行调查，然后根据调查数据推断全体对象的情况\n\n【相关概念】\n- 总体：要考察的全体对象\n- 个体：组成总体的每一个考察对象\n- 样本：被抽取的所有个体组成一个样本\n- 样本容量：样本中个体的数目\n\n【简单随机抽样】\n总体中的每一个个体都有相等的机会被抽到，像这样的抽样方法是一种简单随机抽样。\n\n【抽样调查的要求】\n1. 样本容量要适当\n2. 样本要具有代表性和广泛性\n\n【收集数据的方法】\n问卷调查、实地调查、查阅资料等","id":"g1_math_l021","semester":"lower"},{"chapter":"下册 第十章 数据的收集、整理与描述","name":"直方图","formula":"频数分布表 → 频数分布直方图","explanation":"【相关概念】\n1. 频数：落在各个小组内的数据的个数\n2. 频率：频数与数据总数的比\n\n【画直方图的步骤】\n1. 计算最大值与最小值的差（极差）\n2. 决定组距和组数\n   - 组距：每个小组的两个端点之间的距离\n   - 组数 = 极差 / 组距，结果取整加1\n3. 列频数分布表\n4. 画频数分布直方图\n\n【直方图与条形图的区别】\n- 条形图：各长方形之间有空隙，用横轴表示类别\n- 直方图：各长方形之间没有空隙，用横轴表示连续数据的分组\n\n【应用】\n直方图可以直观地看出数据的分布情况。","id":"g1_math_l022","semester":"lower"},{"chapter":"下册 第十章 数据的收集、整理与描述","name":"折线图与条形图","formula":"折线图表示变化趋势，条形图比较数量多少","explanation":"【条形图】\n- 特点：用条形的长短表示数量的多少\n- 作用：清楚地看出每个项目的具体数目，便于比较\n\n【折线图】\n- 特点：用折线的上升或下降表示统计数量的增减变化\n- 作用：清楚地反映事物的变化情况和趋势\n\n【扇形图】\n- 特点：用扇形的面积表示各部分占总体的百分比\n- 作用：清楚地表示出各部分在总体中所占的百分比\n\n【统计图的选择】\n1. 要清楚地表示每个项目的具体数目 → 条形图\n2. 要清楚地反映事物的变化情况 → 折线图\n3. 要清楚地表示出各部分在总体中所占的百分比 → 扇形图","id":"g1_math_l023","semester":"lower"},{"chapter":"下册 第九章 不等式与不等式组","name":"一元一次不等式的实际应用","formula":"设未知数 → 列不等式 → 解不等式 → 检验 → 作答","explanation":"【一般步骤】\n1. 审：审题，分析题意，找出不等关系\n2. 设：设未知数\n3. 列：根据不等关系列出一元一次不等式\n4. 解：解不等式，求出解集\n5. 验：检验解是否符合实际意义\n6. 答：写出答案\n\n【常见不等关系关键词】\n- 至少：≥\n- 至多：≤\n- 不少于：≥\n- 不超过：≤\n- 大于：>\n- 小于：<\n\n【常见类型】\n1. 方案选择问题\n2. 利润问题\n3. 行程问题\n4. 分配问题","id":"g1_math_l024","semester":"lower"},{"chapter":"下册 第九章 不等式与不等式组","name":"不等式组的应用","formula":"找出两个不等关系，列不等式组","explanation":"【一般步骤】\n1. 审：审题，分析题意，找出两个不等关系\n2. 设：设一个未知数\n3. 列：根据两个不等关系列出一元一次不等式组\n4. 解：解不等式组，求出解集\n5. 验：检验解是否符合实际意义\n6. 答：写出答案（包括整数解等特殊解）\n\n【常见题型】\n1. 分配问题（把东西分给几个人）\n2. 方案设计问题（几种方案，选择最优）\n3. 利润最大化问题\n4. 取值范围问题\n\n【注意】\n实际问题中经常要求整数解、正整数解等。","id":"g1_math_l025","semester":"lower"},{"chapter":"下册 第八章 二元一次方程组","name":"三元一次方程组","formula":"三元 → 二元 → 一元","explanation":"【定义】\n含有三个相同的未知数，每个方程中含未知数的项的次数都是1，并且一共有三个方程，像这样的方程组叫做三元一次方程组。\n\n【解法思路】\n三元一次方程组 → 消元 → 二元一次方程组 → 消元 → 一元一次方程\n\n【一般步骤】\n1. 利用代入法或加减法，消去一个未知数，得到一个二元一次方程组\n2. 解这个二元一次方程组，求得两个未知数的值\n3. 将这两个未知数的值代入原方程组中较简单的一个方程，求出第三个未知数的值\n4. 写出方程组的解\n\n【注意】\n选消哪个元要看系数特点，选系数简单的消元。","id":"g1_math_l026","semester":"lower"},{"chapter":"下册 第七章 平面直角坐标系","name":"特殊点的坐标规律","formula":"x轴上y=0，y轴上x=0","explanation":"【坐标轴上的点】\n1. x轴上的点：纵坐标为0，即 (x, 0)\n2. y轴上的点：横坐标为0，即 (0, y)\n3. 原点：(0, 0)\n\n【象限角平分线上的点】\n1. 第一、三象限角平分线上的点：横、纵坐标相等，即 (a, a)\n2. 第二、四象限角平分线上的点：横、纵坐标互为相反数，即 (a, -a)\n\n【平行于坐标轴的直线上的点】\n1. 平行于x轴的直线：纵坐标相同\n2. 平行于y轴的直线：横坐标相同\n\n【距离】\n1. 点P(x, y)到x轴的距离 = |y|\n2. 点P(x, y)到y轴的距离 = |x|","id":"g1_math_l027","semester":"lower"},{"chapter":"下册 第六章 实数","name":"实数的运算","formula":"运算律与有理数相同","explanation":"【实数的运算】\n实数运算的顺序和有理数的运算顺序一样：\n1. 先乘方、开方，再乘除，最后加减\n2. 同级运算从左到右进行\n3. 有括号先算括号内的\n\n【运算律】\n1. 加法交换律：a + b = b + a\n2. 加法结合律：(a + b) + c = a + (b + c)\n3. 乘法交换律：ab = ba\n4. 乘法结合律：(ab)c = a(bc)\n5. 分配律：a(b + c) = ab + ac\n\n【注意】\n1. 无理数也可以进行加、减、乘、除、乘方、开方运算\n2. 结果要化为最简形式\n3. 涉及无理数的近似计算，可以取近似值转化为有理数计算","id":"g1_math_l028","semester":"lower"},{"chapter":"下册 第五章 相交线与平行线","name":"命题、定理、证明","formula":"命题由题设和结论两部分组成","explanation":"【命题】\n判断一件事情的语句，叫做命题。\n\n【命题的组成】\n命题由题设和结论两部分组成。题设是已知事项，结论是由已知事项推出的事项。\n常写成\"如果...那么...\"的形式。\n\n【真命题与假命题】\n- 真命题：正确的命题\n- 假命题：错误的命题\n\n【定理】\n经过推理证实的真命题叫做定理。定理可以作为继续推理的依据。\n\n【证明】\n在很多情况下，一个命题的正确性需要经过推理才能作出判断，这个推理过程叫做证明。\n\n【注意】\n判断一个命题是假命题，只要举出一个反例就可以了。","id":"g1_math_l029","semester":"lower"},{"chapter":"下册 第十章 数据的收集、整理与描述","name":"扇形图","formula":"扇形圆心角 = 百分比 × 360°","explanation":"【扇形图】\n用整个圆表示总数，用圆内各个扇形的大小表示各部分数量占总数的百分比，这样的统计图叫做扇形图。\n\n【特点】\n1. 用扇形的面积表示各部分占总体的百分比\n2. 各个扇形的圆心角之和等于360°\n3. 可以清楚地表示出各部分在总体中所占的百分比\n\n【绘制步骤】\n1. 计算各部分占总体的百分比\n2. 计算各部分扇形的圆心角度数\n   圆心角度数 = 百分比 × 360°\n3. 在圆中画出各个扇形\n4. 标注各部分名称和百分比\n\n【应用】\n当要了解各部分占总体的比例时，选择扇形图。","id":"g1_math_l030","semester":"lower"}];

                return JSON.parse(localStorage.getItem(key) || '[]');
            },
            addWrongBook(item) {
                const key = this.STORAGE_KEY_PREFIX + item.grade + '_' + item.subject;
                let wrongBook = this.getWrongBook(item.grade, item.subject);
                const exists = wrongBook.some(w => w.question === item.question);

        // 学习进度管理器
        const ProgressManager = {
            STORAGE_KEY: 'study_progress',
            
            getProgress() {
                try {
                    return JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
                } catch(e) {
                    return {};
                }
            },
            
            saveProgress(progress) {
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(progress));
            },
            
            recordStudy(grade, subject, subjectName, semester, semesterName, knowledgeId, knowledgeName) {
                const progress = this.getProgress();
                const now = new Date().toISOString();
                const today = new Date().toISOString().split('T')[0];
                
                if (!progress.learnedKnowledge) progress.learnedKnowledge = {};
                if (!progress.dailyStats) progress.dailyStats = {};
                if (!progress.dailyStats[today]) {
                    progress.dailyStats[today] = { learnedCount: 0, subjects: [] };
                }
                
                const isNew = !progress.learnedKnowledge[knowledgeId];
                progress.learnedKnowledge[knowledgeId] = { learnedAt: now };
                
                if (isNew) {
                    progress.dailyStats[today].learnedCount++;
                    if (!progress.dailyStats[today].subjects.includes(subject)) {
                        progress.dailyStats[today].subjects.push(subject);
                    }
                }
                
                progress.lastStudy = {
                    grade, subject, subjectName, semester, semesterName,
                    knowledgeId, knowledgeName, timestamp: now
                };
                
                this.saveProgress(progress);
            },
            
            isLearned(knowledgeId) {
                const progress = this.getProgress();
                return !!(progress.learnedKnowledge && progress.learnedKnowledge[knowledgeId]);
            },
            
            getLastStudy() {
                const progress = this.getProgress();
                return progress.lastStudy || null;
            },
            
            getSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                if (!progress.learnedKnowledge) return { learned: 0, total: 0, percent: 0 };
                const prefix = grade + '_' + subject + '_';
                const learned = Object.keys(progress.learnedKnowledge).filter(k => k.startsWith(prefix)).length;
                const total = DATA_KNOWLEDGE.length;

                return { learned, total, percent };

            clearSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                const prefix = grade + '_' + subject + '_';
                
                if (progress.learnedKnowledge) {
                    Object.keys(progress.learnedKnowledge).forEach(k => {
                        if (k.startsWith(prefix)) {
                            delete progress.learnedKnowledge[k];
                        }
                    });

                if (progress.lastStudy && progress.lastStudy.grade === grade && progress.lastStudy.subject === subject) {
                    delete progress.lastStudy;
                }
                
                this.saveProgress(progress);

        const searchResultsInfo = document.getElementById('search-results-info');
        const searchCountEl = document.getElementById('search-count');
        const searchInput = document.getElementById('search-input');

        function initPage() {
            const {grade, subject, semester} = currentParams;
            pageTitle.textContent = gradeNames[grade] + ' · ' + subjectNames[subject] + ' · ' + semesterNames[semester];
            loadKnowledge();
            updateProgressStat();
            
            const hash = window.location.hash.replace('#', '');
            if (hash && knowledgeList.some(k => k.id === hash)) {
                setTimeout(() => {
                    toggleExpand(hash);
                    const card = document.querySelector('[data-id="' + hash + '"]');
                    if (card) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
        }

        function updateProgressStat() {
            const {grade, subject} = currentParams;
            const learnedInSemester = knowledgeList.filter(k => ProgressManager.isLearned(k.id)).length;
            document.getElementById('progress-learned').textContent = learnedInSemester;
            document.getElementById('progress-total').textContent = knowledgeList.length;
        }

        function loadKnowledge() {
            const {grade, subject, semester} = currentParams;
            knowledgeList = DATA_KNOWLEDGE.filter(k => {
                return k.semester === semester;
            });
            renderKnowledgeList();
        }

        function renderKnowledgeList(items = knowledgeList) {
            if (items.length === 0) {
                knowledgeListEl.innerHTML = '';
                emptyStateEl.classList.remove('hidden');
                return;
            }
            emptyStateEl.classList.add('hidden');
            knowledgeListEl.innerHTML = items.map(item => {
                const isExpanded = expandedIds.has(item.id);
                const isLearned = ProgressManager.isLearned(item.id);
                return '<div class="card knowledge-card ' + (isLearned ? 'learned' : '') + '" data-id="' + item.id + '">' +
                    '<div class="knowledge-header p-4 flex items-center justify-between" onclick="toggleExpand(\'' + item.id + '\')">' +
                        '<div class="flex items-center gap-3 flex-1 min-w-0">' +
                            '<div class="expand-icon ' + (isExpanded ? 'expanded' : 'collapsed') + '">' + (isExpanded ? '−' : '+') + '</div>' +
                            '<div class="flex-1 min-w-0">' +
                                '<h3 class="text-lg font-semibold text-gray-800 flex items-center gap-2">' + escapeHtml(item.name) + (isLearned ? '<span class="text-green-500 text-sm">✓ 已学习</span>' : '') + '</h3>' +
                                '<p class="text-xs text-gray-500 mt-1">' + escapeHtml(item.chapter) + '</p>' +
                            '</div>' +
                        '</div>' +
                        (HAS_EXAMPLES ? '<button class="btn btn-secondary text-sm px-3 py-1" onclick="event.stopPropagation(); showExample(\'' + item.id + '\', \'' + escapeHtml(item.name) + '\')">例题</button>' : '') +
                    '</div>' +
                    '<div id="content-' + item.id + '" class="px-6 pb-4 ' + (isExpanded ? '' : 'hidden') + '">' +
                        (item.formula ? '<div class="mb-4"><h4 class="text-sm font-medium text-gray-500 mb-2">📐 公式</h4><p class="formula-box text-gray-800 text-lg bg-gray-50 p-3 rounded-lg">' + escapeHtml(item.formula) + '</p></div>' : '') +
                        (item.explanation ? '<div><h4 class="text-sm font-medium text-gray-500 mb-2">📝 解释</h4><p class="text-gray-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(item.explanation) + '</p></div>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function toggleExpand(id) {
            const isNewLearn = !expandedIds.has(id) && !ProgressManager.isLearned(id);
            if (expandedIds.has(id)) {
                expandedIds.delete(id);
            } else {
                expandedIds.add(id);
                const {grade, subject, semester} = currentParams;
                const item = knowledgeList.find(k => k.id === id);
                if (item) {
                    ProgressManager.recordStudy(
                        grade, subject, subjectNames[subject],
                        semester, semesterNames[semester],
                        id, item.name
                    );
                }
            }
            const card = document.querySelector('[data-id="' + id + '"]');
            const content = document.getElementById('content-' + id);
            const icon = card.querySelector('.expand-icon');
            const header = card.querySelector('.knowledge-header');
            const title = card.querySelector('h3');
            if (expandedIds.has(id)) {
                content.classList.remove('hidden');
                icon.classList.remove('collapsed');
                icon.classList.add('expanded');
                icon.textContent = '−';
                header.classList.add('expanded');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('expanded');
                icon.classList.add('collapsed');
                icon.textContent = '+';
                header.classList.remove('expanded');
            }
            if (isNewLearn) {
                card.classList.add('learned');
                if (!title.querySelector('.text-green-500')) {
                    title.innerHTML += '<span class="text-green-500 text-sm">✓ 已学习</span>';
                }
                updateProgressStat();
            }
        }

        function expandAll() {
            knowledgeList.forEach(item => expandedIds.add(item.id));
            renderKnowledgeList();
        }

        function collapseAll() {
            expandedIds.clear();
            renderKnowledgeList();
        }

        function searchKnowledge(keyword, list) {
            if (!keyword) return [];
            const lower = keyword.toLowerCase();
            return list.filter(k =>
                k.name.toLowerCase().includes(lower) ||
                k.chapter.toLowerCase().includes(lower)
            );
        }

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                searchResultsInfo.classList.add('hidden');
                renderKnowledgeList();
                return;
            }
            const results = searchKnowledge(keyword, knowledgeList);
            searchCountEl.textContent = results.length;
            searchResultsInfo.classList.remove('hidden');
            renderKnowledgeList(results);
        }

        function showExample(knowledgeId, knowledgeName) {
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === knowledgeId);
            if (examples.length === 0) {
                alert('暂无例题');
                return;
            }
            const example = examples[Math.floor(Math.random() * examples.length)];
            currentExample = {...example, knowledgeId, knowledgeName, ...currentParams};
            document.getElementById('example-knowledge-name').textContent = knowledgeName;
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
            document.getElementById('example-modal').classList.remove('hidden');
        }

        function nextExample() {
            if (!currentExample) return;
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === currentExample.knowledgeId);
            const otherExamples = examples.filter(e => e !== currentExample);
            if (otherExamples.length === 0) {
                alert('没有更多例题了');
                return;
            }
            const example = otherExamples[Math.floor(Math.random() * otherExamples.length)];
            currentExample = {...example, knowledgeId: currentExample.knowledgeId, knowledgeName: currentExample.knowledgeName, ...currentParams};
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
        }

        function addToWrongBook() {
            if (!currentExample) return;
            const item = {
                knowledgeId: currentExample.knowledgeId,
                knowledgeName: currentExample.knowledgeName,
                question: currentExample.question,
                answer: currentExample.answer,
                grade: currentParams.grade,
                subject: currentParams.subject
            };
            if (WrongBookManager.addWrongBook(item)) {
                alert('已加入错题本！');
            } else {
                alert('该题目已在错题本中');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearProgress() {
            const {grade, subject} = currentParams;
            const subjectName = subjectNames[subject];
            var msg = '确定要清除【' + subjectName + '】科目的所有学习进度吗？';
            msg += '\n\n';
            msg += '此操作将清除该科目所有已学习标记，且不可恢复。';
            if (!confirm(msg)) {
                return;
            }
            ProgressManager.clearSubjectProgress(grade, subject);
            updateProgressStat();
            renderKnowledgeList();
            alert('学习进度已清除');
        }

        document.getElementById('btn-expand-all').addEventListener('click', expandAll);
        document.getElementById('btn-collapse-all').addEventListener('click', collapseAll);
        document.getElementById('btn-clear-progress').addEventListener('click', clearProgress);
        searchInput.addEventListener('keyup', e => { if (e.key === 'Enter') performSearch(); });
        searchInput.addEventListener('input', () => { if (!searchInput.value) { searchResultsInfo.classList.add('hidden'); renderKnowledgeList(); }});
        document.getElementById('close-example').addEventListener('click', () => document.getElementById('example-modal').classList.add('hidden'));
        document.getElementById('btn-show-answer').addEventListener('click', () => {
            document.getElementById('example-answer-section').classList.remove('hidden');
            document.getElementById('btn-show-answer').classList.add('hidden');
        });
        document.getElementById('btn-next-example').addEventListener('click', nextExample);
        document.getElementById('btn-add-wrong').addEventListener('click', addToWrongBook);
        document.getElementById('example-modal').addEventListener('click', e => { if (e.target.id === 'example-modal') document.getElementById('example-modal').classList.add('hidden'); });

        initPage();
    </script>
</body>
</html>
