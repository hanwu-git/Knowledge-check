\n④面对知识经济时代，我们只有树立终身学习的观念，具备终身学习的能力，才能应对未来社会的挑战，肩负起民族复兴的使命。\n\n（3）认为\"只有终身学习，才能跟上时代的步伐\"是正确的，因为：\n①终身学习，能使我们克服工作中的困难，解决工作中的新问题。\n②终身学习，能满足我们生存和发展的需要。\n③终身学习，能使我们得到更大的发展空间，更好地实现自身价值。\n④终身学习，能充实我们的精神生活，不断提高生活品质。\n⑤终身学习既是个人可持续发展的要求，也是社会发展的必然要求。\n\n（4）我们要树立终身学习的理念，养成主动学习、不断探索的习惯，增强自我更新、学以致用的能力，让学习成为我们的一种生活方式。"},{"id":"g3_daofa_034_ex10","knowledge_id":"g3_daofa_034","question":"【简答题】终身学习对青少年有什么要求？","answer":"终身学习对青少年提出了以下要求：\n\n（1）珍惜在学校学习的机会，掌握科学的学习方法，努力学习科学文化知识，为终身学习奠定坚实的基础。\n\n（2）树立终身学习的理念，认识到学习没有终点，学习应该成为我们的一种生活方式。\n\n（3）养成主动学习的习惯，自觉、主动地去学习，而不是被动地接受知识。培养学习兴趣，激发学习动力。\n\n（4）养成持续学习的习惯，持之以恒，坚持不懈。\n\n（5）养成在实践中学习的习惯，积极参与社会实践，在实践中增长才干。\n\n（6）养成不断探索的习惯，勇于探索未知领域，培养好奇心和求知欲。\n\n（7）养成学以致用的习惯，把学到的知识运用到实际生活中去，解决实际问题。\n\n（8）增强自我更新、学以致用的能力，适应不断发展的社会。"},{"id":"g3_daofa_035_ex01","knowledge_id":"g3_daofa_035","question":"【选择题】进行人生规划的前提是：\nA. 了解自己\nB. 了解社会\nC. 确定目标\nD. 制定计划","answer":"正确答案：A\n解析：进行人生规划，首先要了解自己。了解自己的兴趣爱好、个性特长、能力水平、道德品质等，这是进行人生规划的前提。B选项了解社会是基础；C选项确定目标是关键；D选项制定计划是落实。"},{"id":"g3_daofa_035_ex02","knowledge_id":"g3_daofa_035","question":"【选择题】关于人生规划，下列说法正确的是：\n①人生需要规划\n②科学的人生规划能够帮助我们正确认识自己\n③人生规划一旦制定，就不能改变\n④科学的人生规划能够帮助我们树立正确的人生目标\nA. ①②③\nB. ①②④\nC. ①③④\nD. ②③④","answer":"正确答案：B\n解析：人生规划的意义：①人生需要规划。有了人生规划，我们才能明确方向，更好地实现人生价值。②科学的人生规划，能够帮助我们正确认识自己，发挥自身优势，开发自身潜能，不断提高自身素质。④科学的人生规划，能够帮助我们树立正确的人生目标，避免人生道路上的盲目性，少走弯路。③错误，人生规划不是一成不变的，要根据实际情况及时调整和完善。"},{"id":"g3_daofa_035_ex03","knowledge_id":"g3_daofa_035","question":"【选择题】生命的价值在于：\nA. 寿命的长短\nB. 财富的多少\nC. 对社会的贡献\nD. 地位的高低","answer":"正确答案：C\n解析：生命的价值不在于长短，而在于对社会的贡献。一个人的人生价值是通过他对自我、他人、集体、社会的合理需要的满足和贡献来体现的。A、B、D选项都不是衡量生命价值的标准。"},{"id":"g3_daofa_035_ex04","knowledge_id":"g3_daofa_035","question":"【填空题】我们要在劳动和奉献中创造价值，在______中实现价值，在砥砺自我中走向成功。","answer":"个人与社会的统一\n解析：我们要在劳动和奉献中创造价值，在个人与社会的统一中实现价值，在砥砺自我中走向成功。这是实现人生价值的根本途径和条件。"},{"id":"g3_daofa_035_ex05","knowledge_id":"g3_daofa_035","question":"【填空题】实现人生价值，需要充分发挥主观能动性，需要______、自强不息的精神。","answer":"顽强拼搏\n解析：实现人生价值，需要充分发挥主观能动性，需要顽强拼搏、自强不息的精神；需要努力发展自己的才能，全面提高个人素质；需要有坚定的理想信念，需要正确价值观的指引。"},{"id":"g3_daofa_035_ex06","knowledge_id":"g3_daofa_035","question":"【简答题】为什么要进行人生规划？","answer":"进行人生规划具有重要意义：\n\n（1）人生需要规划。有了人生规划，我们才能明确方向，更好地实现人生价值。\n\n（2）科学的人生规划，能够帮助我们正确认识自己，发挥自身优势，开发自身潜能，不断提高自身素质。\n\n（3）科学的人生规划，能够帮助我们树立正确的人生目标，避免人生道路上的盲目性，少走弯路。\n\n（4）人生规划能够激励我们不断前进，克服困难，实现人生目标。\n\n（5）合理的人生规划，能够使我们更好地适应社会发展的需要，实现个人与社会的统一。\n\n（6）人生规划是实现人生价值的重要保障，能够帮助我们创造有意义的人生。"},{"id":"g3_daofa_035_ex07","knowledge_id":"g3_daofa_035","question":"简答题：初中毕业之际，我们需要对未来进行规划。结合所学知识，说说如何进行人生规划？","answer":"进行人生规划，要做到：\n\n（1）了解自己。了解自己的兴趣爱好、个性特长、能力水平、道德品质等，这是进行人生规划的前提。\n\n（2）了解社会。了解社会发展趋势、社会需求、职业要求等，这是进行人生规划的基础。\n\n（3）确定目标。根据自身特点和社会需求，确定人生的总目标和阶段性目标。目标要具体、可行，既有挑战性，又不能好高骛远。\n\n（4）制定计划。围绕目标，制定切实可行的实施计划。计划要具体，有时间节点，有具体措施。\n\n（5）不断调整。人生规划不是一成不变的，要根据实际情况及时调整和完善。\n\n（6）脚踏实地，付诸行动。再好的规划，如果不付诸行动，也是一纸空文。要从现在做起，从小事做起，一步一个脚印地实现人生目标。"},{"id":"g3_daofa_035_ex08","knowledge_id":"g3_daofa_035","question":"【材料分析题】材料一：周总理少年时期就树立了\"为中华之崛起而读书\"的远大志向。为了实现这个目标，他努力学习，积极投身革命事业，最终成为伟大的无产阶级革命家，为中国人民的解放事业和新中国的建设作出了卓越贡献。\n材料二：有些同学认为，人生规划是大人的事，我们现在还小，不需要考虑那么多。也有些同学虽然有理想，但只是停留在口头上，没有实际行动。\n阅读材料，运用《规划人生》相关知识，回答下列问题：\n（1）材料一给我们什么启示？\n（2）结合材料二，谈谈青少年应该如何规划人生。","answer":"（1）材料一给我们的启示：\n①人生需要规划，要树立远大理想。周总理少年时期就树立了\"为中华之崛起而读书\"的远大志向，这启示我们要早立志、立大志。\n②人生价值在于对社会的贡献。周总理为中国人民的解放事业和新中国的建设作出了卓越贡献，实现了自己的人生价值。\n③实现人生价值，需要有坚定的理想信念，需要顽强拼搏、自强不息的精神。\n④个人理想与国家命运紧密相连，要把个人理想融入国家发展和民族复兴的伟大事业中。\n\n（2）青少年规划人生，要做到：\n①要了解自己。了解自己的兴趣爱好、个性特长、能力水平等，这是进行人生规划的前提。认为\"我们现在还小，不需要考虑那么多\"是错误的，人生规划要趁早。\n②要了解社会。了解社会发展趋势、社会需求等，这是进行人生规划的基础。\n③要确定目标。根据自身特点和社会需求，确定人生的总目标和阶段性目标。\n④要制定计划。围绕目标，制定切实可行的实施计划。\n⑤要付诸行动。理想不能只停留在口头上，要脚踏实地，从现在做起，从小事做起。\n⑥要不断调整。人生规划不是一成不变的，要根据实际情况及时调整和完善。\n⑦要把个人理想与国家发展、民族复兴结合起来，在实现中国梦的伟大实践中实现人生价值。"},{"id":"g3_daofa_035_ex09","knowledge_id":"g3_daofa_035","question":"【材料分析题】有人说：\"人生的价值不在于生命的长短，而在于生命的质量。\"也有人说：\"人生的价值在于对社会的贡献。\"\n结合材料，运用《规划人生》相关知识，谈谈你对人生价值的理解。","answer":"（1）生命的价值不在于长短，而在于对社会的贡献。这两种说法从不同角度说明了人生价值的内涵，都是正确的。\n\n（2）一个人的人生价值是通过他对自我、他人、集体、社会的合理需要的满足和贡献来体现的。\n\n（3）人生价值的两个方面：\n①个人对社会的责任和贡献（社会价值），这是人生价值的主要方面，是社会存在和发展的要求。\n②社会对个人的尊重和满足（自我价值），这是人生价值的另一个方面。\n人生价值是社会价值和自我价值的统一。\n\n（4）我们要在劳动和奉献中创造价值。劳动是人的存在方式，是创造美好生活、促进人的自由全面发展的重要手段。积极投身为人民服务的实践，是实现人生价值的必由之路。\n\n（5）我们要在个人与社会的统一中实现价值。社会提供的客观条件是人们实现人生价值的前提。人的价值只能在社会中实现，只有正确处理个人与集体、个人与社会的关系，才能在奉献社会中实现自己的价值。\n\n（6）我们要在砥砺自我中走向成功。实现人生价值，需要充分发挥主观能动性，需要顽强拼搏、自强不息的精神；需要努力发展自己的才能，全面提高个人素质；需要有坚定的理想信念，需要正确价值观的指引。"},{"id":"g3_daofa_035_ex10","knowledge_id":"g3_daofa_035","question":"【简答题】青少年如何实现自己的人生价值？","answer":"青少年实现人生价值，要做到：\n\n（1）树立远大理想，把个人理想与国家发展、民族复兴结合起来，在实现中国梦的伟大实践中创造人生价值。\n\n（2）在劳动和奉献中创造价值。积极投身社会实践，服务社会，奉献社会，用劳动创造美好生活。\n\n（3）在个人与社会的统一中实现价值。正确处理个人与集体、个人与社会的关系，在奉献社会中实现自己的价值。\n\n（4）在砥砺自我中走向成功：\n①充分发挥主观能动性，顽强拼搏、自强不息；\n②努力发展自己的才能，全面提高个人素质；\n③坚定理想信念，树立正确的价值观。\n\n（5）从现在做起，从身边小事做起，脚踏实地，埋头苦干，用实际行动实现人生价值。\n\n（6）珍惜青春年华，努力学习科学文化知识，为实现人生价值奠定坚实基础。\n\n（7）增强社会责任感，关心社会发展，关注国家大事，把个人成长融入社会发展的大潮中。"},{"id":"g3_daofa_036_ex01","knowledge_id":"g3_daofa_036","question":"【选择题】当今时代的主题是：\nA. 竞争与合作\nB. 和平与发展\nC. 改革与创新\nD. 民主与法治","answer":"正确答案：B\n解析：和平与发展是当今时代的主题。二战后，饱受战争之苦的各国人民深深感受到和平发展的可贵。世界整体上维持和平的态势，各国越来越重视经济发展和民生改善。A选项竞争与合作是国际关系的形式；C选项改革与创新是发展的动力；D选项民主与法治是政治建设的重要内容。"},{"id":"g3_daofa_036_ex02","knowledge_id":"g3_daofa_036","question":"【选择题】下列不属于威胁世界和平的因素是：\nA. 霸权主义\nB. 恐怖主义\nC. 经济全球化\nD. 领土争端","answer":"正确答案：C\n解析：威胁世界和平的因素包括霸权主义、民族问题、宗教冲突、领土争端和恐怖主义等。A、B、D选项都属于威胁世界和平的因素。C选项经济全球化是世界经济发展的趋势，有利于促进各国经济合作与相互依存，不是威胁世界和平的因素。"},{"id":"g3_daofa_036_ex03","knowledge_id":"g3_daofa_036","question":"【选择题】当今人类必须共同面对的发展课题包括：\n①消除贫困 ②让人们都过上幸福的生活 ③与自然和谐共生 ④建设和平、公正、包容的社会\nA. ①②③\nB. ①②④\nC. ①③④\nD. ①②③④","answer":"正确答案：D\n解析：消除贫困，让人们都过上幸福的生活，平等和有尊严地在健康的环境中充分发挥每个人的潜能，与自然和谐共生，建设和平、公正、包容的社会，是当今人类必须共同面对的发展课题。①②③④都正确。"},{"id":"g3_daofa_036_ex04","knowledge_id":"g3_daofa_036","question":"【填空题】______日益成为威胁世界和平的重要因素。它违背人类的道义和规则，严重威胁普通民众的生命安全。","answer":"恐怖主义\n解析：恐怖主义日益成为威胁世界和平的重要因素。恐怖主义违背人类的道义和规则，严重威胁普通民众的生命安全，造成社会动荡不安，与世界人民追求和平的愿望背道而驰。"},{"id":"g3_daofa_036_ex05","knowledge_id":"g3_daofa_036","question":"【填空题】世界经济发展不平衡的现象日趋严重，______与______间的差距不断扩大。","answer":"发达国家；发展中国家\n解析：世界经济发展不平衡的现象日趋严重，发达国家与发展中国家间的差距不断扩大。频发的战争、恶劣的自然环境、落后的教育等诸多因素导致贫困的国家越来越贫穷。"},{"id":"g3_daofa_036_ex06","knowledge_id":"g3_daofa_036","question":"【简答题】为什么要维护世界和平？","answer":"维护世界和平具有重要意义：\n\n（1）战争让人类付出了惨痛代价，给人类带来的伤痛难以忘却。\n\n（2）第二次世界大战后，饱受战争之苦的各国人民深深感受到和平发展的可贵。\n\n（3）世界上维护和平的力量不断壮大，和平与发展成为时代的主题。\n\n（4）和平是发展的前提和基础。只有在和平的国际环境中，世界各国才能保持正常的经济交往和顺利实现本国的发展计划。\n\n（5）维护世界和平是各国人民的共同愿望，符合各国人民的根本利益。\n\n（6）当今世界，人们越来越致力于以和平谈判代替武力解决争端。"},{"id":"g3_daofa_036_ex07","knowledge_id":"g3_daofa_036","question":"【简答题】威胁世界和平的因素有哪些？","answer":"威胁世界和平的因素主要有：\n\n（1）世界整体上维持和平的态势，但战争的阴影从未远离。\n\n（2）局部战争与冲突从未间断。\n\n（3）霸权主义是威胁世界和平的重要因素。霸权主义国家凭借实力，干涉别国内政，谋求主导地位，破坏国际秩序。\n\n（4）民族问题、宗教冲突、领土争端等问题时常引发地区冲突和战争。\n\n（5）恐怖主义日益成为威胁世界和平的重要因素。恐怖主义违背人类的道义和规则，严重威胁普通民众的生命安全，造成社会动荡不安，与世界人民追求和平的愿望背道而驰。\n\n（6）此外，核扩散、网络安全、气候变化等非传统安全问题也对世界和平构成新的挑战。"},{"id":"g3_daofa_036_ex08","knowledge_id":"g3_daofa_036","question":"【材料分析题】材料一：2024年，巴以冲突持续升级，造成大量平民伤亡，其中包括许多儿童。冲突导致大量民众流离失所，人道主义危机严重。国际社会广泛呼吁停火止战，通过和平谈判解决争端。\n材料二：2024年是联合国成立79周年。79年来，联合国在维护世界和平方面发挥了重要作用，已向世界各地派遣了70多支维和部队。但是，当今世界仍不安宁，威胁世界和平的因素依然存在。\n阅读材料，运用《维护世界和平》相关知识，回答下列问题：\n（1）材料一说明了什么？\n（2）结合两则材料，谈谈我们应该如何维护世界和平。","answer":"（1）材料一说明：世界整体上维持和平的态势，但战争的阴影从未远离。局部战争与冲突从未间断，威胁世界和平的种种因素依然存在。战争给人类带来了深重灾难，造成大量人员伤亡和财产损失。\n\n（2）维护世界和平，需要各国和各国人民共同努力：\n①当今世界，人们越来越致力于以和平谈判代替武力解决争端。要坚持通过对话协商解决国际争端和热点问题。\n②成立联合国，不断建立健全维护和平的机制。要充分发挥联合国在维护世界和平中的核心作用。\n③派驻维和部队。要支持联合国维和行动，为维护地区和平稳定作出贡献。\n④签署核不扩散条约。要坚持核不扩散机制，共同维护全球战略稳定。\n⑤驱散战争的阴影、维护世界和平需要每个人的努力。我们要看到和平来之不易，珍惜今天的和平，积极表达爱好和平的愿望，主动承担维护世界和平的责任，为维护世界和平作出贡献。\n⑥要反对霸权主义和强权政治，反对一切形式的恐怖主义，推动建立公正合理的国际政治经济新秩序。\n⑦要推动构建人类命运共同体，建设持久和平、普遍安全的世界。"},{"id":"g3_daofa_036_ex09","knowledge_id":"g3_daofa_036","question":"【材料分析题】材料一：世界银行报告显示，全球仍有7亿多人生活在极端贫困线以下，主要集中在撒哈拉以南非洲和南亚地区。贫困导致饥饿、疾病、社会动荡等一系列问题，制约着人类的发展。\n材料二：改革开放40多年来，中国让七亿多人口摆脱贫困，创造了人类减贫史上的奇迹。中国在实现自身减贫的同时，也积极帮助其他发展中国家开展减贫合作，分享减贫经验。\n阅读材料，运用《维护世界和平》相关知识，回答下列问题：\n（1）材料一说明了什么问题？造成这一问题的原因有哪些？\n（2）结合材料二，谈谈中国在推动可持续发展中的作用。","answer":"（1）材料一说明：消除贫困是当今人类必须共同面对的发展课题。世界经济发展不平衡的现象日趋严重，发达国家与发展中国家间的差距不断扩大。贫困问题仍然是制约人类发展的重要因素。\n\n造成贫困的原因主要有：\n①频发的战争，战争破坏了生产和生活秩序，导致人民流离失所。\n②恶劣的自然环境，如干旱、洪涝、沙漠化等，影响农业生产和经济发展。\n③落后的教育，教育水平低导致人口素质不高，难以摆脱贫困。\n④不公正不合理的国际经济旧秩序，使发展中国家在国际竞争中处于不利地位。\n\n（2）中国在推动可持续发展中的作用：\n①作为世界上最大的发展中国家，中国用有限的资源，在较短的时间内实现本国经济的快速发展，让七亿多人口摆脱贫困，这是对世界发展的重大贡献。\n②中国在实现自身减贫的同时，积极帮助其他发展中国家开展减贫合作，分享减贫经验，体现了中国的大国担当。\n③中国积极参与全球贫困治理，推动国际社会共同应对贫困问题，为全球减贫事业贡献中国智慧和中国方案。\n④中国坚持合作共赢的理念，让发展的成果更多更公平地惠及各个国家，推动世界共同发展。\n⑤中国致力于成为全球发展的贡献者，为推动可持续发展、建设共同繁荣的世界作出重要贡献。"},{"id":"g3_daofa_036_ex10","knowledge_id":"g3_daofa_036","question":"【简答题】青少年能为维护世界和平做些什么？","answer":"青少年能为维护世界和平作出以下贡献：\n\n（1）树立全球观念，培养开放、平等、包容的国际意识，关心世界的发展，关注人类的命运。\n\n（2）认识到和平的来之不易，珍惜今天的和平环境，增强忧患意识。\n\n（3）积极表达爱好和平的愿望，主动承担维护世界和平的责任，为维护世界和平作出力所能及的贡献。\n\n（4）努力学习科学文化知识，全面提高自身素质，为将来参与国际合作、维护世界和平奠定基础。\n\n（5）尊重不同国家和民族的文化差异，学会与不同国家的人民友好交往，增进相互理解和友谊。\n\n（6）反对战争，反对霸权主义和恐怖主义，积极宣传和平理念，传播和平思想。\n\n（7）关注国际事务，了解国际形势，为维护世界和平建言献策。\n\n（8）从身边小事做起，维护班级、学校、社会的和谐稳定，以实际行动为和平事业贡献力量。"},{"id":"g3_daofa_037_ex01","knowledge_id":"g3_daofa_037","question":"【选择题】改革开放以来，中国的国际地位实现前所未有的提升。下列能体现这一观点的是：\n①中国的经济实力、科技实力、国防实力、综合国力进入世界前列\n②中国日益走近世界舞台中央\n③中国成为国际社会公认的世界和平的建设者、全球发展的贡献者、国际秩序的维护者\n④中国已经成为世界上最发达的国家\nA. ①②③\nB. ①②④\nC. ①③④\nD. ②③④","answer":"正确答案：A\n解析：改革开放以来，中国的经济实力、科技实力、国防实力、综合国力进入世界前列。中国的国际地位实现前所未有的提升，国际影响力、感召力、塑造力不断提高。中国日益走近世界舞台中央，成为国际社会公认的世界和平的建设者、全球发展的贡献者、国际秩序的维护者。①②③正确。④错误，中国仍然是发展中国家，不是发达国家。"},{"id":"g3_daofa_037_ex02","knowledge_id":"g3_daofa_037","question":"【选择题】中国外交政策的宗旨是：\nA. 独立自主\nB. 维护世界和平、促进共同发展\nC. 和平共处五项原则\nD. 互利共赢","answer":"正确答案：B\n解析：中国坚持独立自主的和平外交政策，走和平发展道路，中国外交政策的宗旨是维护世界和平、促进共同发展。A选项独立自主是我国外交政策的基本立场；C选项和平共处五项原则是我国对外关系的基本准则；D选项互利共赢是我国对外开放的战略。"},{"id":"g3_daofa_037_ex03","knowledge_id":"g3_daofa_037","question":"【选择题】关于中国在国际舞台上的作用，下列说法正确的是：\nA. 中国在国际事务中发挥着主导作用\nB. 中国是联合国安理会常任理事国之一，在维护世界和平、促进共同发展方面作出了重要贡献\nC. 中国可以单独决定国际事务\nD. 中国只与发展中国家合作","answer":"正确答案：B\n解析：中国是联合国安理会常任理事国之一，在维护世界和平、促进共同发展方面作出了重要贡献。A选项错误，中国在国际事务中发挥着重要作用，但不是主导作用；C选项错误，国际事务需要各国共同协商，中国不能单独决定；D选项错误，中国既与发展中国家合作，也与发达国家合作。"},{"id":"g3_daofa_037_ex04","knowledge_id":"g3_daofa_037","question":"【填空题】中国是世界经济增长的主要稳定器和______，为全球经济稳定和增长提供了持续强大的推动力。","answer":"动力源\n解析：中国是世界经济增长的主要稳定器和动力源，为全球经济稳定和增长提供了持续强大的推动力。中国正为世界经济增长注入新的活力，日益成为世界经济发展的引擎与稳定器。"},{"id":"g3_daofa_037_ex05","knowledge_id":"g3_daofa_037","question":"【填空题】中国坚持独立自主的和平外交政策，走______道路，致力于建设持久和平、共同繁荣的和谐世界。","answer":"和平发展\n解析：中国坚持独立自主的和平外交政策，走和平发展道路，致力于建设持久和平、共同繁荣的和谐世界。这是中国根据时代发展潮流和自身根本利益作出的战略抉择。"},{"id":"g3_daofa_037_ex06","knowledge_id":"g3_daofa_037","question":"【简答题】中国的国际地位体现在哪些方面？","answer":"中国的国际地位不断提高，主要体现在：\n\n（1）改革开放以来，中国的经济实力、科技实力、国防实力、综合国力进入世界前列。\n\n（2）中国的国际地位实现前所未有的提升，国际影响力、感召力、塑造力不断提高。\n\n（3）中国日益走近世界舞台中央，成为国际社会公认的世界和平的建设者、全球发展的贡献者、国际秩序的维护者。\n\n（4）中国是世界上最大的发展中国家，在国际事务中发挥着越来越重要的作用。\n\n（5）中国是联合国安理会常任理事国之一，在维护世界和平、促进共同发展方面作出了重要贡献。\n\n（6）中国是世界经济增长的主要稳定器和动力源，为全球经济稳定和增长提供了持续强大的推动力。\n\n（7）中国积极参与全球治理体系改革和建设，推动构建人类命运共同体，为解决人类面临的共同问题贡献了中国智慧和中国方案。"},{"id":"g3_daofa_037_ex07","knowledge_id":"g3_daofa_037","question":"【简答题】中国在国际舞台上发挥了哪些重要作用？","answer":"中国在国际舞台上发挥着重要作用：\n\n（1）维护世界和平方面：\n①中国是联合国安理会常任理事国之一，积极参与联合国维和行动，是联合国维和行动的主要出兵国和出资国之一。\n②中国坚持走和平发展道路，反对霸权主义和强权政治，推动建立公正合理的国际政治经济新秩序。\n③中国积极参与国际安全合作，共同应对恐怖主义、网络安全等全球性问题。\n\n（2）促进共同发展方面：\n①中国是世界经济增长的主要稳定器和动力源，为全球经济稳定和增长提供了持续强大的推动力。\n②中国积极推动共建\"一带一路\"，带动沿线国家共同发展。\n③中国向发展中国家提供力所能及的援助，帮助发展中国家提高发展能力。\n\n（3）全球治理方面：\n①中国积极参与全球治理体系改革和建设，推动构建人类命运共同体。\n②中国秉持共商共建共享的全球治理观，倡导国际关系民主化。\n③中国为解决人类面临的共同问题贡献了中国智慧和中国方案。"},{"id":"g3_daofa_037_ex08","knowledge_id":"g3_daofa_037","question":"【材料分析题】材料一：改革开放40多年来，中国经济快速发展，国内生产总值从1978年的3679亿元增长到2023年的126万多亿元，成为世界第二大经济体。中国对世界经济增长的贡献率连续多年稳居世界前列，是世界经济增长的主要动力源。\n材料二：中国积极参与全球治理，提出构建人类命运共同体理念、共建\"一带一路\"倡议、全球发展倡议、全球安全倡议、全球文明倡议等，为解决人类面临的共同问题贡献了中国智慧和中国方案，得到了国际社会的广泛认同和支持。\n阅读材料，运用《中国的国际地位》相关知识，谈谈你对中国国际地位的认识。","answer":"（1）改革开放以来，中国的国际地位不断提高，日益走近世界舞台中央。\n\n（2）中国经济实力显著增强，综合国力进入世界前列：\n①中国成为世界第二大经济体，经济实力大幅提升。\n②中国对世界经济增长的贡献率连续多年稳居世界前列，是世界经济增长的主要稳定器和动力源，为全球经济稳定和增长提供了持续强大的推动力。\n\n（3）中国在国际事务中发挥着越来越重要的作用：\n①中国积极参与全球治理体系改革和建设，推动构建人类命运共同体。\n②中国提出的一系列重要倡议和理念，为解决人类面临的共同问题贡献了中国智慧和中国方案，得到了国际社会的广泛认同和支持。\n③中国秉持共商共建共享的全球治理观，倡导国际关系民主化。\n\n（4）中国是国际社会公认的世界和平的建设者、全球发展的贡献者、国际秩序的维护者。\n\n（5）中国坚持独立自主的和平外交政策，走和平发展道路，致力于建设持久和平、共同繁荣的和谐世界。\n\n（6）作为一个负责任的大国，中国努力提高自身在国际上的影响力、感召力和塑造力，积极主动地承担起相应的责任。"},{"id":"g3_daofa_037_ex09","knowledge_id":"g3_daofa_037","question":"【材料分析题】有人说：\"中国强大了，就会称霸世界。\"也有人说：\"中国走和平发展道路，永远不称霸。\"\n结合材料，运用《中国的国际地位》相关知识，谈谈你的看法。","answer":"（1）认为\"中国强大了，就会称霸世界\"的观点是错误的，认为\"中国走和平发展道路，永远不称霸\"的观点是正确的。\n\n（2）中国走和平发展道路的原因：\n①中国坚持独立自主的和平外交政策，走和平发展道路，中国外交政策的宗旨是维护世界和平、促进共同发展。\n②中华民族是爱好和平的民族，中国人民自古就崇尚和平，中国的发展是和平力量的发展。\n③中国是联合国安理会常任理事国之一，一贯遵循联合国宪章的宗旨和原则，积极维护世界和平与发展。\n④中国的发展需要和平的国际环境，和平的国际环境也需要中国的积极参与。\n\n（3）中国是负责任的大国：\n①中国作为一个负责任的大国，努力提高自身在国际上的影响力、感召力和塑造力，致力于成为世界和平的建设者、全球发展的贡献者、国际秩序的维护者。\n②中国积极参与全球治理，为全球治理提出中国方案，贡献中国智慧。\n③中国坚持合作共赢的理念，让发展的成果更多更公平地惠及各个国家。\n\n（4）历史和现实已经并将继续证明，中国始终是世界和平的建设者、全球发展的贡献者、国际秩序的维护者，中国永远不称霸，永远不搞扩张。"},{"id":"g3_daofa_037_ex10","knowledge_id":"g3_daofa_037","question":"【简答题】为什么说中国是一个负责任的大国？","answer":"中国是一个负责任的大国，主要体现在：\n\n（1）面对各种区域性和全球性的危机与难题，中国不推诿、不逃避，也不依赖他人，积极主动地承担起相应的责任。\n\n（2）中国全方位参与全球治理，在有关世界和平与发展的各个领域，积极采取行动。\n\n（3）作为世界上最大的发展中国家，中国用有限的资源，在较短的时间内实现本国经济的快速发展，让七亿多人口摆脱贫困，这是对世界发展的重大贡献。\n\n（4）中国努力提高自身在国际上的影响力、感召力和塑造力，致力于成为世界和平的建设者、全球发展的贡献者、国际秩序的维护者。\n\n（5）中国着眼于时代发展大势，遵循共商共建共享原则，为全球治理提出中国方案，贡献中国智慧。\n\n（6）中国广泛参与国际事务，在承担责任中不断积累经验，提升能力，增长智慧，发挥负责任大国作用，促进人类社会共同发展。\n\n（7）中国积极参与全球治理，主动承担国际责任，既尽力而为，又量力而行。"},{"id":"g3_daofa_038_ex01","knowledge_id":"g3_daofa_038","question":"【选择题】关于理想的作用，下列说法正确的是：\n①理想是人生的奋斗目标\n②理想对人的行为有导向、驱动和调控的作用\n③理想激励着我们不断超越自己\n④理想决定着我们人生的一切\nA. ①②③\nB. ①②④\nC. ①③④\nD. ②③④","answer":"正确答案：A\n解析：理想的重要性：①理想是对未来美好生活的向往和追求，是人生的奋斗目标。②理想总是指向未来，表现为奋斗目标，对人的行为有导向、驱动和调控的作用。③理想激励着我们不断超越自己，让我们充满了实现自身价值的喜悦，使我们的人生充满幸福。④亿万人民在追求自己的理想，特别是追求美好社会理想的过程中，推动着社会向前发展。④过于绝对，理想对人生有重要影响，但不能决定人生的一切。"},{"id":"g3_daofa_038_ex02","knowledge_id":"g3_daofa_038","question":"【选择题】关于理想与现实的关系，下列说法正确的是：\nA. 理想就是现实\nB. 理想高于现实，不可能转化为现实\nC. 理想源于现实，高于现实，在一定条件下可以转化为现实\nD. 理想与现实完全无关","answer":"正确答案：C\n解析：理想与现实的关系：①理想源于现实，是现实的升华。②理想高于现实，是现实的发展方向。③理想可以转化为现实。理想不等于现实，理想高于现实，但在一定条件下，理想可以转化为现实。④理想和现实是既有区别，又有联系的，它们之间是对立统一的关系。"},{"id":"g3_daofa_038_ex03","knowledge_id":"g3_daofa_038","question":"【选择题】实现理想的道路只有一条，那就是：\nA. 不断调整自己的理想\nB. 脚踏实地、全力以赴\nC. 等待机遇的到来\nD. 依靠他人的帮助","answer":"正确答案：B\n解析：理想可以有很多，但通向理想的道路只有一条，那就是脚踏实地、全力以赴。A选项错误，理想可以适当调整，但不能频繁调整；C选项错误，机遇需要主动争取，不能消极等待；D选项错误，实现理想主要靠自身努力，他人的帮助只是辅助。"},{"id":"g3_daofa_038_ex04","knowledge_id":"g3_daofa_038","question":"【填空题】理想是对未来美好生活的向往和追求，是人生的______。","answer":"奋斗目标\n解析：理想是对未来美好生活的向往和追求，是人生的奋斗目标。理想总是指向未来，表现为奋斗目标，对人的行为有导向、驱动和调控的作用。"},{"id":"g3_daofa_038_ex05","knowledge_id":"g3_daofa_038","question":"【填空题】实现理想，需要对______作出规划。","answer":"人生\n解析：实现理想，需要对人生作出规划。这个规划要尽可能长远，这样我们就不会在人生的某个阶段因为找不到目标而迷失方向；这个规划还要尽可能具体，可以按时间远近、重要程度划分为若干个阶段性目标。"},{"id":"g3_daofa_038_ex06","knowledge_id":"g3_daofa_038","question":"【简答题】理想有什么重要作用？","answer":"理想具有重要作用：\n\n（1）理想是对未来美好生活的向往和追求，是人生的奋斗目标。\n\n（2）理想总是指向未来，表现为奋斗目标，对人的行为有导向、驱动和调控的作用。\n\n（3）理想激励着我们不断超越自己，让我们充满了实现自身价值的喜悦，使我们的人生充满幸福。\n\n（4）亿万人民在追求自己的理想，特别是追求美好社会理想的过程中，推动着社会向前发展。\n\n（5）如果缺乏理想，就会使人缺少一种稳定、持久的内在激励，容易受到各种干扰；如果缺乏理想，我们的学习与生活就会缺少前进的动力，甚至会迷失方向。"},{"id":"g3_daofa_038_ex07","knowledge_id":"g3_daofa_038","question":"【简答题】如何实现自己的理想？","answer":"实现自己的理想，要做到：\n\n（1）实现理想，需要对人生作出规划。这个规划要尽可能长远，这样我们就不会在人生的某个阶段因为找不到目标而迷失方向；这个规划还要尽可能具体，可以按时间远近、重要程度划分为若干个阶段性目标。\n\n（2）我们的具体理想不是一成不变的，而是发展变化的。有时我们要根据自己的能力、兴趣等实际情况，对自己的理想适当进行调整，以缩短理想与现实之间的距离，促进理想的实现。\n\n（3）理想可以有很多，但通向理想的道路只有一条，那就是脚踏实地、全力以赴。\n\n（4）我们需要不断增强自身能力，提高自身素质；还需要不屈不挠、坚持不懈……\n\n（5）要把个人理想与国家发展、民族复兴结合起来，在实现中国梦的伟大实践中实现个人理想。"},{"id":"g3_daofa_038_ex08","knowledge_id":"g3_daofa_038","question":"【材料分析题】材料一：习近平总书记指出：\"中国梦是国家的梦、民族的梦，也是包括广大青年在内的每个中国人的梦。只有把人生理想融入国家和民族的事业中，才能最终成就一番事业。\"\n材料二：小明的理想是成为一名科学家。为了实现这个理想，他努力学习科学文化知识，积极参加科技创新活动，遇到困难从不退缩。但他也意识到，自己的数学基础还不够扎实，需要进一步加强。\n阅读材料，运用《理想与现实》相关知识，回答下列问题：\n（1）结合材料一，谈谈个人理想与国家发展的关系。\n（2）结合材料二，说说小明应该如何实现自己的理想。","answer":"（1）个人理想与国家发展的关系：\n①个人的命运与国家的命运息息相关，个人的未来与民族的未来紧密相连。\n②个人理想与国家发展是统一的。国家的发展为个人理想的实现提供了条件和保障，个人理想的实现又推动着国家的发展。\n③只有把人生理想融入国家和民族的事业中，才能最终成就一番事业。中国梦是国家的梦、民族的梦，也是每个中国人的梦。\n④青年兴则国家兴，青年强则国家强。青年一代有理想、有本领、有担当，国家就有前途，民族就有希望。\n\n（2）小明实现自己的理想，应该做到：\n①实现理想，需要对人生作出规划。小明可以为自己制定一个详细的学习计划和发展规划。\n②我们的具体理想不是一成不变的，而是发展变化的。小明可以根据自己的实际情况，对理想适当进行调整。\n③通向理想的道路只有一条，那就是脚踏实地、全力以赴。小明努力学习、积极参加科技创新活动，这是正确的做法，要继续坚持。\n④需要不断增强自身能力，提高自身素质。小明意识到自己的数学基础不够扎实，就应该加强数学学习，提高数学水平。\n⑤需要不屈不挠、坚持不懈。遇到困难从不退缩，这种精神值得肯定，要继续保持。\n⑥要把个人理想与国家发展、民族复兴结合起来，在实现中国梦的伟大实践中实现个人理想。"},{"id":"g3_daofa_038_ex09","knowledge_id":"g3_daofa_038","question":"【材料分析题】有人说：\"理想很丰满，现实很骨感。\"也有人说：\"有梦想就有希望，只要努力，理想就一定能实现。\"\n结合材料，运用《理想与现实》相关知识，谈谈你的看法。","answer":"（1）这两种观点都有一定的道理，但也都有片面性。\n\n（2）\"理想很丰满，现实很骨感\"这句话有一定道理，因为：\n①理想高于现实，是现实的发展方向。理想是对未来美好生活的向往和追求，总是比现实更美好。\n②理想不等于现实，理想的实现往往要经历一个漫长而曲折的过程，会遇到各种困难和挑战。\n③但这句话也有片面性，它只看到了理想与现实的差距，没有看到理想可以转化为现实。\n\n（3）\"有梦想就有希望，只要努力，理想就一定能实现\"这句话也有一定道理，因为：\n①理想对人的行为有导向、驱动和调控的作用，激励着我们不断超越自己。有梦想就有希望。\n②实现理想需要脚踏实地、全力以赴，需要不断增强自身能力，需要不屈不挠、坚持不懈。\n③但这句话也有片面性，因为理想的实现需要一定的客观条件，不是只要努力就一定能实现。我们的具体理想不是一成不变的，可以根据实际情况适当调整。\n\n（4）正确的态度应该是：\n①理想源于现实，高于现实，在一定条件下可以转化为现实。\n②实现理想，需要对人生作出规划，需要脚踏实地、全力以赴，需要不断增强自身能力，需要不屈不挠、坚持不懈。\n③要根据实际情况适当调整理想，以缩短理想与现实之间的距离。\n④要把个人理想与国家发展、民族复兴结合起来，在实现中国梦的伟大实践中实现个人理想。"},{"id":"g3_daofa_038_ex10","knowledge_id":"g3_daofa_038","question":"【简答题】青少年应该树立怎样的理想？","answer":"青少年应该树立这样的理想：\n\n（1）要树立远大理想。志存高远，追求更高的人生目标，不能目光短浅、胸无大志。\n\n（2）要树立正确的理想。理想要符合社会发展的需要，符合人民的根本利益，不能只考虑个人私利。\n\n（3）要树立符合实际的理想。理想的确定要从自身实际出发，既要看到自己的优势，也要看到自己的不足，不能好高骛远，也不能妄自菲薄。\n\n（4）要把个人理想与国家发展、民族复兴结合起来。把人生理想融入国家和民族的事业中，在实现中国梦的伟大实践中实现个人理想。\n\n（5）理想不是一成不变的，要根据实际情况适当调整理想，以缩短理想与现实之间的距离，促进理想的实现。\n\n（6）要脚踏实地、全力以赴，用实际行动实现理想。"},{"id":"g3_daofa_039_ex01","knowledge_id":"g3_daofa_039","question":"【选择题】下列关于劳动的说法，正确的是：\n①劳动是财富的源泉，也是幸福的源泉\n②人世间的美好梦想，都是通过劳动实现的\n③生命里的一切辉煌，都是通过劳动铸就的\n④只有体力劳动才是光荣的\nA. ①②③\nB. ①②④\nC. ①③④\nD. ②③④","answer":"正确答案：A\n解析：劳动是财富的源泉，也是幸福的源泉。人世间的美好梦想，都是通过劳动实现的；生命里的一切辉煌，都是通过劳动铸就的。①②③正确。④错误，无论是脑力劳动者还是体力劳动者，都是国家的建设者，都值得我们尊敬和学习。"},{"id":"g3_daofa_039_ex02","knowledge_id":"g3_daofa_039","question":"【选择题】把中国梦变成现实，创造未来的美好生活，需要：\n①一代代人埋头苦干和接力奋斗\n②每个人在各自岗位上付出更多的辛勤和汗水\n③继续发扬实干精神\n④只需要脑力劳动者的努力\nA. ①②③\nB. ①②④\nC. ①③④\nD. ②③④","answer":"正确答案：A\n解析：把中国梦变成现实，创造未来的美好生活，需要一代代人埋头苦干和接力奋斗，需要每个人在各自岗位上付出更多的辛勤和汗水。只有继续发扬实干精神，才能用我们的劳动创造新的辉煌。①②③正确。④错误，无论是脑力劳动者还是体力劳动者，都是国家的建设者，都在为国家发展作贡献。"},{"id":"g3_daofa_039_ex03","knowledge_id":"g3_daofa_039","question":"【选择题】下列对劳动者的认识，正确的是：\nA. 脑力劳动者比体力劳动者地位高\nB. 劳动有高低贵贱之分\nC. 每个人所处的岗位不同，从事不同的劳动，但都在为国家和社会发展作出贡献\nD. 只有科学家才值得尊敬","answer":"正确答案：C\n解析：每个人所处的岗位不同，从事不同的劳动，但都在为国家和社会发展作出贡献。正是无数劳动者兢兢业业、艰苦奋斗、无私奉献，成就了我们今天的美好生活。无论是脑力劳动者还是体力劳动者，都是国家的建设者，都值得我们尊敬和学习。A选项错误，脑力劳动者和体力劳动者地位平等；B选项错误，劳动没有高低贵贱之分；D选项错误，每位劳动者都值得尊敬。"},{"id":"g3_daofa_039_ex04","knowledge_id":"g3_daofa_039","question":"【填空题】劳动是财富的源泉，也是______的源泉。","answer":"幸福\n解析：劳动是财富的源泉，也是幸福的源泉。人世间的美好梦想，都是通过劳动实现的；生命里的一切辉煌，都是通过劳动铸就的。千百年来，中华民族素以勤劳智慧闻名于世。"},{"id":"g3_daofa_039_ex05","knowledge_id":"g3_daofa_039","question":"【填空题】少年兴则国家兴，少年强则国家强。我们是祖国的未来，一定要接过历史的接力棒，努力学习，积极探索，勇做走在时代前列的学习者、劳动者、______。","answer":"奉献者\n解析：少年兴则国家兴，少年强则国家强。我们是祖国的未来，一定要接过历史的接力棒，努力学习，积极探索，勇做走在时代前列的学习者、劳动者、奉献者，以执着的信念、优良的品德、丰富的知识、过硬的本领，担负起历史重任，让青春绽放出绚丽的光彩。"},{"id":"g3_daofa_039_ex06","knowledge_id":"g3_daofa_039","question":"【简答题】为什么说劳动创造价值？","answer":"劳动创造价值，原因在于：\n\n（1）劳动是财富的源泉，也是幸福的源泉。人世间的美好梦想，都是通过劳动实现的；生命里的一切辉煌，都是通过劳动铸就的。\n\n（2）千百年来，中华民族素以勤劳智慧闻名于世。今天，我们国家所取得的每一项成就，都是广大人民用辛勤劳动、诚实劳动、创造性劳动换来的，中国人民用实干精神创造了今天的辉煌。\n\n（3）每个人所处的岗位不同，从事不同的劳动，但都在为国家和社会发展作出贡献。正是无数劳动者兢兢业业、艰苦奋斗、无私奉献，成就了我们今天的美好生活。\n\n（4）无论是脑力劳动者还是体力劳动者，都是国家的建设者，都值得我们尊敬和学习。\n\n（5）劳动创造了人本身，劳动是人的存在方式，是促进人的全面发展的重要途径。"},{"id":"g3_daofa_039_ex07","knowledge_id":"g3_daofa_039","question":"【简答题】为什么要发扬实干精神？","answer":"发扬实干精神具有重要意义：\n\n（1）今天，国家建设展现出光辉灿烂的前景，中华民族伟大复兴的中国梦越来越接近现实。\n\n（2）把中国梦变成现实，创造未来的美好生活，需要一代代人埋头苦干和接力奋斗，需要每个人在各自岗位上付出更多的辛勤和汗水。\n\n（3）只有继续发扬实干精神，才能用我们的劳动创造新的辉煌。\n\n（4）我们国家所取得的每一项成就，都是广大人民用辛勤劳动、诚实劳动、创造性劳动换来的，中国人民用实干精神创造了今天的辉煌。\n\n（5）人世间的美好梦想，都是通过劳动实现的；生命里的一切辉煌，都是通过劳动铸就的。\n\n（6）少年兴则国家兴，少年强则国家强。我们要接过历史的接力棒，以实干精神担负起历史重任。"},{"id":"g3_daofa_039_ex08","knowledge_id":"g3_daofa_039","question":"【材料分析题】材料一：2024年\"五一\"国际劳动节前夕，全国劳动模范和先进工作者表彰大会在北京隆重举行。受表彰的人员中，既有科技工作者，也有一线工人；既有教师、医生，也有农民、环卫工人。他们在各自的岗位上辛勤劳动、无私奉献，为国家和社会作出了重要贡献。\n材料二：有些同学认为，劳动是大人的事，我们现在主要任务是学习，不需要参加劳动。还有些同学看不起体力劳动者，觉得只有当科学家、企业家才有出息。\n阅读材料，运用《劳动创造价值》相关知识，回答下列问题：\n（1）结合材料一，谈谈你对劳动的认识。\n（2）结合材料二，评析这些同学的观点。","answer":"（1）对劳动的认识：\n①劳动是财富的源泉，也是幸福的源泉。人世间的美好梦想，都是通过劳动实现的；生命里的一切辉煌，都是通过劳动铸就的。\n②每个人所处的岗位不同，从事不同的劳动，但都在为国家和社会发展作出贡献。材料中受表彰的劳动模范和先进工作者来自各行各业，都在各自岗位上作出了重要贡献。\n③正是无数劳动者兢兢业业、艰苦奋斗、无私奉献，成就了我们今天的美好生活。\n④无论是脑力劳动者还是体力劳动者，都是国家的建设者，都值得我们尊敬和学习。\n⑤我们国家所取得的每一项成就，都是广大人民用辛勤劳动、诚实劳动、创造性劳动换来的。\n\n（2）这些同学的观点是错误的。\n①认为\"劳动是大人的事，我们现在主要任务是学习，不需要参加劳动\"是错误的。劳动是每个人的责任和义务，青少年也需要参加劳动。参加劳动能够培养我们的动手能力、责任感和吃苦耐劳的精神，有利于我们的全面发展。学习和劳动并不矛盾，我们既要努力学习，也要参加力所能及的劳动。\n②认为\"只有当科学家、企业家才有出息，看不起体力劳动者\"是错误的。每个人所处的岗位不同，从事不同的劳动，但都在为国家和社会发展作出贡献。劳动没有高低贵贱之分，任何一份职业都很光荣。无论是脑力劳动者还是体力劳动者，都是国家的建设者，都值得我们尊敬和学习。\n③我们要树立正确的劳动观念，热爱劳动，尊重劳动者，积极参加劳动，用劳动创造美好的未来。"},{"id":"g3_daofa_039_ex09","knowledge_id":"g3_daofa_039","question":"【材料分析题】\"空谈误国，实干兴邦。\"习近平总书记多次强调实干精神，号召广大人民群众用辛勤劳动创造美好生活。中华民族伟大复兴的中国梦，终将在一代代青年的接力奋斗中变为现实。\n结合材料，运用《劳动创造价值》相关知识，谈谈青少年如何发扬实干精神。","answer":"青少年发扬实干精神，要做到：\n\n（1）认识到劳动的重要性。劳动是财富的源泉，也是幸福的源泉。人世间的美好梦想，都是通过劳动实现的；生命里的一切辉煌，都是通过劳动铸就的。\n\n（2）树立正确的劳动观念。热爱劳动，尊重劳动者，认识到劳动没有高低贵贱之分，无论是脑力劳动者还是体力劳动者，都是国家的建设者，都值得我们尊敬和学习。\n\n（3）努力学习，积极探索。少年兴则国家兴，少年强则国家强。我们要接过历史的接力棒，努力学习，积极探索，勇做走在时代前列的学习者、劳动者、奉献者。\n\n（4）以执着的信念、优良的品德、丰富的知识、过硬的本领，担负起历史重任，让青春绽放出绚丽的光彩。\n\n（5）积极参加劳动实践。在学校里，积极参加值日、大扫除等劳动；在家里，主动承担家务劳动；在社会上，积极参加志愿服务等公益劳动。\n\n（6）把中国梦变成现实，创造未来的美好生活，需要一代代人埋头苦干和接力奋斗，需要每个人在各自岗位上付出更多的辛勤和汗水。我们要从现在做起，从小事做起，用实际行动发扬实干精神。"},{"id":"g3_daofa_039_ex10","knowledge_id":"g3_daofa_039","question":"【简答题】如何理解\"劳动没有高低贵贱之分\"？","answer":"\"劳动没有高低贵贱之分\"，可以从以下几个方面理解：\n\n（1）每个人所处的岗位不同，从事不同的劳动，但都在为国家和社会发展作出贡献。\n\n（2）正是无数劳动者兢兢业业、艰苦奋斗、无私奉献，成就了我们今天的美好生活。\n\n（3）无论是脑力劳动者还是体力劳动者，都是国家的建设者，都值得我们尊敬和学习。\n\n（4）劳动是财富的源泉，也是幸福的源泉。只要是对社会有益的劳动，都是光荣的，都应该得到尊重。\n\n（5）社会分工不同，不同的职业只是分工不同，没有高低贵贱之分。每个职业都有其独特的价值，都在推动着社会的发展进步。\n\n（6）我们要树立正确的劳动观和职业观，尊重每一位劳动者，尊重每一份劳动，用劳动创造价值，用劳动实现梦想。"},{"id":"g3_daofa_040_ex01","knowledge_id":"g3_daofa_040","question":"【选择题】中国自信、民族自信的根本所在是：\nA. 中国经济实力不断增强\nB. 中国人口众多，地大物博\nC. 中国共产党领导中国人民开辟了中国特色社会主义道路，形成了中国特色社会主义理论体系，建立了中国特色社会主义制度，发展了中国特色社会主义文化\nD. 中国科技水平世界第一","answer":"正确答案：C\n解析：改革开放以来，中国共产党领导中国人民开辟了中国特色社会主义道路，形成了中国特色社会主义理论体系，建立了中国特色社会主义制度，发展了中国特色社会主义文化。这是中国自信、民族自信的根本所在。A选项是自信的表现之一，但不是根本所在；B选项不是根本原因；D选项错误，中国科技水平还不是世界第一。"},{"id":"g3_daofa_040_ex02","knowledge_id":"g3_daofa_040","question":"【选择题】自信的中国人表现在：\n①对国家有认同\n②对文化有底气\n③对发展有信心\n④对自己有信心\nA. ①②③\nB. ①②④\nC. ①③④\nD. ②③④","answer":"正确答案：A\n解析：自信的中国人的表现：①自信的中国人对国家有认同。具有强烈的国家认同感、与国家民族休戚与共的责任感、以天下为己任的使命感。②自信的中国人对文化有底气。能够坚守中华文化立场，传承中华文化基因，讲好中国故事，传播好中国声音，阐发中国精神，展现中国风貌。③自信的中国人对发展有信心。坚信中国特色社会主义道路就是人间正道，坚信创新、协调、绿色、开放、共享的发展理念能够引领中国发展，创造中国奇迹。④不属于自信的中国人的三个主要表现。"},{"id":"g3_daofa_040_ex03","knowledge_id":"g3_daofa_040","question":"【选择题】做自信的中国人，我们要：\n①培育理性平和、不卑不亢、开放包容的心态\n②既要胸怀理想又要求真务实\n③既要满怀激情又要锲而不舍\n④坚持中国特色社会主义道路自信、理论自信、制度自信、文化自信\nA. ①②③\nB. ①②④\nC. ①③④\nD. ①②③④","answer":"正确答案：D\n解析：做自信的中国人：①自信不是妄自尊大，也不是故步自封。在经济全球化的时代，面对各种思想文化的碰撞和价值观念的冲突，我们需要培育理性平和、不卑不亢、开放包容的心态。②自信的中国人既是梦想家又是实干家，既要胸怀理想又要求真务实，既要满怀激情又要锲而不舍。实干才能梦想成真，辛勤劳动才能开创美好生活。③我们不忘初心，继续前行，就要坚持中国特色社会主义道路自信、理论自信、制度自信、文化自信。④民族复兴的美好前景，为我们提供了更广阔的舞台，也提出了更高的要求，我们应当成为担当民族复兴大任的时代新人。①②③④都正确。"},{"id":"g3_daofa_040_ex04","knowledge_id":"g3_daofa_040","question":"【填空题】自信的中国人对国家有认同、对文化有底气、对______有信心。","answer":"发展\n解析：自信的中国人表现在三个方面：对国家有认同、对文化有底气、对发展有信心。这三个方面相互联系、相互促进，共同构成了自信中国人的形象。"},{"id":"g3_daofa_040_ex05","knowledge_id":"g3_daofa_040","question":"【填空题】我们不忘初心，继续前行，就要坚持中国特色社会主义道路自信、理论自信、制度自信、______自信。","answer":"文化\n解析：我们不忘初心，继续前行，就要坚持中国特色社会主义道路自信、理论自信、制度自信、文化自信，即\"四个自信\"。这是中国自信、民族自信的重要体现。"},{"id":"g3_daofa_040_ex06","knowledge_id":"g3_daofa_040","question":"【简答题】中国自信、民族自信的根本所在是什么？","answer":"中国自信、民族自信的根本所在是：\n\n（1）改革开放以来，中国共产党领导中国人民开辟了中国特色社会主义道路，形成了中国特色社会主义理论体系，建立了中国特色社会主义制度，发展了中国特色社会主义文化。\n\n（2）中国特色社会主义道路是实现途径，中国特色社会主义理论体系是行动指南，中国特色社会主义制度是根本保障，中国特色社会主义文化是精神力量，四者统一于中国特色社会主义伟大实践。\n\n（3）在党的领导下，中国特色社会主义伟大事业不断取得新的成就，国家富强、民族振兴让中国人更加自信。\n\n（4）这是中国自信、民族自信的根本所在，也是我们必须始终坚持的正确方向。"},{"id":"g3_daofa_040_ex07","knowledge_id":"g3_daofa_040","question":"【简答题】自信的中国人有哪些表现？","answer":"自信的中国人主要表现在三个方面：\n\n（1）自信的中国人对国家有认同。一个自信的中国人，具有强烈的国家认同感、与国家民族休戚与共的责任感、以天下为己任的使命感，能够自觉维护国家利益和国家尊严，自觉维护祖国统一和领土完整。\n\n（2）自信的中国人对文化有底气。一个自信的中国人，能够坚守中华文化立场，传承中华文化基因，讲好中国故事，传播好中国声音，阐发中国精神，展现中国风貌。\n\n（3）自信的中国人对发展有信心。一个自信的中国人，坚信中国特色社会主义道路就是人间正道，坚信创新、协调、绿色、开放、共享的发展理念能够引领中国发展，创造中国奇迹。"},{"id":"g3_daofa_040_ex08","knowledge_id":"g3_daofa_040","question":"【材料分析题】材料一：2024年，新中国成立75周年。75年来，在中国共产党的领导下，中国发生了翻天覆地的变化：经济快速发展，综合国力显著增强，人民生活水平大幅提高，国际地位不断提升。中国特色社会主义道路越走越宽广，中华民族伟大复兴展现出光明前景。\n材料二：在庆祝新中国成立75周年大会上，习近平总书记指出：\"今天，社会主义中国巍然屹立在世界东方，没有任何力量能够撼动我们伟大祖国的地位，没有任何力量能够阻挡中国人民和中华民族的前进步伐。\"\n阅读材料，运用《做自信的中国人》相关知识，回答下列问题：\n（1）材料一和材料二分别说明了什么？\n（2）结合材料，谈谈我们为什么要做自信的中国人。","answer":"（1）材料一说明：新中国成立75年来，在中国共产党的领导下，中国取得了举世瞩目的成就，综合国力显著增强，人民生活水平大幅提高，国际地位不断提升，中国特色社会主义道路越走越宽广。材料二说明：中国的发展成就令人自豪，中国人民有充分的理由自信，没有任何力量能够阻挡中国人民和中华民族的前进步伐。\n\n（2）我们要做自信的中国人，原因在于：\n①改革开放以来，中国共产党领导中国人民开辟了中国特色社会主义道路，形成了中国特色社会主义理论体系，建立了中国特色社会主义制度，发展了中国特色社会主义文化。这是中国自信、民族自信的根本所在。\n②在党的领导下，中国特色社会主义伟大事业不断取得新的成就，国家富强、民族振兴让中国人更加自信。材料中新中国成立75年来取得的巨大成就，就是中国自信的最好证明。\n③自信的中国人对国家有认同、对文化有底气、对发展有信心。\n④民族复兴的美好前景，为我们提供了更广阔的舞台，也提出了更高的要求，我们应当成为担当民族复兴大任的时代新人。\n⑤做自信的中国人，有利于增强民族凝聚力和向心力，有利于推动中国特色社会主义事业不断前进，有利于实现中华民族伟大复兴的中国梦。"},{"id":"g3_daofa_040_ex09","knowledge_id":"g3_daofa_040","question":"【材料分析题】有人说：\"中国已经很强大了，我们可以骄傲自满了。\"也有人说：\"中国还有很多问题，我们不应该自信。\"\n结合材料，运用《做自信的中国人》相关知识，谈谈你的看法。","answer":"（1）这两种观点都是错误的。第一种观点是骄傲自满、妄自尊大的表现；第二种观点是缺乏自信、妄自菲薄的表现。\n\n（2）中国确实取得了巨大成就，我们有理由自信：\n①改革开放以来，中国共产党领导中国人民开辟了中国特色社会主义道路，形成了中国特色社会主义理论体系，建立了中国特色社会主义制度，发展了中国特色社会主义文化。这是中国自信、民族自信的根本所在。\n②在党的领导下，中国特色社会主义伟大事业不断取得新的成就，国家富强、民族振兴让中国人更加自信。\n③自信的中国人对国家有认同、对文化有底气、对发展有信心。\n\n（3）但我们不能骄傲自满、妄自尊大：\n①自信不是妄自尊大，也不是故步自封。在经济全球化的时代，面对各种思想文化的碰撞和价值观念的冲突，我们需要培育理性平和、不卑不亢、开放包容的心态。\n②我们要清醒地认识到，我国仍然是世界上最大的发展中国家，仍然面临着许多困难和挑战。\n\n（4）正确的做法是：\n①既要看到成就，坚定信心，又要看到不足，保持清醒。\n②自信的中国人既是梦想家又是实干家，既要胸怀理想又要求真务实，既要满怀激情又要锲而不舍。实干才能梦想成真，辛勤劳动才能开创美好生活。\n③我们不忘初心，继续前行，就要坚持中国特色社会主义道路自信、理论自信、制度自信、文化自信。\n④我们应当成为担当民族复兴大任的时代新人，在实现中国梦的伟大实践中贡献力量。"},{"id":"g3_daofa_040_ex10","knowledge_id":"g3_daofa_040","question":"【简答题】如何做自信的中国人？","answer":"做自信的中国人，要做到：\n\n（1）对国家有认同。具有强烈的国家认同感、与国家民族休戚与共的责任感、以天下为己任的使命感，自觉维护国家利益和国家尊严，自觉维护祖国统一和领土完整。\n\n（2）对文化有底气。坚守中华文化立场，传承中华文化基因，讲好中国故事，传播好中国声音，阐发中国精神，展现中国风貌。\n\n（3）对发展有信心。坚信中国特色社会主义道路就是人间正道，坚信创新、协调、绿色、开放、共享的发展理念能够引领中国发展，创造中国奇迹。\n\n（4）培育理性平和、不卑不亢、开放包容的心态。自信不是妄自尊大，也不是故步自封。在经济全球化的时代，面对各种思想文化的碰撞和价值观念的冲突，我们需要保持开放包容的心态。\n\n（5）既要胸怀理想又要求真务实，既要满怀激情又要锲而不舍。自信的中国人既是梦想家又是实干家，实干才能梦想成真，辛勤劳动才能开创美好生活。\n\n（6）坚持中国特色社会主义道路自信、理论自信、制度自信、文化自信。我们不忘初心，继续前行，就要坚持\"四个自信\"。\n\n（7）成为担当民族复兴大任的时代新人。民族复兴的美好前景，为我们提供了更广阔的舞台，也提出了更高的要求。"}];
        const HAS_EXAMPLES = true;

        // 错题本管理器
        const WrongBookManager = {
            STORAGE_KEY_PREFIX: 'wrongbook_',
            getWrongBook(grade, subject) {
                const key = this.STORAGE_KEY_PREFIX + grade + '_' + subject;
                return JSON.parse(localStorage.getItem(key) || '[]');
            },
            addWrongBook(item) {
                const key = this.STORAGE_KEY_PREFIX + item.grade + '_' + item.subject;
                let wrongBook = this.getWrongBook(item.grade, item.subject);
                const exists = wrongBook.some(w => w.question === item.question);
                if (exists) return false;
                wrongBook.push({...item, id: item.knowledgeId + '_' + Date.now(), addedAt: new Date().toISOString()});
                localStorage.setItem(key, JSON.stringify(wrongBook));
                return true;
            }
        };

        // 学习进度管理器
        const ProgressManager = {
            STORAGE_KEY: 'study_progress',
            
            getProgress() {
                try {
                    return JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
                } catch(e) {
                    return {};
                }
            },
            
            saveProgress(progress) {
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(progress));
            },
            
            recordStudy(grade, subject, subjectName, semester, semesterName, knowledgeId, knowledgeName) {
                const progress = this.getProgress();
                const now = new Date().toISOString();
                const today = new Date().toISOString().split('T')[0];
                
                if (!progress.learnedKnowledge) progress.learnedKnowledge = {};
                if (!progress.dailyStats) progress.dailyStats = {};
                if (!progress.dailyStats[today]) {
                    progress.dailyStats[today] = { learnedCount: 0, subjects: [] };
                }
                
                const isNew = !progress.learnedKnowledge[knowledgeId];
                progress.learnedKnowledge[knowledgeId] = { learnedAt: now };
                
                if (isNew) {
                    progress.dailyStats[today].learnedCount++;
                    if (!progress.dailyStats[today].subjects.includes(subject)) {
                        progress.dailyStats[today].subjects.push(subject);
                    }
                }
                
                progress.lastStudy = {
                    grade, subject, subjectName, semester, semesterName,
                    knowledgeId, knowledgeName, timestamp: now
                };
                
                this.saveProgress(progress);
            },
            
            isLearned(knowledgeId) {
                const progress = this.getProgress();
                return !!(progress.learnedKnowledge && progress.learnedKnowledge[knowledgeId]);
            },
            
            getLastStudy() {
                const progress = this.getProgress();
                return progress.lastStudy || null;
            },
            
            getSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                if (!progress.learnedKnowledge) return { learned: 0, total: 0, percent: 0 };
                const prefix = grade + '_' + subject + '_';
                const learned = Object.keys(progress.learnedKnowledge).filter(k => k.startsWith(prefix)).length;
                const total = DATA_KNOWLEDGE.length;
                const percent = total > 0 ? Math.round((learned / total) * 100) : 0;
                return { learned, total, percent };
            },
            
            clearSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                const prefix = grade + '_' + subject + '_';
                
                if (progress.learnedKnowledge) {
                    Object.keys(progress.learnedKnowledge).forEach(k => {
                        if (k.startsWith(prefix)) {
                            delete progress.learnedKnowledge[k];
                        }
                    });
                }
                
                if (progress.lastStudy && progress.lastStudy.grade === grade && progress.lastStudy.subject === subject) {
                    delete progress.lastStudy;
                }
                
                this.saveProgress(progress);
                return true;
            }
        };

        // URL参数解析
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                grade: 'g3',
                subject: 'daofa',
                semester: params.get('semester') || 'upper'
            };
        }

        const gradeNames = {'g1':'初一','g2':'初二','g3':'初三'};
        const subjectNames = {'daofa':'道德与法治'};
        const semesterNames = {'upper':'上册','lower':'下册'};

        let currentParams = getUrlParams();
        let knowledgeList = [];
        let expandedIds = new Set();
        let currentExample = null;

        const pageTitle = document.getElementById('page-title');
        const pageSubtitle = document.getElementById('page-subtitle');
        const knowledgeListEl = document.getElementById('knowledge-list');
        const emptyStateEl = document.getElementById('empty-state');
        const searchResultsInfo = document.getElementById('search-results-info');
        const searchCountEl = document.getElementById('search-count');
        const searchInput = document.getElementById('search-input');

        function initPage() {
            const {grade, subject, semester} = currentParams;
            pageTitle.textContent = gradeNames[grade] + ' · ' + subjectNames[subject] + ' · ' + semesterNames[semester];
            loadKnowledge();
            updateProgressStat();
            
            const hash = window.location.hash.replace('#', '');
            if (hash && knowledgeList.some(k => k.id === hash)) {
                setTimeout(() => {
                    toggleExpand(hash);
                    const card = document.querySelector('[data-id="' + hash + '"]');
                    if (card) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
        }

        function updateProgressStat() {
            const {grade, subject} = currentParams;
            const learnedInSemester = knowledgeList.filter(k => ProgressManager.isLearned(k.id)).length;
            document.getElementById('progress-learned').textContent = learnedInSemester;
            document.getElementById('progress-total').textContent = knowledgeList.length;
        }

        function loadKnowledge() {
            const {grade, subject, semester} = currentParams;
            knowledgeList = DATA_KNOWLEDGE.filter(k => {
                return k.semester === semester;
            });
            renderKnowledgeList();
        }

        function renderKnowledgeList(items = knowledgeList) {
            if (items.length === 0) {
                knowledgeListEl.innerHTML = '';
                emptyStateEl.classList.remove('hidden');
                return;
            }
            emptyStateEl.classList.add('hidden');
            knowledgeListEl.innerHTML = items.map(item => {
                const isExpanded = expandedIds.has(item.id);
                const isLearned = ProgressManager.isLearned(item.id);
                return '<div class="card knowledge-card ' + (isLearned ? 'learned' : '') + '" data-id="' + item.id + '">' +
                    '<div class="knowledge-header p-4 flex items-center justify-between" onclick="toggleExpand(\'' + item.id + '\')">' +
                        '<div class="flex items-center gap-3 flex-1 min-w-0">' +
                            '<div class="expand-icon ' + (isExpanded ? 'expanded' : 'collapsed') + '">' + (isExpanded ? '−' : '+') + '</div>' +
                            '<div class="flex-1 min-w-0">' +
                                '<h3 class="text-lg font-semibold text-gray-800 flex items-center gap-2">' + escapeHtml(item.name) + (isLearned ? '<span class="text-green-500 text-sm">✓ 已学习</span>' : '') + '</h3>' +
                                '<p class="text-xs text-gray-500 mt-1">' + escapeHtml(item.chapter) + '</p>' +
                            '</div>' +
                        '</div>' +
                        (HAS_EXAMPLES ? '<button class="btn btn-secondary text-sm px-3 py-1" onclick="event.stopPropagation(); showExample(\'' + item.id + '\', \'' + escapeHtml(item.name) + '\')">例题</button>' : '') +
                    '</div>' +
                    '<div id="content-' + item.id + '" class="px-6 pb-4 ' + (isExpanded ? '' : 'hidden') + '">' +
                        (item.formula ? '<div class="mb-4"><h4 class="text-sm font-medium text-gray-500 mb-2">📐 公式</h4><p class="formula-box text-gray-800 text-lg bg-gray-50 p-3 rounded-lg">' + escapeHtml(item.formula) + '</p></div>' : '') +
                        (item.explanation ? '<div><h4 class="text-sm font-medium text-gray-500 mb-2">📝 解释</h4><p class="text-gray-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(item.explanation) + '</p></div>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function toggleExpand(id) {
            const isNewLearn = !expandedIds.has(id) && !ProgressManager.isLearned(id);
            if (expandedIds.has(id)) {
                expandedIds.delete(id);
            } else {
                expandedIds.add(id);
                const {grade, subject, semester} = currentParams;
                const item = knowledgeList.find(k => k.id === id);
                if (item) {
                    ProgressManager.recordStudy(
                        grade, subject, subjectNames[subject],
                        semester, semesterNames[semester],
                        id, item.name
                    );
                }
            }
            const card = document.querySelector('[data-id="' + id + '"]');
            const content = document.getElementById('content-' + id);
            const icon = card.querySelector('.expand-icon');
            const header = card.querySelector('.knowledge-header');
            const title = card.querySelector('h3');
            if (expandedIds.has(id)) {
                content.classList.remove('hidden');
                icon.classList.remove('collapsed');
                icon.classList.add('expanded');
                icon.textContent = '−';
                header.classList.add('expanded');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('expanded');
                icon.classList.add('collapsed');
                icon.textContent = '+';
                header.classList.remove('expanded');
            }
            if (isNewLearn) {
                card.classList.add('learned');
                if (!title.querySelector('.text-green-500')) {
                    title.innerHTML += '<span class="text-green-500 text-sm">✓ 已学习</span>';
                }
                updateProgressStat();
            }
        }

        function expandAll() {
            knowledgeList.forEach(item => expandedIds.add(item.id));
            renderKnowledgeList();
        }

        function collapseAll() {
            expandedIds.clear();
            renderKnowledgeList();
        }

        function searchKnowledge(keyword, list) {
            if (!keyword) return [];
            const lower = keyword.toLowerCase();
            return list.filter(k =>
                k.name.toLowerCase().includes(lower) ||
                k.chapter.toLowerCase().includes(lower)
            );
        }

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                searchResultsInfo.classList.add('hidden');
                renderKnowledgeList();
                return;
            }
            const results = searchKnowledge(keyword, knowledgeList);
            searchCountEl.textContent = results.length;
            searchResultsInfo.classList.remove('hidden');
            renderKnowledgeList(results);
        }

        function showExample(knowledgeId, knowledgeName) {
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === knowledgeId);
            if (examples.length === 0) {
                alert('暂无例题');
                return;
            }
            const example = examples[Math.floor(Math.random() * examples.length)];
            currentExample = {...example, knowledgeId, knowledgeName, ...currentParams};
            document.getElementById('example-knowledge-name').textContent = knowledgeName;
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
            document.getElementById('example-modal').classList.remove('hidden');
        }

        function nextExample() {
            if (!currentExample) return;
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === currentExample.knowledgeId);
            const otherExamples = examples.filter(e => e !== currentExample);
            if (otherExamples.length === 0) {
                alert('没有更多例题了');
                return;
            }
            const example = otherExamples[Math.floor(Math.random() * otherExamples.length)];
            currentExample = {...example, knowledgeId: currentExample.knowledgeId, knowledgeName: currentExample.knowledgeName, ...currentParams};
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
        }

        function addToWrongBook() {
            if (!currentExample) return;
            const item = {
                knowledgeId: currentExample.knowledgeId,
                knowledgeName: currentExample.knowledgeName,
                question: currentExample.question,
                answer: currentExample.answer,
                grade: currentParams.grade,
                subject: currentParams.subject
            };
            if (WrongBookManager.addWrongBook(item)) {
                alert('已加入错题本！');
            } else {
                alert('该题目已在错题本中');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearProgress() {
            const {grade, subject} = currentParams;
            const subjectName = subjectNames[subject];
            var msg = '确定要清除【' + subjectName + '】科目的所有学习进度吗？';
            msg += '\n\n';
            msg += '此操作将清除该科目所有已学习标记，且不可恢复。';
            if (!confirm(msg)) {
                return;
            }
            ProgressManager.clearSubjectProgress(grade, subject);
            updateProgressStat();
            renderKnowledgeList();
            alert('学习进度已清除');
        }

        document.getElementById('btn-expand-all').addEventListener('click', expandAll);
        document.getElementById('btn-collapse-all').addEventListener('click', collapseAll);
        document.getElementById('btn-clear-progress').addEventListener('click', clearProgress);
        searchInput.addEventListener('keyup', e => { if (e.key === 'Enter') performSearch(); });
        searchInput.addEventListener('input', () => { if (!searchInput.value) { searchResultsInfo.classList.add('hidden'); renderKnowledgeList(); }});
        document.getElementById('close-example').addEventListener('click', () => document.getElementById('example-modal').classList.add('hidden'));
        document.getElementById('btn-show-answer').addEventListener('click', () => {
            document.getElementById('example-answer-section').classList.remove('hidden');
            document.getElementById('btn-show-answer').classList.add('hidden');
        });
        document.getElementById('btn-next-example').addEventListener('click', nextExample);
        document.getElementById('btn-add-wrong').addEventListener('click', addToWrongBook);
        document.getElementById('example-modal').addEventListener('click', e => { if (e.target.id === 'example-modal') document.getElementById('example-modal').classList.add('hidden'); });

        initPage();
    </script>
</body>
</html>
