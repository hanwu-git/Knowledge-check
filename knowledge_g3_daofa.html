    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"id":"g3_daofa_001","chapter":"第一单元 富强与创新","name":"坚持改革开放","formula":"改革开放是强国之路，是决定当代中国命运的关键抉择","explanation":"【改革开放的开启】\n1. 1978年，党的十一届三中全会开启了改革开放的历史征程。\n2. 改革开放是从农村到城市，从试点到推广，从经济体制改革到全面深化改革的过程。\n\n【改革开放的意义】\n1. 极大激发广大人民群众的创造性，极大解放和发展社会生产力，极大增强社会发展活力。\n2. 人民生活显著改善，综合国力显著增强，国际地位显著提高。\n3. 中华民族迎来了从站起来、富起来到强起来的伟大飞跃。\n\n【为什么要坚持改革开放】\n1. 改革开放是强国之路，是我们党、我们国家发展进步的活力源泉。\n2. 改革开放是决定当代中国命运的关键抉择，是发展中国特色社会主义、实现中华民族伟大复兴的必由之路。\n3. 改革开放是当代中国最鲜明的特色。改革只有进行时，没有完成时。","semester":"upper"},{"id":"g3_daofa_002","chapter":"第一单元 富强与创新","name":"走向共同富裕","formula":"共同富裕是中国特色社会主义的根本原则，共享发展成果","explanation":"【为什么要全面深化改革】\n1. 我国过去40多年的快速发展靠的是改革开放，未来发展也必须坚定不移地依靠改革开放。\n2. 进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。\n3. 我国经济已由高速增长阶段转向高质量发展阶段。\n4. 我国经济发展还面临区域发展不平衡、城镇化水平不高、城乡发展不平衡不协调等现实挑战。\n\n【共享发展成果】\n1. 衡量一个社会的文明程度，不仅要看经济发展，而且要看发展成果是否惠及全体人民，人民的合法权益是否得到切实保障。\n2. 党和政府坚持以人民为中心的发展思想，强调人人参与、人人尽力、人人享有，让人民群众共享发展成果。\n3. 人民对美好生活的向往，就是党的奋斗目标。\n4. 发展的根本目的就是增进民生福祉。","semester":"upper"},{"id":"g3_daofa_003","chapter":"第一单元 富强与创新","name":"创新改变生活","formula":"创新是引领发展的第一动力，是民族进步的灵魂","explanation":"【感受创新】\n1. 生活处处有创新。创新是一种生活方式。\n2. 创新给我们带来惊喜，让我们获得成就感。创新点燃激情，让我们的生命充满活力。\n3. 生活的各个领域都需要创新，也都可以创新。知识的创新提供新的思想和方法，技术的创新促进生产力发展、增加社会财富，制度的创新促进公平正义、推动社会进步。\n4. 创新让生活更美好。我们的生活将因创新变得更加便捷、舒适和丰富多彩。\n\n【创新的重要性】\n1. 创新是引领发展的第一动力。\n2. 创新是一个民族进步的灵魂，是一个国家兴旺发达的不竭源泉，也是中华民族最鲜明的民族禀赋。\n3. 创新是推动人类社会向前发展的重要力量。\n4. 时代发展呼唤创新。创新已经成为世界主要国家发展战略的重心。在激烈的国际竞争中，唯创新者进，唯创新者强，唯创新者胜。","semester":"upper"},{"id":"g3_daofa_004","chapter":"第一单元 富强与创新","name":"创新永无止境","formula":"落实科教兴国战略、人才强国战略，建设创新型国家","explanation":"【创新强国】\n1. 科技创新能力已经成为综合国力竞争的决定性因素。\n2. 目前，虽然我国在尖端技术的掌握和创新方面打下了坚实基础，在一些重要领域走在世界前列，但是，从整体上看，我国仍然面临创新能力不强、科技发展水平总体不高、科技对经济社会发展的支撑能力不足、科技对经济增长的贡献率远低于发达国家水平等问题。\n3. 建设创新型国家，必须落实科教兴国战略、人才强国战略，将科技和教育摆在经济社会发展的重要位置，把经济建设重心转移到依靠科技进步和提高劳动者素质的轨道上来。\n4. 教育是民族振兴、社会进步的基石，是提高国民素质、培养创新型人才、促进人的全面发展的根本途径。\n\n【万众创新】\n1. 当今社会，大众创业、万众创新的理念深入人心。\n2. 企业是社会创新的重要力量。提升创新能力是企业持续发展之基、市场制胜之道。\n3. 时代需要弘扬创新精神。\n4. 创新的时代，既要尊重他人的知识产权，又要学会保护自己的知识产权。","semester":"upper"},{"id":"g3_daofa_005","chapter":"第一单元 富强与创新","name":"我国的基本经济制度","formula":"公有制为主体、多种所有制经济共同发展是我国的基本经济制度","explanation":"【公有制经济】\n1. 生产资料公有制是社会主义经济制度的基础。\n2. 公有制经济包括国有经济、集体经济以及混合所有制经济中的国有成分和集体成分。\n3. 国有经济是国民经济的主导力量。发展、壮大国有经济，对于提供公共服务、发展重要前瞻性战略性产业、保护生态环境、支持科技进步和保障国家安全等，具有关键作用。\n4. 发展、壮大集体经济，对于广泛吸纳社会资金、缓解就业压力、增加公共积累和实现共同富裕等具有重要作用。\n\n【非公有制经济】\n1. 非公有制经济包括个体经济、私营经济等。\n2. 非公有制经济在支撑经济增长、增加税收、扩大就业、促进大众创业和万众创新等方面发挥着重要作用。\n3. 国家保护个体经济、私营经济等非公有制经济的合法的权利和利益，鼓励、支持、引导非公有制经济发展，激发非公有制经济活力和创造力。\n\n【基本经济制度的意义】\n我国公有制为主体、多种所有制经济共同发展的基本经济制度，促进了生产力的发展、综合国力的增强和人民生活水平的提高，为人民当家作主奠定了坚实的物质基础。","semester":"upper"},{"id":"g3_daofa_006","chapter":"第二单元 民主与法治","name":"追求民主价值","formula":"人民当家作主是社会主义民主政治的本质特征","explanation":"【民主的足音】\n1. 一般来说，民主在价值上要求大多数人当家作主，民主价值的实现要靠民主形式和民主制度的建立。\n2. 建设人民当家作主的社会主义国家，实现社会公平正义，已经成为全体中国人民的共同价值追求。\n\n【新型的民主】\n1. 我国社会主义民主是一种新型的民主，它从中国的社会土壤中生长出来，在实践中不断得到验证，具有强大生命力。\n2. 人民当家作主是社会主义民主政治的本质特征。\n3. 我国社会主义民主是维护人民根本利益的最广泛、最真实、最管用的民主。\n4. 有事好商量，众人的事情由众人商量，是人民民主的真谛。\n5. 协商民主是我国社会主义民主政治的特有形式和独特优势。\n\n【行使民主权利的形式】\n1. 民主选举是人民实现民主权利的一种重要形式。\n2. 民主决策是保障人民利益得到充分实现的有效方式。\n3. 民主监督是公民参与民主生活、行使公民监督权的具体体现。","semester":"upper"},{"id":"g3_daofa_007","chapter":"第二单元 民主与法治","name":"参与民主生活","formula":"增强民主意识，依法有序参与民主生活","explanation":"【行使民主权利】\n1. 民主选举的形式有多种，如直接选举和间接选举、等额选举和差额选举等。\n2. 民主决策的过程，要求保证广泛的公民参与，决策方认真听取各方意见，集中民智，促进决策的科学化。社情民意反映制度、专家咨询制度、重大事项社会公示制度和社会听证制度等是公民参与民主决策的有力保证。\n3. 实行民主监督，有利于国家机关和国家工作人员改进工作，提高工作效率，克服官僚主义，防止滥用权力，预防腐败。实行民主监督，有助于增强公民的参与意识，激发公民的参与热情。\n\n【增强民主意识】\n1. 在现代社会，民主应该成为公民的一种生活方式和生活态度。一个国家和社会民主生活的质量和水平，与公民的民主意识密切相关。\n2. 我国公民参与民主生活，要有社会责任感和主人翁意识，以理性、公正、客观的态度全面、深刻、辩证地看问题，立场正确、逻辑清晰地表达观点和意见，逐步提高依法有序参与民主生活的能力。\n3. 增强民主意识，需要公民自觉遵守宪法，始终按照宪法原则和精神参与民主生活；需要公民不断积累民主知识，形成尊重、宽容、批判和协商的民主态度；需要公民通过依法参与公共事务，在实践中逐步增强民主意识。","semester":"upper"},{"id":"g3_daofa_008","chapter":"第二单元 民主与法治","name":"夯实法治基石","formula":"法治是现代政治文明的核心，全面依法治国是基本方略","explanation":"【选择法治道路】\n1. 法治，意味着依法治理。法治能够为人们提供良好的生活秩序，让人们建立起基本、稳定、持续的生活预期，保障人们在社会各个领域依法享有广泛的权利和自由，使人们安全、有尊严地生活。\n2. 追求并奉行法治已经成为现代世界各国的共识。\n3. 法治是现代政治文明的核心，是发展市场经济、实现强国富民的基本保障，是解决社会矛盾、维护社会稳定、实现社会正义的有效方式。走法治道路是实现中华民族伟大复兴的必然选择。\n\n【描绘法治蓝图】\n1. 党的十五大把依法治国确定为党领导人民治理国家的基本方略，积极推进社会主义法治建设。\n2. 社会因法治而进步。全面依法治国是中国特色社会主义的本质要求和重要保障。\n3. 建设法治中国，要努力使每一项立法都得到人民群众的普遍拥护，使每一部法律法规都得到严格执行，使每一个司法案件都体现公平正义，使每一位公民都成为法治的忠实崇尚者、自觉遵守者和坚定捍卫者。\n4. 坚定不移地走中国特色社会主义法治道路，必须坚持党的领导、人民当家作主、依法治国有机统一。","semester":"upper"},{"id":"g3_daofa_009","chapter":"第二单元 民主与法治","name":"凝聚法治共识","formula":"政府依法行政，公民要增强尊法学法守法用法意识","explanation":"【法治政府】\n1. 法治政府就是按照法治原则运作的政府，政府的各项权力都应该在法治轨道上运行。\n2. 在我国，政府的权力来源于人民。政府的宗旨是为人民服务，政府的工作要对人民负责，为人民谋利益。\n3. 依法行政是现代法治政府行使权力普遍奉行的基本准则，要求政府及其工作人员在行使行政权力、管理公共事务时必须由宪法和法律授权，并且依据宪法和法律的规定正确行使权力。依法行政的核心是规范政府的行政权。\n4. 建设法治政府，必须依法行政，防范行政权力的滥用，维护广大人民群众的合法权益，提高政府公信力，从而推进民主法治建设进程。\n\n【厉行法治】\n1. 全面依法治国必须坚持厉行法治，推进科学立法、严格执法、公正司法、全民守法。\n2. 厉行法治是对全体社会成员的共同要求。全体社会成员必须在宪法和法律范围内行使权利，履行义务。\n3. 现代社会的公民，要增强尊法学法守法用法意识，弘扬法治精神，强化规则意识，树立正确的权利义务观念。\n4. 政府及其工作人员要率先做尊法守法的榜样，带动全体公民共同守法。\n5. 厉行法治，需要加强法治宣传，弘扬法治精神，共同营造良好的法治文化环境。\n6. 国家和社会治理需要法律和道德共同发挥作用，既重视发挥法律的规范作用，又重视发挥道德的教化作用。","semester":"upper"},{"id":"g3_daofa_010","chapter":"第二单元 民主与法治","name":"我国的根本政治制度","formula":"人民代表大会制度是我国的根本政治制度","explanation":"【人民代表大会制度的基本内容】\n1. 国家的一切权力属于人民。\n2. 人民通过民主选举选出代表，组成各级人民代表大会作为国家权力机关。\n3. 由人民代表大会产生国家行政机关、监察机关、审判机关、检察机关，这些国家机关依法行使各自的职权，并对人民代表大会负责，受人民代表大会监督。\n4. 实行民主集中制，重大问题经人民代表大会充分讨论，遵循少数服从多数原则，民主决定。\n\n【人大代表的职权和义务】\n1. 全国人民代表大会和地方各级人民代表大会代表依照宪法和法律赋予本级人民代表大会的各项职权，参加行使国家权力，有权依法审议各项议案和报告、表决各项决定、提出议案和质询案。\n2. 人大代表必须与人民群众保持密切联系，听取和反映人民群众的意见和要求，努力为人民服务，对人民负责，并接受人民监督。\n\n【为什么要坚持人民代表大会制度】\n人民代表大会制度建立以来，不断得到巩固和发展，展现出蓬勃生机活力。实践充分证明，人民代表大会制度是符合中国国情和实际、体现社会主义国家性质、保证人民当家作主、保障实现中华民族伟大复兴的好制度。","semester":"upper"},{"id":"g3_daofa_011","chapter":"第三单元 文明与家园","name":"延续文化血脉","formula":"中华文化源远流长、博大精深，坚定文化自信","explanation":"【中华文化根】\n1. 长期以来，各族人民团结互助、相互学习，用自己的勤劳和智慧创造了灿烂的中华文化。\n2. 独具特色的语言文字，浩如烟海的文化典籍，名扬世界的科技工艺，异彩纷呈的文学艺术，等等，共同组成源远流长、博大精深的中华文化。\n3. 中华文化虽历经沧桑而能薪火相传、一脉相承，一个重要原因就在于它具有应对挑战、与时俱进的创造力和海纳百川、有容乃大的包容力。\n4. 文化是一个国家、一个民族的灵魂。新时代，延续文化血脉需要发展中国特色社会主义文化。\n5. 中国特色社会主义文化，源自于中华民族五千多年文明历史所孕育的中华优秀传统文化，熔铸于党领导人民在革命、建设、改革中创造的革命文化和社会主义先进文化，植根于中国特色社会主义伟大实践。\n\n【美德万年长】\n1. 中华传统美德是中华文化的精髓，蕴含着丰富的道德资源，熔铸了中华民族坚定的民族志向、高尚的民族品格和远大的民族理想，是代代相传的民族智慧，是建设富强民主文明和谐美丽的社会主义现代化强国的精神力量。\n2. 中华传统美德内涵丰富，博大精深。\n3. 美德的力量在于践行。推进社会公德、职业道德、家庭美德、个人品德建设，青少年责无旁贷；倡导向上向善、孝老爱亲、忠于祖国、忠于人民，青少年必须身体力行。","semester":"upper"},{"id":"g3_daofa_012","chapter":"第三单元 文明与家园","name":"凝聚价值追求","formula":"社会主义核心价值观是当代中国精神的集中体现","explanation":"【高扬民族精神】\n1. 民族精神是民族的\"魂魄\"。一个民族要生存和发展，就要有昂扬向上的民族精神。\n2. 在五千多年的发展历程中，中国人民不仅创造了灿烂辉煌的文化，而且形成了以爱国主义为核心的团结统一、爱好和平、勤劳勇敢、自强不息的伟大民族精神。\n3. 中华民族精神具有与时俱进的品格。它在不同的历史时期有着不同的表现，并随着时代进步而不断丰富和发展。\n4. 精神的力量是无穷的。伟大民族精神始终是中华民族生生不息、发展壮大的强大精神支柱，是维系我国各族人民世世代代团结奋斗的牢固精神纽带，是激励中华儿女为实现中国梦而奋斗的不竭精神动力。\n5. 传承和弘扬民族精神，表现在国家危难、民族危亡的紧要关头能够挺身而出、舍生忘死、前仆后继；表现在他人生命、财产遇到危险的关键时刻能够见义勇为、扶危济困、无私奉献；表现在日常学习工作中的勤勤恳恳、任劳任怨、敬业创优。\n\n【构筑中国价值】\n1. 社会主义核心价值观不仅是中国人民在共同生活中形成的价值共识，而且吸收了世界文明的有益成果，是当代中国精神的集中体现。\n2. 我国宪法规定，国家倡导社会主义核心价值观。社会主义核心价值观是当代中国人评判是非曲直的价值标准。\n3. 富强、民主、文明、和谐是国家层面的价值目标，自由、平等、公正、法治是社会层面的价值取向，爱国、敬业、诚信、友善是公民个人层面的价值准则。\n4. 社会主义核心价值观凝结着全体人民共同的价值追求，是坚持和发展中国特色社会主义的价值导向，也是实现中华民族伟大复兴的价值引领。","semester":"upper"},{"id":"g3_daofa_013","chapter":"第三单元 文明与家园","name":"正视发展挑战","formula":"我国面临人口、资源、环境的严峻挑战","explanation":"【发展中的人口问题】\n1. 人口问题已经成为一个日益严峻的全球性问题，成为人类社会面临的重大挑战之一。\n2. 我国是世界上人口最多的国家，这是我国社会主义初级阶段的重要国情。\n3. 人口基数大，人口素质偏低，是我国人口现状的基本特点。我国人口状况还呈现出增速趋缓、出生率低、老龄化加剧、男女性别比失衡、城乡分布不均衡、\"独生子女\"社会问题凸显等一系列新的特点。\n4. 人口问题始终是我国面临的全局性、长期性、战略性问题。在未来相当长的时期内，我国人口众多的基本国情不会根本改变，人口对经济社会发展的压力不会根本改变，人口与资源环境的紧张关系不会根本改变。\n5. 国家推行计划生育，使人口的增长同经济和社会发展计划相适应，有效地缓解了人口对资源、环境的压力，有力地促进了经济发展与社会进步。\n\n【资源环境面临危机】\n1. 我国自然资源丰富，总量大，种类多，但人均资源占有量少，开发难度大，总体上资源紧缺。\n2. 长期以来，我国资源开发利用不尽合理、不够科学，依靠消耗大量资源换取经济发展的现象突出，由此造成的浪费、损失、污染和破坏都很严重。我国面临的资源形势非常严峻。\n3. 当前我国生态环境虽总体有所改善，但生态环境形势仍不容乐观。\n4. 环境恶化加剧自然灾害的发生，严重破坏生态平衡，威胁着人民的生命安全和身体健康。","semester":"upper"},{"id":"g3_daofa_014","chapter":"第三单元 文明与家园","name":"共筑生命家园","formula":"坚持人与自然和谐共生，走绿色发展道路","explanation":"【坚持人与自然和谐共生】\n1. 追求人与自然和谐共生，是人类面对生态危机作出的智慧选择。\n2. 自然为人类的生存与发展提供滋养和必要条件；人类作为自然的一部分，也有责任避免自然受到不必要的伤害，同时要为开发和利用自然作出必要的补偿和修复。\n3. 人与自然相互依存，共生共荣。这是一种动态中的平衡、发展中的协调、进取中的有度、多元中的一致、\"纷乱\"中的有序。\n4. 人类开发和利用自然，但不能肆意凌驾于自然之上，必须遵循自然规律。\n5. 实现人与自然和谐发展，建设生态文明，要以资源环境承载能力为基础，以自然规律为准则，以可持续发展、人与自然和谐共生为目标。\n6. 建设生态文明，促进人与自然和谐共生，要坚持节约资源和保护环境的基本国策，使青山常在、绿水长流、空气常新；坚持创新、协调、绿色、开放、共享的发展理念，实现中华民族永续发展。\n\n【坚持绿色发展道路】\n1. 走绿色发展道路，建设生态文明，实现可持续发展，已经成为当代中国的发展共识。\n2. 坚持走绿色发展道路，要处理好经济发展与生态环境保护的关系。我们既要绿水青山，也要金山银山。如果金山银山要以失去绿水青山为代价，那么宁要绿水青山，不要金山银山。绿水青山就是金山银山。\n3. 走绿色发展道路，坚持绿色富国，让人民群众切实感受到经济发展带来的环境效益。\n4. 走绿色、循环、低碳发展之路，要坚持节约优先、保护优先、自然恢复的原则，大力倡导节能、环保、低碳、文明的绿色生产生活方式。\n5. 建设生态文明，必须严守资源消耗上限、环境质量底线、生态保护红线。","semester":"upper"},{"id":"g3_daofa_015","chapter":"第四单元 和谐与梦想","name":"促进民族团结","formula":"我国是统一的多民族国家，坚持民族区域自治制度","explanation":"【民族大家庭】\n1. 我国是统一的多民族国家。五十六个民族组成了中华民族大家庭。\n2. 在漫长的历史发展过程中，我国逐步形成以汉族为主体，大杂居、小聚居、交错杂居的民族分布特点。\n3. 新中国成立后，在处理民族关系上，我国坚持民族平等、民族团结和各民族共同繁荣的基本原则，将民族区域自治制度作为一项基本政治制度载入宪法和法律，各族人民真正成了国家的主人，在此基础上，形成了平等团结互助和谐的社会主义新型民族关系。\n4. 加强和巩固民族团结，维护祖国统一，是中华民族的最高利益。\n\n【家和万事兴】\n1. 新中国成立以来，我国经济社会状况得到很大改善。\n2. 加快民族地区经济社会文化发展，逐步缩小发展差距，促进民族地区共同繁荣，是增进民族团结、发展社会主义民族关系的必由之路。\n3. 长期以来，党和国家在人力、物力、财力等方面大力支持民族地区的经济社会发展。\n4. 国家支持民族地区发展教育，实施积极的就业政策，初步建立基本医疗保障制度，从而促进民族关系更加融洽，社会更加和谐稳定，人民群众有更多的获得感。\n5. 没有各民族文化的发展，就没有中华民族文化的繁荣。国家大力扶持少数民族文化的保护、继承、创新和发展工作，积极促进各民族之间的文化交流，使少数民族文化获得前所未有的发展。\n6. 维护和促进民族团结，是每个公民的神圣职责和光荣义务。","semester":"upper"},{"id":"g3_daofa_016","chapter":"第四单元 和谐与梦想","name":"维护祖国统一","formula":"实现祖国完全统一，是中华民族的根本利益所在","explanation":"【反对分裂】\n1. 分裂会导致社会动荡、经济发展停滞不前，各族人民就会遭殃。\n2. 一切破坏民族团结、制造民族分裂的行为都将受到法律的制裁。\n3. 维护国家统一，反对分裂，是爱国主义精神的具体体现，是每个公民义不容辞的责任。\n4. 反对分裂，就要维护国家统一、国家主权和领土完整。\n5. 反对分裂，就要反对一切形式的民族分裂活动，尤其要坚决反对借民族和宗教之名搞暴力恐怖活动。\n6. 反对分裂，就要维护国家安全。国家安全是安邦定国的重要基石。国泰民安是人民群众最基本、最普遍的愿望。\n\n【\"一国两制\"】\n1. \"一个国家，两种制度\"，简称为\"一国两制\"。\"一个国家\"，是指中国是统一的国家，主权和领土不容分割。\"两种制度\"是指在坚持一个中国的前提下，国家的主体坚持社会主义制度，香港、澳门、台湾保持原有的资本主义制度和生活方式长期不变，实行高度自治。\n2. 香港、澳门回归祖国以来，\"一国两制\"实践取得举世公认的成功。\n3. 解决台湾问题、实现祖国完全统一，是全体中华儿女共同愿望，是中华民族根本利益所在。\n4. \"和平统一、一国两制\"是解决台湾问题的基本方针，也是实现国家统一的最佳方式。\n5. 一个中国原则是两岸关系的政治基础，必须坚持\"九二共识\"、坚决反对\"台独\"。\n6. 两岸同胞同根同源、同文同种，是命运与共的骨肉兄弟，是血浓于水的一家人。","semester":"upper"},{"id":"g3_daofa_017","chapter":"第四单元 和谐与梦想","name":"我们的梦想","formula":"实现中华民族伟大复兴是近代以来中华民族最伟大的梦想","explanation":"【民族复兴梦】\n1. 梦想是对美好生活的向往，有梦就有前行的力量。千百年来，中华民族夙兴夜寐，执着地追求实现小康、过幸福生活的社会梦想。\n2. 实现中华民族伟大复兴是近代以来中华民族最伟大的梦想。\n3. 中国梦反映了近代以来一代又一代中国人的美好夙愿，揭示了中华民族的历史命运和当代中国的发展走向，指明了全国各族人民共同的奋斗目标。实现中国梦，就是要实现国家富强、民族振兴、人民幸福。\n4. 实现中华民族伟大复兴，体现了中华民族和中国人民的整体利益，是国家的梦、民族的梦，也是每个中国人的梦。\n\n【新时代 新征程】\n1. 改革开放以来，中国共产党领导全国各族人民在建设中国特色社会主义伟大事业的征程上不断取得新的伟大成就。\n2. 经过长期努力，中国特色社会主义进入了新时代，这是我国发展新的历史方位。\n3. 进入新时代，我国各族人民在中国共产党领导下，在马克思列宁主义、毛泽东思想、邓小平理论、\"三个代表\"重要思想、科学发展观、习近平新时代中国特色社会主义思想的指引下，全面擘画中国特色社会主义的伟大事业。\n4. 在新世纪新时代，我国经济和社会发展的战略目标是，到建党一百年时，全面建成小康社会；到新中国成立一百年时，全面建成社会主义现代化强国。\n5. 从2020年到本世纪中叶可以分两个阶段。第一个阶段，从2020年到2035年，在全面建成小康社会的基础上，基本实现社会主义现代化。第二个阶段，从2035年到本世纪中叶，在基本实现现代化的基础上，把我国建成富强民主文明和谐美丽的社会主义现代化强国。","semester":"upper"},{"id":"g3_daofa_018","chapter":"第四单元 和谐与梦想","name":"中国人 中国梦","formula":"实现中国梦必须坚持党的领导，走中国道路，弘扬中国精神，凝聚中国力量","explanation":"【圆梦大舞台】\n1. 中国的腾飞为实现中国梦提供了最好的历史机遇。现在，我们比历史上任何时期都更接近中华民族伟大复兴的目标，比历史上任何时期都更有信心、更有能力实现这个目标。\n2. 实现中华民族伟大复兴的中国梦，必须坚持党的领导，贯彻创新、协调、绿色、开放、共享的发展理念，统筹推进经济建设、政治建设、文化建设、社会建设、生态文明建设，协调推进全面建成小康社会、全面深化改革、全面依法治国、全面从严治党。\n3. 实现中国梦必须走中国道路。中国道路就是中国特色社会主义道路。\n4. 实现中国梦必须弘扬中国精神。中国精神就是以爱国主义为核心的民族精神和以改革创新为核心的时代精神。\n5. 实现中国梦必须凝聚中国力量。中国力量就是全国各族人民大团结的力量。\n\n【自信的中国人】\n1. 改革开放以来，中国共产党领导中国人民开辟了中国特色社会主义道路，形成了中国特色社会主义理论体系，建立了中国特色社会主义制度，发展了中国特色社会主义文化。这是中国自信、民族自信的根本所在。\n2. 在党的领导下，中国特色社会主义伟大事业不断取得新的成就，国家富强、民族振兴让中国人更加自信。\n3. 自信的中国人对国家有认同。\n4. 自信的中国人对文化有底气。\n5. 自信的中国人对发展有信心。\n6. 自信不是妄自尊大，也不是故步自封。我们需要培育理性平和、不卑不亢、开放包容的心态。\n7. 自信的中国人既是梦想家又是实干家，既要胸怀理想又要求真务实，既要满怀激情又要锲而不舍。","semester":"upper"},{"id":"g3_daofa_019","chapter":"第一单元 富强与创新","name":"建设现代化经济体系","formula":"我国经济已由高速增长阶段转向高质量发展阶段","explanation":"【经济发展新常态】\n1. 我国经济发展进入新常态，已由高速增长阶段转向高质量发展阶段。\n2. 高质量发展，是体现新发展理念的发展，是创新成为第一动力、协调成为内生特点、绿色成为普遍形态、开放成为必由之路、共享成为根本目的的发展。\n3. 推动高质量发展，就要建设现代化经济体系，这是我国发展的战略目标。\n\n【建设现代化经济体系】\n1. 建设现代化经济体系，必须坚持质量第一、效益优先，以供给侧结构性改革为主线，推动经济发展质量变革、效率变革、动力变革，提高全要素生产率。\n2. 要着力加快建设实体经济、科技创新、现代金融、人力资源协同发展的产业体系。\n3. 要着力构建市场机制有效、微观主体有活力、宏观调控有度的经济体制。\n4. 要实施乡村振兴战略和区域协调发展战略，推动城乡区域协调发展。\n\n【全面深化改革】\n1. 改革开放是当代中国最鲜明的特色。改革只有进行时，没有完成时。\n2. 只有全社会不断弘扬与时俱进、锐意进取、勤于探索、勇于实践的改革创新精神，继续自强不息、自我革新，才能持续推动全面深化改革的历史进程，才能奏响中国走向繁荣富强的最强音！","semester":"upper"},{"id":"g3_daofa_020","chapter":"第三单元 文明与家园","name":"守望精神家园","formula":"传承中华优秀传统文化，弘扬民族精神，践行社会主义核心价值观","explanation":"【中华文化的力量】\n1. 中华文化积淀着中华民族最深层的精神追求，代表着中华民族独特的精神标识，为中华民族的伟大复兴提供精神动力。\n2. 中华文化独一无二的理念、智慧、气度、神韵，增添了中国人民和中华民族内心深处的自信和自豪。\n\n【文化自信】\n1. 文化自信是对自身文化价值的充分肯定，是对自身文化生命力的坚定信念，是一个国家、一个民族发展中更基本、更深沉、更持久的力量。\n2. 中国人民的文化自信不仅来自于中华优秀传统文化的积淀、传承与创新、发展，更来自于当今中国特色社会主义的蓬勃生机，来自于实现中国梦的光明前景。\n3. 坚定文化自信，事关国运兴衰、文化安全和民族精神的传承发展。\n4. 增强文化自信，既要夯实优秀传统文化根基，薪火相传，代代守护；又要在日新月异的社会生活中与时俱进，实现创造性转化、创新性发展；还要跨越时空展示中华文化的独特魅力，在交流互鉴中丰富发展。\n\n【践行社会主义核心价值观】\n1. 培育和践行社会主义核心价值观，要与日常生活紧密联系起来，做到落细、落小、落实。\n2. 青少年处在价值观形成的关键时期，\"人生的扣子从一开始就要扣好\"，我们应自觉做到勤于学习、敏于思考，注重修养、勇于实践，明辨是非、善于选择，认真做事、踏实做人。","semester":"upper"},{"id":"g3_daofa_021","chapter":"第一单元 我们共同的世界","name":"开放互动的世界","formula":"当今世界是一个开放的、发展的、紧密联系的世界","explanation":"【共同的家园】\n1. 当今世界是一个开放的世界。国家间相互开放的程度不断加深，在政治、经济、文化各领域的开放范围也在不断扩展。\n2. 当今世界是一个发展的世界。新技术、新经济、新业态不断涌现并蓬勃发展，世界正经历着新一轮大发展大变革大调整。\n3. 当今世界是一个紧密联系的世界。现代交通、通信、贸易把全球各地的国家、人们联系在一起，彼此影响，休戚相关。\n\n【放眼全球经济】\n1. 经济全球化促进商品、资本和劳动力在全球流动，有利于在世界范围内配置资源，促进资源利用更加合理有效。\n2. 经济全球化也使各国经济相互联系、相互依赖的程度不断加深。\n3. 经济全球化，一方面为经济发展提供了新的机会，另一方面也使风险与危机跨国界传递。\n4. 面对经济全球化，我们既要顺应历史潮流，保持积极、开放的心态，主动参与竞争，也要居安思危，增强风险意识，注重国家经济安全，为应对各种困难和挑战做好充分准备。\n\n【共享多样文化】\n1. 同住地球村，我们有机会和途径接触各具特色的文化。\n2. 文化多样性是人类社会的基本特征，是世界文化充满活力的表现，也是人类文明进步的重要动力。\n3. 文化多样性是实现文化创新与发展的前提和基础。\n4. 每个民族的文化都是独特的，都有其存在的价值，都有值得尊重的经验和智慧。\n5. 面对多样的文化，各国应当用开放和包容的心态，学习和借鉴优秀外来文化，促进和而不同、兼收并蓄的文明交流。","semester":"lower"},{"id":"g3_daofa_022","chapter":"第一单元 我们共同的世界","name":"构建人类命运共同体","formula":"构建人类命运共同体，应对全球性问题","explanation":"【推动和平与发展】\n1. 和平与发展是当今时代的主题。\n2. 二战后，饱受战争之苦的各国人民深深感受到和平发展的可贵。\n3. 当今世界，人们越来越致力于以和平谈判代替武力解决争端。\n4. 世界整体上维持和平的态势，但战争的阴影从未远离。局部战争与冲突从未间断，霸权主义、民族问题、宗教冲突、领土争端和恐怖主义等威胁和平的种种因素依然存在。\n5. 驱散战争的阴影、维护世界和平需要每个人的努力。\n6. 消除贫困，让人们都过上幸福的生活，平等和有尊严地在健康的环境中充分发挥每个人的潜能，与自然和谐共生，建设和平、公正、包容的社会，是当今人类必须共同面对的发展课题。\n\n【谋求互利共赢】\n1. 当今世界，各国相互联系、相互依存的程度空前加深。\n2. 人类面临许多共同挑战，需要解决许多全球性问题。\n3. 没有哪个国家能够独自应对人类面临的各种挑战，也没有哪个国家能够退回到自我封闭的孤岛。\n4. 采取共同行动，承担共同责任，构建人类命运共同体，应成为各国解决全球性问题的必然选择。\n5. 构建人类命运共同体，各国要努力扩大利益的交汇点，谋求开放创新、包容互惠的发展前景。\n6. 构建人类命运共同体，不仅需要世界各国的一致行动，而且需要各国人民间的相互信任、守望相助和共同担当。","semester":"lower"},{"id":"g3_daofa_023","chapter":"第一单元 我们共同的世界","name":"世界多极化","formula":"世界多极化深入发展，国际力量对比更趋平衡","explanation":"【变化中的世界格局】\n1. 历史的车轮滚滚向前。冷战结束后，美国和苏联两个超级大国主导的旧的世界格局消失，世界进入多极化时代。\n2. 世界正处于大发展大变革大调整时期。世界多极化、经济全球化、社会信息化、文化多样化深入发展。\n3. 全球治理体系和国际秩序变革加速推进，各国相互联系和依存程度日益加深，国际力量对比更趋平衡，和平发展大势不可逆转。\n4. 一些新兴经济体和发展中国家快速发展，经济实力、国际地位和国际影响力不断增强，有利于推动世界多极化，为世界经济持续发展提供动力，促进世界经济增长，实现各国共同发展。\n\n【调整中的国家关系】\n1. 随着科技的进步，人类的脚步越走越远，国与国之间的交往越来越频繁。\n2. 在经济全球化与世界多极化的进程中，各国在经济、政治、安全、文化等领域深化合作，寻求发展。\n3. 国家间既有合作，又有竞争。当今世界，国际竞争的实质是以经济和科技实力为基础的综合国力的较量。\n4. 国际竞争需要各方共同遵循一定的国际规则。\n5. 世界不断发生变化，各国之间的力量对比、利益关系也在改变。尽管国际形势缓和的大趋势没有改变，但各种矛盾相互交织，各种力量重新分化组合，各类冲突事件不断发生，考验着国与国之间的关系，整个世界复杂多变。\n6. 我国高举和平、发展、合作、共赢的旗帜，为推动建设相互尊重、公平正义、合作共赢的新型国际关系作着不懈的努力。","semester":"lower"},{"id":"g3_daofa_024","chapter":"第一单元 我们共同的世界","name":"国际组织","formula":"联合国是最具代表性的世界性国际组织，WTO是重要的经济组织","explanation":"【国际组织概览】\n1. 国际组织是具有国际性行为特征的组织，是两个或两个以上国家（或其他国际法主体）为实现共同的政治经济目的，依据其缔结的条约或其他正式法律文件建立的有一定规章制度的常设性机构。\n2. 国际组织按照成员性质可以分为政府间国际组织和非政府间国际组织；按照地理范围可以分为世界性国际组织和区域性国际组织；按照职能范围可以分为一般性国际组织和专门性国际组织。\n\n【联合国】\n1. 联合国是人类构建世界和平的成果，也是影响最大的国际组织。\n2. 联合国的宗旨是维护国际和平与安全，促进国际合作与发展。\n3. 联合国在维护世界和平、推动共同发展、促进人类文明进步等方面发挥了重要作用，取得了巨大成就。\n4. 联合国安理会担负着维护国际和平与安全的主要责任。\n\n【世界贸易组织（WTO）】\n1. 世界贸易组织是当代最重要的国际经济组织之一，拥有164个成员，成员贸易总额达到全球的98%，有\"经济联合国\"之称。\n2. 世界贸易组织的宗旨是促进世界经济发展和福利进步，主张贸易自由与公平。\n3. 加入世界贸易组织，有利于扩大对外开放，为我国赢得更好的国际环境；有利于促进经济体制改革和经济结构战略性调整，增强我国经济发展活力和国际竞争力。","semester":"lower"},{"id":"g3_daofa_025","chapter":"第一单元 我们共同的世界","name":"经济全球化","formula":"经济全球化是世界经济发展的必然趋势，机遇与挑战并存","explanation":"【经济全球化的表现】\n1. 经济全球化是指商品、劳务、技术、资金在全球范围内流动和配置，使各国经济日益相互依赖、相互联系的趋势。\n2. 经济全球化的表现是多方面的，其中主要是生产全球化、贸易全球化和资本全球化。\n3. 跨国公司的迅速发展为经济全球化提供了强有力的载体。\n\n【经济全球化的影响】\n1. 经济全球化是生产力发展的产物，又推动生产力的发展。它促进了生产要素在全球范围内的流动、国际分工水平的提高以及国际贸易的迅速发展，从而推动了世界范围内资源配置效率的提高、各国生产力的发展，为各国经济提供了更加广阔的发展空间。\n2. 经济全球化使世界各国的经济联系在一起，这在促进各国经济合作的同时，也使得一个国家的经济波动可能殃及他国，甚至影响全世界，加剧全球经济的不稳定性，尤其对发展中国家的经济安全构成极大的威胁。\n3. 经济全球化的大方向是正确的，同时也存在着发展失衡、治理困境、数字鸿沟、公平赤字等问题。这些都是前进中的问题，需要正视并设法解决。\n\n【应对经济全球化】\n1. 对广大发展中国家来说，经济全球化是一把\"双刃剑\"，既是机遇，也是挑战。\n2. 在经济全球化趋势面前，任何国家都无法置身事外。我们应当抓住机遇，积极参与，趋利避害；同时，提高抵御国际经济风险能力，勇敢地迎接挑战。\n3. 中国将继续深入参与经济全球化进程，推动经济全球化朝着更加开放、包容、普惠、平衡、共赢的方向发展。","semester":"lower"},{"id":"g3_daofa_026","chapter":"第二单元 世界舞台上的中国","name":"中国担当","formula":"中国积极主动地承担起相应的责任，做负责任的大国","explanation":"【积极有作为】\n1. 当今世界并不太平，危机与灾难时常出现。面对各种区域性和全球性的危机与难题，中国不推诿、不逃避，也不依赖他人，积极主动地承担起相应的责任。\n2. 中国全方位参与全球治理，在有关世界和平与发展的各个领域，积极采取行动。\n3. 作为世界上最大的发展中国家，中国用有限的资源，在较短的时间内实现本国经济的快速发展，基本解决了世界上约五分之一人口的温饱问题，让七亿多人口摆脱贫困，这是对世界发展的重大贡献。\n4. 作为一个负责任的大国，中国努力提高自身在国际上的影响力、感召力和塑造力，致力于成为世界和平的建设者、全球发展的贡献者、国际秩序的维护者。\n\n【贡献中国智慧】\n1. 当今世界的发展，需要新思路与大智慧的引领。\n2. 中国着眼于时代发展大势，遵循共商共建共享原则，为全球治理提出中国方案，贡献中国智慧。\n3. 中国广泛参与国际事务，在承担责任中不断积累经验，提升能力，增长智慧。\n4. 在解决人类面临的各种问题的过程中积极探索、有效行动，发挥负责任大国作用，促进人类社会共同发展。\n5. 中国在推动国际秩序朝着更加公正合理的方向发展，更好维护我国和广大发展中国家共同利益的同时，坚持以经济建设为中心，集中力量办好自己的事情，不断增强我们在国际上说话办事的实力。\n6. 我们积极参与全球治理，主动承担国际责任，既尽力而为，又量力而行。","semester":"lower"},{"id":"g3_daofa_027","chapter":"第二单元 世界舞台上的中国","name":"与世界深度互动","formula":"中国对世界的影响越来越大，中国在互动中发展","explanation":"【中国的影响】\n1. 随着中国的发展，中国文化对世界的影响越来越大。在中国与其他国家的深度互动中，外国人有更多的机会、更强烈的意愿，接触、体验和认识中国文化，感受中国文化的魅力，接受中国文化的熏陶。\n2. 中国正为世界经济增长注入新的活力。中国向世界其他国家出口物美价廉、丰富多样的日常生活用品；为越来越多的国家提供更多更好的技术和设备；通过向国外投资，帮助急需发展资金的国家把握发展机遇……中国日益成为世界经济发展的引擎与稳定器。\n3. 中国是世界格局中的重要力量，正以新的发展理念、务实的行动推动着构建人类命运共同体的伟大进程。\n4. 中国秉持\"和而不同\"的思想以及共商共建共享的全球治理观，倡导国际关系民主化，坚持国家不分大小、强弱、贫富一律平等，使世界向着公平公正、多元共治、包容有序的格局发展。\n5. 中国关于构建全球治理体系的探索与实践，为人类思考与建设未来提供了新的路径，得到广泛认同，越来越多的国家参与其中，共同行动，这将对世界的和平与发展产生深远的影响。\n\n【兼收并蓄 交流互鉴】\n1. 文明包含着人类在认识世界、改造世界的过程中积累的宝贵经验，是世界各国各民族对人类作出的不可磨灭的贡献。\n2. 中华文明在交流互鉴中发展。中华文明是在中国大地上产生的文明，也是同其他文明不断交流互鉴而形成的文明。\n3. 中国积极主动地与世界各国交往，从不同文明中寻求智慧、汲取营养，不仅有助于自身文明的发展，而且能够推动世界文明的进步，与其他文明携手解决人类共同面临的各种问题。\n4. 文明因交流而多彩，文明因互鉴而丰富。\n5. 我们要学习和借鉴人类文明的一切优秀成果，坚持以我为主，兼收并蓄。","semester":"lower"},{"id":"g3_daofa_028","chapter":"第二单元 世界舞台上的中国","name":"中国的机遇与挑战","formula":"机遇与挑战并存，我们要抓住机遇、迎接挑战","explanation":"【新的发展契机】\n1. 今天的中国，百业俱兴，政通人和，社会稳定，综合国力不断提升，面临新的发展契机。\n2. 经过几十年的发展，中国已在资金、人才、技术、管理经验、基础设施等领域具备良好的积累，为经济发展从\"中国制造\"向\"中国智造\"转型奠定了良好的基础。\n3. 和平、发展、合作、共赢的时代潮流越来越强劲，为我国的发展提供了良好的外部环境。\n4. 中国的国际影响力不断提升，在经济合作、全球治理等多个领域发挥的引领作用越来越大。\n5. 机遇稍纵即逝。抓住机遇，勇于创新，发展就能再上新台阶；坐等观望，犹豫懈怠，往往错失良机，陷于被动。\n\n【新风险 新挑战】\n1. 近年来，受全球经济大环境的影响，中国经济面临一定的下行压力和不少困难，几十年高速发展所积累的一些矛盾与风险也逐渐暴露出来，急需得到稳妥处理与解决。\n2. 随着国家经济发展和劳动力素质的提高，人们的收入不断增长。这一方面提高了人民的生活水平，另一方面使企业劳动力成本上升。为降低制造成本，一些传统制造企业将工厂迁往劳动力成本更低的国家和地区，\"中国制造\"在新的历史条件下需要转型升级。\n3. 复杂多变的国际形势，给中国\"走出去\"发展战略带来发展机遇的同时，也带来了各种挑战。\n4. 挑战与机遇并存，困难与希望同在。综观国际国内形势，我国的发展仍处于重要战略机遇期。我们要审时度势，顺势而为，赢得主动。","semester":"lower"},{"id":"g3_daofa_029","chapter":"第二单元 世界舞台上的中国","name":"携手促发展","formula":"中国积极谋求自身发展，促进世界共同发展","explanation":"【积极谋求发展】\n1. 当今世界，科学技术日新月异，全球竞争不断升级。时不我待，中国要把握世界的发展趋势，积极谋求自身发展，提高国际竞争力。\n2. 促进发展，要把提升发展质量放在首位。中国正在加快建设制造强国的步伐，发展先进制造业，推动传统产业优化升级，从而进一步提升我国在全球分工中的地位。\n3. 促进发展，要积极寻求新的经济增长点。生物科技、新能源、新材料、空间技术、人工智能等全球性技术创新与新兴产业蓬勃兴起，中国正努力抢占全球技术创新与新兴产业的发展制高点，培育壮大经济发展新动能。\n4. 促进发展，要以更加开放的态度积极参与全球规则制定。\n\n【共享发展机遇】\n1. 中国在谋求自身发展的同时，一直坚持合作共赢的理念，主张在全球发展中要集思广益、各施所长、各尽所能，让发展的成果更多更公平地惠及各个国家。\n2. 中国重视与相关国家和地区的合作，致力于共同建设一个繁荣的世界。\n3. 中国的发展为世界各国提供了更广阔的市场、更充足的资本、更丰富的产品、更宝贵的合作契机。\n4. 中国与世界各国分享发展机遇，共享发展成果。\n5. 中国人民愿同各国人民一道，共同开辟人类更加繁荣、更加安宁的美好未来。","semester":"lower"},{"id":"g3_daofa_030","chapter":"第二单元 世界舞台上的中国","name":"一带一路","formula":"\"一带一路\"倡议是构建人类命运共同体的重要实践平台","explanation":"【\"一带一路\"的提出】\n1. \"一带一路\"是\"丝绸之路经济带\"和\"21世纪海上丝绸之路\"的简称。\n2. 2013年9月和10月，中国国家主席习近平分别提出建设\"新丝绸之路经济带\"和\"21世纪海上丝绸之路\"的合作倡议。\n3. \"一带一路\"倡议借用古代丝绸之路的历史符号，高举和平发展的旗帜，积极发展与沿线国家的经济合作伙伴关系，共同打造政治互信、经济融合、文化包容的利益共同体、命运共同体和责任共同体。\n\n【\"一带一路\"的意义】\n1. \"一带一路\"倡议顺应了时代要求和各国加快发展的愿望，提供了一个包容性巨大的发展平台，具有深厚历史渊源和人文基础，能够把快速发展的中国经济同沿线国家的利益结合起来。\n2. \"一带一路\"建设是我国在新的历史条件下实行全方位对外开放的重大举措、推行互利共赢的重要平台。\n3. \"一带一路\"倡议为世界经济增长开辟了新空间，为国际贸易和投资搭建了新平台，为完善全球经济治理拓展了新实践，为增进各国民生福祉作出了新贡献，成为共同的机遇之路、繁荣之路。\n4. \"一带一路\"倡议是构建人类命运共同体的重要实践平台。\n\n【共建\"一带一路\"】\n1. 共建\"一带一路\"，秉持共商共建共享原则，倡导多边主义，大家的事大家商量着办，推动各方各施所长、各尽所能。\n2. 共建\"一带一路\"，顺应了全球治理体系变革的内在要求，彰显了同舟共济、权责共担的命运共同体意识，为完善全球治理体系变革提供了新思路新方案。","semester":"lower"},{"id":"g3_daofa_031","chapter":"第三单元 走向未来的少年","name":"少年的担当","formula":"青少年要担当起时代赋予的历史使命","explanation":"【走向世界大舞台】\n1. 我们与丰富多彩的世界紧密相连，始终与这个世界彼此互动，同呼吸，共命运。\n2. 每个人都是这个世界中的一员，所做的事都有可能对世界发展产生影响。\n3. 我们要从普通的事做起，通过自身的努力为人类发展和世界进步贡献智慧和力量。\n4. 着眼未来，我们要适应世界发展趋势要求，全面提升个人素养：不断丰富知识储备，增强人文底蕴；树立科学精神，掌握科学思维方法；增强社会责任感，学会观察、思考各种社会现象，积极参与社会实践活动，培养实践创新能力。\n\n【少年当自强】\n1. 个人的命运与国家的命运息息相关，个人的未来与民族的未来紧密相连。\n2. 青年兴则国家兴，青年强则国家强。青年一代有理想、有本领、有担当，国家就有前途，民族就有希望。\n3. 实现中华民族伟大复兴的中国梦，需要一代又一代有志青少年接续奋斗，我们必将站到时代的潮头。\n4. 要为建设祖国做好准备。我们要坚定理想信念，志存高远，脚踏实地，勇做时代的弄潮儿，努力在实现中国梦的伟大实践中建功立业，创造自己精彩的人生。\n5. 青少年承载着国家和民族的未来命运。青少年的品格影响着国家未来发展。\n6. 我们要传承、发扬中华民族的优秀传统文化，增强爱国情感，弘扬民族精神和时代精神，践行社会主义核心价值观，并将其转化为自己的情感认同和行为习惯，做有自信、懂自尊、能自强的中国人，成为中华民族的栋梁。","semester":"lower"},{"id":"g3_daofa_032","chapter":"第三单元 走向未来的少年","name":"我的毕业季","formula":"正视毕业，学会合理选择，在实践中学习","explanation":"【学无止境】\n1. 我们面临毕业，就要结束初中的学习历程，走向更广阔的天地。\n2. 面对当下的校园学习生活，我们要高度重视、积极投入，尤其要正确面对可能出现的困难和压力，调整心态，完成学习任务。\n3. 九年级除了学习新的知识，还要对以往学习进行总结梳理，这对我们的学习方法、学习能力和学习品质提出了更高的要求。\n4. 人类正是通过学习来增长知识、提高本领，并在创新中不断进步的。学习对青少年来说既是权利，也是责任和义务，更是适应未来社会需要所必备的一种能力。因此，学习应该成为我们的一种生活方式。\n5. 我们不仅要重视书本知识的学习，而且要坚持在实践中学习。实践出真知。\n6. 学习是一个长期的过程，学校学习只是其中的一个阶段，不可急功近利，也不能坐失良机。\n7. 我们生活的时代信息量巨大，知识更新周期缩短，实践中的问题层出不穷，必须树立终身学习的理念，养成主动学习、不断探索的习惯，增强自我更新、学以致用的能力。\n\n【多彩的职业】\n1. 丰富多彩的职业为我们提供了多样化的选择。\n2. 现代社会，丰富多彩的职业为我们提供了多样化的选择。\n3. 从事一定的职业，这是社会分工的要求，也是个人为社会作贡献、实现人生价值的基本路径。\n4. 国家发展、民族振兴需要各种各样的职业。\n5. 在经济全球化时代，社会分工逐渐细化，引起传统职业的变革和新兴职业的兴起。职业选择越来越丰富，发展空间越来越广阔，这给我们带来更多的就业机会和挑战。\n6. 今天，人们的就业方式越来越多样。\n7. 我们要顺应时代的变化，抓住机遇，做好多方面的准备，努力提升自身素质，迎接未来世界的挑战。","semester":"lower"},{"id":"g3_daofa_033","chapter":"第三单元 走向未来的少年","name":"从这里出发","formula":"回望成长历程，畅想未来，踏上新征程","explanation":"【回望成长】\n1. 日月如梭，我们即将完成初中学习生活，开启人生新起点。在这三年里，我们有欢乐，也有泪水；有收获，也有遗憾。\n2. 初中三年，我们在学海中泛舟，掌握越来越多的知识；我们参加丰富多彩的实践活动，学会做人，学会做事；我们结交一群志同道合的朋友，在成长的路上互帮互助，风雨同行；我们不断修炼自己的道德操守，提高自己的法治意识，坚持与德并进，与法同行；我们逐步树立全球视野，主动思考人类的前途命运。\n3. \"知人者智，自知者明。\"初中三年，我们有过迷茫、彷徨、忧虑，但始终勇敢面对，奋力前行。我们学会反思，总结成功的经验和失败的教训，每天都在进步。\n4. 结果很重要，过程同样重要。过程中的种种经历，无论顺利还是曲折，都是我们成长的重要积累，也是人生的宝贵财富。在过程中所获得的体验与感悟，才是真正有意义的学习收获。\n\n【走向未来】\n1. 未来，无论身在何处、走向何方，我们都需要努力奋斗，实现自己的人生价值。\n2. 畅想未来是为了丰富自己的生命，提升生命的质量，延展生命的宽度，更是为了很好地服务社会和国家。\n3. 畅想未来需要开阔的视野，把自己的爱好、需求与国家的发展、世界的繁荣、人类的梦想相结合。\n4. 畅想未来不是仅仅预设未来上什么学校，从事什么工作，而是要激发兴趣，大胆尝试，积极行动，不断地反思自己，全面规划有意义的人生。\n5. 面向未来，既需要对未来有美好的憧憬，也需要有脚踏实地的行动。我们不仅要正确理解自己的人生规划，而且要积极关切国家和民族的发展，关注人类与世界发展的前途和命运，在学习和实践中走向未来。\n6. 时代给我们提供了一个展示才华的广阔舞台，我们要做好准备，抓住机会，还要善于创造机会，成就自己。\n7. 我们正处在追逐梦想、实现梦想的新时代，实现中华民族伟大复兴的中国梦，需要一代又一代有志青少年接力奋斗，我们必将站到时代的潮头。","semester":"lower"},{"id":"g3_daofa_034","chapter":"第三单元 走向未来的少年","name":"终身学习","formula":"树立终身学习的理念，适应不断发展的社会","explanation":"【终身学习的必要性】\n1. 我们生活的时代信息量巨大，知识更新周期缩短，实践中的问题层出不穷，必须树立终身学习的理念。\n2. 终身学习是指社会每个成员为适应社会发展和实现个体发展的需要，贯穿于人的一生的，持续的学习过程。\n3. 终身学习是当代社会发展的必然趋势，是人类生存发展的必然要求。\n4. 面对知识经济时代，我们只有树立终身学习的观念，具备终身学习的能力，才能应对未来社会的挑战，肩负起民族复兴的使命。\n\n【终身学习的重要性】\n1. 终身学习，能使我们克服工作中的困难，解决工作中的新问题。\n2. 终身学习，能满足我们生存和发展的需要。\n3. 终身学习，能使我们得到更大的发展空间，更好地实现自身价值。\n4. 终身学习，能充实我们的精神生活，不断提高生活品质。\n5. 终身学习既是个人可持续发展的要求，也是社会发展的必然要求。\n\n【培养终身学习的习惯】\n1. 养成主动学习的习惯。主动学习就是要自觉、主动地去学习，而不是被动地接受知识。\n2. 养成持续学习的习惯。学习是一个长期的过程，不能半途而废。\n3. 养成在实践中学习的习惯。实践出真知，要在实践中学习，在学习中实践。\n4. 养成不断探索的习惯。要勇于探索未知领域，不断开拓新的知识边界。\n5. 养成学以致用的习惯。学习的目的在于应用，要把学到的知识运用到实际生活中去。","semester":"lower"},{"id":"g3_daofa_035","chapter":"第三单元 走向未来的少年","name":"规划人生","formula":"做好人生规划，实现人生价值","explanation":"【人生规划的意义】\n1. 人生需要规划。有了人生规划，我们才能明确方向，更好地实现人生价值。\n2. 科学的人生规划，能够帮助我们正确认识自己，发挥自身优势，开发自身潜能，不断提高自身素质。\n3. 科学的人生规划，能够帮助我们树立正确的人生目标，避免人生道路上的盲目性，少走弯路。\n\n【如何进行人生规划】\n1. 了解自己。了解自己的兴趣爱好、个性特长、能力水平、道德品质等，这是进行人生规划的前提。\n2. 了解社会。了解社会发展趋势、社会需求、职业要求等，这是进行人生规划的基础。\n3. 确定目标。根据自身特点和社会需求，确定人生的总目标和阶段性目标。\n4. 制定计划。围绕目标，制定切实可行的实施计划。\n5. 不断调整。人生规划不是一成不变的，要根据实际情况及时调整和完善。\n\n【实现人生价值】\n1. 生命的价值不在于长短，而在于对社会的贡献。\n2. 一个人的人生价值是通过他对自我、他人、集体、社会的合理需要的满足和贡献来体现的。\n3. 我们要在劳动和奉献中创造价值，在个人与社会的统一中实现价值，在砥砺自我中走向成功。\n4. 实现人生价值，需要充分发挥主观能动性，需要顽强拼搏、自强不息的精神；需要努力发展自己的才能，全面提高个人素质；需要有坚定的理想信念，需要正确价值观的指引。","semester":"lower"},{"id":"g3_daofa_036","chapter":"第一单元 我们共同的世界","name":"维护世界和平","formula":"和平与发展是时代主题，要珍惜和平，推动共同发展","explanation":"【维护世界和平的原因】\n1. 战争让人类付出了惨痛代价，给人类带来的伤痛难以忘却。\n2. 第二次世界大战后，饱受战争之苦的各国人民深深感受到和平发展的可贵。\n3. 世界上维护和平的力量不断壮大，和平与发展成为时代的主题。\n\n【威胁和平的因素】\n1. 世界整体上维持和平的态势，但战争的阴影从未远离。\n2. 局部战争与冲突从未间断，霸权主义、民族问题、宗教冲突、领土争端和恐怖主义等威胁和平的种种因素依然存在。\n3. 恐怖主义日益成为威胁世界和平的重要因素。恐怖主义违背人类的道义和规则，严重威胁普通民众的生命安全，造成社会动荡不安，与世界人民追求和平的愿望背道而驰。\n\n【维护世界和平的努力】\n1. 当今世界，人们越来越致力于以和平谈判代替武力解决争端。\n2. 成立联合国，不断建立健全维护和平的机制。\n3. 派驻维和部队。\n4. 签署核不扩散条约……\n5. 驱散战争的阴影、维护世界和平需要每个人的努力。\n6. 我们要看到和平来之不易，珍惜今天的和平，积极表达爱好和平的愿望，主动承担维护世界和平的责任，为维护世界和平作出贡献。\n\n【推动可持续发展】\n1. 消除贫困，让人们都过上幸福的生活，平等和有尊严地在健康的环境中充分发挥每个人的潜能，与自然和谐共生，建设和平、公正、包容的社会，是当今人类必须共同面对的发展课题。\n2. 世界经济发展不平衡的现象日趋严重，发达国家与发展中国家间的差距不断扩大。\n3. 频发的战争、恶劣的自然环境、落后的教育等诸多因素导致贫困的国家越来越贫穷。\n4. 最不发达国家深受贫困以及由此带来的饥饿、疾病、社会冲突、社会动荡等一系列问题的困扰。这些问题成为制约人类发展的重要因素。\n5. 人类社会对于消除贫困、促进发展的追求没有止境，在不同的发展阶段设立了递进式的减贫目标。","semester":"lower"},{"id":"g3_daofa_037","chapter":"第二单元 世界舞台上的中国","name":"中国的国际地位","formula":"中国的国际地位日益提高，在国际舞台上发挥着越来越重要的作用","explanation":"【中国的国际地位不断提高】\n1. 改革开放以来，中国的经济实力、科技实力、国防实力、综合国力进入世界前列。\n2. 中国的国际地位实现前所未有的提升，国际影响力、感召力、塑造力不断提高。\n3. 中国日益走近世界舞台中央，成为国际社会公认的世界和平的建设者、全球发展的贡献者、国际秩序的维护者。\n\n【中国在国际舞台上的作用】\n1. 中国是世界上最大的发展中国家，在国际事务中发挥着越来越重要的作用。\n2. 中国是联合国安理会常任理事国之一，在维护世界和平、促进共同发展方面作出了重要贡献。\n3. 中国是世界经济增长的主要稳定器和动力源，为全球经济稳定和增长提供了持续强大的推动力。\n4. 中国积极参与全球治理体系改革和建设，推动构建人类命运共同体，为解决人类面临的共同问题贡献了中国智慧和中国方案。\n5. 中国坚持独立自主的和平外交政策，走和平发展道路，致力于建设持久和平、共同繁荣的和谐世界。\n\n【做负责任的大国】\n1. 作为一个负责任的大国，中国努力提高自身在国际上的影响力、感召力和塑造力。\n2. 中国不推诿、不逃避，也不依赖他人，积极主动地承担起相应的责任。\n3. 中国全方位参与全球治理，在有关世界和平与发展的各个领域，积极采取行动。\n4. 中国在致力于自身发展的同时，不忘对其他发展中国家提供力所能及的援助，推动世界共同发展。","semester":"lower"},{"id":"g3_daofa_038","chapter":"第三单元 走向未来的少年","name":"理想与现实","formula":"理想是人生的奋斗目标，要在现实中努力实现理想","explanation":"【理想的重要性】\n1. 理想是对未来美好生活的向往和追求，是人生的奋斗目标。\n2. 理想总是指向未来，表现为奋斗目标，对人的行为有导向、驱动和调控的作用。\n3. 理想激励着我们不断超越自己，让我们充满了实现自身价值的喜悦，使我们的人生充满幸福。\n4. 亿万人民在追求自己的理想，特别是追求美好社会理想的过程中，推动着社会向前发展。\n\n【理想与现实的关系】\n1. 理想源于现实，是现实的升华。\n2. 理想高于现实，是现实的发展方向。\n3. 理想可以转化为现实。理想不等于现实，理想高于现实，但在一定条件下，理想可以转化为现实。\n4. 理想和现实是既有区别，又有联系的。它们之间是对立统一的关系。\n\n【实现理想的途径】\n1. 实现理想，需要对人生作出规划。这个规划要尽可能长远，这样我们就不会在人生的某个阶段因为找不到目标而迷失方向；这个规划还要尽可能具体，可以按时间远近、重要程度划分为若干个阶段性目标。\n2. 我们的具体理想不是一成不变的，而是发展变化的。有时我们要根据自己的能力、兴趣等实际情况，对自己的理想适当进行调整，以缩短理想与现实之间的距离，促进理想的实现。\n3. 理想可以有很多，但通向理想的道路只有一条，那就是脚踏实地、全力以赴。\n4. 我们需要不断增强自身能力，提高自身素质；还需要不屈不挠、坚持不懈……","semester":"lower"},{"id":"g3_daofa_039","chapter":"第三单元 走向未来的少年","name":"劳动创造价值","formula":"劳动是财富的源泉，也是幸福的源泉","explanation":"【劳动的重要性】\n1. 劳动是财富的源泉，也是幸福的源泉。人世间的美好梦想，都是通过劳动实现的；生命里的一切辉煌，都是通过劳动铸就的。\n2. 千百年来，中华民族素以勤劳智慧闻名于世。今天，我们国家所取得的每一项成就，都是广大人民用辛勤劳动、诚实劳动、创造性劳动换来的，中国人民用实干精神创造了今天的辉煌。\n3. 每个人所处的岗位不同，从事不同的劳动，但都在为国家和社会发展作出贡献。\n4. 正是无数劳动者兢兢业业、艰苦奋斗、无私奉献，成就了我们今天的美好生活。无论是脑力劳动者还是体力劳动者，都是国家的建设者，都值得我们尊敬和学习。\n\n【尊重劳动】\n1. 每个人所处的岗位不同，从事不同的劳动，但都在为国家和社会发展作出贡献。\n2. 无论是脑力劳动者还是体力劳动者，都是国家的建设者，都值得我们尊敬和学习。\n3. 劳动没有高低贵贱之分，任何一份职业都很光荣。\n\n【实干创造未来】\n1. 今天，国家建设展现出光辉灿烂的前景，中华民族伟大复兴的中国梦越来越接近现实。\n2. 把中国梦变成现实，创造未来的美好生活，需要一代代人埋头苦干和接力奋斗，需要每个人在各自岗位上付出更多的辛勤和汗水。\n3. 只有继续发扬实干精神，才能用我们的劳动创造新的辉煌。\n4. 少年兴则国家兴，少年强则国家强。我们是祖国的未来，一定要接过历史的接力棒，努力学习，积极探索，勇做走在时代前列的学习者、劳动者、奉献者，以执着的信念、优良的品德、丰富的知识、过硬的本领，担负起历史重任，让青春绽放出绚丽的光彩。","semester":"lower"},{"id":"g3_daofa_040","chapter":"第三单元 走向未来的少年","name":"做自信的中国人","formula":"做对国家有认同、对文化有底气、对发展有信心的自信中国人","explanation":"【中国自信、民族自信的根本所在】\n1. 改革开放以来，中国共产党领导中国人民开辟了中国特色社会主义道路，形成了中国特色社会主义理论体系，建立了中国特色社会主义制度，发展了中国特色社会主义文化。\n2. 这是中国自信、民族自信的根本所在。\n3. 在党的领导下，中国特色社会主义伟大事业不断取得新的成就，国家富强、民族振兴让中国人更加自信。\n\n【自信中国人的表现】\n1. 自信的中国人对国家有认同。一个自信的中国人，具有强烈的国家认同感、与国家民族休戚与共的责任感、以天下为己任的使命感，能够自觉维护国家利益和国家尊严，自觉维护祖国统一和领土完整。\n2. 自信的中国人对文化有底气。一个自信的中国人，能够坚守中华文化立场，传承中华文化基因，讲好中国故事，传播好中国声音，阐发中国精神，展现中国风貌。\n3. 自信的中国人对发展有信心。一个自信的中国人，坚信中国特色社会主义道路就是人间正道，坚信创新、协调、绿色、开放、共享的发展理念能够引领中国发展，创造中国奇迹。\n\n【如何做自信的中国人】\n1. 自信不是妄自尊大，也不是故步自封。在经济全球化的时代，面对各种思想文化的碰撞和价值观念的冲突，我们需要培育理性平和、不卑不亢、开放包容的心态。\n2. 自信的中国人既是梦想家又是实干家，既要胸怀理想又要求真务实，既要满怀激情又要锲而不舍。实干才能梦想成真，辛勤劳动才能开创美好生活。\n3. 我们不忘初心，继续前行，就要坚持中国特色社会主义道路自信、理论自信、制度自信、文化自信。\n4. 民族复兴的美好前景，为我们提供了更广阔的舞台，也提出了更高的要求，我们应当成为担当民族复兴大任的时代新人。","semester":"lower"}];

        // ==================== 内嵌例题数据 ====================
        const DATA_EXAMPLES = [{"id":"g3_daofa_001_ex01","knowledge_id":"g3_daofa_001","question":"选择题：1978年，党的十一届三中全会开启了改革开放的历史征程。下列关于改革开放的说法正确的是（  ）\nA. 改革开放是我国的立国之本\nB. 改革开放是强国之路，是决定当代中国命运的关键抉择\nC. 改革开放只是经济领域的改革\nD. 改革开放已经完成，不需要再继续了","answer":"答案：B\n解析：改革开放是强国之路，是我们党、我们国家发展进步的活力源泉，是决定当代中国命运的关键抉择。A选项错误，四项基本原则是立国之本；C选项错误，改革开放是全面的改革，包括经济、政治、文化等各个领域；D选项错误，改革只有进行时，没有完成时。"},{"id":"g3_daofa_001_ex02","knowledge_id":"g3_daofa_001","question":"填空题：改革开放是______之路，是决定当代中国命运的______。","answer":"答案：强国；关键抉择\n解析：改革开放是强国之路，是决定当代中国命运的关键抉择，是发展中国特色社会主义、实现中华民族伟大复兴的必由之路。"},{"id":"g3_daofa_001_ex03","knowledge_id":"g3_daofa_001","question":"选择题：改革开放40多年来，中国人民的生活实现了从贫困到温饱、再到总体小康的历史性跨越。这充分说明（  ）\nA. 改革开放是解决中国所有问题的关键\nB. 改革开放极大改善了人民生活\nC. 改革开放只对城市居民有益\nD. 改革开放的成果主要由少数人享有","answer":"答案：B\n解析：改革开放使人民生活显著改善，综合国力显著增强，国际地位显著提高。A选项过于绝对；C选项错误，改革开放惠及全体人民；D选项错误，改革开放的成果由人民共享。"},{"id":"g3_daofa_001_ex04","knowledge_id":"g3_daofa_001","question":"简答题：为什么说改革开放是决定当代中国命运的关键抉择？","answer":"答案：\n（1）改革开放极大激发了广大人民群众的创造性，极大解放和发展了社会生产力，极大增强了社会发展活力。\n（2）人民生活显著改善，综合国力显著增强，国际地位显著提高。\n（3）中华民族迎来了从站起来、富起来到强起来的伟大飞跃。\n（4）改革开放是强国之路，是我们党、我们国家发展进步的活力源泉。\n（5）改革开放是发展中国特色社会主义、实现中华民族伟大复兴的必由之路。\n解析：本题考查改革开放的重要意义，需要从多个角度全面回答。"},{"id":"g3_daofa_001_ex05","knowledge_id":"g3_daofa_001","question":"填空题：改革开放是从______到城市，从试点到推广，从经济体制改革到______的过程。","answer":"答案：农村；全面深化改革\n解析：改革开放是从农村到城市，从试点到推广，从经济体制改革到全面深化改革的过程，体现了我国改革开放循序渐进的特点。"},{"id":"g3_daofa_001_ex06","knowledge_id":"g3_daofa_001","question":"材料分析题：阅读材料，回答问题。\n【材料】习近平总书记指出：\"改革开放是决定当代中国命运的关键一招，也是决定实现'两个一百年'奋斗目标、实现中华民族伟大复兴的关键一招。\"40多年来，中国人民始终艰苦奋斗、顽强拼搏，极大解放和发展了中国社会生产力。今天，中国已经成为世界第二大经济体、第一大工业国、第一大货物贸易国、第一大外汇储备国。\n（1）上述材料说明了什么道理？\n（2）结合材料，谈谈你对\"改革只有进行时，没有完成时\"的理解。","answer":"答案：\n（1）上述材料说明：①改革开放是强国之路，是决定当代中国命运的关键抉择；②改革开放极大解放和发展了社会生产力，使我国综合国力显著增强；③中国人民通过改革开放过上了幸福生活，中华民族迎来了从站起来、富起来到强起来的伟大飞跃。\n（2）对\"改革只有进行时，没有完成时\"的理解：①我国过去40多年的快速发展靠的是改革开放，未来发展也必须坚定不移地依靠改革开放；②进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾，必须将改革进行到底；③我国经济已由高速增长阶段转向高质量发展阶段，需要转变发展方式，优化经济结构，转换增长动力；④我国经济发展还面临区域发展不平衡、城镇化水平不高、城乡发展不平衡不协调等现实挑战；⑤改革开放是当代中国最鲜明的特色。\n解析：本题考查改革开放的意义和全面深化改革的必要性，需要结合材料和教材知识综合作答。"},{"id":"g3_daofa_001_ex07","knowledge_id":"g3_daofa_001","question":"选择题：下列对改革开放的认识正确的是（  ）\n①改革开放是当代中国最鲜明的特色\n②改革开放是强国之路、富民之路\n③改革开放是决定实现中华民族伟大复兴的关键一招\n④改革开放是国家发展的根本基点\nA. ①②③  B. ①②④  C. ①③④  D. ②③④","answer":"答案：A\n解析：①②③都是对改革开放的正确认识。④错误，独立自主、自力更生是我国发展的根本基点。因此正确答案是A。"},{"id":"g3_daofa_001_ex08","knowledge_id":"g3_daofa_001","question":"填空题：改革开放以来，中华民族迎来了从______、______到______的伟大飞跃。","answer":"答案：站起来；富起来；强起来\n解析：这是改革开放的伟大成就，体现了中国特色社会主义的强大生命力。"},{"id":"g3_daofa_001_ex09","knowledge_id":"g3_daofa_001","question":"简答题：改革开放的开启及其历程是怎样的？","answer":"答案：\n（1）开启：1978年，党的十一届三中全会开启了改革开放的历史征程。\n（2）历程：改革开放是从农村到城市，从试点到推广，从经济体制改革到全面深化改革的过程。\n（3）效果：中国人民坚持聚精会神搞建设，坚持改革开放不动摇，推动中国发生了翻天覆地的变化。\n解析：本题考查改革开放的开启和发展历程，需要按时间顺序清晰表述。"},{"id":"g3_daofa_001_ex10","knowledge_id":"g3_daofa_001","question":"材料分析题：阅读材料，回答问题。\n【材料】从实行家庭联产承包责任制、乡镇企业异军突起、取消农业税牧业税和特产税到农村承包地\"三权\"分置、打赢脱贫攻坚战、实施乡村振兴战略，从兴办深圳等经济特区、沿海沿边沿江沿线和内陆中心城市对外开放到加入世界贸易组织、共建\"一带一路\"、设立自由贸易试验区、谋划中国特色自由贸易港、成功举办首届中国国际进口博览会，从\"引进来\"到\"走出去\"，中国的改革开放不断向纵深推进。\n（1）材料体现了我国改革开放具有怎样的特点？\n（2）在改革开放的新征程中，我们青少年应该怎样做？","answer":"答案：\n（1）特点：①我国改革开放是从农村到城市、从试点到推广、从经济体制改革到全面深化改革的过程；②改革开放的领域不断拓宽，程度不断加深；③改革开放是一个循序渐进、不断深入的过程；④改革开放既包括对内改革，也包括对外开放。\n（2）青少年做法：①树立远大理想，立志成才，报效祖国；②努力学习科学文化知识，提高自身素质；③培养创新精神和实践能力；④增强社会责任感，关心国家大事；⑤积极宣传改革开放政策，做改革开放事业的拥护者、参与者和推动者；⑥树立平等、开放、参与的国际意识，全面提高自身素质，为将来参与改革开放事业做好充分准备。\n解析：本题考查改革开放的特点和青少年的做法，需要结合材料和实际多角度思考。"},{"id":"g3_daofa_002_ex01","knowledge_id":"g3_daofa_002","question":"选择题：进入新时代，我国社会主要矛盾已经转化为（  ）\nA. 人民日益增长的物质文化需要同落后的社会生产之间的矛盾\nB. 人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾\nC. 无产阶级和资产阶级之间的矛盾\nD. 经济发展和环境保护之间的矛盾","answer":"答案：B\n解析：党的十九大报告指出，中国特色社会主义进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。A是原来的主要矛盾表述；C、D表述错误。"},{"id":"g3_daofa_002_ex02","knowledge_id":"g3_daofa_002","question":"填空题：共同富裕是中国特色社会主义的______，党和政府坚持以______为中心的发展思想。","answer":"答案：根本原则；人民\n解析：共同富裕是中国特色社会主义的根本原则。党和政府坚持以人民为中心的发展思想，强调人人参与、人人尽力、人人享有，让人民群众共享发展成果。"},{"id":"g3_daofa_002_ex03","knowledge_id":"g3_daofa_002","question":"选择题：\"天地之大，黎元为先。\"发展的根本目的就是（  ）\nA. 实现共同富裕\nB. 增进民生福祉\nC. 建设现代化强国\nD. 实现民族复兴","answer":"答案：B\n解析：\"天地之大，黎元为先\"意思是天地虽然广袤无垠，但是黎民百姓才是国家的根本。发展的根本目的就是增进民生福祉。A、C、D虽然都是发展的目标，但不是根本目的。"},{"id":"g3_daofa_002_ex04","knowledge_id":"g3_daofa_002","question":"简答题：为什么要全面深化改革？","answer":"答案：\n（1）我国过去40多年的快速发展靠的是改革开放，未来发展也必须坚定不移地依靠改革开放。\n（2）进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。\n（3）我国经济已由高速增长阶段转向高质量发展阶段。\n（4）我国经济发展还面临区域发展不平衡、城镇化水平不高、城乡发展不平衡不协调等现实挑战。\n（5）改革开放是当代中国最鲜明的特色。改革只有进行时，没有完成时。\n解析：本题考查全面深化改革的原因，需要从主要矛盾、经济发展阶段、现实挑战等多个角度回答。"},{"id":"g3_daofa_002_ex05","knowledge_id":"g3_daofa_002","question":"填空题：衡量一个社会的文明程度，不仅要看经济发展，而且要看发展成果是否惠及______，人民的合法权益是否得到______。","answer":"答案：全体人民；切实保障\n解析：这是衡量社会文明程度的重要标准。发展的成果应该由全体人民共享，这是社会主义的本质要求。"},{"id":"g3_daofa_002_ex06","knowledge_id":"g3_daofa_002","question":"材料分析题：阅读材料，回答问题。\n【材料】习近平总书记强调：\"我们追求的发展是造福人民的发展，我们追求的富裕是全体人民共同富裕。\"党的十八大以来，以习近平同志为核心的党中央把脱贫攻坚摆在治国理政的突出位置，把脱贫攻坚作为全面建成小康社会的底线任务，组织开展了声势浩大的脱贫攻坚人民战争。经过8年持续奋斗，到2020年底，现行标准下9899万农村贫困人口全部脱贫，832个贫困县全部摘帽，12.8万个贫困村全部出列，完成了消除绝对贫困的艰巨任务，创造了又一个彪炳史册的人间奇迹！\n（1）上述材料体现了教材中的哪些观点？\n（2）为什么要让人民群众共享发展成果？","answer":"答案：\n（1）体现的观点：①党和政府坚持以人民为中心的发展思想；②共同富裕是中国特色社会主义的根本原则；③人民对美好生活的向往，就是党的奋斗目标；④发展的根本目的就是增进民生福祉；⑤中国共产党坚持立党为公、执政为民，全心全意为人民服务。\n（2）原因：①衡量一个社会的文明程度，不仅要看经济发展，而且要看发展成果是否惠及全体人民，人民的合法权益是否得到切实保障；②党和政府坚持以人民为中心的发展思想，强调人人参与、人人尽力、人人享有，让人民群众共享发展成果；③人民对美好生活的向往，就是党的奋斗目标；④发展的根本目的就是增进民生福祉；⑤共享发展成果有利于实现共同富裕，促进社会公平正义。\n解析：本题考查共享发展成果的相关知识，需要结合材料从多个角度分析。"},{"id":"g3_daofa_002_ex07","knowledge_id":"g3_daofa_002","question":"选择题：下列举措有利于实现共同富裕的是（  ）\n①实施乡村振兴战略\n②实施区域协调发展战略\n③打赢脱贫攻坚战\n④建立健全社会保障体系\nA. ①②③  B. ①②④  C. ②③④  D. ①②③④","answer":"答案：D\n解析：①实施乡村振兴战略有利于促进城乡协调发展；②实施区域协调发展战略有利于缩小区域发展差距；③打赢脱贫攻坚战有利于减少贫困人口；④建立健全社会保障体系有利于保障人民生活。这些举措都有利于实现共同富裕。"},{"id":"g3_daofa_002_ex08","knowledge_id":"g3_daofa_002","question":"填空题：人民对美好生活的向往，就是党的______。发展的根本目的就是______。","answer":"答案：奋斗目标；增进民生福祉\n解析：这两个重要论断体现了中国共产党以人民为中心的发展思想和全心全意为人民服务的根本宗旨。"},{"id":"g3_daofa_002_ex09","knowledge_id":"g3_daofa_002","question":"简答题：如何理解共享发展成果？","answer":"答案：\n（1）共享发展的内涵：人人享有、各得其所，不是少数人共享、一部分人共享。\n（2）共享发展的内容：共享发展包括经济、政治、文化、社会、生态等各方面的发展成果。\n（3）共享发展的途径：人人参与、人人尽力、人人享有，通过共同奋斗实现共享。\n（4）共享发展的意义：共享发展是中国特色社会主义的本质要求，有利于实现共同富裕，促进社会公平正义。\n解析：本题考查对共享发展成果的理解，需要从内涵、内容、途径、意义等多个角度回答。"},{"id":"g3_daofa_002_ex10","knowledge_id":"g3_daofa_002","question":"材料分析题：阅读材料，回答问题。\n【材料】改革开放以来，我国经济快速发展，但也出现了一些问题：区域发展不平衡，东西部差距较大；城乡发展不平衡不协调，农村发展相对滞后；收入分配差距较大，部分群众生活还比较困难。\n（1）材料反映了我国经济发展面临哪些现实挑战？\n（2）面对这些挑战，国家应该怎样做？","answer":"答案：\n（1）现实挑战：①区域发展不平衡；②城镇化水平不高；③城乡发展不平衡不协调；④收入分配差距较大。\n（2）国家做法：①坚持以人民为中心的发展思想，强调人人参与、人人尽力、人人享有，让人民群众共享发展成果；②全面深化改革，将改革进行到底；③落实新发展理念，转变发展方式，转换增长动力；④实施区域协调发展战略，缩小区域发展差距；⑤实施乡村振兴战略，推动城乡发展一体化；⑥完善收入分配制度，缩小收入差距；⑦建立健全社会保障体系，保障人民基本生活。\n解析：本题考查我国经济发展面临的挑战及应对措施，需要结合材料和教材知识综合作答。"},{"id":"g3_daofa_003_ex01","knowledge_id":"g3_daofa_003","question":"选择题：下列关于创新的说法正确的是（  ）\nA. 创新只是科学家的事，与我们普通人无关\nB. 创新就是指科技领域的发明创造\nC. 创新是引领发展的第一动力\nD. 创新离我们的生活很遥远","answer":"答案：C\n解析：创新是引领发展的第一动力。A选项错误，创新不唯年龄、不唯学历、不唯职业，每个人都是创新者；B选项错误，创新不仅指科技领域的发明创造，生活处处有创新；D选项错误，创新就在我们身边，生活处处有创新。"},{"id":"g3_daofa_003_ex02","knowledge_id":"g3_daofa_003","question":"填空题：创新是引领发展的______，是一个民族进步的______，是一个国家兴旺发达的不竭源泉。","answer":"答案：第一动力；灵魂\n解析：创新是引领发展的第一动力。创新是一个民族进步的灵魂，是一个国家兴旺发达的不竭源泉，也是中华民族最鲜明的民族禀赋。"},{"id":"g3_daofa_003_ex03","knowledge_id":"g3_daofa_003","question":"选择题：下列对生活处处有创新的理解，正确的是（  ）\n①创新是一种生活方式\n②生活的各个领域都需要创新，也都可以创新\n③创新给我们带来惊喜，让我们获得成就感\n④创新就是指从无到有的创造发明\nA. ①②③  B. ①②④  C. ①③④  D. ②③④","answer":"答案：A\n解析：①②③都是对创新的正确理解。④错误，创新不只是从无到有的创造发明，还可以是对已有成果的改进和完善。因此正确答案是A。"},{"id":"g3_daofa_003_ex04","knowledge_id":"g3_daofa_003","question":"简答题：为什么说创新是引领发展的第一动力？","answer":"答案：\n（1）创新是推动人类社会向前发展的重要力量。\n（2）时代发展呼唤创新。创新已经成为世界主要国家发展战略的重心。\n（3）在激烈的国际竞争中，唯创新者进，唯创新者强，唯创新者胜。\n（4）创新发展是中华民族复兴的国运所系。实施创新驱动发展战略，推进以科技创新为核心的全面创新，让创新成为推动发展的第一动力，是适应和引领我国经济发展新常态的现实需要。\n（5）我国改革开放事业进入攻坚克难的关键时期，更加呼唤改革创新的时代精神。\n解析：本题考查创新的重要性，需要从人类发展、时代要求、国际竞争、国家发展等多个角度回答。"},{"id":"g3_daofa_003_ex05","knowledge_id":"g3_daofa_003","question":"填空题：在激烈的国际竞争中，唯______者进，唯______者强，唯______者胜。","answer":"答案：创新；创新；创新\n解析：这体现了创新在国际竞争中的重要作用。创新已经成为世界主要国家发展战略的重心，是综合国力竞争的决定性因素。"},{"id":"g3_daofa_003_ex06","knowledge_id":"g3_daofa_003","question":"材料分析题：阅读材料，回答问题。\n【材料】从活字印刷术到高铁复兴号，从\"两弹一星\"到载人航天，从杂交水稻到青蒿素，从移动支付到共享经济……创新正在深刻改变着我们的生活。今天，中国已经成为具有全球影响力的科技大国，在一些重要领域走在世界前列。\n（1）上述材料说明了什么？\n（2）结合材料，谈谈创新对我们的生活有什么影响。","answer":"答案：\n（1）说明：①创新是引领发展的第一动力；②创新是一个民族进步的灵魂，是一个国家兴旺发达的不竭源泉；③创新改变生活，创新让生活更美好；④我国在一些重要科技领域走在世界前列。\n（2）对生活的影响：①生活处处有创新。创新是一种生活方式。②创新给我们带来惊喜，让我们获得成就感。创新点燃激情，让我们的生命充满活力。③生活的各个领域都需要创新，也都可以创新。知识的创新提供新的思想和方法，技术的创新促进生产力发展、增加社会财富，制度的创新促进公平正义、推动社会进步。④创新让生活更美好。我们的生活将因创新变得更加便捷、舒适和丰富多彩。\n解析：本题考查创新的相关知识，需要结合材料从创新的重要性和对生活的影响两个方面回答。"},{"id":"g3_daofa_003_ex07","knowledge_id":"g3_daofa_003","question":"选择题：下列对创新的认识正确的是（  ）\n①创新不只是灵光乍现的顿悟，更需要年复一年的积累\n②创新是个人的创意行为，也是团队、集体的创造活动\n③创新只能是科技发明，不能是其他方面\n④创新给我们带来惊喜，让我们获得成就感\nA. ①②③  B. ①②④  C. ①③④  D. ②③④","answer":"答案：B\n解析：①②④都是对创新的正确认识。③错误，生活的各个领域都需要创新，也都可以创新，不仅仅是科技发明。因此正确答案是B。"},{"id":"g3_daofa_003_ex08","knowledge_id":"g3_daofa_003","question":"填空题：知识的创新提供新的思想和方法，______的创新促进生产力发展、增加社会财富，______的创新促进公平正义、推动社会进步。","answer":"答案：技术；制度\n解析：生活的各个领域都需要创新，也都可以创新。不同领域的创新有不同的作用。"},{"id":"g3_daofa_003_ex09","knowledge_id":"g3_daofa_003","question":"简答题：如何理解\"生活处处有创新\"？","answer":"答案：\n（1）创新是一种生活方式。它不只是从无到有的创造发明，还可以是对已有成果的改进和完善；它不局限于科技领域，还渗透在生活的方方面面；它不只是灵光乍现的顿悟，更需要年复一年的积累；它是个人的创意行为，也是团队、集体的创造活动。\n（2）创新给我们带来惊喜，让我们获得成就感。创新点燃激情，让我们的生命充满活力。\n（3）生活的各个领域都需要创新，也都可以创新。\n（4）创新让生活更美好。我们的生活将因创新变得更加便捷、舒适和丰富多彩。\n解析：本题考查对生活处处有创新的理解，需要从创新的方式、对个人的影响、领域分布、对生活的影响等多个角度回答。"},{"id":"g3_daofa_003_ex10","knowledge_id":"g3_daofa_003","question":"材料分析题：阅读材料，回答问题。\n【材料】人工智能、大数据、云计算、物联网、5G通信……新一轮科技革命和产业变革正在孕育兴起。创新从来没有像今天这样深刻影响着国家前途命运，从来没有像今天这样深刻影响着人民生活福祉。\n（1）为什么说\"创新从来没有像今天这样深刻影响着国家前途命运\"？\n（2）作为青少年，我们应该怎样培养创新精神？","answer":"答案：\n（1）原因：①创新是引领发展的第一动力；②创新是一个民族进步的灵魂，是一个国家兴旺发达的不竭源泉，也是中华民族最鲜明的民族禀赋；③创新是推动人类社会向前发展的重要力量；④时代发展呼唤创新。创新已经成为世界主要国家发展战略的重心。在激烈的国际竞争中，唯创新者进，唯创新者强，唯创新者胜；⑤创新发展是中华民族复兴的国运所系。实施创新驱动发展战略，推进以科技创新为核心的全面创新，让创新成为推动发展的第一动力，是适应和引领我国经济发展新常态的现实需要。\n（2）青少年做法：①树立远大理想，努力学习科学文化知识，提高自身素质；②培养创新精神和实践能力，敢于质疑，善于质疑，敢于向传统和权威挑战；③培养兴趣和好奇心，提高观察力和创造性思维能力；④积极参加社会实践活动，参加科技小发明、小制作活动；⑤把创新热情与科学求实的态度结合起来，努力使自己成为具有创新能力的高素质人才。\n解析：本题考查创新的重要性和青少年如何培养创新精神，需要从国家和个人两个层面回答。"},{"id":"g3_daofa_004_ex01","knowledge_id":"g3_daofa_004","question":"选择题：综合国力竞争的决定性因素是（  ）\nA. 经济实力  B. 军事实力\nC. 科技创新能力  D. 文化软实力","answer":"答案：C\n解析：科技创新能力已经成为综合国力竞争的决定性因素。A、B、D都是综合国力的重要组成部分，但不是决定性因素。"},{"id":"g3_daofa_004_ex02","knowledge_id":"g3_daofa_004","question":"填空题：建设创新型国家，必须落实______战略、______战略，将科技和教育摆在经济社会发展的重要位置。","answer":"答案：科教兴国；人才强国\n解析：建设创新型国家，必须落实科教兴国战略、人才强国战略，将科技和教育摆在经济社会发展的重要位置，把经济建设重心转移到依靠科技进步和提高劳动者素质的轨道上来。"},{"id":"g3_daofa_004_ex03","knowledge_id":"g3_daofa_004","question":"选择题：下列对我国科技现状的认识正确的是（  ）\nA. 我国已经成为世界科技强国\nB. 我国科技发展水平总体不高，科技创新能力不强\nC. 我国在尖端技术的掌握和创新方面还很落后\nD. 我国科技对经济增长的贡献率远高于发达国家水平","answer":"答案：B\n解析：目前，虽然我国在尖端技术的掌握和创新方面打下了坚实基础，在一些重要领域走在世界前列，但是，从整体上看，我国仍然面临创新能力不强、科技发展水平总体不高、科技对经济社会发展的支撑能力不足、科技对经济增长的贡献率远低于发达国家水平等问题。A、C、D表述错误。"},{"id":"g3_daofa_004_ex04","knowledge_id":"g3_daofa_004","question":"简答题：为什么要建设创新型国家？","answer":"答案：\n（1）科技创新能力已经成为综合国力竞争的决定性因素。\n（2）目前，虽然我国在尖端技术的掌握和创新方面打下了坚实基础，在一些重要领域走在世界前列，但是，从整体上看，我国仍然面临创新能力不强、科技发展水平总体不高、科技对经济社会发展的支撑能力不足、科技对经济增长的贡献率远低于发达国家水平等问题。\n（3）中国科技创新之路任重道远，需要加快建设创新型国家。\n（4）创新是引领发展的第一动力，是推动人类社会向前发展的重要力量。\n（5）时代发展呼唤创新，在激烈的国际竞争中，唯创新者进，唯创新者强，唯创新者胜。\n解析：本题考查建设创新型国家的原因，需要从国际竞争、我国科技现状、创新的重要性等角度回答。"},{"id":"g3_daofa_004_ex05","knowledge_id":"g3_daofa_004","question":"填空题：教育是民族振兴、社会进步的______，是提高国民素质、培养创新型人才、促进人的全面发展的______。","answer":"答案：基石；根本途径\n解析：教育是民族振兴、社会进步的基石，是提高国民素质、培养创新型人才、促进人的全面发展的根本途径。教育寄托着亿万家庭对美好生活的期盼。"},{"id":"g3_daofa_004_ex06","knowledge_id":"g3_daofa_004","question":"材料分析题：阅读材料，回答问题。\n【材料】习近平总书记指出：\"中国要强盛、要复兴，就一定要大力发展科学技术，努力成为世界主要科学中心和创新高地。\"党的十八大以来，我国创新驱动发展战略大力实施，创新型国家建设成果丰硕，天宫、蛟龙、天眼、悟空、墨子、大飞机等重大科技成果相继问世。\n（1）我国取得一系列重大科技成果的原因有哪些？\n（2）有人说：\"我国已经成为世界科技强国了。\"请你谈谈对这一观点的看法。","answer":"答案：\n（1）原因：①坚持了中国共产党的正确领导；②坚持了科教兴国战略、人才强国战略和创新驱动发展战略；③我国经济实力不断增强，为科技创新提供了物质基础；④广大科技工作者发扬了艰苦奋斗、团结协作、开拓创新的精神；⑤社会主义制度具有集中力量办大事的优越性。\n（2）这一观点是错误的。\n理由：①目前，我国在尖端技术的掌握和创新方面打下了坚实基础，在一些重要领域走在世界前列。②但是，从整体上看，我国仍然面临创新能力不强、科技发展水平总体不高、科技对经济社会发展的支撑能力不足、科技对经济增长的贡献率远低于发达国家水平等问题。③中国科技创新之路任重道远，需要加快建设创新型国家。\n解析：本题考查我国科技发展的现状，需要客观全面地认识，既要看到成就，也要看到差距。"},{"id":"g3_daofa_004_ex07","knowledge_id":"g3_daofa_004","question":"选择题：建设创新型国家就要（  ）\n①落实科教兴国战略、人才强国战略\n②将科技和教育摆在经济社会发展的重要位置\n③增强自主创新能力，坚定不移地走中国特色自主创新道路\n④加快形成有利于创新的治理格局和协同机制\nA. ①②③  B. ①②④  C. ①③④  D. ①②③④","answer":"答案：D\n解析：①②③④都是建设创新型国家的正确做法。建设创新型国家，必须落实科教兴国战略、人才强国战略；将科技和教育摆在经济社会发展的重要位置；增强自主创新能力，坚定不移地走中国特色自主创新道路；加快形成有利于创新的治理格局和协同机制，搭建有利于创新的活动平台和融资平台，营造有利于创新的舆论氛围和法治环境。"},{"id":"g3_daofa_004_ex08","knowledge_id":"g3_daofa_004","question":"填空题：企业是社会创新的______。提升创新能力是企业持续发展之基、______之道。","answer":"答案：重要力量；市场制胜\n解析：企业是社会创新的重要力量。提升创新能力是企业持续发展之基、市场制胜之道。大国重器一定要掌握在自己手里，核心技术不是别人赐予的，企业不能只是跟着别人走，而必须自强奋斗、敢于突破。"},{"id":"g3_daofa_004_ex09","knowledge_id":"g3_daofa_004","question":"简答题：建设创新型国家是我国的重要战略目标。结合所学知识，说说我国应该怎样建设创新型国家？","answer":"答案：\n（1）必须落实科教兴国战略、人才强国战略，将科技和教育摆在经济社会发展的重要位置，把经济建设重心转移到依靠科技进步和提高劳动者素质的轨道上来。\n（2）要增强自主创新能力，坚持自主创新、重点跨越、支撑发展、引领未来的方针，坚定不移地走中国特色自主创新道路。\n（3）必须加快形成有利于创新的治理格局和协同机制，搭建有利于创新的活动平台和融资平台，营造有利于创新的舆论氛围和法治环境。\n（4）大力发展教育事业，培养创新型人才。\n（5）鼓励大众创业、万众创新，让创新在全社会蔚然成风。\n解析：本题考查建设创新型国家的措施，需要从战略、自主创新、制度环境、教育、大众创新等角度回答。"},{"id":"g3_daofa_004_ex10","knowledge_id":"g3_daofa_004","question":"材料分析题：阅读材料，回答问题。\n【材料】在\"大众创业、万众创新\"的浪潮中，越来越多的年轻人加入到创新创业的行列中。从大学毕业生到返乡农民工，从科技工作者到青年企业家，创新创业的火种在中华大地点燃。\n（1）当今社会，为什么要倡导大众创业、万众创新？\n（2）在创新的时代，我们应该怎样保护知识产权？","answer":"答案：\n（1）原因：①当今社会，大众创业、万众创新的理念深入人心；②每个人都是创新者，都向往在创新中实现自我价值；③每个人都是创业者，都可以通过辛勤劳动为国家和人民作出贡献；④企业是社会创新的重要力量，提升创新能力是企业持续发展之基、市场制胜之道；⑤时代需要弘扬创新精神；⑥创新让生活更美好，我们的生活将因创新变得更加便捷、舒适和丰富多彩。\n（2）保护知识产权的做法：①创新的时代，既要尊重他人的知识产权，又要学会保护自己的知识产权；②保护知识产权就是尊重创造、保护创新；③当知识产权受到侵犯时，我们要善于运用法律维护自己的权益；④我们可以通过申请专利、注册商标等方式保护自己的知识产权；⑤学习相关法律，如著作权法、专利法、商标法等；⑥不购买盗版产品，尊重他人的知识产权。\n解析：本题考查大众创业、万众创新和知识产权保护的相关知识，需要结合实际多角度思考。"},{"id":"g3_daofa_005_ex01","knowledge_id":"g3_daofa_005","question":"选择题：我国社会主义经济制度的基础是（  ）\nA. 国有经济  B. 集体经济\nC. 生产资料公有制  D. 混合所有制经济","answer":"答案：C\n解析：生产资料公有制是社会主义经济制度的基础。A、B都是公有制经济的组成部分；D混合所有制经济中的国有成分和集体成分才属于公有制经济。"},{"id":"g3_daofa_005_ex02","knowledge_id":"g3_daofa_005","question":"填空题：公有制为主体、多种所有制经济共同发展是我国的______制度。","answer":"答案：基本经济\n解析：公有制为主体、多种所有制经济共同发展是我国的基本经济制度，这是由我国的社会主义性质和初级阶段国情决定的。"},{"id":"g3_daofa_005_ex03","knowledge_id":"g3_daofa_005","question":"选择题：下列关于国有经济的说法正确的是（  ）\nA. 国有经济是国民经济的主导力量\nB. 国有经济就是公有制经济\nC. 国有经济在所有行业和领域都占支配地位\nD. 国有经济是社会主义经济制度的基础","answer":"答案：A\n解析：国有经济是国民经济的主导力量。B选项错误，国有经济只是公有制经济的一部分；C选项错误，国有经济在关系国民经济命脉的重要行业和关键领域占支配地位；D选项错误，生产资料公有制是社会主义经济制度的基础。"},{"id":"g3_daofa_005_ex04","knowledge_id":"g3_daofa_005","question":"简答题：公有制经济的地位和内容是什么？","answer":"答案：\n（1）地位：生产资料公有制是社会主义经济制度的基础。\n（2）内容：公有制经济包括国有经济、集体经济以及混合所有制经济中的国有成分和集体成分。\n（3）国有经济：是国民经济的主导力量。发展、壮大国有经济，对于提供公共服务、发展重要前瞻性战略性产业、保护生态环境、支持科技进步和保障国家安全等，具有关键作用。\n（4）集体经济：发展、壮大集体经济，对于广泛吸纳社会资金、缓解就业压力、增加公共积累和实现共同富裕等具有重要作用。\n解析：本题考查公有制经济的相关知识，需要从地位、内容、各组成部分的作用等角度回答。"},{"id":"g3_daofa_005_ex05","knowledge_id":"g3_daofa_005","question":"填空题：非公有制经济包括______经济、______经济等。","answer":"答案：个体；私营\n解析：非公有制经济包括个体经济、私营经济等。非公有制经济在支撑经济增长、增加税收、扩大就业、促进大众创业和万众创新等方面发挥着重要作用。"},{"id":"g3_daofa_005_ex06","knowledge_id":"g3_daofa_005","question":"材料分析题：阅读材料，回答问题。\n【材料】改革开放40多年来，我国民营经济从小到大、从弱到强，不断发展壮大。截至2020年底，我国民营企业数量超过4000万家，个体工商户数量超过9000万户。民营经济贡献了50%以上的税收，60%以上的国内生产总值，70%以上的技术创新成果，80%以上的城镇劳动就业，90%以上的企业数量。\n（1）材料说明了什么？\n（2）国家对非公有制经济的态度是什么？","answer":"答案：\n（1）说明：①民营经济是我国社会主义市场经济的重要组成部分；②民营经济在支撑经济增长、增加税收、扩大就业、促进创新等方面发挥着重要作用；③非公有制经济是我国经济社会发展的重要基础；④改革开放以来，我国民营经济不断发展壮大。\n（2）国家态度：国家保护个体经济、私营经济等非公有制经济的合法的权利和利益，鼓励、支持、引导非公有制经济发展，激发非公有制经济活力和创造力。\n解析：本题考查非公有制经济的地位和作用，需要结合材料和教材知识回答。"},{"id":"g3_daofa_005_ex07","knowledge_id":"g3_daofa_005","question":"选择题：在我国，公有制经济和非公有制经济（  ）\nA. 都是社会主义经济的重要组成部分\nB. 在国民经济中的地位是平等的\nC. 都是我国经济社会发展的重要基础\nD. 都是社会主义经济制度的基础","answer":"答案：C\n解析：公有制经济和非公有制经济都是社会主义市场经济的重要组成部分，都是我国经济社会发展的重要基础。A选项错误，非公有制经济不是社会主义经济；B选项错误，公有制经济是主体；D选项错误，只有公有制经济是社会主义经济制度的基础。"},{"id":"g3_daofa_005_ex08","knowledge_id":"g3_daofa_005","question":"填空题：国家保护个体经济、私营经济等非公有制经济的合法的权利和利益，______、______、______非公有制经济发展。","answer":"答案：鼓励；支持；引导\n解析：这是国家对非公有制经济的政策。国家保护非公有制经济的合法权利和利益，鼓励、支持、引导非公有制经济发展，激发非公有制经济活力和创造力。"},{"id":"g3_daofa_005_ex09","knowledge_id":"g3_daofa_005","question":"简答题：为什么要坚持公有制为主体、多种所有制经济共同发展的基本经济制度？","answer":"答案：\n（1）这是由我国社会主义性质和初级阶段国情决定的。\n（2）生产资料公有制是社会主义经济制度的基础，是社会主义的根本经济特征。\n（3）非公有制经济在支撑经济增长、增加税收、扩大就业、促进大众创业和万众创新等方面发挥着重要作用。\n（4）公有制经济和非公有制经济都是社会主义市场经济的重要组成部分，都是我国经济社会发展的重要基础。\n（5）我国基本经济制度促进了生产力的发展、综合国力的增强和人民生活水平的提高，为人民当家作主奠定了坚实的物质基础。\n解析：本题考查坚持基本经济制度的原因，需要从国情、公有制和非公有制的地位作用等角度回答。"},{"id":"g3_daofa_005_ex10","knowledge_id":"g3_daofa_005","question":"材料分析题：阅读材料，回答问题。\n【材料】在某社区，有这样一些店铺：小李开的理发店、小王开的服装店、由国家控股的石油公司加油站、村办的服装厂、还有几家外资企业的分店。\n（1）材料中出现了哪些经济成分？分别属于什么所有制经济？\n（2）这些经济成分的存在说明了什么？","answer":"答案：\n（1）经济成分及所有制：\n①小李开的理发店——个体经济，属于非公有制经济；\n②小王开的服装店——私营经济，属于非公有制经济；\n③国家控股的石油公司加油站——国有经济，属于公有制经济；\n④村办的服装厂——集体经济，属于公有制经济；\n⑤外资企业分店——外资经济，属于非公有制经济。\n（2）说明：①我国坚持公有制为主体、多种所有制经济共同发展的基本经济制度；②公有制经济和非公有制经济都是社会主义市场经济的重要组成部分，都是我国经济社会发展的重要基础；③国家保护个体经济、私营经济等非公有制经济的合法的权利和利益，鼓励、支持、引导非公有制经济发展；④我国基本经济制度促进了生产力的发展、综合国力的增强和人民生活水平的提高。\n解析：本题考查我国的经济成分和基本经济制度，需要结合具体案例进行分析。"},{"id":"g3_daofa_006_ex01","knowledge_id":"g3_daofa_006","question":"选择题：社会主义民主政治的本质特征是（  ）\nA. 依法治国  B. 人民当家作主\nC. 党的领导  D. 协商民主","answer":"答案：B\n解析：人民当家作主是社会主义民主政治的本质特征。A选项依法治国是基本方略；C选项党的领导是根本保证；D选项协商民主是社会主义民主政治的特有形式和独特优势。"},{"id":"g3_daofa_006_ex02","knowledge_id":"g3_daofa_006","question":"填空题：我国社会主义民主是维护人民根本利益的______、______、______的民主。","answer":"答案：最广泛；最真实；最管用\n解析：我国社会主义民主是一种新型的民主，它从中国的社会土壤中生长出来，在实践中不断得到验证，具有强大生命力。我国社会主义民主是维护人民根本利益的最广泛、最真实、最管用的民主。"},{"id":"g3_daofa_006_ex03","knowledge_id":"g3_daofa_006","question":"选择题：下列对我国社会主义民主的认识正确的是（  ）\n①有事好商量，众人的事情由众人商量，是人民民主的真谛\n②协商民主是我国社会主义民主政治的特有形式和独特优势\n③我国实行人民民主，既发展选举民主，又发展协商民主\n④我国社会主义民主只是一种形式，没有实际意义\nA. ①②③  B. ①②④  C. ①③④  D. ②③④","answer":"答案：A\n解析：①②③都是对我国社会主义民主的正确认识。④错误，我国社会主义民主是维护人民根本利益的最广泛、最真实、最管用的民主，不是形式主义的民主。因此正确答案是A。"},{"id":"g3_daofa_006_ex04","knowledge_id":"g3_daofa_006","question":"简答题：为什么说我国社会主义民主是新型的民主？","answer":"答案：\n（1）我国社会主义民主是一种新型的民主，它从中国的社会土壤中生长出来，在实践中不断得到验证，具有强大生命力。\n（2）人民当家作主是社会主义民主政治的本质特征。\n（3）我国社会主义民主是维护人民根本利益的最广泛、最真实、最管用的民主。\n（4）有事好商量，众人的事情由众人商量，是人民民主的真谛。\n（5）协商民主是我国社会主义民主政治的特有形式和独特优势。\n（6）我国实行人民民主，既发展选举民主，保障人民通过选举、投票行使权利，又发展协商民主，推动人民内部各方面在决策之前和决策之中进行充分协商，尽可能取得一致意见。\n解析：本题考查我国社会主义民主的特点，需要从本质特征、民主特点、真谛、协商民主等多个角度回答。"},{"id":"g3_daofa_006_ex05","knowledge_id":"g3_daofa_006","question":"填空题：有事好商量，众人的事情由众人商量，是人民民主的______。______是我国社会主义民主政治的特有形式和独特优势。","answer":"答案：真谛；协商民主\n解析：这是人民民主的真谛和协商民主的重要地位，体现了我国社会主义民主的特点和优势。"},{"id":"g3_daofa_006_ex06","knowledge_id":"g3_daofa_006","question":"材料分析题：阅读材料，回答问题。\n【材料】\"十四五\"规划编制过程中，习近平总书记多次主持召开系列座谈会，当面听取各方面对制定\"十四五\"规划的意见和建议。2020年8月，\"十四五\"规划编制工作开展网上意见征求活动，累计收到网民建言超过101.8万条，为做好\"十四五\"规划编制工作提供了有益参考。\n（1）上述材料体现了教材中的哪些观点？\n（2）材料中的做法有什么重要意义？","answer":"答案：\n（1）体现的观点：①我国是人民当家作主的社会主义国家，人民是国家的主人；②人民当家作主是社会主义民主政治的本质特征；③我国社会主义民主是维护人民根本利益的最广泛、最真实、最管用的民主；④有事好商量，众人的事情由众人商量，是人民民主的真谛；⑤协商民主是我国社会主义民主政治的特有形式和独特优势；⑥民主决策是保障人民利益得到充分实现的有效方式。\n（2）重要意义：①有利于保障人民当家作主，维护人民的根本利益；②有利于广泛听取民意，集中民智，促进决策的科学化、民主化；③有利于增强公民的民主意识，激发公民的参与热情；④有利于推进社会主义民主政治建设，发展社会主义民主；⑤有利于凝聚社会共识，形成推进国家发展的合力。\n解析：本题考查社会主义民主的相关知识，需要结合材料从民主的本质、特点、意义等角度分析。"},{"id":"g3_daofa_006_ex07","knowledge_id":"g3_daofa_006","question":"选择题：在我国，人民实现民主权利的重要形式有（  ）\n①民主选举  ②民主决策\n③民主监督  ④民主管理\nA. ①②③  B. ①②④  C. ①③④  D. ①②③④","answer":"答案：A\n解析：民主选举是人民实现民主权利的一种重要形式；民主决策是保障人民利益得到充分实现的有效方式；民主监督是公民参与民主生活、行使公民监督权的具体体现。民主管理也是公民参与民主生活的形式，但教材中主要强调的是民主选举、民主决策、民主监督。"},{"id":"g3_daofa_006_ex08","knowledge_id":"g3_daofa_006","question":"填空题：民主选举是人民实现民主权利的一种______；民主决策是保障人民利益得到充分实现的______；民主监督是公民参与民主生活、行使公民监督权的______。","answer":"答案：重要形式；有效方式；具体体现\n解析：这是人民行使民主权利的三种重要形式及其地位，需要准确区分和记忆。"},{"id":"g3_daofa_006_ex09","knowledge_id":"g3_daofa_006","question":"简答题：在我国，保障人民当家作主的制度体系有哪些？","answer":"答案：\n（1）人民代表大会制度是我国的根本政治制度，是人民掌握国家政权、行使权力的根本途径。\n（2）中国共产党领导的多党合作和政治协商制度是我国的一项基本政治制度，强调通过充分协商，求同存异，找到最大公约数，画出最大同心圆。\n（3）民族区域自治制度是一项独具中国特色的实现民族平等、保障少数民族合法权利的基本政治制度。\n（4）实行基层群众自治制度，发展基层民主，是社会主义民主政治建设的基础。\n解析：本题考查保障人民当家作主的制度体系，需要从根本政治制度和基本政治制度等角度回答。"},{"id":"g3_daofa_006_ex10","knowledge_id":"g3_daofa_006","question":"材料分析题：阅读材料，回答问题。\n【材料】党的二十大报告指出：\"全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主。\"全过程人民民主，实现了过程民主和成果民主、程序民主和实质民主、直接民主和间接民主、人民民主和国家意志相统一，是全链条、全方位、全覆盖的民主。\n（1）结合材料，谈谈你对全过程人民民主的理解。\n（2）发展全过程人民民主有什么重要意义？","answer":"答案：\n（1）理解：①全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主；②全过程人民民主实现了过程民主和成果民主、程序民主和实质民主、直接民主和间接民主、人民民主和国家意志相统一；③全过程人民民主是全链条、全方位、全覆盖的民主；④有事好商量，众人的事情由众人商量，是人民民主的真谛；⑤协商民主是我国社会主义民主政治的特有形式和独特优势。\n（2）意义：①有利于保障人民当家作主，维护人民的根本利益；②有利于扩大人民有序政治参与，保证人民依法实行民主选举、民主协商、民主决策、民主管理、民主监督；③有利于广泛凝聚社会共识，形成推进国家发展的合力；④有利于促进国家治理体系和治理能力现代化；⑤有利于发展社会主义民主政治，建设社会主义政治文明；⑥有利于维护社会公平正义，促进社会和谐稳定。\n解析：本题考查全过程人民民主的相关知识，需要结合材料和教材知识综合作答。"},{"id":"g3_daofa_007_ex01","knowledge_id":"g3_daofa_007","question":"选择题：下列不属于公民参与民主决策的有力保证的是（  ）\nA. 社情民意反映制度  B. 专家咨询制度\nC. 信访举报制度  D. 社会听证制度","answer":"答案：C\n解析：社情民意反映制度、专家咨询制度、重大事项社会公示制度和社会听证制度等是公民参与民主决策的有力保证。信访举报制度是公民行使监督权的重要途径之一，不属于民主决策的方式。"},{"id":"g3_daofa_007_ex02","knowledge_id":"g3_daofa_007","question":"填空题：公民参与民主生活，要有社会责任感和主人翁意识，以______、______、______的态度全面、深刻、辩证地看问题。","answer":"答案：理性；公正；客观\n解析：我国公民参与民主生活，要有社会责任感和主人翁意识，以理性、公正、客观的态度全面、深刻、辩证地看问题，立场正确、逻辑清晰地表达观点和意见，逐步提高依法有序参与民主生活的能力。"},{"id":"g3_daofa_007_ex03","knowledge_id":"g3_daofa_007","question":"选择题：实行民主监督（  ）\n①有利于国家机关和国家工作人员改进工作，提高工作效率\n②可以杜绝腐败现象，防止滥用权力\n③有助于增强公民的参与意识，激发公民的参与热情\n④有利于维护人民群众的合法权益\nA. ①②③  B. ①②④  C. ①③④  D. ②③④","answer":"答案：C\n解析：实行民主监督，有利于国家机关和国家工作人员改进工作，提高工作效率，克服官僚主义，防止滥用权力，预防腐败；有助于增强公民的参与意识，激发公民的参与热情。②中\"杜绝\"说法过于绝对，是错误的。因此正确答案是C。"},{"id":"g3_daofa_007_ex04","knowledge_id":"g3_daofa_007","question":"简答题：公民怎样增强民主意识？","answer":"答案：\n（1）在现代社会，民主应该成为公民的一种生活方式和生活态度。\n（2）公民要自觉遵守宪法，始终按照宪法原则和精神参与民主生活。\n（3）公民要不断积累民主知识，形成尊重、宽容、批判和协商的民主态度。\n（4）公民要通过依法参与公共事务，在实践中逐步增强民主意识。\n（5）公民参与民主生活，要有社会责任感和主人翁意识，以理性、公正、客观的态度全面、深刻、辩证地看问题。\n解析：本题考查增强民主意识的途径，需要从遵守宪法、积累知识、实践参与等角度回答。"},{"id":"g3_daofa_007_ex05","knowledge_id":"g3_daofa_007","question":"填空题：民主选举的形式有多种，如______选举和______选举、______选举和______选举等。","answer":"答案：直接；间接；等额；差额\n解析：民主选举是人民实现民主权利的一种重要形式。民主选举的形式有多种，如直接选举和间接选举、等额选举和差额选举等。不管采用哪种形式，民主选举都要遵循公开、公平和公正的原则。"},{"id":"g3_daofa_007_ex06","knowledge_id":"g3_daofa_007","question":"材料分析题：阅读材料，回答问题。\n【材料】随着网络的发展，网络问政已成为我国公民参与政治生活的重要途径。政府通过网络问政于民、问计于民、问需于民，让公民有更多的机会参与民主生活。\n（1）网络问政体现了公民参与民主生活的哪些形式？\n（2）公民参与民主生活有什么重要意义？","answer":"答案：\n（1）体现的形式：①民主决策：网络问政有利于政府听取民意、集中民智，促进决策的科学化、民主化；②民主监督：公民可以通过网络监督国家机关和国家工作人员的工作，提出批评和建议。\n（2）重要意义：①有利于保障人民当家作主，维护人民的根本利益；②有利于促进政府决策的科学化、民主化，提高工作效率；③有利于克服官僚主义，防止滥用权力，预防腐败；④有助于增强公民的参与意识，激发公民的参与热情；⑤有利于推进社会主义民主政治建设，发展社会主义民主；⑥有利于维护社会公平正义，促进社会和谐稳定。\n解析：本题考查公民参与民主生活的形式和意义，需要结合材料和教材知识综合作答。"},{"id":"g3_daofa_007_ex07","knowledge_id":"g3_daofa_007","question":"选择题：公民参与民主生活是社会主义民主的要求，也是公民的一项权利。下列属于公民有序参与民主生活的是（  ）\nA. 小明在网上散布谣言，诋毁政府形象\nB. 小红在村民选举中投出自己庄严的一票\nC. 小刚聚众闹事，表达对某政策的不满\nD. 小丽在信访时大吵大闹，不遵守秩序","answer":"答案：B\n解析：公民要依法有序参与民主生活，遵守宪法和法律。A、C、D都是无序参与民主生活的表现，违反了法律和秩序。B是依法有序参与民主选举的表现，符合题意。"},{"id":"g3_daofa_007_ex08","knowledge_id":"g3_daofa_007","question":"填空题：实行民主监督，有利于国家机关和国家工作人员改进工作，提高工作效率，克服______，防止滥用权力，预防______。","answer":"答案：官僚主义；腐败\n解析：本题考查民主监督的意义。实行民主监督，有利于国家机关和国家工作人员改进工作，提高工作效率，克服官僚主义，防止滥用权力，预防腐败。"},{"id":"g3_daofa_007_ex09","knowledge_id":"g3_daofa_007","question":"简答题：公民参与民主决策的方式有哪些？公民参与民主决策有什么重要意义？","answer":"答案：\n（1）方式：社情民意反映制度、专家咨询制度、重大事项社会公示制度、社会听证制度等。\n（2）意义：①有利于保障人民当家作主，维护人民的根本利益；②有利于广泛听取民意，集中民智，促进决策的科学化、民主化；③有利于增强公民的参与意识，激发公民的参与热情；④有利于推进社会主义民主政治建设，发展社会主义民主；⑤有利于凝聚社会共识，形成推进国家发展的合力。\n解析：本题考查民主决策的方式和意义，需要准确记忆和理解。"},{"id":"g3_daofa_007_ex10","knowledge_id":"g3_daofa_007","question":"材料分析题：阅读材料，回答问题。\n【材料】为了增强学生的民主意识，某校组织学生开展了\"模拟政协\"活动。学生们通过调研，撰写了\"关于加强校园周边食品安全监管的提案\"，并提交给了当地政协委员。\n（1）开展\"模拟政协\"活动有什么重要意义？\n（2）作为青少年，我们应该怎样参与民主生活？","answer":"答案：\n（1）意义：①有利于增强学生的民主意识，培养学生的社会责任感和主人翁意识；②有利于提高学生参与民主生活的能力，学会以理性、公正、客观的态度看待问题；③有利于学生了解我国的政治制度，增进对中国特色社会主义民主的理解和认同；④有利于推进社会主义民主政治建设，培养社会主义合格公民。\n（2）做法：①要有社会责任感和主人翁意识，以理性、公正、客观的态度全面、深刻、辩证地看问题；②要自觉遵守宪法，始终按照宪法原则和精神参与民主生活；③要不断积累民主知识，形成尊重、宽容、批判和协商的民主态度；④要通过依法参与公共事务，在实践中逐步增强民主意识；⑤要积极参与民主选举、民主决策、民主监督，依法行使民主权利。\n解析：本题考查青少年参与民主生活的相关知识，需要结合实际和教材知识回答。"},{"id":"g3_daofa_008_ex01","knowledge_id":"g3_daofa_008","question":"选择题：党领导人民治理国家的基本方略是（  ）\nA. 以德治国  B. 依法治国\nC. 改革开放  D. 科教兴国","answer":"答案：B\n解析：党的十五大把依法治国确定为党领导人民治理国家的基本方略，积极推进社会主义法治建设。A选项以德治国是重要补充；C选项改革开放是强国之路；D选项科教兴国是发展战略。"},{"id":"g3_daofa_008_ex02","knowledge_id":"g3_daofa_008","question":"填空题：法治是现代政治文明的______，是发展市场经济、实现强国富民的______，是解决社会矛盾、维护社会稳定、实现社会正义的______。","answer":"答案：核心；基本保障；有效方式\n解析：本题考查法治的重要性。法治是现代政治文明的核心，是发展市场经济、实现强国富民的基本保障，是解决社会矛盾、维护社会稳定、实现社会正义的有效方式。走法治道路是实现中华民族伟大复兴的必然选择。"},{"id":"g3_daofa_008_ex03","knowledge_id":"g3_daofa_008","question":"选择题：下列关于法治的说法正确的是（  ）\n①法治，意味着依法治理\n②法治能够为人们提供良好的生活秩序\n③追求并奉行法治已经成为现代世界各国的共识\n④法治就是要消灭人治，实行绝对的民主\nA. ①②③  B. ①②④  C. ①③④  D. ②③④","answer":"答案：A\n解析：①②③都是对法治的正确认识。④说法错误，法治是相对于人治而言的，但不是绝对的民主，民主也需要法治的保障。因此正确答案是A。"},{"id":"g3_daofa_008_ex04","knowledge_id":"g3_daofa_008","question":"简答题：为什么要选择法治道路？","answer":"答案：\n（1）法治，意味着依法治理。法治能够为人们提供良好的生活秩序，让人们建立起基本、稳定、持续的生活预期，保障人们在社会各个领域依法享有广泛的权利和自由，使人们安全、有尊严地生活。\n（2）追求并奉行法治已经成为现代世界各国的共识。\n（3）法治是现代政治文明的核心，是发展市场经济、实现强国富民的基本保障，是解决社会矛盾、维护社会稳定、实现社会正义的有效方式。\n（4）走法治道路是实现中华民族伟大复兴的必然选择。\n（5）社会因法治而进步。全面依法治国是中国特色社会主义的本质要求和重要保障。\n解析：本题考查法治的重要性，需要从个人、国家、社会等多个角度回答。"},{"id":"g3_daofa_008_ex05","knowledge_id":"g3_daofa_008","question":"填空题：建设法治中国，要努力使每一项立法都得到人民群众的______，使每一部法律法规都得到______，使每一个司法案件都体现______，使每一位公民都成为法治的忠实崇尚者、自觉遵守者和坚定捍卫者。","answer":"答案：普遍拥护；严格执行；公平正义\n解析：本题考查建设法治中国的目标。建设法治中国，要努力实现科学立法、严格执法、公正司法、全民守法，促进国家治理体系和治理能力现代化。"},{"id":"g3_daofa_008_ex06","knowledge_id":"g3_daofa_008","question":"材料分析题：阅读材料，回答问题。\n【材料】党的二十大报告指出：\"全面依法治国是国家治理的一场深刻革命，关系党执政兴国，关系人民幸福安康，关系党和国家长治久安。必须更好发挥法治固根本、稳预期、利长远的保障作用，在法治轨道上全面建设社会主义现代化国家。\"\n（1）为什么说全面依法治国关系党和国家长治久安？\n（2）怎样建设法治中国？","answer":"答案：\n（1）原因：①法治是现代政治文明的核心，是发展市场经济、实现强国富民的基本保障；②法治是解决社会矛盾、维护社会稳定、实现社会正义的有效方式；③走法治道路是实现中华民族伟大复兴的必然选择；④社会因法治而进步，全面依法治国是中国特色社会主义的本质要求和重要保障；⑤法治能够为人们提供良好的生活秩序，保障人们依法享有广泛的权利和自由。\n（2）做法：①建设法治中国，要努力使每一项立法都得到人民群众的普遍拥护，使每一部法律法规都得到严格执行，使每一个司法案件都体现公平正义，使每一位公民都成为法治的忠实崇尚者、自觉遵守者和坚定捍卫者；②坚定不移地走中国特色社会主义法治道路，必须坚持党的领导、人民当家作主、依法治国有机统一；③全面依法治国必须坚持厉行法治，推进科学立法、严格执法、公正司法、全民守法；④坚持依法治国和以德治国相结合，既重视发挥法律的规范作用，又重视发挥道德的教化作用。\n解析：本题考查全面依法治国和建设法治中国的相关知识，需要综合运用教材知识回答。"},{"id":"g3_daofa_008_ex07","knowledge_id":"g3_daofa_008","question":"选择题：坚定不移地走中国特色社会主义法治道路，必须坚持（  ）有机统一。\n①党的领导  ②人民当家作主\n③依法治国  ④以德治国\nA. ①②③  B. ①②④  C. ①③④  D. ②③④","answer":"答案：A\n解析：坚定不移地走中国特色社会主义法治道路，必须坚持党的领导、人民当家作主、依法治国有机统一。以德治国是重要补充，但不是有机统一的三方面内容。因此正确答案是A。"},{"id":"g3_daofa_008_ex08","knowledge_id":"g3_daofa_008","question":"填空题：党的十五大把______确定为党领导人民治理国家的基本方略。______是中国特色社会主义的本质要求和重要保障。","answer":"答案：依法治国；全面依法治国\n解析：本题考查依法治国的提出和全面依法治国的地位。党的十五大提出依法治国，全面依法治国是中国特色社会主义的本质要求和重要保障。"},{"id":"g3_daofa_008_ex09","knowledge_id":"g3_daofa_008","question":"简答题：法治是现代政治文明的核心。结合所学知识，说说法治的要求是什么？","answer":"答案：\n（1）法治要求实行良法之治。良法反映最广大人民群众的意志和利益，反映社会发展的规律，维护公民的基本权利，符合公平正义要求，促进人与社会的共同发展。\n（2）法治还要求实行善治。法治建立在民主的基础上，通过赋予公民更多的参与公共活动的机会和权利，实现公共利益的最大化。\n解析：本题考查法治的要求，包括良法和善治两个层面，需要准确理解和记忆。"},{"id":"g3_daofa_008_ex10","knowledge_id":"g3_daofa_008","question":"材料分析题：阅读材料，回答问题。\n【材料】截至2023年，我国现行有效法律290余件，行政法规600余件，地方性法规12000余件，以宪法为核心的中国特色社会主义法律体系已经形成并不断完善。\n（1）上述材料说明了什么？\n（2）有了完备的法律体系，是不是就建成了法治中国？请谈谈你的看法。","answer":"答案：\n（1）说明：①我国高度重视法治建设，依法治国取得了显著成就；②我国的立法工作取得了重大进展，中国特色社会主义法律体系已经形成并不断完善；③我国坚持科学立法，为法治中国建设提供了法律保障。\n（2）看法：不是。\n理由：①有法律制度不等于就有法治，法治还要求实行善治；②法治建立在民主的基础上，通过赋予公民更多的参与公共活动的机会和权利，实现公共利益的最大化；③建设法治中国，不仅要做到科学立法，还要做到严格执法、公正司法、全民守法；④建设法治中国，需要全体社会成员共同努力，在全社会树立法治意识，弘扬法治精神；⑤坚定不移地走中国特色社会主义法治道路，必须坚持党的领导、人民当家作主、依法治国有机统一。\n解析：本题考查对法治的全面理解，法治不仅需要良法，还需要善治，需要各方面共同努力。"},{"id":"g3_daofa_009_ex01","knowledge_id":"g3_daofa_009","question":"选择题：依法行政的核心是（  ）\nA. 规范政府的立法权  B. 规范政府的行政权\nC. 规范政府的司法权  D. 规范公民的权利","answer":"答案：B\n解析：依法行政的核心是规范政府的行政权。A选项立法权是人大的职权；C选项司法权是司法机关的职权；D选项与题意不符。"},{"id":"g3_daofa_009_ex02","knowledge_id":"g3_daofa_009","question":"填空题：全面依法治国必须坚持厉行法治，推进______、______、______、______。","answer":"答案：科学立法；严格执法；公正司法；全民守法\n解析：全面依法治国必须坚持厉行法治，推进科学立法、严格执法、公正司法、全民守法。这是全面依法治国的基本要求，也是建设法治中国的目标。"},{"id":"g3_daofa_009_ex03","knowledge_id":"g3_daofa_009","question":"选择题：下列对政府的认识正确的是（  ）\n①政府的权力来源于人民\n②政府的宗旨是为人民服务\n③政府的工作要对人民负责，为人民谋利益\n④政府的权力可以不受法律约束\nA. ①②③  B. ①②④  C. ①③④  D. ②③④","answer":"答案：A\n解析：①②③都是对政府的正确认识。④说法错误，政府的权力必须在法治轨道上运行，受法律约束。因此正确答案是A。"},{"id":"g3_daofa_009_ex04","knowledge_id":"g3_daofa_009","question":"简答题：法治政府建设是全面依法治国的重要环节。结合所学知识，说说怎样建设法治政府？","answer":"答案：\n（1）法治政府就是按照法治原则运作的政府，政府的各项权力都应该在法治轨道上运行。\n（2）建设法治政府，必须依法行政，防范行政权力的滥用，维护广大人民群众的合法权益，提高政府公信力，从而推进民主法治建设进程。\n（3）政府及其工作人员在行使行政权力、管理公共事务时必须由宪法和法律授权，并且依据宪法和法律的规定正确行使权力。\n（4）建设法治政府，要全面推进政务公开，保障公民的知情权、参与权、表达权和监督权，促进政府决策科学化和民主化。\n（5）公民也要积极参与，献计献策，主动监督，促进政府依法行政。\n解析：本题考查建设法治政府的要求，需要从政府、公民等多个角度回答。"},{"id":"g3_daofa_009_ex05","knowledge_id":"g3_daofa_009","question":"填空题：政府的宗旨是______，政府的工作要对______负责，为______谋利益。","answer":"答案：为人民服务；人民；人民\n解析：在我国，政府的权力来源于人民。政府的宗旨是为人民服务，政府的工作要对人民负责，为人民谋利益。这体现了我国是人民当家作主的社会主义国家。"},{"id":"g3_daofa_009_ex06","knowledge_id":"g3_daofa_009","question":"材料分析题：阅读材料，回答问题。\n【材料】2023年，全国公安机关深入推进\"净网2023\"专项行动，聚焦人民群众深恶痛绝的网络违法犯罪，依法严厉打击整治网络谣言、网络诈骗、网络水军等突出问题，切实维护网络空间秩序和人民群众合法权益。\n（1）上述材料体现了厉行法治的哪一方面要求？\n（2）为什么要坚持厉行法治？","answer":"答案：\n（1）体现了严格执法的要求。\n（2）原因：①全面依法治国必须坚持厉行法治，推进科学立法、严格执法、公正司法、全民守法；②厉行法治是对全体社会成员的共同要求，全体社会成员必须在宪法和法律范围内行使权利，履行义务；③法治是现代政治文明的核心，是发展市场经济、实现强国富民的基本保障；④法治是解决社会矛盾、维护社会稳定、实现社会正义的有效方式；⑤走法治道路是实现中华民族伟大复兴的必然选择；⑥社会因法治而进步，全面依法治国是中国特色社会主义的本质要求和重要保障。\n解析：本题考查厉行法治的要求和原因，需要结合材料和教材知识回答。"},{"id":"g3_daofa_009_ex07","knowledge_id":"g3_daofa_009","question":"选择题：下列做法符合厉行法治要求的是（  ）\n①全体社会成员必须在宪法和法律范围内行使权利，履行义务\n②政府及其工作人员要率先做尊法守法的榜样\n③加强法治宣传，弘扬法治精神，营造良好的法治文化环境\n④坚持依法治国和以德治国相结合\nA. ①②③  B. ①②④  C. ①③④  D. ①②③④","answer":"答案：D\n解析：①②③④都是厉行法治的要求。厉行法治是对全体社会成员的共同要求；政府及其工作人员要带头守法；要加强法治宣传；国家和社会治理需要法律和道德共同发挥作用。因此正确答案是D。"},{"id":"g3_daofa_009_ex08","knowledge_id":"g3_daofa_009","question":"填空题：国家和社会治理需要______和______共同发挥作用，既重视发挥法律的______作用，又重视发挥道德的______作用。","answer":"答案：法律；道德；规范；教化\n解析：国家和社会治理需要法律和道德共同发挥作用，既重视发挥法律的规范作用，又重视发挥道德的教化作用。以法治体现道德理念，强化法律对道德建设的促进作用；以道德滋养法治精神，强化道德对法治文化的支撑作用。"},{"id":"g3_daofa_009_ex09","knowledge_id":"g3_daofa_009","question":"简答题：厉行法治对全体社会成员提出了哪些要求？","answer":"答案：\n（1）厉行法治是对全体社会成员的共同要求。全体社会成员必须在宪法和法律范围内行使权利，履行义务。\n（2）现代社会的公民，要增强尊法学法守法用法意识，弘扬法治精神，强化规则意识，树立正确的权利义务观念。\n（3）政府及其工作人员要率先做尊法守法的榜样，带动全体公民共同守法。\n（4）厉行法治，需要加强法治宣传，弘扬法治精神，共同营造良好的法治文化环境，在全社会鲜明地树立起\"守法光荣、违法可耻\"的法治文化导向。\n（5）国家和社会治理需要法律和道德共同发挥作用，既重视发挥法律的规范作用，又重视发挥道德的教化作用。\n解析：本题考查厉行法治的要求，需要从公民、政府、社会、德治与法治结合等多个角度回答。"},{"id":"g3_daofa_009_ex10","knowledge_id":"g3_daofa_009","question":"材料分析题：阅读材料，回答问题。\n【材料】近年来，我国各地政府纷纷推出\"最多跑一次\"改革，让群众办事更方便、更快捷。同时，政府门户网站开设\"政务公开\"栏目，让权力在阳光下运行，接受群众监督。\n（1）\"最多跑一次\"改革体现了政府的什么宗旨和原则？\n（2）让权力在阳光下运行有什么重要意义？\n（3）作为公民，我们应该怎样监督政府的权力？","answer":"答案：\n（1）体现了政府为人民服务的宗旨，以及对人民负责、为人民谋利益的工作原则。\n（2）意义：①有利于保障人民的知情权、参与权、表达权和监督权；②有利于促进政府决策科学化和民主化；③有利于政府依法行政，防范行政权力的滥用；④有利于提高政府公信力，推进民主法治建设进程；⑤有利于维护广大人民群众的合法权益；⑥有利于推进全面依法治国，建设社会主义法治国家。\n（3）做法：①增强民主意识和法治意识，积极行使监督权；②通过合法的途径和方式行使监督权，如通过人大代表、信访、新闻媒体、网络等渠道反映问题；③要在法律允许的范围内行使监督权，实事求是，如实反映情况，不能诬告陷害；④要理性、公正、客观地表达意见和建议，遵守社会公德和秩序。\n解析：本题考查法治政府建设和公民监督的相关知识，需要多角度思考和回答。"},{"id":"g3_daofa_010_ex01","knowledge_id":"g3_daofa_010","question":"选择题：我国的根本政治制度是（  ）\nA. 中国共产党领导的多党合作和政治协商制度\nB. 人民代表大会制度\nC. 民族区域自治制度\nD. 基层群众自治制度","answer":"答案：B\n解析：人民代表大会制度是我国的根本政治制度，是人民掌握国家政权、行使权力的根本途径。A、C、D都是我国的基本政治制度。"},{"id":"g3_daofa_010_ex02","knowledge_id":"g3_daofa_010","question":"填空题：国家的一切权力属于______。人民通过______选出代表，组成各级人民代表大会作为国家权力机关。","answer":"答案：人民；民主选举\n解析：本题考查人民代表大会制度的基本内容。国家的一切权力属于人民；人民通过民主选举选出代表，组成各级人民代表大会作为国家权力机关。"},{"id":"g3_daofa_010_ex03","knowledge_id":"g3_daofa_010","question":"选择题：下列关于人大代表的说法正确的是（  ）\n①人大代表有权依法审议各项议案和报告\n②人大代表有权表决各项决定\n③人大代表有权提出议案和质询案\n④人大代表不受任何约束，可以随意行使权力\nA. ①②③  B. ①②④  C. ①③④  D. ②③④","answer":"答案：A\n解析：①②③都是人大代表的职权。④说法错误，人大代表必须依法行使职权，对人民负责，受人民监督。因此正确答案是A。"},{"id":"g3_daofa_010_ex04","knowledge_id":"g3_daofa_010","question":"简答题：人民代表大会制度的基本内容是什么？","answer":"答案：\n（1）国家的一切权力属于人民。\n（2）人民通过民主选举选出代表，组成各级人民代表大会作为国家权力机关。\n（3）由人民代表大会产生国家行政机关、监察机关、审判机关、检察机关，这些国家机关依法行使各自的职权，并对人民代表大会负责，受人民代表大会监督。\n（4）实行民主集中制，重大问题经人民代表大会充分讨论，遵循少数服从多数原则，民主决定。\n解析：本题考查人民代表大会制度的基本内容，是教材中的重点知识，需要准确记忆。"},{"id":"g3_daofa_010_ex05","knowledge_id":"g3_daofa_010","question":"填空题：由人民代表大会产生国家______机关、______机关、______机关、______机关，这些国家机关依法行使各自的职权，并对人民代表大会负责，受人民代表大会监督。","answer":"答案：行政；监察；审判；检察\n解析：本题考查人民代表大会与其他国家机关的关系。人民代表大会是国家权力机关，其他国家机关都由它产生，对它负责，受它监督。"},{"id":"g3_daofa_010_ex06","knowledge_id":"g3_daofa_010","question":"材料分析题：阅读材料，回答问题。\n【材料】2023年3月，第十四届全国人民代表大会第一次会议在北京召开。会议听取和审议了政府工作报告、最高人民法院工作报告、最高人民检察院工作报告，表决通过了关于国务院机构改革方案的决定、关于2022年国民经济和社会发展计划执行情况与2023年国民经济和社会发展计划的决议等。\n（1）上述材料体现了教材中的哪些观点？\n（2）全国人民代表大会是什么性质的国家机关？它有哪些职权？","answer":"答案：\n（1）体现的观点：①人民代表大会制度是我国的根本政治制度；②国家的一切权力属于人民；③全国人民代表大会是最高国家权力机关；④其他国家机关对人大负责，受人大监督；⑤人大代表有权审议各项议案和报告、表决各项决定；⑥我国实行民主集中制原则。\n（2）性质：全国人民代表大会是最高国家权力机关，代表全国人民统一行使国家权力，在整个国家机关体系中居于最高地位。\n职权：①立法权；②决定权；③任免权；④监督权。\n解析：本题考查人民代表大会制度和全国人大的相关知识，需要结合材料和教材知识综合作答。"},{"id":"g3_daofa_010_ex07","knowledge_id":"g3_daofa_010","question":"选择题：人民代表大会制度建立以来，不断得到巩固和发展，展现出蓬勃生机活力。实践充分证明，人民代表大会制度是（  ）\n①符合中国国情和实际的好制度\n②体现社会主义国家性质的好制度\n③保证人民当家作主的好制度\n④保障实现中华民族伟大复兴的好制度\nA. ①②③  B. ①②④  C. ①③④  D. ①②③④","answer":"答案：D\n解析：①②③④都是对人民代表大会制度的正确评价。人民代表大会制度是符合中国国情和实际、体现社会主义国家性质、保证人民当家作主、保障实现中华民族伟大复兴的好制度。因此正确答案是D。"},{"id":"g3_daofa_010_ex08","knowledge_id":"g3_daofa_010","question":"填空题：人大代表必须与人民群众保持密切联系，听取和反映人民群众的意见和要求，努力为人民______，对人民______，并接受人民______。","answer":"答案：服务；负责；监督\n解析：本题考查人大代表的义务。人大代表必须与人民群众保持密切联系，听取和反映人民群众的意见和要求，努力为人民服务，对人民负责，并接受人民监督。"},{"id":"g3_daofa_010_ex09","knowledge_id":"g3_daofa_010","question":"简答题：为什么要坚持和完善人民代表大会制度？","answer":"答案：\n（1）人民代表大会制度是我国的根本政治制度，是人民掌握国家政权、行使权力的根本途径。\n（2）人民代表大会制度建立以来，不断得到巩固和发展，展现出蓬勃生机活力。\n（3）实践充分证明，人民代表大会制度是符合中国国情和实际、体现社会主义国家性质、保证人民当家作主、保障实现中华民族伟大复兴的好制度。\n（4）人民代表大会制度是坚持党的领导、人民当家作主、依法治国有机统一的根本政治制度安排。\n（5）坚持和完善人民代表大会制度，有利于保证人民当家作主，有利于推进全面依法治国，有利于推进国家治理体系和治理能力现代化。\n解析：本题考查坚持人民代表大会制度的原因，需要从地位、实践证明、意义等角度回答。"},{"id":"g3_daofa_010_ex10","knowledge_id":"g3_daofa_010","question":"材料分析题：阅读材料，回答问题。\n【材料】据统计，十三届全国人大代表中，少数民族代表占代表总数的14.7%，全国55个少数民族都有本民族的代表；归侨代表占代表总数的2.9%；妇女代表占代表总数的24.9%；一线工人、农民代表占代表总数的15.7%；专业技术人员代表占代表总数的20.6%。\n（1）上述材料说明了什么？\n（2）人大代表享有哪些职权？应该履行哪些义务？","answer":"答案：\n（1）说明：①我国人大代表具有广泛的代表性，体现了我国社会主义民主是最广泛、最真实、最管用的民主；②我国各民族一律平等，各民族都有平等地参与国家管理的权利；③人民代表大会制度保障了人民当家作主的地位；④我国是人民当家作主的社会主义国家，国家的一切权力属于人民。\n（2）职权：①全国人民代表大会和地方各级人民代表大会代表依照宪法和法律赋予本级人民代表大会的各项职权，参加行使国家权力；②有权依法审议各项议案和报告；③有权表决各项决定；④有权提出议案和质询案。\n义务：①人大代表必须与人民群众保持密切联系；②听取和反映人民群众的意见和要求；③努力为人民服务，对人民负责；④接受人民监督。\n解析：本题考查人大代表的代表性和职权义务，需要结合材料和教材知识回答。"},{"id":"g3_daofa_011_ex01","knowledge_id":"g3_daofa_011","question":"选择题：中华优秀传统文化的特点是（  ）\nA. 历史悠久、博大精深\nB. 源远流长、博大精深\nC. 历史悠久、底蕴深厚\nD. 源远流长、底蕴深厚","answer":"答案：B\n解析：独具特色的语言文字，浩如烟海的文化典籍，名扬世界的科技工艺，异彩纷呈的文学艺术，等等，共同组成源远流长、博大精深的中华文化。"},{"id":"g3_daofa_011_ex02","knowledge_id":"g3_daofa_011","question":"填空题：文化是一个国家、一个民族的______。新时代，延续文化血脉需要发展______文化。","answer":"答案：灵魂；中国特色社会主义\n解析：文化是一个国家、一个民族的灵魂。新时代，延续文化血脉需要发展中国特色社会主义文化。中国特色社会主义文化，源自于中华民族五千多年文明历史所孕育的中华优秀传统文化。"},{"id":"g3_daofa_011_ex03","knowledge_id":"g3_daofa_011","question":"选择题：下列对中华文化的认识正确的是（  ）\n①中华文化源远流长、博大精深\n②中华文化虽历经沧桑而能薪火相传、一脉相承\n③中华文化是世界上最优秀的文化\n④中华文化具有应对挑战、与时俱进的创造力和海纳百川、有容乃大的包容力\nA. ①②③  B. ①②④  C. ①③④  D. ②③④","answer":"答案：B\n解析：①②④都是对中华文化的正确认识。③说法错误，文化没有优劣之分，各民族文化一律平等。因此正确答案是B。"},{"id":"g3_daofa_011_ex04","knowledge_id":"g3_daofa_011","question":"简答题：为什么要传承中华优秀传统文化？","answer":"答案：\n（1）中华文化源远流长、博大精深，是中华民族共有的精神家园。\n（2）中华文化积淀着中华民族最深层的精神追求，代表着中华民族独特的精神标识，为中华民族的伟大复兴提供精神动力。\n（3）中华文化独一无二的理念、智慧、气度、神韵，增添了中国人民和中华民族内心深处的自信和自豪。\n（4）中华传统美德是中华文化的精髓，蕴含着丰富的道德资源，是建设富强民主文明和谐美丽的社会主义现代化强国的精神力量。\n（5）文化是一个国家、一个民族的灵魂。新时代，延续文化血脉需要发展中国特色社会主义文化。\n解析：本题考查中华文化的重要性，需要从多个角度回答。"},{"id":"g3_daofa_011_ex05","knowledge_id":"g3_daofa_011","question":"填空题：中华传统美德是中华文化的______，蕴含着丰富的道德资源，熔铸了中华民族坚定的民族志向、高尚的民族品格和远大的民族理想，是代代相传的民族智慧，是建设富强民主文明和谐美丽的社会主义现代化强国的______。","answer":"答案：精髓；精神力量\n解析：本题考查中华传统美德的地位和作用。中华传统美德是中华文化的精髓，是建设社会主义现代化强国的精神力量。"},{"id":"g3_daofa_011_ex06","knowledge_id":"g3_daofa_011","question":"材料分析题：阅读材料，回答问题。\n【材料】近年来，《中国诗词大会》《经典咏流传》《典籍里的中国》等文化类节目深受观众喜爱。这些节目以创新的方式呈现中华优秀传统文化，让经典\"活\"了起来，激发了人们对中华优秀传统文化的热爱。\n（1）上述材料说明了什么？\n（2）新时代，我们应该怎样传承和发展中国特色社会主义文化？","answer":"答案：\n（1）说明：①中华优秀传统文化源远流长、博大精深，具有独特的魅力；②人们对中华优秀传统文化的认同感和自豪感不断增强；③文化创新能够激发传统文化的生机与活力；④我国高度重视文化建设，坚定文化自信；⑤中华优秀传统文化是中华民族共有的精神家园。\n（2）做法：①坚持以马克思主义为指导，坚守中华文化立场；②立足当代中国现实，结合当今时代条件；③不忘本来，吸收外来，面向未来，不断铸就中华文化新辉煌；④既要夯实优秀传统文化根基，薪火相传，代代守护；⑤又要在日新月异的社会生活中与时俱进，实现创造性转化、创新性发展；⑥还要跨越时空展示中华文化的独特魅力，在交流互鉴中丰富发展。\n解析：本题考查文化传承和创新的相关知识，需要结合材料和教材知识回答。"},{"id":"g3_daofa_011_ex07","knowledge_id":"g3_daofa_011","question":"选择题：中华传统美德内涵丰富，博大精深。下列属于中华传统美德的是（  ）\n①忧国忧民、道济天下的爱国情怀\n②勤劳勇敢、自强不息的奋进品格\n③自尊互敬、助人为乐的和乐风范\n④诚信守法、见利思义的高尚情操\nA. ①②③  B. ①②④  C. ①③④  D. ①②③④","answer":"答案：D\n解析：①②③④都是中华传统美德的内容。中华传统美德内涵丰富，博大精深，包括爱国情怀、奋进品格、和乐风范、高尚情操、伦理规范、处世准则等。因此正确答案是D。"},{"id":"g3_daofa_011_ex08","knowledge_id":"g3_daofa_011","question":"填空题：美德的力量在于______。推进社会公德、职业道德、家庭美德、个人品德建设，青少年责无旁贷；倡导向上向善、孝老爱亲、忠于祖国、忠于人民，青少年必须______。","answer":"答案：践行；身体力行\n解析：本题考查践行中华传统美德。美德的力量在于践行，青少年要身体力行，继承和弘扬中华传统美德。"},{"id":"g3_daofa_011_ex09","knowledge_id":"g3_daofa_011","question":"简答题：怎样坚定文化自信，发展中国特色社会主义文化？","answer":"答案：\n（1）文化自信是对自身文化价值的充分肯定，是对自身文化生命力的坚定信念，是一个国家、一个民族发展中更基本、更深沉、更持久的力量。\n（2）坚定文化自信，事关国运兴衰、文化安全和民族精神的传承发展。\n（3）增强文化自信，既要夯实优秀传统文化根基，薪火相传，代代守护；又要在日新月异的社会生活中与时俱进，实现创造性转化、创新性发展；还要跨越时空展示中华文化的独特魅力，在交流互鉴中丰富发展。\n（4）坚持以马克思主义为指导，坚守中华文化立场，立足当代中国现实，结合当今时代条件，不忘本来，吸收外来，面向未来，不断铸就中华文化新辉煌。\n解析：本题考查坚定文化自信的相关知识，需要从文化自信的含义、重要性和做法等角度回答。"},{"id":"g3_daofa_011_ex10","knowledge_id":"g3_daofa_011","question":"材料分析题：阅读材料，回答问题。\n【材料】习近平总书记指出：\"中华优秀传统文化是中华民族的精神命脉，是涵养社会主义核心价值观的重要源泉，也是我们在世界文化激荡中站稳脚跟的坚实根基。\"\n（1）为什么说中华优秀传统文化是\"中华民族的精神命脉\"？\n（2）作为青少年，我们应该怎样传承中华传统美德？","answer":"答案：\n（1）原因：①中华文化源远流长、博大精深，是中华民族共有的精神家园；②中华文化积淀着中华民族最深层的精神追求，代表着中华民族独特的精神标识，为中华民族的伟大复兴提供精神动力；③中华文化独一无二的理念、智慧、气度、神韵，增添了中国人民和中华民族内心深处的自信和自豪；④中华优秀传统文化是涵养社会主义核心价值观的重要源泉；⑤中华优秀传统文化是我们在世界文化激荡中站稳脚跟的坚实根基。\n（2）做法：①美德的力量在于践行，我们要身体力行，继承和弘扬中华传统美德；②推进社会公德、职业道德、家庭美德、个人品德建设，青少年责无旁贷；③倡导向上向善、孝老爱亲、忠于祖国、忠于人民，青少年必须身体力行；④在日常生活中，从小事做起，从自己做起，如孝敬父母、尊敬师长、诚实守信、助人为乐等；⑤积极宣传中华传统美德，让更多的人了解和践行中华传统美德。\n解析：本题考查中华优秀传统文化的重要性和传承传统美德的做法，需要结合材料和自身实际回答。"},{"id":"g3_daofa_012_ex01","knowledge_id":"g3_daofa_012","question":"选择题：中华民族精神的核心是（  ）\nA. 团结统一  B. 爱好和平\nC. 爱国主义  D. 自强不息","answer":"答案：C\n解析：在五千多年的发展历程中，中国人民形成了以爱国主义为核心的团结统一、爱好和平、勤劳勇敢、自强不息的伟大民族精神。A、B、D都是民族精神的重要内容，但不是核心。"},{"id":"g3_daofa_012_ex02","knowledge_id":"g3_daofa_012","question":"填空题：社会主义核心价值观分为三个层面，其中，国家层面的价值目标是______、______、______、______。","answer":"答案：富强；民主；文明；和谐\n解析：社会主义核心价值观分为三个层面：富强、民主、文明、和谐是国家层面的价值目标；自由、平等、公正、法治是社会层面的价值取向；爱国、敬业、诚信、友善是公民个人层面的价值准则。"},{"id":"g3_daofa_012_ex03","knowledge_id":"g3_daofa_012","question":"选择题：下列对民族精神的认识正确的是（  ）\n①民族精神是民族的\"魂魄\"\n②中华民族精神具有与时俱进的品格\n③伟大民族精神始终是中华民族生生不息、发展壮大的强大精神支柱\n④民族精神是一成不变的\nA. ①②③  B. ①②④  C. ①③④  D. ②③④","answer":"答案：A\n解析：①②③都是对民族精神的正确认识。④说法错误，中华民族精神具有与时俱进的品格，它在不同的历史时期有着不同的表现，并随着时代进步而不断丰富和发展。因此正确答案是A。"},{"id":"g3_daofa_012_ex04","knowledge_id":"g3_daofa_012","question":"简答题：为什么要弘扬和培育民族精神？","answer":"答案：\n（1）民族精神是民族的\"魂魄\"。一个民族要生存和发展，就要有昂扬向上的民族精神。\n（2）一个民族如果没有振奋的民族精神，没有坚定的民族志向和理想，就会失去凝聚力和生命力，就难以屹立于世界民族之林。\n（3）伟大民族精神始终是中华民族生生不息、发展壮大的强大精神支柱。\n（4）伟大民族精神是维系我国各族人民世世代代团结奋斗的牢固精神纽带。\n（5）伟大民族精神是激励中华儿女为实现中国梦而奋斗的不竭精神动力。\n解析：本题考查弘扬和培育民族精神的原因，需要从精神支柱、精神纽带、精神动力等角度回答。"},{"id":"g3_daofa_012_ex05","knowledge_id":"g3_daofa_012","question":"填空题：社会主义核心价值观是当代中国______的集中体现，是当代中国人评判是非曲直的______。","answer":"答案：精神；价值标准\n解析：社会主义核心价值观不仅是中国人民在共同生活中形成的价值共识，而且吸收了世界文明的有益成果，是当代中国精神的集中体现。社会主义核心价值观是当代中国人评判是非曲直的价值标准。"},{"id":"g3_daofa_012_ex06","knowledge_id":"g3_daofa_012","question":"材料分析题：阅读材料，回答问题。\n【材料】在抗击新冠肺炎疫情的斗争中，中国人民和中华民族以敢于斗争、敢于胜利的大无畏气概，铸就了\"生命至上、举国同心、舍生忘死、尊重科学、命运与共\"的伟大抗疫精神。伟大抗疫精神，同中华民族长期形成的特质禀赋和文化基因一脉相承，是爱国主义、集体主义、社会主义精神的传承和发展，是中国精神的生动诠释。\n（1）伟大抗疫精神体现了怎样的民族精神？\n（2）在新的时代条件下，我们应该怎样传承和弘扬民族精神？","answer":"答案：\n（1）体现了：①以爱国主义为核心的团结统一、爱好和平、勤劳勇敢、自强不息的伟大民族精神；②生命至上、举国同心、舍生忘死、尊重科学、命运与共的伟大抗疫精神；③中国人民是具有伟大创造精神、伟大奋斗精神、伟大团结精神、伟大梦想精神的人民。\n（2）做法：①传承和弘扬民族精神，表现在国家危难、民族危亡的紧要关头能够挺身而出、舍生忘死、前仆后继；②表现在他人生命、财产遇到危险的关键时刻能够见义勇为、扶危济困、无私奉献；③表现在日常学习工作中的勤勤恳恳、任劳任怨、敬业创优；④让我们从自己做起、从现在做起、从小事做起，自觉高扬民族精神，放飞梦想，创造精彩人生。\n解析：本题考查民族精神的内涵和弘扬民族精神的做法，需要结合材料和教材知识回答。"},{"id":"g3_daofa_012_ex07","knowledge_id":"g3_daofa_012","question":"选择题：社会主义核心价值观中，公民个人层面的价值准则是（  ）\nA. 富强、民主、文明、和谐\nB. 自由、平等、公正、法治\nC. 爱国、敬业、诚信、友善\nD. 公平、正义、诚信、友善","answer":"答案：C\n解析：社会主义核心价值观分为三个层面：A选项是国家层面的价值目标；B选项是社会层面的价值取向；C选项是公民个人层面的价值准则。D选项表述不准确。因此正确答案是C。"},{"id":"g3_daofa_012_ex08","knowledge_id":"g3_daofa_012","question":"填空题：中华民族精神具有______的品格。它在不同的历史时期有着不同的表现，并随着时代进步而不断______和______。","answer":"答案：与时俱进；丰富；发展\n解析：本题考查中华民族精神的品格。中华民族精神具有与时俱进的品格，它在不同的历史时期有着不同的表现，并随着时代进步而不断丰富和发展。"},{"id":"g3_daofa_012_ex09","knowledge_id":"g3_daofa_012","question":"简答题：为什么要培育和践行社会主义核心价值观？","answer":"答案：\n（1）社会主义核心价值观不仅是中国人民在共同生活中形成的价值共识，而且吸收了世界文明的有益成果，是当代中国精神的集中体现。\n（2）我国宪法规定，国家倡导社会主义核心价值观。社会主义核心价值观是当代中国人评判是非曲直的价值标准。\n（3）社会主义核心价值观凝结着全体人民共同的价值追求，是坚持和发展中国特色社会主义的价值导向，也是实现中华民族伟大复兴的价值引领。\n（4）社会主义核心价值观促进人的全面发展，引领社会全面进步。\n（5）培育和践行社会主义核心价值观，有利于培养担当民族复兴大任的时代新人，有利于汇聚实现中华民族伟大复兴的磅礴力量。\n解析：本题考查社会主义核心价值观的重要性，需要从多个角度回答。"},{"id":"g3_daofa_012_ex10","knowledge_id":"g3_daofa_012","question":"材料分析题：阅读材料，回答问题。\n【材料】习近平总书记指出：\"青年的价值取向决定了未来整个社会的价值取向，而青年又处在价值观形成和确立的时期，抓好这一时期的价值观养成十分重要。这就像穿衣服扣扣子一样，如果第一粒扣子扣错了，剩余的扣子都会扣错。人生的扣子从一开始就要扣好。\"\n（1）为什么说\"人生的扣子从一开始就要扣好\"？\n（2）作为青少年，我们应该怎样培育和践行社会主义核心价值观？","answer":"答案：\n（1）原因：①青少年处在价值观形成和确立的关键时期，抓好这一时期的价值观养成十分重要；②社会主义核心价值观是当代中国精神的集中体现，是当代中国人评判是非曲直的价值标准；③社会主义核心价值观凝结着全体人民共同的价值追求，是坚持和发展中国特色社会主义的价值导向；④社会主义核心价值观促进人的全面发展，引领社会全面进步；⑤青年的价值取向决定了未来整个社会的价值取向，青年兴则国家兴，青年强则国家强。\n（2）做法：①培育和践行社会主义核心价值观，要与日常生活紧密联系起来，做到落细、落小、落实；②青少年处在价值观形成的关键时期，我们应自觉做到勤于学习、敏于思考，注重修养、勇于实践，明辨是非、善于选择，认真做事、踏实做人；③我们要把社会主义核心价值观的要求融入到自己的学习和生活中，内化于心、外化于行；④积极参加社会实践活动，在实践中践行社会主义核心价值观；⑤从自己做起、从身边小事做起，热爱祖国、敬业奉献、诚实守信、友善待人。\n解析：本题考查青少年培育和践行社会主义核心价值观的重要性和做法，需要结合自身实际回答。"},{"id":"g3_daofa_013_ex01","knowledge_id":"g3_daofa_013","question":"选择题：我国人口现状的基本特点是（  ）\nA. 人口基数大，人口素质偏低\nB. 增速趋缓、出生率低\nC. 老龄化加剧、男女性别比失衡\nD. 城乡分布不均衡、\"独生子女\"社会问题凸显","answer":"答案：A\n解析：人口基数大，人口素质偏低，是我国人口现状的基本特点。B、C、D都是我国人口状况呈现出的新的特点，不是基本特点。"},{"id":"g3_daofa_013_ex02","knowledge_id":"g3_daofa_013","question":"填空题：我国自然资源丰富，______大，______多，但人均资源占有量少，开发难度大，总体上资源紧缺。","answer":"答案：总量；种类\n解析：本题考查我国的资源现状。我国自然资源丰富，总量大，种类多，但人均资源占有量少，开发难度大，总体上资源紧缺。"},{"id":"g3_daofa_013_ex03","knowledge_id":"g3_daofa_013","question":"选择题：下列对我国人口问题的认识正确的是（  ）\n①人口问题已经成为一个日益严峻的全球性问题\n②我国是世界上人口最多的国家，这是我国社会主义初级阶段的重要国情\n③人口问题始终是我国面临的全局性、长期性、战略性问题\n④计划生育基本国策已经过时，不再需要坚持\nA. ①②③  B. ①②④  C. ①③④  D. ②③④","answer":"答案：A\n解析：①②③都是对人口问题的正确认识。④说法错误，计划生育基本国策必须长期坚持，生育政策要随着人口和经济社会发展形势的变化不断完善。因此正确答案是A。"},{"id":"g3_daofa_013_ex04","knowledge_id":"g3_daofa_013","question":"简答题：我国面临怎样的资源形势？","answer":"答案：\n（1）我国自然资源丰富，总量大，种类多，但人均资源占有量少，开发难度大，总体上资源紧缺。\n（2）长期以来，我国资源开发利用不尽合理、不够科学，依靠消耗大量资源换取经济发展的现象突出，由此造成的浪费、损失、污染和破坏都很严重。\n（3）我国面临的资源形势非常严峻。\n（4）对资源的过度开发、粗放利用和无节制消耗，必然导致资源的枯竭和对生态环境的破坏，严重影响经济的可持续发展，经济发展的空间和后劲也会越来越小。\n解析：本题考查我国的资源形势，需要从资源现状、开发利用情况、严峻形势等角度回答。"},{"id":"g3_daofa_013_ex05","knowledge_id":"g3_daofa_013","question":"填空题：人口问题始终是我国面临的______、______、______问题。","answer":"答案：全局性；长期性；战略性\n解析：人口问题始终是我国面临的全局性、长期性、战略性问题。在未来相当长的时期内，我国人口众多的基本国情不会根本改变，人口对经济社会发展的压力不会根本改变，人口与资源环境的紧张关系不会根本改变。"},{"id":"g3_daofa_013_ex06","knowledge_id":"g3_daofa_013","question":"材料分析题：阅读材料，回答问题。\n【材料】第七次全国人口普查数据显示，全国人口共141178万人，与2010年第六次全国人口普查数据相比，增加7206万人，增长5.38%，年平均增长率为0.53%。我国60岁及以上人口为26402万人，占18.70%，与2010年相比上升5.44个百分点。\n（1）上述材料反映了我国人口现状的哪些特点？\n（2）为什么要长期坚持计划生育基本国策？","answer":"答案：\n（1）特点：①人口基数大；②人口增速趋缓、出生率低；③老龄化加剧。\n（2）原因：①人口问题始终是我国面临的全局性、长期性、战略性问题；②在未来相当长的时期内，我国人口众多的基本国情不会根本改变；③人口对经济社会发展的压力不会根本改变；④人口与资源环境的紧张关系不会根本改变；⑤国家推行计划生育，使人口的增长同经济和社会发展计划相适应，有效地缓解了人口对资源、环境的压力，有力地促进了经济发展与社会进步；⑥生育政策要随着人口和经济社会发展形势的变化不断完善，促进人口长期均衡发展。\n解析：本题考查我国人口现状的特点和计划生育基本国策，需要结合材料和教材知识回答。"},{"id":"g3_daofa_013_ex07","knowledge_id":"g3_daofa_013","question":"选择题：下列对我国环境问题的认识正确的是（  ）\n①当前我国生态环境虽总体有所改善，但生态环境形势仍不容乐观\n②环境恶化加剧自然灾害的发生，严重破坏生态平衡\n③环境恶化威胁着人民的生命安全和身体健康\n④我国的环境问题已经无法解决\nA. ①②③  B. ①②④  C. ①③④  D. ②③④","answer":"答案：A\n解析：①②③都是对我国环境问题的正确认识。④说法错误，我国的环境问题是可以解决的，只要我们坚持绿色发展，走可持续发展道路，就一定能建设美丽中国。因此正确答案是A。"},{"id":"g3_daofa_013_ex08","knowledge_id":"g3_daofa_013","question":"填空题：当前我国生态环境虽总体有所改善，但生态环境形势仍______。环境恶化加剧______的发生，严重破坏______，威胁着人民的生命安全和身体健康。","answer":"答案：不容乐观；自然灾害；生态平衡\n解析：本题考查我国的环境形势和环境问题的危害。当前我国生态环境形势仍不容乐观，环境恶化有严重的危害。"},{"id":"g3_daofa_013_ex09","knowledge_id":"g3_daofa_013","question":"简答题：人口问题给我国带来了哪些影响？","answer":"答案：\n（1）人口问题给资源和环境带来了巨大的压力，使得资源短缺、环境恶化的问题更加突出。\n（2）人口问题影响经济社会的可持续发展，制约着人民生活水平的提高。\n（3）人口问题带来了就业、教育、医疗、住房等一系列社会问题，影响社会的和谐稳定。\n（4）人口老龄化加剧，增加了社会保障和养老负担，影响经济社会发展。\n（5）人口素质偏低，影响了我国科技创新能力和国际竞争力的提升。\n解析：本题考查人口问题的影响，需要从资源环境、经济发展、社会稳定等多个角度回答。"},{"id":"g3_daofa_013_ex10","knowledge_id":"g3_daofa_013","question":"材料分析题：阅读材料，回答问题。\n【材料】据统计，我国人均耕地面积不到世界平均水平的40%，人均水资源占有量仅为世界平均水平的28%，石油、天然气等重要矿产资源的人均储量也远低于世界平均水平。同时，我国资源利用效率不高，单位GDP能耗是世界平均水平的1.5倍。\n（1）上述材料反映了什么问题？\n（2）针对这些问题，我们应该采取哪些对策？","answer":"答案：\n（1）反映的问题：①我国人均资源占有量少，总体上资源紧缺；②我国资源开发利用不尽合理、不够科学，资源利用效率不高；③依靠消耗大量资源换取经济发展的现象突出，浪费、损失严重；④我国面临的资源形势非常严峻。\n（2）对策：①坚持节约资源和保护环境的基本国策；②坚持创新、协调、绿色、开放、共享的发展理念；③实施可持续发展战略，走绿色发展道路；④转变发展方式，坚持绿色富国、绿色惠民；⑤依靠科技创新，提高资源利用效率，降低能耗；⑥大力倡导节能、环保、低碳、文明的绿色生产生活方式；⑦建设资源节约型、环境友好型社会，实现经济发展与资源环境相协调。\n解析：本题考查我国的资源问题和应对对策，需要结合材料和教材知识综合作答。"},{"id":"g3_daofa_014_ex01","knowledge_id":"g3_daofa_014","question":"选择题：实现人与自然和谐发展，建设生态文明，要以（  ）为准则。\nA. 资源环境承载能力  B. 自然规律\nC. 可持续发展  D. 人与自然和谐共生","answer":"答案：B\n解析：实现人与自然和谐发展，建设生态文明，要以资源环境承载能力为基础，以自然规律为准则，以可持续发展、人与自然和谐共生为目标。A是基础，C、D是目标。"},{"id":"g3_daofa_014_ex02","knowledge_id":"g3_daofa_014","question":"填空题：建设生态文明，促进人与自然和谐共生，要坚持______和______的基本国策，使青山常在、绿水长流、空气常新。","answer":"答案：节约资源；保护环境\n解析：本题考查建设生态文明的基本国策。建设生态文明，促进人与自然和谐共生，要坚持节约资源和保护环境的基本国策，坚持创新、协调、绿色、开放、共享的发展理念。"},{"id":"g3_daofa_014_ex03","knowledge_id":"g3_daofa_014","question":"选择题：下列关于\"绿水青山就是金山银山\"的理解正确的是（  ）\n①走绿色发展道路，要处理好经济发展与生态环境保护的关系\n②我们既要绿水青山，也要金山银山\n③如果金山银山要以失去绿水青山为代价，那么宁要绿水青山，不要金山银山\n④绿水青山和金山银山是对立的，二者不可兼得\nA. ①②③  B. ①②④  C. ①③④  D. ②③④","answer":"答案：A\n解析：①②③都是对\"绿水青山就是金山银山\"的正确理解。④说法错误，绿水青山和金山银山不是对立的，保护生态环境就是保护生产力，改善生态环境就是发展生产力。因此正确答案是A。"},{"id":"g3_daofa_014_ex04","knowledge_id":"g3_daofa_014","question":"简答题：为什么要坚持人与自然和谐共生？","answer":"答案：\n（1）追求人与自然和谐共生，是人类面对生态危机作出的智慧选择。\n（2）自然为人类的生存与发展提供滋养和必要条件；人类作为自然的一部分，也有责任避免自然受到不必要的伤害，同时要为开发和利用自然作出必要的补偿和修复。\n（3）人与自然相互依存，共生共荣。这是一种动态中的平衡、发展中的协调、进取中的有度、多元中的一致、\"纷乱\"中的有序。\n（4）人类开发和利用自然，但不能肆意凌驾于自然之上，必须遵循自然规律。如果我们对自然只是一味地索取，必然受到它的惩罚。\n（5）生态兴则文明兴，生态衰则文明衰。\n（6）实现人与自然和谐发展，建设生态文明，是关系人民福祉、关乎民族未来的长远大计。\n解析：本题考查人与自然和谐共生的原因，需要从多个角度回答。"},{"id":"g3_daofa_014_ex05","knowledge_id":"g3_daofa_014","question":"填空题：走绿色发展道路，建设生态文明，实现可持续发展，已经成为当代中国的______。走绿色发展道路，要处理好______与______的关系。","answer":"答案：发展共识；经济发展；生态环境保护\n解析：本题考查绿色发展道路。走绿色发展道路已经成为当代中国的发展共识，要处理好经济发展与生态环境保护的关系。"},{"id":"g3_daofa_014_ex06","knowledge_id":"g3_daofa_014","question":"材料分析题：阅读材料，回答问题。\n【材料】党的二十大报告指出：\"中国式现代化是人与自然和谐共生的现代化。人与自然是生命共同体，无止境地向自然索取甚至破坏自然必然会遭到大自然的报复。我们坚持可持续发展，坚持节约优先、保护优先、自然恢复为主的方针，像保护眼睛一样保护自然和生态环境，坚定不移走生产发展、生活富裕、生态良好的文明发展道路，实现中华民族永续发展。\"\n（1）为什么要坚定不移走生产发展、生活富裕、生态良好的文明发展道路？\n（2）怎样坚持走绿色发展道路？","answer":"答案：\n（1）原因：①追求人与自然和谐共生，是人类面对生态危机作出的智慧选择；②人与自然相互依存，共生共荣；③人类开发和利用自然，但不能肆意凌驾于自然之上，必须遵循自然规律，如果我们对自然只是一味地索取，必然受到它的惩罚；④生态兴则文明兴，生态衰则文明衰；⑤建设生态文明，促进人与自然和谐共生，是关系人民福祉、关乎民族未来的长远大计；⑥实现人与自然和谐发展，建设生态文明，要以可持续发展、人与自然和谐共生为目标。\n（2）做法：①坚持走绿色发展道路，要处理好经济发展与生态环境保护的关系，既要绿水青山，也要金山银山；②走绿色发展道路，坚持绿色富国，让人民群众切实感受到经济发展带来的环境效益；③坚持绿色惠民，将良好生态环境作为最普惠的民生福祉，激发人民群众的绿色创造热情，实现绿色富国之梦；④走绿色、循环、低碳发展之路，要坚持节约优先、保护优先、自然恢复的原则，大力倡导节能、环保、低碳、文明的绿色生产生活方式；⑤建设生态文明，必须严守资源消耗上限、环境质量底线、生态保护红线；⑥只有实行最严格的生态环境保护制度，全面建立资源高效利用制度，健全生态保护和修复制度，严明生态环境保护责任制度，才能为生态文明建设提供可靠保障。\n解析：本题考查绿色发展道路的相关知识，需要结合材料和教材知识综合作答。"},{"id":"g3_daofa_014_ex07","knowledge_id":"g3_daofa_014","question":"选择题：走绿色、循环、低碳发展之路，要坚持的原则是（  ）\n①节约优先  ②保护优先\n③自然恢复  ④开发优先\nA. ①②③  B. ①②④  C. ①③④  D. ②③④","answer":"答案：A\n解析：走绿色、循环、低碳发展之路，要坚持节约优先、保护优先、自然恢复的原则，大力倡导节能、环保、低碳、文明的绿色生产生活方式。④开发优先说法错误。因此正确答案是A。"},{"id":"g3_daofa_014_ex08","knowledge_id":"g3_daofa_014","question":"填空题：建设生态文明，必须严守资源消耗______、环境质量______、生态保护______。","answer":"答案：上限；底线；红线\n解析：建设生态文明，必须严守资源消耗上限、环境质量底线、生态保护红线。只有实行最严格的制度、最严密的法治，才能为生态文明建设提供可靠保障。"},{"id":"g3_daofa_014_ex09","knowledge_id":"g3_daofa_014","question":"简答题：在日常生活中，我们青少年应该怎样践行绿色低碳生活方式？","answer":"答案：\n（1）树立绿色、低碳生活理念，养成物尽其用、减少废弃物的文明行为。\n（2）拒绝购买过度包装产品，选购无包装、简易包装、大容量包装产品。\n（3）少用或不用一次性产品，选购和使用可再生材料制品。\n（4）节约粮食，减少浪费，适量点餐，践行\"光盘行动\"。\n（5）绿色出行，尽量搭乘公共交通工具，减少私家车出行，多骑自行车。\n（6）节约用水、用电，随手关灯、关水龙头，纸张双面使用。\n（7）积极参加植树造林活动，保护花草树木。\n（8）学习和宣传环保知识，发现污染环境的行为及时举报。\n解析：本题考查青少年践行绿色低碳生活方式的做法，属于开放性题目，言之有理即可。"},{"id":"g3_daofa_014_ex10","knowledge_id":"g3_daofa_014","question":"材料分析题：阅读材料，回答问题。\n【材料】塞罕坝林场始建于1962年。当时的塞罕坝是\"黄沙遮天日，飞鸟无栖树\"的荒漠沙地。三代塞罕坝人经过50多年的艰苦奋斗，创造了荒原变林海的人间奇迹，用实际行动诠释了绿水青山就是金山银山的理念，铸就了牢记使命、艰苦创业、绿色发展的塞罕坝精神。\n（1）塞罕坝人创造的人间奇迹给我们什么启示？\n（2）塞罕坝精神体现了怎样的民族精神？\n（3）作为青少年，我们应该怎样向塞罕坝人学习？","answer":"答案：\n（1）启示：①人与自然是生命共同体，人类必须尊重自然、顺应自然、保护自然；②绿水青山就是金山银山，保护生态环境就是保护生产力，改善生态环境就是发展生产力；③走绿色发展道路，建设生态文明，实现可持续发展，已经成为当代中国的发展共识；④实现人与自然和谐发展，需要我们发扬艰苦奋斗、无私奉献的精神；⑤生态兴则文明兴，生态衰则文明衰。\n（2）体现了：以爱国主义为核心的团结统一、爱好和平、勤劳勇敢、自强不息的伟大民族精神，以及牢记使命、艰苦创业、绿色发展的塞罕坝精神。\n（3）做法：①树立远大理想，增强社会责任感；②学习塞罕坝人艰苦奋斗、无私奉献的精神；③树立绿色、低碳生活理念，养成物尽其用、减少废弃物的文明行为；④从身边小事做起，践行绿色低碳生活方式；⑤积极参加环保公益活动，为建设美丽中国贡献自己的力量；⑥努力学习科学文化知识，为将来建设祖国、保护环境奠定基础。\n解析：本题考查生态文明建设和民族精神的相关知识，需要结合材料和自身实际回答。"},{"id":"g3_daofa_015_ex01","knowledge_id":"g3_daofa_015","question":"选择题：我国处理民族关系的基本原则是（  ）\nA. 民族平等、民族团结、各民族共同繁荣\nB. 平等团结互助和谐\nC. 民族区域自治制度\nD. 尊重各民族的风俗习惯","answer":"答案：A\n解析：新中国成立后，在处理民族关系上，我国坚持民族平等、民族团结和各民族共同繁荣的基本原则。B选项是社会主义新型民族关系；C选项是我国的一项基本政治制度；D选项是维护民族团结的具体做法。"},{"id":"g3_daofa_015_ex02","knowledge_id":"g3_daofa_015","question":"填空题：我国是统一的多民族国家。在漫长的历史发展过程中，我国逐步形成以______为主体，______、______、______的民族分布特点。","answer":"答案：汉族；大杂居；小聚居；交错杂居\n解析：本题考查我国民族分布的特点。我国是统一的多民族国家，逐步形成以汉族为主体，大杂居、小聚居、交错杂居的民族分布特点。"},{"id":"g3_daofa_015_ex03","knowledge_id":"g3_daofa_015","question":"选择题：下列对民族区域自治制度的认识正确的是（  ）\n①民族区域自治制度是我国的一项基本政治制度\n②民族区域自治制度是尊重历史、合乎国情、顺应民心的必然选择\n③实行民族区域自治制度，有利于把国家的集中、统一与各民族的自主、平等结合起来\n④民族区域自治制度可以不受国家的统一领导\nA. ①②③  B. ①②④  C. ①③④  D. ②③④","answer":"答案：A\n解析：①②③都是对民族区域自治制度的正确认识。④说法错误，民族区域自治制度是在国家统一领导下的自治，各民族自治地方是国家不可分割的组成部分。因此正确答案是A。"},{"id":"g3_daofa_015_ex04","knowledge_id":"g3_daofa_015","question":"简答题：为什么要维护和促进民族团结？","answer":"答案：\n（1）我国是统一的多民族国家。五十六个民族组成了中华民族大家庭。\n（2）加强和巩固民族团结，维护祖国统一，是中华民族的最高利益。\n（3）我国各民族在数千年的交往中孕育了团结友爱的宝贵传统。\n（4）我国各族人民始终同呼吸、共命运、心连心，克服种种困难和艰险，顶住压力，直面挑战，追求共同发展、共同富裕、共同繁荣。\n（5）维护和促进民族团结，是每个公民的神圣职责和光荣义务。\n（6）
