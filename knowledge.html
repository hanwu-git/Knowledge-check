","question":"练习题目 4 关于知识点 42","answer":"这是练习 4 的答案和解析"},{"id":"g2_english_l042_ex05","knowledge_id":"g2_english_l042","question":"练习题目 5 关于知识点 42","answer":"这是练习 5 的答案和解析"},{"id":"g2_english_l042_ex06","knowledge_id":"g2_english_l042","question":"练习题目 6 关于知识点 42","answer":"这是练习 6 的答案和解析"},{"id":"g2_english_l042_ex07","knowledge_id":"g2_english_l042","question":"练习题目 7 关于知识点 42","answer":"这是练习 7 的答案和解析"},{"id":"g2_english_l042_ex08","knowledge_id":"g2_english_l042","question":"练习题目 8 关于知识点 42","answer":"这是练习 8 的答案和解析"},{"id":"g2_english_l042_ex09","knowledge_id":"g2_english_l042","question":"练习题目 9 关于知识点 42","answer":"这是练习 9 的答案和解析"},{"id":"g2_english_l042_ex10","knowledge_id":"g2_english_l042","question":"练习题目 10 关于知识点 42","answer":"这是练习 10 的答案和解析"},{"id":"g2_english_u001_ex01","knowledge_id":"g2_english_u001","question":"She ________ (go) to Beijing last week.","answer":"went；句意：她上周去了北京。last week表明是一般过去时，go的过去式是went。"},{"id":"g2_english_u001_ex02","knowledge_id":"g2_english_u001","question":"They ________ (play) football yesterday.","answer":"played；句意：他们昨天踢足球了。一般过去时，play加-ed。"},{"id":"g2_english_u001_ex03","knowledge_id":"g2_english_u001","question":"He ________ (be) at home last night.","answer":"was；句意：他昨晚在家。last night是一般过去时的时间状语，he用was。"},{"id":"g2_english_u001_ex04","knowledge_id":"g2_english_u001","question":"I ________ (see) an interesting film last Friday.","answer":"saw；句意：我上周五看了一部有趣的电影。不规则动词see的过去式是saw。"},{"id":"g2_english_u001_ex05","knowledge_id":"g2_english_u001","question":"We ________ (have) a party last Saturday.","answer":"had；句意：我们上周六举办了一个聚会。have的过去式是had。"},{"id":"g2_english_u001_ex06","knowledge_id":"g2_english_u001","question":"The boy ________ (find) his lost book yesterday.","answer":"found；句意：那个男孩昨天找到了他丢失的书。find的过去式是found。"},{"id":"g2_english_u001_ex07","knowledge_id":"g2_english_u001","question":"She ________ (not/go) to school yesterday.","answer":"didnt go；句意：她昨天没去学校。否定句用did not + 动词原形。"},{"id":"g2_english_u001_ex08","knowledge_id":"g2_english_u001","question":"________ you ________ (visit) your grandmother last weekend?","answer":"Did, visit；句意：你上周末去看望你奶奶了吗？疑问句用did开头。"},{"id":"g2_english_u001_ex09","knowledge_id":"g2_english_u001","question":"Where ________ he ________ (go) last holiday?","answer":"did, go；句意：他上个假期去哪里了？Where引导的特殊疑问句。"},{"id":"g2_english_u001_ex10","knowledge_id":"g2_english_u001","question":"What ________ she ________ (do) last night?","answer":"did, do；句意：她昨晚做了什么？What引导的特殊疑问句。"},{"id":"g2_english_u002_ex01","knowledge_id":"g2_english_u002","question":"Play → ________","answer":"played；规则动词过去式直接加-ed。"},{"id":"g2_english_u002_ex02","knowledge_id":"g2_english_u002","question":"Study → ________","answer":"studied；以y结尾的动词，y变i加-ed。"},{"id":"g2_english_u002_ex03","knowledge_id":"g2_english_u002","question":"Stop → ________","answer":"stopped；以辅音字母加y结尾的动词，y变i加-ed。"},{"id":"g2_english_u002_ex04","knowledge_id":"g2_english_u002","question":"Plan → ________","answer":"planned；以辅音字母结尾的重读闭音节，双写末字母加-ed。"},{"id":"g2_english_u002_ex05","knowledge_id":"g2_english_u002","question":"Cook → ________","answer":"cooked；直接加-ed。"},{"id":"g2_english_u002_ex06","knowledge_id":"g2_english_u002","question":"Wait → ________","answer":"waited；直接加-ed。"},{"id":"g2_english_u002_ex07","knowledge_id":"g2_english_u002","question":"Try → ________","answer":"tried；以元音加y结尾，直接加-ed。"},{"id":"g2_english_u002_ex08","knowledge_id":"g2_english_u002","question":"Push → ________","answer":"pushed；以sh/ch/o/s/x结尾，加-es但过去式加-ed。"},{"id":"g2_english_u002_ex09","knowledge_id":"g2_english_u002","question":"Finish → ________","answer":"finished；直接加-ed。"},{"id":"g2_english_u002_ex10","knowledge_id":"g2_english_u002","question":"Dance → ________","answer":"danced；以e结尾，去e加-ed。"},{"id":"g2_english_u003_ex01","knowledge_id":"g2_english_u003","question":"Go → ________","answer":"went；不规则动词，go的过去式是went。"},{"id":"g2_english_u003_ex02","knowledge_id":"g2_english_u003","question":"Eat → ________","answer":"ate；不规则动词，eat的过去式是ate。"},{"id":"g2_english_u003_ex03","knowledge_id":"g2_english_u003","question":"See → ________","answer":"saw；不规则动词，see的过去式是saw。"},{"id":"g2_english_u003_ex04","knowledge_id":"g2_english_u003","question":"Take → ________","answer":"took；不规则动词，take的过去式是took。"},{"id":"g2_english_u003_ex05","knowledge_id":"g2_english_u003","question":"Write → ________","answer":"wrote；不规则动词，write的过去式是wrote。"},{"id":"g2_english_u003_ex06","knowledge_id":"g2_english_u003","question":"Read → ________","answer":"read；不规则动词，read的过去式仍是read但发音不同。"},{"id":"g2_english_u003_ex07","knowledge_id":"g2_english_u003","question":"Buy → ________","answer":"bought；不规则动词，buy的过去式是bought。"},{"id":"g2_english_u003_ex08","knowledge_id":"g2_english_u003","question":"Speak → ________","answer":"spoke；不规则动词，speak的过去式是spoke。"},{"id":"g2_english_u003_ex09","knowledge_id":"g2_english_u003","question":"Come → ________","answer":"came；不规则动词，come的过去式是came。"},{"id":"g2_english_u003_ex10","knowledge_id":"g2_english_u003","question":"Give → ________","answer":"gave；不规则动词，give的过去式是gave。"},{"id":"g2_english_u004_ex01","knowledge_id":"g2_english_u004","question":"She didnt call me. (改为肯定句)","answer":"She called me.；didnt后接动词原形，谓语动词用过去式。"},{"id":"g2_english_u004_ex02","knowledge_id":"g2_english_u004","question":"They played basketball. (改为否定句)","answer":"They didnt play basketball.； didnt play basketball。"},{"id":"g2_english_u004_ex03","knowledge_id":"g2_english_u004","question":"Did you go home yesterday? (做否定回答)","answer":"No, I didnt.；否定回答用No, I didnt。"},{"id":"g2_english_u004_ex04","knowledge_id":"g2_english_u004","question":"He was at school. (改为否定句)","answer":"He wasnt at school.；was的否定形式是wasnt。"},{"id":"g2_english_u004_ex05","knowledge_id":"g2_english_u004","question":"She studied English last night. (对studied提问)","answer":"What did she study last night?；对谓语提问用What...do。"},{"id":"g2_english_u004_ex06","knowledge_id":"g2_english_u004","question":"We went to Beijing by train. (对by train提问)","answer":"How did you go to Beijing?；对方式状语提问用How。"},{"id":"g2_english_u004_ex07","knowledge_id":"g2_english_u004","question":"He came back last week. (改为一般疑问句)","answer":"Did he come back last week?；过去时的疑问句用Did。"},{"id":"g2_english_u004_ex08","knowledge_id":"g2_english_u004","question":"She didnt feel well yesterday. (对yesterday提问)","answer":"When didnt she feel well?；对时间状语提问用When。"},{"id":"g2_english_u004_ex09","knowledge_id":"g2_english_u004","question":"They were happy. (改为否定句)","answer":"They werent happy.；were的否定形式是werent。"},{"id":"g2_english_u004_ex10","knowledge_id":"g2_english_u004","question":"Did she buy a new bag? (做肯定回答)","answer":"Yes, she did.；肯定回答用Yes, she did。"},{"id":"g2_english_u005_ex01","knowledge_id":"g2_english_u005","question":"Where ________ you ________ (go) last Sunday?","answer":"did, go；Where引导特殊疑问句，用did帮助构成疑问。"},{"id":"g2_english_u005_ex02","knowledge_id":"g2_english_u005","question":"A: Where did she work? B: She ________ in a hospital.","answer":"worked；_work in a hospital_表示\"在医院工作\"。"},{"id":"g2_english_u005_ex03","knowledge_id":"g2_english_u005","question":"Where ________ (be) your brother last month?","answer":"was；brother是单数，用was。"},{"id":"g2_english_u005_ex04","knowledge_id":"g2_english_u005","question":"A: Where did they have lunch? B: They had lunch ________.","answer":"at school / in the cafeteria；根据实际情况回答。"},{"id":"g2_english_u005_ex05","knowledge_id":"g2_english_u005","question":"Where ________ (do) you stay during the vacation?","answer":"did, stay；Where用来提问地点。"},{"id":"g2_english_u005_ex06","knowledge_id":"g2_english_u005","question":"The book is on the desk. (对划线部分提问)","answer":"Where is the book?；对地点提问用Where。"},{"id":"g2_english_u005_ex07","knowledge_id":"g2_english_u005","question":"A: Where did Tom go yesterday? B: He ________ to the park.","answer":"went；_go to the park_表示\"去公园\"。"},{"id":"g2_english_u005_ex08","knowledge_id":"g2_english_u005","question":"Where ________ your parents ________ (live) before?","answer":"did, live；Where用来提问居住地点。"},{"id":"g2_english_u005_ex09","knowledge_id":"g2_english_u005","question":"A: Where was the movie shown? B: It ________ in the cinema.","answer":"was shown / shown in the cinema；回答电影放映的地点。"},{"id":"g2_english_u005_ex10","knowledge_id":"g2_english_u005","question":"Where ________ (be) you born?","answer":"were；you对应were。"},{"id":"g2_english_u006_ex01","knowledge_id":"g2_english_u006","question":"________ is in the room. Who is it?","answer":"Someone / Somebody；表示\"某人\"，指代未知的人。"},{"id":"g2_english_u006_ex02","knowledge_id":"g2_english_u006","question":"I cant find my keys. They are ________.","answer":"somewhere；表示\"在某处\"，用于肯定句。"},{"id":"g2_english_u006_ex03","knowledge_id":"g2_english_u006","question":"Did ________ come to see me yesterday?","answer":"anyone / anybody；用于疑问句中表示\"任何人\"。"},{"id":"g2_english_u006_ex04","knowledge_id":"g2_english_u006","question":"Theres ________ in the bag. Its empty.","answer":"nothing；表示\"什么都没有\"。"},{"id":"g2_english_u006_ex05","knowledge_id":"g2_english_u006","question":"This is ________ interesting. I like it.","answer":"something；表示\"某事/某物\"，用于肯定句。"},{"id":"g2_english_u006_ex06","knowledge_id":"g2_english_u006","question":"Is there ________ in the classroom?","answer":"anyone / anybody；用于疑问句中。"},{"id":"g2_english_u006_ex07","knowledge_id":"g2_english_u006","question":"She told me ________ important yesterday.","answer":"something；修饰不定代词的形容词要后置。"},{"id":"g2_english_u006_ex08","knowledge_id":"g2_english_u006","question":"Theres ________ water in the glass.","answer":"something；表示不确定的某物。"},{"id":"g2_english_u006_ex09","knowledge_id":"g2_english_u006","question":"I know ________ of these people.","answer":"someone / somebody；表示\"一些人\"。"},{"id":"g2_english_u006_ex10","knowledge_id":"g2_english_u006","question":"You can find the book ________ on the shelf.","answer":"anywhere；用于肯定句中表示\"在任何地方\"。"},{"id":"g2_english_u007_ex01","knowledge_id":"g2_english_u007","question":"I visited my grandmother ________ (上周).","answer":"last week；last week表示过去时间。"},{"id":"g2_english_u007_ex02","knowledge_id":"g2_english_u007","question":"She ________ (昨晚) TV.","answer":"watched TV last night；last night表示过去时间。"},{"id":"g2_english_u007_ex03","knowledge_id":"g2_english_u007","question":"They went to Shanghai ________ (去年).","answer":"last year；last year表示过去时间。"},{"id":"g2_english_u007_ex04","knowledge_id":"g2_english_u007","question":"He didnt come to school ________ (昨天).","answer":"yesterday；yesterday表示过去时间。"},{"id":"g2_english_u007_ex05","knowledge_id":"g2_english_u007","question":"We had a party ________ (上周六).","answer":"last Saturday；last + 星期表示过去的星期。"},{"id":"g2_english_u007_ex06","knowledge_id":"g2_english_u007","question":"The train ________ (到达) at 8 oclock yesterday morning.","answer":"arrived；过去式表示过去的动作。"},{"id":"g2_english_u007_ex07","knowledge_id":"g2_english_u007","question":"She ________ (离开) home early this morning.","answer":"left；表示过去离开的动作。"},{"id":"g2_english_u007_ex08","knowledge_id":"g2_english_u007","question":"Did you ________ (吃) breakfast this morning?","answer":"have/eat；表示今天早上的过去动作。"},{"id":"g2_english_u007_ex09","knowledge_id":"g2_english_u007","question":"I ________ (看见) a beautiful rainbow yesterday.","answer":"saw；表示昨天看见。"},{"id":"g2_english_u007_ex10","knowledge_id":"g2_english_u007","question":"He ________ (游泳) yesterday afternoon.","answer":"went swimming；表示过去游泳。"},{"id":"g2_english_u008_ex01","knowledge_id":"g2_english_u008","question":"You ________ (should) tell the truth.","answer":"should；should表示\"应该\"，用于建议。"},{"id":"g2_english_u008_ex02","knowledge_id":"g2_english_u008","question":"I think you ________ (should) try again.","answer":"should；表示建议对方再试一次。"},{"id":"g2_english_u008_ex03","knowledge_id":"g2_english_u008","question":"You look tired. You ________ (should) go to bed early.","answer":"should；should go to bed early表示建议早点睡觉。"},{"id":"g2_english_u008_ex04","knowledge_id":"g2_english_u008","question":"________ I help you with your homework?","answer":"Should；Should I...表示提出建议。"},{"id":"g2_english_u008_ex05","knowledge_id":"g2_english_u008","question":"You ________ (shouldnt) be late for school.","answer":"shouldnt；shouldnt表示不应该。"},{"id":"g2_english_u008_ex06","knowledge_id":"g2_english_u008","question":"What ________ I do? Im confused.","answer":"should；What should I do表示征求意见。"},{"id":"g2_english_u008_ex07","knowledge_id":"g2_english_u008","question":"You ________ (should) finish your homework first.","answer":"should；should finish表示建议完成作业。"},{"id":"g2_english_u008_ex08","knowledge_id":"g2_english_u008","question":"Should we ________ (go) hiking this weekend?","answer":"go；Should we + 动词原形表示建议。"},{"id":"g2_english_u008_ex09","knowledge_id":"g2_english_u008","question":"I think you ________ (should) join the club.","answer":"should；表示建议参加俱乐部。"},{"id":"g2_english_u008_ex10","knowledge_id":"g2_english_u008","question":"You ________ (should) apologize to her.","answer":"should；should apologize表示应该道歉。"},{"id":"g2_english_u009_ex01","knowledge_id":"g2_english_u009","question":"Could you please help me?","answer":"Could you please + 动词原形，表示礼貌请求。"},{"id":"g2_english_u009_ex02","knowledge_id":"g2_english_u009","question":"________ I use your phone?","answer":"Could；Could I...表示礼貌请求许可。"},{"id":"g2_english_u009_ex03","knowledge_id":"g2_english_u009","question":"Could you tell me the time?","answer":"Could you + 动词原形，表示礼貌请求。"},{"id":"g2_english_u009_ex04","knowledge_id":"g2_english_u009","question":"________ you help me carry this box?","answer":"Could；Could you help me表示请求帮助。"},{"id":"g2_english_u009_ex05","knowledge_id":"g2_english_u009","question":"Could I borrow your pen?","answer":"Could I + 动词原形，表示请求许可。"},{"id":"g2_english_u009_ex06","knowledge_id":"g2_english_u009","question":"You could ask the teacher for help.","answer":"could + 动词原形，表示建议。"},{"id":"g2_english_u009_ex07","knowledge_id":"g2_english_u009","question":"Could you please not smoke here?","answer":"Could you please not + 动词原形，表示礼貌否定请求。"},{"id":"g2_english_u009_ex08","knowledge_id":"g2_english_u009","question":"I could swim when I was five.","answer":"could + 动词原形，表示过去的能力。"},{"id":"g2_english_u009_ex09","knowledge_id":"g2_english_u009","question":"Could you pass me the salt?","answer":"Could you pass me表示请求递东西。"},{"id":"g2_english_u009_ex10","knowledge_id":"g2_english_u009","question":"Could she come with us?","answer":"Could she + 动词原形，询问可能性。"},{"id":"g2_english_u010_ex01","knowledge_id":"g2_english_u010","question":"Could you wait for me? (改为礼貌请求)","answer":"Could you please wait for me?；could please更礼貌。"},{"id":"g2_english_u010_ex02","knowledge_id":"g2_english_u010","question":"You should apologize to her.","answer":"should表示道义上的建议，could表示能力或可能性。"},{"id":"g2_english_u010_ex03","knowledge_id":"g2_english_u010","question":"________ I open the window?","answer":"Could/Can；表示请求许可，could更委婉。"},{"id":"g2_english_u010_ex04","knowledge_id":"g2_english_u010","question":"You ________ try the local food. Its delicious.","answer":"should/could；should表示建议，could表示推荐。"},{"id":"g2_english_u010_ex05","knowledge_id":"g2_english_u010","question":"________ you help me with my English?","answer":"Could；Could you表示礼貌请求。"},{"id":"g2_english_u010_ex06","knowledge_id":"g2_english_u010","question":"I think you ________ talk to your parents about it.","answer":"should；should表示建议。"},{"id":"g2_english_u010_ex07","knowledge_id":"g2_english_u010","question":"Could I use your computer?","answer":"Could I表示请求许可，比Can I更委婉。"},{"id":"g2_english_u010_ex08","knowledge_id":"g2_english_u010","question":"You ________ finish the work today.","answer":"should；should表示应该，语气比must弱。"},{"id":"g2_english_u010_ex09","knowledge_id":"g2_english_u010","question":"Could you please ________ (not play) games now?","answer":"not play；Could you please not表示礼貌否定请求。"},{"id":"g2_english_u010_ex10","knowledge_id":"g2_english_u010","question":"You should/could practice more.","answer":"should表示应该，could表示可能，语气should更肯定。"},{"id":"g2_english_u011_ex01","knowledge_id":"g2_english_u011","question":"What should I do?","answer":"What should I do? 表示我应该做什么？征求意见。"},{"id":"g2_english_u011_ex02","knowledge_id":"g2_english_u011","question":"You should ask your teacher.","answer":"should + 动词原形，表示建议。"},{"id":"g2_english_u011_ex03","knowledge_id":"g2_english_u011","question":"What should I wear for the party?","answer":"What should I wear? 表示穿什么合适。"},{"id":"g2_english_u011_ex04","knowledge_id":"g2_english_u011","question":"I dont know what to wear. What ________?","answer":"should I do；should表示应该。"},{"id":"g2_english_u011_ex05","knowledge_id":"g2_english_u011","question":"You look sad. What should ________?","answer":"I do；What should I do表示建议对方做什么。"},{"id":"g2_english_u011_ex06","knowledge_id":"g2_english_u011","question":"I failed the exam. What ________?","answer":"should I do / should I study；表示应该怎么办。"},{"id":"g2_english_u011_ex07","knowledge_id":"g2_english_u011","question":"You should ________ (study) harder.","answer":"study；should study表示建议学习。"},{"id":"g2_english_u011_ex08","knowledge_id":"g2_english_u011","question":"What should we ________ (do) now?","answer":"do；What should we do表示建议。"},{"id":"g2_english_u011_ex09","knowledge_id":"g2_english_u011","question":"I think you should talk to someone.","answer":"should talk表示建议谈话。"},{"id":"g2_english_u011_ex10","knowledge_id":"g2_english_u011","question":"What should I ________ (say)?","answer":"say；What should I say表示说什么。"},{"id":"g2_english_u012_ex01","knowledge_id":"g2_english_u012","question":"How about going shopping?","answer":"How about + 名词/动名词，表示建议。"},{"id":"g2_english_u012_ex02","knowledge_id":"g2_english_u012","question":"Why dont you ask your parents?","answer":"Why dont you + 动词原形，表示建议。"},{"id":"g2_english_u012_ex03","knowledge_id":"g2_english_u012","question":"You could try this restaurant.","answer":"could + 动词原形，表示建议。"},{"id":"g2_english_u012_ex04","knowledge_id":"g2_english_u012","question":"You should take a break.","answer":"should + 动词原形，表示建议。"},{"id":"g2_english_u012_ex05","knowledge_id":"g2_english_u012","question":"What a cooking；过去进行时，表示在过去某个时刻正在做饭。"},{"id":"g2_english_u023_ex07","knowledge_id":"g2_english_u023","question":"The students ________ (study) in the classroom.","answer":"were studying；过去进行时，表示正在学习。"},{"id":"g2_english_u023_ex08","knowledge_id":"g2_english_u023","question":"He ________ (not/sleep) when I came in.","answer":"wasnt sleeping；过去进行时的否定。"},{"id":"g2_english_u023_ex09","knowledge_id":"g2_english_u023","question":"________ she ________ (clean) the house at that time?","answer":"Was, cleaning；过去进行时的一般疑问句。"},{"id":"g2_english_u023_ex10","knowledge_id":"g2_english_u023","question":"I saw him. He ________ (run).","answer":"was running；过去进行时，表示正在跑。"},{"id":"g2_english_u024_ex01","knowledge_id":"g2_english_u024","question":"I was reading a book at that time.","answer":"过去进行时，表示在过去某个时刻正在进行的动作。"},{"id":"g2_english_u024_ex02","knowledge_id":"g2_english_u024","question":"What were you doing when he came?","answer":"when表示当...时候，主句用过去进行时。"},{"id":"g2_english_u024_ex03","knowledge_id":"g2_english_u024","question":"She was cooking while I was sleeping.","answer":"while表示与...同时，用过去进行时。"},{"id":"g2_english_u024_ex04","knowledge_id":"g2_english_u024","question":"He was waiting for you at the bus stop.","answer":"过去进行时，表示在过去等某人。"},{"id":"g2_english_u024_ex05","knowledge_id":"g2_english_u024","question":"They were discussing the problem the whole morning.","answer":"过去进行时，表示在过去持续进行的动作。"},{"id":"g2_english_u024_ex06","knowledge_id":"g2_english_u024","question":"I was walking home when it started to rain.","answer":"when引导的一般过去时与过去进行时连用。"},{"id":"g2_english_u024_ex07","knowledge_id":"g2_english_u024","question":"She was practicing piano at 5 PM yesterday.","answer":"过去进行时，表示在过去某个时刻正在练习。"},{"id":"g2_english_u024_ex08","knowledge_id":"g2_english_u024","question":"We were having lunch when the earthquake happened.","answer":"were having + when happened，表示正在吃午饭时地震发生了。"},{"id":"g2_english_u024_ex09","knowledge_id":"g2_english_u024","question":"The children were playing in the park.","answer":"过去进行时，表示孩子们在公园玩耍。"},{"id":"g2_english_u024_ex10","knowledge_id":"g2_english_u024","question":"He was reading newspaper while she was cooking.","answer":"while连接两个同时进行的过去进行时动作。"},{"id":"g2_english_u025_ex01","knowledge_id":"g2_english_u025","question":"She was reading a book ________ (when/while) she heard the news.","answer":"when；when后接一般过去时。"},{"id":"g2_english_u025_ex02","knowledge_id":"g2_english_u025","question":"I was sleeping ________ he came.","answer":"when；表示当...时候，主句用过去进行时。"},{"id":"g2_english_u025_ex03","knowledge_id":"g2_english_u025","question":"While my mother ________ (cook), I was doing homework.","answer":"was cooking；while连接同时进行的动作。"},{"id":"g2_english_u025_ex04","knowledge_id":"g2_english_u025","question":"He called me when I ________ (watch) TV.","answer":"was watching；when引导一般过去时，主句用过去进行时。"},{"id":"g2_english_u025_ex05","knowledge_id":"g2_english_u025","question":"When/While she ________ (walk) in the park, it began to rain.","answer":"was walking；while通常与进行时连用。"},{"id":"g2_english_u025_ex06","knowledge_id":"g2_english_u025","question":"I was reading a novel ________ my sister came in.","answer":"when；主句过去进行时，从句一般过去时。"},{"id":"g2_english_u025_ex07","knowledge_id":"g2_english_u025","question":"While they ________ (talk), the teacher came in.","answer":"were talking；while与过去进行时连用。"},{"id":"g2_english_u025_ex08","knowledge_id":"g2_english_u025","question":"When/While he ________ (wait) for the bus, it started to snow.","answer":"was waiting；表示正在等待时发生了某事。"},{"id":"g2_english_u025_ex09","knowledge_id":"g2_english_u025","question":"She was cleaning the house ________ her son returned.","answer":"when；when the bus came是具体时刻。"},{"id":"g2_english_u025_ex10","knowledge_id":"g2_english_u025","question":"While I ________ (write) a letter, the phone rang.","answer":"was writing；while表示在我写信的过程中。"},{"id":"g2_english_u026_ex01","knowledge_id":"g2_english_u026","question":"I ________ (read) a book yesterday. (说明读书这件事)","answer":"read；一般过去时，表示读书这个已完成的动作。"},{"id":"g2_english_u026_ex02","knowledge_id":"g2_english_u026","question":"I ________ (read) a book at 8 oclock yesterday. (说明在读书)","answer":"was reading；过去进行时，表示在过去某个时刻正在进行的动作。"},{"id":"g2_english_u026_ex03","knowledge_id":"g2_english_u026","question":"He ________ (see) the film last week. (说明看了电影)","answer":"saw；一般过去时，表示观影已完成。"},{"id":"g2_english_u026_ex04","knowledge_id":"g2_english_u026","question":"He ________ (see) the film when I met him. (说明在看电影)","answer":"was seeing；过去进行时，表示在他遇见我时他正在看电影。"},{"id":"g2_english_u026_ex05","knowledge_id":"g2_english_u026","question":"They ________ (play) football yesterday. (说明踢了足球)","answer":"played；一般过去时，表示已完成的动作。"},{"id":"g2_english_u026_ex06","knowledge_id":"g2_english_u026","question":"They ________ (play) football at 4 PM yesterday. (说明在踢球)","answer":"were playing；过去进行时，表示在过去某个时刻正在进行的动作。"},{"id":"g2_english_u026_ex07","knowledge_id":"g2_english_u026","question":"She ________ (make) dinner when I called her.","answer":"was making；过去进行时，call是一般过去时。"},{"id":"g2_english_u026_ex08","knowledge_id":"g2_english_u026","question":"I ________ (meet) Tom in the street last Monday.","answer":"met；一般过去时，表示遇见这个已完成的动作。"},{"id":"g2_english_u026_ex09","knowledge_id":"g2_english_u026","question":"I ________ (meet) Tom while I ________ (walk) in the street.","answer":"met, was walking；met是一般过去时，was walking是过去进行时。"},{"id":"g2_english_u026_ex10","knowledge_id":"g2_english_u026","question":"When he ________ (come) in, I was reading.","answer":"came；一般过去时 + 过去进行时。"},{"id":"g2_english_u027_ex01","knowledge_id":"g2_english_u027","question":"She ________ (not/play) the piano at that time.","answer":"wasnt playing；过去进行时的否定。"},{"id":"g2_english_u027_ex02","knowledge_id":"g2_english_u027","question":"________ they ________ (study) when you called?","answer":"Were, studying；过去进行时的一般疑问句。"},{"id":"g2_english_u027_ex03","knowledge_id":"g2_english_u027","question":"He wasnt sleeping when I came. (做肯定句)","answer":"He was sleeping when I came.；否定转肯定。"},{"id":"g2_english_u027_ex04","knowledge_id":"g2_english_u027","question":"Were they waiting for you? (做否定回答)","answer":"No, they werent.；过去进行时的否定回答。"},{"id":"g2_english_u027_ex05","knowledge_id":"g2_english_u027","question":"Was she cooking when you arrived? (做肯定回答)","answer":"Yes, she was.；肯定回答。"},{"id":"g2_english_u027_ex06","knowledge_id":"g2_english_u027","question":"I wasnt watching TV at that time. (对划线部分提问)","answer":"What were you doing at that time?；对正在进行的动作提问。"},{"id":"g2_english_u027_ex07","knowledge_id":"g2_english_u027","question":"They were playing games. (改为否定句)","answer":"They werent playing games.；过去进行时的否定形式。"},{"id":"g2_english_u027_ex08","knowledge_id":"g2_english_u027","question":"He was reading newspaper. (改为一般疑问句)","answer":"Was he reading newspaper?；过去进行时的疑问句。"},{"id":"g2_english_u027_ex09","knowledge_id":"g2_english_u027","question":"She wasnt singing when I entered. (改为肯定句)","answer":"She was singing when I entered.；否定转肯定。"},{"id":"g2_english_u027_ex10","knowledge_id":"g2_english_u027","question":"What were you doing? (用sleep回答)","answer":"I was sleeping.；用过去进行时回答。"},{"id":"g2_english_u028_ex01","knowledge_id":"g2_english_u028","question":"I know that he is a teacher.","answer":"that引导宾语从句，that无意义，可省略。"},{"id":"g2_english_u028_ex02","knowledge_id":"g2_english_u028","question":"She says that she will come tomorrow.","answer":"that引导宾语从句，陈述事实。"},{"id":"g2_english_u028_ex03","knowledge_id":"g2_english_u028","question":"Do you know that he is coming?","answer":"that引导宾语从句，作know的宾语。"},{"id":"g2_english_u028_ex04","knowledge_id":"g2_english_u028","question":"I think that it is going to rain.","answer":"that引导宾语从句，it是形式主语。"},{"id":"g2_english_u028_ex05","knowledge_id":"g2_english_u028","question":"He believed that she was right.","answer":"that引导宾语从句，表示相信。"},{"id":"g2_english_u028_ex06","knowledge_id":"g2_english_u028","question":"I hope that you will pass the exam.","answer":"that引导宾语从句，表示希望。"},{"id":"g2_english_u028_ex07","knowledge_id":"g2_english_u028","question":"She said that she liked English.","answer":"that引导宾语从句，用于转述。"},{"id":"g2_english_u028_ex08","knowledge_id":"g2_english_u028","question":"They know that practice is important.","answer":"that引导宾语从句，说明他们知道这一点。"},{"id":"g2_english_u028_ex09","knowledge_id":"g2_english_u028","question":"I feel that something is wrong.","answer":"that引导宾语从句，表示感觉。"},{"id":"g2_english_u028_ex10","knowledge_id":"g2_english_u028","question":"He told me that he would call tonight.","answer":"that引导宾语从句，用于转述。"},{"id":"g2_english_u029_ex01","knowledge_id":"g2_english_u029","question":"I think that he is right.","answer":"that引导宾语从句，that可省略。"},{"id":"g2_english_u029_ex02","knowledge_id":"g2_english_u029","question":"She says that she will come tomorrow.","answer":"that引导一般陈述，that可省略。"},{"id":"g2_english_u029_ex03","knowledge_id":"g2_english_u029","question":"I believe that practice makes perfect.","answer":"that引导宾语从句，practice作主语。"},{"id":"g2_english_u029_ex04","knowledge_id":"g2_english_u029","question":"He knows that honesty is important.","answer":"that引导宾语从句，说明诚实的的重要性。"},{"id":"g2_english_u029_ex05","knowledge_id":"g2_english_u029","question":"I think that he is a good student.","answer":"that引导宾语从句，对人物的评价。"},{"id":"g2_english_u029_ex06","knowledge_id":"g2_english_u029","question":"She believes that she can succeed.","answer":"that引导宾语从句，she can succeed是完整从句。"},{"id":"g2_english_u029_ex07","knowledge_id":"g2_english_u029","question":"They know that the earth is round.","answer":"that引导宾语从句，科学常识。"},{"id":"g2_english_u029_ex08","knowledge_id":"g2_english_u029","question":"I feel that this is wrong.","answer":"that引导宾语从句，表达判断。"},{"id":"g2_english_u029_ex09","knowledge_id":"g2_english_u029","question":"He said that he would come.","answer":"that引导宾语从句，用于转述，would是过去将来时。"},{"id":"g2_english_u029_ex10","knowledge_id":"g2_english_u029","question":"I hope that everything goes well.","answer":"that引导宾语从句，表达希望。"},{"id":"g2_english_u030_ex01","knowledge_id":"g2_english_u030","question":"I dont know if he is at home.","answer":"if/whether引导宾语从句，表示是否。"},{"id":"g2_english_u030_ex02","knowledge_id":"g2_english_u030","question":"She asked if/whether I could help her.","answer":"if/whether引导宾语从句，用于疑问句。"},{"id":"g2_english_u030_ex03","knowledge_id":"g2_english_u030","question":"Please tell me if/whether you agree.","answer":"if/whether引导宾语从句，if不能换成whether。"},{"id":"g2_english_u030_ex04","knowledge_id":"g2_english_u030","question":"I wonder if/whether she will come.","answer":"if/whether表示是否，可能发生。"},{"id":"g2_english_u030_ex05","knowledge_id":"g2_english_u030","question":"He asked if/whether I needed help.","answer":"if/whether引导一般疑问句的宾语从句。"},{"id":"g2_english_u030_ex06","knowledge_id":"g2_english_u030","question":"I dont know if/whether the plan will work.","answer":"if/whether表示对未来的不确定。"},{"id":"g2_english_u030_ex07","knowledge_id":"g2_english_u030","question":"Can you tell me if/whether you are free?","answer":"if/whether引导选择疑问的宾语从句。"},{"id":"g2_english_u030_ex08","knowledge_id":"g2_english_u030","question":"She asked if/whether I had finished the work.","answer":"if/whether用于过去时的宾语从句。"},{"id":"g2_english_u030_ex09","knowledge_id":"g2_english_u030","question":"I want to know if/whether he likes it.","answer":"if/whether表示对喜好的一般疑问。"},{"id":"g2_english_u030_ex10","knowledge_id":"g2_english_u030","question":"He doesnt know if/whether he should go.","answer":"if/whether表示对should的疑问。"},{"id":"g2_english_u031_ex01","knowledge_id":"g2_english_u031","question":"I dont know where he lives.","answer":"where引导宾语从句，表示地点。"},{"id":"g2_english_u031_ex02","knowledge_id":"g2_english_u031","question":"Can you tell me when the train leaves?","answer":"when引导宾语从句，表示时间。"},{"id":"g2_english_u031_ex03","knowledge_id":"g2_english_u031","question":"She asked what his name was.","answer":"what引导宾语从句，表示什么。"},{"id":"g2_english_u031_ex04","knowledge_id":"g2_english_u031","question":"I wonder why he is late.","answer":"why引导宾语从句，表示原因。"},{"id":"g2_english_u031_ex05","knowledge_id":"g2_english_u031","question":"Tell me how you did it.","answer":"how引导宾语从句，表示方式。"},{"id":"g2_english_u031_ex06","knowledge_id":"g2_english_u031","question":"I dont know whose book this is.","answer":"whose引导宾语从句，表示所有关系。"},{"id":"g2_english_u031_ex07","knowledge_id":"g2_english_u031","question":"Do you know which one he likes?","answer":"which引导宾语从句，表示选择。"},{"id":"g2_english_u031_ex08","knowledge_id":"g2_english_u031","question":"She asked who was coming.","answer":"who引导宾语从句，表示人物。"},{"id":"g2_english_u031_ex09","knowledge_id":"g2_english_u031","question":"I want to know when we will leave.","answer":"when引导宾语从句，表示将来时间。"},{"id":"g2_english_u031_ex10","knowledge_id":"g2_english_u031","question":"Tell me where you found it.","answer":"where引导宾语从句，表示地点。"},{"id":"g2_english_u032_ex01","knowledge_id":"g2_english_u032","question":"He said that he ________ (be) a student.","answer":"was；主句过去时，从句时态一致。"},{"id":"g2_english_u032_ex02","knowledge_id":"g2_english_u032","question":"She told me that she ________ (go) to Beijing.","answer":"had gone；过去完成时，表示过去的过去。"},{"id":"g2_english_u032_ex03","knowledge_id":"g2_english_u032","question":"I think that he ________ (come) tomorrow.","answer":"will come；主句现在时，从句时间不变。"},{"id":"g2_english_u032_ex04","knowledge_id":"g2_english_u032","question":"He said that the earth ________ (be) round.","answer":"is；客观真理不受时态影响。"},{"id":"g2_english_u032_ex05","knowledge_id":"g2_english_u032","question":"She believes that she ________ (can) succeed.","answer":"can；情态动词不变。"},{"id":"g2_english_u032_ex06","knowledge_id":"g2_english_u032","question":"They knew that light ________ (travel) faster than sound.","answer":"travels；客观真理不变。"},{"id":"g2_english_u032_ex07","knowledge_id":"g2_english_u032","question":"I thought that he ________ (be) at home.","answer":"was；时态倒退一步。"},{"id":"g2_english_u032_ex08","knowledge_id":"g2_english_u032","question":"She said that she ________ (meet) him before.","answer":"had met；过去完成时。"},{"id":"g2_english_u032_ex09","knowledge_id": g2_english_u034","question":"far → ________","answer":"farther/further；不规则变化。"},{"id":"g2_english_u034_ex06","knowledge_id":"g2_english_u034","question":"old → ________","answer":"older/elder；不规则变化。"},{"id":"g2_english_u034_ex07","knowledge_id":"g2_english_u034","question":"late → ________","answer":"later/latter；不规则变化。"},{"id":"g2_english_u034_ex08","knowledge_id":"g2_english_u034","question":"up → ________","answer":"upper；不规则变化。"},{"id":"g2_english_u034_ex09","knowledge_id":"g2_english_u034","question":"high → ________","answer":"higher；high的比较级是higher。"},{"id":"g2_english_u034_ex10","knowledge_id":"g2_english_u034","question":"low → ________","answer":"lower；low的比较级是lower。"},{"id":"g2_english_u035_ex01","knowledge_id":"g2_english_u035","question":"tall → ________","answer":"tallest；一般加-est。"},{"id":"g2_english_u035_ex02","knowledge_id":"g2_english_u035","question":"happy → ________","answer":"happiest；y变i加-est。"},{"id":"g2_english_u035_ex03","knowledge_id":"g2_english_u035","question":"big → ________","answer":"biggest；重读闭音节双写加-est。"},{"id":"g2_english_u035_ex04","knowledge_id":"g2_english_u035","question":"beautiful → ________","answer":"most beautiful；多音节形容词加most。"},{"id":"g2_english_u035_ex05","knowledge_id":"g2_english_u035","question":"careful → ________","answer":"most careful；多音节形容词加most。"},{"id":"g2_english_u035_ex06","knowledge_id":"g2_english_u035","question":"fast → ________","answer":"fastest；一般加-est。"},{"id":"g2_english_u035_ex07","knowledge_id":"g2_english_u035","question":"easy → ________","answer":"easiest；y变i加-est。"},{"id":"g2_english_u035_ex08","knowledge_id":"g2_english_u035","question":"thin → ________","answer":"thinnest；单音节词双写加-est。"},{"id":"g2_english_u035_ex09","knowledge_id":"g2_english_u035","question":"interesting → ________","answer":"most interesting；多音节加most。"},{"id":"g2_english_u035_ex10","knowledge_id":"g2_english_u035","question":"busy → ________","answer":"busiest；y变i加-est。"},{"id":"g2_english_u036_ex01","knowledge_id":"g2_english_u036","question":"good → ________","answer":"best；不规则变化。"},{"id":"g2_english_u036_ex02","knowledge_id":"g2_english_u036","question":"bad → ________","answer":"worst；不规则变化。"},{"id":"g2_english_u036_ex03","knowledge_id":"g2_english_u036","question":"many/much → ________","answer":"most；不规则变化。"},{"id":"g2_english_u036_ex04","knowledge_id":"g2_english_u036","question":"little → ________","answer":"least；不规则变化。"},{"id":"g2_english_u036_ex05","knowledge_id":"g2_english_u036","question":"far → ________","answer":"farthest/furthest；不规则变化。"},{"id":"g2_english_u036_ex06","knowledge_id":"g2_english_u036","question":"old → ________","answer":"oldest/eldest；不规则变化。"},{"id":"g2_english_u036_ex07","knowledge_id":"g2_english_u036","question":"late → ________","answer":"latest/last；不规则变化。"},{"id":"g2_english_u036_ex08","knowledge_id":"g2_english_u036","question":"up → ________","answer":"uppermost/uppest；不规则变化。"},{"id":"g2_english_u036_ex09","knowledge_id":"g2_english_u036","question":"high → ________","answer":"highest；high的最高级是highest。"},{"id":"g2_english_u036_ex10","knowledge_id":"g2_english_u036","question":"low → ________","answer":"lowest；low的最高级是lowest。"},{"id":"g2_english_u037_ex01","knowledge_id":"g2_english_u037","question":"Tom is ________ (tall) than Jim.","answer":"taller；than表示比较，用比较级。"},{"id":"g2_english_u037_ex02","knowledge_id":"g2_english_u037","question":"This is the ________ (beautiful) park I have ever seen.","answer":"most beautiful；最高级表示\"最\"。"},{"id":"g2_english_u037_ex03","knowledge_id":"g2_english_u037","question":"She is ________ (old) than her sister.","answer":"older；表示两者比较用比较级。"},{"id":"g2_english_u037_ex04","knowledge_id":"g2_english_u037","question":"Mount Everest is the ________ (high) mountain in the world.","answer":"highest；最高级用于三者以上。"},{"id":"g2_english_u037_ex05","knowledge_id":"g2_english_u037","question":"This book is ________ (interesting) than that one.","answer":"more interesting；多音节用more加比较级。"},{"id":"g2_english_u037_ex06","knowledge_id":"g2_english_u037","question":"He is the ________ (clever) student in our class.","answer":"cleverest；最高级用于一定范围内。"},{"id":"g2_english_u037_ex07","knowledge_id":"g2_english_u037","question":"My mother is ________ (busy) than my father.","answer":"busier；busy的比较级是busier。"},{"id":"g2_english_u037_ex08","knowledge_id":"g2_english_u037","question":"Which is the ________ (long) river in China?","answer":"longest；最高级用于选择。"},{"id":"g2_english_u037_ex09","knowledge_id":"g2_english_u037","question":"This problem is ________ (difficult) than that one.","answer":"more difficult；difficult用more加比较级。"},{"id":"g2_english_u037_ex10","knowledge_id":"g2_english_u037","question":"She is ________ (good) at English than Math.","answer":"better；good的比较级是better。"},{"id":"g2_english_u038_ex01","knowledge_id":"g2_english_u038","question":"Tom is as ________ (tall) as Jack.","answer":"tall；as...as表示同级比较，用原级。"},{"id":"g2_english_u038_ex02","knowledge_id":"g2_english_u038","question":"This room is as ________ (big) as that one.","answer":"big；as...as表示两者一样。"},{"id":"g2_english_u038_ex03","knowledge_id":"g2_english_u038","question":"She is not as ________ (old) as her mother.","answer":"old；not as...as表示不如。"},{"id":"g2_english_u038_ex04","knowledge_id":"g2_english_u038","question":"He runs as ________ (fast) as his brother.","answer":"fast；as...as用原级。"},{"id":"g2_english_u038_ex05","knowledge_id":"g2_english_u038","question":"This book is as ________ (interesting) as that one.","answer":"interesting；as...as用原级。"},{"id":"g2_english_u038_ex06","knowledge_id":"g2_english_u038","question":"She is as ________ (careful) as her sister.","answer":"careful；表示同样仔细。"},{"id":"g2_english_u038_ex07","knowledge_id":"g2_english_u038","question":"He is not as ________ (strong) as his father.","answer":"strong；not as...as表示不如。"},{"id":"g2_english_u038_ex08","knowledge_id":"g2_english_u038","question":"Today is as ________ (hot) as yesterday.","answer":"hot；as...as用原级。"},{"id":"g2_english_u038_ex09","knowledge_id":"g2_english_u038","question":"This bag is as ________ (heavy) as that one.","answer":"heavy；as...as表示一样重。"},{"id":"g2_english_u038_ex10","knowledge_id":"g2_english_u038","question":"She is as ________ (smart) as her brother.","answer":"smart；as...as用原级。"},{"id":"g2_english_u039_ex01","knowledge_id":"g2_english_u039","question":"I ________ (finish) my homework already.","answer":"have finished；现在完成时 already。"},{"id":"g2_english_u039_ex02","knowledge_id":"g2_english_u039","question":"She ________ (see) this movie twice.","answer":"has seen；现在完成时，has用于第三人称单数。"},{"id":"g2_english_u039_ex03","knowledge_id":"g2_english_u039","question":"They ________ (go) to Beijing.","answer":"have gone；现在完成时，表示去了某地还没回来。"},{"id":"g2_english_u039_ex04","knowledge_id":"g2_english_u039","question":"We ________ (be) friends for ten years.","answer":"have been；现在完成时表示持续时间。"},{"id":"g2_english_u039_ex05","knowledge_id":"g2_english_u039","question":"He ________ (not/finish) the work yet.","answer":"hasnt finished；现在完成时的否定，yet用于否定句和疑问句。"},{"id":"g2_english_u039_ex06","knowledge_id":"g2_english_u039","question":"________ you ever ________ (be) to Shanghai?","answer":"Have, been；现在完成时的一般疑问句。"},{"id":"g2_english_u039_ex07","knowledge_id":"g2_english_u039","question":"I ________ (read) three books this month.","answer":"have read；现在完成时表示到目前为止的结果。"},{"id":"g2_english_u039_ex08","knowledge_id":"g2_english_u039","question":"She ________ (live) here since 2010.","answer":"has lived；现在完成时，since表示起点。"},{"id":"g2_english_u039_ex09","knowledge_id":"g2_english_u039","question":"They ________ (start) to learn English.","answer":"have started；现在完成时，start是瞬间动词。"},{"id":"g2_english_u039_ex10","knowledge_id":"g2_english_u039","question":"He ________ (write) five letters today.","answer":"has written；现在完成时，表示写了几封信。"},{"id":"g2_english_u040_ex01","knowledge_id":"g2_english_u040","question":"I have finished my homework. (对划线部分提问)","answer":"Have you finished your homework?；现在完成时的一般疑问句。"},{"id":"g2_english_u040_ex02 wer":"already；already用于肯定句中。"},{"id":"g2_english_u041_ex05","knowledge_id":"g2_english_u041","question":"Have you read this book ________?","answer":"yet/already；yet/already都可用于疑问句。"},{"id":"g2_english_u041_ex06","knowledge_id":"g2_english_u041","question":"I have just finished my homework.","answer":"just用于现在完成时，表示刚刚。"},{"id":"g2_english_u041_ex07","knowledge_id":"g2_english_u041","question":"She has ________ visited Beijing once.","answer":"already；already表示已经。"},{"id":"g2_english_u041_ex08","knowledge_id":"g2_english_u041","question":"Have they arrived ________?","answer":"yet；yet用于现在完成时的疑问句。"},{"id":"g2_english_u041_ex09","knowledge_id":"g2_english_u041","question":"He hasnt called me ________.","answer":"yet；yet用于否定句，表示还没。"},{"id":"g2_english_u041_ex10","knowledge_id":"g2_english_u041","question":"I have seen this movie ________.","answer":"already；already表示已经看过。"},{"id":"g2_english_u042_ex01","knowledge_id":"g2_english_u042","question":"He has ________ to Beijing. (去了某地，现在不在)","answer":"gone；has gone to表示去了某地（不在这里）。"},{"id":"g2_english_u042_ex02","knowledge_id":"g2_english_u042","question":"She has ________ to Japan twice. (去过某地，已回来)","answer":"been；has been to表示去过某地（已经回来了）。"},{"id":"g2_english_u042_ex03","knowledge_id":"g2_english_u042","question":"Where have you ________?","answer":"been；been是be的过去分词，have been to表示去过。"},{"id":"g2_english_u042_ex04","knowledge_id":"g2_english_u042","question":"Tom isnt here. He has ________ to the cinema.","answer":"gone；has gone to表示去了某地。"},{"id":"g2_english_u042_ex05","knowledge_id":"g2_english_u042","question":"I have never ________ to Shanghai.","answer":"been；have been to表示去过。"},{"id":"g2_english_u042_ex06","knowledge_id":"g2_english_u042","question":"________ you ever ________ to the Great Wall?","answer":"Have, been；Have you been to...表示曾经去过。"},{"id":"g2_english_u042_ex07","knowledge_id":"g2_english_u042","question":"She has ________ to London. Shes not here.","answer":"gone；has gone to表示去了某地。"},{"id":"g2_english_u042_         // 错题本管理器
        const WrongBookManager = {
            STORAGE_KEY_PREFIX: 'wrongbook_',
            getWrongBook(grade, subject) {
                const key = this.STORAGE_KEY_PREFIX + grade + '_' + subject;
                return JSON.parse(localStorage.getItem(key) || '[]');
            },
            addWrongBook(item) {
                const key = this.STORAGE_KEY_PREFIX + item.grade + '_' + item.subject;
                let wrongBook = this.getWrongBook(item.grade, item.subject);
                const exists = wrongBook.some(w => w.question === item.question);
                if (exists) return false;
                wrongBook.push({...item, id: item.knowledgeId + '_' + Date.now(), addedAt: new Date().toISOString()});
                localStorage.setItem(key, JSON.stringify(wrongBook));
                return true;
            }
        };

        // URL参数解析
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                grade: params.get('grade') || 'g2',
                subject: params.get('subject') || 'math',
                semester: params.get('semester') || 'lower'
            };
        }

        const gradeNames = {'g1':'初一','g2':'初二','g3':'初三'};
        const subjectNames = {'math':'数学','physics':'物理','chinese':'语文','english':'英语','geography':'地理','history':'历史','daofa':'道德与法治','biology':'生物'};
        const semesterNames = {'upper':'上册','lower':'下册'};

        let currentParams = getUrlParams();
        let knowledgeList = [];
        let expandedIds = new Set();
        let currentExample = null;

        const pageTitle = document.getElementById('page-title');
        const pageSubtitle = document.getElementById('page-subtitle');
        const knowledgeListEl = document.getElementById('knowledge-list');
        const emptyStateEl = document.getElementById('empty-state');
        const searchResultsInfo = document.getElementById('search-results-info');
        const searchCountEl = document.getElementById('search-count');
        const searchInput = document.getElementById('search-input');

        async function initPage() {
            const {grade, subject, semester} = currentParams;
            pageTitle.textContent = gradeNames[grade] + ' · ' + subjectNames[subject] + ' · ' + semesterNames[semester];
            loadKnowledge();
        }

        function loadKnowledge() {
            const {grade, subject, semester} = currentParams;
            // 根据ID前缀过滤数据
            // ID格式: g2_{subject}_u/l{number}  或  g2_{subject}_{number}
            knowledgeList = DATA_KNOWLEDGE.filter(k => {
                const id = k.id;
                // 检查年级
                if (!id.startsWith(grade + '_')) return false;
                
                // 检查科目
                if (!id.startsWith(grade + '_' + subject + '_')) return false;
                
                // 检查学期 - 根据ID中的u/l标记或数字范围
                let kSemester = null;
                if (id.includes('_u')) {
                    kSemester = 'upper';
                } else if (id.includes('_l')) {
                    kSemester = 'lower';
                } else {
                    // 兼容旧格式
                    const kNum = parseInt(id.split('_').pop());
                    if (subject === 'math') {
                        kSemester = kNum <= 26 ? 'lower' : 'upper';
                    } else if (subject === 'physics') {
                        kSemester = kNum <= 28 ? 'upper' : 'lower';
                    }
                }
                
                return kSemester === semester;
            });
            renderKnowledgeList();
        }

        function renderKnowledgeList(items = knowledgeList) {
            if (items.length === 0) {
                knowledgeListEl.innerHTML = '';
                emptyStateEl.classList.remove('hidden');
                return;
            }
            emptyStateEl.classList.add('hidden');
            knowledgeListEl.innerHTML = items.map(item => {
                const isExpanded = expandedIds.has(item.id);
                return '<div class="card knowledge-card" data-id="' + item.id + '">' +
                    '<div class="knowledge-header p-4 flex items-center justify-between" onclick="toggleExpand(\'' + item.id + '\')">' +
                        '<div class="flex items-center gap-3 flex-1 min-w-0">' +
                            '<div class="expand-icon ' + (isExpanded ? 'expanded' : 'collapsed') + '">' + (isExpanded ? '−' : '+') + '</div>' +
                            '<div class="flex-1 min-w-0">' +
                                '<h3 class="text-lg font-semibold text-gray-800">' + escapeHtml(item.name) + '</h3>' +
                                '<p class="text-xs text-gray-500 mt-1">' + escapeHtml(item.chapter) + '</p>' +
                            '</div>' +
                        '</div>' +
                        '<button class="btn btn-secondary text-sm px-3 py-1" onclick="event.stopPropagation(); showExample(\'' + item.id + '\', \'' + escapeHtml(item.name) + '\')">例题</button>' +
                    '</div>' +
                    '<div id="content-' + item.id + '" class="px-6 pb-4 ' + (isExpanded ? '' : 'hidden') + '">' +
                        (item.formula ? '<div class="mb-4"><h4 class="text-sm font-medium text-gray-500 mb-2">📐 公式</h4><p class="formula-box text-gray-800 text-lg bg-gray-50 p-3 rounded-lg">' + escapeHtml(item.formula) + '</p></div>' : '') +
                        (item.explanation ? '<div><h4 class="text-sm font-medium text-gray-500 mb-2">📝 解释</h4><p class="text-gray-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(item.explanation) + '</p></div>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function toggleExpand(id) {
            if (expandedIds.has(id)) {
                expandedIds.delete(id);
            } else {
                expandedIds.add(id);
            }
            const card = document.querySelector('[data-id="' + id + '"]');
            const content = document.getElementById('content-' + id);
            const icon = card.querySelector('.expand-icon');
            const header = card.querySelector('.knowledge-header');
            if (expandedIds.has(id)) {
                content.classList.remove('hidden');
                icon.classList.remove('collapsed');
                icon.classList.add('expanded');
                icon.textContent = '−';
                header.classList.add('expanded');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('expanded');
                icon.classList.add('collapsed');
                icon.textContent = '+';
                header.classList.remove('expanded');
            }
        }

        function expandAll() {
            knowledgeList.forEach(item => expandedIds.add(item.id));
            renderKnowledgeList();
        }

        function collapseAll() {
            expandedIds.clear();
            renderKnowledgeList();
        }

        function searchKnowledge(keyword, list) {
            if (!keyword) return [];
            const lower = keyword.toLowerCase();
            return list.filter(k =>
                k.name.toLowerCase().includes(lower) ||
                k.chapter.toLowerCase().includes(lower)
            );
        }

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                searchResultsInfo.classList.add('hidden');
                renderKnowledgeList();
                return;
            }
            const results = searchKnowledge(keyword, knowledgeList);
            searchCountEl.textContent = results.length;
            searchResultsInfo.classList.remove('hidden');
            renderKnowledgeList(results);
        }

        function showExample(knowledgeId, knowledgeName) {
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === knowledgeId);
            if (examples.length === 0) {
                alert('暂无例题');
                return;
            }
            const example = examples[Math.floor(Math.random() * examples.length)];
            currentExample = {...example, knowledgeId, knowledgeName, ...currentParams};
            document.getElementById('example-knowledge-name').textContent = knowledgeName;
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
            document.getElementById('example-modal').classList.remove('hidden');
        }

        function nextExample() {
            if (!currentExample) return;
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === currentExample.knowledgeId);
            const otherExamples = examples.filter(e => e !== currentExample);
            if (otherExamples.length === 0) {
                alert('没有更多例题了');
                return;
            }
            const example = otherExamples[Math.floor(Math.random() * otherExamples.length)];
            currentExample = {...example, knowledgeId: currentExample.knowledgeId, knowledgeName: currentExample.knowledgeName, ...currentParams};
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
        }

        function addToWrongBook() {
            if (!currentExample) return;
            const item = {
                knowledgeId: currentExample.knowledgeId,
                knowledgeName: currentExample.knowledgeName,
                question: currentExample.question,
                answer: currentExample.answer,
                grade: currentParams.grade,
                subject: currentParams.subject
            };
            if (WrongBookManager.addWrongBook(item)) {
                alert('已加入错题本！');
            } else {
                alert('该题目已在错题本中');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('btn-expand-all').addEventListener('click', expandAll);
        document.getElementById('btn-collapse-all').addEventListener('click', collapseAll);
        searchInput.addEventListener('keyup', e => { if (e.key === 'Enter') performSearch(); });
        searchInput.addEventListener('input', () => { if (!searchInput.value) { searchResultsInfo.classList.add('hidden'); renderKnowledgeList(); }});
        document.getElementById('close-example').addEventListener('click', () => document.getElementById('example-modal').classList.add('hidden'));
        document.getElementById('btn-show-answer').addEventListener('click', () => {
            document.getElementById('example-answer-section').classList.remove('hidden');
            document.getElementById('btn-show-answer').classList.add('hidden');
        });
        document.getElementById('btn-next-example').addEventListener('click', nextExample);
        document.getElementById('btn-add-wrong').addEventListener('click', addToWrongBook);
        document.getElementById('example-modal').addEventListener('click', e => { if (e.target.id === 'example-modal') document.getElementById('example-modal').classList.add('hidden'); });

        initPage();
    </script>
</body>
</html>
