    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"id":"g2_math_001","chapter":"第十六章 二次根式","name":"二次根式的概念","formula":"√a (a ≥ 0)","explanation":"形如√a的代数式叫做二次根式，其中a必须是非负数。\n关键点：\n1. 二次根式必须有根号\n2. 被开方数a必须大于或等于0\n3. 二次根式是非负数，即√a ≥ 0\n\n注意：负数没有平方根，所以二次根式中被开方数必须非负。"},{"id":"g2_math_002","chapter":"第十六章 二次根式","name":"二次根式的基本性质","formula":"(√a)² = a (a ≥ 0)\n√(a²) = |a|","explanation":"1. (√a)² = a（a ≥ 0）：一个非负数的算术平方根的平方等于它本身\n2. √(a²) = |a|：一个数的平方的算术平方根等于这个数的绝对值\n\n重要应用：\n√(a²) 不等于 a，要看 a 的正负性"},{"id":"g2_math_003","chapter":"第十六章 二次根式","name":"二次根式的乘除法","formula":"√a · √b = √(ab) (a ≥ 0, b ≥ 0)\n√a / √b = √(a/b) (a ≥ 0, b > 0)","explanation":"二次根式乘除法法则：\n1. √a · √b = √(ab)\n2. √a / √b = √(a/b)\n\n前提条件：a ≥ 0, b ≥ 0"},{"id":"g2_math_004","chapter":"第十六章 二次根式","name":"最简二次根式","formula":"√a (a为正整数且不含能开尽方的因数)","explanation":"最简二次根式必须满足两个条件：\n1. 被开方数不含分母\n2. 被开方数中不含能开得尽方的因数或因式"},{"id":"g2_math_005","chapter":"第十六章 二次根式","name":"二次根式的加减法","formula":"a√m ± b√m = (a ± b)√m","explanation":"二次根式加减法法则：\n先把各个二次根式化成最简二次根式，再把被开方数相同的二次根式进行合并。"},{"id":"g2_math_006","chapter":"第十六章 二次根式","name":"二次根式的混合运算","formula":"(a + b)(a - b) = a² - b²","explanation":"二次根式混合运算顺序：\n1. 先算乘方，再算乘除，最后算加减\n2. 有括号的先算括号内的\n3. 能利用乘法公式的要先用公式简化"},{"id":"g2_math_007","chapter":"第十六章 二次根式","name":"分母有理化","formula":"1/√a = √a/a (a > 0)\n1/(√a ± √b) = (√a ∓ √b)/(a - b)","explanation":"分母有理化：把分母中的根号化去，使分母变为有理数。\n\n方法：\n1. 分子分母同乘以分母的有理化因式\n2. 如 1/√3，分子分母同乘以√3，得到 √3/3"},{"id":"g2_math_008","chapter":"第十七章 勾股定理","name":"勾股定理","formula":"a² + b² = c²","explanation":"勾股定理：直角三角形两条直角边的平方和等于斜边的平方。\n\n其中：\n- a, b 是直角边\n- c 是斜边（最长边）"},{"id":"g2_math_009","chapter":"第十七章 勾股定理","name":"勾股定理的逆定理","formula":"若 a² + b² = c²，则△ABC是直角三角形","explanation":"勾股定理的逆定理：\n如果三角形的三边长 a, b, c 满足 a² + b² = c²，那么这个三角形是直角三角形。"},{"id":"g2_math_010","chapter":"第十七章 勾股定理","name":"勾股定理的应用","formula":"a² + b² = c²","explanation":"勾股定理在实际问题中的应用：\n\n1. 测量问题\n2. 最短路径问题\n3. 立体图形中的距离计算\n4. 等腰三角形、梯形等几何图形中的边长计算"},{"id":"g2_math_011","chapter":"第十八章 平行四边形","name":"平行四边形的定义与性质","formula":"对边平行且相等；对角相等；对角线互相平分","explanation":"平行四边形定义：两组对边分别平行的四边形叫做平行四边形。\n\n性质：\n1. 对边平行且相等\n2. 对角相等\n3. 相邻内角互补\n4. 对角线互相平分"},{"id":"g2_math_012","chapter":"第十八章 平行四边形","name":"矩形的性质与判定","formula":"对角线相等且互相平分；四个角都是直角","explanation":"矩形：有一个角是直角的平行四边形叫做矩形。\n\n性质：\n1. 具有平行四边形的所有性质\n2. 四个角都是直角\n3. 对角线相等且互相平分"},{"id":"g2_math_013","chapter":"第十八章 平行四边形","name":"菱形的性质与判定","formula":"对角线互相垂直平分；四条边都相等","explanation":"菱形：有一组邻边相等的平行四边形叫做菱形。\n\n性质：\n1. 具有平行四边形的所有性质\n2. 四条边都相等\n3. 对角线互相垂直平分"},{"id":"g2_math_014","chapter":"第十八章 平行四边形","name":"正方形的性质与判定","formula":"对角线相等且互相垂直平分；四条边都相等；四个角都是直角","explanation":"正方形：有一组邻边相等并且有一个角是直角的平行四边形叫做正方形。\n\n性质：\n1. 具有矩形和菱形的所有性质\n2. 四条边都相等\n3. 四个角都是直角"},{"id":"g2_math_015","chapter":"第十八章 平行四边形","name":"三角形中位线","formula":"三角形的中位线平行于第三边，且等于第三边的一半","explanation":"三角形中位线：连接三角形两边中点的线段叫做三角形的中位线。\n\n性质：\n1. 中位线平行于第三边\n2. 中位线等于第三边的一半"},{"id":"g2_math_016","chapter":"第十九章 一次函数","name":"变量与函数","formula":"y = f(x)","explanation":"变量：在一个变化过程中，数值发生变化的量称为变量。\n\n常量：数值始终不变的量称为常量。\n\n函数：在一个变化过程中，如果有两个变量 x 和 y，并且对于 x 的每一个确定的值，y 都有唯一确定的值与其对应，那么我们就说 x 是自变量，y 是 x 的函数。"},{"id":"g2_math_017","chapter":"第十九章 一次函数","name":"正比例函数","formula":"y = kx (k ≠ 0)","explanation":"正比例函数：形如 y = kx（k 是常数，k ≠ 0）的函数叫做正比例函数。\n\n图象：经过原点的一条直线。\n\n性质：\n1. 当 k > 0 时，y 随 x 的增大而增大\n2. 当 k < 0 时，y 随 x 的增大而减小"},{"id":"g2_math_018","chapter":"第十九章 一次函数","name":"一次函数","formula":"y = kx + b (k ≠ 0)","explanation":"一次函数：形如 y = kx + b（k, b 是常数，k ≠ 0）的函数叫做一次函数。\n\n图象：一条直线。\n\n性质：\n1. k 决定直线的倾斜方向\n2. b 决定直线与 y 轴的交点位置"},{"id":"g2_math_019","chapter":"第十九章 一次函数","name":"一次函数的图象与性质","formula":"k > 0 时，y 随 x 的增大而增大\nk < 0 时，y 随 x 的增大而减小","explanation":"一次函数 y = kx + b 的图象与性质：\n\n1. k > 0：y 随 x 的增大而增大\n2. k < 0：y 随 x 的增大而减小\n3. 直线与 x 轴交点：(-b/k, 0)\n4. 直线与 y 轴交点：(0, b)"},{"id":"g2_math_020","chapter":"第十九章 一次函数","name":"一次函数与二元一次方程","formula":"y = kx + b 对应 kx - y + b = 0","explanation":"一次函数与二元一次方程的关系：\n\n1. 一次函数 y = kx + b 的图象上的每一个点的坐标(x, y)都是二元一次方程 kx - y + b = 0 的解\n2. 以二元一次方程的解为坐标的点都在对应的一次函数的图象上"},{"id":"g2_math_021","chapter":"第十九章 一次函数","name":"用函数观点看方程(组)与不等式","formula":"kx + b = 0 → x = -b/k","explanation":"用函数观点看方程与不等式：\n\n1. 解方程 kx + b = 0：求直线 y = kx + b 与 x 轴的交点的横坐标\n2. 解不等式 kx + b > 0：求直线 y = kx + b 在 x 轴上方时 x 的取值范围"},{"id":"g2_math_022","chapter":"第二十章 数据的分析整理","name":"数据的描述","formula":"平均数、中位数、众数","explanation":"数据的描述：\n\n1. 平均数：所有数据的总和除以数据的个数\n2. 中位数：把数据按从小到大排列后，位于中间位置的数\n3. 众数：出现次数最多的数据"},{"id":"g2_math_023","chapter":"第二十章 数据的分析整理","name":"加权平均数","formula":"x̄ = (w1x1 + w2x2 + ... + wn xn) / (w1 + w2 + ... + wn)","explanation":"加权平均数：如果 n 个数据 x₁, x₂, ..., xₙ 的权分别是 w₁, w₂, ..., wₙ，那么加权平均数为：\n\nx̄ = (w₁x₁ + w₂x₂ + ... + wₙxₙ) / (w₁ + w₂ + ... + wₙ)"},{"id":"g2_math_024","chapter":"第二十章 数据的分析整理","name":"中位数和众数","formula":"中位数：中间位置的数\n众数：出现次数最多的数","explanation":"中位数：\n将一组数据按照从小到大（或从大到小）的顺序排列，如果数据的个数是奇数，则处于中间位置的数就是这组数据的中位数；如果数据的个数是偶数，则中间两个数据的平均数就是这组数据的中位数。\n\n众数：\n一组数据中出现次数最多的数据就是这组数据的众数。"},{"id":"g2_math_025","chapter":"第二十章 数据的分析整理","name":"极差与方差","formula":"极差 = 最大值 - 最小值\n方差 s² = (1/n) Σ(xᵢ - x̄)²","explanation":"极差：\n一组数据中的最大值与最小值的差叫做极差。\n极差反映了一组数据的变动范围。\n\n方差：\n对于 n 个数据 x₁, x₂, ..., xₙ，各数据与它们的平均数 x̄ 的差的平方的平均数，叫做这组数据的方差。"},{"id":"g2_math_026","chapter":"第二十章 数据的分析整理","name":"数据的分析整理","formula":"频数、频率、统计图","explanation":"数据的分析整理：\n\n1. 频数：每个对象出现的次数\n2. 频率：每个对象出现的次数与总次数的比值\n3. 各频率之和等于 1\n\n常用统计图：\n- 条形统计图\n- 折线统计图\n- 扇形统计图\n- 频数分布直方图\n\n作用：直观、清晰地表示数据，便于分析。"},{"id":"g2_math_027","chapter":"第十一章 三角形","name":"三角形的概念与分类","formula":"三角形内角和 = 180°","explanation":"由不在同一直线上的三条线段首尾顺次相接所组成的图形叫做三角形。\n\n分类：\n1. 按角分：\n   - 锐角三角形：三个角都是锐角\n   - 直角三角形：有一个角是直角\n   - 钝角三角形：有一个角是钝角\n\n2. 按边分：\n   - 不等边三角形：三边都不相等\n   - 等腰三角形：有两条边相等\n   - 等边三角形：三边都相等（特殊的等腰三角形）"},{"id":"g2_math_028","chapter":"第十一章 三角形","name":"三角形的三边关系","formula":"a + b > c\n|b - a| < c < a + b","explanation":"三角形任意两边之和大于第三边，任意两边之差小于第三边。\n\n应用：\n1. 判断三条线段能否组成三角形\n2. 求三角形某边的取值范围\n\n例如：三边长为 3, 4, 5 的三角形，因为 3+4>5, 3+5>4, 4+5>3，所以能组成三角形。"},{"id":"g2_math_029","chapter":"第十一章 三角形","name":"三角形的内角和","formula":"∠A + ∠B + ∠C = 180°","explanation":"三角形的内角和等于 180°。\n\n推论：\n1. 直角三角形的两个锐角互余（和为90°）\n2. 三角形的一个外角等于与它不相邻的两个内角之和\n3. 三角形的一个外角大于任何一个与它不相邻的内角"},{"id":"g2_math_030","chapter":"第十一章 三角形","name":"三角形的外角","formula":"外角 = 不相邻两内角之和","explanation":"三角形的一边与另一边的延长线组成的角，叫做三角形的外角。\n\n性质：\n1. 三角形的一个外角等于与它不相邻的两个内角之和\n2. 三角形的一个外角大于任何一个与它不相邻的内角\n3. 三角形的外角和等于 360°"},{"id":"g2_math_031","chapter":"第十一章 三角形","name":"多边形内角和","formula":"(n-2) × 180°","explanation":"n 边形的内角和等于 (n-2) × 180°。\n\n常用：\n- 四边形内角和 = 360°\n- 五边形内角和 = 540°\n- 六边形内角和 = 720°\n\nn 边形的外角和等于 360°。"},{"id":"g2_math_032","chapter":"第十二章 全等三角形","name":"全等三角形的概念与性质","formula":"△ABC ≌ △A'B'C'","explanation":"能够完全重合的两个三角形叫做全等三角形。\n\n性质：\n1. 全等三角形的对应边相等\n2. 全等三角形的对应角相等\n3. 全等三角形的对应高、对应中线、对应角平分线相等\n4. 全等三角形的周长相等、面积相等"},{"id":"g2_math_033","chapter":"第十二章 全等三角形","name":"三角形全等的判定-SSS","formula":"三边对应相等的两个三角形全等","explanation":"边边边（SSS）：\n如果两个三角形的三条边分别相等，那么这两个三角形全等。\n\n写作：\n在 △ABC 和 △A'B'C' 中，\nAB = A'B', BC = B'C', CA = C'A'\n∴ △ABC ≌ △A'B'C'（SSS）"},{"id":"g2_math_034","chapter":"第十二章 全等三角形","name":"三角形全等的判定-SAS","formula":"两边和它们的夹角对应相等的两个三角形全等","explanation":"边角边（SAS）：\n如果两个三角形的两边和它们的夹角分别相等，那么这两个三角形全等。\n\n注意：必须是夹角，而不是任意一个角。"},{"id":"g2_math_035","chapter":"第十二章 全等三角形","name":"三角形全等的判定-ASA","formula":"两角和它们的夹边对应相等的两个三角形全等","explanation":"角边角（ASA）：\n如果两个三角形的两角和它们的夹边分别相等，那么这两个三角形全等。"},{"id":"g2_math_036","chapter":"第十二章 全等三角形","name":"三角形全等的判定-AAS","formula":"两角和其中一角的对边对应相等的两个三角形全等","explanation":"角角边（AAS）：\n如果两个三角形的两角和其中一角的对边分别相等，那么这两个三角形全等。"},{"id":"g2_math_037","chapter":"第十二章 全等三角形","name":"直角三角形全等的判定-HL","formula":"斜边和一直角边对应相等的两个直角三角形全等","explanation":"HL 定理：\n斜边和一条直角边分别相等的两个直角三角形全等。\n\n这是直角三角形特有的判定方法，HL 代表 Hypotenuse-Leg（斜边-直角边）。"},{"id":"g2_math_038","chapter":"第十三章 轴对称","name":"轴对称图形","formula":"对称轴","explanation":"如果一个平面图形沿一条直线折叠，直线两旁的部分能够完全重合，那么这个图形叫做轴对称图形，这条直线就是它的对称轴。\n\n常见的轴对称图形：\n- 等腰三角形（1条对称轴）\n- 等边三角形（3条对称轴）\n- 长方形（2条对称轴）\n- 正方形（4条对称轴）\n- 圆（无数条对称轴）"},{"id":"g2_math_039","chapter":"第十三章 轴对称","name":"线段垂直平分线的性质","formula":"到线段两端距离相等的点在这条线段的垂直平分线上","explanation":"垂直平分线：经过线段中点并且垂直于这条线段的直线叫做这条线段的垂直平分线。\n\n性质：\n1. 线段垂直平分线上的点到这条线段两端点的距离相等\n2. 到一条线段两端点距离相等的点，在这条线段的垂直平分线上"},{"id":"g2_math_040","chapter":"第十三章 轴对称","name":"等腰三角形的性质","formula":"等腰三角形两底角相等\n三线合一：顶角平分线、底边上的中线、底边上的高互相重合","explanation":"等腰三角形：有两条边相等的三角形。\n\n性质：\n1. 等腰三角形的两底角相等（等边对等角）\n2. 等腰三角形顶角的平分线、底边上的中线、底边上的高互相重合（三线合一）\n3. 等腰三角形是轴对称图形，对称轴是顶角平分线所在的直线"},{"id":"g2_math_041","chapter":"第十三章 轴对称","name":"等边三角形的性质","formula":"三边相等，三个角都等于 60°","explanation":"等边三角形：三条边都相等的三角形。\n\n性质：\n1. 三边相等\n2. 三个内角都等于 60°\n3. 是轴对称图形，有 3 条对称轴\n4. 每条边上都存在\"三线合一\""},{"id":"g2_math_042","chapter":"第十四章 整式的乘除与因式分解","name":"同底数幂的乘法","formula":"aᵐ · aⁿ = aᵐ⁺ⁿ (m, n 是正整数)","explanation":"同底数幂相乘，底数不变，指数相加。\n\n推广：\naᵐ · aⁿ · aᵖ = aᵐ⁺ⁿ⁺ᵖ"},{"id":"g2_math_043","chapter":"第十四章 整式的乘除与因式分解","name":"幂的乘方与积的乘方","formula":"(aᵐ)ⁿ = aᵐⁿ\n(ab)ⁿ = aⁿbⁿ","explanation":"幂的乘方：底数不变，指数相乘。(aᵐ)ⁿ = aᵐⁿ\n\n积的乘方：把积的每一个因式分别乘方，再把所得的幂相乘。(ab)ⁿ = aⁿbⁿ"},{"id":"g2_math_044","chapter":"第十四章 整式的乘除与因式分解","name":"同底数幂的除法","formula":"aᵐ / aⁿ = aᵐ⁻ⁿ (a ≠ 0, m > n)","explanation":"同底数幂相除，底数不变，指数相减。\n\n零指数幂：a⁰ = 1 (a ≠ 0)\n\n负指数幂：a⁻ⁿ = 1/aⁿ (a ≠ 0)"},{"id":"g2_math_045","chapter":"第十四章 整式的乘除与因式分解","name":"整式的乘法","formula":"(a + b)(c + d) = ac + ad + bc + bd\n单项式 × 多项式 = 各项相乘再相加","explanation":"单项式乘单项式：系数相乘，同底数幂相乘。\n\n单项式乘多项式：m(a+b+c) = ma + mb + mc\n\n多项式乘多项式：(a+b)(c+d) = ac + ad + bc + bd"},{"id":"g2_math_046","chapter":"第十四章 整式的乘除与因式分解","name":"乘法公式-平方差公式","formula":"(a + b)(a - b) = a² - b²","explanation":"两个数的和与这两个数的差的积，等于这两个数的平方差。\n\n应用：\n- 简便计算：(x+3)(x-3) = x² - 9\n- 简化多项式乘法"},{"id":"g2_math_047","chapter":"第十四章 整式的乘除与因式分解","name":"乘法公式-完全平方公式","formula":"(a + b)² = a² + 2ab + b²\n(a - b)² = a² - 2ab + b²","explanation":"两数和（或差）的平方，等于它们的平方和，加上（或减去）它们的积的 2 倍。\n\n应用：\n- 简便计算：(x+5)² = x² + 10x + 25\n- 完全平方式：a² ± 2ab + b²"},{"id":"g2_math_048","chapter":"第十四章 整式的乘除与因式分解","name":"因式分解","formula":"提公因式法、公式法","explanation":"因式分解：把一个多项式化为几个整式的积的形式。\n\n常用方法：\n1. 提公因式法：ma + mb = m(a + b)\n2. 公式法：\n   - 平方差公式：a² - b² = (a+b)(a-b)\n   - 完全平方公式：a² ± 2ab + b² = (a ± b)²\n3. 十字相乘法（拓展）"},{"id":"g2_math_049","chapter":"第十五章 分式","name":"分式的概念","formula":"A/B (B 中含有字母，B ≠ 0)","explanation":"一般地，如果 A、B 表示两个整式，并且 B 中含有字母，那么式子 A/B 叫做分式。\n\n注意：\n1. 分式中分母 B ≠ 0（分母为零时无意义）\n2. 当 A = 0 时，分式 A/B = 0（前提是 B ≠ 0）"},{"id":"g2_math_050","chapter":"第十五章 分式","name":"分式的基本性质","formula":"A/B = A·C / B·C = A÷C / B÷C (B ≠ 0, C ≠ 0)","explanation":"分式的分子与分母同乘（或除以）一个不为 0 的整式，分式的值不变。\n\n应用：\n1. 约分：将分子分母同除以公因式\n2. 通分：将异分母分式化为同分母分式"},{"id":"g2_math_051","chapter":"第十五章 分式","name":"分式的乘除法","formula":"a/b · c/d = ac/bd\na/b ÷ c/d = ad/bc","explanation":"分式乘分式：用分子的积作为积的分子，分母的积作为积的分母。\n\n分式除以分式：把除式的分子分母颠倒位置后，与被除式相乘。"},{"id":"g2_math_052","chapter":"第十五章 分式","name":"分式的加减法","formula":"同分母：a/c ± b/c = (a ± b)/c\n异分母：先通分再相加减","explanation":"同分母分式相加减：分母不变，分子相加减。\n\n异分母分式相加减：先通分，化为同分母分式，然后再加减。"},{"id":"g2_math_053","chapter":"第十五章 分式","name":"分式方程","formula":"解分式方程：去分母 → 解整式方程 → 验根","explanation":"分式方程：分母中含有未知数的方程。\n\n解法步骤：\n1. 在方程两边同乘最简公分母，去分母\n2. 解所得的整式方程\n3. 检验：将整式方程的根代入最简公分母，使分母不为 0 的根是原方程的根，否则是增根"},{"id":"g2_physics_001","chapter":"第一章 机械运动","name":"长度的单位与测量","formula":"1 km = 1000 m\n1 m = 10 dm = 100 cm = 1000 mm\n1 mm = 1000 μm = 1 000 000 nm","explanation":"国际单位制中，长度的基本单位是米（m）。\n\n常用单位：\n- 千米（km）、米（m）、分米（dm）、厘米（cm）、毫米（mm）\n- 微米（μm）、纳米（nm）\n\n测量工具：刻度尺\n使用规则：\n1. 选：根据测量需要选择合适量程和分度值的刻度尺\n2. 放：零刻度线对准被测物体一端，刻度线紧贴被测物体\n3. 看：视线与刻度线垂直\n4. 读：读出准确值和估计值，注明单位\n5. 记：测量值 = 准确值 + 估计值 + 单位"},{"id":"g2_physics_002","chapter":"第一章 机械运动","name":"时间的单位与测量","formula":"1 h = 60 min = 3600 s\n1 min = 60 s\n1 s = 1000 ms","explanation":"国际单位制中，时间的基本单位是秒（s）。\n\n常用单位：小时（h）、分钟（min）、秒（s）、毫秒（ms）。\n\n测量工具：停表（秒表）\n\n误差：\n- 误差是测量值与真实值之间的差异\n- 误差只能减小，不能避免\n- 减小误差的方法：多次测量取平均值、使用更精密的测量工具"},{"id":"g2_physics_003","chapter":"第一章 机械运动","name":"机械运动与参照物","formula":"运动 = 位置变化（相对于参照物）","explanation":"在物理学中，把一个物体相对于另一个物体位置的改变叫做机械运动，简称运动。\n\n参照物：\n- 研究机械运动时，被选作标准的物体叫做参照物\n- 参照物可以任意选择，但一旦选定，就认为它是静止的\n- 同一物体是运动还是静止，取决于所选的参照物，这叫运动和静止的相对性"},{"id":"g2_physics_004","chapter":"第一章 机械运动","name":"速度的概念与公式","formula":"v = s / t\n（v：速度，单位 m/s；s：路程，单位 m；t：时间，单位 s）","explanation":"速度是表示物体运动快慢的物理量。\n\n单位：\n- 国际单位：米/秒（m/s 或 m·s⁻¹）\n- 常用单位：千米/小时（km/h）\n- 换算：1 m/s = 3.6 km/h\n\n匀速直线运动：\n- 物体沿着直线且速度不变的运动\n- 公式：v = s / t（速度恒定，路程与时间成正比）"},{"id":"g2_physics_005","chapter":"第一章 机械运动","name":"平均速度","formula":"v̄ = s总 / t总","explanation":"平均速度表示物体在某一段路程（或某一段时间）内的平均快慢程度。\n\n注意：\n1. 平均速度不是速度的平均值\n2. 平均速度 = 总路程 ÷ 总时间\n3. 平均速度的数值与所选的路程或时间有关"},{"id":"g2_physics_006","chapter":"第二章 声现象","name":"声音的产生与传播","formula":"v声（空气，15°C）= 340 m/s\nv声（空气，25°C）= 346 m/s","explanation":"声音的产生：\n- 声音是由物体振动产生的\n- 振动停止，发声也停止（注意：此时仍可能有余音）\n\n声音的传播：\n- 声音需要介质（固体、液体、气体）才能传播，真空不能传声\n- 声音在不同介质中传播速度不同：固体 > 液体 > 气体\n- 声音在空气（15°C）中传播速度约为 340 m/s\n- 声音以波的形式传播，叫做声波"},{"id":"g2_physics_007","chapter":"第二章 声现象","name":"声音的三要素","formula":"f = 1 / T（频率与周期互为倒数）","explanation":"声音的三要素：音调、响度、音色\n\n1. 音调：\n   - 声音的高低，由频率决定\n   - 频率：每秒内振动的次数，单位 Hz\n   - 频率越高，音调越高\n\n2. 响度：\n   - 声音的强弱（大小），由振幅决定\n   - 振幅：振动的幅度\n   - 振幅越大，响度越大\n   - 离声源越近，响度越大\n\n3. 音色：\n   - 声音的品质，由发声体本身决定\n   - 不同物体发出的声音音色不同"},{"id":"g2_physics_008","chapter":"第二章 声现象","name":"超声波与次声波","formula":"人耳听觉范围：20 Hz ~ 20 000 Hz","explanation":"人耳能听到的声音频率范围：20 Hz ~ 20 000 Hz\n\n超声波：频率高于 20 000 Hz 的声音\n- 应用：B超、潜艇声呐、金属内部缺陷检测、灭鼠驱虫\n\n次声波：频率低于 20 Hz 的声音\n- 产生：地震、火山喷发、海啸、台风、机器振动\n- 危害：能破坏建筑物，损害人体健康\n- 应用：预测地震、台风，监测核爆炸"},{"id":"g2_physics_009","chapter":"第二章 声现象","name":"噪声的危害与控制","formula":"0 dB 是人耳听觉下限\n> 90 dB 影响听力","explanation":"噪声：\n- 从物理学角度：发声体做无规则振动时发出的声音\n- 从环境保护角度：凡是妨碍人们正常休息、学习和工作的声音，以及对人们要听的声音起干扰作用的声音\n\n控制途径：\n1. 在声源处减弱（消声）\n2. 在传播过程中减弱（吸声、隔声）\n3. 在人耳处减弱（戴耳塞、护耳器）\n\n分贝（dB）是声音强弱的单位。"},{"id":"g2_physics_010","chapter":"第三章 物态变化","name":"温度与温度计","formula":"T(K) = t(°C) + 273.15","explanation":"温度：表示物体冷热程度的物理量。\n\n单位：\n- 摄氏温度（°C）：冰水混合物为 0°C，沸水为 100°C\n- 热力学温度（K）：以 -273.15°C 为绝对零度\n- 换算：T = t + 273.15\n\n温度计：\n- 原理：液体的热胀冷缩\n- 使用：\n  1. 估：估计被测温度，选用合适量程的温度计\n  2. 浸：玻璃泡全部浸入液体中，不碰容器底和壁\n  3. 读：待示数稳定后读数，视线与液柱上表面相平\n  4. 取：读数时不能将温度计从液体中取出"},{"id":"g2_physics_011","chapter":"第三章 物态变化","name":"熔化和凝固","formula":"晶体熔化条件：达到熔点 + 继续吸热","explanation":"物质从固态变成液态的过程叫熔化。\n物质从液态变成固态的过程叫凝固。\n\n固体分类：\n- 晶体：海波、冰、各种金属等，有固定熔点\n- 非晶体：松香、玻璃、蜡、沥青等，没有固定熔点\n\n晶体熔化特点：\n- 吸热但温度保持不变（熔点）\n- 熔液共存\n\n晶体凝固特点：\n- 放热但温度保持不变（凝固点）\n- 同一晶体的熔点和凝固点相同"},{"id":"g2_physics_012","chapter":"第三章 物态变化","name":"汽化和液化","formula":"影响蒸发快慢：温度、表面积、空气流动","explanation":"汽化：物质从液态变为气态的过程（吸热）。\n液化：物质从气态变为液态的过程（放热）。\n\n汽化两种方式：\n1. 蒸发：\n   - 在任何温度下都能发生，只在液体表面进行\n   - 影响因素：液体温度、表面积、空气流动\n   - 蒸发吸热有致冷作用\n2. 沸腾：\n   - 在一定温度（沸点）下发生，在液体内部和表面同时进行\n   - 条件：达到沸点 + 继续吸热\n   - 液体沸腾时吸热但温度不变"},{"id":"g2_physics_013","chapter":"第三章 物态变化","name":"升华和凝华","formula":"升华吸热；凝华放热","explanation":"升华：物质从固态直接变成气态的过程（吸热）。\n凝华：物质从气态直接变成固态的过程（放热）。\n\n常见现象：\n- 升华：樟脑丸变小、冬天冰冻的衣服变干、灯丝变细\n- 凝华：霜、雪、雾凇、冰花、碘蒸气遇冷凝华\n\n应用：\n- 人工降雨：干冰升华吸热，使空气中水蒸气液化\n- 舞台烟雾：干冰升华使空气中的水蒸气液化形成小水滴"},{"id":"g2_physics_014","chapter":"第四章 光现象","name":"光的直线传播","formula":"光速 c ≈ 3 × 10⁸ m/s","explanation":"光在同种均匀介质中沿直线传播。\n\n光速：\n- 真空中的光速 c = 3 × 10⁸ m/s（自然界中最大的速度）\n- 空气中的光速略小于真空\n- 光在水中的速度约为真空的 3/4\n- 光在玻璃中的速度约为真空的 2/3\n\n应用：\n- 激光准直\n- 影子的形成\n- 日食、月食的形成\n- 小孔成像"},{"id":"g2_physics_015","chapter":"第四章 光现象","name":"光的反射定律","formula":"∠r = ∠i\n（反射角等于入射角）","explanation":"光射到物体表面时，被物体表面反射回去的现象叫光的反射。\n\n反射定律：\n1. 反射光线、入射光线与法线在同一平面内\n2. 反射光线和入射光线分居法线两侧\n3. 反射角等于入射角（∠r = ∠i）\n\n两种反射：\n- 镜面反射：反射面光滑，平行光反射后仍平行\n- 漫反射：反射面凹凸不平，平行光反射后射向各个方向（我们能从不同方向看到物体是因为漫反射）"},{"id":"g2_physics_016","chapter":"第四章 光现象","name":"平面镜成像","formula":"像距 = 物距\n像与物大小相等","explanation":"平面镜成像特点：\n1. 像与物大小相等\n2. 像与物到平面镜的距离相等（像距 = 物距）\n3. 像与物左右相反\n4. 像是正立的虚像（不是实际光线会聚而成）\n\n原理：光的反射。\n\n应用：\n- 日常生活：穿衣镜、整理仪容\n- 医学：口腔镜\n- 改变光路：潜望镜"},{"id":"g2_physics_017","chapter":"第四章 光现象","name":"光的折射","formula":"光从空气斜射入水/玻璃：折射角 < 入射角","explanation":"光从一种介质斜射入另一种介质时，传播方向发生偏折的现象叫光的折射。\n\n折射定律：\n1. 折射光线、入射光线、法线在同一平面内\n2. 折射光线和入射光线分居法线两侧\n3. 光从空气斜射入水或其他介质时，折射角小于入射角\n4. 光从水或其他介质斜射入空气时，折射角大于入射角\n5. 当光线垂直射入时，传播方向不变\n\n现象：\n- 池水变浅\n- 筷子在水中\"折断\"\n- 海市蜃楼\n- 彩虹"},{"id":"g2_physics_018","chapter":"第四章 光现象","name":"光的色散","formula":"红光偏折最小，紫光偏折最大","explanation":"太阳光（白光）通过三棱镜后，被分解成红、橙、黄、绿、蓝、靛、紫七种色光的现象叫光的色散。\n\n色光三原色：红、绿、蓝\n颜料三原色：品红、黄、青\n\n透明物体的颜色由它透过的色光决定；\n不透明物体的颜色由它反射的色光决定。"},{"id":"g2_physics_019","chapter":"第五章 透镜及其应用","name":"凸透镜与凹透镜","formula":"凸透镜：对光有会聚作用\n凹透镜：对光有发散作用","explanation":"透镜：\n- 凸透镜：中间厚、边缘薄，对光有会聚作用\n- 凹透镜：中间薄、边缘厚，对光有发散作用\n\n基本概念：\n- 主光轴：通过透镜两个球面球心的直线\n- 光心（O）：主光轴上的特殊点，光线通过光心方向不变\n- 焦点（F）：平行于主光轴的光线经透镜后会聚（或反向延长线会聚）的点\n- 焦距（f）：焦点到光心的距离\n\n三条特殊光线：\n1. 平行于主光轴的光线经凸透镜后过焦点\n2. 过焦点的光线经凸透镜后平行于主光轴\n3. 过光心的光线传播方向不变"},{"id":"g2_physics_020","chapter":"第五章 透镜及其应用","name":"凸透镜成像规律","formula":"1/u + 1/v = 1/f","explanation":"凸透镜成像规律（u 为物距，f 为焦距）：\n\n1. u > 2f：倒立、缩小的实像（应用：照相机）\n2. u = 2f：倒立、等大的实像（应用：测焦距）\n3. f < u < 2f：倒立、放大的实像（应用：投影仪、幻灯机）\n4. u = f：不成像（应用：得到平行光）\n5. u < f：正立、放大的虚像（应用：放大镜）\n\n实像：能用光屏承接；\n虚像：不能被光屏承接，只能用眼睛看到。"},{"id":"g2_physics_021","chapter":"第五章 透镜及其应用","name":"眼睛与眼镜","formula":"近视眼戴凹透镜\n远视眼戴凸透镜","explanation":"眼睛：\n- 晶状体和角膜的共同作用相当于凸透镜\n- 视网膜相当于光屏\n- 成像：在视网膜上成倒立、缩小的实像\n\n近视眼：\n- 原因：晶状体太厚、折光能力太强或眼球前后径过长\n- 像成在视网膜前方\n- 矫正：配戴凹透镜\n\n远视眼（老花眼）：\n- 原因：晶状体太薄、折光能力太弱或眼球前后径过短\n- 像成在视网膜后方\n- 矫正：配戴凸透镜"},{"id":"g2_physics_022","chapter":"第五章 透镜及其应用","name":"显微镜与望远镜","formula":"显微镜：物镜 + 目镜（都是凸透镜）","explanation":"显微镜：\n- 物镜：相当于投影仪，成倒立、放大的实像\n- 目镜：相当于放大镜，把物镜成的实像再次放大成虚像\n- 物体最终成倒立、放大的虚像\n\n望远镜：\n- 开普勒望远镜：物镜（使远处物体成缩小的实像）+ 目镜（放大虚像）\n- 最终成倒立、缩小的虚像（视角被放大）"},{"id":"g2_physics_023","chapter":"第一章 机械运动","name":"测量平均速度","formula":"v̄ = s / t","explanation":"测量平均速度实验：\n\n实验原理：v̄ = s / t\n\n实验器材：斜面、小车、刻度尺、停表、金属片\n\n实验步骤：\n1. 使斜面保持一定坡度\n2. 用刻度尺测出小车通过的路程 s\n3. 用停表测出小车通过该路程所用的时间 t\n4. 改变斜面坡度或路程，重复实验\n\n注意事项：\n- 斜面坡度不宜过小（否则小车运动太慢）\n- 释放小车时应从同一位置由静止释放\n- 测量时间时应在小车开始下滑时开始计时，到达终点时停止计时"},{"id":"g2_physics_024","chapter":"第二章 声现象","name":"声音在不同介质中的传播","formula":"v（固体）> v（液体）> v（气体）","explanation":"声音传播速度：\n- 在不同介质中传播速度不同\n- 一般情况下：v（固体）> v（液体）> v（气体）\n- 同种介质中，温度越高，传播速度越快\n\n应用：\n- 古代行军：士兵枕着牛皮箭筒睡觉，能及早听到敌方骑兵的马蹄声\n- 水中声呐：探测水下目标\n- 医学：听诊器"},{"id":"g2_physics_025","chapter":"第四章 光现象","name":"红外线与紫外线","formula":"红外线：热作用强\n紫外线：化学作用强","explanation":"红外线：\n- 位于红光外侧，人眼看不见\n- 特性：热作用强\n- 应用：红外线遥感、红外线加热、红外线测温仪、夜视仪、遥控器\n\n紫外线：\n- 位于紫光外侧，人眼看不见\n- 特性：化学作用强，能使荧光物质发光\n- 应用：验钞机、紫外线消毒、合成维生素D、鉴别古字画\n- 危害：过强紫外线可伤害眼睛和皮肤"},{"id":"g2_physics_026","chapter":"第三章 物态变化","name":"熔化与凝固图象","formula":"晶体有固定熔点；非晶体没有","explanation":"晶体熔化图象（以海波为例）：\n- 横轴：加热时间（t）\n- 纵轴：温度（T）\n- AB段：固态，吸热升温\n- BC段：固液共存，吸热但温度不变（熔点）\n- CD段：液态，吸热升温\n\n非晶体熔化图象（以蜡为例）：\n- 持续吸热，持续升温，没有固定熔点\n\n凝固图象与熔化图象相反：\n- 晶体凝固时放热温度不变（凝固点）"},{"id":"g2_physics_027","chapter":"第五章 透镜及其应用","name":"生活中的透镜","formula":"照相机 u>2f\n投影仪 f<u<2f\n放大镜 u<f","explanation":"生活中的透镜应用：\n\n1. 照相机：\n   - 镜头相当于凸透镜\n   - u > 2f，成倒立、缩小的实像\n   - 像是光屏（底片）上的实际光线会聚而成\n\n2. 投影仪（幻灯机）：\n   - 镜头相当于凸透镜\n   - f < u < 2f，成倒立、放大的实像\n   - 平面镜的作用：改变光的传播方向\n\n3. 放大镜：\n   - 物体在焦点以内（u < f）\n   - 成正立、放大的虚像\n   - 物距越大，虚像越大（但最大不超过物体2倍）"},{"id":"g2_physics_028","chapter":"第四章 光现象","name":"光现象的辨析与应用","formula":"光直线传播、反射、折射的区别","explanation":"三种光现象辨析：\n\n1. 光的直线传播：\n   - 同种均匀介质中光沿直线传播\n   - 现象：影子、日食、月食、小孔成像\n\n2. 光的反射：\n   - 光射到物体表面被反射回去\n   - 反射角 = 入射角\n   - 现象：平面镜成像、看见不发光的物体\n\n3. 光的折射：\n   - 光从一种介质斜射入另一种介质\n   - 现象：池水变浅、海市蜃楼、彩虹、铅笔在水中\"折断\""},{"id":"g2_physics_029","chapter":"第六章 质量与密度","name":"质量及其测量","formula":"m_总 = m1 + m2 + ...","explanation":"质量：物体所含物质的多少。\n\n性质：\n- 质量是物体本身的一种属性，与物体的形状、状态、位置无关\n- 单位：t、kg、g、mg\n- 换算：1 t = 1000 kg，1 kg = 1000 g，1 g = 1000 mg\n\n测量工具：托盘天平\n使用步骤：\n1. 看：量程、分度值\n2. 放：水平台面上，游码归零\n3. 调：调节平衡螺母使横梁平衡\n4. 称：左物右码，砝码由大到小\n5. 读：m物体 = m砝码 + m游码\n6. 收：砝码归盒，游码归零"},{"id":"g2_physics_030","chapter":"第六章 质量与密度","name":"密度的概念与公式","formula":"ρ = m / V\n（ρ：密度，m：质量，V：体积）","explanation":"密度：单位体积某种物质的质量。\n\n性质：\n- 密度是物质的一种特性，与物体的质量、体积无关（与温度、状态有关）\n- 单位：kg/m³ 或 g/cm³\n- 换算：1 g/cm³ = 1000 kg/m³ = 10³ kg/m³\n\n常见物质密度（水=1.0 g/cm³）：\n- 铝 2.7 g/cm³\n- 铁 7.9 g/cm³\n- 铜 8.9 g/cm³\n- 水银 13.6 g/cm³"},{"id":"g2_physics_031","chapter":"第六章 质量与密度","name":"密度的应用","formula":"m = ρV\nV = m / ρ","explanation":"密度公式变形：\n- m = ρV（已知体积求质量）\n- V = m / ρ（已知质量求体积）\n\n应用：\n1. 鉴别物质：测出密度，对照密度表\n2. 求质量：不便直接称量时，测体积查密度计算\n3. 求体积：不便直接测量时，称质量查密度计算\n4. 判断空心实心：\n   - 假设实心，计算密度与物质密度比较\n   - 假设实心，计算体积与物体体积比较"},{"id":"g2_physics_032","chapter":"第六章 质量与密度","name":"测量物质的密度","formula":"ρ = m / V","explanation":"实验原理：ρ = m / V\n\n实验器材：天平、量筒、烧杯、水、待测物体\n\n实验步骤：\n1. 用天平测量物体质量 m\n2. 在量筒中倒入适量水，读体积 V1\n3. 用细线系住物体放入量筒，读体积 V2\n4. 计算 V = V2 - V1\n5. 计算 ρ = m / V\n\n注意事项：\n- 测量顺序：先测质量，再测体积（避免水使物体沾水影响质量测量）\n- 量筒读数：视线与凹液面最低处相平\n- 适量水：能浸没物体且能读出物体放入后体积"},{"id":"g2_physics_033","chapter":"第七章 力","name":"力的概念与作用效果","formula":"力的单位：牛顿（N）","explanation":"力：物体对物体的作用。\n\n力的作用效果：\n1. 改变物体的形状（使物体发生形变）\n2. 改变物体的运动状态（速度大小或方向改变）\n\n力的三要素：大小、方向、作用点。\n\n单位：牛顿（N），1 N 大约等于拿起 2 个鸡蛋的力。\n\n力的相互性：\n- 物体间力的作用是相互的\n- 一个物体对另一个物体施力时，也一定受到另一个物体对它的力\n- 作用力与反作用力大小相等，方向相反，作用在两个不同物体上"},{"id":"g2_physics_034","chapter":"第七章 力","name":"弹力与弹簧测力计","formula":"F = kx（胡克定律）","explanation":"弹力：物体发生弹性形变时产生的力。\n\n条件：\n- 物体间相互接触\n- 发生弹性形变\n\n常见弹力：压力、支持力、推力、拉力、绳的拉力等。\n\n弹簧测力计：\n- 原理：在弹性限度内，弹簧的伸长量与所受拉力成正比\n- 使用：\n  1. 看清量程、分度值\n  2. 校零\n  3. 拉力方向沿弹簧轴线方向\n  4. 读数时视线与刻度盘相平"},{"id":"g2_physics_035","chapter":"第七章 力","name":"重力","formula":"G = mg\ng = 9.8 N/kg","explanation":"重力：由于地球吸引而使物体受到的力。\n\n符号：G\n单位：N\n方向：竖直向下（不是垂直向下）\n作用点：重心（质量分布均匀的物体的重心在几何中心）\n\n重力与质量的关系：\n- G = m × g\n- g = 9.8 N/kg，物理意义：质量为 1 kg 的物体受到的重力为 9.8 N\n- g 在地球不同位置略有不同\n\n注意：重力是物体受到的力，地球对物体的万有引力的一个分力。"},{"id":"g2_physics_036","chapter":"第七章 力","name":"摩擦力","formula":"f = μN","explanation":"摩擦力：两个相互接触的物体发生相对运动或有相对运动趋势时，在接触面上产生的阻碍相对运动的力。\n\n分类：\n1. 滑动摩擦力：\n   - 方向：与相对运动方向相反\n   - 大小：与压力、接触面粗糙程度有关，与速度无关\n2. 静摩擦力：\n   - 方向：与相对运动趋势方向相反\n   - 大小：随外力的变化而变化\n3. 滚动摩擦力：比滑动摩擦力小得多\n\n增大有益摩擦：增大压力、使接触面更粗糙\n减小有害摩擦：减小压力、使接触面光滑、加润滑油、用滚动代替滑动"},{"id":"g2_physics_037","chapter":"第八章 运动和力","name":"牛顿第一定律","formula":"一切物体在没有受到外力作用时\n总保持静止或匀速直线运动状态","explanation":"牛顿第一定律（惯性定律）：\n一切物体在没有受到外力作用时，总保持静止状态或匀速直线运动状态。\n\n说明：\n1. 该定律是在大量经验事实基础上，通过进一步的推理而概括出来的\n2. 不受力的物体是不存在的，所以牛顿第一定律是理想情况\n3. 力是改变物体运动状态的原因\n4. 物体的运动不需要力来维持"},{"id":"g2_physics_038","chapter":"第八章 运动和力","name":"惯性","formula":"一切物体都有保持原来运动状态的性质","explanation":"惯性：物体保持原来运动状态不变的性质。\n\n性质：\n1. 一切物体在任何时候都具有惯性\n2. 惯性大小只与质量有关，质量越大惯性越大\n3. 惯性不是力，不能说「受到惯性作用」\n\n应用：\n- 跳远前的助跑\n- 拍打衣服上的灰尘\n- 锤头松了用撞击方法套紧\n- 安全带的作用"},{"id":"g2_physics_039","chapter":"第八章 运动和力","name":"二力平衡","formula":"F1 = F2\n方向相反、作用在同一直线上、同一物体上","explanation":"二力平衡：物体在两个力的作用下保持静止或匀速直线运动状态。\n\n二力平衡条件（四同三不同原则）：\n1. 大小相等\n2. 方向相反\n3. 作用在同一直线上\n4. 作用在同一物体上\n\n注意：\n- 平衡力与相互作用力的区别：平衡力作用在同一物体上，相互作用力作用在不同物体上\n- 物体受平衡力时，一定处于静止或匀速直线运动状态"},{"id":"g2_physics_040","chapter":"第八章 运动和力","name":"同一直线上二力的合成","formula":"同方向：F = F1 + F2\n反方向：F = |F1 - F2|","explanation":"合力：如果一个力产生的效果跟几个力共同作用产生的效果相同，这个力就叫做那几个力的合力。\n\n同一直线上二力的合成：\n1. 同方向：F合 = F1 + F2，方向与 F1、F2 相同\n2. 反方向：F合 = |F1 - F2|，方向与较大的力相同\n\n注意：\n- 合力可以大于、等于或小于任一分力\n- 合力是等效替代，不是真正存在的力"},{"id":"g2_physics_041","chapter":"第九章 压强","name":"压强的概念与公式","formula":"p = F / S\n单位：Pa（帕斯卡），1 Pa = 1 N/m²","explanation":"压强：物体所受压力的大小与受力面积之比。\n\n物理意义：表示压力作用效果的物理量。\n\n公式：p = F / S\n- F：压力（单位 N）\n- S：受力面积（单位 m²）\n- p：压强（单位 Pa）\n\n应用：\n- 增大压强：增大压力、减小受力面积\n- 减小压强：减小压力、增大受力面积\n\n实例：\n- 啄木鸟的嘴尖、针尖、刀刃\n- 书包带宽、坦克履带、滑雪板"},{"id":"g2_physics_042","chapter":"第九章 压强","name":"液体的压强","formula":"p = ρgh\n（ρ：液体密度，g = 9.8 N/kg，h：深度）","explanation":"液体压强：\n- 由于液体受到重力且具有流动性，所以液体对容器底和侧壁都有压强\n- 液体内部向各个方向都有压强\n\n液体压强公式：p = ρ液 g h\n- 适用条件：静止液体\n- 深度 h：液面到所求点的竖直距离\n- 同一深度，液体向各个方向压强相等\n- 深度越深，压强越大\n- 密度越大，压强越大\n\n连通器原理：\n- 上端开口、下部相连通的容器叫连通器\n- 连通器里同一种液体不流动时，各容器中液面总保持相平"},{"id":"g2_physics_043","chapter":"第九章 压强","name":"大气压强","formula":"p0 ≈ 1.013 × 10⁵ Pa\n（标准大气压）","explanation":"大气压强：大气对浸在它里面的物体产生的压强。\n\n产生原因：\n- 空气受到重力作用且具有流动性\n\n标准大气压：\n- 1 标准大气压 = 760 mm 汞柱 = 1.013 × 10⁵ Pa\n- 大气压随高度增加而减小\n- 一切液体的沸点随气压降低而降低\n\n证明大气压存在的实验：\n- 马德堡半球实验\n- 覆杯实验\n\n测量工具：水银气压计、无液气压计"},{"id":"g2_physics_044","chapter":"第九章 压强","name":"流体压强与流速的关系","formula":"流速越大，压强越小","explanation":"流体：液体和气体的统称。\n\n流速与压强的关系：\n- 在流体中，流速越大的地方，压强越小\n- 流速越小的地方，压强越大\n\n应用：\n1. 飞机机翼：上方凸起，下方平直。飞行时上方空气流速大、压强小，下方流速小、压强大，产生向上的升力。\n2. 火车站台安全线：火车通过时，靠近车身边缘空气流速大、压强小，远离的一侧大气压会把人推向火车。\n3. 喷雾器：\n4. 乒乓球的弧圈球："},{"id":"g2_physics_045","chapter":"第十章 浮力","name":"浮力的概念","formula":"F浮 = F下 - F上（压力差法）","explanation":"浮力：浸在液体（或气体）中的物体受到液体（或气体）向上的托力。\n\n方向：竖直向上\n施力物体：液体（或气体）\n\n称重法：F浮 = G物 - F示（物体在空气中的重力减去浸在液体中时弹簧测力计的示数）\n\n浮力产生原因：\n- 液体对物体上下表面的压力差\n- F浮 = F下表面 - F上表面\n- 当物体下表面没有液体时（如物体紧贴容器底部），F浮 = 0（特例）"},{"id":"g2_physics_046","chapter":"第十章 浮力","name":"阿基米德原理","formula":"F浮 = G排 = ρ液 g V排","explanation":"阿基米德原理：\n浸在液体中的物体所受的浮力，等于它排开的液体所受的重力。\n\n公式：F浮 = G排液 = m排g = ρ液gV排\n- 适用：液体和气体\n- V排：物体排开液体的体积（不一定等于物体体积）\n- 当物体完全浸没时：V排 = V物\n- 当物体部分浸没时：V排 < V物\n\n注意：\n- 浮力大小只与液体密度和 V排 有关\n- 与物体本身的密度、形状、浸没深度无关"},{"id":"g2_physics_047","chapter":"第十章 浮力","name":"物体的浮沉条件","formula":"漂浮：F浮 = G物\n悬浮：F浮 = G物且V排 = V物","explanation":"物体的浮沉：\n\n1. 下沉：F浮 < G物（ρ物 > ρ液）\n2. 悬浮：F浮 = G物（ρ物 = ρ液），可停留在液体内部任何位置\n3. 上浮：F浮 > G物（ρ物 < ρ液），最终漂浮\n4. 漂浮：F浮 = G物（ρ物 < ρ液），静止在液面上，部分浸入\n\n判断方法：\n- 比较 F浮 和 G 的大小\n- 比较 ρ物 和 ρ液 的大小（实心物体）\n\n注意：\n- 漂浮时 V排 < V物\n- 悬浮和漂浮都是平衡状态，F浮 = G物\n- 潜水艇：靠改变自身重力实现上浮和下沉"},{"id":"g2_physics_048","chapter":"第十章 浮力","name":"浮力的应用","formula":"F浮 = ρ液gV排","explanation":"浮力应用：\n\n1. 轮船：\n   - 用钢铁制成，制成空心增大 V排，增大 F浮\n   - 排水量：满载时排开水的质量\n\n2. 潜水艇：\n   - 通过向水舱中充水或排水改变自身重力\n   - F浮不变（V排不变），改变 G 实现浮沉\n\n3. 气球、飞艇：\n   - 内部充入密度小于空气的气体（氢气、氦气、热空气）\n   - F浮 > G 时升空\n\n4. 密度计：\n   - 漂浮在液面，F浮 = G\n   - 液体密度越小，密度计浸入越深"},{"id":"g2_physics_049","chapter":"第十一章 功和机械能","name":"功的概念与公式","formula":"W = Fs\n（W：功，F：力，s：沿力的方向移动的距离）","explanation":"功：力与物体在力的方向上移动距离的乘积。\n\n公式：W = Fs\n- 单位：J（焦耳），1 J = 1 N·m\n- 1 J 约等于把 1 个鸡蛋举高 1 m 做的功\n\n做功的两个必要因素：\n1. 作用在物体上的力\n2. 物体在力的方向上移动了一段距离\n\n不做功的三种情况：\n1. 物体不受力但运动（如冰在光滑冰面上滑行）\n2. 物体受力但没有移动\n3. 物体受力且移动，但力的方向与运动方向垂直"},{"id":"g2_physics_050","chapter":"第十一章 功和机械能","name":"功率","formula":"P = W / t = Fv","explanation":"功率：单位时间内所做的功。\n\n物理意义：表示做功快慢的物理量。\n\n公式：\n- 定义式：P = W / t\n- 变形：P = Fv（v 为匀速运动速度）\n\n单位：W（瓦特），1 W = 1 J/s\n常用单位：kW（千瓦），1 kW = 1000 W\n\n注意：\n- 功率大不一定做功多，做功多不一定功率大\n- 功率与机械效率无关"},{"id":"g2_physics_051","chapter":"第十一章 功和机械能","name":"动能和势能","formula":"Ek = ½mv²\nEp = mgh","explanation":"动能：物体由于运动而具有的能。\n- 大小与质量、速度有关\n- 公式：Ek = ½mv²\n- 质量越大、速度越大，动能越大\n\n势能：\n1. 重力势能：物体由于被举高而具有的能\n   - 大小与质量、被举高度有关\n   - 公式：Ep = mgh\n   - 质量越大、高度越高，重力势能越大\n\n2. 弹性势能：物体由于发生弹性形变而具有的能\n   - 与弹性形变程度有关\n   - 形变程度越大，弹性势能越大\n\n统称机械能：动能 + 势能"},{"id":"g2_physics_052","chapter":"第十一章 功和机械能","name":"机械能及其转化","formula":"E机械 = Ek + Ep","explanation":"机械能转化：\n- 动能和势能可以相互转化\n- 转化过程中，若不计摩擦、空气阻力等，机械能总量保持不变（机械能守恒）\n\n实例：\n- 滚摆：下降时重力势能转化为动能；上升时动能转化为重力势能\n- 单摆：最高点势能最大、最低点动能最大\n- 弹簧：压缩时弹性势能增大\n- 过山车\n- 撑杆跳：动能 → 弹性势能 → 重力势能"},{"id":"g2_physics_053","chapter":"第十二章 简单机械","name":"杠杆","formula":"F1 × L1 = F2 × L2","explanation":"杠杆：在力的作用下能绕着固定点转动的硬棒。\n\n五要素：\n1. 支点 O：杠杆绕着转动的点\n2. 动力 F1：使杠杆转动的力\n3. 阻力 F2：阻碍杠杆转动的力\n4. 动力臂 L1：支点到动力作用线的距离\n5. 阻力臂 L2：支点到阻力作用线的距离\n\n杠杆平衡条件：F1 × L1 = F2 × L2（动力×动力臂 = 阻力×阻力臂）\n\n杠杆分类：\n1. 省力杠杆：L1 > L2，F1 < F2，但费距离\n2. 费力杠杆：L1 < L2，F1 > F2，但省距离\n3. 等臂杠杆：L1 = L2，F1 = F2，不省力不费力"},{"id":"g2_physics_054","chapter":"第十二章 简单机械","name":"滑轮","formula":"F = G / n\ns = nh","explanation":"滑轮分类：\n\n1. 定滑轮：\n   - 实质：等臂杠杆\n   - 特点：F = G，不省力但改变力的方向\n   - 物体移动距离 s = 绳端移动距离\n\n2. 动滑轮：\n   - 实质：动力臂 = 2 × 阻力臂的杠杆\n   - 特点：F = G/2，省一半力（不计摩擦和动滑轮重），但不改变力的方向\n   - 绳端移动距离 s = 2h\n\n3. 滑轮组：\n   - 既省力又改变力的方向\n   - F = G总 / n（n 为承担物重的绳子段数）\n   - s = nh（绳端移动距离 = n × 物体上升高度）\n   - s/v 关系：v绳 = nv物"},{"id":"g2_physics_055","chapter":"第十二章 简单机械","name":"机械效率","formula":"η = W有用 / W总 × 100%","explanation":"有用功（W有用）：人们需要做的功，对人们有用的功。\n额外功（W额外）：人们不需要但又不得不做的功。\n总功（W总）：有用功与额外功的总和。\n\nW总 = W有用 + W额外\n\n机械效率：\n- 定义：有用功跟总功的比值\n- 公式：η = W有用 / W总 × 100%\n- η 永远小于 1（小于 100%）\n- η 没有单位，用百分数表示\n\n提高机械效率的方法：\n1. 减小机械自重\n2. 加润滑油减小摩擦\n3. 改进机械结构，使额外功减小"},{"id":"g2_physics_056","chapter":"第九章 压强","name":"液体压强的计算","formula":"F = pS = ρ液ghS","explanation":"液体压力和压强：\n\n压力：F = pS = ρ液ghS\n- 不一定等于液体的重力\n- 容器形状决定 F 与 G液 关系：\n  - 上宽下窄：F < G液\n  - 上下等宽：F = G液\n  - 上窄下宽：F > G液\n\n特殊容器压力：\n- 装满水的规则容器底面受到的压力 F = ρ水gSh"},{"id":"g2_physics_057","chapter":"第七章 力","name":"力的示意图","formula":"力的图示：标度 + 方向 + 大小","explanation":"力的示意图：用一根带箭头的线段把力的三要素表示出来。\n\n作图方法：\n1. 沿力的方向画一条线段\n2. 线段的起点或终点画在力的作用点上\n3. 在线段末端画箭头表示力的方向\n4. 在同一图上，线段长度需成比例（标度）\n\n注意事项：\n- 重力：作用点画在重心，方向竖直向下\n- 压力：作用点在受压物体的接触面上，方向垂直于接触面\n- 拉力：作用点在被拉物体的受力处，方向沿绳收缩方向"},{"id":"g2_physics_058","chapter":"第七章 力","name":"力的平衡与运动状态","formula":"合力为零 ⇄ 平衡状态","explanation":"物体运动状态与受力关系：\n\n1. 物体不受力：保持静止或匀速直线运动\n2. 受平衡力：保持静止或匀速直线运动\n3. 受非平衡力：运动状态改变\n   - 力方向与运动方向相同：加速\n   - 力方向与运动方向相反：减速\n   - 力方向与运动方向不在同一直线上：运动方向改变（曲线运动）\n\n力是改变物体运动状态的原因，不是维持运动的原因。"},{"id":"g2_english_u001","chapter":"第一章 Unit1: Where did you go on vacation?","name":"一般过去时的概念与构成","formula":"主语 + 动词过去式 + 其他","explanation":"一般过去时表示过去某一时间发生的动作或存在的状态。\n\n构成：主语 + 动词过去式\n- 肯定句：主语 + 动词过去式 + 其他\n- 否定句：主语 + did not (didn't) + 动词原形 + 其他\n- 一般疑问句：Did + 主语 + 动词原形 + 其他？\n\n时间状语：yesterday, last week, in 2020, two days ago, just now等"},{"id":"g2_english_u002","chapter":"第一章 Unit1: Where did you go on vacation?","name":"规则动词过去式的变化规则","formula":"动词过去式 = 动词 + -ed","explanation":"规则动词过去式的构成：\n\n1. 一般情况：直接加 -ed\n   work → worked, play → played\n\n2. 以e结尾：加 -d\n   live → lived, like → liked\n\n3. 以辅音字母+y结尾：变y为i加 -ed\n   study → studied, try → tried\n\n4. 重读闭音节结尾且末尾只有一个辅音字母：双写末尾辅音加 -ed\n   stop → stopped, plan → planned"},{"id":"g2_english_u003","chapter":"第一章 Unit1: Where did you go on vacation?","name":"不规则动词过去式","formula":"不规则动词需要特殊记忆","explanation":"常见不规则动词过去式：\n\n- am/is → was\n- are → were\n- go → went\n- come → came\n- see → saw\n- eat → ate\n- take → took\n- buy → bought\n- have → had\n- do → did\n- make → made\n- get → got\n- sleep → slept\n- feel → felt\n- say → said\n- tell → told\n- think → thought\n- read → read (发音变为/red/)"},{"id":"g2_english_u004","chapter":"第一章 Unit1: Where did you go on vacation?","name":"一般过去时的否定句和疑问句","formula":"否定句：主语 + didn't + 动词原形\n疑问句：Did + 主语 + 动词原形？","explanation":"一般过去时的否定句和疑问句构成：\n\n否定句：\n主语 + did not (didn't) + 动词原形 + 其他\n例：I didn't go to school yesterday.\n\n疑问句：\nDid + 主语 + 动词原形 + 其他？\n例：Did you go to the park last weekend?\n\n注意：无论是肯定还是否定句，动词都要用原形。"},{"id":"g2_english_u005","chapter":"第一章 Unit1: Where did you go on vacation?","name":"Where引导的特殊疑问句","formula":"Where + did + 主语 + 动词原形 + 其他？","explanation":"Where用于询问地点。\n\n结构：Where + did + 主语 + 动词原形 + 其他？\n\n例句：\n- Where did you go on vacation? 你去哪里度假了？\n- Where did she go last Sunday? 她上周日去哪里了？\n- Where did they stay? 他们住在哪里？\n\n回答用介词短语：\nI went to Beijing. / She went to the beach."},{"id":"g2_english_u006","chapter":"第一章 Unit1: Where did you go on vacation?","name":"复合不定代词","formula":"some-/any- + thing/body/one\nevery- + thing/body/one\nno- + thing/body/one","explanation":"复合不定代词由 some-, any-, every-, no- + thing, body, one 构成。\n\nsomething 某事/某物\nanything 任何事/任何物\neverything 每件事/每个事物\nnothing 没有事/没有物\n\nsomeone/somebody 某人\nanyone/anybody 任何人\neveryone/everybody 每个人\nno one/nobody 没有人\n\n用法：\n- something, someone, somebody 用于肯定句\n- anything, anyone, anybody 用于否定句和疑问句\n- everything, everyone, everywhere, no one, nobody 用于各种句型"},{"id":"g2_english_u007","chapter":"第一章 Unit1: Where did you go on vacation?","name":"一般过去时的时间状语","formula":"yesterday / last... / ...ago / in + 过去年份","explanation":"常与一般过去时连用的时间状语：\n\n1. yesterday系列：\n   - yesterday 昨天\n   - yesterday morning/afternoon/evening 昨天上午/下午/晚上\n\n2. last系列：\n   - last week/month/year 上一周/月/年\n   - last summer/winter 去年夏天/冬天\n\n3. ago系列：\n   - two days ago 两天前\n   - a week ago 一周前\n   - long ago 很久以前\n\n4. 具体过去时间：\n   - in 2020 在2020年\n   - on Monday 在星期一"},{"id":"g2_english_u008","chapter":"第二章 Unit2: What should I do?","name":"情态动词should的用法","formula":"主语 + should + 动词原形","explanation":"should是情态动词，表示\"应该\"。\n\n用法：\n1. 表示建议、劝告\n   You should study harder. 你应该更加努力学习。\n   She should see a doctor. 她应该去看医生。\n\n2. 否定句：should not (shouldn't)\n   You shouldn't give up. 你不应该放弃。\n\n3. 疑问句：Should + 主语 + 动词原形？\n   Should I tell her the truth? 我应该告诉她真相吗？\n\n特点：后面直接跟动词原形，无人称和数的变化。"},{"id":"g2_english_u009","chapter":"第二章 Unit2: What should I do?","name":"情态动词could的用法","formula":"主语 + could + 动词原形","explanation":"could是can的过去式，也是情态动词。\n\n用法：\n1. 表示过去的能力（can的过去式）\n   When I was young, I could run fast. 我年轻时跑得很快。\n\n2. 表示请求许可（比can更委婉）\n   Could I use your phone? 我可以用你的手机吗？\n   Could you help me? 你能帮我吗？\n\n3. 表示可能性\n   It could rain tomorrow. 明天可能下雨。\n\n否定：could not (couldn't)\n疑问：Could + 主语 + 动词原形？"},{"id":"g2_english_u010","chapter":"第二章 Unit2: What should I do?","name":"should与could的区别","formula":"should = 应该（建议）\ncould = 能够/可能（委婉）","explanation":"should和could的区别：\n\nshould（应该）：\n- 侧重于\"应该\"，表示建议或义务\n- You should drink more water. 你应该多喝水。\n- 语气较直接\n\ncould（能够/可能）：\n- 侧重于\"能够\"，表示能力或可能性\n- Could I borrow your book? 我能借你的书吗？\n- 语气更委婉、客气\n- 含有不确定或试探的意味\n\n比较：\nYou should see a doctor. 你应该去看医生。（建议）\nYou could see a doctor. 你可以去看医生。（可能的选择）"},{"id":"g2_english_u011","chapter":"第二章 Unit2: What should I do?","name":"What should I do? 句型","formula":"What should I/we do?","explanation":"What should I do? 表示\"我应该做什么？\"\n\n用法：\n1. 询问建议或意见\n   What should I do? I have a fever. 我应该怎么办？我发烧了。\n\n2. 回答用should, could等\n   You should take some medicine and rest. 你应该吃药并休息。\n\n3. 复数形式：What should we do? 我们应该做什么？\n\n相关句型：\n- What should I wear? 我应该穿什么？\n- What should we buy? 我们应该买什么？"},{"id":"g2_english_u012","chapter":"第二章 Unit2: What should I do?","name":"提建议的其他表达方式","formula":"Why don't you...? / How about...? / What about...?","explanation":"提建议的多种表达：\n\n1. Why don't you + 动词原形？\n   Why don't you go to bed earlier? 你为什么不早点睡觉？\n\n2. Why not + 动词原形？\n   Why not have a rest? 为什么不休息一下？\n\n3. How about + 名词/动名词？\n   How about going hiking? 去远足怎么样？\n\n4. What about + 名词/动名词？\n   What about this one? 这个怎么样？\n\n5. You should/shouldn't + 动词原形\n   You should try again. 你应该再试一次。\n\n6. You could + 动词原形\n   You could ask your teacher. 你可以问你的老师。"},{"id":"g2_english_u013","chapter":"第二章 Unit2: What should I do?","name":"need to / don't need to 的用法","formula":"主语 + need to + 动词原形\n主语 + don't need to + 动词原形","explanation":"need to 表示\"需要做某事\"，是实义动词。\n\n用法：\n1. 肯定句：主语 + need(s) to + 动词原形\n   I need to study English. 我需要学英语。\n   She needs to lose weight. 她需要减肥。\n\n2. 否定句：主语 + don't/doesn't need to + 动词原形\n   You don't need to worry. 你不需要担心。\n\n3. 疑问句：Do/Does + 主语 + need to + 动词原形？\n   Do I need to bring my book? 我需要带书吗？\n\n注意：need to 有人称和数的变化。"},{"id":"g2_english_u014","chapter":"第三章 Unit3: Could you please clean your room?","name":"Could you please...? 句型","formula":"Could you please + 动词原形？","explanation":"Could you please...? 是请求他人做某事的委婉句型。\n\n结构：Could you please + 动词原形？\n\n例句：\n- Could you please clean your room? 请你打扫一下房间好吗？\n- Could you please open the window? 请你打开窗户好吗？\n- Could you please help me with my homework? 请你帮我做作业好吗？\n\n回答：\n- Sure. / Of course. 当然可以。\n- Sorry, I can't. 对不起，我不能。\n\n注意：please后面直接跟动词原形。"},{"id":"g2_english_u015","chapter":"第三章 Unit3: Could you please clean your room?","name":"Could I please...? 句型","formula":"Could I please + 动词原形？","explanation":"Could I please...? 是请求许可的委婉句型。\n\n结构：Could I please + 动词原形？\n\n例句：\n- Could I please use your computer? 请问我可以用你的电脑吗？\n- Could I please go out tonight? 请问我今晚可以出去吗？\n- Could I please have some water? 请问我可以喝点水吗？\n\n回答：\n- Sure. / Of course. 当然可以。\n- Sorry, you can't. 对不起，不行。\n\n与Can I...?相比，Could I...?更委婉客气。"},{"id":"g2_english_u016","chapter":"第三章 Unit3: Could you please clean your room?","name":"情态动词总结","formula":"can, could, may, might, should, would","explanation":"常见情态动词用法总结：\n\n1. can/could：能力、请求、允许、可能性\n   I can swim. / Could you help me?\n\n2. may/might：允许、可能性（may较肯定，might较不确定）\n   May I come in? / It might rain.\n\n3. should：建议、应该\n   You should eat more vegetables.\n\n4. would：请求、意愿（更委婉）\n   Would you like some tea?\n\n特点：\n- 后面直接跟动词原形\n- 没有人称和数的变化\n- 否定式在后面加not"},{"id":"g2_english_u017","chapter":"第三章 Unit3: Could you please clean your room?","name":"动词不定式作宾语","formula":"动词 + to + 动词原形","explanation":"动词不定式由 to + 动词原形构成，可作宾语。\n\n常见接不定式作宾语的动词：\n- want to do 想要做\n- hope to do 希望做\n- decide to do 决定做\n- plan to do 计划做\n- agree to do 同意做\n- learn to do 学习做\n- try to do 尝试做\n- need to do 需要做\n\n例句：\n- I want to buy a new bike. 我想买一辆新自行车。\n- She decided to study medicine. 她决定学医。\n- They plan to travel to Japan. 他们计划去日本旅游。"},{"id":"g2_english_u018","chapter":"第四章 Unit4: Why don't you talk to your parents?","name":"Why don't you...? 句型","formula":"Why don't you + 动词原形？","explanation":"Why don't you...? 是提建议的句型，表示\"为什么不...？\"\n\n结构：Why don't you/we + 动词原形？\n\n例句：\n- Why don't you talk to your parents? 你为什么不和你的父母谈谈？\n- Why don't we go out for dinner? 我们为什么不出去吃饭？\n- Why don't you try this one? 你为什么不试试这个？\n\n简略形式：Why not + 动词原形？\n- Why not ask the teacher? 为什么不问老师？\n\n注意：don't 在这里是语法需要，不是否定含义。"},{"id":"g2_english_u019","chapter":"第四章 Unit4: Why don't you talk to your parents?","name":"提建议句型总结","formula":"Why don't you...? / You should... / Let's...","explanation":"英语中提建议的常用句型：\n\n1. Why don't you/we + 动词原形？\n   Why don't you take a break?\n\n2. Why not + 动词原形？\n   Why not go swimming?\n\n3. You should/shouldn't + 动词原形\n   You should be more careful.\n\n4. You could + 动词原形\n   You could ask your friend.\n\n5. Let's + 动词原形\n   Let's play football.\n\n6. How about + 名词/动名词？\n   How about going to the cinema?\n\n7. What about + 名词/动名词？\n   What about having a picnic?"},{"id":"g2_english_u020","chapter":"第四章 Unit4: Why don't you talk to your parents?","name":"should/shouldn't 的用法","formula":"主语 + should/shouldn't + 动词原形","explanation":"should和shouldn't表示\"应该/不应该\"，用于提建议。\n\nshould的用法：\n1. 表示建议\n   You should study English every day. 你应该每天学英语。\n\n2. 表示义务、责任\n   We should help others. 我们应该帮助他人。\n\n3. 表示推测\n   He should be at home now. 他现在应该在家。\n\nshouldn't的用法：\n1. 表示不建议\n   You shouldn't give up. 你不应该放弃。\n\n2. 表示不应该做的事\n   You shouldn't lie. 你不应该撒谎。"},{"id":"g2_english_u021","chapter":"第四章 Unit4: Why don't you talk to your parents?","name":"have to / don't have to 的用法","formula":"主语 + have/has to + 动词原形\n主语 + don't/doesn't have to + 动词原形","explanation":"have to 表示\"不得不\"，强调客观必要性。\n\n用法：\n1. 肯定句：主语 + have/has to + 动词原形\n   I have to get up early. 我不得不早起。\n   She has to work late today. 她今天不得不工作到很晚。\n\n2. 否定句：主语 + don't/doesn't have to + 动词原形\n   You don't have to worry. 你不必担心。\n\n3. 疑问句：Do/Does + 主语 + have to + 动词原形？\n   Does he have to leave now? 他必须现在离开吗？\n\n注意：have to有人称和数的变化，第三人称单数用has to。"},{"id":"g2_english_u022","chapter":"第四章 Unit4: Why don't you talk to your parents?","name":"until 和 so that 的用法","formula":"主句 + until + 时间点\n主句 + so that + 从句","explanation":"until的用法：\n- until表示\"直到...\"\n- 肯定句：动作持续到until表示的时间点\n  I will wait until you come back. 我会一直等到你回来。\n- 否定句：not...until 表示\"直到...才\"\n  Don't leave until I come back. 直到我回来你才能离开。\n\nso that的用法：\n- so that表示\"为了...\"，引导目的状语从句\n- I study hard so that I can pass the exam.\n  我努力学习是为了能通过考试。\n- Can you speak slowly so that I can understand?\n  你能说得慢一点让我能听懂吗？"},{"id":"g2_english_u023","chapter":"第五章 Unit5: What were you doing when the rainstorm came?","name":"过去进行时的构成","formula":"主语 + was/were + 动词-ing","explanation":"过去进行时表示过去某一时刻或时段正在进行的动作。\n\n构成：主语 + was/were + 动词-ing\n\nbe动词的选择：\n- I / He / She / It → was\n- You / We / They → were\n\n例句：\n- I was reading a book at 8 o'clock last night.\n  昨晚八点我正在读书。\n- They were playing football when the teacher came.\n  老师来的时候他们正在踢足球。\n- She was cooking when I called her.\n  我打电话给她时她正在做饭。"},{"id":"g2_english_u024","chapter":"第五章 Unit5: What were you doing when the rainstorm came?","name":"过去进行时的用法","formula":"过去进行时：was/were + 动词-ing","explanation":"过去进行时的用法：\n\n1. 表示过去某一时刻正在进行的动作\n   What were you doing at 9 pm last night? 昨晚九点你在做什么？\n   I was watching TV. 我在看电视。\n\n2. 表示过去某时段一直在进行的动作\n   She was studying English all morning. 她整个上午都在学英语。\n\n3. 与when/while连用，表示背景\n   I was walking home when it started to rain.\n  我正走回家时开始下雨了。\n\n时间状语：at that time, at this time yesterday, the whole morning等。"},{"id":"g2_english_u025","chapter":"第五章 Unit5: What were you doing when the rainstorm came?","name":"when与while的区别","formula":"when + 从句（点动作）\nwhile + 从句（延续动作）","explanation":"when和while都表示\"当...时候\"，但有区别：\n\nwhen的用法：\n- 可接短暂性动词，也可接延续性动词\n- 可用于主句和从句动作同时发生或先后发生\n  When I arrived, she was leaving. 当我到达时，她正要离开。\n\nwhile的用法：\n- 通常接延续性动词，强调动作进行的过程\n- 只能用于主句和从句动作同时发生\n  While I was reading, the phone rang. 我在读书时电话响了。\n\n注意：\n- while引导的从句用过去进行时，when引导的主句用一般过去时\n- 可以互换：While/When I was walking, I saw him."},{"id":"g2_english_u026","chapter":"第五章 Unit5: What were you doing when the rainstorm came?","name":"过去进行时与一般过去时的区别","formula":"过去进行时：was/were + doing（进行）\n一般过去时：did（完成）","explanation":"过去进行时与一般过去时的区别：\n\n过去进行时：\n- 表示过去某一时刻或时段正在进行的动作\n- 强调动作的进行过程\n- I was reading when he came. 他来时我正在读书。\n\n一般过去时：\n- 表示过去发生的动作或存在的事实\n- 强调动作已经完成\n- I read a book yesterday. 我昨天读了一本书。\n\n常见搭配：\n- when引导的句子用一般过去时（短暂性动作）\n- while引导的句子用过去进行时（延续性动作）"},{"id":"g2_english_u027","chapter":"第五章 Unit5: What were you doing when the rainstorm came?","name":"过去进行时的否定句和疑问句","formula":"否定句：主语 + wasn't/weren't + 动词-ing\n疑问句：Was/Were + 主语 + 动词-ing？","explanation":"过去进行时的否定句和疑问句：\n\n否定句：\n主语 + was not (wasn't) / were not (weren't) + 动词-ing\n- I wasn't watching TV. 我没在看电视。\n- They weren't playing games. 他们没在玩游戏。\n\n疑问句：\nWas/Were + 主语 + 动词-ing？\n- Were you studying at that time? 那时你在学习吗？\n- Was she sleeping when you called? 你打电话时她在睡觉吗？\n\n简略回答：\n- Yes, I was. / No, I wasn't.\n- Yes, they were. / No, they weren't."},{"id":"g2_english_u028","chapter":"第六章 Unit6: An old man tried to move the mountains","name":"宾语从句的概念","formula":"主句 + 连词 + 陈述句/疑问句","explanation":"宾语从句在句中作及物动词或介词的宾语。\n\n基本结构：\n主句 + 连接词 + 陈述句/一般疑问句/特殊疑问句\n\n连接词分类：\n1. that（无意义，可省略）\n2. if/whether（是否）\n3. 疑问词（what, where, when, who, why, how等）\n\n例句：\n- I think (that) he is right. 我认为他是对的。\n- She asked if I could come. 她问我是否能来。\n- I wonder where he lives. 我想知道他住在哪里。"},{"id":"g2_english_u029","chapter":"第六章 Unit6: An old man tried to move the mountains","name":"that引导的宾语从句","formula":"动词 + that + 陈述句","explanation":"that引导宾语从句，无词义，在口语或非正式文体中可省略。\n\n常见接that从句的动词：\n- think 认为\n- believe 相信\n- know 知道\n- say 说\n- hope 希望\n- expect 期待\n- understand 理解\n\n例句：\n- I think (that) he is a good student. 我认为他是个好学生。\n- She said (that) she would come. 她说她会来。\n- We believe (that) we can win. 我们相信我们能赢。\n\n注意：宾语从句的时态可能需要与主句呼应。"},{"id":"g2_english_u030","chapter":"第六章 Unit6: An old man tried to move the mountains","name":"if/whether引导的宾语从句","formula":"动词 + if/whether + 一般疑问句","explanation":"if和whether表示\"是否\"，用于引导一般疑问句的宾语从句。\n\n用法：\n- I don't know if/whether he is coming. 我不知道他是否要来。\n- She asked if/whether I needed help. 她问我是否需要帮助。\n\nif与whether的区别：\n1. 两者可互换，但在正式文体中多用whether\n2. 与动词不定式连用时只用whether\n   I don't know whether to go or stay. 我不知道是走还是留。\n3. 在介词后面只用whether\n   It depends on whether it will rain. 这取决于是否会下雨。\n4. 在句首时只用whether\n   Whether he will come, I'm not sure. 他是否会来我不确定。"},{"id":"g2_english_u031","chapter":"第六章 Unit6: An old man tried to move the mountains","name":"疑问词引导的宾语从句","formula":"动词 + 疑问词 + 陈述句","explanation":"疑问词引导的宾语从句，疑问词作连接词或连接副词。\n\n疑问词分类：\n- who/whom 谁\n- whose 谁的\n- what 什么\n- which 哪一个\n- when 什么时候\n- where 在哪里\n- why 为什么\n- how 如何\n\n例句：\n- Tell me what you want. 告诉我你想要什么。\n- I don't know where she lives. 我不知道她住在哪里。\n- Can you explain why you are late? 你能解释你为什么迟到吗？\n- Do you know when the movie starts? 你知道电影什么时候开始吗？\n\n注意：从句用陈述语序。"},{"id":"g2_english_u032","chapter":"第六章 Unit6: An old man tried to move the mountains","name":"宾语从句的时态呼应","formula":"主句过去时 → 从句相应过去时","explanation":"宾语从句的时态需要与主句呼应：\n\n1. 主句为现在时或将来时，从句可用任何时态\n   I think he is kind. (现在)\n   I will ask when he comes. (将来)\n\n2. 主句为过去时，从句要用相应的过去时态\n   - 一般过去时：I thought he was at home.\n   - 过去进行时：I thought he was sleeping.\n   - 过去将来时：I thought he would come.\n   - 过去完成时：I thought he had finished.\n\n3. 如果从句表示客观真理、普遍事实或习惯性动作，从句时态不变\n   Teacher said the earth is round. 老师说地球是圆的。"},{"id":"g2_english_u033","chapter":"第七章 Unit7: What's the highest mountain in the world?","name":"形容词比较级的规则变化","formula":"1. 直接加 -er\n2. 以e结尾加 -r\n3. 辅音+y结尾变y为i加 -er\n4. 重读闭音节双写尾字母加 -er","explanation":"形容词比较级的规则变化：\n\n1. 一般情况：直接加 -er\n   tall → taller, short → shorter\n   smart → smarter, long → longer\n\n2. 以e结尾：加 -r\n   nice → nicer, large → larger\n   brave → braver, simple → simpler\n\n3. 以辅音字母+y结尾：变y为i加 -er\n   happy → happier, easy → easier\n   busy → busier, heavy → heavier\n\n4. 重读闭音节结尾且末尾只有一个辅音字母：双写尾字母加 -er\n   big → bigger, hot → hotter\n   thin → thinner, wet → wetter"},{"id":"g2_english_u034","chapter":"第七章 Unit7: What's the highest mountain in the world?","name":"形容词比较级的不规则变化","formula":"good/well → better\nbad/badly → worse\nmany/much → more\nlittle → less\nfar → farther/further","explanation":"形容词比较级的不规则变化（必须记忆）：\n\n1. good/well（好）→ better（更好）\n2. bad/badly（坏/差）→ worse（更差）\n3. many/much（多）→ more（更多）\n4. little（少）→ less（更少）\n5. far（远）→ farther/further（更远）\n\n例句：\n- This book is better than that one. 这本书比那本好。\n- Her English is worse than mine. 她的英语比我的差。\n- I have more friends than her. 我的朋友比她多。\n- This is less expensive. 这个更便宜。\n- His house is farther from school. 他家离学校更远。"},{"id":"g2_english_u035","chapter":"第七章 Unit7: What's the highest mountain in the world?","name":"形容词最高级的规则变化","formula":"1. 直接加 -est\n2. 以e结尾加 -st\n3. 辅音+y结尾变y为i加 -est\n4. 重读闭音节双写尾字母加 -est","explanation":"形容词最高级的规则变化：\n\n1. 一般情况：直接加 -est\n   tall → tallest, short → shortest\n\n2. 以e结尾：加 -st\n   nice → nicest, large → largest\n\n3. 以辅音字母+y结尾：变y为i加 -est\n   happy → happiest, easy → easiest\n\n4. 重读闭音节结尾：双写尾字母加 -est\n   big → biggest, hot → hottest\n\n注意：最高级前要加定冠词the，后面要接of/in短语。"},{"id":"g2_english_u036","chapter":"第七章 Unit7: What's the highest mountain in the world?","name":"形容词最高级的不规则变化","formula":"good → best\nbad → worst\nmany/much → most\nlittle → least\nfar → farthest/furthest","explanation":"形容词最高级的不规则变化（必须记忆）：\n\n1. good → best（最好）\n2. bad → worst（最差）\n3. many/much → most（最多）\n4. little → least（最少）\n5. far → farthest/furthest（最远）\n\n例句：\n- This is the best movie I have ever seen. 这是我看过的最好的电影。\n- That was the worst day of my life. 那是我生命中最糟糕的一天。\n- He has the most books in our class. 他在我们班书最多。\n- This is the least interesting story. 这是最无聊的故事。"},{"id":"g2_english_u037","chapter":"第七章 Unit7: What's the highest mountain in the world?","name":"比较级和最高级的用法","formula":"比较级：A + be + 形容词比较级 + than + B\n最高级：A + be + the + 形容词最高级 + in/of + 范围","explanation":"比较级和最高级的用法：\n\n比较级：表示两者之间的比较\n- 结构：A + be + 形容词比较级 + than + B\n- Tom is taller than Jack. 汤姆比杰克高。\n- This book is more interesting than that one. 这本书比那本有趣。\n\n最高级：表示三者或以上程度的比较\n- 结构：A + be + the + 形容词最高级 + in/of + 范围\n- Tom is the tallest in our class. 汤姆是我们班最高的。\n- This is the most beautiful flower in the garden. 这是花园里最美丽的花。\n\n注意：\n- 比较级后接than引导的句子\n- 最高级前加定冠词the，后接in/of短语"},{"id":"g2_english_u038","chapter":"第七章 Unit7: What's the highest mountain in the world?","name":"as...as 同级比较","formula":"A + be + as + 形容词原级 + as + B","explanation":"as...as 表示\"和...一样\"，用于同级比较。\n\n结构：A + be + as + 形容词原级 + as + B\n\n肯定句：\n- Tom is as tall as Jack. 汤姆和杰克一样高。\n- This movie is as interesting as that one. 这部电影和那部一样有趣。\n\n否定句：not as...as = not so...as\n- Tom is not as tall as Jack. 汤姆不如杰克高。\n- This book is not as interesting as that one. 这本书不如那本有趣。\n\n中间可用修饰词：\n- Tom is twice as tall as Jack. 汤姆是杰克的两倍高。"},{"id":"g2_english_u039","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"现在完成时的构成","formula":"主语 + have/has + 过去分词","explanation":"现在完成时表示过去发生或已完成的动作对现在造成的影响。\n\n构成：主语 + have/has + 过去分词\n\nbe动词的选择：\n- I / You / We / They → have\n- He / She / It → has\n\n过去分词的变化：\n1. 规则变化：与过去式相同，加 -ed\n2. 不规则变化：需要特殊记忆\n\n例句：\n- I have finished my homework. 我已经完成了作业。\n- She has gone to Beijing. 她已经去北京了。\n- They have read this book. 他们已经读过这本书了。"},{"id":"g2_english_u040","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"现在完成时的用法","formula":"have/has + 过去分词","explanation":"现在完成时的用法：\n\n1. 表示过去发生或完成的动作对现在造成的影响\n   - I have already had breakfast. 我已经吃过早餐了。（所以现在不饿）\n   - She has cleaned the room. 她已经打扫房间了。（现在房间干净）\n\n2. 表示过去开始的动作一直持续到现在\n   - I have lived here for ten years. 我在这里住了十年。\n   - She has worked here since 2020. 她从2020年开始在这里工作。\n\n时间状语：already, yet, just, ever, never, for, since等。"},{"id":"g2_english_u041","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"already, yet, just 的用法","formula":"already = 已经（肯定句）\nyet = 已经/还（疑问句/否定句）\njust = 刚刚（肯定句）","explanation":"already, yet, just都是现在完成时的常见时间状语：\n\nalready（已经）：\n- 用于肯定句中，通常放在动词前面或句末\n- I have already finished my work. 我已经完成工作了。\n- She has read this book already. 她已经读过这本书了。\n\nyet（已经/还）：\n- 用于疑问句和否定句中，放在句末\n- Have you finished yet? 你已经完成了吗？\n- I haven't met her yet. 我还没见过她。\n\njust（刚刚）：\n- 用于肯定句中，放在动词前面\n- I have just seen him. 我刚刚见过他。\n- She has just left. 她刚刚离开。"},{"id":"g2_english_u042","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"have gone to 与 have been to 的区别","formula":"have gone to = 去了还没回来\nhave been to = 去过已经回来了","explanation":"have gone to 和 have been to 的区别：\n\nhave gone to：\n- 表示\"去了某地\"，说话时人不在这里\n- She has gone to Shanghai. 她去上海了。（现在不在这里）\n- Where is Tom? He has gone to the library. 汤姆在哪？他去图书馆了。\n\nhave been to：\n- 表示\"去过某地\"，人已经回来了\n- I have been to Beijing three times. 我去过北京三次。\n- She has been to Japan before. 她以前去过日本。\n\nhave been in：\n- 表示\"一直在某地\"\n- I have been in this city for ten years. 我在这个城市已经十年了。"},{"id":"g2_english_u043","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"现在完成时与一般过去时的区别","formula":"现在完成时：过去→现在（影响）\n一般过去时：过去（事实）","explanation":"现在完成时与一般过去时的区别：\n\n现在完成时：\n- 强调过去动作与现在的联系\n- 不明确指出具体时间\n- I have read this book. 我读过这本书。（现在知道内容）\n- Have you seen the movie? 你看过这部电影吗？（现在是否知道内容）\n\n一般过去时：\n- 强调过去发生的动作\n- 常与具体时间连用：yesterday, last week, in 2020等\n- I read this book yesterday. 我昨天读了这本书。\n- Did you see the movie last night? 你昨晚看了电影吗？\n\n关键区别：现在完成时不强调具体时间，一般过去时强调。"},{"id":"g2_english_u044","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"常见不规则动词过去分词","formula":"不规则动词需要特殊记忆","explanation":"常见不规则动词过去分词（必须记忆）：\n\n原形 → 过去式 → 过去分词\n\n1. 三形相同：\n- cut → cut → cut\n- put → put → put\n- let → let → let\n\n2. 过去式=过去分词：\n- buy → bought → bought\n- sleep → slept → slept\n- feel → felt → felt\n\n3. 三形都不同：\n- go → went → gone\n- come → came → come\n- eat → ate → eaten\n- see → saw → seen\n- take → took → taken\n- give → gave → given\n- know → knew → known\n- grow → grew → grown\n- fly → flew → flown"},{"id":"g2_english_u045","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"现在完成时的否定句和疑问句","formula":"否定句：主语 + haven't/hasn't + 过去分词\n疑问句：Have/Has + 主语 + 过去分词？","explanation":"现在完成时的否定句和疑问句：\n\n否定句：\n主语 + have/has + not + 过去分词\n- I haven't finished my homework yet. 我还没完成作业。\n- She hasn't called me back. 她还没给我回电话。\n\n疑问句：\nHave/Has + 主语 + 过去分词？\n- Have you ever been to Beijing? 你去过北京吗？\n- Has she read this book? 她读过这本书吗？\n\n简略回答：\n- Yes, I have. / No, I haven't.\n- Yes, she has. / No, she hasn't."},{"id":"g2_english_l001","chapter":"第一章 Unit1: What's the matter?","name":"情态动词 have to 的用法","formula":"主语 + have/has to + 动词原形\n否定：主语 + don't/doesn't + have to + 动词原形\n疑问：Do/Does + 主语 + have to + 动词原形?","explanation":"have to 表示\"不得不\"，强调客观上的必要性，区别于 must 的主观必要性。have to 可以用于过去时态 (had to)，也可以与情态动词连用。其否定形式表示\"没有必要\"。例如：I have to get up early every day. (我每天不得不早起。)"},{"id":"g2_english_l002","chapter":"第一章 Unit1: What's the matter?","name":"情态动词 must 的用法","formula":"肯定：主语 + must + 动词原形\n否定：主语 + mustn't + 动词原形\nmust not = mustn't，表示\"禁止/不允许\"","explanation":"must 表示\"必须\"，强调主观上的必要性。mustn't 意思是\"禁止/不许\"，表示强烈禁止。must 没有时态变化，过去式用 had to 代替。在回答 must 的一般疑问句时，否定回答用 don't have to / don't need to，表示\"不必要\"。例如：You must finish your homework. (你必须完成作业。)"},{"id":"g2_english_l003","chapter":"第一章 Unit1: What's the matter?","name":"have to 与 must 的区别","formula":"must 强调主观意愿：I must study hard. (我必须努力学习。)\nhave to 强调客观需要：I have to work to earn money. (我不得不工作赚钱。)","explanation":"must 和 have to 都可以表示\"必须\"，但有重要区别：1) must 强调主观上的必要性，往往来自说话人本人的判断或规定；have to 强调客观上的必要性，往往由于外部条件、规则或情况而不得不做。2) must 通常不能与 will, would 等助动词连用，而 have to 可以。3) must 没有过去式形式，过去式中必须用 had to。4) 口语中 have to 比 must 更常用。"},{"id":"g2_english_l004","chapter":"第一章 Unit1: What's the matter?","name":"询问身体状况的常用句型","formula":"What's the matter (with you)?\nWhat' wrong (with you)?\nWhat's the problem (with you)?\nHow are you feeling?","explanation":"这些都是用来询问他人身体状况或遇到什么问题的常用表达。What's the matter? 可以单独使用，也可以后接 with + 人或 with + 身体部位。回答时常用以下表达：I have a headache/stomachache/toothache/backache. (我头疼/胃疼/牙疼/背疼。) I feel sick/ fine/better. (我感到恶心/很好/好多了。)"},{"id":"g2_english_l005","chapter":"第一章 Unit1: What's the matter?","name":"情态动词 can/could 表能力","formula":"肯定：主语 + can/could + 动词原形\n否定：主语 + can't/couldn't + 动词原形\n疑问：Can/Could + 主语 + 动词原形?","explanation":"can 和 could 都可以表示能力，意思是\"能/会\"。could 是 can 的过去式，用于过去的能力或更委婉的请求。can 还可表示可能性和允许。could 用在疑问句中比 can 更委婉客气。例如：Can you speak English? (你会说英语吗？) Yes, I can. / No, I can't."},{"id":"g2_english_l006","chapter":"第一章 Unit1: What's the matter?","name":"身体部位词汇及 pain 相关表达","formula":"身体部位 + hurt (s): My head hurts.\nhave a + 疾病名词：have a fever/cold/headache\nbe/get hurt：受伤","explanation":"表达身体不适的常见方式包括：1) 直接用 hurt + 身体部位，如 My stomach hurts. 2) 用 have a + 疾病名，如 have a sore throat (喉咙痛)。3) 用 be sick/ill 表示生病。4) 用 get hurt 表示受伤。常见身体部位词汇：head, stomach, back, neck, ear, eye, tooth, knee, arm, leg 等。"},{"id":"g2_english_l007","chapter":"第一章 Unit1: What's the matter?","name":"情态动词 may 的用法","formula":"肯定：主语 + may + 动词原形\n否定：主语 + may not + 动词原形\n疑问：May + 主语 + 动词原形?","explanation":"may 主要有两个用法：1) 表示可能性，意思是\"可能/也许\"。例如：It may rain today. (今天可能下雨。) 2) 表示允许，意思是\"可以\"。回答 may 引导的疑问句时，肯定回答用 Yes, you may. 或 Sure.，否定回答用 No, you may not. 或 You'd better not."},{"id":"g2_english_l008","chapter":"第二章 Unit2: I'll help to clean up the city parks","name":"不定式作宾语","formula":"动词 + to + 动词原形\n常见动词：want, hope, decide, plan, agree, learn, pretend, refuse, seem, would like","explanation":"不定式可以在句中充当宾语成分。能接不定式作宾语的动词很多，常见的有：want to do (想要做), hope to do (希望做), decide to do (决定做), plan to do (计划做), agree to do (同意做), learn to do (学着做), would like to do (想要做), refuse to do (拒绝做)。例如：I want to learn English. (我想学英语。)"},{"id":"g2_english_l009","chapter":"第二章 Unit2: I'll help to clean up the city parks","name":"不定式作宾语补足语","formula":"动词 + 宾语 + to + 动词原形\n常见动词：want, ask, tell, would like, invite, encourage, teach, expect","explanation":"不定式可以在句中充当宾语补足语，与宾语一起构成复合宾语。常见结构：want sb. to do (想要某人做), ask sb. to do (请某人做), tell sb. to do (告诉某人做), would like sb. to do (想让某人做), invite sb. to do (邀请某人做), encourage sb. to do (鼓励某人做)。例如：She asked me to help her. (她请我帮忙。)"},{"id":"g2_english_l010","chapter":"第二章 Unit2: I'll help to clean up the city parks","name":"动词 help 的用法","formula":"help + (to) + 动词原形\nhelp sb. + (to) + 动词原形\nhelp sb. with + 名词","explanation":"help 是一个多功能的动词，用法灵活：1) help to do something = help do something，两者意思相同，to 可以省略。例如：Can you help (to) carry the box? 2) help sb. with something 表示\"在某方面帮助某人\"。例如：I help my mother with housework. 3) help 还可以作名词，如 with one's help."},{"id":"g2_english_l011","chapter":"第二章 Unit2: I'll help to clean up the city parks","name":"几个用 to do 作宾语的动词","formula":"start to do / begin to do / continue to do\nlike to do / love to do / hate to do\nprefer to do / choose to do","explanation":"start, begin, like, love, hate, prefer, choose 等动词后面可以接不定式 (to do) 作宾语。这些动词既可以接 to do 也可以接 doing，意思基本相同，但要注意：1) 表示长期习惯用 doing，如 I like swimming. 2) 表示具体一次动作时两者皆可。3) should like to do 是固定表达，用于正式场合。"},{"id":"g2_english_l012","chapter":"第二章 Unit2: I'll help to clean up the city parks","name":"动词不定式的否定形式","formula":"not + to + 动词原形\ntell/ask/want sb. not to do sth.","explanation":"不定式的否定形式是在 to 前面加 not，即 not to do。常见结构：tell sb. not to do (告诉某人不要做), ask sb. not to do (请求某人不要做), want sb. not to do (想要某人不做), hope not to do (希望不做)。例如：She told me not to be late. (她告诉我不要迟到。)"},{"id":"g2_english_l013","chapter":"第二章 Unit2: I'll help to clean up the city parks","name":"感官动词后不定式与动名词的区别","formula":"see/hear/watch + sb. + do (看到/听到全过程)\nsee/hear/watch + sb. + doing (看到/听到正在进行的动作)","explanation":"感官动词 see, hear, watch, feel, notice 等后面可以接不定式或动名词作宾语补足语。接不带 to 的不定式时，表示动作的全部过程或经常发生；接动名词时，表示动作正在进行或多次发生。例如：I saw him play football yesterday. (我昨天看到他踢足球了。) I saw him playing football when I passed by. (我路过时看到他正在踢足球。)"},{"id":"g2_english_l014","chapter":"第三章 Unit3: Could you please tell me where the restrooms are?","name":"宾语从句 - 问路","formula":"Could you please tell me + 宾语从句?\nCould you tell me how to get to + 地点?\nCould you tell me where + 主语 + is/are?","explanation":"宾语从句在问路表达中非常常见。使用宾语从句时要注意：1) 从句用陈述语序（主语在前，谓语在后）。2) 如果疑问词本身是主语，则语序不变。例如：Where is the bank? → Could you tell me where the bank is? 3) 常用疑问词：where (哪里), how (怎么走), which way (哪个方向)。"},{"id":"g2_english_l015","chapter":"第三章 Unit3: Could you please tell me where the restrooms are?","name":"Could you please...? 礼貌请求","formula":"Could you please + 动词原形?\nCould I please + 动词原形?\nCould you please not + 动词原形?","explanation":"Could you please...? 是比 Can you...? 更礼貌的请求表达方式。please 可以放在句中或句末，但放在句末时前面要加逗号。例如：Could you please open the door? = Could you open the door, please? 回答时常用：Sure. / Of course. / No problem. / I'm sorry, I can't. 否定形式 Could you please not...? 用于委婉请求不要做某事。"},{"id":"g2_english_l016","chapter":"第三章 Unit3: Could you please tell me where the restrooms are?","name":"宾语从句的陈述语序","formula":"疑问词 + 主语 + 谓语 + 其他?\nWhere is the museum? → I don't know where the museum is.\nWhat did he say? → Can you tell me what he said?","explanation":"宾语从句必须使用陈述语序，即\"主语 + 谓语\"的结构，不能使用疑问句的倒装语序。例如：一般疑问句变为宾语从句时要加 whether/if，并使用陈述语序。特殊疑问句直接用疑问词引导，从句中疑问词如果是主语，语序本身就是陈述语序。转换时注意时态呼应的规则。"},{"id":"g2_english_l017","chapter":"第三章 Unit3: Could you please tell me where the restrooms are?","name":"问路的常用表达","formula":"Excuse me, could you tell me how to get to...?\nExcuse me, where is the nearest...?\nExcuse me, which is the way to...?\nExcuse me, is there a... nearby?","explanation":"问路时的礼貌用语：1) 开头用 Excuse me (打扰一下) 来引起注意。2) 常用表达方式包括：问最近的地方用 nearest；问路线用 which way 或 how to get to；问是否存在用 is there...。3) 回答问路时常用：Go straight / Turn left / Turn right / It's on the left/right 等。4) 还可以用 It's about... minutes' walk from here."},{"id":"g2_english_l018","chapter":"第三章 Unit3: Could you please tell me where the restrooms are?","name":"不定式与疑问词连用","formula":"疑问词 + to + 动词原形\nhow to do it\nwhere to go\nwhat to do\nwhen to start\nwho to ask","explanation":"不定式可以和疑问词 (how, where, what, when, who, which) 连用，在句中作主语、宾语、表语等成分。例如：I don't know what to do. (我不知道该怎么办。) She showed me how to use the computer. (她教我怎么用电脑。) This tells us where to find the information. 这种结构比完整的宾语从句更简洁，是口语中非常实用的表达方式。"},{"id":"g2_english_l019","chapter":"第四章 Unit4: Maybe you should learn to relax","name":"情态动词 should 的用法","formula":"肯定：主语 + should + 动词原形\n否定：主语 + shouldn't + 动词原形\n疑问：Should + 主语 + 动词原形?","explanation":"should 是情态动词，表示\"应该\"，用来提出建议、推荐或表达期望。should 没有时态变化，过去式仍是 should。should 的用法：1) 表示建议：You should study harder. 2) 表示期望：She should be here soon. 3) 表示推测：This should be the right answer. 4) should have done 表示过去应该做但没做。"},{"id":"g2_english_l020","chapter":"第四章 Unit4: Maybe you should learn to relax","name":"should 建议句型总结","formula":"You should do sth.\nYou shouldn't do sth.\nWhy don't you do sth.?\nWhy not do sth.?\nWhat about doing sth.?\nHow about doing sth.?","explanation":"提建议的多种表达方式：1) should/shouldn't 表示应该/不应该做某事。2) Why don't you...? / Why not...? 表示\"为什么不...?\"是一种建议。3) What/How about + doing 表示\"...怎么样?\"，about 后面接动名词。4) Let's do sth. 表示让我们做某事吧。5) You had better (not) do sth. 表示你最好(不要)做某事。"},{"id":"g2_english_l021","chapter":"第四章 Unit4: Maybe you should learn to relax","name":"maybe 与 may be 的区别","formula":"maybe (副词) + 句子：Maybe he is a teacher.\nmay be (情态动词 + 动词) + 表语：He may be a teacher.","explanation":"maybe 是一个副词，意思是\"也许/大概\"，相当于 perhaps，在句中作状语，通常放在句首。may be 是情态动词 may 加动词 be，意思是\"可能是\"，后面接名词、形容词等作表语。例如：Maybe she is ill. = She may be ill. (她也许病了。) 注意：maybe 是一个词，不能分开写；may be 是两个词，需要分开使用。"},{"id":"g2_english_l022","chapter":"第四章 Unit4: Maybe you should learn to relax","name":"had better 的用法","formula":"肯定：主语 + had better + 动词原形\n否定：主语 + had better not + 动词原形\n缩写：had better = 'd better","explanation":"had better 表示\"最好...\"，是一种提出建议或警告的方式，含有忠告的意味。had better 用于所有人称，had 是过去式形式但表示现在或将来的建议。否定形式是 had better not，意思是\"最好不要\"。例如：You had better go home now. (你最好现在回家。) You had better not be late again. (你最好别再迟到了。)"},{"id":"g2_english_l023","chapter":"第五章 Unit5: What were you doing when the UFO landed?","name":"过去进行时的定义与构成","formula":"构成：主语 + was/were + 动词-ing\n肯定：I was watching TV.\n否定：I was not (wasn't) watching TV.\n疑问：Was I watching TV?","explanation":"过去进行时表示在过去某一时刻或某一段时间正在进行的动作。其构成为 was/were + 动词的现在分词 (-ing 形式)。was 用于第一人称单数 (I/he/she/it) 和第三人称单数，were 用于第一人称复数 (we) 和第二人称 (you) 及第三人称复数 (they)。过去进行时常与 at that time, at this time yesterday, when, while 等时间状语连用。"},{"id":"g2_english_l024","chapter":"第五章 Unit5: What were you doing when the UFO landed?","name":"when 引导的时间状语从句","formula":"主句(过去进行时) + when + 从句(一般过去时)\nI was walking when the phone rang.","explanation":"when 引导的时间状语从句可以放在主句前或主句后。当主句用过去进行时，从句用一般过去时时，表示\"当某事发生时，另一事正在发生\"。when 强调两个动作的对比或一个动作在另一个动作进行中发生。例如：I was reading when he came in. (他进来时我正在读书。) She was cooking when the lights went out. (灯灭时她正在做饭。)"},{"id":"g2_english_l025","chapter":"第五章 Unit5: What were you doing when the UFO landed?","name":"while 引导的时间状语从句","formula":"主句 + while + 从句(过去进行时)\nWhile I was doing my homework, my mother was cooking.","explanation":"while 引导的时间状语从句通常表示两个动作同时进行，从句中谓语动词用过去进行时。while 强调两个动作的持续性和同时性。如果两个动作都是持续的，通常用 while 连接。while 还可以表示\"对比/然而\"，表示两种情况的对比。例如：I was reading while he was sleeping. (他在睡觉的时候我在读书。)"},{"id":"g2_english_l026","chapter":"第五章 Unit5: What were you doing when the UFO landed?","name":"过去进行时与一般过去时的区别","formula":"过去进行时：强调动作正在进行（未完成）\n一般过去时：强调动作已经发生（已完成）\nI was reading a book. (我那时在读书。过程)\nI read a book. (我读了一本书。结果)","explanation":"过去进行时和一般过去时的主要区别：1) 过去进行时强调动作正在进行，未完成；一般过去时强调动作已完成。2) 过去进行时通常与 when, while 等连用，描述背景；一般过去时描述突然发生的事件。3) 在 when 引导的句型中：when + 短暂性动词（一般过去时）用于描述突发事件；while + 延续性动词（过去进行时）用于描述持续的动作。4) 过去进行时可以表示过去反复发生的动作。"},{"id":"g2_english_l027","chapter":"第五章 Unit5: What were you doing when the UFO landed?","name":"过去进行时的应用场景","formula":"1. 描述故事发生的背景\n2. 与 when 短暂性动词连用\n3. 与 while 延续性动词连用\n4. 表示过去的某段时间内持续进行的动作","explanation":"过去进行时的主要应用场景：1) 用来设置故事情景或背景，如 It was raining heavily. People were running for shelter. 2) 与 when 连用时，when 后的短暂性动词常造成动作的突然性，如 I was walking when I saw an accident. 3) 与 while 连用时，描述同时进行的持续动作。4) 可以表示情绪、态度或行为的持续性，如 She was thinking about her future all night."},{"id":"g2_english_l028","chapter":"第六章 Unit6: By the time I got outside, the bus had already left","name":"过去完成时的定义与构成","formula":"构成：主语 + had + 过去分词\n肯定：I had finished my homework.\n否定：I had not (hadn't) finished my homework.\n疑问：Had I finished my homework?","explanation":"过去完成时是过去某个时间或动作之前已经发生或完成的动作。它表示\"过去的过去\"。其构成为 had + 过去分词，had 是过去式没有人称和数的变化。过去完成时主要用来：1) 表示在过去某动作之前已完成的动作。2) 表示在过去某时间之前已经发生并完成的事情。3) 与 by + 过去时间状语连用，如 by yesterday, by the end of last week。"},{"id":"g2_english_l029","chapter":"第六章 Unit6: By the time I got outside, the bus had already left","name":"过去完成时与一般过去时的区别","formula":"过去完成时：过去的过去\n一般过去时：过去的某个具体时间\nBy the time he came, I had finished my work.\n(我来之前他已经完成了工作。)","explanation":"过去完成时与一般过去时的主要区别：1) 一般过去时表示在过去某个时间发生的动作或存在的状态。2) 过去完成时表示在过去某个时间或动作之前已经发生的动作，即\"过去的过去\"。3) 在使用过去完成时前，通常会有一个过去的时间点或动作作为参照。例如：When I got home, my father had already cooked dinner. (我到家时，我爸爸已经做好了晚饭。got 是参照点，had cooked 发生在此之前。)"},{"id":"g2_english_l030","chapter":"第六章 Unit6: By the time I got outside, the bus had already left","name":"by the time 的用法","formula":"by the time + 过去时间 (过去完成时)\nby the time + 一般现在时/现在完成时 (将来完成时)\nBy the time I got up, my mother had made breakfast.","explanation":"by the time 意思是\"到...时候为止\"，是过去完成时的重要标志词。1) 当 by the time 引导的句子用一般过去时时，主句用过去完成时。例如：By the time he arrived, we had left. 2) 当谈论将来的情况时，by the time 后用一般现在时，主句用将来完成时。例如：By the time you come back, I will have finished my work. 3) by the time 还可以与 now, tomorrow, next week 等时间词连用。"},{"id":"g2_english_l031","chapter":"第六章 Unit6: By the time I got outside, the bus had already left","name":"过去完成时的常见时间状语","formula":"by the time + 过去时间\nbefore + 过去时间\nalready / just / never / ever\nwhen / after / until + 过去时态","explanation":"过去完成时常见的搭配：1) by the time 引导的时间状语：By the time I was 10, I had learned 500 English words. 2) before/after 引导的从句：I had finished dinner before he came. 3) already, just, never, ever 等副词常与过去完成时连用，表示动作的状态。例如：She had already gone when I arrived. 4) when 引导的从句中，主句用过去完成时，从句用一般过去时。"},{"id":"g2_english_l032","chapter":"第七章 Unit7: Have you ever been to a museum?","name":"现在完成时的定义与构成","formula":"构成：主语 + have/has + 过去分词\n肯定：I have finished my homework.\n否定：I have not (haven't) finished my homework.\n疑问：Have I finished my homework?","explanation":"现在完成时是英语中非常重要的时态，表示：1) 过去发生并且已经完成的动作，对现在造成影响。2) 过去开始的动作持续到现在，可能还要继续下去。其构成为 have/has + 过去分词。has 用于第三人称单数 (he/she/it)，have 用于其他所有人称。现在完成时常与 already, yet, just, ever, never, recently, lately 等副词连用。"},{"id":"g2_english_l033","chapter":"第七章 Unit7: Have you ever been to a museum?","name":"现在完成时与一般过去时的区别","formula":"现在完成时：过去发生，强调与现在的联系\n一般过去时：过去发生，强调动作本身\nI have read this book. (我已经读过了，知道内容)\nI read this book last week. (只说明过去读过)","explanation":"主要区别：1) 一般过去时明确指出动作发生的时间（ yesterday, last week, in 2020 等），现在完成时不强调具体时间。2) 现在完成时强调过去动作对现在的影响或结果，一般过去时只描述过去的动作。3) 在对话中，如果已经给出了具体的时间状语，通常用一般过去时。4) 如果时间状语不明确，但上下文暗示影响，用现在完成时。"},{"id":"g2_english_l034","chapter":"第七章 Unit7: Have you ever been to a museum?","name":"have been to 与 have gone to 的区别","formula":"have been to + 地点：去过某地（已回来）\nhave gone to + 地点：去了某地（未回来）\nI have been to Beijing. (我去过北京。)\nHe has gone to Shanghai. (他去上海了。)","explanation":"两者区别：1) have been to 表示\"去过某地\"，说话时这个人已经不在那个地方了，已经回来。2) have gone to 表示\"去了某地\"，说话时这个人正在去某地的途中或已经在那里，不在说话现场。3) have been to 可以与次数连用：have been to... three times。4) have been in + 地点表示在某地待了多长时间。例如：I have been in Shanghai for two years."},{"id":"g2_english_l035","chapter":"第七章 Unit7: Have you ever been to a museum?","name":"现在完成时中 ever 和 never 的用法","formula":"Have you ever + 过去分词...? (曾经...过吗？)\nI have never + 过去分词 (从未...过)\nThis is the first time I have + 过去分词.","explanation":"ever 和 never 是现在完成时中的重要时间副词：1) ever 意思是\"曾经\"，用于疑问句或否定句中，位于过去分词之前。例如：Have you ever been to Japan? 2) never 意思是\"从未\"，用于肯定句中，但表示否定意义。例如：I have never seen such a beautiful sunset. 3) 这类句型常用于谈论人生经历。4) This/It is the + 最高级 + 名词 + 定语从句中，谓语常用现在完成时。"},{"id":"g2_english_l036","chapter":"第七章 Unit7: Have you ever been to a museum?","name":"现在完成时的肯定、否定和疑问形式","formula":"肯定：主语 + have/has + 过去分词\n否定：主语 + haven't/hasn't + 过去分词\n疑问：Have/Has + 主语 + 过去分词?\n否定疑问：Haven't/Hasn't + 主语 + 过去分词?","explanation":"现在完成时的句型变化：1) 变为一般疑问句时，将 have/has 提到句首，主语大小写不变。2) 变为否定句时，在 have/has 后加 not。3) 变为否定疑问句时，将 Haven't/Hasn't 提到句首。4) 回答时：Yes, 主语 + have/has. / No, 主语 + haven't/hasn't. 5) 常见时间词位置：have/has 之后，过去分词之前，也可以放在句末。"},{"id":"g2_english_l037","chapter":"第七章 Unit7: Have you ever been to a museum?","name":"现在完成时的瞬间动词与延续性动词","formula":"瞬间动词：die, leave, start, buy, arrive, finish\n瞬间动词不能与 for/since 连用，需转换\nShe has died. → She has been dead for 3 years.","explanation":"瞬间动词（终止性动词）如 die, leave, join, buy, borrow, marry 等，不能直接与表示一段时间的状语 (for 3 years, since 1990) 连用。需要转换为相应的延续性动词或状态：1) die → be dead, 2) leave → be away, 3) join → be in/be a member of, 4) buy → have, 5) borrow → keep, 6) finish → be over, 7) arrive → be in。在完成时态中要注意这种转换。"},{"id":"g2_english_l038","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"现在完成时中 yet, already, still 的用法","formula":"yet：还，已经（用于疑问句/否定句，通常放句末）\nalready：已经（用于肯定句，通常放动词与助动词之间）\nstill：仍然（表示动作持续，放于主语与动词之间）","explanation":"三个词在时态中的区别：1) yet 意思是\"还/已经\"，用于疑问句和否定句，通常放在句末。例如：Have you finished your work yet? 2) already 意思是\"已经\"，用于肯定句，通常放在 have/has 和过去分词之间，也可以放在句末表示惊讶。例如：I have already finished my work. 3) still 意思是\"仍然\"，表示动作持续进行，可以用于各种时态。例如：She is still sleeping."},{"id":"g2_english_l039","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"yet 与 already 的位置和用法区别","formula":"yet 用于疑问句和否定句\nHave you finished yet?\nI haven't finished yet.\n\nalready 用于肯定句\nI have already finished.\nI have finished already.","explanation":"yet 和 already 都与现在完成时连用，但用法不同：1) yet 多用于疑问句和否定句，already 多用于肯定句。2) yet 通常放在句末，already 可以放在句中（have/has 之后，过去分词之前）或句末。3) already 在疑问句中可以用作惊讶语气：Have you finished already? (你竟然已经完成了？) 4) 在否定句中，yet 表示\"还\"，暗示某事尚未发生：I haven't finished my homework yet."},{"id":"g2_english_l040","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"现在完成时的时间状语搭配","formula":"already, yet, just, recently, lately\njust now (刚不久，用于一般过去时)\nso far = up to now = till now\nthis week/month/year...","explanation":"现在完成时常用的时间状语：1) already 常用于肯定句，yet 用于否定和疑问句。2) just 放在 have/has 与过去分词之间，表示\"刚刚\"。3) recently 和 lately 表示\"最近\"，可以与现在完成时连用。4) so far = up to now = till now 表示\"到目前为止\"。5) this week/month/year 等时间词，如果说话时还没过完，可以用现在完成时。注意：last week/year 不能与现在完成时连用。"},{"id":"g2_english_l041","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"现在完成时在日常交流中的应用","formula":"Have you ever...? → Yes, I have. / No, I haven't.\nHave you ... yet? → Yes, I have already. / No, not yet.\nHow long have you ...? → For... / Since...","explanation":"现在完成时在口语交流中的常见应用：1) 询问经历：Have you ever been to...? 2) 询问进展：Have you finished... yet? 3) 询问持续时间：How long have you lived here? 回答时用 for + 时间段或 since + 起点时间。4) 在谈论近期经历或变化时常用现在完成时。5) 注意区分：already 用于肯定句，yet 用于否定和疑问句末尾。例如：I've already had breakfast. / I haven't had breakfast yet."},{"id":"g2_english_l042","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"现在完成时与一般过去时的综合辨析","formula":"现在完成时 = 过去动作 + 现在影响/结果\n一般过去时 = 过去时间点\nHave you read this book? (你读过这本书吗？)\nDid you read this book yesterday? (你昨天读了这本书吗？)","explanation":"综合辨析：1) 现在完成时不能和明确的过去时间状语连用，如 yesterday, last week, in 2020 等。2) 一般过去时不能和现在完成时的时间状语连用，如 already, yet, recently, so far 等。3) 在综合填空和改错题中，要注意时间状语与时态的匹配。4) 常见的信号词：yet, already, ever, never, just, recently, so far 等通常与现在完成时连用；ago, last, in 2020 等通常与一般过去时连用。5) since 和 for 与现在完成时连用，但 since 后可接时间点，for 后接时间段。"},{"id":"g2_geography_u001","chapter":"第一章 从世界看中国","name":"中国的纬度位置","formula":"北纬4°-53°","explanation":"中国领土南北跨纬度约50度，大部分位于北温带，小部分位于热带，没有寒带。这一纬度位置使得中国具备了多种气候类型，为农业发展提供了多样化的自然条件。"},{"id":"g2_geography_002","chapter":"第一章 从世界看中国","name":"中国的海陆位置","formula":"亚洲东部、太平洋西岸","explanation":"中国位于亚洲东部，太平洋西岸，是一个海陆兼备的国家。这种位置使得中国既可以发展陆上外交，又便于海上交往，对外开放程度高。"},{"id":"g2_geography_u003","chapter":"第一章 从世界看中国","name":"中国领土面积","formula":"约960万平方千米","explanation":"中国领土面积约960万平方千米，仅次于俄罗斯和加拿大，居世界第三位。广阔的领土为中国提供了丰富的自然资源和多样的自然环境。"},{"id":"g2_geography_004","chapter":"第一章 从世界看中国","name":"中国疆界","formula":"陆界2.2万千米，海岸线1.8万千米","explanation":"中国陆上疆界长达2.2万多千米，与14个国家接壤；大陆海岸线长达1.8万多千米，与6个国家隔海相望。漫长的疆界和海岸线为中国的国防和对外交流提供了重要条件。"},{"id":"g2_geography_005","chapter":"第一章 从世界看中国","name":"中国领海与岛屿","formula":"内海和边海470万平方千米，岛屿6500多个","explanation":"中国的内海和边海面积约470万平方千米，主要包括渤海、黄海、东海、南海。沿海分布着6500多个岛屿，其中最大的是台湾岛，其次是海南岛。"},{"id":"g2_geography_u006","chapter":"第一章 从世界看中国","name":"中国行政区划","formula":"23个省、5个自治区、4个直辖市、2个特别行政区","explanation":"中国共有34个省级行政区，包括23个省、5个自治区（内蒙古、广西、西藏、宁夏、新疆）、4个直辖市（北京、天津、上海、重庆）和2个特别行政区（香港、澳门）。"},{"id":"g2_geography_007","chapter":"第一章 从世界看中国","name":"中国人口数量","formula":"约14.4亿（2023年）","explanation":"中国是世界上人口最多的国家，约有14.4亿人。人口众多为中国提供了丰富的劳动力资源和消费市场，但同时也给资源、环境、就业等带来压力。"},{"id":"g2_geography_008","chapter":"第一章 从世界看中国","name":"中国人口分布特点","formula":"东多西少，东南沿海人口密集","explanation":"中国人口分布不均，总体特点是东多西少。东部沿海地区人口密集，特别是东南沿海地区；西部内陆地区人口稀少。人口分布与自然条件、经济发展水平密切相关。"},{"id":"g2_geography_u009","chapter":"第一章 从世界看中国","name":"中国民族构成","formula":"56个民族，汉族占91.1%","explanation":"中国是一个统一的多民族国家，共有56个民族。其中汉族人口最多，约占全国人口的91.1%；其他55个民族统称为少数民族，约占8.9%。"},{"id":"g2_geography_010","chapter":"第一章 从世界看中国","name":"中国民族分布特点","formula":"大散居、小聚居、交错杂居","explanation":"中国各民族的分布特点是：大散居、小聚居、交错杂居。少数民族主要分布在西南、西北、东北等边疆地区。汉族主要分布在东部和中部地区。"},{"id":"g2_geography_011","chapter":"第一章 从世界看中国","name":"中国民族政策","formula":"民族平等、民族团结、各民族共同繁荣","explanation":"中国实行民族平等、民族团结、各民族共同繁荣的基本政策。在少数民族聚居地区实行民族区域自治制度，保障少数民族的合法权益。"},{"id":"g2_geography_012","chapter":"第二章 中国的自然环境","name":"中国地形特点","formula":"地形复杂多样，山区面积广","explanation":"中国地形复杂多样，主要包括山地、高原、平原、盆地、丘陵五种类型。山地、高原、丘陵占全国陆地面积的67%，山区面积广大是中国地形的重要特点。"},{"id":"g2_geography_013","chapter":"第二章 中国的自然环境","name":"中国地势特点","formula":"西高东低，呈三级阶梯分布","explanation":"中国地势特点是西高东低，自西向东分为三级阶梯：第一级阶梯是青藏高原，平均海拔4000米以上；第二级阶梯以高原、盆地为主；第三级阶梯主要是平原和丘陵。"},{"id":"g2_geography_014","chapter":"第二章 中国的自然环境","name":"四大高原","formula":"青藏高原、内蒙古高原、黄土高原、云贵高原","explanation":"中国有四大高原：青藏高原是世界最高的高原，有'世界屋脊'之称；内蒙古高原是坦荡的高原；黄土高原是世界上黄土覆盖最深厚的地区；云贵高原地面崎岖，石灰岩分布广泛。"},{"id":"g2_geography_u015","chapter":"第二章 中国的自然环境","name":"四大盆地","formula":"塔里木盆地、准噶尔盆地、柴达木盆地、四川盆地","explanation":"中国有四大盆地：塔里木盆地是中国最大的内陆盆地，沙漠广布；准噶尔盆地纬度较高，多风蚀地貌；柴达木盆地是海拔最高的内陆高原盆地；四川盆地有'紫色盆地'之称，农业发达。"},{"id":"g2_geography_u016","chapter":"第二章 中国的自然环境","name":"三大平原","formula":"东北平原、华北平原、长江中下游平原","explanation":"中国有三大平原：东北平原是中国最大的平原，以黑土著称；华北平原是由黄河、淮河、海河冲积而成；长江中下游平原有'鱼米之乡'的美誉。"},{"id":"g2_geography_017","chapter":"第二章 中国的自然环境","name":"中国气候特点","formula":"气候复杂多样，季风气候显著","explanation":"中国气候复杂多样，主要包括热带季风气候、亚热带季风气候、温带季风气候、温带大陆性气候和高山高原气候。东部地区季风气候显著，具有雨热同期的特点。"},{"id":"g2_geography_018","chapter":"第二章 中国的自然环境","name":"温度带划分","formula":"热带、亚热带、暖温带、中温带、寒温带","explanation":"中国根据积温情况划分为五个温度带：热带（北纬23.5°以南）、亚热带（秦岭-淮河以南）、暖温带（华北地区）、中温带（东北和内蒙古大部）、寒温带（黑龙江北部）。"},{"id":"g2_geography_u019","chapter":"第二章 中国的自然环境","name":"干湿地区划分","formula":"湿润区、半湿润区、半干旱区、干旱区","explanation":"中国根据降水量和蒸发量的关系划分为四个干湿地区：湿润区（年降水量>800mm）、半湿润区（年降水量400-800mm）、半干旱区（年降水量200-400mm）、干旱区（年降水量<200mm）。"},{"id":"g2_geography_020","chapter":"第二章 中国的自然环境","name":"中国主要河流","formula":"长江、黄河、珠江、淮河、松花江","explanation":"中国主要的河流包括：长江是中国第一大河，全长6300多千米；黄河是中国第二长河，全长5464千米；珠江是华南地区最大的河流；淮河是重要的地理分界线；松花江是东北地区最大的河流。"},{"id":"g2_geography_u021","chapter":"第二章 中国的自然环境","name":"中国主要湖泊","formula":"淡水湖：鄱阳湖、洞庭湖、太湖；咸水湖：青海湖、纳木错","explanation":"中国湖泊众多，主要淡水湖有鄱阳湖（中国最大淡水湖）、洞庭湖、太湖等；主要咸水湖有青海湖（中国最大咸水湖）、纳木错等。湖泊是重要的水资源，对生态环境有重要影响。"},{"id":"g2_geography_022","chapter":"第二章 中国的自然环境","name":"长江概况","formula":"全长6300余千米，流域面积180万平方千米","explanation":"长江发源于唐古拉山脉各拉丹冬峰，全长6300余千米，是世界第三长河。流域面积180多万平方千米，流经青、藏、川、滇、渝、鄂、湘、赣、皖、苏、沪11个省市区。"},{"id":"g2_geography_023","chapter":"第二章 中国的自然环境","name":"长江的开发","formula":"水能宝库、黄金水道","explanation":"长江水能资源丰富，被誉为'水能宝库'，水能蕴藏量占全国的1/3。长江航运价值高，宜昌以下可四季通航，被誉为'黄金水道'，货运量占全国内河航运的70%以上。"},{"id":"g2_geography_024","chapter":"第二章 中国的自然环境","name":"长江的治理","formula":"加固堤防、修建水库、治理荆江","explanation":"长江治理的主要措施包括：加固堤防，修建分洪、蓄洪工程；修建水库，如三峡工程；重点治理荆江段，裁弯取直，疏浚河道；同时加强上游地区的水土保持工作。"},{"id":"g2_geography_025","chapter":"第二章 中国的自然环境","name":"黄河概况","formula":"全长5464千米，流域面积75万平方千米","explanation":"黄河发源于青藏高原巴颜喀拉山北麓，全长5464千米，是中国第二长河。流域面积约75万平方千米，流经青、川、甘、宁、内蒙古、晋、陕、豫、鲁9个省区。"},{"id":"g2_geography_026","chapter":"第二章 中国的自然环境","name":"黄河的贡献","formula":"塑造平原、灌溉平原、丰富水能","explanation":"黄河为中华民族的发展做出了重要贡献：黄河下游冲积形成华北平原；黄河水是北方地区重要的灌溉水源；黄河上游水能资源丰富，建有多座水电站，如龙羊峡、刘家峡等。"},{"id":"g2_geography_u027","chapter":"第二章 中国的自然环境","name":"黄河的忧患","formula":"地上河、断流、凌汛","explanation":"黄河存在的问题包括：下游形成'地上河'，易决堤改道；中游流经黄土高原，含沙量大；部分河段冬季结冰形成凌汛；近年来出现断流现象，影响下游地区用水。"},{"id":"g2_geography_028","chapter":"第二章 中国的自然环境","name":"黄河的治理","formula":"治沙、治水、保持水土","explanation":"黄河治理的关键是治沙和保持水土。主要措施包括：在中游地区退耕还林还草、修建水平梯田；在黄土高原地区开展小流域综合治理；下游加固黄河堤防，疏浚河道，修建分洪工程。"},{"id":"g2_geography_029","chapter":"第三章 中国的自然资源","name":"自然资源概念","formula":"在一定的技术条件下，自然界中对人类有用的物质和能量","explanation":"自然资源是指在一定的技术条件下，自然界中对人类有用的物质和能量。按能否再生分类，可分为可再生资源（如土地、水、森林、草原）和非可再生资源（如矿产资源）。"},{"id":"g2_geography_u030","chapter":"第三章 中国的自然资源","name":"中国自然资源特点","formula":"总量丰富，人均不足","explanation":"中国自然资源总量丰富，许多种自然资源位居世界前列。但由于人口众多，人均资源占有量远低于世界平均水平，人均耕地、淡水、森林面积等均不到世界平均的1/3。"},{"id":"g2_geography_u031","chapter":"第三章 中国的自然资源","name":"土地资源类型","formula":"耕地、林地、草地、建筑用地","explanation":"中国土地资源按利用方式可分为：耕地（种植农作物）、林地（生长林木）、草地（生长草本植物）、建筑用地（城镇村庄、道路等）以及难以利用的土地（如沙漠、戈壁、冰川等）。"},{"id":"g2_geography_032","chapter":"第三章 中国的自然资源","name":"土地资源分布","formula":"耕地：东部季风区；草地：西部内陆；林地：东北、西南","explanation":"中国土地资源分布不均：耕地主要分布在东部季风区的平原和低缓丘陵地区；林地主要分布在东北、西南的天然林区；草地主要分布在西部内陆的高原、山地等干旱半干旱地区。"},{"id":"g2_geography_033","chapter":"第三章 中国的自然资源","name":"水资源概念与分布","formula":"多年平均水资源总量2.8万亿立方米，南多北少","explanation":"水资源包括河流水、湖泊水、浅层地下水等。中国多年平均水资源总量约2.8万亿立方米，居世界第六位。但水资源地区分布不均，呈现南多北少的特点，南方水资源占全国的80%以上。"},{"id":"g2_geography_034","chapter":"第三章 中国的自然资源","name":"水资源时间分布","formula":"夏秋多、冬春少，年际变化大","explanation":"中国水资源时间分布不均。受季风气候影响，水资源夏秋多、冬春少，且年际变化大。这种时间分布特点容易造成洪涝和干旱灾害，需要修建水库等水利工程进行调节。"},{"id":"g2_geography_035","chapter":"第三章 中国的自然资源","name":"解决水资源不足的措施","formula":"跨流域调水、修建水库、节约用水","explanation":"解决中国水资源不足的主要措施包括：建设跨流域调水工程（如南水北调）；修建水库调节水资源时间分配；节约用水，发展节水农业和工业；提高水资源利用效率；保护水资源，防治水污染。"},{"id":"g2_geography_u036","chapter":"第四章 中国的经济发展","name":"交通运输的重要性","formula":"经济发展的'先行官'","explanation":"交通运输是经济发展的'先行官'，对经济发展起着重要的支撑作用。便利的交通可以促进资源开发、商品流通、地区交流，推动经济发展，提高人民生活水平。"},{"id":"g2_geography_037","chapter":"第四章 中国的经济发展","name":"主要铁路干线","formula":"五纵：京哈、京沪、京九、京广、焦柳；三横：京包-包兰、陇海-兰新、沪杭-浙赣-湘黔-贵昆","explanation":"中国铁路网稠密，主要铁路干线包括南北向的'五纵'（京哈、京沪、京九、京广、焦柳）和东西向的'三横'（京包-包兰、陇海-兰新、沪杭-浙赣-湘黔-贵昆）。"},{"id":"g2_geography_u038","chapter":"第四章 中国的经济发展","name":"南北向铁路干线","formula":"京沪线、京九线、京广线、焦柳线、宝成-成昆线","explanation":"中国主要的南北向铁路干线包括：京沪线（北京-上海）、京九线（北京-九龙）、京广线（北京-广州）、焦柳线（焦作-柳州）、宝成-成昆线（宝鸡-成都-昆明）等。"},{"id":"g2_geography_039","chapter":"第四章 中国的经济发展","name":"东西向铁路干线","formula":"京包-包兰线、陇海-兰新线、沪杭-浙赣-湘黔-贵昆线","explanation":"中国主要的东西向铁路干线包括：京包-包兰线（北京-包头-兰州）、陇海-兰新线（连云港-兰州-乌鲁木齐）、沪杭-浙赣-湘黔-贵昆线（上海-杭州-南昌-贵阳-昆明）等。"},{"id":"g2_geography_040","chapter":"第四章 中国的经济发展","name":"交通运输方式选择","formula":"公路：短途；铁路：长途大宗货物；水运：大批笨重货物；航空：急需、贵重物品","explanation":"不同交通运输方式有各自特点：公路适宜短途运输和灵活性要求高的货物；铁路适宜长途和大宗货物运输；水运适宜大批笨重货物运输，成本低；航空适宜急需、贵重物品的运输。"},{"id":"g2_geography_041","chapter":"第四章 中国的经济发展","name":"中国农业分布","formula":"种植业：东部季风区；畜牧业：西部内陆；林业：东北、西南","explanation":"中国农业分布受自然条件影响明显：种植业主要分布在东部季风区的平原和低缓丘陵；畜牧业主要分布在西部内陆的干旱半干旱高原山地；林业主要分布在东北、西南的天然林区。"},{"id":"g2_geography_042","chapter":"第四章 中国的经济发展","name":"主要农作物分布","formula":"水稻：南方；小麦：北方；棉花：长江中下游、黄河流域；油菜：长江流域","explanation":"中国主要农作物的地区分布：水稻主要分布在秦岭-淮河以南地区；小麦主要分布在秦岭-淮河以北地区；棉花主要分布在长江中下游平原和黄河中下游地区；油菜主要分布在长江流域。"},{"id":"g2_geography_u043","chapter":"第四章 中国的经济发展","name":"农业发展成就与问题","formula":"成就：粮食、肉类产量居世界前列；问题：人均耕地少，水资源短缺","explanation":"中国农业发展取得了巨大成就，粮食、肉类产量居世界前列。但也存在一些问题：人均耕地少，仅为世界平均的1/3；水资源短缺，北方地区农业用水紧张；农业基础相对薄弱。"},{"id":"g2_geography_044","ch
