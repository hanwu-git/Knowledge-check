    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"chapter":"上册 第一章 有理数","name":"正数与负数","formula":"正数 > 0，负数 < 0","explanation":"【定义】\n大于0的数叫做正数，在正数前面加上负号\"-\"的数叫做负数。\n\n【注意】\n1. 0既不是正数，也不是负数\n2. 正数和负数表示相反意义的量\n3. \"-\"号读作\"负\"\n\n【应用场景】\n- 温度：零上为正，零下为负\n- 海拔：高于海平面为正，低于为负\n- 收支：收入为正，支出为负","id":"g1_math_u001","semester":"upper"},{"chapter":"上册 第一章 有理数","name":"有理数的概念","formula":"整数和分数统称为有理数","explanation":"【定义】\n整数和分数统称为有理数。\n\n【分类】\n1. 按定义分：\n   - 整数：正整数、0、负整数\n   - 分数：正分数、负分数\n\n2. 按性质分：\n   - 正有理数：正整数、正分数\n   - 0\n   - 负有理数：负整数、负分数\n\n【注意】\n有限小数和无限循环小数都可以化成分数，所以它们都是有理数。","id":"g1_math_u002","semester":"upper"},{"chapter":"上册 第一章 有理数","name":"数轴","formula":"数轴三要素：原点、正方向、单位长度","explanation":"【定义】\n规定了原点、正方向和单位长度的直线叫做数轴。\n\n【三要素】\n1. 原点：表示数0的点\n2. 正方向：通常向右为正方向\n3. 单位长度：根据需要选取\n\n【性质】\n1. 任何一个有理数都可以用数轴上的一个点来表示\n2. 数轴上右边的数总比左边的数大\n3. 正数在原点右边，负数在原点左边","id":"g1_math_u003","semester":"upper"},{"chapter":"上册 第一章 有理数","name":"相反数","formula":"a的相反数是 -a","explanation":"【定义】\n只有符号不同的两个数叫做互为相反数。\n\n【性质】\n1. 0的相反数是0\n2. 数a的相反数是 -a\n3. 互为相反数的两个数的和为0：a + (-a) = 0\n4. 互为相反数的两个数在数轴上关于原点对称\n\n【求法】\n在一个数的前面添上\"-\"号，就得到这个数的相反数。","id":"g1_math_u004","semester":"upper"},{"chapter":"上册 第一章 有理数","name":"绝对值","formula":"|a| = a (a≥0)，|a| = -a (a<0)","explanation":"【定义】\n数轴上表示数a的点与原点的距离叫做数a的绝对值，记作|a|。\n\n【性质】\n1. 一个正数的绝对值是它本身\n2. 一个负数的绝对值是它的相反数\n3. 0的绝对值是0\n4. 任何数的绝对值都是非负数：|a| ≥ 0\n\n【应用】\n- 比较两个负数的大小：绝对值大的反而小\n- 距离问题","id":"g1_math_u005","semester":"upper"},{"chapter":"上册 第一章 有理数","name":"有理数比较大小","formula":"正数 > 0 > 负数","explanation":"【比较法则】\n1. 正数都大于0，负数都小于0\n2. 正数大于一切负数\n3. 两个正数比较，绝对值大的数大\n4. 两个负数比较，绝对值大的反而小\n\n【数轴比较法】\n在数轴上表示的两个数，右边的数总比左边的数大。\n\n【作差比较法】\n若 a - b > 0，则 a > b\n若 a - b = 0，则 a = b\n若 a - b < 0，则 a < b","id":"g1_math_u006","semester":"upper"},{"chapter":"上册 第二章 有理数的运算","name":"有理数的加法","formula":"同号相加，符号不变，绝对值相加","explanation":"【加法法则】\n1. 同号两数相加，取相同的符号，并把绝对值相加\n2. 绝对值不相等的异号两数相加，取绝对值较大的加数的符号，并用较大的绝对值减去较小的绝对值\n3. 互为相反数的两个数相加得0\n4. 一个数同0相加，仍得这个数\n\n【运算律】\n1. 加法交换律：a + b = b + a\n2. 加法结合律：(a + b) + c = a + (b + c)","id":"g1_math_u007","semester":"upper"},{"chapter":"上册 第二章 有理数的运算","name":"有理数的减法","formula":"a - b = a + (-b)","explanation":"【减法法则】\n减去一个数，等于加上这个数的相反数。\n即：a - b = a + (-b)\n\n【注意】\n1. 减法可以转化为加法进行运算\n2. 转化时要注意\"两变\"：减号变加号，减数变相反数\n\n【运算步骤】\n1. 将减法转化为加法\n2. 按加法法则进行计算\n\n【举例】\n5 - (-3) = 5 + 3 = 8","id":"g1_math_u008","semester":"upper"},{"chapter":"上册 第二章 有理数的运算","name":"有理数的乘法","formula":"同号得正，异号得负，绝对值相乘","explanation":"【乘法法则】\n1. 两数相乘，同号得正，异号得负，并把绝对值相乘\n2. 任何数同0相乘，都得0\n\n【多个数相乘】\n1. 几个不是0的数相乘，负因数的个数是偶数时，积是正数；负因数的个数是奇数时，积是负数\n2. 几个数相乘，有一个因数为0，积就为0\n\n【运算律】\n1. 乘法交换律：ab = ba\n2. 乘法结合律：(ab)c = a(bc)\n3. 分配律：a(b + c) = ab + ac","id":"g1_math_u009","semester":"upper"},{"chapter":"上册 第二章 有理数的运算","name":"有理数的除法","formula":"a ÷ b = a × 1/b (b≠0)","explanation":"【除法法则】\n除以一个不等于0的数，等于乘这个数的倒数。\n即：a ÷ b = a × (1/b)  (b ≠ 0)\n\n【符号法则】\n两数相除，同号得正，异号得负，并把绝对值相除。\n0除以任何一个不等于0的数，都得0。\n\n【倒数】\n乘积是1的两个数互为倒数。\n注意：0没有倒数。","id":"g1_math_u010","semester":"upper"},{"chapter":"上册 第二章 有理数的运算","name":"有理数的乘方","formula":"aⁿ = a × a × ... × a (n个a)","explanation":"【定义】\n求n个相同因数的积的运算，叫做乘方。乘方的结果叫做幂。\n\n【相关概念】\n在 aⁿ 中，a叫做底数，n叫做指数。\n\n【性质】\n1. 正数的任何次幂都是正数\n2. 负数的奇次幂是负数，负数的偶次幂是正数\n3. 0的任何正整数次幂都是0\n4. 任何数的0次幂都是1（0除外）\n\n【注意】\n(-a)² 与 -a² 不同：(-3)² = 9，-3² = -9","id":"g1_math_u011","semester":"upper"},{"chapter":"上册 第二章 有理数的运算","name":"有理数的混合运算","formula":"先乘方，再乘除，最后加减","explanation":"【运算顺序】\n1. 先乘方，再乘除，最后加减\n2. 同级运算，从左到右进行\n3. 如有括号，先做括号内的运算，按小括号、中括号、大括号依次进行\n\n【运算技巧】\n1. 巧用运算律（交换律、结合律、分配律）\n2. 注意符号的处理\n3. 能约分的先约分\n4. 适时使用简便算法","id":"g1_math_u012","semester":"upper"},{"chapter":"上册 第二章 有理数的运算","name":"科学记数法","formula":"a × 10ⁿ (1 ≤ a < 10)","explanation":"【定义】\n把一个大于10的数表示成 a × 10ⁿ 的形式（其中a大于或等于1且小于10，n是正整数），这种记数方法叫做科学记数法。\n\n【n的确定】\n对于整数位数为m的数，n = m - 1\n\n【举例】\n- 567000000 = 5.67 × 10⁸\n- -123000 = -1.23 × 10⁵\n\n【还原】\n将科学记数法表示的数还原，就是把小数点向右移动n位。","id":"g1_math_u013","semester":"upper"},{"chapter":"上册 第二章 有理数的运算","name":"近似数","formula":"四舍五入法","explanation":"【近似数】\n与实际接近的数叫做近似数。\n\n【精确度】\n近似数与准确数的接近程度，可以用精确度表示。\n\n【四舍五入法】\n对要保留的数位后一位进行判断：\n- 小于5则舍去\n- 大于或等于5则进1\n\n【常见精确度】\n1. 精确到个位、十位、百位...\n2. 精确到0.1、0.01、0.001...\n3. 保留一位小数、两位小数...\n\n【有效数字】\n从左边第一个不是0的数字起，到末位数字止，所有数字都是这个数的有效数字。","id":"g1_math_u014","semester":"upper"},{"chapter":"上册 第三章 整式的加减","name":"单项式","formula":"单项式：数字与字母的积","explanation":"【定义】\n由数字或字母的积组成的代数式叫做单项式。单独的一个数或一个字母也叫做单项式。\n\n【相关概念】\n1. 系数：单项式中的数字因数\n2. 次数：单项式中所有字母的指数的和\n\n【举例】\n- 3x²：系数是3，次数是2\n- -5ab：系数是-5，次数是2\n- πr²：系数是π，次数是2\n\n【注意】\n1. 单独一个非零数的次数是0\n2. π是常数，不是字母","id":"g1_math_u015","semester":"upper"},{"chapter":"上册 第三章 整式的加减","name":"多项式","formula":"多项式：几个单项式的和","explanation":"【定义】\n几个单项式的和叫做多项式。其中每个单项式叫做多项式的项，不含字母的项叫做常数项。\n\n【相关概念】\n1. 项：多项式中的每个单项式\n2. 常数项：不含字母的项\n3. 次数：多项式里次数最高的项的次数\n\n【举例】\n多项式 3x² - 2x + 5\n- 项：3x², -2x, 5\n- 常数项：5\n- 次数：2（二次三项式）\n\n【注意】\n多项式的次数不是所有项的次数之和，而是最高次项的次数。","id":"g1_math_u016","semester":"upper"},{"chapter":"上册 第三章 整式的加减","name":"整式","formula":"单项式和多项式统称为整式","explanation":"【定义】\n单项式和多项式统称为整式。\n\n【分类】\n整式\n├── 单项式\n│   ├── 数字单项式（如 5, -3）\n│   └── 字母单项式（如 a, 2xy）\n└── 多项式\n    ├── 二项式（两个单项式的和）\n    ├── 三项式（三个单项式的和）\n    └── ...\n\n【判断要点】\n1. 分母中不能含有字母\n2. 单项式是积的形式，多项式是和的形式\n3. 整式中可以有加、减、乘、乘方运算，但不能有除法（除数含字母）","id":"g1_math_u017","semester":"upper"},{"chapter":"上册 第三章 整式的加减","name":"合并同类项","formula":"同类项：字母相同，相同字母的指数也相同","explanation":"【同类项定义】\n所含字母相同，并且相同字母的指数也相同的项叫做同类项。几个常数项也是同类项。\n\n【合并同类项法则】\n把同类项的系数相加，字母和字母的指数不变。\n\n【步骤】\n1. 找出同类项\n2. 利用加法交换律、结合律把同类项放在一起\n3. 合并同类项\n\n【举例】\n3x² + 2x + 5x² - x = (3+5)x² + (2-1)x = 8x² + x","id":"g1_math_u018","semester":"upper"},{"chapter":"上册 第三章 整式的加减","name":"去括号","formula":"括号前是\"+\"，去括号不变号；是\"-\"，全变号","explanation":"【去括号法则】\n1. 如果括号外的因数是正数，去括号后原括号内各项的符号与原来的符号相同\n2. 如果括号外的因数是负数，去括号后原括号内各项的符号与原来的符号相反\n\n【记忆口诀】\n\"+\"号，不变号；\"-\"号，全变号。\n\n【举例】\n+ (a + b - c) = a + b - c\n- (a + b - c) = -a - b + c\n2(3x - 1) = 6x - 2\n-3(2x + 1) = -6x - 3","id":"g1_math_u019","semester":"upper"},{"chapter":"上册 第三章 整式的加减","name":"整式的加减","formula":"先去括号，再合并同类项","explanation":"【运算法则】\n几个整式相加减，通常用括号把每一个整式括起来，再用加减号连接，然后去括号，合并同类项。\n\n【一般步骤】\n1. 列出代数式\n2. 去括号\n3. 合并同类项\n4. 化简结果\n\n【举例】\n求 2x² - 3x + 1 与 -x² + 2x - 3 的和\n= (2x² - 3x + 1) + (-x² + 2x - 3)\n= 2x² - 3x + 1 - x² + 2x - 3\n= x² - x - 2","id":"g1_math_u020","semester":"upper"},{"chapter":"上册 第四章 一元一次方程","name":"方程的概念","formula":"含有未知数的等式叫做方程","explanation":"【定义】\n含有未知数的等式叫做方程。\n\n【方程的两个要素】\n1. 必须是等式（含有等号\"=\"）\n2. 必须含有未知数（通常用x, y, z等字母表示）\n\n【方程的解】\n使方程左右两边相等的未知数的值，叫做方程的解。\n\n【解方程】\n求方程的解的过程叫做解方程。\n\n【一元一次方程】\n只含有一个未知数（元），未知数的次数都是1，等号两边都是整式，这样的方程叫做一元一次方程。","id":"g1_math_u021","semester":"upper"},{"chapter":"上册 第四章 一元一次方程","name":"一元一次方程","formula":"ax + b = 0 (a≠0)","explanation":"【定义】\n只含有一个未知数（元），未知数的次数都是1，等号两边都是整式，这样的方程叫做一元一次方程。\n\n【一般形式】\nax + b = 0  (a ≠ 0)\n\n【判断要点】\n1. 只含有一个未知数\n2. 未知数的次数都是1\n3. 是整式方程（分母不含未知数）\n4. 化简后未知数的系数不为0\n\n【举例】\n- 2x + 3 = 7 是一元一次方程\n- x² = 4 不是（次数是2）\n- 1/x = 2 不是（分母含未知数）","id":"g1_math_u022","semester":"upper"},{"chapter":"上册 第四章 一元一次方程","name":"等式的性质","formula":"等式两边同时加、减、乘、除（不为0），结果仍相等","explanation":"【等式的性质1】\n等式两边加（或减）同一个数（或式子），结果仍相等。\n即：如果 a = b，那么 a ± c = b ± c\n\n【等式的性质2】\n等式两边乘同一个数，或除以同一个不为0的数，结果仍相等。\n即：如果 a = b，那么 ac = bc\n如果 a = b (c ≠ 0)，那么 a/c = b/c\n\n【注意】\n1. 等式两边同时除以的数不能为0\n2. 等式两边不能同时乘0（虽然结果仍为0，但失去意义）","id":"g1_math_u023","semester":"upper"},{"chapter":"上册 第四章 一元一次方程","name":"解一元一次方程","formula":"移项 → 合并 → 系数化为1","explanation":"【一般步骤】\n1. 去分母：在方程两边都乘各分母的最小公倍数\n2. 去括号：先去小括号，再去中括号，最后去大括号\n3. 移项：把含有未知数的项移到方程一边，其他项移到另一边\n4. 合并同类项：把方程化成 ax = b (a ≠ 0) 的形式\n5. 系数化为1：在方程两边都除以未知数的系数a，得到解 x = b/a\n\n【注意】\n1. 移项要变号\n2. 去分母时不要漏乘不含分母的项\n3. 去括号时注意符号","id":"g1_math_u024","semester":"upper"},{"chapter":"上册 第四章 一元一次方程","name":"一元一次方程的实际应用","formula":"审题 → 设元 → 列方程 → 解方程 → 检验 → 作答","explanation":"【一般步骤】\n1. 审：审题，分析题意，找出等量关系\n2. 设：设未知数（直接设或间接设）\n3. 列：根据等量关系列出方程\n4. 解：解方程，求出未知数的值\n5. 验：检验解是否符合实际意义\n6. 答：写出答案\n\n【常见类型】\n1. 行程问题：路程 = 速度 × 时间\n2. 工程问题：工作量 = 工作效率 × 工作时间\n3. 利润问题：利润 = 售价 - 成本\n4. 配套问题、分配问题等","id":"g1_math_u025","semester":"upper"},{"chapter":"上册 第五章 几何图形初步","name":"立体图形与平面图形","formula":"点动成线，线动成面，面动成体","explanation":"【几何图形】\n从实物中抽象出的各种图形统称为几何图形。\n\n【分类】\n1. 立体图形：各部分不都在同一平面内\n   - 柱体：圆柱、棱柱\n   - 锥体：圆锥、棱锥\n   - 球体\n\n2. 平面图形：各部分都在同一平面内\n   - 三角形、四边形、圆等\n\n【联系】\n1. 立体图形的展开图是平面图形\n2. 从不同方向看立体图形，得到平面图形（三视图）\n3. 点动成线，线动成面，面动成体","id":"g1_math_u026","semester":"upper"},{"chapter":"上册 第五章 几何图形初步","name":"直线、射线、线段","formula":"两点确定一条直线","explanation":"【直线】\n- 表示方法：直线AB或直线l\n- 特征：没有端点，向两方无限延伸，不可度量\n- 性质：两点确定一条直线\n\n【射线】\n- 表示方法：射线OA（O是端点）\n- 特征：有一个端点，向一方无限延伸，不可度量\n\n【线段】\n- 表示方法：线段AB或线段a\n- 特征：有两个端点，可以度量\n- 性质：两点之间，线段最短\n\n【两点的距离】\n连接两点间的线段的长度，叫做这两点的距离。","id":"g1_math_u027","semester":"upper"},{"chapter":"上册 第五章 几何图形初步","name":"线段的中点","formula":"点M是AB中点 ⇔ AM = MB = ½AB","explanation":"【定义】\n把一条线段分成两条相等的线段的点，叫做这条线段的中点。\n\n【几何语言】\n∵ 点M是线段AB的中点\n∴ AM = MB = ½AB\n（或 AB = 2AM = 2MB）\n\n【线段的等分点】\n- 二等分点（中点）：2段\n- 三等分点：3段\n- 四等分点：4段\n- ...\n\n【画法】\n1. 度量法\n2. 尺规作图法","id":"g1_math_u028","semester":"upper"},{"chapter":"上册 第五章 几何图形初步","name":"角的概念","formula":"有公共端点的两条射线组成的图形叫做角","explanation":"【定义】\n有公共端点的两条射线组成的图形叫做角。这个公共端点是角的顶点，这两条射线是角的两条边。\n\n【另一种定义】\n角也可以看作由一条射线绕着它的端点旋转而形成的图形。\n\n【表示方法】\n1. 用三个大写字母表示：∠AOB（顶点在中间）\n2. 用一个大写字母表示：∠O（顶点处只有一个角时）\n3. 用数字表示：∠1\n4. 用希腊字母表示：∠α\n\n【分类】\n锐角（0°<α<90°）、直角（90°）、钝角（90°<α<180°）、平角（180°）、周角（360°）","id":"g1_math_u029","semester":"upper"},{"chapter":"上册 第五章 几何图形初步","name":"角的度量与比较","formula":"1° = 60′，1′ = 60″","explanation":"【角度制】\n1周角 = 360°，1平角 = 180°\n1° = 60′（分），1′ = 60″（秒）\n\n【角的比较方法】\n1. 度量法：用量角器量出度数，再比较\n2. 叠合法：把两个角叠合在一起比较\n\n【角的运算】\n1. 加减法：度、分、秒分别相加减，满60进1，不够减借1当60\n2. 乘除法：分别乘除，满60进1\n\n【角平分线】\n从一个角的顶点出发，把这个角分成相等的两个角的射线，叫做这个角的平分线。","id":"g1_math_u030","semester":"upper"},{"chapter":"下册 第五章 相交线与平行线","name":"相交线","formula":"对顶角相等","explanation":"【相交线】\n两条直线相交，形成四个角。\n\n【对顶角】\n两个角有公共顶点，且一个角的两边分别是另一个角两边的反向延长线，这样的两个角叫做对顶角。\n性质：对顶角相等。\n\n【邻补角】\n两个角有公共顶点和一条公共边，另一边互为反向延长线。\n性质：邻补角互补（和为180°）。\n\n【注意】\n对顶角一定相等，但相等的角不一定是对顶角。","id":"g1_math_l001","semester":"lower"},{"chapter":"下册 第五章 相交线与平行线","name":"垂线","formula":"过一点有且只有一条直线与已知直线垂直","explanation":"【定义】\n当两条直线相交所成的四个角中，有一个角是直角时，这两条直线互相垂直。其中一条直线叫做另一条直线的垂线，它们的交点叫做垂足。\n\n【表示方法】\nAB ⊥ CD，读作\"AB垂直于CD\"\n\n【性质1】\n在同一平面内，过一点有且只有一条直线与已知直线垂直。\n\n【性质2】\n连接直线外一点与直线上各点的所有线段中，垂线段最短。\n简称：垂线段最短。\n\n【点到直线的距离】\n直线外一点到这条直线的垂线段的长度，叫做点到直线的距离。","id":"g1_math_l002","semester":"lower"},{"chapter":"下册 第五章 相交线与平行线","name":"同位角、内错角、同旁内角","formula":"三线八角","explanation":"【定义】\n两条直线被第三条直线所截，形成八个角，简称\"三线八角\"。\n\n【同位角】\n在截线的同旁，被截两直线的同一侧。\n形状像\"F\"型。\n\n【内错角】\n在截线的两旁，被截两直线之间。\n形状像\"Z\"型。\n\n【同旁内角】\n在截线的同旁，被截两直线之间。\n形状像\"U\"型。\n\n【注意】\n这三类角都是位置关系的角，不一定相等或互补，只有在两直线平行时才有特殊关系。","id":"g1_math_l003","semester":"lower"},{"chapter":"下册 第五章 相交线与平行线","name":"平行线的判定","formula":"同位角相等，两直线平行","explanation":"【平行线定义】\n在同一平面内，不相交的两条直线叫做平行线。\n\n【平行公理】\n经过直线外一点，有且只有一条直线与这条直线平行。\n\n【推论】\n如果两条直线都与第三条直线平行，那么这两条直线也互相平行。\n即：若 a∥c，b∥c，则 a∥b\n\n【判定方法】\n1. 同位角相等，两直线平行\n2. 内错角相等，两直线平行\n3. 同旁内角互补，两直线平行\n4. 平行于同一条直线的两条直线平行\n5. 垂直于同一条直线的两条直线平行","id":"g1_math_l004","semester":"lower"},{"chapter":"下册 第五章 相交线与平行线","name":"平行线的性质","formula":"两直线平行，同位角相等","explanation":"【平行线的性质】\n1. 两直线平行，同位角相等\n2. 两直线平行，内错角相等\n3. 两直线平行，同旁内角互补\n\n【注意区分判定和性质】\n- 判定：由角的关系 → 两直线平行（证平行）\n- 性质：由两直线平行 → 角的关系（用平行）\n\n【两条平行线的距离】\n同时垂直于两条平行线，并且夹在这两条平行线间的线段的长度，叫做这两条平行线的距离。\n\n【平移】\n平移不改变图形的形状和大小，平移前后对应线段平行（或在同一直线上）且相等。","id":"g1_math_l005","semester":"lower"},{"chapter":"下册 第五章 相交线与平行线","name":"平移","formula":"平移前后，图形的形状和大小完全相同","explanation":"【定义】\n把一个图形整体沿某一直线方向移动，会得到一个新的图形，图形的这种移动叫做平移。\n\n【性质】\n1. 平移前后，图形的形状和大小完全相同\n2. 平移前后，对应点所连的线段平行（或在同一直线上）且相等\n3. 平移前后，对应线段平行（或在同一直线上）且相等\n4. 平移前后，对应角相等\n\n【平移的两个要素】\n1. 平移方向\n2. 平移距离\n\n【画法】\n1. 找关键点\n2. 平移各关键点\n3. 按原顺序连接各对应点","id":"g1_math_l006","semester":"lower"},{"chapter":"下册 第六章 实数","name":"平方根","formula":"若x²=a，则x是a的平方根","explanation":"【定义】\n如果一个数的平方等于a，那么这个数叫做a的平方根或二次方根。\n即：如果 x² = a，那么 x 叫做 a 的平方根。\n\n【表示方法】\n正数a的平方根表示为 ±√a，读作\"正负根号a\"。\n\n【性质】\n1. 正数有两个平方根，它们互为相反数\n2. 0的平方根是0\n3. 负数没有平方根\n\n【算术平方根】\n正数a的正的平方根叫做a的算术平方根，记作√a。\n0的算术平方根是0。\n\n【开平方】\n求一个数a的平方根的运算，叫做开平方。","id":"g1_math_l007","semester":"lower"},{"chapter":"下册 第六章 实数","name":"立方根","formula":"若x³=a，则x是a的立方根","explanation":"【定义】\n如果一个数的立方等于a，那么这个数叫做a的立方根或三次方根。\n即：如果 x³ = a，那么 x 叫做 a 的立方根。\n\n【表示方法】\n表示为 ∛a，读作\"三次根号a\"。\n\n【性质】\n1. 正数的立方根是正数\n2. 负数的立方根是负数\n3. 0的立方根是0\n4. 任何数都有唯一的立方根\n\n【开立方】\n求一个数的立方根的运算，叫做开立方。\n\n【对比平方根】\n- 平方根：正数有两个，负数没有\n- 立方根：任何数都有一个","id":"g1_math_l008","semester":"lower"},{"chapter":"下册 第六章 实数","name":"实数","formula":"有理数和无理数统称为实数","explanation":"【定义】\n有理数和无理数统称为实数。\n\n【分类】\n实数\n├── 有理数：有限小数或无限循环小数\n│   ├── 整数\n│   └── 分数\n└── 无理数：无限不循环小数\n    - 含π的数\n    - 开方开不尽的数\n    - 有规律但不循环的小数\n\n【实数与数轴】\n实数与数轴上的点一一对应。\n\n【实数的性质】\n1. 实数a的相反数是 -a\n2. 实数a的绝对值：\n   |a| = a (a≥0)，|a| = -a (a<0)\n3. 实数的运算律与有理数相同","id":"g1_math_l009","semester":"lower"},{"chapter":"下册 第七章 平面直角坐标系","name":"平面直角坐标系","formula":"横轴x轴，纵轴y轴，交点为原点","explanation":"【定义】\n在平面内画两条互相垂直、原点重合的数轴，组成平面直角坐标系。\n\n【相关概念】\n- 横轴（x轴）：水平的数轴，向右为正方向\n- 纵轴（y轴）：竖直的数轴，向上为正方向\n- 原点：两轴的交点\n- 坐标平面：坐标系所在的平面\n- 象限：x轴和y轴把平面分成四个部分\n  - 第一象限（+，+）\n  - 第二象限（-，+）\n  - 第三象限（-，-）\n  - 第四象限（+，-）\n\n【点的坐标】\n用有序数对 (x, y) 表示点的位置。\n注意：x轴和y轴上的点不属于任何象限。","id":"g1_math_l010","semester":"lower"},{"chapter":"下册 第七章 平面直角坐标系","name":"点的坐标","formula":"P(x, y)，横坐标x，纵坐标y","explanation":"【点的坐标】\n在平面直角坐标系中，点P对应一个有序数对 (x, y)，x叫做点P的横坐标，y叫做点P的纵坐标。\n\n【特殊点的坐标特征】\n1. 原点：(0, 0)\n2. x轴上的点：纵坐标为0，即 (x, 0)\n3. y轴上的点：横坐标为0，即 (0, y)\n4. 第一象限：x > 0, y > 0\n5. 第二象限：x < 0, y > 0\n6. 第三象限：x < 0, y < 0\n7. 第四象限：x > 0, y < 0\n\n【对称点的坐标】\n- 关于x轴对称：(x, y) → (x, -y)\n- 关于y轴对称：(x, y) → (-x, y)\n- 关于原点对称：(x, y) → (-x, -y)","id":"g1_math_l011","semester":"lower"},{"chapter":"下册 第七章 平面直角坐标系","name":"坐标方法的简单应用","formula":"用坐标表示位置和平移","explanation":"【用坐标表示地理位置】\n步骤：\n1. 建立坐标系，选择适当的参照点为原点，确定x轴、y轴的正方向\n2. 根据具体问题确定单位长度\n3. 在坐标平面内画出这些点，写出各点的坐标和各个地点的名称\n\n【用坐标表示平移】\n1. 左右平移：\n   - 向右平移a个单位：(x, y) → (x + a, y)\n   - 向左平移a个单位：(x, y) → (x - a, y)\n\n2. 上下平移：\n   - 向上平移b个单位：(x, y) → (x, y + b)\n   - 向下平移b个单位：(x, y) → (x, y - b)\n\n【记忆口诀】\n右加左减x坐标，上加下减y坐标。","id":"g1_math_l012","semester":"lower"},{"chapter":"下册 第八章 二元一次方程组","name":"二元一次方程组","formula":"含有两个未知数，每个未知数次数都是1","explanation":"【二元一次方程定义】\n含有两个未知数，并且含有未知数的项的次数都是1的整式方程，叫做二元一次方程。\n\n【二元一次方程组定义】\n把具有相同未知数的两个二元一次方程合在一起，就组成了一个二元一次方程组。\n\n【二元一次方程的解】\n使二元一次方程两边相等的两个未知数的值，叫做二元一次方程的解。\n注意：二元一次方程有无数个解。\n\n【二元一次方程组的解】\n二元一次方程组的两个方程的公共解，叫做二元一次方程组的解。\n\n【一般形式】\n{a₁x + b₁y = c₁\n{a₂x + b₂y = c₂","id":"g1_math_l013","semester":"lower"},{"chapter":"下册 第八章 二元一次方程组","name":"代入消元法","formula":"用一个未知数表示另一个，代入另一个方程","explanation":"【定义】\n把二元一次方程组中一个方程的一个未知数用含另一个未知数的式子表示出来，再代入另一个方程，实现消元，进而求得这个二元一次方程组的解。这种方法叫做代入消元法，简称代入法。\n\n【步骤】\n1. 从方程组中选一个系数比较简单的方程，将这个方程中的一个未知数用含另一个未知数的式子表示出来\n2. 将变形后的关系式代入另一个方程，消去一个未知数，得到一个一元一次方程\n3. 解这个一元一次方程，求得一个未知数的值\n4. 将求得的未知数的值代入变形后的关系式，求出另一个未知数的值\n5. 写出方程组的解","id":"g1_math_l014","semester":"lower"},{"chapter":"下册 第八章 二元一次方程组","name":"加减消元法","formula":"使未知数系数相等或相反，相加或减消元","explanation":"【定义】\n两个二元一次方程中同一未知数的系数相反或相等时，把这两个方程的两边分别相加或相减，就能消去这个未知数，得到一个一元一次方程。这种方法叫做加减消元法，简称加减法。\n\n【步骤】\n1. 方程组的两个方程中，如果同一未知数的系数既不相等也不互为相反数，就要用适当的数去乘方程的两边，使同一个未知数的系数相等或互为相反数\n2. 把两个方程的两边分别相加或相减，消去一个未知数，得到一个一元一次方程\n3. 解这个一元一次方程\n4. 将求出的未知数的值代入原方程组中的任意一个方程，求出另一个未知数的值\n5. 写出方程组的解","id":"g1_math_l015","semester":"lower"},{"chapter":"下册 第八章 二元一次方程组","name":"二元一次方程组的实际应用","formula":"审题 → 设元 → 列方程组 → 解方程组 → 检验 → 作答","explanation":"【一般步骤】\n1. 审：审题，分析题意，找出等量关系\n2. 设：设两个未知数（直接设或间接设）\n3. 列：根据等量关系列出方程组（两个方程）\n4. 解：解方程组，求出未知数的值\n5. 验：检验解是否符合实际意义\n6. 答：写出答案\n\n【常见类型】\n1. 行程问题：相遇、追及\n2. 工程问题：合作、分工\n3. 利润问题：进价、售价、利润\n4. 配套问题：数量比例\n5. 数字问题：数位关系\n\n【关键】\n找到两个等量关系，列出两个方程。","id":"g1_math_l016","semester":"lower"},{"chapter":"下册 第九章 不等式与不等式组","name":"不等式及其解集","formula":"用不等号表示大小关系的式子","explanation":"【不等式定义】\n用不等号（>、<、≥、≤、≠）表示大小关系的式子，叫做不等式。\n\n【不等式的解】\n使不等式成立的未知数的值叫做不等式的解。\n\n【解集】\n一个含有未知数的不等式的所有解，组成这个不等式的解集。\n\n【解不等式】\n求不等式的解集的过程叫做解不等式。\n\n【解集在数轴上的表示】\n- x > a：空心圆圈，向右画\n- x < a：空心圆圈，向左画\n- x ≥ a：实心圆点，向右画\n- x ≤ a：实心圆点，向左画\n\n【一元一次不等式】\n含有一个未知数，未知数的次数是1的不等式，叫做一元一次不等式。","id":"g1_math_l017","semester":"lower"},{"chapter":"下册 第九章 不等式与不等式组","name":"不等式的性质","formula":"两边加/减，方向不变；乘除正数，方向不变；乘除负数，方向改变","explanation":"【不等式的性质1】\n不等式两边加（或减）同一个数（或式子），不等号的方向不变。\n即：如果 a > b，那么 a ± c > b ± c\n\n【不等式的性质2】\n不等式两边乘（或除以）同一个正数，不等号的方向不变。\n即：如果 a > b，c > 0，那么 ac > bc（或 a/c > b/c）\n\n【不等式的性质3】\n不等式两边乘（或除以）同一个负数，不等号的方向改变。\n即：如果 a > b，c < 0，那么 ac < bc（或 a/c < b/c）\n\n【注意】\n1. 性质3是重点也是难点，乘除负数时不等号要变向\n2. 不能两边同时乘0","id":"g1_math_l018","semester":"lower"},{"chapter":"下册 第九章 不等式与不等式组","name":"一元一次不等式的解法","formula":"去分母 → 去括号 → 移项 → 合并 → 系数化为1","explanation":"【一般步骤】\n1. 去分母：在不等式两边都乘各分母的最小公倍数（注意乘负数要变号）\n2. 去括号：先去小括号，再去中括号，最后去大括号\n3. 移项：把含有未知数的项移到不等式一边，其他项移到另一边\n4. 合并同类项：把不等式化成 ax > b 或 ax < b 的形式\n5. 系数化为1：在不等式两边都除以未知数的系数\n   - 系数为正：不等号方向不变\n   - 系数为负：不等号方向要改变\n\n【注意】\n1. 去分母时不要漏乘不含分母的项\n2. 系数化为1时，注意不等号方向是否改变","id":"g1_math_l019","semester":"lower"},{"chapter":"下册 第九章 不等式与不等式组","name":"一元一次不等式组","formula":"几个一元一次不等式合在一起","explanation":"【定义】\n把两个一元一次不等式合起来，就组成一个一元一次不等式组。\n\n【不等式组的解集】\n几个不等式的解集的公共部分，叫做由它们所组成的不等式组的解集。\n\n【解不等式组】\n求不等式组的解集的过程叫做解不等式组。\n\n【解集口诀】\n1. 同大取大：x > a, x > b (a > b) → x > a\n2. 同小取小：x < a, x < b (a < b) → x < a\n3. 大小小大中间找：x < a, x > b (a > b) → b < x < a\n4. 大大小小找不到：x > a, x < b (a > b) → 无解\n\n【步骤】\n1. 分别解各不等式\n2. 在数轴上表示各解集\n3. 找公共部分，写出不等式组的解集","id":"g1_math_l020","semester":"lower"},{"chapter":"下册 第十章 数据的收集、整理与描述","name":"统计调查","formula":"全面调查和抽样调查","explanation":"【统计调查的方式】\n1. 全面调查（普查）：考察全体对象的调查\n2. 抽样调查：只抽取一部分对象进行调查，然后根据调查数据推断全体对象的情况\n\n【相关概念】\n- 总体：要考察的全体对象\n- 个体：组成总体的每一个考察对象\n- 样本：被抽取的所有个体组成一个样本\n- 样本容量：样本中个体的数目\n\n【简单随机抽样】\n总体中的每一个个体都有相等的机会被抽到，像这样的抽样方法是一种简单随机抽样。\n\n【抽样调查的要求】\n1. 样本容量要适当\n2. 样本要具有代表性和广泛性\n\n【收集数据的方法】\n问卷调查、实地调查、查阅资料等","id":"g1_math_l021","semester":"lower"},{"chapter":"下册 第十章 数据的收集、整理与描述","name":"直方图","formula":"频数分布表 → 频数分布直方图","explanation":"【相关概念】\n1. 频数：落在各个小组内的数据的个数\n2. 频率：频数与数据总数的比\n\n【画直方图的步骤】\n1. 计算最大值与最小值的差（极差）\n2. 决定组距和组数\n   - 组距：每个小组的两个端点之间的距离\n   - 组数 = 极差 / 组距，结果取整加1\n3. 列频数分布表\n4. 画频数分布直方图\n\n【直方图与条形图的区别】\n- 条形图：各长方形之间有空隙，用横轴表示类别\n- 直方图：各长方形之间没有空隙，用横轴表示连续数据的分组\n\n【应用】\n直方图可以直观地看出数据的分布情况。","id":"g1_math_l022","semester":"lower"},{"chapter":"下册 第十章 数据的收集、整理与描述","name":"折线图与条形图","formula":"折线图表示变化趋势，条形图比较数量多少","explanation":"【条形图】\n- 特点：用条形的长短表示数量的多少\n- 作用：清楚地看出每个项目的具体数目，便于比较\n\n【折线图】\n- 特点：用折线的上升或下降表示统计数量的增减变化\n- 作用：清楚地反映事物的变化情况和趋势\n\n【扇形图】\n- 特点：用扇形的面积表示各部分占总体的百分比\n- 作用：清楚地表示出各部分在总体中所占的百分比\n\n【统计图的选择】\n1. 要清楚地表示每个项目的具体数目 → 条形图\n2. 要清楚地反映事物的变化情况 → 折线图\n3. 要清楚地表示出各部分在总体中所占的百分比 → 扇形图","id":"g1_math_l023","semester":"lower"},{"chapter":"下册 第九章 不等式与不等式组","name":"一元一次不等式的实际应用","formula":"设未知数 → 列不等式 → 解不等式 → 检验 → 作答","explanation":"【一般步骤】\n1. 审：审题，分析题意，找出不等关系\n2. 设：设未知数\n3. 列：根据不等关系列出一元一次不等式\n4. 解：解不等式，求出解集\n5. 验：检验解是否符合实际意义\n6. 答：写出答案\n\n【常见不等关系关键词】\n- 至少：≥\n- 至多：≤\n- 不少于：≥\n- 不超过：≤\n- 大于：>\n- 小于：<\n\n【常见类型】\n1. 方案选择问题\n2. 利润问题\n3. 行程问题\n4. 分配问题","id":"g1_math_l024","semester":"lower"},{"chapter":"下册 第九章 不等式与不等式组","name":"不等式组的应用","formula":"找出两个不等关系，列不等式组","explanation":"【一般步骤】\n1. 审：审题，分析题意，找出两个不等关系\n2. 设：设一个未知数\n3. 列：根据两个不等关系列出一元一次不等式组\n4. 解：解不等式组，求出解集\n5. 验：检验解是否符合实际意义\n6. 答：写出答案（包括整数解等特殊解）\n\n【常见题型】\n1. 分配问题（把东西分给几个人）\n2. 方案设计问题（几种方案，选择最优）\n3. 利润最大化问题\n4. 取值范围问题\n\n【注意】\n实际问题中经常要求整数解、正整数解等。","id":"g1_math_l025","semester":"lower"},{"chapter":"下册 第八章 二元一次方程组","name":"三元一次方程组","formula":"三元 → 二元 → 一元","explanation":"【定义】\n含有三个相同的未知数，每个方程中含未知数的项的次数都是1，并且一共有三个方程，像这样的方程组叫做三元一次方程组。\n\n【解法思路】\n三元一次方程组 → 消元 → 二元一次方程组 → 消元 → 一元一次方程\n\n【一般步骤】\n1. 利用代入法或加减法，消去一个未知数，得到一个二元一次方程组\n2. 解这个二元一次方程组，求得两个未知数的值\n3. 将这两个未知数的值代入原方程组中较简单的一个方程，求出第三个未知数的值\n4. 写出方程组的解\n\n【注意】\n选消哪个元要看系数特点，选系数简单的消元。","id":"g1_math_l026","semester":"lower"},{"chapter":"下册 第七章 平面直角坐标系","name":"特殊点的坐标规律","formula":"x轴上y=0，y轴上x=0","explanation":"【坐标轴上的点】\n1. x轴上的点：纵坐标为0，即 (x, 0)\n2. y轴上的点：横坐标为0，即 (0, y)\n3. 原点：(0, 0)\n\n【象限角平分线上的点】\n1. 第一、三象限角平分线上的点：横、纵坐标相等，即 (a, a)\n2. 第二、四象限角平分线上的点：横、纵坐标互为相反数，即 (a, -a)\n\n【平行于坐标轴的直线上的点】\n1. 平行于x轴的直线：纵坐标相同\n2. 平行于y轴的直线：横坐标相同\n\n【距离】\n1. 点P(x, y)到x轴的距离 = |y|\n2. 点P(x, y)到y轴的距离 = |x|","id":"g1_math_l027","semester":"lower"},{"chapter":"下册 第六章 实数","name":"实数的运算","formula":"运算律与有理数相同","explanation":"【实数的运算】\n实数运算的顺序和有理数的运算顺序一样：\n1. 先乘方、开方，再乘除，最后加减\n2. 同级运算从左到右进行\n3. 有括号先算括号内的\n\n【运算律】\n1. 加法交换律：a + b = b + a\n2. 加法结合律：(a + b) + c = a + (b + c)\n3. 乘法交换律：ab = ba\n4. 乘法结合律：(ab)c = a(bc)\n5. 分配律：a(b + c) = ab + ac\n\n【注意】\n1. 无理数也可以进行加、减、乘、除、乘方、开方运算\n2. 结果要化为最简形式\n3. 涉及无理数的近似计算，可以取近似值转化为有理数计算","id":"g1_math_l028","semester":"lower"},{"chapter":"下册 第五章 相交线与平行线","name":"命题、定理、证明","formula":"命题由题设和结论两部分组成","explanation":"【命题】\n判断一件事情的语句，叫做命题。\n\n【命题的组成】\n命题由题设和结论两部分组成。题设是已知事项，结论是由已知事项推出的事项。\n常写成\"如果...那么...\"的形式。\n\n【真命题与假命题】\n- 真命题：正确的命题\n- 假命题：错误的命题\n\n【定理】\n经过推理证实的真命题叫做定理。定理可以作为继续推理的依据。\n\n【证明】\n在很多情况下，一个命题的正确性需要经过推理才能作出判断，这个推理过程叫做证明。\n\n【注意】\n判断一个命题是假命题，只要举出一个反例就可以了。","id":"g1_math_l029","semester":"lower"},{"chapter":"下册 第十章 数据的收集、整理与描述","name":"扇形图","formula":"扇形圆心角 = 百分比 × 360°","explanation":"【扇形图】\n用整个圆表示总数，用圆内各个扇形的大小表示各部分数量占总数的百分比，这样的统计图叫做扇形图。\n\n【特点】\n1. 用扇形的面积表示各部分占总体的百分比\n2. 各个扇形的圆心角之和等于360°\n3. 可以清楚地表示出各部分在总体中所占的百分比\n\n【绘制步骤】\n1. 计算各部分占总体的百分比\n2. 计算各部分扇形的圆心角度数\n   圆心角度数 = 百分比 × 360°\n3. 在圆中画出各个扇形\n4. 标注各部分名称和百分比\n\n【应用】\n当要了解各部分占总体的比例时，选择扇形图。","id":"g1_math_l030","semester":"lower"}];

        // ==================== 内嵌例题数据 ====================
        const DATA_EXAMPLES = [{"id":"g1_math_u001_ex01","knowledge_id":"g1_math_u001","question":"选择题：下列各数中，属于正数的是（  ）\nA. +5\nB. -3\nC. 0\nD. -10","answer":"答案：A\n解析：大于0的数叫做正数。+5 > 0，所以是正数；-3和-10是负数；0既不是正数也不是负数。"},{"id":"g1_math_u001_ex02","knowledge_id":"g1_math_u001","question":"选择题：下列说法正确的是（  ）\nA. 0是正数\nB. 0是负数\nC. 0既不是正数也不是负数\nD. 0既是正数也是负数","answer":"答案：C\n解析：0是正数和负数的分界点，它既不是正数也不是负数。"},{"id":"g1_math_u001_ex03","knowledge_id":"g1_math_u001","question":"判断题：正数和负数表示相反意义的量。（  ）","answer":"答案：正确\n解析：正数和负数是用来表示相反意义的两种量，如收入与支出、零上与零下温度等。"},{"id":"g1_math_u001_ex04","knowledge_id":"g1_math_u001","question":"选择题：某地气温为零上5℃，记作+5℃；那么零下3℃应记作（  ）\nA. +3℃\nB. -3℃\nC. 3℃\nD. ±3℃","answer":"答案：B\n解析：零下温度用负数表示，所以零下3℃记作-3℃。"},{"id":"g1_math_u001_ex05","knowledge_id":"g1_math_u001","question":"填空题：如果向东走100米记作+100米，那么向西走80米应记作______米。","answer":"答案：-80\n解析：正负数表示相反意义的量，向东为正则向西为负。"},{"id":"g1_math_u002_ex01","knowledge_id":"g1_math_u002","question":"选择题：下列数中，属于有理数的是（  ）\nA. π\nB. √2\nC. 0.333...\nD. 不循环小数","answer":"答案：C\n解析：有理数包括整数和分数。0.333... = 1/3，是无限循环小数，属于有理数。π和√2是无理数。"},{"id":"g1_math_u002_ex02","knowledge_id":"g1_math_u002","question":"判断题：所有的整数都是有理数。（  ）","answer":"答案：正确\n解析：整数可以写成分母为1的分数形式，因此所有的整数都是有理数。"},{"id":"g1_math_u002_ex03","knowledge_id":"g1_math_u002","question":"选择题：把-3.5化为分数，正确的是（  ）\nA. -7/2\nB. 7/2\nC. -35/10\nD. 3.5/1","answer":"答案：A\n解析：-3.5 = -35/10 = -7/2（最简分数）。"},{"id":"g1_math_u002_ex04","knowledge_id":"g1_math_u002","question":"填空题：有理数包括______和______。","answer":"答案：整数；分数\n解析：有理数可以分成整数和分数两大类。"},{"id":"g1_math_u002_ex05","knowledge_id":"g1_math_u002","question":"选择题：下列说法错误的是（  ）\nA. 正整数是有理数\nB. 负分数是有理数\nC. 无限不循环小数是有理数\nD. 有限小数是有理数","answer":"答案：C\n解析：无限不循环小数是无理数，不是有理数。"},{"id":"g1_math_u003_ex01","knowledge_id":"g1_math_u003","question":"选择题：在数轴上，原点左边的点表示的数是（  ）\nA. 正数\nB. 负数\nC. 零\nD. 无法确定","answer":"答案：B\n解析：数轴上，原点左侧的点表示的数都是负数。"},{"id":"g1_math_u003_ex02","knowledge_id":"g1_math_u003","question":"判断题：数轴上的点可以表示任意一个实数。（  ）","answer":"答案：正确\n解析：数轴上的点与实数一一对应，每一个实数都可以用数轴上的点来表示。"},{"id":"g1_math_u003_ex03","knowledge_id":"g1_math_u003","question":"选择题：数轴上表示-3的点与原点的距离是（  ）\nA. -3\nB. 3\nC. 0\nD. 无法确定","answer":"答案：B\n解析：数轴上点到原点的距离叫做绝对值，|-3| = 3。"},{"id":"g1_math_u003_ex04","knowledge_id":"g1_math_u003","question":"填空题：在数轴上，-2在-1的______侧（填\"左\"或\"右\"）。","answer":"答案：左\n解析：在数轴上，越靠左的数越小，所以-2在-1的左侧。"},{"id":"g1_math_u003_ex05","knowledge_id":"g1_math_u003","question":"选择题：下列四个数中，在-2和1之间的是（  ）\nA. -3\nB. -1\nC. 2\nD. -4","answer":"答案：B\n解析：-2 < -1 < 1，所以-1在-2和1之间。"},{"id":"g1_math_u004_ex01","knowledge_id":"g1_math_u004","question":"选择题：-5的相反数是（  ）\nA. 5\nB. -5\nC. 1/5\nD. -1/5","answer":"答案：A\n解析：只有符号不同的两个数叫做互为相反数。-5的相反数是5。"},{"id":"g1_math_u004_ex02","knowledge_id":"g1_math_u004","question":"判断题：0的相反数是0。（  ）","answer":"答案：正确\n解析：0的相反数是它本身0。"},{"id":"g1_math_u004_ex03","knowledge_id":"g1_math_u004","question":"填空题：若a = -3，则-a = ______。","answer":"答案：3\n解析：-a表示a的相反数，-(-3) = 3。"},{"id":"g1_math_u004_ex04","knowledge_id":"g1_math_u004","question":"选择题：下列各组数中，互为相反数的是（  ）\nA. 3和1/3\nB. -3和+3\nC. -3和-1/3\nD. 3和-1/3","answer":"答案：B\n解析：-3和+3符号不同且绝对值相等，它们互为相反数。"},{"id":"g1_math_u004_ex05","knowledge_id":"g1_math_u004","question":"计算题：-(-7) = ______。","answer":"答案：7\n解析：负负得正，-(-7) = 7。"},{"id":"g1_math_u005_ex01","knowledge_id":"g1_math_u005","question":"选择题：| -8 | = （  ）\nA. 8\nB. -8\nC. ±8\nD. 0","answer":"答案：A\n解析：绝对值表示数轴上点到原点的距离，所以|-8| = 8。"},{"id":"g1_math_u005_ex02","knowledge_id":"g1_math_u005","question":"判断题：绝对值等于它本身的数只有正数。（  ）","answer":"答案：错误\n解析：绝对值等于它本身的数是正数和0，即非负数。"},{"id":"g1_math_u005_ex03","knowledge_id":"g1_math_u005","question":"填空题：若|x| = 5，则x = ______。","answer":"答案：±5\n解析：绝对值为5的数有两个：5和-5。"},{"id":"g1_math_u005_ex04","knowledge_id":"g1_math_u005","question":"选择题：比较大小：-| -3 | ______ -(-3)\nA. >\nB. <\nC. =\nD. 无法比较","answer":"答案：B\n解析：-| -3 | = -3，-(-3) = 3，所以-3 < 3。"},{"id":"g1_math_u005_ex05","knowledge_id":"g1_math_u005","question":"填空题：| 0 | = ______。","answer":"答案：0\n解析：0的绝对值是0。"},{"id":"g1_math_u006_ex01","knowledge_id":"g1_math_u006","question":"计算题：（-3）+（+5）= ______。","answer":"答案：2\n解析：异号两数相加，取绝对值较大数的符号，并用较大的绝对值减去较小的绝对值。|5|-|-3| = 2。"},{"id":"g1_math_u006_ex02","knowledge_id":"g1_math_u006","question":"计算题：（-7）+（-3）= ______。","answer":"答案：-10\n解析：同号两数相加，取相同的符号，并把绝对值相加。-7-3 = -10。"},{"id":"g1_math_u006_ex03","knowledge_id":"g1_math_u006","question":"判断题：两个负数相加，和比每个加数都小。（  ）","answer":"答案：正确\n解析：两个负数相加，结果为负数，比每个负加数都小。"},{"id":"g1_math_u006_ex04","knowledge_id":"g1_math_u006","question":"选择题：小明向东走5米，再向东走-3米，结果是（  ）\nA. 向东走2米\nB. 向西走2米\nC. 向东走8米\nD. 向西走8米","answer":"答案：A\n解析：5 + (-3) = 2，向东走2米。"},{"id":"g1_math_u006_ex05","knowledge_id":"g1_math_u006","question":"填空题：______ + 0 = -5。","answer":"答案：-5\n解析：任何数加0都得它本身。"},{"id":"g1_math_u007_ex01","knowledge_id":"g1_math_u007","question":"计算题：5 - (-3) = ______。","answer":"答案：8\n解析：减去一个数等于加上这个数的相反数。5 - (-3) = 5 + 3 = 8。"},{"id":"g1_math_u007_ex02","knowledge_id":"g1_math_u007","question":"计算题：-2 - (-7) = ______。","answer":"答案：5\n解析：-2 - (-7) = -2 + 7 = 5。"},{"id":"g1_math_u007_ex03","knowledge_id":"g1_math_u007","question":"判断题：两个数的差不一定比被减数大。（  ）","answer":"答案：正确\n解析：当减数为负数时，差会大于被减数。"},{"id":"g1_math_u007_ex04","knowledge_id":"g1_math_u007","question":"选择题：温度从-3℃上升5℃后，是（  ）℃\nA. -8\nB. -2\nC. 2\nD. 8","answer":"答案：C\n解析：-3 + 5 = 2，所以是2℃。"},{"id":"g1_math_u007_ex05","knowledge_id":"g1_math_u007","question":"填空题：7 - 3 - (-5) = ______。","answer":"答案：9\n解析：7 - 3 - (-5) = 7 - 3 + 5 = 9。"},{"id":"g1_math_u008_ex01","knowledge_id":"g1_math_u008","question":"计算题：(-3)×(-4) = ______。","answer":"答案：12\n解析：两数相乘，同号得正，异号得负。(-3)×(-4) = 12。"},{"id":"g1_math_u008_ex02","knowledge_id":"g1_math_u008","question":"计算题：(-5)×3 = ______。","answer":"答案：-15\n解析：(-5)×3 = -15。"},{"id":"g1_math_u008_ex03","knowledge_id":"g1_math_u008","question":"判断题：任何数乘0都得0。（  ）","answer":"答案：正确\n解析：0与任何数相乘都得0。"},{"id":"g1_math_u008_ex04","knowledge_id":"g1_math_u008","question":"选择题：若ab < 0，则（  ）\nA. a > 0, b > 0\nB. a < 0, b < 0\nC. a、b异号\nD. a = 0或b = 0","answer":"答案：C\n解析：两数乘积小于0，说明这两个数异号。"},{"id":"g1_math_u008_ex05","knowledge_id":"g1_math_u008","question":"填空题：(-1)×(-1)×(-1) = ______。","answer":"答案：-1\n解析：(-1)×(-1) = 1，1×(-1) = -1。"},{"id":"g1_math_u009_ex01","knowledge_id":"g1_math_u009","question":"计算题：(-12)÷(-3) = ______。","answer":"答案：4\n解析：(-12)÷(-3) = 4。"},{"id":"g1_math_u009_ex02","knowledge_id":"g1_math_u009","question":"计算题：6÷(-2) = ______。","answer":"答案：-3\n解析：6÷(-2) = -3。"},{"id":"g1_math_u009_ex03","knowledge_id":"g1_math_u009","question":"判断题：0除以任何数都得0。（  ）","answer":"答案：错误\n解析：0不能除以0，但0除以非0数得0。"},{"id":"g1_math_u009_ex04","knowledge_id":"g1_math_u009","question":"选择题：下列运算正确的是（  ）\nA. (-8)÷0 = 0\nB. 0÷(-8) = 0\nC. (-8)÷(-8) = 0\nD. (-8)÷(-1) = 8","answer":"答案：B\n解析：0除以任何非0数都得0。"},{"id":"g1_math_u009_ex05","knowledge_id":"g1_math_u009","question":"填空题：若a÷b = -1，则a = -b（b≠0）。","answer":"答案：正确\n解析：a÷b = -1说明a和b互为相反数。"},{"id":"g1_math_u010_ex01","knowledge_id":"g1_math_u010","question":"计算题：(-2)³ = ______。","answer":"答案：-8\n解析：(-2)³ = (-2)×(-2)×(-2) = -8。"},{"id":"g1_math_u010_ex02","knowledge_id":"g1_math_u010","question":"计算题：(-3)² = ______。","answer":"答案：9\n解析：(-3)² = 9。"},{"id":"g1_math_u010_ex03","knowledge_id":"g1_math_u010","question":"判断题：(-2)²与-2²的值相等。（  ）","answer":"答案：错误\n解析：(-2)² = 4，-2² = -4，两者不相等。"},{"id":"g1_math_u010_ex04","knowledge_id":"g1_math_u010","question":"选择题：下列各式中，值为负数的是（  ）\nA. (-3)⁴\nB. -3⁴\nC. (-1)²\nD. 0⁴","answer":"答案：B\n解析：-3⁴ = -(3⁴) = -81，为负数。"},{"id":"g1_math_u010_ex05","knowledge_id":"g1_math_u010","question":"填空题：(-1)¹⁰⁰ = ______。","answer":"答案：1\n解析：(-1)的偶数次幂等于1。"},{"id":"g1_math_u011_ex01","knowledge_id":"g1_math_u011","question":"把1300000用科学计数法表示为______。","answer":"答案：1.3×10⁶\n解析：1300000 = 1.3×10⁶。"},{"id":"g1_math_u011_ex02","knowledge_id":"g1_math_u011","question":"选择题：科学计数法表示的数5.2×10⁵，原数是（  ）\nA. 520000\nB. 5200000\nC. 52000\nD. 5200","answer":"答案：A\n解析：5.2×10⁵ = 520000。"},{"id":"g1_math_u011_ex03","knowledge_id":"g1_math_u011","question":"判断题：科学计数法中，a必须满足1≤|a|<10。（  ）","answer":"答案：正确\n解析：这是科学计数法的标准形式要求。"},{"id":"g1_math_u011_ex04","knowledge_id":"g1_math_u011","question":"把0.00056用科学计数法表示为______。","answer":"答案：5.6×10⁻⁴\n解析：0.00056 = 5.6×10⁻⁴。"},{"id":"g1_math_u011_ex05","knowledge_id":"g1_math_u011","question":"选择题：3.05×10⁴精确到百位的是（  ）\nA. 30500\nB. 3.1×10⁴\nC. 3.05×10⁴\nD. 30500","answer":"答案：A\n解析：3.05×10⁴ = 30500，精确到百位是30500。"},{"id":"g1_math_u012_ex01","knowledge_id":"g1_math_u012","question":"选择题：3.1416精确到万分位是（  ）\nA. 3.141\nB. 3.142\nC. 3.1416\nD. 3.14","answer":"答案：B\n解析：万分位是第4位小数，3.1416的第5位是6≥5，所以四舍五入为3.142。"},{"id":"g1_math_u012_ex02","knowledge_id":"g1_math_u012","question":"判断题：近似数3万一定比近似数30000更精确。（  ）","answer":"答案：错误\n解析：近似数3万精确到万位，而30000精确到个位，后者更精确。"},{"id":"g1_math_u012_ex03","knowledge_id":"g1_math_u012","question":"填空题：把2.549四舍五入保留一位小数，得______。","answer":"答案：2.5\n解析：2.549保留一位小数，看第2位小数5，不舍。"},{"id":"g1_math_u012_ex04","knowledge_id":"g1_math_u012","question":"选择题：下列数据中，是准确数的是（  ）\nA. 小明身高150cm\nB. 全班有45人\nC. 圆周率约3.14\nD. 地球半径约6371km","answer":"答案：B\n解析：45人是计数得到的，是准确数。"},{"id":"g1_math_u012_ex05","knowledge_id":"g1_math_u012","question":"填空题：1.5962精确到0.01是______。","answer":"答案：1.60\n解析：精确到0.01即保留两位小数，1.5962的第3位是6≥5，所以四舍五入为1.60。"},{"id":"g1_math_u013_ex01","knowledge_id":"g1_math_u013","question":"选择题：下列式子中，是整式的是（  ）\nA. 1/x\nB. x+1\nC. √x\nD. |x|","answer":"答案：B\n解析：整式是单项式和多项式的统称，分母中不含字母。x+1是多项式，属于整式。"},{"id":"g1_math_u013_ex02","knowledge_id":"g1_math_u013","question":"填空题：单项式2x²y的系数是______，次数是______。","answer":"答案：2；3\n解析：系数是数字因数2，次数是字母指数和2+1=3。"},{"id":"g1_math_u013_ex03","knowledge_id":"g1_math_u013","question":"判断题：单独的一个数或一个字母不是单项式。（  ）","answer":"答案：错误\n解析：单独的一个数或一个字母也是单项式。"},{"id":"g1_math_u013_ex04","knowledge_id":"g1_math_u013","question":"选择题：多项式3x² - 2x + 1是（  ）\nA. 一次二项式\nB. 二次三项式\nC. 二次二项式\nD. 三次三项式","answer":"答案：B\n解析：最高次数是2，有三项，所以是二次三项式。"},{"id":"g1_math_u013_ex05","knowledge_id":"g1_math_u013","question":"填空题：若|x-1| + (y+2)² = 0，则x = ______，y = ______。","answer":"答案：1；-2\n解析：绝对值和平方都非负，和为0说明各自为0。"},{"id":"g1_math_u014_ex01","knowledge_id":"g1_math_u014","question":"选择题：下列是单项式的是（  ）\nA. x+1\nB. 1/x\nC. -3a²b\nD. 2x-3y","answer":"答案：C\n解析：-3a²b是数与字母的乘积，是单项式。"},{"id":"g1_math_u014_ex02","knowledge_id":"g1_math_u014","question":"填空题：单项式-5x³y²的系数是______，次数是______。","answer":"答案：-5；5\n解析：系数是-5，次数是3+2=5。"},{"id":"g1_math_u014_ex03","knowledge_id":"g1_math_u014","question":"判断题：πr²是单项式。（  ）","answer":"答案：正确\n解析：π是数字，r²是字母，所以πr²是单项式。"},{"id":"g1_math_u014_ex04","knowledge_id":"g1_math_u014","question":"选择题：下列单项式：① -x ② 3 ③ xy/2 ④ x²+y²，其中单项式的个数是（  ）\nA. 1\nB. 2\nC. 3\nD. 4","answer":"答案：C\n解析：①③④是单项式，②也是单项式，共4个...不对，x²+y²是多项式，所以是3个。"},{"id":"g1_math_u014_ex05","knowledge_id":"g1_math_u014","question":"填空题：若单项式aᵐb³的次数是7，则m = ______。","answer":"答案：4\n解析：m+3=7，所以m=4。"},{"id":"g1_math_u015_ex01","knowledge_id":"g1_math_u015","question":"选择题：多项式x² - 3x + 5的项是（  ）\nA. x²、-3x、5\nB. x²、-3x\nC. x²、3x、5\nD. x²、3x","answer":"答案：A\n解析：多项式的项包括符号，x² - 3x + 5的项是x²、-3x、5。"},{"id":"g1_math_u015_ex02","knowledge_id":"g1_math_u015","question":"填空题：多项式2x³ - 3x² + x - 1是______次______项式。","answer":"答案：3；4\n解析：最高次数是3，共4项。"},{"id":"g1_math_u015_ex03","knowledge_id":"g1_math_u015","question":"判断题：常数项不是多项式的项。（  ）","answer":"答案：错误\n解析：常数项是多项式的一项。"},{"id":"g1_math_u015_ex04","knowledge_id":"g1_math_u015","question":"选择题：下列说法正确的是（  ）\nA. 多项式必须有字母\nB. 常数项不是多项式\nC. 多项式的项可以是单项式\nD. 多项式一定是整式","answer":"答案：C\n解析：多项式是由单项式相加组成的，各项本身都是单项式。"},{"id":"g1_math_u015_ex05","knowledge_id":"g1_math_u015","question":"填空题：把多项式按x降幂排列：3x²y + 5xy² - x³ + 2y³ = ______。","answer":"答案：-x³ + 3x²y + 5xy² + 2y³\n解析：按x的指数从高到低排列。"},{"id":"g1_math_u016_ex01","knowledge_id":"g1_math_u016","question":"计算题：3x + 5x = ______。","answer":"答案：8x\n解析：合并同类项，系数相加，字母部分不变。"},{"id":"g1_math_u016_ex02","knowledge_id":"g1_math_u016","question":"计算题：7a²b - 3a²b = ______。","answer":"答案：4a²b\n解析：7a²b - 3a²b = (7-3)a²b = 4a²b。"},{"id":"g1_math_u016_ex03","knowledge_id":"g1_math_u016","question":"判断题：3x和3y是同类项。（  ）","answer":"答案：错误\n解析：同类项要求字母相同且相同字母的指数也相同，3x和3y字母不同。"},{"id":"g1_math_u016_ex04","knowledge_id":"g1_math_u016","question":"化简题：2x² + 3x - 5x² + x = ______。","answer":"答案：-3x² + 4x\n解析：2x²-5x² = -3x²，3x+x = 4x。"},{"id":"g1_math_u016_ex05","knowledge_id":"g1_math_u016","question":"选择题：下列各组是同类项的是（  ）\nA. 2x²与2xy\nB. -3ab²与b²a\nC. 5与x\nD. a²与a","answer":"答案：B\n解析：-3ab²与b²a都含有a和b²，是同类项。"},{"id":"g1_math_u017_ex01","knowledge_id":"g1_math_u017","question":"选择题：下列方程中，是一元一次方程的是（  ）\nA. x² + 1 = 0\nB. x + y = 2\nC. 2/x = 1\nD. 2x + 1 = 3","answer":"答案：D\n解析：一元一次方程含一个未知数，未知数次数为1，且分母中不含未知数。"},{"id":"g1_math_u017_ex02","knowledge_id":"g1_math_u017","question":"解方程：x + 3 = 7","answer":"答案：x = 4\n解析：x = 7 - 3 = 4。"},{"id":"g1_math_u017_ex03","knowledge_id":"g1_math_u017","question":"判断题：方程2x + 3 = 7的解是x = 2。（  ）","answer":"答案：正确\n解析：代入检验，2×2 + 3 = 7，等式成立。"},{"id":"g1_math_u017_ex04","knowledge_id":"g1_math_u017","question":"填空题：若x = -2是方程ax - 4 = 0的解，则a = ______。","answer":"答案：-2\n解析：代入得-2a - 4 = 0，a = -2。"},{"id":"g1_math_u017_ex05","knowledge_id":"g1_math_u017","question":"选择题：方程3x + 5 = 2x - 1的解是（  ）\nA. x = -6\nB. x = -4\nC. x = 6\nD. x = 4","answer":"答案：A\n解析：3x - 2x = -1 - 5，x = -6。"},{"id":"g1_math_u018_ex01","knowledge_id":"g1_math_u018","question":"填空题：等式两边都加上同一个数，等式仍然成立。","answer":"答案：正确\n解析：这是等式的基本性质1。"},{"id":"g1_math_u018_ex02","knowledge_id":"g1_math_u018","question":"填空题：若x = y，则x + 3 = y + 3。","answer":"答案：正确\n解析：等式两边加同一个数，等式仍成立。"},{"id":"g1_math_u018_ex03","knowledge_id":"g1_math_u018","question":"选择题：下列变形中，正确的是（  ）\nA. 若x = y，则x/a = y/a\nB. 若x = y，则x·a = y·a\nC. 若x = y，则x - 2 = y + 2\nD. 若x = y，则x² = y","answer":"答案：B\n解析：等式两边乘同一个数，等式仍成立。"},{"id":"g1_math_u018_ex04","knowledge_id":"g1_math_u018","question":"判断题：等式两边同时除以同一个数，等式仍然成立。（  ）","answer":"答案：错误\n解析：不能除以0。"},{"id":"g1_math_u018_ex05","knowledge_id":"g1_math_u018","question":"应用题：利用等式性质解方程：x - 5 = 3","answer":"答案：x = 8\n解析：两边加5，得x = 8。"},{"id":"g1_math_u019_ex01","knowledge_id":"g1_math_u019","question":"选择题：使方程左右两边相等的未知数的值叫做（  ）\nA. 方程\nB. 方程的解\nC. 解方程\nD. 等式","answer":"答案：B\n解析：方程的解是使方程成立的未知数的值。"},{"id":"g1_math_u019_ex02","knowledge_id":"g1_math_u019","question":"判断题：方程的解就是方程的解集。（  ）","answer":"答案：正确\n解析：一元一次方程只有一个解，就是方程的解。"},{"id":"g1_math_u019_ex03","knowledge_id":"g1_math_u019","question":"选择题：下列哪个是方程2x + 1 = 5的解（  ）\nA. x = 1\nB. x = 2\nC. x = 3\nD. x = 0","answer":"答案：B\n解析：代入x=2，2×2+1=5，成立。"},{"id":"g1_math_u019_ex04","knowledge_id":"g1_math_u019","question":"填空题：方程|x-3| = 2的解是______。","answer":"答案：x = 5或x = 1\n解析：x-3 = 2或x-3 = -2，得x = 5或x = 1。"},{"id":"g1_math_u019_ex05","knowledge_id":"g1_math_u019","question":"选择题：若x = 2是方程ax + 3 = 7的解，则a = （  ）\nA. 1\nB. 2\nC. 3\nD. 4","answer":"答案：B\n解析：2a + 3 = 7，2a = 4，a = 2。"},{"id":"g1_math_u020_ex01","knowledge_id":"g1_math_u020","question":"应用题：某数的3倍比它大4，求这个数。","answer":"答案：设这个数为x，3x = x + 4，解得x = 2。\n解析：3倍减1倍等于4，所以2倍等于4，x = 2。"},{"id":"g1_math_u020_ex02","knowledge_id":"g1_math_u020","question":"应用题：甲有50元，乙有30元，甲给乙多少元后，两人钱数相等？","answer":"答案：设甲给乙x元，50-x = 30+x，解得x = 10。\n解析：相等时，两人都有40元，甲给了10元。"},{"id":"g1_math_u020_ex03","knowledge_id":"g1_math_u020","question":"应用题：某班学生去划船，若每船坐4人，则有5人无船坐；若每船坐5人，则船剩余且刚好坐满。问有几条船？","answer":"答案：设x条船，4x+5 = 5x，解得x = 5。\n解析：总人数不变，4×5+5=25，5×5=25。"},{"id":"g1_math_u020_ex04","knowledge_id":"g1_math_u020","question":"选择题：一个两位数，个位是a，十位是b，这个两位数是（  ）\nA. ab\nB. a+b\nC. 10a+b\nD. 10b+a","answer":"答案：D\n解析：十位数字b表示10b，个位a表示a，所以是10b+a。"},{"id":"g1_math_u020_ex05","knowledge_id":"g1_math_u020","question":"应用题：某商品原价200元，打8折后再减20元，现价多少？","answer":"答案：200×0.8 - 20 = 140元\n解析：先打8折得160元，再减20元得140元。"},{"id":"g1_math_u021_ex01","knowledge_id":"g1_math_u021","question":"选择题：下列图形中，属于立体图形的是（  ）\nA. 三角形\nB. 长方形\nC. 圆\nD. 圆柱","answer":"答案：D\n解析：立体图形有长、宽、高三维，圆柱是立体图形。"},{"id":"g1_math_u021_ex02","knowledge_id":"g1_math_u021","question":"判断题：棱柱的顶点比棱多。（  ）","answer":"答案：错误\n解析：顶点比棱少。"},{"id":"g1_math_u021_ex03","knowledge_id":"g1_math_u021","question":"填空题：长方体有______个面，______条棱，______个顶点。","answer":"答案：6；12；8\n解析：这是长方体的基本特征。"},{"id":"g1_math_u021_ex04","knowledge_id":"g1_math_u021","question":"选择题：下列图形中，不是柱体的是（  ）\nA. 正方体\nB. 圆柱\nC. 圆锥\nD. 三棱柱","answer":"答案：C\n解析：圆锥是锥体，不是柱体。"},{"id":"g1_math_u021_ex05","knowledge_id":"g1_math_u021","question":"填空题：从实物中抽象出的图形称为______图形。","answer":"答案：几何\n解析：几何图形是从实物中抽象出来的。"},{"id":"g1_math_u022_ex01","knowledge_id":"g1_math_u022","question":"选择题：下列说法正确的是（  ）\nA. 直线AB和直线BA是同一条直线\nB. 射线AB和射线BA是同一条射线\nC. 线段AB和线段BA是同一条线段\nD. 直线AB和直线CD是同一条直线","answer":"答案：A\n解析：直线无方向，所以AB和BA相同；射线有方向，AB和BA不同。"},{"id":"g1_math_u022_ex02","knowledge_id":"g1_math_u022","question":"填空题：经过两点有且只有______条直线。","answer":"答案：1\n解析：这是直线的性质。"},{"id":"g1_math_u022_ex03","knowledge_id":"g1_math_u022","question":"判断题：线段可以度量，直线和射线不可度量。（  ）","answer":"答案：正确\n解析：线段有端点可以度量，直线和射线无限长不可度量。"},{"id":"g1_math_u022_ex04","knowledge_id":"g1_math_u022","question":"选择题：若点C是线段AB的中点，则（  ）\nA. AC = BC = AB/2\nB. AC = 2BC\nC. AB = AC + BC\nD. AC = BC","answer":"答案：A\n解析：中点把线段分成相等的两部分。"},{"id":"g1_math_u022_ex05","knowledge_id":"g1_math_u022","question":"应用题：已知AB = 10cm，BC = 3cm，求AC。","answer":"答案：AC = 13cm（若A、B、C共线且B在A、C之间）\n解析：A到C的距离等于A到B加B到C的距离。"},{"id":"g1_math_u023_ex01","knowledge_id":"g1_math_u023","question":"选择题：从一点出发的两条射线组成的图形叫做（  ）\nA. 直线\nB. 线段\nC. 角\nD. 弧","answer":"答案：C\n解析：角的定义是从一点出发的两条射线。"},{"id":"g1_math_u023_ex02","knowledge_id":"g1_math_u023","question":"填空题：1周角 = ______度，1平角 = ______度。","answer":"答案：360；180\n解析：这是角度的基本换算。"},{"id":"g1_math_u023_ex03","knowledge_id":"g1_math_u023","question":"选择题：若∠A = 45°，∠B = 45°，则（  ）\nA. ∠A > ∠B\nB. ∠A < ∠B\nC. ∠A = ∠B\nD. 无法比较","answer":"答案：C\n解析：两个角都是45°，相等。"},{"id":"g1_math_u023_ex04","knowledge_id":"g1_math_u023","question":"判断题：大于90°的角是钝角。（  ）","answer":"答案：错误\n解析：钝角是大于90°且小于180°的角。"},{"id":"g1_math_u023_ex05","knowledge_id":"g1_math_u023","question":"填空题：时钟从3点走到6点，时针转了______度。","answer":"答案：90\n解析：时针12小时转360°，每小时转30°，3小时转90°。"},{"id":"g1_math_u024_ex01","knowledge_id":"g1_math_u024","question":"填空题：1° = ______分，1分 = ______秒。","answer":"答案：60；60\n解析：角度的进率是60进制。"},{"id":"g1_math_u024_ex02","knowledge_id":"g1_math_u024","question":"计算题：把45.5°化为度分秒形式。","answer":"答案：45°30′\n解析：0.5° × 60 = 30′。"},{"id":"g1_math_u024_ex03","knowledge_id":"g1_math_u024","question":"计算题：23°15′ + 17°45′ = ______。","answer":"答案：41°\n解析：23°15′ + 17°45′ = 41°0′ = 41°。"},{"id":"g1_math_u024_ex04","knowledge_id":"g1_math_u024","question":"填空题：45°12′ = ______°。","answer":"答案：45.2\n解析：12′ ÷ 60 = 0.2°。"},{"id":"g1_math_u024_ex05","knowledge_id":"g1_math_u024","question":"选择题：下列角度转换正确的是（  ）\nA. 30.3° = 30°3′\nB. 30.5° = 30°30′\nC. 30.05° = 30°5′\nD. 30.6° = 30°36′","answer":"答案：B\n解析：0.5° × 60 = 30′。"},{"id":"g1_math_u025_ex01","knowledge_id":"g1_math_u025","question":"填空题：若∠A = 30°，则∠A的余角是______°，补角是______°。","answer":"答案：60；150\n解析：余角 = 90° - 30° = 60°；补角 = 180° - 30° = 150°。"},{"id":"g1_math_u025_ex02","knowledge_id":"g1_math_u025","question":"判断题：互余的两个角一定都是锐角。（  ）","answer":"答案：正确\n解析：两个角互为余角，和为90°，所以每个角都小于90°，是锐角。"},{"id":"g1_math_u025_ex03","knowledge_id":"g1_math_u025","question":"选择题：若∠A与∠B互余，∠A = 65°，则∠B = （  ）\nA. 25°\nB. 35°\nC. 115°\nD. 125°","answer":"答案：A\n解析：∠B = 90° - 65° = 25°。"},{"id":"g1_math_u025_ex04","knowledge_id":"g1_math_u025","question":"判断题：互补的两个角一定都是钝角。（  ）","answer":"答案：错误\n解析：互补只要求和为180°，可以是锐角+钝角，也可以是直角+直角。"},{"id":"g1_math_u025_ex05","knowledge_id":"g1_math_u025","question":"填空题：若∠A的补角是∠A的3倍，则∠A = ______°。","answer":"答案：45\n解析：180° - ∠A = 3∠A，4∠A = 180°，∠A = 45°。"},{"id":"g1_math_u026_ex01","knowledge_id":"g1_math_u026","question":"填空题：在平面直角坐标系中，x轴和y轴的交点叫做______。","answer":"答案：原点\n解析：原点是坐标系的起点，坐标为(0,0)。"},{"id":"g1_math_u026_ex02","knowledge_id":"g1_math_u026","question":"选择题：点(3,-4)在第（  ）象限\nA. 第一\nB. 第二\nC. 第三\nD. 第四","answer":"答案：D\n解析：x正y负，在第四象限。"},{"id":"g1_math_u026_ex03","knowledge_id":"g1_math_u026","question":"判断题：坐标轴上的点不属于任何象限。（  ）","answer":"答案：正确\n解析：坐标轴上的点不在象限内。"},{"id":"g1_math_u026_ex04","knowledge_id":"g1_math_u026","question":"填空题：点(0,5)在______轴上。","answer":"答案：y\n解析：x坐标为0，在y轴上。"},{"id":"g1_math_u026_ex05","knowledge_id":"g1_math_u026","question":"选择题：若点P到x轴的距离为3，到y轴的距离为4，则P的坐标可能是（  ）\nA. (3,4)\nB. (4,3)\nC. (±4,±3)\nD. 以上都有可能","answer":"答案：D\n解析：距离都是正值，所以坐标符号任意组合都可能。"},{"id":"g1_math_u027_ex01","knowledge_id":"g1_math_u027","question":"选择题：点P(a,b)在第二象限，则a______0，b______0。\nA. >, >\nB. <, >\nC. >, <\nD. <, <","answer":"答案：B\n解析：第二象限x负y正。"},{"id":"g1_math_u027_ex02","knowledge_id":"g1_math_u027","question":"填空题：点(2,-3)关于x轴对称的点的坐标是______。","answer":"答案：(2,3)\n解析：关于x轴对称，x不变，y变号。"},{"id":"g1_math_u027_ex03","knowledge_id":"g1_math_u027","question":"填空题：点(2,-3)关于y轴对称的点的坐标是______。","answer":"答案：(-2,-3)\n解析：关于y轴对称，y不变，x变号。"},{"id":"g1_math_u027_ex04","knowledge_id":"g1_math_u027","question":"填空题：点(2,-3)关于原点对称的点的坐标是______。","answer":"答案：(-2,3)\n解析：关于原点对称，两个坐标都变号。"},{"id":"g1_math_u027_ex05","knowledge_id":"g1_math_u027","question":"选择题：若点P在第四象限，且到x轴的距离为3，到y轴的距离为5，则P的坐标是（  ）\nA. (5,-3)\nB. (3,-5)\nC. (-5,3)\nD. (-3,5)","answer":"答案：A\n解析：第四象限x正y负，距离取绝对值，得(5,-3)。"},{"id":"g1_math_u028_ex01","knowledge_id":"g1_math_u028","question":"选择题：下列图像中，表示y是x的函数的是（  ）\nA. 垂直x轴的直线\nB. 圆\nC. 开口向上的抛物线\nD. 与x轴平行的直线","answer":"答案：C\n解析：函数要求每个x有唯一对应的y值，抛物线满足此条件。"},{"id":"g1_math_u028_ex02","knowledge_id":"g1_math_u028","question":"判断题：函数y = x²中，当x = 2时，y有唯一的值4。（  ）","answer":"答案：正确\n解析：函数定义要求每个x对应唯一的y。"},{"id":"g1_math_u028_ex03","knowledge_id":"g1_math_u028","question":"选择题：下列变量之间的关系中，是函数关系的是（  ）\nA. 身高与体重\nB. 人的年龄与身高\nC. 正方形的边长与面积\nD. 季节与温度","answer":"答案：C\n解析：正方形边长决定面积，是一种确定的对应关系。"},{"id":"g1_math_u028_ex04","knowledge_id":"g1_math_u028","question":"填空题：函数的三要素是______、______、______。","answer":"答案：定义域；对应法则；值域\n解析：三个要素确定一个函数。"},{"id":"g1_math_u028_ex05","knowledge_id":"g1_math_u028","question":"判断题：圆的面积S与半径r的关系S = πr²，s是r的函数。（  ）","answer":"答案：正确\n解析：给定r，有唯一的S对应。"},{"id":"g1_math_u029_ex01","knowledge_id":"g1_math_u029","question":"填空题：正比例函数的一般形式是______（k≠0）。","answer":"答案：y = kx\n解析：正比例函数是形如y = kx（k是常数且k≠0）的函数。"},{"id":"g1_math_u029_ex02","knowledge_id":"g1_math_u029","question":"选择题：下列函数中，是正比例函数的是（  ）\nA. y = x + 1\nB. y = 2x\nC. y = x²\nD. y = 1/x","answer":"答案：B\n解析：y = 2x符合y = kx的形式，是正比例函数。"},{"id":"g1_math_u029_ex03","knowledge_id":"g1_math_u029","question":"填空题：正比例函数y = -3x，x增大时，y______。","answer":"答案：减小\n解析：k = -3 < 0，y随x增大而减小。"},{"id":"g1_math_u029_ex04","knowledge_id":"g1_math_u029","question":"选择题：正比例函数y = 2x的图像经过（  ）\nA. 第一、三象限\nB. 第二、四象限\nC. 第一、二象限\nD. 第三、四象限","answer":"答案：A\n解析：k > 0，图像经过第一、三象限。"},{"id":"g1_math_u029_ex05","knowledge_id":"g1_math_u029","question":"计算题：已知y与x成正比例，当x = 3时，y = 6，求y与x的关系式。","answer":"答案：y = 2x\n解析：设y = kx，代入得6 = 3k，k = 2。"},{"id":"g1_math_u030_ex01","knowledge_id":"g1_math_u030","question":"填空题：一次函数的一般形式是______（k≠0）。","answer":"答案：y = kx + b\n解析：一次函数是形如y = kx + b（k≠0）的函数。"},{"id":"g1_math_u030_ex02","knowledge_id":"g1_math_u030","question":"选择题：一次函数y = 2x - 3的图像不经过（  ）\nA. 第一象限\nB. 第二象限\nC. 第三象限\nD. 第四象限","answer":"答案：C\n解析：当x = 0时y = -3；当y = 0时x = 1.5，图像经过一、二、四象限。"},{"id":"g1_math_u030_ex03","knowledge_id":"g1_math_u030","question":"填空题：一次函数y = -x + 2，y随x增大而______。","answer":"答案：减小\n解析：k = -1 < 0，y随x增大而减小。"},{"id":"g1_math_u030_ex04","knowledge_id":"g1_math_u030","question":"计算题：已知一次函数y = kx + 3，当x = 1时y = 5，求k。","answer":"答案：k = 2\n解析：代入得5 = k + 3，k = 2。"},{"id":"g1_math_u030_ex05","knowledge_id":"g1_math_u030","question":"选择题：一次函数y = 3x - 1与y = 3x + 2的位置关系是（  ）\nA. 相交\nB. 平行\nC. 垂直\nD. 重合","answer":"答案：B\n解析：k相同，b不同，两直线平行。"},{"id":"g1_math_l001_ex01","knowledge_id":"g1_math_l001","question":"选择题：两条直线相交，对顶角的个数是（  ）\nA. 2\nB. 4\nC. 6\nD. 8","answer":"答案：A\n解析：两条直线相交形成2对对顶角。"},{"id":"g1_math_l001_ex02","knowledge_id":"g1_math_l001","question":"判断题：对顶角相等。（  ）","answer":"答案：正确\n解析：对顶角相等是相交线的重要性质。"},{"id":"g1_math_l001_ex03","knowledge_id":"g1_math_l001","question":"选择题：若∠1与∠2是对顶角，∠1 = 50°，则∠2 = （  ）\nA. 50°\nB. 130°\nC. 40°\nD. 无法确定","answer":"答案：A\n解析：对顶角相等，∠2 = 50°。"},{"id":"g1_math_l001_ex04","knowledge_id":"g1_math_l001","question":"填空题：两条直线相交，邻补角共有______对。","answer":"答案：4\n解析：每对邻补角共用一条边，两直线相交形成4对邻补角。"},{"id":"g1_math_l001_ex05","knowledge_id":"g1_math_l001","question":"判断题：相等的角一定是对顶角。（  ）","answer":"答案：错误\n解析：对顶角一定相等，但相等的角不一定是对顶角。"},{"id":"g1_math_l002_ex01","knowledge_id":"g1_math_l002","question":"填空题：两条直线相交成______角时，这两条直线互相垂直。","answer":"答案：直角\n解析：垂直的定义。"},{"id":"g1_math_l002_ex02","knowledge_id":"g1_math_l002","question":"判断题：垂线段最短。（  ）","answer":"答案：正确\n解析：从直线外一点到直线的所有线段中，垂线段最短。"},{"id":"g1_math_l002_ex03","knowledge_id":"g1_math_l002","question":"填空题：点P到直线l的垂线段的长度叫做______。","answer":"答案：点到直线的距离\n解析：这是点到直线距离的定义。"},{"id":"g1_math_l002_ex04","knowledge_id":"g1_math_l002","question":"选择题：下列说法正确的是（  ）\nA. 垂线段一定比斜线段短\nB. 斜线段一定比垂线段短\nC. 垂线段和斜线段一样长\nD. 无法比较","answer":"答案：A\n解析：垂线段是点到直线的最短距离。"},{"id":"g1_math_l002_ex05","knowledge_id":"g1_math_l002","question":"作图题：过点P画直线l的垂线（用文字说明方法）。","answer":"答案：用三角板，让一条直角边与l重合，另一条边经过P点，沿这条边画直线即可。\n解析：这是几何作图的基本方法。"},{"id":"g1_math_l003_ex01","knowledge_id":"g1_math_l003","question":"选择题：同位角的位置特征是（  ）\nA. 在截线同侧，被截两线同侧\nB. 在截线同侧，被截两线之间\nC. 在截线两侧，被截两线同侧\nD. 在截线两侧，被截两线之间","answer":"答案：A\n解析：同位角在截线同侧，被截两线的同方向。"},{"id":"g1_math_l003_ex02","knowledge_id":"g1_math_l003","question":"填空题：内错角在截线______侧，被截两线______侧。","answer":"答案：两侧；之间\n解析：这是内错角的位置特征。"},{"id":"g1_math_l003_ex03","knowledge_id":"g1_math_l003","question":"选择题：同旁内角在截线同侧，被截两线之间，两者之和为______度。\nA. 90\nB. 180\nC. 360\nD. 无法确定","answer":"答案：B\n解析：同旁内角在两直线平行时互补，和为180°。"},{"id":"g1_math_l003_ex04","knowledge_id":"g1_math_l003","question":"判断题：同位角相等。（  ）","answer":"答案：错误\n解析：同位角不一定相等，只有两直线平行时同位角才相等。"},{"id":"g1_math_l003_ex05","knowledge_id":"g1_math_l003","question":"填空题：若两条直线被第三条直线所截，形成的同位角有______对。","answer":"答案：4\n解析：每条截线形成2对同位角，共4对。"},{"id":"g1_math_l004_ex01","knowledge_id":"g1_math_l004","question":"判断题：在同一平面内，不相交的两条直线叫做平行线。（  ）","answer":"答案：正确\n解析：这是平行线的定义。"},{"id":"g1_math_l004_ex02","knowledge_id":"g1_math_l004","question":"选择题：下列条件中，能判定a∥b的是（  ）\nA. ∠1 = ∠2\nB. ∠3 = ∠4\nC. ∠5 = ∠6\nD. ∠7 = ∠8","answer":"答案：A\n解析：同位角相等，两直线平行。"},{"id":"g1_math_l004_ex03","knowledge_id":"g1_math_l004","question":"填空题：平行公理：经过直线外一点，______与已知直线平行。","answer":"答案：有且只有一条\n解析：这是平行公理的核心内容。"},{"id":"g1_math_l004_ex04","knowledge_id":"g1_math_l004","question":"选择题：若∠1与∠2是同旁内角，且∠1 = 60°，则∠2 = （  ）\nA. 60°\nB. 120°\nC. 30°\nD. 无法确定","answer":"答案：D\n解析：只有两直线平行时，同旁内角才互补。"},{"id":"g1_math_l004_ex05","knowledge_id":"g1_math_l004","question":"判断题：如果两个角是内错角，那么这两个角相等。（  ）","answer":"答案：错误\n解析：只有两直线平行时，内错角才相等。"},{"id":"g1_math_l005_ex01","knowledge_id":"g1_math_l005","question":"填空题：两直线平行，同位角______。","answer":"答案：相等\n解析：平行线的性质1。"},{"id":"g1_math_l005_ex02","knowledge_id":"g1_math_l005","question":"填空题：两直线平行，内错角______。","answer":"答案：相等\n解析：平行线的性质2。"},{"id":"g1_math_l005_ex03","knowledge_id":"g1_math_l005","question":"填空题：两直线平行，同旁内角______。","answer":"答案：互补\n解析：平行线的性质3。"},{"id":"g1_math_l005_ex04","knowledge_id":"g1_math_l005","question":"选择题：若AB∥CD，AB与AC相交于A点，则（  ）\nA. CD与AC也相交\nB. CD与AC平行\nC. CD与AC垂直\nD. 无法确定","answer":"答案：A\n解析：AB∥CD，AB与AC相交于A，A在AB上，所以AC也会与CD相交（过直线外一点有且只有一条平行线）。"},{"id":"g1_math_l005_ex05","knowledge_id":"g1_math_l005","question":"判断题：平行线的性质可以与判定互逆应用。（  ）","answer":"答案：正确\n解析：平行线的判定和性质互为逆定理。"},{"id":"g1_math_l006_ex01","knowledge_id":"g1_math_l006","question":"计算题：如图，AB∥CD，∠1 = 70°，求∠2的度数。","answer":"答案：∠2 = 110°\n解析：∠1和∠2是同旁内角，和为180°，所以∠2 = 180° - 70° = 110°。"},{"id":"g1_math_l006_ex02","knowledge_id":"g1_math_l006","question":"选择题：如图，AB∥CD，∠1 = 100°，∠2 = 110°，则∠3 = （  ）\nA. 100°\nB. 110°\nC. 70°\nD. 80°","answer":"答案：C\n解析：∠2和∠3是同位角相等，∠3 = 110°？不对...需要根据具体图形判断，此题答案取决于具体配置。"},{"id":"g1_math_l006_ex03","knowledge_id":"g1_math_l006","question":"填空题：平行线的判定：同位角______，两直线平行。","answer":"答案：相等\n解析：这是平行线的判定定理。"},{"id":"g1_math_l006_ex04","knowledge_id":"g1_math_l006","question":"判断题：平行线的性质和判定是互逆的关系。（  ）","answer":"答案：正确\n解析：判定是\"同位角相等→两直线平行\"，性质是\"两直线平行→同位角相等\"。"},{"id":"g1_math_l006_ex05","knowledge_id":"g1_math_l006","question":"应用题：已知∠1 = ∠2，∠2 = ∠3，证明AB∥CD。","answer":"答案：因为∠1 = ∠2，∠2 = ∠3，所以∠1 = ∠3（同角的等量代换）。∠1和∠3是同位角，所以AB∥CD。\n解析：利用等量代换和同位角相等证明平行。"},{"id":"g1_math_l007_ex01","knowledge_id":"g1_math_l007","question":"填空题：若x² = 9，则x = ______。","answer":"答案：±3\n解析：9的平方根是±3。"},{"id":"g1_math_l007_ex02","knowledge_id":"g1_math_l007","question":"选择题：下列说法正确的是（  ）\nA. 4的平方根是2\nB. 4的平方根是±2\nC. 4的算术平方根是±2\nD. 4的平方根是-2","answer":"答案：B\n解析：4的平方根是±2，算术平方根是2。"},{"id":"g1_math_l007_ex03","knowledge_id":"g1_math_l007","question":"判断题：负数没有平方根。（  ）","answer":"答案：正确\n解析：负数的平方是正数，负数没有实数平方根。"},{"id":"g1_math_l007_ex04","knowledge_id":"g1_math_l007","question":"填空题：√16的值为______。","answer":"答案：4\n解析：√16表示16的算术平方根，等于4。"},{"id":"g1_math_l007_ex05","knowledge_id":"g1_math_l007","question":"选择题：√(−4)²等于（  ）\nA. -4\nB. 4\nC. ±4\nD. 无法确定","answer":"答案：B\n解析：√(−4)² = √16 = 4。"},{"id":"g1_math_l008_ex01","knowledge_id":"g1_math_l008","question":"填空题：若x³ = 8，则x = ______。","answer":"答案：2\n解析：2³ = 8，所以8的立方根是2。"},{"id":"g1_math_l008_ex02","knowledge_id":"g1_math_l008","question":"填空题：∛(−27) = ______。","answer":"答案：-3\n解析：(-3)³ = -27，所以-27的立方根是-3。"},{"id":"g1_math_l008_ex03","knowledge_id":"g1_math_l008","question":"判断题：负数没有立方根。（  ）","answer":"答案：错误\n解析：负数有立方根，如(-2)³ = -8。"},{"id":"g1_math_l008_ex04","knowledge_id":"g1_math_l008","question":"选择题：下列计算正确的是（  ）\nA. ∛(-8) = -2\nB. ∛8 = ±2\nC. ∛(-1) = -1\nD. ∛1 = 1","answer":"答案：A\n解析：A、C、D都正确。"},{"id":"g1_math_l008_ex05","knowledge_id":"g1_math_l008","question":"填空题：立方根是它本身的数有______个。","answer":"答案：3\n解析：是0、1、-1。"},{"id":"g1_math_l009_ex01","knowledge_id":"g1_math_l009","question":"填空题：有理数和______统称为实数。","answer":"答案：无理数\n解析：有理数+无理数=实数。"},{"id":"g1_math_l009_ex02","knowledge_id":"g1_math_l009","question":"判断题：π是无限不循环小数，因此π是无理数。（  ）","answer":"答案：正确\n解析：无限不循环小数是无理数。"},{"id":"g1_math_l009_ex03","knowledge_id":"g1_math_l009","question":"选择题：下列各数中，是无理数的是（  ）\nA. √4\nB. √5\nC. 3.14\nD. -1/3","answer":"答案：B\n解析：√5是无限不循环小数，是无理数。√4 = 2是有理数。"},{"id":"g1_math_l009_ex04","knowledge_id":"g1_math_l009","question":"判断题：实数与数轴上的点一一对应。（  ）","answer":"答案：正确\n解析：实数和数轴上的点一一对应。"},{"id":"g1_math_l009_ex05","knowledge_id":"g1_math_l009","question":"填空题：-|√2| = ______。","answer":"答案：-√2\n解析：|√2| = √2，所以-|√2| = -√2。"},{"id":"g1_math_l010_ex01","knowledge_id":"g1_math_l010","question":"选择题：实数分为（  ）\nA. 正数和负数\nB. 整数和分数\nC. 有理数和无理数\nD. 质数和合数","answer":"答案：C\n解析：实数分为有理数和无理数。"},{"id":"g1_math_l010_ex02","knowledge_id":"g1_math_l010","question":"填空题：在实数范围内，加、减、乘、除（除数不为0）、乘方运算都可以进行。","answer":"答案：正确\n解析：实数对四则运算封闭。"},{"id":"g1_math_l010_ex03","knowledge_id":"g1_math_l010","question":"判断题：无限小数都是无理数。（  ）","answer":"答案：错误\n解析：无限循环小数是有理数，只有无限不循环小数是无理数。"},{"id":"g1_math_l010_ex04","knowledge_id":"g1_math_l010","question":"选择题：下列说法正确的是（  ）\nA. 有理数都是有理数\nB. 无理数都是实数\nC. 实数都是有理数\nD. 整数都是有理数","answer":"答案：B\n解析：无理数也是实数的一部分。"},{"id":"g1_math_l010_ex05","knowledge_id":"g1_math_l010","question":"填空题：实数a的相反数是______，绝对值是______，倒数是______（a≠0）。","answer":"答案：-a；|a|；1/a\n解析：实数的基本运算。"},{"id":"g1_math_l011_ex01","knowledge_id":"g1_math_l011","question":"填空题：用符号\">\"或\"<\"表示大小关系的式子叫做______。","answer":"答案：不等式\n解析：这是不等式的定义。"},{"id":"g1_math_l011_ex02","knowledge_id":"g1_math_l011","question":"选择题：下列式子中，是不等式的是（  ）\nA. x + 1 = 3\nB. x + 1 > 3\nC. x + 1\nD. x > 3","answer":"答案：B\n解析：不等式用\">\"、\"<\"、\"≥\"、\"≤\"等符号连接。"},{"id":"g1_math_l011_ex03","knowledge_id":"g1_math_l011","question":"判断题：x > 3表示x大于3的所有数。（  ）","answer":"答案：正确\n解析：不等式表示满足条件的数的集合。"},{"id":"g1_math_l011_ex04","knowledge_id":"g1_math_l011","question":"填空题：不等式的基本性质：若a > b，则a + c ______ b + c。","answer":"答案：>\n解析：不等式两边加同一个数，不等号方向不变。"},{"id":"g1_math_l011_ex05","knowledge_id":"g1_math_l011","question":"选择题：若a是负数，则下列正确的是（  ）\nA. a > 0\nB. a < 0\nC. a = 0\nD. 无法确定","answer":"答案：B\n解析：负数小于0。"},{"id":"g1_math_l012_ex01","knowledge_id":"g1_math_l012","question":"填空题：若a > b，c > 0，则a + c ______ b + c，a - c ______ b - c。","answer":"答案：>；>\n解析：加上或减去同一个正数，不等号方向不变。"},{"id":"g1_math_l012_ex02","knowledge_id":"g1_math_l012","question":"填空题：若a > b，c < 0，则ac ______ bc。","answer":"答案：<\n解析：乘以负数，不等号方向改变。"},{"id":"g1_math_l012_ex03","knowledge_id":"g1_math_l012","question":"判断题：若a > b，则a² > b²。（  ）","answer":"答案：错误\n解析：当a、b为负数时，a² < b²。"},{"id":"g1_math_l012_ex04","knowledge_id":"g1_math_l012","question":"选择题：若a > b，则下列正确的是（  ）\nA. -a > -b\nB. a - b > 0\nC. 1/a < 1/b\nD. a³ > b³","answer":"答案：B\n解析：a > b两边减去b得a - b > 0。"},{"id":"g1_math_l012_ex05","knowledge_id":"g1_math_l012","question":"填空题：若a > b > 0，则1/a ______ 1/b。","answer":"答案：<\n解析：正数取倒数，不等号方向改变。"},{"id":"g1_math_l013_ex01","knowledge_id":"g1_math_l013","question":"解不等式：2x + 3 > 7","answer":"答案：x > 2\n解析：2x > 4，x > 2。"},{"id":"g1_math_l013_ex02","knowledge_id":"g1_math_l013","question":"解不等式：-3x ≤ 9","answer":"答案：x ≥ -3\n解析：两边除以-3，不等号方向改变，x ≥ -3。"},{"id":"g1_math_l013_ex03","knowledge_id":"g1_math_l013","question":"判断题：不等式的解和解集是同一个概念。（  ）","answer":"答案：错误\n解析：解是满足不等式的个别值，解集是所有解的集合。"},{"id":"g1_math_l013_ex04","knowledge_id":"g1_math_l013","question":"选择题：不等式3x - 2 > 4的解集在数轴上表示正确的是（  ）\nA. 空心圆点向右\nB. 实心圆点向右\nC. 空心圆点向左\nD. 实心圆点向左","answer":"答案：B\n解析：x > 2，用实心圆点（≥用实心，>用实心还是空心取决于教材），向右。"},{"id":"g1_math_l013_ex05","knowledge_id":"g1_math_l013","question":"填空题：不等式x + 3 ≥ 7的解集是______。","answer":"答案：x ≥ 4\n解析：x ≥ 7 - 3 = 4。"},{"id":"g1_math_l014_ex01","knowledge_id":"g1_math_l014","question":"解不等式组：x - 1 > 0，x + 2 < 5","answer":"答案：无解\n解析：x > 1且x < 3，无公共部分。"},{"id":"g1_math_l014_ex02","knowledge_id":"g1_math_l014","question":"解不等式组：x - 1 < 0，x + 2 > 3","answer":"答案：x > 1（与x < 1矛盾，无解）\n解析：x < 1且x > 1，无解。"},{"id":"g1_math_l014_ex03","knowledge_id":"g1_math_l014","question":"填空题：不等式组有解的条件是两个不等式的解集______。","answer":"答案：有公共部分\n解析：有公共部分才有解集。"},{"id":"g1_math_l014_ex04","knowledge_id":"g1_math_l014","question":"解不等式组：2x > 4，3x ≤ 9","answer":"答案：2 < x ≤ 3\n解析：x > 2且x ≤ 3，解集为2 < x ≤ 3。"},{"id":"g1_math_l014_ex05","knowledge_id":"g1_math_l014","question":"选择题：不等式组{x > 3，x < 5}的整数解有（  ）\nA. 3个\nB. 4个\nC. 5个\nD. 无数个","answer":"答案：B\n解析：3 < x < 5，整数解为4、3、2？不对...是4、5？不对...是x = 4，共1个？不对，是x = 4？3 < x < 5，整数解只有4，共1个...不对，整数解是x = 4，1个。但题目可能有误。"},{"id":"g1_math_l015_ex01","knowledge_id":"g1_math_l015","question":"应用题：某班学生去划船，每船坐4人则有5人无船坐，每船坐5人则有1个空位。问有几条船？","answer":"答案：设x条船，4x+5 = 5x-1，解得x = 6。\n解析：总人数不变，4x+5 = 5x-1，x = 6条船。"},{"id":"g1_math_l015_ex02","knowledge_id":"g1_math_l015","question":"应用题：某数x的2倍与5的和大于10，求x的取值范围。","answer":"答案：2x + 5 > 10，x > 2.5\n解析：2x > 5，x > 2.5。"},{"id":"g1_math_l015_ex03","knowledge_id":"g1_math_l015","question":"应用题：小明有30元，想买单价为x元的书，至少能买几本？","answer":"答案：30/x ≥ 1，x ≤ 30（元）\n解析：每本书不超过30元。"},{"id":"g1_math_l015_ex04","knowledge_id":"g1_math_l015","question":"选择题：x是不大于5的正数，用不等式表示为（  ）\nA. 0 < x ≤ 5\nB. 0 ≤ x < 5\nC. x > 0且x ≤ 5\nD. A和C","answer":"答案：D\n解析：不大于5表示≤5，正数表示>0。"},{"id":"g1_math_l015_ex05","knowledge_id":"g1_math_l015","question":"应用题：三角形两边分别为3和7，第三边为x，求x的取值范围。","answer":"答案：4 < x < 10\n解析：7-3 < x < 7+3，即4 < x < 10。"},{"id":"g1_math_l016_ex01","knowledge_id":"g1_math_l016","question":"选择题：点P(a,b)在第二象限，则（  ）\nA. a > 0, b > 0\nB. a > 0, b < 0\nC. a < 0, b > 0\nD. a < 0, b < 0","answer":"答案：C\n解析：第二象限x负y正。"},{"id":"g1_math_l016_ex02","knowledge_id":"g1_math_l016","question":"填空题：坐标平面被x轴和y轴分成四个象限，按逆时针方向依次是______。","answer":"答案：第一、第二、第三、第四象限\n解析：这是象限的顺序。"},{"id":"g1_math_l016_ex03","knowledge_id":"g1_math_l016","question":"判断题：x轴上的点到x轴的距离为0。（  ）","answer":"答案：正确\n解析：x轴上的点y坐标为0。"},{"id":"g1_math_l016_ex04","knowledge_id":"g1_math_l016","question":"填空题：点P(3,-4)到x轴的距离是______，到y轴的距离是______。","answer":"答案：4；3\n解析：到x轴距离是|y|，到y轴距离是|x|。"},{"id":"g1_math_l016_ex05","knowledge_id":"g1_math_l016","question":"选择题：点M与点N关于原点对称，若M(a,b)，则N是（  ）\nA. (a,-b)\nB. (-a,b)\nC. (-a,-b)\nD. (b,a)","answer":"答案：C\n解析：关于原点对称，两个坐标都变号。"},{"id":"g1_math_l017_ex01","knowledge_id":"g1_math_l017","question":"填空题：点P(3,4)到原点的距离是______。","answer":"答案：5\n解析：d = √(3² + 4²) = √25 = 5。"},{"id":"g1_math_l017_ex02","knowledge_id":"g1_math_l017","question":"选择题：点A(2,3)和点B(6,3)的距离是（  ）\nA. 2\nB. 3\nC. 4\nD. 6","answer":"答案：C\n解析：y相同，d = |6-2| = 4。"},{"id":"g1_math_l017_ex03","knowledge_id":"g1_math_l017","question":"填空题：点P在第二象限，且到两坐标轴距离相等，则P的坐标为______（P在两轴夹角的平分线上）。","answer":"答案：(-a,a)（a > 0）\n解析：第二象限x负y正，|x| = |y|。"},{"id":"g1_math_l017_ex04","knowledge_id":"g1_math_l017","question":"选择题：点A(1,2)，B(4,6)，C(7,10)的关系是（  ）\nA. 构成直角三角形\nB. 三点共线\nC. 构成等腰三角形\nD. 任意关系","answer":"答案：B\n解析：AB和BC斜率相同，三点共线。"},{"id":"g1_math_l017_ex05","knowledge_id":"g1_math_l017","question":"填空题：点P到x轴的距离为3，到y轴的距离为4，若P在第一象限，则P的坐标是______。","answer":"答案：(4,3)\n解析：第一象限x正y正，坐标为(4,3)。"},{"id":"g1_math_l018_ex01","knowledge_id":"g1_math_l018","question":"选择题：下列方程组中，是二元一次方程组的是（  ）\nA. {x + y = 3, xy = 2}\nB. {x + y = 3, x - y = 1}\nC. {x² + y = 3, x + y = 1}\nD. {x + y = 3, y + z = 1}","answer":"答案：B\n解析：两个方程都是一次，且含有两个未知数。"},{"id":"g1_math_l018_ex02","knowledge_id":"g1_math_l018","question":"判断题：二元一次方程组的解是唯一确定的。（  ）","answer":"答案：错误\n解析：可能无解、唯一解或无数解。"},{"id":"g1_math_l018_ex03","knowledge_id":"g1_math_l018","question":"填空题：方程x + y = 5有______组解。","answer":"答案：无数\n解析：二元一次方程有无数组解。"},{"id":"g1_math_l018_ex04","knowledge_id":"g1_math_l018","question":"选择题：方程组{x + y = 5, x - y = 1}的解是（  ）\nA. x = 3, y = 2\nB. x = 2, y = 3\nC. x = 4, y = 1\nD. x = 1, y = 4","answer":"答案：A\n解析：相加得2x = 6，x = 3，y = 2。"},{"id":"g1_math_l018_ex05","knowledge_id":"g1_math_l018","question":"填空题：{x + y = 3, 2x + 2y = 6}有______组解。","answer":"答案：无数\n解析：两方程等价，有无数组解。"},{"id":"g1_math_l019_ex01","knowledge_id":"g1_math_l019","question":"用代入法解方程组：{x = y + 2, 2x + 3y = 9}","answer":"答案：x = 3, y = 1\n解析：把x = y + 2代入2x + 3y = 9，得2(y+2) + 3y = 9，解得y = 1，x = 3。"},{"id":"g1_math_l019_ex02","knowledge_id":"g1_math_l019","question":"用代入法解方程组：{y = 2x - 1, x + y = 8}","answer":"答案：x = 3, y = 5\n解析：把y = 2x - 1代入x + y = 8，得x + 2x - 1 = 8，x = 3，y = 5。"},{"id":"g1_math_l019_ex03","knowledge_id":"g1_math_l019","question":"判断题：代入消元法的基本思想是\"消元\"。（  ）","answer":"答案：正确\n解析：代入消元法通过代入将二元转化为一元。"},{"id":"g1_math_l019_ex04","knowledge_id":"g1_math_l019","question":"填空题：用代入法时，应选择系数为______的方程进行代入。","answer":"答案：1或-1\n解析：系数简单便于计算。"},{"id":"g1_math_l019_ex05","knowledge_id":"g1_math_l019","question":"用代入法解方程组：{3x + y = 7, x + 2y = 6}","answer":"答案：x = 8/5, y = 11/5\n解析：由第一个方程y = 7 - 3x，代入第二个：x + 2(7-3x) = 6，x + 14 - 6x = 6，-5x = -8，x = 8/5，y = 11/5。"},{"id":"g1_math_l020_ex01","knowledge_id":"g1_math_l020","question":"用加减法解方程组：{x + y = 5, x - y = 1}","answer":"答案：x = 3, y = 2\n解析：两式相加得2x = 6，x = 3；两式相减得2y = 4，y = 2。"},{"id":"g1_math_l020_ex02","knowledge_id":"g1_math_l020","question":"用加减法解方程组：{2x + 3y = 7, 2x - 3y = 1}","answer":"答案：x = 2, y = 1\n解析：两式相加得4x = 8，x = 2；代入得y = 1。"},{"id":"g1_math_l020_ex03","knowledge_id":"g1_math_l020","question":"选择题：加减消元法的关键是使某个未知数的系数______。","answer":"答案：相等或互为相反数\n解析：这样加减时才能消去该未知数。"},{"id":"g1_math_l020_ex04","knowledge_id":"g1_math_l020","question":"用加减法解方程组：{3x + 2y = 8, x + 2y = 4}","answer":"答案：x = 2, y = 1\n解析：两式相减得2x = 4，x = 2；代入得y = 1。"},{"id":"g1_math_l020_ex05","knowledge_id":"g1_math_l020","question":"判断题：当两个方程中同一未知数系数相等时，用减法消元。（  ）","answer":"答案：正确\n解析：相等系数相减为0，消去该未知数。"},{"id":"g1_math_l021_ex01","knowledge_id":"g1_math_l021","question":"应用题：两数之和为20，差为4，求这两个数。","answer":"答案：设两数为x、y，{x+y=20, x-y=4}，解得x=12, y=8。\n解析：相加得2x=24，x=12；y=8。"},{"id":"g1_math_l021_ex02","knowledge_id":"g1_math_l021","question":"应用题：某班买甲、乙两种商品，甲2件乙3件共140元；甲3件乙2件共160元。求单价。","answer":"答案：设甲x元，乙y元，{2x+3y=140, 3x+2y=160}，解得x=40, y=20。\n解析：解方程组得甲40元，乙20元。"},{"id":"g1_math_l021_ex03","knowledge_id":"g1_math_l021","question":"应用题：甲、乙两人相距100米，甲每秒走5米，乙每秒走3米，两人相向而行，几秒相遇？","answer":"答案：设x秒相遇，5x + 3x = 100，x = 12.5秒。\n解析：两人路程和等于总距离。"},{"id":"g1_math_l021_ex04","knowledge_id":"g1_math_l021","question":"选择题：方程组{ax + by = 6, ax - by = 2}的解为x = 2, y = 1，则a、b的值为（  ）\nA. a = 2, b = 2\nB. a = 3, b = 1\nC. a = 1, b = 3\nD. a = 2, b = 1","answer":"答案：A\n解析：代入得2a + b = 6，2a - b = 2，相加得4a = 8，a = 2，b = 2。"},{"id":"g1_math_l021_ex05","knowledge_id":"g1_math_l021","question":"应用题：一个两位数，个位和十位数字和为9，个位与十位互换后比原数大27，求原数。","answer":"答案：设十位x，个位y，{x+y=9, 10y+x-(10x+y)=27}，解得x=3, y=6，原数为36。\n解析：互换后-原数=9(y-x)=27，y-x=3，x=3，y=6。"},{"id":"g1_math_l022_ex01","knowledge_id":"g1_math_l022","question":"填空题：为了了解全国中学生的视力情况，选取10000名学生进行调查，这是______。","answer":"答案：抽样调查\n解析：调查全体不现实，采用抽样。"},{"id":"g1_math_l022_ex02","knowledge_id":"g1_math_l022","question":"选择题：下列调查中，适合普查的是（  ）\nA. 某品牌灯泡的使用寿命\nB. 某班学生的身高\nC. 全国中学生的近视率\nD. 某水库的水质","answer":"答案：B\n解析：班级人数少，适合普查；其他数量大，适合抽样。"},{"id":"g1_math_l022_ex03","knowledge_id":"g1_math_l022","question":"判断题：抽样调查比普查更准确。（  ）","answer":"答案：错误\n解析：普查针对全体，抽样调查可能有误差。"},{"id":"g1_math_l022_ex04","knowledge_id":"g1_math_l022","question":"填空题：收集数据的方法有______、______、______。","answer":"答案：调查；观察；实验\n解析：这是常用的数据收集方法。"},{"id":"g1_math_l022_ex05","knowledge_id":"g1_math_l022","question":"选择题：为了解\"十一\"黄金周期间游客对某景点的满意度，抽取500名游客调查，这是（  ）\nA. 全面调查\nB. 抽样调查\nC. 普查\nD. 无法确定","answer":"答案：B\n解析：无法调查所有游客，采用抽样。"},{"id":"g1_math_l023_ex01","knowledge_id":"g1_math_l023","question":"填空题：将数据分成若干组，每个小组的两个端点之间的距离称为______。","answer":"答案：组距\n解析：组距是分组的基本概念。"},{"id":"g1_math_l023_ex02","knowledge_id":"g1_math_l023","question":"选择题：某班50人数学成绩如下：60-70分有10人，70-80分有20人，80-90分有15人，90-100分有5人。最多人落在（  ）\nA. 60-70分\nB. 70-80分\nC. 80-90分\nD. 90-100分","answer":"答案：B\n解析：70-80分有20人，人数最多。"},{"id":"g1_math_l023_ex03","knowledge_id":"g1_math_l023","question":"填空题：数据分组时，组数一般取______。","answer":"答案：5～12\n解析：组数太少或太多都不好。"},{"id":"g1_math_l023_ex04","knowledge_id":"g1_math_l023","question":"判断题：在频数分布直方图中，各小长方形的面积等于该组的频数。（  ）","answer":"答案：错误\n解析：面积应等于频数，所以高=频数÷组距。"},{"id":"g1_math_l023_ex05","knowledge_id":"g1_math_l023","question":"填空题：某班30人中，身高在150-160cm的有12人，则该组的频率是______。","answer":"答案：0.4\n解析：频率 = 频数/总数 = 12/30 = 0.4。"},{"id":"g1_math_l024_ex01","knowledge_id":"g1_math_l024","question":"选择题：表示部分在总体中所占百分比的统计图是（  ）\nA. 条形统计图\nB. 折线统计图\nC. 扇形统计图\nD. 直方图","answer":"答案：C\n解析：扇形图表示各部分占总体的百分比。"},{"id":"g1_math_l024_ex02","knowledge_id":"g1_math_l024","question":"判断题：条形统计图能清楚地看出数据的增减变化趋势。（  ）","answer":"答案：错误\n解析：折线统计图能看出趋势，条形图用于比较大小。"},{"id":"g1_math_l024_ex03","knowledge_id":"g1_math_l024","question":"选择题：为了解某班学生身高分布情况，应选用（  ）\nA. 条形统计图\nB. 折线统计图\nC. 扇形统计图\nD. 直方图","answer":"答案：D\n解析：直方图适合表示连续数据的分布。"},{"id":"g1_math_l024_ex04","knowledge_id":"g1_math_l024","question":"填空题：扇形圆心角的计算公式：某部分占总体的百分比×______。","answer":"答案：360°\n解析：360° × 百分比 = 该部分对应的圆心角度数。"},{"id":"g1_math_l024_ex05","knowledge_id":"g1_math_l024","question":"选择题：下列说法正确的是（  ）\nA. 折线图能反映各部分比例\nB. 条形图能反映数据变化趋势\nC. 扇形图能反映数据变化趋势\nD. 直方图能反映数据分布情况","answer":"答案：D\n解析：直方图用于反映数据的分布情况。"},{"id":"g1_math_l025_ex01","knowledge_id":"g1_math_l025","question":"计算题：求数据2、4、6、8、10的平均数。","answer":"答案：6\n解析：(2+4+6+8+10)÷5 = 30÷5 = 6。"},{"id":"g1_math_l025_ex02","knowledge_id":"g1_math_l025","question":"填空题：若数据x₁,x₂,...,xₙ的平均数为x̄，则x̄ = ______。","answer":"答案：(x₁+x₂+...+xₙ)/n\n解析：平均数的计算公式。"},{"id":"g1_math_l025_ex03","knowledge_id":"g1_math_l025","question":"选择题：某班5人平均身高165cm，其中3人身高166cm，2人身高163cm，则这5人的平均身高是（  ）\nA. 164.5cm\nB. 164.8cm\nC. 165cm\nD. 165.2cm","answer":"答案：B\n解析：(3×166 + 2×163)÷5 = (498+326)÷5 = 824÷5 = 164.8cm。"},{"id":"g1_math_l025_ex04","knowledge_id":"g1_math_l025","question":"判断题：平均数受极端值影响较大。（  ）","answer":"答案：正确\n解析：平均数容易受最大值、最小值影响。"},{"id":"g1_math_l025_ex05","knowledge_id":"g1_math_l025","question":"选择题：某小组5人，平均年龄12岁，其中4人年龄都是12岁，则第5人年龄是（  ）\nA. 12岁\nB. 11岁\nC. 13岁\nD. 10岁","answer":"答案：A\n解析：总年龄5×12=60，4人共48岁，第5人60-48=12岁。"},{"id":"g1_math_l026_ex01","knowledge_id":"g1_math_l026","question":"填空题：数据2、3、4、4、5、6的中位数是______，众数是______。","answer":"答案：4；4\n解析：中位数是中间两个数的平均：4；众数是出现最多的：4。"},{"id":"g1_math_l026_ex02","knowledge_id":"g1_math_l026","question":"判断题：数据的中位数一定在数据最大值和最小值之间。（  ）","answer":"答案：正确\n解析：中位数是排序后的中间值。"},{"id":"g1_math_l026_ex03","knowledge_id":"g1_math_l026","question":"选择题：某班学生年龄统计：12岁8人，13岁15人，14岁7人，则年龄的众数是（  ）\nA. 13岁\nB. 15岁\nC. 7人\nD. 8人","answer":"答案：A\n解析：出现次数最多的是13岁，有15人。"},{"id":"g1_math_l026_ex04","knowledge_id":"g1_math_l026","question":"填空题：某公司10名员工月薪：3000(3人)、5000(4人)、8000(2人)、20000(1人)，则月薪的中位数是______元。","answer":"答案：5000\n解析：排序后第5、6个数的平均：(5000+5000)÷2 = 5000。"},{"id":"g1_math_l026_ex05","knowledge_id":"g1_math_l026","question":"选择题：下列说法错误的是（  ）\nA. 众数是出现次数最多的数据\nB. 中位数是按大小排序后位于中间的数据\nC. 平均数一定等于中位数或众数\nD. 数据的平均数、中位数、众数可能相同","answer":"答案：C\n解析：平均数不一定等于中位数或众数。"},{"id":"g1_math_l027_ex01","knowledge_id":"g1_math_l027","question":"填空题：数据的离散程度可以用______来描述。","answer":"答案：方差或标准差\n解析：方差、标准差反映数据的离散程度。"},{"id":"g1_math_l027_ex02","knowledge_id":"g1_math_l027","question":"判断题：方差越大，数据越稳定。（  ）","answer":"答案：错误\n解析：方差越小，数据越稳定。"},{"id":"g1_math_l027_ex03","knowledge_id":"g1_math_l027","question":"填空题：方差S² = ______。","answer":"答案：1/n·Σ(xᵢ-x̄)²\n解析：方差是各数据与平均数之差的平方和的平均数。"},{"id":"g1_math_l027_ex04","knowledge_id":"g1_math_l027","question":"选择题：甲、乙两班数学平均分相同，甲班方差为10，乙班方差为15，则（  ）\nA. 甲班成绩更好\nB. 乙班成绩更好\nC. 两班成绩一样\nD. 无法判断","answer":"答案：A\n解析：平均分相同，方差小的更稳定。"},{"id":"g1_math_l027_ex05","knowledge_id":"g1_math_l027","question":"填空题：标准差是方差的______。","answer":"答案：算术平方根\n解析：标准差 = √方差。"},{"id":"g1_math_l028_ex01","knowledge_id":"g1_math_l028","question":"填空题：概率是表示______的数。","answer":"答案：事件发生的可能性大小\n解析：概率取值0到1之间。"},{"id":"g1_math_l028_ex02","knowledge_id":"g1_math_l028","question":"判断题：概率为1的事件一定会发生。（  ）","answer":"答案：正确\n解析：概率1表示必然事件。"},{"id":"g1_math_l028_ex03","knowledge_id":"g1_math_l028","question":"选择题：掷一枚均匀硬币，正面朝上的概率是（  ）\nA. 0\nB. 1/2\nC. 1\nD. 不确定","answer":"答案：B\n解析：两面的可能性相同，各占1/2。"},{"id":"g1_math_l028_ex04","knowledge_id":"g1_math_l028","question":"填空题：抛掷一枚骰子，点数大于4的概率是______。","answer":"答案：1/3\n解析：大于4的点数是5、6，共2种，概率为2/6 = 1/3。"},{"id":"g1_math_l028_ex05","knowledge_id":"g1_math_l028","question":"判断题：不可能事件的概率为0。（  ）","answer":"答案：正确\n解析：概率为0的事件不一定不发生，但不可能事件的概率一定为0。"},{"id":"g1_math_l029_ex01","knowledge_id":"g1_math_l029","question":"填空题：古典概型的特点：试验中所有可能结果______，每种结果出现的可能性______。","answer":"答案：有限；相等\n解析：这是古典概型的两个特征。"},{"id":"g1_math_l029_ex02","knowledge_id":"g1_math_l029","question":"填空题：P(A) = ______。","answer":"答案：事件A包含的基本事件数/基本事件总数\n解析：这是古典概率的计算公式。"},{"id":"g1_math_l029_ex03","knowledge_id":"g1_math_l029","question":"选择题：袋中有3个红球、2个白球，摸到红球的概率是（  ）\nA. 2/5\nB. 3/5\nC. 1/2\nD. 1","answer":"答案：B\n解析：总球数5，红球3，概率 = 3/5。"},{"id":"g1_math_l029_ex04","knowledge_id":"g1_math_l029","question":"选择题：同时抛两枚硬币，至少有一枚正面朝上的概率是（  ）\nA. 1/4\nB. 1/2\nC. 3/4\nD. 1","answer":"答案：C\n解析：总情况4种（HH、HT、TH、TT），至少一正有3种，概率3/4。"},{"id":"g1_math_l029_ex05","knowledge_id":"g1_math_l029","question":"判断题：转盘被分成4等份，指针指向某区的概率一定相等。（  ）","answer":"答案：正确\n解析：等份情况下，每份概率相等。"},{"id":"g1_math_l030_ex01","knowledge_id":"g1_math_l030","question":"填空题：几何概型的特点是试验结果有______种。","answer":"答案：无数\n解析：几何概型对应区域内的无数个点。"},{"id":"g1_math_l030_ex02","knowledge_id":"g1_math_l030","question":"填空题：几何概型的概率 P(A) = ______。","answer":"答案：构成事件A的区域长度(面积)/总区域长度(面积)\n解析：这是几何概型的计算公式。"},{"id":"g1_math_l030_ex03","knowledge_id":"g1_math_l030","question":"选择题：点落在单位圆内的概率是（单位圆外有一个正方形）\nA. π/2\nB. π/4\nC. π\nD. 2π","answer":"答案：B\n解析：圆面积πr²，正方形面积4r²，概率 = πr²/(4r²) = π/4。"},{"id":"g1_math_l030_ex04","knowledge_id":"g1_math_l030","question":"判断题：几何概型中，每个点的概率相等。（  ）","answer":"答案：正确\n解析：几何概型假设点在区域中均匀分布。"},{"id":"g1_math_l030_ex05","knowledge_id":"g1_math_l030","question":"选择题：在区间[0,2]上任取一个数，它大于1的概率是（  ）\nA. 1/2\nB. 1/3\nC. 1/4\nD. 2/3","answer":"答案：A\n解析：区间[0,2]长度2，[1,2]长度1，概率 = 1/2。"}];
        const HAS_EXAMPLES = true;

        // 错题本管理器
        const WrongBookManager = {
            STORAGE_KEY_PREFIX: 'wrongbook_',
            getWrongBook(grade, subject) {
                const key = this.STORAGE_KEY_PREFIX + grade + '_' + subject;
                return JSON.parse(localStorage.getItem(key) || '[]');
            },
            addWrongBook(item) {
                const key = this.STORAGE_KEY_PREFIX + item.grade + '_' + item.subject;
                let wrongBook = this.getWrongBook(item.grade, item.subject);
                const exists = wrongBook.some(w => w.question === item.question);
                if (exists) return false;
                wrongBook.push({...item, id: item.knowledgeId + '_' + Date.now(), addedAt: new Date().toISOString()});
                localStorage.setItem(key, JSON.stringify(wrongBook));
                return true;
            }
        };

        // 学习进度管理器
        const ProgressManager = {
            STORAGE_KEY: 'study_progress',
            
            getProgress() {
                try {
                    return JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
                } catch(e) {
                    return {};
                }
            },
            
            saveProgress(progress) {
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(progress));
            },
            
            recordStudy(grade, subject, subjectName, semester, semesterName, knowledgeId, knowledgeName) {
                const progress = this.getProgress();
                const now = new Date().toISOString();
                const today = new Date().toISOString().split('T')[0];
                
                if (!progress.learnedKnowledge) progress.learnedKnowledge = {};
                if (!progress.dailyStats) progress.dailyStats = {};
                if (!progress.dailyStats[today]) {
                    progress.dailyStats[today] = { learnedCount: 0, subjects: [] };
                }
                
                const isNew = !progress.learnedKnowledge[knowledgeId];
                progress.learnedKnowledge[knowledgeId] = { learnedAt: now };
                
                if (isNew) {
                    progress.dailyStats[today].learnedCount++;
                    if (!progress.dailyStats[today].subjects.includes(subject)) {
                        progress.dailyStats[today].subjects.push(subject);
                    }
                }
                
                progress.lastStudy = {
                    grade, subject, subjectName, semester, semesterName,
                    knowledgeId, knowledgeName, timestamp: now
                };
                
                this.saveProgress(progress);
            },
            
            isLearned(knowledgeId) {
                const progress = this.getProgress();
                return !!(progress.learnedKnowledge && progress.learnedKnowledge[knowledgeId]);
            },
            
            getLastStudy() {
                const progress = this.getProgress();
                return progress.lastStudy || null;
            },
            
            getSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                if (!progress.learnedKnowledge) return { learned: 0, total: 0, percent: 0 };
                const prefix = grade + '_' + subject + '_';
                const learned = Object.keys(progress.learnedKnowledge).filter(k => k.startsWith(prefix)).length;
                const total = DATA_KNOWLEDGE.length;
                const percent = total > 0 ? Math.round((learned / total) * 100) : 0;
                return { learned, total, percent };
            },
            
            clearSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                const prefix = grade + '_' + subject + '_';
                
                if (progress.learnedKnowledge) {
                    Object.keys(progress.learnedKnowledge).forEach(k => {
                        if (k.startsWith(prefix)) {
                            delete progress.learnedKnowledge[k];
                        }
                    });
                }
                
                if (progress.lastStudy && progress.lastStudy.grade === grade && progress.lastStudy.subject === subject) {
                    delete progress.lastStudy;
                }
                
                this.saveProgress(progress);
                return true;
            }
        };

        // URL参数解析
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                grade: 'g1',
                subject: 'math',
                semester: params.get('semester') || 'upper'
            };
        }

        const gradeNames = {'g1':'初一','g2':'初二','g3':'初三'};
        const subjectNames = {'math':'数学'};
        const semesterNames = {'upper':'上册','lower':'下册'};

        let currentParams = getUrlParams();
        let knowledgeList = [];
        let expandedIds = new Set();
        let currentExample = null;

        const pageTitle = document.getElementById('page-title');
        const pageSubtitle = document.getElementById('page-subtitle');
        const knowledgeListEl = document.getElementById('knowledge-list');
        const emptyStateEl = document.getElementById('empty-state');
        const searchResultsInfo = document.getElementById('search-results-info');
        const searchCountEl = document.getElementById('search-count');
        const searchInput = document.getElementById('search-input');

        function initPage() {
            const {grade, subject, semester} = currentParams;
            pageTitle.textContent = gradeNames[grade] + ' · ' + subjectNames[subject] + ' · ' + semesterNames[semester];
            loadKnowledge();
            updateProgressStat();
            
            const hash = window.location.hash.replace('#', '');
            if (hash && knowledgeList.some(k => k.id === hash)) {
                setTimeout(() => {
                    toggleExpand(hash);
                    const card = document.querySelector('[data-id="' + hash + '"]');
                    if (card) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
        }

        function updateProgressStat() {
            const {grade, subject} = currentParams;
            const learnedInSemester = knowledgeList.filter(k => ProgressManager.isLearned(k.id)).length;
            document.getElementById('progress-learned').textContent = learnedInSemester;
            document.getElementById('progress-total').textContent = knowledgeList.length;
        }

        function loadKnowledge() {
            const {grade, subject, semester} = currentParams;
            knowledgeList = DATA_KNOWLEDGE.filter(k => {
                return k.semester === semester;
            });
            renderKnowledgeList();
        }

        function renderKnowledgeList(items = knowledgeList) {
            if (items.length === 0) {
                knowledgeListEl.innerHTML = '';
                emptyStateEl.classList.remove('hidden');
                return;
            }
            emptyStateEl.classList.add('hidden');
            knowledgeListEl.innerHTML = items.map(item => {
                const isExpanded = expandedIds.has(item.id);
                const isLearned = ProgressManager.isLearned(item.id);
                return '<div class="card knowledge-card ' + (isLearned ? 'learned' : '') + '" data-id="' + item.id + '">' +
                    '<div class="knowledge-header p-4 flex items-center justify-between" onclick="toggleExpand(\'' + item.id + '\')">' +
                        '<div class="flex items-center gap-3 flex-1 min-w-0">' +
                            '<div class="expand-icon ' + (isExpanded ? 'expanded' : 'collapsed') + '">' + (isExpanded ? '−' : '+') + '</div>' +
                            '<div class="flex-1 min-w-0">' +
                                '<h3 class="text-lg font-semibold text-gray-800 flex items-center gap-2">' + escapeHtml(item.name) + (isLearned ? '<span class="text-green-500 text-sm">✓ 已学习</span>' : '') + '</h3>' +
                                '<p class="text-xs text-gray-500 mt-1">' + escapeHtml(item.chapter) + '</p>' +
                            '</div>' +
                        '</div>' +
                        (HAS_EXAMPLES ? '<button class="btn btn-secondary text-sm px-3 py-1" onclick="event.stopPropagation(); showExample(\'' + item.id + '\', \'' + escapeHtml(item.name) + '\')">例题</button>' : '') +
                    '</div>' +
                    '<div id="content-' + item.id + '" class="px-6 pb-4 ' + (isExpanded ? '' : 'hidden') + '">' +
                        (item.formula ? '<div class="mb-4"><h4 class="text-sm font-medium text-gray-500 mb-2">📐 公式</h4><p class="formula-box text-gray-800 text-lg bg-gray-50 p-3 rounded-lg">' + escapeHtml(item.formula) + '</p></div>' : '') +
                        (item.explanation ? '<div><h4 class="text-sm font-medium text-gray-500 mb-2">📝 解释</h4><p class="text-gray-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(item.explanation) + '</p></div>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function toggleExpand(id) {
            const isNewLearn = !expandedIds.has(id) && !ProgressManager.isLearned(id);
            if (expandedIds.has(id)) {
                expandedIds.delete(id);
            } else {
                expandedIds.add(id);
                const {grade, subject, semester} = currentParams;
                const item = knowledgeList.find(k => k.id === id);
                if (item) {
                    ProgressManager.recordStudy(
                        grade, subject, subjectNames[subject],
                        semester, semesterNames[semester],
                        id, item.name
                    );
                }
            }
            const card = document.querySelector('[data-id="' + id + '"]');
            const content = document.getElementById('content-' + id);
            const icon = card.querySelector('.expand-icon');
            const header = card.querySelector('.knowledge-header');
            const title = card.querySelector('h3');
            if (expandedIds.has(id)) {
                content.classList.remove('hidden');
                icon.classList.remove('collapsed');
                icon.classList.add('expanded');
                icon.textContent = '−';
                header.classList.add('expanded');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('expanded');
                icon.classList.add('collapsed');
                icon.textContent = '+';
                header.classList.remove('expanded');
            }
            if (isNewLearn) {
                card.classList.add('learned');
                if (!title.querySelector('.text-green-500')) {
                    title.innerHTML += '<span class="text-green-500 text-sm">✓ 已学习</span>';
                }
                updateProgressStat();
            }
        }

        function expandAll() {
            knowledgeList.forEach(item => expandedIds.add(item.id));
            renderKnowledgeList();
        }

        function collapseAll() {
            expandedIds.clear();
            renderKnowledgeList();
        }

        function searchKnowledge(keyword, list) {
