与事实完全相反的描述","answer":"答案：C. 生物成分：生产者（植物）， 消费者（动物）， 分解者（细菌和...。解析：生态系统的组成的主要特征是：生物成分：生产者（植物）， 消费者（动物）， 分解者（细菌和真菌）， 非生物成分：阳光、空气、水、土壤。这是该类群的重要识别特征。"},{"id":"g2_biology_l026_ex02","knowledge_id":"g2_biology_l026","question":"选择题：下列动物中，具有\"生物成分：生产者（植物）\"特征的是？ A. 原生动物  B. 腔肠动物  C. 生态系统类动物  D. 扁形动物","answer":"答案：C. 生态系统类动物。解析：生物成分：生产者（植物）是生态系统的组成的特征之一。每类动物都有其独特的特征，这些特征是分类的重要依据。"},{"id":"g2_biology_l026_ex03","knowledge_id":"g2_biology_l026","question":"填空题：生态系统的组成的主要特征包括：______等。","answer":"答案：生物成分：生产者（植物）， 消费者（动物）， 分解者（细菌和真菌）， 非生物成分：阳光、空气、水、土壤。解析：生态系统由生物成分和非生物成分组成。生物成分包括：生产者（绿色植物，通过光合作用制造有机物，是生态系统的基础）；消费者（动物，不能自己制造有机物，直接或间接以植物为食）；分解者（细菌和真菌，分解动植物遗体、粪便，将有机物分解成无机物）。非生物成分包括：阳光（提供能量）、空气（如氧气、二氧化碳）、水、..."},{"id":"g2_biology_l026_ex04","knowledge_id":"g2_biology_l026","question":"判断题：生态系统的组成的特征只有一种。（  ）","answer":"答案：错误。解析：生态系统的组成有多个主要特征，包括生物成分：生产者（植物）， 消费者（动物）， 分解者（细菌和真菌）， 非生物成分：阳光、空气、水、土壤。这些特征共同构成了该类群的识别依据，判断时要综合考虑。"},{"id":"g2_biology_l026_ex05","knowledge_id":"g2_biology_l026","question":"选择题：在动物进化过程中，生态系统类比哪类更复杂高级？ A. 爬行动物  B. 哺乳动物  C. 鸟类  D. 原生动物","answer":"答案：D. 原生动物。解析：动物进化的大致顺序是：原生动物→腔肠动物→扁形动物→线形动物→环节动物→软体动物→节肢动物→脊椎动物（鱼→两栖→爬行→鸟→哺乳）。所以比原生动物更高级复杂。"},{"id":"g2_biology_l026_ex06","knowledge_id":"g2_biology_l026","question":"填空题：生态系统的组成的代表动物有______、______等。","answer":"答案：示例：根据具体类群填写。解析：每类动物都有其代表动物，学习时要结合代表动物来理解该类群的主要特征。生态系统由生物成分和非生物成分组成。生物成分包括：生产者（绿色植物，通过光合作用制造有机物，是生态系统的基础）；消费者（动物，不能自己制造有机物，直接或间接以植..."},{"id":"g2_biology_l026_ex07","knowledge_id":"g2_biology_l026","question":"判断题：生态系统的组成都是有害的。（  ）","answer":"答案：错误。解析：生物对人类的影响是多方面的，生态系统类中有的对人有害，有的对人有益，还有的与人类没有直接利害关系。我们应该辩证地看待它们与人类的关系。"},{"id":"g2_biology_l026_ex08","knowledge_id":"g2_biology_l026","question":"选择题：下列关于生态系统的组成的说法，错误的是？ A. 是生物多样性的组成部分  B. 所有种类都对人类有害  C. 具有该类群的典型特征  D. 在生态系统中有一定作用","answer":"答案：B. 所有种类都对人类有害。解析：每类动物中都有与人类有益的种类和有害的种类，不能说全部都有害。它们都是生物多样性的重要组成部分，在生态系统中有各自的作用。"},{"id":"g2_biology_l026_ex09","knowledge_id":"g2_biology_l026","question":"简答题：请简述生态系统的组成的主要特征。","answer":"答案：生态系统的组成的主要特征包括：生物成分：生产者（植物）， 消费者（动物）， 分解者（细菌和真菌）， 非生物成分：阳光、空气、水、土壤。生态系统由生物成分和非生物成分组成。生物成分包括：生产者（绿色植物，通过光合作用制造有机物，是生态系统的基础）；消费者（动物，不能自己制造有机物，直接或间接以植物为食）；分解者（细菌和真菌，分解动植物遗体、粪便，将有机物分解成无机物）。非生物成分包括：阳光（提供能量）、空气（如氧气、二氧化碳）、水、土壤、无机盐等。生产者、消费者和分解者缺一不可，共同维持生态系统的稳定。... 这些特征是区分该类群与其他类群的重要依据。"},{"id":"g2_biology_l026_ex10","knowledge_id":"g2_biology_l026","question":"选择题：学习生态系统的组成时，最重要的是掌握？ A. 所有种类的名字  B. 所有代表动物的细节  C. 该类群的主要特征  D. 所有英文名称","answer":"答案：C. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"},{"id":"g2_biology_l027_ex01","knowledge_id":"g2_biology_l027","question":"选择题：下列关于食物链和食物网的描述，正确的是？ A. 与事实完全相反的描述  B. 属于其他类群的特征  C. 明显错误的说法  D. 食物链：生产者→草食动物→肉食动物→... ， 食物网：多条...","answer":"答案：D. 食物链：生产者→草食动物→肉食动物→... ， 食物网：多条...。解析：食物链和食物网的主要特征是：食物链：生产者→草食动物→肉食动物→... ， 食物网：多条食物链交织 ， 物质循环和能量流动的渠道。这是该类群的重要识别特征。"},{"id":"g2_biology_l027_ex02","knowledge_id":"g2_biology_l027","question":"选择题：下列动物中，具有\"食物链：生产者→草食动物→肉食动物→... \"特征的是？ A. 扁形动物  B. 原生动物  C. 腔肠动物  D. 食物链和食物网类动物","answer":"答案：D. 食物链和食物网类动物。解析：食物链：生产者→草食动物→肉食动物→... 是食物链和食物网的特征之一。每类动物都有其独特的特征，这些特征是分类的重要依据。"},{"id":"g2_biology_l027_ex03","knowledge_id":"g2_biology_l027","question":"填空题：食物链和食物网的主要特征包括：______等。","answer":"答案：食物链：生产者→草食动物→肉食动物→... ， 食物网：多条食物链交织 ， 物质循环和能量流动的渠道。解析：食物链是生态系统中各种生物之间由于食物关系而形成的一种联系。食物链的起点是生产者（绿色植物），然后是草食动物（初级消费者），再是肉食动物（次级、三级消费者），最后是分解者。食物网是生态系统中多条食物链交织在一起形成的网状结构。能量沿着食物链逐级流动，每一环节的能量传递效率约为10%，能量流动的特点：..."},{"id":"g2_biology_l027_ex04","knowledge_id":"g2_biology_l027","question":"判断题：食物链和食物网的特征只有一种。（  ）","answer":"答案：错误。解析：食物链和食物网有多个主要特征，包括食物链：生产者→草食动物→肉食动物→... ， 食物网：多条食物链交织 ， 物质循环和能量流动的渠道。这些特征共同构成了该类群的识别依据，判断时要综合考虑。"},{"id":"g2_biology_l027_ex05","knowledge_id":"g2_biology_l027","question":"选择题：在动物进化过程中，食物链和食物网类比哪类更复杂高级？ A. 哺乳动物  B. 原生动物  C. 鸟类  D. 爬行动物","answer":"答案：B. 原生动物。解析：动物进化的大致顺序是：原生动物→腔肠动物→扁形动物→线形动物→环节动物→软体动物→节肢动物→脊椎动物（鱼→两栖→爬行→鸟→哺乳）。所以比原生动物更高级复杂。"},{"id":"g2_biology_l027_ex06","knowledge_id":"g2_biology_l027","question":"填空题：食物链和食物网的代表动物有______、______等。","answer":"答案：示例：根据具体类群填写。解析：每类动物都有其代表动物，学习时要结合代表动物来理解该类群的主要特征。食物链是生态系统中各种生物之间由于食物关系而形成的一种联系。食物链的起点是生产者（绿色植物），然后是草食动物（初级消费者），再是肉食动物（次级、三级消费者），最..."},{"id":"g2_biology_l027_ex07","knowledge_id":"g2_biology_l027","question":"判断题：食物链和食物网都是有害的。（  ）","answer":"答案：错误。解析：生物对人类的影响是多方面的，食物链和食物网类中有的对人有害，有的对人有益，还有的与人类没有直接利害关系。我们应该辩证地看待它们与人类的关系。"},{"id":"g2_biology_l027_ex08","knowledge_id":"g2_biology_l027","question":"选择题：下列关于食物链和食物网的说法，错误的是？ A. 在生态系统中有一定作用  B. 所有种类都对人类有害  C. 是生物多样性的组成部分  D. 具有该类群的典型特征","answer":"答案：B. 所有种类都对人类有害。解析：每类动物中都有与人类有益的种类和有害的种类，不能说全部都有害。它们都是生物多样性的重要组成部分，在生态系统中有各自的作用。"},{"id":"g2_biology_l027_ex09","knowledge_id":"g2_biology_l027","question":"简答题：请简述食物链和食物网的主要特征。","answer":"答案：食物链和食物网的主要特征包括：食物链：生产者→草食动物→肉食动物→... ， 食物网：多条食物链交织 ， 物质循环和能量流动的渠道。食物链是生态系统中各种生物之间由于食物关系而形成的一种联系。食物链的起点是生产者（绿色植物），然后是草食动物（初级消费者），再是肉食动物（次级、三级消费者），最后是分解者。食物网是生态系统中多条食物链交织在一起形成的网状结构。能量沿着食物链逐级流动，每一环节的能量传递效率约为10%，能量流动的特点：单向流动、逐级递减。物质在生态系统中可循环利用（碳循环、水循环等），但能量不能循环，只能单向流动。... 这些特征是区分该类群与其他类群的重要依据。"},{"id":"g2_biology_l027_ex10","knowledge_id":"g2_biology_l027","question":"选择题：学习食物链和食物网时，最重要的是掌握？ A. 该类群的主要特征  B. 所有英文名称  C. 所有种类的名字  D. 所有代表动物的细节","answer":"答案：A. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"},{"id":"g2_biology_l028_ex01","knowledge_id":"g2_biology_l028","question":"选择题：下列关于生态系统的能量流动和物质循环的描述，正确的是？ A. 能量流动：单向流动、逐级递减 ， 物质循环：反复循环、反复利...  B. 属于其他类群的特征  C. 明显错误的说法  D. 与事实完全相反的描述","answer":"答案：A. 能量流动：单向流动、逐级递减 ， 物质循环：反复循环、反复利...。解析：生态系统的能量流动和物质循环的主要特征是：能量流动：单向流动、逐级递减 ， 物质循环：反复循环、反复利用 ， 碳循环、水循环。这是该类群的重要识别特征。"},{"id":"g2_biology_l028_ex02","knowledge_id":"g2_biology_l028","question":"选择题：下列动物中，具有\"能量流动：单向流动、逐级递减 \"特征的是？ A. 生态系统类动物  B. 扁形动物  C. 原生动物  D. 腔肠动物","answer":"答案：A. 生态系统类动物。解析：能量流动：单向流动、逐级递减 是生态系统的能量流动和物质循环的特征之一。每类动物都有其独特的特征，这些特征是分类的重要依据。"},{"id":"g2_biology_l028_ex03","knowledge_id":"g2_biology_l028","question":"填空题：生态系统的能量流动和物质循环的主要特征包括：______等。","answer":"答案：能量流动：单向流动、逐级递减 ， 物质循环：反复循环、反复利用 ， 碳循环、水循环。解析：生态系统的能量流动：能量进入生态系统后，通过生产者→消费者→分解者的途径流动，能量在流动过程中逐渐减少（每一环节约传递10%），最终以热能形式散失，因此能量流动是单向的、逐级递减的，不能循环。生态 _l031_ex04","knowledge_id":"g2_biology_l031","question":"判断题：生物技术的概念的特征只有一种。（  ）","answer":"答案：错误。解析：生物技术的概念有多个主要特征，包括生物技术 ， 利用生物体系 ， 改良生物或生产产品 ， 传统生物技术 ， 现代生物技术。这些特征共同构成了该类群的识别依据，判断时要综合考虑。"},{"id":"g2_biology_l031_ex05","knowledge_id":"g2_biology_l031","question":"选择题：在动物进化过程中，生物技术类比哪类更复杂高级？ A. 爬行动物  B. 鸟类  C. 原生动物  D. 哺乳动物","answer":"答案：C. 原生动物。解析：动物进化的大致顺序是：原生动物→腔肠动物→扁形动物→线形动物→环节动物→软体动物→节肢动物→脊椎动物（鱼→两栖→爬行→鸟→哺乳）。所以比原生动物更高级复杂。"},{"id":"g2_biology_l031_ex06","knowledge_id":"g2_biology_l031","question":"填空题：生物技术的概念的代表动物有______、______等。","answer":"答案：示例：根据具体类群填写。解析：每类动物都有其代表动物，学习时要结合代表动物来理解该类群的主要特征。生物技术是指利用生物体系（包括生物体、细胞、酶等）来改良生物或生产产品的技术。生物技术分为传统生物技术和现代生物技术。传统生物技术包括：酿造（酿酒、制醋）、发酵..."},{"id":"g2_biology_l031_ex07","knowledge_id":"g2_biology_l031","question":"判断题：生物技术的概念都是有害的。（  ）","answer":"答案：错误。解析：生物对人类的影响是多方面的，生物技术类中有的对人有害，有的对人有益，还有的与人类没有直接利害关系。我们应该辩证地看待它们与人类的关系。"},{"id":"g2_biology_l031_ex08","knowledge_id":"g2_biology_l031","question":"选择题：下列关于生物技术的概念的说法，错误的是？ A. 所有种类都对人类有害  B. 具有该类群的典型特征  C. 是生物多样性的组成部分  D. 在生态系统中有一定作用","answer":"答案：A. 所有种类都对人类有害。解析：每类动物中都有与人类有益的种类和有害的种类，不能说全部都有害。它们都是生物多样性的重要组成部分，在生态系统中有各自的作用。"},{"id":"g2_biology_l031_ex09","knowledge_id":"g2_biology_l031","question":"简答题：请简述生物技术的概念的主要特征。","answer":"答案：生物技术的概念的主要特征包括：生物技术 ， 利用生物体系 ， 改良生物或生产产品 ， 传统生物技术 ， 现代生物技术。生物技术是指利用生物体系（包括生物体、细胞、酶等）来改良生物或生产产品的技术。生物技术分为传统生物技术和现代生物技术。传统生物技术包括：酿造（酿酒、制醋）、发酵（制作酸奶、泡菜）、传统育种等，已经有几千年的历史。现代生物技术包括：基因工程（如转基因技术）、细胞工程（如克隆技术）、发酵工程（如利用发酵罐生产药物）、酶工程（如酶制剂应用）等，是20世纪70年代以后发展起来的。生物技术为人类解决食品、医... 这些特征是区分该类群与其他类群的重要依据。"},{"id":"g2_biology_l031_ex10","knowledge_id":"g2_biology_l031","question":"选择题：学习生物技术的概念时，最重要的是掌握？ A. 该类群的主要特征  B. 所有代表动物的细节  C. 所有种类的名字  D. 所有英文名称","answer":"答案：A. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"},{"id":"g2_biology_l032_ex01","knowledge_id":"g2_biology_l032","question":"选择题：下列关于基因工程与转基因技术的描述，正确的是？ A. 基因工程 ， 提取目的基因 ， 拼接基因 ， 导入受体细胞 ...  B. 属于其他类群的特征  C. 与事实完全相反的描述  D. 明显错误的说法","answer":"答案：A. 基因工程 ， 提取目的基因 ， 拼接基因 ， 导入受体细胞 ...。解析：基因工程与转基因技术的主要特征是：基因工程 ， 提取目的基因 ， 拼接基因 ， 导入受体细胞 ， 表达 ， 转基因生物。这是该类群的重要识别特征。"},{"id":"g2_biology_l032_ex02","knowledge_id":"g2_biology_l032","question":"选择题：下列动物中，具有\"基因工程 \"特征的是？ A. 扁形动物  B. 腔肠动物  C. 基因工程与转基因技术类动物  D. 原生动物","answer":"答案：C. 基因工程与转基因技术类动物。解析：基因工程 是基因工程与转基因技术的特征之一。每类动物都有其独特的特征，这些特征是分类的重要依据。"},{"id":"g2_biology_l032_ex03","knowledge_id":"g2_biology_l032","question":"填空题：基因工程与转基因技术的主要特征包括：______等。","answer":"答案：基因工程 ， 提取目的基因 ， 拼接基因 ， 导入受体细胞 ， 表达 ， 转基因生物。解析：基因工程是指按照人的意愿，人工地改造生物遗传性状的技术。转基因技术是基因工程的核心技术，其过程：提取目的基因（如抗虫基因）；用限制性核酸内切酶切割质粒（运载体），用DNA连接酶将目的基因与质粒拼接形成重组DNA分子；将重组DNA分子导入受体细胞；受体细胞大量繁殖，使目的基因表达。转基因技术的应用：转..."},{"id":"g2_biology_l032_ex04","knowledge_id":"g2_biology_l032","question":"判断题：基因工程与转基因技术的特征只有一种。（  ）","answer":"答案：错误。解析：基因工程与转基因技术有多个主要特征，包括基因工程 ， 提取目的基因 ， 拼接基因 ， 导入受体细胞 ， 表达 ， 转基因生物。这些特征共同构成了该类群的识别依据，判断时要综合考虑。"},{"id":"g2_biology_l032_ex05","knowledge_id":"g2_biology_l032","question":"选择题：在动物进化过程中，基因工程与转基因技术类比哪类更复杂高级？ A. 鸟类  B. 爬行动物  C. 原生动物  D. 哺乳动物","answer":"答案：C. 原生动物。解析：动物进化的大致顺序是：原生动物→腔肠动物→扁形动物→线形动物→环节动物→软体动物→节肢动物→脊椎动物（鱼→两栖→爬行→鸟→哺乳）。所以比原生动物更高级复杂。"},{"id":"g2_biology_l032_ex06","knowledge_id":"g2_biology_l032","question":"填空题：基因工程与转基因技术的代表动物有______、______等。","answer":"答案：示例：根据具体类群填写。解析：每类动物都有其代表动物，学习时要结合代表动物来理解该类群的主要特征。基因工程是指按照人的意愿，人工地改造生物遗传性状的技术。转基因技术是基因工程的核心技术，其过程：提取目的基因（如抗虫基因）；用限制性核酸内切酶切割质粒（运载体）..."},{"id":"g2_biology_l032_ex07","knowledge_id":"g2_biology_l032","question":"判断题：基因工程与转基因技术都是有害的。（  ）","answer":"答案：错误。解析：生物对人类的影响是多方面的，基因工程与转基因技术类中有的对人有害，有的对人有益，还有的与人类没有直接利害关系。我们应该辩证地看待它们与人类的关系。"},{"id":"g2_biology_l032_ex08","knowledge_id":"g2_biology_l032","question":"选择题：下列关于基因工程与转基因技术的说法，错误的是？ A. 是生物多样性的组成部分  B. 所有种类都对人类有害  C. 具有该类群的典型特征  D. 在生态系统中有一定作用","answer":"答案：B. 所有种类都对人类有害。解析：每类动物中都有与人类有益的种类和有害的种类，不能说全部都有害。它们都是生物多样性的重要组成部分，在生态系统中有各自的作用。"},{"id":"g2_biology_l032_ex09","knowledge_id":"g2_biology_l032","question":"简答题：请简述基因工程与转基因技术的主要特征。","answer":"答案：基因工程与转基因技术的主要特征包括：基因工程 ， 提取目的基因 ， 拼接基因 ， 导入受体细胞 ， 表达 ， 转基因生物。基因工程是指按照人的意愿，人工地改造生物遗传性状的技术。转基因技术是基因工程的核心技术，其过程：提取目的基因（如抗虫基因）；用限制性核酸内切酶切割质粒（运载体），用DNA连接酶将目的基因与质粒拼接形成重组DNA分子；将重组DNA分子导入受体细胞；受体细胞大量繁殖，使目的基因表达。转基因技术的应用：转基因作物（如抗虫棉、抗除草剂大豆）、转基因动物（如转基因鲤鱼）、转基因药物（如胰岛素、干扰素）等。转... 这些特征是区分该类群与其他类群的重要依据。"},{"id":"g2_biology_l032_ex10","knowledge_id":"g2_biology_l032","question":"选择题：学习基因工程与转基因技术时，最重要的是掌握？ A. 所有英文名称  B. 该类群的主要特征  C. 所有种类的名字  D. 所有代表动物的细节","answer":"答案：B. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"},{"id":"g2_biology_l033_ex01","knowledge_id":"g2_biology_l033","question":"选择题：下列关于克隆技术的描述，正确的是？ A. 属于其他类群的特征  B. 明显错误的说法  C. 与事实完全相反的描述  D. 无性繁殖 ， 体细胞核移植 ， 多利羊 ， 遗传组成与供核个...","answer":"答案：D. 无性繁殖 ， 体细胞核移植 ， 多利羊 ， 遗传组成与供核个...。解析：克隆技术的主要特征是：无性繁殖 ， 体细胞核移植 ， 多利羊 ， 遗传组成与供核个体基本相同。这是该类群的重要识别特征。"},{"id":"g2_biology_l033_ex02","knowledge_id":"g2_biology_l033","question":"选择题：下列动物中，具有\"无性繁殖 \"特征的是？ A. 扁形动物  B. 原生动物  C. 克隆技术类动物  D. 腔肠动物","answer":"答案：C. 克隆技术类动物。解析：无性繁殖 是克隆技术的特征之一。每类动物都有其独特的特征，这些特征是分类的重要依据。"},{"id":"g2_biology_l033_ex03","knowledge_id":"g2_biology_l033","question":"填空题：克隆技术的主要特征包括：______等。","answer":"答案：无性繁殖 ， 体细胞核移植 ， 多利羊 ， 遗传组成与供核个体基本相同。解析：克隆是指不经过受精过程，通过无性繁殖获得与亲代遗传组成完全相同的个体。1996年，世界上第一只克隆哺乳动物——多利羊诞生。克隆技术的基本过程：将一只羊的乳腺细胞（体细胞）的细胞核取出，移植到另一只羊的去核卵细胞中；用电刺激使融合细胞分裂发育成胚胎；将胚胎移植到第三只羊的子宫内，最终产下多利羊。多利羊..."},{"id":"g2_biology_l033_ex04","knowledge_id":"g2_biology_l033","question":"判断题：克隆技术的特征只有一种。（  ）","answer":"答案：错误。解析：克隆技术有多个主要特征，包括无性繁殖 ， 体细胞核移植 ， 多利羊 ， 遗传组成与供核个体基本相同。这些特征共同构成了该类群的识别依据，判断时要综合考虑。"},{"id":"g2_biology_l033_ex05","knowledge_id":"g2_biology_l033","question":"选择题：在动物进化过程中，克隆技术类比哪类更复杂高级？ A. 爬行动物  B. 原生动物  C. 鸟类  D. 哺乳动物","answer":"答案：B. 原生动物。解析：动物进化的大致顺序是：原生动物→腔肠动物→扁形动物→线形动物→环节动物→软体动物→节肢动物→脊椎动物（鱼→两栖→爬行→鸟→哺乳）。所以比原生动物更高级复杂。"},{"id":"g2_biology_l033_ex06","knowledge_id":"g2_biology_l033","question":"填空题：克隆技术的代表动物有______、______等。","answer":"答案：示例：根据具体类群填写。解析：每类动物都有其代表动物，学习时要结合代表动物来理解该类群的主要特征。克隆是指不经过受精过程，通过无性繁殖获得与亲代遗传组成完全相同的个体。1996年，世界上第一只克隆哺乳动物——多利羊诞生。克隆技术的基本过程：将一只羊的乳腺细胞..."},{"id":"g2_biology_l033_ex07","knowledge_id":"g2_biology_l033","question":"判断题：克隆技术都是有害的。（  ）","answer":"答案：错误。解析：生物对人类的影响是多方面的，克隆技术类中有的对人有害，有的对人有益，还有的与人类没有直接利害关系。我们应该辩证地看待它们与人类的关系。"},{"id":"g2_biology_l033_ex08","knowledge_id":"g2_biology_l033","question":"选择题：下列关于克隆技术的说法，错误的是？ A. 具有该类群的典型特征  B. 是生物多样性的组成部分  C. 所有种类都对人类有害  D. 在生态系统中有一定作用","answer":"答案：C. 所有种类都对人类有害。解析：每类动物中都有与人类有益的种类和有害的种类，不能说全部都有害。它们都是生物多样性的重要组成部分，在生态系统中有各自的作用。"},{"id":"g2_biology_l033_ex09","knowledge_id":"g2_biology_l033","question":"简答题：请简述克隆技术的主要特征。","answer":"答案：克隆技术的主要特征包括：无性繁殖 ， 体细胞核移植 ， 多利羊 ， 遗传组成与供核个体基本相同。克隆是指不经过受精过程，通过无性繁殖获得与亲代遗传组成完全相同的个体。1996年，世界上第一只克隆哺乳动物——多利羊诞生。克隆技术的基本过程：将一只羊的乳腺细胞（体细胞）的细胞核取出，移植到另一只羊的去核卵细胞中；用电刺激使融合细胞分裂发育成胚胎；将胚胎移植到第三只羊的子宫内，最终产下多利羊。多利羊的遗传组成与提供细胞核的羊基本相同。克隆技术可用于保存濒危物种、繁殖优质牲畜、培育医学模型等，但也存... 这些特征是区分该类群与其他类群的重要依据。"},{"id":"g2_biology_l033_ex10","knowledge_id":"g2_biology_l033","question":"选择题：学习克隆技术时，最重要的是掌握？ A. 该类群的主要特征  B. 所有种类的名字  C. 所有英文名称  D. 所有代表动物的细节","answer":"答案：A. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"},{"id":"g2_biology_u001_ex01","knowledge_id":"g2_biology_u001","question":"选择题：下列关于无脊椎动物的主要类群的描述，正确的是？ A. 与事实完全相反的描述  B. 属于其他类群的特征  C. 明显错误的说法  D. 原生动物 → 腔肠动物 → 扁形动物 → 线形动物 → 环节...","answer":"答案：D. 原生动物 → 腔肠动物 → 扁形动物 → 线形动物 → 环节...。解析：无脊椎动物的主要类群的主要特征是：原生动物 → 腔肠动物 → 扁形动物 → 线形动物 → 环节动物 → 软体动物 → 节肢动物。这是该类群的重要识别特征。"},{"id":"g2_biology_u001_ex02","knowledge_id":"g2_biology_u001","question":"选择题：下列动物中，具有\"原生动物 → 腔肠动物 → 扁形动物 → 线形动物 → 环节动物 → 软体动物 → 节肢动物\"特征的是？ A. 扁形动物  B. 腔肠动物  C. 无脊椎动物类动物  D. 原生动物","answer":"答案：C. 无脊椎动物类动物。解析：原生动物 → 腔肠动物 → 扁形动物 → 线形动物 → 环节动物 → 软体动物 → 节肢动物是无脊椎动物的主要类群的特征之一。每类动物都有其独特的特征，这些特征是分类的重要依据。"},{"id":"g2_biology_u001_ex03","knowledge_id":"g2_biology_u001","question":"填空题：无脊椎动物的主要类群的主要特征包括：______等。","answer":"答案：原生动物 → 腔肠动物 → 扁形动物 → 线形动物 → 环节动物 → 软体动物 → 节肢动物。解析：无脊椎动物按照从简单到复杂的进化顺序可分为以上七大类群，它们的主要区别在于体壁结构、体腔有无、运动方式以及生活环境等方面。原生动物是最原始、最简单的动物，由单细胞构成；腔肠动物开始出现组织分化；扁形动物出现中胚层；线形动物开始出现假体腔；环节动物开始出现真正的体节和刚毛；软体动物身体柔软，有外套膜和..."},{"id":"g2_biology_u001_ex04","knowledge_id":"g2_biology_u001","question":"判断题：无脊椎动物的主要类群的特征只有一种。（  ）","answer":"答案：错误。解析：无脊椎动物的主要类群有多个主要特征，包括原生动物 → 腔肠动物 → 扁形动物 → 线形动物 → 环节动物 → 软体动物 → 节肢动物。这些特征共同构成了该类群的识别依据，判断时要综合考虑。"},{"id":"g2_biology_u001_ex05","knowledge_id":"g2_biology_u001","question":"选择题：在动物进化过程中，无脊椎动物类比哪类更复杂高级？ A. 爬行动物  B. 哺乳动物  C. 原生动物  D. 鸟类","answer":"答案：C. 原生动物。解析：动物进化的大致顺序是：原生动物→腔肠动物→扁形动物→线形动物→环节动物→软体动物→节肢动物→脊椎动物（鱼→两栖→爬行→鸟→哺乳）。所以比原生动物更高级复杂。"},{"id":"g2_biology_u001_ex06","knowledge_id":"g2_biology_u001","question":"填空题：无脊椎动物的主要类群的代表动物有______、______等。","answer":"答案：示例：根据具体类群填写。解析：每类动物都有其代表动物，学习时要结合代表动物来理解该类群的主要特征。无脊椎动物按照从简单到复杂的进化顺序可分为以上七大类群，它们的主要区别在于体壁结构、体腔有无、运动方式以及生活环境等方面。原生动物是最原始、最简单的动物，由单细..."},{"id":"g2_biology_u001_ex07","knowledge_id":"g2_biology_u001","question":"判断题：无脊椎动物的主要类群都是有害的。（  ）","answer":"答案：错误。解析：生物对人类的影响是多方面的，无脊椎动物类中有的对人有害，有的对人有益，还有的与人类没有直接利害关系。我们应该辩证地看待它们与人类的关系。"},{"id":"g2_biology_u001_ex08","knowledge_id":"g2_biology_u001","question":"选择题：下列关于无脊椎动物的主要类群的说法，错误的是？ A. 在生态系统中有一定作用  B. 具有该类群的典型特征  C. 所有种类都对人类有害  D. 是生物多样性的组成部分","answer":"答案：C. 所有种类都对人类有害。解析：每类动物中都有与人类有益的种类和有害的种类，不能说全部都有害。它们都是生物多样性的重要组成部分，在生态系统中有各自的作用。"},{"id":"g2_biology_u001_ex09","knowledge_id":"g2_biology_u001","question":"简答题：请简述无脊椎动物的主要类群的主要特征。","answer":"答案：无脊椎动物的主要类群的主要特征包括：原生动物 → 腔肠动物 → 扁形动物 → 线形动物 → 环节动物 → 软体动物 → 节肢动物。无脊椎动物按照从简单到复杂的进化顺序可分为以上七大类群，它们的主要区别在于体壁结构、体腔有无、运动方式以及生活环境等方面。原生动物是最原始、最简单的动物，由单细胞构成；腔肠动物开始出现组织分化；扁形动物出现中胚层；线形动物开始出现假体腔；环节动物开始出现真正的体节和刚毛；软体动物身体柔软，有外套膜和贝壳；节肢动物是动物界中种类最多、数量最大、分布最广的类群。... 这些特征是区分该类群与其他类群的重要依据。"},{"id":"g2_biology_u001_ex10","knowledge_id":"g2_biology_u001","question":"选择题：学习无脊椎动物的主要类群时，最重要的是掌握？ A. 所有英文名称  B. 所有代表动物的细节  C. 该类群的主要特征  D. 所有种类的名字","answer":"答案：C. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"},{"id":"g2_biology_u002_ex01","knowledge_id":"g2_biology_u002","question":"选择题：原生动物的身体结构特点是？ A. 由一个细胞构成  B. 没有细胞结构  C. 由两层细胞构成  D. 由多个细胞构成","answer":"答案：A. 由一个细胞构成。解析：原生动物是动物界中最原始、最简单的动物，整个身体由一个细胞构成，所以也叫单细胞动物。这个细胞能完成全部生命活动。"},{"id":"g2_biology_u002_ex02","knowledge_id":"g2_biology_u002","question":"选择题：下列不属于原生动物的是？ A. 变形虫  B. 水螅  C. 草履虫  D. 疟原虫","answer":"答案：B. 水螅。解析：草履虫、变形虫、疟原虫都是原生动物（单细胞）。水螅是腔肠动物，由多个细胞构成，属于多细胞动物。"},{"id":"g2_biology_u002_ex03","knowledge_id":"g2_biology_u002","question":"填空题：原生动物的代表动物有______、______等。","answer":"答案：草履虫；变形虫（或疟原虫、眼虫等）。解析：原生动物是单细胞动物，代表动物有草履虫、变形虫、疟原虫、眼虫等。其中疟原虫能引起疟疾，通过按蚊传播。"},{"id":"g2_biology_u002_ex04","knowledge_id":"g2_biology_u002","question":"判断题：原生动物因为只有一个细胞，所以不能完成全部生命活动。（  ）","answer":"答案：错误。解析：原生动物虽然只有一个细胞，但这个细胞能够完成营养、呼吸、排泄、运动、生殖等全部生命活动。它是一个完整的生物体。"},{"id":"g2_biology_u002_ex05","knowledge_id":"g2_biology_u002","question":"选择题：草履虫依靠什么进行运动和摄食？ A. 纤毛  B. 鞭毛  C. 伪足  D. 触手","answer":"答案：A. 纤毛。解析：草履虫全身布满纤毛，依靠纤毛的摆动进行旋转式运动，并通过纤毛摆动把食物送进口沟。变形虫依靠伪足运动和摄食。"},{"id":"g2_biology_u002_ex06","knowledge_id":"g2_biology_u002","question":"填空题：能引起疟疾的原生动物是______。","answer":"答案：疟原虫。解析：疟原虫是一种寄生性原生动物，能引起疟疾，通过按蚊传播。疟疾是一种传染病，典型症状是周期性发冷发热。"},{"id":"g2_biology_u002_ex07","knowledge_id":"g2_biology_u002","question":"判断题：原生动物都是对人类有害的。（  ）","answer":"答案：错误。解析：原生动物有的对人有害（如疟原虫、阿米巴原虫），有的对人有益（如草履虫可以净化污水），还有的是鱼类的天然饵料。不能一概而论。"},{"id":"g2_biology_u002_ex08","knowledge_id":"g2_biology_u002","question":"选择题：动物界中最原始、最低等的动物类群是？ A. 原生动物  B. 腔肠动物  C. 扁形动物  D. 线形动物","answer":"答案：A. 原生动物。解析：原生动物整个身体由一个细胞构成，结构最简单，是动物界中最原始、最低等的动物类群。其他类群都是多细胞动物，结构更复杂。"},{"id":"g2_biology_u002_ex09","knowledge_id":"g2_biology_u002","question":"简答题：为什么说原生动物是动物界中最原始、最简单的动物类群？","answer":"答案：因为：①原生动物整个身体只由一个细胞构成（单细胞动物），而其他动物都是多细胞的；②结构最简单，没有组织、器官等结构分化；③这个单细胞能完成全部生命活动（营养、呼吸、排泄、生殖等）；④在进化上最原始，其他多细胞动物可能都是由古代的原生动物进化而来的。代表动物：草履虫、变形虫、疟原虫等。"},{"id":"g2_biology_u002_ex10","knowledge_id":"g2_biology_u002","question":"选择题：草履虫体内消化食物的结构是？ A. 伸缩泡  B. 食物泡  C. 胞肛  D. 口沟","answer":"答案：B. 食物泡。解析：草履虫的食物通过口沟进入体内，形成食物泡。食物泡随着细胞质流动，里面的食物逐渐被消化。伸缩泡主要功能是排泄和调节渗透压，胞肛排出食物残渣。"},{"id":"g2_biology_u003_ex02","knowledge_id":"g2_biology_u003","question":"选择题：下列关于腔肠动物的特征的描述，正确的是？ A. 辐射对称 ， 有口无肛门 ， 水螅、水母、海葵、珊瑚虫...  B. 明显错误的说法  C. 与事实完全相反的描述  D. 属于其他类群的特征","answer":"答案：A. 辐射对称 ， 有口无肛门 ， 水螅、水母、海葵、珊瑚虫...。解析：腔肠动物的特征的主要特征是：辐射对称 ， 有口无肛门 ， 水螅、水母、海葵、珊瑚虫。这是该类群的重要识别特征。"},{"id":"g2_biology_u003_ex03","knowledge_id":"g2_biology_u003","question":"选择题：下列动物中，具有\"辐射对称 \"特征的是？ A. 扁形动物  B. 原生动物  C. 腔肠动物  D. 腔肠动物类动物","answer":"答案：D. 腔肠动物类动物。解析：辐射对称 是腔肠动物的特征的特征之一。每类动物都有其独特的特征，这些特征是分类的重要依据。"},{"id":"g2_biology_u003_ex04","knowledge_id":"g2_biology_u003","question":"填空题：腔肠动物的特征的主要特征包括：______等。","answer":"答案：辐射对称 ， 有口无肛门 ， 水螅、水母、海葵、珊瑚虫。解析：腔肠动物的主要特征：身体呈辐射对称，即身体上下、左右、前后各个方向对称；身体由内胚层和外胚层两层细胞构成，中间是非细胞结构的中胶层；有口无肛门，食物从口进入，残渣也从口排出。水螅生活在淡水中，呈筒形，有触手和刺细胞。水母营漂浮生活。海葵和珊瑚虫营固着生活，珊瑚虫分泌的石灰质外壳堆积形成珊瑚礁。..."},{"id":"g2_biology_u003_ex05","knowledge_id":"g2_biology_u003","question":"判断题：腔肠动物的特征的特征只有一种。（  ）","answer":"答案：错误。解析：腔肠动物的特征有多个主要特征，包括辐射对称 ， 有口无肛门 ， 水螅、水母、海葵、珊瑚虫。这些特征共同构成了该类群的识别依据，判断时要综合考虑。"},{"id":"g2_biology_u003_ex06","knowledge_id":"g2_biology_u003","question":"选择题：在动物进化过程中，腔肠动物类比哪类更复杂高级？ A. 哺乳动物  B. 爬行动物  C. 原生动物  D. 鸟类","answer":"答案：C. 原生动物。解析：动物进化的大致顺序是：原生动物→腔肠动物→扁形动物→线形动物→环节动物→软体动物→节肢动物→脊椎动物（鱼→两栖→爬行→鸟→哺乳）。所以比原生动物更高级复杂。"},{"id":"g2_biology_u003_ex07","knowledge_id":"g2_biology_u003","question":"填空题：腔肠动物的特征的代表动物有______、______等。","answer":"答案：示例：根据具体类群填写。解析：每类动物都有其代表动物，学习时要结合代表动物来理解该类群的主要特征。腔肠动物的主要特征：身体呈辐射对称，即身体上下、左右、前后各个方向对称；身体由内胚层和外胚层两层细胞构成，中间是非细胞结构的中胶层；有口无肛门，食物从口进入，残..."},{"id":"g2_biology_u003_ex08","knowledge_id":"g2_biology_u003","question":"判断题：腔肠动物的特征都是有害的。（  ）","answer":"答案：错误。解析：生物对人类的影响是多方面的，腔肠动物类中有的对人有害，有的对人有益，还有的与人类没有直接利害关系。我们应该辩证地看待它们与人类的关系。"},{"id":"g2_biology_u003_ex09","knowledge_id":"g2_biology_u003","question":"选择题：下列关于腔肠动物的特征的说法，错误的是？ A. 是生物多样性的组成部分  B. 所有种类都对人类有害  C. 具有该类群的典型特征  D. 在生态系统中有一定作用","answer":"答案：B. 所有种类都对人类有害。解析：每类动物中都有与人类有益的种类和有害的种类，不能说全部都有害。它们都是生物多样性的重要组成部分，在生态系统中有各自的作用。"},{"id":"g2_biology_u003_ex10","knowledge_id":"g2_biology_u003","question":"简答题：请简述腔肠动物的特征的主要特征。","answer":"答案：腔肠动物的特征的主要特征包括：辐射对称 ， 有口无肛门 ， 水螅、水母、海葵、珊瑚虫。腔肠动物的主要特征：身体呈辐射对称，即身体上下、左右、前后各个方向对称；身体由内胚层和外胚层两层细胞构成，中间是非细胞结构的中胶层；有口无肛门，食物从口进入，残渣也从口排出。水螅生活在淡水中，呈筒形，有触手和刺细胞。水母营漂浮生活。海葵和珊瑚虫营固着生活，珊瑚虫分泌的石灰质外壳堆积形成珊瑚礁。... 这些特征是区分该类群与其他类群的重要依据。"},{"id":"g2_biology_u003_ex11","knowledge_id":"g2_biology_u003","question":"选择题：学习腔肠动物的特征时，最重要的是掌握？ A. 该类群的主要特征  B. 所有种类的名字  C. 所有代表动物的细节  D. 所有英文名称","answer":"答案：A. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"},{"id":"g2_biology_u004_ex01","knowledge_id":"g2_biology_u004","question":"选择题：下列关于扁形动物的特征的描述，正确的是？ A. 属于其他类群的特征  B. 明显错误的说法  C. 与事实完全相反的描述  D. 两侧对称 ， 三胚层 ， 涡虫、血吸虫、华枝睾吸虫...","answer":"答案：D. 两侧对称 ， 三胚层 ， 涡虫、血吸虫、华枝睾吸虫...。解析：扁形动物的特征的主要特征是：两侧对称 ， 三胚层 ， 涡虫、血吸虫、华枝睾吸虫。这是该类群的重要识别特征。"},{"id":"g2_biology_u004_ex02","knowledge_id":"g2_biology_u004","question":"选择题：下列动物中，具有\"两侧对称 \"特征的是？ A. 扁形动物类动物  B. 腔肠动物  C. 原生动物  D. 扁形动物","answer":"答案：A. 扁形动物类动物。解析：两侧对称 是扁形动物的特征的特征之一。每类动物都有其独特的特征，这些特征是分类的重要依据。"},{"id":"g2_biology_u004_ex03","knowledge_id":"g2_biology_u004","question":"填空题：扁形动物的特征的主要特征包括：______等。","answer":"答案：两侧对称 ， 三胚层 ， 涡虫、血吸虫、华枝睾吸虫。解析：扁形动物的主要特征：身体呈两侧对称（左右对称），身体分出前后、左右、背腹；身体由内胚层、中胚层和外胚层三个胚层构成。涡虫生活在淡水中，身体扁平，呈柳叶状，有眼点能感光。血吸虫和华枝睾吸虫是寄生在人或动物体内的寄生虫，可引起相应疾病。血吸虫病曾是我国重要的寄生虫病。..."},{"id":"g2_biology_u004_ex04","knowledge_id":"g2_biology_u004","question":"判断题：扁形动物的特征的特征只有一种。（  ）","answer":"答案：错误。解析：扁形动物的特征有多个主要特征，包括两侧对称 ， 三胚层 ， 涡虫、血吸虫、华枝睾吸虫。这些特征共同构成了该类群的识别依据，判断时要综合考虑。"},{"id":"g2_biology_u004_ex05","knowledge_id":"g2_biology_u004","question":"选择题：在动物进化过程中，扁形动物类比哪类更复杂高级？ A. 爬行动物  B. 原生动物  C. 鸟类  D. 哺乳动物","answer":"答案：B. 原生动物。解析：动物进化的大致顺序是：原生动物→腔肠动物→扁形动物→线形动物→环节动物→软体动物→节肢动物→脊椎动物（鱼→两栖→爬行→鸟→哺乳）。所以比原生动物更高级复杂。"},{"id":"g2_biology_u004_ex06","knowledge_id":"g2_biology_u004","question":"填空题：扁形动物的特征的代表动物有______、______等。","answer":"答案：示例：根据具体类群填写。解析：每类动物都有其代表动物，学习时要结合代表动物来理解该类群的主要特征。扁形动物的主要特征：身体呈两侧对称（左右对称），身体分出前后、左右、背腹；身体由内胚层、中胚层和外胚层三个胚层构成。涡虫生活在淡水中，身体扁平，呈柳叶状，有眼点..."},{"id":"g2_biology_u004_ex07","knowledge_id":"g2_biology_u004","question":"判断题：扁形动物的特征都是有害的。（  ）","answer":"答案：错误。解析：生物对人类的影响是多方面的，扁形动物类中有的对人有害，有的对人有益，还有的与人类没有直接利害关系。我们应该辩证地看待它们与人类的关系。"},{"id":"g2_biology_u004_ex08","knowledge_id":"g2_biology_u004","question":"选择题：下列关于扁形动物的特征的说法， 物的特征的特征只有一种。（  ）","answer":"答案：错误。解析：环节动物的特征有多个主要特征，包括真体腔 ， 分节 ， 刚毛或疣足 ， 蚯蚓、水蛭、沙蚕。这些特征共同构成了该类群的识别依据，判断时要综合考虑。"},{"id":"g2_biology_u006_ex05","knowledge_id":"g2_biology_u006","question":"选择题：在动物进化过程中，环节动物类比哪类更复杂高级？ A. 原生动物  B. 鸟类  C. 哺乳动物  D. 爬行动物","answer":"答案：A. 原生动物。解析：动物进化的大致顺序是：原生动物→腔肠动物→扁形动物→线形动物→环节动物→软体动物→节肢动物→脊椎动物（鱼→两栖→爬行→鸟→哺乳）。所以比原生动物更高级复杂。"},{"id":"g2_biology_u006_ex06","knowledge_id":"g2_biology_u006","question":"填空题：环节动物的特征的代表动物有______、______等。","answer":"答案：示例：根据具体类群填写。解析：每类动物都有其代表动物，学习时要结合代表动物来理解该类群的主要特征。环节动物的主要特征：身体由许多相似的体节构成（分节现象）；出现真体腔，即体腔壁上有肌肉层；多数种类有刚毛或疣足辅助运动。蚯蚓（环节动物门寡毛纲）是常见的环节动物..."},{"id":"g2_biology_u006_ex07","knowledge_id":"g2_biology_u006","question":"判断题：环节动物的特征都是有害的。（  ）","answer":"答案：错误。解析：生物对人类的影响是多方面的，环节动物类中有的对人有害，有的对人有益，还有的与人类没有直接利害关系。我们应该辩证地看待它们与人类的关系。"},{"id":"g2_biology_u006_ex08","knowledge_id":"g2_biology_u006","question":"选择题：下列关于环节动物的特征的说法，错误的是？ A. 具有该类群的典型特征  B. 在生态系统中有一定作用  C. 是生物多样性的组成部分  D. 所有种类都对人类有害","answer":"答案：D. 所有种类都对人类有害。解析：每类动物中都有与人类有益的种类和有害的种类，不能说全部都有害。它们都是生物多样性的重要组成部分，在生态系统中有各自的作用。"},{"id":"g2_biology_u006_ex09","knowledge_id":"g2_biology_u006","question":"简答题：请简述环节动物的特征的主要特征。","answer":"答案：环节动物的特征的主要特征包括：真体腔 ， 分节 ， 刚毛或疣足 ， 蚯蚓、水蛭、沙蚕。环节动物的主要特征：身体由许多相似的体节构成（分节现象）；出现真体腔，即体腔壁上有肌肉层；多数种类有刚毛或疣足辅助运动。蚯蚓（环节动物门寡毛纲）是常见的环节动物，生活在土壤中，以有机质为食，对土壤的肥力有重要作用。蚯蚓的身体分为许多体节，有环带（生殖带）位于较靠近前端的位置。水蛭（蚂蟥）吸食血液，沙蚕是鱼类的饵料。... 这些特征是区分该类群与其他类群的重要依据。"},{"id":"g2_biology_u006_ex10","knowledge_id":"g2_biology_u006","question":"选择题：学习环节动物的特征时，最重要的是掌握？ A. 所有英文名称  B. 该类群的主要特征  C. 所有种类的名字  D. 所有代表动物的细节","answer":"答案：B. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"},{"id":"g2_biology_u007_ex01","knowledge_id":"g2_biology_u007","question":"选择题：下列关于软体动物的特征的描述，正确的是？ A. 属于其他类群的特征  B. 身体柔软 ， 外套膜 ， 贝壳 ， 蜗牛、河蚌、乌贼、章鱼...  C. 明显错误的说法  D. 与事实完全相反的描述","answer":"答案：B. 身体柔软 ， 外套膜 ， 贝壳 ， 蜗牛、河蚌、乌贼、章鱼...。解析：软体动物的特征的主要特征是：身体柔软 ， 外套膜 ， 贝壳 ， 蜗牛、河蚌、乌贼、章鱼。这是该类群的重要识别特征。"},{"id":"g2_biology_u007_ex02","knowledge_id":"g2_biology_u007","question":"选择题：下列动物中，具有\ er":"答案：示例：根据具体类群填写。解析：每类动物都有其代表动物，学习时要结合代表动物来理解该类群的主要特征。昆虫是节肢动物中种类最多的一个纲（约100万种）。主要特征：身体分为头、胸、腹三部分；头部有一对触角、一对复眼和三对口器；胸部有三对足，一般有两对翅（少数无翅）..."},{"id":"g2_biology_u009_ex07","knowledge_id":"g2_biology_u009","question":"判断题：昆虫纲的主要特征都是有害的。（  ）","answer":"答案：错误。解析：生物对人类的影响是多方面的，昆虫纲类中有的对人有害，有的对人有益，还有的与人类没有直接利害关系。我们应该辩证地看待它们与人类的关系。"},{"id":"g2_biology_u009_ex08","knowledge_id":"g2_biology_u009","question":"选择题：下列关于昆虫纲的主要特征的说法，错误的是？ A. 具有该类群的典型特征  B. 是生物多样性的组成部分  C. 所有种类都对人类有害  D. 在生态系统中有一定作用","answer":"答案：C. 所有种类都对人类有害。解析：每类动物中都有与人类有益的种类和有害的种类，不能说全部都有害。它们都是生物多样性的重要组成部分，在生态系统中有各自的作用。"},{"id":"g2_biology_u009_ex09","knowledge_id":"g2_biology_u009","question":"简答题：请简述昆虫纲的主要特征的主要特征。","answer":"答案：昆虫纲的主要特征的主要特征包括：三对足 ， 两对翅 ， 一对触角 ， 变态发育。昆虫是节肢动物中种类最多的一个纲（约100万种）。主要特征：身体分为头、胸、腹三部分；头部有一对触角、一对复眼和三对口器；胸部有三对足，一般有两对翅（少数无翅）；呼吸器官为气管系统；多数种类进行变态发育（完全变态或不完全变态）。完全变态发育经过卵、幼虫、蛹、成虫四个时期，如蝴蝶、蜜蜂；不完全变态经过卵、若虫、成虫三个时期，如蝗虫、蟋蟀。... 这些特征是区分该类群与其他类群的重要依据。"},{"id":"g2_biology_u009_ex10","knowledge_id":"g2_biology_u009","question":"选择题：学习昆虫纲的主要特征时，最重要的是掌握？ A. 所有种类的名字  B. 所有代表动物的细节  C. 该类群的主要特征  D. 所有英文名称","answer":"答案：C. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"},{"id":"g2_biology_u010_ex01","knowledge_id":"g2_biology_u010","question":"选择题：下列关于甲壳纲的主要特征的描述，正确的是？ A. 与事实完全相反的描述  B. 属于其他类群的特征  C. 明显错误的说法  D. 两对触角 ， 头胸部甲壳 ， 步足和游泳足 ， 虾、蟹...","answer":"答案：D. 两对触角 ， 头胸部甲壳 ， 步足和游泳足 ， 虾、蟹...。解析：甲壳纲的主要特征的主要特征是：两对触角 ， 头胸部甲壳 ， 步足和游泳足 ， 虾、蟹。这是该类群的重要识别特征。"},{"id":"g2_biology_u010_ex02","knowledge_id":"g2_biology_u010","question":"选择题：下列动物中，具有\"两对触角 \"特征的是？ A. 甲壳纲类动物  B. 扁形动物  C. 原生动物  D. 腔肠动物","answer":"答案：A. 甲壳纲类动物。解析：两对触角 是甲壳纲的主要特征的特征之一。每类动物都有其独特的特征，这些特征是分类的重要依据。"},{"id":"g2_biology_u010_ex03","knowledge_id":"g2_biology_u010","question":"填空题：甲壳纲的主要特征的主要特征包括：______等。","answer":"答案：两对触角 ， 头胸部甲壳 ， 步足和游泳足 ， 虾、蟹。解析：甲壳纲动物主要特征：身体分为头胸部和腹部两部分；头胸部外面包着坚韧的头胸甲；一般有五对步足用于行走，多对游泳足用于游泳；有两对触角。代表动物：虾和蟹。虾的腹部发达，有尾扇；蟹的腹部退化紧贴头胸部（俗称脐）。甲壳动物多数生活在水中，以浮游生物或有机碎屑为食。..."},{"id":"g2_biology_u010_ex04","knowledge_id":"g2_bi  该类群的主要特征  D. 所有种类的名字","answer":"答案：C. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"},{"id":"g2_biology_u012_ex01","knowledge_id":"g2_biology_u012","question":"选择题：下列关于鱼类的特征的描述，正确的是？ A. 属于其他类群的特征  B. 明显错误的说法  C. 与事实完全相反的描述  D. 变温动物 ， 终生生活在水中 ， 用鳃呼吸 ， 用鳍游泳 ，...","answer":"答案：D. 变温动物 ， 终生生活在水中 ， 用鳃呼吸 ， 用鳍游泳 ，...。解析：鱼类的特征的主要特征是：变温动物 ， 终生生活在水中 ， 用鳃呼吸 ， 用鳍游泳 ， 体表有鳞片。这是该类群的重要识别特征。"},{"id":"g2_biology_u012_ex02","knowledge_id":"g2_biology_u012","question":"选择题：下列动物中，具有\"变温动物 \"特征的是？ A. 腔肠动物  B. 原生动物  C. 扁形动物  D. 鱼类类动物","answer":"答案：D. 鱼类类动物。解析：变温动物 是鱼类的特征的特征之一。每类动物都有其独特的特征，这些特征是分类的重要依据。"},{"id":"g2_biology_u012_ex03","knowledge_id":"g2_biology_u012","question":"填空题：鱼类的特征的主要特征包括：______等。","answer":"答案：变温动物 ， 终生生活在水中 ， 用鳃呼吸 ， 用鳍游泳 ， 体表有鳞片。解析：鱼类是脊椎动物中种类最多的类群（约24000种）。主要特征：终生生活在水中；用鳃呼吸，鳃丝密布毛细血管；用鳍游泳；体表覆盖鳞片，分泌黏液减少摩擦；心脏有一心房一心室，血液循环为单循环；体温随环境变化（变温动物）。鱼类可分为软骨鱼（如鲨鱼、鳐鱼）和硬骨鱼（如鲤鱼、鲫鱼、带鱼）。..."},{"id":"g2_biology_u012_ex04","knowledge_id":"g2_biology_u012","question":"判断题：鱼类的特征的特征只有一种。（  ）","answer":"答案：错误。解析：鱼类的特征有多个主要特征，包括变温动物 ， 终生生活在水中 ， 用鳃呼吸 ， 用鳍游泳 ， 体表有鳞片。这些特征共同构成了该类群的识别依据，判断时要综合考虑。"},{"id":"g2_biology_u012_ex05","knowledge_id":"g2_biology_u012","question":"选择题：在动物进化过程中，鱼类类比哪类更复杂高级？ A. 爬行动物  B. 原生动物  C. 哺乳动物  D. 鸟类","answer":"答案：B. 原生动物。解析：动物进化的大致顺序是：原生动物→腔肠动物→扁形动物→线形动物→环节动物→软体动物→节肢动物→脊椎动物（鱼→两栖→爬行→鸟→哺乳）。所以比原生动物更高级复杂。"},{"id":"g2_biology_u012_ex06","knowledge_id":"g2_biology_u012","question":"填空题：鱼类的特征的代表动物有______、______等。","answer":"答案：示例：根据具体类群填写。解析：每类动物都有其代表动物，学习时要结合代表动物来理解该类群的主要特征。鱼类是脊椎动物中种类最多的类群（约24000种）。主要特征：终生生活在水中；用鳃呼吸，鳃丝密布毛细血管；用鳍游泳；体表覆盖鳞片，分泌黏液减少摩擦；心脏有一心房一..."},{"id":"g2_biology_u012_ex07","knowledge_id":"g2_biology_u012","question":"判断题：鱼类的特征都是有害的。（  ）","answer":"答案：错误。解析：生物对人类的影响是多方面的，鱼类类中有的对人有害，有的对人有益，还有的与人类没有直接利害关系。我们应该辩证地看待它们与人类的关系。"},{"id":"g2_biology_u012_ex08","knowledge_id":"g2_biology_u012","question":"选择题：下列关于鱼类的特征的说法，错误的是？ A. 所有种类都对人类有害  B. 是生物多样性的组成部分  C. 在生态系统中有一定作用  D. 具有该类群的典型特征","answer":"答案：A. 所有种类都对人类有害。解析：每类动物中都有与人类有益的种类和有害的种类，不能说全 dge_id":"g2_biology_u014","question":"判断题：爬行动物的特征的特征只有一种。（  ）","answer":"答案：错误。解析：爬行动物的特征有多个主要特征，包括陆生 ， 体表有角质鳞片或甲 ， 用肺呼吸 ， 变温动物 ， 体内受精。这些特征共同构成了该类群的识别依据，判断时要综合考虑。"},{"id":"g2_biology_u014_ex05","knowledge_id":"g2_biology_u014","question":"选择题：在动物进化过程中，爬行动物类比哪类更复杂高级？ A. 哺乳动物  B. 爬行动物  C. 原生动物  D. 鸟类","answer":"答案：C. 原生动物。解析：动物进化的大致顺序是：原生动物→腔肠动物→扁形动物→线形动物→环节动物→软体动物→节肢动物→脊椎动物（鱼→两栖→爬行→鸟→哺乳）。所以比原生动物更高级复杂。"},{"id":"g2_biology_u014_ex06","knowledge_id":"g2_biology_u014","question":"填空题：爬行动物的特征的代表动物有______、______等。","answer":"答案：示例：根据具体类群填写。解析：每类动物都有其代表动物，学习时要结合代表动物来理解该类群的主要特征。爬行动物的主要特征：体表覆盖角质鳞片或甲，能防止水分散失，适于陆地生活；用肺呼吸；体温随环境变化（变温动物）；体内受精，卵有坚韧的卵壳保护；多数种类在陆地上产卵..."},{"id":"g2_biology_u014_ex07","knowledge_id":"g2_biology_u014","question":"判断题：爬行动物的特征都是有害的。（  ）","answer":"答案：错误。解析：生物对人类的影响是多方面的，爬行动物类中有的对人有害，有的对人有益，还有的与人类没有直接利害关系。我们应该辩证地看待它们与人类的关系。"},{"id":"g2_biology_u014_ex08","knowledge_id":"g2_biology_u014","question":"选择题：下列关于爬行动物的特征的说法，错误的是？ A. 是生物多样性的组成部分  B. 具有该类群的典型特征  C. 在生态系统中有一定作用  D. 所有种类都对人类有害","answer":"答案：D. 所有种类都对人类有害。解析：每类动物中都有与人类有益的种类和有害的种类，不能说全部都有害。它们都是生物多样性的重要组成部分，在生态系统中有各自的作用。"},{"id":"g2_biology_u014_ex09","knowledge_id":"g2_biology_u014","question":"简答题：请简述爬行动物的特征的主要特征。","answer":"答案：爬行动物的特征的主要特征包括：陆生 ， 体表有角质鳞片或甲 ， 用肺呼吸 ， 变温动物 ， 体内受精。爬行动物的主要特征：体表覆盖角质鳞片或甲，能防止水分散失，适于陆地生活；用肺呼吸；体温随环境变化（变温动物）；体内受精，卵有坚韧的卵壳保护；多数种类在陆地上产卵。爬行动物是真正的陆生脊椎动物。代表动物：蛇、龟、蜥蜴、扬子鳄。扬子鳄是国家一级保护动物。恐龙也是古代爬行动物，现在已灭绝。... 这些特征是区分该类群与其他类群的重要依据。"},{"id":"g2_biology_u014_ex10","knowledge_id":"g2_biology_u014","question":"选择题：学习爬行动物的特征时，最重要的是掌握？ A. 所有种类的名字  B. 该类群的主要特征  C. 所有英文名称  D. 所有代表动物的细节","answer":"答案：B. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"},{"id":"g2_biology_u015_ex01","knowledge_id":"g2_biology_u015","question":"选择题：下列关于鸟类的特征的描述，正确的是？ A. 与事实完全相反的描述  B. 恒温动物 ， 体表覆羽 ， 前肢变为翼 ， 双重呼吸 ， 体...  C. 属于其他类群的特征  D. 明显错误的说法","answer":"答案：B. 恒温动物 ， 体表覆羽 ， 前肢变为翼 ， 双重呼吸 ， 体...。解析：鸟类的特征的主要特征是：恒温动物 ， 体表覆羽 ， 前肢变为翼 ， 双重呼吸 ， 体温恒定（约42℃）。这是该类群的重要识别特征。"},{"id":"g2_biology_u015_ex02","knowledge_id":"g2_biology_u015","question":"选择题：下列动物中，具有\"恒温动物 \"特征的是？ A. 鸟类类动物  B. 原生动物  C. 扁形动物  D. 腔肠动物","answer":"答案：A. 鸟类类动物。解析：恒温动物 是鸟类的特征的特征之一。每类动物都有其独特的特征，这些特征是分类的重要依据。"},{"id":"g2_biology_u015_ex03","knowledge_id":"g2_biology_u015","question":"填空题：鸟类的特征的主要特征包括：______等。","answer":"答案：恒温动物 ， 体表覆羽 ， 前肢变为翼 ， 双重呼吸 ， 体温恒定（约42℃）。解析：鸟类的主要特征：体表覆羽，前肢变为翼，能飞行（少数不能飞行如企鹅、鸵鸟）；骨骼轻而坚固，长骨中空；胸骨发达，有龙骨突；用肺呼吸，有气囊辅助呼吸（双重呼吸）；体温恒定（约42℃），心脏四腔，血液循环双循环；体内受精，卵生。鸟类适于飞行的特点：身体呈流线型、前肢变翼、骨骼中空、有羽毛等。..."},{"id":"g2_biology_u015_ex04","knowledge_id":"g2_biology_u015","question":"判断题：鸟类的特征的特征只有一种。（  ）","answer":"答案：错误。解析：鸟类的特征有多个主要特征，包括恒温动物 ， 体表覆羽 ， 前肢变为翼 ， 双重呼吸 ， 体温恒定（约42℃）。这些特征共同构成了该类群的识别依据，判断时要综合考虑。"},{"id":"g2_biology_u015_ex05","knowledge_id":"g2_biology_u015","question":"选择题：在动物进化过程中，鸟类类比哪类更复杂高级？ A. 爬行动物  B. 原生动物  C. 哺乳动物  D. 鸟类","answer":"答案：B. 原生动物。解析：动物进化的大致顺序是：原生动物→腔肠动物→扁形动物→线形动物→环节动物→软体动物→节肢动物→脊椎动物（鱼→两栖→爬行→鸟→哺乳）。所以比原生动物更高级复杂。"},{"id":"g2_biology_u015_ex06","knowledge_id":"g2_biology_u015","question":"填空题：鸟类的特征的代表动物有______、______等。","answer":"答案：示例：根据具体类群填写。解析：每类动物都有其代表动物，学习时要结合代表动物来理解该类群的主要特征。鸟类的主要特征：体表覆羽，前肢变为翼，能飞行（少数不能飞行如企鹅、鸵鸟）；骨骼轻而坚固，长骨中空；胸骨发达，有龙骨突；用肺呼吸，有气囊辅助呼吸（双重呼吸）；体温..."},{"id":"g2_biology_u015_ex07","knowledge_id":"g2_biology_u015","question":"判断题：鸟类的特征都是有害的。（  ）","answer":"答案：错误。解析：生物对人类的影响是多方面的，鸟类类中有的对人有害，有的对人有益，还有的与人类没有直接利害关系。我们应该辩证地看待它们与人类的关系。"},{"id":"g2_biology_u015_ex08","knowledge_id":"g2_biology_u015","question":"选择题：下列关于鸟类的特征的说法，错误的是？ A. 在生态系统中有一定作用  B. 所有种类都对人类有害  C. 具有该类群的典型特征  D. 是生物多样性的组成部分","answer":"答案：B. 所有种类都对人类有害。解析：每类动物中都有与人类有益的种类和有害的种类，不能说全部都有害。它们都是生物多样性的重要组成部分，在生态系统中有各自的作用。"},{"id":"g2_biology_u015_ex09","knowledge_id":"g2_biology_u015","question":"简答题：请简述鸟类的特征的主要特征。","answer":"答案：鸟类的特征的主要特征包括：恒温动物 ， 体表覆羽 ， 前肢变为翼 ， 双重呼吸 ， 体温恒定（约42℃）。鸟类的主要特征：体表覆羽，前肢变为翼，能飞行（少数不能飞行如企鹅、鸵鸟）；骨骼轻而坚固，长骨中空；胸骨发达，有龙骨突；用肺呼吸，有气囊辅助呼吸（双重呼吸）；体温恒定（约42℃），心脏四腔，血液循环双循环；体内受精，卵生。鸟类适于飞行的特点：身体呈流线型、前肢变翼、骨骼中空、有羽毛等。... 这些特征是区分该类群与其他类群的重要依据。"},{"id":"g2_biology_u015_ex10","knowledge_id":"g2_biology_u015","question":"选择题：学习鸟类的特征时，最重要的是掌握？ A. 所有种类的名字  B. 所有代表动物的细节  C. 该类群的主要特征  D. 所有英文名称","answer":"答案：C. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"},{"id":"g2_biology_u016_ex01","knowledge_id":"g2_biology_u016","question":"选择题：下列关于哺乳动物的特征的描述，正确的是？ A. 属于其他类群的特征  B. 胎生哺乳 ， 体表被毛 ， 体温恒定 ， 大脑发达 ， 胎生...  C. 明显错误的说法  D. 与事实完全相反的描述","answer":"答案：B. 胎生哺乳 ， 体表被毛 ， 体温恒定 ， 大脑发达 ， 胎生...。解析：哺乳动物的特征的主要特征是：胎生哺乳 ， 体表被毛 ， 体温恒定 ， 大脑发达 ， 胎生、哺乳。这是该类群的重要识别特征。"},{"id":"g2_biology_u016_ex02","knowledge_id":"g2_biology_u016","question":"选择题：下列动物中，具有\"胎生哺乳 \"特征的是？ A. 腔肠动物  B. 原生动物  C. 扁形动物  D. 哺乳动物类动物","answer":"答案：D. 哺乳动物类动物。解析：胎生哺乳 是哺乳动物的特征的特征之一。每类动物都有其独特的特征，这些特征是分类的重要依据。"},{"id":"g2_biology_u016_ex03","knowledge_id":"g2_biology_u016","question":"填空题：哺乳动物的特征的主要特征包括：______等。","answer":"答案：胎生哺乳 ， 体表被毛 ， 体温恒定 ， 大脑发达 ， 胎生、哺乳。解析：哺乳动物的主要特征：体表被毛，保温性能好；体温恒定（约36-37℃）；心脏四腔，血液循环完全双循环；大脑皮层发达，行为复杂；胎生哺乳（是哺乳动物特有的繁殖方式），胚胎在母体子宫内发育，通过胎盘获取营养，出生后以母乳喂养。哺乳动物是动物界中最高等的类群，包括鲸、蝙蝠、鼠、兔、牛、羊、人等。哺乳动物能很..."},{"id":"g2_biology_u016_ex04","knowledge_id":"g2_biology_u016","question":"判断题：哺乳动物的特征的特征只有一种。（  ）","answer":"答案：错误。解析：哺乳动物的特征有多个主要特征，包括胎生哺乳 ， 体表被毛 ， 体温恒定 ， 大脑发达 ， 胎生、哺乳。这些特征共同构成了该类群的识别依据，判断时要综合考虑。"},{"id":"g2_biology_u016_ex05","knowledge_id":"g2_biology_u016","question":"选择题：在动物进化过程中，哺乳动物类比哪类更复杂高级？ A. 爬行动物  B. 原生动物  C. 哺乳动物  D. 鸟类","answer":"答案：B. 原生动物。解析：动物进化的大致顺序是：原生动物→腔肠动物→扁形动物→线形动物→环节动物→软体动物→节肢动物→脊椎动物（鱼→两栖→爬行→鸟→哺乳）。所以比原生动物更高级复杂。"},{"id":"g2_biology_u016_ex06","knowledge_id":"g2_biology_u016","question":"填空题：哺乳动物的特征的代表动物有______、______等。","answer":"答案：示例：根据具体类群填写。解析：每类动物都有其代表动物，学习时要结合代表动物来理解该类群的主要特征。哺乳动物的主要特征：体表被毛，保温性能好；体温恒定（约36-37℃）；心脏四腔，血液循环完全双循环；大脑皮层发达，行为复杂；胎生哺乳（是哺乳动物特有的繁殖方式）..."},{"id":"g2_biology_u016_ex07","knowledge_id":"g2_biology_u016","question":"判断题：哺乳动物的特征都是有害的。（  ）","answer":"答案：错误。解析：生物对人类的影响是多方面的，哺乳动物类中有的对人有害，有的对人有益，还有的与人类没有直接利害关系。我们应该辩证地看待它们与人类的关系。"},{"id":"g2_biology_u016_ex08","knowledge_id":"g2_biology_u016","question":"选择题：下列关于哺乳动物的特征的说法，错误的是？ A. 是生物多样性的组成部分  B. 具有该类群的典型特征  C. 所有种类都对人类有害  D. 在生态系统中有一定作用","answer":"答案：C. 所有种类都对人类有害。解析：每类动物中都有与人类有益的种类和有害的种类，不能说全部都有害。它们都是生物多样性的重要组成部分，在生态系统中有各自的作用。"},{"id":"g2_biology_u016_ex09","knowledge_id":"g2_biology_u016","question":"简答题：请简述哺乳动物的特征的主要特征。","answer":"答案：哺乳动物的特征的主要特征包括：胎生哺乳 ， 体表被毛 ， 体温恒定 ， 大脑发达 ， 胎生、哺乳。哺乳动物的主要特征：体表被毛，保温性能好；体温恒定（约36-37℃）；心脏四腔，血液循环完全双循环；大脑皮层发达，行为复杂；胎生哺乳（是哺乳动物特有的繁殖方式），胚胎在母体子宫内发育，通过胎盘获取营养，出生后以母乳喂养。哺乳动物是动物界中最高等的类群，包括鲸、蝙蝠、鼠、兔、牛、羊、人等。哺乳动物能很好地适应各种环境。... 这些特征是区分该类群与其他类群的重要依据。"},{"id":"g2_biology_u016_ex10","knowledge_id":"g2_biology_u016","question":"选择题：学习哺乳动物的特征时，最重要的是掌握？ A. 所有英文名称  B. 所有代表动物的细节  C. 所有种类的名字  D. 该类群的主要特征","answer":"答案：D. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"},{"id":"g2_biology_u017_ex01","knowledge_id":"g2_biology_u017","question":"选择题：下列关于动物的运动结构的描述，正确的是？ A. 明显错误的说法  B. 与事实完全相反的描述  C. 骨 ， 关节 ， 肌肉...  D. 属于其他类群的特征","answer":"答案：C. 骨 ， 关节 ， 肌肉...。解析：动物的运动结构的主要特征是：骨 ， 关节 ， 肌肉。这是该类群的重要识别特征。"},{"id":"g2_biology_u017_ex02","knowledge_id":"g2_biology_u017","question":"选择题：下列动物中，具有\"骨 \"特征的是？ A. 腔肠动物  B. 扁形动物  C. 动物类动物  D. 原生动物","answer":"答案：C. 动物类动物。解析：骨 是动物的运动结构的特征之一。每类动物都有其独特的特征，这些特征是分类的重要依据。"},{"id":"g2_biology_u017_ex03","knowledge_id":"g2_biology_u017","question":"填空题：动物的运动结构的主要特征包括：______等。","answer":"答案：骨 ， 关节 ， 肌肉。解析：动物的运动主要由运动系统完成，运动系统由骨、关节和肌肉三部分组成。骨起杠杆作用，关节是支点，肌肉起动力作用。骨骼肌包括中间较粗的肌腹和两端较细的肌腱，肌腱结缔组织，将骨骼肌牢固地附着在骨上。一块骨骼肌至少跨越一个关节，牵引骨产生运动。骨本身不能运动，必须靠肌肉的牵引才能运动。..."},{"id":"g2_biology_u017_ex04","knowledge_id":"g2_biology_u017","question":"判断题：动物的运动结构的特征只有一种。（  ）","answer":"答案：错误。解析：动物的运动结构有多个主要特征，包括骨 ， 关节 ， 肌肉。这些特征共同构成了该类群的识别依据，判断时要综合考虑。"},{"id":"g2_biology_u017_ex05","knowledge_id":"g2_biology_u017","question":"选择题：在动物进化过程中，动物类比哪类更复杂高级？ A. 鸟类  B. 原生动物  C. 爬行动物  D. 哺乳动物","answer":"答案：B. 原生动物。解析：动物进化的大致顺序是：原生动物→腔肠动物→扁形动物→线形动物→环节动物→软体动物→节肢动物→脊椎动物（鱼→两栖→爬行→鸟→哺乳）。所以比原生动物更高级复杂。"},{"id":"g2_biology_u017_ex06","knowledge_id":"g2_biology_u017","question":"填空题：动物的运动结构的代表动物有______、______等。","answer":"答案：示例：根据具体类群填写。解析：每类动物都有其代表动物，学习时要结合代表动物来 各自的作用。"},{"id":"g2_biology_u020_ex09","knowledge_id":"g2_biology_u020","question":"简答题：请简述动物行为的类型的主要特征。","answer":"答案：动物行为的类型的主要特征包括：觅食行为 ， 防御行为 ， 生殖行为 ， 迁徙行为 ， 社群行为。动物行为是动物对外界环境变化和周围环境的各种刺激所做出的反应。主要类型包括：觅食行为（获取食物的行为）；防御行为（防御敌害，保护自己的行为）；生殖行为（与繁殖后代有关的行为，如求偶、交配、孵卵、育雏）；迁徙行为（鸟类等动物随季节变化而进行的距离迁移）；社群行为（群体内部不同成员之间分工合作，共同维持群体生活的行为）。... 这些特征是区分该类群与其他类群的重要依据。"},{"id":"g2_biology_u020_ex10","knowledge_id":"g2_biology_u020","question":"选择题：学习动物行为的类型时，最重要的是掌握？ A. 该类群的主要特征  B. 所有英文名称  C. 所有种类的名字  D. 所有代表动物的细节","answer":"答案：A. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"},{"id":"g2_biology_u021_ex01","knowledge_id":"g2_biology_u021","question":"选择题：下列关于先天性行为和学习行为的描述，正确的是？ A. 与事实完全相反的描述  B. 先天性行为：生来就有 ， 遗传因素 ， 蜘蛛结网、鸟类迁徙 ...  C. 属于其他类群的特征  D. 明显错误的说法","answer":"答案：B. 先天性行为：生来就有 ， 遗传因素 ， 蜘蛛结网、鸟类迁徙 ...。解析：先天性行为和学习行为的主要特征是：先天性行为：生来就有 ， 遗传因素 ， 蜘蛛结网、鸟类迁徙 ， 学习行为：后天学习 ， 环境因素 ， 鹦鹉学舌、黑猩猩使用工具。这是该类群的重要识别特征。"},{"id":"g2_biology_u021_ex02","knowledge_id":"g2_biology_u021","question":"选择题：下列动物中，具有\"先天性行为：生来就有 \"特征的是？ A. 扁形动物  B. 腔肠动物  C. 先天性行为和学习行为类动物  D. 原生动物","answer":"答案：C. 先天性行为和学习行为类动物。解析：先天性行为：生来就有 是先天性行为和学习行为的特征之一。每类动物都有其独特的特征，这些特征是分类的重要依据。"},{"id":"g2_biology_u021_ex03","knowledge_id":"g2_biology_u021","question":"填空题：先天性行为和学习行为的主要特征包括：______等。","answer":"答案：先天性行为：生来就有 ， 遗传因素 ， 蜘蛛结网、鸟类迁徙 ， 学习行为：后天学习 ， 环境因素 ， 鹦鹉学舌、黑猩猩使用工具。解析：根据行为获得方式可分为：先天性行为（本能行为）是指动物生来就有的，由遗传因素决定的行为，如蜘蛛结网、鸟类迁徙、蜜蜂采蜜、婴儿吃奶等，这类行为具有物种特异性。学习行为则是动物在成长过程中通过学习和经验获得的，由环境因素决定，如鹦鹉学舌、黑猩猩使用工具、表演动物的表演等。先天性行为是学习行为的基础，学习..."},{"id":"g2_biology_u021_ex04","knowledge_id":"g2_biology_u021","question":"判断题：先天性行为和学习行为的特征只有一种。（  ）","answer":"答案：错误。解析：先天性行为和学习行为有多个主要特征，包括先天性行为：生来就有 ， 遗传因素 ， 蜘蛛结网、鸟类迁徙 ， 学习行为：后天学习 ， 环境因素 ， 鹦鹉学舌、黑猩猩使用工具。这些特征共同构成了该类群的识别依据，判断时要综合考虑。"},{"id":"g2_biology_u021_ex05","knowledge_id":"g2_biology_u021","question":"选择题：在动物进化过程中，先天性行为和学习行为类比哪类更复杂高级？ A. 鸟类  B. 哺乳动物  C. 原生动物  D. 爬行动物","answer":"答案：C. 原生动物。解析：动物进化的大致顺序是：原生动物→腔肠动物→扁形动物→线形动物→环节动物→软体动物→节肢动物→脊椎动物（鱼→两栖→爬行→鸟→哺乳）。所以比原生动物更高级复杂。"},{"id":"g2_biology_u021_ex06","knowledge_id":"g2_biology_u021","question":"填空题：先天性行为和学习行为的代表动物有______、______等。","answer":"答案：示例：根据具体类群填写。解析：每类动物都有其代表动物，学习时要结合代表动物来理解该类群的主要特征。根据行为获得方式可分为：先天性行为（本能行为）是指动物生来就有的，由遗传因素决定的行为，如蜘蛛结网、鸟类迁徙、蜜蜂采蜜、婴儿吃奶等，这类行为具有物种特异性。学习..."},{"id":"g2_biology_u021_ex07","knowledge_id":"g2_biology_u021","question":"判断题：先天性行为和学习行为都是有害的。（  ）","answer":"答案：错误。解析：生物对人类的影响是多方面的，先天性行为和学习行为类中有的对人有害，有的对人有益，还有的与人类没有直接利害关系。我们应该辩证地看待它们与人类的关系。"},{"id":"g2_biology_u021_ex08","knowledge_id":"g2_biology_u021","question":"选择题：下列关于先天性行为和学习行为的说法，错误的是？ A. 在生态系统中有一定作用  B. 所有种类都对人类有害  C. 是生物多样性的组成部分  D. 具有该类群的典型特征","answer":"答案：B. 所有种类都对人类有害。解析：每类动物中都有与人类有益的种类和有害的种类，不能说全部都有害。它们都是生物多样性的重要组成部分，在生态系统中有各自的作用。"},{"id":"g2_biology_u021_ex09","knowledge_id":"g2_biology_u021","question":"简答题：请简述先天性行为和学习行为的主要特征。","answer":"答案：先天性行为和学习行为的主要特征包括：先天性行为：生来就有 ， 遗传因素 ， 蜘蛛结网、鸟类迁徙 ， 学习行为：后天学习 ， 环境因素 ， 鹦鹉学舌、黑猩猩使用工具。根据行为获得方式可分为：先天性行为（本能行为）是指动物生来就有的，由遗传因素决定的行为，如蜘蛛结网、鸟类迁徙、蜜蜂采蜜、婴儿吃奶等，这类行为具有物种特异性。学习行为则是动物在成长过程中通过学习和经验获得的，由环境因素决定，如鹦鹉学舌、黑猩猩使用工具、表演动物的表演等。先天性行为是学习行为的基础，学习行为能增强动物适应环境的能力。... 这些特征是区分该类群与其他类群的重要依据。"},{"id":"g2_biology_u021_ex10","knowledge_id":"g2_biology_u021","question":"选择题：学习先天性行为和学习行为时，最重要的是掌握？ A. 该类群的主要特征  B. 所有代表动物的细节  C. 所有种类的名字  D. 所有英文名称","answer":"答案：A. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"},{"id":"g2_biology_u022_ex01","knowledge_id":"g2_biology_u022","question":"选择题：下列关于社会行为（社群行为）的特征的描述，正确的是？ A. 明显错误的说法  B. 群体内部形成分工 ， 成员间有明确的分工 ， 不同的等级 ，...  C. 属于其他类群的特征  D. 与事实完全相反的描述","answer":"答案：B. 群体内部形成分工 ， 成员间有明确的分工 ， 不同的等级 ，...。解析：社会行为（社群行为）的特征的主要特征是：群体内部形成分工 ， 成员间有明确的分工 ， 不同的等级 ， 信息交流方式。这是该类群的重要识别特征。"},{"id":"g2_biology_u022_ex02","knowledge_id":"g2_biology_u022","question":"选择题：下列动物中，具有\"群体内部形成分工 \"特征的是？ A. 社会行为（社群行为）类动物  B. 原生动物  C. 扁形动物  D. 腔肠动物","answer":"答案：A. 社会行为（社群行为）类动物。解析：群体内部形成分工 是社会行为（社群行为）的特征的特征之一。每类动物都有其独特的特征，这些特征是分类的重要依据。"},{"id":"g2_biology_u022_ex03","knowledge_id":"g2_biology_u022","question":"填空题：社会行为（社群行为）的特征的主要特征包括：______等。","answer":"答案：群体内部形成分工 ， 成员间有明确的分工 ， 不同的等级 ， 信息交流方式。解析：社会行为（社群行为）是指群体内部不同成员之间分工合作，共同维持群体生活的行为。具有以下特征：群体内部形成一定的组织；成员之间有明确的分工；有的还有等级次序。典型的社群行为例子：蜜蜂群体中有蜂王（专职繁殖）、工蜂（劳动）和雄蜂（交配）；白蚁群体中有蚁后、蚁王、工蚁、兵蚁；狒狒群体中有首领（最占优势）。..."},{"id":"g2_biology_u022_ex04","knowledge_id":"g2_biology_u022","question":"判断题：社会行为（社群行为）的特征的特征只有一种。（  ）","answer":"答案：错误。解析：社会行为（社群行为）的特征有多个主要特征，包括群体内部形成分工 ， 成员间有明确的分工 ， 不同的等级 ， 信息交流方式。这些特征共同构成了该类群的识别依据，判断时要综合考虑。"},{"id":"g2_biology_u022_ex05","knowledge_id":"g2_biology_u022","question":"选择题：在动物进化过程中，社会行为（社群行为）类比哪类更复杂高级？ A. 哺乳动物  B. 鸟类  C. 原生动物  D. 爬行动物","answer":"答案：C. 原生动物。解析：动物进化的大致顺序是：原生动物→腔肠动物→扁形动物→线形动物→环节动物→软体动物→节肢动物→脊椎动物（鱼→两栖→爬行→鸟→哺乳）。所以比原生动物更高级复杂。"},{"id":"g2_biology_u022_ex06","knowledge_id":"g2_biology_u022","question":"填空题：社会行为（社群行为）的特征的代表动物有______、______等。","answer":"答案：示例：根据具体类群填写。解析：每类动物都有其代表动物，学习时要结合代表动物来理解该类群的主要特征。社会行为（社群行为）是指群体内部不同成员之间分工合作，共同维持群体生活的行为。具有以下特征：群体内部形成一定的组织；成员之间有明确的分工；有的还有等级次序。典型..."},{"id":"g2_biology_u022_ex07","knowledge_id":"g2_biology_u022","question":"判断题：社会行为（社群行为）的特征都是有害的。（  ）","answer":"答案：错误。解析：生物对人类的影响是多方面的，社会行为（社群行为）类中有的对人有害，有的对人有益，还有的与人类没有直接利害关系。我们应该辩证地看待它们与人类的关系。"},{"id":"g2_biology_u022_ex08","knowledge_id":"g2_biology_u022","question":"选择题：下列关于社会行为（社群行为）的特征的说法，错误的是？ A. 具有该类群的典型特征  B. 在生态系统中有一定作用  C. 是生物多样性的组成部分  D. 所有种类都对人类有害","answer":"答案：D. 所有种类都对人类有害。解析：每类动物中都有与人类有益的种类和有害的种类，不能说全部都有害。它们都是生物多样性的重要组成部分，在生态系统中有各自的作用。"},{"id":"g2_biology_u022_ex09","knowledge_id":"g2_biology_u022","question":"简答题：请简述社会行为（社群行为）的特征的主要特征。","answer":"答案：社会行为（社群行为）的特征的主要特征包括：群体内部形成分工 ， 成员间有明确的分工 ， 不同的等级 ， 信息交流方式。社会行为（社群行为）是指群体内部不同成员之间分工合作，共同维持群体生活的行为。具有以下特征：群体内部形成一定的组织；成员之间有明确的分工；有的还有等级次序。典型的社群行为例子：蜜蜂群体中有蜂王（专职繁殖）、工蜂（劳动）和雄蜂（交配）；白蚁群体中有蚁后、蚁王、工蚁、兵蚁；狒狒群体中有首领（最占优势）。社群行为有利于动物更好地适应环境，提高生存和繁殖能力。... 这些特征是区分该类群与其他类群的重要依据。"},{"id":"g2_biology_u022_ex10","knowledge_id":"g2_biology_u022","question":"选择题：学习社会行为（社群行为）的特征时，最重要的是掌握？ A. 该类群的主要特征  B. 所有代表动物的细节  C. 所有种类的名字  D. 所有英文名称","answer":"答案：A. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"},{ 放二氧化碳、水和无机盐，供生产者重新利用；帮..."},{"id":"g2_biology_u024_ex07","knowledge_id":"g2_biology_u024","question":"判断题：动物在生态系统中的作用都是有害的。（  ）","answer":"答案：错误。解析：生物对人类的影响是多方面的，动物在生态系统中类中有的对人有害，有的对人有益，还有的与人类没有直接利害关系。我们应该辩证地看待它们与人类的关系。"},{"id":"g2_biology_u024_ex08","knowledge_id":"g2_biology_u024","question":"选择题：下列关于动物在生态系统中的作用的说法，错误的是？ A. 在生态系统中有一定作用  B. 具有该类群的典型特征  C. 是生物多样性的组成部分  D. 所有种类都对人类有害","answer":"答案：D. 所有种类都对人类有害。解析：每类动物中都有与人类有益的种类和有害的种类，不能说全部都有害。它们都是生物多样性的重要组成部分，在生态系统中有各自的作用。"},{"id":"g2_biology_u024_ex09","knowledge_id":"g2_biology_u024","question":"简答题：请简述动物在生态系统中的作用的主要特征。","answer":"答案：动物在生态系统中的作用的主要特征包括：促进生态系统物质循环 ， 帮助植物传粉和传播种子 ， 维持生态平衡。动物在生态系统中具有重要作用：促进生态系统物质循环，动物作为消费者，把有机物带入生态系统，通过呼吸作用分解有机物，释放二氧化碳、水和无机盐，供生产者重新利用；帮助植物传粉和传播种子，许多植物依赖动物传粉（如蜜蜂传粉）或传播种子（如松鼠传播松子、鸟类传播种子），没有动物这些植物将无法繁殖；动物能维持生态平衡，在食物链和食物网中各有其生态位，互相依存互相制约。... 这些特征是区分该类群与其他类群的重要依据。"},{"id":"g2_biology_u024_ex10","knowledge_id":"g2_biology_u024","question":"选择题：学习动物在生态系统中的作用时，最重要的是掌握？ A. 该类群的主要特征  B. 所有英文名称  C. 所有种类的名字  D. 所有代表动物的细节","answer":"答案：A. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"},{"id":"g2_biology_u025_ex01","knowledge_id":"g2_biology_u025","question":"选择题：下列关于动物与人类生活的关系的描述，正确的是？ A. 明显错误的说法  B. 属于其他类群的特征  C. 提供食物和药材 ， 传播疾病 ， 科技发明灵感 ， 仿生学...  D. 与事实完全相反的描述","answer":"答案：C. 提供食物和药材 ， 传播疾病 ， 科技发明灵感 ， 仿生学...。解析：动物与人类生活的关系的主要特征是：提供食物和药材 ， 传播疾病 ， 科技发明灵感 ， 仿生学。这是该类群的重要识别特征。"},{"id":"g2_biology_u025_ex02","knowledge_id":"g2_biology_u025","question":"选择题：下列动物中，具有\"提供食物和药材 \"特征的是？ A. 扁形动物  B. 动物与人类生活类动物  C. 腔肠动物  D. 原生动物","answer":"答案：B. 动物与人类生活类动物。解析：提供食物和药材 是动物与人类生活的关系的特征之一。每类动物都有其独特的特征，这些特征是分类的重要依据。"},{"id":"g2_biology_u025_ex03","knowledge_id":"g2_biology_u025","question":"填空题：动物与人类生活的关系的主要特征包括：______等。","answer":"答案：提供食物和药材 ， 传播疾病 ， 科技发明灵感 ， 仿生学。解析：动物与人类生活密切相关：为人类提供食物（肉类、蛋类、奶类）、皮毛、药材（鹿茸、麝香、熊胆）等物资；某些动物可传播疾病（如蚊子传播疟疾、鼠类传播鼠疫），危害人类健康；动物为人类提供科技发明的灵感——仿生学，如根据蝙蝠回声定位发明雷达、根据鱼鳔发明潜水艇、根据萤火虫发光原理发明冷光源等。保护有益动物，控..."},{"id":"g2_biology_u025_ex04","knowledge_id":"g2_biology_u025","question":"判断题：动物与人类生活的关系的特征只有一种。（  ）","answer":"答案：错误。解析：动物与人类生活的关系有多个主要特征，包括提供食物和药材 ， 传播疾病 ， 科技发明灵感 ， 仿生学。这些特征共同构成了该类群的识别依据，判断时要综合考虑。"},{"id":"g2_biology_u025_ex05","knowledge_id":"g2_biology_u025","question":"选择题：在动物进化过程中，动物与人类生活类比哪类更复杂高级？ A. 原生动物  B. 鸟类  C. 爬行动物  D. 哺乳动物","answer":"答案：A. 原生动物。解析：动物进化的大致顺序是：原生动物→腔肠动物→扁形动物→线形动物→环节动物→软体动物→节肢动物→脊椎动物（鱼→两栖→爬行→鸟→哺乳）。所以比原生动物更高级复杂。"},{"id":"g2_biology_u025_ex06","knowledge_id":"g2_biology_u025","question":"填空题：动物与人类生活的关系的代表动物有______、______等。","answer":"答案：示例：根据具体类群填写。解析：每类动物都有其代表动物，学习时要结合代表动物来理解该类群的主要特征。动物与人类生活密切相关：为人类提供食物（肉类、蛋类、奶类）、皮毛、药材（鹿茸、麝香、熊胆）等物资；某些动物可传播疾病（如蚊子传播疟疾、鼠类传播鼠疫），危害人类健..."},{"id":"g2_biology_u025_ex07","knowledge_id":"g2_biology_u025","question":"判断题：动物与人类生活的关系都是有害的。（  ）","answer":"答案：错误。解析：生物对人类的影响是多方面的，动物与人类生活类中有的对人有害，有的对人有益，还有的与人类没有直接利害关系。我们应该辩证地看待它们与人类的关系。"},{"id":"g2_biology_u025_ex08","knowledge_id":"g2_biology_u025","question":"选择题：下列关于动物与人类生活的关系的说法，错误的是？ A. 在生态系统中有一定作用  B. 具有该类群的典型特征  C. 所有种类都对人类有害  D. 是生物多样性的组成部分","answer":"答案：C. 所有种类都对人类有害。解析：每类动物中都有与人类有益的种类和有害的种类，不能说全部都有害。它们都是生物多样性的重要组成部分，在生态系统中有各自的作用。"},{"id":"g2_biology_u025_ex09","knowledge_id":"g2_biology_u025","question":"简答题：请简述动物与人类生活的关系的主要特征。","answer":"答案：动物与人类生活的关系的主要特征包括：提供食物和药材 ， 传播疾病 ， 科技发明灵感 ， 仿生学。动物与人类生活密切相关：为人类提供食物（肉类、蛋类、奶类）、皮毛、药材（鹿茸、麝香、熊胆）等物资；某些动物可传播疾病（如蚊子传播疟疾、鼠类传播鼠疫），危害人类健康；动物为人类提供科技发明的灵感——仿生学，如根据蝙蝠回声定位发明雷达、根据鱼鳔发明潜水艇、根据萤火虫发光原理发明冷光源等。保护有益动物，控制和消灭有害动物是人类与动物和谐相处的重要内容。... 这些特征是区分该类群与其他类群的重要依据。"},{"id":"g2_biology_u025_ex10","knowledge_id":"g2_biology_u025","question":"选择题：学习动物与人类生活的关系时，最重要的是掌握？ A. 所有代表动物的细节  B. 所有英文名称  C. 该类群的主要特征  D. 所有种类的名字","answer":"答案：C. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"},{"id":"g2_biology_u026_ex01","knowledge_id":"g2_biology_u026","question":"选择题：下列关于细菌的形态和结构的描述，正确的是？ A. 明显错误的说法  B. 与事实完全相反的描述  C. 单细胞 ， 原核生物 ， 细胞壁、细胞膜、细胞质 ， DNA...  D. 属于其他类群的特征","answer":"答案：C. 单细胞 ， 原核生物 ， 细胞壁、细胞膜、细胞质 ， DNA...。解析：细菌的形态和结构的主要特征是：单细胞 ， 原核生物 ， 细胞壁、细胞膜、细胞质 ， DNA集中区 ， 荚膜、鞭毛 ， 无成形的细胞核。这是该类群的重要识别特征。"},{"id":"g2_biology_u026_ex02","knowledge_id":"g2_biology_u026","question":"选择题：下列动物中，具有\"单细胞 \"特征的是？ A. 扁形动物  B. 细菌类动物  C. 原生动物  D. 腔肠动物","answer":"答案：B. 细菌类动物。解析：单细胞 是细菌的形态和结构的特征之一。每类动物都有其独特的特征，这些特征是分类的重要依据。"},{"id":"g2_biology_u026_ex03","knowledge_id":"g2_biology_u026","question":"填空题：细菌的形态和结构的主要特征包括：______等。","answer":"答案：单细胞 ， 原核生物 ， 细胞壁、细胞膜、细胞质 ， DNA集中区 ， 荚膜、鞭毛 ， 无成形的细胞核。解析：细菌是单细胞生物，属于原核生物。结构包括：细胞壁（保护作用）；细胞膜（控制物质进出）；细胞质（进行生命活动的场所）；DNA集中区（没有核膜包裹，称为拟核）；有些细菌还有荚膜（保护作用）和鞭毛（运动作用）。根据形态可分为：球菌（圆形）、杆菌（杆形）、螺旋菌（螺旋形）。细菌没有成形的细胞核，没有叶绿体，..."},{"id":"g2_biology_u026_ex04","knowledge_id":"g2_biology_u026","question":"判断题：细菌的形态和结构的特征只有一种。（  ）","answer":"答案：错误。解析：细菌的形态和结构有多个主要特征，包括单细胞 ， 原核生物 ， 细胞壁、细胞膜、细胞质 ， DNA集中区 ， 荚膜、鞭毛 ， 无成形的细胞核。这些特征共同构成了该类群的识别依据，判断时要综合考虑。"},{"id":"g2_biology_u026_ex05","knowledge_id":"g2_biology_u026","question":"选择题：在动物进化过程中，细菌类比哪类更复杂高级？ A. 爬行动物  B. 鸟类  C. 哺乳动物  D. 原生动物","answer":"答案：D. 原生动物。解析：动物进化的大致顺序是：原生动物→腔肠动物→扁形动物→线形动物→环节动物→软体动物→节肢动物→脊椎动物（鱼→两栖→爬行→鸟→哺乳）。所以比原生动物更高级复杂。"},{"id":"g2_biology_u026_ex06","knowledge_id":"g2_biology_u026","question":"填空题：细菌的形态和结构的代表动物有______、______等。","answer":"答案：示例：根据具体类群填写。解析：每类动物都有其代表动物，学习时要结合代表动物来理解该类群的主要特征。细菌是单细胞生物，属于原核生物。结构包括：细胞壁（保护作用）；细胞膜（控制物质进出）；细胞质（进行生命活动的场所）；DNA集中区（没有核膜包裹，称为拟核）；有些..."},{"id":"g2_biology_u026_ex07","knowledge_id":"g2_biology_u026","question":"判断题：细菌的形态和结构都是有害的。（  ）","answer":"答案：错误。解析：生物对人类的影响是多方面的，细菌类中有的对人有害，有的对人有益，还有的与人类没有直接利害关系。我们应该辩证地看待它们与人类的关系。"},{"id":"g2_biology_u026_ex08","knowledge_id":"g2_biology_u026","question":"选择题：下列关于细菌的形态和结构的说法，错误的是？ A. 具有该类群的典型特征  B. 在生态系统中有一定作用  C. 是生物多样性的组成部分  D. 所有种类都对人类有害","answer":"答案：D. 所有种类都对人类有害。解析：每类动物中都有与人类有益的种类和有害的种类，不能说全部都有害。它们都是生物多样性的重要组成部分，在生态系统中有各自的作用。"},{"id":"g2_biology_u026_ex09","knowledge_id":"g2_biology_u026","question":"简答题：请简述细菌的形态和结构的主要特征。","answer":"答案：细菌的形态和结构的主要特征包括：单细胞 ， 原核生物 ， 细胞壁、细胞膜、细胞质 ， DNA集中区 ， 荚膜、鞭毛 ， 无成形的细胞核。细菌是单细胞生物，属于原核生物。结构包括：细胞壁（保护作用）；细胞膜（控制物质进出）；细胞质（进行生命活动的场所）；DNA集中区（没有核膜包裹，称为拟核）；有些细菌还有荚膜（保护作用）和鞭毛（运动作用）。根据形态可分为：球菌（圆形）、杆菌（杆形）、螺旋菌（螺旋形）。细菌没有成形的细胞核，没有叶绿体，大多数细菌利用现成的有机物生活（异养），是分解者或寄生者。... 这些特征是区分该类群与其他类群的重要依据。"},{"id":"g2_biology_u026_ex10","knowledge_id":"g2_biology_u026","question":"选择题：学习细菌的形态和结构时，最重要的是掌握？ A. 该类群的主要特征  B. 所有代表动物的细节  C. 所有英文名称  D. 所有种类的名字","answer":"答案：A. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"},{"id":"g2_biology_u027_ex01","knowledge_id":"g2_biology_u027","question":"选择题：下列关于细菌的繁殖方式的描述，正确的是？ A. 属于其他类群的特征  B. 与事实完全相反的描述  C. 分裂繁殖 ， 二分裂 ， 20分钟一代 ， 芽孢（休眠体）...  D. 明显错误的说法","answer":"答案：C. 分裂繁殖 ， 二分裂 ， 20分钟一代 ， 芽孢（休眠体）...。解析：细菌的繁殖方式的主要特征是：分裂繁殖 ， 二分裂 ， 20分钟一代 ， 芽孢（休眠体）。这是该类群的重要识别特征。"},{"id":"g2_biology_u027_ex02","knowledge_id":"g2_biology_u027","question":"选择题：下列动物中，具有\"分裂繁殖 \"特征的是？ A. 细菌类动物  B. 原生动物  C. 扁形动物  D. 腔肠动物","answer":"答案：A. 细菌类动物。解析：分裂繁殖 是细菌的繁殖方式的特征之一。每类动物都有其独特的特征，这些特征是分类的重要依据。"},{"id":"g2_biology_u027_ex03","knowledge_id":"g2_biology_u027","question":"填空题：细菌的繁殖方式的主要特征包括：______等。","answer":"答案：分裂繁殖 ， 二分裂 ， 20分钟一代 ， 芽孢（休眠体）。解析：细菌通过分裂进行繁殖。分裂过程：细菌吸收营养物质，生长到一定程度后，细胞壁向内凹陷，细胞质分裂，细胞核也分裂，最后形成两个子细菌。在适宜条件下，细菌分裂速度很快，如大肠杆菌约20分钟分裂一次。环境不利时，某些细菌会形成芽孢，芽孢是细菌的休眠体，对干旱、高温、低温等恶劣环境有很强的抵抗力。芽孢不是细菌..."},{"id":"g2_biology_u027_ex04","knowledge_id":"g2_biology_u027","question":"判断题：细菌的繁殖方式的特征只有一种。（  ）","answer":"答案：错误。解析：细菌的繁殖方式有多个主要特征，包括分裂繁殖 ， 二分裂 ， 20分钟一代 ， 芽孢（休眠体）。这些特征共同构成了该类群的识别依据，判断时要综合考虑。"},{"id":"g2_biology_u027_ex05","knowledge_id":"g2_biology_u027","question":"选择题：在动物进化过程中，细菌类比哪类更复杂高级？ A. 哺乳动物  B. 原生动物  C. 爬行动物  D. 鸟类","answer":"答案：B. 原生动物。解析：动物进化的大致顺序是：原生动物→腔肠动物→扁形动物→线形动物→环节动物→软体动物→节肢动物→脊椎动物（鱼→两栖→爬行→鸟→哺乳）。所以比原生动物更高级复杂。"},{"id":"g2_biology_u027_ex06","knowledge_id":"g2_biology_u027","question":"填空题：细菌的繁殖方式的代表动物有______、______等。","answer":"答案：示例：根据具体类群填写。解析：每类动物都有其代表动物，学习时要结合代表动物来理解该类群的主要特征。细菌通过分裂进行繁殖。分裂过程：细菌吸收营养物质，生长到一定程度后，细胞壁向内凹陷，细胞质分裂，细胞核也分裂，最后形成两个子细菌。在适宜条件下，细菌分裂速度很快..."},{"id":"g2_biology_u027_ex07","knowledge_id":"g2_biology_u027","question":"判断题：细菌的繁殖方式都是有害的。（  ）","answer":"答案：错误。解析：生物对人类的影响是多方面的，细菌类中有的对人有害，有的对人有益，还有的与人类没有直接利害关系。我们应该辩证地看待它们与人类的关系。"},{"id":"g2_biology_u027_ex08","knowledge_id":"g2_biology_u027","question":"选择题：下列关于细菌的繁殖方式的说法，错误的是？ A. 所有种类都对人类有害  B. 具有该类群的典型特征  C. 在生态系统中有一定作用  D. 是生物多样性的组成部分","answer":"答案：A. 所有种类都对人类有害。解析：每类动物中都有与人类有益的种类和有害的种类，不能说全部都有害。它们都是生物多样性的重要组成部分，在生态系统中有各自的作用。"},{"id":"g2_biology_u027_ex09","knowledge_id":"g2_biology_u027","question":"简答题：请简述细菌的繁殖方式的主要特征。","answer":"答案：细菌的繁殖方式的主要特征包括：分裂繁殖 ， 二分裂 ， 20分钟一代 ， 芽孢（休眠体）。细菌通过分裂进行繁殖。分裂过程：细菌吸收营养物质，生长到一定程度后，细胞壁向内凹陷，细胞质分裂，细胞核也分裂，最后形成两个子细菌。在适宜条件下，细菌分裂速度很快，如大肠杆菌约20分钟分裂一次。环境不利时，某些细菌会形成芽孢，芽孢是细菌的休眠体，对干旱、高温、低温等恶劣环境有很强的抵抗力。芽孢不是细菌的繁殖方式，而是度过不良环境的结构。芽孢的耐热性很强，灭菌时常以杀死芽孢为标准。... 这些特征是区分该类群与其他类群的重要依据。"},{"id":"g2_biology_u027_ex10","knowledge_id":"g2_biology_u027","question":"选择题：学习细菌的繁殖方式时，最重要的是掌握？ A. 该类群的主要特征  B. 所有种类的名字  C. 所有代表动物的细节  D. 所有英文名称","answer":"答案：A. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"},{"id":"g2_biology_u028_ex01","knowledge_id":"g2_biology_u028","question":"选择题：下列关于真菌的形态和结构的描述，正确的是？ A. 明显错误的说法  B. 属于其他类群的特征  C. 与事实完全相反的描述  D. 多细胞或单细胞 ， 真核生物 ， 细胞壁、细胞膜、细胞质、细...","answer":"答案：D. 多细胞或单细胞 ， 真核生物 ， 细胞壁、细胞膜、细胞质、细...。解析：真菌的形态和结构的主要特征是：多细胞或单细胞 ， 真核生物 ， 细胞壁、细胞膜、细胞质、细胞核 ， 酵母菌、青霉、曲霉、蘑菇。这是该类群的重要识别特征。"},{"id":"g2_biology_u028_ex02","knowledge_id":"g2_biology_u028","question":"选择题：下列动物中，具有\"多细胞或单细胞 \"特征的是？ A. 扁形动物  B. 腔肠动物  C. 真菌类动物  D. 原生动物","answer":"答案：C. 真菌类动物。解析：多细胞或单细胞 是真菌的形态和结构的特征之一。每类动物都有其独特的特征，这些特征是分类的重要依据。"},{"id":"g2_biology_u028_ex03","knowledge_id":"g2_biology_u028","question":"填空题：真菌的形态和结构的主要特征包括：______等。","answer":"答案：多细胞或单细胞 ， 真核生物 ， 细胞壁、细胞膜、细胞质、细胞核 ， 酵母菌、青霉、曲霉、蘑菇。解析：真菌有单细胞和多细胞两类。单细胞真菌代表：酵母菌，椭圆形，有细胞壁、细胞膜、细胞质和细胞核。多细胞真菌代表：青霉（菌丝顶端呈扫帚状）、曲霉（顶端呈球状）、蘑菇（由菌丝构成）。真菌的结构：细胞壁、细胞膜、细胞质、细胞核（有成形的细胞核，属于真核生物）。真菌的菌丝由许多细胞连接而成，吸收营养物质的菌丝叫..."},{"id":"g2_biology_u028_ex04","knowledge_id":"g2_biology_u028","question":"判断题：真菌的形态和结构的特征只有一种。（  ）","answer":"答案：错误。解析：真菌的形态和结构有多个主要特征，包括多细胞或单细胞 ， 真核生物 ， 细胞壁、细胞膜、细胞质、细胞核 ， 酵母菌、青霉、曲霉、蘑菇。这些特征共同构成了该类群的识别依据，判断时要综合考虑。"},{"id":"g2_biology_u028_ex05","knowledge_id":"g2_biology_u028","question":"选择题：在动物进化过程中，真菌类比哪类更复杂高级？ A. 鸟类  B. 原生动物  C. 爬行动物  D. 哺乳动物","answer":"答案：B. 原生动物。解析：动物进化的大致顺序是：原生动物→腔肠动物→扁形动物→线形动物→环节动物→软体动物→节肢动物→脊椎动物（鱼→两栖→爬行→鸟→哺乳）。所以比原生动物更高级复杂。"},{"id":"g2_biology_u028_ex06","knowledge_id":"g2_biology_u028","question":"填空题：真菌的形态和结构的代表动物有______、______等。","answer":"答案：示例：根据具体类群填写。解析：每类动物都有其代表动物，学习时要结合代表动物来理解该类群的主要特征。真菌有单细胞和多细胞两类。单细胞真菌代表：酵母菌，椭圆形，有细胞壁、细胞膜、细胞质和细胞核。多细胞真菌代表：青霉（菌丝顶端呈扫帚状）、曲霉（顶端呈球状）、蘑菇（..."},{"id":"g2_biology_u028_ex07","knowledge_id":"g2_biology_u028","question":"判断题：真菌的形态和结构都是有害的。（  ）","answer":"答案：错误。解析：生物对人类的影响是多方面的，真菌类中有的对人有害，有的对人有益，还有的与人类没有直接利害关系。我们应该辩证地看待它们与人类的关系。"},{"id":"g2_biology_u028_ex08","knowledge_id":"g2_biology_u028","question":"选择题：下列关于真菌的形态和结构的说法，错误的是？ A. 所有种类都对人类有害  B. 是生物多样性的组成部分  C. 具有该类群的典型特征  D. 在生态系统中有一定作用","answer":"答案：A. 所有种类都对人类有害。解析：每类动物中都有与人类有益的种类和有害的种类，不能说全部都有害。它们都是生物多样性的重要组成部分，在生态系统中有各自的作用。"},{"id":"g2_biology_u028_ex09","knowledge_id":"g2_biology_u028","question":"简答题：请简述真菌的形态和结构的主要特征。","answer":"答案：真菌的形态和结构的主要特征包括：多细胞或单细胞 ， 真核生物 ， 细胞壁、细胞膜、细胞质、细胞核 ， 酵母菌、青霉、曲霉、蘑菇。真菌有单细胞和多细胞两类。单细胞真菌代表：酵母菌，椭圆形，有细胞壁、细胞膜、细胞质和细胞核。多细胞真菌代表：青霉（菌丝顶端呈扫帚状）、曲霉（顶端呈球状）、蘑菇（由菌丝构成）。真菌的结构：细胞壁、细胞膜、细胞质、细胞核（有成形的细胞核，属于真核生物）。真菌的菌丝由许多细胞连接而成，吸收营养物质的菌丝叫营养菌丝，向上生长的叫气生菌丝。真菌与细菌的主要区别：真菌有成形的细胞核（真核），细菌没有（原核）。... 这些特征是区分该类群与其他类群的重要依据。"},{"id":"g2_biology_u028_ex10","knowledge_id":"g2_biology_u028","question":"选择题：学习真菌的形态和结构时，最重要的是掌握？ A. 所有代表动物的细节  B. 所有英文名称  C. 该类群的主要特征  D. 所有种类的名字","answer":"答案：C. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"},{"id":"g2_biology_u029_ex01","knowledge_id":"g2_biology_u029","question":"选择题：下列关于细菌和真菌的分布的描述，正确的是？ A. 与事实完全相反的描述  B. 广泛分布 ， 土壤中 ， 水中 ， 空气中 ， 动植物体内 ...  C. 属于其他类群的特征  D. 明显错误的说法","answer":"答案：B. 广泛分布 ， 土壤中 ， 水中 ， 空气中 ， 动植物体内 ...。解析：细菌和真菌的分布的主要特征是：广泛分布 ， 土壤中 ， 水中 ， 空气中 ， 动植物体内 ， 高温灭菌、接种培养。这是该类群的重要识别特征。"},{"id":"g2_biology_u029_ex02","knowledge_id":"g2_biology_u029","question":"选择题：下列动物中，具有\"广泛分布 \"特征的是？ A. 细菌和真菌类动物  B. 原生动物  C. 腔肠动物  D. 扁形动物","answer":"答案：A. 细菌和真菌类动物。解析：广泛分布 是细菌和真菌的分布的特征之一。每类动物都有其 的名字  C. 所有代表动物的细节  D. 该类群的主要特征","answer":"答案：D. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"},{"id":"g2_biology_u030_ex01","knowledge_id":"g2_biology_u030","question":"选择题：下列关于细菌和真菌与食品制作的描述，正确的是？ A. 明显错误的说法  B. 与事实完全相反的描述  C. 酵母菌发酵 ， 乳酸菌发酵 ， 醋酸菌发酵 ， 制作馒头、面...  D. 属于其他类群的特征","answer":"答案：C. 酵母菌发酵 ， 乳酸菌发酵 ， 醋酸菌发酵 ， 制作馒头、面...。解析：细菌和真菌与食品制作的主要特征是：酵母菌发酵 ， 乳酸菌发酵 ， 醋酸菌发酵 ， 制作馒头、面包、酸奶、醋、酱。这是该类群的重要识别特征。"},{"id":"g2_biology_u030_ex02","knowledge_id":"g2_biology_u030","question":"选择题：下列动物中，具有\"酵母菌发酵 \"特征的是？ A. 腔肠动物  B. 原生动物  C. 细菌和真菌与食品制作类动物  D. 扁形动物","answer":"答案：C. 细菌和真菌与食品制作类动物。解析：酵母菌发酵 是细菌和真菌与食品制作的特征之一。每类动物都有其独特的特征，这些特征是分类的重要依据。"},{"id":"g2_biology_u030_ex03","knowledge_id":"g2_biology_u030","question":"填空题：细菌和真菌与食品制作的主要特征包括：______等。","answer":"答案：酵母菌发酵 ， 乳酸菌发酵 ， 醋酸菌发酵 ， 制作馒头、面包、酸奶、醋、酱。解析：细菌和真菌在食品制作中应用广泛：酵母菌发酵：酵母菌在有氧条件下分解有机物产生二氧化碳和水，使面团膨胀形成馒头、面包；无氧条件下产生酒精，用于酿酒。乳酸菌发酵：乳酸菌使牛奶发酵形成酸奶，使蔬菜发酵形成泡菜、酸菜。醋酸菌发酵：醋酸菌使酒精氧化成醋酸，制成食醋。真菌发酵：霉菌（如曲霉）用于制作酱、酱油、豆..."},{"id":"g2_biology_u030_ex04","knowledge_id":"g2_biology_u030","question":"判断题：细菌和真菌与食品制作的特征只有一种。（  ）","answer":"答案：错误。解析：细菌和真菌与食品制作有多个主要特征，包括酵母菌发酵 ， 乳酸菌发酵 ， 醋酸菌发酵 ， 制作馒头、面包、酸奶、醋、酱。这些特征共同构成了该类群的识别依据，判断时要综合考虑。"},{"id":"g2_biology_u030_ex05","knowledge_id":"g2_biology_u030","question":"选择题：在动物进化过程中，细菌和真菌与食品制作类比哪类更复杂高级？ A. 爬行动物  B. 哺乳动物  C. 鸟类  D. 原生动物","answer":"答案：D. 原生动物。解析：动物进化的大致顺序是：原生动物→腔肠动物→扁形动物→线形动物→环节动物→软体动物→节肢动物→脊椎动物（鱼→两栖→爬行→鸟→哺乳）。所以比原生动物更高级复杂。"},{"id":"g2_biology_u030_ex06","knowledge_id":"g2_biology_u030","question":"填空题：细菌和真菌与食品制作的代表动物有______、______等。","answer":"答案：示例：根据具体类群填写。解析：每类动物都有其代表动物，学习时要结合代表动物来理解该类群的主要特征。细菌和真菌在食品制作中应用广泛：酵母菌发酵：酵母菌在有氧条件下分解有机物产生二氧化碳和水，使面团膨胀形成馒头、面包；无氧条件下产生酒精，用于酿酒。乳酸菌发酵：乳..."},{"id":"g2_biology_u030_ex07","knowledge_id":"g2_biology_u030","question":"判断题：细菌和真菌与食品制作都是有害的。（  ）","answer":"答案：错误。解析：生物对人类的影响是多方面的，细菌和真菌与食品制作类中有的对人有害，有的对人有益，还有的与人类没有直接利害关系。我们应该辩证地看待它们与人类的关系。"},{"id":"g2_biology_u030_ex08","knowledge_id":"g2_biology_u030","question":"选择题：下列关于细菌和真菌与食品制作的说法，错误的是？ A. 是生物多样性的组成部分  B. 在生态系统中有一定作用  C. 具有该类群的典型特征  D. 所有种类都对人类有害","answer":"答案：D. 所有种类都对人类有害。解析：每类动物中都有与人类有益的种类和有害的种类，不能说全部都有害。它们都是生物多样性的重要组成部分，在生态系统中有各自的作用。"},{"id":"g2_biology_u030_ex09","knowledge_id":"g2_biology_u030","question":"简答题：请简述细菌和真菌与食品制作的主要特征。","answer":"答案：细菌和真菌与食品制作的主要特征包括：酵母菌发酵 ， 乳酸菌发酵 ， 醋酸菌发酵 ， 制作馒头、面包、酸奶、醋、酱。细菌和真菌在食品制作中应用广泛：酵母菌发酵：酵母菌在有氧条件下分解有机物产生二氧化碳和水，使面团膨胀形成馒头、面包；无氧条件下产生酒精，用于酿酒。乳酸菌发酵：乳酸菌使牛奶发酵形成酸奶，使蔬菜发酵形成泡菜、酸菜。醋酸菌发酵：醋酸菌使酒精氧化成醋酸，制成食醋。真菌发酵：霉菌（如曲霉）用于制作酱、酱油、豆腐乳等。这些发酵食品的原理是利用细菌或真菌在代谢过程中产生的酶，分解有机物产生特定物质。... 这些特征是区分该类群与其他类群的重要依据。"},{"id":"g2_biology_u030_ex10","knowledge_id":"g2_biology_u030","question":"选择题：学习细菌和真菌与食品制作时，最重要的是掌握？ A. 所有种类的名字  B. 所有代表动物的细节  C. 该类群的主要特征  D. 所有英文名称","answer":"答案：C. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"},{"id":"g2_biology_u031_ex01","knowledge_id":"g2_biology_u031","question":"选择题：下列关于食品保存的原理和方法的描述，正确的是？ A. 明显错误的说法  B. 属于其他类群的特征  C. 与事实完全相反的描述  D. 杀死细菌和真菌 ， 抑制其生长繁殖 ， 巴氏消毒法、防腐剂、...","answer":"答案：D. 杀死细菌和真菌 ， 抑制其生长繁殖 ， 巴氏消毒法、防腐剂、...。解析：食品保存的原理和方法的主要特征是：杀死细菌和真菌 ， 抑制其生长繁殖 ， 巴氏消毒法、防腐剂、干燥、冷藏、腌制、真空包装。这是该类群的重要识别特征。"},{"id":"g2_biology_u031_ex02","knowledge_id":"g2_biology_u031","question":"选择题：下列动物中，具有\"杀死细菌和真菌 \"特征的是？ A. 扁形动物  B. 食品保存类动物  C. 腔肠动物  D. 原生动物","answer":"答案：B. 食品保存类动物。解析：杀死细菌和真菌 是食品保存的原理和方法的特征之一。每类动物都有其独特的特征，这些特征是分类的重要依据。"},{"id":"g2_biology_u031_ex03","knowledge_id":"g2_biology_u031","question":"填空题：食品保存的原理和方法的主要特征包括：______等。","answer":"答案：杀死细菌和真菌 ， 抑制其生长繁殖 ， 巴氏消毒法、防腐剂、干燥、冷藏、腌制、真空包装。解析：食品保存的原理是把食物中的细菌和真菌杀死或抑制其生长和繁殖。常用方法：巴氏消毒法（将牛奶加热到70-80℃，杀死大部分细菌）；防腐剂（杀死或抑制微生物生长）；干燥（脱水保存，如干蘑菇、干肉）；冷藏（低温抑制微生物繁殖，但不能杀死微生物）；腌制（高浓度盐溶液或糖溶液，脱水抑制微生物）；真空包装（隔绝空..."},{"id":"g2_biology_u031_ex04","knowledge_id":"g2_biology_u031","question":"判断题：食品保存的原理和方法的特征只有一种。（  ）","answer":"答案：错误。解析：食品保存的原理和方法有多个主要特征，包括杀死细菌和真菌 ， 抑制其生长繁殖 ， 巴氏消毒法、防腐剂、干燥、冷藏、腌制、真空包装。这些特征共同构成了该类群的识别依据，判断时要综合考虑。"},{"id":"g2_biology_u031_ex05","knowledge_id":"g2_biology_u031","question":"选择题：在动物进化过程中，食品保存类比哪类更复杂高级？ A. 爬行动物  B. 哺乳动物  C. 原生动物  D. 鸟类","answer":"答案：C. 原生 都有害。它们都是生物多样性的重要组成部分，在生态系统中有各自的作用。"},{"id":"g2_biology_u033_ex09","knowledge_id":"g2_biology_u033","question":"简答题：请简述细菌和真菌与环境保护的主要特征。","answer":"答案：细菌和真菌与环境保护的主要特征包括：污水处理 ， 分解污染物 ， 分解有机物 ， 沼气发酵 ， 生物降解。细菌和真菌在环境保护中发挥重要作用：污水处理：利用细菌分解有机物净化污水，污水处理厂利用活性污泥中的微生物分解有机废物；分解污染物：某些细菌和真菌能分解农药、塑料、石油等污染物，用于生物修复；沼气发酵：甲烷菌（厌氧细菌）分解有机物产生沼气（甲烷），可作为能源使用；分解废物：细菌和真菌是分解者，把动植物遗体、粪便等有机物分解成无机物，归还土壤，促进物质循环，维持生态平衡。没有分解者，物质将无法循环，... 这些特征是区分该类群与其他类群的重要依据。"},{"id":"g2_biology_u033_ex10","knowledge_id":"g2_biology_u033","question":"选择题：学习细菌和真菌与环境保护时，最重要的是掌握？ A. 所有代表动物的细节  B. 所有种类的名字  C. 该类群的主要特征  D. 所有英文名称","answer":"答案：C. 该类群的主要特征。解析：学习动物类群的关键是掌握每类动物的主要特征，这些特征是分类和识别的依据。代表动物只是帮助理解，不需要死记所有种类。"}];
        const HAS_EXAMPLES = true;

        // 错题本管理器
        const WrongBookManager = {
            STORAGE_KEY_PREFIX: 'wrongbook_',
            getWrongBook(grade, subject) {
                const key = this.STORAGE_KEY_PREFIX + grade + '_' + subject;
                return JSON.parse(localStorage.getItem(key) || '[]');
            },
            addWrongBook(item) {
                const key = this.STORAGE_KEY_PREFIX + item.grade + '_' + item.subject;
                let wrongBook = this.getWrongBook(item.grade, item.subject);
                const exists = wrongBook.some(w => w.question === item.question);
                if (exists) return false;
                wrongBook.push({...item, id: item.knowledgeId + '_' + Date.now(), addedAt: new Date().toISOString()});
                localStorage.setItem(key, JSON.stringify(wrongBook));
                return true;
            }
        };

        // 学习进度管理器
        const ProgressManager = {
            STORAGE_KEY: 'study_progress',
            
            getProgress() {
                try {
                    return JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
                } catch(e) {
                    return {};
                }
            },
            
            saveProgress(progress) {
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(progress));
            },
            
            recordStudy(grade, subject, subjectName, semester, semesterName, knowledgeId, knowledgeName) {
                const progress = this.getProgress();
                const now = new Date().toISOString();
                const today = new Date().toISOString().split('T')[0];
                
                if (!progress.learnedKnowledge) progress.learnedKnowledge = {};
                if (!progress.dailyStats) progress.dailyStats = {};
                if (!progress.dailyStats[today]) {
                    progress.dailyStats[today] = { learnedCount: 0, subjects: [] };
                }
                
                const isNew = !progress.learnedKnowledge[knowledgeId];
                progress.learnedKnowledge[knowledgeId] = { learnedAt: now };
                
                if (isNew) {
                    progress.dailyStats[today].learnedCount++;
                    if (!progress.dailyStats[today].subjects.includes(subject)) {
                        progress.dailyStats[today].subjects.push(subject);
                    }
                }
                
                progress.lastStudy = {
                    grade, subject, subjectName, semester, semesterName,
                    knowledgeId, knowledgeName, timestamp: now
                };
                
                this.saveProgress(progress);
            },
            
            isLearned(knowledgeId) {
                const progress = this.getProgress();
                return !!(progress.learnedKnowledge && progress.learnedKnowledge[knowledgeId]);
            },
            
            getLastStudy() {
                const progress = this.getProgress();
                return progress.lastStudy || null;
            },
            
            getSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                if (!progress.learnedKnowledge) return { learned: 0, total: 0, percent: 0 };
                const prefix = grade + '_' + subject + '_';
                const learned = Object.keys(progress.learnedKnowledge).filter(k => k.startsWith(prefix)).length;
                const total = DATA_KNOWLEDGE.length;
                const percent = total > 0 ? Math.round((learned / total) * 100) : 0;
                return { learned, total, percent };
            },
            
            clearSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                const prefix = grade + '_' + subject + '_';
                
                if (progress.learnedKnowledge) {
                    Object.keys(progress.learnedKnowledge).forEach(k => {
                        if (k.startsWith(prefix)) {
                            delete progress.learnedKnowledge[k];
                        }
                    });
                }
                
                if (progress.lastStudy && progress.lastStudy.grade === grade && progress.lastStudy.subject === subject) {
                    delete progress.lastStudy;
                }
                
                this.saveProgress(progress);
                return true;
            }
        };

            loadKnowledge();
            updateProgressStat();
            
            const hash = window.location.hash.replace('#', '');
            if (hash && knowledgeList.some(k => k.id === hash)) {
                setTimeout(() => {
                    toggleExpand(hash);
                    const card = document.querySelector('[data-id="' + hash + '"]');
                    if (card) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
        }

        function updateProgressStat() {
            const {grade, subject} = currentParams;
            const learnedInSemester = knowledgeList.filter(k => ProgressManager.isLearned(k.id)).length;
            document.getElementById('progress-learned').textContent = learnedInSemester;
            document.getElementById('progress-total').textContent = knowledgeList.length;
        }

        function loadKnowledge() {
            const {grade, subject, semester} = currentParams;
            knowledgeList = DATA_KNOWLEDGE.filter(k => {
                return k.semester === semester;
            });
            renderKnowledgeList();
        }

        function renderKnowledgeList(items = knowledgeList) {
            if (items.length === 0) {
                knowledgeListEl.innerHTML = '';
                emptyStateEl.classList.remove('hidden');
                return;
            }
            emptyStateEl.classList.add('hidden');
            knowledgeListEl.innerHTML = items.map(item => {
                const isExpanded = expandedIds.has(item.id);
                const isLearned = ProgressManager.isLearned(item.id);
                return '<div class="card knowledge-card ' + (isLearned ? 'learned' : '') + '" data-id="' + item.id + '">' +
                    '<div class="knowledge-header p-4 flex items-center justify-between" onclick="toggleExpand(\'' + item.id + '\')">' +
                        '<div class="flex items-center gap-3 flex-1 min-w-0">' +
                            '<div class="expand-icon ' + (isExpanded ? 'expanded' : 'collapsed') + '">' + (isExpanded ? '−' : '+') + '</div>' +
                            '<div class="flex-1 min-w-0">' +
                                '<h3 class="text-lg font-semibold text-gray-800 flex items-center gap-2">' + escapeHtml(item.name) + (isLearned ? '<span class="text-green-500 text-sm">✓ 已学习</span>' : '') + '</h3>' +
                                '<p class="text-xs text-gray-500 mt-1">' + escapeHtml(item.chapter) + '</p>' +
                            '</div>' +
                        '</div>' +
                        (HAS_EXAMPLES ? '<button class="btn btn-secondary text-sm px-3 py-1" onclick="event.stopPropagation(); showExample(\'' + item.id + '\', \'' + escapeHtml(item.name) + '\')">例题</button>' : '') +
                    '</div>' +
                    '<div id="content-' + item.id + '" class="px-6 pb-4 ' + (isExpanded ? '' : 'hidden') + '">' +
                        (item.formula ? '<div class="mb-4"><h4 class="text-sm font-medium text-gray-500 mb-2">📐 公式</h4><p class="formula-box text-gray-800 text-lg bg-gray-50 p-3 rounded-lg">' + escapeHtml(item.formula) + '</p></div>' : '') +
                        (item.explanation ? '<div><h4 class="text-sm font-medium text-gray-500 mb-2">📝 解释</h4><p class="text-gray-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(item.explanation) + '</p></div>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function toggleExpand(id) {
            const isNewLearn = !expandedIds.has(id) && !ProgressManager.isLearned(id);
            if (expandedIds.has(id)) {
                expandedIds.delete(id);
            } else {
                expandedIds.add(id);
                const {grade, subject, semester} = currentParams;
                const item = knowledgeList.find(k => k.id === id);
                if (item) {
                    ProgressManager.recordStudy(
                        grade, subject, subjectNames[subject],
                        semester, semesterNames[semester],
                        id, item.name
                    );
                }
            }
            const card = document.querySelector('[data-id="' + id + '"]');
            const content = document.getElementById('content-' + id);
            const icon = card.querySelector('.expand-icon');
            const header = card.querySelector('.knowledge-header');
            const title = card.querySelector('h3');
            if (expandedIds.has(id)) {
                content.classList.remove('hidden');
                icon.classList.remove('collapsed');
                icon.classList.add('expanded');
                icon.textContent = '−';
                header.classList.add('expanded');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('expanded');
                icon.classList.add('collapsed');
                icon.textContent = '+';
                header.classList.remove('expanded');
            }
            if (isNewLearn) {
                card.classList.add('learned');
                if (!title.querySelector('.text-green-500')) {
                    title.innerHTML += '<span class="text-green-500 text-sm">✓ 已学习</span>';
                }
                updateProgressStat();
            }
        }

        function expandAll() {
            knowledgeList.forEach(item => expandedIds.add(item.id));
            renderKnowledgeList();
        }

        function collapseAll() {
            expandedIds.clear();
            renderKnowledgeList();
        }

        function searchKnowledge(keyword, list) {
            if (!keyword) return [];
            const lower = keyword.toLowerCase();
            return list.filter(k =>
                k.name.toLowerCase().includes(lower) ||
                k.chapter.toLowerCase().includes(lower)
            );
        }

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                searchResultsInfo.classList.add('hidden');
                renderKnowledgeList();
                return;
            }
            const results = searchKnowledge(keyword, knowledgeList);
            searchCountEl.textContent = results.length;
            searchResultsInfo.classList.remove('hidden');
            renderKnowledgeList(results);
        }

        function showExample(knowledgeId, knowledgeName) {
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === knowledgeId);
            if (examples.length === 0) {
                alert('暂无例题');
                return;
            }
            const example = examples[Math.floor(Math.random() * examples.length)];
            currentExample = {...example, knowledgeId, knowledgeName, ...currentParams};
            document.getElementById('example-knowledge-name').textContent = knowledgeName;
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
            document.getElementById('example-modal').classList.remove('hidden');
        }

        function nextExample() {
            if (!currentExample) return;
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === currentExample.knowledgeId);
            const otherExamples = examples.filter(e => e !== currentExample);
            if (otherExamples.length === 0) {
                alert('没有更多例题了');
                return;
            }
            const example = otherExamples[Math.floor(Math.random() * otherExamples.length)];
            currentExample = {...example, knowledgeId: currentExample.knowledgeId, knowledgeName: currentExample.knowledgeName, ...currentParams};
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
        }

        function addToWrongBook() {
            if (!currentExample) return;
            const item = {
                knowledgeId: currentExample.knowledgeId,
                knowledgeName: currentExample.knowledgeName,
                question: currentExample.question,
                answer: currentExample.answer,
                grade: currentParams.grade,
                subject: currentParams.subject
            };
            if (WrongBookManager.addWrongBook(item)) {
                alert('已加入错题本！');
            } else {
                alert('该题目已在错题本中');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearProgress() {
            const {grade, subject} = currentParams;
            const subjectName = subjectNames[subject];
            var msg = '确定要清除【' + subjectName + '】科目的所有学习进度吗？';
            msg += '\n\n';
            msg += '此操作将清除该科目所有已学习标记，且不可恢复。';
            if (!confirm(msg)) {
                return;
            }
            ProgressManager.clearSubjectProgress(grade, subject);
            updateProgressStat();
            renderKnowledgeList();
            alert('学习进度已清除');
        }

        document.getElementById('btn-expand-all').addEventListener('click', expandAll);
        document.getElementById('btn-collapse-all').addEventListener('click', collapseAll);
        document.getElementById('btn-clear-progress').addEventListener('click', clearProgress);
        searchInput.addEventListener('keyup', e => { if (e.key === 'Enter') performSearch(); });
        searchInput.addEventListener('input', () => { if (!searchInput.value) { searchResultsInfo.classList.add('hidden'); renderKnowledgeList(); }});
        document.getElementById('close-example').addEventListener('click', () => document.getElementById('example-modal').classList.add('hidden'));
        document.getElementById('btn-show-answer').addEventListener('click', () => {
            document.getElementById('example-answer-section').classList.remove('hidden');
            document.getElementById('btn-show-answer').classList.add('hidden');
        });
        document.getElementById('btn-next-example').addEventListener('click', nextExample);
        document.getElementById('btn-add-wrong').addEventListener('click', addToWrongBook);
        document.getElementById('example-modal').addEventListener('click', e => { if (e.target.id === 'example-modal') document.getElementById('example-modal').classList.add('hidden'); });

        initPage();
    </script>
</body>
</html>
