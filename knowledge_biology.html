    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"id":"g2_biology_u001","chapter":"第一章 动物的主要类群","name":"无脊椎动物的主要类群","formula":"原生动物 → 腔肠动物 → 扁形动物 → 线形动物 → 环节动物 → 软体动物 → 节肢动物","explanation":"无脊椎动物按照从简单到复杂的进化顺序可分为以上七大类群，它们的主要区别在于体壁结构、体腔有无、运动方式以及生活环境等方面。原生动物是最原始、最简单的动物，由单细胞构成；腔肠动物开始出现组织分化；扁形动物出现中胚层；线形动物开始出现假体腔；环节动物开始出现真正的体节和刚毛；软体动物身体柔软，有外套膜和贝壳；节肢动物是动物界中种类最多、数量最大、分布最广的类群。","semester":"upper"},{"id":"g2_biology_u002","chapter":"第一章 动物的主要类群","name":"原生动物的特征","formula":"单细胞动物 | 草履虫、变形虫、疟原虫","explanation":"原生动物是动物界中最原始、最简单的一类动物，整个身体由一个细胞构成。这个细胞能完成营养、呼吸、排泄、生殖等全部生命活动。代表动物草履虫生活在淡水中，身体呈鞋垫状，前端较圆，后端较尖，全身布满纤毛，用于运动和摄食。变形虫依靠伪足进行运动和摄食。疟原虫能引起疟疾，通过按蚊传播。","semester":"upper"},{"id":"g2_biology_u003","chapter":"第一章 动物的主要类群","name":"腔肠动物的特征","formula":"辐射对称 | 有口无肛门 | 水螅、水母、海葵、珊瑚虫","explanation":"腔肠动物的主要特征：身体呈辐射对称，即身体上下、左右、前后各个方向对称；身体由内胚层和外胚层两层细胞构成，中间是非细胞结构的中胶层；有口无肛门，食物从口进入，残渣也从口排出。水螅生活在淡水中，呈筒形，有触手和刺细胞。水母营漂浮生活。海葵和珊瑚虫营固着生活，珊瑚虫分泌的石灰质外壳堆积形成珊瑚礁。","semester":"upper"},{"id":"g2_biology_u004","chapter":"第一章 动物的主要类群","name":"扁形动物的特征","formula":"两侧对称 | 三胚层 | 涡虫、血吸虫、华枝睾吸虫","explanation":"扁形动物的主要特征：身体呈两侧对称（左右对称），身体分出前后、左右、背腹；身体由内胚层、中胚层和外胚层三个胚层构成。涡虫生活在淡水中，身体扁平，呈柳叶状，有眼点能感光。血吸虫和华枝睾吸虫是寄生在人或动物体内的寄生虫，可引起相应疾病。血吸虫病曾是我国重要的寄生虫病。","semester":"upper"},{"id":"g2_biology_u005","chapter":"第一章 动物的主要类群","name":"线形动物的特征","formula":"假体腔 | 细长如线 | 蛔虫、蛲虫、线虫","explanation":"线形动物的主要特征：身体细长，呈线形；体表有一层角质层，可防止消化液侵蚀；出现假体腔（体腔内充满体腔液）。蛔虫是常见的人体寄生虫，成虫寄生在人体小肠内，可引起蛔虫病。蛲虫常在夜间爬到肛门处产卵，引起肛门瘙痒。线形动物有些是自由生活的，有些是寄生生活的。","semester":"upper"},{"id":"g2_biology_u006","chapter":"第一章 动物的主要类群","name":"环节动物的特征","formula":"真体腔 | 分节 | 刚毛或疣足 | 蚯蚓、水蛭、沙蚕","explanation":"环节动物的主要特征：身体由许多相似的体节构成（分节现象）；出现真体腔，即体腔壁上有肌肉层；多数种类有刚毛或疣足辅助运动。蚯蚓（环节动物门寡毛纲）是常见的环节动物，生活在土壤中，以有机质为食，对土壤的肥力有重要作用。蚯蚓的身体分为许多体节，有环带（生殖带）位于较靠近前端的位置。水蛭（蚂蟥）吸食血液，沙蚕是鱼类的饵料。","semester":"upper"},{"id":"g2_biology_u007","chapter":"第一章 动物的主要类群","name":"软体动物的特征","formula":"身体柔软 | 外套膜 | 贝壳 | 蜗牛、河蚌、乌贼、章鱼","explanation":"软体动物的主要特征：身体柔软，一般分为头、足、内脏团三部分；身体表面有外套膜，能分泌贝壳（多数种类）；多数体外有贝壳保护。蜗牛有螺旋形贝壳，足宽大适于爬行。河蚌有两扇贝壳，生活在淡水底部。乌贼和章鱼属于头足类，贝壳退化，身体里面有海螵蛸（乌贼骨）。软体动物是动物界中仅次于节肢动物的第二大类群。","semester":"upper"},{"id":"g2_biology_u008","chapter":"第一章 动物的主要类群","name":"节肢动物的主要特征","formula":"身体分部 | 体节 | 外骨骼 | 分节附肢 | 呼吸器官多样","explanation":"节肢动物是动物界中种类最多、数量最大、分布最广的动物类群。主要特征：身体分部（头、胸、腹三部分）；身体和附肢都分节；体表覆盖外骨骼（外骨骼不能随身体生长，需经蜕皮才能生长）；具有分节的附肢。节肢动物主要包括昆虫纲（如蜜蜂、蝗虫）、甲壳纲（如虾、蟹）、蛛形纲（如蜘蛛、蝎子）和多足纲（如蜈蚣、马陆）。","semester":"upper"},{"id":"g2_biology_u009","chapter":"第一章 动物的主要类群","name":"昆虫纲的主要特征","formula":"三对足 | 两对翅 | 一对触角 | 变态发育","explanation":"昆虫是节肢动物中种类最多的一个纲（约100万种）。主要特征：身体分为头、胸、腹三部分；头部有一对触角、一对复眼和三对口器；胸部有三对足，一般有两对翅（少数无翅）；呼吸器官为气管系统；多数种类进行变态发育（完全变态或不完全变态）。完全变态发育经过卵、幼虫、蛹、成虫四个时期，如蝴蝶、蜜蜂；不完全变态经过卵、若虫、成虫三个时期，如蝗虫、蟋蟀。","semester":"upper"},{"id":"g2_biology_u010","chapter":"第一章 动物的主要类群","name":"甲壳纲的主要特征","formula":"两对触角 | 头胸部甲壳 | 步足和游泳足 | 虾、蟹","explanation":"甲壳纲动物主要特征：身体分为头胸部和腹部两部分；头胸部外面包着坚韧的头胸甲；一般有五对步足用于行走，多对游泳足用于游泳；有两对触角。代表动物：虾和蟹。虾的腹部发达，有尾扇；蟹的腹部退化紧贴头胸部（俗称脐）。甲壳动物多数生活在水中，以浮游生物或有机碎屑为食。","semester":"upper"},{"id":"g2_biology_u011","chapter":"第一章 动物的主要类群","name":"蛛形纲的主要特征","formula":"四对足 | 无触角无翅 | 腹部无节 | 蜘蛛、蝎子、蜱螨","explanation":"蛛形纲动物的主要特征：身体分为头胸部和腹部两部分（有的愈合）；有四对足（共八只步足）；没有触角和翅；多数种类结网捕食。蜘蛛的腹部后端有纺绩器，可吐丝结网。蝎子腹部较长，末端有毒钩。蜱螨（如恙螨、疥螨）可寄生于人体或动物体表，引起疾病。蛛形纲动物主要分布于陆生环境。","semester":"upper"},{"id":"g2_biology_u012","chapter":"第一章 动物的主要类群","name":"鱼类的特征","formula":"变温动物 | 终生生活在水中 | 用鳃呼吸 | 用鳍游泳 | 体表有鳞片","explanation":"鱼类是脊椎动物中种类最多的类群（约24000种）。主要特征：终生生活在水中；用鳃呼吸，鳃丝密布毛细血管；用鳍游泳；体表覆盖鳞片，分泌黏液减少摩擦；心脏有一心房一心室，血液循环为单循环；体温随环境变化（变温动物）。鱼类可分为软骨鱼（如鲨鱼、鳐鱼）和硬骨鱼（如鲤鱼、鲫鱼、带鱼）。","semester":"upper"},{"id":"g2_biology_u013","chapter":"第一章 动物的主要类群","name":"两栖动物的特征","formula":"变态发育 | 幼体水生用鳃呼吸 | 成体水陆两栖用肺呼吸 | 青蛙、蟾蜍、大鲵","explanation":"两栖动物的主要特征：幼体（蝌蚪）生活在水中，用鳃呼吸，经过变态发育变为成体；成体水陆两栖生活，用肺呼吸，同时皮肤可辅助呼吸；皮肤裸露、湿润，能分泌黏液；体温随环境变化（变温动物）；体外受精，卵在水中受精。代表动物：青蛙、蟾蜍（癞蛤蟆）、大鲵（娃娃鱼，国家二级保护动物）。两栖动物是脊椎动物从水生向陆生过渡的类群。","semester":"upper"},{"id":"g2_biology_u014","chapter":"第一章 动物的主要类群","name":"爬行动物的特征","formula":"陆生 | 体表有角质鳞片或甲 | 用肺呼吸 | 变温动物 | 体内受精","explanation":"爬行动物的主要特征：体表覆盖角质鳞片或甲，能防止水分散失，适于陆地生活；用肺呼吸；体温随环境变化（变温动物）；体内受精，卵有坚韧的卵壳保护；多数种类在陆地上产卵。爬行动物是真正的陆生脊椎动物。代表动物：蛇、龟、蜥蜴、扬子鳄。扬子鳄是国家一级保护动物。恐龙也是古代爬行动物，现在已灭绝。","semester":"upper"},{"id":"g2_biology_u015","chapter":"第一章 动物的主要类群","name":"鸟类的特征","formula":"恒温动物 | 体表覆羽 | 前肢变为翼 | 双重呼吸 | 体温恒定（约42℃）","explanation":"鸟类的主要特征：体表覆羽，前肢变为翼，能飞行（少数不能飞行如企鹅、鸵鸟）；骨骼轻而坚固，长骨中空；胸骨发达，有龙骨突；用肺呼吸，有气囊辅助呼吸（双重呼吸）；体温恒定（约42℃），心脏四腔，血液循环双循环；体内受精，卵生。鸟类适于飞行的特点：身体呈流线型、前肢变翼、骨骼中空、有羽毛等。","semester":"upper"},{"id":"g2_biology_u016","chapter":"第一章 动物的主要类群","name":"哺乳动物的特征","formula":"胎生哺乳 | 体表被毛 | 体温恒定 | 大脑发达 | 胎生、哺乳","explanation":"哺乳动物的主要特征：体表被毛，保温性能好；体温恒定（约36-37℃）；心脏四腔，血液循环完全双循环；大脑皮层发达，行为复杂；胎生哺乳（是哺乳动物特有的繁殖方式），胚胎在母体子宫内发育，通过胎盘获取营养，出生后以母乳喂养。哺乳动物是动物界中最高等的类群，包括鲸、蝙蝠、鼠、兔、牛、羊、人等。哺乳动物能很好地适应各种环境。","semester":"upper"},{"id":"g2_biology_u017","chapter":"第二章 动物的运动和行为","name":"动物的运动结构","formula":"骨 | 关节 | 肌肉","explanation":"动物的运动主要由运动系统完成，运动系统由骨、关节和肌肉三部分组成。骨起杠杆作用，关节是支点，肌肉起动力作用。骨骼肌包括中间较粗的肌腹和两端较细的肌腱，肌腱结缔组织，将骨骼肌牢固地附着在骨上。一块骨骼肌至少跨越一个关节，牵引骨产生运动。骨本身不能运动，必须靠肌肉的牵引才能运动。","semester":"upper"},{"id":"g2_biology_u018","chapter":"第二章 动物的运动和行为","name":"关节的结构","formula":"关节面 | 关节囊 | 关节腔 | 韧带","explanation":"关节是骨连接的主要形式，结构包括：关节面（分为关节头和关节窝，表面光滑覆有关节软骨，可减少摩擦和缓冲震动）；关节囊（由结缔组织构成，内有滑膜层可分泌滑液）；关节腔（关节囊围成的密闭空间，内有滑液）；韧带（加强关节牢固性）。关节的结构特点：既牢固又灵活，适于运动。关节脱臼是指关节头从关节窝中滑出。","semester":"upper"},{"id":"g2_biology_u019","chapter":"第二章 动物的运动和行为","name":"骨骼肌的收缩和舒张","formula":"协作关系 | 收缩时变短变粗 | 舒张时变长变细 | 相互配合完成动作","explanation":"骨骼肌接受神经传来的刺激后会产生收缩。肌肉收缩时变短变粗，牵引骨围绕关节产生运动。但肌肉不能单独完成动作，必须有多块肌肉协调配合。以屈肘和伸肘为例：屈肘时，肱二头肌收缩、肱三头肌舒张；伸肘时，肱三头肌收缩、肱二头肌舒张。这种配合关系叫做协作关系。任何动作都需要多群肌肉的协调配合才能完成，体现了生物体结构的协调统一。","semester":"upper"},{"id":"g2_biology_u020","chapter":"第二章 动物的运动和行为","name":"动物行为的类型","formula":"觅食行为 | 防御行为 | 生殖行为 | 迁徙行为 | 社群行为","explanation":"动物行为是动物对外界环境变化和周围环境的各种刺激所做出的反应。主要类型包括：觅食行为（获取食物的行为）；防御行为（防御敌害，保护自己的行为）；生殖行为（与繁殖后代有关的行为，如求偶、交配、孵卵、育雏）；迁徙行为（鸟类等动物随季节变化而进行的距离迁移）；社群行为（群体内部不同成员之间分工合作，共同维持群体生活的行为）。","semester":"upper"},{"id":"g2_biology_u021","chapter":"第二章 动物的运动和行为","name":"先天性行为和学习行为","formula":"先天性行为：生来就有 | 遗传因素 | 蜘蛛结网、鸟类迁徙 | 学习行为：后天学习 | 环境因素 | 鹦鹉学舌、黑猩猩使用工具","explanation":"根据行为获得方式可分为：先天性行为（本能行为）是指动物生来就有的，由遗传因素决定的行为，如蜘蛛结网、鸟类迁徙、蜜蜂采蜜、婴儿吃奶等，这类行为具有物种特异性。学习行为则是动物在成长过程中通过学习和经验获得的，由环境因素决定，如鹦鹉学舌、黑猩猩使用工具、表演动物的表演等。先天性行为是学习行为的基础，学习行为能增强动物适应环境的能力。","semester":"upper"},{"id":"g2_biology_u022","chapter":"第二章 动物的运动和行为","name":"社会行为（社群行为）的特征","formula":"群体内部形成分工 | 成员间有明确的分工 | 不同的等级 | 信息交流方式","explanation":"社会行为（社群行为）是指群体内部不同成员之间分工合作，共同维持群体生活的行为。具有以下特征：群体内部形成一定的组织；成员之间有明确的分工；有的还有等级次序。典型的社群行为例子：蜜蜂群体中有蜂王（专职繁殖）、工蜂（劳动）和雄蜂（交配）；白蚁群体中有蚁后、蚁王、工蚁、兵蚁；狒狒群体中有首领（最占优势）。社群行为有利于动物更好地适应环境，提高生存和繁殖能力。","semester":"upper"},{"id":"g2_biology_u023","chapter":"第二章 动物的运动和行为","name":"动物的信息交流","formula":"动作 | 声音 | 气味 | 性外激素","explanation":"动物之间通过各种方式进行信息交流。动物的动作：蜜蜂通过舞蹈告诉同伴蜜源的方向和距离，圆圈舞表示较近，摆尾舞表示较远；萤火虫通过发光进行交流。动物的声音：鸟鸣、兽吼等可传递求偶、警告、联络等信息。动物的气味：许多昆虫和哺乳动物通过分泌和感知气味（信息素）来传递信息，如雌蚕蛾释放性外激素吸引雄蛾。动物的信息交流对于觅食、防御、繁殖等行为具有重要意义。","semester":"upper"},{"id":"g2_biology_u024","chapter":"第三章 动物在生物圈中的作用","name":"动物在生态系统中的作用","formula":"促进生态系统物质循环 | 帮助植物传粉和传播种子 | 维持生态平衡","explanation":"动物在生态系统中具有重要作用：促进生态系统物质循环，动物作为消费者，把有机物带入生态系统，通过呼吸作用分解有机物，释放二氧化碳、水和无机盐，供生产者重新利用；帮助植物传粉和传播种子，许多植物依赖动物传粉（如蜜蜂传粉）或传播种子（如松鼠传播松子、鸟类传播种子），没有动物这些植物将无法繁殖；动物能维持生态平衡，在食物链和食物网中各有其生态位，互相依存互相制约。","semester":"upper"},{"id":"g2_biology_u025","chapter":"第三章 动物在生物圈中的作用","name":"动物与人类生活的关系","formula":"提供食物和药材 | 传播疾病 | 科技发明灵感 | 仿生学","explanation":"动物与人类生活密切相关：为人类提供食物（肉类、蛋类、奶类）、皮毛、药材（鹿茸、麝香、熊胆）等物资；某些动物可传播疾病（如蚊子传播疟疾、鼠类传播鼠疫），危害人类健康；动物为人类提供科技发明的灵感——仿生学，如根据蝙蝠回声定位发明雷达、根据鱼鳔发明潜水艇、根据萤火虫发光原理发明冷光源等。保护有益动物，控制和消灭有害动物是人类与动物和谐相处的重要内容。","semester":"upper"},{"id":"g2_biology_u026","chapter":"第四章 细菌和真菌","name":"细菌的形态和结构","formula":"单细胞 | 原核生物 | 细胞壁、细胞膜、细胞质 | DNA集中区 | 荚膜、鞭毛 | 无成形的细胞核","explanation":"细菌是单细胞生物，属于原核生物。结构包括：细胞壁（保护作用）；细胞膜（控制物质进出）；细胞质（进行生命活动的场所）；DNA集中区（没有核膜包裹，称为拟核）；有些细菌还有荚膜（保护作用）和鞭毛（运动作用）。根据形态可分为：球菌（圆形）、杆菌（杆形）、螺旋菌（螺旋形）。细菌没有成形的细胞核，没有叶绿体，大多数细菌利用现成的有机物生活（异养），是分解者或寄生者。","semester":"upper"},{"id":"g2_biology_u027","chapter":"第四章 细菌和真菌","name":"细菌的繁殖方式","formula":"分裂繁殖 | 二分裂 | 20分钟一代 | 芽孢（休眠体）","explanation":"细菌通过分裂进行繁殖。分裂过程：细菌吸收营养物质，生长到一定程度后，细胞壁向内凹陷，细胞质分裂，细胞核也分裂，最后形成两个子细菌。在适宜条件下，细菌分裂速度很快，如大肠杆菌约20分钟分裂一次。环境不利时，某些细菌会形成芽孢，芽孢是细菌的休眠体，对干旱、高温、低温等恶劣环境有很强的抵抗力。芽孢不是细菌的繁殖方式，而是度过不良环境的结构。芽孢的耐热性很强，灭菌时常以杀死芽孢为标准。","semester":"upper"},{"id":"g2_biology_u028","chapter":"第四章 细菌和真菌","name":"真菌的形态和结构","formula":"多细胞或单细胞 | 真核生物 | 细胞壁、细胞膜、细胞质、细胞核 | 酵母菌、青霉、曲霉、蘑菇","explanation":"真菌有单细胞和多细胞两类。单细胞真菌代表：酵母菌，椭圆形，有细胞壁、细胞膜、细胞质和细胞核。多细胞真菌代表：青霉（菌丝顶端呈扫帚状）、曲霉（顶端呈球状）、蘑菇（由菌丝构成）。真菌的结构：细胞壁、细胞膜、细胞质、细胞核（有成形的细胞核，属于真核生物）。真菌的菌丝由许多细胞连接而成，吸收营养物质的菌丝叫营养菌丝，向上生长的叫气生菌丝。真菌与细菌的主要区别：真菌有成形的细胞核（真核），细菌没有（原核）。","semester":"upper"},{"id":"g2_biology_u029","chapter":"第四章 细菌和真菌","name":"细菌和真菌的分布","formula":"广泛分布 | 土壤中 | 水中 | 空气中 | 动植物体内 | 高温灭菌、接种培养","explanation":"细菌和真菌在自然界分布极其广泛：土壤中是细菌和真菌最多的地方，它们分解有机物，促进物质循环；水中、空气中都有它们的踪迹；动植物体内和体表也有细菌和真菌存在（如肠道中有很多大肠杆菌）；甚至在极端环境中也有细菌存在（如高温温泉、深海热泉孔）。细菌和真菌的培养：可用高温灭菌杀死培养基中的细菌和真菌，然后用接种工具接种要培养的菌种，在适宜条件下培养。培养细菌和真菌需要营养物质、适宜的温度和水分。","semester":"upper"},{"id":"g2_biology_u030","chapter":"第五章 细菌和真菌在人类生活中的应用","name":"细菌和真菌与食品制作","formula":"酵母菌发酵 | 乳酸菌发酵 | 醋酸菌发酵 | 制作馒头、面包、酸奶、醋、酱","explanation":"细菌和真菌在食品制作中应用广泛：酵母菌发酵：酵母菌在有氧条件下分解有机物产生二氧化碳和水，使面团膨胀形成馒头、面包；无氧条件下产生酒精，用于酿酒。乳酸菌发酵：乳酸菌使牛奶发酵形成酸奶，使蔬菜发酵形成泡菜、酸菜。醋酸菌发酵：醋酸菌使酒精氧化成醋酸，制成食醋。真菌发酵：霉菌（如曲霉）用于制作酱、酱油、豆腐乳等。这些发酵食品的原理是利用细菌或真菌在代谢过程中产生的酶，分解有机物产生特定物质。","semester":"upper"},{"id":"g2_biology_u031","chapter":"第五章 细菌和真菌在人类生活中的应用","name":"食品保存的原理和方法","formula":"杀死细菌和真菌 | 抑制其生长繁殖 | 巴氏消毒法、防腐剂、干燥、冷藏、腌制、真空包装","explanation":"食品保存的原理是把食物中的细菌和真菌杀死或抑制其生长和繁殖。常用方法：巴氏消毒法（将牛奶加热到70-80℃，杀死大部分细菌）；防腐剂（杀死或抑制微生物生长）；干燥（脱水保存，如干蘑菇、干肉）；冷藏（低温抑制微生物繁殖，但不能杀死微生物）；腌制（高浓度盐溶液或糖溶液，脱水抑制微生物）；真空包装（隔绝空气）。现代食品保存技术还包括辐照保鲜、超高压保鲜等方法。","semester":"upper"},{"id":"g2_biology_u032","chapter":"第五章 细菌和真菌在人类生活中的应用","name":"细菌和真菌与疾病防治","formula":"抗生素 | 青霉素 | 链霉素 | 预防接种 | 产生抗体","explanation":"细菌和真菌在疾病防治中具有重要作用：抗生素是某些真菌或细菌产生的能够杀死或抑制其他微生物的物质。青霉素是第一种被发现并广泛使用的抗生素，由青霉产生，可治疗多种细菌感染性疾病。链霉素、红霉素、土霉素等也是常用的抗生素。抗生素的使用需要遵医嘱，不能滥用，否则会产生耐药性。此外，利用细菌生产疫苗（如乙肝疫苗是通过转基因酵母生产的）、利用微生物生产药物（如胰岛素）等也是细菌和真菌在医学上的重要应用。","semester":"upper"},{"id":"g2_biology_u033","chapter":"第五章 细菌和真菌在人类生活中的应用","name":"细菌和真菌与环境保护","formula":"污水处理 | 分解污染物 | 分解有机物 | 沼气发酵 | 生物降解","explanation":"细菌和真菌在环境保护中发挥重要作用：污水处理：利用细菌分解有机物净化污水，污水处理厂利用活性污泥中的微生物分解有机废物；分解污染物：某些细菌和真菌能分解农药、塑料、石油等污染物，用于生物修复；沼气发酵：甲烷菌（厌氧细菌）分解有机物产生沼气（甲烷），可作为能源使用；分解废物：细菌和真菌是分解者，把动植物遗体、粪便等有机物分解成无机物，归还土壤，促进物质循环，维持生态平衡。没有分解者，物质将无法循环，生态系统将崩溃。","semester":"upper"},{"id":"g2_biology_l001","chapter":"第一章 生命的起源和进化","name":"生命起源的化学进化假说","formula":"无机小分子 → 有机小分子 → 有机大分子 → 原始生命 | 米勒实验","explanation":"化学进化假说是目前科学界较为公认的生命起源假说。该假说认为生命是在地球形成以后，通过化学进化过程逐渐产生的。具体过程：原始地球环境条件下，无机小分子物质（如甲烷、氨气、水蒸气、氢气等）在高温、雷电、紫外线等自然能源作用下，形成有机小分子物质（如氨基酸、核苷酸等）；有机小分子物质进一步组合形成有机大分子（如蛋白质、核酸等）；有机大分子物质逐渐聚集形成能繁殖、代谢的原始生命。1953年米勒的模拟实验证明了在原始地球条件下可以产生氨基酸等有机小分子物质。","semester":"lower"},{"id":"g2_biology_l002","chapter":"第一章 生命的起源和进化","name":"米勒实验","formula":"模拟原始地球环境 | 水蒸气+甲烷+氨气+氢气 | 放电 | 产生氨基酸等有机物","explanation":"1953年，美国科学家米勒设计了一个模拟原始地球环境的实验装置。他将水、甲烷、氨气、氢气等混合在一起，模拟原始大气的成分，然后通过放电产生闪电，模拟原始地球的自然条件。一周后，在实验装置中检测到了多种氨基酸等有机小分子物质。米勒实验证明了在原始地球的条件下，无机物可以转化为有机物，为化学进化假说提供了实验依据。但生命起源的具体过程至今仍是科学研究的重大课题。","semester":"lower"},{"id":"g2_biology_l003","chapter":"第一章 生命的起源和进化","name":"原始地球的环境特点","formula":"高温 | 频繁的火山喷发 | 还原性大气 | 雷电频繁 | 宇宙射线照射","explanation":"原始地球形成于约46亿年前，当时地球的环境与现在截然不同：表面温度很高，频繁的火山喷发；大气层稀薄，主要成分是水蒸气、二氧化碳、甲烷、氨气、氢气等（没有氧气，还原性大气）；频繁的雷电交加；宇宙射线和紫外线强烈照射；原始海洋形成，地球表面温度下降后，水蒸气凝结形成原始海洋。这些特殊的环境条件为生命的化学进化提供了能量和物质基础。","semester":"lower"},{"id":"g2_biology_l004","chapter":"第一章 生命的起源和进化","name":"化石是生物进化的直接证据","formula":"化石 | 生物遗体、遗物或遗迹 | 地质年代 | 越古老地层化石越简单","explanation":"化石是保存在地层中的古代生物的遗体、遗物或遗迹，是生物进化的直接证据。化石的形成：生物死后被泥沙掩埋，其遗体或遗迹经过漫长的岁月，有机物被分解，坚硬部分（骨骼、贝壳等）被矿物质填充或替代，形成化石。不同地质年代的地层中埋藏着不同的化石。通过研究化石可以了解生物的进化历程：越古老的地层中，化石越简单、越低等；越年轻的地层中，化石越复杂、越高等。这说明生物是不断进化发展的。","semester":"lower"},{"id":"g2_biology_l005","chapter":"第一章 生命的起源和进化","name":"生物进化的大致历程","formula":"单细胞生物 → 多细胞生物 → 无脊椎动物 → 脊椎动物 | 鱼类 → 两栖类 → 爬行类 → 鸟类、哺乳类","explanation":"生物进化的大致历程：地球上最早出现的生命是原始的单细胞生物（约35亿年前）；然后发展为多细胞生物；再进化出无脊椎动物；最后进化出脊椎动物。脊椎动物的大致进化顺序：原始鱼类（约5亿年前）→两栖类（约4亿年前）→爬行类（约3亿年前）→鸟类和哺乳类（约2亿年前）。植物的进化顺序：藻类→苔藓→蕨类→裸子植物→被子植物。生物进化总体趋势：从简单到复杂、从低等到高等、从水生到陆生。","semester":"lower"},{"id":"g2_biology_l006","chapter":"第一章 生命的起源和进化","name":"进化论的创立者——达尔文","formula":"自然选择学说 | 过度繁殖 | 生存斗争 | 遗传和变异 | 适者生存","explanation":"查尔斯·达尔文（1809-1882）是英国博物学家，1859年出版《物种起源》一书，提出进化论（自然选择学说）。自然选择学说的主要内容：过度繁殖（生物都有过度繁殖的倾向，导致生存斗争）；生存斗争（生物与环境之间、同种生物之间、不同种生物之间的斗争）；遗传和变异（后代既保留有利变异，也有不利变异）；适者生存（具有有利变异的个体容易生存并繁殖后代，不利变异的个体则被淘汰）。自然选择是生物进化的动力，通过自然选择，生物向着适应环境的方向进化。","semester":"lower"},{"id":"g2_biology_l007","chapter":"第一章 生命的起源和进化","name":"自然选择学说的要点","formula":"过度繁殖 | 生存斗争 | 遗传变异 | 适者生存 | 逐代积累","explanation":"自然选择学说的四个要点：1）过度繁殖：每种生物都能产生大量后代，但食物和空间有限；2）生存斗争：生物要生存下去，需要与自然环境、同种生物、其他物种进行斗争；3）遗传和变异：后代保留有利变异，也会产生各种变异；4）适者生存：具有有利变异的个体容易生存并繁殖，不利变异的则被淘汰有利变异逐代积累，不利变异逐渐消失。长期自然选择形成了生物的多样性和适应性。","semester":"lower"},{"id":"g2_biology_l008","chapter":"第一章 生命的起源和进化","name":"研究生物进化的证据","formula":"化石证据 | 解剖学证据（同源器官） | 胚胎学证据 | 分子生物学证据","explanation":"研究生物进化有多种证据：化石证据：通过研究不同地层中的化石，可以了解生物进化的大致历程，越古老地层化石越简单。解剖学证据：同源器官（结构不同、功能不同，但来源和基本结构相同的器官，如蝙蝠的翼、鲸的鳍、狗的前肢、人手）说明它们有共同祖先。胚胎学证据：不同脊椎动物的早期胚胎发育相似（都有鳃裂、尾），说明它们有共同的原始祖先。分子生物学证据：比较DNA、蛋白质等生物大分子的差异，推断生物亲缘关系和进化顺序。","semester":"lower"},{"id":"g2_biology_l009","chapter":"第一章 生命的起源和进化","name":"人类的进化历程","formula":"森林古猿 → 南方古猿 → 能人 → 直立人 → 早期智人 → 现代人","explanation":"人类的进化历程：森林古猿（约700-1000万年前）是人类和现代类人猿的共同祖先；南方古猿（约400-200万年前）开始直立行走；能人（约200-150万年前）能制造简单工具；直立人（约100-20万年前）会用火和更复杂的工具（如北京人）；早期智人（约20-5万年前）具有现代人的基本特征（如山顶洞人）；现代人（约5万年前到现在）是 Homo sapiens sapiens。人类进化的证据包括化石证据、分子生物学证据等。劳动在人类进化中起重要作用，直立行走和制造工具是人类进化的重要里程碑。","semester":"lower"},{"id":"g2_biology_l010","chapter":"第一章 生命的起源和进化","name":"生物多样性","formula":"物种多样性 | 基因多样性 | 生态系统多样性 | 保护生物多样性","explanation":"生物多样性包括三个层次：物种多样性（地球上各种生物种类的丰富程度，已知约有200万种）；基因多样性（同一物种内不同个体的基因差异，如不同品种的水稻基因不同）；生态系统多样性（森林、草原、湿地、海洋等不同生态系统）。生物多样性是生物长期进化的结果，对人类具有重要价值：提供食物、药材、工业原料等物质资源；调节气候、净化环境等生态服务功能；具有科研价值和美学价值。生物多样性正受到威胁，需要保护。","semester":"lower"},{"id":"g2_biology_l011","chapter":"第二章 生物的遗传和变异","name":"遗传和变异的概念","formula":"遗传：亲代与子代相似 | 变异：亲代与子代及子代个体间差异","explanation":"遗传是指生物亲子代之间在形态、结构、生理等方面相似的现象，如种瓜得瓜、种豆得豆，龙生龙、凤生凤。变异是指生物亲子代之间以及子代个体之间在形态、结构、生理等方面存在差异的现象，如一母生九子，连母十个样。遗传和变异是生物的基本特征之一。遗传使物种保持相对稳定，变异为生物进化提供原材料。遗传和变异都受遗传物质控制，同时也受环境因素影响。","semester":"lower"},{"id":"g2_biology_l012","chapter":"第二章 生物的遗传和变异","name":"DNA是主要的遗传物质","formula":"DNA | 脱氧核糖核酸 | 基因 | DNA分子双螺旋结构 | 遗传效应","explanation":"DNA（脱氧核糖核酸）是细胞核中储存遗传信息的物质，是主要的遗传物质。DNA分子的结构：双螺旋结构，像螺旋楼梯，由两条长链组成，两条链上的碱基配对（AT、GC）形成阶梯。DNA分子上有许多基因，基因是具有遗传效应的DNA片段，基因决定生物的性状。DNA主要存在于细胞核中（染色体是DNA的主要载体），少部分存在于线粒体和叶绿体中。遗传信息的传递：通过DNA复制，将遗传信息传递给子细胞或后代。","semester":"lower"},{"id":"g2_biology_l013","chapter":"第二章 生物的遗传和变异","name":"染色体","formula":"DNA+蛋白质 | 遗传物质的主要载体 | 成对存在 | 22对常染色体+1对性染色体","explanation":"染色体是细胞核中容易被碱性染料染色的物质，由DNA和蛋白质组成。染色体是遗传物质的主要载体。在细胞分裂的不同时期，染色体呈现不同的形态：在分裂期呈X形，分裂间期呈染色质状态。体细胞中染色体成对存在，如人有23对染色体（22对常染色体，1对性染色体）。不同的生物染色体数目不同，如水稻有12对，人类有23对，果蝇有4对。染色体数目或结构异常会导致遗传病。","semester":"lower"},{"id":"g2_biology_l014","chapter":"第二章 生物的遗传和变异","name":"基因与性状的关系","formula":"基因决定性状 | 基因位于染色体上 | 等位基因 | 显性基因与隐性基因","explanation":"基因是具有遗传效应的DNA片段，位于染色体上，每条染色体上有许多基因。基因决定生物的性状，如单眼皮还是双眼皮、有无耳垂等。在体细胞中，基因也是成对存在的，称为等位基因。等位基因有显性基因和隐性基因之分。显性基因用大写字母表示（如D），隐性基因用小写字母表示（如d）。当细胞中含显性基因时，表现显性性状；只有当两个基因都是隐性基因时，才表现隐性性状。基因型是指个体的基因组成，表现型是指个体表现出来的性状。","semester":"lower"},{"id":"g2_biology_l015","chapter":"第二章 生物的遗传和变异","name":"孟德尔豌豆杂交实验","formula":"遗传学奠基人 | 豌豆 | 一对相对性状杂交实验 | 分离定律 | 自由组合定律","explanation":"格雷戈尔·孟德尔（1822-1884）是遗传学的奠基人，他用豌豆进行了大量杂交实验。他选取豌豆是因为豌豆有容易区分的相对性状（如高茎和矮茎、圆粒和皱粒），且是自花传粉植物，实验结果可靠。他发现了两大遗传定律：分离定律（一对相对性状的遗传实验中，子一代全为显性性状，子二代出现性状分离，分离比为3:1）；自由组合定律（两对或多对相对性状杂交时，各对性状独立分配、组合。孟德尔的实验为遗传学奠定了科学基础。","semester":"lower"},{"id":"g2_biology_l016","chapter":"第二章 生物的遗传和变异","name":"基因的分离定律","formula":"等位基因分离 | 形成配子时 | 子一代杂合 | 子二代性状分离3:1","explanation":"基因的分离定律是孟德尔发现的第一个遗传定律。内容：在形成配子时，等位基因随同源染色体的分开而分离，分别进入不同的配子中。具体过程：以高茎（D）和矮茎（d）为例：纯合高茎（DD）和纯合矮茎（dd）杂交，子一代全为高茎（Dd），但D是显性，d是隐性；子一代自交，子二代出现性状分离，高茎和矮茎的比例约为3:1，基因型比例为1DD:2Dd:1dd。分离定律解释了为什么子代会出现性状分离现象，是遗传学的基本定律。","semester":"lower"},{"id":"g2_biology_l017","chapter":"第二章 生物的遗传和变异","name":"基因的自由组合定律","formula":"非同源染色体自由组合 | 非等位基因自由组合 | 子代9:3:3:1","explanation":"基因的自由组合定律是孟德尔发现的第二个遗传定律。内容：在形成配子时，位于非同源染色体上的非等位基因自由组合。具体过程：以黄色圆粒（YYRR）和绿色皱粒（yyrr）杂交为例：子一代全为黄色圆粒（YyRr）；子二代出现四种类型：黄色圆粒、黄色皱粒、绿色圆粒、绿色皱粒，比例为9:3:3:1。自由组合定律解释了两对或多对相对性状杂交时出现的新组合类型。孟德尔通过豌豆杂交实验验证了这一规律，为遗传学做出了重要贡献。","semester":"lower"},{"id":"g2_biology_l018","chapter":"第二章 生物的遗传和变异","name":"显性性状和隐性性状的判断","formula":"亲代杂交后代全为一种性状→该性状为显性 | 子一代性状相同→亲代为纯合子","explanation":"判断显隐性关系的方法：1）通过杂交判断：具有相对性状的两个亲本杂交，如果后代全表现为一种性状，则该性状为显性，另一种为隐性；2）通过自交判断：相同性状的个体交配，如果后代出现性状分离，则亲本为杂合子，性状为显性；3）通过性状分离比判断：在子二代中，如果显隐性比例为3:1，则显性为显性性状。显性性状不一定是好的或优势的，隐性性状也不一定是差的，它们只是遗传学上的区分。","semester":"lower"},{"id":"g2_biology_l019","chapter":"第二章 生物的遗传和变异","name":"人类的性别决定","formula":"XY型 | 男性：22对+XY | 女性：22对+XX | 性别由性染色体决定 | 生男生女机会均等","explanation":"人类的性别由性染色体决定，属于XY型。男性体细胞中的性染色体为XY，女性体细胞中的性染色体为XX。在形成配子时，男性产生两种精子（22条+X或22条+Y），女性只产生一种卵细胞（22条+X）。精子与卵细胞随机结合，形成的受精卵有两种可能：XX（女性）或XY（男性）。理论上，生男生女的机会均等，各占50%。胎儿的性别在受精时就已经决定，由父亲的精子类型决定。性染色体异常会导致性别发育异常，如XXY综合征（克氏综合征）、X0综合征（特纳综合征）等。","semester":"lower"},{"id":"g2_biology_l020","chapter":"第二章 生物的遗传和变异","name":"遗传病的类型","formula":"单基因遗传病 | 多基因遗传病 | 染色体异常遗传病 | 近亲结婚增加发病率","explanation":"遗传病是指由遗传物质改变引起的疾病。主要类型：1）单基因遗传病：由一对基因控制的遗传病，如白化病、多指症、镰刀型细胞贫血症等；2）多基因遗传病：由多对基因控制，如哮喘、唇腭裂、冠心病等；3）染色体异常遗传病：由染色体数目或结构异常引起，如先天愚型（21三体综合征）、克氏综合征等。近亲结婚（如表兄妹结婚）会使后代患隐性遗传病的机会大大增加，因为近亲携带相同隐性致病基因的可能性更高，因此我国法律禁止近亲结婚。","semester":"lower"},{"id":"g2_biology_l021","chapter":"第二章 生物的遗传和变异","name":"可遗传的变异和不遗传的变异","formula":"可遗传变异：遗传物质改变 | 基因突变、染色体变异 | 不遗传变异：环境因素","explanation":"变异可分为两类：可遗传的变异是指由于遗传物质（如DNA、基因、染色体）发生改变而引起的变异，这类变异能遗传给后代，包括基因突变（DNA分子中碱基对的增添、缺失或改变）、染色体变异（染色体数目或结构改变）。不遗传的变异是指由环境因素（如营养条件、光照、温度等）引起的变异，遗传物质没有改变，这类变异不能遗传给后代，如同样基因型的水肥条件不同导致的高矮差异。生物的变异是普遍存在的，变异为进化提供了原材料。","semester":"lower"},{"id":"g2_biology_l022","chapter":"第二章 生物的遗传和变异","name":"变异在农业上的应用","formula":"人工选择 | 杂交育种 | 诱变育种 | 转基因技术 | 太空育种","explanation":"变异在农业上有着广泛应用：人工选择：通过选择培育有利变异，经过逐代选择形成作物新品种（如各种狗的品种、各种花卉品种）。杂交育种：将两个不同品种的个体杂交，让控制不同性状基因重新组合，产生新品种（如杂交水稻、杂交玉米），袁隆平被誉为\"杂交水稻之父\"。诱变育种：利用物理或化学因素诱发基因突变，产生新品种。转基因技术：将一种生物的基因转移到另一种生物体内，培育新品种（如转基因棉花、转基因大豆）。太空育种：利用太空特殊环境诱发基因突变。","semester":"lower"},{"id":"g2_biology_l023","chapter":"第三章 人类的起源和进化","name":"人类与现代类人猿的亲缘关系","formula":"森林古猿是共同祖先 | 类人猿：黑猩猩、大猩猩、猩猩、长臂猿 | 人类不是由类人猿进化而来","explanation":"人类和现代类人猿有着共同的原始祖先——森林古猿。现代类人猿包括黑猩猩、大猩猩、猩猩和长臂猿，它们与人类的亲缘关系最近，其中黑猩猩与人类的基因相似度最高（约98%-99%）。需要注意的是：人类不是由现代类人猿进化而来的，人类和现代类人猿是平行进化的关系，只是走上了不同的进化道路。现代类人猿仍然生活在森林中，没有进化成人类；人类则从森林走向草原，开始了独特的人类进化历程。","semester":"lower"},{"id":"g2_biology_l024","chapter":"第三章 人类的起源和进化","name":"从猿到人的进化历程","formula":"森林古猿 →下地生活 →直立行走 →使用工具 →制造工具 →使用火 →语言文字 →社会","explanation":"从猿到人的进化历程：约1000万年前，森林古猿生活在森林中；由于环境变化，一部分森林古猿下地生活，开始直立行走；直立行走使前肢解放出来，开始使用天然工具；逐渐学会制造工具，这是人类区别于猿的重要标志；学会使用火，改善了生存条件，增强了体质；产生了语言和文字，促进了交流和合作；形成人类社会，具有社会属性。在人类进化中，劳动起重要作用，直立行走和使用、制造工具是人与猿的根本区别。","semester":"lower"},{"id":"g2_biology_l025","chapter":"第三章 人类的起源和进化","name":"人类进化的主要阶段","formula":"南方古猿（能两足直立行走）→能人（能制造简单工具）→直立人（会使用火）→早期智人（狩猎、采集）→现代人","explanation":"人类进化的主要阶段：1）南方古猿：约400-200万年前，能两足直立行走，但脑容量较小；2）能人：约200-150万年前，能制造简单石器工具，脑容量约600-700毫升；3）直立人：约100-20万年前，能制造和使用较复杂的工具，会用火（北京的周口店发现北京人头盖骨），脑容量约1000毫升；4）早期智人：约20-5万年前，像现代人，会制造工具、狩猎、雕刻，如山顶洞人；5）现代人（晚期智人）：约5万年前到现在，身体结构与现代人基本相同。","semester":"lower"},{"id":"g2_biology_l026","chapter":"第四章 生物与环境","name":"生态系统的组成","formula":"生物成分：生产者（植物）| 消费者（动物）| 分解者（细菌和真菌）| 非生物成分：阳光、空气、水、土壤","explanation":"生态系统由生物成分和非生物成分组成。生物成分包括：生产者（绿色植物，通过光合作用制造有机物，是生态系统的基础）；消费者（动物，不能自己制造有机物，直接或间接以植物为食）；分解者（细菌和真菌，分解动植物遗体、粪便，将有机物分解成无机物）。非生物成分包括：阳光（提供能量）、空气（如氧气、二氧化碳）、水、土壤、无机盐等。生产者、消费者和分解者缺一不可，共同维持生态系统的稳定。","semester":"lower"},{"id":"g2_biology_l027","chapter":"第四章 生物与环境","name":"食物链和食物网","formula":"食物链：生产者→草食动物→肉食动物→... | 食物网：多条食物链交织 | 物质循环和能量流动的渠道","explanation":"食物链是生态系统中各种生物之间由于食物关系而形成的一种联系。食物链的起点是生产者（绿色植物），然后是草食动物（初级消费者），再是肉食动物（次级、三级消费者），最后是分解者。食物网是生态系统中多条食物链交织在一起形成的网状结构。能量沿着食物链逐级流动，每一环节的能量传递效率约为10%，能量流动的特点：单向流动、逐级递减。物质在生态系统中可循环利用（碳循环、水循环等），但能量不能循环，只能单向流动。","semester":"lower"},{"id":"g2_biology_l028","chapter":"第四章 生物与环境","name":"生态系统的能量流动和物质循环","formula":"能量流动：单向流动、逐级递减 | 物质循环：反复循环、反复利用 | 碳循环、水循环","explanation":"生态系统的能量流动：能量进入生态系统后，通过生产者→消费者→分解者的途径流动，能量在流动过程中逐渐减少（每一环节约传递10%），最终以热能形式散失，因此能量流动是单向的、逐级递减的，不能循环。生态系统的物质循环：物质在生态系统内部可以被反复利用，物质在生物圈中循环，如碳循环（水圈、大气圈→生产者→消费者→分解者→大气圈）、氮循环、水循环等。生态系统中的能量流动和物质循环是生态系统的基本功能。","semester":"lower"},{"id":"g2_biology_l029","chapter":"第四章 生物与环境","name":"生态系统的自动调节能力","formula":"有一定限度 | 生态系统越复杂自动调节能力越强 | 破坏会导致失衡","explanation":"生态系统具有一定的自动调节能力，能在没有人为干扰的情况下维持相对稳定。但这种能力是有一定限度的。生态系统越复杂（生物种类越多、食物网越复杂），自动调节能力越强；生态系统越简单（生物种类少、食物网简单），自动调节能力越弱。当外界干扰超过生态系统的自动调节能力时，生态系统就会失衡甚至崩溃。例如：过多的污染物进入河流会杀死分解者，导致水质恶化；过度放牧导致草原退化；乱砍滥伐导致森林消失等。保护生态系统就是保护人类自己。","semester":"lower"},{"id":"g2_biology_l030","chapter":"第四章 生物与环境","name":"生物与环境的关系","formula":"生物影响环境 | 环境影响生物 | 生物适应环境 | 光合作用、呼吸作用、蒸腾作用","explanation":"生物与环境之间存在密切的相互关系。生物影响环境：生物的活动能改变环境，如植物蒸腾作用增加空气湿度、动物挖掘洞穴改变土壤结构、人类活动污染环境等。环境影响生物：环境因素（如阳光、温度、水分、土壤等）影响生物的分布、形态和生理。生物适应环境：生物在形态、结构、生理等方面表现出与环境相适应的特征，如仙人掌的刺状叶适应干旱环境、变色龙体色随环境变化、绿色植物的光合作用利用阳光等。生物既能适应环境，也能影响环境。","semester":"lower"},{"id":"g2_biology_l031","chapter":"第五章 生物技术","name":"生物技术的概念","formula":"生物技术 | 利用生物体系 | 改良生物或生产产品 | 传统生物技术 | 现代生物技术","explanation":"生物技术是指利用生物体系（包括生物体、细胞、酶等）来改良生物或生产产品的技术。生物技术分为传统生物技术和现代生物技术。传统生物技术包括：酿造（酿酒、制醋）、发酵（制作酸奶、泡菜）、传统育种等，已经有几千年的历史。现代生物技术包括：基因工程（如转基因技术）、细胞工程（如克隆技术）、发酵工程（如利用发酵罐生产药物）、酶工程（如酶制剂应用）等，是20世纪70年代以后发展起来的。生物技术为人类解决食品、医药、环境等问题提供了新途径。","semester":"lower"},{"id":"g2_biology_l032","chapter":"第五章 生物技术","name":"基因工程与转基因技术","formula":"基因工程 | 提取目的基因 | 拼接基因 | 导入受体细胞 | 表达 | 转基因生物","explanation":"基因工程是指按照人的意愿，人工地改造生物遗传性状的技术。转基因技术是基因工程的核心技术，其过程：提取目的基因（如抗虫基因）；用限制性核酸内切酶切割质粒（运载体），用DNA连接酶将目的基因与质粒拼接形成重组DNA分子；将重组DNA分子导入受体细胞；受体细胞大量繁殖，使目的基因表达。转基因技术的应用：转基因作物（如抗虫棉、抗除草剂大豆）、转基因动物（如转基因鲤鱼）、转基因药物（如胰岛素、干扰素）等。转基因技术的争议主要涉及安全性、伦理问题等。","semester":"lower"},{"id":"g2_biology_l033","chapter":"第五章 生物技术","name":"克隆技术","formula":"无性繁殖 | 体细胞核移植 | 多利羊 | 遗传组成与供核个体基本相同","explanation":"克隆是指不经过受精过程，通过无性繁殖获得与亲代遗传组成完全相同的个体。1996年，世界上第一只克隆哺乳动物——多利羊诞生。克隆技术的基本过程：将一只羊的乳腺细胞（体细胞）的细胞核取出，移植到另一只羊的去核卵细胞中；用电刺激使融合细胞分裂发育成胚胎；将胚胎移植到第三只羊的子宫内，最终产下多利羊。多利羊的遗传组成与提供细胞核的羊基本相同。克隆技术可用于保存濒危物种、繁殖优质牲畜、培育医学模型等，但也存在伦理争议。","semester":"lower"}];

        // ==================== 内嵌例题数据 ====================
        const DATA_EXAMPLES = [{"id":"g2_biology_u001_ex01","knowledge_id":"g2_biology_u001","question":"选择题：下列动物类群中，按照进化顺序从简单到复杂排列正确的是（  ）\nA. 软体动物→环节动物→节肢动物\nB. 腔肠动物→扁形动物→线形动物\nC. 节肢动物→软体动物→环节动物\nD. 线形动物→腔肠动物→扁形动物","answer":"答案：B\n解析：无脊椎动物进化顺序：原生动物→腔肠动物→扁形动物→线形动物→环节动物→软体动物→节肢动物。"},{"id":"g2_biology_u001_ex02","knowledge_id":"g2_biology_u001","question":"填空题：无脊椎动物中种类最多、数量最大、分布最广的类群是______。","answer":"答案：节肢动物\n解析：节肢动物是动物界中最大的类群，包括昆虫、蜘蛛、蜈蚣、虾、蟹等。"},{"id":"g2_biology_u001_ex03","knowledge_id":"g2_biology_u001","question":"选择题：下列动物中，属于环节动物的是（  ）\nA. 蛔虫\nB. 蚯蚓\nC. 蜗牛\nD. 蝗虫","answer":"答案：B\n解析：蚯蚓身体分节，有刚毛，属于环节动物。蛔虫是线形动物，蜗牛是软体动物，蝗虫是节肢动物。"},{"id":"g2_biology_u001_ex04","knowledge_id":"g2_biology_u001","question":"判断题：原生动物是由单细胞构成的动物。","answer":"答案：正确\n解析：原生动物是最原始、最简单的动物，整个身体由一个细胞构成。"},{"id":"g2_biology_u001_ex05","knowledge_id":"g2_biology_u001","question":"解答题：请简述无脊椎动物各类群的主要特征及其代表动物。","answer":"答案：原生动物（单细胞，如草履虫）；腔肠动物（辐射对称，有口无肛门，如水螅）；扁形动物（两侧对称，三胚层，如涡虫）；线形动物（细长如线，假体腔，如蛔虫）；环节动物（分节，真体腔，如蚯蚓）；软体动物（身体柔软，外套膜，如蜗牛）；节肢动物（身体分节，外骨骼，如蝗虫）。\n解析：考察对无脊椎动物各类群的理解。"},{"id":"g2_biology_u001_ex06","knowledge_id":"g2_biology_u001","question":"选择题：下列动物中，有口无肛门的是（  ）\nA. 水螅\nB. 蚯蚓\nC. 蜗牛\nD. 蛔虫","answer":"答案：A\n解析：腔肠动物（如水螅）有口无肛门，食物从口进入，残渣也从口排出。"},{"id":"g2_biology_u001_ex07","knowledge_id":"g2_biology_u001","question":"填空题：身体分节是______动物和______动物的重要特征。","answer":"答案：环节，节肢\n解析：环节动物和节肢动物的身体都具有分节现象。"},{"id":"g2_biology_u001_ex08","knowledge_id":"g2_biology_u001","question":"判断题：软体动物都有贝壳。","answer":"答案：错误\n解析：大多数软体动物有贝壳，但乌贼、章鱼等头足类动物的贝壳退化。"},{"id":"g2_biology_u001_ex09","knowledge_id":"g2_biology_u001","question":"解答题：为什么说节肢动物是动物界中最高等的无脊椎动物？","answer":"答案：节肢动物身体分节，有外骨骼保护，有分节的附肢，感觉器官发达，适应能力强，种类最多、分布最广。\n解析：考察对节肢动物特征的理解。"},{"id":"g2_biology_u001_ex10","knowledge_id":"g2_biology_u001","question":"选择题：下列关于无脊椎动物进化的说法，正确的是（  ）\nA. 越高等的动物身体越简单\nB. 进化顺序是从复杂到简单\nC. 节肢动物是最高等的无脊椎动物\nD. 原生动物是最高等的无脊椎动物","answer":"答案：C\n解析：生物进化总体趋势是从简单到复杂、从低等到高等。节肢动物是最高等的无脊椎动物。"},{"id":"g2_biology_u002_ex01","knowledge_id":"g2_biology_u002","question":"选择题：下列生物中，属于原生动物的是（  ）\nA. 细菌\nB. 草履虫\nC. 酵母菌\nD. 衣藻","answer":"答案：B\n解析：草履虫是单细胞动物，属于原生动物。细菌是原核生物，酵母菌是真菌，衣藻是植物。"},{"id":"g2_biology_u002_ex02","knowledge_id":"g2_biology_u002","question":"填空题：原生动物的整个身体由______个细胞构成。","answer":"答案：一\n解析：原生动物是单细胞动物，整个身体只有一个细胞。"},{"id":"g2_biology_u002_ex03","knowledge_id":"g2_biology_u002","question":"选择题：草履虫的运动器官是（  ）\nA. 伪足\nB. 纤毛\nC. 鞭毛\nD. 刚毛","answer":"答案：B\n解析：草履虫全身布满纤毛，依靠纤毛摆动进行运动。"},{"id":"g2_biology_u002_ex04","knowledge_id":"g2_biology_u002","question":"判断题：变形虫依靠伪足进行运动和摄食。","answer":"答案：正确\n解析：变形虫通过伸出伪足来移动和捕捉食物。"},{"id":"g2_biology_u002_ex05","knowledge_id":"g2_biology_u002","question":"解答题：原生动物的一个细胞是如何完成全部生命活动的？","answer":"答案：原生动物的单个细胞内有各种细胞器，如纤毛用于运动，食物泡用于消化，伸缩泡用于排泄，细胞核控制生命活动等。\n解析：考察对单细胞生物结构和功能的理解。"},{"id":"g2_biology_u002_ex06","knowledge_id":"g2_biology_u002","question":"选择题：下列关于原生动物的说法，错误的是（  ）\nA. 都是单细胞生物\nB. 都是寄生生活\nC. 能完成全部生命活动\nD. 是最原始的动物","answer":"答案：B\n解析：原生动物有的自由生活（如草履虫），有的寄生生活（如疟原虫）。"},{"id":"g2_biology_u002_ex07","knowledge_id":"g2_biology_u002","question":"填空题：能引起疟疾的原生动物是______。","answer":"答案：疟原虫\n解析：疟原虫通过按蚊传播，能引起疟疾。"},{"id":"g2_biology_u002_ex08","knowledge_id":"g2_biology_u002","question":"判断题：原生动物是动物界中最低等的类群。","answer":"答案：正确\n解析：原生动物结构最简单，是动物进化的起点。"},{"id":"g2_biology_u002_ex09","knowledge_id":"g2_biology_u002","question":"解答题：观察草履虫时，为什么要在载玻片的培养液中放几丝棉花纤维？","answer":"答案：限制草履虫的运动速度，便于观察。\n解析：草履虫运动速度较快，放棉花纤维可以减慢其运动。"},{"id":"g2_biology_u002_ex10","knowledge_id":"g2_biology_u002","question":"选择题：原生动物与其他动物的主要区别是（  ）\nA. 体型微小\nB. 单细胞\nC. 生活在水中\nD. 没有细胞壁","answer":"答案：B\n解析：原生动物是单细胞动物，这是与其他多细胞动物的根本区别。"},{"id":"g2_biology_u003_ex01","knowledge_id":"g2_biology_u003","question":"选择题：下列动物中，属于腔肠动物的是（  ）\nA. 涡虫\nB. 水螅\nC. 蛔虫\nD. 蚯蚓","answer":"答案：B\n解析：水螅是腔肠动物，身体呈辐射对称，有口无肛门。"},{"id":"g2_biology_u003_ex02","knowledge_id":"g2_biology_u003","question":"填空题：腔肠动物的身体呈______对称，有______无______。","answer":"答案：辐射，口，肛门\n解析：腔肠动物身体呈辐射对称，有口无肛门。"},{"id":"g2_biology_u003_ex03","knowledge_id":"g2_biology_u003","question":"选择题：水螅的触手用于（  ）\nA. 运动\nB. 捕食\nC. 防御\nD. 呼吸","answer":"答案：B\n解析：水螅的触手上有刺细胞，用于捕捉食物。"},{"id":"g2_biology_u003_ex04","knowledge_id":"g2_biology_u003","question":"判断题：珊瑚虫属于腔肠动物。","answer":"答案：正确\n解析：珊瑚虫身体呈辐射对称，有口无肛门，属于腔肠动物。"},{"id":"g2_biology_u003_ex05","knowledge_id":"g2_biology_u003","question":"解答题：腔肠动物和原生动物相比，有哪些进化上的进步？","answer":"答案：腔肠动物出现了组织分化（内胚层、外胚层），身体呈辐射对称，有了简单的消化腔。\n解析：考察生物进化的理解。"},{"id":"g2_biology_u003_ex06","knowledge_id":"g2_biology_u003","question":"选择题：下列关于腔肠动物的说法，正确的是（  ）\nA. 有口有肛门\nB. 身体扁平\nC. 有刺细胞\nD. 生活在陆地上","answer":"答案：C\n解析：腔肠动物有刺细胞用于捕食和防御。"},{"id":"g2_biology_u003_ex07","knowledge_id":"g2_biology_u003","question":"填空题：珊瑚礁是由______分泌的石灰质外壳堆积形成的。","answer":"答案：珊瑚虫\n解析：珊瑚虫分泌石灰质外壳，堆积形成珊瑚礁。"},{"id":"g2_biology_u003_ex08","knowledge_id":"g2_biology_u003","question":"判断题：腔肠动物都是固着生活的。","answer":"答案：错误\n解析：水螅营固着生活，但水母营漂浮生活。"},{"id":"g2_biology_u003_ex09","knowledge_id":"g2_biology_u003","question":"解答题：为什么说腔肠动物是真正后生动物的开始？","answer":"答案：腔肠动物出现了组织分化，有了内胚层和外胚层，身体结构比原生动物复杂得多。\n解析：考察对生物进化的理解。"},{"id":"g2_biology_u003_ex10","knowledge_id":"g2_biology_u003","question":"选择题：腔肠动物的消化方式是（  ）\nA. 细胞内消化\nB. 细胞外消化\nC. 既有细胞内又有细胞外消化\nD. 没有消化","answer":"答案：C\n解析：腔肠动物既有细胞内消化（食物颗粒被细胞吞噬），也有细胞外消化（消化腔中的消化酶）。"},{"id":"g2_biology_u004_ex01","knowledge_id":"g2_biology_u004","question":"选择题：下列动物中，属于扁形动物的是（  ）\nA. 水螅\nB. 涡虫\nC. 蛔虫\nD. 蚯蚓","answer":"答案：B\n解析：涡虫身体扁平，呈柳叶状，有眼点，属于扁形动物。"},{"id":"g2_biology_u004_ex02","knowledge_id":"g2_biology_u004","question":"填空题：扁形动物的身体呈______对称，有______个胚层。","answer":"答案：两侧（左右），三\n解析：扁形动物身体呈两侧对称，有内胚层、中胚层、外胚层三个胚层。"},{"id":"g2_biology_u004_ex03","knowledge_id":"g2_biology_u004","question":"选择题：扁形动物与腔肠动物相比，进化上的进步是（  ）\nA. 身体呈辐射对称\nB. 出现中胚层\nC. 有口无肛门\nD. 体型更小","answer":"答案：B\n解析：扁形动物出现了中胚层，为器官系统的形成奠定了基础。"},{"id":"g2_biology_u004_ex04","knowledge_id":"g2_biology_u004","question":"判断题：血吸虫属于扁形动物。","answer":"答案：正确\n解析：血吸虫身体扁平，两侧对称，属于扁形动物。"},{"id":"g2_biology_u004_ex05","knowledge_id":"g2_biology_u004","question":"解答题：两侧对称对动物的进化有什么意义？","answer":"答案：两侧对称使动物身体有了前后、左右、背腹之分，运动更加定向，感觉器官集中在前端，有利于主动寻找食物和逃避敌害。\n解析：考察对生物进化的理解。"},{"id":"g2_biology_u004_ex06","knowledge_id":"g2_biology_u004","question":"选择题：涡虫的眼点用于（  ）\nA. 看东西\nB. 感光\nC. 捕食\nD. 防御","answer":"答案：B\n解析：涡虫的眼点只能感受光线强弱，不能成像。"},{"id":"g2_biology_u004_ex07","knowledge_id":"g2_biology_u004","question":"填空题：扁形动物中营自由生活的代表是______，营寄生生活的代表有______。","answer":"答案：涡虫，血吸虫（或华枝睾吸虫）\n解析：涡虫自由生活，血吸虫等寄生生活。"},{"id":"g2_biology_u004_ex08","knowledge_id":"g2_biology_u004","question":"判断题：扁形动物都有三个胚层。","answer":"答案：正确\n解析：三个胚层是扁形动物的重要特征。"},{"id":"g2_biology_u004_ex09","knowledge_id":"g2_biology_u004","question":"解答题：寄生生活的扁形动物有哪些适应寄生生活的特征？","answer":"答案：体表有角质层防止消化液侵蚀，生殖器官发达，消化系统退化，有特殊的附着器官。\n解析：考察对寄生生物适应性的理解。"},{"id":"g2_biology_u004_ex10","knowledge_id":"g2_biology_u004","question":"选择题：下列关于扁形动物的说法，错误的是（  ）\nA. 身体扁平\nB. 两侧对称\nC. 有口有肛门\nD. 有三个胚层","answer":"答案：C\n解析：扁形动物有口无肛门。"},{"id":"g2_biology_u005_ex01","knowledge_id":"g2_biology_u005","question":"选择题：下列动物中，属于线形动物的是（  ）\nA. 涡虫\nB. 蚯蚓\nC. 蛔虫\nD. 蜗牛","answer":"答案：C\n解析：蛔虫身体细长如线，有假体腔，属于线形动物。"},{"id":"g2_biology_u005_ex02","knowledge_id":"g2_biology_u005","question":"填空题：线形动物身体细长呈______形，体表有一层______层。","answer":"答案：线，角质\n解析：线形动物身体细长呈线形，体表有角质层防止消化液侵蚀。"},{"id":"g2_biology_u005_ex03","knowledge_id":"g2_biology_u005","question":"选择题：线形动物的主要特征是（  ）\nA. 身体分节\nB. 有假体腔\nC. 有真体腔\nD. 有贝壳","answer":"答案：B\n解析：线形动物开始出现假体腔。"},{"id":"g2_biology_u005_ex04","knowledge_id":"g2_biology_u005","question":"判断题：蛔虫是常见的人体寄生虫。","answer":"答案：正确\n解析：蛔虫成虫寄生在人体小肠内，可引起蛔虫病。"},{"id":"g2_biology_u005_ex05","knowledge_id":"g2_biology_u005","question":"解答题：如何预防蛔虫病？","answer":"答案：注意个人卫生，饭前便后洗手，不吃生冷食物，不喝生水，粪便无害化处理。\n解析：考察卫生常识和对寄生虫的了解。"},{"id":"g2_biology_u005_ex06","knowledge_id":"g2_biology_u005","question":"选择题：蛔虫的消化器官特点是（  ）\nA. 发达\nB. 退化\nC. 没有\nD. 只有口","answer":"答案：B\n解析：蛔虫寄生在人体内，消化器官退化，依靠宿主的营养。"},{"id":"g2_biology_u005_ex07","knowledge_id":"g2_biology_u005","question":"填空题：蛲虫常在______爬到肛门处产卵。","answer":"答案：夜间\n解析：蛲虫常在夜间爬到肛门处产卵，引起肛门瘙痒。"},{"id":"g2_biology_u005_ex08","knowledge_id":"g2_biology_u005","question":"判断题：所有线形动物都是寄生生活的。","answer":"答案：错误\n解析：线形动物有些自由生活，有些寄生生活。"},{"id":"g2_biology_u005_ex09","knowledge_id":"g2_biology_u005","question":"解答题：假体腔和真体腔有什么区别？","answer":"答案：假体腔的体腔壁没有肌肉层，真体腔的体腔壁有肌肉层。\n解析：考察对动物体腔的理解。"},{"id":"g2_biology_u005_ex10","knowledge_id":"g2_biology_u005","question":"选择题：下列关于线形动物的说法，正确的是（  ）\nA. 身体分节\nB. 有口有肛门\nC. 有外骨骼\nD. 生活在水中","answer":"答案：B\n解析：线形动物有口有肛门，这是比扁形动物进化的地方。"},{"id":"g2_biology_u006_ex01","knowledge_id":"g2_biology_u006","question":"选择题：下列动物中，属于环节动物的是（  ）\nA. 蛔虫\nB. 蚯蚓\nC. 蜗牛\nD. 蝗虫","answer":"答案：B\n解析：蚯蚓身体分节，有刚毛，属于环节动物。"},{"id":"g2_biology_u006_ex02","knowledge_id":"g2_biology_u006","question":"填空题：环节动物的身体由许多______的体节构成。","answer":"答案：相似\n解析：环节动物身体分节，体节相似。"},{"id":"g2_biology_u006_ex03","knowledge_id":"g2_biology_u006","question":"选择题：蚯蚓的运动器官是（  ）\nA. 纤毛\nB. 刚毛\nC. 疣足\nD. 四肢","answer":"答案：B\n解析：蚯蚓依靠刚毛辅助运动。"},{"id":"g2_biology_u006_ex04","knowledge_id":"g2_biology_u006","question":"判断题：蚯蚓对土壤肥力有重要作用。","answer":"答案：正确\n解析：蚯蚓以土壤中的有机质为食，排出的粪便富含养分，能提高土壤肥力。"},{"id":"g2_biology_u006_ex05","knowledge_id":"g2_biology_u006","question":"解答题：蚯蚓身体分节有什么意义？","answer":"答案：身体分节使运动更加灵活，各体节可以独立运动，增强了适应能力。\n解析：考察对分节现象的理解。"},{"id":"g2_biology_u006_ex06","knowledge_id":"g2_biology_u006","question":"选择题：蚯蚓的环带位于（  ）\nA. 前端\nB. 后端\nC. 中部\nD. 尾部","answer":"答案：A\n解析：蚯蚓的环带位于身体前端，是生殖带。"},{"id":"g2_biology_u006_ex07","knowledge_id":"g2_biology_u006","question":"填空题：环节动物出现了______体腔。","answer":"答案：真\n解析：环节动物出现了真体腔，体腔壁有肌肉层。"},{"id":"g2_biology_u006_ex08","knowledge_id":"g2_biology_u006","question":"判断题：水蛭属于环节动物。","answer":"答案：正确\n解析：水蛭（蚂蟥）身体分节，属于环节动物。"},{"id":"g2_biology_u006_ex09","knowledge_id":"g2_biology_u006","question":"解答题：为什么蚯蚓被称为\"生态系统工程师\"？","answer":"答案：蚯蚓能疏松土壤，提高土壤肥力，促进物质循环，对生态系统有重要作用。\n解析：考察对蚯蚓生态作用的理解。"},{"id":"g2_biology_u006_ex10","knowledge_id":"g2_biology_u006","question":"选择题：下列关于环节动物的说法，错误的是（  ）\nA. 身体分节\nB. 有真体腔\nC. 有外骨骼\nD. 多数有刚毛","answer":"答案：C\n解析：外骨骼是节肢动物的特征，环节动物没有外骨骼。"},{"id":"g2_biology_u007_ex01","knowledge_id":"g2_biology_u007","question":"选择题：下列动物中，属于软体动物的是（  ）\nA. 蚯蚓\nB. 蜗牛\nC. 蝗虫\nD. 蛔虫","answer":"答案：B\n解析：蜗牛身体柔软，有外套膜和贝壳，属于软体动物。"},{"id":"g2_biology_u007_ex02","knowledge_id":"g2_biology_u007","question":"填空题：软体动物身体柔软，有______膜和______。","answer":"答案：外套，贝壳\n解析：软体动物有外套膜，多数有贝壳。"},{"id":"g2_biology_u007_ex03","knowledge_id":"g2_biology_u007","question":"选择题：河蚌的呼吸器官是（  ）\nA. 鳃\nB. 肺\nC. 皮肤\nD. 气管","answer":"答案：A\n解析：河蚌用鳃呼吸。"},{"id":"g2_biology_u007_ex04","knowledge_id":"g2_biology_u007","question":"判断题：乌贼属于软体动物。","answer":"答案：正确\n解析：乌贼身体柔软，有外套膜，贝壳退化，属于软体动物。"},{"id":"g2_biology_u007_ex05","knowledge_id":"g2_biology_u007","question":"解答题：软体动物贝壳的作用是什么？","answer":"答案：保护柔软的身体，防止外界伤害和水分蒸发。\n解析：考察对贝壳功能的理解。"},{"id":"g2_biology_u007_ex06","knowledge_id":"g2_biology_u007","question":"选择题：下列关于软体动物的说法，正确的是（  ）\nA. 都有贝壳\nB. 都生活在水中\nC. 身体柔软\nD. 身体分节","answer":"答案：C\n解析：软体动物的主要特征是身体柔软。"},{"id":"g2_biology_u007_ex07","knowledge_id":"g2_biology_u007","question":"填空题：软体动物是动物界中第______大类群。","answer":"答案：二\n解析：软体动物是仅次于节肢动物的第二大类群。"},{"id":"g2_biology_u007_ex08","knowledge_id":"g2_biology_u007","question":"判断题：章鱼有贝壳。","answer":"答案：错误\n解析：章鱼的贝壳退化。"},{"id":"g2_biology_u007_ex09","knowledge_id":"g2_biology_u007","question":"解答题：为什么说软体动物是动物界中多样性很高的类群？","answer":"答案：软体动物生活环境多样（水生、陆生），形态多样（有壳、无壳），食性多样，种类繁多。\n解析：考察对软体动物多样性的理解。"},{"id":"g2_biology_u007_ex10","knowledge_id":"g2_biology_u007","question":"选择题：蜗牛的运动器官是（  ）\nA. 足\nB. 鳍\nC. 四肢\nD. 刚毛","answer":"答案：A\n解析：蜗牛的足宽大，适于爬行。"},{"id":"g2_biology_u008_ex01","knowledge_id":"g2_biology_u008","question":"选择题：下列关于\"节肢动物的主要特征\"的说法，正确的是（  ）\nA. 错误说法A\nB. 错误说法B\nC. 正确说法C\nD. 错误说法D","answer":"答案：C\n解析：根据节肢动物的主要特征的定义和性质分析各选项。"},{"id":"g2_biology_u008_ex02","knowledge_id":"g2_biology_u008","question":"填空题：节肢动物的主要特征的主要特征是______。","answer":"答案：根据知识点填写\n解析：节肢动物的主要特征的核心特征。"},{"id":"g2_biology_u008_ex03","knowledge_id":"g2_biology_u008","question":"选择题：节肢动物的主要特征的代表动物（或生物）是（  ）\nA. 选项A\nB. 选项B\nC. 选项C\nD. 选项D","answer":"答案：C\n解析：根据知识点判断。"},{"id":"g2_biology_u008_ex0         const HAS_EXAMPLES = true;

        // 错题本管理器
        const WrongBookManager = {
            STORAGE_KEY_PREFIX: 'wrongbook_',
            getWrongBook(grade, subject) {
                const key = this.STORAGE_KEY_PREFIX + grade + '_' + subject;
                return JSON.parse(localStorage.getItem(key) || '[]');
            },
            addWrongBook(item) {
                const key = this.STORAGE_KEY_PREFIX + item.grade + '_' + item.subject;
                let wrongBook = this.getWrongBook(item.grade, item.subject);
                const exists = wrongBook.some(w => w.question === item.question);
                if (exists) return false;
                wrongBook.push({...item, id: item.knowledgeId + '_' + Date.now(), addedAt: new Date().toISOString()});
                localStorage.setItem(key, JSON.stringify(wrongBook));
                return true;
            }
        };

        // 学习进度管理器
        const ProgressManager = {
            STORAGE_KEY: 'study_progress',
            
            getProgress() {
                try {
                    return JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
                } catch(e) {
                    return {};
                }
            },
            
            saveProgress(progress) {
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(progress));
            },
            
            recordStudy(grade, subject, subjectName, semester, semesterName, knowledgeId, knowledgeName) {
                const progress = this.getProgress();
                const now = new Date().toISOString();
                const today = new Date().toISOString().split('T')[0];
                
                if (!progress.learnedKnowledge) progress.learnedKnowledge = {};
                if (!progress.dailyStats) progress.dailyStats = {};
                if (!progress.dailyStats[today]) {
                    progress.dailyStats[today] = { learnedCount: 0, subjects: [] };
                }
                
                const isNew = !progress.learnedKnowledge[knowledgeId];
                progress.learnedKnowledge[knowledgeId] = { learnedAt: now };
                
                if (isNew) {
                    progress.dailyStats[today].learnedCount++;
                    if (!progress.dailyStats[today].subjects.includes(subject)) {
                        progress.dailyStats[today].subjects.push(subject);
                    }
                }
                
                progress.lastStudy = {
                    grade, subject, subjectName, semester, semesterName,
                    knowledgeId, knowledgeName, timestamp: now
                };
                
                this.saveProgress(progress);
            },
            
            isLearned(knowledgeId) {
                const progress = this.getProgress();
                return !!(progress.learnedKnowledge && progress.learnedKnowledge[knowledgeId]);
            },
            
            getLastStudy() {
                const progress = this.getProgress();
                return progress.lastStudy || null;
            },
            
            getSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                if (!progress.learnedKnowledge) return { learned: 0, total: 0, percent: 0 };
                const prefix = grade + '_' + subject + '_';
                const learned = Object.keys(progress.learnedKnowledge).filter(k => k.startsWith(prefix)).length;
                const total = DATA_KNOWLEDGE.length;
                const percent = total > 0 ? Math.round((learned / total) * 100) : 0;
                return { learned, total, percent };
            },
            
            clearSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                const prefix = grade + '_' + subject + '_';
                
                if (progress.learnedKnowledge) {
                    Object.keys(progress.learnedKnowledge).forEach(k => {
                        if (k.startsWith(prefix)) {
                            delete progress.learnedKnowledge[k];
                        }
                    });
                }
                
                if (progress.lastStudy && progress.lastStudy.grade === grade && progress.lastStudy.subject === subject) {
                    delete progress.lastStudy;
                }
                
                this.saveProgress(progress);
                return true;
            }
        };

        // URL参数解析
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                grade: 'g2',
                subject: 'biology',
                semester: params.get('semester') || 'upper'
            };
        }

        const gradeNames = {'g1':'初一','g2':'初二','g3':'初三'};
        const subjectNames = {'biology':'生物'};
        const semesterNames = {'upper':'上册','lower':'下册'};

        let currentParams = getUrlParams();
        let knowledgeList = [];
        let expandedIds = new Set();
        let currentExample = null;

        const pageTitle = document.getElementById('page-title');
        const pageSubtitle = document.getElementById('page-subtitle');
        const knowledgeListEl = document.getElementById('knowledge-list');
        const emptyStateEl = document.getElementById('empty-state');
        const searchResultsInfo = document.getElementById('search-results-info');
        const searchCountEl = document.getElementById('search-count');
        const searchInput = document.getElementById('search-input');

        function initPage() {
            const {grade, subject, semester} = currentParams;
            pageTitle.textContent = gradeNames[grade] + ' · ' + subjectNames[subject] + ' · ' + semesterNames[semester];
            loadKnowledge();
            updateProgressStat();
            
            const hash = window.location.hash.replace('#', '');
            if (hash && knowledgeList.some(k => k.id === hash)) {
                setTimeout(() => {
                    toggleExpand(hash);
                    const card = document.querySelector('[data-id="' + hash + '"]');
                    if (card) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
        }

        function updateProgressStat() {
            const {grade, subject} = currentParams;
            const learnedInSemester = knowledgeList.filter(k => ProgressManager.isLearned(k.id)).length;
            document.getElementById('progress-learned').textContent = learnedInSemester;
            document.getElementById('progress-total').textContent = knowledgeList.length;
        }

        function loadKnowledge() {
            const {grade, subject, semester} = currentParams;
            knowledgeList = DATA_KNOWLEDGE.filter(k => {
                return k.semester === semester;
            });
            renderKnowledgeList();
        }

        function renderKnowledgeList(items = knowledgeList) {
            if (items.length === 0) {
                knowledgeListEl.innerHTML = '';
                emptyStateEl.classList.remove('hidden');
                return;
            }
            emptyStateEl.classList.add('hidden');
            knowledgeListEl.innerHTML = items.map(item => {
                const isExpanded = expandedIds.has(item.id);
                const isLearned = ProgressManager.isLearned(item.id);
                return '<div class="card knowledge-card ' + (isLearned ? 'learned' : '') + '" data-id="' + item.id + '">' +
                    '<div class="knowledge-header p-4 flex items-center justify-between" onclick="toggleExpand(\'' + item.id + '\')">' +
                        '<div class="flex items-center gap-3 flex-1 min-w-0">' +
                            '<div class="expand-icon ' + (isExpanded ? 'expanded' : 'collapsed') + '">' + (isExpanded ? '−' : '+') + '</div>' +
                            '<div class="flex-1 min-w-0">' +
                                '<h3 class="text-lg font-semibold text-gray-800 flex items-center gap-2">' + escapeHtml(item.name) + (isLearned ? '<span class="text-green-500 text-sm">✓ 已学习</span>' : '') + '</h3>' +
                                '<p class="text-xs text-gray-500 mt-1">' + escapeHtml(item.chapter) + '</p>' +
                            '</div>' +
                        '</div>' +
                        (HAS_EXAMPLES ? '<button class="btn btn-secondary text-sm px-3 py-1" onclick="event.stopPropagation(); showExample(\'' + item.id + '\', \'' + escapeHtml(item.name) + '\')">例题</button>' : '') +
                    '</div>' +
                    '<div id="content-' + item.id + '" class="px-6 pb-4 ' + (isExpanded ? '' : 'hidden') + '">' +
                        (item.formula ? '<div class="mb-4"><h4 class="text-sm font-medium text-gray-500 mb-2">📐 公式</h4><p class="formula-box text-gray-800 text-lg bg-gray-50 p-3 rounded-lg">' + escapeHtml(item.formula) + '</p></div>' : '') +
                        (item.explanation ? '<div><h4 class="text-sm font-medium text-gray-500 mb-2">📝 解释</h4><p class="text-gray-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(item.explanation) + '</p></div>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function toggleExpand(id) {
            const isNewLearn = !expandedIds.has(id) && !ProgressManager.isLearned(id);
            if (expandedIds.has(id)) {
                expandedIds.delete(id);
            } else {
                expandedIds.add(id);
                const {grade, subject, semester} = currentParams;
                const item = knowledgeList.find(k => k.id === id);
                if (item) {
                    ProgressManager.recordStudy(
                        grade, subject, subjectNames[subject],
                        semester, semesterNames[semester],
                        id, item.name
                    );
                }
            }
            const card = document.querySelector('[data-id="' + id + '"]');
            const content = document.getElementById('content-' + id);
            const icon = card.querySelector('.expand-icon');
            const header = card.querySelector('.knowledge-header');
            const title = card.querySelector('h3');
            if (expandedIds.has(id)) {
                content.classList.remove('hidden');
                icon.classList.remove('collapsed');
                icon.classList.add('expanded');
                icon.textContent = '−';
                header.classList.add('expanded');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('expanded');
                icon.classList.add('collapsed');
                icon.textContent = '+';
                header.classList.remove('expanded');
            }
            if (isNewLearn) {
                card.classList.add('learned');
                if (!title.querySelector('.text-green-500')) {
                    title.innerHTML += '<span class="text-green-500 text-sm">✓ 已学习</span>';
                }
                updateProgressStat();
            }
        }

        function expandAll() {
            knowledgeList.forEach(item => expandedIds.add(item.id));
            renderKnowledgeList();
        }

        function collapseAll() {
            expandedIds.clear();
            renderKnowledgeList();
        }

        function searchKnowledge(keyword, list) {
            if (!keyword) return [];
            const lower = keyword.toLowerCase();
            return list.filter(k =>
                k.name.toLowerCase().includes(lower) ||
                k.chapter.toLowerCase().includes(lower)
            );
        }

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                searchResultsInfo.classList.add('hidden');
                renderKnowledgeList();
                return;
            }
            const results = searchKnowledge(keyword, knowledgeList);
            searchCountEl.textContent = results.length;
            searchResultsInfo.classList.remove('hidden');
            renderKnowledgeList(results);
        }

        function showExample(knowledgeId, knowledgeName) {
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === knowledgeId);
            if (examples.length === 0) {
                alert('暂无例题');
                return;
            }
            const example = examples[Math.floor(Math.random() * examples.length)];
            currentExample = {...example, knowledgeId, knowledgeName, ...currentParams};
            document.getElementById('example-knowledge-name').textContent = knowledgeName;
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
            document.getElementById('example-modal').classList.remove('hidden');
        }

        function nextExample() {
            if (!currentExample) return;
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === currentExample.knowledgeId);
            const otherExamples = examples.filter(e => e !== currentExample);
            if (otherExamples.length === 0) {
                alert('没有更多例题了');
                return;
            }
            const example = otherExamples[Math.floor(Math.random() * otherExamples.length)];
            currentExample = {...example, knowledgeId: currentExample.knowledgeId, knowledgeName: currentExample.knowledgeName, ...currentParams};
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
        }

        function addToWrongBook() {
            if (!currentExample) return;
            const item = {
                knowledgeId: currentExample.knowledgeId,
                knowledgeName: currentExample.knowledgeName,
                question: currentExample.question,
                answer: currentExample.answer,
                grade: currentParams.grade,
                subject: currentParams.subject
            };
            if (WrongBookManager.addWrongBook(item)) {
                alert('已加入错题本！');
            } else {
                alert('该题目已在错题本中');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearProgress() {
            const {grade, subject} = currentParams;
            const subjectName = subjectNames[subject];
            var msg = '确定要清除【' + subjectName + '】科目的所有学习进度吗？';
            msg += '\n\n';
            msg += '此操作将清除该科目所有已学习标记，且不可恢复。';
            if (!confirm(msg)) {
                return;
            }
            ProgressManager.clearSubjectProgress(grade, subject);
            updateProgressStat();
            renderKnowledgeList();
            alert('学习进度已清除');
        }

        document.getElementById('btn-expand-all').addEventListener('click', expandAll);
        document.getElementById('btn-collapse-all').addEventListener('click', collapseAll);
        document.getElementById('btn-clear-progress').addEventListener('click', clearProgress);
        searchInput.addEventListener('keyup', e => { if (e.key === 'Enter') performSearch(); });
        searchInput.addEventListener('input', () => { if (!searchInput.value) { searchResultsInfo.classList.add('hidden'); renderKnowledgeList(); }});
        document.getElementById('close-example').addEventListener('click', () => document.getElementById('example-modal').classList.add('hidden'));
        document.getElementById('btn-show-answer').addEventListener('click', () => {
            document.getElementById('example-answer-section').classList.remove('hidden');
            document.getElementById('btn-show-answer').classList.add('hidden');
        });
        document.getElementById('btn-next-example').addEventListener('click', nextExample);
        document.getElementById('btn-add-wrong').addEventListener('click', addToWrongBook);
        document.getElementById('example-modal').addEventListener('click', e => { if (e.target.id === 'example-modal') document.getElementById('example-modal').classList.add('hidden'); });

        initPage();
    </script>
</body>
</html>
