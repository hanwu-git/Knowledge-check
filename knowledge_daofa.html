nB. 可以完全忽视社会规则\nC. 个人不需要承担任何责任\nD. 社会生活与个人无关","answer":"正确答案：A\n解析：礼仪体现一个人的道德水平和文明程度。以礼待人能够架起人与人之间沟通的桥梁，使人际关系更加和谐。讲文明、有礼貌是中华民族的传统美德，也是做人的基本准则。"},{"id":"g2_daofa_u012_ex02","knowledge_id":"g2_daofa_u012","question":"【选择题】下列对\"以礼待人的意义\"的理解，错误的是：\nA. 礼是社会关系的基本规范，礼待人是文明的表现\nB. 这是现代公民应有的素质\nC. 与日常生活没有关系\nD. 有助于社会的和谐发展","answer":"正确答案：C\n解析：礼仪体现一个人的道德水平和文明程度。以礼待人能够架起人与人之间沟通的桥梁，使人际关系更加和谐。讲文明、有礼貌是中华民族的传统美德，也是做人的基本准则。\n选项C是错误的，以礼待人的意义与我们的日常生活密切相关。"},{"id":"g2_daofa_u012_ex03","knowledge_id":"g2_daofa_u012","question":"【选择题】在学习\"以礼待人的意义\"时，我们应该：\nA. 礼是社会关系的基本规范，礼待人是文明的表现\nB. 不以为然，觉得无所谓\nC. 只在考试时关注\nD. 认为这只是理论，没有实际意义","answer":"正确答案：A\n解析：礼仪体现一个人的道德水平和文明程度。以礼待人能够架起人与人之间沟通的桥梁，使人际关系更加和谐。讲文明、有礼貌是中华民族的传统美德，也是做人的基本准则。"},{"id":"g2_daofa_u012_ex04","knowledge_id":"g2_daofa_u012","question":"【判断题】以礼待人的意义与我们的生活无关，可以不必在意。（）","answer":"错误\n解析：礼仪体现一个人的道德水平和文明程度。以礼待人能够架起人与人之间沟通的桥梁，使人际关系更加和谐。讲文明、有礼貌是中华民族的传统美德，也是做人的基本准则。"},{"id":"g2_daofa_u012_ex05","knowledge_id":"g2_daofa_u012","question":"【判断题】礼是社会关系的基本规范，礼待人是文明的表现。（）","answer":"正确\n解析：礼仪体现一个人的道德水平和文明程度。以礼待人能够架起人与人之间沟通的桥梁，使人际关系更加和谐。讲文明、有礼貌是中华民族的传统美德，也是做人的基本准则。"},{"id":"g2_daofa_u012_ex06","knowledge_id":"g2_daofa_u012","question":"【判断题】以礼待人的意义与我们的生活无关，可以不必在意。（）","answer":"错误\n解析：礼仪体现一个人的道德水平和文明程度。以礼待人能够架起人与人之间沟通的桥梁，使人际关系更加和谐。讲文明、有礼貌是中华民族的传统美德，也是做人的基本准则。"},{"id":"g2_daofa_u012_ex07","knowledge_id":"g2_daofa_u012","question":"【简答题】为什么说以礼待人的意义是每个公民都应该具备的素质？","answer":"礼是社会关系的基本规范，礼待人是文明的表现\n\n礼仪体现一个人的道德水平和文明程度。以礼待人能够架起人与人之间沟通的桥梁，使人际关系更加和谐。讲文明、有礼貌是中华民族的传统美德，也是做人的基本准则。\n\n这关系到个人的成长进步，也关系到社会的和谐发展。"},{"id":"g2_daofa_u012_ex08","knowledge_id":"g2_daofa_u012","question":"【简答题】请简要说明什么是以礼待人的意义。","answer":"礼是社会关系的基本规范，礼待人是文明的表现\n\n礼仪体现一个人的道德水平和文明程度。以礼待人能够架起人与人之间沟通的桥梁，使人际关系更加和谐。讲文明、有礼貌是中华民族的传统美德，也是做人的基本准则。"},{"id":"g2_daofa_u012_ex09","knowledge_id":"g2_daofa_u012","question":"【案例分析题】材料：某校初二学生在社会实践中发现，部分同学在公共场所大声喧哗、不遵守秩序。\n请运用\"以礼待人的意义\"的知识，分析说明我们应该怎样做。","answer":"（1）礼是社会关系的基本规范，礼待人是文明的表现\n（2）礼仪体现一个人的道德水平和文明程度。以礼待人能够架起人与人之间沟通的桥梁，使人际关系更加和谐。讲文明、有礼貌是中华民族的传统美德，也是做人的基本准则。\n（3）作为中学生，我们应该从身边小事做起，自觉践行以礼待人的意义，为构建和谐社会贡献力量。"},{"id":"g2_daofa_u012_ex10","knowledge_id":"g2_daofa_u012","question":"【案例分析题】材料：王同学在小区里主动捡拾垃圾，并带动其他居民一起保护环境。\n请结合\"以礼待人的意义\"的知识，评价王同学的行为。","answer":"（1）王同学的行为体现了以礼待人的意义。\n（2）礼是社会关系的基本规范，礼待人是文明的表现\n（3）礼仪体现一个人的道德水平和文明程度。以礼待人能够架起人与人之间沟通的桥梁，使人际关系更加和谐。讲文明、有礼貌是中华民族的传统美德，也是做人的基本准则。\n（4）我们应该向王同学学习，积极参与社会公益活动，服务社会，奉献社会。"},{"id":"g2_daofa_u013_ex01","knowledge_id":"g2_daofa_u013","question":"【选择题】\"责任的含义\"主要体现了什么道理？\nA. 责任是一个人应当做的事情或不应该做某些事情\nB. 可以完全忽视社会规则\nC. 个人不需要承担任何责任\nD. 社会生活与个人无关","answer":"正确答案：A\n解析：责任产生于社会关系之中的相互承诺。责任主要来源于对自己、他人、社会、国家、自然等所承担的义务。每个人都扮演着不同的社会角色，承担着不同的责任。"},{"id":"g2_daofa_u013_ex02","knowledge_id":"g2_daofa_u013","question":"【选择题】下列对\"责任的含义\"的理解，错误的是：\nA. 责任是一个人应当做的事情或不应该做某些事情\nB. 这是现代公民应有的素质\nC. 与日常生活没有关系\nD. 有助于社会的和谐发展","answer":"正确答案：C\n解析：责任产生于社会关系之中的相互承诺。责任主要来源于对自己、他人、社会、国家、自然等所承担的义务。每个人都扮演着不同的社会角色，承担着不同的责任。\n选项C是错误的，责任的含义与我们的日常生活密切相关。"},{"id":"g2_daofa_u013_ex03","knowledge_id":"g2_daofa_u013","question":"【选择题】在学习\"责任的含义\"时，我们应该：\nA. 责任是一个人应当做的事情或不应该做某些事情\nB. 不以为然，觉得无所谓\nC. 只在考试时关注\nD. 认为这只是理论，没有实际意义","answer":"正确答案：A\n解析：责任产生于社会关系之中的相互承诺。责任主要来源于对自己、他人、社会、国家、自然等所承担的义务。每个人都扮演着不同的社会角色，承担着不同的责任。"},{"id":"g2_daofa_u013_ex04","knowledge_id":"g2_daofa_u013","question":"【判断题】责任的含义与我们的生活无关，可以不必在意。（）","answer":"错误\n解析：责任产生于社会关系之中的相互承诺。责任主要来源于对自己、他人、社会、国家、自然等所承担的义务。每个人都扮演着不同的社会角色，承担着不同的责任。"},{"id":"g2_daofa_u013_ex05","knowledge_id":"g2_daofa_u013","question":"【判断题】责任是一个人应当做的事情或不应该做某些事情。（）","answer":"正确\n解析：责任产生于社会关系之中的相互承诺。责任主要来源于对自己、他人、社会、国家、自然等所承担的义务。每个人都扮演着不同的社会角色，承担着不同的责任。"},{"id":"g2_daofa_u013_ex06","knowledge_id":"g2_daofa_u013","question":"【判断题】责任的含义与我们的生活无关，可以不必在意。（）","answer":"错误\n解析：责任产生于社会关系之中的相互承诺。责任主要来源于对自己、他人、社会、国家、自然等所承担的义务。每个人都扮演着不同的社会角色，承担着不同的责任。"},{"id":"g2_daofa_u013_ex07","knowledge_id":"g2_daofa_u013","question":"【简答题】为什么说责任的含义是每个公民都应该具备的素质？","answer":"责任是一个人应当做的事情或不应该做某些事情\n\n责任产生于社会关系之中的相互承诺。责任主要来源于对自己、他人、社会、国家、自然等所承担的义务。每个人都扮演着不同的社会角色，承担着不同的责任。\n\n这关系到个人的成长进步，也关系到社会的和谐发展。"},{"id":"g2_daofa_u013_ex08","knowledge_id":"g2_daofa_u013","question":"【简答题】请简要说明什么是责任的含义。","answer":"责任是一个人应当做的事情或不应该做某些事情\n\n责任产生于社会关系之中的相互承诺。责任主要来源于对自己、他人、社会、国家、自然等所承担的义务。每个人都扮演着不同的社会角色，承担着不同的责任。"},{"id":"g2_daofa_u013_ex09","knowledge_id":"g2_daofa_u013","question":"【案例分析题】材料：某校初二学生在社会实践中发现，部分同学在公共场所大声喧哗、不遵守秩序。\n请运用\"责任的含义\"的知识，分析说明我们应该怎样做。","answer":"（1）责任是一个人应当做的事情或不应该做某些事情\n（2）责任产生于社会关系之中的相互承诺。责任主要来源于对自己、他人、社会、国家、自然等所承担的义务。每个人都扮演着不同的社会角色，承担着不同的责任。\n（3）作为中学生，我们应该从身边小事做起，自觉践行责任的含义，为构建和谐社会贡献力量。"},{"id":"g2_daofa_u013_ex10","knowledge_id":"g2_daofa_u013","question":"【案例分析题】材料：王同学在小区里主动捡拾垃圾，并带动其他居民一起保护环境。\n请结合\"责任的含义\"的知识，评价王同学的行为。","answer":"（1）王同学的行为体现了责任的含义。\n（2）责任是一个人应当做的事情或不应该做某些事情\n（3）责任产生于社会关系之中的相互承诺。责任主要来源于对自己、他人、社会、国家、自然等所承担的义务。每个人都扮演着不同的社会角色，承担着不同的责任。\n（4）我们应该向王同学学习，积极参与社会公益活动，服务社会，奉献社会。"},{"id":"g2_daofa_u014_ex01","knowledge_id":"g2_daofa_u014","question":"【选择题】\"角色与责任的关系\"主要体现了什么道理？\nA. 不同的角色承担不同的责任，一个人可以同时承担多种角色和责任\nB. 可以完全忽视社会规则\nC. 个人不需要承担任何责任\nD. 社会生活与个人无关","answer":"正确答案：A\n解析：在社会生活中，我们每个人都扮演着不同的角色：子女、学生、朋友、公民等。每一个角色都意味着一种责任。我们每个人都要明确自己的角色和责任，勇于承担责任。"},{"id":"g2_daofa_u014_ex02","knowledge_id":"g2_daofa_u014","question":"【选择题】下列对\"角色与责任的关系\"的理解，错误的是：\nA. 不同的角色承担不同的责任，一个人可以同时承担多种角色和责任\nB. 这是现代公民应有的素质\nC. 与日常生活没有关系\nD. 有助于社会的和谐发展","answer":"正确答案：C\n解析：在社会生活中，我们每个人都扮演着不同的角色：子女、学生、朋友、公民等。每一个角色都意味着一种责任。我们每个人都要明确自己的角色和责任，勇于承担责任。\n选项C是错误的，角色与责任的关系与我们的日常生活密切相关。"},{"id":"g2_daofa_u014_ex03","knowledge_id":"g2_daofa_u014","question":"【选择题】在学习\"角色与责任的关系\"时，我们应该：\nA. 不同的角色承担不同的责任，一个人可以同时承担多种角色和责任\nB. 不以为然，觉得无所谓\nC. 只在考试时关注\nD. 认为这只是理论，没有实际意义","answer":"正确答案：A\n解析：在社会生活中，我们每个人都扮演着不同的角色：子女、学生、朋友、公民等。每一个角色都意味着一种责任。我们每个人都要明确自己的角色和责任，勇于承担责任。"},{"id":"g2_daofa_u014_ex04","knowledge_id":"g2_daofa_u014","question":"【判断题】角色与责任的关系与我们的生活无关，可以不必在意。（）","answer":"错误\n解析：在社会生活中，我们每个人都扮演着不同的角色：子女、学生、朋友、公民等。每一个角色都意味着一种责任。我们每个人都要明确自己的角色和责任，勇于承担责任。"},{"id":"g2_daofa_u014_ex05","knowledge_id":"g2_daofa_u014","question":"【判断题】不同的角色承担不同的责任，一个人可以同时承担多种角色和责任。（）","answer":"正确\n解析：在社会生活中，我们每个人都扮演着不同的角色：子女、学生、朋友、公民等。每一个角色都意味着一种责任。我们每个人都要明确自己的角色和责任，勇于承担责任。"},{"id":"g2_daofa_u014_ex06","knowledge_id":"g2_daofa_u014","question":"【判断题】角色与责任的关系与我们的生活无关，可以不必在意。（）","answer":"错误\n解析：在社会生活中，我们每个人都扮演着不同的角色：子女、学生、朋友、公民等。每一个角色都意味着一种责任。我们每个人都要明确自己的角色和责任，勇于承担责任。"},{"id":"g2_daofa_u014_ex07","knowledge_id":"g2_daofa_u014","question":"【简答题】为什么说角色与责任的关系是每个公民都应该具备的素质？","answer":"不同的角色承担不同的责任，一个人可以同时承担多种角色和责任\n\n在社会生活中，我们每个人都扮演着不同的角色：子女、学生、朋友、公民等。每一个角色都意味着一种责任。我们每个人都要明确自己的角色和责任，勇于承担责任。\n\n这关系到个人的成长进步，也关系到社会的和谐发展。"},{"id":"g2_daofa_u014_ex08","knowledge_id":"g2_daofa_u014","question":"【简答题】请简要说明什么是角色与责任的关系。","answer":"不同的角色承担不同的责任，一个人可以同时承担多种角色和责任\n\n在社会生活中，我们每个人都扮演着不同的角色：子女、学生、朋友、公民等。每一个角色都意味着一种责任。我们每个人都要明确自己的角色和责任，勇于承担责任。"},{"id":"g2_daofa_u014_ex09","knowledge_id":"g2_daofa_u014","question":"【案例分析题】材料：某校初二学生在社会实践中发现，部分同学在公共场所大声喧哗、不遵守秩序。\n请运用\"角色与责任的关系\"的知识，分析说明我们应该怎样做。","answer":"（1）不同的角色承担不同的责任，一个人可以同时承担多种角色和责任\n（2）在社会生活中，我们每个人都扮演着不同的角色：子女、学生、朋友、公民等。每一个角色都意味着一种责任。我们每个人都要明确自己的角色和责任，勇于承担责任。\n（3）作为中学生，我们应该从身边小事做起，自觉践行角色与责任的关系，为构建和谐社会贡献力量。"},{"id":"g2_daofa_u014_ex10","knowledge_id":"g2_daofa_u014","question":"【案例分析题】材料：王同学在小区里主动捡拾垃圾，并带动其他居民一起保护环境。\n请结合\"角色与责任的关系\"的知识，评价王同学的行为。","answer":"（1）王同学的行为体现了角色与责任的关系。\n（2）不同的角色承担不同的责任，一个人可以同时承担多种角色和责任\n（3）在社会生活中，我们每个人都扮演着不同的角色：子女、学生、朋友、公民等。每一个角色都意味着一种责任。我们每个人都要明确自己的角色和责任，勇于承担责任。\n（4）我们应该向王同学学习，积极参与社会公益活动，服务社会，奉献社会。"},{"id":"g2_daofa_u015_ex01","knowledge_id":"g2_daofa_u015","question":"【选择题】\"做负责任的公民\"主要体现了什么道理？\nA. 承担责任是个人成长和实现价值的必然要求\nB. 可以完全忽视社会规则\nC. 个人不需要承担任何责任\nD. 社会生活与个人无关","answer":"正确答案：A\n解析：只有对自己负责的人，才能承担起对他人、社会和国家的责任。负责任是一个人的立身之本，是成就事业的基石。我们要增强责任意识，养成负责任的行为习惯。"},{"id":"g2_daofa_u015_ex02","knowledge_id":"g2_daofa_u015","question":"【选择题】下列对\"做负责任的公民\"的理解，错误的是：\nA. 承担责任是个人成长和实现价值的必然要求\nB. 这是现代公民应有的素质\nC. 与日常生活没有关系\nD. 有助于社会的和谐发展","answer":"正确答案：C\n解析：只有对自己负责的人，才能承担起对他人、社会和国家的责任。负责任是一个人的立身之本，是成就事业的基石。我们要增强责任意识，养成负责任的行为习惯。\n选项C是错误的，做负责任的公民与我们的日常生活密切相关。"},{"id":"g2_daofa_u015_ex03","knowledge_id":"g2_daofa_u015","question":"【选择题】在学习\"做负责任的公民\"时，我们应该：\nA. 承担责任是个人成长和实现价值的必然要求\nB. 不以为然，觉得无所谓\nC. 只在考试时关注\nD. 认为这只是理论，没有实际意义","answer":"正确答案：A\n解析：只有对自己负责的人，才能承担起对他人、社会和国家的责任。负责任是一个人的立身之本，是成就事业的基石。我们要增强责任意识，养成负责任的行为习惯。"},{"id":"g2_daofa_u015_ex04","knowledge_id":"g2_daofa_u015","question":"【判断题】做负责任的公民与我们的生活无关，可以不必在意。（）","answer":"错误\n解析：只有对自己负责的人，才能承担起对他人、社会和国家的责任。负责任是一个人的立身之本，是成就事业的基石。我们要增强责任意识，养成负责任的行为习惯。"},{"id":"g2_daofa_u015_ex05","knowledge_id":"g2_daofa_u015","question":"【判断题】承担责任是个人成长和实现价值的必然要求。（）","answer":"正确\n解析：只有对自己负责的人，才能承担起对他人、社会和国家的责任。负责任是一个人的立身之本，是成就事业的基石。我们要增强责任意识，养成负责任的行为习惯。"},{"id":"g2_daofa_u015_ex06","knowledge_id":"g2_daofa_u015","question":"【判断题】做负责任的公民与我们的生活无关，可以不必在意。（）","answer":"错误\n解析：只有对自己负责的人，才能承担起对他人、社会和国家的责任。负责任是一个人的立身之本，是成就事业的基石。我们要增强责任意识，养成负责任的行为习惯。"},{"id":"g2_daofa_u015_ex07","knowledge_id":"g2_daofa_u015","question":"【简答题】为什么说做负责任的公民是每个公民都应该具备的素质？","answer":"承担责任是个人成长和实现价值的必然要求\n\n只有对自己负责的人，才能承担起对他人、社会和国家的责任。负责任是一个人的立身之本，是成就事业的基石。我们要增强责任意识，养成负责任的行为习惯。\n\n这关系到个人的成长进步，也关系到社会的和谐发展。"},{"id":"g2_daofa_u015_ex08","knowledge_id":"g2_daofa_u015","question":"【简答题】请简要说明什么是做负责任的公民。","answer":"承担责任是个人成长和实现价值的必然要求\n\n只有对自己负责的人，才能承担起对他人、社会和国家的责任。负责任是一个人的立身之本，是成就事业的基石。我们要增强责任意识，养成负责任的行为习惯。"},{"id":"g2_daofa_u015_ex09","knowledge_id":"g2_daofa_u015","question":"【案例分析题】材料：某校初二学生在社会实践中发现，部分同学在公共场所大声喧哗、不遵守秩序。\n请运用\"做负责任的公民\"的知识，分析说明我们应该怎样做。","answer":"（1）承担责任是个人成长和实现价值的必然要求\n（2）只有对自己负责的人，才能承担起对他人、社会和国家的责任。负责任是一个人的立身之本，是成就事业的基石。我们要增强责任意识，养成负责任的行为习惯。\n（3）作为中学生，我们应该从身边小事做起，自觉践行做负责任的公民，为构建和谐社会贡献力量。"},{"id":"g2_daofa_u015_ex10","knowledge_id":"g2_daofa_u015","question":"【案例分析题】材料：王同学在小区里主动捡拾垃圾，并带动其他居民一起保护环境。\n请结合\"做负责任的公民\"的知识，评价王同学的行为。","answer":"（1）王同学的行为体现了做负责任的公民。\n（2）承担责任是个人成长和实现价值的必然要求\n（3）只有对自己负责的人，才能承担起对他人、社会和国家的责任。负责任是一个人的立身之本，是成就事业的基石。我们要增强责任意识，养成负责任的行为习惯。\n（4）我们应该向王同学学习，积极参与社会公益活动，服务社会，奉献社会。"},{"id":"g2_daofa_u016_ex01","knowledge_id":"g2_daofa_u016","question":"【选择题】\"关爱他人的意义\"主要体现了什么道理？\nA. 关爱他人是人际和谐的润滑剂，是社会和谐的基础\nB. 可以完全忽视社会规则\nC. 个人不需要承担任何责任\nD. 社会生活与个人无关","answer":"正确答案：A\n解析：关爱他人就是关心、爱护他人，急他人之所急，想他人之所想。关爱传递着美好情感，是维系友好关系的桥梁。关爱他人能够使世界变得更美好，让生活充满阳光。"},{"id":"g2_daofa_u016_ex02","knowledge_id":"g2_daofa_u016","question":"【选择题】下列对\"关爱他人的意义\"的理解，错误的是：\nA. 关爱他人是人际和谐的润滑剂，是社会和谐的基础\nB. 这是现代公民应有的素质\nC. 与日常生活没有关系\nD. 有助于社会的和谐发展","answer":"正确答案：C\n解析：关爱他人就是关心、爱护他人，急他人之所急，想他人之所想。关爱传递着美好情感，是维系友好关系的桥梁。关爱他人能够使世界变得更美好，让生活充满阳光。\n选项C是错误的，关爱他人的意义与我们的日常生活密切相关。"},{"id":"g2_daofa_u016_ex03","knowledge_id":"g2_daofa_u016","question":"【选择题】在学习\"关爱他人的意义\"时，我们应该：\nA. 关爱他人是人际和谐的润滑剂，是社会和谐的基础\nB. 不以为然，觉得无所谓\nC. 只在考试时关注\nD. 认为这只是理论，没有实际意义","answer":"正确答案：A\n解析：关爱他人就是关心、爱护他人，急他人之所急，想他人之所想。关爱传递着美好情感，是维系友好关系的桥梁。关爱他人能够使世界变得更美好，让生活充满阳光。"},{"id":"g2_daofa_u016_ex04","knowledge_id":"g2_daofa_u016","question":"【判断题】关爱他人的意义与我们的生活无关，可以不必在意。（）","answer":"错误\n解析：关爱他人就是关心、爱护他人，急他人之所急，想他人之所想。关爱传递着美好情感，是维系友好关系的桥梁。关爱他人能够使世界变得更美好，让生活充满阳光。"},{"id":"g2_daofa_u016_ex05","knowledge_id":"g2_daofa_u016","question":"【判断题】关爱他人是人际和谐的润滑剂，是社会和谐的基础。（）","answer":"正确\n解析：关爱他人就是关心、爱护他人，急他人之所急，想他人之所想。关爱传递着美好情感，是维系友好关系的桥梁。关爱他人能够使世界变得更美好，让生活充满阳光。"},{"id":"g2_daofa_u016_ex06","knowledge_id":"g2_daofa_u016","question":"【判断题】关爱他人的意义与我们的生活无关，可以不必在意。（）","answer":"错误\n解析：关爱他人就是关心、爱护他人，急他人之所急，想他人之所想。关爱传递着美好情感，是维系友好关系的桥梁。关爱他人能够使世界变得更美好，让生活充满阳光。"},{"id":"g2_daofa_u016_ex07","knowledge_id":"g2_daofa_u016","question":"【简答题】为什么说关爱他人的意义是每个公民都应该具备的素质？","answer":"关爱他人是人际和谐的润滑剂，是社会和谐的基础\n\n关爱他人就是关心、爱护他人，急他人之所急，想他人之所想。关爱传递着美好情感，是维系友好关系的桥梁。关爱他人能够使世界变得更美好，让生活充满阳光。\n\n这关系到个人的成长进步，也关系到社会的和谐发展。"},{"id":"g2_daofa_u016_ex08","knowledge_id":"g2_daofa_u016","question":"【简答题】请简要说明什么是关爱他人的意义。","answer":"关爱他人是人际和谐的润滑剂，是社会和谐的基础\n\n关爱他人就是关心、爱护他人，急他人之所急，想他人之所想。关爱传递着美好情感，是维系友好关系的桥梁。关爱他人能够使世界变得更美好，让生活充满阳光。"},{"id":"g2_daofa_u016_ex09","knowledge_id":"g2_daofa_u016","question":"【案例分析题】材料：某校初二学生在社会实践中发现，部分同学在公共场所大声喧哗、不遵守秩序。\n请运用\"关爱他人的意义\"的知识，分析说明我们应该怎样做。","answer":"（1）关爱他人是人际和谐的润滑剂，是社会和谐的基础\n（2）关爱他人就是关心、爱护他人，急他人之所急，想他人之所想。关爱传递着美好情感，是维系友好关系的桥梁。关爱他人能够使世界变得更美好，让生活充满阳光。\n（3）作为中学生，我们应该从身边小事做起，自觉践行关爱他人的意义，为构建和谐社会 ":"g2_daofa_u020_ex10","knowledge_id":"g2_daofa_u020","question":"【案例分析题】材料：王同学在小区里主动捡拾垃圾，并带动其他居民一起保护环境。\n请结合\"国家利益的含义\"的知识，评价王同学的行为。","answer":"（1）王同学的行为体现了国家利益的含义。\n（2）国家利益是一个主权国家在国际社会中生存和发展需求的总和\n（3）国家利益包括国家安全利益、政治利益、经济利益、文化利益等。国家利益关系民族生存、国家兴亡。维护国家利益是每个公民的神圣职责和基本义务。\n（4）我们应该向王同学学习，积极参与社会公益活动，服务社会，奉献社会。"},{"id":"g2_daofa_u021_ex01","knowledge_id":"g2_daofa_u021","question":"【选择题】\"国家利益与人民利益的关系\"主要体现了什么道理？\nA. 国家利益与人民利益在根本上是一致的，二者相互依存、相互促进\nB. 可以完全忽视社会规则\nC. 个人不需要承担任何责任\nD. 社会生活与个人无关","answer":"正确答案：A\n解析：国家利益是人民利益的集中体现，维护国家利益是实现人民利益的前提和保障。在当代中国，国家利益与人民利益高度统一，共同构成中华民族的根本利益。"},{"id":"g2_daofa_u021_ex02","knowledge_id":"g2_daofa_u021","question":"【选择题】下列对\"国家利益与人民利益的关系\"的理解，错误的是：\nA. 国家利益与人民利益在根本上是一致的，二者相互依存、相互促进\nB. 这是现代公民应有的素质\nC. 与日常生活没有关系\nD. 有助于社会的和谐发展","answer":"正确答案：C\n解析：国家利益是人民利益的集中体现，维护国家利益是实现人民利益的前提和保障。在当代中国，国家利益与人民利益高度统一，共同构成中华民族的根本利益。\n选项C是错误的，国家利益与人民利益的关系与我们的日常生活密切相关。"},{"id":"g2_daofa_u021_ex03","knowledge_id":"g2_daofa_u021","question":"【选择题】在学习\"国家利益与人民利益的关系\"时，我们应该：\nA. 国家利益与人民利益在根本上是一致的，二者相互依存、相互促进\nB. 不以为然，觉得无所谓\nC. 只在考试时关注\nD. 认为这只是理论，没有实际意义","answer":"正确答案：A\n解析：国家利益是人民利益的集中体现，维护国家利益是实现人民利益的前提和保障。在当代中国，国家利益与人民利益高度统一，共同构成中华民族的根本利益。"},{"id":"g2_daofa_u021_ex04","knowledge_id":"g2_daofa_u021","question":"【判断题】国家利益与人民利益的关系与我们的生活无关，可以不必在意。（）","answer":"错误\n解析：国家利益是人民利益的集中体现，维护国家利益是实现人民利益的前提和保障。在当代中国，国家利益与人民利益高度统一，共同构成中华民族的根本利益。"},{"id":"g2_daofa_u021_ex05","knowledge_id":"g2_daofa_u021","question":"【判断题】国家利益与人民利益在根本上是一致的，二者相互依存、相互促进。（）","answer":"正确\n解析：国家利益是人民利益的集中体现，维护国家利益是实现人民利益的前提和保障。在当代中国，国家利益与人民利益高度统一，共同构成中华民族的根本利益。"},{"id":"g2_daofa_u021_ex06","knowledge_id":"g2_daofa_u021","question":"【判断题】国家利益与人民利益的关系与我们的生活无关，可以不必在意。（）","answer":"错误\n解析：国家利益是人民利益的集中体现，维护国家利益是实现人民利益的前提和保障。在当代中国，国家利益与人民利益高度统一，共同构成中华民族的根本利益。"},{"id":"g2_daofa_u021_ex07","knowledge_id":"g2_daofa_u021","question":"【简答题】为什么说国家利益与人民利益的关系是每个公民都应该具备的素质？","answer":"国家利益与人民利益在根本上是一致的，二者相互依存、相互促进\n\n国家利益是人民利益的集中体现，维护国家利益是实现人民利益的前提和保障。在当代中国，国家利益与人民利益高度统一，共同构成中华民族的根本利益。\n\n这关系到个人的成长进步，也关系到社会的和谐发展。"},{"id":"g2_daofa_u021_ex08","knowledge_id":"g2_daofa_u021","question":"【简答题】请简要说明什么是国家利益与人民利益的关系。","answer":"国家利益与人民利益在根本上是一致的，二者相互依存、相互促进\n\n国家利益是人民利益的集中体现，维护国家利益是实现人民利益的前提和保障。在当代中国，国家利益与人民利益高度统一，共同构成中华民族的根本利益。"},{"id":"g2_daofa_u021_ex09","knowledge_id":"g2_daofa_u021","question":"【案例分析题】材料：某校初二学生在社会实践中发现，部分同学在公共场所大声喧哗、不遵守秩序。\n请运用\"国家利益与人民利益的关系\"的知识，分析说明我们应该怎样做。","answer":"（1）国家利益与人民利益在根本上是一致的，二者相互依存、相互促进\n（2）国家利益是人民利益的集中体现，维护国家利益是实现人民利益的前提和保障。在当代中国，国家利益与人民利益高度统一，共同构成中华民族的根本利益。\n（3）作为中学生，我们应该从身边小事做起，自觉践行国家利益与人民利益的关系，为构建和谐社会贡献力量。"},{"id":"g2_daofa_u021_ex10","knowledge_id":"g2_daofa_u021","question":"【案例分析题】材料：王同学在小区里主动捡拾垃圾，并带动其他居民一起保护环境。\n请结合\"国家利益与人民利益的关系\"的知识，评价王同学的行为。","answer":"（1）王同学的行为体现了国家利益与人民利益的关系。\n（2）国家利益与人民利益在根本上是一致的，二者相互依存、相互促进\n（3）国家利益是人民利益的集中体现，维护国家利益是实现人民利益的前提和保障。在当代中国，国家利益与人民利益高度统一，共同构成中华民族的根本利益。\n（4）我们应该向王同学学习，积极参与社会公益活动，服务社会，奉献社会。"},{"id":"g2_daofa_u022_ex01","knowledge_id":"g2_daofa_u022","question":"【选择题】\"维护国家安全的重要性\"主要体现了什么道理？\nA. 国家安全是国家生存与发展的重要保障，是人民幸福的前提\nB. 可以完全忽视社会规则\nC. 个人不需要承担任何责任\nD. 社会生活与个人无关","answer":"正确答案：A\n解析：国家安全包括政治安全、国土安全、军事安全、经济安全、文化安全、社会安全等。维护国家安全是每个公民的基本义务。我们要增强国家安全意识，自觉维护国家安全。"},{"id":"g2_daofa_u022_ex02","knowledge_id":"g2_daofa_u022","question":"【选择题】下列对\"维护国家安全的重要性\"的理解，错误的是：\nA. 国家安全是国家生存与发展的重要保障，是人民幸福的前提\nB. 这是现代公民应有的素质\nC. 与日常生活没有关系\nD. 有助于社会的和谐发展","answer":"正确答案：C\n解析：国家安全包括政治安全、国土安全、军事安全、经济安全、文化安全、社会安全等。维护国家安全是每个公民的基本义务。我们要增强国家安全意识，自觉维护国家安全。\n选项C是错误的，维护国家安全的重要性与我们的日常生活密切相关。"},{"id":"g2_daofa_u022_ex03","knowledge_id":"g2_daofa_u022","question":"【选择题】在学习\"维护国家安全的重要性\"时，我们应该：\nA. 国家安全是国家生存与发展的重要保障，是人民幸福的前提\nB. 不以为然，觉得无所谓\nC. 只在考试时关注\nD. 认为这只是理论，没有实际意义","answer":"正确答案：A\n解析：国家安全包括政治安全、国土安全、军事安全、经济安全、文化安全、社会安全等。维护国家安全是每个公民的基本义务。我们要增强国家安全意识，自觉维护国家安全。"},{"id":"g2_daofa_u022_ex04","knowledge_id":"g2_daofa_u022","question":"【判断题】维护国家安全的重要性与我们的生活无关，可以不必在意。（）","answer":"错误\n解析：国家安全包括政治安全、国土安全、军事安全、经济安全、文化安全、社会安全等。维护国家安全是每个公民的基本义务。我们要增强国家安全意识，自觉维护国家安全。"},{"id":"g2_daofa_u022_ex05","knowledge_id":"g2_daofa_u022"," wer":"（1）维护国家荣誉和民族尊严是每个公民的神圣职责\n（2）国家荣誉和民族尊严是国家的宝贵财富，关系到中华民族的形象。我们要自觉维护国家荣誉和民族尊严，同一切损害国家荣誉和民族尊严的行为作斗争。\n（3）作为中学生，我们应该从身边小事做起，自觉践行维护国家荣誉和民族尊严，为构建和谐社会贡献力量。"},{"id":"g2_daofa_u024_ex10","knowledge_id":"g2_daofa_u024","question":"【案例分析题】材料：王同学在小区里主动捡拾垃圾，并带动其他居民一起保护环境。\n请结合\"维护国家荣誉和民族尊严\"的知识，评价王同学的行为。","answer":"（1）王同学的行为体现了维护国家荣誉和民族尊严。\n（2）维护国家荣誉和民族尊严是每个公民的神圣职责\n（3）国家荣誉和民族尊严是国家的宝贵财富，关系到中华民族的形象。我们要自觉维护国家荣誉和民族尊严，同一切损害国家荣誉和民族尊严的行为作斗争。\n（4）我们应该向王同学学习，积极参与社会公益活动，服务社会，奉献社会。"},{"id":"g2_daofa_u025_ex01","knowledge_id":"g2_daofa_u025","question":"【选择题】\"法治的含义\"主要体现了什么道理？\nA. 法治是依法对国家和社会事务进行治理的基本方式\nB. 可以完全忽视社会规则\nC. 个人不需要承担任何责任\nD. 社会生活与个人无关","answer":"正确答案：A\n解析：法治强调的是依法治国、依法办事的治理方式。法治要求法律成为国家治理的最高准则，任何组织和个人都不能凌驾于法律之上。法治是现代文明的重要标志。"},{"id":"g2_daofa_u025_ex02","knowledge_id":"g2_daofa_u025","question":"【选择题】下列对\"法治的含义\"的理解，错误的是：\nA. 法治是依法对国家和社会事务进行治理的基本方式\nB. 这是现代公民应有的素质\nC. 与日常生活没有关系\nD. 有助于社会的和谐发展","answer":"正确答案：C\n解析：法治强调的是依法治国、依法办事的治理方式。法治要求法律成为国家治理的最高准则，任何组织和个人都不能凌驾于法律之上。法治是现代文明的重要标志。\n选项C是错误的，法治的含义与我们的日常生活密切相关。"},{"id":"g2_daofa_u025_ex03","knowledge_id":"g2_daofa_u025","question":"【选择题】在学习\"法治的含义\"时，我们应该：\nA. 法治是依法对国家和社会事务进行治理的基本方式\nB. 不以为然，觉得无所谓\nC. 只在考试时关注\nD. 认为这只是理论，没有实际意义","answer":"正确答案：A\n解析：法治强调的是依法治国、依法办事的治理方式。法治要求法律成为国家治理的最高准则，任何组织和个人都不能凌驾于法律之上。法治是现代文明的重要标志。"},{"id":"g2_daofa_u025_ex04","knowledge_id":"g2_daofa_u025","question":"【判断题】法治的含义与我们的生活无关，可以不必在意。（）","answer":"错误\n解析：法治强调的是依法治国、依法办事的治理方式。法治要求法律成为国家治理的最高准则，任何组织和个人都不能凌驾于法律之上。法治是现代文明的重要标志。"},{"id":"g2_daofa_u025_ex05","knowledge_id":"g2_daofa_u025","question":"【判断题】法治是依法对国家和社会事务进行治理的基本方式。（）","answer":"正确\n解析：法治强调的是依法治国、依法办事的治理方式。法治要求法律成为国家治理的最高准则，任何组织和个人都不能凌驾于法律之上。法治是现代文明的重要标志。"},{"id":"g2_daofa_u025_ex06","knowledge_id":"g2_daofa_u025","question":"【判断题】法治的含义与我们的生活无关，可以不必在意。（）","answer":"错误\n解析：法治强调的是依法治国、依法办事的治理方式。法治要求法律成为国家治理的最高准则，任何组织和个人都不能凌驾于法律之上。法治是现代文明的重要标志。"},{"id":"g2_daofa_u025_ex07","knowledge_id":"g2_daofa_u025","question":"【简答题】为什么说法治的含义是每个公民都应该具备的素质？","answer":"法治是依法对国家和社会事务进行治理的基本方式\n\n法治强调的是依法治国、依法办事的治理方式。法治要求法律成为国家治理的最高准则，任何组织和个人都不能凌驾于法律之上。法治是现代文明的重要标志。\n\n这关系到个人的成长进步，也关系到社会的和谐发展。"},{"id":"g2_daofa_u025_ex08","knowledge_id":"g2_daofa_u025","question":"【简答题】请简要说明什么是法治的含义。","answer":"法治是依法对国家和社会事务进行治理的基本方式\n\n法治强调的是依法治国、依法办事的治理方式。法治要求法律成为国家治理的最高准则，任何组织和个人都不能凌驾于法律之上。法治是现代文明的重要标志。"},{"id":"g2_daofa_u025_ex09","knowledge_id":"g2_daofa_u025","question":"【案例分析题】材料：某校初二学生在社会实践中发现，部分同学在公共场所大声喧哗、不遵守秩序。\n请运用\"法治的含义\"的知识，分析说明我们应该怎样做。","answer":"（1）法治是依法对国家和社会事务进行治理的基本方式\n（2）法治强调的是依法治国、依法办事的治理方式。法治要求法律成为国家治理的最高准则，任何组织和个人都不能凌驾于法律之上。法治是现代文明的重要标志。\n（3）作为中学生，我们应该从身边小事做起，自觉践行法治的含义，为构建和谐社会贡献力量。"},{"id":"g2_daofa_u025_ex10","knowledge_id":"g2_daofa_u025","question":"【案例分析题】材料：王同学在小区里主动捡拾垃圾，并带动其他居民一起保护环境。\n请结合\"法治的含义\"的知识，评价王同学的行为。","answer":"（1）王同学的行为体现了法治的含义。\n（2）法治是依法对国家和社会事务进行治理的基本方式\n（3）法治强调的是依法治国、依法办事的治理方式。法治要求法律成为国家治理的最高准则，任何组织和个人都不能凌驾于法律之上。法治是现代文明的重要标志。\n（4）我们应该向王同学学习，积极参与社会公益活动，服务社会，奉献社会。"},{"id":"g2_daofa_u026_ex01","knowledge_id":"g2_daofa_u026","question":"【选择题】\"法治的要求\"主要体现了什么道理？\nA. 法治要求科学立法、严格执法、公正司法、全民守法\nB. 可以完全忽视社会规则\nC. 个人不需要承担任何责任\nD. 社会生活与个人无关","answer":"正确答案：A\n解析：科学立法是法治的前提，严格执法是法治的关键，公正司法是法治的保障，全民守法是法治的基础。这四个方面相互联系、相互促进，共同推进法治中国建设。"},{"id":"g2_daofa_u026_ex02","knowledge_id":"g2_daofa_u026","question":"【选择题】下列对\"法治的要求\"的理解，错误的是：\nA. 法治要求科学立法、严格执法、公正司法、全民守法\nB. 这是现代公民应有的素质\nC. 与日常生活没有关系\nD. 有助于社会的和谐发展","answer":"正确答案：C\n解析：科学立法是法治的前提，严格执法是法治的关键，公正司法是法治的保障，全民守法是法治的基础。这四个方面相互联系、相互促进，共同推进法治中国建设。\n选项C是错误的，法治的要求与我们的日常生活密切相关。"},{"id":"g2_daofa_u026_ex03","knowledge_id":"g2_daofa_u026","question":"【选择题】在学习\"法治的要求\"时，我们应该：\nA. 法治要求科学立法、严格执法、公正司法、全民守法\nB. 不以为然，觉得无所谓\nC. 只在考试时关注\nD. 认为这只是理论，没有实际意义","answer":"正确答案：A\n解析：科学立法是法治的前提，严格执法是法治的关键，公正司法是法治的保障，全民守法是法治的基础。这四个方面相互联系、相互促进，共同推进法治中国建设。"},{"id":"g2_daofa_u026_ex04","knowledge_id":"g2_daofa_u026","question":"【判断题】法治的要求与我们的生活无关，可以不必在意。（）","answer":"错误\n解析：科学立法是法治的前提，严格执法是法治的关键，公正司法是法治的保障，全民守法是法治的基础。这四个方面相互联系、相互促进，共同推进法治中国建设。"},{"id":"g2_daofa_u026_ex05","knowledge_id":"g2_daofa_u026","question":"【判断题】法治要求科学立法、严格执法、公正司法、全民守法。（）","answer":"正确\n解析：科学立法是法治的前提，严格执法是法治的关键，公正司法是法治的保障，全民守法是法治的基础。这四个方面相互联系、相互促进，共同推进法治中国建设。"},{"id":"g2_daofa_u026_ex06","knowledge_id":"g2_daofa_u026","question":"【判断题】法治的要求与我们的生活无关，可以不必在意。（）","answer":"错误\n解析：科学立法是法治的前提，严格执法是法治的关键，公正司法是法治的保障，全民守法是法治的基础。这四个方面相互联系、相互促进，共同推进法治中国建设。"},{"id":"g2_daofa_u026_ex07","knowledge_id":"g2_daofa_u026","question":"【简答题】为什么说法治的要求是每个公民都应该具备的素质？","answer":"法治要求科学立法、严格执法、公正司法、全民守法\n\n科学立法是法治的前提，严格执法是法治的关键，公正司法是法治的保障，全民守法是法治的基础。这四个方面相互联系、相互促进，共同推进法治中国建设。\n\n这关系到个人的成长进步，也关系到社会的和谐发展。"},{"id":"g2_daofa_u026_ex08","knowledge_id":"g2_daofa_u026","question":"【简答题】请简要说明什么是法治的要求。","answer":"法治要求科学立法、严格执法、公正司法、全民守法\n\n科学立法是法治的前提，严格执法是法治的关键，公正司法是法治的保障，全民守法是法治的基础。这四个方面相互联系、相互促进，共同推进法治中国建设。"},{"id":"g2_daofa_u026_ex09","knowledge_id":"g2_daofa_u026","question":"【案例分析题】材料：某校初二学生在社会实践中发现，部分同学在公共场所大声喧哗、不遵守秩序。\n请运用\"法治的要求\"的知识，分析说明我们应该怎样做。","answer":"（1）法治要求科学立法、严格执法、公正司法、全民守法\n（2）科学立法是法治的前提，严格执法是法治的关键，公正司法是法治的保障，全民守法是法治的基础。这四个方面相互联系、相互促进，共同推进法治中国建设。\n（3）作为中学生，我们应该从身边小事做起，自觉践行法治的要求，为构建和谐社会贡献力量。"},{"id":"g2_daofa_u026_ex10","knowledge_id":"g2_daofa_u026","question":"【案例分析题】材料：王同学在小区里主动捡拾垃圾，并带动其他居民一起保护环境。\n请结合\"法治的要求\"的知识，评价王同学的行为。","answer":"（1）王同学的行为体现了法治的要求。\n（2）法治要求科学立法、严格执法、公正司法、全民守法\n（3）科学立法是法治的前提，严格执法是法治的关键，公正司法是法治的保障，全民守法是法治的基础。这四个方面相互联系、相互促进，共同推进法治中国建设。\n（4）我们应该向王同学学习，积极参与社会公益活动，服务社会，奉献社会。"},{"id":"g2_daofa_u027_ex01","knowledge_id":"g2_daofa_u027","question":"【选择题】\"树立法治观念的重要性\"主要体现了什么道理？\nA. 法治观念是现代公民必须具备的基本素质\nB. 可以完全忽视社会规则\nC. 个人不需要承担任何责任\nD. 社会生活与个人无关","answer":"正确答案：A\n解析：树立法治观念，就是要尊重法律、遵守法律、运用法律。法治观念包括规则意识、程序意识、权利义务意识等。只有树立法治观念，才能更好地适应法治社会的要求。"},{"id":"g2_daofa_u027_ex02","knowledge_id":"g2_daofa_u027","question":"【选择题】下列对\"树立法治观念的重要性\"的理解，错误的是：\nA. 法治观念是现代公民必须具备的基本素质\nB. 这是现代公民应有的素质\nC. 与日常生活没有关系\nD. 有助于社会的和谐发展","answer":"正确答案：C\n解析：树立法治观念，就是要尊重法律、遵守法律、运用法律。法治观念包括规则意识、程序意识、权利义务意识等。只有树立法治观念，才能更好地适应法治社会的要求。\n选项C是错误的，树立法治观念的重要性与我们的日常生活密切相关。"},{"id":"g2_daofa_u027_ex03","knowledge_id":"g2_daofa_u027","question":"【选择题】在学习             },
            addWrongBook(item) {
                const key = this.STORAGE_KEY_PREFIX + item.grade + '_' + item.subject;

                const exists = wrongBook.some(w => w.question === item.question);

            }
        };

        // 学习进度管理器
        const ProgressManager = {
            STORAGE_KEY: 'study_progress',
            
            getProgress() {
                try {
                    return JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
                } catch(e) {
                    return {};
                }
            },
            
            saveProgress(progress) {
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(progress));
            },
            
            recordStudy(grade, subject, subjectName, semester, semesterName, knowledgeId, knowledgeName) {
                const progress = this.getProgress();
                const now = new Date().toISOString();
                const today = new Date().toISOString().split('T')[0];
                
                if (!progress.learnedKnowledge) progress.learnedKnowledge = {};
                if (!progress.dailyStats) progress.dailyStats = {};
                if (!progress.dailyStats[today]) {
                    progress.dailyStats[today] = { learnedCount: 0, subjects: [] };
                }
                
                const isNew = !progress.learnedKnowledge[knowledgeId];
                progress.learnedKnowledge[knowledgeId] = { learnedAt: now };
                
                if (isNew) {
                    progress.dailyStats[today].learnedCount++;
                    if (!progress.dailyStats[today].subjects.includes(subject)) {
                        progress.dailyStats[today].subjects.push(subject);
                    }
                }
                
                progress.lastStudy = {
                    grade, subject, subjectName, semester, semesterName,
                    knowledgeId, knowledgeName, timestamp: now
                };
                
                this.saveProgress(progress);
            },
            
            isLearned(knowledgeId) {
                const progress = this.getProgress();
                return !!(progress.learnedKnowledge && progress.learnedKnowledge[knowledgeId]);

            getLastStudy() {
                const progress = this.getProgress();
                return progress.lastStudy || null;

                const learned = Object.keys(progress.learnedKnowledge).filter(k => k.startsWith(prefix)).length;
                const total = DATA_KNOWLEDGE.length;
                const percent = total > 0 ? Math.round((learned / total) * 100) : 0;
                return { learned, total, percent };
            },
            
            clearSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                const prefix = grade + '_' + subject + '_';
                
                if (progress.learnedKnowledge) {
                    Object.keys(progress.learnedKnowledge).forEach(k => {
                        if (k.startsWith(prefix)) {
                            delete progress.learnedKnowledge[k];
                        }
                    });
                }
                
                if (progress.lastStudy && progress.lastStudy.grade === grade && progress.lastStudy.subject === subject) {
                    delete progress.lastStudy;
                }
                
                this.saveProgress(progress);
                return true;
            }
        };

        // URL参数解析
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                grade: 'g2',
                subject: 'daofa',
                semester: params.get('semester') || 'upper'
            };
        }

        const gradeNames = {'g1':'初一','g2':'初二','g3':'初三'};
        const subjectNames = {'daofa':'道德与法治'};
        const semesterNames = {'upper':'上册','lower':'下册'};

        let currentParams = getUrlParams();
        let knowledgeList = [];
        let expandedIds = new Set();
        let currentExample = null;

        const pageTitle = document.getElementById('page-title');
        const pageSubtitle = document.getElementById('page-subtitle');
        const knowledgeListEl = document.getElementById('knowledge-list');
        const emptyStateEl = document.getElementById('empty-state');
        const searchResultsInfo = document.getElementById('search-results-info');
        const searchCountEl = document.getElementById('search-count');
        const searchInput = document.getElementById('search-input');

        function initPage() {
            const {grade, subject, semester} = currentParams;
            pageTitle.textContent = gradeNames[grade] + ' · ' + subjectNames[subject] + ' · ' + semesterNames[semester];
            loadKnowledge();
            updateProgressStat();
            
            const hash = window.location.hash.replace('#', '');
            if (hash && knowledgeList.some(k => k.id === hash)) {
                setTimeout(() => {
                    toggleExpand(hash);
                    const card = document.querySelector('[data-id="' + hash + '"]');
                    if (card) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
        }

        function updateProgressStat() {
            const {grade, subject} = currentParams;
            const learnedInSemester = knowledgeList.filter(k => ProgressManager.isLearned(k.id)).length;
            document.getElementById('progress-learned').textContent = learnedInSemester;
            document.getElementById('progress-total').textContent = knowledgeList.length;
        }

        function loadKnowledge() {
            const {grade, subject, semester} = currentParams;
            knowledgeList = DATA_KNOWLEDGE.filter(k => {
                return k.semester === semester;
            });
            renderKnowledgeList();
        }

        function renderKnowledgeList(items = knowledgeList) {
            if (items.length === 0) {
                knowledgeListEl.innerHTML = '';
                emptyStateEl.classList.remove('hidden');
                return;
            }
            emptyStateEl.classList.add('hidden');
            knowledgeListEl.innerHTML = items.map(item => {
                const isExpanded = expandedIds.has(item.id);
                const isLearned = ProgressManager.isLearned(item.id);
                return '<div class="card knowledge-card ' + (isLearned ? 'learned' : '') + '" data-id="' + item.id + '">' +
                    '<div class="knowledge-header p-4 flex items-center justify-between" onclick="toggleExpand(\'' + item.id + '\')">' +
                        '<div class="flex items-center gap-3 flex-1 min-w-0">' +
                            '<div class="expand-icon ' + (isExpanded ? 'expanded' : 'collapsed') + '">' + (isExpanded ? '−' : '+') + '</div>' +
                            '<div class="flex-1 min-w-0">' +
                                '<h3 class="text-lg font-semibold text-gray-800 flex items-center gap-2">' + escapeHtml(item.name) + (isLearned ? '<span class="text-green-500 text-sm">✓ 已学习</span>' : '') + '</h3>' +
                                '<p class="text-xs text-gray-500 mt-1">' + escapeHtml(item.chapter) + '</p>' +
                            '</div>' +
                        '</div>' +
                        (HAS_EXAMPLES ? '<button class="btn btn-secondary text-sm px-3 py-1" onclick="event.stopPropagation(); showExample(\'' + item.id + '\', \'' + escapeHtml(item.name) + '\')">例题</button>' : '') +
                    '</div>' +
                    '<div id="content-' + item.id + '" class="px-6 pb-4 ' + (isExpanded ? '' : 'hidden') + '">' +
                        (item.formula ? '<div class="mb-4"><h4 class="text-sm font-medium text-gray-500 mb-2">📐 公式</h4><p class="formula-box text-gray-800 text-lg bg-gray-50 p-3 rounded-lg">' + escapeHtml(item.formula) + '</p></div>' : '') +
                        (item.explanation ? '<div><h4 class="text-sm font-medium text-gray-500 mb-2">📝 解释</h4><p class="text-gray-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(item.explanation) + '</p></div>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function toggleExpand(id) {
            const isNewLearn = !expandedIds.has(id) && !ProgressManager.isLearned(id);
            if (expandedIds.has(id)) {
                expandedIds.delete(id);
            } else {
                expandedIds.add(id);
                const {grade, subject, semester} = currentParams;
                const item = knowledgeList.find(k => k.id === id);
                if (item) {
                    ProgressManager.recordStudy(
                        grade, subject, subjectNames[subject],
                        semester, semesterNames[semester],
                        id, item.name
                    );
                }
            }
            const card = document.querySelector('[data-id="' + id + '"]');
            const content = document.getElementById('content-' + id);
            const icon = card.querySelector('.expand-icon');
            const header = card.querySelector('.knowledge-header');
            const title = card.querySelector('h3');
            if (expandedIds.has(id)) {
                content.classList.remove('hidden');
                icon.classList.remove('collapsed');
                icon.classList.add('expanded');
                icon.textContent = '−';
                header.classList.add('expanded');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('expanded');
                icon.classList.add('collapsed');
                icon.textContent = '+';
                header.classList.remove('expanded');
            }
            if (isNewLearn) {
                card.classList.add('learned');
                if (!title.querySelector('.text-green-500')) {
                    title.innerHTML += '<span class="text-green-500 text-sm">✓ 已学习</span>';
                }
                updateProgressStat();
            }
        }

        function expandAll() {
            knowledgeList.forEach(item => expandedIds.add(item.id));
            renderKnowledgeList();
        }

        function collapseAll() {
            expandedIds.clear();
            renderKnowledgeList();
        }

        function searchKnowledge(keyword, list) {
            if (!keyword) return [];
            const lower = keyword.toLowerCase();
            return list.filter(k =>
                k.name.toLowerCase().includes(lower) ||
                k.chapter.toLowerCase().includes(lower)
            );
        }

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                searchResultsInfo.classList.add('hidden');
                renderKnowledgeList();
                return;
            }
            const results = searchKnowledge(keyword, knowledgeList);
            searchCountEl.textContent = results.length;
            searchResultsInfo.classList.remove('hidden');
            renderKnowledgeList(results);
        }

        function showExample(knowledgeId, knowledgeName) {
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === knowledgeId);
            if (examples.length === 0) {
                alert('暂无例题');
                return;
            }
            const example = examples[Math.floor(Math.random() * examples.length)];
            currentExample = {...example, knowledgeId, knowledgeName, ...currentParams};
            document.getElementById('example-knowledge-name').textContent = knowledgeName;
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
            document.getElementById('example-modal').classList.remove('hidden');
        }

        function nextExample() {
            if (!currentExample) return;
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === currentExample.knowledgeId);
            const otherExamples = examples.filter(e => e !== currentExample);
            if (otherExamples.length === 0) {
                alert('没有更多例题了');
                return;
            }
            const example = otherExamples[Math.floor(Math.random() * otherExamples.length)];
            currentExample = {...example, knowledgeId: currentExample.knowledgeId, knowledgeName: currentExample.knowledgeName, ...currentParams};
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
        }

        function addToWrongBook() {
            if (!currentExample) return;
            const item = {
                knowledgeId: currentExample.knowledgeId,
                knowledgeName: currentExample.knowledgeName,
                question: currentExample.question,
                answer: currentExample.answer,
                grade: currentParams.grade,
                subject: currentParams.subject
            };
            if (WrongBookManager.addWrongBook(item)) {
                alert('已加入错题本！');
            } else {
                alert('该题目已在错题本中');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearProgress() {
            const {grade, subject} = currentParams;
            const subjectName = subjectNames[subject];
            var msg = '确定要清除【' + subjectName + '】科目的所有学习进度吗？';
            msg += '\n\n';
            msg += '此操作将清除该科目所有已学习标记，且不可恢复。';
            if (!confirm(msg)) {
                return;
            }
            ProgressManager.clearSubjectProgress(grade, subject);
            updateProgressStat();
            renderKnowledgeList();
            alert('学习进度已清除');
        }

        document.getElementById('btn-expand-all').addEventListener('click', expandAll);
        document.getElementById('btn-collapse-all').addEventListener('click', collapseAll);
        document.getElementById('btn-clear-progress').addEventListener('click', clearProgress);
        searchInput.addEventListener('keyup', e => { if (e.key === 'Enter') performSearch(); });
        searchInput.addEventListener('input', () => { if (!searchInput.value) { searchResultsInfo.classList.add('hidden'); renderKnowledgeList(); }});
        document.getElementById('close-example').addEventListener('click', () => document.getElementById('example-modal').classList.add('hidden'));
        document.getElementById('btn-show-answer').addEventListener('click', () => {
            document.getElementById('example-answer-section').classList.remove('hidden');
            document.getElementById('btn-show-answer').classList.add('hidden');
        });
        document.getElementById('btn-next-example').addEventListener('click', nextExample);
        document.getElementById('btn-add-wrong').addEventListener('click', addToWrongBook);
        document.getElementById('example-modal').addEventListener('click', e => { if (e.target.id === 'example-modal') document.getElementById('example-modal').classList.add('hidden'); });

        initPage();
    </script>
</body>
</html>
