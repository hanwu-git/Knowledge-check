    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"id":"g2_history_u001","chapter":"第一章 中国古代史（先秦时期）","name":"元谋人","formula":"距今约170万年","explanation":"元谋人是中国境内已知最早的人类，发现于云南省元谋县。其化石包括两枚门齿，代表了原始人类特征，表明中国是人类发源地之一。","semester":"upper"},{"id":"g2_history_u002","chapter":"第一章 中国古代史（先秦时期）","name":"北京人","formula":"距今约70万-20万年","explanation":"北京人遗址发现于北京西南周口店龙骨山，生活在黄河流域。北京人会使用火，会制造打制石器，处于旧石器时代，是早期人类的代表。","semester":"upper"},{"id":"g2_history_u003","chapter":"第一章 中国古代史（先秦时期）","name":"河姆渡原始居民","formula":"距今约7000年","explanation":"河姆渡遗址位于浙江余姚，发现了稻谷遗存，证明中国是世界上最早种植水稻的国家之一。还发现了干栏式建筑、水井等遗迹。","semester":"upper"},{"id":"g2_history_u004","chapter":"第一章 中国古代史（先秦时期）","name":"半坡原始居民","formula":"距今约6000年","explanation":"半坡遗址位于陕西西安，发现了粟的种植证据，表明黄河流域是粟作农业的重要起源地。半坡人居住半地穴式房屋，饲养猪狗等家畜。","semester":"upper"},{"id":"g2_history_u005","chapter":"第一章 中国古代史（先秦时期）","name":"禅让制","formula":"原始社会末期","explanation":"禅让制是原始社会末期民主推举部落联盟首领的制度。传说中的尧舜禹都是通过禅让方式传承首领位置，体现了公天下和选贤任能的思想。","semester":"upper"},{"id":"g2_history_u006","chapter":"第一章 中国古代史（先秦时期）","name":"夏朝建立","formula":"约公元前2070年","explanation":"禹建立夏朝，标志着中国进入奴隶社会。夏朝是中国历史上第一个朝代，实行王位世袭制，结束了禅让制，开创了家天下局面。","semester":"upper"},{"id":"g2_history_u007","chapter":"第一章 中国古代史（先秦时期）","name":"商朝青铜器","formula":"约公元前1600年-公元前1046年","explanation":"商朝是青铜文化的繁盛时期，代表作品有司母戊鼎和四羊方尊。青铜器铸造技术高超，种类繁多，体现了商朝高度发达的奴隶制文明。","semester":"upper"},{"id":"g2_history_u008","chapter":"第一章 中国古代史（先秦时期）","name":"分封制","formula":"西周时期","explanation":"分封制是西周实行的政治制度，周天子将土地和人民分封给诸侯，建立诸侯国。此制度巩固了周王室统治，但后来诸侯势力膨胀，为春秋战国时期诸侯割据埋下隐患。","semester":"upper"},{"id":"g2_history_u009","chapter":"第一章 中国古代史（先秦时期）","name":"春秋五霸","formula":"公元前770年-公元前476年","explanation":"春秋时期，齐桓公、晋文公、楚庄王、吴王阖闾、越王勾践先后称霸，史称春秋五霸。这一时期周王室衰微，诸侯争霸，礼崩乐坏。","semester":"upper"},{"id":"g2_history_u010","chapter":"第一章 中国古代史（先秦时期）","name":"战国七雄","formula":"公元前475年-公元前221年","explanation":"战国时期，齐、楚、燕、韩、赵、魏、秦七国并立，称为战国七雄。各国变法图强，战争频繁，最终秦统一六国，结束分裂局面。","semester":"upper"},{"id":"g2_history_u011","chapter":"第一章 中国古代史（先秦时期）","name":"商鞅变法","formula":"公元前356年","explanation":"商鞅在秦孝公支持下进行变法，主要内容包括废井田、开阡陌，奖励军功，推行县制等。变法使秦国逐渐强大，为后来统一六国奠定基础。","semester":"upper"},{"id":"g2_history_u012","chapter":"第一章 中国古代史（先秦时期）","name":"百家争鸣","formula":"春秋战国时期","explanation":"百家争鸣是春秋战国时期各学派思想的繁荣局面。主要学派有儒家（孔子、孟子）、道家（老子、庄子）、法家（韩非子）、墨家（墨子）等，对后世产生深远影响。","semester":"upper"},{"id":"g2_history_u013","chapter":"第二章 秦汉时期","name":"秦统一六国","formula":"公元前221年","explanation":"秦王嬴政先后灭掉韩、赵、魏、楚、燕、齐，建立秦朝，统一中国。秦朝统一度量衡、货币、文字，建立郡县制，开创了中国历史上大一统的局面。","semester":"upper"},{"id":"g2_history_u014","chapter":"第二章 秦汉时期","name":"秦始皇巩固统一措施","formula":"公元前221年-公元前210年","explanation":"秦始皇统一后，实行书同文、车同轨，统一度量衡和货币；推行郡县制；修筑万里长城；实行严酷法制。这些措施巩固了统一，但也激化了社会矛盾。","semester":"upper"},{"id":"g2_history_u015","chapter":"第二章 秦汉时期","name":"陈胜吴广起义","formula":"公元前209年","explanation":"陈胜、吴广在大泽乡率众起义，这是中国历史上第一次大规模农民起义。起义提出王侯将相宁有种乎的口号，动摇了秦朝统治根基。","semester":"upper"},{"id":"g2_history_u016","chapter":"第二章 秦汉时期","name":"楚汉之争","formula":"公元前206年-公元前202年","explanation":"秦亡后，项羽与刘邦为争夺帝位展开四年战争。项羽自刎乌江，刘邦建立汉朝。成语破釜沉舟、霸王别姬等均与此相关。","semester":"upper"},{"id":"g2_history_u017","chapter":"第二章 秦汉时期","name":"文景之治","formula":"公元前180年-公元前140年","explanation":"汉文帝、汉景帝统治时期，推行轻徭薄赋、与民休息的政策。出现盛世景象，为汉武帝时期的大一统奠定物质基础。","semester":"upper"},{"id":"g2_history_u018","chapter":"第二章 秦汉时期","name":"汉武帝大一统","formula":"公元前140年-公元前87年","explanation":"汉武帝采纳董仲舒建议独尊儒术，推行推恩令削弱诸侯国，加强中央集权；实行盐铁官营，增加财政收入；派张骞出使西域，开辟丝绸之路。","semester":"upper"},{"id":"g2_history_u019","chapter":"第二章 秦汉时期","name":"丝绸之路","formula":"公元前138年","explanation":"汉武帝派张骞出使西域，开辟了连接亚欧大陆的丝绸之路。路线从长安出发，经河西走廊、西域、中亚，到达地中海沿岸，促进东西方经济文化交流。","semester":"upper"},{"id":"g2_history_u020","chapter":"第二章 秦汉时期","name":"东汉灭亡","formula":"公元220年","explanation":"东汉末年，权臣当道，政治腐败，黄巾起义动摇了东汉统治。公元220年，曹丕废汉献帝建立魏，东汉正式灭亡，三国时代开始。","semester":"upper"},{"id":"g2_history_u021","chapter":"第三章 三国两晋南北朝","name":"赤壁之战","formula":"公元208年","explanation":"曹操与孙权、刘备联军在赤壁展开大战，孙刘联军以少胜多大败曹军。此战奠定三国鼎立基础，火烧赤壁是著名战役。","semester":"upper"},{"id":"g2_history_u022","chapter":"第三章 三国两晋南北朝","name":"三国鼎立","formula":"公元220年-公元280年","explanation":"赤壁之战后，形成魏、蜀（蜀汉）、吴三国鼎立局面。魏国占据北方，蜀国据有四川盆地，吴国控制江东地区。这一时期战乱频仍，但江南经济有所发展。","semester":"upper"},{"id":"g2_history_u023","chapter":"第三章 三国两晋南北朝","name":"西晋统一","formula":"公元280年","explanation":"司马炎建立晋朝（西晋），灭吴国，统一全国。但统一局面短暂，八王之乱和五胡乱华导致西晋灭亡，中国再次陷入分裂。","semester":"upper"},{"id":"g2_history_u024","chapter":"第三章 三国两晋南北朝","name":"东晋南渡","formula":"公元317年","explanation":"西晋灭亡后，司马睿在南方建立东晋。北方则陷入五胡十六国混战。大批北方人民南渡江南，促进江南经济发展。","semester":"upper"},{"id":"g2_history_u025","chapter":"第三章 三国两晋南北朝","name":"淝水之战","formula":"公元383年","explanation":"前秦苻坚率军南下攻晋，东晋谢安、谢玄率军在淝水击败前秦军。此战保卫了江南稳定，成语风声鹤唳、草木皆兵出自此战。","semester":"upper"},{"id":"g2_history_u026","chapter":"第三章 三国两晋南北朝","name":"北魏孝文帝改革","formula":"公元494年","explanation":"北魏孝文帝拓跋宏迁都洛阳，实行汉化改革，包括穿汉服、学汉语、与汉族通婚等。改革促进民族融合，推动了北方经济发展。","semester":"upper"},{"id":"g2_history_u027","chapter":"第四章 隋唐时期","name":"隋朝统一","formula":"公元589年","explanation":"隋文帝杨坚灭陈，统一全国，结束西晋末年以来近三百年的分裂局面。隋朝创立科举制度，开凿大运河，对后世产生深远影响。","semester":"upper"},{"id":"g2_history_u028","chapter":"第四章 隋唐时期","name":"科举制度创立","formula":"公元606年","explanation":"隋炀帝设立进士科，标志着科举制度正式确立。科举打破了门阀士族对仕途的垄断，使寒门子弟有通过考试进入仕途的机会。","semester":"upper"},{"id":"g2_history_u029","chapter":"第四章 隋唐时期","name":"贞观之治","formula":"公元627年-公元649年","explanation":"唐太宗李世民统治时期，政治清明，经济恢复发展，社会稳定。他虚心纳谏，选贤任能，轻徭薄赋，开创了唐朝第一个盛世局面。","semester":"upper"},{"id":"g2_history_u030","chapter":"第四章 隋唐时期","name":"武则天","formula":"公元690年-公元705年","explanation":"武则天称帝，成为中国历史上唯一的女皇帝。她重视农业生产，破格选拔人才，打击门阀士族，史称有贞观遗风。","semester":"upper"},{"id":"g2_history_u031","chapter":"第四章 隋唐时期","name":"开元盛世","formula":"公元713年-公元741年","explanation":"唐玄宗统治前期，出现开元盛世。唐朝经济繁荣，文化昌盛，人口增长，达到全盛时期。但后期爆发安史之乱，唐朝由盛转衰。","semester":"upper"},{"id":"g2_history_u032","chapter":"第四章 隋唐时期","name":"安史之乱","formula":"公元755年-公元763年","explanation":"安禄山、史思明发动叛乱，历时八年。唐朝从此由盛转衰，藩镇割据局面形成，中央集权削弱，唐朝进入后期统治阶段。","semester":"upper"},{"id":"g2_history_u033","chapter":"第五章 宋元时期","name":"陈桥兵变","formula":"公元960年","explanation":"赵匡胤在陈桥驿被部下拥立为帝，建立宋朝（北宋）。陈桥兵变几乎兵不血刃完成改朝换代，体现五代十国武将专权的政治特点。","semester":"upper"},{"id":"g2_history_u034","chapter":"第五章 宋元时期","name":"杯酒释兵权","formula":"公元961年","explanation":"宋太祖赵匡胤通过酒宴威胁方式，解除石守信等大将兵权。此举加强了中央集权，避免了武将专权，但也导致宋朝军事力量相对薄弱。","semester":"upper"},{"id":"g2_history_u035","chapter":"第五章 宋元时期","name":"澶渊之盟","formula":"公元1005年","explanation":"北宋与辽签订澶渊之盟，宋朝给辽岁币银十万两、绢二十万匹。换来宋辽百年和平，但此后宋朝以岁币换和平的政策成为惯例。","semester":"upper"},{"id":"g2_history_u036","chapter":"第五章 宋元时期","name":"经济重心南移","formula":"两宋时期","explanation":"从唐朝中后期开始，南方经济逐渐超过北方。北宋时，南方财政收入已超过北方；南宋时，江南成为全国经济中心。这一趋势延续至今。","semester":"upper"},{"id":"g2_history_u037","chapter":"第五章 宋元时期","name":"蒙古统一与元朝建立","formula":"公元1206年-公元1271年","explanation":"铁木真统一蒙古各部，被尊称成吉思汗，建立蒙古帝国。1271年忽必烈建立元朝。1279年灭南宋，统一全国。","semester":"upper"},{"id":"g2_history_u038","chapter":"第五章 宋元时期","name":"行省制度","formula":"元朝时期","explanation":"元朝实行行省制度，在全国设行中书省（行省）。行省制度是中国古代地方行政制度的重大创新，有效管辖辽阔疆域，影响后世。","semester":"upper"},{"id":"g2_history_u039","chapter":"第六章 明清时期（至鸦片战争前）","name":"明朝建立","formula":"公元1368年","explanation":"朱元璋推翻元朝，建立明朝，定都南京（后迁北京）。明朝强化中央集权，废除丞相制度，设立厂卫机构，实行八股取士。","semester":"upper"},{"id":"g2_history_u040","chapter":"第六章 明清时期（至鸦片战争前）","name":"靖难之役","formula":"公元1399年-公元1402年","explanation":"燕王朱棣以靖难为名起兵，攻占南京，建文帝下落不明。朱棣称帝即永乐帝，迁都北京，建造紫禁城，编修永乐大典。","semester":"upper"},{"id":"g2_history_u041","chapter":"第六章 明清时期（至鸦片战争前）","name":"郑和下西洋","formula":"1405年-1433年","explanation":"郑和七次率船队下西洋，最远到达非洲东海岸和红海沿岸。这是世界航海史上的壮举，比欧洲大航海时代早半个多世纪，展示明朝国力强盛。","semester":"upper"},{"id":"g2_history_u042","chapter":"第六章 明清时期（至鸦片战争前）","name":"戚继光抗倭","formula":"1550年代","explanation":"戚继光在浙江、福建、广东沿海抗倭，组建戚家军，使用鸳鸯阵战术，基本平定东南沿海倭患。抗倭斗争保卫了沿海人民生命财产安全。","semester":"upper"},{"id":"g2_history_u043","chapter":"第六章 明清时期（至鸦片战争前）","name":"郑成功收复台湾","formula":"1661年-1662年","explanation":"郑成功率军渡海进攻台湾，击败荷兰殖民者，收复台湾。台湾重新回到祖国怀抱，郑成功被誉为民族英雄。","semester":"upper"},{"id":"g2_history_u044","chapter":"第六章 明清时期（至鸦片战争前）","name":"康乾盛世","formula":"1661年-1796年","explanation":"康熙、雍正、乾隆三朝开创的盛世局面，国力强盛，经济繁荣，人口增长，疆域辽阔。但也是中国最后盛世，之后清朝开始衰落。","semester":"upper"},{"id":"g2_history_u045","chapter":"第六章 明清时期（至鸦片战争前）","name":"文字狱","formula":"清代","explanation":"清朝统治者对触犯忌讳的文字罗织罪名，形成文字狱。文字狱严重钳制思想，压制言论自由，是封建专制制度走向极端的表现。","semester":"upper"},{"id":"g2_history_u046","chapter":"第六章 明清时期（至鸦片战争前）","name":"军机处设立","formula":"1729年","explanation":"雍正帝设立军机处，作为处理军政大事的机构。军机处直接听命于皇帝，进一步强化君主专制，使清朝中央集权达到顶峰。","semester":"upper"},{"id":"g2_history_l001","chapter":"第一章 中国近代史（鸦片战争）","name":"鸦片战争","formula":"1840年-1842年","explanation":"英国为打开中国市场、倾销鸦片，发动侵略中国的战争。战争以中国失败告终，签订中国近代史上第一个不平等条约《南京条约》，中国开始沦为半殖民地半封建社会。","semester":"lower"},{"id":"g2_history_l002","chapter":"第一章 中国近代史（鸦片战争）","name":"虎门销烟","formula":"1839年6月","explanation":"林则徐在广东虎门海滩销毁鸦片两万箱，表明中国人民反抗外国侵略的坚强意志。虎门销烟是鸦片战争的导火线。","semester":"lower"},{"id":"g2_history_l003","chapter":"第一章 中国近代史（鸦片战争）","name":"南京条约","formula":"1842年","explanation":"《南京条约》是近代中国第一个不平等条约，主要内容有：割让香港岛，赔款2100万银元，开放广州、厦门、福州、宁波、上海五口通商，协定关税等。","semester":"lower"},{"id":"g2_history_l004","chapter":"第一章 中国近代史（鸦片战争）","name":"半殖民地半封建社会","formula":"鸦片战争后","explanation":"鸦片战争后，中国社会性质发生根本变化：政治上领土主权遭破坏，经济上自然经济解体，社会性质由封建社会变为半殖民地半封建社会。","semester":"lower"},{"id":"g2_history_l005","chapter":"第一章 中国近代史（鸦片战争）","name":"第二次鸦片战争","formula":"1856年-1860年","explanation":"英法联军发动第二次鸦片战争，攻占北京，火烧圆明园。签订《天津条约》《北京条约》等不平等条约，中国丧失更多主权，半殖民地化程度加深。","semester":"lower"},{"id":"g2_history_l006","chapter":"第一章 中国近代史（鸦片战争）","name":"火烧圆明园","formula":"1860年","explanation":"英法联军攻入北京，焚毁皇家园林圆明园，这座集中国古代园林艺术大成的万园之园化为废墟，是外国侵略者对中华文明的严重破坏。","semester":"lower"},{"id":"g2_history_l007","chapter":"第一章 中国近代史（鸦片战争）","name":"俄国侵占中国领土","formula":"19世纪中期","explanation":"第二次鸦片战争期间及之后，俄国强迫清政府签订《瑷珲条约》《北京条约》等，割占中国东北、西北领土共计150多万平方公里。","semester":"lower"},{"id":"g2_history_l008","chapter":"第二章 太平天国运动","name":"金田起义","formula":"1851年1月","explanation":"洪秀全在广西金田村发动起义，建号太平天国。金田起义是太平天国运动的起点，标志着近代中国大规模农民战争的开始。","semester":"lower"},{"id":"g2_history_l009","chapter":"第二章 太平天国运动","name":"太平天国定都天京","formula":"1853年","explanation":"太平军攻占南京，改称天京，定为都城。太平天国建立与清政府对峙的政权，颁布《天朝田亩制度》，提出均贫富的理想。","semester":"lower"},{"id":"g2_history_l010","chapter":"第二章 太平天国运动","name":"天朝田亩制度","formula":"1853年","explanation":"太平天国颁布的纲领性文件，宣扬土地平均分配，试图建立无人不均匀、无人不饱暖的理想社会。但这一制度脱离实际，未能真正实行。","semester":"lower"},{"id":"g2_history_l011","chapter":"第二章 太平天国运动","name":"天京事变","formula":"1856年","explanation":"太平天国领导集团内部发生激烈内讧，杨秀清、韦昌辉被杀，石达开率部出走。太平天国从此由盛转衰，元气大伤。","semester":"lower"},{"id":"g2_history_l012","chapter":"第二章 太平天国运动","name":"太平天国失败","formula":"1864年","explanation":"曾国藩率领湘军围攻天京，太平天国运动最终失败。太平天国坚持斗争14年，沉重打击了清朝统治和外国侵略势力。","semester":"lower"},{"id":"g2_history_l013","chapter":"第三章 洋务运动与甲午战争","name":"洋务运动","formula":"19世纪60年代-90年代","explanation":"洋务运动是地主阶级洋务派发起的一场自强求富的近代化运动。主要内容有创办军事工业、民用工业，筹建新式海军，派遣留学生等。","semester":"lower"},{"id":"g2_history_l014","chapter":"第三章 洋务运动与甲午战争","name":"洋务派代表人物","formula":"奕訢、曾国藩、李鸿章、左宗棠、张之洞","explanation":"洋务派代表人物有恭亲王奕訢、地方督抚曾国藩、李鸿章、左宗棠、张之洞等。他们主张学习西方先进技术，强兵富国。","semester":"lower"},{"id":"g2_history_l015","chapter":"第三章 洋务运动与甲午战争","name":"江南制造总局","formula":"1865年","explanation":"李鸿章在上海创办的综合性机器制造局，是洋务派最大的军事工业企业，标志着中国近代军事工业的开端。","semester":"lower"},{"id":"g2_history_l016","chapter":"第三章 洋务运动与甲午战争","name":"北洋水师","formula":"1888年","explanation":"李鸿章在洋务运动中创建的近代化海军舰队，是当时亚洲最强大的海军。但甲午战争中全军覆没，标志着洋务运动破产。","semester":"lower"},{"id":"g2_history_l017","chapter":"第三章 洋务运动与甲午战争","name":"甲午中日战争","formula":"1894年-1895年","explanation":"日本发动侵华战争，黄海海战、威海卫战役等战役中北洋水师全军覆没。战争中邓世昌等将领英勇殉国。","semester":"lower"},{"id":"g2_history_l018","chapter":"第三章 洋务运动与甲午战争","name":"马关条约","formula":"1895年","explanation":"《马关条约》是继《南京条约》以来最严重的不平等条约，主要内容有：割让辽东半岛、台湾及澎湖列岛，赔款白银二亿两，开放沙市、重庆、苏州、杭州四口，，允许日本在通商口岸设厂。","semester":"lower"},{"id":"g2_history_l019","chapter":"第三章 洋务运动与甲午战争","name":"三国干涉还辽","formula":"1895年","explanation":"甲午战争后，俄、德、法三国以武力威胁日本归还辽东半岛。此事暴露了列强瓜分中国的野心，也加深了中华民族危机。","semester":"lower"},{"id":"g2_history_l020","chapter":"第四章 戊戌变法与义和团","name":"公车上书","formula":"1895年","explanation":"康有为、梁启超等在北京参加会试的举人联名上书光绪帝，反对签订《马关条约》，请求变法图强。公车上书标志着维新变法运动的开始。","semester":"lower"},{"id":"g2_history_l021","chapter":"第四章 戊戌变法与义和团","name":"百日维新","formula":"1898年6月-9月","explanation":"光绪帝颁布一系列变法诏令，从政治、经济、文化教育、军事等方面进行改革。但因触犯顽固派利益，仅维持103天即被镇压，史称百日维新。","semester":"lower"},{"id":"g2_history_l022","chapter":"第四章 戊戌变法与义和团","name":"戊戌六君子","formula":"1898年9月","explanation":"谭嗣同、杨锐、刘光第、林旭、杨深秀、康广仁六人在戊戌政变中被杀害，史称戊戌六君子。谭嗣同表示愿以鲜血唤醒国民。","semester":"lower"},{"id":"g2_history_l023","chapter":"第四章 戊戌变法与义和团","name":"义和团运动","formula":"1899年-1900年","explanation":"义和团以练拳降神为组织形式，打出扶清灭洋口号，在山东、直隶等地展开反帝斗争。运动最终被八国联军镇压。","semester":"lower"},{"id":"g2_history_l024","chapter":"第四章 戊戌变法与义和团","name":"八国联军侵华","formula":"1900年","explanation":"英、美、法、德、俄、日、意、奥八国组成联军发动侵华战争，攻占北京。慈禧太后挟持光绪帝西逃，中国遭到空前浩劫。","semester":"lower"},{"id":"g2_history_l025","chapter":"第四章 戊戌变法与义和团","name":"辛丑条约","formula":"1901年","explanation":"《辛丑条约》是近代中国赔款最多的不平等条约，主要内容有：赔款白银4.5亿两，拆毁大沽炮台，允许各国派兵驻扎北京到山海关铁路沿线，禁止中国人民反帝运动等。","semester":"lower"},{"id":"g2_history_l026","chapter":"第五章 辛亥革命","name":"中国同盟会","formula":"1905年","explanation":"孙中山在日本东京成立中国同盟会，以驱除鞑虏、恢复中华、创立民国、平均地权为纲领。同盟会是第一个全国性的资产阶级革命政党。","semester":"lower"},{"id":"g2_history_l027","chapter":"第五章 辛亥革命","name":"三民主义","formula":"1905年","explanation":"孙中山提出民族、民权、民生三大主义，成为辛亥革命的指导思想。民族主义即推翻满洲贵族统治，民权主义即建立共和国，民生主义即平均地权。","semester":"lower"},{"id":"g2_history_l028","chapter":"第五章 辛亥革命","name":"武昌起义","formula":"1911年10月10日","explanation":"革命党人在武昌发动起义，迅速占领武汉三镇，成立湖北军政府。各省纷纷响应，清朝统治土崩瓦解。10月10日后来被定为辛亥革命纪念日。","semester":"lower"},{"id":"g2_history_l029","chapter":"第五章 辛亥革命","name":"中华民国成立","formula":"1912年1月1日","explanation":"孙中山在南京就任中华民国临时大总统，宣告中华民国正式成立。南京临时政府颁布《临时约法》，但很快被袁世凯窃取革命果实。","semester":"lower"},{"id":"g2_history_l030","chapter":"第五章 辛亥革命","name":"辛亥革命历史意义","formula":"1911年","explanation":"辛亥革命推翻了两千多年的封建君主专制制度，建立了资产阶级共和国，传播了民主共和理念，是近代中国一次伟大的反帝反封建的资产阶级民主革命。","semester":"lower"},{"id":"g2_history_l031","chapter":"第六章 新民主主义革命","name":"新文化运动","formula":"1915年","explanation":"陈独秀创办《青年杂志》（后改名《新青年》），标志着新文化运动开始。运动提倡民主与科学，反对专制和愚昧，反对旧道德，提倡新文学。","semester":"lower"},{"id":"g2_history_l032","chapter":"第六章 新民主主义革命","name":"五四运动","formula":"1919年5月4日","explanation":"北京学生为抗议巴黎和会上中国外交失败，举行示威游行，火烧赵家楼。运动从北京扩展到全国，工人阶级登上历史舞台，是新民主主义革命的开端。","semester":"lower"},{"id":"g2_history_l033","chapter":"第六章 新民主主义革命","name":"中国共产党成立","formula":"1921年7月","explanation":"中共一大在上海召开，宣告中国共产党正式成立。毛泽东、董必武等13人代表全国50多名党员参加会议。大会确定党的名称、纲领和奋斗目标。","semester":"lower"},{"id":"g2_history_l034","chapter":"第六章 新民主主义革命","name":"第一次国共合作","formula":"1924年-1927年","explanation":"在中国共产党帮助下，孙中山改组国民党，确立联俄、联共、扶助农工三大政策。1924年国民党一大召开，第一次国共合作正式形成。","semester":"lower"},{"id":"g2_history_l035","chapter":"第六章 新民主主义革命","name":"北伐战争","formula":"1926年-1928年","explanation":"国共合作后，国民革命军北伐，势如破竹。但1927年蒋介石、汪精卫先后发动政变，大革命失败。第一次国共合作破裂。","semester":"lower"},{"id":"g2_history_l036","chapter":"第六章 新民主主义革命","name":"南昌起义","formula":"1927年8月1日","explanation":"周恩来、贺龙、叶挺、朱德等领导南昌起义，打响武装反抗国民党反动统治的第一枪。8月1日后来被定为中国人民解放军建军节。","semester":"lower"},{"id":"g2_history_l037","chapter":"第六章 新民主主义革命","name":"井冈山革命根据地","formula":"1927年","explanation":"毛泽东率秋收起义部队到井冈山，建立第一个农村革命根据地。开辟了农村包围城市、武装夺取政权的革命道路。","semester":"lower"},{"id":"g2_history_l038","chapter":"第六章 新民主主义革命","name":"长征","formula":"1934年10月-1936年10月","explanation":"由于左倾错误领导，中央红军被迫进行战略转移，历时两年，行程约两万五千里。长征途中召开遵义会议，确立了毛泽东在党中央的领导地位。","semester":"lower"},{"id":"g2_history_l039","chapter":"第六章 新民主主义革命","name":"遵义会议","formula":"1935年1月","explanation":"中共中央在遵义召开政治局扩大会议，纠正了博古等人的左倾错误，确立了毛泽东在党和红军的领导地位，是党的历史上一个生死攸关的转折点。","semester":"lower"},{"id":"g2_history_l040","chapter":"第六章 新民主主义革命","name":"西安事变","formula":"1936年12月12日","explanation":"张学良、杨虎城在西安扣押蒋介石，迫使其停止内战、联共抗日。西安事变和平解决，成为扭转时局的关键，标志着第二次国共合作的初步形成。","semester":"lower"},{"id":"g2_history_l041","chapter":"第六章 新民主主义革命","name":"七七事变","formula":"1937年7月7日","explanation":"日军在卢沟桥发动进攻，全面侵华战争爆发。守卫卢沟桥的二十九军奋起抵抗，全面抗战开始。中华民族到了最危险的时候。","semester":"lower"},{"id":"g2_history_l042","chapter":"第六章 新民主主义革命","name":"南京大屠杀","formula":"1937年12月","explanation":"日军攻陷南京后，进行长达六周的有组织大屠杀，遇难同胞达30万人以上。这是人类历史上最残暴的战争罪行之一。","semester":"lower"},{"id":"g2_history_l043","chapter":"第六章 新民主主义革命","name":"台儿庄战役","formula":"1938年","explanation":"李宗仁指挥中国军队在山东台儿庄与日军激战，歼敌一万余人，是抗战初期中国军队取得的最大胜利，极大地鼓舞了全国人民的抗战士气。","semester":"lower"},{"id":"g2_history_l044","chapter":"第六章 新民主主义革命","name":"百团大战","formula":"1940年8月-12月","explanation":"彭德怀指挥八路军在华北敌后发动大规模进攻战役，参战兵力达105个团。百团大战沉重打击了日军气焰，提高了中国共产党和八路军的威望。","semester":"lower"},{"id":"g2_history_l045","chapter":"第六章 新民主主义革命","name":"中共七大","formula":"1945年4月-6月","explanation":"中共七大在延安召开，确立毛泽东思想为党的指导思想，选举产生以毛泽东为核心的中央领导集体，为夺取抗日战争最后胜利和新民主主义革命胜利奠定了基础。","semester":"lower"},{"id":"g2_history_l046","chapter":"第六章 新民主主义革命","name":"抗日战争胜利","formula":"1945年8月15日","explanation":"日本宣布无条件投降，中国人民取得抗日战争的伟大胜利。这是近代以来中国反抗外敌入侵的第一次完全胜利，是中华民族由衰落走向振兴的历史转折点。","semester":"lower"}];

        const HAS_EXAMPLES = true;

        // 错题本管理器
        const WrongBookManager = {
            STORAGE_KEY_PREFIX: 'wrongbook_',
            getWrongBook(grade, subject) {
                const key = this.STORAGE_KEY_PREFIX + grade + '_' + subject;
                return JSON.parse(localStorage.getItem(key) || '[]');
            },
            addWrongBook(item) {
                const key = this.STORAGE_KEY_PREFIX + item.grade + '_' + item.subject;
                let wrongBook = this.getWrongBook(item.grade, item.subject);
                const exists = wrongBook.some(w => w.question === item.question);
                if (exists) return false;
                wrongBook.push({...item, id: item.knowledgeId + '_' + Date.now(), addedAt: new Date().toISOString()});
                localStorage.setItem(key, JSON.stringify(wrongBook));
                return true;
            }
        };

        // 学习进度管理器
        const ProgressManager = {
            STORAGE_KEY: 'study_progress',
            
            getProgress() {
                try {
                    return JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
                } catch(e) {
                    return {};
                }
            },
            
            saveProgress(progress) {
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(progress));
            },
            
            recordStudy(grade, subject, subjectName, semester, semesterName, knowledgeId, knowledgeName) {
                const progress = this.getProgress();
                const now = new Date().toISOString();
                const today = new Date().toISOString().split('T')[0];
                
                if (!progress.learnedKnowledge) progress.learnedKnowledge = {};
                if (!progress.dailyStats) progress.dailyStats = {};
                if (!progress.dailyStats[today]) {
                    progress.dailyStats[today] = { learnedCount: 0, subjects: [] };
                }
                
                const isNew = !progress.learnedKnowledge[knowledgeId];
                progress.learnedKnowledge[knowledgeId] = { learnedAt: now };
                
                if (isNew) {
                    progress.dailyStats[today].learnedCount++;
                    if (!progress.dailyStats[today].subjects.includes(subject)) {
                        progress.dailyStats[today].subjects.push(subject);
                    }
                }
                
                progress.lastStudy = {
                    grade, subject, subjectName, semester, semesterName,
                    knowledgeId, knowledgeName, timestamp: now
                };
                
                this.saveProgress(progress);
            },
            
            isLearned(knowledgeId) {
                const progress = this.getProgress();
                return !!(progress.learnedKnowledge && progress.learnedKnowledge[knowledgeId]);
            },
            
            getLastStudy() {
                const progress = this.getProgress();
                return progress.lastStudy || null;
            },
            
            getSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                if (!progress.learnedKnowledge) return { learned: 0, total: 0, percent: 0 };
                const prefix = grade + '_' + subject + '_';
                const learned = Object.keys(progress.learnedKnowledge).filter(k => k.startsWith(prefix)).length;
                const total = DATA_KNOWLEDGE.length;
                const percent = total > 0 ? Math.round((learned / total) * 100) : 0;
                return { learned, total, percent };
            },
            
            clearSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                const prefix = grade + '_' + subject + '_';
                
                if (progress.learnedKnowledge) {
                    Object.keys(progress.learnedKnowledge).forEach(k => {
                        if (k.startsWith(prefix)) {
                            delete progress.learnedKnowledge[k];
                        }
                    });
                }
                
                if (progress.lastStudy && progress.lastStudy.grade === grade && progress.lastStudy.subject === subject) {
                    delete progress.lastStudy;
                }
                
                this.saveProgress(progress);
                return true;
            }
        };

        // URL参数解析
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                grade: 'g2',
                subject: 'history',
                semester: params.get('semester') || 'upper'
            };
        }

        const gradeNames = {'g1':'初一','g2':'初二','g3':'初三'};
        const subjectNames = {'history':'历史'};
        const semesterNames = {'upper':'上册','lower':'下册'};

        let currentParams = getUrlParams();
        let knowledgeList = [];
        let expandedIds = new Set();
        let currentExample = null;

        const pageTitle = document.getElementById('page-title');
        const pageSubtitle = document.getElementById('page-subtitle');
        const knowledgeListEl = document.getElementById('knowledge-list');
        const emptyStateEl = document.getElementById('empty-state');
        const searchResultsInfo = document.getElementById('search-results-info');
        const searchCountEl = document.getElementById('search-count');
        const searchInput = document.getElementById('search-input');

        function initPage() {
            const {grade, subject, semester} = currentParams;
            pageTitle.textContent = gradeNames[grade] + ' · ' + subjectNames[subject] + ' · ' + semesterNames[semester];
            loadKnowledge();
            updateProgressStat();
            
            const hash = window.location.hash.replace('#', '');
            if (hash && knowledgeList.some(k => k.id === hash)) {
                setTimeout(() => {
                    toggleExpand(hash);
                    const card = document.querySelector('[data-id="' + hash + '"]');
                    if (card) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
        }

        function updateProgressStat() {
            const {grade, subject} = currentParams;
            const learnedInSemester = knowledgeList.filter(k => ProgressManager.isLearned(k.id)).length;
            document.getElementById('progress-learned').textContent = learnedInSemester;
            document.getElementById('progress-total').textContent = knowledgeList.length;
        }

        function loadKnowledge() {
            const {grade, subject, semester} = currentParams;
            knowledgeList = DATA_KNOWLEDGE.filter(k => {
                return k.semester === semester;
            });
            renderKnowledgeList();
        }

        function renderKnowledgeList(items = knowledgeList) {
            if (items.length === 0) {
                knowledgeListEl.innerHTML = '';
                emptyStateEl.classList.remove('hidden');
                return;
            }
            emptyStateEl.classList.add('hidden');
            knowledgeListEl.innerHTML = items.map(item => {
                const isExpanded = expandedIds.has(item.id);
                const isLearned = ProgressManager.isLearned(item.id);
                return '<div class="card knowledge-card ' + (isLearned ? 'learned' : '') + '" data-id="' + item.id + '">' +
                    '<div class="knowledge-header p-4 flex items-center justify-between" onclick="toggleExpand(\'' + item.id + '\')">' +
                        '<div class="flex items-center gap-3 flex-1 min-w-0">' +
                            '<div class="expand-icon ' + (isExpanded ? 'expanded' : 'collapsed') + '">' + (isExpanded ? '−' : '+') + '</div>' +
                            '<div class="flex-1 min-w-0">' +
                                '<h3 class="text-lg font-semibold text-gray-800 flex items-center gap-2">' + escapeHtml(item.name) + (isLearned ? '<span class="text-green-500 text-sm">✓ 已学习</span>' : '') + '</h3>' +
                                '<p class="text-xs text-gray-500 mt-1">' + escapeHtml(item.chapter) + '</p>' +
                            '</div>' +
                        '</div>' +
                        (HAS_EXAMPLES ? '<button class="btn btn-secondary text-sm px-3 py-1" onclick="event.stopPropagation(); showExample(\'' + item.id + '\', \'' + escapeHtml(item.name) + '\')">例题</button>' : '') +
                    '</div>' +
                    '<div id="content-' + item.id + '" class="px-6 pb-4 ' + (isExpanded ? '' : 'hidden') + '">' +
                        (item.formula ? '<div class="mb-4"><h4 class="text-sm font-medium text-gray-500 mb-2">📐 公式</h4><p class="formula-box text-gray-800 text-lg bg-gray-50 p-3 rounded-lg">' + escapeHtml(item.formula) + '</p></div>' : '') +
                        (item.explanation ? '<div><h4 class="text-sm font-medium text-gray-500 mb-2">📝 解释</h4><p class="text-gray-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(item.explanation) + '</p></div>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function toggleExpand(id) {
            const isNewLearn = !expandedIds.has(id) && !ProgressManager.isLearned(id);
            if (expandedIds.has(id)) {
                expandedIds.delete(id);
            } else {
                expandedIds.add(id);
                const {grade, subject, semester} = currentParams;
                const item = knowledgeList.find(k => k.id === id);
                if (item) {
                    ProgressManager.recordStudy(
                        grade, subject, subjectNames[subject],
                        semester, semesterNames[semester],
                        id, item.name
                    );
                }
            }
            const card = document.querySelector('[data-id="' + id + '"]');
            const content = document.getElementById('content-' + id);
            const icon = card.querySelector('.expand-icon');
            const header = card.querySelector('.knowledge-header');
            const title = card.querySelector('h3');
            if (expandedIds.has(id)) {
                content.classList.remove('hidden');
                icon.classList.remove('collapsed');
                icon.classList.add('expanded');
                icon.textContent = '−';
                header.classList.add('expanded');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('expanded');
                icon.classList.add('collapsed');
                icon.textContent = '+';
                header.classList.remove('expanded');
            }
            if (isNewLearn) {
                card.classList.add('learned');
                if (!title.querySelector('.text-green-500')) {
                    title.innerHTML += '<span class="text-green-500 text-sm">✓ 已学习</span>';
                }
                updateProgressStat();
            }
        }

        function expandAll() {
            knowledgeList.forEach(item => expandedIds.add(item.id));
            renderKnowledgeList();
        }

        function collapseAll() {
            expandedIds.clear();
            renderKnowledgeList();
        }

        function searchKnowledge(keyword, list) {
            if (!keyword) return [];
            const lower = keyword.toLowerCase();
            return list.filter(k =>
                k.name.toLowerCase().includes(lower) ||
                k.chapter.toLowerCase().includes(lower)
            );
        }

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                searchResultsInfo.classList.add('hidden');
                renderKnowledgeList();
                return;
            }
            const results = searchKnowledge(keyword, knowledgeList);
            searchCountEl.textContent = results.length;
            searchResultsInfo.classList.remove('hidden');
            renderKnowledgeList(results);
        }

        function showExample(knowledgeId, knowledgeName) {
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === knowledgeId);
            if (examples.length === 0) {
                alert('暂无例题');
                return;
            }
            const example = examples[Math.floor(Math.random() * examples.length)];
            currentExample = {...example, knowledgeId, knowledgeName, ...currentParams};
            document.getElementById('example-knowledge-name').textContent = knowledgeName;
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
            document.getElementById('example-modal').classList.remove('hidden');
        }

        function nextExample() {
            if (!currentExample) return;
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === currentExample.knowledgeId);
            const otherExamples = examples.filter(e => e !== currentExample);
            if (otherExamples.length === 0) {
                alert('没有更多例题了');
                return;
            }
            const example = otherExamples[Math.floor(Math.random() * otherExamples.length)];
            currentExample = {...example, knowledgeId: currentExample.knowledgeId, knowledgeName: currentExample.knowledgeName, ...currentParams};
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
        }

        function addToWrongBook() {
            if (!currentExample) return;
            const item = {
                knowledgeId: currentExample.knowledgeId,
                knowledgeName: currentExample.knowledgeName,
                question: currentExample.question,
                answer: currentExample.answer,
                grade: currentParams.grade,
                subject: currentParams.subject
            };
            if (WrongBookManager.addWrongBook(item)) {
                alert('已加入错题本！');
            } else {
                alert('该题目已在错题本中');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearProgress() {
            const {grade, subject} = currentParams;
            const subjectName = subjectNames[subject];
            var msg = '确定要清除【' + subjectName + '】科目的所有学习进度吗？';
            msg += '\n\n';
            msg += '此操作将清除该科目所有已学习标记，且不可恢复。';
            if (!confirm(msg)) {
                return;
            }
            ProgressManager.clearSubjectProgress(grade, subject);
            updateProgressStat();
            renderKnowledgeList();
            alert('学习进度已清除');
        }

        document.getElementById('btn-expand-all').addEventListener('click', expandAll);
        document.getElementById('btn-collapse-all').addEventListener('click', collapseAll);
        document.getElementById('btn-clear-progress').addEventListener('click', clearProgress);
        searchInput.addEventListener('keyup', e => { if (e.key === 'Enter') performSearch(); });
        searchInput.addEventListener('input', () => { if (!searchInput.value) { searchResultsInfo.classList.add('hidden'); renderKnowledgeList(); }});
        document.getElementById('close-example').addEventListener('click', () => document.getElementById('example-modal').classList.add('hidden'));
        document.getElementById('btn-show-answer').addEventListener('click', () => {
            document.getElementById('example-answer-section').classList.remove('hidden');
            document.getElementById('btn-show-answer').classList.add('hidden');
        });
        document.getElementById('btn-next-example').addEventListener('click', nextExample);
        document.getElementById('btn-add-wrong').addEventListener('click', addToWrongBook);
        document.getElementById('example-modal').addEventListener('click', e => { if (e.target.id === 'example-modal') document.getElementById('example-modal').classList.add('hidden'); });

        initPage();
    </script>
</body>
</html>
