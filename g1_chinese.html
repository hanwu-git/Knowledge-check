    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"chapter":"第一单元 亲情","name":"《春》朱自清","formula":"写景散文，比喻拟人排比","explanation":"【作者】朱自清，现代著名散文家、诗人、学者。\n\n【主要内容】\n《春》是一篇优美的写景抒情散文，描绘了春天的美景，表达了对春天的热爱和赞美之情。\n\n【文章结构】\n1. 盼春（1-2段）：盼望春天的到来\n2. 绘春（3-7段）：描绘春草图、春花图、春风图、春雨图、迎春图\n3. 赞春（8-10段）：赞美春天的新、美、力\n\n【写作手法】\n比喻、拟人、排比等多种修辞方法的运用。","id":"g1_chinese_u001","semester":"upper"},{"chapter":"第一单元 亲情","name":"《济南的冬天》老舍","formula":"温晴，山清水秀","explanation":"【作者】老舍，原名舒庆春，字舍予，现代著名作家。\n\n【主要内容】\n文章抓住济南冬天\"温晴\"的特点，描绘了济南冬天特有的动人美景，表达了对济南冬天的喜爱和赞美。\n\n【写作特点】\n1. 抓住景物特征：温晴\n2. 写景层次分明：由整体到局部，由山到水\n3. 运用比喻拟人\n4. 情景交融","id":"g1_chinese_u002","semester":"upper"},{"chapter":"第一单元 亲情","name":"《论语》十二章","formula":"学习方法、学习态度、修身做人","explanation":"【作品简介】\n《论语》是儒家经典著作，由孔子的弟子及再传弟子编写，记录了孔子及其弟子的言行。\n\n【关于孔子】\n孔子，名丘，字仲尼，春秋时期鲁国人，我国古代伟大的思想家、教育家，儒家学派创始人。\n\n【主要内容】\n学习方法、学习态度、修身做人三个方面。","id":"g1_chinese_u003","semester":"upper"},{"chapter":"第一单元 亲情","name":"修辞方法：比喻与拟人","formula":"比喻：本体+喻体+比喻词；拟人：把物当作人来写","explanation":"【比喻】\n1. 定义：用跟甲事物有相似点的乙事物来描写或说明甲事物。\n2. 构成：本体、喻体、比喻词\n3. 种类：明喻、暗喻、借喻\n\n【拟人】\n1. 定义：把物当作人来写，赋予物以人的思想感情和动作行为。\n\n【区别】\n比喻侧重\"喻\"，把甲事物比作乙事物；拟人侧重\"拟\"，把物当作人来写。","id":"g1_chinese_u004","semester":"upper"},{"chapter":"第一单元 亲情","name":"记叙文阅读方法","formula":"六要素、线索、顺序、中心思想","explanation":"【记叙文六要素】\n时间、地点、人物、事件的起因、经过、结果\n\n【记叙文的线索】\n时间、地点、人物、事件、情感变化、某物\n\n【记叙文的顺序】\n1. 顺叙：按事情发展的先后顺序\n2. 倒叙：先写结果，再写原因和经过\n3. 插叙：插入一段与主要情节相关的内容\n\n【概括中心思想】\n本文记叙了...，表现了/表达了/赞美了...。","id":"g1_chinese_u005","semester":"upper"},{"chapter":"第二单元 学习生活","name":"《从百草园到三味书屋》鲁迅","formula":"回忆性散文，对比手法","explanation":"【作者】鲁迅，原名周树人，字豫才，我国现代伟大的文学家、思想家、革命家。\n\n【主要内容】\n文章通过回忆百草园和三味书屋的生活，表现了儿童热爱大自然、追求自由快乐的心理。\n\n【对比手法】\n用百草园的自由快乐对比三味书屋的枯燥无味。","id":"g1_chinese_u006","semester":"upper"},{"chapter":"第二单元 学习生活","name":"《再塑生命的人》海伦·凯勒","formula":"莎莉文老师，再塑生命","explanation":"【作者】海伦·凯勒，美国女作家、教育家。\n\n【主要内容】\n本文叙述了莎莉文老师教海伦识字、认识事物的过程，赞扬了莎莉文老师高超的教育艺术。\n\n【\"再塑生命\"的含义】\n1. 表层意思：重新塑造生命\n2. 深层意思：让海伦重新认识世界，获得生命的意识和感情","id":"g1_chinese_u007","semester":"upper"},{"chapter":"第二单元 学习生活","name":"词语的感情色彩","formula":"褒义词、贬义词、中性词","explanation":"【分类】\n1. 褒义词：含有赞赏、喜爱等肯定感情的词\n2. 贬义词：含有贬斥、憎恶等负面感情的词\n3. 中性词：不带有明显褒贬感情的词\n\n【注意】\n一词多义的词在不同语境中感情色彩可能不同。","id":"g1_chinese_u008","semester":"upper"},{"chapter":"第二单元 学习生活","name":"病句辨析与修改","formula":"成分残缺、搭配不当、语序不当、重复啰嗦、前后矛盾","explanation":"【常见病句类型】\n1. 成分残缺：缺少必要的成分\n2. 搭配不当：成分之间搭配不合理\n3. 语序不当：词语排列顺序不合理\n4. 重复啰嗦：意思重复\n5. 前后矛盾：意思不一致\n6. 分类不当：分类标准不统一\n\n【修改原则】保持原意，尽量少改。","id":"g1_chinese_u009","semester":"upper"},{"chapter":"第三单元 四季美景","name":"古代诗歌四首","formula":"观沧海、闻王昌龄左迁龙标遥有此寄、次北固山下、天净沙秋思","explanation":"【《观沧海》曹操】\n描绘大海吞吐日月的壮丽景象，表现诗人开阔的胸襟和统一全国的抱负。\n\n【《闻王昌龄左迁龙标遥有此寄》李白】\n表达对友人的深切同情和关切。\n\n【《次北固山下》王湾】\n抒发旅途中的思乡之情。\n\n【《天净沙·秋思》马致远】\n被誉为\"秋思之祖\"，抒发天涯游子的孤寂愁苦和思乡之情。","id":"g1_chinese_u010","semester":"upper"},{"chapter":"第三单元 四季美景","name":"《荷叶·母亲》冰心","formula":"借物喻人，母爱","explanation":"【作者】冰心，原名谢婉莹，现代著名女作家、诗人。\n\n【主要内容】\n文章以暴雨中荷叶荫蔽红莲的情景，联想到母亲对子女的呵护与关爱，歌颂了伟大无私的母爱。\n\n【写作手法】\n借物喻人、对比、直抒胸臆。\n\n【冰心三大主题】母爱、童真、自然。","id":"g1_chinese_u011","semester":"upper"},{"chapter":"第三单元 四季美景","name":"《世说新语》二则","formula":"咏雪、陈太丘与友期行","explanation":"【作品简介】\n《世说新语》是南朝宋刘义庆组织编写的志人小说集。\n\n【《咏雪》】\n谢道韫\"未若柳絮因风起\"的比喻更佳。\n\n【《陈太丘与友期行》】\n元方：聪慧机智、明白事理；友人：无信无礼但知错能改。\n主旨：做人要讲诚信、懂礼貌。","id":"g1_chinese_u012","semester":"upper"},{"chapter":"第三单元 四季美景","name":"写景散文阅读","formula":"抓住特征、多角度描写、情景交融","explanation":"【阅读方法】\n1. 把握景物特征\n2. 理清写景顺序：时间、空间、逻辑\n3. 分析描写角度：视觉、听觉、嗅觉、味觉、触觉\n4. 品味语言特点\n5. 体会思想感情：借景抒情、情景交融、托物言志","id":"g1_chinese_u013","semester":"upper"},{"chapter":"第三单元 四季美景","name":"文言实词（一）","formula":"古今异义、一词多义、词类活用","explanation":"【古今异义】\n例：妻子（古：妻子和儿女；今：男子的配偶）\n去（古：离开；今：前往）\n\n【一词多义】\n同一个词在不同语境中有不同意义。\n\n【词类活用】\n名词作动词、形容词作动词、名词作状语、意动用法等。","id":"g1_chinese_u014","semester":"upper"},{"chapter":"第四单元 人生感悟","name":"《纪念白求恩》毛泽东","formula":"国际主义、毫不利己专门利人、精益求精","explanation":"【主要内容】\n高度赞扬了白求恩同志的国际主义精神、毫不利己专门利人的精神和对技术精益求精的精神。\n\n【写作手法】\n1. 夹叙夹议，以议为主\n2. 对比手法，突出中心\n3. 语言简洁有力","id":"g1_chinese_u015","semester":"upper"},{"chapter":"第四单元 人生感悟","name":"《植树的牧羊人》让·乔诺","formula":"坚持不懈、无私奉献、创造奇迹","explanation":"【作者】让·乔诺，法国作家。\n\n【主要内容】\n讲述了一个孤独的牧羊人在荒漠中几十年如一日坚持种树，最终把荒漠变成绿洲的故事。\n\n【人物形象】\n勤劳、朴实、执着、无私、有智慧。\n\n【主题】赞美了人类克服困难、改造自然的伟大力量和无私奉献的精神。","id":"g1_chinese_u016","semester":"upper"},{"chapter":"第四单元 人生感悟","name":"《走一步，再走一步》莫顿·亨特","formula":"把大困难分解成小困难，逐一克服","explanation":"【作者】莫顿·亨特，美国作家、心理学家。\n\n【主要内容】\n回忆作者小时候爬悬崖被困，在父亲鼓励下一步步走下悬崖的经历。\n\n【人生经验】\n在人生道路上，不管面对怎样的艰难险阻，只要把大困难分解成小困难，逐一克服，最终定能战胜困难。","id":"g1_chinese_u017","semester":"upper"},{"chapter":"第四单元 人生感悟","name":"议论文阅读入门","formula":"论点、论据、论证","explanation":"【议论文三要素】\n1. 论点：作者的见解和主张\n2. 论据：事实论据、道理论据\n3. 论证：举例论证、道理论证、对比论证、比喻论证\n\n【基本结构】\n提出问题（引论）→ 分析问题（本论）→ 解决问题（结论）","id":"g1_chinese_u018","semester":"upper"},{"chapter":"第四单元 人生感悟","name":"成语的正确使用","formula":"望文生义、对象误用、褒贬不当、语义重复","explanation":"【常见错误类型】\n1. 望文生义：只按字面意思理解\n2. 对象误用：使用对象不对\n3. 褒贬不当：感情色彩用错\n4. 语义重复：意思重复\n5. 谦敬错位：谦辞敬辞混用","id":"g1_chinese_u019","semester":"upper"},{"chapter":"第五单元 动物与人","name":"《猫》郑振铎","formula":"三次养猫，前亡后失，愧疚自责","explanation":"【作者】郑振铎，现代作家、文学史家。\n\n【主要内容】\n叙述了\"我\"家三次养猫的经历，第三只猫的死让\"我\"深深自责。\n\n【主题】\n1. 对弱小生命的同情和关爱\n2. 不能凭个人好恶和偏见对待人和事\n3. 反思人类的自私和武断","id":"g1_chinese_u020","semester":"upper"},{"chapter":"第五单元 动物与人","name":"《鸟》梁实秋","formula":"爱鸟、写鸟、思鸟","explanation":"【作者】梁实秋，现代散文家、文学评论家。\n\n【主要内容】\n描写了鸟的形态、声音，表达了对鸟的喜爱之情，也借鸟抒发了对自由生活的向往。\n\n【写作特点】\n多角度描写、对比手法、托物言志、语言凝练典雅。","id":"g1_chinese_u021","semester":"upper"},{"chapter":"第五单元 动物与人","name":"《动物笑谈》康拉德·劳伦兹","formula":"动物行为学，趣事，科学精神","explanation":"【作者】康拉德·劳伦兹，奥地利动物行为学家，1973年诺贝尔奖获得者。\n\n【主要内容】\n讲述了作者在研究动物行为过程中的一些趣事，表现了对动物的热爱和严谨求实的科学精神。\n\n【写作特点】\n语言幽默风趣、细节描写生动、叙述条理清晰。","id":"g1_chinese_u022","semester":"upper"},{"chapter":"第五单元 动物与人","name":"说明文阅读入门","formula":"说明对象、说明方法、说明顺序、说明语言","explanation":"【分类】\n事物说明文、事理说明文\n\n【常见说明方法】\n举例子、列数字、作比较、打比方、分类别、下定义\n\n【说明顺序】\n时间顺序、空间顺序、逻辑顺序\n\n【说明语言】\n准确性是说明文语言的主要特点。","id":"g1_chinese_u023","semester":"upper"},{"chapter":"第五单元 动物与人","name":"文言文：狼","formula":"蒲松龄，《聊斋志异》，机智勇敢","explanation":"【作者与作品】\n蒲松龄，清代文学家。《聊斋志异》是文言短篇小说的顶峰之作。\n\n【情节】\n遇狼→惧狼→御狼→杀狼\n\n【狼的形象】贪婪、凶狠、狡诈\n【屠户的形象】从害怕到机智勇敢\n\n【主旨】\n\"狼亦黠矣，而顷刻两毙，禽兽之变诈几何哉？止增笑耳。\"\n恶势力终将自取灭亡。","id":"g1_chinese_u024","semester":"upper"},{"chapter":"第六单元 想象世界","name":"《皇帝的新装》安徒生","formula":"讽刺，说真话需要勇气","explanation":"【作者】安徒生，丹麦童话作家。\n\n【主要内容】\n一个愚蠢的皇帝被两个骗子愚弄，赤身裸体举行游行大典，最后被一个小孩子揭穿真相。\n\n【主题】\n讽刺了封建统治者的愚蠢、虚伪、自欺欺人，告诉人们要保持童心，敢于说真话。\n\n【写作特点】\n想象和夸张、人物描写生动、对比手法、讽刺性强。","id":"g1_chinese_u025","semester":"upper"},{"chapter":"第六单元 想象世界","name":"《天上的街市》郭沫若","formula":"联想与想象，对美好生活的向往","explanation":"【作者】郭沫若，现代诗人、历史学家。\n\n【主要内容】\n诗人借助联想和想象，描绘了天上街市的美丽富饶和自由，表达了对黑暗现实的不满和对理想生活的向往。\n\n【写作手法】\n联想、想象、对比。\n\n【牛郎织女】诗中牛郎织女可以自由来往，过着幸福生活，是作者对理想生活的想象。","id":"g1_chinese_u026","semester":"upper"},{"chapter":"第六单元 想象世界","name":"《女娲造人》袁珂","formula":"神话，女娲，创造人类","explanation":"【作者与神话】\n袁珂，现代神话学家。\n\n【主要内容】\n叙述了女娲抟土造人的故事，展现了女娲勤劳、智慧、伟大的母亲形象。\n\n【女娲形象】\n既是神（神通广大），又是人（有情感、会疲倦）。\n\n【主题】\n解释人类起源，赞美人类诞生给世界带来的生机。","id":"g1_chinese_u027","semester":"upper"},{"chapter":"第六单元 想象世界","name":"童话、神话与寓言","formula":"童话：想象夸张；神话：神的故事；寓言：劝喻讽刺","explanation":"【童话】\n儿童文学的一种，通过丰富的想象、幻想和夸张塑造形象，反映生活。\n\n【神话】\n远古人民对自然现象和社会生活的天真解释和美丽向往。\n\n【寓言】\n用比喻性的故事寄寓意味深长的道理。\n\n【区别】\n童话：面向儿童，重在叙事；神话：远古人类集体创作，关于神；寓言：重在说理。","id":"g1_chinese_u028","semester":"upper"},{"chapter":"第六单元 想象世界","name":"联想与想象","formula":"联想：由此及彼；想象：创造新形象","explanation":"【联想】\n由当前事物回忆起、想象到相关的另一事物。\n类型：相似联想、相关联想、对比联想、因果联想。\n\n【想象】\n在头脑中对已知事物形象进行加工改造，创造出新的事物形象。\n类型：再造想象、创造想象、幻想。\n\n【区别】\n联想是\"由此及彼\"，两个事物都已存在；想象是\"无中生有\"，创造新形象。","id":"g1_chinese_u029","semester":"upper"},{"chapter":"第六单元 想象世界","name":"《诫子书》诸葛亮","formula":"静以修身，俭以养德","explanation":"【作者】诸葛亮，三国时期蜀汉丞相。\n\n【主要内容】\n诸葛亮劝勉儿子勤学立志，修身养性要从淡泊宁静中下功夫，最忌怠惰浮躁。\n\n【主要观点】\n1. 修身养德：静以修身，俭以养德\n2. 立志：非淡泊无以明志，非宁静无以致远\n3. 学习：学须静也，才须学也\n4. 惜时：年与时驰，意与日去，将复何及","id":"g1_chinese_u030","semester":"upper"},{"chapter":"第一单元 人物风采","name":"《邓稼先》杨振宁","formula":"两弹元勋，鞠躬尽瘁，死而后已","explanation":"【作者】杨振宁，美籍华裔物理学家，诺贝尔奖获得者。\n\n【人物】邓稼先，核物理学家，被誉为\"两弹元勋\"。\n\n【主要内容】\n文章记叙了邓稼先的生平事迹，高度赞扬了他为国家核武器事业做出的巨大贡献和崇高的爱国主义精神。\n\n【人物品质】\n无私奉献、忠诚纯正、鞠躬尽瘁、死而后已。","id":"g1_chinese_l001","semester":"lower"},{"chapter":"第一单元 人物风采","name":"《说和做——记闻一多先生言行片段》臧克家","formula":"学者：做了再说，做了不说；革命家：说了就做","explanation":"【作者】臧克家，现代诗人。\n\n【人物】闻一多，诗人、学者、民主战士。\n\n【主要内容】\n文章记叙了闻一多先生作为学者和革命家的主要事迹，表现了他言行一致的崇高品格。\n\n【两个方面】\n1. 作为学者：做了再说，做了不说\n2. 作为革命家：说了就做，言行一致","id":"g1_chinese_l002","semester":"lower"},{"chapter":"第一单元 人物风采","name":"《回忆鲁迅先生》萧红","formula":"鲁迅的日常生活，平凡中的伟大","explanation":"【作者】萧红，现代女作家。\n\n【主要内容】\n文章通过回忆鲁迅先生的日常生活琐事，展现了鲁迅平凡而真实的一面，表现了他的人格魅力。\n\n【人物形象】\n乐观幽默、关爱青年、勤奋工作、生活简朴。","id":"g1_chinese_l003","semester":"lower"},{"chapter":"第一单元 人物风采","name":"《孙权劝学》《资治通鉴》","formula":"开卷有益，学习的重要性","explanation":"【作品】《资治通鉴》，司马光主持编纂的编年体通史。\n\n【主要内容】\n孙权劝说吕蒙学习，吕蒙开始学习后才略大增，让鲁肃刮目相看。\n\n【启示】\n1. 开卷有益，学习很重要\n2. 不要用一成不变的眼光看待别人\n3. 要善于听取他人的正确建议","id":"g1_chinese_l004","semester":"lower"},{"chapter":"第一单元 人物风采","name":"人物描写方法","formula":"外貌、语言、动作、心理、神态、细节描写","explanation":"【人物描写方法】\n1. 外貌描写（肖像描写）：描写人物的外貌特征\n2. 语言描写：描写人物的对话和独白\n3. 动作描写：描写人物的行为动作\n4. 心理描写：描写人物的内心活动\n5. 神态描写：描写人物的面部表情\n6. 细节描写：对细微动作、神情的描写\n\n【作用】\n表现人物性格，塑造人物形象。","id":"g1_chinese_l005","semester":"lower"},{"chapter":"第二单元 祖国河山","name":"《黄河颂》光未然","formula":"歌颂黄河，赞美民族精神","explanation":"【作者】光未然，现代诗人。\n\n【主要内容】\n诗歌以澎湃的激情歌颂了黄河的宏伟气势，赞美了中华民族的伟大精神。\n\n【结构】\n绘黄河→颂黄河→学黄河\n\n【黄河象征意义】\n中华民族的精神象征，代表着坚强不屈、勇往直前的民族精神。","id":"g1_chinese_l006","semester":"lower"},{"chapter":"第二单元 祖国河山","name":"《老山界》陆定一","formula":"红军长征，不怕困难的革命英雄主义精神","explanation":"【作者】陆定一，无产阶级革命家。\n\n【主要内容】\n文章记叙了红军长征中翻越老山界的经过，表现了红军不怕困难、艰苦奋斗的坚强意志和革命乐观主义精神。\n\n【写作顺序】\n按时间变化和地点转移安排材料。","id":"g1_chinese_l007","semester":"lower"},{"chapter":"第二单元 祖国河山","name":"《土地的誓言》端木蕻良","formula":"对故土的热爱，对祖国的眷恋","explanation":"【作者】端木蕻良，现代作家。\n\n【写作背景】\n\"九一八\"事变后，东北沦陷，作者流亡关内。\n\n【主要内容】\n文章抒发了作者对沦丧的故土的热爱和对祖国的眷恋之情，表达了愿为祖国母亲牺牲一切的誓言。\n\n【\"土地的誓言\"含义】\n作者面对土地发出的誓言，表达强烈的爱国情感。","id":"g1_chinese_l008","semester":"lower"},{"chapter":"第二单元 祖国河山","name":"《木兰诗》","formula":"乐府双璧之一，代父从军，巾帼英雄","explanation":"【作品简介】\n南北朝时期北方的一首乐府民歌，与《孔雀东南飞》并称\"乐府双璧\"。\n\n【主要内容】\n叙述了木兰女扮男装、代父从军的故事，塑造了一个勤劳善良、机智勇敢、不慕名利的巾帼英雄形象。\n\n【成语】\n扑朔迷离：形容事情错综复杂，难以辨别清楚。","id":"g1_chinese_l009","semester":"lower"},{"chapter":"第二单元 祖国河山","name":"抒情方式","formula":"直接抒情、间接抒情","explanation":"【直接抒情（直抒胸臆）】\n直接表达作者的思想感情，情感强烈鲜明。\n\n【间接抒情】\n1. 借景抒情：通过描写景物抒发情感\n2. 托物言志：借助某一事物表达志向\n3. 借事抒情：通过叙述事件抒发情感\n4. 借古讽今：借历史典故讽喻现实\n\n【效果】\n直接抒情情感强烈，间接抒情含蓄委婉。","id":"g1_chinese_l010","semester":"lower"},{"chapter":"第三单元 凡人小事","name":"《阿长与〈山海经〉》鲁迅","formula":"欲扬先抑，对劳动妇女的同情与怀念","explanation":"【作者】鲁迅。\n\n【主要内容】\n文章回忆了保姆阿长的一些往事，表达了对这位劳动妇女的同情、感激和怀念之情。\n\n【写作手法】\n欲扬先抑：先写阿长的缺点（切切察察、睡相不好、规矩多），后写她的好处（买《山海经》）。","id":"g1_chinese_l011","semester":"lower"},{"chapter":"第三单元 凡人小事","name":"《老王》杨绛","formula":"对不幸者的同情，知识分子的反思","explanation":"【作者】杨绛，现代女作家、翻译家。\n\n【主要内容】\n文章记叙了\"我\"与三轮车夫老王交往的几个片段，表达了对老王这样不幸者的同情、关爱和尊重。\n\n【主题】\n体现了作者的人道主义精神，也包含着知识分子对自身的反思。\n\n【名句】\n\"那是一个幸运的人对一个不幸者的愧怍。\"","id":"g1_chinese_l012","semester":"lower"},{"chapter":"第三单元 凡人小事","name":"《台阶》李森祥","formula":"农民对尊严的追求，勤劳朴实的农民形象","explanation":"【作者】李森祥，当代作家。\n\n【主要内容】\n小说讲述了父亲为建造有高台阶的新屋而终生辛劳的故事，塑造了一个勤劳朴实、追求尊严的农民形象。\n\n【\"台阶\"的象征意义】\n台阶象征着地位和尊严，父亲对高台阶的追求反映了农民对尊重和尊严的渴望。","id":"g1_chinese_l013","semester":"lower"},{"chapter":"第三单元 凡人小事","name":"《卖油翁》欧阳修","formula":"熟能生巧，谦虚谨慎","explanation":"【作者】欧阳修，北宋文学家，唐宋八大家之一。\n\n【主要内容】\n陈尧咨善射，自矜其能，卖油翁以酌油之技说明熟能生巧的道理。\n\n【道理】\n1. 熟能生巧，反复练习就能达到精妙的境界\n2. 即使有长处也不能骄傲自满\n\n【成语】\n熟能生巧、酌油知之","id":"g1_chinese_l014","semester":"lower"},{"chapter":"第三单元 凡人小事","name":"详略得当的写作方法","formula":"根据中心思想决定材料的详略","explanation":"【详略安排原则】\n1. 最能表现中心思想的材料要详写\n2. 与中心思想关系不大的材料要略写\n3. 完全无关的材料不写\n\n【好处】\n1. 突出中心，主次分明\n2. 避免内容庞杂，重点不突出\n3. 使文章结构紧凑，节奏明快\n\n【判断方法】\n看材料是否最能表现文章的中心思想。","id":"g1_chinese_l015","semester":"lower"},{"chapter":"第四单元 文化散文","name":"《叶圣陶先生二三事》张中行","formula":"待人厚，律己严，语文教育家的风范","explanation":"【作者】张中行，当代学者、散文家。\n\n【人物】叶圣陶，现代著名作家、教育家、出版家。\n\n【主要内容】\n文章通过回忆叶圣陶先生的几件小事，表现了他\"待人厚、律己严\"的崇高品德和语文教育思想。\n\n【叶圣陶的主张】\n写文章要平易自然、鲜明简洁、细致恳切。","id":"g1_chinese_l016","semester":"lower"},{"chapter":"第四单元 文化散文","name":"《驿路梨花》彭荆风","formula":"雷锋精神，助人为乐，处处有雷锋","explanation":"【作者】彭荆风，当代作家。\n\n【主要内容】\n小说通过\"我\"和老余在哀牢山深处的小茅屋借宿的所见所闻，赞扬了以梨花为代表的青年一代助人为乐的雷锋精神。\n\n【\"驿路梨花\"含义】\n既指自然界的梨花，又指梨花姑娘，更象征雷锋精神。\n\n【名句】\n\"驿路梨花处处开\"","id":"g1_chinese_l017","semester":"lower"},{"chapter":"第四单元 文化散文","name":"《最苦与最乐》梁启超","formula":"未尽责任最苦，尽责任最乐","explanation":"【作者】梁启超，近代思想家、学者。\n\n【主要观点】\n1. 人生最苦的事，莫若身上背着一种未了的责任\n2. 人生最乐的事，是责任完成了，如释重负\n3. 处处尽责任，便处处快乐；时时尽责任，便时时快乐\n\n【中心论点】\n未尽责任是人生最大的痛苦，尽责任是人生最大的快乐。","id":"g1_chinese_l018","semester":"lower"},{"chapter":"第四单元 文化散文","name":"《短文两篇》（陋室铭、爱莲说）","formula":"托物言志，安贫乐道与洁身自好","explanation":"【《陋室铭》刘禹锡】\n通过描写陋室，表达作者高洁傲岸的情操和安贫乐道的志趣。\n\n【《爱莲说》周敦颐】\n通过赞美莲花\"出淤泥而不染\"的品格，表达作者洁身自好的高洁人格。\n\n【共同手法】\n托物言志：借助某一事物表达自己的志向和品格。","id":"g1_chinese_l019","semester":"lower"},{"chapter":"第四单元 文化散文","name":"托物言志的写法","formula":"通过对事物的描写和叙述，表达自己的志向和意愿","explanation":"【定义】\n托物言志是通过对物品的描写和叙述，表达自己的志向和意愿的一种写作手法。\n\n【特点】\n1. 物与志有相似点或相关点\n2. 表面写物，实际写人/志\n3. 形象含蓄，意味深长\n\n【常见意象】\n梅花：坚强不屈、高洁\n莲花：洁身自好\n竹子：正直虚心\n松柏：坚贞不屈","id":"g1_chinese_l020","semester":"lower"},{"chapter":"第五单元 景物描写","name":"《紫藤萝瀑布》宗璞","formula":"生命的长河无止境，对生命的热爱","explanation":"【作者】宗璞，当代女作家。\n\n【主要内容】\n文章通过描写一树盛开的紫藤萝花，表达了对生命的深刻感悟：生命的长河是无止境的，要热爱生命。\n\n【写作手法】\n借景抒情、托物言志、对比（眼前花与十多年前的花）。\n\n【名句】\n\"花和人都会遇到各种各样的不幸，但是生命的长河是无止境的。\"","id":"g1_chinese_l021","semester":"lower"},{"chapter":"第五单元 景物描写","name":"《一棵小桃树》贾平凹","formula":"小桃树的成长，对理想的追求","explanation":"【作者】贾平凹，当代作家。\n\n【主要内容】\n文章通过描写一棵在逆境中生长的小桃树，表达了作者对人生理想的追求和与命运抗争的精神。\n\n【小桃树的象征意义】\n小桃树象征着作者的幸福希望和对理想的追求。\n\n【写法】\n托物言志，借小桃树抒发人生感悟。","id":"g1_chinese_l022","semester":"lower"},{"chapter":"第五单元 景物描写","name":"《假如生活欺骗了你》普希金","formula":"乐观面对生活，相信未来","explanation":"【作者】普希金，俄国诗人。\n\n【主要内容】\n诗歌告诉人们，当生活欺骗了你时，不要悲伤，不要心急，要相信快乐的日子将会到来。\n\n【启示】\n1. 面对挫折要保持乐观积极的态度\n2. 要相信未来，热爱生活\n3. 困难只是暂时的，光明就在前面","id":"g1_chinese_l023","semester":"lower"},{"chapter":"第五单元 景物描写","name":"《未选择的路》弗罗斯特","formula":"人生的选择，选择决定人生道路","explanation":"【作者】弗罗斯特，美国诗人。\n\n【主要内容】\n诗歌通过描写森林中的两条路，表达了对人生选择的思考：选择不同的道路，就会有不同的人生。\n\n【\"路\"的象征意义】\n象征人生道路上的选择。\n\n【启示】\n人生的选择很重要，要慎重选择，一旦选择就要坚定地走下去。","id":"g1_chinese_l024","semester":"lower"},{"chapter":"第五单元 景物描写","name":"借景抒情与托物言志","formula":"借景抒情重情感，托物言志重志向","explanation":"【借景抒情】\n1. 定义：通过描写景物来抒发情感\n2. 特点：情由景生，情景交融\n3. 重点：表达情感\n\n【托物言志】\n1. 定义：借助某一事物表达志向和品格\n2. 特点：物志交融，寓意深刻\n3. 重点：表达志向、品格、哲理\n\n【区别】\n借景抒情重在抒发情感，托物言志重在表达志向和哲理。","id":"g1_chinese_l025","semester":"lower"},{"chapter":"第六单元 科幻探险","name":"《伟大的悲剧》茨威格","formula":"失败同样伟大，探险精神的赞颂","explanation":"【作者】茨威格，奥地利作家。\n\n【主要内容】\n文章记叙了斯科特一行五人在从南极点返回途中悲壮牺牲的故事，赞颂了人类勇于探索的精神和为事业献身的崇高精神。\n\n【\"伟大的悲剧\"含义】\n虽然探险失败了，但探险者所表现出的精神是伟大的。失败的是结果，伟大的是精神。","id":"g1_chinese_l026","semester":"lower"},{"chapter":"第六单元 科幻探险","name":"《太空一日》杨利伟","formula":"首次太空飞行，勇敢与严谨","explanation":"【作者】杨利伟，中国第一位进入太空的航天员。\n\n【主要内容】\n文章记录了作者首次进入太空的所见所闻所感，表现了航天员严谨科学的态度和勇敢无畏的精神。\n\n【内容结构】\n我以为自己要牺牲了→我看到了什么→神秘的敲击声→归途如此惊心动魄","id":"g1_chinese_l027","semester":"lower"},{"chapter":"第六单元 科幻探险","name":"《带上她的眼睛》刘慈欣","formula":"科幻小说，珍惜当下，对科学的敬畏","explanation":"【作者】刘慈欣，科幻作家，《三体》作者。\n\n【主要内容】\n小说讲述了\"我\"带着一位被困地心的女宇航员的眼睛去旅行的故事，表达了对科学的敬畏和对生命的珍惜。\n\n【科幻特点】\n科学与幻想相结合，既有科学依据，又有丰富想象。","id":"g1_chinese_l028","semester":"lower"},{"chapter":"第六单元 科幻探险","name":"《河中石兽》纪昀","formula":"实践出真知，不能主观臆断","explanation":"【作者】纪昀，清代文学家。\n\n【主要内容】\n讲述了寻找河中石兽的故事，说明做事不能凭主观臆断，要从实际出发，实践出真知。\n\n【道理】\n1. 不能片面理解，要全面深入调查\n2. 不能主观臆断，要从实际出发\n3. 实践出真知\n\n【三种寻找方法】\n原地水中→下游→上游（正确）","id":"g1_chinese_l029","semester":"lower"},{"chapter":"第六单元 科幻探险","name":"科幻小说的特点","formula":"科学、幻想、小说三要素","explanation":"【定义】\n科幻小说是用幻想的形式，表现人类在未来世界的物质精神文化生活和科学技术远景的小说。\n\n【三要素】\n1. 科学性：以科学为基础，有科学依据\n2. 幻想性：大胆的想象和创造\n3. 小说性：有人物、情节、环境\n\n【常见题材】\n太空探索、时间旅行、人工智能、外星生命等。","id":"g1_chinese_l030","semester":"lower"}];

        const HAS_EXAMPLES = true;

        // 错题本管理器
        const WrongBookManager = {
            STORAGE_KEY_PREFIX: 'wrongbook_',
            getWrongBook(grade, subject) {
                const key = this.STORAGE_KEY_PREFIX + grade + '_' + subject;
                return JSON.parse(localStorage.getItem(key) || '[]');
            },
            addWrongBook(item) {
                const key = this.STORAGE_KEY_PREFIX + item.grade + '_' + item.subject;
                let wrongBook = this.getWrongBook(item.grade, item.subject);
                const exists = wrongBook.some(w => w.question === item.question);
                if (exists) return false;
                wrongBook.push({...item, id: item.knowledgeId + '_' + Date.now(), addedAt: new Date().toISOString()});
                localStorage.setItem(key, JSON.stringify(wrongBook));
                return true;
            }
        };

        // 学习进度管理器
        const ProgressManager = {
            STORAGE_KEY: 'study_progress',
            
            getProgress() {
                try {
                    return JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
                } catch(e) {
                    return {};
                }
            },
            
            saveProgress(progress) {
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(progress));
            },
            
            recordStudy(grade, subject, subjectName, semester, semesterName, knowledgeId, knowledgeName) {
                const progress = this.getProgress();
                const now = new Date().toISOString();
                const today = new Date().toISOString().split('T')[0];
                
                if (!progress.learnedKnowledge) progress.learnedKnowledge = {};
                if (!progress.dailyStats) progress.dailyStats = {};
                if (!progress.dailyStats[today]) {
                    progress.dailyStats[today] = { learnedCount: 0, subjects: [] };
                }
                
                const isNew = !progress.learnedKnowledge[knowledgeId];
                progress.learnedKnowledge[knowledgeId] = { learnedAt: now };
                
                if (isNew) {
                    progress.dailyStats[today].learnedCount++;
                    if (!progress.dailyStats[today].subjects.includes(subject)) {
                        progress.dailyStats[today].subjects.push(subject);
                    }
                }
                
                progress.lastStudy = {
                    grade, subject, subjectName, semester, semesterName,
                    knowledgeId, knowledgeName, timestamp: now
                };
                
                this.saveProgress(progress);
            },
            
            isLearned(knowledgeId) {
                const progress = this.getProgress();
                return !!(progress.learnedKnowledge && progress.learnedKnowledge[knowledgeId]);
            },
            
            getLastStudy() {
                const progress = this.getProgress();
                return progress.lastStudy || null;
            },
            
            getSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                if (!progress.learnedKnowledge) return { learned: 0, total: 0, percent: 0 };
                const prefix = grade + '_' + subject + '_';
                const learned = Object.keys(progress.learnedKnowledge).filter(k => k.startsWith(prefix)).length;
                const total = DATA_KNOWLEDGE.length;
                const percent = total > 0 ? Math.round((learned / total) * 100) : 0;
                return { learned, total, percent };
            },
            
            clearSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                const prefix = grade + '_' + subject + '_';
                
                if (progress.learnedKnowledge) {
                    Object.keys(progress.learnedKnowledge).forEach(k => {
                        if (k.startsWith(prefix)) {
                            delete progress.learnedKnowledge[k];
                        }
                    });
                }
                
                if (progress.lastStudy && progress.lastStudy.grade === grade && progress.lastStudy.subject === subject) {
                    delete progress.lastStudy;
                }
                
                this.saveProgress(progress);
                return true;
            }
        };

                setTimeout(() => {
                    toggleExpand(hash);
                    const card = document.querySelector('[data-id="' + hash + '"]');
                    if (card) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
        }

        function updateProgressStat() {
            const {grade, subject} = currentParams;
            const learnedInSemester = knowledgeList.filter(k => ProgressManager.isLearned(k.id)).length;
            document.getElementById('progress-learned').textContent = learnedInSemester;
            document.getElementById('progress-total').textContent = knowledgeList.length;
        }

        function loadKnowledge() {
            const {grade, subject, semester} = currentParams;
            knowledgeList = DATA_KNOWLEDGE.filter(k => {
                return k.semester === semester;
            });
            renderKnowledgeList();
        }

        function renderKnowledgeList(items = knowledgeList) {
            if (items.length === 0) {
                knowledgeListEl.innerHTML = '';
                emptyStateEl.classList.remove('hidden');
                return;
            }
            emptyStateEl.classList.add('hidden');
            knowledgeListEl.innerHTML = items.map(item => {
                const isExpanded = expandedIds.has(item.id);
                const isLearned = ProgressManager.isLearned(item.id);
                return '<div class="card knowledge-card ' + (isLearned ? 'learned' : '') + '" data-id="' + item.id + '">' +
                    '<div class="knowledge-header p-4 flex items-center justify-between" onclick="toggleExpand(\'' + item.id + '\')">' +
                        '<div class="flex items-center gap-3 flex-1 min-w-0">' +
                            '<div class="expand-icon ' + (isExpanded ? 'expanded' : 'collapsed') + '">' + (isExpanded ? '−' : '+') + '</div>' +
                            '<div class="flex-1 min-w-0">' +
                                '<h3 class="text-lg font-semibold text-gray-800 flex items-center gap-2">' + escapeHtml(item.name) + (isLearned ? '<span class="text-green-500 text-sm">✓ 已学习</span>' : '') + '</h3>' +
                                '<p class="text-xs text-gray-500 mt-1">' + escapeHtml(item.chapter) + '</p>' +
                            '</div>' +
                        '</div>' +
                        (HAS_EXAMPLES ? '<button class="btn btn-secondary text-sm px-3 py-1" onclick="event.stopPropagation(); showExample(\'' + item.id + '\', \'' + escapeHtml(item.name) + '\')">例题</button>' : '') +
                    '</div>' +
                    '<div id="content-' + item.id + '" class="px-6 pb-4 ' + (isExpanded ? '' : 'hidden') + '">' +
                        (item.formula ? '<div class="mb-4"><h4 class="text-sm font-medium text-gray-500 mb-2">📐 公式</h4><p class="formula-box text-gray-800 text-lg bg-gray-50 p-3 rounded-lg">' + escapeHtml(item.formula) + '</p></div>' : '') +
                        (item.explanation ? '<div><h4 class="text-sm font-medium text-gray-500 mb-2">📝 解释</h4><p class="text-gray-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(item.explanation) + '</p></div>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function toggleExpand(id) {
            const isNewLearn = !expandedIds.has(id) && !ProgressManager.isLearned(id);
            if (expandedIds.has(id)) {
                expandedIds.delete(id);
            } else {
                expandedIds.add(id);
                const {grade, subject, semester} = currentParams;
                const item = knowledgeList.find(k => k.id === id);
                if (item) {
                    ProgressManager.recordStudy(
                        grade, subject, subjectNames[subject],
                        semester, semesterNames[semester],
                        id, item.name
                    );
                }
            }
            const card = document.querySelector('[data-id="' + id + '"]');
            const content = document.getElementById('content-' + id);
            const icon = card.querySelector('.expand-icon');
            const header = card.querySelector('.knowledge-header');
            const title = card.querySelector('h3');
            if (expandedIds.has(id)) {
                content.classList.remove('hidden');
                icon.classList.remove('collapsed');
                icon.classList.add('expanded');
                icon.textContent = '−';
                header.classList.add('expanded');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('expanded');
                icon.classList.add('collapsed');
                icon.textContent = '+';
                header.classList.remove('expanded');
            }
            if (isNewLearn) {
                card.classList.add('learned');
                if (!title.querySelector('.text-green-500')) {
                    title.innerHTML += '<span class="text-green-500 text-sm">✓ 已学习</span>';
                }
                updateProgressStat();
            }
        }

        function expandAll() {
            knowledgeList.forEach(item => expandedIds.add(item.id));
            renderKnowledgeList();
        }

        function collapseAll() {
            expandedIds.clear();
            renderKnowledgeList();
        }

        function searchKnowledge(keyword, list) {
            if (!keyword) return [];
            const lower = keyword.toLowerCase();
            return list.filter(k =>
                k.name.toLowerCase().includes(lower) ||
                k.chapter.toLowerCase().includes(lower)
            );
        }

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                searchResultsInfo.classList.add('hidden');
                renderKnowledgeList();
                return;
            }
            const results = searchKnowledge(keyword, knowledgeList);
            searchCountEl.textContent = results.length;
            searchResultsInfo.classList.remove('hidden');
            renderKnowledgeList(results);
        }

        function showExample(knowledgeId, knowledgeName) {
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === knowledgeId);
            if (examples.length === 0) {
                alert('暂无例题');
                return;
            }
            const example = examples[Math.floor(Math.random() * examples.length)];
            currentExample = {...example, knowledgeId, knowledgeName, ...currentParams};
            document.getElementById('example-knowledge-name').textContent = knowledgeName;
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
            document.getElementById('example-modal').classList.remove('hidden');
        }

        function nextExample() {
            if (!currentExample) return;
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === currentExample.knowledgeId);
            const otherExamples = examples.filter(e => e !== currentExample);
            if (otherExamples.length === 0) {
                alert('没有更多例题了');
                return;
            }
            const example = otherExamples[Math.floor(Math.random() * otherExamples.length)];
            currentExample = {...example, knowledgeId: currentExample.knowledgeId, knowledgeName: currentExample.knowledgeName, ...currentParams};
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
        }

        function addToWrongBook() {
            if (!currentExample) return;
            const item = {
                knowledgeId: currentExample.knowledgeId,
                knowledgeName: currentExample.knowledgeName,
                question: currentExample.question,
                answer: currentExample.answer,
                grade: currentParams.grade,
                subject: currentParams.subject
            };
            if (WrongBookManager.addWrongBook(item)) {
                alert('已加入错题本！');
            } else {
                alert('该题目已在错题本中');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearProgress() {
            const {grade, subject} = currentParams;
            const subjectName = subjectNames[subject];
            var msg = '确定要清除【' + subjectName + '】科目的所有学习进度吗？';
            msg += '\n\n';
            msg += '此操作将清除该科目所有已学习标记，且不可恢复。';
            if (!confirm(msg)) {
                return;
            }
            ProgressManager.clearSubjectProgress(grade, subject);
            updateProgressStat();
            renderKnowledgeList();
            alert('学习进度已清除');
        }

        document.getElementById('btn-expand-all').addEventListener('click', expandAll);
        document.getElementById('btn-collapse-all').addEventListener('click', collapseAll);
        document.getElementById('btn-clear-progress').addEventListener('click', clearProgress);
        searchInput.addEventListener('keyup', e => { if (e.key === 'Enter') performSearch(); });
        searchInput.addEventListener('input', () => { if (!searchInput.value) { searchResultsInfo.classList.add('hidden'); renderKnowledgeList(); }});
        document.getElementById('close-example').addEventListener('click', () => document.getElementById('example-modal').classList.add('hidden'));
        document.getElementById('btn-show-answer').addEventListener('click', () => {
            document.getElementById('example-answer-section').classList.remove('hidden');
            document.getElementById('btn-show-answer').classList.add('hidden');
        });
        document.getElementById('btn-next-example').addEventListener('click', nextExample);
        document.getElementById('btn-add-wrong').addEventListener('click', addToWrongBook);
        document.getElementById('example-modal').addEventListener('click', e => { if (e.target.id === 'example-modal') document.getElementById('example-modal').classList.add('hidden'); });

        initPage();
    </script>
</body>
</html>
