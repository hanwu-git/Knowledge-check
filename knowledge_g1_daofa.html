    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"chapter":"第一单元 成长的节拍","name":"中学时代","formula":"中学时代是人生发展的新阶段，为我们的一生奠定重要基础","explanation":"【中学时代的意义】\n1. 中学时代是人生发展的一个新阶段，这段时间并不是很长，却可以为我们的一生奠定重要基础。\n2. 中学时代见证着一个人从少年到青年的生命进阶。\n3. 中学生活，对我们来说意味着新的机会和可能，也意味着新的目标和挑战。\n\n【成长的礼物】\n1. 中学生活提供了发展自我的多种机会。\n2. 新的目标和要求激发着我们的潜能，激励着我们不断实现自我超越。\n3. 在新的环境中，我们有机会改变在父母、老师和同学心目中那些不够完美的形象，重新塑造一个\"我\"。\n\n【如何度过中学时代】\n面对各种可能与挑战，我们要珍视当下，把握机遇，从点滴做起，为美好明天付出不懈的努力。","id":"g1_daofa_u001","semester":"upper"},{"chapter":"第一单元 成长的节拍","name":"少年有梦","formula":"梦想是对未来美好生活的愿望，努力是梦想与现实之间的桥梁","explanation":"【梦想的意义】\n1. 编织人生梦想，是青少年时期的重要生命主题。\n2. 梦想是对未来美好生活的愿望，它能不断激发我们生命的热情和勇气，让生活更有色彩。有梦想，就有希望。\n3. 少年的梦想，是人类天真无邪、美丽可爱的愿望。\n\n【少年梦想的特点】\n1. 少年的梦想，与个人的人生目标紧密相连。明确的人生目标，犹如灯塔，能够帮助我们在茫茫大海中找到前进的方向。\n2. 少年的梦想，与时代的脉搏紧密相连，与中国梦密不可分。生活在这个时代的我们，共同享有人生出彩的机会，共同享有梦想成真的机会，共同享有同祖国和时代一起成长与进步的机会。\n\n【努力实现梦想】\n1. 少年有梦，不应止于心动，更要付诸行动。不懈地追梦、圆梦才能改变生活，改变我们自己。\n2. 努力，是梦想与现实之间的桥梁。\n3. 努力，是一种生活态度，是一种不服输的坚忍和失败后从头再来的勇气，是对自我的坚定信念和对美好的不懈追求。\n4. 努力，需要立志。志向是人生的航标。青少年要从小学习立志，早立志，立大志，立长志，并且把自己最重要的人生志向同祖国和人民联系在一起。\n5. 努力，需要坚持。只要坚持努力，即使过程再艰难，也有机会离梦想更近一步。\n6. 努力也有方法：分清轻重缓急，合理规划和管理时间；劳逸结合，学会科学用脑；每天进步一点点；学思并进；珍视团队合作。","id":"g1_daofa_u002","semester":"upper"},{"chapter":"第一单元 成长的节拍","name":"学习新天地","formula":"学习不仅仅局限在学校，学习需要自觉、主动的态度，学习伴成长","explanation":"【学习的特点】\n1. 初中阶段的学习，包括知识的获取，还包括各种能力的培养。\n2. 学习不仅仅局限在学校，我们所看，我们所听，我们所尝，我们所触，我们所做，都可以是学习。学习不仅表现为接受和掌握，而且表现为探究、发现、体验和感悟。\n3. 学习需要自觉、主动的态度。假如我们没有积极学习的态度，即使身处学校，也可能收获不多。带着学习的心态，生活中的点点滴滴都是学习。\n4. 学习伴随着我们的成长。人有学习的天性，从牙牙学语到能言善辩，从懵懂儿童到明理少年，都是一个不断学习和发展的过程。\n5. 学习没有终点。我们终生都在学习，终生都需要学习，即使离开了学校，也要不断地学习，不断地充实自己。只有善于抓住和利用各种机会去学习，才能适应不断发展的社会。\n\n【学习的意义】\n1. 学习，不仅让我们能够生存，而且让我们能够拥有更充实的生活。\n2. 学习就是给生命添加养料。如果不学习，人的生命将会枯萎。\n3. 学习点亮我们心中的明灯，激发前进的动力。在学习中，我们分享生命经验，获得成长，同时也可以帮助他人，服务社会，为幸福生活奠基。","id":"g1_daofa_u003","semester":"upper"},{"chapter":"第一单元 成长的节拍","name":"享受学习","formula":"学习中有快乐也有辛苦，学会学习需要发现并保持对学习的兴趣、掌握科学的学习方法、善于运用不同的学习方式","explanation":"【学习中的苦与乐】\n1. 学习中有快乐。对某方面的知识有强烈兴趣时，自己解决某个问题时，学习中找到志趣相投的同伴时，发现自己的潜能时……我们都可以体味到学习带来的快乐。\n2. 学习中也有辛苦。尽管抱有兴趣和探索欲望，学习也并不是轻而易举的事情。学习过程中需要集中注意力、耗费精力，遇到困难和阻挠时需要调节不良情绪等，这些都需要我们凭借坚强的意志作出努力。\n3. 当我们经历了学习的辛苦，收获学习的成果时，那种发自内心的愉悦让我们体验到学习的美好，它是学习过程带给我们的美妙享受。\n\n【学会学习】\n1. 学会学习，需要发现并保持对学习的兴趣。\"知之者，不如好之者；好之者，不如乐之者。\"有了学习兴趣，学习可以成为艰苦却十分快乐的探索之旅。\n2. 学会学习，需要掌握科学的学习方法。学习意味着要善于从生活中汲取养料，掌握一些基本的学习策略，合理安排学习时间，形成良好的学习习惯，不断提升自己的学习能力。不同学科有不同的学习方法，学习方法也因人而异，适合自己的方法就是最好的方法。\n3. 学会学习，还意味着要善于运用不同的学习方式达成目标，比如合作学习、探究学习等。我们可以与同伴相互帮助、分工合作，在交流切磋中共同完成任务。我们也可以带着问题、猜想或假设去探究，独立思考，不断质疑，在自主学习中培养观察、想象、分析、推理等方面的能力。","id":"g1_daofa_u004","semester":"upper"},{"chapter":"第一单元 成长的节拍","name":"认识自己","formula":"正确认识自己，可以促进自我发展，可以促进与他人的交往","explanation":"【认识自己的意义】\n1. 正确认识自己，可以促进自我发展。每个人都是独一无二的个体，认识到自己的禀赋和独特性，有助于我们增强对自己的信心，更好地发展自己的能力。\n2. 正确认识自己，可以促进与他人的交往。正确认识自己，有助于我们认识到自己离不开他人和社会，从而更好地理解、宽容和善待他人，与他人积极互动。\n\n【认识自己的途径】\n1. 我们可以从生理、心理、社会等方面来认识自己：\n   - 可以从身体特征和生理状况来认识自己，如自己的身材、相貌、体能、性别等\n   - 可以从个性心理特征来认识自己，如性格、气质等\n   - 可以从在群体中的关系来认识自己，如自己在家庭或班级中的角色等\n\n2. 我们可以通过自我评价来认识自己。对自己有一个恰当的自我评价，能帮助我们接受自己，对自己抱有正确的态度，不骄傲也不自卑；能帮助我们调节和控制自己的行为。\n\n3. 他人评价是我们认识自己的一面镜子。有人说：\"要想了解自己，最好问问别人。\"他人评价有助于我们形成对自己更为客观、完整、清晰的认识。\n\n【正确对待他人评价】\n我们要重视他人的态度与评价，但也要客观冷静分析，既不能盲从，也不能忽视。用理性的心态面对他人的评价，是走向成熟的表现。\n正确对待他人评价的方法：用心聆听，勇于面对，平静拒绝。","id":"g1_daofa_u005","semester":"upper"},{"chapter":"第一单元 成长的节拍","name":"做更好的自己","formula":"接纳与欣赏自己，主动改正缺点，不断激发自己的潜能","explanation":"【接纳自己】\n1. 如同世界上没有两片完全相同的树叶一样，世界上也没有完全相同的两个人。我们每个人在性格、兴趣等方面都有自己的特点。\n2. 接纳自己，需要接纳自己的全部。既接纳自己的优点，也接纳自己的不完美；既接纳自己的性格，也接纳自己的身材、相貌；既接纳自己的现在，也接纳自己的过去。\n3. 接纳自己，需要乐观的心态，更需要勇气和智慧。\n\n【欣赏自己】\n1. 我们要学会欣赏自己。欣赏自己的独特，欣赏自己的优点，欣赏自己的努力，欣赏自己为他人的奉献。\n2. 欣赏自己，不是骄傲自大，也不是目中无人。欣赏自己的人，既能展现自己的风采，也能看到他人的美丽；既能为自己鼓掌，也能为他人喝彩。\n\n【做更好的自己】\n1. 做更好的自己，就要扬长避短。要善于利用自己的优点和长处，最大限度地展现自己的才华。\n2. 做更好的自己，需要主动改正缺点。改正缺点的过程就是自我完善、自我发展的过程。\n   改正缺点的方法：具体描述自己的缺点；从最容易改正的缺点开始；及时肯定或奖励自己改正缺点的努力；请一个自己信任的人来协助；在公开场合做出改正缺点的承诺；运用自己以前改正缺点的成功经验\n3. 做更好的自己，需要不断激发自己的潜能。\n   激发潜能的方法：通过珍视自己的兴趣爱好，专注自己喜爱的领域；通过广泛参与多方面的活动，发现他人和社会对自己的需要；通过积极合作，与他人共同完成任务……我们就可以更好地激发自己的潜能。\n4. 做更好的自己，是在和他人共同生活的过程中不断成长的，更是在为他人、为社会带来福祉的过程中实现的。\n\"路也漫漫，遥遥其途，心向往之，虽远莫阻。\"这是中学时代的成长课题，它值得我们用一生去探寻。","id":"g1_daofa_u006","semester":"upper"},{"chapter":"第二单元 友谊的天空","name":"和朋友在一起","formula":"朋友对一个人的影响很大，朋友见证了我们的成长历程，友谊让我们更深刻地体悟生命的美好","explanation":"【我的朋友圈】\n1. 伙伴、同学、朋友，成为我们生命中越来越重要的部分。\n2. 随着年龄的增长，也许有人发现，自己的交往范围扩大了，朋友圈也扩大了，交往内容更丰富了；也许有人发现，自己的朋友圈比以前变小了，但是交往更加深入，朋友关系更加密切。\n3. 对友谊的渴望，让我们相互靠近。在与朋友的交往中，有欢笑，也有泪水；有甜蜜，也有苦涩。\n\n【友谊的力量】\n1. 朋友对一个人的影响很大，我们的言谈举止、兴趣爱好甚至性格等都或多或少地受到朋友的影响。\n   与乐观开朗的朋友相处，我们会变得豁达；与乐于助人的朋友相处，我们会变得富有爱心。\n2. 朋友，见证了我们一起走过的成长历程，我们需要真诚友善的朋友。\n   因为朋友，我们少了几分孤独，多了些许温暖，活得更加自在；因为朋友，我们感受到自身的价值，多了一份对自己的欣赏；因为朋友，我们学会了更好地与人相处，享受交往的快乐。\n3. 与正直、诚信和见识广的人交朋友，是有益的。朋友丰富了我们的生活经验，友谊让我们更深刻地体悟生命的美好。\n   \"以文会友，以友辅仁。\"带着对友谊的憧憬，让我们走进友谊的天空，探寻友谊的真谛，缔结真挚的友情。","id":"g1_daofa_u007","semester":"upper"},{"chapter":"第二单元 友谊的天空","name":"深深浅浅话友谊","formula":"友谊是一种亲密的关系，友谊是平等的、双向的，友谊是一种心灵的相遇","explanation":"【友谊的特质】\n1. 友谊是一种亲密的关系。每个人对友谊的理解和需要不尽相同，我们都希望在友谊中得到理解和支持、忠诚和信任、肯定和关心。和朋友在一起，这种感觉能让我们获得认可，在精神上得到满足。\n2. 友谊是平等的、双向的。接受帮助，也学习帮助对方；感受关怀，也学习关怀对方。我们共同分享，也相互分担，在相处中体验积极的情感。\n3. 友谊是一种心灵的相遇。友谊的美好就在于它可以超越物质条件、家庭背景、学习成绩等。志同道合、志趣相投的友谊，更能够经得住时间的考验和风雨的洗礼。\n\n【友谊的澄清】\n1. 友谊不是一成不变的。自己变了，对方变了，或者环境变了……在这些改变中，有些友谊得到保持，而有些友谊则逐渐淡出。我们要学会接受一段友谊的淡出，坦然接受新的友谊。\n2. 竞争并不必然伤害友谊，关键是我们对待竞争的态度。如果我们能坦然接受并欣赏朋友的成就，就不会沉溺于失利的痛苦。在竞争中自我反省和激励，我们会收获更多。\n3. 友谊不能没有原则。友谊需要信任和忠诚，但\"讲义气\"、\"够朋友\"并不等于不加分辨地为朋友做任何事。其实，当朋友误入歧途时，不予规劝甚至推波助澜，反而会伤害朋友，伤害友谊。\n\n友谊可以带来快乐，让人向往；有时也会带来困扰，增添烦恼。在友谊的长河里，我们深深浅浅地跋涉着，经历着不同的体验，累积着各自的感受。","id":"g1_daofa_u008","semester":"upper"},{"chapter":"第二单元 友谊的天空","name":"让友谊之树常青","formula":"建立友谊需要开放自己和持续的行动，呵护友谊需要用心关怀、尊重对方、正确处理冲突、正确对待伤害","explanation":"【建立友谊】\n1. 建立友谊，需要开放自己。建立友谊的过程中，会有惊喜，会有意外，还会有点儿冒险。无论怎样，敞开心扉，主动表达，朋友才不会彼此错过。\n2. 建立友谊，需要持续的行动。在行动前要有恰当的期待，即使对方拒绝，也并不意味着自己不好。如果一次尝试不成功，别气馁，只要真诚待人，我们就有机会找到朋友。\n\n有助于建立友谊的方法：\n- 面带微笑：微笑，能缩短人与人之间的距离；微笑，是一种自我介绍，它展示了你的热情、快乐和亲和力\n- 记住对方的名字：准确地说出对方的名字，会令对方觉得被你关注和尊重\n- 真诚夸赞：想与一个人成为朋友，他身上自然有吸引你的地方。真诚的称赞是对他的肯定和接纳，他自然也会愿意接纳你\n- 寻找共同之处：找到了共同的地方，自然就有更多的共同语言。找到共同点并不难，如都热爱某支球队，去过同一个地方，等等\n- 做一个耐心的倾听者：鼓励对方多谈自己，可以更多地了解对方，也可以让对方感觉到他很重要\n- 保持好奇心：他是什么样的人？他有着怎样的生活？带着好奇走进对方，你就有更多的机会了解对方\n\n【呵护友谊】\n1. 呵护友谊，需要用心去关怀对方。体会朋友的需要，在朋友需要的时候站到他的身旁，以行动向朋友表达关心和支持。\n2. 呵护友谊，需要学会尊重对方。每个人都是独立的个体，要给朋友一些空间，把握好彼此的界限和分寸。朋友之间需要坦诚相待，但这并不意味着毫无保留；给予朋友积极合理的建议，但不要替朋友做决定。\n3. 呵护友谊，需要学会正确处理冲突。冲突发生时，可以相互协商，寻找彼此能够接受的解决方式。如果处理得当，冲突可以把彼此的距离拉得更近。\n   处理冲突的基本策略：保持冷静、坦诚交流、及时处理、勇担责任、换位思考\n4. 呵护友谊，需要学会正确对待交友中受到的伤害。当朋友背叛了自己，或者做出了伤害友谊的举动，我们可以选择宽容对方，也可以选择结束这段友谊。两者都需要勇气，也需要智慧。\n\n我们不可能和所有的人都成为朋友，但是我们要学会同多数人和睦相处，对所有人以诚相待。","id":"g1_daofa_u009","semester":"upper"},{"chapter":"第二单元 友谊的天空","name":"网上交友新时空","formula":"网上交往具有虚拟、平等、自主等特点，要慎重结交网友","explanation":"【网上交友的特点】\n1. 互联网为我们提供了一个交往平台。我们想与他人交往，渴望与同伴建立深厚的友谊，互联网为我们提供了一个平台。\n2. 网上交往具有虚拟、平等、自主等特点，它超越时空限制，把天涯海角、素不相识的人连在一起，开辟了人际交往的新通道，让我们有更多机会结交新的伙伴，拓展交往圈。\n3. 互联网开启了通往世界的又一个窗口，但是有时却关闭了与他人沟通的心灵之门。我们可以发送一个咧嘴的符号，却无法和对方一起会心微笑；我们期待持久的友情，但遇到考验时，又常常点击鼠标让自己一直\"下线\"；我们期待对方的真诚，但常常又戴上面具去参加一场又一场\"假面舞会\"。\n\n【慎重结交网友】\n1. 网上交友，需要考虑对自己学习和生活的影响，学会理性辨别、慎重选择。对于交友而言，互联网只是一个工具，关键在于我们怎么使用它。\n2. 虚拟世界的交往，带有很多不确定的因素，我们要有一定的自我保护意识。例如，对陌生人的邀请，予以回绝；对个人的家庭住址、经济状况、联系方式等，要注意保密；遇到问题时，要学会求助。\n3. 将网上的朋友转化为现实中的朋友，需要慎重。除了考虑安全因素，我们还需要面对很多问题：彼此是否都愿意把真实的自己完全坦露给对方？对方与自己的想象有差距，该如何对待？等等。探讨这些问题，不仅能够让我们更加清楚地认识自己，而且能够增长我们交友的智慧，让我们更好地与他人交往。\n4. 不管互联网生活多么精彩，我们不可能只停留在虚拟世界中。我们要学会在现实中与同伴交往，增加真实而贴近的感受，为友谊奠定可靠的基础。","id":"g1_daofa_u010","semester":"upper"},{"chapter":"第三单元 师长情谊","name":"走近老师","formula":"教师是人类文明的主要传承者之一，承担教书育人的使命，尊重不同风格的老师","explanation":"【了解教师职业】\n1. 教师是一个古老的职业。韩愈在《师说》中写道：师者，所以传道授业解惑也。人类数千年文明的延续，在很大程度上靠教育来传承。教师作为教育工作者，是人类文明的主要传承者之一。\n2. 在现代社会，教师已发展为一种专门职业。教师是履行教育教学职责的专业人员，承担教书育人的使命。《中华人民共和国教师法》明确规定了教师的资格、任用、培养和培训等要求。\n3. 时代在发展，教师的工作理念和工作方式发生了很大变化，也对教师提出了更高的要求。今天的教师要努力成为有理想信念、有道德情操、有扎实学识、有仁爱之心的好教师。\n\n【风格不同的老师】\n1. 由于年龄、学识、阅历、性格、情感与思维方式等差异，每位老师解决问题的方法和表达方式不同，由此呈现出不同的风格。有的老师幽默风趣、富有激情；有的老师严肃认真、一丝不苟；有的老师亲切自然、娓娓道来……\n2. 我们要承认老师之间的差异，接纳每位老师的不同，他们身上都有值得我们学习的地方。\n3. 无论什么风格的老师都应该受到尊重。尊重老师的\"不同\"，可以让我们走近老师，更深入地了解老师。\n4. 我们要学会接纳不同风格的老师：\n   - 承认老师的差别：因个人喜好而喜欢某位老师很正常，但是，承认并接纳每位老师的不同，才有更多的机会了解老师\n   - 发现不同风格老师的优点：从多角度了解老师的职业和生活，善于发现老师的优点，寻找接纳老师的理由\n   - 了解老师教育行为的目的：尝试了解老师教育行为的初衷和用意，更好地理解老师\n   - 主动交往：试着主动和老师交往，从一个微笑、一句问候开始，表达自己对老师的亲近感，拉近师生间的距离","id":"g1_daofa_u011","semester":"upper"},{"chapter":"第三单元 师长情谊","name":"师生交往","formula":"教学相长，亦师亦友，正确对待老师的表扬和批评","explanation":"【教学相长】\n1. 教与学是师生相互陪伴、相互促进、共同成长的过程。一方面，我们的学习离不开老师的引领和指导；另一方面，我们与老师交流互动，也可以促进老师更好地\"教\"。\n2. 面对老师的引领和指导，主动参与、勤学好问的态度有助于我们与老师相互交流。真诚、恰当地向老师表达自己的观点和见解，既是对老师的积极反馈，也是师生共同学习的新资源；与老师分享自己的学习感受、学习成果，可以促进师生共同进步。\n3. 学会正确对待老师的表扬和批评，是我们成长的重要内容。\n   - 老师的表扬意味着肯定、鼓励和期待，激励我们更好地学习和发展\n   - 老师的批评意味着关心、提醒和劝诫，可以帮助我们反省自己，改进不足\n   - 对待老师的批评，我们要把注意力放在老师批评的内容和用意上，理解老师的良苦用心\n\n【亦师亦友】\n1. 学生乐于学习，老师寓教于乐，师生之间彼此尊重、相互关心、携手共进，是师生交往的良好状态。\n2. 彼此尊重，是我们与老师建立良好关系的开始。师生彼此尊重，意味着尊重对方的人格尊严、个性差异、劳动成果等。尊重老师，是中华民族的优良传统，是我们作为\"晚辈\"的基本道德修养，它不仅体现我们内心的情感和态度，而且表现在我们与老师日常交往的言谈举止中。\n3. 在平等相待、相互促进的师生交往中，我们可以和老师成为朋友。老师是我们知识学习的指导者，也是我们精神成长的引路人。老师给予我们生活上的关心和情感上的关怀，我们也应该主动关心老师、理解老师。\n\n【与老师发生矛盾怎么办】\n1. 自我反思，冷静、客观地分析原因。反思自己在哪些方面做得不好，如何改变。\n2. 相信善意，多些宽容和理解。相信老师的善意，愿意理解老师，做到有理恰当表达，无理主动认错。\n3. 坦诚相待，注意沟通方式。主动找老师交换意见，清晰、冷静、坦诚地说出自己的观点，有理有据；选择恰当的时间、地点和场合；选择老师容易接受的表达方式。\n4. 求同存异，主动关心。师生间的矛盾和分歧不应成为师生交往的障碍，我们要主动关心老师，化解矛盾。","id":"g1_daofa_u012","semester":"upper"},{"chapter":"第三单元 师长情谊","name":"家的意味","formula":"家是我们身心的寄居之所，是我们心灵的港湾，家有着深厚的意味、丰富的内涵","explanation":"【生命的居所】\n1. 一般来说，家庭是由婚姻关系、血缘关系或收养关系结合成的亲属生活组织。\n2. 家是我们身心的寄居之所。每个人都有一个属于自己的家，我们的生命是父母给予的，我们的成长也离不开家庭的哺育和支持。\n3. 家是我们心灵的港湾。家不只是一所房子、某个地域，家里有亲人，家中有亲情。亲情，激励我们奋斗拼搏，让我们的心灵有所依靠。\n\n【中国人的\"家\"】\n1. 在中华文化中，家有着深厚的意味、丰富的内涵。在中国人的心目中，家是代代传承、血脉相连的生活共同体，是甜蜜、温暖、轻松的避风港。\n2. 在中国的家庭文化中，\"孝\"是重要的精神内涵。《论语·学而》中说：\"孝悌也者，其为仁之本欤！\"孝亲敬长是中华民族的传统美德，也是每个中国公民的法律义务。\n3. 尽孝在当下。孝敬双亲长辈，关爱家人，不仅仅是长大成人以后的事，从现在开始，我们就应该用行动表达孝敬之心。\n\n【如何孝亲敬长】\n1. 尊敬。尊敬双亲长辈，听取他们的意见和教导。如有不同见解，不急于反驳，理性地与他们沟通。\n2. 倾听。与双亲长辈保持亲近、融洽的关系，倾听他们的心声。双亲长辈不在身边时，要经常和他们保持联系。\n3. 感恩。知恩、感恩，用行动表达感恩之情。认真学习，不辜负父母的期望，是感恩；了解双亲长辈的喜好，体谅他们的辛劳，平日主动承担力所能及的家务劳动，和家人一起建设家庭，也是感恩。","id":"g1_daofa_u013","semester":"upper"},{"chapter":"第三单元 师长情谊","name":"爱在家人间","formula":"每个人的内心都有一份对家人割舍不断的情感，亲子冲突需要良好的互动沟通来解决","explanation":"【体味亲情】\n1. 每个人的内心都有一份对家人割舍不断的情感。这份情感，或是因为他们给了我们生命，或是因为他们为我们的生活操劳，或是因为他们分享了我们的喜悦、分担了我们的忧伤，或是因为他们是我们生命中重要的影响者，或是因为他们是我们成长的陪伴者和见证者……这种情感就是家庭中的亲情之爱。\n2. 每个家庭的亲情表现不尽相同，有的温馨和睦，有的磕磕绊绊，有的内敛深沉，有的自然随和……有时我们可能因为它的平常而忽略它，有时我们似乎感受不到自己渴望的亲情，甚至因此否认亲情的存在。\n3. 现实生活中，由于亲人的离开或新成员的出现，我们的家庭结构也会因之改变。但是，只要我们用心感悟就会发现，家中的亲情仍在，尽管它的表现形式可能会发生变化。\n\n【爱的碰撞】\n1. 进入初中的我们意识到自己长大了，和家人的关系也发生了微妙的变化。一方面，我们希望父母像对待成人一样尊重我们，不要过多干涉我们的生活；另一方面，面对父母的信任和放手，有时我们又觉得失落和不安，期望得到更多的关注和呵护。\n2. 我们开始审视父母给予我们的爱，开始质疑父母，甚至挑战父母的权威与经验，亲子之间的碰撞增多了，有时伴着甜蜜，有时出现紧张，甚至发生冲突。这是我们成长中难以回避的问题。\n3. 作为两代人，由于我们与父母在心智、学识、经历等方面差异较大，对问题的理解、感受等方面必然存在差异，冲突难以避免。如果处理不好，亲子冲突就会伤害双方的感情，影响家庭的和睦。有效地化解冲突，既需要父母做出榜样，也需要我们自己努力。\n\n【沟通传递爱】\n1. 爱是需要呵护的。互动沟通的技巧和应对冲突的智慧，是亲子之间爱的润滑剂。爱在沟通中加深，亲子冲突需要双方通过良好的互动沟通来解决。\n2. 如果与父母发生冲突，我们要选择不伤害父母感情和不影响亲子关系的做法。\n3. 作为子女，我们可以试着去接纳父母的做法，理解父母行为中蕴含的爱。我们可以尝试让父母了解我们的变化和需要，用他们能接受的方式表达我们的爱。\n\n和父母沟通的技巧：\n- 关注事实：清楚自己想要和父母沟通什么，沟通要达到什么结果，不为彼此的态度和情绪所干扰\n- 把握时机：思考在什么情况下沟通，沟通是在冲突发生时还是在冷静后。最好是在父母心情好时沟通\n- 留意态度：如果希望父母能够接受自己的想法，应该用什么样的语言和态度表达？有时候采用的态度比语言的内容更重要\n- 选择方式：用什么方式与父母沟通，是面对面沟通，还是通过文字沟通？如果面对面沟通有困难，可以尝试通过文字沟通\n- 考虑环境：选择在什么环境下沟通，是在家中还是户外安静的地方？环境不同，人的心境就不同，沟通的效果也不同","id":"g1_daofa_u014","semester":"upper"},{"chapter":"第三单元 师长情谊","name":"让家更美好","formula":"现代家庭的结构、规模、观念等都发生了不同程度的变化，要为建设和谐家庭作贡献","explanation":"【现代家庭面面观】\n1. 随着社会历史的演进，现代家庭的结构、规模、观念等都发生了不同程度的变化。家庭变得越来越小，从过去儿孙满堂的大家庭，到今天家庭不断趋向小型化，中国的家庭结构在过去几十年间发生了重大变化。\n2. 随着人口的迁移和流动、现代沟通手段的丰富，家庭成员的交流、沟通方式发生了较大的变化。\n3. 家庭氛围越来越平等、民主。关心世界和国家大事，探讨社会和人生问题，学习现代科学文化知识，创建学习型家庭，参与社区活动，这些已成为现代家庭生活的重要内容。\n\n【和谐家庭我出力】\n1. 家和万事兴。家庭成员之间和睦相处是家庭美满幸福的重要条件。这需要家庭成员之间相互理解、信任、体谅和包容。\n2. 在一个家庭中，祖辈、父辈、子辈之间有着不同的价值观念和生活方式，这些差异可能带来家庭成员间的矛盾和冲突，影响家庭和睦。有效交流和沟通，可以增进理解，化解矛盾和冲突。\n3. 随着我们的成长，我们的家庭也在发生变化。家庭成员的增加或减少，会带来人际关系的变化；家庭成员的工作、身体和情绪状况等变化，也可能带来家庭氛围的变化……以良好的心态面对这些变化，才能让亲情更浓，让我们的家庭更和睦。\n\n如何调节家庭成员之间的矛盾或冲突：\n- 帮助家庭成员舒缓情绪：如果家庭成员在发生矛盾时情绪过激，可以适时地成为他们的倾听者，并表示理解\n- 明确自己是不偏不倚的中立者：在家庭成员发生矛盾时，明确自己的任务是解决矛盾，而不是制造新的矛盾，解决矛盾时不偏袒某一方\n- 引导家庭成员看到对方的优点：选择恰当的时机，与家庭成员聊天，引导家庭成员全面看待家庭关系，看到对方的优点\n- 帮助家庭成员走出\"面子\"困境：当家庭成员之间发生冲突后，都有和好之意却又碍于面子时，可以充当搭桥人，帮助双方和好如初","id":"g1_daofa_u015","semester":"upper"},{"chapter":"第四单元 生命的思考","name":"生命可以永恒吗","formula":"生命有时尽，生命有接续，生命是独特的、不可逆的、短暂的","explanation":"【生命有时尽】\n1. 生命来之不易。在地球上，千姿百态的生命竞相展现自己的活力，生命是大自然的奇迹。每个人的生命是在无数的偶然性中产生的，在这一点上我们是幸运的。\n2. 生命是独特的。每个人有不同的人生道路，每个人的生命都不可替代。\n3. 生命是不可逆的。罗曼·罗兰说：\"人生不售来回票，一旦动身，绝不能复返。\"从婴孩成长为儿童，又从儿童成长为少年，生命的时光一去不复返。\n4. 生命也是短暂的。在时间的长河中，个人的生命很短暂，\"人生天地之间，若白驹之过隙，忽然而已\"。\n5. 我们每个人都难以抗拒生命发展的自然规律。死亡是人生不可避免的归宿，它让我们感激生命的获得。向死而生，让我们拥有一份好好活着的感动，从容面对生命的不可预知，更加热爱生命。\n\n【生命有接续】\n1. 在历史的长河中，个人的生命虽然短暂，但正是一代又一代的个体生命实现了人类生命的接续。在人类生命的接续中，我们总能为自己的生命找到一个位置，担当一份使命。\n2. 生命的接续，使得每个人的生命不仅仅是\"我\"的生命，还是\"我们\"的生命。在生命的传承关系中，我们能更好地认识和面对自己的生命。\n3. 在生命的接续中，人类生命不断发展，人类的精神文明也不断积累和丰富。因此，生命对于我们而言，不仅仅是身体的生命，还包括社会关系中的生命、精神信念上的生命；我们每个人都不仅仅是在身体上接续祖先的生命，也在精神上不断继承和创造人类的文明成果。","id":"g1_daofa_u016","semester":"upper"},{"chapter":"第四单元 生命的思考","name":"敬畏生命","formula":"生命是脆弱的、艰难的，也是坚强的、有力量的、崇高的、神圣的，生命价值高于一切","explanation":"【生命至上】\n1. 当人的生命遭遇不可抗拒的自然灾害、人为的灾难、不可预知的结束……我们会感受到生命是脆弱的、艰难的；当人们万众一心，为挽救生命而努力，为守护生命而拼搏，为悼念生命而默哀……我们又会体味到生命是坚强的、有力量的，生命是崇高的、神圣的。我们对生命要有一种敬畏的情怀。\n2. 当我们对生命怀有敬畏之心时，我们就会珍视它。我们的生命都是宝贵的，每个人的生命都比金钱、权势等更重要。在这些外在的东西面前，生命价值高于一切。\n3. 生命至上，并不意味着只看到自己生命的重要性，我们也必须承认别人的生命同样重要。\"仁者爱人\"\"推己及人\"，具备这样的情怀，理解这样的道理，才会让我们自觉地珍爱他人的生命，如同珍爱自己的生命一样。\n\n【休戚与共】\n1. 敬畏生命，让我们从对自己生命的珍惜走向对他人生命的关怀，使我们意识到每个人都需要与他人共同生活。\n2. 我们只有不漠视自己的生命，也不漠视他人的生命，谨慎地对待生命关系、处理生命问题，才会尊重、关注、关怀和善待身边的每一个人。\n3. 我们对生命的敬畏并不是谁的命令，而是内心的自愿选择。我们对待他人生命的态度，表达着我们如何看待自己的生命。当我们能够与周围的生命休戚与共时，我们就走向了道德的生活。","id":"g1_daofa_u017","semester":"upper"},{"chapter":"第四单元 生命的思考","name":"守护生命","formula":"守护生命首先要关注自己的身体，还要关注并养护我们的精神","explanation":"【爱护身体】\n1. 守护生命首先要关注自己的身体。关心身体的状况，养成健康的生活方式，是一种对生命负责任的态度。\n   健康的生活方式：合理的饮食；适量的运动；良好的卫生习惯；有规律的作息；注意保护视力……\n2. 随着年龄增长、心智发育，我们更加关注自己的内在感受。当某些内心需要，如爱、被承认、被接纳、尊严、自由等得不到满足时，有的人经不住一时的挫折，容易做出过激的行为，甚至伤害自己的身体。成长中的我们，应该学会爱惜自己的身体。\n3. 在生活中，我们会面对一些客观存在的、非人力可抗拒的自然灾害，或一些人为灾难。我们需要增强安全意识、自我保护意识，提高安全防范能力，掌握一些基本的自救自护方法。\n\n【养护精神】\n1. 我们每个人活着，除了要关注生理需要和身体健康，还要过精神生活，满足精神需求。精神风貌反映着我们的生命状态，守护生命需要关注并养护我们的精神。\n2. 我们的精神发育，需要物质的支持，但不完全受物质生活条件和外部环境的制约。即使在物质贫乏、外部环境艰苦的情况下，只要我们守住自己的心灵，仍然可以看到真、善、美。相反，过度的物质追求、物质攀比，容易使我们丧失对真、善、美的体验，丢失精神世界的财富。\n3. 人类在发展过程中产生了不同的文化，每个国家和民族都有着自己的精神史诗。作为中国人，我们每个人的精神生命都流淌着民族文化的血脉，离不开优秀传统文化的滋养。守护精神家园，我们不能丢失优秀的民族文化，需要在个人精神世界的充盈中发扬民族精神。","id":"g1_daofa_u018","semester":"upper"},{"chapter":"第四单元 生命的思考","name":"增强生命的韧性","formula":"生活难免有挫折，要及时调整自己，正确对待挫折，发掘生命的力量","explanation":"【生活难免有挫折】\n1. 生活的道路并不总是平坦的，在我们怀揣美好的愿望、目标、期待去努力的过程中，难免会遇到一些阻碍、失利乃至失败。这些阻碍、失利和失败，就是人们常说的挫折。\n2. 面对不同的挫折，不同的人会有不同的情绪感受和行为反应；即使遭遇同样的挫折，不同人的情绪感受和行为反应也是不同的；同一个人在生命的不同时期，对于挫折也会有不同的感受和行为反应。产生这些不同感受和行为反应的主要原因，是人们对挫折的认识和态度不同。\n3. 面对挫折，我们可能会感到失落、焦虑、难过、愤怒、不满等。产生这些负面的情绪感受是很正常的，但如果一味沉浸在负面情绪中，我们就容易消沉，甚至做出不恰当的行为。我们需要及时调整自己，正确对待挫折。\n4. 生活中的挫折是我们生命成长的一部分。得意时，挫折会使我们更清醒，避免盲目乐观、精神懈怠；失意时，挫折会使我们获得更加丰富的生活经验。\n\n【发掘生命的力量】\n1. \"天行健，君子以自强不息。\"面对挫折，发掘自身的生命力量，我们可以逐渐培养自己面对困难的勇气和坚强的意志。\n2. 发掘自身的力量并不排斥借助外力。作为新一代的中国少年，我们在坚持目标和不断努力的道路上，学会与他人建立联系，向他人寻求帮助，获得他人的支持和鼓励，有助于增强我们的生命力量。\n\n增强生命韧性的方法：\n- 欣赏、培养幽默感：幽默感可以帮助我们放松肌肉，缓解压力，同时可以从中体悟生活智慧、人生哲理\n- 和自己信任的人谈一谈：和信任的人倾诉、谈心，可以舒缓紧张感，在增进信任感的同时获得心理的支持，以及一些具体的经验、建议\n- 考虑并接受最糟糕的结果：预料挫折情境可能带给你的最糟糕的结果，接受它，并且想办法解决问题\n- 关心、帮助他人：向处境不利的人们提供帮助，可以让眼前的挫折显得不是那么严重\n- 培养某方面的兴趣：选择一项自己感兴趣的技艺，加以培养和发展，成为这方面的专家。有了这项自信的技能，你自然就能重拾信心了","id":"g1_daofa_u019","semester":"upper"},{"chapter":"第四单元 生命的思考","name":"感受生命的意义","formula":"人为什么活着，怎样的一生是值得的，生命是独特的，生命意义是具体的","explanation":"【生命的追问】\n1. 人为什么活着？为了学习，为了养育后代，为了帮助他人……人们的回答也许各不相同。对于有些人来说，生活本身的丰富多彩和生命无穷的奥秘已经是一个令人满意的答案。但是，对有些人而言，是为了让生命有意义，他们认为探索这个问题是有必要的。\n2. 怎样的一生是值得的？能够活出自己的人生，自食其力，实现自我价值，这样的一生是值得的；当别人需要帮助时，付出自己的爱心，无论大小，自愿承担责任，这样的一生是值得的；能够将个人理想与国家发展、民族复兴和人类命运结合起来，这样的一生是值得的。\n\n【发现我的生命】\n1. 探索生命意义，是人类生命的原动力之一。只有人类才可能驾驭自己的生活，选择自己的人生道路。\n2. 生命是独特的，生命意义是具体的。每个人的生活不尽相同，我们都是在自己的生活经历中一点一点地建构自己，形成人们所说的\"我的人生\"。\n3. 生命的意义需要自己发现和创造。我想要过怎样的生活？我该如何创造我想要的生活？通过认真地审视这些问题，我们会更加明晰生命的意义。","id":"g1_daofa_u020","semester":"upper"},{"chapter":"第四单元 生命的思考","name":"活出生命的精彩","formula":"生命是一个逐渐丰富的过程，生命拒绝冷漠，伟大在于创造和贡献，平凡的生命也能创造伟大","explanation":"【贫乏与充盈】\n1. 每个生命都会在生活中展现千姿百态。人们对待生活的不同态度，会影响生命的质量。\n2. 有的人把自己封闭起来，不愿也不善于感受生活中的美好，不敢也无力去面对生活的困境与难题，狭小的世界限制了生命的生长；有的人缺乏生活目标，无所事事，在时光流逝中生命日益空虚。\n3. 生命是一个逐渐丰富的过程。在同样的时间里，也有人热爱学习，乐于实践，在探索中扩展生活的阅历，让生命充满色彩与活力。当我们敞开自己的胸怀，不断尝试与他人、与社会、与自然建立联系时，生命中的道德体验就会不断丰富，对生命的感受力、理解力就会不断增强。生命得到滋养，也因此而一点点充盈起来。\n\n让生命充盈的方法：\n- 阅读好书。\n- 专注地做自己热爱和有兴趣的事情。\n- 走出家门，了解他人不同方式的生活。\n- 外出旅行，看看不同的风土人情。\n……\n\n【冷漠与关切】\n1. 人与人在相互依存和彼此关切中感受温暖，传递温暖。所有的冷漠也许都有理由，然而，没有人愿意遭遇到冷漠。生命拒绝冷漠。\n2. 我们不仅要关注自身的发展，而且要关切他人的生命，设身处地地思考并善待他人。我们用心对待自己和他人，不仅能将自己的生命照亮，而且可以温暖他人、照亮他人，甚至温暖世界、照亮世界。\n3. 让我们用真诚、热情、给予去感动、改变他人，消融冷漠，共同营造一个互信、友善、和谐的社会。\n\n【平凡与伟大】\n1. 伟大在于创造和贡献。一个人的伟大，不在于其地位的高低，而在于他能够运用自身的品德、才智和劳动，创造出比自己有限的生命更长久的、不平凡的社会价值，为我们留下宝贵的物质财富和精神财富，影响着一代又一代的人。\n2. 与伟人相比，更多的人可能是默默无闻的。这样的生命有没有意义呢？当人们为生活而努力，日复一日，年复一年，面对生活的艰难考验，不放弃、不懈怠，为家庭的美好和社会的发展贡献自己的力量时，就是在用认真、勤劳、善良、坚持、责任、勇敢书写自己的生命价值。\n3. 生命虽然平凡，却也时时创造伟大。当我们将个体生命和他人的、集体的、民族的、国家的甚至人类的命运联系在一起时，生命便会从平凡中闪耀出伟大。","id":"g1_daofa_u021","semester":"upper"},{"chapter":"第一单元 成长的节拍","name":"中学序曲","formula":"中学生活把我们带进一个别样的天地，我们站在一个新的起点上","explanation":"【新的起点】\n1. 金秋九月，我们告别小学，满怀希望跨进中学校园，我们有了一个新的名字——中学生！\n2. 中学生活把我们带进一个别样的天地：富有挑战的课程，新奇的实验器材，丰富多彩的社团，新校园、新老师、新同学……我们站在一个新的起点上。\n3. 成长中的每个阶段都有独特的价值和意义。中学时代是人生发展的一个新阶段。这段时间并不是很长，却可以为我们的一生奠定重要基础。\n\n【成长的礼物】\n1. 中学生活，对我们来说意味着新的机会和可能，也意味着新的目标和挑战。这些都是生命馈赠给我们的成长礼物。\n2. 中学生活提供了发展自我的多种机会。集体生活，涵养我们的品格，丰富我们的个性；新的课程，引领我们探索新的知识领域；丰富多彩的社团活动，给我们提供发展兴趣的平台；各种各样的社会实践，为我们打开认识社会之门……\n3. 进入中学，新的目标和要求激发着我们的潜能，激励着我们不断实现自我超越。\"苟日新，日日新，又日新。\"我们似乎每天都有做\"最好的我\"的生命冲动。\n4. 在新的环境中，我们有机会改变在父母、老师和同学心目中那些不够完美的形象，重新塑造一个\"我\"：越来越有活力，能坚持，有韧劲；越来越坚强，会合作，能包容；越来越上进，敢于表达，超越自我。\n5. 中学生活的序幕刚刚拉开，面对各种可能与挑战，我们要珍视当下，把握机遇，从点滴做起，为美好明天付出不懈的努力。","id":"g1_daofa_u022","semester":"upper"},{"chapter":"第一单元 成长的节拍","name":"学习伴成长","formula":"中学阶段，学习是我们的重要任务，学习没有终点，终生都需要学习","explanation":"【打开学习之窗】\n1. 中学阶段，学习是我们的重要任务。初中阶段的学习，包括知识的获取，还包括各种能力的培养。例如，学会运用所学知识思考、处理生活中遇到的问题，学习如何与不同个性的人相处，等等。\n2. 学习不仅仅局限在学校，我们所看，我们所听，我们所尝，我们所触，我们所做，都可以是学习。学习不仅表现为接受和掌握，而且表现为探究、发现、体验和感悟。我们可以从一切经历中学习：学习思考，认识世界，关爱他人，遵守规则……\n3. 学习需要自觉、主动的态度。假如我们没有积极学习的态度，即使身处学校，也可能收获不多。带着学习的心态，生活中的点点滴滴都是学习。\n\n【学习点亮生命】\n1. 学习，不仅让我们能够生存，而且让我们能够拥有更充实的生活。学习，打开了生命的视窗，让我们面前的世界变得更广阔、更精彩；学习，拓展了新的通道，让我们体验不同的生活方式；学习，改变了思维方式和行为，提升我们的能力和智慧；学习，带来了更多的选择，让我们变得更加独立和自由；等等。\n2. 学习就是给生命添加养料。如果不学习，人的生命将会枯萎。\n3. 学习点亮我们心中的明灯，激发前进的动力。在学习中，我们分享生命经验，获得成长，同时也可以帮助他人，服务社会，为幸福生活奠基。\n4. 学习没有终点。我们终生都在学习，终生都需要学习，即使离开了学校，也要不断地学习，不断地充实自己。只有善于抓住和利用各种机会去学习，才能适应不断发展的社会。","id":"g1_daofa_u023","semester":"upper"},{"chapter":"第二单元 友谊的天空","name":"友谊与成长同行","formula":"朋友对我们的影响很大，友谊让我们更深刻地体悟生命的美好","explanation":"【我的朋友圈】\n1. 上初中了，你的朋友圈发生了什么变化？是扩大了，还是变小了？是交往的内容更丰富了，还是交往更加深入了？\n2. 伙伴、同学、朋友，成为我们生命中越来越重要的部分。\n3. 对友谊的渴望，让我们相互靠近。在与朋友的交往中，有欢笑，也有泪水；有甜蜜，也有苦涩。经常对自己的朋友关系做些梳理，我们可以更好地觉察自己对友谊的真正期待，逐渐学会处理交友中遇到的各种问题。\n\n【友谊的力量】\n1. 朋友对一个人的影响很大，我们的言谈举止、兴趣爱好甚至性格等都或多或少地受到朋友的影响。\n   朋友正在做的事情，我们会关注；朋友觉得有趣的事情，我们会去尝试。与乐观开朗的朋友相处，我们会变得豁达；与乐于助人的朋友相处，我们会变得富有爱心。\n2. 朋友，见证了我们一起走过的成长历程，我们需要真诚友善的朋友。\n   因为朋友，我们少了几分孤独，多了些许温暖，活得更加自在；因为朋友，我们感受到自身的价值，多了一份对自己的欣赏；因为朋友，我们学会了更好地与人相处，享受交往的快乐。\n3. 与正直、诚信和见识广的人交朋友，是有益的。朋友丰富了我们的生活经验，友谊让我们更深刻地体悟生命的美好。","id":"g1_daofa_u024","semester":"upper"},{"chapter":"第三单元 师长情谊","name":"师生之间","formula":"老师是我们学习的指导者和成长的引路人，教学相长，亦师亦友","explanation":"【了解教师职业】\n1. 教师是一个古老的职业。\"师者，所以传道授业解惑也。\"老师是我们学习的指导者和成长的引路人。\n2. 在现代社会，教师已发展为一种专门职业。教师是履行教育教学职责的专业人员，承担教书育人的使命。\n3. 今天的教师要努力成为有理想信念、有道德情操、有扎实学识、有仁爱之心的好教师。\n\n【风格不同的老师】\n1. 由于年龄、学识、阅历、性格、情感与思维方式等差异，每位老师解决问题的方法和表达方式不同，由此呈现出不同的风格。\n2. 我们要承认老师之间的差异，接纳每位老师的不同，他们身上都有值得我们学习的地方。\n3. 无论什么风格的老师都应该受到尊重。\n\n【教学相长】\n1. 教与学是师生相互陪伴、相互促进、共同成长的过程。\n2. 面对老师的引领和指导，主动参与、勤学好问的态度有助于我们与老师相互交流。\n3. 学会正确对待老师的表扬和批评，是我们成长的重要内容。\n\n【亦师亦友】\n1. 学生乐于学习，老师寓教于乐，师生之间彼此尊重、相互关心、携手共进，是师生交往的良好状态。\n2. 彼此尊重，是我们与老师建立良好关系的开始。\n3. 在平等相待、相互促进的师生交往中，我们可以和老师成为朋友。","id":"g1_daofa_u025","semester":"upper"},{"chapter":"第三单元 师长情谊","name":"亲情之爱","formula":"家是我们身心的寄居之所，是心灵的港湾，孝亲敬长是传统美德也是法律义务","explanation":"【家的意味】\n1. 家庭是由婚姻关系、血缘关系或收养关系结合成的亲属生活组织。\n2. 家是我们身心的寄居之所。我们的生命是父母给予的，我们的成长也离不开家庭的哺育和支持。\n3. 家是我们心灵的港湾。家里有亲人，家中有亲情。亲情，激励我们奋斗拼搏，让我们的心灵有所依靠。\n4. 在中国人的心目中，家是代代传承、血脉相连的生活共同体，是甜蜜、温暖、轻松的避风港。\n\n【中国人的\"家\"】\n1. 在中国的家庭文化中，\"孝\"是重要的精神内涵。\n2. 孝亲敬长是中华民族的传统美德，也是每个中国公民的法律义务。\n3. 尽孝在当下。从现在开始，我们就应该用行动表达孝敬之心。\n   尊敬、倾听、感恩。\n\n【爱在家人间】\n1. 每个人的内心都有一份对家人割舍不断的情感，这就是家庭中的亲情之爱。\n2. 每个家庭的亲情表现不尽相同。\n3. 进入初中的我们，与家人的关系发生了微妙的变化，亲子之间的碰撞增多了。\n4. 作为两代人，由于我们与父母在心智、学识、经历等方面差异较大，对问题的理解、感受等方面必然存在差异，冲突难以避免。\n5. 爱是需要呵护的。互动沟通的技巧和应对冲突的智慧，是亲子之间爱的润滑剂。\n\n【让家更美好】\n1. 现代家庭的结构、规模、观念等都发生了不同程度的变化。\n2. 家和万事兴。家庭成员之间和睦相处是家庭美满幸福的重要条件。\n3. 有效交流和沟通，可以增进理解，化解矛盾和冲突。\n4. 以良好的心态面对家庭的变化，才能让亲情更浓，让我们的家庭更和睦。","id":"g1_daofa_u026","semester":"upper"},{"chapter":"第四单元 生命的思考","name":"探问生命","formula":"生命来之不易，是独特的、不可逆的、短暂的，生命有接续","explanation":"【生命有时尽】\n1. 生命来之不易。生命是大自然的奇迹，每个人的生命是在无数的偶然性中产生的。\n2. 生命是独特的。每个人有不同的人生道路，每个人的生命都不可替代。\n3. 生命是不可逆的。生命的时光一去不复返。\n4. 生命也是短暂的。在时间的长河中，个人的生命很短暂。\n5. 我们每个人都难以抗拒生命发展的自然规律。死亡是人生不可避免的归宿，它让我们感激生命的获得。向死而生，让我们拥有一份好好活着的感动，从容面对生命的不可预知，更加热爱生命。\n\n【生命有接续】\n1. 在历史的长河中，个人的生命虽然短暂，但正是一代又一代的个体生命实现了人类生命的接续。\n2. 生命的接续，使得每个人的生命不仅仅是\"我\"的生命，还是\"我们\"的生命。\n3. 在生命的接续中，人类生命不断发展，人类的精神文明也不断积累和丰富。\n   生命对于我们而言，不仅仅是身体的生命，还包括社会关系中的生命、精神信念上的生命。\n\n【敬畏生命】\n1. 生命是脆弱的、艰难的，也是坚强的、有力量的，是崇高的、神圣的。我们对生命要有一种敬畏的情怀。\n2. 生命价值高于一切。\n3. 生命至上，并不意味着只看到自己生命的重要性，我们也必须承认别人的生命同样重要。\n4. 敬畏生命，让我们从对自己生命的珍惜走向对他人生命的关怀。\n5. 我们只有不漠视自己的生命，也不漠视他人的生命，谨慎地对待生命关系、处理生命问题，才会尊重、关注、关怀和善待身边的每一个人。\n6. 我们对生命的敬畏并不是谁的命令，而是内心的自愿选择。","id":"g1_daofa_u027","semester":"upper"},{"chapter":"第四单元 生命的思考","name":"珍视生命","formula":"守护生命首先要关注自己的身体，还要养护精神，增强生命的韧性","explanation":"【守护生命】\n1. 守护生命首先要关注自己的身体。关心身体的状况，养成健康的生活方式，是一种对生命负责任的态度。\n2. 成长中的我们，应该学会爱惜自己的身体。不能做出过激的行为，甚至伤害自己的身体。\n3. 我们需要增强安全意识、自我保护意识，提高安全防范能力，掌握一些基本的自救自护方法。\n\n【养护精神】\n1. 我们每个人活着，除了要关注生理需要和身体健康，还要过精神生活，满足精神需求。\n2. 我们的精神发育，需要物质的支持，但不完全受物质生活条件和外部环境的制约。\n3. 作为中国人，我们每个人的精神生命都流淌着民族文化的血脉，离不开优秀传统文化的滋养。\n\n【增强生命的韧性】\n1. 生活的道路并不总是平坦的，难免会遇到一些阻碍、失利乃至失败。这些阻碍、失利和失败，就是人们常说的挫折。\n2. 面对不同的挫折，不同的人会有不同的情绪感受和行为反应，主要原因是人们对挫折的认识和态度不同。\n3. 面对挫折，我们可能会感到失落、焦虑、难过、愤怒、不满等。我们需要及时调整自己，正确对待挫折。\n4. 生活中的挫折是我们生命成长的一部分。\n5. 面对挫折，发掘自身的生命力量，我们可以逐渐培养自己面对困难的勇气和坚强的意志。\n6. 发掘自身的力量并不排斥借助外力。学会与他人建立联系，向他人寻求帮助，获得他人的支持和鼓励，有助于增强我们的生命力量。","id":"g1_daofa_u028","semester":"upper"},{"chapter":"第一单元 成长的节拍","name":"成长的礼物","formula":"中学生活提供了发展自我的多种机会，新的目标和要求激发着我们的潜能","explanation":"【新的机会和可能】\n1. 中学生活，对我们来说意味着新的机会和可能，也意味着新的目标和挑战。这些都是生命馈赠给我们的成长礼物。\n2. 中学生活提供了发展自我的多种机会：\n   - 集体生活，涵养我们的品格，丰富我们的个性\n   - 新的课程，引领我们探索新的知识领域\n   - 丰富多彩的社团活动，给我们提供发展兴趣的平台\n   - 各种各样的社会实践，为我们打开认识社会之门\n\n【新的目标和挑战】\n1. 进入中学，新的目标和要求激发着我们的潜能，激励着我们不断实现自我超越。\n   \"苟日新，日日新，又日新。\"我们似乎每天都有做\"最好的我\"的生命冲动。\n2. 在新的环境中，我们有机会改变在父母、老师和同学心目中那些不够完美的形象，重新塑造一个\"我\"：\n   - 越来越有活力，能坚持，有韧劲\n   - 越来越坚强，会合作，能包容\n   - 越来越上进，敢于表达，超越自我\n\n【把握机遇】\n\"千里之行，始于足下。\"中学生活的序幕刚刚拉开，面对各种可能与挑战，我们要珍视当下，把握机遇，从点滴做起，为美好明天付出不懈的努力。","id":"g1_daofa_u029","semester":"upper"},{"chapter":"第一单元 成长的节拍","name":"做学习的管理者","formula":"学会自主学习、提高学习效率、科学安排时间","explanation":"【学会学习】\n1. 学会学习，需要发现并保持对学习的兴趣。\n   \"知之者，不如好之者；好之者，不如乐之者。\"有了学习兴趣，学习可以成为艰苦却十分快乐的探索之旅。\n2. 学会学习，需要掌握科学的学习方法。\n   学习意味着要善于从生活中汲取养料，掌握一些基本的学习策略，合理安排学习时间，形成良好的学习习惯，不断提升自己的学习能力。\n3. 学会学习，还意味着要善于运用不同的学习方式达成目标，比如合作学习、探究学习等。\n\n【做学习的管理者】\n1. 学会自主学习：逐步减少对父母和老师的依赖，增强学习的目的性、主动性，成为一个自主的学习者。\n2. 提高学习效率：学习的过程包括很多环节，学习的效率就蕴含在各个学习环节之中。只有把握好每个环节的质量，课前认真预习，上课时专心听讲，课后及时复习，才能从整体上提高学习效率。\n3. 科学安排时间：随着初中学习科目的增多，难度在加深，科学地安排学习时间就显得十分重要。如果对自己的学习时间有一个合理的规划，有计划地学习，我们就可以做到心中有数，从容不迫。\n\n【适合自己的方法就是最好的方法】\n不同学科的学习方法不尽相同，学习方法也因人而异，适合自己的方法就是最好的方法。这就需要我们在学习的过程中，不断摸索，找到适合自己的学习方法。","id":"g1_daofa_u030","semester":"upper"},{"chapter":"第一单元 青春时光","name":"青春的邀约","formula":"青春期是人一生中身体发育的重要时期，要悦纳生理变化，直面矛盾心理","explanation":"【青春期的身体变化】\n1. 伴随着身体外形的明显变化，我们开始进入青春期。青春期是人一生中身体发育的重要时期。\n2. 青春期的身体变化主要表现在三个方面：身体外形的变化，内部器官的完善，性机能的成熟。\n3. 受遗传、营养、锻炼等因素的影响，我们身体的发育情况各不相同。\n4. 我们要正视身体的变化，欣然接受青春花蕾的绽放。\n5. 在追求形体、仪表等外在美的同时，我们也要提高品德和文化修养，体现青春的内在美。\n\n【直面矛盾心理】\n1. 伴随着生理发育，我们的认知能力得到发展，自我意识不断增强，情感世界愈加丰富。\n2. 青春期矛盾心理的主要表现：反抗与依赖、闭锁与开放、勇敢与怯懦。\n3. 青春期的矛盾心理有时让我们烦恼，但也为我们的成长提供了契机。\n4. 调节心理矛盾的方法：参加集体活动、求助他人、培养兴趣爱好转移注意力、学习自我调节。","id":"g1_daofa_l001","semester":"lower"},{"chapter":"第一单元 青春时光","name":"悄悄变化的我","formula":"悦纳生理变化，直面矛盾心理，青春期身体和心理都会发生显著变化","explanation":"【悦纳生理变化】\n1. 进入青春期，我们的身体变化主要表现在三个方面：身体外形的变化，内部器官的完善，性机能的成熟。\n2. 我们要正视身体的变化，欣然接受青春花蕾的绽放。\n3. 不因自己的生理变化而自卑，是我们对自己的尊重；不嘲弄同伴的生理变化，是我们对同伴的尊重。\n4. 在追求形体、仪表等外在美的同时，也要提高品德和文化修养，体现青春的内在美。\n\n【直面矛盾心理】\n1. 青春期矛盾心理的主要表现：\n   - 反抗与依赖：既表现出成人感，又依赖父母\n   - 闭锁与开放：既封闭自己，又渴望交往\n   - 勇敢与怯懦：有时勇敢，有时怯懦\n2. 调节心理矛盾的方法：\n   - 参加集体活动，在集体的温暖中放松自己\n   - 通过求助他人，学习化解烦恼的方法\n   - 通过培养兴趣爱好转移注意力\n   - 学习自我调节，成为自己的\"心理保健医生\"","id":"g1_daofa_l002","semester":"lower"},{"chapter":"第一单元 青春时光","name":"成长的不仅仅是身体","formula":"学会独立思考，培养批判精神，开发创造潜力","explanation":"【学会独立思考】\n1. 生理发育是青春成长的重要信号，与之相随的还有思想和精神方面的变化。\n2. 步入青春期，我们的独立意识不断发展，对问题开始有更多的见解。\n3. 独立思考并不等同于一味追求独特，而是表现为不人云亦云，有自己独到的见解，同时能接纳他人合理、正确的意见。\n\n【培养批判精神】\n1. 思维的批判性，表现在对事情有自己的看法，并且敢于表达不同观点，敢于对不合理的事情说\"不\"，敢于向权威挑战。\n2. \"学贵有疑\"，在学习中，我们需要批判的精神和勇气。\n3. 思维的批判性有助于我们发现问题、提出问题，并从不同角度思考问题，探索解决方案。\n4. 批判的技巧：批判只针对事情本身，而不是对人的攻击；批判要具有一定的建设性。\n\n【开发创造潜力】\n1. 青春的我们思想活跃，感情奔放，朝气蓬勃，充满对未来的美好憧憬，拥有改变自己、改变世界的创造潜力。\n2. 创造离不开实践。人世间的一切成就、一切幸福都离不开劳动和创造。\n3. 社会实践是创造的源泉，给了我们广阔的创造空间，激发我们创造的热情。","id":"g1_daofa_l003","semester":"lower"},{"chapter":"第一单元 青春时光","name":"青春的心弦","formula":"男生女生各有优势，要正确看待性别差异，慎重对待青春期情感","explanation":"【男生女生】\n1. 到了青春期，男生女生在生理方面的差异会更加明显。\n2. 男生女生的生理性别特征是与生俱来的，对于青春期特有的生理变化，我们应平静而欣然地接受。\n3. 正确看待性别差异：男生女生拥有各自的性别优势。欣赏对方的优势，有助于我们不断完善自己。\n4. 男生女生应相互理解，相互帮助，相互学习，共同进步。\n\n【青春萌动】\n1. 在异性面前，我们有自我表现的欲望，更加在意自己的形象，渴望得到异性的肯定和接受。这是青春期心理萌动的表现。\n2. 与异性相处，有助于我们了解异性的思维方式、情感特征。\n3. 与异性交往是我们成长的一个重要方面，也是对我们的考验。只要我们内心坦荡、言谈得当、举止得体，这份友谊就会成为我们青春美好的见证。\n\n【异性情感】\n1. 相遇青春，我们心中开始萌发一些对异性朦胧的情感。这是青春成长中的正常现象。\n2. 在与异性交往的过程中，我们会因为对异性的欣赏、对美好的向往而愉悦，也容易把这种欣赏和向往理解为爱情。其实，这并不是真正的爱情。\n3. 爱情是一种高尚的情感。爱情既意味着欣赏与尊重，更需要责任和能力。\n4. 面对生活中可能出现的朦胧的情感，我们应该慎重对待，理智处理。","id":"g1_daofa_l004","semester":"lower"},{"chapter":"第一单元 青春时光","name":"男生女生","formula":"男生女生拥有各自的性别优势，要欣赏对方优势，相互取长补短","explanation":"【他和她】\n1. 到了青春期，男生女生在生理方面的差异会更加明显。同时，在社会文化的影响下，男生女生在性格特征、兴趣爱好、思维方式等方面，越来越多地表现出各自的特点。\n2. 男生女生的生理性别特征是与生俱来的，对于青春期特有的生理变化，我们应平静而欣然地接受。\n3. 在社会中，人们对性别的认识通常会受到性别刻板印象的影响。\n\n【优势互补】\n1. 男生女生拥有各自的性别优势。欣赏对方的优势，有助于我们不断完善自己。\n2. 我们不仅要认识自己的优势，而且要发现对方的优势，相互取长补短，让自己变得更加优秀。\n3. 不同性别的个体虽然有差别，但是我们不应因自己某一方面的优势而自傲，也不应因自己某一方面的欠缺而自卑。\n4. 男生女生应相互理解，相互帮助，相互学习，共同进步。","id":"g1_daofa_l005","semester":"lower"},{"chapter":"第一单元 青春时光","name":"青春萌动","formula":"青春期心理萌动是正常现象，与异性交往要内心坦荡、言谈得当、举止得体","explanation":"【异性朋友】\n1. 进入青春期，一股从未有过的心潮悄然涌动，带给我们一种特殊的情感体验，这是青春期的心理萌动。\n2. 在异性面前，我们有自我表现的欲望，更加在意自己的形象，渴望得到异性的肯定和接受。\n3. 与异性相处，有助于我们了解异性的思维方式、情感特征。\n4. 与异性交往是我们成长的一个重要方面，也是对我们的考验。\n5. 异性之间的友谊，可能让人敏感、遭到质疑，但只要我们内心坦荡、言谈得当、举止得体，这份友谊就会成为我们青春美好的见证。\n\n【异性情感】\n1. 相遇青春，我们心中开始萌发一些对异性朦胧的情感。这是青春成长中的正常现象。\n2. 在与异性交往的过程中，我们会因为对异性的欣赏、对美好的向往而愉悦，也容易把这种欣赏和向往理解为爱情。其实，这并不是真正的爱情。\n3. 爱情是一种高尚的情感。爱情既意味着欣赏与尊重，更需要责任和能力。\n4. 面对生活中可能出现的朦胧的情感，我们应该慎重对待，理智处理。","id":"g1_daofa_l006","semester":"lower"},{"chapter":"第一单元 青春时光","name":"青春的证明","formula":"青春的探索需要自信，自强可以让我们更自信，行己有耻，止于至善","explanation":"【青春飞扬】\n1. 青春的我们，乐于实践，敢于尝试，希望证明自己；但青春并不意味着肆意放纵，总有一些基本规则不能违反，一些基本界限不能逾越。\n2. 青春的探索需要自信。自信让我们充满激情。有了自信，我们才能怀着坚定的信心和希望，开始伟大而光荣的事业。\n3. 自强，让青春奋进的步伐永不停息。不断克服自己的弱点，战胜自己、超越自己，是自强的重要内容。\n4. 自强，要靠坚强的意志、进取的精神和不懈的坚持。\n\n【青春有格】\n1. \"行己有耻\"：一个人行事，凡自己认为可耻的就不去做。\n   - 我们要知廉耻，懂荣辱；有所为，有所不为。\n   - \"行己有耻\"需要我们有知耻之心，不断提高辨别\"耻\"的能力。\n   - \"行己有耻\"意味着我们能真诚面对自我，闻过即改，知耻而后勇。\n   - \"行己有耻\"要求我们树立底线意识，触碰道德底线的事情不做，违反法律的事情坚决不做。\n   - \"行己有耻\"更需要我们磨砺意志，拒绝不良诱惑，不断增强自控力。\n\n2. \"止于至善\"：是人的一种精神境界，我们应该有自己的格调，有我们的\"至善\"追求。\n   - \"止于至善\"是一种\"虽不能至，心向往之\"的实践过程，是一种向往美好、永不言弃的精神状态。\n   - 每个人都可以从点滴小事做起。\"勿以恶小而为之，勿以善小而不为。\"积少成多，积善成德。\n   - 寻找好的榜样、向榜样学习、汲取榜样的力量。\n   - \"止于至善\"要求我们养成自我省察的习惯。","id":"g1_daofa_l007","semester":"lower"},{"chapter":"第一单元 青春时光","name":"青春飞扬","formula":"青春的探索需要自信，自强让青春奋进的步伐永不停息","explanation":"【成长的渴望】\n1. 在青春的词典里，独立、自由、理想、信念……这些词语具有特别的意义。\n2. 年少气盛，青春的力量在身体里生发，令我们对未来更加憧憬。我们渴望拥有健美的身躯、充实的大脑，渴望自由、渴望飞翔。\n3. 青春的我们拥有无尽的遐想，这令我们兴奋，让我们跃跃欲试。面对青春，每个人会有不同的憧憬，形成不同的理想，规划青春路径，思考自己如何走过青春之路。\n\n【飞翔的力量】\n1. 青春的探索需要自信。自信让我们充满激情。有了自信，我们才能怀着坚定的信心和希望，开始伟大而光荣的事业。\n2. 自信的人有勇气交往与表达，有信心尝试与坚持，能够展现优势与才华，激发潜能与活力，获得更多的实践机会与创造可能。\n3. 自强，让青春奋进的步伐永不停息。不断克服自己的弱点，战胜自己、超越自己，是自强的重要内容。\n4. 自强，要靠坚强的意志、进取的精神和不懈的坚持。\n5. 激荡的青春活力，自信的青春热情，自强的青春态度，给我们插上飞翔的翅膀，助力青春成长！","id":"g1_daofa_l008","semester":"lower"},{"chapter":"第一单元 青春时光","name":"青春有格","formula":"行己有耻，止于至善，青春要有底线和追求","explanation":"【行己有耻】\n1. 青春并不意味着肆意放纵，总有一些基本规则不能违反，一些基本界限不能逾越。\n2. 孔子说：\"行己有耻。\"意思是说，一个人行事，凡自己认为可耻的就不去做。\n3. 我们要知廉耻，懂荣辱；有所为，有所不为。\n4. \"行己有耻\"需要我们有知耻之心，不断提高辨别\"耻\"的能力。\n5. \"行己有耻\"意味着我们能真诚面对自我，闻过即改，知耻而后勇。\n6. \"行己有耻\"要求我们树立底线意识，触碰道德底线的事情不做，违反法律的事情坚决不做。\n7. \"行己有耻\"更需要我们磨砺意志，拒绝不良诱惑，不断增强自控力。\n\n【止于至善】\n1. \"大学之道，在明明德，在亲民，在止于至善。\"\n2. \"止于至善\"是人的一种精神境界，我们应该有自己的格调，有我们的\"至善\"追求。\n3. \"止于至善\"是一种\"虽不能至，心向往之\"的实践过程，是一种向往美好、永不言弃的精神状态。\n4. 每个人都可以从点滴小事做起。\"勿以恶小而为之，勿以善小而不为。\"积少成多，积善成德。\n5. 善于寻找好的榜样、向榜样学习、汲取榜样的力量。\n6. \"止于至善\"要求我们养成自我省察的习惯。检视自身的不足，不盲目自责，积极调整自己，通过自省和慎独，端正自己的行为。","id":"g1_daofa_l009","semester":"lower"},{"chapter":"第二单元 做情绪情感的主人","name":"青春的情绪","formula":"人的情绪是复杂多样的，情绪影响着我们的观念和行动","explanation":"【情绪面面观】\n1. 人的情绪是复杂多样的，除了常见的喜、怒、哀、惧等基本情绪，还有害羞、焦虑、厌恶和内疚等复杂情绪。各种各样的情绪丰富了我们的生活。\n2. 我们的情绪受多方面因素影响。例如，个人的生理周期、对某件事情的预期、周围的舆论氛围、自然环境等。\n3. 情绪的作用非常神奇，影响着我们的观念和行动。它可能激励我们克服困难、努力向上，也可能让我们因为某个小小的挫败而止步不前。\n\n【情绪的青春色调】\n1. 进入青春期，随着身体发育和生活经验不断丰富，我们的情绪也发生着变化，表现出青春期的情绪特点。\n2. 青春期的情绪特点：反应强烈、波动与固执、细腻性、闭锁性、表现性。\n3. 青春期的情绪特点体现了青春的活力，它带给我们不同的感受。善于激发正面的情绪感受，可以让我们的生活更加绚烂多彩。\n4. 青春期的情绪也包括烦恼和担忧。学习积极面对这些负面情绪，同样是我们成长过程中需要经历的。\n\n【情绪表达】\n1. 人与人之间的情绪会相互感染。即使没有语言的交流，一个人的表情、声调、姿态和动作所表达的情绪，也会影响周围的人。\n2. 情绪的表达不仅与自己的身心健康有关，而且关乎人际交往。\n3. 在人际交往中，我们需要了解自己的情绪，接受它们，并学会以恰当的方式表达出来。","id":"g1_daofa_l010","semester":"lower"},{"chapter":"第二单元 做情绪情感的主人","name":"情绪面面观","formula":"人的情绪是复杂多样的，基本情绪包括喜、怒、哀、惧","explanation":"【情绪的种类】\n1. 人的情绪是复杂多样的，除了常见的喜、怒、哀、惧等基本情绪，还有害羞、焦虑、厌恶和内疚等复杂情绪。\n2. 各种各样的情绪丰富了我们的生活。\n\n【影响情绪的因素】\n1. 我们的情绪受多方面因素影响。例如：\n   - 个人的生理周期\n   - 对某件事情的预期\n   - 周围的舆论氛围\n   - 自然环境等\n2. 随着周围情况的变化，我们的情绪也经常变化。\n\n【情绪的作用】\n1. 情绪的作用非常神奇，影响着我们的观念和行动。\n2. 它可能激励我们克服困难、努力向上。\n3. 也可能让我们因为某个小小的挫败而止步不前。\n\n【青春期的情绪特点】\n1. 进入青春期，随着身体发育和生活经验不断丰富，我们的情绪也发生着变化，表现出青春期的情绪特点。\n2. 青春期的情绪特点包括：反应强烈、波动与固执、细腻性、闭锁性、表现性。\n3. 青春期的情绪特点体现了青春的活力，它带给我们不同的感受。善于激发正面的情绪感受，可以让我们的生活更加绚烂多彩。","id":"g1_daofa_l011","semester":"lower"},{"chapter":"第二单元 做情绪情感的主人","name":"情绪的管理","formula":"学会合理表达情绪，掌握调节情绪的方法","explanation":"【情绪表达】\n1. 人与人之间的情绪会相互感染。即使没有语言的交流，一个人的表情、声调、姿态和动作所表达的情绪，也会影响周围的人。\n2. 情绪的表达不仅与自己的身心健康有关，而且关乎人际交往。\n3. 在人际交往中，我们需要了解自己的情绪，接受它们，并学会以恰当的方式表达出来。\n\n【情绪调节】\n1. \"人生路漫漫，有喜也有悲。\"学会合理地调节情绪，使情绪在生理活动、主观体验、外显表情等方面发生一定的变化，有助于我们更好地适应环境。\n2. 持续地处于负面情绪状态，则可能危害我们的身心健康。\n3. 调节情绪的常用方法：\n   - 改变认知评价：换个角度看问题\n   - 转移注意：做自己喜欢的事，转移注意力\n   - 合理宣泄：找合适的场合、用合理的方式发泄情绪\n   - 放松训练：深呼吸、听音乐、做瑜伽等\n4. 运用情绪调节的方法，我们还可以帮助同学、家人改善情绪，使他们保持积极乐观的心境。","id":"g1_daofa_l012","semester":"lower"},{"chapter":"第二单元 做情绪情感的主人","name":"情绪调节","formula":"学会合理调节情绪，掌握改变认知评价、转移注意、合理宣泄、放松训练等方法","explanation":"【情绪调节的原因】\n1. \"人生路漫漫，有喜也有悲。\"学会合理地调节情绪，使情绪在生理活动、主观体验、外显表情等方面发生一定的变化，有助于我们更好地适应环境。\n2. 持续地处于负面情绪状态，则可能危害我们的身心健康。\n3. 学会合理地调节情绪，使情绪在生理活动、主观体验、外显表情等方面发生一定的变化，有助于我们更好地适应环境，成为情绪的主人。\n\n【调节情绪的方法】\n1. 改变认知评价：换个角度看问题，改变对引起情绪事件的看法和评价。\n2. 转移注意：把注意力从引起不良情绪的情境转移到其他事物或活动上去。\n3. 合理宣泄：遇到不良情绪时，通过简单的\"宣泄\"痛痛快快地表达出来，或将不良情绪通过别的途径与方式宣泄出来。\n4. 放松训练：通过身体放松来缓解心理压力和紧张情绪。\n\n【情绪调节的意义】\n1. 有助于我们更好地调节情绪，成为情绪的主人。\n2. 运用情绪调节的方法，我们还可以帮助同学、家人改善情绪，使他们保持积极乐观的心境。\n3. 学会合理地调节情绪，是我们成长过程中需要学习的重要内容。","id":"g1_daofa_l013","semester":"lower"},{"chapter":"第二单元 做情绪情感的主人","name":"我们的情感世界","formula":"情感与情绪紧密相关又有区别，情感是人最基本的精神需求","explanation":"【丰富的情感】\n1. 我们需要与人交往，渴望人与人之间的真挚情谊。我们通过情感来体验生命、体验生活；同时，情感让我们的内心世界更加丰富。\n2. 情感与情绪紧密相关，伴随着情绪反应逐渐积累和发展。我们对某些人或者事物的情绪，随着时间的推移形成比较稳定的倾向，就可能产生某种情感。\n3. 情感与情绪也有区别。情绪是短暂的、不稳定的，会随着情境的改变而变化；情感则是我们在生活中不断强化、逐渐积累的，相对稳定。\n4. 与情绪一样，我们的情感也是复杂的。其中，有基础性情感，如安全感；有高级情感，如道德感。有正面的体验，如爱的情感；有负面的体验，如恐惧感；也有两方面混杂的体验，如敬畏感。\n\n【情感的作用】\n1. 在社会生活中，情感是人最基本的精神需求。例如：我们需要基本的安全感、信任感；我们都渴望得到爱与关怀；我们参与社会事务离不开责任感、胜任感；等等。\n2. 情感反映着我们对人和对事的态度、观念，影响我们的判断和选择，驱使我们做出行动。\n3. 情感与我们的想象力、创造力相关。丰富、深刻的情感有助于我们更全面地观察事物，探索未知。\n4. 情感伴随着我们的生活经历不断积累、发展，这正是我们生命成长的体现。","id":"g1_daofa_l014","semester":"lower"},{"chapter":"第二单元 做情绪情感的主人","name":"丰富的情感","formula":"情感与情绪紧密相关又有区别，我们的情感是复杂多样的","explanation":"【情感与情绪的关系】\n1. 联系：情感与情绪紧密相关，伴随着情绪反应逐渐积累和发展。我们对某些人或者事物的情绪，随着时间的推移形成比较稳定的倾向，就可能产生某种情感。\n2. 区别：情绪是短暂的、不稳定的，会随着情境的改变而变化；情感则是我们在生活中不断强化、逐渐积累的，相对稳定。\n\n【情感的种类】\n与情绪一样，我们的情感也是复杂的。\n1. 基础性情感：如安全感\n2. 高级情感：如道德感\n3. 正面的体验：如爱的情感\n4. 负面的体验：如恐惧感\n5. 两方面混杂的体验：如敬畏感\n\n【情感的作用】\n1. 在社会生活中，情感是人最基本的精神需求。\n2. 情感反映着我们对人和对事的态度、观念，影响我们的判断和选择，驱使我们做出行动。\n3. 情感与我们的想象力、创造力相关。丰富、深刻的情感有助于我们更全面地观察事物，探索未知。\n4. 情感伴随着我们的生活经历不断积累、发展，这正是我们生命成长的体现。","id":"g1_daofa_l015","semester":"lower"},{"chapter":"第二单元 做情绪情感的主人","name":"在品味情感中成长","formula":"美好情感促进精神发展，负面情感也有意义，要传递情感正能量","explanation":"【体味美好情感】\n1. 生活中美好的人和事物，让我们身心愉悦，逐渐丰富我们对生活、对人生的美好情感。这些情感表达着我们的愿望，促进我们的精神发展。\n2. 情由心生，它是在人的社会交往、互动中自然引发的，不能强迫。\n3. 我们可以通过阅读、与人交往、参与有意义的社会活动等方式获得美好的情感。\n4. 生活中某些负面的情感体验尽管不那么美好，但对于我们的成长也有意义。例如，羞耻感、焦虑感和挫败感等会带来不舒服、不愉快的负面感受。但是，体验负面感受未必是件坏事，它可以丰富我们的人生阅历，使我们的生命变得更加饱满丰盈。\n5. 学会承受一些负面感受，善于将负面情感转变为成长的助力，也可以让我们从中获得美好的情感体验，不断成长。\n\n【传递情感正能量】\n1. 在情感体验中，我们并不总是被动地接受外部环境的影响，也可以用自己的热情和行动来影响环境。\n2. 我们的情感需要表达、回应，需要共鸣。在与他人的情感交流中，我们可以传递美好的情感，传递生命的正能量。\n3. 我们在生活中不断创造美好的情感体验，在传递情感的过程中不断获得新的感受，使我们的生命更有力量，周围的世界也因为我们的积极情感多一份美好。","id":"g1_daofa_l016","semester":"lower"},{"chapter":"第二单元 做情绪情感的主人","name":"传递情感正能量","formula":"用自己的热情和行动影响环境，在与他人的情感交流中传递正能量","explanation":"【用自己的热情和行动来影响环境】\n1. 在情感体验中，我们并不总是被动地接受外部环境的影响，也可以用自己的热情和行动来影响环境。\n2. 虽然人与人之间的情绪会相互感染，但是我们可以传递积极的情感，用自己的行动去影响身边的人。\n\n【传递美好情感】\n1. 我们的情感需要表达、回应，需要共鸣。在与他人的情感交流中，我们可以传递美好的情感，传递生命的正能量。\n2. 我们在生活中不断创造美好的情感体验，在传递情感的过程中不断获得新的感受，使我们的生命更有力量，周围的世界也因为我们的积极情感多一份美好。\n\n【获得美好情感的方式】\n1. 情由心生，它是在人的社会交往、互动中自然引发的，不能强迫。\n2. 我们可以通过阅读、与人交往、参与有意义的社会活动等方式获得美好的情感。\n3. 学会承受一些负面感受，善于将负面情感转变为成长的助力，也可以让我们从中获得美好的情感体验，不断成长。","id":"g1_daofa_l017","semester":"lower"},{"chapter":"第三单元 在集体中成长","name":"\"我\"和\"我们\"","formula":"集体是人们联合起来的有组织的整体，集体生活成就我","explanation":"【集体生活邀请我】\n1. 集体是人们联合起来的有组织的整体。一般来说，集体的联结度越高，个体感知到的集体温暖就越多。\n2. 在集体中，我们希望被认可和接纳，得到尊重和理解，获得安全感和归属感。\n3. 当集体取得成绩、受到表彰或奖励时，我们可以体验到集体荣誉感。集体荣誉是集体成员共同奋斗的结果，是我们共同的荣誉。\n4. 集体的力量来源于成员共同的目标和团结协作。\n5. 个人的力量是分散的，但在集体中汇聚，就会变得强大；个人的力量是有限的，但通过优化组合可以实现优势互补，产生强大的合力。\n\n【集体生活成就我】\n1. 集体生活可以培养我们负责任的态度和能力。在集体中，每个人有不同的角色，承担不同的职责；我们在认真做事的过程中体现自己的价值，体验责任感，做有担当的人。\n2. 集体生活可以培养我们人际交往的基本态度和能力。在集体中，每个人来自不同的家庭，有不同的生活经历和性格特点，我们在交往中可以学会彼此接纳、尊重、理解和包容，学会友好相处。\n3. 集体生活为我们搭建起与他人、与周围世界交往的平台。在这个平台上，我们展示自己的个性，发展自己的个性，不断认识和完善自我。","id":"g1_daofa_l018","semester":"lower"},{"chapter":"第三单元 在集体中成长","name":"集体生活邀请我","formula":"集体是人们联合起来的有组织的整体，感受集体的温暖和力量","explanation":"【集体的温暖】\n1. 集体是人们联合起来的有组织的整体。一般来说，集体的联结度越高，个体感知到的集体温暖就越多。我们每个人都有过集体生活的情感需要。\n2. 在集体中，我们希望被认可和接纳，得到尊重和理解，获得安全感和归属感。作为集体的一员，我们也散发着自己的光和热，彼此传递关爱和温暖。\n3. 当集体取得成绩、受到表彰或奖励时，我们可以体验到集体荣誉感。这种荣誉感令我们骄傲、自豪，给我们温暖和力量，激励我们不断前进。\n4. 集体荣誉是集体成员共同奋斗的结果，是我们共同的荣誉。\n\n【集体的力量】\n1. 集体并不是成员的简单相加，而是有共同目标、分工明确的整体。集体的力量来源于成员共同的目标和团结协作。\n2. 个人的力量是分散的，但在集体中汇聚，就会变得强大；个人的力量是有限的，但通过优化组合可以实现优势互补，产生强大的合力。\n3. 借助集体的合力，我们得以完成许多单凭一己之力无法完成的事情。\n4. 集体的力量是强大的，在某种程度上可以影响甚至改变一个人。个人在集体生活中会自觉不自觉地产生与集体要求相一致的态度和行为。\n5. 集体有助于我们获得安全感和自信心，也有助于我们学习他人的经验，扩大视野，获得成长。","id":"g1_daofa_l019","semester":"lower"},{"chapter":"第三单元 在集体中成长","name":"集体生活成就我","formula":"集体生活可以涵养品格，发展个性","explanation":"【在集体中涵养品格】\n1. 集体生活可以培养我们负责任的态度和能力。在集体中，每个人有不同的角色，承担不同的职责；我们在认真做事的过程中体现自己的价值，体验责任感，做有担当的人。\n2. 集体生活可以培养我们人际交往的基本态度和能力。在集体中，每个人来自不同的家庭，有不同的生活经历和性格特点，我们在交往中可以学会彼此接纳、尊重、理解和包容，学会友好相处。\n\n【在集体中发展个性】\n1. 集体生活为我们搭建起与他人、与周围世界交往的平台。在这个平台上，我们展示自己的个性，发展自己的个性，不断认识和完善自我。\n2. 每个人的个性特点不同。人与人之间的差异是我们发展和完善个性的\"明镜\"，也是集体生活中重要的学习资源。包容他人的不同，学习他人的优点，有助于我们完善个性。\n3. 实现集体共同目标的过程，也为个人发展提供了条件和可能。作为集体的一员，我们要积极参与共同活动，把握机遇，自主发展，使自己的个性不断丰富。","id":"g1_daofa_l020","semester":"lower"},{"chapter":"第三单元 在集体中成长","name":"共奏和谐乐章","formula":"在集体中，个人利益与集体利益本质上是一致的，要坚持集体主义","explanation":"【个人意愿与集体规则】\n1. 在集体中，每个人都有自己的意愿，集体又必须有一些共同的规则。这些规则能够保证集体的和声更动听。\n2. 当集体规则与我们的个人意愿一致，并且能够保障个人利益时，我们更乐于积极遵守和维护。\n3. 我们有时会感受到集体规则与我们的某些个性化需要之间存在矛盾甚至冲突。这可能基于一方有不正当或不合理的要求，也可能是个人和集体的需要不同。\n4. 面对冲突，我们通常会让个人意愿服从集体的共同要求。理解集体要求的合理性，反思个人意愿的合理性和实现的可能性，我们就可能找到解决冲突的平衡点。\n\n【让和声更美】\n1. 要让集体的和声更美，需要每个人保持单音准确、饱满，在与其他单音组成和声时尽力做好自己，遵守规则，以保持和声的和谐之美。\n2. 对于集体要求中存在的不合理因素，我们可以通过恰当的方式表达自己的意见，提出积极的改进建议。\n3. 在集体中，个人利益与集体利益本质上是一致的。当个人利益与集体利益发生冲突时，应把集体利益放在个人利益之上，坚持集体主义。\n4. 坚持集体主义，不是不关注个人利益，而是在承认个人利益的合理性、保护个人正当利益的前提下，反对只顾自己、不顾他人的极端个人主义。\n5. 无论个人之间有多大的矛盾和冲突，我们都应心中有集体，识大体、顾大局，不得因个人之间的矛盾做有损集体利益的事情。","id":"g1_daofa_l021","semester":"lower"},{"chapter":"第三单元 在集体中成长","name":"单音与和声","formula":"个人意愿与集体规则，个人利益与集体利益，让和声更美","explanation":"【个人意愿与集体规则】\n1. 在集体中，每个人都有自己的意愿，集体又必须有一些共同的规则。这些规则能够保证集体的和声更动听。\n2. 当集体规则与我们的个人意愿一致，并且能够保障个人利益时，我们更乐于积极遵守和维护。\n3. 我们有时会感受到集体规则与我们的某些个性化需要之间存在矛盾甚至冲突。这可能基于一方有不正当或不合理的要求，也可能是个人和集体的需要不同。\n4. 面对冲突，我们通常会让个人意愿服从集体的共同要求。理解集体要求的合理性，反思个人意愿的合理性和实现的可能性，我们就可能找到解决冲突的平衡点。\n\n【让和声更美】\n1. 如果把个人比作单音，集体比作和声，那么，要让集体的和声更美，需要每个人保持单音准确、饱满，在与其他单音组成和声时尽力做好自己，遵守规则，以保持和声的和谐之美。\n2. 随着集体的发展和进步，原有的某些共同要求变得不合时宜，需要适当修改、完善。\n3. 在集体中，个人利益与集体利益本质上是一致的。当个人利益与集体利益发生冲突时，应把集体利益放在个人利益之上，坚持集体主义。\n4. 坚持集体主义，不是不关注个人利益，而是在承认个人利益的合理性、保护个人正当利益的前提下，反对只顾自己、不顾他人的极端个人主义。\n5. 无论个人之间有多大的矛盾和冲突，我们都应心中有集体，识大体、顾大局，不得因个人之间的矛盾做有损集体利益的事情。","id":"g1_daofa_l022","semester":"lower"},{"chapter":"第三单元 在集体中成长","name":"节奏与旋律","formula":"个人节奏与集体旋律，排解角色冲突，反对小团体主义","explanation":"【我在多个集体中】\n1. 我们同时属于多个集体，每个集体都有自己的旋律。在不同的集体中，我们扮演不同的角色，承担不同的责任。\n2. 每个人都有自己的生活节奏，当自己的节奏与集体的旋律和谐时，我们就可以顺利地融入集体；当自己的节奏与集体的旋律存在差异时，为了保持旋律的和谐，我们需要调整自己的节奏。\n3. 当我们面对不同集体中的角色无法统一节奏时，角色之间的冲突就可能给我们带来烦恼。\n\n【排解角色冲突】\n1. 在排解角色冲突带来的烦恼时，我们通常会考虑自己更关注哪个集体，或在其中的角色和责任的重要性，也会考虑自己的兴趣、爱好以及任务的紧迫程度等。\n2. 当遇到班级、学校等不同集体之间的矛盾时，我们应从整体利益出发，自觉地让局部利益服从整体利益，个人利益服从集体利益。\n3. 我们在不断调整自己的节奏中学习过共同生活，在解决不同集体的角色冲突中学习过集体生活，让自己更好地融入集体，感受集体生活带给我们成长的快乐。\n\n【集体中的小群体】\n1. 在集体生活中，一些志趣相投、个性相似，或者生活背景类似的同学，往往自觉或不自觉地形成小群体。\n2. 当小群体的节奏融入集体生活的旋律时，小群体成员就能感受到集体生活的美好，更愿意参与集体的建设。\n3. 小群体内成员之间的友谊如果沾染上江湖义气，这样的小群体往往会将自身利益置于集体利益之上，沦为小团体主义。\n4. 面对小团体主义与集体利益的矛盾和冲突，我们需要\"心怀一把尺子\"，明辨是非，坚持正确的行为，坚持集体主义，反对小团体主义。","id":"g1_daofa_l023","semester":"lower"},{"chapter":"第三单元 在集体中成长","name":"美好集体有我在","formula":"美好集体是民主公正、充满关怀友爱、善于合作、充满活力的","explanation":"【憧憬美好集体】\n1. 集体的愿景：美好集体拥有共同的梦想，向往美好的前景，承担共同的使命，认同正确的价值观，形成一致的目标和追求，这就是集体的愿景。\n2. 愿景是集体的精神动力之源，是推动集体发展的内驱力。共同的愿景引领集体成员团结一致，开拓进取。\n3. 美好集体的特点：\n   - 美好集体是民主的、公正的。\n   - 美好集体是充满关怀与友爱的。\n   - 美好集体是善于合作的。\n   - 美好集体是充满活力的。\n\n【我与集体共成长】\n1. 集体建设有赖于每个成员的自觉愿望和自主行动，需要我们自主建设、自我管理。\n2. 共同确定愿景和目标，让它凝聚每个人的才华和智慧。\n3. 共同商定集体的规则与制度内容，协商确定对组织领导者的品格与才能要求，通过民主程序选举乐于服务集体、有责任心的组织领导者。\n4. 共同创造良好的集体氛围。\n5. 集体的建设需要每个人的智慧和力量。集体的事务需要每个人去分担，事事都要有人做；集体中没有旁观者，人人都要积极参与，每个人都是集体的主人。\n6. 为集体出力，需要每个人从实际情况出发，各尽其能，发挥所长。\n7. 集体荣誉是我们共同的利益和荣誉，需要我们悉心呵护。\n8. 承担责任既是个人有所成就的基础，也是集体发展的必要前提。","id":"g1_daofa_l024","semester":"lower"},{"chapter":"第四单元 走进法治天地","name":"法律在我们身边","formula":"生活与法律息息相关，法律是统治阶级意志的体现，法律具有规范和保护作用","explanation":"【生活与法律息息相关】\n1. 我们在生活中形成的各种社会关系，以及由此产生的矛盾和纠纷，不仅需要依靠道德、亲情、友情来协调，而且需要法律来调整。\n2. 每一部法律都是应生活的需要而制定和颁布的，又对生活加以规范和调整。我们的生活与法律息息相关。\n3. 法律已经深深地嵌入我们的生活之中，渗透到社会的方方面面。作为社会关系的调节器，法律不仅服务于人们当下的生活，而且指导着人们未来的生活。\n4. 法律与我们每个人如影随形，相伴一生。我们一生都享有法律规定的各项权利，同时必须履行法律规定的各项义务。\n\n【法治的脚步】\n1. 原始社会没有法律，人类用习惯来约束自己的行为。随着人类社会的发展，国家产生之后，统治阶级开始有意识地创制法律。\n2. 法律是统治阶级意志的体现，是用来统治国家、管理社会的工具，也是调整社会关系、判断是非曲直、处理矛盾和纠纷的标尺。\n3. 法治是人们共同的生活愿景，也是国家治理现代化的重要标志。\n4. 法治助推中国梦的实现，是实现政治清明、社会公平、民心稳定、国家长治久安的必由之路。\n\n【法律的特征】\n1. 法律是由国家制定或认可的。\n2. 法律是由国家强制力保证实施的。这是法律区别于道德等行为规范的最主要特征。\n3. 法律对全体社会成员具有普遍约束力。","id":"g1_daofa_l025","semester":"lower"},{"chapter":"第四单元 走进法治天地","name":"生活需要法律","formula":"生活与法律息息相关，法治是国家治理现代化的重要标志","explanation":"【生活与法律息息相关】\n1. 我们在生活中形成的各种社会关系，以及由此产生的矛盾和纠纷，不仅需要依靠道德、亲情、友情来协调，而且需要法律来调整。每一部法律都是应生活的需要而制定和颁布的，又对生活加以规范和调整。\n2. 法律已经深深地嵌入我们的生活之中，渗透到社会的方方面面。作为社会关系的调节器，法律不仅服务于人们当下的生活，而且指导着人们未来的生活。\n3. 法律与我们每个人如影随形，相伴一生。我们一生都享有法律规定的各项权利，同时必须履行法律规定的各项义务。法律规定的权利和义务为我们每个人提供了自由生存和发展的空间。\n\n【法治的脚步】\n1. 原始社会没有法律，人类用习惯来约束自己的行为。随着人类社会的发展，国家产生之后，统治阶级开始有意识地创制法律。\n2. 法律是统治阶级意志的体现，是用来统治国家、管理社会的工具，也是调整社会关系、判断是非曲直、处理矛盾和纠纷的标尺。\n3. 法治是人们共同的生活愿景，也是国家治理现代化的重要标志。法治就是依法对国家和社会事务进行治理，强调依法治国、法律至上，要求任何组织和个人都要服从法律，遵守法律，依法办事。\n4. 法治助推中国梦的实现，是实现政治清明、社会公平、民心稳定、国家长治久安的必由之路。\n5. 党的十八届四中全会提出了全面推进依法治国的总目标，即建设中国特色社会主义法治体系，建设社会主义法治国家。","id":"g1_daofa_l026","semester":"lower"},{"chapter":"第四单元 走进法治天地","name":"法律保障生活","formula":"法律由国家制定或认可，由国家强制力保证实施，对全体社会成员具有普遍约束力","explanation":"【法律的特征】\n1. 法律是由国家制定或认可的。经过一定的法律程序制定和认可，是国家创制法律的两种基本形式。\n2. 法律是由国家强制力保证实施的。法律的实施以强大的国家力量作后盾，而其他行为规范主要依靠社会舆论、信念、习俗、教育和行政等力量保证实施。这是法律区别于道德等行为规范的最主要特征。\n3. 法律对全体社会成员具有普遍约束力。在法治社会里，公民在法律面前一律平等，任何人都没有超越法律的特权。\n\n【法律的作用】\n1. 法律规范着全体社会成员的行为，保护着我们的生活，为我们的成长和发展创造安全、健康、有序的社会环境。\n2. 法律规定我们应该享有的权利，应该履行的义务。法律也为我们评判自己和他人的行为提供了准绳，指引、教育人向善。\n3. 法律通过解决纠纷和制裁违法犯罪，惩恶扬善、伸张正义，维护我们的合法权益。\n\n【道德与法律的关系】\n1. 区别：法律是由国家制定或认可的，靠国家强制力保证实施，对全体社会成员具有普遍约束力；道德依靠社会舆论、信念、习俗等力量保证实施。\n2. 联系：我国法律和社会主义道德互相配合、互相促进、互相补充。凡法律所禁止的行为，都是社会主义道德所谴责的行为；有许多法律上的义务，同时就是社会主义道德的要求。","id":"g1_daofa_l027","semester":"lower"},{"chapter":"第四单元 走进法治天地","name":"法律伴我们成长","formula":"未成年人需要特殊保护，未成年人要学会依法办事，树立法律信仰","explanation":"【法律为我们护航】\n1. 在我国，未成年人是指未满十八周岁的公民。\n2. 未成年人身心发育尚不成熟，自我保护能力较弱，辨别是非能力和自我控制能力不强，容易受到不良因素的影响和不法侵害，需要给予特殊的保护。\n3. 未成年人的生存和发展事关人类的未来，对未成年人给予特殊关爱和保护，已经成为人类的共识。\n4. 家庭保护、学校保护、社会保护和司法保护四位一体，构筑起保障未成年人合法权益的四道防线。\n\n【我们与法律同行】\n1. 国无法不治，民无法不立。法律保障人们的幸福生活。法律保障功能的实现靠我们每个人对法律的尊崇和遵守。\n2. 学会依法办事：\n   - 依法办事，就要遵守各种法律法规。遇到问题需要解决，应当通过法治方式，表达自身合法的诉求和愿望。\n   - 依法办事，就要养成尊法学法守法用法的习惯，逐步成长为社会主义法治的忠实崇尚者、自觉遵守者、坚定捍卫者。\n3. 树立法治意识：\n   - 法治意识是人们对法律发自内心的认可、崇尚、遵守和服从。\n   - 建设法治中国是中国人民的共同事业，人民既是法治的践行者，又是法治的受益者。\n   - 增强法治意识，依法办事，是青少年健康成长的基本要求。青少年不仅是法治中国建设的受益者，更应该成为参与者和推动者。\n4. 树立法律信仰，就是发自内心地尊崇法律、信赖法律、遵守法律和捍卫法律。","id":"g1_daofa_l028","semester":"lower"},{"chapter":"第四单元 走进法治天地","name":"法律为我们护航","formula":"未成年人需要特殊保护，家庭保护、学校保护、社会保护、司法保护四位一体","explanation":"【未成年人需要特殊保护】\n1. 在我国，未成年人是指未满十八周岁的公民。\n2. 未成年人身心发育尚不成熟，自我保护能力较弱，辨别是非能力和自我控制能力不强，容易受到不良因素的影响和不法侵害，需要给予特殊的保护。\n3. 未成年人的生存和发展事关人类的未来，对未成年人给予特殊关爱和保护，已经成为人类的共识。保护未成年人的合法权益，是人类文明和社会进步的应有之义。\n\n【感受法的关爱】\n1. 我国宪法和民法典、义务教育法等法律，都对保护未成年人作出了特别规定；我国还颁布了未成年人保护法、预防未成年人犯罪法等专门法律，给予未成年人特殊关爱和保护。\n2. 保护未成年人，是国家机关、武装力量、政党、人民团体、企业事业单位、社会组织、城乡基层群众性自治组织、未成年人的监护人以及其他成年人的共同责任。\n3. 家庭保护、学校保护、社会保护和司法保护四位一体，构筑起保障未成年人合法权益的四道防线：\n   - 家庭保护：是未成年人保护的基础\n   - 学校保护：是未成年人保护的重要方面\n   - 社会保护：全社会应当树立尊重、保护、教育未成年人的良好风尚\n   - 司法保护：司法机关依法履行职责，对未成年人实施专门保护措施\n4. 国家、社会、学校和家庭应当教育和帮助未成年人维护自己的合法权益，增强自我保护的意识和能力，增强社会责任感。","id":"g1_daofa_l029","semester":"lower"},{"chapter":"第四单元 走进法治天地","name":"我们与法律同行","formula":"学会依法办事，树立法治意识，青少年要成为法治中国建设的参与者和推动者","explanation":"【学会依法办事】\n1. 国无法不治，民无法不立。法律保障人们的幸福生活。法律保障功能的实现靠我们每个人对法律的尊崇和遵守。\n2. 依法办事，就要遵守各种法律法规。遇到问题需要解决，应当通过法治方式，表达自身合法的诉求和愿望。在实现自身利益的过程中，还要自觉维护他人和集体的合法权益。\n3. 依法办事，就要养成尊法学法守法用法的习惯，逐步成长为社会主义法治的忠实崇尚者、自觉遵守者、坚定捍卫者。\n\n【树立法治意识】\n1. 法治意识是人们对法律发自内心的认可、崇尚、遵守和服从。当法律真正铭刻在我们的内心时，才会充分体现自身的价值，发挥其应有的功能。\n2. 建设法治中国是中国人民的共同事业，人民既是法治的践行者，又是法治的受益者。人民权益要靠法律保障，法律权威要靠人民维护。\n3. 增强法治意识，依法办事，是青少年健康成长的基本要求。青少年不仅是法治中国建设的受益者，更应该成为参与者和推动者。\n4. 树立法律信仰，就是发自内心地尊崇法律、信赖法律、遵守法律和捍卫法律。当法律至上成为我们的真诚信仰时，法治精神就会铭刻在我们心中。\n5. 人们道德水平的提高，有利于增强尊法守法的意识和自觉性，有利于促进法治生活方式的形成。\n6. 增强法治意识，依法办事，是青少年健康成长的基本要求。让我们一起努力，做法治中国建设的参与者和推动者！","id":"g1_daofa_l030","semester":"lower"}];

                const isNew = !progress.learnedKnowledge[knowledgeId];
                progress.learnedKnowledge[knowledgeId] = { learnedAt: now };
                
                if (isNew) {
                    progress.dailyStats[today].learnedCount++;
                    if (!progress.dailyStats[today].subjects.includes(subject)) {
                        progress.dailyStats[today].subjects.push(subject);
                    }
                }
                
                progress.lastStudy = {
                    grade, subject, subjectName, semester, semesterName,
                    knowledgeId, knowledgeName, timestamp: now
                };
                
                this.saveProgress(progress);
            },
            
            isLearned(knowledgeId) {
                const progress = this.getProgress();
                return !!(progress.learnedKnowledge && progress.learnedKnowledge[knowledgeId]);
            },
            
            getLastStudy() {
                const progress = this.getProgress();
                return progress.lastStudy || null;
            },
            
            getSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                if (!progress.learnedKnowledge) return { learned: 0, total: 0, percent: 0 };
                const prefix = grade + '_' + subject + '_';
                const learned = Object.keys(progress.learnedKnowledge).filter(k => k.startsWith(prefix)).length;
                const total = DATA_KNOWLEDGE.length;
                const percent = total > 0 ? Math.round((learned / total) * 100) : 0;
                return { learned, total, percent };
            },
            
            clearSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                const prefix = grade + '_' + subject + '_';
                
                if (progress.learnedKnowledge) {
                    Object.keys(progress.learnedKnowledge).forEach(k => {
                        if (k.startsWith(prefix)) {
                            delete progress.learnedKnowledge[k];
                        }
                    });
                }
                
                if (progress.lastStudy && progress.lastStudy.grade === grade && progress.lastStudy.subject === subject) {
                    delete progress.lastStudy;
                }
                
                this.saveProgress(progress);
                return true;
            }
        };

        // URL参数解析
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                grade: 'g1',
                subject: 'daofa',
                semester: params.get('semester') || 'upper'
            };
        }

        const gradeNames = {'g1':'初一','g2':'初二','g3':'初三'};
        const subjectNames = {'daofa':'道德与法治'};
        const semesterNames = {'upper':'上册','lower':'下册'};

        let currentParams = getUrlParams();
        let knowledgeList = [];
        let expandedIds = new Set();
        let currentExample = null;

        const pageTitle = document.getElementById('page-title');
        const pageSubtitle = document.getElementById('page-subtitle');
        const knowledgeListEl = document.getElementById('knowledge-list');
        const emptyStateEl = document.getElementById('empty-state');
        const searchResultsInfo = document.getElementById('search-results-info');
        const searchCountEl = document.getElementById('search-count');
        const searchInput = document.getElementById('search-input');

        function initPage() {
            const {grade, subject, semester} = currentParams;
            pageTitle.textContent = gradeNames[grade] + ' · ' + subjectNames[subject] + ' · ' + semesterNames[semester];
            loadKnowledge();
            updateProgressStat();
            
            const hash = window.location.hash.replace('#', '');
            if (hash && knowledgeList.some(k => k.id === hash)) {
                setTimeout(() => {
                    toggleExpand(hash);
                    const card = document.querySelector('[data-id="' + hash + '"]');
                    if (card) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
        }

        function updateProgressStat() {
            const {grade, subject} = currentParams;
            const learnedInSemester = knowledgeList.filter(k => ProgressManager.isLearned(k.id)).length;
            document.getElementById('progress-learned').textContent = learnedInSemester;
            document.getElementById('progress-total').textContent = knowledgeList.length;
        }

        function loadKnowledge() {
            const {grade, subject, semester} = currentParams;
            knowledgeList = DATA_KNOWLEDGE.filter(k => {
                return k.semester === semester;
            });
            renderKnowledgeList();
        }

        function renderKnowledgeList(items = knowledgeList) {
            if (items.length === 0) {
                knowledgeListEl.innerHTML = '';
                emptyStateEl.classList.remove('hidden');
                return;
            }
            emptyStateEl.classList.add('hidden');
            knowledgeListEl.innerHTML = items.map(item => {
                const isExpanded = expandedIds.has(item.id);
                const isLearned = ProgressManager.isLearned(item.id);
                return '<div class="card knowledge-card ' + (isLearned ? 'learned' : '') + '" data-id="' + item.id + '">' +
                    '<div class="knowledge-header p-4 flex items-center justify-between" onclick="toggleExpand(\'' + item.id + '\')">' +
                        '<div class="flex items-center gap-3 flex-1 min-w-0">' +
                            '<div class="expand-icon ' + (isExpanded ? 'expanded' : 'collapsed') + '">' + (isExpanded ? '−' : '+') + '</div>' +
                            '<div class="flex-1 min-w-0">' +
                                '<h3 class="text-lg font-semibold text-gray-800 flex items-center gap-2">' + escapeHtml(item.name) + (isLearned ? '<span class="text-green-500 text-sm">✓ 已学习</span>' : '') + '</h3>' +
                                '<p class="text-xs text-gray-500 mt-1">' + escapeHtml(item.chapter) + '</p>' +
                            '</div>' +
                        '</div>' +
                        (HAS_EXAMPLES ? '<button class="btn btn-secondary text-sm px-3 py-1" onclick="event.stopPropagation(); showExample(\'' + item.id + '\', \'' + escapeHtml(item.name) + '\')">例题</button>' : '') +
                    '</div>' +
                    '<div id="content-' + item.id + '" class="px-6 pb-4 ' + (isExpanded ? '' : 'hidden') + '">' +
                        (item.formula ? '<div class="mb-4"><h4 class="text-sm font-medium text-gray-500 mb-2">📐 公式</h4><p class="formula-box text-gray-800 text-lg bg-gray-50 p-3 rounded-lg">' + escapeHtml(item.formula) + '</p></div>' : '') +
                        (item.explanation ? '<div><h4 class="text-sm font-medium text-gray-500 mb-2">📝 解释</h4><p class="text-gray-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(item.explanation) + '</p></div>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function toggleExpand(id) {
            const isNewLearn = !expandedIds.has(id) && !ProgressManager.isLearned(id);
            if (expandedIds.has(id)) {
                expandedIds.delete(id);
            } else {
                expandedIds.add(id);
                const {grade, subject, semester} = currentParams;
                const item = knowledgeList.find(k => k.id === id);
                if (item) {
                    ProgressManager.recordStudy(
                        grade, subject, subjectNames[subject],
                        semester, semesterNames[semester],
                        id, item.name
                    );
                }
            }
            const card = document.querySelector('[data-id="' + id + '"]');
            const content = document.getElementById('content-' + id);
            const icon = card.querySelector('.expand-icon');
            const header = card.querySelector('.knowledge-header');
            const title = card.querySelector('h3');
            if (expandedIds.has(id)) {
                content.classList.remove('hidden');
                icon.classList.remove('collapsed');
                icon.classList.add('expanded');
                icon.textContent = '−';
                header.classList.add('expanded');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('expanded');
                icon.classList.add('collapsed');
                icon.textContent = '+';
                header.classList.remove('expanded');
            }
            if (isNewLearn) {
                card.classList.add('learned');
                if (!title.querySelector('.text-green-500')) {
                    title.innerHTML += '<span class="text-green-500 text-sm">✓ 已学习</span>';
                }
                updateProgressStat();
            }
        }

        function expandAll() {
            knowledgeList.forEach(item => expandedIds.add(item.id));
            renderKnowledgeList();
        }

        function collapseAll() {
            expandedIds.clear();
            renderKnowledgeList();
        }

        function searchKnowledge(keyword, list) {
            if (!keyword) return [];
            const lower = keyword.toLowerCase();
            return list.filter(k =>
                k.name.toLowerCase().includes(lower) ||
                k.chapter.toLowerCase().includes(lower)
            );
        }

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                searchResultsInfo.classList.add('hidden');
                renderKnowledgeList();
                return;
            }
            const results = searchKnowledge(keyword, knowledgeList);
            searchCountEl.textContent = results.length;
            searchResultsInfo.classList.remove('hidden');
            renderKnowledgeList(results);
        }

        function showExample(knowledgeId, knowledgeName) {
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === knowledgeId);
            if (examples.length === 0) {
                alert('暂无例题');
                return;
            }
            const example = examples[Math.floor(Math.random() * examples.length)];
            currentExample = {...example, knowledgeId, knowledgeName, ...currentParams};
            document.getElementById('example-knowledge-name').textContent = knowledgeName;
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
            document.getElementById('example-modal').classList.remove('hidden');
        }

        function nextExample() {
            if (!currentExample) return;
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === currentExample.knowledgeId);
            const otherExamples = examples.filter(e => e !== currentExample);
            if (otherExamples.length === 0) {
                alert('没有更多例题了');
                return;
            }
            const example = otherExamples[Math.floor(Math.random() * otherExamples.length)];
            currentExample = {...example, knowledgeId: currentExample.knowledgeId, knowledgeName: currentExample.knowledgeName, ...currentParams};
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
        }

        function addToWrongBook() {
            if (!currentExample) return;
            const item = {
                knowledgeId: currentExample.knowledgeId,
                knowledgeName: currentExample.knowledgeName,
                question: currentExample.question,
                answer: currentExample.answer,
                grade: currentParams.grade,
                subject: currentParams.subject
            };
            if (WrongBookManager.addWrongBook(item)) {
                alert('已加入错题本！');
            } else {
                alert('该题目已在错题本中');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearProgress() {
            const {grade, subject} = currentParams;
            const subjectName = subjectNames[subject];
            var msg = '确定要清除【' + subjectName + '】科目的所有学习进度吗？';
            msg += '\n\n';
            msg += '此操作将清除该科目所有已学习标记，且不可恢复。';
            if (!confirm(msg)) {
                return;
            }
            ProgressManager.clearSubjectProgress(grade, subject);
            updateProgressStat();
            renderKnowledgeList();
            alert('学习进度已清除');
        }

        document.getElementById('btn-expand-all').addEventListener('click', expandAll);
        document.getElementById('btn-collapse-all').addEventListener('click', collapseAll);
        document.getElementById('btn-clear-progress').addEventListener('click', clearProgress);
        searchInput.addEventListener('keyup', e => { if (e.key === 'Enter') performSearch(); });
        searchInput.addEventListener('input', () => { if (!searchInput.value) { searchResultsInfo.classList.add('hidden'); renderKnowledgeList(); }});
        document.getElementById('close-example').addEventListener('click', () => document.getElementById('example-modal').classList.add('hidden'));
        document.getElementById('btn-show-answer').addEventListener('click', () => {
            document.getElementById('example-answer-section').classList.remove('hidden');
            document.getElementById('btn-show-answer').classList.add('hidden');
        });
        document.getElementById('btn-next-example').addEventListener('click', nextExample);
        document.getElementById('btn-add-wrong').addEventListener('click', addToWrongBook);
        document.getElementById('example-modal').addEventListener('click', e => { if (e.target.id === 'example-modal') document.getElementById('example-modal').classList.add('hidden'); });

        initPage();
    </script>
</body>
</html>
