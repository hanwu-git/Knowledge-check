2_physics_037_ex09","knowledge_id":"g2_physics_037","question":"填空题：该定律是在大量经验事实基础上，...，这体现了______的特点。","answer":"答案：牛顿第一定律\n解析：这是牛顿第一定律的重要内容。"},{"id":"g2_physics_037_ex10","knowledge_id":"g2_physics_037","question":"填空题：不受力的物体是不存在的，所以牛...，这体现了______的特点。","answer":"答案：牛顿第一定律\n解析：这是牛顿第一定律的重要内容。"},{"id":"g2_physics_038_ex01","knowledge_id":"g2_physics_038","question":"判断题：惯性：物体保持原来运动状态不变的性质。。（  ）","answer":"答案：正确\n解析：这是惯性的重要概念。"},{"id":"g2_physics_038_ex02","knowledge_id":"g2_physics_038","question":"选择题：下列关于惯性的说法，正确的是（  ）\nA. 完全错误的说法\nB. 性质：\nC. 无关的说法\nD. 另一个错误说法","answer":"答案：B\n解析：性质："},{"id":"g2_physics_038_ex03","knowledge_id":"g2_physics_038","question":"简答题：什么是惯性？","answer":"答案：惯性：物体保持原来运动状态不变的性质。。\n解析：这是惯性的基本定义。"},{"id":"g2_physics_038_ex04","knowledge_id":"g2_physics_038","question":"判断题：误差就是错误，只要认真测量就可以完全避免误差。（  ）","answer":"答案：错误\n解析：误差是测量值与真实值之间的差异，误差只能减小，不能完全避免；错误是可以避免的。"},{"id":"g2_physics_038_ex05","knowledge_id":"g2_physics_038","question":"选择题：下列生活实例中，利用了惯性知识的是（  ）\nA. 用天平测质量\nB. 用刻度尺测长度\nC. 相关的实际应用\nD. 用放大镜看报纸","answer":"答案：C\n解析：惯性在生活中有广泛的应用。"},{"id":"g2_physics_038_ex06","knowledge_id":"g2_physics_038","question":"计算题：根据公式计算相关物理量。","answer":"答案：根据惯性的公式进行计算。\n解析：要注意单位统一，代入公式时要细心。"},{"id":"g2_physics_038_ex07","knowledge_id":"g2_physics_038","question":"填空题：惯性：物体保持原来运动状态不变...，这体现了______的特点。","answer":"答案：惯性\n解析：这是惯性的重要内容。"},{"id":"g2_physics_038_ex08","knowledge_id":"g2_physics_038","question":"填空题：性质：...，这体现了______的特点。","answer":"答案：惯性\n解析：这是惯性的重要内容。"},{"id":"g2_physics_038_ex09","knowledge_id":"g2_physics_038","question":"填空题：一切物体在任何时候都具有惯性...，这体现了______的特点。","answer":"答案：惯性\n解析：这是惯性的重要内容。"},{"id":"g2_physics_038_ex10","knowledge_id":"g2_physics_038","question":"填空题：惯性大小只与质量有关，质量越大...，这体现了______的特点。","answer":"答案：惯性\n解析：这是惯性的重要内容。"},{"id":"g2_physics_039_ex01","knowledge_id":"g2_physics_039","question":"选择题：下列情况中的物体，受到平衡力作用的是（  ）\nA. 正在起飞的飞机\nB. 正在转弯的汽车\nC. 静止在水平桌面上的课本\nD. 正在减速进站的火车","answer":"答案：C\n解析：物体受平衡力时，运动状态不变，即保持静止或匀速直线运动状态。\nA. 起飞的飞机速度增大，运动状态改变，受非平衡力。\nB. 转弯的汽车运动方向改变，受非平衡力。\nC. 静止的课本运动状态不变，受平衡力（重力和支持力平衡）。正确。\nD. 减速的火车速度减小，受非平衡力。"},{"id":"g2_physics_039_ex02","knowledge_id":"g2_physics_039","question":"选择题：一本书放在水平桌面上，下列各对力中，属于平衡力的是（  ）\nA. 书受到的重力和书对桌面的压力\nB. 书受到的重力和桌面对书的支持力\nC. 书对桌面的压力和桌面对书的支持力\nD. 书受到的重力和桌子受到的重力","answer":"答案：B\n解析：二力平衡的条件：大小相等、方向相反、作用在同一直线上、作用在同一物体上。\nA. 重力作用在书上，压力作用在桌面上，不是同一物体。\nB. 重力和支持力都作用在书上，大小相等、方向相反、同一直线，是平衡力。正确。\nC. 压力作用在桌面上，支持力作用在书上，是相互作用力，不是平衡力。\nD. 两个力作用在不同物体上，大小也不等。"},{"id":"g2_physics_039_ex03","knowledge_id":"g2_physics_039","question":"填空题：二力平衡的条件是：作用在______物体上的两个力，大小______、方向______、作用在______上。满足这四个条件的两个力，合力为______。","answer":"答案：同一；相等；相反；同一直线；零\n解析：二力平衡条件可简记为：同物、等大、反向、共线。四个条件缺一不可。\n平衡力的合力为零，所以受平衡力的物体运动状态不变。"},{"id":"g2_physics_039_ex04","knowledge_id":"g2_physics_039","question":"计算题：一个重 50 N 的物体放在水平地面上，当它受到 20 N 的竖直向上的拉力时，物体保持静止。求：（1）地面对物体的支持力多大？（2）物体受到的合力多大？","answer":"答案：（1）30 N；（2）0 N\n解析：\n（1）物体静止，受平衡力。竖直方向上受到三个力：\n向下的重力 G = 50 N，向上的拉力 F拉 = 20 N，向上的支持力 F支。\n平衡时向上的力之和等于向下的力：\nF拉 + F支 = G\nF支 = G - F拉 = 50 N - 20 N = 30 N\n\n（2）物体静止，处于平衡状态，所以合力为 0 N。"},{"id":"g2_physics_039_ex05","knowledge_id":"g2_physics_039","question":"判断题：物体受到两个力的作用，如果这两个力大小相等、方向相反，那么这两个力一定是平衡力。（  ）","answer":"答案：错误\n解析：二力平衡需要同时满足四个条件：同物、等大、反向、共线。\n题目中只说了大小相等、方向相反，缺少\"作用在同一物体上\"和\"作用在同一直线上\"这两个条件。\n例如：你推墙的力和墙推你的力，大小相等、方向相反，但作用在不同物体上，是相互作用力，不是平衡力。"},{"id":"g2_physics_039_ex06","knowledge_id":"g2_physics_039","question":"选择题：关于平衡力和相互作用力，下列说法正确的是（  ）\nA. 平衡力作用在两个物体上\nB. 相互作用力作用在同一物体上\nC. 平衡力和相互作用力都是大小相等、方向相反的\nD. 物体受平衡力时，运动状态会改变","answer":"答案：C\n解析：\n平衡力和相互作用力的相同点：大小相等、方向相反、作用在同一直线上。\n不同点：平衡力作用在同一物体上；相互作用力作用在两个不同物体上。\nA. 平衡力作用在同一物体上。\nB. 相互作用力作用在不同物体上。\nC. 正确，这是它们的共同点。\nD. 物体受平衡力时运动状态不变（静止或匀速直线运动）。"},{"id":"g2_physics_039_ex07","knowledge_id":"g2_physics_039","question":"选择题：一个物体在水平面上做匀速直线运动，下列说法正确的是（  ）\nA. 物体一定不受力的作用\nB. 物体一定受到一对平衡力的作用\nC. 物体受到的合力一定为零\nD. 物体受到的重力和支持力不一定平衡","answer":"答案：C\n解析：\nA. 物体可能受力，但受的是平衡力。\nB. 不一定是一对，也可能受到多个力，只要这些力的合力为零。\nC. 正确，匀速直线运动是平衡状态，合力一定为零。\nD. 竖直方向上物体没有运动，所以重力和支持力一定是平衡的。"},{"id":"g2_physics_039_ex08","knowledge_id":"g2_physics_039","question":"实验分析题：在\"探究二力平衡条件\"的实验中，小明将卡片两端通过滑轮各挂一个钩码。\n（1）当两端钩码质量相等时，卡片静止，说明什么？\n（2）将卡片转过一个角度后松手，卡片会转动，说明什么？\n（3）用剪刀将卡片从中间剪开，卡片不再平衡，说明什么？","answer":"答案：\n（1）说明二力大小相等、方向相反时，物体可能平衡。\n（2）说明二力不在同一直线上时，不能平衡。即二力平衡需要\"作用在同一直线上\"。\n（3）说明二力必须作用在同一物体上才能平衡。剪开后两个半张卡片各受一个力，各自都不能平衡。\n\n这三个实验分别验证了二力平衡条件中的：大小相等、共线、同物。"},{"id":"g2_physics_039_ex09","knowledge_id":"g2_physics_039","question":"计算题：起重机用钢丝绳吊着重为 2000 N 的物体，分析以下情况中钢丝绳的拉力大小：\n（1）物体静止在空中\n（2）物体以 2 m/s 的速度匀速上升\n（3）物体以 3 m/s 的速度匀速下降","answer":"答案：三种情况拉力都是 2000 N\n解析：\n（1）物体静止，处于平衡状态，拉力和重力平衡：F拉 = G = 2000 N\n（2）物体匀速上升，也是平衡状态，拉力和重力平衡：F拉 = G = 2000 N\n（3）物体匀速下降，也是平衡状态，拉力和重力平衡：F拉 = G = 2000 N\n\n注意：只要是静止或匀速直线运动，不管速度多大、方向如何，都是平衡状态，受平衡力。拉力大小都等于重力。"},{"id":"g2_physics_039_ex10","knowledge_id":"g2_physics_039","question":"简答题：跳伞运动员在空中张开降落伞后，会经历一段时间的加速下落，然后匀速下落。请分析这两个阶段中运动员受力情况和运动状态的关系。","answer":"答案：\n（1）加速下落阶段：\n运动员受到向下的重力和向上的空气阻力。\n因为重力大于阻力，所以合力方向向下，与运动方向相同，所以运动员加速下落。\n这一阶段受力不平衡，运动状态在改变（速度增大）。\n\n（2）匀速下落阶段：\n随着速度增大，空气阻力也增大。当阻力增大到与重力相等时，两个力平衡，合力为零。\n运动员受平衡力，所以保持匀速直线运动状态。\n\n这说明：物体受非平衡力时运动状态改变；物体受平衡力时运动状态不变。"},{"id":"g2_physics_040_ex01","knowledge_id":"g2_physics_040","question":"选择题：两个力作用在同一直线上，下列关于合力的说法正确的是（  ）\nA. 合力一定大于其中任何一个分力\nB. 合力一定小于其中任何一个分力\nC. 合力可能等于其中一个分力\nD. 两个力的合力不可能为零","answer":"答案：C\n解析：\n同一直线上二力合成：\n- 同方向：F合 = F1 + F2，合力大于任一分力\n- 反方向：F合 = |F1 - F2|，合力可能小于任一分力，也可能等于其中一个（当一个为0时），还可能为零（二力平衡时）\nA. 反方向时合力可能小于分力。\nB. 同方向时合力大于分力。\nC. 正确，例如反方向且一个力为5N、一个为0N时（不考虑0N的极端情况，或者考虑F1=10N，F2=5N反方向，合力5N，等于F2）。\nD. 二力平衡时合力为零。"},{"id":"g2_physics_040_ex02","knowledge_id":"g2_physics_040","question":"计算题：一个物体受到同一直线上的两个力 F₁ = 10 N，F₂ = 6 N。\n（1）如果两个力方向相同，合力多大？方向如何？\n（2）如果两个力方向相反，合力多大？方向如何？","answer":"答案：（1）16 N，方向与 F₁、F₂ 相同；（2）4 N，方向与 F₁ 相同\n解析：\n（1）同方向：F合 = F₁ + F₂ = 10 N + 6 N = 16 N\n方向与两个力的方向相同。\n\n（2）反方向：F合 = |F₁ - F₂| = |10 N - 6 N| = 4 N\n方向与较大的力（F₁）的方向相同。"},{"id":"g2_physics_040_ex03","knowledge_id":"g2_physics_040","question":"填空题：同一直线上方向相同的两个力，合力大小等于两个力之______，方向跟这两个力的方向______；方向相反的两个力，合力大小等于两个力之______，方向跟______的力的方向相同。","answer":"答案：和；相同；差；较大\n解析：这是同一直线上二力合成的基本规律。\n注意：合力是等效替代，不是真正额外存在的力，它的作用效果与那几个分力共同作用的效果相同。"},{"id":"g2_physics_040_ex04","knowledge_id":"g2_physics_040","question":"选择题：一个物体放在水平地面上，受到向左的拉力 15 N，同时受到向右的摩擦力 10 N，则物体在水平方向上受到的合力大小和方向是（  ）\nA. 25 N，向左  \nB. 5 N，向左\nC. 5 N，向右  \nD. 25 N，向右","answer":"答案：B\n解析：两个力在同一直线上，方向相反。\nF合 = F拉 - f = 15 N - 10 N = 5 N\n方向与较大的力（拉力）相同，即向左。\n物体将向左做加速运动。"},{"id":"g2_physics_040_ex05","knowledge_id":"g2_physics_040","question":"计算题：一个重 50 N 的物体，用 30 N 的竖直向上的拉力提它，物体仍静止在地面上。求地面对物体的支持力和物体受到的合力。","answer":"答案：支持力 20 N；合力 0 N\n解析：\n竖直方向有三个力：向下的重力 G = 50 N，向上的拉力 F拉 = 30 N，向上的支持力 F支。\n物体静止，合力为零，所以向上的力之和等于向下的力：\nF拉 + F支 = G\nF支 = G - F拉 = 50 N - 30 N = 20 N\n\n因为物体静止，处于平衡状态，所以合力为 0 N。"},{"id":"g2_physics_040_ex06","knowledge_id":"g2_physics_040","question":"判断题：两个力的合力一定大于每一个分力。（  ）","answer":"答案：错误\n解析：\n同一直线上的两个力：\n- 方向相同时：合力 = 二力之和，合力大于任一分力\n- 方向相反时：合力 = 二力之差，合力可能小于任一分力，甚至等于零\n例如：两个力分别为 5 N 和 3 N，方向相反，合力只有 2 N，比两个分力都小。\n如果两个力大小相等、方向相反，合力为零，比任何一个分力都小。"},{"id":"g2_physics_040_ex07","knowledge_id":"g2_physics_040","question":"选择题：物体在水平方向受到同一直线上的两个力作用，已知 F₁ = 8 N，F₂ = 5 N，它们的合力（  ）\nA. 一定是 13 N  \nB. 一定是 3 N\nC. 可能是 3 N 或 13 N  \nD. 无法确定","answer":"答案：C\n解析：题目说两个力在同一直线上，但没说方向是否相同。所以有两种可能：\n- 方向相同：F合 = 8 N + 5 N = 13 N\n- 方向相反：F合 = 8 N - 5 N = 3 N\n所以合力可能是 3 N 或 13 N。"},{"id":"g2_physics_040_ex08","knowledge_id":"g2_physics_040","question":"计算题：一个质量为 5 kg 的物体放在水平地面上，小明用 20 N 的水平推力向右推物体，物体受到的摩擦力为 12 N。求：（1）物体水平方向的合力；（2）物体的运动状态会怎样变化？（g 取 10 N/kg）","answer":"答案：（1）8 N，向右；（2）向右加速运动\n解析：\n（1）水平方向两个力：向右的推力 20 N，向左的摩擦力 12 N。\n方向相反，F合 = F推 - f = 20 N - 12 N = 8 N\n方向与推力相同，向右。\n\n（2）因为合力方向向右，与运动方向（假设原来静止或向右运动）相同，所以物体将向右做加速运动。\n\n注意：重力和支持力在竖直方向平衡，不影响水平运动。"},{"id":"g2_physics_040_ex09","knowledge_id":"g2_physics_040","question":"选择题：关于同一直线上二力的合成，下列说法正确的是（  ）\nA. 合力不可能等于其中一个分力\nB. 合力一定比两个分力都大\nC. 两个力作用在同一物体上才能求合力\nD. 两个力方向不同时不能求合力","answer":"答案：C\n解析：\nA. 可能等于，例如反方向且其中一个力为 0 N 时，或一个5N一个10N反向时合力5N。\nB. 不一定，反方向时可能比两个都小。\nC. 正确，合力是等效替代，必须是作用在同一物体上的力才能合成。\nD. 同一直线上方向不同（相反）也能求合力。"},{"id":"g2_physics_040_ex10","knowledge_id":"g2_physics_040","question":"分析题：一个物体正在做匀速直线运动，突然受到一个与运动方向相同的力 F，在这个力作用的瞬间，物体运动速度会怎样变化？如果这个力与运动方向相反呢？请用合力的知识解释。","answer":"答案：\n（1）受到与运动方向相同的力时：\n物体原来匀速，说明受平衡力，合力为零。\n现在增加一个与运动方向相同的力，合力方向与运动方向相同，所以物体速度会增大（加速）。\n\n（2）受到与运动方向相反的力时：\n合力方向与运动方向相反，所以物体速度会减小（减速）。\n\n原理：合力与运动方向同向 → 加速；合力与运动方向反向 → 减速；合力为零 → 匀速或静止。\n这就是力是改变物体运动状态的原因。"},{"id":"g2_physics_041_ex01","knowledge_id":"g2_physics_041","question":"选择题：下列关于压力和压强的说法，正确的是（  ）\nA. 压力就是重力\nB. 压力的方向总是竖直向下的\nC. 压强表示压力作用效果的物理量\nD. 受力面积越大，压强一定越小","answer":"答案：C\n解析：\nA. 压力不一定等于重力，只有当物体放在水平面上且不受其他力时，压力大小才等于重力。压力和重力是不同性质的力。\nB. 压力方向垂直于受压面，不一定竖直向下。\nC. 正确，压强是表示压力作用效果的物理量。\nD. 压强与压力和受力面积都有关，压力不确定时，不能说受力面积越大压强越小。"},{"id":"g2_physics_041_ex010","knowledge_id":"g2_physics_041","question":"选择题：质量相同的实心正方体铝块和铁块放在水平桌面上，它们对桌面的压力和压强分别是 F铝、F铁 和 p铝、p铁，则（  ）\nA. F铝 = F铁，p铝 = p铁  \nB. F铝 = F铁，p铝 < p铁\nC. F铝 < F铁，p铝 < p铁  \nD. F铝 > F铁，p铝 > p铁","answer":"答案：B\n解析：\n质量相同，重力相同，放在水平桌面上，压力等于重力，所以 F铝 = F铁。\n铁的密度大于铝，质量相同时，铁块体积小。因为都是正方体，所以铁块底面积小。\n根据 p = F/S，压力相同，铁块底面积小，所以压强大，即 p铝 < p铁。"},{"id":"g2_physics_041_ex02","knowledge_id":"g2_physics_041","question":"选择题：下列事例中，为了增大压强的是（  ）\nA. 书包带做得宽一些\nB. 铁轨铺在枕木上\nC. 刀刃磨得很薄\nD. 滑雪时穿上宽大的滑雪板","answer":"答案：C\n解析：增大压强的方法：增大压力或减小受力面积。\nA. 书包带宽是增大受力面积，减小压强。\nB. 枕木是增大受力面积，减小压强。\nC. 刀刃薄是减小受力面积，增大压强。正确。\nD. 滑雪板宽大是增大受力面积，减小压强。"},{"id":"g2_physics_041_ex03","knowledge_id":"g2_physics_041","question":"填空题：压强的计算公式是 p = ______，其中 p 表示______，F 表示______，S 表示______。压强的单位是______，简称______，符号是______。","answer":"答案：F/S；压强；压力；受力面积；帕斯卡；帕；Pa\n解析：1 Pa = 1 N/m²，表示每平方米面积上受到的压力是 1 牛。\nPa 是一个很小的单位，一张报纸平放时对桌面的压强约 0.5 Pa。"},{"id":"g2_physics_041_ex04","knowledge_id":"g2_physics_041","question":"计算题：一个重 600 N 的人站在水平地面上，双脚与地面的接触面积约为 400 cm²。求这个人站立时对地面的压强。","answer":"答案：1.5×10⁴ Pa（或 15000 Pa）\n解析：\n人站在水平地面上，对地面的压力等于重力：\nF = G = 600 N\n受力面积：S = 400 cm² = 400×10⁻⁴ m² = 0.04 m²\n压强：p = F/S = 600 N / 0.04 m² = 15000 Pa = 1.5×10⁴ Pa"},{"id":"g2_physics_041_ex05","knowledge_id":"g2_physics_041","question":"选择题：将一均匀长方体木块放在水平桌面上，若沿竖直方向切去一半，则剩下一半对桌面的压力和压强变化是（  ）\nA. 压力减半，压强减半  \nB. 压力减半，压强不变\nC. 压力不变，压强减半  \nD. 压力不变，压强不变","answer":"答案：B\n解析：\n沿竖直方向切去一半：\n- 质量减半，重力减半，所以压力减半：F = G/2\n- 接触面积也减半：S = S原/2\n压强：p = F/S = (G/2) / (S原/2) = G/S原 = p原\n所以压强不变。\n简单说：竖直切割，压力和面积都减半，压强不变。"},{"id":"g2_physics_041_ex06","knowledge_id":"g2_physics_041","question":"判断题：压力越大，压强一定越大。（  ）","answer":"答案：错误\n解析：压强 p = F/S，压强的大小由压力和受力面积两个因素共同决定。\n压力大时，如果受力面积也很大，压强不一定大。\n正确的说法是：在受力面积一定时，压力越大，压强越大。"},{"id":"g2_physics_041_ex07","knowledge_id":"g2_physics_041","question":"选择题：下列四个实例中，目的是减小压强的是（  ）\nA. 破窗锤的敲击端做成锥形\nB. 注射器的针头做得很尖\nC. 压路机的碾子质量很大\nD. 大型平板车装有很多轮子","answer":"答案：D\n解析：\nA. 锥形是减小受力面积，增大压强。\nB. 针头尖是减小受力面积，增大压强。\nC. 碾子质量大是增大压力，增大压强。\nD. 很多轮子是增大受力面积，减小压强。正确。"},{"id":"g2_physics_041_ex08","knowledge_id":"g2_physics_041","question":"计算题：一块砖长 24 cm、宽 12 cm、厚 6 cm，重 24 N。将砖分别平放、侧放、竖放在水平地面上，求三种放法对地面的压强分别是多少？","answer":"答案：平放 833 Pa；侧放 1667 Pa；竖放 3333 Pa\n解析：\n压力都等于重力：F = G = 24 N\n\n平放：S平 = 24 cm × 12 cm = 288 cm² = 0.0288 m²\np平 = F/S平 = 24 N / 0.0288 m² ≈ 833 Pa\n\n侧放：S侧 = 24 cm × 6 cm = 144 cm² = 0.0144 m²\np侧 = 24 N / 0.0144 m² ≈ 1667 Pa\n\n竖放：S竖 = 12 cm × 6 cm = 72 cm² = 0.0072 m²\np竖 = 24 N / 0.0072 m² ≈ 3333 Pa\n\n结论：压力相同时，受力面积越小，压强越大。"},{"id":"g2_physics_041_ex09","knowledge_id":"g2_physics_041","question":"简答题：为什么用手捏鸡蛋，鸡蛋不容易碎，而把鸡蛋往碗边一磕就碎了？请用压强知识解释。","answer":"答案：\n用手捏鸡蛋时，手与鸡蛋的接触面积大，受力面积大，所以压强小，鸡蛋不容易碎。\n把鸡蛋往碗边一磕时，鸡蛋与碗边的接触面积很小，受力面积小，压强大，所以鸡蛋容易碎。\n\n根据 p = F/S，在压力差不多的情况下，受力面积越小，压强越大，压力作用效果越明显。\n这就是\"磕鸡蛋\"的物理原理。"},{"id":"g2_physics_042_ex01","knowledge_id":"g2_physics_042","question":"选择题：下列关于液体压强的说法，正确的是（  ）\nA. 液体压强是由于液体有重力产生的，与液体流动性无关\nB. 液体内部向各个方向都有压强\nC. 液体压强的大小只与深度有关\nD. 液体的重力越大，产生的压强越大","answer":"答案：B\n解析：\nA. 液体压强是由于液体受到重力且具有流动性共同产生的。\nB. 正确，液体内部向各个方向都有压强。\nC. 液体压强与液体密度和深度都有关（p = ρgh）。\nD. 液体压强与液体的总重力无关，与深度和密度有关。"},{"id":"g2_physics_042_ex010","knowledge_id":"g2_physics_042","question":"实验分析题：在\"研究液体压强\"的实验中，用压强计进行实验：\n（1）将压强计的金属盒放入水中同一深度，改变橡皮膜的朝向，U形管两边液面高度差不变，说明什么？\n（2）将金属盒逐渐向下移，U形管两边液面高度差逐渐变大，说明什么？\n（3）换用盐水做实验，在相同深度处，U形管液面高度差比在水中时大，说明什么？","answer":"答案：\n（1）说明在同一深度，液体内部向各个方向的压强相等。\n（2）说明液体压强随深度的增加而增大（同种液体中，深度越深压强越大）。\n（3）说明在同一深度，液体的密度越大，压强越大。\n\n这三个实验分别验证了液体压强的三个特点：方向性、深度关系、密度关系。"},{"id":"g2_physics_042_ex02","knowledge_id":"g2_physics_042","question":"计算题：一个游泳池水深 2 m，求池底受到的水的压强。（g 取 10 N/kg）","answer":"答案：2×10⁴ Pa（或 20000 Pa）\n解析：\n根据液体压强公式：\np = ρ水gh = 1.0×10³ kg/m³ × 10 N/kg × 2 m = 2×10⁴ Pa\n注意：深度 h 是从液面到该点的竖直距离。"},{"id":"g2_physics_042_ex03","knowledge_id":"g2_physics_042","question":"填空题：液体压强的公式是 p = ______，其中 ρ 是______，h 是______，即从______到该点的______距离。液体压强只与______和______有关，与液体的总重力、容器形状等______关。","answer":"答案：ρgh；液体密度；深度；液面；竖直；液体密度；深度；无\n解析：这是液体压强公式 p = ρgh 的要点。\n注意：h 是深度，不是高度，是从液面向下量的竖直距离。"},{"id":"g2_physics_042_ex04","knowledge_id":"g2_physics_042","question":"选择题：如图，一个容器中装有水，水中有 a、b、c 三点，它们在同一竖直线上，且 a 最浅，c 最深。关于三点的压强，下列说法正确的是（  ）\nA. a 点压强最大  \nB. b 点压强最大\nC. c 点压强最大  \nD. 三点压强一样大","answer":"答案：C\n解析：根据 p = ρgh，同种液体中，深度越深，压强越大。\nc 点最深，所以压强最大。\na 点最浅，压强最小。"},{"id":"g2_physics_042_ex05","knowledge_id":"g2_physics_042","question":"选择题：两个完全相同的烧杯，分别盛有水和酒精，液面高度相同。比较烧杯底部受到的压强（  ）\n（已知 ρ水 > ρ酒精）\nA. 水的压强大  \nB. 酒精的压强大\nC. 一样大  \nD. 无法判断","answer":"答案：A\n解析：根据 p = ρgh，深度 h 相同的情况下，密度越大，压强越大。\n因为 ρ水 > ρ酒精，所以水对杯底的压强大。"},{"id":"g2_physics_042_ex06","knowledge_id":"g2_physics_042","question":"计算题：潜水员潜到水下 5 m 深处时，他受到水的压强是多大？如果他的身体表面积约为 2 m²，水对他的总压力约为多大？（g 取 10 N/kg）","answer":"答案：压强 5×10⁴ Pa；总压力约 1×10⁵ N\n解析：\n压强：p = ρgh = 1.0×10³ kg/m³ × 10 N/kg × 5 m = 5×10⁴ Pa\n总压力：F = pS = 5×10⁴ Pa × 2 m² = 1×10⁵ N\n这个力相当于 10 吨物体的重力！但因为人体内外压强平衡，所以人感觉不到。"},{"id":"g2_physics_042_ex07","knowledge_id":"g2_physics_042","question":"选择题：下列实验或现象，不能说明液体内部存在压强的是（  ）\nA. 用手按压装满水的塑料袋，塑料袋会鼓起来\nB. 液体从侧壁的孔中喷出\nC. 用吸管吸饮料\nD. 潜水员潜入水下时要穿抗压潜水服","answer":"答案：C\n解析：\nA. 按压时液体对袋壁有压强，所以鼓起。\nB. 液体从侧壁孔喷出，说明液体对侧壁有压强。\nC. 用吸管吸饮料是利用大气压，不是液体内部压强。正确。\nD. 水下有压强，所以需要抗压服。"},{"id":"g2_physics_042_ex08","knowledge_id":"g2_physics_042","question":"判断题：液体的深度越深，压强越大，所以液体对容器底部的压力一定等于液体的重力。（  ）","answer":"答案：错误\n解析：液体压强 p = ρgh，对底部的压力 F = pS = ρghS。\n这个压力不一定等于液体的重力，与容器形状有关：\n- 柱形容器：F = G液\n- 上宽下窄容器：F < G液\n- 上窄下宽容器：F > G液\n液体对容器底的压力等于以底面积为底、深度为高的液柱的重力。"},{"id":"g2_physics_042_ex09","knowledge_id":"g2_physics_042","question":"简答题：为什么拦河大坝设计成上窄下宽的形状？请用液体压强知识解释。","answer":"答案：\n因为液体的压强随深度的增加而增大（p = ρgh）。\n大坝的下部处在更深的位置，受到的水的压强更大，需要做得更宽（更厚）来承受更大的压强。\n上部水较浅，压强较小，可以做得窄一些。\n这样设计既安全又节省材料。"},{"id":"g2_physics_043_ex01","knowledge_id":"g2_physics_043","question":"选择题：下列现象中，不能说明大气压存在的是（  ）\nA. 马德堡半球实验\nB. 用吸管吸饮料\nC. 三峡船闸\nD. 塑料吸盘挂衣钩","answer":"答案：C\n解析：\nA. 马德堡半球实验是证明大气压存在的著名实验。\nB. 用吸管吸饮料是利用大气压，吸出管内空气，大气压把饮料压入嘴里。\nC. 三峡船闸是利用连通器原理，不是大气压。正确。\nD. 吸盘是排出空气后，大气压把吸盘压在墙上。"},{"id":"g2_physics_043_ex010","knowledge_id":"g2_physics_043","question":"填空题：抽水机（水泵）是利用______把水从低处抽到高处的。在标准大气压下，抽水机最多能把水抽到约______m 高的地方。（g 取 10 N/kg）","answer":"答案：大气压；10\n解析：\n抽水机的原理是大气压，大气压能支持约 10 m 高的水柱。\n推导：p = ρgh → h = p/(ρg) = 1×10⁵ Pa / (1×10³ kg/m³ × 10 N/kg) = 10 m\n所以理论上抽水机最多抽水高度约 10 m，实际约 7~8 m。"},{"id":"g2_physics_043_ex02","knowledge_id":"g2_physics_043","question":"填空题：______实验第一次证明了大气压的存在；______实验第一次测出了大气压的值。1 标准大气压 = ______ mm 汞柱 = ______ Pa。","answer":"答案：马德堡半球；托里拆利；760；1.013×10⁵\n解析：\n- 马德堡半球实验：1654年，德国马德堡市，证明大气压存在且很大。\n- 托里拆利实验：意大利科学家托里拆利，测出大气压值约760mm汞柱。\n- 1标准大气压 = 760 mmHg = 1.013×10⁵ Pa ≈ 10⁵ Pa"},{"id":"g2_physics_043_ex03","knowledge_id":"g2_physics_043","question":"选择题：关于托里拆利实验，下列说法正确的是（  ）\nA. 玻璃管越粗，管内水银柱越低\nB. 玻璃管倾斜，管内水银柱长度不变\nC. 玻璃管顶端混入少量空气，测量值偏小\nD. 将实验装置从山脚移到山顶，水银柱高度升高","answer":"答案：C\n解析：\nA. 大气压与管的粗细无关，水银柱高度不变。\nB. 倾斜后高度不变，但长度变长。\nC. 正确，混入空气后，空气有向下的压强，使水银柱降低，测量值偏小。\nD. 山顶气压低，水银柱高度降低。"},{"id":"g2_physics_043_ex04","knowledge_id":"g2_physics_043","question":"计算题：1 标准大气压约为 1×10⁵ Pa，求大气压作用在 1 m² 面积上的压力是多大？相当于多少千克物体的重力？（g 取 10 N/kg）","answer":"答案：1×10⁵ N；相当于 1×10⁴ kg（10吨）物体的重力\n解析：\n压力：F = pS = 1×10⁵ Pa × 1 m² = 1×10⁵ N\n质量：m = G/g = F/g = 1×10⁵ N / 10 N/kg = 1×10⁴ kg = 10 t\n相当于 10 吨物体的重力压在 1 平方米上！人体内部也有压强，内外平衡，所以感觉不到。"},{"id":"g2_physics_043_ex05","knowledge_id":"g2_physics_043","question":"选择题：下列生活实例中，利用大气压的是（  ）\nA. 用高压锅煮饭  \nB. 用注射器把药液注入肌肉\nC. 用抽水机抽水  \nD. 热气球升空","answer":"答案：C\n解析：\nA. 高压锅是利用沸点随气压增大而升高，不是利用大气压。\nB. 注射器推药液是靠人的推力，不是大气压。（注意：吸药液是利用大气压）\nC. 抽水机（活塞式抽水机）是利用大气压把水从低处抽到高处。正确。\nD. 热气球是利用浮力升空。"},{"id":"g2_physics_043_ex06","knowledge_id":"g2_physics_043","question":"判断题：大气压随高度的增加而增大。（  ）","answer":"答案：错误\n解析：大气压随高度的增加而减小。\n因为越往高处，空气越稀薄，所以大气压越小。\n海拔 3000 m 以内，大约每升高 10 m，大气压减小 100 Pa。"},{"id":"g2_physics_043_ex07","knowledge_id":"g2_physics_043","question":"选择题：用高压锅煮粥，熄火后用冷水将锅冷却，拿去限压阀后打开锅盖，可以看到锅内的粥仍在沸腾。这是因为（  ）\nA. 粥的温度太高  \nB. 粥的比热容大\nC. 锅内气压减小，沸点降低  \nD. 以上说法都不对","answer":"答案：C\n解析：高压锅内气压大，沸点高，粥的温度高于 100℃。\n打开锅盖后，锅内气压减小，水的沸点降低（降到 100℃）。\n而粥的温度还高于新的沸点，所以粥会继续沸腾一会儿。\n这说明：液体的沸点随气压减小而降低。"},{"id":"g2_physics_043_ex08","knowledge_id":"g2_physics_043","question":"简答题：为什么用吸管能把饮料吸入口中？请详细解释其中的物理道理。","answer":"答案：\n用吸管吸饮料时，先吸走吸管内的空气，使吸管内的气压减小，小于外界大气压。\n这样，在外界大气压的作用下，饮料就被压入吸管，进而进入口中。\n\n注意：不是\"吸\"上去的，而是大气压\"压\"上去的。\n如果吸管顶端有孔，内外气压相等，就吸不上来。"},{"id":"g2_physics_043_ex09","knowledge_id":"g2_physics_043","question":"选择题：青藏铁路建成后，乘高原列车去西藏旅游的人越来越多。与普通列车相比，高原列车内还配有供氧系统和医疗应急系统，这样做是因为高原地区（  ）\nA. 大气压强小，空气中含氧量小\nB. 大气压强大，空气中含氧量大\nC. 大气压强小，空气中含氧量大\nD. 大气压强大，空气中含氧量小","answer":"答案：A\n解析：高原地区海拔高，大气压强小，空气稀薄，含氧量少。\n人在这种环境下容易缺氧，产生高原反应。\n所以列车内需要供氧系统。"},{"id":"g2_physics_044_ex01","knowledge_id":"g2_physics_044","question":"选择题：关于流体压强与流速的关系，下列说法正确的是（  ）\nA. 流速越大的地方，压强越大\nB. 流速越大的地方，压强越小\nC. 流速与压强没有关系\nD. 流速越小的地方，压强越小","answer":"答案：B\n解析：流体（液体和气体）在流速越大的地方，压强越小；流速越小的地方，压强越大。\n这就是伯努利原理。"},{"id":"g2_physics_044_ex010","knowledge_id":"g2_physics_044","question":"简答题：请举三个生活中利用\"流体压强与流速关系\"的例子，并分别简要解释。","answer":"答案：\n1. 飞机机翼：上方凸起流速大压强小，下方平直流速小压强大，产生升力。\n2. 火车站安全线：列车经过时车旁流速大压强小，人外侧压强大，会把人推向火车，所以要站在安全线外。\n3. 喷雾器：快速推活塞时，喷口处气流速度大压强小，瓶内大气压把液体压上去，被气流吹散成雾。\n\n还有：香蕉球、乒乓球弧圈球、两船不能并排行驶、汽车开快时车顶有\"上飘\"感觉等。"},{"id":"g2_physics_044_ex02","knowledge_id":"g2_physics_044","question":"选择题：下列现象中，不能用流体压强与流速的关系解释的是（  ）\nA. 飞机机翼获得升力\nB. 火车站台设有安全线\nC. 船闸的工作原理\nD. 两船并排行驶容易相撞","answer":"答案：C\n解析：\nA. 飞机机翼上方流速大压强小，下方流速小压强大，产生升力。\nB. 列车驶过，空气流速大压强小，人会被\"推\"向火车，所以要设安全线。\nC. 船闸是利用连通器原理，不是流体压强与流速。正确。\nD. 两船之间水流速大压强小，外侧压强大，把船推向中间，容易相撞。"},{"id":"g2_physics_044_ex03","knowledge_id":"g2_physics_044","question":"填空题：飞机的机翼做成上方______、下方______的形状。飞行时，机翼上方空气流速______，压强______；下方空气流速______，压强______。这样就形成了向上的压强差，产生向上的升力。","answer":"答案：凸起；平直；大；小；小；大\n解析：这是飞机升力产生的原理。\n升力的本质是上下表面的压强差。流速差导致压强差，压强差产生升力。"},{"id":"g2_physics_044_ex04","knowledge_id":"g2_physics_044","question":"简答题：为什么火车站的站台上要画一条安全线？为什么乘客必须站在安全线以外候车？","answer":"答案：\n当列车高速通过时，列车车身附近的空气流速大，压强小；而站台安全线以外的地方空气流速小，压强大。\n这样就会在人体前后形成压强差，产生一个指向列车的压力差，把人推向火车，造成危险。\n所以乘客必须站在安全线以外候车。\n这就是流体压强与流速关系的应用。"},{"id":"g2_physics_044_ex05","knowledge_id":"g2_physics_044","question":"选择题：一张纸条，用手拿着一端，靠近嘴边沿着纸条上方水平吹气，纸条会（  ）\nA. 向下垂  \nB. 向上飘起\nC. 不动  \nD. 左右晃动","answer":"答案：B\n解析：沿着纸条上方吹气时，纸条上方空气流速大，压强小；纸条下方空气流速小，压强大。\n上下形成压强差，产生向上的压力，纸条向上飘起。\n这是验证流体压强与流速关系的经典小实验。"},{"id":"g2_physics_044_ex06","knowledge_id":"g2_physics_044","question":"判断题：两只船并排近距离行驶时容易发生碰撞，是因为两船之间水的流速大，压强大，把两船压在一起。（  ）","answer":"答案：错误\n解析：\n两船并排行驶时，两船之间的水流通道变窄，流速变大，压强变小。\n而两船外侧的水的流速小，压强大。\n所以是外侧压强大，内侧压强小，形成向内的压力差，把两船推向中间，容易相撞。\n题目说\"压强大\"是错的，应该是压强小。"},{"id":"g2_physics_044_ex07","knowledge_id":"g2_physics_044","question":"选择题：足球比赛中，运动员踢出\"香蕉球\"，球在空中边旋转边前进，运动轨迹发生弯曲。这是因为（  ）\nA. 足球受到重力\nB. 足球受到空气浮力\nC. 球两侧空气流速不同，形成压强差\nD. 足球受到踢力","answer":"答案：C\n解析：香蕉球的原理是：\n球旋转前进时，球一侧的空气流速与球的旋转方向相同，流速叠加后更大；另一侧流速与旋转方向相反，流速小。\n这样两侧空气流速不同，压强不同，形成压强差，使球的运动轨迹弯曲。\n这就是流体压强与流速关系的应用。"},{"id":"g2_physics_044_ex08","knowledge_id":"g2_physics_044","question":"实验分析题：取两个乒乓球放在两根筷子上，中间留有一定距离。用吸管向两球中间吹气，会看到什么现象？为什么？","answer":"答案：\n现象：两个乒乓球会向中间靠拢，甚至碰在一起。\n\n原因：向两球中间吹气时，两球中间的空气流速变大，压强变小；\n而两球外侧的空气流速小，压强大。\n这样在两球的内外侧形成压强差，产生指向中间的压力差，把两球推向中间。\n\n这就是流体压强与流速关系的实验验证。"},{"id":"g2_physics_044_ex09","knowledge_id":"g2_physics_044","question":"选择题：下列事例中，利用流体压强与流速关系工作的是（  ）\nA. 活塞式抽水机  \nB. 船闸\nC. 喷雾器  \nD. 密度计","answer":"答案：C\n解析：\nA. 抽水机利用大气压。\nB. 船闸利用连通器。\nC. 喷雾器：快速按压时，喷口处空气流速大压强小，瓶内大气压把液体压上去喷出。正确。\nD. 密度计利用物体漂浮条件（浮力等于重力）。"},{"id":"g2_physics_045_ex01","knowledge_id":"g2_physics_045","question":"选择题：关于浮力，下列说法正确的是（  ）\nA. 浮力的方向总是竖直向上的\nB. 只有漂浮的物体才受到浮力\nC. 浮力的大小等于物体的重力\nD. 物体浸没越深，受到的浮力越大","answer":"答案：A\n解析：\nA. 正确，浮力的方向总是竖直向上的。\nB. 浸在液体中的物体都受到浮力，不管是漂浮、悬浮还是下沉。\nC. 只有漂浮和悬浮时浮力才等于重力，下沉时浮力小于重力。\nD. 完全浸没后，深度增加，V排不变，浮力不变。"},{"id":"g2_physics_045_ex010","knowledge_id":"g2_physics_045","question":"填空题：浮力产生的原因是______。用公式表示：F浮 = ______。如果物体下表面没有液体（如紧贴容器底），则浮力为______。","answer":"答案：液体对物体上下表面的压力差；F下表面 - F上表面；零\n解析：这是浮力产生的本质原因。\n注意几个特殊情况：\n1. 漂浮的物体：上表面没有液体压力，F浮 = F下表面\n2. 完全浸没：F浮 = F下 - F上\n3. 紧贴容器底：下表面无液体，F浮 = 0（不是浮力小，是根本没有浮力）"},{"id":"g2_physics_045_ex02","knowledge_id":"g2_physics_045","question":"计算题：一个重 5 N 的石块，挂在弹簧测力计下，将其浸没在水中时，弹簧测力计的示数为 3 N。求石块受到的浮力是多大？","answer":"答案：2 N\n解析：这是称重法测浮力：\nF浮 = G - F示 = 5 N - 3 N = 2 N\n浮力大小等于物体在空气中的重力减去浸在液体中时弹簧测力计的示数。"},{"id":"g2_physics_045_ex03","knowledge_id":"g2_physics_045","question":"填空题：浸在液体（或气体）中的物体受到液体（或气体）向______的托力，这个力叫做浮力。浮力的方向总是______。称重法测浮力的公式：F浮 = ______。","answer":"答案：上；竖直向上；G - F示\n解析：\n浮力是液体对物体向上的托力。\n施力物体是液体（或气体）。\n方向竖直向上，不是\"向上\"这么简单，是竖直向上（垂直于水平面）。"},{"id":"g2_physics_045_ex04","knowledge_id":"g2_physics_045","question":"选择题：一个正方体铁块浸没在水中，它的上表面受到水的压力是 10 N，下表面受到水的压力是 25 N，则铁块受到的浮力是（  ）\nA. 35 N  \nB. 15 N\nC. 10 N  \nD. 无法确定","answer":"答案：B\n解析：浮力产生的原因是液体对物体上下表面的压力差。\nF浮 = F下表面 - F上表面 = 25 N - 10 N = 15 N\n这就是压力差法测浮力。"},{"id":"g2_physics_045_ex05","knowledge_id":"g2_physics_045","question":"判断题：在水中下沉的物体不受浮力作用。（  ）","answer":"答案：错误\n解析：在水中下沉的物体也受到浮力。\n物体下沉，不是因为不受浮力，而是因为浮力小于重力。\n只要物体浸在液体中，且下表面有液体，就会受到浮力。\n（特例：如果物体下表面与容器底紧密贴合，没有液体，则不受浮力。）"},{"id":"g2_physics_045_ex06","knowledge_id":"g2_physics_045","question":"选择题：以下情况中，物体没有受到浮力的是（  ）\nA. 漂浮在死海的人\nB. 正在水中下沉的石块\nC. 水中的桥墩\nD. 水中游的鱼","answer":"答案：C\n解析：\n浮力产生的原因是液体对物体上下表面的压力差。\nA、B、D中的物体都浸在水中，上下表面都有水，都有压力差，都受浮力。\nC. 桥墩的下表面埋在泥土里，没有水，所以下表面不受水的压力，没有向上的压力差，不受浮力。\n（注意：桥墩侧面有水的压力，但水平方向压力相互抵消了。）"},{"id":"g2_physics_045_ex07","knowledge_id":"g2_physics_045","question":"计算题：一个边长为 10 cm 的正方体物块，浸没在水中，上表面距离水面 5 cm。求：（1）上表面受到的水的压力；（2）下表面受到的水的压力；（3）物块受到的浮力。（g 取 10 N/kg）","answer":"答案：（1）5 N；（2）15 N；（3）10 N\n解析：\n边长 a = 10 cm = 0.1 m，上表面深度 h上 = 5 cm = 0.05 m，下表面深度 h下 = 15 cm = 0.15 m\n面积 S = a² = 0.01 m²\n\n（1）上表面压强：p上 = ρgh上 = 1×10³ × 10 × 0.05 = 500 Pa\n上表面压力：F上 = p上S = 500 × 0.01 = 5 N（向下）\n\n（2）下表面压强：p下 = ρgh下 = 1×10³ × 10 × 0.15 = 1500 Pa\n下表面压力：F下 = p下S = 1500 × 0.01 = 15 N（向上）\n\n（3）浮力：F浮 = F下 - F上 = 15 N - 5 N = 10 N\n（验证：阿基米德原理 F浮 = ρgV排 = 1×10³×10×0.001 = 10 N，一致）"},{"id":"g2_physics_045_ex08","knowledge_id":"g2_physics_045","question":"简答题：浮力是怎样产生的？请用液体压强的知识解释浮力产生的原因。","answer":"答案：\n浮力产生的原因是：液体对物体上下表面的压力差。\n\n具体来说：\n1. 液体内部向各个方向都有压强，且压强随深度的增加而增大。\n2. 物体浸没在液体中时，前后左右侧面受到的压力相互抵消（对称）。\n3. 物体的上表面深度小，受到向下的压力小；下表面深度大，受到向上的压力大。\n4. 下表面与上表面的压力差就是浮力。\n\n浮力 = 下表面压力 - 上表面压力，方向竖直向上。"},{"id":"g2_physics_045_ex09","knowledge_id":"g2_physics_045","question":"选择题：将同一长方体分别按甲（平放）、乙（竖放）两种方式浸没在水中，则两种情况下物体受到的浮力（  ）\nA. 甲大  \nB. 乙大\nC. 一样大  \nD. 无法判断","answer":"答案：C\n解析：物体完全浸没在水中，V排 = V物，两种放法物体体积相同，所以V排相同。\n根据阿基米德原理 F浮 = ρ液gV排，液体密度相同，V排相同，所以浮力相同。\n（注意：虽然上下表面的压力差的具体值不同，但压力差的结果是一样的。因为平放时上下面积大但深度差小，竖放时面积小但深度差大，乘积一样。）"},{"id":"g2_physics_046_ex01","knowledge_id":"g2_physics_046","question":"选择题：关于阿基米德原理，下列说法正确的是（  ）\nA. 物体的密度越大，受到的浮力越大\nB. 物体的体积越大，受到的浮力越大\nC. 物体排开液体的体积越大，受到的浮力越大\nD. 物体浸没在液体中越深，受到的浮力越大","answer":"答案：C\n解析：阿基米德原理：F浮 = G排 = ρ液gV排\n浮力大小只与液体密度和排开液体的体积有关。\nA. 物体密度与浮力无关。\nB. 物体体积大不一定排开液体体积大（如漂浮时）。\nC. 正确，ρ液相同时，V排越大浮力越大。\nD. 完全浸没后，深度增加，V排不变，浮力不变。"},{"id":"g2_physics_046_ex010","knowledge_id":"g2_physics_046","question":"选择题：质量相等的实心铜球和铝球，都浸没在水中，则（  ）\n（ρ铜 > ρ铝）\nA. 铜球受到的浮力大  \nB. 铝球受到的浮力大\nC. 两球受到的浮力一样大  \nD. 无法判断","answer":"答案：B\n解析：\n质量相同，铜的密度大，所以铜球体积小（V = m/ρ）。\n都浸没在水中，V排 = V物，所以铝球的V排大。\n根据 F浮 = ρ水gV排，铝球受到的浮力大。\n\n总结：质量相同的不同物体，浸没在同种液体中，密度小的体积大，浮力大。"},{"id":"g2_physics_046_ex02","knowledge_id":"g2_physics_046","question":"计算题：一个体积为 100 cm³ 的铁块，完全浸没在水中，求它受到的浮力。（g 取 10 N/kg）","answer":"答案：1 N\n解析：\n完全浸没，V排 = V物 = 100 cm³ = 100×10⁻⁶ m³ = 1×10⁻⁴ m³\n根据阿基米德原理：\nF浮 = ρ水gV排 = 1.0×10³ kg/m³ × 10 N/kg × 1×10⁻⁴ m³ = 1 N"},{"id":"g2_physics_046_ex03","knowledge_id":"g2_physics_046","question":"填空题：阿基米德原理：浸在液体中的物体所受的浮力，大小等于它______。公式：F浮 = ______ = ______。阿基米德原理不仅适用于液体，也适用于______。","answer":"答案：排开的液体所受的重力；G排；ρ液gV排；气体\n解析：阿基米德原理是浮力计算的基本公式。\n注意：V排是物体排开液体的体积，不一定等于物体体积。\n- 完全浸没：V排 = V物\n- 部分浸入：V排 < V物"},{"id":"g2_physics_046_ex04","knowledge_id":"g2_physics_046","question":"选择题：将两个体积相同的实心铜球和铝球，分别浸没在水和酒精中，它们受到的浮力（  ）\n（已知 ρ铜 > ρ铝，ρ水 > ρ酒精）\nA. 铜球受到的浮力大，因为铜的密度大\nB. 铝球受到的浮力大，因为铝的密度小\nC. 铜球受到的浮力大，因为水的密度大\nD. 两球受到的浮力一样大","answer":"答案：C\n解析：根据 F浮 = ρ液gV排\n两个球体积相同，都完全浸没，所以V排相同。\n铜球在水中，ρ液大；铝球在酒精中，ρ液小。\n所以铜球受到的浮力大。\n浮力与物体密度无关，只与液体密度和V排有关。"},{"id":"g2_physics_046_ex05","knowledge_id":"g2_physics_046","question":"计算题：一个重 10 N 的木块，漂浮在水面上，有 2/5 的体积露出水面。求：（1）木块受到的浮力；（2）木块排开水的体积；（3）木块的密度。（g 取 10 N/kg）","answer":"答案：（1）10 N；（2）1×10⁻³ m³；（3）0.6×10³ kg/m³\n解析：\n（1）木块漂浮，F浮 = G = 10 N\n\n（2）由 F浮 = ρ水gV排 得：\nV排 = F浮/(ρ水g) = 10 / (1×10³×10) = 1×10⁻³ m³\n\n（3）因为有 2/5 露出水面，所以浸入水中的体积是总体积的 3/5，即 V排 = (3/5)V木\nV木 = (5/3)V排 = (5/3)×10⁻³ m³\n木块质量：m = G/g = 10/10 = 1 kg\n木块密度：ρ木 = m/V木 = 1 / [(5/3)×10⁻³] = 0.6×10³ kg/m³\n\n（或用比例：ρ木/ρ水 = V排/V物 = 3/5，所以 ρ木 = 0.6×10³ kg/m³）"},{"id":"g2_physics_046_ex06","knowledge_id":"g2_physics_046","question":"判断题：物体排开液体的重力等于物体的重力。（  ）","answer":"答案：错误\n解析：\n阿基米德原理说的是：浮力等于排开液体的重力，即 F浮 = G排。\n但 G排 不一定等于 G物。\n- 漂浮和悬浮时：F浮 = G物，此时 G排 = G物\n- 下沉时：F浮 < G物，此时 G排 < G物\n- 上浮时（最终漂浮）：过程中 F浮 > G物，G排 > G物\n所以\"排开液体的重力等于物体的重力\"只在漂浮和悬浮时成立，不是普遍规律。"},{"id":"g2_physics_046_ex07","knowledge_id":"g2_physics_046","question":"选择题：把一个金属块挂在弹簧测力计下，示数为 5.4 N。将它浸没在水中时，弹簧测力计示数为 3.4 N。则金属块的体积是（g 取 10 N/kg）（  ）\nA. 2×10⁻⁴ m³  \nB. 3.4×10⁻⁴ m³\nC. 5.4×10⁻⁴ m³  \nD. 2×10⁻³ m³","answer":"答案：A\n解析：\n浮力：F浮 = G - F示 = 5.4 - 3.4 = 2 N\n由 F浮 = ρ水gV排 得：\nV排 = F浮/(ρ水g) = 2 / (1×10³×10) = 2×10⁻⁴ m³\n因为完全浸没，所以 V物 = V排 = 2×10⁻⁴ m³\n\n这是利用称重法和阿基米德原理测物体密度的方法。"},{"id":"g2_physics_046_ex08","knowledge_id":"g2_physics_046","question":"实验分析题：在\"探究浮力的大小跟哪些因素有关\"的实验中：\n（1）将同一铁块逐渐浸入水中，浸入体积越大，弹簧测力计示数越小，说明什么？\n（2）铁块完全浸没后，继续加深，弹簧测力计示数不变，说明什么？\n（3）将铁块分别浸没在水和盐水中，在盐水中时弹簧测力计示数更小，说明什么？","answer":"答案：\n（1）说明在同种液体中，物体排开液体的体积越大，受到的浮力越大。\n（2）说明物体完全浸没在同种液体中后，浮力大小与浸没深度无关。\n（3）说明在排开液体体积相同时，液体的密度越大，物体受到的浮力越大。\n\n总结：浮力大小与液体密度和排开液体体积有关，与物体密度、形状、浸没深度等无关。"},{"id":"g2_physics_046_ex09","knowledge_id":"g2_physics_046","question":"计算题：一个体积为 0.05 m³ 的救生圈，自身重 100 N，当一个重 500 N 的人躺在上面时，救生圈刚好完全浸没在水中。求：（1）救生圈完全浸没时受到的浮力；（2）此时人受到的浮力约为多大？（g 取 10 N/kg）","answer":"答案：（1）500 N；（2）约 100 N（人大部分在水面上，实际浮力约等于人重力减去救生圈支持力）\n解析：\n（1）F浮 = ρ水gV排 = 1×10³ × 10 × 0.05 = 500 N\n\n（2）对整体分析：总浮力 = 总重力（因为漂浮/悬浮）\nF浮总 = G圈 + G人 = 100 N + 500 N = 600 N\n救生圈浮力 500 N，所以人受到的浮力 = 600 N - 500 N = 100 N\n（说明人大部分身体露出水面，只有小部分浸入水中。）"},{"id":"g2_physics_047_ex01","knowledge_id":"g2_physics_047","question":"选择题：将一个实心物体放入水中，静止时处于悬浮状态，则该物体的密度（  ）\nA. 大于水的密度  \nB. 等于水的密度\nC. 小于水的密度  \nD. 无法判断","answer":"答案：B\n解析：物体浮沉的密度条件（实心物体）：\n- ρ物 > ρ液 → 下沉\n- ρ物 = ρ液 → 悬浮\n- ρ物 < ρ液 → 上浮，最终漂浮\n所以悬浮时，物体密度等于液体密度。"},{"id":"g2_physics_047_ex010","knowledge_id":"g2_physics_047","question":"分析题：一个小石块和一个大木块，都放入水中，石块下沉，木块漂浮。请判断哪个受到的浮力大？为什么？","answer":"答案：\n不一定，要看具体情况，但通常木块受到的浮力大。\n\n分析：\n根据阿基米德原理 F浮 = ρ水gV排，浮力大小取决于排开水的体积。\n- 石块虽然下沉，但体积小，V排 = V石，较小。\n- 木块虽然漂浮，但体积大，V排也可能较大（虽然没完全浸没，但体积大）。\n\n举个例子：\n小石块体积 100 cm³，下沉，F浮 = ρ水gV石 = 1 N。\n大木块体积 1000 cm³，漂浮（假设一半露出），V排 = 500 cm³，F浮 = 5 N。\n此时木块浮力大。\n\n关键：不能只看浮沉状态，要看V排大小。\n下沉的物体浮力不一定小，漂浮的物体浮力不一定大。"},{"id":"g2_physics_047_ex02","knowledge_id":"g2_physics_047","question":"计算题：一个重 8 N，体积为 1 dm³ 的物体，将它放入水中。求：（1）它受到的浮力；（2）静止时它处于什么状态？（g 取 10 N/kg）","answer":"答案：（1）8 N；（2）悬浮\n解析：\nV物 = 1 dm³ = 1×10⁻³ m³\n假设完全浸没，V排 = V物 = 1×10⁻³ m³\nF浮 = ρ水gV排 = 1×10³ × 10 × 1×10⁻³ = 10 N\n因为 F浮（10 N） > G（8 N），所以物体会上浮。\n上浮最终漂浮，漂浮时 F浮 = G = 8 N\n\n等一下，重新判断：\n物体密度 ρ物 = m/V = (G/g)/V = (8/10)/0.001 = 0.8×10³ kg/m³ < ρ水\n所以物体最终漂浮，浮力等于重力 8 N。\n（修改答案：（1）8 N；（2）漂浮）"},{"id":"g2_physics_047_ex03","knowledge_id":"g2_physics_047","question":"填空题：物体的浮沉条件：\n（1）当 F浮______G 时，物体下沉，最终沉底；\n（2）当 F浮______G 时，物体悬浮，可停在液体内部任何位置；\n（3）当 F浮______G 时，物体上浮，最终漂浮，漂浮时 F浮______G。\n（填\">\"、\"<\"或\"=\"）","answer":"答案：<；=；>；=\n解析：这是用受力来判断浮沉。\n也可以用密度判断（实心物体）：\n- ρ物 > ρ液 → 下沉\n- ρ物 = ρ液 → 悬浮\n- ρ物 < ρ液 → 上浮，最终漂浮"},{"id":"g2_physics_047_ex04","knowledge_id":"g2_physics_047","question":"选择题：把一个鸡蛋放入清水中，鸡蛋下沉。向水中加盐并搅拌，鸡蛋逐渐上浮，最终漂浮在盐水中。这一过程中（  ）\nA. 鸡蛋在盐水中漂浮时浮力大于重力\nB. 鸡蛋在清水中下沉时浮力等于重力\nC. 加盐过程中液体密度变大，鸡蛋受到的浮力一直增大\nD. 鸡蛋漂浮和悬浮时浮力都等于重力","answer":"答案：D\n解析：\nA. 漂浮时 F浮 = G。\nB. 下沉时 F浮 < G。\nC. 加盐过程中，在鸡蛋完全浸没时，ρ液增大，V排不变，浮力增大；但鸡蛋开始露出水面后，V排减小，浮力保持等于重力，不再增大。\nD. 正确，漂浮和悬浮都是平衡状态，F浮 = G。"},{"id":"g2_physics_047_ex05","knowledge_id":"g2_physics_047","question":"判断题：物体的密度越小，在液体中就越容易上浮。（  ）","answer":"答案：正确\n解析：对实心物体来说，密度是判断浮沉的重要依据。\nρ物 < ρ液 时上浮，ρ物越小，与ρ液的差距越大，越容易上浮。\n但注意：这是对实心物体而言。如果是空心的，要看平均密度。\n比如轮船是钢铁做的，密度比水大，但做成空心后平均密度小于水，所以能漂浮。"},{"id":"g2_physics_047_ex06","knowledge_id":"g2_physics_047","question":"选择题：同一支密度计分别放入甲、乙两种液体中，静止时如图所示，密度计在甲液体中浸入更深。则下列判断正确的是（  ）\nA. 甲液体密度大\nB. 乙液体密度大\nC. 密度计在甲液体中受到的浮力大\nD. 密度计在乙液体中受到的浮力大","answer":"答案：B\n解析：\n密度计在两种液体中都是漂浮，所以浮力都等于重力，即 F浮甲 = F浮乙 = G，所以C、D都错。\n根据 F浮 = ρ液gV排，浮力相同时，V排越大，ρ液越小。\n甲中浸入更深，V排更大，所以甲液体密度小，乙液体密度大。\n即 ρ甲 < ρ乙。"},{"id":"g2_physics_047_ex07","knowledge_id":"g2_physics_047","question":"计算题：一个体积为 500 cm³ 的木块，密度为 0.6×10³ kg/m³，放入水中。求：（1）木块受到的浮力；（2）木块静止时排开水的体积；（3）木块露出水面的体积。（g 取 10 N/kg）","answer":"答案：（1）3 N；（2）3×10⁻⁴ m³（或 300 cm³）；（3）200 cm³\n解析：\n（1）ρ木 = 0.6×10³ kg/m³ < ρ水，所以木块漂浮。\n木块质量：m = ρ木V = 0.6×10³ × 500×10⁻⁶ = 0.3 kg\n木块重力：G = mg = 0.3 × 10 = 3 N\n漂浮时 F浮 = G = 3 N\n\n（2）由 F浮 = ρ水gV排 得：\nV排 = F浮/(ρ水g) = 3 / (1×10³×10) = 3×10⁻⁴ m³ = 300 cm³\n\n（3）露出体积：V露 = V - V排 = 500 - 300 = 200 cm³"},{"id":"g2_physics_047_ex08","knowledge_id":"g2_physics_047","question":"简答题：请用两种方法判断物体的浮沉，并分别说明。","answer":"答案：\n方法一：比较浮力和重力的大小（受力分析法）\n- F浮 > G → 上浮（最终漂浮，F浮 = G）\n- F浮 = G → 悬浮（或漂浮）\n- F浮 < G → 下沉（最终沉底，F浮 + F支 = G）\n\n方法二：比较物体密度和液体密度（密度判断法，适用于实心物体）\n- ρ物 < ρ液 → 上浮，最终漂浮\n- ρ物 = ρ液 → 悬浮\n- ρ物 > ρ液 → 下沉\n\n两种方法是一致的，可以相互推导。\n注意：对于空心物体，要用平均密度来比较。"},{"id":"g2_physics_047_ex09","knowledge_id":"g2_physics_047","question":"选择题：将一个实心球分别放入甲、乙、丙三种液体中，静止时情况为：甲中漂浮、乙中悬浮、丙中下沉。比较三种液体的密度大小（  ）\nA. 甲最大  \nB. 乙最大\nC. 丙最大  \nD. 一样大","answer":"答案：A\n解析：\n实心球在甲中漂浮 → ρ球 < ρ甲\n在乙中悬浮 → ρ球 = ρ乙\n在丙中下沉 → ρ球 > ρ丙\n所以：ρ甲 > ρ乙 > ρ丙\n甲液体密度最大。"},{"id":"g2_physics_048_ex01","knowledge_id":"g2_physics_048","question":"选择题：关于轮船，下列说法正确的是（  ）\nA. 轮船是用密度大于水的材料制成的，所以不能漂浮在水面上\nB. 轮船从河里驶入海里，受到的浮力变大\nC. 轮船从河里驶入海里，船身会下沉一些\nD. 轮船的排水量是指满载时排开水的质量","answer":"答案：D\n解析：\nA. 轮船用钢铁制成，但做成空心的，增大排开水的体积，使浮力等于重力，所以能漂浮。\nB. 轮船始终漂浮，F浮 = G，重力不变，所以浮力不变。\nC. 从河里到海里，ρ液变大，F浮不变，由F浮=ρ液gV排可知V排变小，船身会上浮一些。\nD. 正确，排水量是轮船满载时排开水的质量，单位通常是吨。"},{"id":"g2_physics_048_ex010","knowledge_id":"g2_physics_048","question":"简答题：请简述潜水艇的工作原理，它是怎样实现上浮和下沉的？","answer":"答案：\n潜水艇的工作原理：潜水艇两侧有水舱，通过向水舱中充水或从水舱中向外排水来改变自身的重力，从而实现上浮和下沉。\n\n具体过程：\n1. 悬浮：水舱中装适量水，潜水艇的总重等于同体积水的重力（G总 = F浮），可悬浮在水中任意位置。\n2. 下沉：向水舱充水，自重增大，G总 > F浮，潜水艇下沉。\n3. 上浮：用压缩空气将水舱中的水排出，自重减小，G总 < F浮，潜水艇上浮。\n\n注意：潜水艇在水面下时，V排不变，所以浮力大小不变，靠改变自重实现浮沉。"},{"id":"g2_physics_048_ex02","knowledge_id":"g2_physics_048","question":"计算题：一艘轮船的排水量是 5000 t，求：（1）它满载时受到的浮力是多大？（2）如果船的自重是 2000 t，最多能装多少吨货物？（g 取 10 N/kg）","answer":"答案：（1）5×10⁷ N；（2）3000 t\n解析：\n（1）排水量 m排 = 5000 t = 5×10⁶ kg\n满载时漂浮，F浮 = G排 = m排g = 5×10⁶ × 10 = 5×10⁷ N\n\n（2）满载时 F浮 = G船 + G货\nG排 = G船 + G货\nm排g = m船g + m货g\nm排 = m船 + m货\nm货 = m排 - m船 = 5000 t - 2000 t = 3000 t"},{"id":"g2_physics_048_ex03","knowledge_id":"g2_physics_048","question":"填空题：潜水艇是通过改变______来实现上浮和下沉的。气球和飞艇是通过改变______来实现升降的。密度计是利用______条件工作的，它的刻度特点是______（填\"上大下小\"或\"上小下大\"）。","answer":"答案：自身重力；自身的体积（或气囊体积）；物体漂浮（F浮=G）；上小下大\n解析：\n- 潜水艇：V排不变（外壳体积不变），通过水舱充水/排水改变自重，从而改变G与F浮的关系。\n- 气球/飞艇：通过改变气囊体积改变V排，从而改变浮力大小。\n- 密度计：漂浮在液面，F浮=G不变，液体密度越小，V排越大，浸入越深，所以刻度上小下大。"},{"id":"g2_physics_048_ex04","knowledge_id":"g2_physics_048","question":"选择题：关于潜水艇，下列说法正确的是（  ）\nA. 潜水艇上浮时浮力变大，下沉时浮力变小\nB. 潜水艇在水面下下潜时，浮力变大\nC. 潜水艇是通过改变自身重力来改变浮沉的\nD. 潜水艇在悬浮和漂浮时受到的浮力相等","answer":"答案：C\n解析：\nA. 潜水艇在水面下时，V排不变，浮力不变。是靠改变自重实现浮沉的。\nB. 完全浸没后，深度增加，V排不变，浮力不变。\nC. 正确。\nD. 悬浮时V排等于总体积，漂浮时V排小于总体积，所以悬浮时浮力大。"},{"id":"g2_physics_048_ex05","knowledge_id":"g2_physics_048","question":"简答题：为什么钢铁做的轮船能漂浮在水面上？请用浮力知识解释轮船的工作原理。","answer":"答案：\n钢铁的密度大于水，如果是实心的铁块，会沉入水底。\n但轮船是用钢铁制成空心的，这样可以大大增加排开水的体积。\n根据阿基米德原理 F浮 = ρ液gV排，V排越大，浮力越大。\n当轮船排开水的重力等于轮船自身的重力时，轮船就能漂浮在水面上。\n\n简单说：轮船漂浮的原理是\"空心法\"——做成空心，增大V排，增大浮力，使F浮 = G。\n这就是\"排水量\"的意义：排开水的质量等于船和货物的总质量。"},{"id":"g2_physics_048_ex06","knowledge_id":"g2_physics_048","question":"选择题：一支密度计分别放入水、酒精和盐水中，静止时如图所示，密度计在三种液体中（  ）\nA. 在水中受到的浮力最大\nB. 在盐水中受到的浮力最大\nC. 在酒精中浸入最深，酒精密度最小\nD. 在三种液体中受到的浮力一样大，酒精密度最大","answer":"答案：C\n解析：\n密度计在三种液体中都漂浮，所以浮力都等于重力，F浮都相等。所以A、B都错。\n根据 F浮 = ρ液gV排，浮力相同时：\nV排越大，ρ液越小。\n酒精中浸入最深，V排最大，所以酒精密度最小。\n盐水中浸入最浅，V排最小，所以盐水密度最大。\n所以C正确，D错误（酒精密度最小）。"},{"id":"g2_physics_048_ex07","knowledge_id":"g2_physics_048","question":"计算题：热气球的气囊体积为 100 m³，空气密度为 1.29 kg/m³。求：（1）热气球在空气中受到的浮力是多大？（2）如果气囊内热空气密度为 1.0 kg/m³，这个热气球最多能承载多重的人和设备？（g 取 10 N/kg）","answer":"答案：（1）1290 N；（2）290 N\n解析：\n（1）热气球在空气中受到的浮力：\nF浮 = ρ空气gV排 = 1.29 × 10 × 100 = 1290 N\n\n（2）内热空气质量：m热 = ρ热V = 1.0 × 100 = 100 kg\n热空气重力：G热 = m热g = 100 × 10 = 1000 N\n最多承载物重：G物 = F浮 - G热 = 1290 - 1000 = 290 N\n\n原理：加热气囊内空气，使空气膨胀，密度减小，自重减小，当浮力大于总重时上升。"},{"id":"g2_physics_048_ex08","knowledge_id":"g2_physics_048","question":"判断题：轮船从河里驶入海里，船身会下沉一些，因为海水密度比河水大。（  ）","answer":"答案：错误\n解析：\n轮船在河里和海里都是漂浮，F浮 = G，浮力不变。\n根据 F浮 = ρ液gV排，浮力不变时，ρ液变大，V排变小。\n海水密度大于河水，所以在海里V排更小，船身会上浮一些，而不是下沉。\n所以题目说\"下沉一些\"是错误的，应该是上浮一些。"},{"id":"g2_physics_048_ex09","knowledge_id":"g2_physics_048","question":"选择题：下列说法中正确的是（  ）\nA. 轮船的排水量是指轮船的质量\nB. 密度计在不同液体中受到的浮力不同\nC. 潜水艇是靠改变浮力大小来实现浮沉的\nD. 气球和飞艇是利用空气的浮力升空的","answer":"答案：D\n解析：\nA. 排水量是满载时排开水的质量，不是轮船自身质量。\nB. 密度计始终漂浮，F浮 = G，浮力不变。\nC. 潜水艇是靠改变自身重力，不是改变浮力（V排不变，浮力不变）。\nD. 正确，气球飞艇都利用空气浮力。"},{"id":"g2_physics_049_ex01","knowledge_id":"g2_physics_049","question":"选择题：下列情况中，力对物体做了功的是（  ）\nA. 人用力推石头，但石头没动\nB. 人举着杠铃站着不动\nC. 冰块在光滑水平面上匀速滑动\nD. 人把水桶从一楼提到三楼","answer":"答案：D\n解析：做功的两个必要因素：①作用在物体上的力；②物体在力的方向上移动了距离。\nA. 有力但没距离，不做功。\nB. 有力但没距离，不做功。\nC. 有距离但水平方向不受力（光滑无摩擦，靠惯性运动），不做功。\nD. 人对水桶有向上的提力，水桶向上移动了距离，所以做了功。正确。"},{"id":"g2_physics_049_ex010","knowledge_id":"g2_physics_049","question":"计算题：一个工人用 200 N 的力沿斜面把重 500 N 的货物推到 2 m 高的车上，斜面长 6 m。求：（1）工人做的功；（2）克服重力做的功。","answer":"答案：（1）1200 J；（2）1000 J\n解析：\n（1）工人的推力沿斜面方向，移动距离沿斜面方向，两者方向一致：\nW人 = Fs = 200 N × 6 m = 1200 J\n\n（2）克服重力做功，只看重力和竖直高度：\nW重 = Gh = 500 N × 2 m = 1000 J\n\n注意：两个功不一样，因为斜面有摩擦，工人做的功有一部分用来克服摩擦了。\n克服重力做功（有用功）是 1000 J，总功是 1200 J。"},{"id":"g2_physics_049_ex02","knowledge_id":"g2_physics_049","question":"计算题：一个人用 50 N 的水平拉力，拉着一个重 100 N 的箱子在水平地面上前进了 10 m。求：（1）人对箱子做的功；（2）重力对箱子做的功。","answer":"答案：（1）500 J；（2）0 J\n解析：\n（1）拉力做功：\nW = Fs = 50 N × 10 m = 500 J\n\n（2）重力方向竖直向下，箱子在竖直方向没有移动距离，所以重力不做功，即 W重力 = 0 J。\n注意：力和移动距离方向垂直时，力不做功。"},{"id":"g2_physics_049_ex03","knowledge_id":"g2_physics_049","question":"填空题：功的计算公式是 W = ______，其中 W 表示______，F 表示______，s 表示______。功的单位是______，简称______，符号是______。1 J = ______ N·m。","answer":"答案：Fs；功；力；物体在力的方向上移动的距离；焦耳；焦；J；1\n解析：\n做功的两个必要因素：有力、在力的方向上有距离，二者缺一不可。\n不做功的三种情况：\n1. 有力无距离（推而不动）\n2. 有距离无力（靠惯性运动）\n3. 力与距离垂直（提水桶水平走）"},{"id":"g2_physics_049_ex04","knowledge_id":"g2_physics_049","question":"选择题：质量相等的甲、乙两个物体，从同一高度处分别沿光滑和粗糙的斜面下滑到地面，则（  ）\nA. 重力对甲做的功多\nB. 重力对乙做的功多\nC. 重力对两物体做的功一样多\nD. 无法判断","answer":"答案：C\n解析：\n重力做功 W = Gh = mgh。\n两个物体质量相等（m相同），从同一高度滑下（h相同），\n所以重力做功相同，都是 W = mgh。\n重力做功只与初末位置的高度差有关，与路径无关，与是否光滑无关。"},{"id":"g2_physics_049_ex05","knowledge_id":"g2_physics_049","question":"判断题：只要有力作用在物体上，这个力就一定对物体做了功。（  ）","answer":"答案：错误\n解析：做功需要同时满足两个条件：\n1. 作用在物体上的力\n2. 物体在力的方向上通过了距离\n\n只有力没有距离，不做功（如推而不动）。\n有距离但力的方向与距离方向垂直，也不做功（如提水桶水平走）。\n所以有力不一定做功。"},{"id":"g2_physics_049_ex06","knowledge_id":"g2_physics_049","question":"选择题：小明用 100 N 的力将重 5 N 的足球踢出去 20 m 远，则小明对足球做的功是（  ）\nA. 2000 J  \nB. 100 J\nC. 0 J  \nD. 条件不足，无法计算","answer":"答案：D\n解析：\n踢足球时，脚对球有力的作用，但这个力只在脚与球接触的瞬间作用，球离开脚后，脚对球就没有力了。\n题目给的 20 m 是球离开脚后运动的距离，这段距离脚没有做功。\n而脚接触球时球移动的距离未知，所以无法计算小明对球做的功。\n注意：不能用 W = Fs 直接计算，因为 F 和 s 不是同时对应的。"},{"id":"g2_physics_049_ex07","knowledge_id":"g2_physics_049","question":"计算题：一个重 500 N 的箱子放在水平地面上，小明用 100 N 的水平推力推箱子，没推动。然后他改用 200 N 的水平推力，使箱子在 10 s 内匀速前进了 5 m。求：（1）第一次推箱子时小明做的功；（2）第二次推箱子时小明做的功。","answer":"答案：（1）0 J；（2）1000 J\n解析：\n（1）第一次推箱子，没推动，有推力但没有移动距离，所以推力不做功：W₁ = 0 J。\n\n（2）第二次推箱子，F = 200 N，s = 5 m\nW₂ = Fs = 200 N × 5 m = 1000 J\n\n注意：做功与否只看力和在力方向上的距离，与时间、速度、重力等无关。"},{"id":"g2_physics_049_ex08","knowledge_id":"g2_physics_049","question":"简答题：用手提着水桶在水平地面上匀速前进，人对水桶的拉力做功了吗？为什么？","answer":"答案：\n人对水桶的拉力没有做功。\n\n原因：做功需要两个必要因素：有力，且物体在力的方向上移动距离。\n人对水桶的拉力方向是竖直向上的，而水桶移动的方向是水平的。\n拉力方向与移动距离方向垂直，水桶在拉力方向（竖直方向）上没有移动距离，所以拉力不做功。\n\n这就是\"力与距离垂直不做功\"的典型例子。"},{"id":"g2_physics_049_ex09","knowledge_id":"g2_physics_049","question":"选择题：下列关于功的说法中正确的是（  ）\nA. 作用在物体上的力越大，做功越多\nB. 物体移动的距离越大，做功越多\nC. 力越大，移动距离越大，做功一定越多\nD. 力越大，在力方向上移动的距离越大，做功越多","answer":"答案：D\n解析：\n功 W = Fs，其中 s 是物体在力的方向上移动的距离，不是任意距离。\nA. 没说距离，不对。\nB. 没说力，不对。\nC. 没说距离是在力方向上的，不对（如果垂直就不做功）。\nD. 正确，W = Fs，F和s（力方向上的）都大，功就多。"},{"id":"g2_physics_050_ex01","knowledge_id":"g2_physics_050","question":"选择题：下列关于功率的说法，正确的是（  ）\nA. 功率越大，做功越多\nB. 功率越大，做功越快\nC. 做功时间越短，功率越大\nD. 做功时间越长，功率越大","answer":"答案：B\n解析：\n功率是表示做功快慢的物理量，不是表示做功多少。\n功率 = 功 / 时间（P = W/t）\nA. 功率大做功不一定多，还要看时间。\nB. 正确，功率就是表示做功快慢的。\nC. 没说做功多少，不对。\nD. 明显错误。"},{"id":"g2_physics_050_ex010","knowledge_id":"g2_physics_050","question":"选择题：关于功和功率，下列说法正确的是（  ）\nA. 做功多的机器功率一定大\nB. 功率大的机器做功时间一定短\nC. 功率大的机器做功一定快\nD. 做相同的功，时间长的机器功率大","answer":"答案：C\n解析：\nA. 做功多，时间如果也很长，功率不一定大。\nB. 功率大，如果做功也多，时间不一定短。\nC. 正确，功率就是表示做功快慢的物理量。\nD. 做相同的功，时间长的功率小（P = W/t，t大则P小）。"},{"id":"g2_physics_050_ex02","knowledge_id":"g2_physics_050","question":"计算题：小明在 10 s 内把重 300 N 的箱子从一楼搬到三楼，已知每层楼高 3 m。求：（1）小明做的功；（2）小明的功率。","answer":"答案：（1）1800 J；（2）180 W\n解析：\n（1）从一楼到三楼，上升高度 h = 2 × 3 m = 6 m（注意：一楼到三楼是两层楼高）\nW = Gh = 300 N × 6 m = 1800 J\n\n（2）P = W/t = 1800 J / 10 s = 180 W"},{"id":"g2_physics_050_ex03","knowledge_id":"g2_physics_050","question":"填空题：功率是表示物体______的物理量。功率的计算公式是 P = ______，变形公式 W = ______，t = ______。功率的单位是______，简称______，符号是______。常用单位还有______。","answer":"答案：做功快慢；W/t；Pt；W/P；瓦特；瓦；W；千瓦（kW）\n解析：\n1 W = 1 J/s，表示 1 秒内做功 1 焦耳。\n1 kW = 1000 W\n功率大表示做功快，但不表示做功多。做功多少还与时间有关。"},{"id":"g2_physics_050_ex04","knowledge_id":"g2_physics_050","question":"选择题：甲、乙两个同学体重相同，都从一楼上到五楼，甲慢慢走上去，乙快速跑上去。比较两人做的功和功率（  ）\nA. 甲做功多，功率大  \nB. 乙做功多，功率大\nC. 两人做功一样多，乙功率大  \nD. 两人做功一样多，功率一样大","answer":"答案：C\n解析：\n功 W = Gh，体重相同，楼高相同，所以做功一样多。\n功率 P = W/t，做功相同，乙用的时间短，所以乙的功率大。\n所以选C。"},{"id":"g2_physics_050_ex05","knowledge_id":"g2_physics_050","question":"判断题：做功越多，功率越大。（  ）","answer":"答案：错误\n解析：功率 P = W/t，功率大小由做功多少和做功时间两个因素共同决定。\n做功多，如果时间也很长，功率不一定大。\n正确的说法是：在相同时间内，做功越多，功率越大。\n或者：做相同的功，用时越短，功率越大。"},{"id":"g2_physics_050_ex06","knowledge_id":"g2_physics_050","question":"计算题：一辆汽车的功率是 60 kW，在水平公路上以 10 m/s 的速度匀速行驶。求：（1）汽车发动机在 1 min 内做的功；（2）汽车受到的牵引力是多大？","answer":"答案：（1）3.6×10⁶ J；（2）6000 N\n解析：\n（1）P = 60 kW = 6×10⁴ W，t = 1 min = 60 s\nW = Pt = 6×10⁴ W × 60 s = 3.6×10⁶ J\n\n（2）由 P = W/t = Fs/t = Fv 得：\nF = P/v = 6×10⁴ W / 10 m/s = 6000 N\n这就是功率与速度的关系：P = Fv。速度越大，牵引力越小。"},{"id":"g2_physics_050_ex07","knowledge_id":"g2_physics_050","question":"选择题：下列单位中，不是功率单位的是（  ）\nA. W  \nB. J/s\nC. kW·h  \nD. kW","answer":"答案：C\n解析：\nA. W（瓦特）是功率的国际单位。\nB. J/s 也是功率单位，1 W = 1 J/s。\nC. kW·h（千瓦时）是电能单位（度），不是功率单位。1 kW·h = 3.6×10⁶ J。正确。\nD. kW（千瓦）是功率单位，1 kW = 1000 W。"},{"id":"g2_physics_050_ex08","knowledge_id":"g2_physics_050","question":"计算题：小明和小红比赛爬楼梯，小明体重 500 N，小红体重 400 N。小明用 20 s 从一楼爬到 6 楼，小红用 15 s 从一楼爬到 5 楼。已知每层楼高 3 m。比较谁的功率大。（g 取 10 N/kg）","answer":"答案：小明功率大\n解析：\n小明：h明 = 5 × 3 m = 15 m（1到6楼是5层）\nW明 = G明h明 = 500 × 15 = 7500 J\nP明 = W明/t明 = 7500 / 20 = 375 W\n\n小红：h红 = 4 × 3 m = 12 m（1到5楼是4层）\nW红 = G红h红 = 400 × 12 = 4800 J\nP红 = W红/t红 = 4800 / 15 = 320 W\n\n因为 375 W > 320 W，所以小明的功率大。"},{"id":"g2_physics_050_ex09","knowledge_id":"g2_physics_050","question":"简答题：功率大的机器做功一定多吗？为什么？请举例说明。","answer":"答案：\n不一定。\n\n功率是表示做功快慢的物理量，功率大只表示做功快，不表示做功多。\n做功多少 W = Pt，由功率和时间共同决定。\n\n举例：\n一台功率 1000 W 的机器工作 1 秒，做功 W = 1000 × 1 = 1000 J。\n一台功率 100 W 的机器工作 1 分钟（60 秒），做功 W = 100 × 60 = 6000 J。\n虽然第一台功率大，但因为工作时间短，做的功反而少。\n\n所以\"功率大做功多\"是错误的，还要看时间。"},{"id":"g2_physics_051_ex01","knowledge_id":"g2_physics_051","question":"选择题：下列关于动能的说法，正确的是（  ）\nA. 运动的物体具有的能叫动能\nB. 速度大的物体动能一定大\nC. 质量大的物体动能一定大\nD. 动能与物体的质量和速度都有关","answer":"答案：D\n解析：\nA. 运动的物体具有的能包括动能和势能（如高空飞行的飞机既有动能也有重力势能），不能说\"运动的物体具有的能叫动能\"，应该说\"物体由于运动而具有的能叫动能\"。\nB. 动能还与质量有关。\nC. 动能还与速度有关。\nD. 正确，动能大小由质量和速度共同决定：Ek = ½mv²。"},{"id":"g2_physics_051_ex010","knowledge_id":"g2_physics_051","question":"简答题：为什么同样速度的大卡车比小汽车的刹车距离长？请用动能的知识解释。","answer":"答案：\n动能大小与质量和速度有关（Ek = ½mv²）。\n大卡车和小汽车速度相同时，大卡车的质量大得多，所以大卡车的动能大得多。\n\n刹车时，摩擦力使车停下来，需要克服摩擦力做功。\n动能越大，需要做的功越多，在摩擦力差不多的情况下，需要的刹车距离就越长。\n\n所以大卡车因为质量大、动能大，刹车距离更长，也更容易发生交通事故。\n这也是为什么高速公路上对大卡车有限速要求的原因。"},{"id":"g2_physics_051_ex02","knowledge_id":"g2_physics_051","question":"选择题：下列物体中，具有重力势能的是（  ）\nA. 在水平公路上行驶的汽车\nB. 拉长的橡皮筋\nC. 悬挂在天花板上的吊灯\nD. 地面上的石头","answer":"答案：C\n解析：\n重力势能是物体由于被举高而具有的能。\nA. 在水平路面上，高度为0（以地面为参考面），没有重力势能（有动能）。\nB. 拉长的橡皮筋具有弹性势能，不是重力势能。\nC. 吊灯被举高，具有重力势能。正确。\nD. 地面上的石头，高度为0，没有重力势能。"},{"id":"g2_physics_051_ex03","knowledge_id":"g2_physics_051","question":"填空题：物体由于______而具有的能叫动能，动能大小与______和______有关；物体由于______而具有的能叫重力势能，重力势能大小与______和______有关；物体由于发生______而具有的能叫弹性势能，弹性势能大小与______有关。","answer":"答案：运动；质量；速度；被举高；质量；被举高度；弹性形变；弹性形变程度\n解析：\n动能：Ek = ½mv²，质量越大、速度越大，动能越大。\n重力势能：Ep = mgh，质量越大、高度越高，重力势能越大。\n弹性势能：与弹性形变程度有关，形变越大，弹性势能越大。\n动能和势能统称为机械能。"},{"id":"g2_physics_051_ex04","knowledge_id":"g2_physics_051","question":"选择题：为了探究动能大小与什么因素有关，小明做了如下实验：让同一钢球从斜面的不同高度由静止滚下，碰到同一木块上。该实验探究的是（  ）\nA. 动能与质量的关系\nB. 动能与速度的关系\nC. 动能与高度的关系\nD. 动能与势能的关系","answer":"答案：B\n解析：\n同一钢球，质量相同；从不同高度滚下，到达水平面时速度不同。\n所以这是控制质量不变，研究动能与速度的关系。\n实验中通过木块被推动的距离来反映动能大小（转换法）。"},{"id":"g2_physics_051_ex05","knowledge_id":"g2_physics_051","question":"判断题：速度大的物体动能一定比速度小的物体动能大。（  ）","answer":"答案：错误\n解析：\n动能大小由质量和速度两个因素共同决定：Ek = ½mv²。\n速度大的物体，如果质量很小，动能不一定大。\n例如：一颗高速飞行的子弹，速度很大，但质量很小，动能可能不如一辆慢速行驶的汽车大。\n正确的说法是：在质量相同时，速度越大，动能越大。"},{"id":"g2_physics_051_ex06","knowledge_id":"g2_physics_051","question":"选择题：下列情况中，物体的重力势能变大的是（  ）\nA. 匀速上升的电梯\nB. 匀速下降的跳伞运动员\nC. 水平路面上匀速行驶的汽车\nD. 从高处下落的石块","answer":"答案：A\n解析：\n重力势能与质量和高度有关。质量不变时，高度越高，重力势能越大。\nA. 匀速上升，高度增加，重力势能变大。正确。\nB. 匀速下降，高度减小，重力势能变小。\nC. 水平行驶，高度不变，重力势能不变。\nD. 下落，高度减小，重力势能变小（动能变大）。"},{"id":"g2_physics_051_ex07","knowledge_id":"g2_physics_051","question":"实验分析题：在\"探究影响重力势能大小的因素\"实验中：\n（1）让同一个铅球从不同高度自由下落，砸在沙坑里，观察沙坑凹陷程度。这是探究什么因素对重力势能的影响？\n（2）让质量不同的铅球从同一高度自由下落，观察沙坑凹陷程度。这是探究什么因素对重力势能的影响？\n（3）实验中通过什么来反映重力势能的大小？这种方法叫什么？","answer":"答案：\n（1）探究高度对重力势能的影响（控制质量相同，改变高度）。\n结论：质量相同时，高度越高，重力势能越大。\n\n（2）探究质量对重力势能的影响（控制高度相同，改变质量）。\n结论：高度相同时，质量越大，重力势能越大。\n\n（3）通过沙坑凹陷的深度（或程度）来反映重力势能的大小。\n这种方法叫转换法（将不易直接测量的物理量转换为容易观察的现象）。"},{"id":"g2_physics_051_ex08","knowledge_id":"g2_physics_051","question":"选择题：下列物体具有弹性势能的是（  ）\nA. 放在桌面上的弹簧  \nB. 被拉长的橡皮筋\nC. 静止的弹簧测力计  \nD. 平放在桌上的弓","answer":"答案：B\n解析：\n弹性势能是物体由于发生弹性形变而具有的能。\nA. 放在桌面上的弹簧，如果没有被压缩或拉伸，没有弹性形变，就没有弹性势能。\nB. 被拉长的橡皮筋发生了弹性形变，具有弹性势能。正确。\nC. 静止的弹簧测力计，如果没有挂钩码或拉力，弹簧没有形变，没有弹性势能。\nD. 平放在桌上的弓，如果没有上箭拉开，没有形变，没有弹性势能。"},{"id":"g2_physics_051_ex09","knowledge_id":"g2_physics_051","question":"计算题：比较下列两个物体的动能大小：\n甲物体：质量 2 kg，速度 3 m/s\n乙物体：质量 1 kg，速度 6 m/s\n哪个物体的动能大？","answer":"答案：乙物体动能大\n解析：\n动能公式：Ek = ½mv²\n\n甲的动能：Ek甲 = ½ × 2 × 3² = 1 × 9 = 9 J\n乙的动能：Ek乙 = ½ × 1 × 6² = 0.5 × 36 = 18 J\n\n因为 18 J > 9 J，所以乙物体的动能大。\n注意：动能与速度的平方成正比，速度对动能的影响更大。"},{"id":"g2_physics_052_ex01","knowledge_id":"g2_physics_052","question":"选择题：下列过程中，属于动能转化为重力势能的是（  ）\nA. 苹果从树上落下\nB. 自行车从斜坡上滑下\nC. 向上抛出的小球在上升过程中\nD. 撑开的弓把箭射出去","answer":"答案：C\n解析：\n动能转化为重力势能的特征：动能减小，重力势能增大（速度减小，高度增大）。\nA. 苹果下落，速度增大，高度减小，重力势能转化为动能。\nB. 自行车下滑，高度减小，速度增大，重力势能转化为动能。\nC. 小球上升，速度减小，高度增大，动能转化为重力势能。正确。\nD. 弓的弹性势能转化为箭的动能。"},{"id":"g2_physics_052_ex010","knowledge_id":"g2_physics_052","question":"分析题：为什么从高处下落的物体，下落的高度越高，落地时的速度越大？请用机械能转化的知识解释。","answer":"答案：\n在不计空气阻力的情况下，物体下落过程中机械能守恒。\n\n物体在高处时具有重力势能，高度越高，重力势能越大。\n下落过程中，重力势能逐渐转化为动能，重力势能越小，动能越大。\n落地时，重力势能全部转化为动能。\n\n根据机械能守恒：mgh = ½mv²\n化简得：v² = 2gh，即 v = √(2gh)\n高度 h 越大，落地速度 v 就越大。\n\n所以，物体从越高的地方下落，落地时的速度就越大，冲击力也越大，越危险。\n这就是为什么高空坠物很危险的原因。"},{"id":"g2_physics_052_ex02","knowledge_id":"g2_physics_052","question":"填空题：动能和势能统称为______。动能和势能可以相互______。在只有动能和势能相互转化的过程中，机械能的总量______，这就是______定律。","answer":"答案：机械能；转化；保持不变（守恒）；机械能守恒\n解析：\n机械能 = 动能 + 势能（重力势能 + 弹性势能）\n机械能守恒的条件：只有动能和势能相互转化，没有摩擦等能量损失。\n实际生活中通常有摩擦，机械能会减少（转化为内能等），但总能量是守恒的。"},{"id":"g2_physics_052_ex03","knowledge_id":"g2_physics_052","question":"选择题：一个滚摆从最高处下降到最低处的过程中（  ）\nA. 动能增大，重力势能增大，机械能增大\nB. 动能减小，重力势能减小，机械能减小\nC. 动能增大，重力势能减小，机械能不变（不计摩擦）\nD. 动能减小，重力势能增大，机械能不变（不计摩擦）","answer":"答案：C\n解析：\n滚摆下降过程中，高度减小，重力势能减小；速度增大，动能增大。\n是重力势能转化为动能。\n如果不计摩擦，机械能守恒，总量不变。\n所以选C。"},{"id":"g2_physics_052_ex04","knowledge_id":"g2_physics_052","question":"判断题：在草地上滚动的足球越来越慢，最后停下来，这是因为足球的动能消失了。（  ）","answer":"答案：错误\n解析：\n足球越来越慢，动能减小，但动能并没有消失，而是因为克服摩擦力做功，动能转化成了内能（热能）。\n能量不会消失，只会从一种形式转化为另一种形式，或者从一个物体转移到另一个物体。\n这就是能量守恒定律。\n足球的机械能减少了，但总能量（机械能+内能）是守恒的。"},{"id":"g2_physics_052_ex05","knowledge_id":"g2_physics_052","question":"选择题：下列情况中，机械能守恒的是（不计空气阻力）（  ）\nA. 物体从高处自由下落\nB. 跳伞运动员匀速下落\nC. 汽车在水平路面上刹车减速\nD. 小孩从滑梯上匀速滑下","answer":"答案：A\n解析：\n机械能守恒的条件：只有动能和势能相互转化，没有其他能量损失（如摩擦）。\nA. 自由下落，只有重力做功，重力势能转化为动能，机械能守恒。正确。\nB. 匀速下落，动能不变，重力势能减小，机械能减小（克服空气阻力做功）。\nC. 刹车减速，动能减小，机械能减小（克服摩擦做功）。\nD. 匀速下滑，动能不变，重力势能减小，机械能减小（克服摩擦做功）。"},{"id":"g2_physics_052_ex06","knowledge_id":"g2_physics_052","question":"简答题：请分析单摆摆动过程中的能量转化情况。（不计空气阻力）","answer":"答案：\n单摆摆动过程中（不计空气阻力），机械能守恒。\n\n1. 最高点（最左端或最右端）：\n速度为0，动能为0；高度最高，重力势能最大。\n此时重力势能最大，动能为0。\n\n2. 下降过程（从最高点到最低点）：\n高度减小，重力势能减小；速度增大，动能增大。\n重力势能转化为动能。\n\n3. 最低点（平衡位置）：\n高度最低，重力势能最小；速度最大，动能最大。\n重力势能最小，动能最大。\n\n4. 上升过程（从最低点到另一侧最高点）：\n高度增大，重力势能增大；速度减小，动能减小。\n动能转化为重力势能。\n\n整个过程中，动能和重力势能不断相互转化，但机械能总量保持不变。"},{"id":"g2_physics_052_ex07","knowledge_id":"g2_physics_052","question":"选择题：下列过程中，属于弹性势能转化为动能的是（  ）\nA. 推开弹簧门的过程\nB. 用力拉长弹弓橡皮筋的过程\nC. 弹簧枪将子弹射出去的过程\nD. 跳水运动员将跳板压弯的过程","answer":"答案：C\n解析：\n弹性势能转化为动能的特征：弹性形变减小（弹性势能减小），速度增大（动能增大）。\nA. 推开弹簧门，弹簧形变增大，是人的动能转化为弹性势能。\nB. 拉长橡皮筋，形变增大，是人的能量转化为弹性势能。\nC. 弹簧枪发射，弹簧形变减小，子弹速度增大，弹性势能转化为动能。正确。\nD. 跳板被压弯，形变增大，是人的重力势能转化为跳板的弹性势能。"},{"id":"g2_physics_052_ex08","knowledge_id":"g2_physics_052","question":"计算题：一个质量为 2 kg 的物体从 5 m 高处自由下落（不计空气阻力，g 取 10 N/kg）。求：（1）物体在最高点时的重力势能；（2）物体落到地面时的动能；（3）物体落到地面时的速度。","answer":"答案：（1）100 J；（2）100 J；（3）10 m/s\n解析：\n（1）最高点重力势能：Ep = mgh = 2 × 10 × 5 = 100 J\n（2）不计空气阻力，机械能守恒。落地时重力势能全部转化为动能，所以 Ek = 100 J。\n（3）由 Ek = ½mv² 得：\nv² = 2Ek/m = 2×100/2 = 100\nv = 10 m/s\n（验证：自由落体 v² = 2gh = 2×10×5 = 100，v = 10 m/s，一致。）"},{"id":"g2_physics_052_ex09","knowledge_id":"g2_physics_052","question":"选择题：人造卫星在大气层外沿椭圆轨道绕地球运行，当它从远地点向近地点运动时（  ）\nA. 动能增大，势能增大，机械能增大\nB. 动能减小，势能减小，机械能减小\nC. 动能增大，势能减小，机械能不变\nD. 动能减小，势能增大，机械能不变","answer":"答案：C\n解析：\n卫星在大气层外，没有空气阻力，机械能守恒。\n从远地点到近地点，卫星离地面的高度减小（近地点离地球近），所以重力势能减小。\n机械能守恒，势能减小，动能就增大，所以速度增大。\n这就是为什么卫星在近地点速度最大，远地点速度最小。"},{"id":"g2_physics_053_ex01","knowledge_id":"g2_physics_053","question":"选择题：下列关于杠杆的说法，正确的是（  ）\nA. 杠杆必须是直的\nB. 杠杆的支点一定在动力和阻力之间\nC. 力臂是支点到力的作用点的距离\nD. 力臂是支点到力的作用线的距离","answer":"答案：D\n解析：\nA. 杠杆可以是弯的，只要是硬棒、能绕固定点转动就行。\nB. 支点不一定在中间，也可以在一端（如钓鱼竿）。\nC. 力臂不是到作用点的距离，是到力的作用线的垂直距离。\nD. 正确，力臂是支点到力的作用线的垂直距离。"},{"id":"g2_physics_053_ex010","knowledge_id":"g2_physics_053","question":"作图分析题：画出用羊角锤拔钉子时的支点、动力、阻力、动力臂、阻力臂，并说明这是什么类型的杠杆。","answer":"答案：\n支点 O：羊角锤与桌面接触的那个点。\n动力 F₁：手对锤柄的作用力（方向垂直于锤柄向外）。\n阻力 F₂：钉子对羊角锤的阻力（方向向下，阻碍转动）。\n动力臂 L₁：从支点 O 到动力作用线的垂直距离。\n阻力臂 L₂：从支点 O 到阻力作用线的垂直距离。\n\n因为动力臂 L₁ 远大于阻力臂 L₂，所以动力 F₁ 远小于阻力 F₂。\n这是省力杠杆。\n\n省力杠杆的特点：省力但费距离，手移动大距离，钉子只被拔出一点。"},{"id":"g2_physics_053_ex02","knowledge_id":"g2_physics_053","question":"计算题：用一根杠杆撬石头，石头重 1200 N，阻力臂是 0.3 m，动力臂是 1.5 m。求需要多大的动力才能撬动石头？","answer":"答案：240 N\n解析：\n根据杠杆平衡条件：F₁L₁ = F₂L₂\n代入数据：F₁ × 1.5 m = 1200 N × 0.3 m\nF₁ = (1200 × 0.3) / 1.5 = 360 / 1.5 = 240 N\n需要 240 N 的力就能撬动 1200 N 的石头，这就是省力杠杆的好处。"},{"id":"g2_physics_053_ex03","knowledge_id":"g2_physics_053","question":"填空题：杠杆的五要素是：______、______、______、______、______。杠杆平衡条件是：______（写公式）。","answer":"答案：支点（O）；动力（F₁）；阻力（F₂）；动力臂（L₁）；阻力臂（L₂）；F₁L₁ = F₂L₂\n解析：\n- 支点：杠杆绕着转动的点（O）\n- 动力：使杠杆转动的力（F₁）\n- 阻力：阻碍杠杆转动的力（F₂）\n- 动力臂：支点到动力作用线的距离（L₁）\n- 阻力臂：支点到阻力作用线的距离（L₂）\n\n平衡条件：动力×动力臂 = 阻力×阻力臂，即 F₁L₁ = F₂L₂"},{"id":"g2_physics_053_ex04","knowledge_id":"g2_physics_053","question":"选择题：下列杠杆中，属于省力杠杆的是（  ）\nA. 镊子  \nB. 钓鱼竿\nC. 瓶盖起子  \nD. 筷子","answer":"答案：C\n解析：\n省力杠杆：动力臂 > 阻力臂，省力但费距离。\n费力杠杆：动力臂 < 阻力臂，费力但省距离。\n等臂杠杆：动力臂 = 阻力臂，不省力也不费力。\n\nA. 镊子是费力杠杆（为了省距离，使用方便）。\nB. 钓鱼竿是费力杠杆（手移动小距离，鱼移动大距离）。\nC. 瓶盖起子是省力杠杆（动力臂长，省力）。正确。\nD. 筷子是费力杠杆。"},{"id":"g2_physics_053_ex05","knowledge_id":"g2_physics_053","question":"判断题：省力杠杆既能省力，又能省距离。（  ）","answer":"答案：错误\n解析：\n根据功的原理，使用任何机械都不省功。\n省力杠杆：动力臂 > 阻力臂，所以动力 < 阻力，省力；\n但根据 F₁L₁ = F₂L₂，省力的同时，动力移动的距离更大，费距离。\n\n省力杠杆省力但费距离，费力杠杆费力但省距离。\n既省力又省距离的机械是不存在的。"},{"id":"g2_physics_053_ex06","knowledge_id":"g2_physics_053","question":"选择题：在\"探究杠杆平衡条件\"的实验中，杠杆左端下沉，右端上翘。为了使杠杆在水平位置平衡，应该（  ）\nA. 将左端的平衡螺母向左调\nB. 将右端的平衡螺母向左调\nC. 将左端的平衡螺母向右调\nD. 两端的平衡螺母都向左调","answer":"答案：C\n解析：\n杠杆左端下沉，说明左端重，右端轻。\n要使杠杆平衡，应将平衡螺母向高的一端（右端）调。\n无论是左端还是右端的平衡螺母，都向右调。\n所以C正确（左端螺母向右调）。\n实验前调水平的目的：便于测量力臂（因为水平时力臂就在杠杆上，直接读刻度）。"},{"id":"g2_physics_053_ex07","knowledge_id":"g2_physics_053","question":"计算题：一根轻质杠杆，支点在左端，在离支点 0.5 m 处挂一个重 100 N 的物体。一个人用竖直向上的力在右端抬杠杆，杠杆长 2 m。求：（1）人需要多大的力才能抬起重物？（2）这是什么类型的杠杆？","answer":"答案：（1）25 N；（2）省力杠杆\n解析：\n（1）设支点在左端，右端为动力作用点。\n阻力 F₂ = G = 100 N，阻力臂 L₂ = 0.5 m\n动力臂 L₁ = 2 m（整个杠杆长度）\n\n由 F₁L₁ = F₂L₂ 得：\nF₁ = F₂L₂ / L₁ = 100 × 0.5 / 2 = 25 N\n\n（2）因为 L₁ > L₂，所以 F₁ < F₂，是省力杠杆。\n（省力费距离：手抬 2 m，重物只升 0.5 m）"},{"id":"g2_physics_053_ex08","knowledge_id":"g2_physics_053","question":"简答题：什么是杠杆的\"省力\"和\"费力\"？请分别举出两个省力杠杆和两个费力杠杆的例子，并说明它们各自的好处。","answer":"答案：\n省力杠杆：动力臂 > 阻力臂，动力 < 阻力，省力但费距离。\n好处：省力，用较小的力就能撬动较重的物体。\n例子：撬棍、瓶盖起子、羊角锤、钢丝钳、手推车、扳手等。\n\n费力杠杆：动力臂 < 阻力臂，动力 > 阻力，费力但省距离。\n好处：省距离，动力移动小距离，阻力端移动大距离，使用方便、灵活。\n例子：镊子、钓鱼竿、筷子、扫帚、船桨、人的手臂等。\n\n还有等臂杠杆：动力臂 = 阻力臂，不省力也不费力，如天平、定滑轮。"},{"id":"g2_physics_053_ex09","knowledge_id":"g2_physics_053","question":"选择题：如图所示，用方向不同的力 F₁、F₂、F₃ 分别作用在杠杆的同一端，使杠杆平衡。则三个力的大小关系是（  ）\n（F₁竖直向上，F₂垂直杠杆向上，F₃斜向上）\nA. F₁ 最大  \nB. F₂ 最大\nC. F₃ 最大  \nD. 三个力一样大","answer":"答案：C\n解析：\n阻力和阻力臂不变，根据 F₁L₁ = F₂L₂，动力臂越长，动力越小。\nF₂ 垂直于杠杆，此时力臂等于杠杆长度，是最长的力臂，所以 F₂ 最小。\nF₁ 竖直向上，力臂是支点到 F₁ 作用线的水平距离，比杠杆长短。\nF₃ 斜向上，力臂更短（支点到斜线的垂直距离更短），所以 F₃ 最大。\n\n结论：垂直于杠杆的力最小，力的方向越倾斜，需要的力越大。"},{"id":"g2_physics_054_ex01","knowledge_id":"g2_physics_054","question":"选择题：关于定滑轮，下列说法正确的是（  ）\nA. 定滑轮能省力\nB. 定滑轮能省距离\nC. 定滑轮能改变力的方向\n\n答案：C","answer":"答案：C\n解析：定滑轮的特点：不省力也不费力，不省距离也不费距离，能改变力的方向。\n定滑轮实质是等臂杠杆，所以不省力也不费力，不省距离也不费距离。\n使用定滑轮的好处是可以改变力的方向，方便操作。"},{"id":"g2_physics_054_ex010","knowledge_id":"g2_physics_054","question":"选择题：质量相等的甲、乙两个物体，分别用定滑轮和动滑轮匀速提升相同高度（不计摩擦和动滑轮重），则拉力做的功（  ）\nA. 甲多  \nB. 乙多\nC. 一样多  \nD. 无法判断","answer":"答案：C\n解析：\n不计摩擦和动滑轮重，使用任何机械都不省功（功的原理）。\n甲用定滑轮：F甲 = G，s甲 = h，W甲 = F甲s甲 = Gh\n乙用动滑轮：F乙 = G/2，s乙 = 2h，W乙 = F乙s乙 = (G/2)×(2h) = Gh\n所以 W甲 = W乙 = Gh，做功一样多。\n动滑轮省力但费距离，总功不变。\n\n注意：如果考虑动滑轮重，乙要多提动滑轮，做功更多。但题目说不计动滑轮重。"},{"id":"g2_physics_054_ex02","knowledge_id":"g2_physics_054","question":"计算题：用一个动滑轮将重 400 N 的物体匀速提升 2 m，不计摩擦和动滑轮重。求：（1）需要的拉力多大？（2）绳子自由端移动的距离是多少？","answer":"答案：（1）200 N；（2）4 m\n解析：\n动滑轮的特点：省一半力（不计摩擦和动滑轮重），费一倍距离。\n（1）F = G/2 = 400 N / 2 = 200 N\n（2）s = 2h = 2 × 2 m = 4 m\n\n动滑轮实质是动力臂为阻力臂二倍的杠杆，所以省一半力。"},{"id":"g2_physics_054_ex03","knowledge_id":"g2_physics_054","question":"填空题：定滑轮的实质是______杠杆，所以使用定滑轮不省力也不费力，但可以______。动滑轮的实质是动力臂为阻力臂______倍的杠杆，所以使用动滑轮能省______力，但费______距离。","answer":"答案：等臂；改变力的方向；2（二）；一半；一倍\n解析：\n定滑轮：支点在轴心，动力臂=阻力臂=半径，是等臂杠杆。不省力，能改变力的方向。\n动滑轮：支点在绳子与滑轮的切点，动力臂=直径，阻力臂=半径，动力臂是阻力臂的2倍。省一半力，费一倍距离，不能改变力的方向。"},{"id":"g2_physics_054_ex04","knowledge_id":"g2_physics_054","question":"选择题：使用滑轮组时，下列说法正确的是（  ）\nA. 一定省力\nB. 一定改变力的方向\nC. 既能省力又能改变力的方向\n\n 答案：C\n解析：滑轮组是定滑轮和动滑轮的组合。\n省力情况取决于承担物重的绳子段数 n：F = G总/n\n\n既可以省力，又可以改变力的方向（取决于绳子绕法）。\n\n注意：\"一定\"都不对，因为：\n- 省力是肯定的（只要有动滑轮）\n- 但不一定改变方向（要看绕法，从动滑轮开始绕就不改变方向）\n\n所以最准确的说法是\"可以省力，也可以改变力的方向\"。"},{"id":"g2_physics_054_ex05","knowledge_id":"g2_physics_054","question":"计算题：用如图所示的滑轮组提升重物，已知物体重 600 N，动滑轮重 30 N，不计摩擦。求：（1）绳子自由端的拉力多大？（2）若物体上升 1 m，绳子自由端移动多少米？（n = 3）","answer":"答案：（1）210 N；（2）3 m\n解析：\n（1）n = 3（承担物重的绳子段数为3）\n拉力 F = (G物 + G动)/n = (600 + 30)/3 = 630/3 = 210 N\n\n（2）绳子自由端移动距离：s = nh = 3 × 1 m = 3 m\n\n注意：考虑动滑轮自重时，拉力要把动滑轮的重量也算进去。\n不计动滑轮重时，F = G/n = 600/3 = 200 N。"},{"id":"g2_physics_054_ex06","knowledge_id":"g2_physics_054","question":"判断题：动滑轮和定滑轮都能省力。（  ）","answer":"答案：错误\n解析：\n定滑轮不能省力，只能改变力的方向。\n动滑轮能省一半力（不计摩擦和动滑轮重），但不能改变力的方向。\n滑轮组既能省力，又可能改变力的方向（取决于绕法）。\n所以\"都能省力\"是错的。"},{"id":"g2_physics_054_ex07","knowledge_id":"g2_physics_054","question":"选择题：某同学用一个定滑轮和一个动滑轮组成的滑轮组提升重物，他站在地面上用 250 N 的拉力将重 400 N 的物体匀速提升。则承担物重的绳子段数 n 和滑轮组的绕法是（  ）\nA. n = 2，绳子固定端在定滑轮上\nB. n = 2，绳子固定端在动滑轮上\nC. n = 3，绳子固定端在定滑轮上\nD. n = 3，绳子固定端在动滑轮上","answer":"答案：A\n解析：\nF = 250 N，G = 400 N\n由 F = G/n 得：n = G/F = 400/250 = 1.6，向上取整，n = 2。\n因为人站在地面上拉，拉力方向向下，说明最后一段绳子是从定滑轮出来的。\n所以绕法是：绳子固定端在定滑轮上，绕过动滑轮，再绕过定滑轮，最后向下拉。\n即 n = 2，固定端在定滑轮上。选A。"},{"id":"g2_physics_054_ex08","knowledge_id":"g2_physics_054","question":"计算题：用滑轮组将重 900 N 的物体匀速提升 2 m，已知滑轮组的机械效率是 75%，拉力 F = 300 N。求：（1）有用功；（2）总功；（3）绳子自由端移动的距离；（4）承担物重的绳子段数 n。","answer":"答案：（1）1800 J；（2）2400 J；（3）8 m；（4）n = 4\n解析：\n（1）W有用 = Gh = 900 × 2 = 1800 J\n（2）W总 = W有用/η = 1800 / 0.75 = 2400 J\n（3）W总 = Fs，所以 s = W总/F = 2400 / 300 = 8 m\n（4）s = nh，所以 n = s/h = 8 / 2 = 4\n\n验证：不计动滑轮重的话 F = G/n = 900/4 = 225 N，但实际F = 300 N，说明有动滑轮重和摩擦，符合实际。"},{"id":"g2_physics_054_ex09","knowledge_id":"g2_physics_054","question":"简答题：定滑轮和动滑轮各有什么特点？它们的实质分别是什么？请分别举例说明它们的应用。","answer":"答案：\n定滑轮特点：不省力，不省距离，能改变力的方向。\n实质：等臂杠杆（动力臂=阻力臂=滑轮半径）。\n应用：旗杆顶部的滑轮、起重机的吊钩上方、电梯顶部等。\n\n动滑轮特点：省一半力（不计摩擦和滑轮重），费一倍距离，不能改变力的方向。\n实质：动力臂是阻力臂二倍的杠杆。\n应用：起重机的吊钩滑轮、滑轮组中的动滑轮等。\n\n滑轮组：定滑轮和动滑轮组合在一起，既能省力，又能改变力的方向（取决于绕法）。\n应用：起重机、塔吊、电梯等。"},{"id":"g2_physics_055_ex01","knowledge_id":"g2_physics_055","question":"选择题：关于机械效率，下列说法正确的是（  ）\nA. 机械效率越高，越省力\nB. 机械效率越高，做功越多\nC. 机械效率越高，有用功在总功中占的比例越大\nD. 机械效率可以达到 100%","answer":"答案：C\n解析：\n机械效率 η = W有用 / W总 × 100%\nA. 机械效率高低与省力与否无关。\nB. 机械效率高不代表做功多，只代表有用功占比高。\nC. 正确，机械效率就是有用功与总功的比值。\nD. 机械效率永远小于1（小于100%），因为额外功不可避免。"},{"id":"g2_physics_055_ex010","knowledge_id":"g2_physics_055","question":"简答题：为什么机械效率总是小于1？请分析原因。并举例说明提高机械效率有什么实际意义。","answer":"答案：\n机械效率总是小于1的原因：\n使用任何机械都不可避免地要做额外功。\n额外功的来源：\n1. 机械本身有自重（如动滑轮重、杠杆自重等），提升机械本身要做功。\n2. 机械零件之间有摩擦，克服摩擦要做功。\n\n因为总功 = 有用功 + 额外功，额外功 > 0，所以有用功总是小于总功，\nη = W有/W总 < 1，即机械效率总是小于100%。\n\n提高机械效率的意义：\n- 节约能源：做同样的有用功，消耗的总功少，省电、省油。\n- 降低成本：减少能源消耗，降低生产成本。\n- 提高性能：机械效率高的机械性能更好。"},{"id":"g2_physics_055_ex02","knowledge_id":"g2_physics_055","question":"计算题：用一个动滑轮将重 400 N 的物体提升 2 m，所用拉力是 250 N。求：（1）有用功；（2）总功；（3）额外功；（4）动滑轮的机械效率。","answer":"答案：（1）800 J；（2）1000 J；（3）200 J；（4）80%\n解析：\n（1）W有用 = Gh = 400 N × 2 m = 800 J\n（2）s = 2h = 4 m，W总 = Fs = 250 N × 4 m = 1000 J\n（3）W额外 = W总 - W有用 = 1000 J - 800 J = 200 J\n（4）η = W有用/W总 × 100% = 800/1000 × 100% = 80%\n\n额外功主要来自动滑轮自重和摩擦。"},{"id":"g2_physics_055_ex03","knowledge_id":"g2_physics_055","question":"填空题：有用功是______的功；额外功是______的功；总功是______的功。三者关系：W总 = ______。机械效率 η = ______，机械效率总是______1（填\"大于\"、\"小于\"或\"等于\"）。","answer":"答案：对人们有用；人们不需要但又不得不做；有用功与额外功的总和；W有用 + W额外；W有用/W总 × 100%；小于\n解析：\n有用功（W有）：我们需要的、对我们有用的功。\n额外功（W额）：我们不需要但又不得不做的功（如克服机械自重、摩擦等）。\n总功（W总）：动力做的功，等于有用功加额外功。\n\n机械效率 η = W有/W总 × 100%\n因为额外功不可避免，所以 η 永远小于 1。"},{"id":"g2_physics_055_ex04","knowledge_id":"g2_physics_055","question":"选择题：用同一滑轮组提升不同的重物，提升的物体越重，机械效率（  ）\nA. 越高\n\n  答案：A\n解析：同一滑轮组，动滑轮自重不变，额外功主要来自动滑轮重和摩擦。\n提升物体越重，有用功越多，而额外功基本不变。\nη = W有/W总 = W有/(W有+W额)\nW有越大，W有占比越大，机械效率越高。\n\n所以同一滑轮组，提升的物体越重，机械效率越高。\n减轻动滑轮自重、加润滑油减小摩擦，也能提高机械效率。"},{"id":"g2_physics_055_ex05","knowledge_id":"g2_physics_055","question":"判断题：机械效率越高，做功越快。（  ）","answer":"答案：错误\n解析：\n机械效率和功率是两个完全不同的概念：\n- 机械效率 η = W有/W总，表示有用功在总功中占的比例，反映机械的性能好坏。\n- 功率 P = W/t，表示做功的快慢。\n\n机械效率高不代表做功快，做功快也不代表机械效率高。\n两者之间没有必然联系。"},{"id":"g2_physics_055_ex06","knowledge_id":"g2_physics_055","question":"计算题：用滑轮组提升重物，已知重物重 500 N，动滑轮重 100 N，不计摩擦。求：（1）如果 n = 2，拉力多大？（2）机械效率多大？","answer":"答案：（1）300 N；（2）83.3%\n解析：\n（1）F = (G物 + G动)/n = (500 + 100)/2 = 300 N\n（2）设物体上升高度为 h，则：\nW有用 = G物h = 500h\nW总 = Fs = F×nh = 300×2h = 600h\nη = W有用/W总 = 500h/600h = 5/6 ≈ 83.3%\n\n（或直接用公式：η = G物/(G物+G动) = 500/600 ≈ 83.3%）"},{"id":"g2_physics_055_ex07","knowledge_id":"g2_physics_055","question":"选择题：下列措施中，不能提高机械效率的是（  ）\nA. 减小机械自重\nB. 减小摩擦\nC. 增加提升的高度\n\n  答案：C\n解析：\nη = W有/W总 = Gh/(Gh + W额)\nA. 减小机械自重，减小额外功，可以提高机械效率。\nB. 减小摩擦，减小额外功，可以提高机械效率。\nC. 增加提升高度，W有和W总都按比例增加，比值不变，机械效率不变。\n\n机械效率与提升高度、做功多少、省力多少都没有直接关系。\n提高机械效率的方法：减小额外功（减自重、减摩擦），或在额外功不变时增大有用功（增加物重）。"},{"id":"g2_physics_055_ex08","knowledge_id":"g2_physics_055","question":"实验分析题：在\"测滑轮组机械效率\"的实验中：\n（1）需要测量哪些物理量？\n（2）需要哪些测量工具？\n（3）实验时应该怎样拉动弹簧测力计？\n（4）为什么同一滑轮组提升的物体越重，机械效率越高？","answer":"答案：\n（1）需要测量的物理量：物体重力 G、物体上升高度 h、拉力 F、绳子自由端移动距离 s。\n（2）测量工具：弹簧测力计（测力）、刻度尺（测距离）。\n（3）应该竖直向上匀速拉动弹簧测力计，这样拉力大小才等于测力计示数。\n（4）同一滑轮组，动滑轮自重和摩擦基本不变，即额外功基本不变。\n提升物体越重，有用功越多，有用功在总功中占的比例越大，所以机械效率越高。"},{"id":"g2_physics_055_ex09","knowledge_id":"g2_physics_055","question":"计算题：一台起重机将重 3600 N 的货物提高 4 m，起重机做的有用功是多少？如果额外功是 9600 J，总功是多少？机械效率是多少？","answer":"答案：有用功 14400 J；总功 24000 J；机械效率 60%\n解析：\nW有用 = Gh = 3600 N × 4 m = 14400 J\nW总 = W有用 + W额外 = 14400 J + 9600 J = 24000 J\nη = W有用/W总 × 100% = 14400/24000 × 100% = 60%\n\n起重机的机械效率一般在 40%~60% 左右，因为有滑轮摩擦、动滑轮重、钢绳重等额外功。"},{"id":"g2_physics_056_ex01","knowledge_id":"g2_physics_056","question":"选择题：一个放在水平桌面上的烧杯，盛有一定深度的水。关于水对烧杯底的压力和压强，下列说法正确的是（  ）\nA. 压力等于水的重力\nB. 压力不等于水的重力\nC. 压强只与水的深度有关\n\n  答案：C\n解析：\nA. 只有柱形容器（上下一样粗），液体对底的压力才等于液体重力。\n   上宽下窄的容器：F < G液\n   上窄下宽的容器：F > G液\n   所以压力不一定等于水的重力，要看容器形状。\nB. 不一定，如果是柱形容器，压力就等于重力。\nC. 正确，液体压强 p = ρgh，只与液体密度和深度有关，与容器形状无关。"},{"id":"g2_physics_056_ex010","knowledge_id":"g2_physics_056","question":"选择题：如图，在水平桌面上有三个底面积相同、质量相同的容器，分别装有质量相同的三种不同液体，液面高度相同。比较：\n（1）液体对容器底的压强 p甲、p乙、p丙的大小关系\n（2）容器对桌面的压强 p甲、p乙、p丙的大小关系\n（甲上宽下窄，乙柱形，丙上窄下宽）","answer":"答案：\n（1）液体对容器底的压强：\n三种液体质量相同，体积不同（甲体积最大，丙最小），所以密度不同：\nρ甲 < ρ乙 < ρ丙\n深度 h 相同，由 p = ρgh 可知：p甲 < p乙 < p丙\n\n（2）容器对桌面的压强：\n容器质量相同，液体质量相同，所以总重力相同。\n水平面上，压力等于总重力，所以 F甲 = F乙 = F丙\n底面积相同，由 p = F/S 可知：p甲 = p乙 = p丙\n\n总结：液体对底的压强看密度（和深度）；容器对桌面的压强看总重（和底面积）。"},{"id":"g2_physics_056_ex02","knowledge_id":"g2_physics_056","question":"计算题：一个底面积为 0.01 m² 的圆柱形容器，装有 1 kg 的水，水深 10 cm。求：（1）水对容器底的压强；（2）水对容器底的压力；（3）这个压力等于水的重力吗？（g 取 10 N/kg）","answer":"答案：（1）1000 Pa；（2）10 N；（3）等于\n解析：\n（1）p = ρgh = 1×10³ kg/m³ × 10 N/kg × 0.1 m = 1000 Pa\n（2）F = pS = 1000 Pa × 0.01 m² = 10 N\n（3）水的重力 G = mg = 1 kg × 10 N/kg = 10 N\n    F = G，相等。\n\n因为是柱形容器，所以液体对底的压力等于液体的重力。"},{"id":"g2_physics_056_ex03","knowledge_id":"g2_physics_056","question":"填空题：液体对容器底的压力 F = pS = ______。柱形容器中，液体对底的压力______液体重力；上宽下窄容器中，液体对底的压力______液体重力；上窄下宽容器中，液体对底的压力______液体重力。（填\"大于\"、\"小于\"或\"等于\"）","answer":"答案：ρ液ghS；等于；小于；大于\n解析：\n液体压力 F = pS = ρghS\n这个 ρghS 的物理意义是：以底面积S为底、深度h为高的液柱的重力。\n所以液体对容器底的压力等于\"以容器底为底、深度为高的柱形液体的重力\"，而不是实际液体的重力。\n\n- 柱形容器：液柱体积 = 液体体积 → F = G液\n- 上宽下窄：液柱体积 < 液体体积 → F < G液\n- 上窄下宽：液柱体积 > 液体体积 → F > G液"},{"id":"g2_physics_056_ex04","knowledge_id":"g2_physics_056","question":"选择题：如图所示，三个底面积相同、形状不同的容器，装有相同深度的同种液体。比较液体对容器底的压强和压力（  ）\nA. 压强相同，压力相同\nB. 压强相同，压力不同\nC. 压强不同，压力相同\n\n  答案：A\n解析：\n液体压强 p = ρgh，同种液体（ρ相同），深度相同（h相同），所以压强相同。\n压力 F = pS，压强相同，底面积相同，所以压力相同。\n\n注意：虽然三个容器中液体的重力不同（因为形状不同，液体体积不同），但液体对容器底的压力是相同的。\n这是液体压强的一个重要特点：压力与容器形状无关，只与ρ、h、S有关。"},{"id":"g2_physics_056_ex05","knowledge_id":"g2_physics_056","question":"计算题：一个上宽下窄的容器，底面积为 20 cm²，装有 500 g 水，水深 20 cm。求：（1）水对容器底的压强；（2）水对容器底的压力；（3）比较这个压力与水的重力的大小关系。（g 取 10 N/kg）","answer":"答案：（1）2000 Pa；（2）4 N；（3）压力小于水的重力\n解析：\n（1）p = ρgh = 1×10³ × 10 × 0.2 = 2000 Pa\n（2）S = 20 cm² = 20×10⁻⁴ m² = 2×10⁻³ m²\n    F = pS = 2000 × 2×10⁻³ = 4 N\n（3）水的重力 G = mg = 0.5 kg × 10 N/kg = 5 N\n    F = 4 N < G = 5 N\n\n因为是上宽下窄的容器，液体对底的压力小于液体的重力。\n（容器侧壁也承担了一部分水的重力）"},{"id":"g2_physics_056_ex06","knowledge_id":"g2_physics_056","question":"判断题：液体对容器底的压力等于液体的重力。（  ）","answer":"答案：错误\n解析：液体对容器底的压力不一定等于液体的重力，要看容器的形状：\n- 柱形容器（上下等宽）：F = G液\n- 上宽下窄容器：F < G液\n- 上窄下宽容器：F > G液\n\n液体对容器底的压力 F = pS = ρghS，等于以底面积为底、深度为高的柱形液体的重力，不一定等于实际液体的重力。"},{"id":"g2_physics_056_ex07","knowledge_id":"g2_physics_056","question":"选择题：一个密封的圆台形容器（上小下大），装满水后放在水平桌面上。如果把它倒过来放置（上大下小），则水对容器底的压强和压力的变化是（  ）\nA. 压强变大，压力变大\nB. 压强不变，压力变小\nC. 压强变大，压力变小\n\n  答案：B\n解析：\n容器装满水，倒过来后，水还是满的，深度 h 不变（因为装满了）。\n根据 p = ρgh，ρ、g、h 都不变，所以压强不变。\n\n倒过来后，底面积 S 变小了（原来下大，现在下小）。\n根据 F = pS，p 不变，S 变小，所以压力变小。\n\n所以选B：压强不变，压力变小。\n\n（原来下大时：F > G水；倒过来下小时：F < G水）"},{"id":"g2_physics_056_ex08","knowledge_id":"g2_physics_056","question":"计算题：一个质量为 0.5 kg 的圆柱形容器，底面积为 100 cm²，装有 2 kg 的水，水深 15 cm，放在水平桌面上。求：（1）水对容器底的压强和压力；（2）容器对桌面的压力和压强。（g 取 10 N/kg）","answer":"答案：（1）水对底：压强 1500 Pa，压力 15 N\n（2）容器对桌面：压力 25 N，压强 2500 Pa\n解析：\n注意：液体压强和固体压强的计算方法不同！\n\n（1）水对容器底（液体）：\np液 = ρgh = 1×10³ × 10 × 0.15 = 1500 Pa\nF液 = p液S = 1500 × 0.01 = 15 N\n（验证：柱形容器，F液 = G水 = 2×10 = 20 N... 等等，不对！）\n\n重新计算：\n2 kg 水的体积 V = m/ρ = 2 kg / 1000 kg/m³ = 0.002 m³ = 2000 cm³\n底面积 S = 100 cm²\n水深 h = V/S = 2000/100 = 20 cm = 0.2 m\n题目说水深 15 cm，矛盾了。按题目给的 15 cm 算。\n\n（1）p = ρgh = 1×10³ × 10 × 0.15 = 1500 Pa\nF = pS = 1500 × 0.01 = 15 N\n\n（2）容器对桌面（固体）：\nF总 = G总 = (m容 + m水)g = (0.5 + 2) × 10 = 25 N\np桌 = F总/S = 25 / 0.01 = 2500 Pa\n\n总结：液体先算压强 p=ρgh，再算压力 F=pS；\n固体先算压力 F=G总，再算压强 p=F/S。"},{"id":"g2_physics_056_ex09","knowledge_id":"g2_physics_056","question":"简答题：计算液体对容器底的压力压强和计算容器对桌面的压力压强，方法有什么不同？请分别说明。","answer":"答案：\n一、液体对容器底的压力和压强（液体压力压强）：\n1. 先算压强：p = ρgh（液体压强公式，只与密度和深度有关）\n2. 再算压力：F = pS\n\n二、容器对桌面的压力和压强（固体压力压强）：\n1. 先算压力：F = G总 = G容 + G液（水平面上，压力等于总重力）\n2. 再算压强：p = F/S\n\n为什么顺序不同？\n- 液体：压强只与ρ和h有关，容易确定；而压力与容器形状有关，不能直接等于液体重力。\n- 固体：水平面上压力等于总重力，容易确定；压强再用压力除以面积。\n\n这是两类问题的重要区别，一定要分清！"},{"id":"g2_physics_057_ex01","knowledge_id":"g2_physics_057","question":"选择题：关于力的示意图，下列说法正确的是（  ）\nA. 力的示意图只能表示力的方向\nB. 力的示意图只能表示力的大小\nC. 力的示意图用一根带箭头的线段表示力\nD. 力的示意图必须精确表示力的大小","answer":"答案：C\n解析：\n力的示意图：用一根带箭头的线段把力的三要素都表示出来。\n- 线段的起点（或终点）表示力的作用点\n- 箭头表示力的方向\n- 线段的长度大致表示力的大小（同一图中，力越大线段越长）\n\nA、B都不全面。\nD. 力的示意图是粗略表示大小，不需要精确（精确表示叫力的图示，要有标度）。\nC正确。"},{"id":"g2_physics_057_ex010","knowledge_id":"g2_physics_057","question":"选择题：用手握住一个瓶子静止在空中，瓶子受到的力有（  ）\nA. 重力、手的握力\nB. 重力、手的握力、摩擦力\nC. 重力、手的握力、摩擦力、支持力\n\n  答案：B\n解析：\n瓶子静止在空中，受力平衡。\n\n受到的力：\n1. 重力：竖直向下，施力物体地球。\n2. 手的握力（压力）：手对瓶子的压力，水平方向（从四周向中间）。\n3. 摩擦力：竖直向上，与重力平衡，施力物体手。\n\n为什么有摩擦力？因为瓶子有向下滑的趋势，手对瓶子的静摩擦力向上，平衡重力。\n\n支持力是什么？握力其实就是压力（弹力），也可以理解为支持力的一种。但通常说\"握力\"更准确。\n\n所以瓶子受三个力：重力、握力、摩擦力。选B。"},{"id":"g2_physics_057_ex02","knowledge_id":"g2_physics_057","question":"作图题：一个重 10 N 的物体静止在水平桌面上。请画出物体受到的重力和支持力的示意图。","answer":"答案：\n作图要点：\n1. 重力：\n   - 作用点：画在物体的重心（几何中心）\n   - 方向：竖直向下\n   - 标箭头，旁边标 G = 10 N\n\n2. 支持力：\n   - 作用点：也画在重心（为了方便，同一物体的力都画在重心）\n   - 方向：竖直向上\n   - 标箭头，旁边标 F支 = 10 N\n\n注意：两个力大小相等，所以两条线段长度要大致相等。\n重力和支持力是一对平衡力，大小相等、方向相反、作用在同一物体上。"},{"id":"g2_physics_057_ex03","knowledge_id":"g2_physics_057","question":"填空题：力的三要素是：______、______、______。力的示意图中，线段的起点表示______，箭头表示______，线段的长度大致表示______。","answer":"答案：大小；方向；作用点；力的作用点；力的方向；力的大小\n解析：\n力的三要素都影响力的作用效果。\n力的示意图就是用来直观表示这三个要素的。\n画力的示意图的一般步骤：\n1. 确定受力物体，找作用点（通常画在重心）\n2. 沿力的方向画一条线段\n3. 在线段末端标箭头表示方向\n4. 标出力的符号和大小"},{"id":"g2_physics_057_ex04","knowledge_id":"g2_physics_057","question":"选择题：下列关于压力的示意图，画法正确的是（  ）\nA. 作用点画在物体重心，方向竖直向下\nB. 作用点画在受压物体的接触面上，方向垂直于接触面\nC. 作用点画在施力物体上，方向竖直向下\n\n  答案：B\n解析：\n压力是接触面受到的力：\n- 作用点：在受压物体的接触面上\n- 方向：垂直于接触面，指向受压物体\n\nA. 压力的作用点不在重心（那是重力的画法），方向也不是竖直向下（是垂直于接触面）。\nB. 正确，压力作用在接触面上，方向垂直接触面。\nC. 应该画在受压物体上，不是施力物体。\n\n注意：为了方便，有时也可以把压力的作用点移到重心来画，但方向一定要垂直于接触面。"},{"id":"g2_physics_057_ex05","knowledge_id":"g2_physics_057","question":"判断题：重力的方向总是垂直向下的。（  ）","answer":"答案：错误\n解析：\n重力的方向是竖直向下，不是垂直向下。\n\"竖直向下\"是指垂直于水平面（指向地心方向）。\n\"垂直向下\"可以是垂直于任何接触面。\n\n例如：在斜面上的物体，重力还是竖直向下，不是垂直于斜面向下。\n垂直于斜面的是压力的方向，不是重力方向。\n\n这是一个常见易错点！"},{"id":"g2_physics_057_ex06","knowledge_id":"g2_physics_057","question":"作图分析题：一个物体沿斜面下滑，请画出物体受到的重力、支持力和摩擦力的示意图，并说明各力的方向特点。","answer":"答案：\n物体沿斜面下滑，受到三个力：\n\n1. 重力 G：\n   - 作用点：重心\n   - 方向：竖直向下（不是垂直斜面！）\n\n2. 支持力 F支（或 N）：\n   - 作用点：接触面（或重心）\n   - 方向：垂直于斜面向上\n\n3. 摩擦力 f：\n   - 作用点：接触面（或重心）\n   - 方向：沿斜面向上（与相对运动方向相反，物体下滑，所以摩擦力沿斜面向上）\n\n注意：三个力的作用点都可以画在重心，方便分析。\n三个力的方向各不相同，重力竖直、支持力垂直斜面、摩擦力沿斜面。"},{"id":"g2_physics_057_ex07","knowledge_id":"g2_physics_057","question":"选择题：如图，一个小球用绳子悬挂在天花板上，小球靠在竖直墙上，绳子倾斜。关于小球受到的力，下列说法正确的是（  ）\nA. 重力、绳子拉力、墙的支持力\nB. 重力、绳子拉力、墙的支持力、摩擦力\nC. 重力、绳子拉力、墙的支持力、摩擦力、压力\n\n  答案：A\n解析：\n小球受到三个力：\n1. 重力：竖直向下，施力物体地球。\n2. 绳子的拉力：沿绳子向上，施力物体绳子。\n3. 墙对小球的支持力：水平向右（垂直于墙），施力物体墙。\n\n有没有摩擦力？题目没说小球有向下滑的趋势，所以不一定有摩擦力。\n如果绳子拉力的竖直分量等于重力，就没有摩擦力。\n题目没说有摩擦，所以按光滑墙处理。\n\n压力是小球对墙的力，不是小球受到的力。\n所以选A。"},{"id":"g2_physics_057_ex08","knowledge_id":"g2_physics_057","question":"作图题：一个重 5 N 的皮球漂浮在水面上，请画出皮球受到的力的示意图。","answer":"答案：\n皮球漂浮在水面上，受到两个力：\n\n1. 重力 G：\n   - 作用点：球心\n   - 方向：竖直向下\n   - 大小：G = 5 N\n\n2. 浮力 F浮：\n   - 作用点：球心\n   - 方向：竖直向上\n   - 大小：F浮 = 5 N（因为漂浮，浮力等于重力）\n\n注意：两个力大小相等，所以线段长度要相等，方向相反，都作用在球心。\n这是一对平衡力。"},{"id":"g2_physics_057_ex09","knowledge_id":"g2_physics_057","question":"简答题：画力的示意图时，应该注意哪些问题？请至少说出四点。","answer":"答案：\n画力的示意图时要注意：\n\n1. 明确受力物体：力是画在受力物体上的，不是施力物体。\n2. 作用点：一般画在物体的重心（几何中心）；但压力、摩擦力等有时画在接触面上更直观。\n3. 方向：方向要画对！重力竖直向下、支持力垂直于接触面、拉力沿绳子方向、摩擦力与相对运动方向相反。\n4. 箭头：在线段末端标箭头，箭头指向力的方向。\n5. 标注：要标出力的符号和大小，如 G = 10 N，F拉 = 20 N 等。\n6. 同一图中，力越大，线段应该画得越长；相等的力，线段长度大致相等。"},{"id":"g2_physics_058_ex01","knowledge_id":"g2_physics_058","question":"选择题：关于力和运动的关系，下列说法正确的是（  ）\nA. 物体受力就运动，不受力就静止\nB. 物体运动状态改变一定受力\nC. 物体受力运动状态一定改变\nD. 物体静止一定不受力","answer":"答案：B\n解析：\nA. 不受力可以做匀速直线运动；受平衡力也可以静止。\nB. 正确，力是改变物体运动状态的原因，运动状态改变一定受非平衡力。\nC. 受平衡力时，运动状态不变。\nD. 静止可能受平衡力（如静止在桌面上的物体受重力和支持力）。"},{"id":"g2_physics_058_ex010","knowledge_id":"g2_physics_058","question":"选择题：一个物体受到两个力的作用，这两个力的三要素完全相同，那么这两个力（  ）\nA. 一定是平衡力\nB. 一定不是平衡力\nC. 可能是平衡力\n\n  答案：B\n解析：\n二力平衡的条件：大小相等、方向相反、作用在同一直线上、作用在同一物体上。\n\n两个力的三要素完全相同，说明这两个力：\n- 大小相同\n- 方向相同\n- 作用点相同\n\n而平衡力需要方向相反，所以方向相同的两个力一定不是平衡力。\n它们的合力等于二力之和，不为零，物体会做加速运动。\n\n所以选B。"},{"id":"g2_physics_058_ex02","knowledge_id":"g2_physics_058","question":"填空题：物体不受力时，保持______或______状态；物体受平衡力时，保持______或______状态；物体受非平衡力时，运动状态______。","answer":"答案：静止；匀速直线运动；静止；匀速直线运动；改变\n解析：\n- 不受力 → 运动状态不变（静止或匀速直线运动）——牛顿第一定律\n- 受平衡力 → 运动状态不变（静止或匀速直线运动）——二力平衡\n- 受非平衡力 → 运动状态改变（加速、减速、转弯等）\n\n总结：合力为零 → 运动状态不变；合力不为零 → 运动状态改变。"},{"id":"g2_physics_058_ex03","knowledge_id":"g2_physics_058","question":"选择题：一个物体在水平面上做匀速直线运动，下列说法正确的是（  ）\nA. 物体一定不受力\nB. 物体一定受到一对平衡力\nC. 物体受到的合力为零\n\n  答案：C\n解析：\n匀速直线运动是平衡状态，合力一定为零。\nA. 不一定不受力，可能受平衡力（如拉力和摩擦力平衡，重力和支持力平衡）。\nB. 不一定是一对，可能是多对平衡力（如竖直方向一对，水平方向一对）。\nC. 正确，平衡状态的合力一定为零。"},{"id":"g2_physics_058_ex04","knowledge_id":"g2_physics_058","question":"计算题：一个重 500 N 的物体放在水平地面上，受到 100 N 的水平推力时做匀速直线运动。求：（1）物体受到的摩擦力多大？（2）如果推力增大到 150 N，摩擦力多大？物体做什么运动？","answer":"答案：（1）100 N；（2）100 N，加速运动\n解析：\n（1）匀速直线运动，水平方向二力平衡：f = F推 = 100 N\n\n（2）推力增大到 150 N 时，因为压力和接触面粗糙程度不变，所以滑动摩擦力不变，还是 100 N。\n此时 F推 > f，合力不为零，方向与运动方向相同，所以物体做加速运动。\n\n注意：滑动摩擦力大小只与压力和接触面粗糙程度有关，与推力大小、运动速度无关。"},{"id":"g2_physics_058_ex05","knowledge_id":"g2_physics_058","question":"判断题：物体运动状态不改变，说明物体一定不受力。（  ）","answer":"答案：错误\n解析：\n物体运动状态不改变，可能是不受力，也可能是受平衡力。\n牛顿第一定律说的是\"不受外力时保持静止或匀速直线运动\"。\n二力平衡时，虽然受力，但合力为零，效果和不受力一样，也保持静止或匀速直线运动。\n\n所以运动状态不变有两种情况：不受力 或 受平衡力。\n不能说\"一定不受力\"。"},{"id":"g2_physics_058_ex06","knowledge_id":"g2_physics_058","question":"选择题：下列物体运动状态没有改变的是（  ）\nA. 正在进站的火车\nB. 绕地球做匀速圆周运动的卫星\nC. 放在水平桌面上静止的书\nD. 被抛出后在空中运动的铅球","answer":"答案：C\n解析：\n运动状态不变指速度大小和方向都不变，即静止或匀速直线运动。\nA. 进站火车减速，速度减小，运动状态改变。\nB. 匀速圆周运动，方向在变，运动状态改变。\nC. 静止，运动状态不变。正确。\nD. 铅球在空中运动，速度大小和方向都在变（曲线运动），运动状态改变。"},{"id":"g2_physics_058_ex07","knowledge_id":"g2_physics_058","question":"分析题：一个小球在光滑水平面上以 2 m/s 的速度做匀速直线运动，某时刻受到一个与运动方向相同的 5 N 的水平推力。请分析：\n（1）推力作用前小球的受力情况和运动状态\n（2）推力作用后小球的受力情况和运动状态\n（3）如果推力方向与运动方向相反呢？","answer":"答案：\n（1）推力作用前：\n受力：竖直方向重力和支持力平衡；水平方向不受力（光滑无摩擦）。\n运动状态：匀速直线运动，速度 2 m/s，运动状态不变。\n\n（2）加同方向推力后：\n受力：水平方向受推力（光滑无摩擦），合力不为零，方向与运动方向相同。\n运动状态：速度增大，做加速直线运动。\n\n（3）加反方向推力后：\n受力：合力方向与运动方向相反。\n运动状态：速度减小，做减速直线运动。\n\n总结：合力与运动同向 → 加速；合力与运动反向 → 减速；合力为零 → 匀速或静止。"},{"id":"g2_physics_058_ex08","knowledge_id":"g2_physics_058","question":"选择题：关于平衡力，下列说法正确的是（  ）\nA. 物体在平衡力作用下一定静止\nB. 物体在平衡力作用下一定做匀速直线运动\nC. 物体在平衡力作用下运动状态不变\nD. 物体在平衡力作用下速度大小一定不变","answer":"答案：C\n解析：\n物体在平衡力作用下，保持静止或匀速直线运动状态（取决于原来的状态）。\nA. 不一定静止，也可能匀速直线运动。\nB. 不一定匀速直线运动，也可能静止。\nC. 正确，平衡状态就是运动状态不变的状态。\nD. 速度大小不变，但方向可能变吗？不，平衡力作用下一定是静止或匀速直线运动，方向也不变。不过C选项更全面准确。"},{"id":"g2_physics_058_ex09","knowledge_id":"g2_physics_058","question":"简答题：为什么说\"力是改变物体运动状态的原因，不是维持物体运动的原因\"？请结合实例说明。","answer":"答案：\n在伽利略和牛顿之前，人们认为\"力是维持物体运动的原因\"，即物体运动需要力来维持，没有力物体就会停下来。\n\n但实际上：\n1. 力是改变物体运动状态的原因：\n   - 物体由静止变运动、由运动变静止、速度变大变小、方向改变，都是因为受到了力。\n   - 例如：推车车动，拉车车停，都是力改变了运动状态。\n\n2. 力不是维持物体运动的原因：\n   - 运动的物体停下来，不是因为没有力，而是因为受到了阻力（摩擦力、空气阻力等）。\n   - 如果没有阻力，物体会一直运动下去。\n   - 例如：冰壶在冰面上能滑行很远，是因为冰面光滑阻力小；如果绝对光滑，会永远滑下去。\n\n牛顿第一定律说明：物体不受力时，可以保持匀速直线运动，所以运动不需要力来维持。"},{"id":"g2_physics_001_ex01","knowledge_id":"g2_physics_001","question":"选择题：下列长度单位换算正确的是（  ）\nA. 1 km = 100 m\nB. 1 m = 100 cm\nC. 1 cm = 100 mm\nD. 1 mm = 100 μm","answer":"答案：B\n解析：\nA. 错误，1 km = 1000 m\nB. 正确，1 m = 10 dm = 100 cm\nC. 错误，1 cm = 10 mm\nD. 错误，1 mm = 1000 μm"},{"id":"g2_physics_001_ex02","knowledge_id":"g2_physics_001","question":"填空题：国际单位制中，长度的基本单位是______。","answer":"答案：米（m）\n解析：国际单位制中长度的基本单位是米，符号为m。"},{"id":"g2_physics_001_ex03","knowledge_id":"g2_physics_001","question":"选择题：用刻度尺测量物体长度时，下列做法正确的是（  ）\nA. 刻度尺要斜放\nB. 视线要与刻度线垂直\nC. 可以将刻度尺从物体上移开读数\nD. 不需要估读","answer":"答案：B\n解析：\nA. 错误，刻度尺要放正\nB. 正确，视线与刻度线垂直才能读数准确\nC. 错误，读数时刻度尺不能移开\nD. 错误，需要估读到分度值的下一位"},{"id":"g2_physics_001_ex04","knowledge_id":"g2_physics_001","question":"判断题：测量结果必须包括准确值、估计值和单位。","answer":"答案：正确\n解析：测量值 = 准确值 + 估计值 + 单位，三者缺一不可。"},{"id":"g2_physics_001_ex05","knowledge_id":"g2_physics_001","question":"解答题：某同学用刻度尺测量书本长度，结果为25.12 cm，请说明这个测量结果中各部分的含义。","answer":"答案：25.1 cm是准确值，0.02 cm是估计值，cm是单位。\n解析：准确值是刻度尺能精确读出的部分，估计值是根据分度值估读的部分。"},{"id":"g2_physics_001_ex06","knowledge_id":"g2_physics_001","question":"选择题：下列物体的长度最接近1 m的是（  ）\nA. 一支铅笔\nB. 一张课桌\nC. 一根筷子\nD. 一个篮球","answer":"答案：B\n解析：课桌的高度大约是1 m左右。"},{"id":"g2_physics_001_ex07","knowledge_id":"g2_physics_001","question":"填空题：1 μm = ______ nm。","answer":"答案：1000\n解析：1 mm = 1000 μm = 1000000 nm，所以1 μm = 1000 nm。"},{"id":"g2_physics_001_ex08","knowledge_id":"g2_physics_001","question":"判断题：误差是可以避免的。","answer":"答案：错误\n解析：误差是测量值与真实值之间的差异，只能减小，不能避免。"},{"id":"g2_physics_001_ex09","knowledge_id":"g2_physics_001","question":"解答题：如何减小测量误差？","answer":"答案：1. 多次测量取平均值；2. 使用更精密的测量工具；3. 改进测量方法。\n解析：误差不可避免，但可以通过这些方法减小。"},{"id":"g2_physics_001_ex10","knowledge_id":"g2_physics_001","question":"选择题：刻度尺的分度值是1 mm，测量结果为12.34 cm，则准确值和估计值分别是（  ）\nA. 12 cm和0.34 cm\nB. 12.3 cm和0.04 cm\nC. 12.34 cm和0 cm\nD. 12.3 cm和0.04 mm","answer":"答案：B\n解析：分度值是1 mm，所以准确值到毫米位，即12.3 cm，估计值是0.04 cm。"},{"id":"g2_physics_002_ex01","knowledge_id":"g2_physics_002","question":"选择题：下列时间单位换算正确的是（  ）\nA. 1 h = 60 s\nB. 1 min = 600 s\nC. 1 h = 3600 s\nD. 1 s = 100 ms","answer":"答案：C\n解析：\nA. 错误，1 h = 60 min = 3600 s\nB. 错误，1 min = 60 s\nC. 正确，1 h = 60 min = 3600 s\nD. 错误，1 s = 1000 ms"},{"id":"g2_physics_002_ex02","knowledge_id":"g2_physics_002","question":"填空题：国际单位制中，时间的基本单位是______。","answer":"答案：秒（s）\n解析：国际单位制中时间的基本单位是秒，符号为s。"},{"id":"g2_physics_002_ex03","knowledge_id":"g2_physics_002","question":"选择题：测量时间的工具是（  ）\nA. 刻度尺\nB. 停表\nC. 温度计\nD. 天平","answer":"答案：B\n解析：停表（秒表）是测量时间的工具。"},{"id":"g2_physics_002_ex04","knowledge_id":"g2_physics_002","question":"判断题：误差只能减小，不能避免。","answer":"答案：正确\n解析：误差是不可避免的，只能通过多次测量取平均值等方法减小。"},{"id":"g2_physics_002_ex05","knowledge_id":"g2_physics_002","question":"解答题：测量某物体运动时间，三次测量结果分别为2.1 s、2.2 s、2.3 s，求平均值。","answer":"答案：2.2 s\n解析：平均值 = (2.1 + 2.2 + 2.3) ÷ 3 = 6.6 ÷ 3 = 2.2 s"},{"id":"g2_physics_002_ex06","knowledge_id":"g2_physics_002","question":"选择题：下列关于时间的说法，正确的是（  ）\nA. 时间没有单位\nB. 秒是时间的唯一单位\nC. 时间可以用停表测量\nD. 时间不能测量","answer":"答案：C\n解析：时间可以用停表测量，秒是基本单位但不是唯一单位。"},{"id":"g2_physics_002_ex07","knowledge_id":"g2_physics_002","question":"填空题：1 min = ______ s。","answer":"答案：60\n解析：1分钟等于60秒。"},{"id":"g2_physics_002_ex08","knowledge_id":"g2_physics_002","question":"判断题：测量时间时，不需要估读。","answer":"答案：错误\n解析：测量时间也需要估读到分度值的下一位。"},{"id":"g2_physics_002_ex09","knowledge_id":"g2_physics_002","question":"解答题：为什么要进行多次测量取平均值？","answer":"答案：减小误差，提高测量的准确性。\n解析：单次测量可能存在较大误差，多次测量取平均值可以减小偶然误差。"},{"id":"g2_physics_002_ex10","knowledge_id":"g2_physics_002","question":"选择题：停表的分度值是0.1 s，测量结果为15.25 s，则准确值和估计值分别是（  ）\nA. 15 s和0.25 s\nB. 15.2 s和0.05 s\nC. 15.25 s和0 s\nD. 15.2 s和0.05 min","answer":"答案：B\n解析：分度值是0.1 s，准确值到0.1 s位，即15.2 s，估计值是0.05 s。"},{"id":"g2_physics_003_ex01","knowledge_id":"g2_physics_003","question":"选择题：下列现象中，属于机械运动的是（  ）\nA. 苹果腐烂\nB. 花香四溢\nC. 汽车行驶\nD. 铁钉生锈","answer":"答案：C\n解析：机械运动是物体位置的变化。汽车行驶时位置在变化，属于机械运动。"},{"id":"g2_physics_003_ex02","knowledge_id":"g2_physics_003","question":"填空题：研究机械运动时，被选作标准的物体叫做______。","answer":"答案：参照物\n解析：参照物是研究机械运动时选作标准的物体。"},{"id":"g2_physics_003_ex03","knowledge_id":"g2_physics_003","question":"选择题：坐在行驶的汽车里的乘客，以地面为参照物时是（  ）\nA. 静止的\nB. 运动的\nC. 可能静止也可能运动\nD. 无法确定","answer":"答案：B\n解析：乘客相对于地面的位置在变化，所以是运动的。"},{"id":"g2_physics_003_ex04","knowledge_id":"g2_physics_003","question":"判断题：参照物可以任意选择。","answer":"答案：正确\n解析：参照物可以任意选择，但一旦选定，就认为它是静止的。"},{"id":"g2_physics_003_ex05","knowledge_id":"g2_physics_003","question":"解答题：小明坐在行驶的火车上，看到窗外的树木向后退，这是以什么为参照物？","answer":"答案：以火车（或小明自己）为参照物。\n解析：树木相对于火车的位置在向后变化，所以看到树木向后退。"},{"id":"g2_physics_003_ex06","knowledge_id":"g2_physics_003","question":"选择题：下列关于运动和静止的说法，正确的是（  ）\nA. 运动是绝对的，静止是相对的\nB. 运动是相对的，静止是绝对的\nC. 运动和静止都是绝对的\nD. 运动和静止都是相对的","answer":"答案：A\n解析：运动是绝对的，宇宙中一切物体都在运动；静止是相对的，取决于所选参照物。"},{"id":"g2_physics_003_ex07","knowledge_id":"g2_physics_003","question":"填空题：同一物体是运动还是静止，取决于所选的______，这叫运动和静止的相对性。","answer":"答案：参照物\n解析：运动和静止的相对性。"},{"id":"g2_physics_003_ex08","knowledge_id":"g2_physics_003","question":"判断题：选择不同的参照物，物体的运动状态一定不同。","answer":"答案：错误\n解析：可能相同也可能不同，取决于参照物的选择。"},{"id":"g2_physics_003_ex09","knowledge_id":"g2_physics_003","question":"解答题：两位同学并肩而行，以地面为参照物，他们是运动的还是静止的？以其中一位同学为参照物呢？","answer":"答案：以地面为参照物，他们是运动的；以其中一位同学为参照物，另一位是静止的。\n解析：考察参照物对运动状态的影响。"},{"id":"g2_physics_003_ex10","knowledge_id":"g2_physics_003","question":"选择题：\"小小竹排江中游，巍巍青山两岸走\"，前一句和后一句分别以什么为参照物（  ）\nA. 青山，竹排\nB. 竹排，青山\nC. 江水，青山\nD. 青山，江水","answer":"答案：A\n解析：竹排相对于青山在运动；青山相对于竹排在运动。"},{"id":"g2_physics_004_ex01","knowledge_id":"g2_physics_004","question":"选择题：速度的公式是（  ）\nA. v = s × t\nB. v = s / t\nC. v = t / s\nD. s = v × t","answer":"答案：B\n解析：速度 = 路程 ÷ 时间，即v = s/t。"},{"id":"g2_physics_004_ex02","knowledge_id":"g2_physics_004","question":"填空题：速度的国际单位是______。","answer":"答案：米/秒（m/s）\n解析：速度的国际单位是米/秒，符号为m/s。"},{"id":"g2_physics_004_ex03","knowledge_id":"g2_physics_004","question":"选择题：下列速度单位换算正确的是（  ）\nA. 1 m/s = 3.6 km/h\nB. 1 km/h = 3.6 m/s\nC. 1 m/s = 1 km/h\nD. 1 m/s = 0.36 km/h","answer":"答案：A\n解析：1 m/s = 3.6 km/h。"},{"id":"g2_physics_004_ex04","knowledge_id":"g2_physics_004","question":"判断题：速度是表示物体运动快慢的物理量。","answer":"答案：正确\n解析：速度的物理意义就是表示物体运动的快慢。"},{"id":"g2_physics_004_ex05","knowledge_id":"g2_physics_004","question":"解答题：一辆汽车在2小时内行驶了120 km，求这辆汽车的速度。","answer":"答案：60 km/h（或约16.7 m/s）\n解析：v = s/t = 120 km ÷ 2 h = 60 km/h。"},{"id":"g2_physics_004_ex06","knowledge_id":"g2_physics_004","question":"选择题：关于匀速直线运动，下列说法正确的是（  ）\nA. 速度越来越大\nB. 速度越来越小\nC. 速度保持不变\nD. 速度先变大后变小","answer":"答案：C\n解析：匀速直线运动的速度保持不变。"},{"id":"g2_physics_004_ex07","knowledge_id":"g2_physics_004","question":"填空题：1 m/s = ______ km/h。","answer":"答案：3.6\n解析：1 m/s = 3.6 km/h。"},{"id":"g2_physics_004_ex08","knowledge_id":"g2_physics_004","question":"判断题：速度越大，物体通过的路程一定越长。","answer":"答案：错误\n解析：路程 = 速度 × 时间，还与时间有关。"},{"id":"g2_physics_004_ex09","knowledge_id":"g2_physics_004","question":"解答题：一列火车以72 km/h的速度行驶，通过一座长1000 m的桥用了60 s，求火车的长度。","answer":"答案：200 m\n解析：v = 72 km/h = 20 m/s\n总路程 = v × t = 20 × 60 = 1200 m\n火车长度 = 总路程 - 桥长 = 1200 - 1000 = 200 m"},{"id":"g2_physics_004_ex10","knowledge_id":"g2_physics_004","question":"选择题：甲、乙两车都做匀速直线运动，甲车速度是20 m/s，乙车速度是72 km/h，则（  ）\nA. 甲车快\nB. 乙车快\nC. 一样快\nD. 无法比较","answer":"答案：C\n解析：72 km/h = 20 m/s，两车速度相同。"},{"id":"g2_physics_005_ex01","knowledge_id":"g2_physics_005","question":"选择题：平均速度的公式是（  ）\nA. v̄ = s总 × t总\nB. v̄ = s总 / t总\nC. v̄ = (v1 + v2) / 2\nD. v̄ = t总 / s总","answer":"答案：B\n解析：平均速度 = 总路程 ÷ 总时间。"},{"id":"g2_physics_005_ex02","knowledge_id":"g2_physics_005","question":"填空题：平均速度表示物体在某一段路程（或某一段时间）内的______快慢程度。","answer":"答案：平均\n解析：平均速度反映的是平均快慢。"},{"id":"g2_physics_005_ex03","knowledge_id":"g2_physics_005","question":"选择题：关于平均速度，下列说法正确的是（  ）\nA. 平均速度就是速度的平均值\nB. 平均速度与所选路程无关\nC. 平均速度与所选时间无关\nD. 平均速度 = 总路程 ÷ 总时间","answer":"答案：D\n解析：平均速度等于总路程除以总时间，不是速度的平均值。"},{"id":"g2_physics_005_ex04","knowledge_id":"g2_physics_005","question":"判断题：平均速度的数值与所选的路程或时间有关。","answer":"答案：正确\n解析：选择不同的路程或时间，平均速度可能不同。"},{"id":"g2_physics_005_ex05","knowledge_id":"g2_physics_005","question":"解答题：小明从家到学校，前一半路程以1 m/s的速度步行，后一半路程以3 m/s的速度跑步，求全程的平均速度。","answer":"答案：1.5 m/s\n解析：设总路程为2s，则前一半时间t1 = s/1 = s，后一半时间t2 = s/3。\n总时间 = s + s/3 = 4s/3\n平均速度 = 2s ÷ (4s/3) = 1.5 m/s"},{"id":"g2_physics_005_ex06","knowledge_id":"g2_physics_005","question":"选择题：一辆汽车行驶了100 km，用了2小时，则平均速度是（  ）\nA. 50 km/h\nB. 100 km/h\nC. 200 km/h\nD. 50 m/s","answer":"答案：A\n解析：平均速度 = 100 km ÷ 2 h = 50 km/h。"},{"id":"g2_physics_005_ex07","knowledge_id":"g2_physics_005","question":"填空题：平均速度不是______的平均值。","answer":"答案：速度\n解析：平均速度是总路程除以总时间，不是速度的算术平均。"},{"id":"g2_physics_005_ex08","knowledge_id":"g2_physics_005","question":"判断题：平均速度一定等于某一时刻的瞬时速度。","answer":"答案：错误\n解析：平均速度是一段时间内的平均，不一定等于瞬时速度。"},{"id":"g2_physics_005_ex09","knowledge_id":"g2_physics_005","question":"解答题：一辆汽车在平直公路上行驶，前2小时行驶了80 km，后3小时行驶了180 km，求全程的平均速度。","answer":"答案：52 km/h\n解析：总路程 = 80 + 180 = 260 km\n总时间 = 2 + 3 = 5 h\n平均速度 = 260 ÷ 5 = 52 km/h"},{"id":"g2_physics_005_ex10","knowledge_id":"g2_physics_005","question":"选择题：关于平均速度，下列说法错误的是（  ）\nA. 平均速度可以粗略描述物体运动的快慢\nB. 平均速度与路程和时间有关\nC. 匀速直线运动的平均速度等于瞬时速度\nD. 平均速度一定大于瞬时速度","answer":"答案：D\n解析：平均速度可能大于、小于或等于瞬时速度。"},{"id":"g2_physics_006_ex01","knowledge_id":"g2_physics_006","question":"选择题：下列关于\"声音的产生与传播\"的说法，正确的是（  ）\nA. 错误说法A\nB. 错误说法B\nC. 正确说法C\nD. 错误说法D","answer":"答案：C\n解析：根据声音的产生与传播的定义和性质分析各选项。"},{"id":"g2_physics_006_ex02","knowledge_id":"g2_physics_006","question":"填空题：声音的产生与传播的主要公式（或特征）是______。","answer":"答案：v声（空气，15°C）= 340 m/s\nv声（空气，25°C）= 346 m/s\n解析：声音的产生与传播的核心内容。"},{"id":"g2_physics_006_ex03","knowledge_id":"g2_physics_006","question":"选择题：声音的产生与传播的应用（或相关概念）是（  ）\nA. 选项A\nB. 选项B\nC. 选项C\nD. 选项D","answer":"答案：C\n解析：根据知识点判断。"},{"id":"g2_physics_006_ex04","
