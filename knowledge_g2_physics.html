    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"id":"g2_physics_001","chapter":"第一章 机械运动","name":"长度的单位与测量","formula":"1 km = 1000 m\n1 m = 10 dm = 100 cm = 1000 mm\n1 mm = 1000 μm = 1 000 000 nm","explanation":"国际单位制中，长度的基本单位是米（m）。\n\n常用单位：\n- 千米（km）、米（m）、分米（dm）、厘米（cm）、毫米（mm）\n- 微米（μm）、纳米（nm）\n\n测量工具：刻度尺\n使用规则：\n1. 选：根据测量需要选择合适量程和分度值的刻度尺\n2. 放：零刻度线对准被测物体一端，刻度线紧贴被测物体\n3. 看：视线与刻度线垂直\n4. 读：读出准确值和估计值，注明单位\n5. 记：测量值 = 准确值 + 估计值 + 单位","semester":"upper"},{"id":"g2_physics_002","chapter":"第一章 机械运动","name":"时间的单位与测量","formula":"1 h = 60 min = 3600 s\n1 min = 60 s\n1 s = 1000 ms","explanation":"国际单位制中，时间的基本单位是秒（s）。\n\n常用单位：小时（h）、分钟（min）、秒（s）、毫秒（ms）。\n\n测量工具：停表（秒表）\n\n误差：\n- 误差是测量值与真实值之间的差异\n- 误差只能减小，不能避免\n- 减小误差的方法：多次测量取平均值、使用更精密的测量工具","semester":"upper"},{"id":"g2_physics_003","chapter":"第一章 机械运动","name":"机械运动与参照物","formula":"运动 = 位置变化（相对于参照物）","explanation":"在物理学中，把一个物体相对于另一个物体位置的改变叫做机械运动，简称运动。\n\n参照物：\n- 研究机械运动时，被选作标准的物体叫做参照物\n- 参照物可以任意选择，但一旦选定，就认为它是静止的\n- 同一物体是运动还是静止，取决于所选的参照物，这叫运动和静止的相对性","semester":"upper"},{"id":"g2_physics_004","chapter":"第一章 机械运动","name":"速度的概念与公式","formula":"v = s / t\n（v：速度，单位 m/s；s：路程，单位 m；t：时间，单位 s）","explanation":"速度是表示物体运动快慢的物理量。\n\n单位：\n- 国际单位：米/秒（m/s 或 m·s⁻¹）\n- 常用单位：千米/小时（km/h）\n- 换算：1 m/s = 3.6 km/h\n\n匀速直线运动：\n- 物体沿着直线且速度不变的运动\n- 公式：v = s / t（速度恒定，路程与时间成正比）","semester":"upper"},{"id":"g2_physics_005","chapter":"第一章 机械运动","name":"平均速度","formula":"v̄ = s总 / t总","explanation":"平均速度表示物体在某一段路程（或某一段时间）内的平均快慢程度。\n\n注意：\n1. 平均速度不是速度的平均值\n2. 平均速度 = 总路程 ÷ 总时间\n3. 平均速度的数值与所选的路程或时间有关","semester":"upper"},{"id":"g2_physics_006","chapter":"第二章 声现象","name":"声音的产生与传播","formula":"v声（空气，15°C）= 340 m/s\nv声（空气，25°C）= 346 m/s","explanation":"声音的产生：\n- 声音是由物体振动产生的\n- 振动停止，发声也停止（注意：此时仍可能有余音）\n\n声音的传播：\n- 声音需要介质（固体、液体、气体）才能传播，真空不能传声\n- 声音在不同介质中传播速度不同：固体 > 液体 > 气体\n- 声音在空气（15°C）中传播速度约为 340 m/s\n- 声音以波的形式传播，叫做声波","semester":"upper"},{"id":"g2_physics_007","chapter":"第二章 声现象","name":"声音的三要素","formula":"f = 1 / T（频率与周期互为倒数）","explanation":"声音的三要素：音调、响度、音色\n\n1. 音调：\n   - 声音的高低，由频率决定\n   - 频率：每秒内振动的次数，单位 Hz\n   - 频率越高，音调越高\n\n2. 响度：\n   - 声音的强弱（大小），由振幅决定\n   - 振幅：振动的幅度\n   - 振幅越大，响度越大\n   - 离声源越近，响度越大\n\n3. 音色：\n   - 声音的品质，由发声体本身决定\n   - 不同物体发出的声音音色不同","semester":"upper"},{"id":"g2_physics_008","chapter":"第二章 声现象","name":"超声波与次声波","formula":"人耳听觉范围：20 Hz ~ 20 000 Hz","explanation":"人耳能听到的声音频率范围：20 Hz ~ 20 000 Hz\n\n超声波：频率高于 20 000 Hz 的声音\n- 应用：B超、潜艇声呐、金属内部缺陷检测、灭鼠驱虫\n\n次声波：频率低于 20 Hz 的声音\n- 产生：地震、火山喷发、海啸、台风、机器振动\n- 危害：能破坏建筑物，损害人体健康\n- 应用：预测地震、台风，监测核爆炸","semester":"upper"},{"id":"g2_physics_009","chapter":"第二章 声现象","name":"噪声的危害与控制","formula":"0 dB 是人耳听觉下限\n> 90 dB 影响听力","explanation":"噪声：\n- 从物理学角度：发声体做无规则振动时发出的声音\n- 从环境保护角度：凡是妨碍人们正常休息、学习和工作的声音，以及对人们要听的声音起干扰作用的声音\n\n控制途径：\n1. 在声源处减弱（消声）\n2. 在传播过程中减弱（吸声、隔声）\n3. 在人耳处减弱（戴耳塞、护耳器）\n\n分贝（dB）是声音强弱的单位。","semester":"upper"},{"id":"g2_physics_010","chapter":"第三章 物态变化","name":"温度与温度计","formula":"T(K) = t(°C) + 273.15","explanation":"温度：表示物体冷热程度的物理量。\n\n单位：\n- 摄氏温度（°C）：冰水混合物为 0°C，沸水为 100°C\n- 热力学温度（K）：以 -273.15°C 为绝对零度\n- 换算：T = t + 273.15\n\n温度计：\n- 原理：液体的热胀冷缩\n- 使用：\n  1. 估：估计被测温度，选用合适量程的温度计\n  2. 浸：玻璃泡全部浸入液体中，不碰容器底和壁\n  3. 读：待示数稳定后读数，视线与液柱上表面相平\n  4. 取：读数时不能将温度计从液体中取出","semester":"upper"},{"id":"g2_physics_011","chapter":"第三章 物态变化","name":"熔化和凝固","formula":"晶体熔化条件：达到熔点 + 继续吸热","explanation":"物质从固态变成液态的过程叫熔化。\n物质从液态变成固态的过程叫凝固。\n\n固体分类：\n- 晶体：海波、冰、各种金属等，有固定熔点\n- 非晶体：松香、玻璃、蜡、沥青等，没有固定熔点\n\n晶体熔化特点：\n- 吸热但温度保持不变（熔点）\n- 熔液共存\n\n晶体凝固特点：\n- 放热但温度保持不变（凝固点）\n- 同一晶体的熔点和凝固点相同","semester":"upper"},{"id":"g2_physics_012","chapter":"第三章 物态变化","name":"汽化和液化","formula":"影响蒸发快慢：温度、表面积、空气流动","explanation":"汽化：物质从液态变为气态的过程（吸热）。\n液化：物质从气态变为液态的过程（放热）。\n\n汽化两种方式：\n1. 蒸发：\n   - 在任何温度下都能发生，只在液体表面进行\n   - 影响因素：液体温度、表面积、空气流动\n   - 蒸发吸热有致冷作用\n2. 沸腾：\n   - 在一定温度（沸点）下发生，在液体内部和表面同时进行\n   - 条件：达到沸点 + 继续吸热\n   - 液体沸腾时吸热但温度不变","semester":"upper"},{"id":"g2_physics_013","chapter":"第三章 物态变化","name":"升华和凝华","formula":"升华吸热；凝华放热","explanation":"升华：物质从固态直接变成气态的过程（吸热）。\n凝华：物质从气态直接变成固态的过程（放热）。\n\n常见现象：\n- 升华：樟脑丸变小、冬天冰冻的衣服变干、灯丝变细\n- 凝华：霜、雪、雾凇、冰花、碘蒸气遇冷凝华\n\n应用：\n- 人工降雨：干冰升华吸热，使空气中水蒸气液化\n- 舞台烟雾：干冰升华使空气中的水蒸气液化形成小水滴","semester":"upper"},{"id":"g2_physics_014","chapter":"第四章 光现象","name":"光的直线传播","formula":"光速 c ≈ 3 × 10⁸ m/s","explanation":"光在同种均匀介质中沿直线传播。\n\n光速：\n- 真空中的光速 c = 3 × 10⁸ m/s（自然界中最大的速度）\n- 空气中的光速略小于真空\n- 光在水中的速度约为真空的 3/4\n- 光在玻璃中的速度约为真空的 2/3\n\n应用：\n- 激光准直\n- 影子的形成\n- 日食、月食的形成\n- 小孔成像","semester":"upper"},{"id":"g2_physics_015","chapter":"第四章 光现象","name":"光的反射定律","formula":"∠r = ∠i\n（反射角等于入射角）","explanation":"光射到物体表面时，被物体表面反射回去的现象叫光的反射。\n\n反射定律：\n1. 反射光线、入射光线与法线在同一平面内\n2. 反射光线和入射光线分居法线两侧\n3. 反射角等于入射角（∠r = ∠i）\n\n两种反射：\n- 镜面反射：反射面光滑，平行光反射后仍平行\n- 漫反射：反射面凹凸不平，平行光反射后射向各个方向（我们能从不同方向看到物体是因为漫反射）","semester":"upper"},{"id":"g2_physics_016","chapter":"第四章 光现象","name":"平面镜成像","formula":"像距 = 物距\n像与物大小相等","explanation":"平面镜成像特点：\n1. 像与物大小相等\n2. 像与物到平面镜的距离相等（像距 = 物距）\n3. 像与物左右相反\n4. 像是正立的虚像（不是实际光线会聚而成）\n\n原理：光的反射。\n\n应用：\n- 日常生活：穿衣镜、整理仪容\n- 医学：口腔镜\n- 改变光路：潜望镜","semester":"upper"},{"id":"g2_physics_017","chapter":"第四章 光现象","name":"光的折射","formula":"光从空气斜射入水/玻璃：折射角 < 入射角","explanation":"光从一种介质斜射入另一种介质时，传播方向发生偏折的现象叫光的折射。\n\n折射定律：\n1. 折射光线、入射光线、法线在同一平面内\n2. 折射光线和入射光线分居法线两侧\n3. 光从空气斜射入水或其他介质时，折射角小于入射角\n4. 光从水或其他介质斜射入空气时，折射角大于入射角\n5. 当光线垂直射入时，传播方向不变\n\n现象：\n- 池水变浅\n- 筷子在水中\"折断\"\n- 海市蜃楼\n- 彩虹","semester":"upper"},{"id":"g2_physics_018","chapter":"第四章 光现象","name":"光的色散","formula":"红光偏折最小，紫光偏折最大","explanation":"太阳光（白光）通过三棱镜后，被分解成红、橙、黄、绿、蓝、靛、紫七种色光的现象叫光的色散。\n\n色光三原色：红、绿、蓝\n颜料三原色：品红、黄、青\n\n透明物体的颜色由它透过的色光决定；\n不透明物体的颜色由它反射的色光决定。","semester":"upper"},{"id":"g2_physics_019","chapter":"第五章 透镜及其应用","name":"凸透镜与凹透镜","formula":"凸透镜：对光有会聚作用\n凹透镜：对光有发散作用","explanation":"透镜：\n- 凸透镜：中间厚、边缘薄，对光有会聚作用\n- 凹透镜：中间薄、边缘厚，对光有发散作用\n\n基本概念：\n- 主光轴：通过透镜两个球面球心的直线\n- 光心（O）：主光轴上的特殊点，光线通过光心方向不变\n- 焦点（F）：平行于主光轴的光线经透镜后会聚（或反向延长线会聚）的点\n- 焦距（f）：焦点到光心的距离\n\n三条特殊光线：\n1. 平行于主光轴的光线经凸透镜后过焦点\n2. 过焦点的光线经凸透镜后平行于主光轴\n3. 过光心的光线传播方向不变","semester":"upper"},{"id":"g2_physics_020","chapter":"第五章 透镜及其应用","name":"凸透镜成像规律","formula":"1/u + 1/v = 1/f","explanation":"凸透镜成像规律（u 为物距，f 为焦距）：\n\n1. u > 2f：倒立、缩小的实像（应用：照相机）\n2. u = 2f：倒立、等大的实像（应用：测焦距）\n3. f < u < 2f：倒立、放大的实像（应用：投影仪、幻灯机）\n4. u = f：不成像（应用：得到平行光）\n5. u < f：正立、放大的虚像（应用：放大镜）\n\n实像：能用光屏承接；\n虚像：不能被光屏承接，只能用眼睛看到。","semester":"upper"},{"id":"g2_physics_021","chapter":"第五章 透镜及其应用","name":"眼睛与眼镜","formula":"近视眼戴凹透镜\n远视眼戴凸透镜","explanation":"眼睛：\n- 晶状体和角膜的共同作用相当于凸透镜\n- 视网膜相当于光屏\n- 成像：在视网膜上成倒立、缩小的实像\n\n近视眼：\n- 原因：晶状体太厚、折光能力太强或眼球前后径过长\n- 像成在视网膜前方\n- 矫正：配戴凹透镜\n\n远视眼（老花眼）：\n- 原因：晶状体太薄、折光能力太弱或眼球前后径过短\n- 像成在视网膜后方\n- 矫正：配戴凸透镜","semester":"upper"},{"id":"g2_physics_022","chapter":"第五章 透镜及其应用","name":"显微镜与望远镜","formula":"显微镜：物镜 + 目镜（都是凸透镜）","explanation":"显微镜：\n- 物镜：相当于投影仪，成倒立、放大的实像\n- 目镜：相当于放大镜，把物镜成的实像再次放大成虚像\n- 物体最终成倒立、放大的虚像\n\n望远镜：\n- 开普勒望远镜：物镜（使远处物体成缩小的实像）+ 目镜（放大虚像）\n- 最终成倒立、缩小的虚像（视角被放大）","semester":"upper"},{"id":"g2_physics_023","chapter":"第一章 机械运动","name":"测量平均速度","formula":"v̄ = s / t","explanation":"测量平均速度实验：\n\n实验原理：v̄ = s / t\n\n实验器材：斜面、小车、刻度尺、停表、金属片\n\n实验步骤：\n1. 使斜面保持一定坡度\n2. 用刻度尺测出小车通过的路程 s\n3. 用停表测出小车通过该路程所用的时间 t\n4. 改变斜面坡度或路程，重复实验\n\n注意事项：\n- 斜面坡度不宜过小（否则小车运动太慢）\n- 释放小车时应从同一位置由静止释放\n- 测量时间时应在小车开始下滑时开始计时，到达终点时停止计时","semester":"upper"},{"id":"g2_physics_024","chapter":"第二章 声现象","name":"声音在不同介质中的传播","formula":"v（固体）> v（液体）> v（气体）","explanation":"声音传播速度：\n- 在不同介质中传播速度不同\n- 一般情况下：v（固体）> v（液体）> v（气体）\n- 同种介质中，温度越高，传播速度越快\n\n应用：\n- 古代行军：士兵枕着牛皮箭筒睡觉，能及早听到敌方骑兵的马蹄声\n- 水中声呐：探测水下目标\n- 医学：听诊器","semester":"upper"},{"id":"g2_physics_025","chapter":"第四章 光现象","name":"红外线与紫外线","formula":"红外线：热作用强\n紫外线：化学作用强","explanation":"红外线：\n- 位于红光外侧，人眼看不见\n- 特性：热作用强\n- 应用：红外线遥感、红外线加热、红外线测温仪、夜视仪、遥控器\n\n紫外线：\n- 位于紫光外侧，人眼看不见\n- 特性：化学作用强，能使荧光物质发光\n- 应用：验钞机、紫外线消毒、合成维生素D、鉴别古字画\n- 危害：过强紫外线可伤害眼睛和皮肤","semester":"upper"},{"id":"g2_physics_026","chapter":"第三章 物态变化","name":"熔化与凝固图象","formula":"晶体有固定熔点；非晶体没有","explanation":"晶体熔化图象（以海波为例）：\n- 横轴：加热时间（t）\n- 纵轴：温度（T）\n- AB段：固态，吸热升温\n- BC段：固液共存，吸热但温度不变（熔点）\n- CD段：液态，吸热升温\n\n非晶体熔化图象（以蜡为例）：\n- 持续吸热，持续升温，没有固定熔点\n\n凝固图象与熔化图象相反：\n- 晶体凝固时放热温度不变（凝固点）","semester":"upper"},{"id":"g2_physics_027","chapter":"第五章 透镜及其应用","name":"生活中的透镜","formula":"照相机 u>2f\n投影仪 f<u<2f\n放大镜 u<f","explanation":"生活中的透镜应用：\n\n1. 照相机：\n   - 镜头相当于凸透镜\n   - u > 2f，成倒立、缩小的实像\n   - 像是光屏（底片）上的实际光线会聚而成\n\n2. 投影仪（幻灯机）：\n   - 镜头相当于凸透镜\n   - f < u < 2f，成倒立、放大的实像\n   - 平面镜的作用：改变光的传播方向\n\n3. 放大镜：\n   - 物体在焦点以内（u < f）\n   - 成正立、放大的虚像\n   - 物距越大，虚像越大（但最大不超过物体2倍）","semester":"upper"},{"id":"g2_physics_028","chapter":"第四章 光现象","name":"光现象的辨析与应用","formula":"光直线传播、反射、折射的区别","explanation":"三种光现象辨析：\n\n1. 光的直线传播：\n   - 同种均匀介质中光沿直线传播\n   - 现象：影子、日食、月食、小孔成像\n\n2. 光的反射：\n   - 光射到物体表面被反射回去\n   - 反射角 = 入射角\n   - 现象：平面镜成像、看见不发光的物体\n\n3. 光的折射：\n   - 光从一种介质斜射入另一种介质\n   - 现象：池水变浅、海市蜃楼、彩虹、铅笔在水中\"折断\"","semester":"upper"},{"id":"g2_physics_029","chapter":"第六章 质量与密度","name":"质量及其测量","formula":"m_总 = m1 + m2 + ...","explanation":"质量：物体所含物质的多少。\n\n性质：\n- 质量是物体本身的一种属性，与物体的形状、状态、位置无关\n- 单位：t、kg、g、mg\n- 换算：1 t = 1000 kg，1 kg = 1000 g，1 g = 1000 mg\n\n测量工具：托盘天平\n使用步骤：\n1. 看：量程、分度值\n2. 放：水平台面上，游码归零\n3. 调：调节平衡螺母使横梁平衡\n4. 称：左物右码，砝码由大到小\n5. 读：m物体 = m砝码 + m游码\n6. 收：砝码归盒，游码归零","semester":"lower"},{"id":"g2_physics_030","chapter":"第六章 质量与密度","name":"密度的概念与公式","formula":"ρ = m / V\n（ρ：密度，m：质量，V：体积）","explanation":"密度：单位体积某种物质的质量。\n\n性质：\n- 密度是物质的一种特性，与物体的质量、体积无关（与温度、状态有关）\n- 单位：kg/m³ 或 g/cm³\n- 换算：1 g/cm³ = 1000 kg/m³ = 10³ kg/m³\n\n常见物质密度（水=1.0 g/cm³）：\n- 铝 2.7 g/cm³\n- 铁 7.9 g/cm³\n- 铜 8.9 g/cm³\n- 水银 13.6 g/cm³","semester":"lower"},{"id":"g2_physics_031","chapter":"第六章 质量与密度","name":"密度的应用","formula":"m = ρV\nV = m / ρ","explanation":"密度公式变形：\n- m = ρV（已知体积求质量）\n- V = m / ρ（已知质量求体积）\n\n应用：\n1. 鉴别物质：测出密度，对照密度表\n2. 求质量：不便直接称量时，测体积查密度计算\n3. 求体积：不便直接测量时，称质量查密度计算\n4. 判断空心实心：\n   - 假设实心，计算密度与物质密度比较\n   - 假设实心，计算体积与物体体积比较","semester":"lower"},{"id":"g2_physics_032","chapter":"第六章 质量与密度","name":"测量物质的密度","formula":"ρ = m / V","explanation":"实验原理：ρ = m / V\n\n实验器材：天平、量筒、烧杯、水、待测物体\n\n实验步骤：\n1. 用天平测量物体质量 m\n2. 在量筒中倒入适量水，读体积 V1\n3. 用细线系住物体放入量筒，读体积 V2\n4. 计算 V = V2 - V1\n5. 计算 ρ = m / V\n\n注意事项：\n- 测量顺序：先测质量，再测体积（避免水使物体沾水影响质量测量）\n- 量筒读数：视线与凹液面最低处相平\n- 适量水：能浸没物体且能读出物体放入后体积","semester":"lower"},{"id":"g2_physics_033","chapter":"第七章 力","name":"力的概念与作用效果","formula":"力的单位：牛顿（N）","explanation":"力：物体对物体的作用。\n\n力的作用效果：\n1. 改变物体的形状（使物体发生形变）\n2. 改变物体的运动状态（速度大小或方向改变）\n\n力的三要素：大小、方向、作用点。\n\n单位：牛顿（N），1 N 大约等于拿起 2 个鸡蛋的力。\n\n力的相互性：\n- 物体间力的作用是相互的\n- 一个物体对另一个物体施力时，也一定受到另一个物体对它的力\n- 作用力与反作用力大小相等，方向相反，作用在两个不同物体上","semester":"lower"},{"id":"g2_physics_034","chapter":"第七章 力","name":"弹力与弹簧测力计","formula":"F = kx（胡克定律）","explanation":"弹力：物体发生弹性形变时产生的力。\n\n条件：\n- 物体间相互接触\n- 发生弹性形变\n\n常见弹力：压力、支持力、推力、拉力、绳的拉力等。\n\n弹簧测力计：\n- 原理：在弹性限度内，弹簧的伸长量与所受拉力成正比\n- 使用：\n  1. 看清量程、分度值\n  2. 校零\n  3. 拉力方向沿弹簧轴线方向\n  4. 读数时视线与刻度盘相平","semester":"lower"},{"id":"g2_physics_035","chapter":"第七章 力","name":"重力","formula":"G = mg\ng = 9.8 N/kg","explanation":"重力：由于地球吸引而使物体受到的力。\n\n符号：G\n单位：N\n方向：竖直向下（不是垂直向下）\n作用点：重心（质量分布均匀的物体的重心在几何中心）\n\n重力与质量的关系：\n- G = m × g\n- g = 9.8 N/kg，物理意义：质量为 1 kg 的物体受到的重力为 9.8 N\n- g 在地球不同位置略有不同\n\n注意：重力是物体受到的力，地球对物体的万有引力的一个分力。","semester":"lower"},{"id":"g2_physics_036","chapter":"第七章 力","name":"摩擦力","formula":"f = μN","explanation":"摩擦力：两个相互接触的物体发生相对运动或有相对运动趋势时，在接触面上产生的阻碍相对运动的力。\n\n分类：\n1. 滑动摩擦力：\n   - 方向：与相对运动方向相反\n   - 大小：与压力、接触面粗糙程度有关，与速度无关\n2. 静摩擦力：\n   - 方向：与相对运动趋势方向相反\n   - 大小：随外力的变化而变化\n3. 滚动摩擦力：比滑动摩擦力小得多\n\n增大有益摩擦：增大压力、使接触面更粗糙\n减小有害摩擦：减小压力、使接触面光滑、加润滑油、用滚动代替滑动","semester":"lower"},{"id":"g2_physics_037","chapter":"第八章 运动和力","name":"牛顿第一定律","formula":"一切物体在没有受到外力作用时\n总保持静止或匀速直线运动状态","explanation":"牛顿第一定律（惯性定律）：\n一切物体在没有受到外力作用时，总保持静止状态或匀速直线运动状态。\n\n说明：\n1. 该定律是在大量经验事实基础上，通过进一步的推理而概括出来的\n2. 不受力的物体是不存在的，所以牛顿第一定律是理想情况\n3. 力是改变物体运动状态的原因\n4. 物体的运动不需要力来维持","semester":"lower"},{"id":"g2_physics_038","chapter":"第八章 运动和力","name":"惯性","formula":"一切物体都有保持原来运动状态的性质","explanation":"惯性：物体保持原来运动状态不变的性质。\n\n性质：\n1. 一切物体在任何时候都具有惯性\n2. 惯性大小只与质量有关，质量越大惯性越大\n3. 惯性不是力，不能说「受到惯性作用」\n\n应用：\n- 跳远前的助跑\n- 拍打衣服上的灰尘\n- 锤头松了用撞击方法套紧\n- 安全带的作用","semester":"lower"},{"id":"g2_physics_039","chapter":"第八章 运动和力","name":"二力平衡","formula":"F1 = F2\n方向相反、作用在同一直线上、同一物体上","explanation":"二力平衡：物体在两个力的作用下保持静止或匀速直线运动状态。\n\n二力平衡条件（四同三不同原则）：\n1. 大小相等\n2. 方向相反\n3. 作用在同一直线上\n4. 作用在同一物体上\n\n注意：\n- 平衡力与相互作用力的区别：平衡力作用在同一物体上，相互作用力作用在不同物体上\n- 物体受平衡力时，一定处于静止或匀速直线运动状态","semester":"lower"},{"id":"g2_physics_040","chapter":"第八章 运动和力","name":"同一直线上二力的合成","formula":"同方向：F = F1 + F2\n反方向：F = |F1 - F2|","explanation":"合力：如果一个力产生的效果跟几个力共同作用产生的效果相同，这个力就叫做那几个力的合力。\n\n同一直线上二力的合成：\n1. 同方向：F合 = F1 + F2，方向与 F1、F2 相同\n2. 反方向：F合 = |F1 - F2|，方向与较大的力相同\n\n注意：\n- 合力可以大于、等于或小于任一分力\n- 合力是等效替代，不是真正存在的力","semester":"lower"},{"id":"g2_physics_041","chapter":"第九章 压强","name":"压强的概念与公式","formula":"p = F / S\n单位：Pa（帕斯卡），1 Pa = 1 N/m²","explanation":"压强：物体所受压力的大小与受力面积之比。\n\n物理意义：表示压力作用效果的物理量。\n\n公式：p = F / S\n- F：压力（单位 N）\n- S：受力面积（单位 m²）\n- p：压强（单位 Pa）\n\n应用：\n- 增大压强：增大压力、减小受力面积\n- 减小压强：减小压力、增大受力面积\n\n实例：\n- 啄木鸟的嘴尖、针尖、刀刃\n- 书包带宽、坦克履带、滑雪板","semester":"lower"},{"id":"g2_physics_042","chapter":"第九章 压强","name":"液体的压强","formula":"p = ρgh\n（ρ：液体密度，g = 9.8 N/kg，h：深度）","explanation":"液体压强：\n- 由于液体受到重力且具有流动性，所以液体对容器底和侧壁都有压强\n- 液体内部向各个方向都有压强\n\n液体压强公式：p = ρ液 g h\n- 适用条件：静止液体\n- 深度 h：液面到所求点的竖直距离\n- 同一深度，液体向各个方向压强相等\n- 深度越深，压强越大\n- 密度越大，压强越大\n\n连通器原理：\n- 上端开口、下部相连通的容器叫连通器\n- 连通器里同一种液体不流动时，各容器中液面总保持相平","semester":"lower"},{"id":"g2_physics_043","chapter":"第九章 压强","name":"大气压强","formula":"p0 ≈ 1.013 × 10⁵ Pa\n（标准大气压）","explanation":"大气压强：大气对浸在它里面的物体产生的压强。\n\n产生原因：\n- 空气受到重力作用且具有流动性\n\n标准大气压：\n- 1 标准大气压 = 760 mm 汞柱 = 1.013 × 10⁵ Pa\n- 大气压随高度增加而减小\n- 一切液体的沸点随气压降低而降低\n\n证明大气压存在的实验：\n- 马德堡半球实验\n- 覆杯实验\n\n测量工具：水银气压计、无液气压计","semester":"lower"},{"id":"g2_physics_044","chapter":"第九章 压强","name":"流体压强与流速的关系","formula":"流速越大，压强越小","explanation":"流体：液体和气体的统称。\n\n流速与压强的关系：\n- 在流体中，流速越大的地方，压强越小\n- 流速越小的地方，压强越大\n\n应用：\n1. 飞机机翼：上方凸起，下方平直。飞行时上方空气流速大、压强小，下方流速小、压强大，产生向上的升力。\n2. 火车站台安全线：火车通过时，靠近车身边缘空气流速大、压强小，远离的一侧大气压会把人推向火车。\n3. 喷雾器：\n4. 乒乓球的弧圈球：","semester":"lower"},{"id":"g2_physics_045","chapter":"第十章 浮力","name":"浮力的概念","formula":"F浮 = F下 - F上（压力差法）","explanation":"浮力：浸在液体（或气体）中的物体受到液体（或气体）向上的托力。\n\n方向：竖直向上\n施力物体：液体（或气体）\n\n称重法：F浮 = G物 - F示（物体在空气中的重力减去浸在液体中时弹簧测力计的示数）\n\n浮力产生原因：\n- 液体对物体上下表面的压力差\n- F浮 = F下表面 - F上表面\n- 当物体下表面没有液体时（如物体紧贴容器底部），F浮 = 0（特例）","semester":"lower"},{"id":"g2_physics_046","chapter":"第十章 浮力","name":"阿基米德原理","formula":"F浮 = G排 = ρ液 g V排","explanation":"阿基米德原理：\n浸在液体中的物体所受的浮力，等于它排开的液体所受的重力。\n\n公式：F浮 = G排液 = m排g = ρ液gV排\n- 适用：液体和气体\n- V排：物体排开液体的体积（不一定等于物体体积）\n- 当物体完全浸没时：V排 = V物\n- 当物体部分浸没时：V排 < V物\n\n注意：\n- 浮力大小只与液体密度和 V排 有关\n- 与物体本身的密度、形状、浸没深度无关","semester":"lower"},{"id":"g2_physics_047","chapter":"第十章 浮力","name":"物体的浮沉条件","formula":"漂浮：F浮 = G物\n悬浮：F浮 = G物且V排 = V物","explanation":"物体的浮沉：\n\n1. 下沉：F浮 < G物（ρ物 > ρ液）\n2. 悬浮：F浮 = G物（ρ物 = ρ液），可停留在液体内部任何位置\n3. 上浮：F浮 > G物（ρ物 < ρ液），最终漂浮\n4. 漂浮：F浮 = G物（ρ物 < ρ液），静止在液面上，部分浸入\n\n判断方法：\n- 比较 F浮 和 G 的大小\n- 比较 ρ物 和 ρ液 的大小（实心物体）\n\n注意：\n- 漂浮时 V排 < V物\n- 悬浮和漂浮都是平衡状态，F浮 = G物\n- 潜水艇：靠改变自身重力实现上浮和下沉","semester":"lower"},{"id":"g2_physics_048","chapter":"第十章 浮力","name":"浮力的应用","formula":"F浮 = ρ液gV排","explanation":"浮力应用：\n\n1. 轮船：\n   - 用钢铁制成，制成空心增大 V排，增大 F浮\n   - 排水量：满载时排开水的质量\n\n2. 潜水艇：\n   - 通过向水舱中充水或排水改变自身重力\n   - F浮不变（V排不变），改变 G 实现浮沉\n\n3. 气球、飞艇：\n   - 内部充入密度小于空气的气体（氢气、氦气、热空气）\n   - F浮 > G 时升空\n\n4. 密度计：\n   - 漂浮在液面，F浮 = G\n   - 液体密度越小，密度计浸入越深","semester":"lower"},{"id":"g2_physics_049","chapter":"第十一章 功和机械能","name":"功的概念与公式","formula":"W = Fs\n（W：功，F：力，s：沿力的方向移动的距离）","explanation":"功：力与物体在力的方向上移动距离的乘积。\n\n公式：W = Fs\n- 单位：J（焦耳），1 J = 1 N·m\n- 1 J 约等于把 1 个鸡蛋举高 1 m 做的功\n\n做功的两个必要因素：\n1. 作用在物体上的力\n2. 物体在力的方向上移动了一段距离\n\n不做功的三种情况：\n1. 物体不受力但运动（如冰在光滑冰面上滑行）\n2. 物体受力但没有移动\n3. 物体受力且移动，但力的方向与运动方向垂直","semester":"lower"},{"id":"g2_physics_050","chapter":"第十一章 功和机械能","name":"功率","formula":"P = W / t = Fv","explanation":"功率：单位时间内所做的功。\n\n物理意义：表示做功快慢的物理量。\n\n公式：\n- 定义式：P = W / t\n- 变形：P = Fv（v 为匀速运动速度）\n\n单位：W（瓦特），1 W = 1 J/s\n常用单位：kW（千瓦），1 kW = 1000 W\n\n注意：\n- 功率大不一定做功多，做功多不一定功率大\n- 功率与机械效率无关","semester":"lower"},{"id":"g2_physics_051","chapter":"第十一章 功和机械能","name":"动能和势能","formula":"Ek = ½mv²\nEp = mgh","explanation":"动能：物体由于运动而具有的能。\n- 大小与质量、速度有关\n- 公式：Ek = ½mv²\n- 质量越大、速度越大，动能越大\n\n势能：\n1. 重力势能：物体由于被举高而具有的能\n   - 大小与质量、被举高度有关\n   - 公式：Ep = mgh\n   - 质量越大、高度越高，重力势能越大\n\n2. 弹性势能：物体由于发生弹性形变而具有的能\n   - 与弹性形变程度有关\n   - 形变程度越大，弹性势能越大\n\n统称机械能：动能 + 势能","semester":"lower"},{"id":"g2_physics_052","chapter":"第十一章 功和机械能","name":"机械能及其转化","formula":"E机械 = Ek + Ep","explanation":"机械能转化：\n- 动能和势能可以相互转化\n- 转化过程中，若不计摩擦、空气阻力等，机械能总量保持不变（机械能守恒）\n\n实例：\n- 滚摆：下降时重力势能转化为动能；上升时动能转化为重力势能\n- 单摆：最高点势能最大、最低点动能最大\n- 弹簧：压缩时弹性势能增大\n- 过山车\n- 撑杆跳：动能 → 弹性势能 → 重力势能","semester":"lower"},{"id":"g2_physics_053","chapter":"第十二章 简单机械","name":"杠杆","formula":"F1 × L1 = F2 × L2","explanation":"杠杆：在力的作用下能绕着固定点转动的硬棒。\n\n五要素：\n1. 支点 O：杠杆绕着转动的点\n2. 动力 F1：使杠杆转动的力\n3. 阻力 F2：阻碍杠杆转动的力\n4. 动力臂 L1：支点到动力作用线的距离\n5. 阻力臂 L2：支点到阻力作用线的距离\n\n杠杆平衡条件：F1 × L1 = F2 × L2（动力×动力臂 = 阻力×阻力臂）\n\n杠杆分类：\n1. 省力杠杆：L1 > L2，F1 < F2，但费距离\n2. 费力杠杆：L1 < L2，F1 > F2，但省距离\n3. 等臂杠杆：L1 = L2，F1 = F2，不省力不费力","semester":"lower"},{"id":"g2_physics_054","chapter":"第十二章 简单机械","name":"滑轮","formula":"F = G / n\ns = nh","explanation":"滑轮分类：\n\n1. 定滑轮：\n   - 实质：等臂杠杆\n   - 特点：F = G，不省力但改变力的方向\n   - 物体移动距离 s = 绳端移动距离\n\n2. 动滑轮：\n   - 实质：动力臂 = 2 × 阻力臂的杠杆\n   - 特点：F = G/2，省一半力（不计摩擦和动滑轮重），但不改变力的方向\n   - 绳端移动距离 s = 2h\n\n3. 滑轮组：\n   - 既省力又改变力的方向\n   - F = G总 / n（n 为承担物重的绳子段数）\n   - s = nh（绳端移动距离 = n × 物体上升高度）\n   - s/v 关系：v绳 = nv物","semester":"lower"},{"id":"g2_physics_055","chapter":"第十二章 简单机械","name":"机械效率","formula":"η = W有用 / W总 × 100%","explanation":"有用功（W有用）：人们需要做的功，对人们有用的功。\n额外功（W额外）：人们不需要但又不得不做的功。\n总功（W总）：有用功与额外功的总和。\n\nW总 = W有用 + W额外\n\n机械效率：\n- 定义：有用功跟总功的比值\n- 公式：η = W有用 / W总 × 100%\n- η 永远小于 1（小于 100%）\n- η 没有单位，用百分数表示\n\n提高机械效率的方法：\n1. 减小机械自重\n2. 加润滑油减小摩擦\n3. 改进机械结构，使额外功减小","semester":"lower"},{"id":"g2_physics_056","chapter":"第九章 压强","name":"液体压强的计算","formula":"F = pS = ρ液ghS","explanation":"液体压力和压强：\n\n压力：F = pS = ρ液ghS\n- 不一定等于液体的重力\n- 容器形状决定 F 与 G液 关系：\n  - 上宽下窄：F < G液\n  - 上下等宽：F = G液\n  - 上窄下宽：F > G液\n\n特殊容器压力：\n- 装满水的规则容器底面受到的压力 F = ρ水gSh","semester":"lower"},{"id":"g2_physics_057","chapter":"第七章 力","name":"力的示意图","formula":"力的图示：标度 + 方向 + 大小","explanation":"力的示意图：用一根带箭头的线段把力的三要素表示出来。\n\n作图方法：\n1. 沿力的方向画一条线段\n2. 线段的起点或终点画在力的作用点上\n3. 在线段末端画箭头表示力的方向\n4. 在同一图上，线段长度需成比例（标度）\n\n注意事项：\n- 重力：作用点画在重心，方向竖直向下\n- 压力：作用点在受压物体的接触面上，方向垂直于接触面\n- 拉力：作用点在被拉物体的受力处，方向沿绳收缩方向","semester":"lower"},{"id":"g2_physics_058","chapter":"第七章 力","name":"力的平衡与运动状态","formula":"合力为零 ⇄ 平衡状态","explanation":"物体运动状态与受力关系：\n\n1. 物体不受力：保持静止或匀速直线运动\n2. 受平衡力：保持静止或匀速直线运动\n3. 受非平衡力：运动状态改变\n   - 力方向与运动方向相同：加速\n   - 力方向与运动方向相反：减速\n   - 力方向与运动方向不在同一直线上：运动方向改变（曲线运动）\n\n力是改变物体运动状态的原因，不是维持运动的原因。","semester":"lower"}];

        // ==================== 内嵌例题数据 ====================
        const DATA_EXAMPLES = [{"id":"g2_physics_001_ex01","knowledge_id":"g2_physics_001","question":"选择题：下列长度单位换算正确的是（  ）\nA. 1 km = 100 m\nB. 1 m = 100 cm\nC. 1 cm = 100 mm\nD. 1 mm = 100 μm","answer":"答案：B\n解析：\nA. 错误，1 km = 1000 m\nB. 正确，1 m = 10 dm = 100 cm\nC. 错误，1 cm = 10 mm\nD. 错误，1 mm = 1000 μm"},{"id":"g2_physics_001_ex02","knowledge_id":"g2_physics_001","question":"填空题：国际单位制中，长度的基本单位是______。","answer":"答案：米（m）\n解析：国际单位制中长度的基本单位是米，符号为m。"},{"id":"g2_physics_001_ex03","knowledge_id":"g2_physics_001","question":"选择题：用刻度尺测量物体长度时，下列做法正确的是（  ）\nA. 刻度尺要斜放\nB. 视线要与刻度线垂直\nC. 可以将刻度尺从物体上移开读数\nD. 不需要估读","answer":"答案：B\n解析：\nA. 错误，刻度尺要放正\nB. 正确，视线与刻度线垂直才能读数准确\nC. 错误，读数时刻度尺不能移开\nD. 错误，需要估读到分度值的下一位"},{"id":"g2_physics_001_ex04","knowledge_id":"g2_physics_001","question":"判断题：测量结果必须包括准确值、估计值和单位。","answer":"答案：正确\n解析：测量值 = 准确值 + 估计值 + 单位，三者缺一不可。"},{"id":"g2_physics_001_ex05","knowledge_id":"g2_physics_001","question":"解答题：某同学用刻度尺测量书本长度，结果为25.12 cm，请说明这个测量结果中各部分的含义。","answer":"答案：25.1 cm是准确值，0.02 cm是估计值，cm是单位。\n解析：准确值是刻度尺能精确读出的部分，估计值是根据分度值估读的部分。"},{"id":"g2_physics_001_ex06","knowledge_id":"g2_physics_001","question":"选择题：下列物体的长度最接近1 m的是（  ）\nA. 一支铅笔\nB. 一张课桌\nC. 一根筷子\nD. 一个篮球","answer":"答案：B\n解析：课桌的高度大约是1 m左右。"},{"id":"g2_physics_001_ex07","knowledge_id":"g2_physics_001","question":"填空题：1 μm = ______ nm。","answer":"答案：1000\n解析：1 mm = 1000 μm = 1000000 nm，所以1 μm = 1000 nm。"},{"id":"g2_physics_001_ex08","knowledge_id":"g2_physics_001","question":"判断题：误差是可以避免的。","answer":"答案：错误\n解析：误差是测量值与真实值之间的差异，只能减小，不能避免。"},{"id":"g2_physics_001_ex09","knowledge_id":"g2_physics_001","question":"解答题：如何减小测量误差？","answer":"答案：1. 多次测量取平均值；2. 使用更精密的测量工具；3. 改进测量方法。\n解析：误差不可避免，但可以通过这些方法减小。"},{"id":"g2_physics_001_ex10","knowledge_id":"g2_physics_001","question":"选择题：刻度尺的分度值是1 mm，测量结果为12.34 cm，则准确值和估计值分别是（  ）\nA. 12 cm和0.34 cm\nB. 12.3 cm和0.04 cm\nC. 12.34 cm和0 cm\nD. 12.3 cm和0.04 mm","answer":"答案：B\n解析：分度值是1 mm，所以准确值到毫米位，即12.3 cm，估计值是0.04 cm。"},{"id":"g2_physics_002_ex01","knowledge_id":"g2_physics_002","question":"选择题：下列时间单位换算正确的是（  ）\nA. 1 h = 60 s\nB. 1 min = 600 s\nC. 1 h = 3600 s\nD. 1 s = 100 ms","answer":"答案：C\n解析：\nA. 错误，1 h = 60 min = 3600 s\nB. 错误，1 min = 60 s\nC. 正确，1 h = 60 min = 3600 s\nD. 错误，1 s = 1000 ms"},{"id":"g2_physics_002_ex02","knowledge_id":"g2_physics_002","question":"填空题：国际单位制中，时间的基本单位是______。","answer":"答案：秒（s）\n解析：国际单位制中时间的基本单位是秒，符号为s。"},{"id":"g2_physics_002_ex03","knowledge_id":"g2_physics_002","question":"选择题：测量时间的工具是（  ）\nA. 刻度尺\nB. 停表\nC. 温度计\nD. 天平","answer":"答案：B\n解析：停表（秒表）是测量时间的工具。"},{"id":"g2_physics_002_ex04","knowledge_id":"g2_physics_002","question":"判断题：误差只能减小，不能避免。","answer":"答案：正确\n解析：误差是不可避免的，只能通过多次测量取平均值等方法减小。"},{"id":"g2_physics_002_ex05","knowledge_id":"g2_physics_002","question":"解答题：测量某物体运动时间，三次测量结果分别为2.1 s、2.2 s、2.3 s，求平均值。","answer":"答案：2.2 s\n解析：平均值 = (2.1 + 2.2 + 2.3) ÷ 3 = 6.6 ÷ 3 = 2.2 s"},{"id":"g2_physics_002_ex06","knowledge_id":"g2_physics_002","question":"选择题：下列关于时间的说法，正确的是（  ）\nA. 时间没有单位\nB. 秒是时间的唯一单位\nC. 时间可以用停表测量\nD. 时间不能测量","answer":"答案：C\n解析：时间可以用停表测量，秒是基本单位但不是唯一单位。"},{"id":"g2_physics_002_ex07","knowledge_id":"g2_physics_002","question":"填空题：1 min = ______ s。","answer":"答案：60\n解析：1分钟等于60秒。"},{"id":"g2_physics_002_ex08","knowledge_id":"g2_physics_002","question":"判断题：测量时间时，不需要估读。","answer":"答案：错误\n解析：测量时间也需要估读到分度值的下一位。"},{"id":"g2_physics_002_ex09","knowledge_id":"g2_physics_002","question":"解答题：为什么要进行多次测量取平均值？","answer":"答案：减小误差，提高测量的准确性。\n解析：单次测量可能存在较大误差，多次测量取平均值可以减小偶然误差。"},{"id":"g2_physics_002_ex10","knowledge_id":"g2_physics_002","question":"选择题：停表的分度值是0.1 s，测量结果为15.25 s，则准确值和估计值分别是（  ）\nA. 15 s和0.25 s\nB. 15.2 s和0.05 s\nC. 15.25 s和0 s\nD. 15.2 s和0.05 min","answer":"答案：B\n解析：分度值是0.1 s，准确值到0.1 s位，即15.2 s，估计值是0.05 s。"},{"id":"g2_physics_003_ex01","knowledge_id":"g2_physics_003","question":"选择题：下列现象中，属于机械运动的是（  ）\nA. 苹果腐烂\nB. 花香四溢\nC. 汽车行驶\nD. 铁钉生锈","answer":"答案：C\n解析：机械运动是物体位置的变化。汽车行驶时位置在变化，属于机械运动。"},{"id":"g2_physics_003_ex02","knowledge_id":"g2_physics_003","question":"填空题：研究机械运动时，被选作标准的物体叫做______。","answer":"答案：参照物\n解析：参照物是研究机械运动时选作标准的物体。"},{"id":"g2_physics_003_ex03","knowledge_id":"g2_physics_003","question":"选择题：坐在行驶的汽车里的乘客，以地面为参照物时是（  ）\nA. 静止的\nB. 运动的\nC. 可能静止也可能运动\nD. 无法确定","answer":"答案：B\n解析：乘客相对于地面的位置在变化，所以是运动的。"},{"id":"g2_physics_003_ex04","knowledge_id":"g2_physics_003","question":"判断题：参照物可以任意选择。","answer":"答案：正确\n解析：参照物可以任意选择，但一旦选定，就认为它是静止的。"},{"id":"g2_physics_003_ex05","knowledge_id":"g2_physics_003","question":"解答题：小明坐在行驶的火车上，看到窗外的树木向后退，这是以什么为参照物？","answer":"答案：以火车（或小明自己）为参照物。\n解析：树木相对于火车的位置在向后变化，所以看到树木向后退。"},{"id":"g2_physics_003_ex06","knowledge_id":"g2_physics_003","question":"选择题：下列关于运动和静止的说法，正确的是（  ）\nA. 运动是绝对的，静止是相对的\nB. 运动是相对的，静止是绝对的\nC. 运动和静止都是绝对的\nD. 运动和静止都是相对的","answer":"答案：A\n解析：运动是绝对的，宇宙中一切物体都在运动；静止是相对的，取决于所选参照物。"},{"id":"g2_physics_003_ex07","knowledge_id":"g2_physics_003","question":"填空题：同一物体是运动还是静止，取决于所选的______，这叫运动和静止的相对性。","answer":"答案：参照物\n解析：运动和静止的相对性。"},{"id":"g2_physics_003_ex08","knowledge_id":"g2_physics_003","question":"判断题：选择不同的参照物，物体的运动状态一定不同。","answer":"答案：错误\n解析：可能相同也可能不同，取决于参照物的选择。"},{"id":"g2_physics_003_ex09","knowledge_id":"g2_physics_003","question":"解答题：两位同学并肩而行，以地面为参照物，他们是运动的还是静止的？以其中一位同学为参照物呢？","answer":"答案：以地面为参照物，他们是运动的；以其中一位同学为参照物，另一位是静止的。\n解析：考察参照物对运动状态的影响。"},{"id":"g2_physics_003_ex10","knowledge_id":"g2_physics_003","question":"选择题：\"小小竹排江中游，巍巍青山两岸走\"，前一句和后一句分别以什么为参照物（  ）\nA. 青山，竹排\nB. 竹排，青山\nC. 江水，青山\nD. 青山，江水","answer":"答案：A\n解析：竹排相对于青山在运动；青山相对于竹排在运动。"},{"id":"g2_physics_004_ex01","knowledge_id":"g2_physics_004","question":"选择题：速度的公式是（  ）\nA. v = s × t\nB. v = s / t\nC. v = t / s\nD. s = v × t","answer":"答案：B\n解析：速度 = 路程 ÷ 时间，即v = s/t。"},{"id":"g2_physics_004_ex02","knowledge_id":"g2_physics_004","question":"填空题：速度的国际单位是______。","answer":"答案：米/秒（m/s）\n解析：速度的国际单位是米/秒，符号为m/s。"},{"id":"g2_physics_004_ex03","knowledge_id":"g2_physics_004","question":"选择题：下列速度单位换算正确的是（  ）\nA. 1 m/s = 3.6 km/h\nB. 1 km/h = 3.6 m/s\nC. 1 m/s = 1 km/h\nD. 1 m/s = 0.36 km/h","answer":"答案：A\n解析：1 m/s = 3.6 km/h。"},{"id":"g2_physics_004_ex04","knowledge_id":"g2_physics_004","question":"判断题：速度是表示物体运动快慢的物理量。","answer":"答案：正确\n解析：速度的物理意义就是表示物体运动的快慢。"},{"id":"g2_physics_004_ex05","knowledge_id":"g2_physics_004","question":"解答题：一辆汽车在2小时内行驶了120 km，求这辆汽车的速度。","answer":"答案：60 km/h（或约16.7 m/s）\n解析：v = s/t = 120 km ÷ 2 h = 60 km/h。"},{"id":"g2_physics_004_ex06","knowledge_id":"g2_physics_004","question":"选择题：关于匀速直线运动，下列说法正确的是（  ）\nA. 速度越来越大\nB. 速度越来越小\nC. 速度保持不变\nD. 速度先变大后变小","answer":"答案：C\n解析：匀速直线运动的速度保持不变。"},{"id":"g2_physics_004_ex07","knowledge_id":"g2_physics_004","question":"填空题：1 m/s = ______ km/h。","answer":"答案：3.6\n解析：1 m/s = 3.6 km/h。"},{"id":"g2_physics_004_ex08","knowledge_id":"g2_physics_004","question":"判断题：速度越大，物体通过的路程一定越长。","answer":"答案：错误\n解析：路程 = 速度 × 时间，还与时间有关。"},{"id":"g2_physics_004_ex09","knowledge_id":"g2_physics_004","question":"解答题：一列火车以72 km/h的速度行驶，通过一座长1000 m的桥用了60 s，求火车的长度。","answer":"答案：200 m\n解析：v = 72 km/h = 20 m/s\n总路程 = v × t = 20 × 60 = 1200 m\n火车长度 = 总路程 - 桥长 = 1200 - 1000 = 200 m"},{"id":"g2_physics_004_ex10","knowledge_id":"g2_physics_004","question":"选择题：甲、乙两车都做匀速直线运动，甲车速度是20 m/s，乙车速度是72 km/h，则（  ）\nA. 甲车快\nB. 乙车快\nC. 一样快\nD. 无法比较","answer":"答案：C\n解析：72 km/h = 20 m/s，两车速度相同。"},{"id":"g2_physics_005_ex01","knowledge_id":"g2_physics_005","question":"选择题：平均速度的公式是（  ）\nA. v̄ = s总 × t总\nB. v̄ = s总 / t总\nC. v̄ = (v1 + v2) / 2\nD. v̄ = t总 / s总","answer":"答案：B\n解析：平均速度 = 总路程 ÷ 总时间。"},{"id":"g2_physics_005_ex02","knowledge_id":"g2_physics_005","question":"填空题：平均速度表示物体在某一段路程（或某一段时间）内的______快慢程度。","answer":"答案：平均\n解析：平均速度反映的是平均快慢。"},{"id":"g2_physics_005_ex03","knowledge_id":"g2_physics_005","question":"选择题：关于平均速度，下列说法正确的是（  ）\nA. 平均速度就是速度的平均值\nB. 平均速度与所选路程无关\nC. 平均速度与所选时间无关\nD. 平均速度 = 总路程 ÷ 总时间","answer":"答案：D\n解析：平均速度等于总路程除以总时间，不是速度的平均值。"},{"id":"g2_physics_005_ex04","knowledge_id":"g2_physics_005","question":"判断题：平均速度的数值与所选的路程或时间有关。","answer":"答案：正确\n解析：选择不同的路程或时间，平均速度可能不同。"},{"id":"g2_physics_005_ex05","knowledge_id":"g2_physics_005","question":"解答题：小明从家到学校，前一半路程以1 m/s的速度步行，后一半路程以3 m/s的速度跑步，求全程的平均速度。","answer":"答案：1.5 m/s\n解析：设总路程为2s，则前一半时间t1 = s/1 = s，后一半时间t2 = s/3。\n总时间 = s + s/3 = 4s/3\n平均速度 = 2s ÷ (4s/3) = 1.5 m/s"},{"id":"g2_physics_005_ex06","knowledge_id":"g2_physics_005","question":"选择题：一辆汽车行驶了100 km，用了2小时，则平均速度是（  ）\nA. 50 km/h\nB. 100 km/h\nC. 200 km/h\nD. 50 m/s","answer":"答案：A\n解析：平均速度 = 100 km ÷ 2 h = 50 km/h。"},{"id":"g2_physics_005_ex07","knowledge_id":"g2_physics_005","question":"填空题：平均速度不是______的平均值。","answer":"答案：速度\n解析：平均速度是总路程除以总时间，不是速度的算术平均。"},{"id":"g2_physics_005_ex08","knowledge_id":"g2_physics_005","question":"判断题：平均速度一定等于某一时刻的瞬时速度。","answer":"答案：错误\n解析：平均速度是一段时间内的平均，不一定等于瞬时速度。"},{"id":"g2_physics_005_ex09","knowledge_id":"g2_physics_005","question":"解答题：一辆汽车在平直公路上行驶，前2小时行驶了80 km，后3小时行驶了180 km，求全程的平均速度。","answer":"答案：52 km/h\n解析：总路程 = 80 + 180 = 260 km\n总时间 = 2 + 3 = 5 h\n平均速度 = 260 ÷ 5 = 52 km/h"},{"id":"g2_physics_005_ex10","knowledge_id":"g2_physics_005","question":"选择题：关于平均速度，下列说法错误的是（  ）\nA. 平均速度可以粗略描述物体运动的快慢\nB. 平均速度与路程和时间有关\nC. 匀速直线运动的平均速度等于瞬时速度\nD. 平均速度一定大于瞬时速度","answer":"答案：D\n解析：平均速度可能大于、小于或等于瞬时速度。"},{"id":"g2_physics_006_ex01","knowledge_id":"g2_physics_006","question":"选择题：下列关于声音的产生与传播的说法，正确的是（  ）\nA. 声音可以在真空中传播\nB. 声音是由物体振动产生的\nC. 声音在空气中的传播速度是3×10^8 m/s\nD. 只要物体振动，我们就一定能听到声音","answer":"答案：B\n解析：声音是由物体振动产生的，振动停止发声也停止。A选项错误，声音的传播需要介质，真空不能传声；C选项错误，15°C空气中声速约为340 m/s，光速才是3×10^8 m/s；D选项错误，物体振动产生的声音如果频率不在人耳听觉范围内（20Hz~20000Hz）或没有传播介质，我们也听不到。"},{"id":"g2_physics_006_ex02","knowledge_id":"g2_physics_006","question":"填空题：15°C时，声音在空气中的传播速度约为______m/s；声音在固体、液体和气体中传播速度由快到慢的顺序是______＞______＞______。","answer":"答案：340；固体；液体；气体\n解析：15°C时空气中声速约为340 m/s，25°C时约为346 m/s。声音在不同介质中传播速度不同，一般情况下，固体中最快，液体次之，气体中最慢。"},{"id":"g2_physics_006_ex03","knowledge_id":"g2_physics_006","question":"选择题：在一根较长的装满水的铁管一端敲击一下，在另一端能听到几次声音（  ）\nA. 1次\nB. 2次\nC. 3次\nD. 4次","answer":"答案：C\n解析：声音在不同介质中传播速度不同，铁管中传播最快，水中次之，空气中最慢。所以会先后听到三次声音：第一次通过铁管传来，第二次通过水传来，第三次通过空气传来。"},{"id":"g2_physics_006_ex04","knowledge_id":"g2_physics_006","question":"判断题：宇航员在月球上可以直接面对面交谈。（  ）","answer":"答案：错误\n解析：月球上没有空气，是真空环境，而声音的传播需要介质，真空不能传声。所以宇航员在月球上不能直接交谈，需要依靠无线电设备进行通讯。"},{"id":"g2_physics_006_ex05","knowledge_id":"g2_physics_006","question":"判断题：用手按住正在发声的鼓面，鼓声消失了，原因是手吸收了声波。（  ）","answer":"答案：错误\n解析：鼓声消失的原因是手使鼓面的振动停止了。声音是由物体振动产生的，振动停止，发声也停止，而不是手吸收了声波。"},{"id":"g2_physics_006_ex06","knowledge_id":"g2_physics_006","question":"解答题：在百米赛跑时，终点计时员应该看到发令枪冒烟开始计时，而不是听到枪声才计时。如果听到枪声才计时，会使运动员的成绩偏高还是偏低？相差多少时间？（设当时气温为15°C，结果保留两位小数）","answer":"答案：听到枪声计时会使运动员的成绩偏高（少计了时间）。\n相差时间计算：\nt = s / v = 100 m / 340 m/s ≈ 0.29 s\n答：会使成绩偏高，相差约0.29秒。\n解析：因为光速远大于声速，光从起点传到终点的时间可以忽略不计，而声音传播100米需要约0.29秒。听到枪声才计时，相当于晚计时了0.29秒，记录的时间比实际时间短，所以成绩偏高。"},{"id":"g2_physics_006_ex07","knowledge_id":"g2_physics_006","question":"解答题：小明面对山崖大喊一声，经过1.5秒后听到回声。请问小明距离山崖大约有多远？（设当时气温为15°C）","answer":"答案：声音从小明处传到山崖再反射回来，经过的总路程是小明到山崖距离的2倍。\n声音传播的总路程：s总 = v × t = 340 m/s × 1.5 s = 510 m\n小明到山崖的距离：s = s总 / 2 = 510 m / 2 = 255 m\n答：小明距离山崖约255米。\n解析：回声是声音遇到障碍物反射回来形成的。听到回声的时间内，声音走了一个来回，所以计算距离时要除以2。这是回声测距的基本原理。"},{"id":"g2_physics_006_ex08","knowledge_id":"g2_physics_006","question":"选择题：下列实验中，能说明声音产生条件的是（  ）\nA. 放在钟罩内的闹钟正在响铃，把钟罩内空气抽出一些后，铃声明显减小\nB. 使正在发声的音叉接触水面，水面溅起水花\nC. 吹笛子时，手指按住不同的孔便会发出不同的声音\nD. 把正在发声的收音机密封在塑料袋内，然后放入水中，人们仍能听到收音机发出的声音","answer":"答案：B\n解析：A选项说明声音的传播需要介质（真空不能传声）；B选项中音叉发声时能溅起水花，说明音叉在振动，直接证明了声音是由物体振动产生的；C选项说明音调与振动频率有关；D选项说明液体能够传声。"},{"id":"g2_physics_006_ex09","knowledge_id":"g2_physics_006","question":"填空题：声音以______的形式向四周传播，我们把它叫做______。声音在传播过程中，遇到障碍物会被反射回来，这种现象叫做______。","answer":"答案：波；声波；回声\n解析：声音以波的形式传播，叫做声波。声波是一种机械波，需要介质才能传播。声音遇到障碍物反射回来的现象叫回声，人耳能区分原声和回声的时间间隔至少为0.1秒。"},{"id":"g2_physics_006_ex10","knowledge_id":"g2_physics_006","question":"选择题：下列说法中正确的是（  ）\nA. 声音在真空中传播的速度最大\nB. 声音在空气中传播速度为340 km/h\nC. 回声是声音的反射现象，人耳总能区分回声和原声\nD. 钓鱼时不能大声喧哗，因为水能传声，会吓跑鱼","answer":"答案：D\n解析：A选项错误，真空不能传声；B选项错误，15°C空气中声速是340 m/s，不是340 km/h（340 m/s = 1224 km/h）；C选项错误，只有当回声到达人耳比原声晚0.1秒以上时，人耳才能区分回声和原声；D选项正确，液体可以传声，大声说话的声音会通过水传到鱼那里，吓跑鱼。"},{"id":"g2_physics_007_ex01","knowledge_id":"g2_physics_007","question":"选择题：声音的三个特征是（  ）\nA. 音调、响度、音色\nB. 音调、频率、响度\nC. 振幅、响度、音色\nD. 频率、振幅、音色","answer":"答案：A\n解析：声音的三个特征（三要素）是音调、响度和音色。音调由频率决定，响度由振幅决定，音色由发声体的材料和结构决定。频率和振幅是决定因素，不是声音的特征本身。"},{"id":"g2_physics_007_ex02","knowledge_id":"g2_physics_007","question":"填空题：音调是指声音的______，由发声体振动的______决定；响度是指声音的______，由发声体振动的______决定；音色又叫音品，由发声体的______和______决定。","answer":"答案：高低；频率；大小（强弱）；振幅；材料；结构\n解析：音调指声音的高低，频率越高音调越高；响度指声音的大小或强弱，振幅越大响度越大，还与距离发声体的远近有关；音色是声音的品质特色，由发声体的材料和结构决定，不同发声体音色不同。"},{"id":"g2_physics_007_ex03","knowledge_id":"g2_physics_007","question":"选择题：如图所示，用相同的力拨动不同的橡皮筋，观察到橡皮筋越细，振动越快。这个实验是探究声音的（  ）\nA. 响度与振幅的关系\nB. 音调与频率的关系\nC. 音色与材料的关系\nD. 响度与频率的关系","answer":"答案：B\n解析：用相同的力拨动橡皮筋，振幅基本相同，而橡皮筋越细振动越快（频率越高），音调越高。这个实验控制了振幅相同，改变了频率，研究的是音调与频率的关系。"},{"id":"g2_physics_007_ex04","knowledge_id":"g2_physics_007","question":"判断题：男低音歌唱家放声歌唱时，他发出的声音音调低，响度也小。（  ）","answer":"答案：错误\n解析：男低音歌唱家的声音音调低，是因为声带振动频率低。但\"放声歌唱\"说明响度大，因为振幅大。音调和响度是两个不同的声音特征，音调低的声音响度不一定小。"},{"id":"g2_physics_007_ex05","knowledge_id":"g2_physics_007","question":"判断题：我们能分辨出钢琴和小提琴演奏的同一首曲子，主要是因为它们的响度不同。（  ）","answer":"答案：错误\n解析：我们能分辨不同乐器的声音，主要是因为它们的音色不同。音色是声音的品质特色，由发声体的材料和结构决定。不同乐器演奏同一音符，音调和响度可以相同，但音色不同。"},{"id":"g2_physics_007_ex06","knowledge_id":"g2_physics_007","question":"解答题：在探究影响音调高低的因素实验中，将一把钢尺紧按在桌面上，一端伸出桌面。拨动钢尺，听它振动发出的声音，同时注意钢尺振动的快慢。改变钢尺伸出桌面的长度，再次拨动。\n（1）这个实验中，每次拨动钢尺时用力大小应怎样？为什么？\n（2）当钢尺伸出桌面越长时，振动越______（选填\"快\"或\"慢\"），音调越______（选填\"高\"或\"低\"）。\n（3）这个实验得出的结论是什么？","answer":"答案：（1）每次拨动钢尺的用力大小应大致相同。因为要探究音调与频率的关系，需要控制振幅（响度）不变，这是控制变量法的要求。\n（2）慢；低\n（3）结论：音调的高低与发声体振动的频率有关。频率越高，音调越高；频率越低，音调越低。\n解析：实验中改变钢尺伸出长度，实质是改变了振动部分的长度，从而改变振动频率。伸出越长，振动越慢，频率越低，音调越低。用相同的力拨动是为了控制振幅相同，确保只有频率一个变量。"},{"id":"g2_physics_007_ex07","knowledge_id":"g2_physics_007","question":"解答题：医生用听诊器为病人诊病，听诊器运用了声音的什么原理？来自患者的声音通过橡皮管传送到医生的耳朵，这样做有什么好处？","answer":"答案：听诊器运用了声音可以传递信息的原理。\n好处：橡皮管减少了声音的分散，使声音的响度更大，让医生听得更清楚。\n解析：听诊器的工作原理是：听诊器前端的膜片接收体内声音，通过管内空气柱传播，减少了声音向四周的分散，提高了到达医生耳朵的声音响度。注意：听诊器不能改变音调，也不能改变发声体的振幅，它只是减小了声音的分散程度。"},{"id":"g2_physics_007_ex08","knowledge_id":"g2_physics_007","question":"选择题：下列关于声音的说法中，正确的是（  ）\nA. \"引吭高歌\"中的\"高\"指的是音调高\nB. \"细声细语\"中的\"细\"指的是音调低\nC. \"震耳欲聋\"描述的是声音的响度大\nD. \"闻其声知其人\"是根据音调来判断的","answer":"答案：C\n解析：A选项错误，\"引吭高歌\"中的\"高\"指的是响度大，是大声唱歌的意思；B选项错误，\"细声细语\"中的\"细\"指的是响度小，即小声说话；C选项正确，\"震耳欲聋\"形容声音很大，指响度大；D选项错误，\"闻其声知其人\"是根据音色来判断的，不同的人音色不同。"},{"id":"g2_physics_007_ex09","knowledge_id":"g2_physics_007","question":"填空题：人耳能听到的声音频率范围是______Hz到______Hz。频率高于______Hz的声音叫超声波，频率低于______Hz的声音叫次声波。","answer":"答案：20；20000；20000；20\n解析：人耳的听觉范围是20Hz~20000Hz。高于20000Hz的是超声波，低于20Hz的是次声波，这两种声波人耳都听不到。超声波和次声波虽然人耳听不到，但在生活中有很多应用。"},{"id":"g2_physics_007_ex10","knowledge_id":"g2_physics_007","question":"选择题：在公共场所\"轻声\"说话是文明的表现，在课堂上\"大声\"回答问题才能让老师和同学们都听清楚。这里的\"轻声\"和\"大声\"是指声音的（  ）\nA. 音调\nB. 响度\nC. 音色\nD. 频率","answer":"答案：B\n解析：\"轻声\"和\"大声\"描述的是声音的大小，也就是响度。响度与振幅有关，振幅越大响度越大。音调指声音的高低，音色指声音的品质特色，都不符合题意。"},{"id":"g2_physics_008_ex01","knowledge_id":"g2_physics_008","question":"选择题：下列关于超声波和次声波的说法中，正确的是（  ）\nA. 超声波的频率低于20Hz\nB. 次声波的频率高于20000Hz\nC. 人耳听不到超声波和次声波\nD. 超声波可以在真空中传播","answer":"答案：C\n解析：人耳的听觉范围是20Hz~20000Hz。频率高于20000Hz的是超声波，频率低于20Hz的是次声波，这两种声波人耳都听不到。A选项错误，超声波频率高于20000Hz；B选项错误，次声波频率低于20Hz；D选项错误，任何声波都不能在真空中传播。"},{"id":"g2_physics_008_ex02","knowledge_id":"g2_physics_008","question":"填空题：频率高于______Hz的声音叫超声波，它具有______性好、______强、易于获得较集中的声能等特点；频率低于______Hz的声音叫次声波，它的特点是传播距离______，能绕过障碍物。","answer":"答案：20000；方向；穿透能力；20；远\n解析：超声波频率高于20000Hz，具有方向性好、穿透能力强、声能集中等特点，常用于测距、测速、清洗、焊接、碎石等。次声波频率低于20Hz，传播距离远，能绕过障碍物，可用于监测自然灾害等。"},{"id":"g2_physics_008_ex03","knowledge_id":"g2_physics_008","question":"选择题：下列事例中，利用了超声波的是（  ）\n① 用声呐探测海深  ② 用B超观察胎儿  ③ 用加湿器把水打碎成小雾滴  ④ 监测火山爆发\nA. ①②③\nB. ①②④\nC. ①③④\nD. ②③④","answer":"答案：A\n解析：①声呐利用超声波测距；②B超利用超声波成像；③超声波加湿器利用超声波的能量将水打碎成小雾滴；④监测火山爆发是利用次声波，因为火山爆发会产生次声波。所以①②③利用了超声波。"},{"id":"g2_physics_008_ex04","knowledge_id":"g2_physics_008","question":"判断题：蝙蝠是利用次声波来探测目标和导航的。（  ）","answer":"答案：错误\n解析：蝙蝠是利用超声波来探测目标和导航的，不是次声波。蝙蝠飞行时发出超声波，这些声波碰到墙壁或昆虫时会反射回来，根据回声到来的方位和时间，蝙蝠可以确定目标的位置和距离，这种方法叫回声定位。"},{"id":"g2_physics_008_ex05","knowledge_id":"g2_physics_008","question":"判断题：地震、海啸、火山爆发等自然灾害发生时，都会产生次声波。（  ）","answer":"答案：正确\n解析：地震、海啸、火山爆发、台风等自然灾害发生时，都会伴随产生次声波。次声波传播距离远，能绕过障碍物，因此可以通过监测次声波来预报这些自然灾害。"},{"id":"g2_physics_008_ex06","knowledge_id":"g2_physics_008","question":"解答题：一艘渔船在海上作业时，用声呐向海底垂直发射超声波，经过4秒后收到回波信号。求此处海水的深度是多少米？（已知声音在海水中的传播速度约为1500 m/s）","answer":"答案：超声波从海面传到海底再反射回来，总时间为4秒，所以单程时间为：\nt = 4 s / 2 = 2 s\n海水深度：s = v × t = 1500 m/s × 2 s = 3000 m\n答：此处海水深度为3000米。\n解析：声呐测距利用的是超声波的反射原理。因为超声波从发射到接收经过了一个来回，所以计算距离时要用总时间的一半。这是回声测距的典型应用。"},{"id":"g2_physics_008_ex07","knowledge_id":"g2_physics_008","question":"解答题：为什么在医院里医生常用\"B超\"来检查病人的身体状况？超声波还有哪些应用？请举出三个例子。","answer":"答案：\"B超\"即B型超声波诊断仪，它利用超声波能够成像的特点。超声波穿透能力强，能穿过人体组织，遇到不同组织的分界面时会发生反射，仪器接收反射波并处理后形成图像，医生据此诊断病情。\n超声波的其他应用举例：\n1. 超声波清洗：利用超声波的振动清洗精密仪器、眼镜等；\n2. 超声波碎石：利用超声波的能量击碎人体内的结石；\n3. 超声波测距：用声呐测量海水深度、探测鱼群等。\n解析：超声波具有方向性好、穿透能力强、易于获得集中声能等特点，因此在生活和生产中有广泛应用。这些应用主要分为两类：利用声波传递信息（如B超、声呐）和利用声波传递能量（如清洗、碎石）。"},{"id":"g2_physics_008_ex08","knowledge_id":"g2_physics_008","question":"选择题：下列关于次声波的说法中，错误的是（  ）\nA. 次声波的频率低于20Hz\nB. 次声波传播时能量损失小，能传得很远\nC. 人耳听不到次声波，所以次声波对人体没有危害\nD. 通过监测次声波可以预报地震、海啸等自然灾害","answer":"答案：C\n解析：A选项正确，次声波频率低于20Hz；B选项正确，次声波频率低，传播时能量损失小，能传得很远；C选项错误，次声波虽然人耳听不到，但对人体是有危害的，强次声波会使人产生恶心、眩晕等症状，严重的还会造成内脏破裂；D选项正确，地震、海啸等自然灾害发生时会产生次声波，因此可以通过监测次声波来预报。"},{"id":"g2_physics_008_ex09","knowledge_id":"g2_physics_008","question":"填空题：蝙蝠在飞行时会发出______波，这些声波碰到昆虫或障碍物会反射回来，根据回声到来的方位和时间确定目标的位置，这种方法叫做______。科学家利用这个原理发明了______，用来探测海底深度、鱼群位置等。","answer":"答案：超声；回声定位；声呐\n解析：蝙蝠利用超声波回声定位。声呐是根据回声定位原理发明的，全称为声音导航与测距。声呐在海洋探测中应用广泛，可以测量海水深度、绘制海底地形图、探测鱼群和潜艇等。"},{"id":"g2_physics_008_ex10","knowledge_id":"g2_physics_008","question":"选择题：下列现象中，不是利用超声波的是（  ）\nA. 用听诊器检查心肺工作情况\nB. 用超声加湿器把水打碎成雾状\nC. 用超声探伤仪检查金属内部缺陷\nD. 用超声洗牙除去牙齿上的结石","answer":"答案：A\n解析：A选项听诊器的原理是减少声音的分散，增大响度，让医生听得更清楚，利用的是可听声，不是超声波；B选项超声波加湿器利用超声波的能量将水打碎；C选项超声探伤利用超声波的穿透能力；D选项超声洗牙利用超声波的振动去除结石。"},{"id":"g2_physics_009_ex01","knowledge_id":"g2_physics_009","question":"选择题：从环境保护的角度看，下列关于噪声的说法中正确的是（  ）\nA. 噪声一定是响度很大的声音\nB. 噪声一定是振动没有规律的声音\nC. 凡是妨碍人们正常休息、学习和工作的声音都属于噪声\nD. 音乐声一定不是噪声","answer":"答案：C\n解析：从物理学角度看，噪声是发声体做无规则振动时发出的声音；从环境保护角度看，凡是妨碍人们正常休息、学习和工作的声音，以及对人们要听的声音产生干扰的声音，都属于噪声。A选项错误，噪声不一定响度大；B选项是物理学角度的定义，不是环境保护角度；D选项错误，音乐声如果干扰了别人休息学习，也是噪声。"},{"id":"g2_physics_009_ex02","knowledge_id":"g2_physics_009","question":"填空题：声音的强弱等级用______来划分，符号是______。为了保护听力，声音不能超过______dB；为了保证工作和学习，声音不能超过______dB；为了保证休息和睡眠，声音不能超过______dB。","answer":"答案：分贝；dB；90；70；50\n解析：人们以分贝（dB）为单位来表示声音强弱的等级。0 dB是人刚能听到的最微弱的声音。30~40 dB是较为理想的安静环境。为了保护听力，声音不能超过90 dB；为了保证工作和学习，声音不能超过70 dB；为了保证休息和睡眠，声音不能超过50 dB。"},{"id":"g2_physics_009_ex03","knowledge_id":"g2_physics_009","question":"选择题：如图所示的措施中，属于在声源处减弱噪声的是（  ）\nA. 摩托车的消声器\nB. 公路两旁的隔音板\nC. 工人戴防噪声耳罩\nD. 临街房屋安装双层玻璃","answer":"答案：A\n解析：控制噪声有三个途径：在声源处减弱、在传播过程中减弱、在人耳处减弱。A选项摩托车消声器是在声源处减弱噪声；B选项公路隔音板和D选项双层玻璃都是在传播过程中减弱；C选项防噪声耳罩是在人耳处减弱。"},{"id":"g2_physics_009_ex04","knowledge_id":"g2_physics_009","question":"判断题：从物理学角度看，凡是发声体做无规则振动发出的声音都是噪声。（  ）","answer":"答案：正确\n解析：从物理学角度，噪声是发声体做无规则振动时发出的声音，其波形是杂乱无章的。这是噪声的物理学定义。从环保角度看，噪声的定义更广泛，凡是干扰人们正常休息、学习和工作的声音都属于噪声。"},{"id":"g2_physics_009_ex05","knowledge_id":"g2_physics_009","question":"判断题：城市道路旁植树造林，这是在声源处减弱噪声。（  ）","answer":"答案：错误\n解析：城市道路旁植树造林，树木可以吸收和阻挡声音，是在传播过程中减弱噪声，而不是在声源处。在声源处减弱噪声的措施有：给汽车安装消声器、禁止鸣笛等。"},{"id":"g2_physics_009_ex06","knowledge_id":"g2_physics_009","question":"解答题：小明家住在马路旁边，晚上经常被汽车鸣笛声吵得睡不着觉。请你从小明的角度，提出三种减弱噪声的具体方法，并分别说明是通过哪种途径减弱噪声的。","answer":"答案：方法一：关闭窗户，拉上厚窗帘。这是在传播过程中减弱噪声，通过阻挡声音的传播来减弱噪声。\n方法二：戴上耳塞或耳罩睡觉。这是在人耳处减弱噪声，通过阻止声音进入人耳来减弱噪声。\n方法三：向有关部门建议在马路边安装隔音板或种植树木。这是在传播过程中减弱噪声，通过隔音板或树木来阻挡和吸收声音。\n解析：减弱噪声的三条途径：在声源处减弱（如禁止鸣笛、安装消声器）、在传播过程中减弱（如隔音墙、植树造林、关门窗）、在人耳处减弱（如戴耳塞、耳罩）。根据实际情况选择合适的方法。"},{"id":"g2_physics_009_ex07","knowledge_id":"g2_physics_009","question":"解答题：噪声有哪些危害？请列举出至少三种。在日常生活中，我们应该怎样保护听力？","answer":"答案：噪声的危害：\n1. 损害听力：长期处于噪声环境中会导致听力下降，甚至耳聋；\n2. 影响工作和学习：噪声会分散注意力，降低工作效率；\n3. 影响休息和睡眠：噪声会使人难以入睡，影响休息质量；\n4. 损害身心健康：长期受噪声干扰会引起神经衰弱、高血压等疾病。\n\n保护听力的方法：\n1. 不要用尖锐的物体掏耳朵；\n2. 遇到巨大声响时要迅速张口或闭嘴堵耳；\n3. 不要长时间戴耳机听音乐，音量不要太大；\n4. 避免长期处于噪声环境中，必要时戴护耳器。\n解析：噪声被称为\"隐形杀手\"，对人体有多方面的危害。我们既要知道噪声的危害，也要在日常生活中注意保护听力，避免噪声伤害。"},{"id":"g2_physics_009_ex08","knowledge_id":"g2_physics_009","question":"选择题：为了减小校园外汽车鸣笛声对教学的干扰，下列措施中可行的是（  ）\nA. 将教室的窗户打开\nB. 每个学生都戴一个防噪声耳罩\nC. 在校园周围植树造林\nD. 教室内安装噪声监测装置","answer":"答案：C\n解析：A选项打开窗户会让更多噪声进来，不可行；B选项学生戴耳罩虽然能减弱噪声，但也听不到老师讲课了，不可行；C选项植树造林可以在传播过程中减弱噪声，可行；D选项噪声监测装置只能监测噪声的等级，不能减弱噪声，不可行。"},{"id":"g2_physics_009_ex09","knowledge_id":"g2_physics_009","question":"填空题：控制噪声可以从三个方面入手：防止噪声______（在______处减弱）、阻断噪声______（在______中减弱）、防止噪声进入______（在______处减弱）。","answer":"答案：产生；声源；传播；传播过程；耳朵；人耳\n解析：控制噪声的三条途径：\n1. 在声源处减弱：防止噪声产生，如给机器加消声器、禁止鸣笛；\n2. 在传播过程中减弱：阻断噪声传播，如安装隔音板、植树造林；\n3. 在人耳处减弱：防止噪声进入耳朵，如戴耳塞、耳罩。"},{"id":"g2_physics_009_ex10","knowledge_id":"g2_physics_009","question":"选择题：下列说法中正确的是（  ）\nA. 0 dB意味着物体不振动，没有声音\nB. 优美的音乐声不可能成为噪声\nC. 噪声监测仪可以直接减弱噪声\nD. 在飞机旁工作的人员要戴有耳罩的头盔，这是在人耳处减弱噪声","answer":"答案：D\n解析：A选项错误，0 dB是人刚能听到的最微弱的声音，不是没有声音，物体仍在振动；B选项错误，优美的音乐如果干扰了别人的休息、学习，也会成为噪声；C选项错误，噪声监测仪只能监测噪声的分贝值，不能减弱噪声；D选项正确，戴耳罩是在人耳处减弱噪声。"},{"id":"g2_physics_010_ex01","knowledge_id":"g2_physics_010","question":"选择题：下列关于温度的说法中，正确的是（  ）\nA. 温度是表示物体冷热程度的物理量\nB. 0°C的冰比0°C的水温度低\nC. 人的正常体温是35°C\nD. 摄氏温度的单位是\"度\"","answer":"答案：A\n解析：A选项正确，温度是表示物体冷热程度的物理量；B选项错误，0°C的冰和0°C的水温度相同，都是0°C；C选项错误，人的正常体温约为37°C；D选项错误，摄氏温度的单位是\"摄氏度\"，符号是\"°C\"，不能简称为\"度\"。"},{"id":"g2_physics_010_ex02","knowledge_id":"g2_physics_010","question":"填空题：常用的液体温度计是根据液体______的性质制成的。摄氏温度规定：在标准大气压下，______的温度为0°C，______的温度为100°C，它们之间分成______等份，每一等份是______°C。","answer":"答案：热胀冷缩；冰水混合物；沸水；100；1\n解析：常用温度计是根据液体热胀冷缩的原理制成的。摄氏温度规定：标准大气压下，冰水混合物的温度为0°C，沸水的温度为100°C，0°C和100°C之间分成100个等份，每个等份代表1°C。"},{"id":"g2_physics_010_ex03","knowledge_id":"g2_physics_010","question":"选择题：用温度计测量烧杯中水的温度，下图中操作正确的是（  ）\nA. 温度计的玻璃泡碰到了容器底\nB. 温度计的玻璃泡碰到了容器壁\nC. 温度计的玻璃泡全部浸入水中，没有碰到容器底和壁\nD. 温度计的玻璃泡没有全部浸入水中","answer":"答案：C\n解析：使用温度计测量液体温度时，正确的方法是：温度计的玻璃泡要全部浸入被测液体中，不要碰到容器底或容器壁。A选项碰到容器底，B选项碰到容器壁，D选项玻璃泡没有全部浸入，都是错误的。只有C选项操作正确。"},{"id":"g2_physics_010_ex04","knowledge_id":"g2_physics_010","question":"判断题：体温计可以离开人体读数，是因为体温计的玻璃泡上方有一段很细的缩口。（  ）","answer":"答案：正确\n解析：体温计的玻璃泡上方有一段很细的缩口，当体温计离开人体后，水银变冷收缩，水银柱在缩口处断开，使上面的水银柱退不回来，所以体温计可以离开人体读数。这是体温计与普通温度计的重要区别。"},{"id":"g2_physics_010_ex05","knowledge_id":"g2_physics_010","question":"判断题：用体温计测得甲同学的体温是38.5°C，没有甩就直接去测体温为37°C的乙同学，体温计的示数仍然是38.5°C。（  ）","answer":"答案：正确\n解析：体温计的缩口结构使水银柱只能上升不能自动下降。用示数为38.5°C的体温计不甩就去测37°C的体温，水银柱不会下降，仍然显示38.5°C。所以使用体温计前一定要甩几下，使水银柱回到玻璃泡中。"},{"id":"g2_physics_010_ex06","knowledge_id":"g2_physics_010","question":"解答题：在\"用温度计测量水的温度\"实验中，有以下实验步骤，请按正确的操作顺序排列：\nA. 选取合适的温度计，观察它的量程和分度值\nB. 估计被测水的温度\nC. 让温度计与被测水充分接触一段时间\nD. 从水中取出温度计\nE. 待温度计的示数稳定后读数，视线与液柱上表面相平\n\n并回答：读数时为什么不能将温度计从水中拿出来读数？","answer":"答案：正确的操作顺序是：B → A → C → E → D\n\n读数时不能将温度计从水中拿出来读数的原因：普通温度计没有缩口结构，离开被测液体后，温度计的示数会受周围环境温度的影响而发生变化，导致读数不准确。所以读数时温度计的玻璃泡要继续留在被测液体中。\n解析：使用温度计的正确步骤：先估计被测温度，选择合适量程的温度计（量程太小可能胀破，太大则不精确）；然后将温度计玻璃泡全部浸入被测液体；待示数稳定后再读数；读数时玻璃泡要继续留在液体中，视线与液柱上表面相平；读完数后再取出温度计。"},{"id":"g2_physics_010_ex07","knowledge_id":"g2_physics_010","question":"解答题：一支没有刻度的温度计，插入冰水混合物中时，水银柱长度为4 cm；插入标准大气压下的沸水中时，水银柱长度为24 cm。当把它插入某种液体中时，水银柱长度为14 cm，求该液体的温度是多少°C？","answer":"答案：冰水混合物温度为0°C，水银柱长4 cm；沸水温度为100°C，水银柱长24 cm。\n水银柱长度差：24 cm - 4 cm = 20 cm，对应温度差100°C，\n所以每1 cm水银柱对应的温度：100°C ÷ 20 cm = 5°C/cm\n当水银柱长14 cm时，相对于0°C时上升了：14 cm - 4 cm = 10 cm\n液体温度：10 cm × 5°C/cm = 50°C\n答：该液体的温度是50°C。\n解析：这是温度计刻度标定问题，关键是找到每厘米水银柱对应的温度值。先确定0°C和100°C对应的水银柱长度，计算出每厘米对应的温度，再根据实际水银柱长度计算温度。注意要用实际长度减去0°C时的长度。"},{"id":"g2_physics_010_ex08","knowledge_id":"g2_physics_010","question":"选择题：关于体温计和实验室用温度计的区别，下列说法中错误的是（  ）\nA. 体温计的准确度比普通温度计高\nB. 体温计玻璃泡上方有缩口，普通温度计没有\nC. 体温计和普通温度计都可以离开被测物体读数\nD. 体温计量程一般是35°C~42°C，普通温度计量程更大","answer":"答案：C\n解析：A选项正确，体温计的分度值是0.1°C，普通温度计一般是1°C，体温计更准确；B选项正确，体温计有缩口，普通温度计没有；C选项错误，体温计可以离开人体读数，但普通温度计不能离开被测液体读数；D选项正确，体温计量程是35°C~42°C，普通温度计量程更大。"},{"id":"g2_physics_010_ex09","knowledge_id":"g2_physics_010","question":"填空题：温度计的正确使用方法：使用前，要观察它的______和______；测量时，温度计的玻璃泡要______浸入被测液体中，不要碰到______和______；读数时，玻璃泡要______在被测液体中，视线与温度计中液柱的______相平。","answer":"答案：量程；分度值；全部；容器底；容器壁；停留；上表面\n解析：温度计使用注意事项：\n1. 使用前：观察量程（能否测待测温度）和分度值（方便准确读数）；\n2. 测量时：玻璃泡全部浸入被测液体，不碰容器底和壁；\n3. 读数时：玻璃泡留在液体中，待示数稳定后再读，视线与液柱上表面相平。"},{"id":"g2_physics_010_ex10","knowledge_id":"g2_physics_010","question":"选择题：某同学用同一支温度计分别测量甲、乙两杯水的温度，操作和读数都正确。测得甲杯水的温度是25°C，乙杯水的温度如图所示（分度值1°C，液柱在20°C以上第8格）。下列说法正确的是（  ）\nA. 甲杯水的温度比乙杯水高\nB. 乙杯水的温度是28°C\nC. 乙杯水的温度是12°C\nD. 甲杯水的温度比乙杯水低3°C","answer":"答案：B\n解析：温度计的分度值是1°C，液柱在20°C以上第8格，所以乙杯水的温度是20°C + 8°C = 28°C。甲杯水温度是25°C，乙杯水温度是28°C，乙比甲高3°C。所以A、C、D选项错误，B选项正确。"},{"id":"g2_physics_011_ex01","knowledge_id":"g2_physics_011","question":"选择题：下列关于熔化和凝固的说法中，正确的是（  ）\nA. 物质从固态变成液态的过程叫凝固\nB. 物质从液态变成固态的过程叫熔化\nC. 熔化过程要吸热，凝固过程要放热\nD. 所有物质熔化时温度都保持不变","answer":"答案：C\n解析：物质从固态变成液态的过程叫熔化，从液态变成固态的过程叫凝固。熔化过程要吸热，凝固过程要放热。A、B选项说法反了；D选项错误，只有晶体熔化时温度保持不变，非晶体熔化时温度不断升高。"},{"id":"g2_physics_011_ex02","knowledge_id":"g2_physics_011","question":"填空题：固体分为______和______两类。______有固定的熔化温度，叫做______；______没有固定的熔化温度。同一种晶体的熔点和凝固点______。","answer":"答案：晶体；非晶体；晶体；熔点；非晶体；相同\n解析：固体分为晶体和非晶体。晶体有固定的熔点，熔化时温度不变；非晶体没有固定的熔点，熔化时温度不断上升。同一种晶体的熔点和凝固点是相同的。常见的晶体有：冰、海波、各种金属等；常见的非晶体有：蜡、松香、玻璃、沥青等。"},{"id":"g2_physics_011_ex03","knowledge_id":"g2_physics_011","question":"选择题：下列物质中，全部都是晶体的一组是（  ）\nA. 冰、玻璃、铁\nB. 海波、萘、水晶\nC. 蜡、沥青、松香\nD. 铜、铝、玻璃","answer":"答案：B\n解析：常见的晶体有：冰、海波、萘、水晶、各种金属（铁、铜、铝等）、食盐等；常见的非晶体有：蜡、松香、玻璃、沥青等。A选项中玻璃是非晶体；C选项全部是非晶体；D选项中玻璃是非晶体。只有B选项全部是晶体。"},{"id":"g2_physics_011_ex04","knowledge_id":"g2_physics_011","question":"判断题：冰的熔点是0°C，所以温度为0°C的冰一定会熔化。（  ）","answer":"答案：错误\n解析：晶体熔化的条件有两个：一是温度达到熔点，二是继续吸热。0°C的冰虽然温度达到了熔点，但如果不能继续吸热，就不会熔化。例如，放在0°C房间里的0°C的冰，因为温度相同，不能吸热，所以不会熔化。"},{"id":"g2_physics_011_ex05","knowledge_id":"g2_physics_011","question":"判断题：用质量相同的0°C的冰和0°C的水来冷却食物，效果是一样的。（  ）","answer":"答案：错误\n解析：用0°C的冰冷却食物效果更好。因为0°C的冰熔化成0°C的水时需要吸收大量的热量（熔化热），而温度保持不变。所以冰在熔化过程中能吸收更多的热量，冷却效果比0°C的水更好。"},{"id":"g2_physics_011_ex06","knowledge_id":"g2_physics_011","question":"解答题：在\"探究海波熔化时温度的变化规律\"实验中：\n（1）把装有海波的试管放在盛水的烧杯中加热，而不是直接用酒精灯加热试管，这样做有什么好处？\n（2）实验中需要记录哪些数据？\n（3）海波熔化过程中温度______（选填\"升高\"\"降低\"或\"不变\"），熔化过程中需要______热（选填\"吸\"或\"放\"）。\n（4）海波是______（选填\"晶体\"或\"非晶体\"）。","answer":"答案：（1）水浴加热的好处是：使海波受热均匀，且温度上升较慢，便于观察和记录温度的变化。\n（2）需要记录的数据有：时间和对应的温度，还需要观察海波的状态变化。\n（3）不变；吸\n（4）晶体\n解析：探究晶体熔化实验中，水浴加热法可以使被加热物质受热均匀，且温度上升慢，便于观察。晶体熔化的特点是：继续吸热，温度不变。熔化时不变的温度就是熔点。海波是晶体，熔点约为48°C。"},{"id":"g2_physics_011_ex07","knowledge_id":"g2_physics_011","question":"解答题：冬天，在北方菜窖里常常放几桶水，可以防止菜被冻坏。这是为什么？请用物理知识解释。","answer":"答案：冬天温度降低时，菜窖里的水会凝固成冰。水凝固的过程中会放出热量，这些热量可以使菜窖里的温度不会降得太低，从而防止菜被冻坏。\n解析：物质从液态变成固态的过程叫凝固，凝固过程要放出热量。水的凝固点是0°C，当温度下降到0°C以下时，水开始凝固，凝固过程中持续放热，使菜窖内温度保持在0°C左右，不会太低，从而保护蔬菜不被冻坏。"},{"id":"g2_physics_011_ex08","knowledge_id":"g2_physics_011","question":"选择题：把一块0°C的冰投入0°C的水里（周围气温也是0°C），过了一段时间，下列说法正确的是（  ）\nA. 冰的质量增加，水的质量减少\nB. 冰的质量减少，水的质量增加\nC. 冰和水的质量都不变\nD. 以上三种情况都有可能","answer":"答案：C\n解析：冰熔化需要吸热，水凝固需要放热。0°C的冰、0°C的水和0°C的环境温度都相同，没有温度差，所以冰不能吸热熔化，水也不能放热凝固。因此冰和水的质量都保持不变。"},{"id":"g2_physics_011_ex09","knowledge_id":"g2_physics_011","question":"填空题：晶体熔化的条件是：温度达到______，并且继续______热；晶体凝固的条件是：温度达到______，并且继续______热。晶体熔化时的温度叫______，液态晶体凝固时的温度叫______，同一种晶体的熔点和凝固点是______的。","answer":"答案：熔点；吸；凝固点；放；熔点；凝固点；相同\n解析：晶体熔化和凝固都有两个条件，缺一不可。熔化：温度达到熔点 + 继续吸热；凝固：温度达到凝固点 + 继续放热。同一种晶体的熔点和凝固点相同，例如冰的熔点是0°C，水的凝固点也是0°C。"},{"id":"g2_physics_011_ex10","knowledge_id":"g2_physics_011","question":"选择题：下列现象中，利用熔化吸热的是（  ）\nA. 北方冬天菜窖里放几桶水\nB. 给高烧病人用冰袋降温\nC. 夏天从冰箱取出的饮料瓶外\"出汗\"\nD. 冬天早晨看到草地上有霜","answer":"答案：B\n解析：A选项菜窖放水是利用水凝固放热，防止菜冻坏；B选项用冰袋降温是利用冰熔化吸热，带走热量，给病人降温；C选项饮料瓶\"出汗\"是液化现象，液化放热；D选项霜的形成是凝华现象，凝华放热。所以正确答案是B。"},{"id":"g2_physics_012_ex01","knowledge_id":"g2_physics_012","question":"选择题：下列关于汽化和液化的说法中，正确的是（  ）\nA. 物质从液态变成气态的过程叫液化\nB. 物质从气态变成液态的过程叫汽化\nC. 汽化过程要吸热，液化过程要放热\nD. 汽化只有蒸发一种方式","answer":"答案：C\n解析：物质从液态变成气态的过程叫汽化，从气态变成液态的过程叫液化。汽化过程要吸热，液化过程要放热。A、B选项说反了；D选项错误，汽化有两种方式：蒸发和沸腾。"},{"id":"g2_physics_012_ex02","knowledge_id":"g2_physics_012","question":"填空题：汽化的两种方式是______和______。蒸发是在液体______发生的缓慢的汽化现象，可以在______温度下发生；沸腾是在液体______和______同时发生的剧烈的汽化现象，需要温度达到______，并且继续______热。","answer":"答案：蒸发；沸腾；表面；任何；表面；内部；沸点；吸\n解析：蒸发和沸腾是汽化的两种方式。蒸发只在液体表面发生，在任何温度下都能进行，比较缓慢；沸腾在液体表面和内部同时发生，必须达到沸点且继续吸热才能进行，比较剧烈。液体沸腾时的温度叫沸点，不同液体沸点不同。"},{"id":"g2_physics_012_ex03","knowledge_id":"g2_physics_012","question":"选择题：在标准大气压下，水的沸点是100°C。下列说法正确的是（  ）\nA. 水温达到100°C就一定沸腾\nB. 水沸腾时温度一定是100°C\nC. 水沸腾时继续吸热，温度保持不变\nD. 水沸腾时温度不断升高","answer":"答案：C\n解析：A选项错误，水沸腾的条件是：温度达到沸点，并且继续吸热，两个条件缺一不可；B选项错误，只有在标准大气压下，水的沸点才是100°C，气压降低，沸点也降低；C选项正确，水沸腾时继续吸热，但温度保持不变；D选项错误，沸腾时温度保持不变。"},{"id":"g2_physics_012_ex04","knowledge_id":"g2_physics_012","question":"判断题：夏天吹电风扇感觉凉快，是因为电风扇吹的风温度比室温低。（  ）","answer":"答案：错误\n解析：吹电风扇感觉凉快，不是因为风的温度低，而是因为电风扇加快了人体表面汗液的蒸发，蒸发过程要吸热，从而带走人体的热量，使人感到凉快。这是蒸发吸热的应用。"},{"id":"g2_physics_012_ex05","knowledge_id":"g2_physics_012","question":"判断题：被100°C的水蒸气烫伤比被100°C的开水烫伤更严重，是因为水蒸气温度更高。（  ）","answer":"答案：错误\n解析：100°C的水蒸气和100°C的开水温度是一样的。水蒸气烫伤更严重的原因是：水蒸气遇到温度较低的皮肤时会液化，液化过程要放出大量的热，所以比100°C的开水放出的热量更多，烫伤更严重。"},{"id":"g2_physics_012_ex06","knowledge_id":"g2_physics_012","question":"解答题：在\"观察水的沸腾\"实验中：\n（1）实验中需要的测量工具是______和______。\n（2）水沸腾前，气泡上升时体积逐渐______；水沸腾时，气泡上升时体积逐渐______。（均选填\"变大\"或\"变小\"）\n（3）水沸腾时的特点是：继续______热，温度______。\n（4）如果想要缩短加热时间，可以采取哪些措施？（写出两条即可）","answer":"答案：（1）温度计；秒表（或钟表）\n（2）变小；变大\n（3）吸；保持不变\n（4）缩短加热时间的措施：① 减少水的质量；② 提高水的初温（用热水做实验）；③ 给烧杯加盖，减少热量损失；④ 用酒精灯外焰加热等。（任选两条即可）\n解析：水沸腾实验中，需要用温度计测温度，用秒表测时间。沸腾前气泡上升变小（上层水温低，气泡内水蒸气遇冷液化）；沸腾时气泡上升变大（上下温度一致，水压减小，气泡膨胀）。沸腾的特点是：继续吸热，温度不变。"},{"id":"g2_physics_012_ex07","knowledge_id":"g2_physics_012","question":"解答题：影响蒸发快慢的因素有哪些？请举例说明（每个因素举一个生活中的例子）。","answer":"答案：影响蒸发快慢的因素有三个：\n1. 液体的温度：温度越高，蒸发越快。例如：夏天晾衣服比冬天干得快。\n2. 液体的表面积：表面积越大，蒸发越快。例如：把粮食摊开晾晒比堆在一起干得快。\n3. 液体表面上方空气的流动速度：空气流动越快，蒸发越快。例如：洗完头发后用吹风机吹，头发干得更快。\n解析：蒸发只发生在液体表面，表面积越大、温度越高、空气流动越快，蒸发就越快。这三个因素在生活中都有广泛应用，例如晾衣服时展开、放在阳光下、通风的地方，都是为了加快蒸发。"},{"id":"g2_physics_012_ex08","knowledge_id":"g2_physics_012","question":"选择题：下列现象中，属于液化现象的是（  ）\n① 春天，冰雪消融  ② 夏天，从冰箱拿出的饮料瓶外壁\"出汗\"\n③ 秋天，早晨的大雾  ④ 冬天，窗玻璃上出现冰花\nA. ①②\nB. ②③\nC. ③④\nD. ①④","answer":"答案：B\n解析：① 冰雪消融是熔化现象（固态→液态）；② 饮料瓶外壁\"出汗\"是空气中的水蒸气遇冷液化成小水珠，是液化现象；③ 雾是空气中的水蒸气遇冷液化成小水珠附着在空气中的尘埃上，是液化现象；④ 冰花是水蒸气直接变成固态，是凝华现象。所以②③属于液化现象。"},{"id":"g2_physics_012_ex09","knowledge_id":"g2_physics_012","question":"填空题：使气体液化的方法有两种：______和______。家用液化气就是在常温下用______的方法使石油气液化后储存在钢瓶里的。气体液化时要______热。","answer":"答案：降低温度；压缩体积；压缩体积；放\n解析：使气体液化的方法：降低温度和压缩体积。所有气体在温度降到足够低时都可以液化；有的气体单靠压缩体积不行，必须先降温再压缩。液化石油气是在常温下通过压缩体积的方法使石油气液化的。液化过程要放热。"},{"id":"g2_physics_012_ex10","knowledge_id":"g2_physics_012","question":"选择题：小明在\"观察水的沸腾\"实验中，根据实验数据绘制了温度随时间变化的图象。从图象可知，下列说法错误的是（  ）\nA. 水的沸点是98°C\nB. 实验时气压低于标准大气压\nC. 水沸腾后继续加热，温度会继续升高\nD. 水沸腾过程中要继续吸热","answer":"答案：C\n解析：A选项正确，从图象中水平段对应的温度就是沸点，为98°C；B选项正确，标准大气压下水的沸点是100°C，气压越低沸点越低，所以实验时气压低于标准大气压；C选项错误，水沸腾的特点是继续吸热，温度保持不变，不会继续升高；D选项正确，沸腾需要继续吸热。"},{"id":"g2_physics_013_ex01","knowledge_id":"g2_physics_013","question":"选择题：下列关于升华和凝华的说法中，正确的是（  ）\nA. 物质从固态直接变成气态的过程叫凝华\nB. 物质从气态直接变成固态的过程叫升华\nC. 升华过程要吸热，凝华过程要放热\nD. 冬天冰冻的衣服变干是凝华现象","answer":"答案：C\n解析：物质从固态直接变成气态的过程叫升华，从气态直接变成固态的过程叫凝华。升华过程要吸热，凝华过程要放热。A、B选项说反了；D选项错误，冰冻的衣服变干是冰直接变成水蒸气，是升华现象。"},{"id":"g2_physics_013_ex02","knowledge_id":"g2_physics_013","question":"填空题：冬天冰冻的衣服也会慢慢变干，这是______现象，这个过程要______热；冬天早晨草地上的霜是______现象，这个过程要______热；用久了的灯泡钨丝变细是______现象，灯泡内壁变黑是______现象。","answer":"答案：升华；吸；凝华；放；升华；凝华\n解析：冰冻的衣服变干是冰直接变成水蒸气，是升华现象，升华吸热；霜是空气中的水蒸气遇冷直接变成小冰晶，是凝华现象，凝华放热；灯泡钨丝变细是钨在高温下升华变成钨蒸气，内壁变黑是钨蒸气遇冷凝华成固态钨附着在内壁上。"},{"id":"g2_physics_013_ex03","knowledge_id":"g2_physics_013","question":"选择题：下列现象中，属于升华现象的是（  ）\nA. 春天，冰雪消融\nB. 夏天，冰棍周围冒\"白气\"\nC. 秋天，早晨花草上有露水\nD. 冬天，堆在户外的\"雪人\"没熔化却变小了","answer":"答案：D\n解析：A选项冰雪消融是熔化现象（固态→液态）；B选项冰棍冒\"白气\"是空气中的水蒸气遇冷液化成小水珠，是液化现象；C选项露水是水蒸气液化形成的；D选项雪人没熔化却变小，是雪直接从固态变成气态，是升华现象。"},{"id":"g2_physics_013_ex04","knowledge_id":"g2_physics_013","question":"判断题：霜、雪、雾凇、冰花的形成都是凝华现象。（  ）","answer":"答案：正确\n解析：霜、雪、雾凇、冰花都是空气中的水蒸气遇冷直接变成固态的小冰晶，都是凝华现象。凝华是物质从气态直接变成固态的过程，凝华过程要放热。这些现象都是水蒸气直接变成固态，没有经过液态，所以都是凝华。"},{"id":"g2_physics_013_ex05","knowledge_id":"g2_physics_013","question":"判断题：干冰（固态二氧化碳）人工降雨时，发生的物态变化只有升华。（  ）","answer":"答案：错误\n解析：干冰人工降雨时，干冰在空气中迅速升华，从周围吸收大量的热，使空气温度急剧下降。空气中的水蒸气遇冷液化成小水滴或凝华成小冰晶，冰晶下落过程中熔化成水滴，形成降雨。所以过程中包含升华、液化、凝华、熔化等多种物态变化，不只是升华。"},{"id":"g2_physics_013_ex06","knowledge_id":"g2_physics_013","question":"解答题：在\"观察碘的升华\"实验中，把装有固态碘的玻璃管放入热水中，观察到什么现象？把玻璃管从热水中拿出，过一会儿又观察到什么现象？请解释这些现象，并说明过程中的吸放热情况。","answer":"答案：放入热水中，观察到：固态碘逐渐减少，玻璃管内出现紫色的碘蒸气，这是升华现象，升华过程要吸热。\n从热水中拿出后，过一会儿观察到：紫色碘蒸气逐渐消失，玻璃管内壁出现固态碘颗粒，这是凝华现象，凝华过程要放热。\n解析：碘受热直接从固态变成气态，是升华现象，升华吸热；碘蒸气遇冷直接从气态变成固态，是凝华现象，凝华放热。这个实验说明：物质可以直接在固态和气态之间相互转化，不经过液态。"},{"id":"g2_physics_013_ex07","knowledge_id":"g2_physics_013","question":"解答题：冬天，为什么在很冷的早晨，窗户玻璃的内表面会出现冰花？冰花是怎样形成的？","answer":"答案：冬天室外温度很低，室内温度较高，室内空气中含有大量的水蒸气。这些温度较高的水蒸气遇到温度很低的窗户玻璃（低于0°C）时，会直接从气态变成固态，在玻璃内表面形成小冰晶，这就是冰花。\n冰花的形成是凝华现象，凝华过程要放热。\n解析：冰花出现在窗户玻璃的内表面，因为室内温度高的水蒸气遇到冷的玻璃才会凝华。室外的水蒸气温度也很低，所以不会在玻璃外表面凝华。霜、雪、雾凇的形成也都是凝华现象。"},{"id":"g2_physics_013_ex08","knowledge_id":"g2_physics_013","question":"选择题：下列各组物态变化中，都需要吸热的一组是（  ）\nA. 熔化、液化、升华\nB. 熔化、汽化、升华\nC. 凝固、液化、凝华\nD. 熔化、汽化、凝华","answer":"答案：B\n解析：六种物态变化中，吸热的有：熔化（固→液）、汽化（液→气）、升华（固→气）；放热的有：凝固（液→固）、液化（气→液）、凝华（气→固）。A选项中液化放热；C选项全部放热；D选项中凝华放热。只有B选项全部吸热。"},{"id":"g2_physics_013_ex09","knowledge_id":"g2_physics_013","question":"填空题：六种物态变化中，吸热的有______、______、______；放热的有______、______、______。其中，物质从固态直接变成气态叫______，从气态直接变成固态叫______。","answer":"答案：熔化；汽化；升华；凝固；液化；凝华；升华；凝华\n解析：六种物态变化：\n吸热：熔化（固→液）、汽化（液→气）、升华（固→气）\n放热：凝固（液→固）、液化（气→液）、凝华（气→固）\n升华和凝华是固态和气态之间的直接转化，不经过液态。"},{"id":"g2_physics_013_ex10","knowledge_id":"g2_physics_013","question":"选择题：如图所示，用久了的白炽灯泡，灯丝会变细，灯泡内壁会发黑。这两种现象对应的物态变化分别是（  ）\nA. 先升华后凝华\nB. 先汽化后液化\nC. 先熔化后凝固\nD. 先凝华后升华","answer":"答案：A\n解析：灯泡工作时温度很高，灯丝（钨丝）在高温下直接从固态变成气态的钨蒸气，这是升华现象，所以灯丝变细；钨蒸气遇到温度较低的灯泡内壁时，又直接从气态变成固态的钨，附着在内壁上，这是凝华现象，所以灯泡内壁发黑。整个过程是先升华后凝华。"},{"id":"g2_physics_014_ex01","knowledge_id":"g2_physics_014","question":"选择题：下列关于光的直线传播的说法中，正确的是（  ）\nA. 光总是沿直线传播的\nB. 光只有在真空中才沿直线传播\nC. 光在同种均匀介质中沿直线传播\nD. 光在任何介质中传播速度都是3×10^8 m/s","answer":"答案：C\n解析：光沿直线传播的条件是：在同种均匀介质中。如果介质不均匀或光从一种介质进入另一种介质，传播方向会发生改变。A、B选项错误；D选项错误，光在真空中的传播速度是3×10^8 m/s，在其他介质中速度都比这个小。"},{"id":"g2_physics_014_ex02","knowledge_id":"g2_physics_014","question":"填空题：光在真空中的传播速度是______m/s，约为______km/s。光在空气中的传播速度十分接近真空中的速度，光在水中的传播速度约为真空中的______，在玻璃中的传播速度约为真空中的______。","answer":"答案：3×10^8；3×10^5；3/4；2/3\n解析：光在真空中的传播速度是宇宙中最快的速度，c = 3×10^8 m/s = 3×10^5 km/s。光在空气中的速度接近真空中的速度，在水中约为3c/4，在玻璃中约为2c/3。光速是物理学中一个非常重要的常量。"},{"id":"g2_physics_014_ex03","knowledge_id":"g2_physics_014","question":"选择题：下列现象中，不能用光的直线传播解释的是（  ）\nA. 影子的形成\nB. 小孔成像\nC. 日食和月食\nD. 雨后彩虹","answer":"答案：D\n解析：A选项影子的形成是因为光沿直线传播，遇到不透明物体，在物体后面形成暗区；B选项小孔成像是光沿直线传播形成的倒立实像；C选项日食和月食都是光沿直线传播，地球或月球挡住太阳光形成的；D选项雨后彩虹是光的色散现象，是光的折射形成的，不能用光的直线传播解释。"},{"id":"g2_physics_014_ex04","knowledge_id":"g2_physics_014","question":"判断题：小孔成像时，像的形状与小孔的形状有关，小孔是圆的，像就是圆的。（  ）","answer":"答案：错误\n解析：小孔成像的原理是光的直线传播，成的是物体的倒立实像，像的形状与物体的形状相同，与小孔的形状无关。只要小孔足够小，不管小孔是什么形状，像的形状都和物体一样。"},{"id":"g2_physics_014_ex05","knowledge_id":"g2_physics_014","question":"判断题：发生日食时，太阳、地球、月球在一条直线上，地球在中间。（  ）","answer":"答案：错误\n解析：发生日食时，太阳、月球、地球在一条直线上，月球在中间，月球挡住了太阳光，在地球上形成阴影，处于阴影中的人就看到了日食。地球在中间时会发生月食。"},{"id":"g2_physics_014_ex06","knowledge_id":"g2_physics_014","question":"解答题：在\"小孔成像\"实验中：\n（1）小孔成像的原理是什么？\n（2）小孔成像成的是什么样的像？（正立还是倒立？实像还是虚像？）\n（3）像的大小与什么因素有关？\n（4）如果将小孔遮去一半，像会发生什么变化？","answer":"答案：（1）小孔成像的原理是：光在同种均匀介质中沿直线传播。\n（2）小孔成的是倒立的实像。\n（3）像的大小与物体到小孔的距离和光屏到小孔的距离有关：物体到小孔的距离越近，光屏到小孔的距离越远，像越大；反之则越小。\n（4）如果将小孔遮去一半，像的形状和大小不变，但亮度会变暗。因为通过小孔的光减少了一半，所以像变暗，但像的完整性不受影响。\n解析：小孔成像是光沿直线传播的典型应用。物体上部的光通过小孔射到光屏下部，物体下部的光通过小孔射到光屏上部，所以成倒立的像。像是实际光线会聚形成的，所以是实像。"},{"id":"g2_physics_014_ex07","knowledge_id":"g2_physics_014","question":"解答题：太阳光传到地球大约需要500秒。请计算太阳到地球的距离大约是多少千米？（光在真空中的传播速度取3×10^8 m/s）","answer":"答案：已知：v = 3×10^8 m/s，t = 500 s\n根据公式 s = v × t\n太阳到地球的距离：\ns = 3×10^8 m/s × 500 s = 1.5×10^11 m = 1.5×10^8 km\n答：太阳到地球的距离大约是1.5×10^8千米（即1.5亿千米）。\n解析：这是一个利用光速计算距离的问题。光在真空中的传播速度是3×10^8 m/s，乘以传播时间就是距离。注意单位换算：1 km = 1000 m，所以1.5×10^11 m = 1.5×10^8 km。这个距离也叫1个天文单位（AU）。"},{"id":"g2_physics_014_ex08","knowledge_id":"g2_physics_014","question":"选择题：下列关于影子的说法中，正确的是（  ）\nA. 影子是光沿直线传播形成的，影子的大小与物体大小相等\nB. 影子是光的反射形成的\nC. 当人走近路灯时，人的影子会变短\nD. 当人远离路灯时，人的影子会变短","answer":"答案：C\n解析：A选项错误，影子是光沿直线传播形成的，但影子大小与光源距离、物体大小等都有关系，不一定与物体等大；B选项错误，影子是光沿直线传播形成的，不是反射；C选项正确，人走近路灯时，光线与人的夹角变大，影子变短；D选项错误，人远离路灯时影子变长。"},{"id":"g2_physics_014_ex09","knowledge_id":"g2_physics_014","question":"填空题：光沿直线传播的条件是：光在______介质中沿直线传播。生活中利用光的直线传播的例子有：______、______、______等（写出三个即可）。","answer":"答案：同种均匀；影子的形成；小孔成像；日食和月食\n解析：光在同种均匀介质中沿直线传播。如果介质不均匀，光的传播方向会发生弯曲，例如海市蜃楼就是由于大气不均匀使光发生弯曲形成的。光沿直线传播的应用很多，如：激光准直、排队看齐、射击瞄准、影子、小孔成像、日食月食等。"},{"id":"g2_physics_014_ex10","knowledge_id":"g2_physics_014","question":"选择题：下列说法中，正确的是（  ）\nA. 光年是一个时间单位\nB. 光在真空中的传播速度是340 m/s\nC. 发生月食时，月球运行到地球和太阳之间\nD. 小孔成像说明光在同种均匀介质中沿直线传播","answer":"答案：D\n解析：A选项错误，光年是光在一年内传播的距离，是长度单位，不是时间单位；B选项错误，光在真空中的传播速度是3×10^8 m/s，340 m/s是15°C空气中的声速；C选项错误，月食时地球在中间，挡住太阳光，月球进入地球的阴影；D选项正确，小孔成像是光沿直线传播的典型实例。"},{"id":"g2_physics_015_ex01","knowledge_id":"g2_physics_015","question":"选择题：下列关于光的反射定律的说法中，正确的是（  ）\nA. 入射光线和反射光线分居法线两侧，入射角等于反射角\nB. 入射光线、反射光线和法线不一定在同一平面内\nC. 入射角是入射光线与镜面的夹角\nD. 镜面反射遵守光的反射定律，漫反射不遵守光的反射定律","answer":"答案：A\n解析：光的反射定律内容：反射光线、入射光线和法线在同一平面内，反射光线和入射光线分居法线两侧，反射角等于入射角。A选项正确；B选项错误，三线共面；C选项错误，入射角是入射光线与法线的夹角，不是与镜面的夹角；D选项错误，镜面反射和漫反射都遵守光的反射定律。"},{"id":"g2_physics_015_ex02","knowledge_id":"g2_physics_015","question":"填空题：光的反射定律：反射光线、入射光线和法线在______内；反射光线和入射光线分居在______两侧；反射角______入射角。在光的反射现象中，光路是______的。","answer":"答案：同一平面；法线；等于；可逆\n解析：光的反射定律可简记为\"三线共面、两线分居、两角相等\"。入射角是入射光线与法线的夹角，反射角是反射光线与法线的夹角。在反射现象中光路是可逆的，即如果光逆着反射光线的方向入射，会逆着原来入射光线的方向反射出去。"},{"id":"g2_physics_015_ex03","knowledge_id":"g2_physics_015","question":"选择题：一束光线与镜面成30°角入射到平面镜上，下列说法正确的是（  ）\nA. 入射角是30°\nB. 反射角是60°\nC. 入射光线与反射光线的夹角是60°\nD. 如果入射角增大10°，反射角也增大10°，反射光线与入射光线的夹角增大10°","answer":"答案：B\n解析：入射光线与镜面成30°角，则入射角 = 90° - 30° = 60°。根据反射定律，反射角等于入射角，所以反射角也是60°。A选项错误，入射角是60°；B选项正确；C选项错误，入射光线与反射光线的夹角是60°+60°=120°；D选项错误，入射角增大10°，反射角也增大10°，夹角增大20°。"},{"id":"g2_physics_015_ex04","knowledge_id":"g2_physics_015","question":"判断题：我们能从不同方向看到教室里的黑板和书本，是因为光在它们表面发生了镜面反射。（  ）","answer":"答案：错误\n解析：我们能从不同方向看到不发光的物体，是因为光在物体表面发生了漫反射，漫反射的反射光线向各个方向都有，所以各个方向的人都能看到。镜面反射的反射光线只朝一个方向，只能在特定方向看到。"},{"id":"g2_physics_015_ex05","knowledge_id":"g2_physics_015","question":"判断题：当入射光线垂直入射到平面镜上时，入射角为0°，反射角也为0°。（  ）","answer":"答案：正确\n解析：当入射光线垂直入射到平面镜上时，入射光线与法线重合，入射角为0°。根据光的反射定律，反射角等于入射角，所以反射角也为0°。此时反射光线沿原路返回，与入射光线重合但方向相反。"},{"id":"g2_physics_015_ex06","knowledge_id":"g2_physics_015","question":"解答题：在\"探究光的反射定律\"实验中：\n（1）实验中使用可折转的光屏的目的是什么？\n（2）为什么要让一束光贴着光屏入射？\n（3）实验中要多次改变入射角的大小进行测量，目的是什么？\n（4）如果将光线沿着反射光线的方向射向镜面，会观察到什么现象？这说明了什么？","answer":"答案：（1）可折转光屏的目的是：探究反射光线、入射光线和法线是否在同一平面内。\n（2）让光贴着光屏入射是为了：在光屏上显示出光路，便于观察和测量。\n（3）多次改变入射角进行测量的目的是：寻找普遍规律，避免实验结论的偶然性。\n（4）会观察到反射光线沿着原来入射光线的方向射出。这说明在光的反射现象中，光路是可逆的。\n解析：探究光的反射定律实验是光学的基础实验。可折转光屏用于验证三线共面；多次实验是为了得出普遍规律；光路可逆是光的反射的重要特性。"},{"id":"g2_physics_015_ex07","knowledge_id":"g2_physics_015","question":"解答题：一束光线射到平面镜上，入射角为40°。求：\n（1）反射角是多少度？\n（2）入射光线与反射光线的夹角是多少度？\n（3）如果入射光线向法线靠近10°，反射角变为多少度？入射光线与反射光线的夹角变为多少度？","answer":"答案：（1）根据光的反射定律，反射角等于入射角。入射角为40°，所以反射角也是40°。\n（2）入射光线与反射光线的夹角 = 入射角 + 反射角 = 40° + 40° = 80°\n（3）入射光线向法线靠近10°，入射角变为：40° - 10° = 30°\n反射角也变为30°。\n此时入射光线与反射光线的夹角 = 30° + 30° = 60°\n答：（1）反射角是40°；（2）入射光线与反射光线的夹角是80°；（3）反射角变为30°，夹角变为60°。\n解析：利用光的反射定律进行角度计算。关键是明确入射角和反射角都是相对于法线的角度，且反射角始终等于入射角。入射角增大，反射角也增大；入射角减小，反射角也减小。"},{"id":"g2_physics_015_ex08","knowledge_id":"g2_physics_015","question":"选择题：关于镜面反射和漫反射，下列说法中正确的是（  ）\nA. 镜面反射遵守光的反射定律，漫反射不遵守\nB. 镜面反射和漫反射都遵守光的反射定律\nC. 只有光滑的表面才能发生光的反射\nD. 黑板\"反光\"是因为发生了漫反射","answer":"答案：B\n解析：A选项错误，镜面反射和漫反射都遵守光的反射定律，漫反射是因为表面凹凸不平，每条光线仍然遵守反射定律；B选项正确；C选项错误，任何表面都能发生反射，只是光滑表面发生镜面反射，粗糙表面发生漫反射；D选项错误，黑板\"反光\"是因为黑板表面太光滑，发生了镜面反射，反射光太强导致看不清。"},{"id":"g2_physics_015_ex09","knowledge_id":"g2_physics_015","question":"填空题：入射角是______与______的夹角；反射角是______与______的夹角。当入射光线与镜面的夹角是50°时，入射角是______°，反射角是______°，入射光线与反射光线的夹角是______°。","answer":"答案：入射光线；法线；反射光线；法线；40；40；80\n解析：入射角和反射角都是相对于法线的，不是相对于镜面的。入射光线与镜面夹角+入射角=90°。当入射光线与镜面夹角为50°时，入射角=90°-50°=40°，反射角=入射角=40°，入射光线与反射光线的夹角=40°+40°=80°。"},{"id":"g2_physics_015_ex10","knowledge_id":"g2_physics_015","question":"选择题：雨后天晴的夜晚，为了不踩到地上的积水，下列判断中正确的是（  ）\nA. 迎着月光走，地上暗处是水；背着月光走，地上发亮处是水\nB. 迎着月光走，地上发亮处是水；背着月光走，地上暗处是水\nC. 迎着月光或背着月光走，都应该是地上发亮处是水\nD. 迎着月光或背着月光走，都应该是地上暗处是水","answer":"答案：B\n解析：水面光滑，发生镜面反射；地面粗糙，发生漫反射。迎着月光走时，月光经水面镜面反射进入人眼，光线强，所以水面亮，地面暗；背着月光走时，月光经水面镜面反射后向前方，不能进入人眼，而地面的漫反射有部分光进入人眼，所以地面较亮，水面暗。"},{"id":"g2_physics_016_ex01","knowledge_id":"g2_physics_016","question":"选择题：下列关于平面镜成像的说法中，正确的是（  ）\nA. 平面镜成的像是实像\nB. 平面镜成的像比物体小\nC. 平面镜成像的原理是光的反射\nD. 物体离平面镜越远，像越小","answer":"答案：C\n解析：A选项错误，平面镜成的是虚像，不是实像；B选项错误，平面镜成的像与物体大小相等；C选项正确，平面镜成像的原理是光的反射；D选项错误，像始终与物体大小相等，物体远了看起来小是视觉效果，实际上像的大小不变。"},{"id":"g2_physics_016_ex02","knowledge_id":"g2_physics_016","question":"填空题：平面镜成像的特点：像与物大小______；像与物到镜面的距离______；像与物的连线与镜面______；平面镜成的是______像。像和物体关于镜面______。","answer":"答案：相等；相等；垂直；虚；对称\n解析：平面镜成像特点可概括为：等大、等距、垂直、虚像、对称。像与物体大小相等，到镜面距离相等，连线与镜面垂直，成的是虚像，像和物体关于镜面对称。"},{"id":"g2_physics_016_ex03","knowledge_id":"g2_physics_016","question":"选择题：一个同学站在平面镜前1.5 m处，他在镜中的像到他的距离是（  ）\nA. 1.5 m\nB. 3 m\nC. 0.75 m\nD. 2 m","answer":"答案：B\n解析：根据平面镜成像特点，像到镜面的距离等于物体到镜面的距离。同学到镜面距离1.5 m，像到镜面距离也是1.5 m，所以像到同学的距离是1.5 m + 1.5 m = 3 m。"},{"id":"g2_physics_016_ex04","knowledge_id":"g2_physics_016","question":"判断题：身高1.6 m的同学站在平面镜前，镜中像的高度也是1.6 m。（  ）","answer":"答案：正确\n解析：平面镜成像的特点之一是像与物体大小相等。所以不管人离镜子多远，像的高度始终等于人的身高，都是1.6 m。看起来近大远小只是视觉上的错觉，实际上像的大小不变。"},{"id":"g2_physics_016_ex05","knowledge_id":"g2_physics_016","question":"判断题：晚上在桌面上铺一张白纸，把一块平面镜放在白纸上，用手电筒从正上方往下照。从侧面看，白纸比平面镜亮。（  ）","answer":"答案：正确\n解析：光线从正上方照到平面镜上，发生镜面反射，反射光沿原路返回，几乎没有光线进入侧面的人眼，所以镜子看起来是暗的；而白纸表面粗糙，发生漫反射，反射光向各个方向都有，有一部分光进入侧面人眼，所以白纸看起来更亮。"},{"id":"g2_physics_016_ex06","knowledge_id":"g2_physics_016","question":"解答题：在\"探究平面镜成像特点\"实验中：\n（1）为什么用玻璃板代替平面镜？\n（2）为什么要选用两支完全相同的蜡烛？\n（3）实验中玻璃板为什么要与纸面垂直？\n（4）用光屏能不能接收到蜡烛的像？这说明平面镜成的是什么像？","answer":"答案：（1）用玻璃板代替平面镜的目的是：玻璃板既能反射光成像，又能透光看到玻璃板后面的蜡烛，便于确定像的位置。\n（2）选用两支完全相同的蜡烛是为了：比较像与物的大小关系。\n（3）玻璃板要与纸面垂直，是为了：使蜡烛的像也成在桌面上，便于让后面的蜡烛与像完全重合。\n（4）光屏不能接收到蜡烛的像。这说明平面镜成的是虚像。\n解析：平面镜成像实验是光学重要实验。用玻璃板代替平面镜是实验的关键，利用了玻璃板透明的特点确定像的位置；用相同蜡烛比较像与物大小；虚像不能用光屏承接。"},{"id":"g2_physics_016_ex07","knowledge_id":"g2_physics_016","question":"解答题：一人站在平面镜前3 m处。求：\n（1）镜中的像到镜面的距离是多少？\n（2）像到人的距离是多少？\n（3）如果人向平面镜走近1 m，像到镜面的距离变为多少？像到人的距离变为多少？\n（4）人走近镜子时，像的大小如何变化？","answer":"答案：（1）根据平面镜成像特点，像到镜面的距离等于物到镜面的距离，所以像到镜面的距离是3 m。\n（2）像到人的距离 = 3 m + 3 m = 6 m\n（3）人走近1 m后，人到镜面的距离 = 3 m - 1 m = 2 m\n像到镜面的距离也变为2 m。\n像到人的距离 = 2 m + 2 m = 4 m\n（4）人走近镜子时，像的大小不变，始终与人的大小相等。\n答：（1）3 m；（2）6 m；（3）2 m，4 m；（4）像的大小不变。\n解析：利用平面镜成像的\"等距\"和\"等大\"特点解题。像与物到镜面距离相等，像与物大小相等。注意：像的大小不随物体到镜面的距离而改变，近大远小是视觉效果。"},{"id":"g2_physics_016_ex08","knowledge_id":"g2_physics_016","question":"选择题：下列现象中，属于平面镜成像的是（  ）\n① 平静的水面映出岸边树木的倒影  ② 阳光下树木的影子\n③ 从后视镜中看到汽车后面的景物  ④ 用放大镜看蚂蚁\nA. ①②\nB. ③④\nC. ①③\nD. ②④","answer":"答案：C\n解析：① 水面倒影是平面镜成像，原理是光的反射；② 影子是光的直线传播形成的；③ 后视镜是凸面镜，利用光的反射成像，也属于面镜成像的一种，与平面镜成像原理相同；④ 放大镜是凸透镜，利用光的折射成像。所以①③属于平面镜（或面镜）成像。"},{"id":"g2_physics_016_ex09","knowledge_id":"g2_physics_016","question":"填空题：平面镜在生活中的应用有：______、______、______等。平面镜的作用有两个：一是______，二是______。","answer":"答案：穿衣镜；潜望镜；牙医用的小镜子；成像；改变光的传播方向\n解析：平面镜的应用非常广泛。利用平面镜成像的有：穿衣镜、化妆镜、牙医检查牙齿的小镜子等；利用平面镜改变光路的有：潜望镜、投影仪上的平面镜等。所以平面镜的两个作用是成像和改变光的传播方向。"},{"id":"g2_physics_016_ex10","knowledge_id":"g2_physics_016","question":"选择题：物体在平面镜中所成像的大小取决于（  ）\nA. 平面镜的大小\nB. 物体到平面镜的距离\nC. 物体的大小\nD. 观察者的位置","answer":"答案：C\n解析：平面镜成像的特点是像与物体大小相等，所以像的大小只取决于物体的大小，与平面镜大小、物体到镜面的距离、观察者位置都无关。物体离镜子远了看起来小，只是人的视觉效果，实际上像的大小没有变。"},{"id":"g2_physics_017_ex01","knowledge_id":"g2_physics_017","question":"选择题：下列关于光的折射的说法中，正确的是（  ）\nA. 光从一种介质进入另一种介质时，传播方向一定会发生偏折\nB. 光从空气斜射入水中时，折射角大于入射角\nC. 光从水中斜射入空气中时，折射角大于入射角\nD. 光在折射现象中，光路是不可逆的","answer":"答案：C\n解析：A选项错误，光垂直入射时传播方向不变；B选项错误，光从空气斜射入水或其他介质时，折射角小于入射角；C选项正确，光从水或其他介质斜射入空气中时，折射角大于入射角；D选项错误，在折射现象中光路也是可逆的。"},{"id":"g2_physics_017_ex02","knowledge_id":"g2_physics_017","question":"填空题：光从空气斜射入水或其他介质中时，折射光线向______方向偏折，折射角______入射角；当入射角增大时，折射角也______；当光线垂直射向介质表面时，传播方向______。在光的折射现象中，光路是______的。","answer":"答案：法线；小于；增大；不变；可逆\n解析：光的折射规律：光从空气斜射入水或其他介质时，折射光线向法线偏折，折射角小于入射角；入射角增大，折射角也增大。垂直入射时，传播方向不变。光路可逆。注意：光从空气→水/玻璃，折射角＜入射角；光从水/玻璃→空气，折射角＞入射角。"},{"id":"g2_physics_017_ex03","knowledge_id":"g2_physics_017","question":"选择题：下列现象中，属于光的折射现象的是（  ）\n① 池水看起来比实际浅  ② 筷子在水中看起来\"折断\"了\n③ 海市蜃楼  ④ 树荫下的圆形光斑\nA. ①②③\nB. ①②④\nC. ①③④\nD. ②③④","answer":"答案：A\n解析：① 池水变浅是光的折射；② 筷子在水中\"折断\"是光的折射；③ 海市蜃楼是光的折射（大气不均匀使光发生折射）；④ 树荫下的圆形光斑是小孔成像，属于光的直线传播。所以①②③是光的折射现象。"},{"id":"g2_physics_017_ex04","knowledge_id":"g2_physics_017","question":"判断题：光从空气射入水中时，折射角一定小于入射角。（  ）","answer":"答案：错误\n解析：光从空气斜射入水中时，折射角小于入射角。但如果是垂直入射（入射角为0°），折射角也为0°，传播方向不变，此时折射角等于入射角。题目中没有说\"斜射\"，所以不一定。"},{"id":"g2_physics_017_ex05","knowledge_id":"g2_physics_017","question":"判断题：渔民叉鱼时，要把鱼叉对准看到的鱼的下方才能叉到鱼。（  ）","answer":"答案：正确\n解析：水中的鱼反射的光从水斜射入空气中时发生折射，折射角大于入射角，折射光线进入人眼。人眼逆着折射光线看去，看到的是鱼的虚像，虚像的位置比实际鱼的位置要高。所以要对准看到的鱼的下方才能叉到真实的鱼。"},{"id":"g2_physics_017_ex06","knowledge_id":"g2_physics_017","question":"解答题：为什么清澈见底的池水看起来比实际的要浅？请用物理知识解释。如果一个人站在岸边看池底，看到的池底位置比实际位置高还是低？","answer":"答案：池水看起来变浅是光的折射现象。\n池底反射的光线从水中斜射入空气中时，在水面处发生折射，折射角大于入射角。人眼逆着折射光线看去，认为光是沿直线传播的，所以看到的是池底的虚像，虚像的位置比实际池底的位置要高。因此池水看起来比实际的要浅。\n看到的池底位置比实际位置高。\n解析：这是光的折射的典型例子。类似的现象还有：水中的筷子看起来向上弯折、渔民叉鱼要叉向看到的鱼的下方等。都是因为光从水（或其他介质）斜射入空气时发生折射，虚像比实际物体位置高。"},{"id":"g2_physics_017_ex07","knowledge_id":"g2_physics_017","question":"解答题：在探究光的折射规律实验中：\n（1）为什么要用可折转的光屏？\n（2）当光线从空气斜射入玻璃中时，折射角和入射角哪个大？\n（3）当入射角增大时，折射角如何变化？\n（4）当光线垂直入射时，折射角是多少度？传播方向是否改变？","answer":"答案：（1）用可折转的光屏是为了探究折射光线、入射光线和法线是否在同一平面内。\n（2）当光线从空气斜射入玻璃中时，折射角小于入射角。\n（3）当入射角增大时，折射角也随之增大。\n（4）当光线垂直入射时，折射角为0°，传播方向不改变。\n解析：光的折射规律可概括为：三线共面、两线分居、空气中角大（光从空气斜射入其他介质时入射角大，从其他介质斜射入空气时折射角大）、垂直入射方向不变。光路可逆。"},{"id":"g2_physics_017_ex08","knowledge_id":"g2_physics_017","question":"选择题：光从空气斜射入玻璃中，入射角是60°，则折射角可能是（  ）\nA. 0°\nB. 35°\nC. 60°\nD. 90°","answer":"答案：B\n解析：光从空气斜射入玻璃中时，折射角小于入射角。入射角是60°，所以折射角应小于60°且大于0°（因为是斜射，不是垂直入射）。A选项0°是垂直入射的情况，不符合斜射；C选项等于入射角，只有垂直入射时才相等；D选项90°是全反射的临界情况，不符合。所以只有B选项35°符合条件。"},{"id":"g2_physics_017_ex09","knowledge_id":"g2_physics_017","question":"填空题：光的折射是指光从一种介质______入另一种介质时，传播方向发生______的现象。生活中常见的光的折射现象有：______、______、______等（写出三个即可）。","answer":"答案：斜射；偏折；池水变浅；筷子在水中弯折；海市蜃楼\n解析：光从一种介质斜射入另一种介质时，传播方向一般会发生偏折，这种现象叫光的折射。注意是\"斜射\"，垂直入射时传播方向不变。生活中光的折射现象很多，如：池水变浅、筷子弯折、海市蜃楼、放大镜、照相机、投影仪、彩虹的形成（色散的本质也是折射）等。"},{"id":"g2_physics_017_ex10","knowledge_id":"g2_physics_017","question":"选择题：下列关于光的反射和折射的说法中，正确的是（  ）\nA. 光的反射和折射都发生在两种介质的分界面上\nB. 光发生折射时，一定同时发生反射\nC. 光发生反射时，一定同时发生折射\nD. 在光的反射和折射现象中，光路都是可逆的","answer":"答案：C\n解析：A选项正确，反射和折射都发生在两种介质的分界面上；B选项正确，光发生折射时，一定有一部分光被反射回来；C选项错误，光发生反射时，不一定发生折射，例如光在不透明物体表面反射时，就没有折射；D选项正确，反射和折射中光路都是可逆的。题目要求选正确的，但注意C是错误的。综合来看，A、B、D都正确，C错误。因为题目是单选题，答案选最准确的，这里C是错误的。"},{"id":"g2_physics_018_ex01","knowledge_id":"g2_physics_018","question":"选择题：下列关于光的色散的说法中，正确的是（  ）\nA. 白光是单色光\nB. 太阳光通过三棱镜后分解成各种颜色的光，这种现象叫光的色散\nC. 光的色散说明白光是由红、黄、蓝三种色光混合而成的\nD. 色光的三原色是红、黄、蓝","answer":"答案：B\n解析：A选项错误，白光是复色光，不是单色光；B选项正确，太阳光通过三棱镜后被分解成红、橙、黄、绿、蓝、靛、紫七种色光，这种现象叫光的色散；C选项错误，白光是由七种色光混合而成的；D选项错误，色光的三原色是红、绿、蓝，不是红、黄、蓝（那是颜料的三原色）。"},{"id":"g2_physics_018_ex02","knowledge_id":"g2_physics_018","question":"填空题：太阳光通过三棱镜后，被分解成______、______、黄、绿、蓝、靛、紫七种颜色的光，这种现象叫做______。色光的三原色是______、______、______；颜料的三原色是______、______、______。","answer":"答案：红；橙；光的色散；红；绿；蓝；红；黄；蓝\n解析：光的色散实验说明白光是由各种色光混合而成的复色光。色散现象是由于不同颜色的光通过三棱镜时偏折程度不同造成的，红光偏折最小，紫光偏折最大。色光三原色是红、绿、蓝；颜料三原色是红、黄、蓝。注意区分。"},{"id":"g2_physics_018_ex03","knowledge_id":"g2_physics_018","question":"选择题：雨后的天空中经常出现美丽的彩虹，彩虹形成的原因是（  ）\nA. 光的直线传播\nB. 光的反射\nC. 光的色散（折射）\nD. 光的可逆性","answer":"答案：C\n解析：彩虹是太阳光通过悬浮在空气中的小水珠时发生折射（色散）形成的。太阳光经过水珠时，不同颜色的光偏折程度不同，被分解成七种颜色，形成彩虹。彩虹的形成原理和三棱镜使太阳光色散是一样的。"},{"id":"g2_physics_018_ex04","knowledge_id":"g2_physics_018","question":"判断题：色光的三原色是红、黄、蓝。（  ）","answer":"答案：错误\n解析：色光的三原色是红、绿、蓝，这三种色光按不同比例混合可以得到各种颜色的光。红、黄、蓝是颜料的三原色，这三种颜料按不同比例混合可以得到各种颜色的颜料。注意区分色光三原色和颜料三原色。"},{"id":"g2_physics_018_ex05","knowledge_id":"g2_physics_018","question":"判断题：白光是由七种色光混合而成的，所以白光是复色光。（  ）","answer":"答案：正确\n解析：白光（太阳光）通过三棱镜可以被分解成红、橙、黄、绿、蓝、靛、紫七种颜色的光，说明白光是由各种色光混合而成的，属于复色光。不能再分解的光叫单色光，如红光、绿光等。"},{"id":"g2_physics_018_ex06","knowledge_id":"g2_physics_018","question":"解答题：在探究光的色散实验中，让一束太阳光通过三棱镜，在白屏上形成一条彩色的光带。请回答：\n（1）光带的颜色从上到下（或从偏折最小到最大）依次是什么？\n（2）这个实验说明了什么？\n（3）如果在白屏上贴一张绿纸，你会看到什么现象？\n（4）如果把一支温度计放在红光的外侧，温度计示数会怎样变化？这说明了什么？","answer":"答案：（1）从上到下依次是：红、橙、黄、绿、蓝、靛、紫。红光偏折最小，紫光偏折最大。\n（2）这个实验说明：白光是由各种色光混合而成的，白光是复色光；不同颜色的光通过三棱镜时偏折程度不同。\n（3）贴绿纸后只能看到绿色的光，其他颜色的光被绿纸吸收了。因为不透明物体的颜色是由它反射的色光决定的，绿纸只反射绿光，吸收其他色光。\n（4）温度计示数会升高。这说明红光外侧存在着人眼看不见的光——红外线，红外线具有热效应。\n解析：光的色散实验是光学的经典实验，证明了白光是复色光。色散的本质是光的折射，不同色光折射率不同，偏折程度不同。"},{"id":"g2_physics_018_ex07","knowledge_id":"g2_physics_018","question":"解答题：为什么在没有任何其他光照的情况下，舞台追光灯发出的绿光照在穿白上衣、红裙子的演员身上，观众看到她的上衣是绿色的，裙子是黑色的？","answer":"答案：不透明物体的颜色是由它反射的色光决定的。白色物体能反射所有颜色的光，黑色物体吸收所有颜色的光。\n白上衣能反射所有色光，当绿光照在白上衣上时，白上衣反射绿光，所以观众看到上衣是绿色的。\n红裙子只能反射红光，吸收其他色光，当绿光照在红裙子上时，绿光被红裙子全部吸收，没有光反射出来，所以观众看到裙子是黑色的。\n解析：物体的颜色问题关键是理解：不透明物体只反射与其颜色相同的色光，吸收其他色光；白色物体反射所有色光，黑色物体吸收所有色光。透明物体的颜色由透过它的色光决定。"},{"id":"g2_physics_018_ex08","knowledge_id":"g2_physics_018","question":"选择题：下列关于物体颜色的说法中，正确的是（  ）\nA. 我们看到树叶是绿色的，是因为树叶吸收了绿光\nB. 红色的玻璃能透过红光，吸收其他色光\nC. 白色的物体能吸收所有色光\nD. 黑色的物体能反射所有色光","answer":"答案：B\n解析：A选项错误，树叶是绿色的是因为树叶反射绿光，吸收其他色光；B选项正确，透明物体的颜色由透过它的色光决定，红玻璃只能透过红光，吸收其他色光；C选项错误，白色物体能反射所有色光；D选项错误，黑色物体吸收所有色光。"},{"id":"g2_physics_018_ex09","knowledge_id":"g2_physics_018","question":"填空题：透明物体的颜色由______它的色光决定；不透明物体的颜色由它______的色光决定。白色物体能______所有色光；黑色物体能______所有色光。","answer":"答案：透过；反射；反射；吸收\n解析：透明物体：什么颜色的透明物体只能透过什么颜色的光，其他色光被吸收。不透明物体：什么颜色的不透明物体只能反射什么颜色的光，其他色光被吸收。白色不透明物体反射所有色光，黑色不透明物体吸收所有色光。"},{"id":"g2_physics_018_ex10","knowledge_id":"g2_physics_018","question":"选择题：下列关于光的色散的说法中，错误的是（  ）\nA. 光的色散是由光的折射形成的\nB. 色散现象说明白光是复色光\nC. 彩虹是光的色散现象\nD. 色光三原色混合后是黑色的","answer":"答案：D\n解析：A选项正确，色散的本质是光的折射，不同色光偏折程度不同；B选项正确，色散实验证明白光是由多种色光组成的复色光；C选项正确，彩虹是太阳光经过水珠色散形成的；D选项错误，色光三原色（红、绿、蓝）按适当比例混合后是白色的，不是黑色的。颜料三原色混合后是黑色的。"},{"id":"g2_physics_019_ex01","knowledge_id":"g2_physics_019","question":"选择题：下列关于凸透镜和凹透镜的说法中，正确的是（  ）\nA. 凸透镜中间薄、边缘厚，对光有会聚作用\nB. 凹透镜中间厚、边缘薄，对光有发散作用\nC. 凸透镜又叫会聚透镜，凹透镜又叫发散透镜\nD. 所有光线通过凸透镜后都会会聚到焦点上","answer":"答案：C\n解析：A选项错误，凸透镜是中间厚、边缘薄，对光有会聚作用；B选项错误，凹透镜是中间薄、边缘厚，对光有发散作用；C选项正确，凸透镜又叫会聚透镜，凹透镜又叫发散透镜；D选项错误，只有平行于主光轴的光线通过凸透镜后才会会聚到焦点上，不是所有光线。"},{"id":"g2_physics_019_ex02","knowledge_id":"g2_physics_019","question":"填空题：中间厚、边缘薄的透镜叫______透镜，它对光有______作用；中间薄、边缘厚的透镜叫______透镜，它对光有______作用。平行于主光轴的光线经凸透镜折射后会聚在主光轴上的一点，这个点叫做凸透镜的______，用字母______表示，焦点到光心的距离叫做______，用字母______表示。","answer":"答案：凸；会聚；凹；发散；焦点；F；焦距；f\n解析：凸透镜中间厚边缘薄，对光有会聚作用，又叫会聚透镜；凹透镜中间薄边缘厚，对光有发散作用，又叫发散透镜。平行于主光轴的光线经凸透镜折射后会聚于焦点，焦点到光心的距离叫焦距。凸透镜两侧各有一个焦点，两侧的焦距相等。"},{"id":"g2_physics_019_ex03","knowledge_id":"g2_physics_019","question":"选择题：下列光学元件中，对光有会聚作用的一组是（  ）\nA. 凸透镜、凹面镜\nB. 凸透镜、凹透镜\nC. 凹透镜、凸面镜\nD. 凹透镜、平面镜","answer":"答案：A\n解析：对光有会聚作用的是：凸透镜（折射会聚）、凹面镜（反射会聚）；对光有发散作用的是：凹透镜（折射发散）、凸面镜（反射发散）；平面镜不聚光也不散光，只改变光的传播方向。所以正确答案是A。"},{"id":"g2_physics_019_ex04","knowledge_id":"g2_physics_019","question":"判断题：凸透镜对光有会聚作用，所以通过凸透镜的光线一定会聚到一点。（  ）","answer":"答案：错误\n解析：凸透镜对光有会聚作用，是指相对于入射光线，经过凸透镜后的光线更靠近主光轴（更会聚一些），不一定会聚到一点。只有平行于主光轴的入射光线经凸透镜后才会聚到焦点上。如果入射光线本身就是发散的，经过凸透镜后可能仍然是发散的，只是比原来发散程度小一些。"},{"id":"g2_physics_019_ex05","knowledge_id":"g2_physics_019","question":"判断题：凹透镜对光有发散作用，所以通过凹透镜的光线一定不会会聚到一点。（  ）","answer":"答案：错误\n解析：凹透镜对光有发散作用，是指相对于入射光线，经过凹透镜后的光线更远离主光轴（更发散一些）。如果入射光线本身是会聚的，而且会聚程度比较大，经过凹透镜后可能仍然会聚到一点，只是会聚点比原来更远一些。"},{"id":"g2_physics_019_ex06","knowledge_id":"g2_physics_019","question":"解答题：有两个外观相似的透镜，一个是凸透镜，一个是凹透镜。请你说出至少三种辨别它们的方法。","answer":"答案：方法一：看形状。用手摸，中间厚、边缘薄的是凸透镜；中间薄、边缘厚的是凹透镜。\n方法二：看文字。把透镜放在字的附近，能使字放大的是凸透镜，使字缩小的是凹透镜。\n方法三：看对光线的作用。让太阳光（平行光）通过透镜，能使光线会聚成亮点的是凸透镜，使光线发散的是凹透镜。\n方法四：看远处物体。通过透镜看远处的物体，成倒立像的是凸透镜，成正立缩小像的是凹透镜。\n（任选三种即可）\n解析：辨别凸透镜和凹透镜的方法很多，都是利用了它们的特点：凸透镜中间厚边缘薄、对光有会聚作用、能成放大的像；凹透镜中间薄边缘厚、对光有发散作用、成缩小的像。"},{"id":"g2_physics_019_ex07","knowledge_id":"g2_physics_019","question":"解答题：在探究凸透镜对光的作用实验中：\n（1）怎样测量一个凸透镜的焦距？请说出实验方法。\n（2）如果测得一个凸透镜能使平行光在10 cm处会聚成一个最小最亮的光斑，这个凸透镜的焦距是多少？\n（3）如果用凹透镜做这个实验，能不能得到最小最亮的光斑？为什么？","answer":"答案：（1）测量焦距的方法：将凸透镜正对太阳光，在透镜的另一侧放一张白纸，移动白纸直到纸上出现一个最小最亮的光斑，这个光斑就是焦点。用刻度尺量出光斑到凸透镜光心的距离，就是焦距。\n（2）最小最亮光斑在10 cm处，说明焦距 f = 10 cm。\n（3）用凹透镜不能得到最小最亮的光斑。因为凹透镜对光有发散作用，平行光经过凹透镜后会发散，发散光线的反向延长线虽然也能交于一点（虚焦点），但不能在白纸上形成实际的光斑。\n解析：测量凸透镜焦距是重要实验，利用了平行于主光轴的光线经凸透镜后会聚于焦点的原理。注意要正对太阳光，让光线与主光轴平行。"},{"id":"g2_physics_019_ex08","knowledge_id":"g2_physics_019","question":"选择题：关于透镜的焦点和焦距，下列说法中正确的是（  ）\nA. 凸透镜有两个焦点，凹透镜只有一个焦点\nB. 凸透镜的焦点是实焦点，凹透镜的焦点是虚焦点\nC. 焦距越大，透镜对光的会聚作用越强\nD. 凸透镜的焦距就是焦点到透镜边缘的距离","answer":"答案：B\n解析：A选项错误，凸透镜和凹透镜都有两个焦点，分别在透镜两侧；B选项正确，凸透镜的焦点是实际光线会聚形成的，是实焦点；凹透镜的焦点是折射光线反向延长线的交点，是虚焦点；C选项错误，焦距越小，透镜对光的会聚（或发散）作用越强；D选项错误，焦距是焦点到光心的距离，不是到边缘的距离。"},{"id":"g2_physics_019_ex09","knowledge_id":"g2_physics_019","question":"填空题：凸透镜的三条特殊光线：\n（1）平行于主光轴的光线经凸透镜折射后______；\n（2）经过焦点的光线经凸透镜折射后______；\n（3）经过光心的光线经凸透镜折射后______。","answer":"答案：过焦点；平行于主光轴；传播方向不变\n解析：凸透镜的三条特殊光线是作图和分析成像的基础：\n1. 平行于主光轴的光线 → 折射后过焦点；\n2. 过焦点的光线 → 折射后平行于主光轴；\n3. 过光心的光线 → 传播方向不变。\n凹透镜的三条特殊光线类似，但焦点是虚焦点。"},{"id":"g2_physics_019_ex10","knowledge_id":"g2_physics_019","question":"选择题：下列关于透镜应用的说法中，错误的是（  ）\nA. 照相机的镜头相当于一个凸透镜\nB. 放大镜就是一个凸透镜\nC. 近视眼戴的眼镜是凸透镜\nD. 投影仪的镜头是凸透镜","answer":"答案：C\n解析：A选项正确，照相机利用凸透镜成倒立缩小实像的原理；B选项正确，放大镜利用凸透镜成正立放大虚像的原理；C选项错误，近视眼是因为晶状体太厚，折光能力太强，像成在视网膜前方，需要戴凹透镜来矫正；D选项正确，投影仪利用凸透镜成倒立放大实像的原理。"},{"id":"g2_physics_020_ex01","knowledge_id":"g2_physics_020","question":"选择题：在做\"探究凸透镜成像规律\"实验时，小明将点燃的蜡烛放在距凸透镜30 cm处，在透镜另一侧距透镜15 cm处的光屏上得到烛焰清晰的像。则该凸透镜的焦距可能是（  ）\nA. 5 cm\nB. 10 cm\nC. 15 cm\nD. 20 cm","answer":"答案：B\n解析：物距u = 30 cm，像距v = 15 cm，u > v，说明成倒立缩小的实像，此时u > 2f，f < v < 2f。\n由u > 2f得：30 cm > 2f，即f < 15 cm\n由f < v < 2f得：f < 15 cm < 2f，即7.5 cm < f < 15 cm\n综合得：7.5 cm < f < 15 cm，选项中只有10 cm符合条件。"},{"id":"g2_physics_020_ex02","knowledge_id":"g2_physics_020","question":"填空题：凸透镜成像规律：\n（1）当u > 2f时，成______、______的______像，像距v的范围是______，应用是______；\n（2）当u = 2f时，成______、______的______像，像距v = ______；\n（3）当f < u < 2f时，成______、______的______像，像距v的范围是______，应用是______；\n（4）当u = f时，______成像；\n（5）当u < f时，成______、______的______像，应用是______。","answer":"答案：\n（1）倒立；缩小；实；f < v < 2f；照相机\n（2）倒立；等大；实；2f\n（3）倒立；放大；实；v > 2f；投影仪（幻灯机）\n（4）不\n（5）正立；放大；虚；放大镜\n解析：凸透镜成像规律是光学的重点，可概括为：一倍焦距分虚实，二倍焦距分大小；实像倒立在异侧，虚像正立在同侧；物近像远像变大，物远像近像变小。"},{"id":"g2_physics_020_ex03","knowledge_id":"g2_physics_020","question":"选择题：一个凸透镜的焦距是10 cm，将点燃的蜡烛放在距凸透镜8 cm处，蜡烛经凸透镜成的像是（  ）\nA. 倒立、放大的实像\nB. 倒立、缩小的实像\nC. 正立、放大的虚像\nD. 正立、缩小的虚像","answer":"答案：C\n解析：已知f = 10 cm，物距u = 8 cm，u < f，根据凸透镜成像规律，当u < f时，成正立、放大的虚像，应用是放大镜。所以选C。"},{"id":"g2_physics_020_ex04","knowledge_id":"g2_physics_020","question":"判断题：在凸透镜成像实验中，当物体从远处向凸透镜靠近时，像逐渐变大，像距也逐渐变大。（  ）","answer":"答案：正确\n解析：凸透镜成实像时，物近像远像变大。即物体向透镜靠近（物距减小），像远离透镜（像距增大），像也变大。这是凸透镜成实像的重要规律。注意：这个规律只适用于成实像的情况（u > f）。"},{"id":"g2_physics_020_ex05","knowledge_id":"g2_physics_020","question":"判断题：凸透镜成的实像都是倒立的，虚像都是正立的。（  ）","answer":"答案：正确\n解析：凸透镜成像的特点：实像都是倒立的，且像与物在透镜的两侧；虚像都是正立的，且像与物在透镜的同侧。这是判断实像和虚像的重要依据之一。"},{"id":"g2_physics_020_ex06","knowledge_id":"g2_physics_020","question":"解答题：在\"探究凸透镜成像规律\"实验中：\n（1）实验前为什么要调整烛焰、凸透镜和光屏的高度，使它们的中心大致在同一高度？\n（2）实验中如果无论怎样移动光屏，都不能在光屏上看到像，可能的原因有哪些？（写出至少两条）\n（3）如果用不透明的纸板遮住凸透镜的上半部，光屏上的像会发生什么变化？","answer":"答案：（1）使它们的中心在同一高度，目的是使烛焰的像成在光屏的中央，便于观察。\n（2）可能的原因：① 蜡烛在一倍焦距以内（u < f），成虚像，虚像不能用光屏承接；② 蜡烛在焦点上（u = f），不成像；③ 烛焰、凸透镜、光屏的中心不在同一高度，像成在光屏外；④ 光具座不够长，像距太大，光屏接不到。（任选两条即可）\n（3）遮住上半部后，光屏上仍然能成完整的像，但像的亮度会变暗。因为透镜的每一部分都能使物体成像，遮住一半只是减少了通过透镜的光线，像仍然完整，只是变暗了。\n解析：凸透镜成像实验是重点实验。注意：遮住透镜一部分不影响像的完整性，只影响亮度。"},{"id":"g2_physics_020_ex07","knowledge_id":"g2_physics_020","question":"解答题：一个凸透镜的焦距是10 cm。请根据物距的不同，回答下列问题：\n（1）当物体距透镜25 cm时，成什么样的像？像距在什么范围？应用是什么？\n（2）当物体距透镜15 cm时，成什么样的像？像距在什么范围？应用是什么？\n（3）当物体距透镜5 cm时，成什么样的像？应用是什么？","answer":"答案：已知f = 10 cm\n（1）u = 25 cm，u > 2f（25 cm > 20 cm），成倒立、缩小的实像，像距范围是f < v < 2f（即10 cm < v < 20 cm）。应用是照相机。\n（2）u = 15 cm，f < u < 2f（10 cm < 15 cm < 20 cm），成倒立、放大的实像，像距范围是v > 2f（即v > 20 cm）。应用是投影仪（幻灯机）。\n（3）u = 5 cm，u < f（5 cm < 10 cm），成正立、放大的虚像。应用是放大镜。\n解析：牢记凸透镜成像规律，根据物距与焦距的关系判断成像性质。口诀：一倍焦距分虚实，二倍焦距分大小。"},{"id":"g2_physics_020_ex08","knowledge_id":"g2_physics_020","question":"选择题：在探究凸透镜成像规律的实验中，当烛焰、凸透镜、光屏处于如图所示位置时，恰能在光屏上得到一个清晰的像。利用这一成像原理可以制成（  ）\n（物距20 cm，像距30 cm，f = 12 cm）\nA. 照相机\nB. 投影仪\nC. 放大镜\nD. 潜望镜","answer":"答案：B\n解析：已知f = 12 cm，物距u = 20 cm，像距v = 30 cm。\n判断物距范围：f < u < 2f（12 cm < 20 cm < 24 cm），此时成倒立、放大的实像，v > 2f（30 cm > 24 cm），符合投影仪的成像原理。\n照相机是u > 2f成倒立缩小实像；放大镜是u < f成正立放大虚像；潜望镜是平面镜成像。所以选B。"},{"id":"g2_physics_020_ex09","knowledge_id":"g2_physics_020","question":"填空题：凸透镜成实像时，物距减小（物体靠近透镜），像距______，像的大小______；物距增大（物体远离透镜），像距______，像的大小______。（均选填\"变大\"\"变小\"或\"不变\"）这个规律可以概括为：成实像时，物______像______像变______。","answer":"答案：变大；变大；变小；变小；近；远；大\n解析：凸透镜成实像的动态规律：物近像远像变大，物远像近像变小。即物体靠近透镜，像远离透镜，像变大；物体远离透镜，像靠近透镜，像变小。这个规律非常重要，常用于判断像和像距的变化。"},{"id":"g2_physics_020_ex10","knowledge_id":"g2_physics_020","question":"选择题：小明用照相机给同学拍了一张全身照，现在想拍一张半身照，如果同学位置不动，小明应该（  ）\nA. 靠近同学，同时镜头向后缩\nB. 靠近同学，同时镜头向前伸\nC. 远离同学，同时镜头向后缩\nD. 远离同学，同时镜头向前伸","answer":"答案：B\n解析：从全身照到半身照，像变大了。根据凸透镜成实像时\"物近像远像变大\"的规律，要让像变大，需要减小物距（靠近同学），同时增大像距（镜头向前伸，增大镜头到底片的距离）。所以选B。"},{"id":"g2_physics_021_ex01","knowledge_id":"g2_physics_021","question":"选择题：下列关于眼睛的说法中，正确的是（  ）\nA. 人的眼睛相当于一架照相机，晶状体相当于镜头，视网膜相当于胶片\nB. 眼睛看到的物体都是正立的实像\nC. 正常眼睛的明视距离大约是10 cm\nD. 近视眼是因为晶状体太薄，折光能力太弱","answer":"答案：A\n解析：A选项正确，人的眼睛相当于一架照相机，晶状体相当于凸透镜（镜头），视网膜相当于光屏（胶片）；B选项错误，眼睛成的是倒立、缩小的实像，只是大脑处理后我们感觉是正立的；C选项错误，正常眼睛的明视距离大约是25 cm；D选项错误，近视眼是因为晶状体太厚，折光能力太强，像成在视网膜前方。"},{"id":"g2_physics_021_ex02","knowledge_id":"g2_physics_021","question":"填空题：人的眼睛相当于一架______，晶状体和角膜的共同作用相当于一个______，视网膜相当于______。眼睛看物体时，成的是______、______的______像。正常眼睛的明视距离约为______cm。","answer":"答案：照相机；凸透镜；光屏（胶片）；倒立；缩小；实；25\n解析：眼睛的成像原理与照相机相同，都是利用凸透镜成倒立缩小实像的原理。晶状体相当于凸透镜，视网膜相当于光屏。看远处和近处的物体时，通过睫状体改变晶状体的厚薄（焦距），使像始终成在视网膜上。明视距离是指人眼观察近处物体最清晰而又不疲劳的距离，约为25 cm。"},{"id":"g2_physics_021_ex03","knowledge_id":"g2_physics_021","question":"选择题：关于近视眼及其矫正，下列说法中正确的是（  ）\nA. 近视眼只能看清近处的物体，看不清远处的物体\nB. 近视眼是因为晶状体太薄，折光能力太弱\nC. 近视眼的像成在视网膜的后方\nD. 近视眼需要配戴凸透镜进行矫正","answer":"答案：A\n解析：A选项正确，近视眼看不清远处的物体，只能看清近处的；B选项错误，近视眼是晶状体太厚，折光能力太强；C选项错误，近视眼的像成在视网膜的前方，不是后方；D选项错误，近视眼需要配戴凹透镜进行矫正，凹透镜对光有发散作用，使像后移到视网膜上。"},{"id":"g2_physics_021_ex04","knowledge_id":"g2_physics_021","question":"判断题：远视眼（老花眼）需要配戴凸透镜进行矫正。（  ）","answer":"答案：正确\n解析：远视眼（老花眼）是因为晶状体太薄，折光能力太弱，或者眼球前后径太短，导致近处物体的像成在视网膜的后方。凸透镜对光有会聚作用，配戴凸透镜可以使光线先会聚一些，再经过晶状体会聚，使像前移到视网膜上。所以远视眼戴凸透镜矫正。"},{"id":"g2_physics_021_ex05","knowledge_id":"g2_physics_021","question":"判断题：我们平时说的度数就是眼镜片的焦距，度数越大，焦距越长。（  ）","answer":"答案：错误\n解析：眼镜的度数等于焦距（以米为单位）的倒数乘以100，即 度数 = 100/f。度数越大，焦距越短。凸透镜（远视镜）的度数是正数，凹透镜（近视镜）的度数是负数。"},{"id":"g2_physics_021_ex06","knowledge_id":"g2_physics_021","question":"解答题：近视眼是怎样形成的？应该如何矫正？请画图说明（用文字描述光路）。矫正后像成在哪里？","answer":"答案：近视眼的形成原因：晶状体太厚，折光能力太强，或者眼球前后径过长，导致远处物体的像成在视网膜的前方，所以看不清远处的物体。\n矫正方法：配戴凹透镜。凹透镜对光有发散作用，使来自远处物体的光线先发散一些，再经过晶状体会聚，使像向后移到视网膜上。\n矫正后像成在视网膜上。\n解析：近视眼的特点：晶状体太厚→折光能力太强→像成在视网膜前→戴凹透镜（发散）矫正。\n远视眼的特点：晶状体太薄→折光能力太弱→像成在视网膜后→戴凸透镜（会聚）矫正。\n记忆口诀：近前远后，近凹远凸。"},{"id":"g2_physics_021_ex07","knowledge_id":"g2_physics_021","question":"解答题：保护视力非常重要。在日常生活中，我们应该怎样预防近视？请至少写出三种方法。","answer":"答案：预防近视的方法：\n1. 读写姿势要正确，眼睛与书本的距离保持约33 cm（或25 cm左右）；\n2. 不要长时间用眼，每隔一小时要休息几分钟，远眺放松；\n3. 不要在光线太强或太暗的地方看书；\n4. 不要躺着、走路或在晃动的车上看书；\n5. 认真做眼保健操；\n6. 多参加户外活动，多看远处的绿色植物。\n（任选三种即可）\n解析：预防近视要从用眼卫生做起，避免眼睛过度疲劳。长时间近距离用眼是造成近视的主要原因，所以要注意让眼睛适当休息，多看远处，使睫状体放松。"},{"id":"g2_physics_021_ex08","knowledge_id":"g2_physics_021","question":"选择题：下列四幅图中，分别表示近视眼成像情况和矫正方法的是（  ）\n① 像成在视网膜前  ② 像成在视网膜后\n③ 戴凹透镜矫正  ④ 戴凸透镜矫正\nA. ①和③\nB. ②和④\nC. ①和④\nD. ②和③","answer":"答案：A\n解析：近视眼的成像特点是像成在视网膜的前方（图①），需要用凹透镜矫正（图③），因为凹透镜对光有发散作用，使像后移到视网膜上。远视眼的成像特点是像成在视网膜的后方（图②），需要用凸透镜矫正（图④）。所以近视眼是①和③，选A。"},{"id":"g2_physics_021_ex09","knowledge_id":"g2_physics_021","question":"填空题：近视眼的成因：晶状体太______，折光能力太______，或者眼球前后径太______，像成在视网膜的______方，需要戴______镜矫正；远视眼的成因：晶状体太______，折光能力太______，或者眼球前后径太______，像成在视网膜的______方，需要戴______镜矫正。","answer":"答案：厚；强；长；前；凹透；薄；弱；短；后；凸透\n解析：记忆技巧：\n近视眼：晶厚→光强→像在前→戴凹透（近前凹）\n远视眼：晶薄→光弱→像在后→戴凸透（远后凸）\n可以简单记为\"近前远后，近凹远凸\"。"},{"id":"g2_physics_021_ex10","knowledge_id":"g2_physics_021","question":"选择题：下列关于眼睛和眼镜的说法中，正确的是（  ）\nA. 人的眼睛看远处物体时，晶状体变厚，焦距变小\nB. 人的眼睛看近处物体时，晶状体变薄，焦距变大\nC. 近视眼镜的镜片是凹透镜，它的度数是负数\nD. 老花眼（远视眼）的镜片是凹透镜","answer":"答案：C\n解析：A选项错误，看远处物体时，睫状体放松，晶状体变薄，焦距变大；B选项错误，看近处物体时，睫状体收缩，晶状体变厚，焦距变小；C选项正确，近视眼镜是凹透镜，度数为负；D选项错误，老花镜是凸透镜，度数为正。"},{"id":"g2_physics_022_ex01","knowledge_id":"g2_physics_022","question":"选择题：下列关于显微镜的说法中，正确的是（  ）\nA. 显微镜的目镜和物镜都是凹透镜\nB. 显微镜的目镜成倒立放大的实像\nC. 显微镜的物镜成倒立放大的实像\nD. 显微镜的放大倍数等于物镜的放大倍数","answer":"答案：C\n解析：A选项错误，显
