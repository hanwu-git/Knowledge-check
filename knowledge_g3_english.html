    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"id":"g3_english_001","chapter":"Unit 1 How can we become good learners?","name":"by + 动名词的用法","formula":"by + v.ing 表示\"通过……方式/方法\"","explanation":"\"by + 动名词\"结构表示通过某种方式或手段做某事。例如：I learn English by watching English movies.（我通过看英语电影学习英语。）对by引导的方式状语提问用how。by还可以表示\"在……旁边\"、\"乘坐交通工具\"等含义。","semester":"upper"},{"id":"g3_english_002","chapter":"Unit 1 How can we become good learners?","name":"现在完成时与一般过去时的区别","formula":"现在完成时：have/has + 过去分词；一般过去时：主语 + 动词过去式","explanation":"现在完成时强调过去发生的动作对现在造成的影响或结果，常与already, yet, ever, never, just, before, so far, in the past few years等连用。一般过去时只表示过去发生的动作或存在的状态，与现在无关，常与yesterday, last week, ago, in 2008等具体过去时间状语连用。","semester":"upper"},{"id":"g3_english_003","chapter":"Unit 1 How can we become good learners?","name":"so...that... 句型","formula":"so + 形容词/副词 + that + 从句 表示\"如此……以至于……\"","explanation":"so...that...引导结果状语从句，so后面接形容词或副词原级。例如：The book is so interesting that I have read it three times.（这本书如此有趣以至于我读了三遍。）同义句型：too...to...（太……而不能……）、enough to...（足够……去做……）。such...that...也表示\"如此……以至于……\"，such后面接名词短语。","semester":"upper"},{"id":"g3_english_004","chapter":"Unit 1 How can we become good learners?","name":"宾语从句的基本用法","formula":"主句 + 引导词 + 主语 + 谓语 + 其他","explanation":"宾语从句在复合句中作主句的宾语。引导词：that（陈述句变来，口语中that常省略）、if/whether（一般疑问句变来）、特殊疑问词（特殊疑问句变来）。语序：宾语从句一律用陈述语序（引导词 + 主语 + 谓语）。时态：主句是现在时，从句根据实际情况用各种时态；主句是过去时，从句用相应的过去时态；但从句表示的是客观真理、自然现象时，从句用一般现在时。","semester":"upper"},{"id":"g3_english_005","chapter":"Unit 2 I think that mooncakes are delicious!","name":"感叹句","formula":"What + (a/an) + 形容词 + 名词 + 主语 + 谓语！；How + 形容词/副词 + 主语 + 谓语！","explanation":"感叹句用来表达强烈的情感。what引导的感叹句中心词是名词，可数名词单数前加a/an，复数或不可数名词不加。how引导的感叹句中心词是形容词或副词。例如：What a beautiful girl she is! = How beautiful the girl is! （这个女孩多漂亮啊！）在口语中，感叹句的主语和谓语常可省略。","semester":"upper"},{"id":"g3_english_006","chapter":"Unit 2 I think that mooncakes are delicious!","name":"宾语从句的时态问题","formula":"主现从不限；主过从必过；真理永一现","explanation":"宾语从句的时态要与主句保持一致：1. 主句是一般现在时，从句根据需要可用各种时态。2. 主句是一般过去时，从句必须用相应的过去时态（一般过去时、过去进行时、过去将来时、过去完成时）。3. 但如果从句表示的是客观真理、自然现象、科学事实，即使主句是过去时，从句仍用一般现在时。例如：The teacher told us that the earth goes around the sun.（老师告诉我们地球绕着太阳转。）","semester":"upper"},{"id":"g3_english_007","chapter":"Unit 2 I think that mooncakes are delicious!","name":"used to 的用法","formula":"used to + 动词原形 表示\"过去常常做某事（现在不做了）\"","explanation":"used to do sth. 表示过去经常发生的动作或存在的状态，现在已经不那样了。否定形式：didn't use to do sth. 或 used not to do sth.。疑问形式：Did sb. use to do sth.? 或 Used sb. to do sth.?。be used to doing sth. 表示\"习惯于做某事\"（to是介词，后接动名词）。be used to do sth. 表示\"被用来做某事\"（被动语态）。","semester":"upper"},{"id":"g3_english_008","chapter":"Unit 3 Could you please tell me where the restrooms are?","name":"宾语从句的特殊疑问句形式","formula":"主句 + 特殊疑问词 + 主语 + 谓语 + 其他","explanation":"当宾语从句由特殊疑问句变来时，引导词就是特殊疑问词（what, who, whom, whose, which, when, where, why, how等），且从句必须用陈述语序。例如：I want to know where he lives.（我想知道他住在哪里。）注意：当特殊疑问词本身就是从句的主语时，语序不变。例如：I don't know what is wrong with him.（我不知道他怎么了。）","semester":"upper"},{"id":"g3_english_009","chapter":"Unit 3 Could you please tell me where the restrooms are?","name":"礼貌地请求帮助的表达","formula":"Could you please do sth.? / Would you mind doing sth.? / Excuse me, could you tell me...?","explanation":"在英语中，向陌生人或长辈请求帮助时要用礼貌的表达。\"Could you please + 动词原形\"比\"Can you...\"更委婉客气。\"Would you mind + doing\"表示\"你介意……吗？\"。问路时常用\"Excuse me, could you tell me how to get to...?\"或\"Could you please tell me where...is?\"。回答时，如果可以帮忙，常用\"Sure. / Certainly. / Of course. / No problem.\"等；如果不能帮忙，常用\"Sorry, I'm new here too.\"等。","semester":"upper"},{"id":"g3_english_010","chapter":"Unit 3 Could you please tell me where the restrooms are?","name":"not...until... 句型","formula":"not...until... 表示\"直到……才……\"","explanation":"not...until...引导时间状语从句，表示主句的动作直到until所表示的时间才发生。例如：I didn't go to bed until I finished my homework last night.（昨晚我直到写完作业才睡觉。）当主句是一般将来时时，从句用一般现在时表示将来。until还可以作介词，后面接表示时间的名词。until引导的从句可用before替换，但语气上有区别：until侧重动作的延续，before侧重时间的先后。","semester":"upper"},{"id":"g3_english_011","chapter":"Unit 4 I used to be afraid of the dark.","name":"used to 的反义疑问句","formula":"主语 + used to do..., didn't + 主语？/ usedn't + 主语？","explanation":"含有used to的句子，其反义疑问句的附加疑问部分用didn't + 主语（美式英语常用）或usedn't + 主语（英式英语常用）。例如：He used to be a teacher, didn't he? / usedn't he?（他过去是老师，对吗？）。注意：There used to be...句型的反义疑问句用didn't there? 或 usedn't there?。例如：There used to be a park here, didn't there?（这里以前有个公园，对吗？）","semester":"upper"},{"id":"g3_english_012","chapter":"Unit 4 I used to be afraid of the dark.","name":"be afraid 的用法","formula":"be afraid of + 名词/动名词；be afraid to do sth.；be afraid that + 从句","explanation":"be afraid表示\"害怕、担心\"。be afraid of sth./doing sth. 表示\"害怕某事/做某事\"，侧重害怕的心理或担心某种结果。be afraid to do sth. 表示\"不敢做某事\"，侧重没有勇气做。be afraid that... 表示\"担心/恐怕……\"，that后接从句。I'm afraid so. / I'm afraid not. 是口语中常用的简略答语，意为\"恐怕是这样/恐怕不是这样\"。","semester":"upper"},{"id":"g3_english_013","chapter":"Unit 4 I used to be afraid of the dark.","name":"动名词作宾语","formula":"enjoy/finish/practice/mind/suggest/consider/avoid等 + doing sth.","explanation":"英语中有些动词后面只能接动名词（v.ing形式）作宾语，不能接不定式。常见的有：enjoy（喜欢）、finish（完成）、practice（练习）、mind（介意）、suggest（建议）、consider（考虑）、avoid（避免）、miss（错过/想念）、keep（保持）、allow（允许）、admit（承认）、deny（否认）、imagine（想象）等。还有一些短语如be good at、be interested in、be used to（习惯于）、look forward to、pay attention to等后面也接动名词。","semester":"upper"},{"id":"g3_english_014","chapter":"Unit 5 What are the shirts made of?","name":"被动语态的基本结构","formula":"be + 及物动词的过去分词","explanation":"被动语态表示主语是动作的承受者。各种时态的被动语态：1. 一般现在时：am/is/are + 过去分词；2. 一般过去时：was/were + 过去分词；3. 一般将来时：will be + 过去分词 或 am/is/are going to be + 过去分词；4. 现在进行时：am/is/are being + 过去分词；5. 过去进行时：was/were being + 过去分词；6. 现在完成时：have/has been + 过去分词；7. 情态动词：情态动词 + be + 过去分词。","semester":"upper"},{"id":"g3_english_015","chapter":"Unit 5 What are the shirts made of?","name":"be made of/from/in/by/into 的区别","formula":"be made of（看得出原料）/ be made from（看不出原料）/ be made in（产地）/ be made by（制造者）/ be made into（被制成）","explanation":"be made of表示\"由……制成\"，能看出原材料（物理变化），如：The table is made of wood.（这张桌子是木制的。）be made from表示\"由……制成\"，看不出原材料（化学变化），如：Paper is made from wood.（纸是木头做的。）be made in表示\"在某地制造\"，如：This car is made in Germany.（这辆车是德国制造的。）be made by表示\"被某人制造\"。be made into表示\"被制成……\"。","semester":"upper"},{"id":"g3_english_016","chapter":"Unit 5 What are the shirts made of?","name":"被动语态与主动语态的转换","formula":"主动：主语 + 谓语 + 宾语 → 被动：宾语（变主语） + be + 过去分词 + by + 主语（变宾语）","explanation":"主动语态变被动语态的步骤：1. 把主动句的宾语变为被动句的主语；2. 把谓语变为\"be + 过去分词\"形式，时态与原句一致；3. 把主动句的主语变为by的宾语（代词用宾格），放在句末（by短语在不需要强调动作执行者时可省略）。注意：1. 双宾语的被动语态：可把间接宾语变为主语，直接宾语保留；也可把直接宾语变为主语，间接宾语前加to/for。2. 感官动词和使役动词的被动语态要还原to。","semester":"upper"},{"id":"g3_english_017","chapter":"Unit 6 When was it invented?","name":"一般过去时的被动语态","formula":"was/were + 及物动词的过去分词","explanation":"一般过去时的被动语态表示过去某个时间主语被做了某事。结构：主语 + was/were + 过去分词 + 其他。例如：The telephone was invented by Alexander Graham Bell in 1876.（电话是由亚历山大·格雷厄姆·贝尔在1876年发明的。）一般疑问句：Was/Were + 主语 + 过去分词 + 其他？否定句：主语 + was/were + not + 过去分词 + 其他。","semester":"upper"},{"id":"g3_english_018","chapter":"Unit 6 When was it invented?","name":"invent/discover/find 的区别","formula":"invent（发明，创造新事物）/ discover（发现，本来就存在）/ find（找到，丢失的东西）","explanation":"invent意为\"发明\"，指创造出前所未有的新事物，如发明机器、工具、方法等。discover意为\"发现\"，指发现本来就存在但以前不为人知的事物，如发现科学规律、新大陆等。find意为\"找到、发现\"，指经过寻找后找到丢失或失踪的人或物，侧重结果。find out意为\"查明、弄清楚\"，指经过调查、研究、计算等后发现或查明某事。","semester":"upper"},{"id":"g3_english_019","chapter":"Unit 6 When was it invented?","name":"It is said that... 句型","formula":"It is said that + 从句 表示\"据说……\"","explanation":"It is said that...是一个常用句型，it作形式主语，真正的主语是that引导的主语从句。类似的结构还有：It is reported that...（据报道……）、It is believed that...（人们认为……）、It is known that...（众所周知……）、It is supposed that...（据推测……）、It is hoped that...（人们希望……）等。这些结构都可以转换为\"People say/believe/know + that从句\"或\"sb. be said/believed/known to do sth.\"。","semester":"upper"},{"id":"g3_english_020","chapter":"Unit 7 Teenagers should be allowed to choose their own clothes.","name":"情态动词的被动语态","formula":"情态动词 + be + 及物动词的过去分词","explanation":"情态动词的被动语态表示\"主语应该/能够/必须被……\"。结构：主语 + 情态动词（should/can/must/may等） + be + 过去分词 + 其他。例如：Teenagers should be allowed to choose their own clothes.（青少年应该被允许选择自己的衣服。）否定式：主语 + 情态动词 + not + be + 过去分词。一般疑问句：情态动词 + 主语 + be + 过去分词？","semester":"upper"},{"id":"g3_english_021","chapter":"Unit 7 Teenagers should be allowed to choose their own clothes.","name":"allow 的用法","formula":"allow doing sth. / allow sb. to do sth. / sb. be allowed to do sth.","explanation":"allow作动词，意为\"允许\"。1. allow doing sth. 允许做某事，如：We don't allow smoking here.（我们这里不允许抽烟。）2. allow sb. to do sth. 允许某人做某事，如：My parents allow me to watch TV on weekends.（我父母允许我周末看电视。）3. sb. be allowed to do sth. 某人被允许做某事（被动语态），如：Students are not allowed to use mobile phones in class.（学生不允许在课堂上使用手机。）","semester":"upper"},{"id":"g3_english_022","chapter":"Unit 7 Teenagers should be allowed to choose their own clothes.","name":"get sth. done 的用法","formula":"get + 宾语 + 过去分词 表示\"让别人做某事\"或\"使某事被做\"","explanation":"get sth. done结构表示\"使某事被做\"，通常主语不是动作的执行者，而是让别人做。这里的过去分词作宾语补足语，与宾语之间是被动关系。例如：I need to get my hair cut.（我需要理发。=我需要让别人给我理发。）I will get my bike repaired tomorrow.（我明天要让人修我的自行车。）类似的结构还有have sth. done，意思基本相同。","semester":"upper"},{"id":"g3_english_023","chapter":"Unit 8 It must belong to Carla.","name":"情态动词表示推测","formula":"must（肯定，90%）/ may might could（可能，40-60%）/ can't（不可能，0%） + 动词原形","explanation":"情态动词表示对现在情况的推测时，后面接动词原形。must表示肯定的推测，意为\"一定、肯定\"，只用于肯定句。may/might/could表示可能性的推测，意为\"可能、也许\"，might比may语气更弱，可能性更小。can't表示否定的推测，意为\"不可能\"，语气肯定。对现在正在进行的动作推测：情态动词 + be + doing。对过去事情的推测：情态动词 + have + 过去分词。","semester":"upper"},{"id":"g3_english_024","chapter":"Unit 8 It must belong to Carla.","name":"belong to 的用法","formula":"belong to sb. 表示\"属于某人\"","explanation":"belong to意为\"属于\"，后面接名词或代词宾格。注意：1. belong to没有被动语态，不能说be belonged to。2. belong to没有进行时态。3. 对belong to后面的人提问用who/whom，对物提问用what。例如：The book belongs to me.（这本书是我的。）= The book is mine.（这本书是我的。）Who does this backpack belong to?（这个背包是谁的？）= Whose backpack is this?（这是谁的背包？）","semester":"upper"},{"id":"g3_english_025","chapter":"Unit 9 I like music that I can dance to.","name":"定语从句（that/who/which）","formula":"先行词 + that/which/who + 从句（修饰名词或代词）","explanation":"定语从句在复合句中修饰名词或代词，被修饰的词叫先行词。关系代词有who（指人，作主语或宾语）、whom（指人，作宾语）、whose（指人或物，作定语）、that（指人或物，作主语或宾语）、which（指物，作主语或宾语）。关系代词作主语时不能省略，作宾语时可以省略。注意：只能用that的情况：先行词是不定代词时、先行词被最高级或序数词修饰时、先行词既有人又有物时、先行词被the only/the very修饰时。","semester":"lower"},{"id":"g3_english_026","chapter":"Unit 9 I like music that I can dance to.","name":"prefer 的用法","formula":"prefer sth. / prefer doing sth. / prefer to do sth. / prefer...to... / prefer to do...rather than do...","explanation":"prefer作动词，意为\"更喜欢、宁愿\"。1. prefer sth. 更喜欢某物，相当于like sth. better。2. prefer doing sth. / prefer to do sth. 更喜欢做某事。3. prefer A to B 喜欢A胜过B（to是介词），如：I prefer tea to coffee.（与咖啡相比，我更喜欢茶。）4. prefer doing A to doing B 喜欢做A胜过做B。5. prefer to do A rather than do B 宁愿做A也不愿做B。","semester":"lower"},{"id":"g3_english_027","chapter":"Unit 9 I like music that I can dance to.","name":"定语从句中的主谓一致","formula":"关系代词作主语时，从句谓语动词的数与先行词保持一致","explanation":"在定语从句中，当关系代词作主语时，从句谓语动词的人称和数要与先行词保持一致。例如：I prefer singers who write their own songs.（我更喜欢自己写歌的歌手。）先行词singers是复数，从句谓语用write。The book that is on the desk is mine.（桌上的那本书是我的。）先行词book是单数，从句谓语用is。注意：one of + 复数名词 + 定语从句，从句谓语用复数；the only one of + 复数名词 + 定语从句，从句谓语用单数。","semester":"lower"},{"id":"g3_english_028","chapter":"Unit 10 You're supposed to shake hands.","name":"be supposed to 的用法","formula":"be supposed to + 动词原形 表示\"应该做某事、被期望做某事\"","explanation":"be supposed to do sth. 意为\"应该做某事\"、\"被期望做某事\"，表示根据规定、习惯、安排等应该做的事，相当于should，但语气更正式。否定形式be not supposed to do sth. 意为\"不应该做某事\"、\"被禁止做某事\"。例如：You are supposed to arrive on time.（你应该准时到达。）You are not supposed to smoke here.（你不应该在这里抽烟。）be supposed to have done sth. 表示\"本应该做某事（但实际上没做）\"，含有责备的意味。","semester":"lower"},{"id":"g3_english_029","chapter":"Unit 10 You're supposed to shake hands.","name":"it作形式宾语的用法","formula":"主语 + 谓语 + it + 形容词/名词 + to do sth. / that从句","explanation":"当动词不定式或that从句作宾语且后面有宾语补足语时，常用it作形式宾语，把真正的宾语（不定式或从句）放在句末。结构：主语 + 谓语 + it + 形容词/名词 + 真正的宾语。常见的能接形式宾语的动词有find, think, make, feel, consider等。例如：I find it difficult to learn English well.（我发现学好英语很难。）I think it important that we should learn English well.（我认为我们学好英语很重要。）","semester":"lower"},{"id":"g3_english_030","chapter":"Unit 10 You're supposed to shake hands.","name":"though/although 的用法","formula":"though/although 虽然……，不能与but连用","explanation":"though和although都表示\"虽然、尽管\"，引导让步状语从句，在大多数情况下可以互换使用。although比though更正式，多用于句首。though可用于句末，意为\"可是、不过\"，although不能。注意：汉语中说\"虽然……但是……\"，但英语中though/although不能与but连用，二者只能用其一。但可以与yet/still连用。例如：Although he is tired, he still goes on working.（虽然他累了，但他仍然继续工作。）","semester":"lower"},{"id":"g3_english_031","chapter":"Unit 11 Sad movies make me cry.","name":"使役动词make的用法","formula":"make sb. do sth. / make sb. + 形容词 / make sb. + 名词 / be made to do sth.（被动）","explanation":"make作使役动词，意为\"使、让\"。1. make sb. do sth. 使某人做某事，省略to的不定式作宾补。注意：被动语态中要还原to，即sb. be made to do sth.。2. make sb./sth. + 形容词，意为\"使某人/某物处于某种状态\"，如：The bad news made him sad.（这个坏消息使他伤心。）3. make sb./sth. + 名词，意为\"使某人成为……、使某物成为……\"。4. make it + 形容词 + to do sth. 表示\"使做某事变得……\"。","semester":"lower"},{"id":"g3_english_032","chapter":"Unit 11 Sad movies make me cry.","name":"would rather 的用法","formula":"would rather do sth. / would rather do sth. than do sth.","explanation":"would rather意为\"宁愿、宁可\"，后面接动词原形。常与than连用，构成would rather do A than do B，意为\"宁愿做A也不愿做B\"。例如：I would rather stay at home than go out.（我宁愿待在家里也不愿出去。）注意：would rather...than...连接两个动词时，动词形式要一致。would rather后面还可以接从句，从句用虚拟语气（用过去时表示现在或将来的愿望，用过去完成时表示过去的愿望）。","semester":"lower"},{"id":"g3_english_033","chapter":"Unit 11 Sad movies make me cry.","name":"neither...nor... 的用法","formula":"neither A nor B 既不A也不B（连接两个相同的成分）","explanation":"neither...nor...表示\"既不……也不……\"，是否定意义的连词，连接两个并列的成分。当连接两个主语时，谓语动词的数与最近的主语保持一致（就近原则）。例如：Neither he nor I am right.（他和我都不对。）Neither I nor he is right.（我和他都不对。）类似结构的还有either...or...（要么……要么……）、not only...but also...（不仅……而且……），都遵循就近原则。","semester":"lower"},{"id":"g3_english_034","chapter":"Unit 12 Life is full of the unexpected.","name":"过去完成时","formula":"had + 过去分词 表示\"过去的过去\"","explanation":"过去完成时表示在过去某一时间或动作之前已经发生或完成的动作，即\"过去的过去\"。结构：主语 + had + 过去分词 + 其他。常与by the time, before, when, by the end of + 过去时间等连用。例如：By the time I got to the bus stop, the bus had already left.（当我到达公交车站时，公交车已经开走了。）过去完成时还可以表示从过去某一时间开始，持续到过去另一时间的动作或状态，常与for, since连用。","semester":"lower"},{"id":"g3_english_035","chapter":"Unit 12 Life is full of the unexpected.","name":"by the time 的用法","formula":"by the time + 一般过去时从句，主句用过去完成时","explanation":"by the time意为\"到……时候为止\"，引导时间状语从句。如果从句用一般过去时，主句常用过去完成时，表示从句的动作发生在过去，主句的动作在从句动作之前就已经完成了。例如：By the time I arrived, the meeting had already begun.（当我到达时，会议已经开始了。）如果从句用一般现在时，主句用将来完成时或一般将来时。例如：By the time you come back, I will have finished the work.（到你回来时，我将已经完成工作了。）","semester":"lower"},{"id":"g3_english_036","chapter":"Unit 12 Life is full of the unexpected.","name":"be full of / be filled with 的区别","formula":"be full of 充满……（状态）/ be filled with 被……充满（动作）","explanation":"be full of表示\"充满……\"，强调状态，full是形容词。be filled with表示\"被……充满\"，强调动作，是被动语态。两者意思基本相同，常可互换使用。例如：The bottle is full of water. = The bottle is filled with water.（瓶子里装满了水。）另外，fill...with...是主动结构，意为\"用……装满……\"，如：He filled the bottle with water.（他把瓶子装满了水。）","semester":"lower"},{"id":"g3_english_037","chapter":"Unit 13 We're trying to save the earth!","name":"现在进行时表示将来","formula":"am/is/are + 现在分词（表示按计划、安排将要发生的动作）","explanation":"某些表示位置移动的动词，如go, come, leave, arrive, fly, start, move, travel等，常用现在进行时表示按计划或安排即将发生的动作，通常有一个表示将来的时间状语。例如：I'm leaving for Beijing tomorrow.（我明天要去北京。）The train is arriving soon.（火车很快就要到了。）注意：不是所有动词都能用进行时表示将来，只有表示位置移动或开始、结束的动词才可以。","semester":"lower"},{"id":"g3_english_038","chapter":"Unit 13 We're trying to save the earth!","name":"play a part in 的用法","formula":"play a part in (doing) sth. 表示\"在……中起作用/参与做某事\"","explanation":"play a part in (doing) sth. 意为\"在……中扮演角色/起作用/参与\"。part前可用different, important, necessary等形容词修饰。例如：Everyone should play a part in protecting the environment.（每个人都应该参与保护环境。）Computer plays an important part in our daily life.（电脑在我们的日常生活中起着重要作用。）类似的表达还有play a role in，意思和用法基本相同。","semester":"lower"},{"id":"g3_english_039","chapter":"Unit 13 We're trying to save the earth!","name":"现在完成进行时","formula":"have/has been + 现在分词 表示\"一直做某事\"","explanation":"现在完成进行时表示从过去某一时间开始一直延续到现在的动作，这个动作可能刚停止，也可能还在继续进行。结构：主语 + have/has been + 现在分词。常与all day, all morning, recently, these days, for + 时间段, since + 时间点等连用。例如：I have been reading this book all day.（我一整天都在读这本书。）与现在完成时的区别：现在完成时强调动作的结果或完成，现在完成进行时强调动作的持续或一直在做。","semester":"lower"},{"id":"g3_english_040","chapter":"Unit 14 I remember meeting all of you in Grade 7.","name":"remember/forget + to do/doing 的区别","formula":"remember/forget to do 记得/忘记要做某事（未做）；remember/forget doing 记得/忘记做过某事（已做）","explanation":"remember/forget后面接不定式（to do）表示\"记得/忘记要去做某事\"（事情还没做）；接动名词（doing）表示\"记得/忘记做过某事\"（事情已经做了）。例如：Please remember to close the door when you leave.（你离开时请记得关门。——还没关）I remember closing the door when I left.（我记得我离开时关了门的。——已经关了）类似用法的还有stop/go on/regret/mean/try等，但含义不同。","semester":"lower"},{"id":"g3_english_041","chapter":"Unit 14 I remember meeting all of you in Grade 7.","name":"look forward to 的用法","formula":"look forward to + 名词/代词/动名词 表示\"期待、盼望\"","explanation":"look forward to是固定短语，意为\"盼望、期待\"，其中to是介词，后面接名词、代词或动名词（v.ing形式），不能接动词原形。例如：I'm looking forward to your reply.（我期待着你的回复。）I'm looking forward to hearing from you soon.（我期待着很快收到你的来信。）注意区分：used to do（过去常常做）、be used to doing（习惯于做）、be used to do（被用来做）。","semester":"lower"},{"id":"g3_english_042","chapter":"Unit 14 I remember meeting all of you in Grade 7.","name":"wish/hope 的区别","formula":"wish + to do / sb. to do / that从句（虚拟）；hope + to do / that从句（真实）","explanation":"wish和hope都表示\"希望\"，但用法有区别：1. 都可接不定式作宾语：wish to do / hope to do。2. wish可接sb. to do，hope不能。3. 都可接that从句：wish后接从句用虚拟语气（用过去时表示现在不太可能实现的愿望，用过去完成时表示过去没实现的愿望）；hope后接从句用陈述语气，表示有可能实现的希望。4. wish后可接双宾语，意为\"祝愿\"，如：I wish you success.（祝你成功。）hope不能。","semester":"lower"},{"id":"g3_english_043","chapter":"九年级拓展语法一","name":"非谓语动词综合","formula":"动词不定式（to do）、动名词（doing）、分词（现在分词doing/过去分词done）","explanation":"非谓语动词不能作谓语，但可以作主语、宾语、表语、定语、状语、宾语补足语等。动词不定式（to do）表示具体的、将要发生的动作。动名词（doing）表示抽象的、经常性的动作。现在分词（doing）表示主动、进行；过去分词（done）表示被动、完成。接不定式作宾语的动词：want, hope, wish, decide, plan, expect, afford, agree, refuse等。接动名词作宾语的动词：enjoy, finish, practice, mind, suggest, avoid, consider, keep等。","semester":"lower"},{"id":"g3_english_044","chapter":"九年级拓展语法二","name":"主谓一致","formula":"语法一致、意义一致、就近一致","explanation":"主谓一致是指主语和谓语在人称和数上保持一致。基本原则：1. 语法一致原则：主语是单数，谓语用单数；主语是复数，谓语用复数。2. 意义一致原则：主语形式上是单数但意义上是复数，谓语用复数（如people, police, family等集体名词）；主语形式上是复数但意义上是单数，谓语用单数（如news, maths, physics, the United States等）。3. 就近原则：谓语动词的数与离它最近的主语一致，如there be句型、either...or..., neither...nor..., not only...but also...等。","semester":"lower"},{"id":"g3_english_045","chapter":"九年级拓展语法三","name":"状语从句综合","formula":"时间、条件、原因、结果、目的、让步、比较、方式、地点状语从句","explanation":"状语从句在复合句中作状语，修饰主句的动词、形容词、副词等。时间状语从句：when, while, as, before, after, since, until, as soon as等。条件状语从句：if, unless, as long as等。原因状语从句：because, since, as等。结果状语从句：so...that..., such...that...等。目的状语从句：so that, in order that等。让步状语从句：though, although, even though, even if等。比较状语从句：than, as...as..., not so/as...as...等。注意：时间和条件状语从句中，主句用将来时，从句用一般现在时表示将来。","semester":"lower"},{"id":"g3_english_046","chapter":"九年级拓展语法四","name":"定语从句综合","formula":"关系代词：who, whom, whose, which, that；关系副词：when, where, why","explanation":"定语从句修饰名词或代词（先行词）。关系代词：who（指人，主语/宾语）、whom（指人，宾语）、whose（指人/物，定语）、which（指物，主语/宾语）、that（指人/物，主语/宾语）。关系副词：when（时间状语）、where（地点状语）、why（原因状语）。关系代词作宾语时可省略，作主语时不能省略。只能用that的情况：先行词是不定代词、先行词被最高级/序数词修饰、先行词既有人又有物、先行词被the only/the very修饰。只能用which的情况：非限制性定语从句、介词 + which。","semester":"lower"},{"id":"g3_english_047","chapter":"九年级拓展语法五","name":"名词性从句综合","formula":"主语从句、宾语从句、表语从句、同位语从句","explanation":"名词性从句在复合句中起名词作用，包括主语从句、宾语从句、表语从句和同位语从句。引导词有that（陈述句，无意义，宾语从句中常省略）、if/whether（一般疑问句，意为\"是否\"，只用whether的情况：介词后、or not、句首、作表语/同位语、后接不定式）、连接代词what, who, whom, whose, which（有意义，在从句中作主语/宾语/定语）、连接副词when, where, why, how（有意义，在从句中作状语）。语序：陈述语序。时态：主现从不限，主过从必过，真理永一现。","semester":"lower"},{"id":"g3_english_048","chapter":"九年级拓展语法六","name":"虚拟语气","formula":"与现在/过去/将来事实相反的虚拟条件句","explanation":"虚拟语气表示与事实相反的假设或主观愿望。虚拟条件句的构成：1. 与现在事实相反：从句用过去式（be动词用were），主句用would/could/should/might + 动词原形。2. 与过去事实相反：从句用had + 过去分词，主句用would/could/should/might have + 过去分词。3. 与将来事实相反：从句用过去式或should + 动词原形或were to + 动词原形，主句用would/could/should/might + 动词原形。wish后面的宾语从句也用虚拟语气。注意：if省略时，从句要倒装。","semester":"lower"}];

        // ==================== 内嵌例题数据 ====================
        const DATA_EXAMPLES = [{"id":"g3_english_001_ex01","knowledge_id":"g3_english_001","question":"语法选择题：I improve my English ______ listening to English songs every day.\nA. by\nB. in\nC. on\nD. with","answer":"答案：A\n解析：句意：我通过每天听英文歌来提高我的英语水平。by + 动名词表示\"通过某种方式、手段\"，是固定搭配。in表示\"用某种语言\"，on表示\"在……上\"，with表示\"用某种工具\"，均不符合题意。"},{"id":"g3_english_001_ex02","knowledge_id":"g3_english_001","question":"填空题：你可以通过做笔记来学习语法。\nYou can learn grammar ______ ______ notes.","answer":"答案：by taking\n解析：by doing sth. 表示\"通过做某事\"，take notes是固定短语\"记笔记\"。by是介词，后面要接动名词形式，所以take要变为taking。"},{"id":"g3_english_001_ex03","knowledge_id":"g3_english_001","question":"语法选择题：—How do you study for a test?\n—______ working with friends.\nA. By\nB. With\nC. On\nD. At","answer":"答案：A\n解析：问句用how提问\"如何、怎样\"，答语要用by + 动名词来回答方式、手段。by working with friends意为\"通过和朋友一起学习\"。"},{"id":"g3_english_001_ex04","knowledge_id":"g3_english_001","question":"句型转换题：She learns Chinese by reading Chinese newspapers.（对画线部分提问）\n______ ______ she ______ Chinese?","answer":"答案：How does; learn\n解析：对by doing sth.（方式状语）提问要用疑问词how。原句是一般现在时，主语是第三人称单数she，所以助动词用does，后面的动词learns还原为learn。"},{"id":"g3_english_001_ex05","knowledge_id":"g3_english_001","question":"翻译题：我们通过互相练习对话来提高英语口语。","answer":"答案：We improve our spoken English by practicing conversations with each other.\n解析：\"通过做某事\"用by doing sth.结构。\"英语口语\"是spoken/oral English，\"互相练习对话\"是practice conversations with each other。by是介词，后面的动词practice要变为practicing。"},{"id":"g3_english_001_ex06","knowledge_id":"g3_english_001","question":"语法选择题：The best way ______ English is using it every day.\nA. learn\nB. learning\nC. to learn\nD. by learning","answer":"答案：C\n解析：the best way to do sth. 是固定搭配，意为\"做某事的最好方法\"，其中to do sth.是不定式作后置定语修饰way。by learning虽然也表示方式，但不能直接放在way后面作定语。"},{"id":"g3_english_001_ex07","knowledge_id":"g3_english_001","question":"填空题：他通过制作单词卡片来记忆新单词。\nHe memorizes new words ______ ______ word cards.","answer":"答案：by making\n解析：by doing sth. 表示\"通过做某事\"。make word cards是\"制作单词卡片\"，by后面接动名词，所以make变为making。"},{"id":"g3_english_001_ex08","knowledge_id":"g3_english_001","question":"语法选择题：______ taking a walk after supper, you can lose weight easily.\nA. By\nB. In\nC. On\nD. With","answer":"答案：A\n解析：句意：通过晚饭后散步，你可以轻松减肥。by + 动名词放在句首，表示\"通过……方式\"，作方式状语。注意句首首字母大写。"},{"id":"g3_english_001_ex09","knowledge_id":"g3_english_001","question":"句型转换题：I study grammar by doing exercises.（改为否定句）\nI ______ ______ grammar by doing exercises.","answer":"答案：don't study\n解析：原句是一般现在时，主语是第一人称I，变否定句要在动词前加don't，后面的动词studies还原为study。by doing结构不变。"},{"id":"g3_english_001_ex10","knowledge_id":"g3_english_001","question":"翻译题：你是怎样为英语考试而学习的？我通过向老师求助来学习。","answer":"答案：—How do you study for an English test?\n—I study by asking the teacher for help.\n解析：询问方式用how提问。\"为考试而学习\"是study for a test，\"向老师求助\"是ask the teacher for help。by是介词，后面的动词ask要变为动名词asking。"},{"id":"g3_english_002_ex01","knowledge_id":"g3_english_002","question":"语法选择题：I ______ this book two days ago, and I ______ it twice already.\nA. bought; have read\nB. have bought; read\nC. bought; read\nD. have bought; have read","answer":"答案：A\n解析：第一空有two days ago（两天前），表示过去某个具体时间发生的动作，用一般过去时bought；第二空有already（已经），表示到现在为止已经完成的动作，强调对现在的影响，用现在完成时have read。"},{"id":"g3_english_002_ex02","knowledge_id":"g3_english_002","question":"填空题：用所给动词的适当形式填空\n—______ you ever ______ (visit) the Great Wall?\n—Yes, I ______ (go) there last summer.","answer":"答案：Have; visited; went\n解析：第一句有ever（曾经），表示到目前为止的经历，用现在完成时Have you ever visited...；第二句有last summer（去年夏天），表示过去具体时间发生的动作，用一般过去时went。"},{"id":"g3_english_002_ex03","knowledge_id":"g3_english_002","question":"语法选择题：My uncle ______ in this city since 2010.\nA. lives\nB. lived\nC. has lived\nD. is living","answer":"答案：C\n解析：since + 过去时间点（自从2010年以来），表示从过去某一时间开始持续到现在的动作或状态，要用现在完成时has lived。"},{"id":"g3_english_002_ex04","knowledge_id":"g3_english_002","question":"句型转换题：I have already finished my homework.（改为一般疑问句并作否定回答）\n—______ you ______ your homework ______?\n—No, I ______.","answer":"答案：Have; finished; yet; haven't\n解析：现在完成时变一般疑问句要把have/has提前，already要变为yet（yet用于疑问句和否定句中）。否定回答用No, I haven't."},{"id":"g3_english_002_ex05","knowledge_id":"g3_english_002","question":"翻译题：我已经看过这部电影了，我是上个月看的。","answer":"答案：I have already watched this movie. I watched it last month.\n解析：第一句\"已经看过\"强调到现在为止的结果，用现在完成时have already watched；第二句有具体的过去时间\"上个月\"，用一般过去时watched。"},{"id":"g3_english_002_ex06","knowledge_id":"g3_english_002","question":"语法选择题：—Where is Tom?\n—He ______ to the library. He ______ there ten minutes ago.\nA. has been; went\nB. has gone; went\nC. went; has gone\nD. went; has been","answer":"答案：B\n解析：第一空表示Tom去了图书馆（还没回来），用has gone to；第二空有ten minutes ago（十分钟前），表示过去具体时间的动作，用一般过去时went。has been to表示\"去过某地（已回来）\"。"},{"id":"g3_english_002_ex07","knowledge_id":"g3_english_002","question":"填空题：用for或since填空\n1. She has lived in Beijing ______ ten years.\n2. He has worked here ______ he graduated from college.","answer":"答案：for; since\n解析：for + 时间段（ten years十年），表示动作持续了多长时间；since + 时间点/从句（he graduated from college他大学毕业），表示动作从什么时候开始。两者都是现在完成时的标志词。"},{"id":"g3_english_002_ex08","knowledge_id":"g3_english_002","question":"语法选择题：He ______ his homework yesterday, so he ______ free now.\nA. finished; is\nB. has finished; is\nC. finished; was\nD. has finished; was","answer":"答案：A\n解析：第一空有yesterday（昨天），用一般过去时finished；第二空有now（现在），表示现在的状态，用一般现在时is。现在完成时不能与yesterday等明确表示过去的时间状语连用。"},{"id":"g3_english_002_ex09","knowledge_id":"g3_english_002","question":"句型转换题：She arrived here three days ago.（改为同义句）\nShe ______ ______ here ______ three days.","answer":"答案：has been; for\n解析：原句用一般过去时表示三天前到达的动作。同义句用现在完成时表示\"她在这里已经三天了\"的状态。arrive是短暂性动词，不能与for+时间段连用，要变为延续性动词be。"},{"id":"g3_english_002_ex10","knowledge_id":"g3_english_002","question":"翻译题：你买这台电脑多久了？我买了两年了。","answer":"答案：—How long have you had this computer?\n—I have had it for two years.\n解析：how long提问多长时间，要用现在完成时。buy（买）是短暂性动词，不能与for+时间段连用，要变为延续性动词have。正确表达是have had，而不是have bought。"},{"id":"g3_english_003_ex01","knowledge_id":"g3_english_003","question":"语法选择题：The movie was ______ moving ______ all of us cried.\nA. so; that\nB. such; that\nC. too; to\nD. enough; to","answer":"答案：A\n解析：句意：这部电影太感人了，我们所有人都哭了。so + 形容词/副词 + that从句，表示\"如此……以至于……\"，that引导结果状语从句。moving是形容词，所以用so...that...。"},{"id":"g3_english_003_ex02","knowledge_id":"g3_english_003","question":"填空题：这个问题太难了，我解不出来。\nThe problem is ______ difficult ______ I can't work it out.","answer":"答案：so; that\n解析：so + 形容词（difficult） + that从句，表示\"如此……以至于……\"。so...that...引导结果状语从句，that后面接完整的句子。"},{"id":"g3_english_003_ex03","knowledge_id":"g3_english_003","question":"语法选择题：It is ______ an interesting book ______ I want to read it again.\nA. so; that\nB. such; that\nC. too; to\nD. very; that","answer":"答案：B\n解析：句意：这是一本如此有趣的书，我想再读一遍。such + a/an + 形容词 + 可数名词单数 + that从句，也表示\"如此……以至于……\"。an interesting book是名词短语，所以用such...that...。"},{"id":"g3_english_003_ex04","knowledge_id":"g3_english_003","question":"句型转换题：The boy is so young that he can't go to school.（改为简单句）\nThe boy is ______ young ______ go to school.","answer":"答案：too; to\n解析：so...that...（否定）可以与too...to...（太……而不能……）进行同义句转换。too后面接形容词或副词，to后面接动词原形。注意：too...to...本身含有否定意义，不需要再加not。"},{"id":"g3_english_003_ex05","knowledge_id":"g3_english_003","question":"翻译题：他跑得太快了，我追不上他。","answer":"答案：He ran so fast that I couldn't catch up with him.\n解析：so + 副词（fast） + that从句，表示\"如此……以至于……\"。fast是副词，修饰动词ran，所以用so...that...。\"追上\"是catch up with。"},{"id":"g3_english_003_ex06","knowledge_id":"g3_english_003","question":"语法选择题：There are ______ many people in the park ______ we can't find a place to sit.\nA. so; that\nB. such; that\nC. too; that\nD. very; that","answer":"答案：A\n解析：当名词前有many, much, few, little（表示数量多少）修饰时，要用so而不用such，即so many/much/few/little + 名词 + that从句。这里是so many people。"},{"id":"g3_english_003_ex07","knowledge_id":"g3_english_003","question":"填空题：用so或such填空\n1. She is ______ a good teacher that we all love her.\n2. She is ______ good that we all love her.","answer":"答案：such; so\n解析：第1题后面是a good teacher（名词短语），用such...that...；第2题后面是good（形容词），用so...that...。记忆口诀：such后接名词短语，so后接形副。"},{"id":"g3_english_003_ex08","knowledge_id":"g3_english_003","question":"语法选择题：He was ______ tired ______ he fell asleep as soon as he lay down.\nA. too; to\nB. so; that\nC. such; that\nD. enough; to","answer":"答案：B\n解析：句意：他太累了，一躺下就睡着了。tired是形容词，所以用so + 形容词 + that从句。that后面接的是完整的句子he fell asleep...，所以不能用too...to...（to后面接动词原形）。"},{"id":"g3_english_003_ex09","knowledge_id":"g3_english_003","question":"句型转换题：The box is so heavy that I can't carry it.（改为同义句）\nThe box is ______ heavy for me ______ carry.","answer":"答案：too; to\n解析：so...that...否定结构（如此……以至于不能……）可以转换为too...to...结构（太……而不能……）。注意：too...to...结构中，carry后面不能再加it，因为逻辑宾语就是句子的主语the box。"},{"id":"g3_english_003_ex10","knowledge_id":"g3_english_003","question":"翻译题：天气如此好，我们决定去野餐。","answer":"答案：The weather was so fine that we decided to have a picnic.\n或：It was such fine weather that we decided to have a picnic.\n解析：so + 形容词（fine） + that从句；或such + 形容词 + 不可数名词（fine weather） + that从句。weather是不可数名词，前面不能加a/an。"},{"id":"g3_english_004_ex01","knowledge_id":"g3_english_004","question":"语法选择题：I think ______ English is very important for us.\nA. that\nB. what\nC. which\nD. who","answer":"答案：A\n解析：句意：我认为英语对我们来说非常重要。that引导陈述句作宾语从句，that在从句中不充当任何成分，只起连接作用，在口语或非正式文体中常可省略。"},{"id":"g3_english_004_ex02","knowledge_id":"g3_english_004","question":"填空题：我知道他会来参加聚会。\nI know ______ he will come to the party.","answer":"答案：that\n解析：that引导宾语从句，从句是陈述句he will come to the party。that无实际意义，在句中可以省略。"},{"id":"g3_english_004_ex03","knowledge_id":"g3_english_004","question":"语法选择题：Can you tell me ______ I can get to the nearest hospital?\nA. that\nB. how\nC. what\nD. which","answer":"答案：B\n解析：句意：你能告诉我怎样才能到最近的医院吗？根据句意，宾语从句中缺少方式状语\"怎样、如何\"，所以用how引导。how在从句中作方式状语。"},{"id":"g3_english_004_ex04","knowledge_id":"g3_english_004","question":"句型转换题：\"I will come to your birthday party tomorrow,\" she said.（改为宾语从句）\nShe said ______ she ______ come to my birthday party the next day.","answer":"答案：that; would\n解析：直接引语是陈述句，变为间接引语时用that引导宾语从句，that可以省略。主句时态是一般过去时said，从句时态要相应调整：will变为would。"},{"id":"g3_english_004_ex05","knowledge_id":"g3_english_004","question":"翻译题：我相信我们的梦想会实现的。","answer":"答案：I believe that our dreams will come true.\n解析：that引导宾语从句，从句是陈述句our dreams will come true。\"实现\"是come true。that在句中可以省略。"},{"id":"g3_english_004_ex06","knowledge_id":"g3_english_004","question":"语法选择题：I don't know ______ he will come tomorrow. ______ he comes, I'll tell you.\nA. if; Whether\nB. whether; Whether\nC. if; That\nD. if; If","answer":"答案：D\n解析：第一空if/whether引导宾语从句，意为\"是否\"，两者都可以；第二空if引导条件状语从句，意为\"如果\"，不能用whether。所以选D。"},{"id":"g3_english_004_ex07","knowledge_id":"g3_english_004","question":"填空题：用that, if或whether填空\n1. I'm sure ______ he will pass the exam.\n2. I wonder ______ you can help me with my English.","answer":"答案：that; if/whether\n解析：第1题从句是陈述句，不缺少成分，用that引导，that可以省略；第2题从句有疑问语气\"是否\"，用if或whether引导。"},{"id":"g3_english_004_ex08","knowledge_id":"g3_english_004","question":"语法选择题：He asked me ______ I would like to go hiking with him this weekend.\nA. that\nB. if\nC. what\nD. where","answer":"答案：B\n解析：句意：他问我这个周末是否愿意和他一起去徒步旅行。asked后面的宾语从句有疑问语气\"是否\"，所以用if或whether引导。"},{"id":"g3_english_004_ex09","knowledge_id":"g3_english_004","question":"句型转换题：Does she like reading? I want to know.（合并为一句）\nI want to know ______ she ______ reading.","answer":"答案：if/whether; likes\n解析：一般疑问句变为宾语从句，用if或whether引导，意为\"是否\"，从句要用陈述语序。主句是一般现在时，从句时态保持不变，用likes。"},{"id":"g3_english_004_ex10","knowledge_id":"g3_english_004","question":"翻译题：你知道他住在哪里吗？对不起，我不知道。","answer":"答案：—Do you know where he lives?\n—Sorry, I don't know.\n解析：宾语从句由特殊疑问句转化而来，用疑问词where引导，从句必须用陈述语序（where he lives而不是where does he live）。"},{"id":"g3_english_005_ex01","knowledge_id":"g3_english_005","question":"语法选择题：______ beautiful the flowers are!\nA. What\nB. What a\nC. How\nD. How a","answer":"答案：C\n解析：句意：这些花多么漂亮啊！How引导的感叹句结构为：How + 形容词/副词 + 主语 + 谓语！beautiful是形容词，所以用How。"},{"id":"g3_english_005_ex02","knowledge_id":"g3_english_005","question":"填空题：多么有趣的一本书啊！\n______ ______ interesting book it is!","answer":"答案：What an\n解析：What引导的感叹句结构之一：What + a/an + 形容词 + 可数名词单数 + 主语 + 谓语！interesting以元音音素开头，所以用an。"},{"id":"g3_english_005_ex03","knowledge_id":"g3_english_005","question":"语法选择题：______ good news it is!\nA. What\nB. What a\nC. How\nD. How a","answer":"答案：A\n解析：news是不可数名词，不能用a/an修饰。What引导的感叹句结构：What + 形容词 + 不可数名词 + 主语 + 谓语！所以选What。"},{"id":"g3_english_005_ex04","knowledge_id":"g3_english_005","question":"句型转换题：The girl is very clever.（改为感叹句）\n______ ______ the girl is!\n或 ______ ______ clever girl she is!","answer":"答案：How clever; What a\n解析：How + 形容词（clever） + 主语 + 谓语！或 What + a + 形容词（clever） + 可数名词单数（girl） + 主语 + 谓语！两种结构都可以表达感叹。"},{"id":"g3_english_005_ex05","knowledge_id":"g3_english_005","question":"翻译题：根据所学感叹句知识，将句子「今天的天气真好啊！」翻译成英语","answer":"答案：What fine weather it is today!\n或 How fine the weather is today!\n解析：weather是不可数名词，用What + 形容词 + 不可数名词 + 主语 + 谓语！结构，不能加a/an。也可以用How + 形容词 + 主语 + 谓语！结构。"},{"id":"g3_english_005_ex06","knowledge_id":"g3_english_005","question":"语法选择题：______ hard they are working!\nA. What\nB. What a\nC. How\nD. How a","answer":"答案：C\n解析：hard在这里是副词，修饰动词working。How引导的感叹句结构：How + 副词 + 主语 + 谓语！所以用How。"},{"id":"g3_english_005_ex07","knowledge_id":"g3_english_005","question":"填空题：用What或How填空\n1. ______ delicious the food tastes!\n2. ______ delicious food it is!","answer":"答案：How; What\n解析：第1题后面直接跟形容词delicious，然后是主语the food，用How + 形容词 + 主语 + 谓语！结构；第2题后面是delicious food（形容词+名词），用What + 形容词 + 不可数名词 + 主语 + 谓语！结构。"},{"id":"g3_english_005_ex08","knowledge_id":"g3_english_005","question":"语法选择题：______ beautiful dresses they are!\nA. What\nB. What a\nC. How\nD. How a","answer":"答案：A\n解析：dresses是可数名词复数。What引导的感叹句结构：What + 形容词 + 可数名词复数 + 主语 + 谓语！所以用What。"},{"id":"g3_english_005_ex09","knowledge_id":"g3_english_005","question":"句型转换题：He runs very fast.（改为感叹句）\n______ ______ he runs!","answer":"答案：How fast\n解析：fast是副词，修饰动词runs。How引导的感叹句结构：How + 副词 + 主语 + 谓语！所以用How fast。"},{"id":"g3_english_005_ex10","knowledge_id":"g3_english_005","question":"翻译题：孩子们在公园里玩得多开心啊！","answer":"答案：How happily the children are playing in the park!\n或 What a good time the children are having in the park!\n解析：第一种用How + 副词（happily） + 主语 + 谓语！结构，happily修饰动词playing；第二种用What + a + 形容词 + 名词（a good time）结构，have a good time是固定搭配。"},{"id":"g3_english_006_ex01","knowledge_id":"g3_english_006","question":"语法选择题：He said that he ______ to Beijing the next day.\nA. will go\nB. would go\nC. goes\nD. went","answer":"答案：B\n解析：主句谓语动词said是一般过去时，宾语从句要用相应的过去时态。the next day（第二天）表示将来，所以要用过去将来时would go。口诀：主现从不限，主过从必过，真理永一现。"},{"id":"g3_english_006_ex02","knowledge_id":"g3_english_006","question":"填空题：I think that she ______ (be) back in an hour.","answer":"答案：will be\n解析：主句谓语动词think是一般现在时，宾语从句可以根据实际需要使用各种时态。in an hour（一小时后）表示将来，所以用一般将来时will be。"},{"id":"g3_english_006_ex03","knowledge_id":"g3_english_006","question":"语法选择题：The teacher told us that the earth ______ around the sun.\nA. goes\nB. went\nC. will go\nD. was going","answer":"答案：A\n解析：虽然主句told是一般过去时，但宾语从句表示的是客观真理（地球绕着太阳转），要用一般现在时，不受主句时态的影响。这就是\"真理永一现\"。"},{"id":"g3_english_006_ex04","knowledge_id":"g3_english_006","question":"句型转换题：\"I am watching TV now,\" Tom said.（改为宾语从句）\nTom said that he ______ ______ TV then.","answer":"答案：was watching\n解析：主句said是一般过去时，从句时态要相应调整。现在进行时am watching要变为过去进行时was watching；now要变为then。"},{"id":"g3_english_006_ex05","knowledge_id":"g3_english_006","question":"翻译题：她说她已经完成了作业。","answer":"答案：She said that she had finished her homework.\n解析：主句said是一般过去时，从句中\"已经完成\"的动作发生在said之前，即\"过去的过去\"，所以要用过去完成时had + 过去分词。"},{"id":"g3_english_006_ex06","knowledge_id":"g3_english_006","question":"语法选择题：I don't know if he ______ tomorrow. If he ______, I'll call you.\nA. comes; comes\nB. will come; will come\nC. comes; will come\nD. will come; comes","answer":"答案：D\n解析：第一句if引导宾语从句，意为\"是否\"，tomorrow表示将来，用will come；第二句if引导条件状语从句，意为\"如果\"，主句用将来时，从句用一般现在时表将来，所以用comes。"},{"id":"g3_english_006_ex07","knowledge_id":"g3_english_006","question":"填空题：用所给动词的适当形式填空\n1. She says that she ______ (go) to Shanghai last week.\n2. She said that she ______ (go) to Shanghai the week before.","answer":"答案：went; had gone\n解析：第1题主句says是一般现在时，从句根据last week用一般过去时went；第2题主句said是一般过去时，从句动作发生在said之前，用过去完成时had gone。"},{"id":"g3_english_006_ex08","knowledge_id":"g3_english_006","question":"语法选择题：He asked me where I ______ the day before.\nA. go\nB. went\nC. have gone\nD. had gone","answer":"答案：D\n解析：主句asked是一般过去时，the day before（前一天）表示的动作发生在asked之前，即\"过去的过去\"，要用过去完成时had gone。"},{"id":"g3_english_006_ex09","knowledge_id":"g3_english_006","question":"句型转换题：\"I have seen the film,\" Lucy told me.（改为宾语从句）\nLucy told me that she ______ ______ the film.","answer":"答案：had seen\n解析：主句told是一般过去时，从句原来的现在完成时have seen要变为过去完成时had seen，表示动作发生在told之前。"},{"id":"g3_english_006_ex10","knowledge_id":"g3_english_006","question":"翻译题：我相信他会来的。我相信他是对的。","answer":"答案：I believe that he will come. I believe that he is right.\n解析：两句主句都是一般现在时believe，宾语从句时态不受限制，可根据实际情况使用相应时态。第一句表将来用will come，第二句表现在状态用is right。"},{"id":"g3_english_007_ex01","knowledge_id":"g3_english_007","question":"语法选择题：She ______ short, but now she is very tall.\nA. used to be\nB. is used to be\nC. is used to being\nD. use to be","answer":"答案：A\n解析：句意：她过去很矮，但现在很高了。used to + 动词原形，表示\"过去常常……（现在已经不这样了）\"，暗含有今昔对比的意味。"},{"id":"g3_english_007_ex02","knowledge_id":"g3_english_007","question":"填空题：我爸爸过去常常抽烟，但他已经戒了。\nMy father ______ ______ smoke, but he has given it up.","answer":"答案：used to\n解析：used to + 动词原形，表示过去经常发生的动作或存在的状态，现在已经不这样了。\"抽烟\"是smoke，前面加used to。"},{"id":"g3_english_007_ex03","knowledge_id":"g3_english_007","question":"语法选择题：He ______ to school by bike, but now he ______ to school on foot.\nA. used to go; is used to go\nB. used to going; is used to go\nC. used to go; is used to going\nD. is used to going; used to go","answer":"答案：C\n解析：第一空表示过去常做的事，用used to + 动词原形（go）；第二空表示习惯于做某事，用be used to + 动名词（going）。be used to doing = be accustomed to doing，习惯于做某事。"},{"id":"g3_english_007_ex04","knowledge_id":"g3_english_007","question":"句型转换题：She used to play the piano.（改为一般疑问句并作肯定回答）\n—______ she ______ ______ play the piano?\n—Yes, she ______.","answer":"答案：Did; use to; did\n解析：used to的一般疑问句要借助助动词did，后面的used还原为use to。肯定回答用Yes, she did. 也可以用Used she to...? 但更常用Did...use to...?"},{"id":"g3_english_007_ex05","knowledge_id":"g3_english_007","question":"翻译题：玛丽过去经常在周末去购物。","answer":"答案：Mary used to go shopping on weekends.\n解析：used to + 动词原形，表示过去经常发生的动作。\"去购物\"是go shopping，\"在周末\"是on weekends。"},{"id":"g3_english_007_ex06","knowledge_id":"g3_english_007","question":"语法选择题：Wood is used ______ paper.\nA. to make\nB. to making\nC. for make\nD. make","answer":"答案：A\n解析：句意：木头被用来造纸。be used to do sth. 是被动语态结构，表示\"被用来做某事\"。be used to doing是\"习惯于做某事\"，意思不同。"},{"id":"g3_english_007_ex07","knowledge_id":"g3_english_007","question":"填空题：用所给词的适当形式填空\n1. He is used to ______ (drink) milk every morning.\n2. Knives are used to ______ (cut) things.","answer":"答案：drinking; cut\n解析：第1题be used to doing sth. 习惯于做某事，to是介词，后面接动名词drinking；第2题be used to do sth. 被用来做某事，to是不定式符号，后面接动词原形cut。"},{"id":"g3_english_007_ex08","knowledge_id":"g3_english_007","question":"语法选择题：—Did you use to play computer games?\n—______. I used to study all day.\nA. Yes, I did\nB. No, I didn't\nC. Yes, I was\nD. No, I wasn't","answer":"答案：B\n解析：问句用did提问，回答也要用did。根据答语\"我过去整天学习\"，说明不玩电脑游戏，所以是否定回答No, I didn't."},{"id":"g3_english_007_ex09","knowledge_id":"g3_english_007","question":"句型转换题：They used to swim in the river.（改为否定句）\nThey ______ ______ ______ swim in the river.","answer":"答案：didn't use to\n解析：used to的否定形式有两种：didn't use to（更常用）和usedn't to。借助助动词didn't后，used要还原为use。"},{"id":"g3_english_007_ex10","knowledge_id":"g3_english_007","question":"翻译题：你过去常常害怕黑暗吗？不，我不怕。我现在仍然怕黑。","answer":"答案：—Did you use to be afraid of the dark?\n—No, I didn't. I'm still afraid of the dark now.\n解析：\"过去常常做某事\"用used to do，一般疑问句用Did...use to...? \"害怕……\"是be afraid of...。"},{"id":"g3_english_008_ex01","knowledge_id":"g3_english_008","question":"语法选择题：Can you tell me ______?\nA. where does he live\nB. where he lives\nC. where did he live\nD. where he lived","answer":"答案：B\n解析：宾语从句必须用陈述语序，即\"引导词 + 主语 + 谓语\"，排除A和C（疑问语序）。主句是一般现在时，从句根据句意用一般现在时，所以选where he lives。"},{"id":"g3_english_008_ex02","knowledge_id":"g3_english_008","question":"填空题：我不知道他什么时候回来。\nI don't know ______ he ______ ______ back.","answer":"答案：when; will come\n解析：when引导宾语从句，作know的宾语。从句要用陈述语序，\"回来\"是come back，根据句意用一般将来时will come back。"},{"id":"g3_english_008_ex03","knowledge_id":"g3_english_008","question":"语法选择题：I want to know ______ you will go to the park tomorrow.\nA. what\nB. who\nC. whether\nD. which","answer":"答案：C\n解析：句意：我想知道你明天是否会去公园。从句不缺少主语或宾语，排除what, who, which。whether意为\"是否\"，引导宾语从句，符合句意。"},{"id":"g3_english_008_ex04","knowledge_id":"g3_english_008","question":"句型转换题：What is he doing? I want to know.（合并为一句）\nI want to know ______ he ______ ______.","answer":"答案：what; is doing\n解析：特殊疑问句变宾语从句，用原来的疑问词what引导，从句要变为陈述语序，即主语he在前，谓语is doing在后。"},{"id":"g3_english_008_ex05","knowledge_id":"g3_english_008","question":"翻译题：你能告诉我图书馆在哪里吗？","answer":"答案：Can you tell me where the library is?\n解析：where引导宾语从句，作tell的直接宾语。从句必须用陈述语序：where + 主语（the library） + 谓语（is），而不是where is the library。"},{"id":"g3_english_008_ex06","knowledge_id":"g3_english_008","question":"语法选择题：He asked me ______ I had spent my holiday.\nA. what\nB. who\nC. where\nD. which","answer":"答案：C\n解析：句意：他问我在哪里度的假。从句I had spent my holiday主谓宾完整，缺少地点状语\"在哪里\"，所以用where引导宾语从句，where在从句中作地点状语。"},{"id":"g3_english_008_ex07","knowledge_id":"g3_english_008","question":"填空题：选择正确的引导词填空（what, who, where, how, why）\n1. Can you tell me ______ you got to school this morning? —By bike.\n2. Do you know ______ he didn't come yesterday? —Because he was ill.","answer":"答案：how; why\n解析：第1题答语By bike（骑自行车）是方式，用how（怎样、如何）提问；第2题答语Because...是原因，用why（为什么）提问。"},{"id":"g3_english_008_ex08","knowledge_id":"g3_english_008","question":"语法选择题：Could you tell me ______ the book is?\nA. who\nB. whose\nC. what\nD. how","answer":"答案：B\n解析：句意：你能告诉我这是谁的书吗？whose意为\"谁的\"，在从句中作定语修饰book，符合句意。"},{"id":"g3_english_008_ex09","knowledge_id":"g3_english_008","question":"句型转换题：When did he leave? I didn't know.（合并为一句）\nI didn't know ______ he ______ ______.","answer":"答案：when; had left\n解析：when引导宾语从句，从句用陈述语序。主句didn't know是一般过去时，从句动作发生在\"不知道\"之前，即\"过去的过去\"，所以用过去完成时had left。"},{"id":"g3_english_008_ex10","knowledge_id":"g3_english_008","question":"翻译题：老师问我们是否完成了作业。","answer":"答案：The teacher asked us if/whether we had finished our homework.\n解析：if/whether引导宾语从句，意为\"是否\"。主句asked是一般过去时，从句动作发生在asked之前，用过去完成时had finished。从句用陈述语序。"},{"id":"g3_english_009_ex01","knowledge_id":"g3_english_009","question":"语法选择题：—Could you please ______ me your pen?\n—Sure, here you are.\nA. lend\nB. lending\nC. to lend\nD. lent","answer":"答案：A\n解析：Could you please + 动词原形 + ...? 是常见的礼貌请求句型，意为\"请你……好吗？\"，please后面要接动词原形。lend是\"借出\"，borrow是\"借入\"。"},{"id":"g3_english_009_ex02","knowledge_id":"g3_english_009","question":"填空题：请你把音乐调小一点好吗？\n______ you please ______ ______ the music?","answer":"答案：Could; turn down\n解析：Could you please do sth.? 是委婉地请求别人做某事的句型，比Can you...? 更礼貌。\"调小（音量）\"是turn down。"},{"id":"g3_english_009_ex03","knowledge_id":"g3_english_009","question":"语法选择题：—Would you mind ______ the window? It's too hot here.\n—Of course not.\nA. open\nB. opening\nC. to open\nD. opened","answer":"答案：B\n解析：Would you mind doing sth.? 也是礼貌请求的句型，意为\"你介意做某事吗？\"，mind后面要接动名词（doing形式）。"},{"id":"g3_english_009_ex04","knowledge_id":"g3_english_009","question":"句型转换题：Can you tell me how to get to the station?（改为更礼貌的表达）\n______ you ______ tell me how to get to the station?","answer":"答案：Could; please\n解析：Could you please...? 比Can you...? 更委婉、更礼貌。could不表示过去，而是表示委婉的语气，用于礼貌地提出请求或征求对方意见。"},{"id":"g3_english_009_ex05","knowledge_id":"g3_english_009","question":"翻译题：请你不要在这里吸烟好吗？","answer":"答案：Could you please not smoke here?\n或 Would you mind not smoking here?\n解析：Could you please not do sth.? 是礼貌地请求别人不要做某事；Would you mind not doing sth.? 也是同样的意思，两种表达都可以。"},{"id":"g3_english_009_ex06","knowledge_id":"g3_english_009","question":"语法选择题：—Excuse me, could you tell me where the restroom is?\n—______. Go straight and turn left.\nA. Yes, I could\nB. My pleasure\nC. Sure\nD. That's right","answer":"答案：C\n解析：回答could引导的礼貌请求，肯定回答常用Sure. / Certainly. / Of course. 等，不用Yes, I could. 因为could在这里不是表示过去的能力，而是表示委婉语气。"},{"id":"g3_english_009_ex07","knowledge_id":"g3_english_009","question":"填空题：选择合适的词填空（could, would, please, mind）\n1. ______ you like some tea?\n2. Would you ______ closing the door?","answer":"答案：Would; mind\n解析：第1题Would you like sth.? 是礼貌地询问对方是否想要某物；第2题Would you mind doing sth.? 是礼貌地请求对方做某事，mind后接动名词。"},{"id":"g3_english_009_ex08","knowledge_id":"g3_english_009","question":"语法选择题：—Could you please pass me the salt?\n—______. I'm busy cooking now.\nA. Sure\nB. Yes, I can\nC. Sorry, I can't\nD. No problem","answer":"答案：C\n解析：礼貌请求的否定回答常用Sorry, I can't. / I'm afraid I can't. 等，语气委婉。根据答语\"我现在正忙着做饭\"，说明不能帮忙，所以选C。"},{"id":"g3_english_009_ex09","knowledge_id":"g3_english_009","question":"句型转换题：You can't park your car here.（改为礼貌请求）\n______ you please ______ ______ your car here?","answer":"答案：Could; not park\n解析：Could you please not do sth.? 是礼貌地请求别人不要做某事的句型，比直接说You can't...要委婉得多。"},{"id":"g3_english_009_ex10","knowledge_id":"g3_english_009","question":"翻译题：—你介意帮我学英语吗？—当然不介意。","answer":"答案：—Would you mind helping me with my English?\n—Of course not. / Certainly not.\n解析：Would you mind doing sth.? 表示礼貌地请求对方做某事。\"帮助某人某事\"是help sb. with sth. 或 help sb. (to) do sth.。不介意的回答：Of course not. / Certainly not. / Not at all."},{"id":"g3_english_010_ex01","knowledge_id":"g3_english_010","question":"语法选择题：I didn't go to bed ______ 11 o'clock last night.\nA. when\nB. while\nC. until\nD. as","answer":"答案：C\n解析：句意：我昨晚直到11点才睡觉。not...until...是固定句型，意为\"直到……才……\"，表示主句的动作直到until后面的时间点才发生。"},{"id":"g3_english_010_ex02","knowledge_id":"g3_english_010","question":"填空题：直到他回来我才离开。\nI ______ leave ______ he came back.","answer":"答案：didn't; until\n解析：not...until...表示\"直到……才……\"。根据came back可知用一般过去时，所以助动词用didn't。"},{"id":"g3_english_010_ex03","knowledge_id":"g3_english_010","question":"语法选择题：The kids didn't stop playing ______ their mother came back.\nA. while\nB. when\nC. until\nD. because","answer":"答案：C\n解析：句意：孩子们直到妈妈回来才停止玩耍。not...until...引导时间状语从句，表示主句动作（stop playing）直到从句动作（their mother came back）发生时才发生。"},{"id":"g3_english_010_ex04","knowledge_id":"g3_english_010","question":"句型转换题：He went home after he finished his homework.（改为同义句）\nHe ______ go home ______ he finished his homework.","answer":"答案：didn't; until\n解析：原句意思是\"他完成作业后回家\"，即\"他直到完成作业才回家\"，可以用not...until...结构来表达。根据finished可知用一般过去时，所以是didn't go home until..."},{"id":"g3_english_010_ex05","knowledge_id":"g3_english_010","question":"翻译题：直到雨停了我们才出发。","answer":"答案：We didn't set off until the rain stopped.\n解析：not...until...表示\"直到……才……\"。\"出发\"是set off，\"雨停了\"是the rain stopped。根据句意用一般过去时。"},{"id":"g3_english_010_ex06","knowledge_id":"g3_english_010","question":"语法选择题：______ you told me, I had no idea of it.\nA. Until\nB. When\nC. After\nD. While","answer":"答案：A\n解析：句意：直到你告诉我，我才知道这件事。until可以放在句首，意为\"直到……为止\"，主句常用否定形式，表示在until之前动作没有发生。本句相当于I had no idea of it until you told me."},{"id":"g3_english_010_ex07","knowledge_id":"g3_english_010","question":"填空题：用until或unless填空\n1. Don't get off the bus ______ it stops.\n2. You will be late ______ you hurry up.","answer":"答案：until; unless\n解析：第1题not...until...表示\"直到……才……\"，句意为\"直到公交车停了再下车\"；第2题unless = if...not，意为\"除非、如果不\"，引导条件状语从句。"},{"id":"g3_english_010_ex08","knowledge_id":"g3_english_010","question":"语法选择题：—When did you go to bed last night?\n—______ I finished my homework.\nA. Until\nB. Not until\nC. When\nD. While","answer":"答案：B\n解析：Not until...是强调形式，意为\"直到……才……\"，完整句子是I didn't go to bed until I finished my homework. 答语用Not until...是省略回答。"},{"id":"g3_english_010_ex09","knowledge_id":"g3_english_010","question":"句型转换题：We will start the meeting when everyone arrives.（改为同义句）\nWe ______ start the meeting ______ everyone arrives.","answer":"答案：won't; until\n解析：原句意思是\"当每个人都到达时我们将开始会议\"，也就是\"直到每个人都到达我们才开始会议\"，可以用not...until...结构来表达。主句用一般将来时won't。"},{"id":"g3_english_010_ex10","knowledge_id":"g3_english_010","question":"翻译题：直到我亲眼看到，我才会相信。","answer":"答案：I won't believe it until I see it with my own eyes.\n解析：not...until...表示\"直到……才……\"。主句用一般将来时won't believe，从句用一般现在时see（主将从现）。\"亲眼\"是with one's own eyes。"},{"id":"g3_english_011_ex01","knowledge_id":"g3_english_011","question":"语法选择题：He used to be a doctor, ______?\nA. didn't he\nB. used he\nC. wasn't he\nD. doesn't he","answer":"答案：A\n解析：本题考查used to的反义疑问句。used to表示\"过去常常\"，其反义疑问句有两种形式：didn't + 主语 或 usedn't + 主语。在现代英语中，didn't + 主语更为常用。本句主语是he，所以反义疑问部分用didn't he。B选项used he是肯定形式，不符合反义疑问句\"前肯后否\"的原则；C选项wasn't he错误，因为句子谓语是used to be，不是单纯的be动词；D选项doesn't he是一般现在时的反义疑问形式，与used to的过去时态不符。"},{"id":"g3_english_011_ex02","knowledge_id":"g3_english_011","question":"语法选择题：Your sister used to dislike rock music, ______?\nA. did she\nB. didn't she\nC. used she\nD. wasn't she","answer":"答案：B\n解析：本题考查含有否定前缀的used to句子的反义疑问句。虽然dislike含有否定前缀dis-，但整个句子仍然是肯定句（因为used to是肯定形式），所以反义疑问部分仍然用否定形式。used to的反义疑问常用didn't + 主语。A选项did she是肯定形式，不符合\"前肯后否\"原则；C选项used she既是肯定形式，又不符合常用表达；D选项wasn't she与谓语动词不符。"},{"id":"g3_english_011_ex03","knowledge_id":"g3_english_011","question":"填空题：They used to play football after school, ______ ______?（完成反义疑问句）","answer":"答案：didn't they\n解析：used to表示\"过去常常做某事\"，其反义疑问句的否定形式常用didn't + 主语。本句主语是they，所以反义疑问部分为didn't they。也可以用usedn't they，但didn't they更为常见和口语化。"},{"id":"g3_english_011_ex04","knowledge_id":"g3_english_011","question":"语法选择题：There used to be a temple here, ______?\nA. didn't there\nB. used there\nC. wasn't there\nD. isn't there","answer":"答案：A\n解析：本题考查there used to be句型的反义疑问句。there used to be表示\"过去曾经有\"，其反义疑问句常用didn't there，也可用usedn't there。B选项used there是肯定形式，不符合\"前肯后否\"；C选项wasn't there虽然there be句型的反义疑问通常用be动词，但这里是used to be结构，习惯上用didn't there；D选项isn't there是一般现在时，与used to的过去时态不符。"},{"id":"g3_english_011_ex05","knowledge_id":"g3_english_011","question":"句型转换题：She used to live in the countryside.（改为反义疑问句）\nShe used to live in the countryside, ______ ______?","answer":"答案：didn't she\n解析：used to do sth.表示\"过去常常做某事\"，其反义疑问句的构成有两种方式：1) didn't + 主语（更常用）；2) usedn't + 主语（较正式）。本题中主语是she，所以填didn't she。需要注意的是，反义疑问句遵循\"前肯后否，前否后肯\"的原则，前面是肯定的used to，后面用否定形式。"},{"id":"g3_english_011_ex06","knowledge_id":"g3_english_011","question":"翻译题：他以前不常去那儿，是吗？（用used to翻译）","answer":"答案：He didn't use to go there, did he?\n解析：本题考查used to否定形式的反义疑问句。used to的否定形式是didn't use to（注意use用原形）或usedn't to。反义疑问句遵循\"前否后肯\"的原则，前面是否定形式didn't use to，后面反义疑问部分用肯定形式did he。翻译时要注意：\"以前不常去\"用didn't use to go表达，反义疑问部分用did he。"},{"id":"g3_english_011_ex07","knowledge_id":"g3_english_011","question":"语法选择题：You used to be short when you were young, ______?\nA. weren't you\nB. didn't you\nC. used you\nD. aren't you","answer":"答案：B\n解析：本题考查used to be的反义疑问句。虽然句中有be动词，但used to是一个固定结构，表示\"过去常常\"，其反义疑问句习惯上用didn't + 主语，而不用be动词的形式。A选项weren't you是错误的，因为谓语结构是used to be，不是单纯的were；C选项used you是肯定形式，不符合\"前肯后否\"；D选项aren't you是一般现在时，与过去时态不符。"},{"id":"g3_english_011_ex08","knowledge_id":"g3_english_011","question":"填空题：—He didn't use to like painting, did he?\n—______, he ______. He used to paint a lot.（根据答语提示完成反义疑问句的回答）","answer":"答案：Yes; did\n解析：本题考查反义疑问句的回答。反义疑问句的回答要根据事实来定，事实是肯定的就用Yes，事实是否定的就用No。根据答语后一句\"他以前经常画画\"可知，事实是肯定的，所以用Yes, he did。注意：在否定形式的反义疑问句中，Yes翻译为\"不\"，No翻译为\"是的\"。本题完整答语意为：\"不，他喜欢。他以前经常画画。\""},{"id":"g3_english_011_ex09","knowledge_id":"g3_english_011","question":"句型转换题：The old man used to walk in the park every morning.（改为反义疑问句）\nThe old man used to walk in the park every morning, ______ ______?","answer":"答案：didn't he\n解析：used to do sth.结构的反义疑问句常用didn't + 主语。本句主语the old man是男性单数，用he代替，所以反义疑问部分为didn't he。也可以用usedn't he，但didn't he在现代英语中更为普遍。反义疑问句要注意\"前肯后否\"的原则，前面是肯定的used to，后面用否定的疑问形式。"},{"id":"g3_english_011_ex10","knowledge_id":"g3_english_011","question":"翻译题：你妹妹过去常弹钢琴，不是吗？是的，她常弹。（用used to翻译）","answer":"答案：—Your sister used to play the piano, didn't she?\n—Yes, she did.\n解析：本题考查used to反义疑问句及其回答。1) \"你妹妹过去常弹钢琴\"翻译为Your sister used to play the piano；2) 反义疑问部分用didn't she，遵循\"前肯后否\"原则；3) 肯定回答用Yes, she did。注意：used to的反义疑问句回答中，助动词用did，不用used。play the piano表示\"弹钢琴\"，乐器前要加定冠词the。"},{"id":"g3_english_012_ex01","knowledge_id":"g3_english_012","question":"语法选择题：The little girl is afraid ______ dogs.\nA. of\nB. for\nC. to\nD. with","answer":"答案：A\n解析：本题考查be afraid的固定搭配。be afraid of sth./sb.表示\"害怕某物/某人\"，是最常用的搭配。根据句意\"这个小女孩害怕狗\"，dogs是名词，所以用介词of。B选项be afraid for sb.表示\"为某人担心\"，不符合句意；C选项be afraid to do sth.表示\"不敢做某事\"，to后面要接动词原形，不能直接接名词；D选项with不与afraid构成固定搭配。"},{"id":"g3_english_012_ex02","knowledge_id":"g3_english_012","question":"语法选择题：He is afraid ______ out alone at night.\nA. go\nB. going\nC. to go\nD. of go","answer":"答案：C\n解析：本题考查be afraid的用法。be afraid to do sth.表示\"不敢去做某事\"，着重指因害怕而不敢做某事。根据句意\"他不敢晚上一个人出去\"，后面接动词原形go，所以用to go。A选项go是动词原形，不能直接放在afraid后面；B选项going是动名词，如果用of going也可以（be afraid of doing sth.），但单独的going不对；D选项of go形式错误，of后面应该接动名词going。be afraid of doing sth.和be afraid to do sth.在很多情况下可以互换，但前者更侧重\"担心某事会发生\"，后者更侧重\"因害怕而不敢去做\"。"},{"id":"g3_english_012_ex03","knowledge_id":"g3_english_012","question":"填空题：I'm afraid ______ making mistakes in the English exam.（用适当的介词填空）","answer":"答案：of\n解析：本题考查be afraid of doing sth.的用法。be afraid of doing sth.表示\"担心/害怕做某事\"，of后面接动名词形式。根据句意\"我担心在英语考试中犯错\"，making是动名词，所以用介词of。be afraid of doing sth.常用来表示担心某种不好的事情可能会发生。"},{"id":"g3_english_012_ex04","knowledge_id":"g3_english_012","question":"语法选择题：—I'm afraid I can't pass the exam.\n—______\nA. Don't be afraid.\nB. It doesn't matter.\nC. Don't worry. I can help you.\nD. You are welcome.","answer":"答案：C\n解析：本题考查I'm afraid的口语用法。I'm afraid (that)...常用来委婉地说出不好的消息或表达遗憾，意思是\"恐怕……\"。答语应该对对方的担忧表示安慰并提供帮助。A选项\"别害怕\"不太贴切，因为这里不是真的害怕，而是表示担忧；B选项\"没关系\"通常用于道歉的答语；C选项\"别担心，我可以帮你\"既安慰了对方又提供了帮助，是最恰当的答语；D选项\"不客气\"用于回答感谢。"},{"id":"g3_english_012_ex05","knowledge_id":"g3_english_012","question":"句型转换题：She is afraid of snakes.（改为同义句）\nShe ______ ______ ______ snakes.","answer":"答案：feels afraid of / is scared of / is frightened of\n解析：be afraid of表示\"害怕\"，有多种同义表达：1) feel afraid of（感到害怕）；2) be scared of（对……感到恐惧，scare是动词，过去分词作形容词）；3) be frightened of（被……吓到，frighten是动词，过去分词作形容词）。这些短语都可以表示\"害怕……\"，后面接名词、代词或动名词。其中be scared of和be frightened of语气比be afraid of更强，表示更强烈的恐惧。"},{"id":"g3_english_012_ex06","knowledge_id":"g3_english_012","question":"翻译题：我害怕在公共场合发言。（用be afraid翻译）","answer":"答案：I'm afraid to speak in public. / I'm afraid of speaking in public.\n解析：本题考查be afraid的两种结构。1) be afraid to do sth.表示\"因害怕而不敢做某事\"；2) be afraid of doing sth.表示\"担心/害怕做某事\"。两种表达在很多情况下可以互换使用。\"在公共场合\"翻译为in public，是固定短语。\"发言\"用speak表示。注意：public前面不加冠词，是固定搭配in public。"},{"id":"g3_english_012_ex07","knowledge_id":"g3_english_012","question":"语法选择题：She is afraid ______ she will fall behind her classmates.\nA. of\nB. that\nC. to\nD. for","answer":"答案：B\n解析：本题考查be afraid后接宾语从句的用法。be afraid (that)...表示\"恐怕……\"，that引导宾语从句，that在口语中常省略。根据句子结构，空格后面是一个完整的句子she will fall behind her classmates，所以用that引导宾语从句。A选项of后面要接名词或动名词，不能接句子；C选项to后面要接动词原形；D选项for后面接sb.表示\"为某人担心\"，不能接句子。"},{"id":"g3_english_012_ex08","knowledge_id":"g3_english_012","question":"填空题：—Can you help me carry this heavy box?\n—I'm ______ I can't. I have to look after my little sister.（根据语境填空）","answer":"答案：afraid\n解析：本题考查I'm afraid的委婉用法。I'm afraid (that)...常用来委婉地拒绝别人的请求或表示遗憾，相当于I'm sorry but...。根据答语\"我不能，我得照顾我妹妹\"，这是委婉地拒绝对方的请求，所以用I'm afraid I can't。这种用法在日常口语中非常常见，比直接说No更礼貌。"},{"id":"g3_english_012_ex09","knowledge_id":"g3_english_012","question":"句型转换题：The boy is afraid to go into the dark room.（改为同义句，用of）\nThe boy is afraid ______ ______ into the dark room.","answer":"答案：of going\n解析：本题考查be afraid to do sth.与be afraid of doing sth.的转换。be afraid to do sth.和be afraid of doing sth.在很多情况下可以互换，都表示\"害怕/不敢做某事\"。但两者有细微区别：be afraid to do sth.侧重主语因害怕而不敢去做某事；be afraid of doing sth.侧重主语担心做某事会产生某种不好的结果。本题中go into the dark room表示\"进入黑房间\"，两种结构都可以用，所以改为of going。"},{"id":"g3_english_012_ex10","knowledge_id":"g3_english_012","question":"翻译题：恐怕这次会议我们要迟到了。（用be afraid翻译）","answer":"答案：I'm afraid (that) we will be late for the meeting.\n解析：本题考查be afraid后接宾语从句的用法。be afraid (that)从句表示\"恐怕……\"，用来委婉地表达不好的事情或令人担忧的情况。that引导宾语从句，在口语中可以省略。\"迟到\"用be late for表示，是固定搭配。\"这次会议\"是the meeting。注意：be late for后面接表示事件或活动的名词，如class, school, meeting, party等。"},{"id":"g3_english_013_ex01","knowledge_id":"g3_english_013","question":"语法选择题：I enjoy ______ books in my spare time.\nA. read\nB. reading\nC. to read\nD. reads","answer":"答案：B\n解析：本题考查动名词作宾语。enjoy是常见的只能接动名词（doing）作宾语的动词，不能接不定式（to do）。enjoy doing sth.表示\"喜欢做某事\"。A选项read是动词原形，不能直接放在enjoy后面；C选项to read是不定式，不能作enjoy的宾语；D选项reads是动词第三人称单数形式，也不能放在enjoy后面。常见的只能接动名词作宾语的动词还有：finish, practice, mind, suggest, avoid, keep, miss, consider, imagine, risk等。"},{"id":"g3_english_013_ex02","knowledge_id":"g3_english_013","question":"语法选择题：—Would you mind ______ the window? It's too hot here.\n—Of course not.\nA. open\nB. to open\nC. opening\nD. opens","answer":"答案：C\n解析：本题考查mind后接动名词作宾语。mind doing sth.表示\"介意做某事\"，是固定用法。根据句意\"你介意打开窗户吗？这里太热了\"，mind后面要接动名词opening。A选项open是动词原形，不能放在mind后面；B选项to open是不定式，mind后面不接不定式作宾语；D选项opens是第三人称单数形式，错误。Would you mind doing sth.?是常用的委婉请求句型，意为\"你介意做某事吗？\""},{"id":"g3_english_013_ex03","knowledge_id":"g3_english_013","question":"填空题：She practices ______ (play) the piano every day.（用所给词的适当形式填空）","answer":"答案：playing\n解析：本题考查practice后接动名词作宾语。practice doing sth.表示\"练习做某事\"，是固定搭配，practice后面只能接动名词，不能接不定式。所以play要变为动名词形式playing。常见的只能接动名词作宾语的动词口诀：考虑建议盼原谅（consider, suggest, look forward to, excuse），承认推迟没得想（admit, delay, fancy），避免错过继续练（avoid, miss, keep/keep on, practice），否认完成就欣赏（deny, finish, enjoy/appreciate），禁止想象才冒险（forbid, imagine, risk），不禁介意准逃亡（can't help, mind, escape）。"},{"id":"g3_english_013_ex04","knowledge_id":"g3_english_013","question":"语法选择题：She used to ______ late, but now she is used to ______ early.\nA. sleep; get up\nB. sleeping; getting up\nC. sleep; getting up\nD. sleeping; get up","answer":"答案：C\n解析：本题考查used to和be used to的区别。1) used to do sth.表示\"过去常常做某事\"，to是不定式符号，后面接动词原形，所以第一空用sleep；2) be used to doing sth.表示\"习惯于做某事\"，to是介词，后面接动名词，所以第二空用getting up。根据句意\"她过去常睡懒觉，但现在习惯早起了\"，正确答案是C。注意区分这两个结构：used to do（过去常常，to+动词原形）vs be used to doing（习惯于，to+动名词）。"},{"id":"g3_english_013_ex05","knowledge_id":"g3_english_013","question":"句型转换题：He finished his homework. He went out to play.（合并为一句，用finish）\nHe went out to play after he finished ______ his homework.","answer":"答案：doing\n解析：本题考查finish doing sth.的用法。finish doing sth.表示\"完成做某事\"，finish后面只能接动名词作宾语，不能接不定式。do one's homework表示\"做作业\"，所以用doing。注意：虽然原句是finished his homework，但在finish后面接动作时，要用动名词形式。常见的只能接动名词的动词还有：enjoy, mind, practice, suggest, avoid, keep, consider, imagine, risk, miss等。"},{"id":"g3_english_013_ex06","knowledge_id":"g3_english_013","question":"翻译题：我期待着收到你的来信。（用look forward to翻译）","answer":"答案：I'm looking forward to hearing from you.\n解析：本题考查look forward to的用法。look forward to表示\"期待，盼望\"，其中to是介词，后面要接名词、代词或动名词，不能接动词原形。\"收到你的来信\"用hear from you表示，hear是动词，所以要变为动名词hearing。注意：look forward to中的to是介词，不是不定式符号，这是一个很容易出错的考点。类似的to作介词的短语还有：pay attention to, be used to, stick to, devote to, object to等。"},{"id":"g3_english_013_ex07","knowledge_id":"g3_english_013","question":"语法选择题：—What about ______ a rest?\n—Good idea! Let's stop ______ a rest.\nA. have; having\nB. having; to have\nC. to have; having\nD. having; having","answer":"答案：B\n解析：本题考查两处动名词和不定式的区别。1) What about doing sth.?表示\"做某事怎么样？\"，about是介词，后面接动名词，所以第一空用having；2) stop doing sth.表示\"停止做某事\"（停下正在做的事），stop to do sth.表示\"停下来去做某事\"（停下去做另一件事）。根据句意\"我们停下来休息一下吧\"，是停下正在做的事去休息，所以用stop to have a rest，第二空用to have。综合起来选B。"},{"id":"g3_english_013_ex08","knowledge_id":"g3_english_013","question":"填空题：Tom suggested ______ (go) swimming this weekend.（用所给词的适当形式填空）","answer":"答案：going\n解析：本题考查suggest后接动名词作宾语。suggest doing sth.表示\"建议做某事\"，suggest后面只能接动名词作宾语，不能接不定式。所以go要变为动名词going。注意：suggest后面不能接不定式的复合结构，即不能说suggest sb. to do sth.，正确的表达是suggest doing sth.或suggest that sb. (should) do sth.（虚拟语气）。例如：I suggest that he (should) go swimming. = I suggest him going swimming."},{"id":"g3_english_013_ex09","knowledge_id":"g3_english_013","question":"句型转换题：Remember to turn off the lights when you leave.（改为否定句，用forget）\nDon't forget ______ ______ off the lights when you leave.","answer":"答案：to turn\n解析：本题考查forget后接不定式和动名词的区别。forget to do sth.表示\"忘记要去做某事\"（事情还没做）；forget doing sth.表示\"忘记做过某事\"（事情已经做了，但忘了）。根据原句\"记着离开时关灯\"，改为同义的否定句应该是\"不要忘记离开时关灯\"，灯还没关，所以用forget to turn off。Remember to do sth.（记得要做某事）的反义表达就是Don't forget to do sth.（不要忘记做某事）。"},{"id":"g3_english_013_ex10","knowledge_id":"g3_english_013","question":"翻译题：他一到家就忍不住打开了电视。（用can't help翻译）","answer":"答案：He couldn't help turning on the TV as soon as he got home.\n解析：本题考查can't help doing sth.的用法。can't help doing sth.表示\"忍不住做某事，情不自禁做某事\"，help后面接动名词。注意：can't help (to) do sth.表示\"不能帮助做某事\"，help后面接不定式，这是两个完全不同的意思，要注意区分。根据句意\"忍不住打开了电视\"，是情不自禁做某事，所以用can't help turning on。\"一……就……\"用as soon as引导时间状语从句。"},{"id":"g3_english_014_ex01","knowledge_id":"g3_english_014","question":"语法选择题：The bridge ______ two years ago.\nA. is built\nB. was built\nC. builds\nD. built","answer":"答案：B\n解析：本题考查一般过去时的被动语态。被动语态的基本结构是\"be + 及物动词的过去分词\"。根据时间状语two years ago（两年前），句子要用一般过去时。句子主语The bridge（桥）是动作的承受者，桥是\"被建造\"的，所以用被动语态。一般过去时被动语态的结构是was/were + 过去分词。主语是单数，所以用was built。A选项is built是一般现在时的被动语态，时间不对；C选项builds是一般现在时主动语态；D选项built是一般过去时主动语态，都不正确。"},{"id":"g3_english_014_ex02","knowledge_id":"g3_english_014","question":"语法选择题：English ______ in many countries around the world.\nA. speaks\nB. is spoken\nC. is speaking\nD. spoke","answer":"答案：B\n解析：本题考查一般现在时的被动语态。句子主语English（英语）是动作的承受者，英语是\"被说\"的，所以用被动语态。一般现在时被动语态的结构是am/is/are + 过去分词。主语English是单数，所以用is spoken。A选项speaks是一般现在时主动语态第三人称单数；C选项is speaking是现在进行时主动语态；D选项spoke是一般过去时主动语态。被动语态表示主语是动作的承受者，即行为动作的对象。"},{"id":"g3_english_014_ex03","knowledge_id":"g3_english_014","question":"填空题：The classroom ______ ______ (clean) by the students every day.（用所给词的适当形式填空）","answer":"答案：is cleaned\n解析：本题考查一般现在时的被动语态。句子主语The classroom（教室）是动作的承受者，教室是\"被打扫\"的，所以用被动语态。根据时间状语every day（每天），句子用一般现在时。一般现在时被动语态结构：am/is/are + 过去分词。主语是单数，所以用is cleaned。被动语态的基本构成是\"be + 及物动词的过去分词\"，be动词随时称和数的变化而变化。"},{"id":"g3_english_014_ex04","knowledge_id":"g3_english_014","question":"语法选择题：A new school ______ next year in our city.\nA. will build\nB. will be built\nC. is built\nD. was built","answer":"答案：B\n解析：本题考查一般将来时的被动语态。根据时间状语next year（明年），句子要用一般将来时。主语A new school（一所新学校）是动作的承受者，学校是\"被建造\"的，所以用被动语态。一般将来时被动语态的结构是will be + 过去分词，或am/is/are going to be + 过去分词。所以正确答案是will be built。A选项will build是一般将来时主动语态；C选项is built是一般现在时被动语态，时间不对；D选项was built是一般过去时被动语态，时间不对。"},{"id":"g3_english_014_ex05","knowledge_id":"g3_english_014","question":"句型转换题：We plant many trees every spring.（改为被动语态）\nMany trees ______ ______ every spring.","answer":"答案：are planted\n解析：本题考查主动语态变被动语态。主动语态变被动语态的步骤：1) 把主动句的宾语many trees变成被动句的主语；2) 谓语动词变成\"be + 过去分词\"结构；3) 主动句的主语we变为by us（可以省略）。原句是一般现在时，被动句也用一般现在时。主语Many trees是复数，所以be动词用are，plant的过去分词是planted。所以答案是are planted。注意：被动语态中，动作的执行者由by引出，如果不需要强调动作的话，by短语可以省略。"},{"id":"g3_english_014_ex06","knowledge_id":"g3_english_014","question":"翻译题：这本书是鲁迅写的。（用被动语态翻译）","answer":"答案：This book was written by Lu Xun.\n解析：本题考查一般过去时的被动语态。书是\"被写\"的，所以用被动语态。书已经写的动作发生在过去，所以用一般过去时的被动语态：was/were + 过去分词。主语This book是单数，所以用was written。\"被某人写的\"用by sb.表示动作的执行者。write的过去分词是written。注意：write是不规则动词，过去式wrote，过去分词written。被动语态翻译时，要把汉语的主动句变成英语的被动句，把原句的宾语变为主语，谓语变为be + 过去分词。"},{"id":"g3_english_014_ex07","knowledge_id":"g3_english_014","question":"语法选择题：—______ the telephone ______ by Alexander Graham Bell?\nA. Is; invented\nB. Was; invented\nC. Did; invent\nD. Does; invent","answer":"答案：B\n解析：本题考查一般过去时被动语态的疑问句形式。被动语态的疑问句把be动词提前。电话是\"被发明\"的，所以用被动语态。电话的发明发生在过去，所以用一般过去时。一般过去时被动语态的疑问结构是Was/Were + 主语 + 过去分词？主语the telephone是单数，所以用Was...invented。A选项Is...invented是一般现在时被动语态，时间不对；C选项Did...invent是一般过去时主动语态；D选项Does...invent是一般现在时主动语态。被动语态的疑问句是把be动词提到主语前面。"},{"id":"g3_english_014_ex08","knowledge_id":"g3_english_014","question":"填空题：The problem can ______ ______ (solve) by us in two hours.（用所给词的适当形式填空）","answer":"答案：be solved\n解析：本题考查含有情态动词的被动语态。含有情态动词的被动语态结构是：情态动词 + be + 过去分词。主语The problem（问题）是动作的承受者，问题是\"被解决\"的，所以用被动语态。情态动词can后面接be + 过去分词，即can be solved。solve的过去分词是solved。常见的情态动词有：can, may, must, should, need等，它们的被动语态结构都是：情态动词 + be + 过去分词。例如：The work must be finished today.（这项工作必须今天完成。）"},{"id":"g3_english_014_ex09","knowledge_id":"g3_english_014","question":"句型转换题：They have built a new hospital in the town.（改为被动语态）\nA new hospital ______ ______ ______ in the town.","answer":"答案：has been built\n解析：本题考查现在完成时的被动语态。现在完成时被动语态的结构是：have/has + been + 过去分词。原句是现在完成时，被动句也用现在完成时。主语A new hospital是单数，所以用has been built。build的过去分词是built。主动语态变被动语态时，时态要保持一致。现在完成时被动语态的构成是have/has been + done。注意：build是不规则动词，过去式built，过去分词也是built。"},{"id":"g3_english_014_ex10","knowledge_id":"g3_english_014","question":"翻译题：这些花必须每天浇水。（用被动语态翻译）","answer":"答案：These flowers must be watered every day.\n解析：本题考查含有情态动词must的被动语态。花是\"被浇水\"的，所以用被动语态。含有情态动词的被动语态结构是：情态动词 + be + 过去分词。must表示\"必须\"，后面接be watered。\"每天\"是every day。注意：water在这里作动词，意思是\"浇水\"，过去分词是watered。被动语态翻译时，如果汉语句子没有出现\"被\"字，但逻辑上是被动关系，也要用被动语态。"},{"id":"g3_english_015_ex01","knowledge_id":"g3_english_015","question":"语法选择题：The table is made ______ wood. You can see the wood clearly.\nA. of\nB. from\nC. in\nD. by","answer":"答案：A\n解析：本题考查be made of的用法。be made of表示\"由……制成\"，能看出原材料，即制作过程中只发生了物理变化，原材料的质地没有改变。根据后一句\"你可以清楚地看到木头\"，说明能看出原材料是木头，所以用of。B选项be made from也表示\"由……制成\"，但看不出原材料，发生了化学变化；C选项be made in表示\"在某地制造\"，后面接地点；D选项be made by表示\"由某人制造\"，后面接动作的执行者。"},{"id":"g3_english_015_ex02","knowledge_id":"g3_english_015","question":"语法选择题：Paper is made ______ wood. We can't see the wood in the paper.\nA. of\nB. from\nC. into\nD. by","answer":"答案：B\n解析：本题考查be made from的用法。be made from表示\"由……制成\"，看不出原材料，即制作过程中发生了化学变化，原材料的质地已经改变。根据后一句\"我们在纸里看不到木头\"，说明看不出原材料，所以用from。A选项be made of能看出原材料；C选项be made into表示\"被制成……\"，后面接成品；D选项be made by表示\"由某人制造\"，后面接执行者。记忆口诀：of能看出，from看不出，物理变化用of，化学变化用from。"},{"id":"g3_english_015_ex03","knowledge_id":"g3_english_015","question":"填空题：This kind of car is made ______ Germany.（用适当的介词填空）","answer":"答案：in\n解析：本题考查be made in的用法。be made in表示\"在某地制造/生产\"，后面接地点名词（国家、城市等）。根据句意\"这种汽车是德国制造的\"，Germany是国家名，所以用介词in。be made in后面可以接大的地点（国家），也可以接小的地点（城市、工厂等）。例如：This TV is made in Shanghai.（这台电视是上海制造的。）注意：\"Made in China\"（中国制造）就是这个结构的典型用法。"},{"id":"g3_english_015_ex04","knowledge_id":"g3_english_015","question":"语法选择题：The beautiful kite is made ______ my grandmother. She is good at making kites.\nA. of\nB. from\nC. by\nD. in","answer":"答案：C\n解析：本题考查be made by的用法。be made by表示\"由某人制造\"，后面接动作的执行者（人或团队）。根据句意\"这个漂亮的风筝是我奶奶做的\"，my grandmother是动作的执行者，所以用by。A选项be made of后面接原材料（能看出）；B选项be made from后面接原材料（看不出）；D选项be made in后面接地点。be made by后面还可以接表示方式、手段的词，如：The cake was made by hand.（这个蛋糕是手工制作的。）"},{"id":"g3_english_015_ex05","knowledge_id":"g3_english_015","question":"句型转换题：People make glass into bottles.（改为被动语态，用made into）\nGlass ______ ______ ______ bottles.","answer":"答案：is made into\n解析：本题考查be made into的用法。be made into表示\"被制成……\"，主语是原材料，后面接成品。原句意思是\"人们把玻璃制成瓶子\"，改为被动就是\"玻璃被制成瓶子\"，即Glass is made into bottles。注意区分：be made of/from（由……制成，主语是成品，后面接原材料）vs be made into（被制成……，主语是原材料，后面接成品）。两者是相反的方向，例如：Bottles are made of glass. = Glass is made into bottles."},{"id":"g3_english_015_ex06","knowledge_id":"g3_english_015","question":"翻译题：这把椅子是由竹子做的。（用be made of翻译）","answer":"答案：This chair is made of bamboo.\n解析：本题考查be made of的用法。be made of表示\"由……制成\"，能看出原材料。椅子由竹子制成，从外观上可以看出原材料是竹子，所以用be made of。\"这把椅子\"是this chair，\"竹子\"是bamboo。注意：be made of和be made from的区别是考试的重点，关键看能否看出原材料。能看出原材料用of，看不出原材料用from。常见的be made of例子：desk made of wood（木制课桌），ring made of gold（金戒指），bridge made of stone（石桥）。"},{"id":"g3_english_015_ex07","knowledge_id":"g3_english_015","question":"语法选择题：Wine is made ______ grapes. Grapes are made ______ wine.\nA. of; from\nB. from; into\nC. into; of\nD. by; in","answer":"答案：B\n解析：本题综合考查be made的几个短语。第一空：酒是由葡萄制成的，看不出原材料（葡萄变成酒发生了化学变化），所以用from；第二空：葡萄被制成酒，主语是原材料grapes，后面接成品wine，所以用into。be made from（由……制成，看不出原材料）；be made into（被制成……，原材料→成品）。A选项第一空用of不对，酒看不出葡萄；第二空from方向反了；C选项两空都不对；D选项by（由某人做）和in（在某地做）都不符合句意。"},{"id":"g3_english_015_ex08","knowledge_id":"g3_english_015","question":"填空题：—What is the model plane made ______?\n—It's made ______ metal and plastic. And it was made ______ a little boy.（用适当的介词填空）","answer":"答案：of; of; by\n解析：本题综合考查be made的介词搭配。1) 第一句问\"飞机模型由什么制成\"，用be made of/from，这里能看出原材料，所以用of；2) 第二句回答\"由金属和塑料制成\"，能看出原材料，所以用of；3) 第三句\"由一个小男孩做的\"，表示动作的执行者，所以用by。be made of和be made from的区别：of能看出原材料，from看不出。be made by表示\"由某人制造\"。be made in表示\"在某地制造\"。be made into表示\"被制成……\"。"},{"id":"g3_english_015_ex09","knowledge_id":"g3_english_015","question":"句型转换题：The shoes are made in Suzhou.（对划线部分in Suzhou提问）\n______ ______ the shoes made?","answer":"答案：Where are\n解析：本题考查对be made in地点的提问。对地点提问用疑问词where，然后把be动词are提前，构成疑问句。原句意思是\"这些鞋子是苏州制造的\"，对地点in Suzhou提问就是\"这些鞋子是哪里制造的？\"即Where are the shoes made?注意：被动语态的特殊疑问句结构是\"疑问词 + be动词 + 主语 + 过去分词 + 其他？\"。如果对原材料提问，用What...made of/from？例如：What is the table made of?（桌子是由什么制成的？）"},{"id":"g3_english_015_ex10","knowledge_id":"g3_english_015","question":"翻译题：这款手机是中国制造的，由一家著名公司生产。（用be made in和be made by翻译）","answer":"答案：This kind of mobile phone is made in China and is made by a famous company.\n解析：本题综合考查be made in和be made by的用法。1) be made in表示\"在某地制造\"，后面接地点，\"中国制造\"用made in China；2) be made by表示\"由……制造\"，后面接动作的执行者，\"由一家著名公司生产\"用made by a famous company；3) \"这款手机\"是this kind of mobile phone。两个短语并列使用，共用一个主语this kind of mobile phone。注意：be made后接不同的介词表达不同的意思，要根据具体语境选择合适的介词。"},{"id":"g3_english_016_ex01","knowledge_id":"g3_english_016","question":"语法选择题：The book ______ by many students last year.\nA. reads\nB. was read\nC. is read\nD. read","answer":"答案：B\n解析：本题考查被动语态的用法。句子主语是the book（书），它是动作read（读）的承受者，所以要用被动语态。被动语态的基本结构是\"be + 及物动词的过去分词\"。根据时间状语last year可知要用一般过去时，一般过去时被动语态的结构是was/were + 过去分词。主语the book是单数，所以用was read。A选项reads是一般现在时主动语态；C选项is read是一般现在时被动语态；D选项read是主动语态形式。"},{"id":"g3_english_016_ex02","knowledge_id":"g3_english_016","question":"语法选择题：The workers ______ the new bridge next month.\nA. will build\nB. will be built\nC. build\nD. are built","answer":"答案：A\n解析：本题考查主动语态与被动语态的区别。句子主语是the workers（工人们），它们是动作build（建造）的执行者，所以要用主动语态。根据时间状语next month可知要用一般将来时，一般将来时主动语态的结构是will + 动词原形。B选项will be built是一般将来时被动语态；C选项build是一般现在时主动语态；D选项are built是一般现在时被动语态。"},{"id":"g3_english_016_ex03","knowledge_id":"g3_english_016","question":"填空题：The letter ______ ______ (write) in English.（用被动语态填空）","answer":"答案：is written\n解析：本题考查一般现在时的被动语态。句子主语the letter（信）是动作write（写）的承受者，所以要用被动语态。被动语态结构为be + 过去分词。主语the letter是单数，描述一般情况用一般现在时，所以be动词用is，write的过去分词是written，因此填is written。"},{"id":"g3_english_016_ex04","knowledge_id":"g3_english_016","question":"句型转换题：Tom cleaned the classroom yesterday.（改为被动语态）\nThe classroom ______ ______ by Tom yesterday.","answer":"答案：was cleaned\n解析：本题考查主动语态变被动语态。主动语态变被动语态的步骤：1) 把主动句的宾语the classroom变成被动句的主语；2) 谓语动词改为\"be + 过去分词\"结构，时态与原句一致（一般过去时）；3) 原句的主语Tom前加by，放在句末。主语the classroom是单数，一般过去时be动词用was，clean的过去分词是cleaned，所以填was cleaned。"},{"id":"g3_english_016_ex05","knowledge_id":"g3_english_016","question":"翻译题：这首歌是由一位著名歌手演唱的。（用被动语态翻译）","answer":"答案：This song is sung by a famous singer.\n解析：本题考查被动语态的翻译。\"这首歌\"是动作的承受者，作主语用this song；\"由...演唱\"用被动语态be sung by表达；\"一位著名歌手\"用a famous singer。描述一般事实用一般现在时，主语this song是单数，be动词用is，sing的过去分词是sung。注意by后面接动作的执行者。"},{"id":"g3_english_016_ex06","knowledge_id":"g3_english_016","question":"语法选择题：—______ the computer ______ in your country?\n—Yes, it is.\nA. Is; made\nB. Does; make\nC. Did; make\nD. Was; made","answer":"答案：A\n解析：本题考查一般现在时被动语态的疑问句形式。根据答语Yes, it is.可知问句中含有is，排除B、C选项。句子主语the computer是动作make的承受者，要用被动语态。询问一般情况用一般现在时，所以选Is; made。D选项Was; made是一般过去时，与答语中的is不符。"},{"id":"g3_english_016_ex07","knowledge_id":"g3_english_016","question":"填空题：These photos ______ ______ (take) on the Great Wall last summer.（用被动语态填空）","answer":"答案：were taken\n解析：本题考查一般过去时的被动语态。句子主语these photos（这些照片）是动作take（拍摄）的承受者，要用被动语态。根据时间状语last summer可知用一般过去时，被动语态结构为was/were + 过去分词。主语photos是复数，be动词用were，take的过去分词是taken，所以填were taken。"},{"id":"g3_english_016_ex08","knowledge_id":"g3_english_016","question":"句型转换题：We will hold a sports meeting next week.（改为被动语态）\nA sports meeting ______ ______ ______ by us next week.","answer":"答案：will be held\n解析：本题考查一般将来时的被动语态。主动语态变被动语态时，一般将来时的被动结构为will be + 过去分词。原句宾语a sports meeting变为主语，谓语变为will be held，原主语we前加by变为by us。hold的过去分词是held，所以填will be held。"},{"id":"g3_english_016_ex09","knowledge_id":"g3_english_016","question":"语法选择题：Many trees ______ every spring in our school.\nA. plant\nB. planted\nC. are planted\nD. were planted","answer":"答案：C\n解析：本题考查一般现在时的被动语态。句子主语many trees（许多树）是动作plant（种植）的承受者，所以用被动语态。根据时间状语every spring可知是经常性、习惯性的动作，用一般现在时。一般现在时被动语态结构为am/is/are + 过去分词，主语trees是复数，be动词用are，plant的过去分词是planted，所以选are planted。"},{"id":"g3_english_016_ex10","knowledge_id":"g3_english_016","question":"翻译题：那座大楼是去年建造的吗？（用被动语态翻译）","answer":"答案：Was that building built last year?\n解析：本题考查一般过去时被动语态的一般疑问句。\"那座大楼\"是主语，用that building；\"建造\"用build，大楼是被建造的，所以用被动语态be built；\"去年\"用last year，句子用一般过去时。一般疑问句把be动词提前，主语that building是单数，be动词用was，build的过去分词是built。所以完整句子是Was that building built last year?"},{"id":"g3_english_017_ex01","knowledge_id":"g3_english_017","question":"语法选择题：The telephone ______ by Alexander Graham Bell in 1876.\nA. invented\nB. was invented\nC. is invented\nD. invents","answer":"答案：B\n解析：本题考查一般过去时的被动语态。句子主语the telephone（电话）是动作invent（发明）的承受者，所以用被动语态。根据时间状语in 1876可知是过去的事情，用一般过去时。一般过去时被动语态的结构是was/were + 及物动词的过去分词。主语the telephone是单数，所以用was invented。A选项invented是主动语态过去式；C选项is invented是一般现在时被动语态；D选项invents是一般现在时主动语态。"},{"id":"g3_english_017_ex02","knowledge_id":"g3_english_017","question":"语法选择题：—When ______ the bridge ______?\n—Last year.\nA. did; build\nB. was; built\nC. is; built\nD. does; build","answer":"答案：B\n解析：本题考查一般过去时被动语态的特殊疑问句。根据答语Last year可知用一般过去时，排除C、D选项。句子主语the bridge是动作build的承受者，要用被动语态。一般过去时被动语态的特殊疑问句结构是：疑问词 + was/were + 主语 + 过去分词。所以选was; built。A选项did; build是主动语态的疑问形式。"},{"id":"g3_english_017_ex03","knowledge_id":"g3_english_017","question":"填空题：The song ______ ______ (write) by a famous musician ten years ago.（用一般过去时被动语态填空）","answer":"答案：was written\n解析：本题考查一般过去时的被动语态。句子主语the song（这首歌）是动作write（写）的承受者，所以用被动语态。根据时间状语ten years ago可知用一般过去时。一般过去时被动语态结构为was/were + 过去分词。主语the song是单数，be动词用was，write的过去分词是written，所以填was written。"},{"id":"g3_english_017_ex04","knowledge_id":"g3_english_017","question":"句型转换题：They built this hospital in 2000.（改为一般过去时被动语态）\nThis hospital ______ ______ by them in 2000.","answer":"答案：was built\n解析：本题考查主动语态变一般过去时被动语态。变换步骤：1) 把主动句的宾语this hospital变成被动句的主语；2) 谓语动词改为was/were + 过去分词结构，时态保持一般过去时不变；3) 原句主语they前加by，变成by them。主语this hospital是单数，be动词用was，build的过去分词是built，所以填was built。"},{"id":"g3_english_017_ex05","knowledge_id":"g3_english_017","question":"翻译题：这所学校是在1990年建成的。（用一般过去时被动语态翻译）","answer":"答案：This school was built in 1990.\n解析：本题考查一般过去时被动语态的翻译。\"这所学校\"作主语用this school，是动作\"建成\"的承受者，所以用被动语态be built；\"在1990年\"用in 1990，表示过去的时间，用一般过去时。主语this school是单数，be动词用was，build的过去分词是built。完整句子为This school was built in 1990."},{"id":"g3_english_017_ex06","knowledge_id":"g3_english_017","question":"语法选择题：These books ______ in the 19th century.\nA. were written\nB. wrote\nC. are written\nD. was written","answer":"答案：A\n解析：本题考查一般过去时被动语态的复数形式。句子主语these books（这些书）是动作write（写）的承受者，用被动语态。根据时间状语in the 19th century（在19世纪）可知用一般过去时。主语these books是复数，所以be动词用were，write的过去分词是written，因此选were written。B选项wrote是主动语态；C选项are written是一般现在时被动语态；D选项was written是单数形式，与主语不一致。"},{"id":"g3_english_017_ex07","knowledge_id":"g3_english_017","question":"填空题：The lost boy ______ ______ (find) by the police yesterday afternoon.（用一般过去时被动语态填空）","answer":"答案：was found\n解析：本题考查一般过去时的被动语态。句子主语the lost boy（失踪的男孩）是动作find（找到）的承受者，用被动语态。根据时间状语yesterday afternoon可知用一般过去时。主语the boy是单数，be动词用was，find的过去分词是found，所以填was found。"},{"id":"g3_english_017_ex08","knowledge_id":"g3_english_017","question":"句型转换题：Did your father buy this car last month?（改为被动语态）\n______ this car ______ by your father last month?","answer":"答案：Was; bought\n解析：本题考查一般过去时被动语态的一般疑问句。主动句是一般过去时的一般疑问句，变为被动语态时，结构为Was/Were + 主语 + 过去分词 + by + 宾语？原句宾语this car变为被动句主语，是单数，所以用Was开头；buy的过去分词是bought。因此填Was; bought。注意句首首字母大写。"},{"id":"g3_english_017_ex09","knowledge_id":"g3_english_017","question":"语法选择题：The old house ______ after a heavy rain last night.\nA. fell down\nB. was fallen down\nC. is fallen down\nD. falls down","answer":"答案：A\n解析：本题考查不及物动词的被动语态问题。fall down是不及物动词短语，表示\"倒塌\"，不及物动词没有被动语态形式，所以排除B、C选项。根据时间状语last night可知用一般过去时，fall的过去式是fell，所以选fell down。注意：只有及物动词才有被动语态，不及物动词或不及物动词短语不能用于被动语态。"},{"id":"g3_english_017_ex10","knowledge_id":"g3_english_017","question":"翻译题：昨天那个孩子被送到了医院。（用一般过去时被动语态翻译）","answer":"答案：The child was sent to the hospital yesterday.\n解析：本题考查一般过去时被动语态的翻译。\"那个孩子\"作主语用the child，是动作\"送\"的承受者，用被动语态be sent to；\"昨天\"用yesterday，表示过去，用一般过去时；\"医院\"用the hospital。主语the child是单数，be动词用was，send的过去分词是sent。完整句子为The child was sent to the hospital yesterday."},{"id":"g3_english_018_ex01","knowledge_id":"g3_english_018","question":"语法选择题：Edison ______ the electric light bulb.\nA. invented\nB. discovered\nC. found\nD. found out","answer":"答案：A\n解析：本题考查invent与discover/find的区别。invent意为\"发明\"，指创造出原来不存在的新事物；discover意为\"发现\"，指发现已经存在但不为人知的事物；find意为\"找到\"，指找到丢失或寻找的东西。电灯泡原本不存在，是爱迪生发明创造出来的，所以用invented。B选项discovered是发现已存在的事物；C选项found是找到丢失的东西；D选项found out是查明、弄清楚事情真相。"},{"id":"g3_english_018_ex02","knowledge_id":"g3_english_018","question":"语法选择题：Columbus ______ America in 1492.\nA. invented\nB. discovered\nC. found\nD. looked for","answer":"答案：B\n解析：本题考查discover与invent/find的区别。discover意为\"发现\"，指发现或找到本来就存在但之前未被人知晓的事物；invent是\"发明\"创造新事物；find是\"找到\"丢失的东西。美洲大陆本来就存在，只是之前不被欧洲人所知，所以哥伦布是\"发现\"了美洲，用discovered。A选项invented是发明创造原本不存在的东西；C选项found侧重找到丢失的或具体的东西；D选项looked for是寻找的动作，不强调结果。"},{"id":"g3_english_018_ex03","knowledge_id":"g3_english_018","question":"填空题：I ______ (find/discover/invent) my lost keys under the bed this morning.（选择正确的词并用适当形式填空）","answer":"答案：
