found\n解析：本题考查find的用法。find意为\"找到、发现\"，是普通用语，多指找到丢失的东西或发现具体的事物。本句中是\"找到丢失的钥匙\"，强调找到丢失物品的结果，所以用find的过去式found。discover多用于科学上的发现或发现重大的、原来不为人知的事物；invent是发明创造新事物。本句是日常用语中找到丢失的东西，用found最恰当。"},{"id":"g3_english_018_ex04","knowledge_id":"g3_english_018","question":"句型转换题：Who invented the telephone?（改为被动语态）\nWho ______ the telephone ______ ______?","answer":"答案：was; invented by\n解析：本题考查invent的被动语态用法。特殊疑问句的被动语态结构为：疑问词 + was/were + 主语 + 过去分词 + by...? 原句中the telephone是动作的承受者，作被动句的主语；invent的过去分词是invented；主语是单数，用was；动作的执行者who前加by变为by who，但习惯上用by whom或把by放在句末。本题按所给空格填was; invented by。"},{"id":"g3_english_018_ex05","knowledge_id":"g3_english_018","question":"翻译题：牛顿发现了万有引力定律。（用discover翻译）","answer":"答案：Newton discovered the law of gravity.\n解析：本题考查discover的用法。discover表示\"发现\"已存在但未被人知的事物或规律。万有引力定律是自然界中本来就存在的规律，牛顿只是发现了它，而不是发明了它，所以用discover。描述过去的事用一般过去时，discover的过去式是discovered。\"万有引力定律\"翻译为the law of gravity。"},{"id":"g3_english_018_ex06","knowledge_id":"g3_english_018","question":"语法选择题：—Have you ______ your umbrella?\n—No, I haven't ______ it yet.\nA. found; found\nB. discovered; discovered\nC. invented; invented\nD. found out; found out","answer":"答案：A\n解析：本题考查find的用法。find意为\"找到\"，指寻找后得到结果，是普通用语。雨伞是丢失的物品，找到雨伞用find。discover是发现本来存在但不为人知的重大事物；invent是发明创造新事物；find out是经过调查、研究后查明、弄清楚事情的真相。雨伞是日常物品，丢失后找到用find。"},{"id":"g3_english_018_ex07","knowledge_id":"g3_english_018","question":"填空题：Scientists have ______ (discover/invent/find) a new kind of plant in the forest.（选择正确的词并用适当形式填空）","answer":"答案：discovered\n解析：本题考查discover的用法。discover意为\"发现\"，指发现已经存在但以前不为人知的事物。新的植物品种本来就在森林中存在，只是之前没有被人类发现，所以用discover。句子用现在完成时，结构为have/has + 过去分词，discover的过去分词是discovered。invent是发明创造原来不存在的东西；find是找到丢失的东西或普通发现。"},{"id":"g3_english_018_ex08","knowledge_id":"g3_english_018","question":"语法选择题：The Chinese ______ paper making thousands of years ago.\nA. discovered\nB. invented\nC. found\nD. found out","answer":"答案：B\n解析：本题考查invent的用法。invent意为\"发明\"，指创造出以前从未有过的新事物、新方法或新工具。造纸术是中国人创造发明出来的，之前并不存在，所以用invented。A选项discovered是发现已存在的事物；C选项found是找到丢失的东西；D选项found out是查明、弄清楚事实真相。造纸术是人类创造发明的，所以选B。"},{"id":"g3_english_018_ex09","knowledge_id":"g3_english_018","question":"句型转换题：We found the cat in the garden.（改为被动语态）\nThe cat ______ ______ in the garden by us.","answer":"答案：was found\n解析：本题考查find的被动语态。句子主语the cat是动作find的承受者，所以用被动语态。原句是一般过去时，被动语态结构为was/were + 过去分词。主语the cat是单数，be动词用was，find的过去分词是found，所以填was found。注意find的过去式和过去分词都是found，不要混淆。"},{"id":"g3_english_018_ex10","knowledge_id":"g3_english_018","question":"翻译题：你能告诉我是谁发明了电脑吗？（用invent翻译）","answer":"答案：Can you tell me who invented the computer?\n解析：本题考查invent的用法。invent表示\"发明\"创造原本不存在的新事物。电脑是人类发明创造出来的，所以用invent。这是一个含有宾语从句的主从复合句，主句是Can you tell me，从句用陈述句语序，从句动作发生在过去，用一般过去时，invent的过去式是invented。\"电脑\"用the computer表示一类事物。"},{"id":"g3_english_019_ex01","knowledge_id":"g3_english_019","question":"语法选择题：______ is said that he has been to many countries.\nA. It\nB. This\nC. That\nD. What","answer":"答案：A\n解析：本题考查It is said that句型。It is said that...是一个固定句型，意为\"据说……\"，其中it是形式主语，真正的主语是后面的that从句。类似的结构还有It is reported that...（据报道……）、It is believed that...（人们相信……）等。this、that、what都不能作形式主语，所以选It。"},{"id":"g3_english_019_ex02","knowledge_id":"g3_english_019","question":"语法选择题：It is said that he ______ a new novel last year.\nA. writes\nB. wrote\nC. has written\nD. is writing","answer":"答案：B\n解析：本题考查It is said that句型中的时态。It is said that...主句是一般现在时，但从句的时态要根据从句自身的时间状语来确定。根据时间状语last year可知从句要用一般过去时，write的过去式是wrote，所以选B。A选项writes是一般现在时；C选项has written是现在完成时；D选项is writing是现在进行时，都与last year不符。"},{"id":"g3_english_019_ex03","knowledge_id":"g3_english_019","question":"填空题：______ ______ ______ (据说) that the movie is very interesting.","answer":"答案：It is said\n解析：本题考查It is said that句型的基本结构。It is said that...表示\"据说……\"，是一个常用的固定句型。it是形式主语，真正的主语是that引导的主语从句。为了避免句子头重脚轻，用it作形式主语放在句首，把真正的主语从句放在后面。注意句首首字母大写。"},{"id":"g3_english_019_ex04","knowledge_id":"g3_english_019","question":"句型转换题：People say that he is a famous doctor.（改为同义句）\n______ ______ ______ that he is a famous doctor.","answer":"答案：It is said\n解析：本题考查It is said that句型与主动语态的转换。People say that...（人们说……）的同义句型是It is said that...（据说……）。It is said that是被动语态形式，it作形式主语，真正的主语是that从句。两者意思基本相同，可以互换。注意句首首字母大写。"},{"id":"g3_english_019_ex05","knowledge_id":"g3_english_019","question":"翻译题：据说他是一位著名的科学家。（用It is said that翻译）","answer":"答案：It is said that he is a famous scientist.\n解析：本题考查It is said that句型的翻译。\"据说……\"常用句型It is said that...来表达，其中it是形式主语，真正的主语是that从句。\"他是一位著名的科学家\"翻译为he is a famous scientist，作that从句的内容。描述一般情况用一般现在时。注意句首首字母大写。"},{"id":"g3_english_019_ex06","knowledge_id":"g3_english_019","question":"语法选择题：______ is reported that there was a big fire in the city yesterday.\nA. It\nB. As\nC. What\nD. That","answer":"答案：A\n解析：本题考查与It is said that类似的句型。It is reported that...意为\"据报道……\"，与It is said that...结构相同，都是it作形式主语，真正的主语是that从句。类似的结构还有：It is believed that...（人们相信……）、It is known that...（众所周知……）、It is hoped that...（人们希望……）等。as引导非限制性定语从句时句子结构不同；what和that不能作形式主语。"},{"id":"g3_english_019_ex07","knowledge_id":"g3_english_019","question":"填空题：______ ______ ______ (众所周知) that the earth goes around the sun.","answer":"答案：It is known\n解析：本题考查It is + 过去分词 + that句型。It is known that...表示\"众所周知……\"，与It is said that...结构相同，都是it作形式主语，that从句是真正的主语。类似的过去分词还有said、reported、believed、hoped、found等，都可以用于这个句型。注意句首首字母大写。"},{"id":"g3_english_019_ex08","knowledge_id":"g3_english_019","question":"句型转换题：It is said that she has lived in Paris for ten years.（改为简单句）\nShe ______ ______ ______ have lived in Paris for ten years.","answer":"答案：is said to\n解析：本题考查It is said that句型与sb. be said to do结构的转换。It is said that + 从句可以转换为\"主语 + be said to do\"的结构，意思相同。从句是现在完成时has lived，转换为不定式的完成式to have lived。主语she是单数，be动词用is，所以填is said to。"},{"id":"g3_english_019_ex09","knowledge_id":"g3_english_019","question":"语法选择题：It is said that ______ a new school in the town next year.\nA. there is\nB. there will have\nC. there will be\nD. there is going to have","answer":"答案：C\n解析：本题考查It is said that句型中的there be结构。It is said that后面接完整的句子，根据时间状语next year可知要用一般将来时。there be句型的一般将来时是there will be或there is/are going to be，不能与have混用，所以排除B、D选项。A选项there is是一般现在时，与next year不符。所以选there will be。"},{"id":"g3_english_019_ex10","knowledge_id":"g3_english_019","question":"翻译题：据说这本书已经被翻译成了多种语言。（用It is said that翻译）","answer":"答案：It is said that this book has been translated into many languages.\n解析：本题考查It is said that句型的翻译。\"据说……\"用It is said that...表达；\"这本书\"用this book，在从句中作主语，书是被翻译的，所以用被动语态be translated into；\"多种语言\"用many languages。\"已经被翻译\"用现在完成时的被动语态has been translated，因为主语this book是单数。完整句子为It is said that this book has been translated into many languages."},{"id":"g3_english_020_ex01","knowledge_id":"g3_english_020","question":"语法选择题：The environment ______ in our daily lives. Everyone should play a part in protecting it.\nA. should protect\nB. should be protected\nC. should protected\nD. should be protect","answer":"答案：B\n解析：本题考查情态动词的被动语态。主语The environment（环境）是动作protect（保护）的承受者，应用被动语态。情态动词被动语态的结构为：情态动词 + be + 过去分词。should是情态动词，protect的过去分词是protected。故选B。"},{"id":"g3_english_020_ex02","knowledge_id":"g3_english_020","question":"语法选择题：Teenagers ______ to choose their own clothes. They are old enough to make their own decisions.\nA. should allow\nB. should be allowed\nC. must allow\nD. may allow","answer":"答案：B\n解析：本题考查情态动词的被动语态。主语Teenagers（青少年）是动作allow（允许）的承受者，即「青少年被允许」，应用被动语态。情态动词被动语态结构：情态动词 + be + 过去分词。should be allowed意为「应该被允许」，符合语境。故选B。"},{"id":"g3_english_020_ex03","knowledge_id":"g3_english_020","question":"语法选择题：--- Must the work ______ today?\n--- I'm afraid so. The boss needs it tomorrow morning.\nA. finish\nB. be finished\nC. finished\nD. is finished","answer":"答案：B\n解析：本题考查情态动词的被动语态。主语the work（工作）是动作finish（完成）的承受者，应用被动语态。含有情态动词must的被动语态结构为：must + be + 过去分词。疑问句中将must提前，后面接be + 过去分词。finish的过去分词是finished。故选B。"},{"id":"g3_english_020_ex04","knowledge_id":"g3_english_020","question":"语法选择题：Some students think that homework ______ to them every day. They want more free time to relax.\nA. shouldn't give\nB. shouldn't be given\nC. needn't give\nD. can't give","answer":"答案：B\n解析：本题考查情态动词被动语态的否定形式。主语homework（作业）是动作give（给）的承受者，应用被动语态。情态动词被动语态的否定形式为：情态动词 + not + be + 过去分词。shouldn't be given意为「不应该被布置」，符合语境。故选B。"},{"id":"g3_english_020_ex05","knowledge_id":"g3_english_020","question":"填空题：用所给动词的适当形式填空。\nThe work can ______ (finish) in two days if we work together as a team.","answer":"答案：be finished\n解析：本题考查情态动词的被动语态。主语The work（工作）是动作finish（完成）的承受者，应用被动语态。含有情态动词can的被动语态结构为：can + be + 过去分词。finish的过去分词是finished。句意：如果我们团队合作，这项工作可以在两天内完成。"},{"id":"g3_english_020_ex06","knowledge_id":"g3_english_020","question":"填空题：用所给动词的适当形式填空。\nThese books must ______ (return) to the library before Friday, or you will be fined.","answer":"答案：be returned\n解析：本题考查情态动词的被动语态。主语These books（这些书）是动作return（归还）的承受者，即「书被归还」，应用被动语态。含有情态动词must的被动语态结构为：must + be + 过去分词。return的过去分词是returned。句意：这些书必须在周五之前归还图书馆，否则你会被罚款。"},{"id":"g3_english_020_ex07","knowledge_id":"g3_english_020","question":"句型转换题：将下列句子改为被动语态，每空一词。\nWe should plant more trees to protect the environment.\n→ More trees ______ ______ ______ to protect the environment.","answer":"答案：should be planted\n解析：本题考查情态动词被动语态的句型转换。原句是含有情态动词should的主动语态，改为被动语态时，结构为：主语（原句宾语）+ should + be + 过去分词 + 其他。plant的过去分词是planted。句意：应该种更多的树来保护环境。"},{"id":"g3_english_020_ex08","knowledge_id":"g3_english_020","question":"句型转换题：将下列句子改为否定句，每空一词。\nThe problem can be worked out easily by him.\n→ The problem ______ ______ ______ out easily by him.","answer":"答案：can't be worked\n解析：本题考查情态动词被动语态的否定形式。含有情态动词的被动语态变否定句时，直接在情态动词后面加not即可，can not可缩写为can't，后面的be + 过去分词保持不变。句意：这个问题不能被他轻易地算出来。"},{"id":"g3_english_020_ex09","knowledge_id":"g3_english_020","question":"翻译题：将下列句子翻译成英语。\n这些问题必须认真对待。（take seriously）","answer":"答案：These problems must be taken seriously.\n解析：本题考查情态动词被动语态的翻译。主语「这些问题」(These problems)是动作「认真对待」(take seriously)的承受者，应用被动语态。情态动词「必须」用must，被动语态结构为must + be + 过去分词。take的过去分词是taken。"},{"id":"g3_english_020_ex10","knowledge_id":"g3_english_020","question":"翻译题：将下列句子翻译成英语。\n青少年不应该被允许熬夜。（stay up）","answer":"答案：Teenagers should not be allowed to stay up. / Teenagers shouldn't be allowed to stay up.\n解析：本题考查情态动词被动语态的翻译。主语「青少年」(Teenagers)是动作「允许」(allow)的承受者，即「被允许」，应用被动语态。「不应该」用should not/shouldn't，被动语态结构为should not + be + 过去分词。allow的过去分词是allowed，allow sb. to do sth.的被动形式是be allowed to do sth.。"},{"id":"g3_english_021_ex01","knowledge_id":"g3_english_021","question":"语法选择题：My parents don't allow me ______ out late on school nights. I have to be home by 9:30.\nA. stay\nB. staying\nC. to stay\nD. stayed","answer":"答案：C\n解析：本题考查allow的固定搭配。allow sb. to do sth.是固定结构，意为「允许某人做某事」，其中动词不定式作宾语补足语。根据语境「父母不允许我在外待到很晚」，故选C。"},{"id":"g3_english_021_ex02","knowledge_id":"g3_english_021","question":"语法选择题：We don't allow ______ in the reading room. Please keep quiet and don't disturb others.\nA. talk\nB. talking\nC. to talk\nD. talked","answer":"答案：B\n解析：本题考查allow的用法。allow doing sth.是固定结构，意为「允许做某事」，其中动名词作宾语。注意区别：allow sb. to do sth.（允许某人做某事）和allow doing sth.（允许做某事）。本句主语是We，后面没有sb.作宾语，所以用allow doing sth.的结构。故选B。"},{"id":"g3_english_021_ex03","knowledge_id":"g3_english_021","question":"语法选择题：Students ______ to use mobile phones at school. It's against the school rules.\nA. don't allow\nB. aren't allowed\nC. didn't allow\nD. won't allow","answer":"答案：B\n解析：本题考查allow的被动语态。主语Students（学生）是动作allow（允许）的承受者，即「学生不被允许」，应用被动语态。被动语态结构为：be + 过去分词。根据后句「这违反校规」可知用一般现在时的被动语态，aren't allowed意为「不被允许」。故选B。"},{"id":"g3_english_021_ex04","knowledge_id":"g3_english_021","question":"语法选择题：--- Do you think teenagers should ______ to make their own decisions?\n--- Yes, I think so. They are old enough to think for themselves.\nA. allow\nB. allowed\nC. be allowing\nD. be allowed","answer":"答案：D\n解析：本题考查情态动词的被动语态与allow用法。主语teenagers（青少年）是动作allow（允许）的承受者，应用被动语态。含有情态动词should的被动语态结构为：should + be + 过去分词。allow的过去分词是allowed，所以是should be allowed（应该被允许）。故选D。"},{"id":"g3_english_021_ex05","knowledge_id":"g3_english_021","question":"填空题：用所给动词的适当形式填空。\nOur teacher allows us ______ (discuss) problems with each other in class.","answer":"答案：to discuss\n解析：本题考查allow的固定搭配。allow sb. to do sth.是固定结构，意为「允许某人做某事」，其中动词不定式作宾语补足语。句意：我们的老师允许我们在课堂上互相讨论问题。"},{"id":"g3_english_021_ex06","knowledge_id":"g3_english_021","question":"填空题：用所给动词的适当形式填空。\nThe boss doesn't allow ______ (smoke) in the office. You can go outside if you want.","answer":"答案：smoking\n解析：本题考查allow的用法。allow doing sth.是固定结构，意为「允许做某事」，动名词作宾语。注意：如果后面有sb.作宾语，则用allow sb. to do sth.的结构。本句没有sb.作宾语，所以用allow doing sth.。句意：老板不允许在办公室抽烟。如果你想抽可以出去。"},{"id":"g3_english_021_ex07","knowledge_id":"g3_english_021","question":"句型转换题：改为被动语态，每空一词。\nMy parents allow me to watch TV on weekends.\n→ I ______ ______ to watch TV on weekends by my parents.","answer":"答案：am allowed\n解析：本题考查allow的主动语态变被动语态。原句是allow sb. to do sth.（允许某人做某事）的主动结构，变为被动语态时，原来的宾语me变为主语I，结构为：sb. + be + allowed + to do sth.。主语是I，一般现在时，be动词用am。句意：我被父母允许在周末看电视。"},{"id":"g3_english_021_ex08","knowledge_id":"g3_english_021","question":"句型转换题：改为同义句，每空一词。\nWe don't allow eating in the classroom.\n→ We don't allow ______ ______ ______ in the classroom.","answer":"答案：students to eat\n解析：本题考查allow的两种结构转换。allow doing sth.（允许做某事）可以转换为allow sb. to do sth.（允许某人做某事）。原句We don't allow eating in the classroom.（我们不允许在教室里吃东西）可以转换为We don't allow students/people to eat in the classroom.。根据三个空的限制，填students to eat最符合语境。"},{"id":"g3_english_021_ex09","knowledge_id":"g3_english_021","question":"翻译题：将下列句子翻译成英语。\n老师不允许我们在考试中作弊。（cheat in the exam）","answer":"答案：The teacher doesn't allow us to cheat in the exam.\n解析：本题考查allow sb. to do sth.的用法。「不允许某人做某事」用don't/doesn't allow sb. to do sth.结构。主语The teacher是第三人称单数，用doesn't allow。「我们」作宾语用宾格us。「作弊」是cheat in the exam。"},{"id":"g3_english_021_ex10","knowledge_id":"g3_english_021","question":"翻译题：将下列句子翻译成英语。\n十六岁的孩子不应该被允许开车。（sixteen-year-olds）","answer":"答案：Sixteen-year-olds should not be allowed to drive. / Sixteen-year-olds shouldn't be allowed to drive.\n解析：本题考查allow的被动语态与情态动词结合。「十六岁的孩子」用sixteen-year-olds作主语，是动作allow的承受者，应用被动语态。「不应该被允许做某事」用should not/shouldn't be allowed to do sth.结构。"},{"id":"g3_english_022_ex01","knowledge_id":"g3_english_022","question":"语法选择题：I want to get my hair ______ tomorrow. It's too long and I need a new look.\nA. cut\nB. cutting\nC. to cut\nD. cuts","answer":"答案：A\n解析：本题考查get sth. done的用法。get sth. done意为「让某事被做；请别人做某事」，其中sth.与done之间是被动关系，过去分词作宾语补足语。cut的过去分词还是cut。get my hair cut意为「请人给我剪头发」。故选A。"},{"id":"g3_english_022_ex02","knowledge_id":"g3_english_022","question":"语法选择题：My computer doesn't work. I have to get it ______ this afternoon.\nA. repair\nB. repairing\nC. repaired\nD. to repair","answer":"答案：C\n解析：本题考查get sth. done的用法。get sth. done表示「让某事被做；使某事被完成」，过去分词作宾语补足语，表示被动含义。it指代computer，与repair之间是被动关系，即「电脑被修理」。repair的过去分词是repaired。故选C。"},{"id":"g3_english_022_ex03","knowledge_id":"g3_english_022","question":"语法选择题：--- How did you get the work ______ so quickly?\n--- With my brother's help. We finished it together.\nA. do\nB. doing\nC. done\nD. to do","answer":"答案：C\n解析：本题考查get sth. done的用法。get sth. done意为「使某事被完成」，其中sth.（the work）与done之间是被动关系，用过去分词作宾语补足语。get the work done意为「完成工作」。故选C。"},{"id":"g3_english_022_ex04","knowledge_id":"g3_english_022","question":"语法选择题：The girl got her wallet ______ on the bus yesterday. There was 200 yuan in it.\nA. steal\nB. stealing\nC. stole\nD. stolen","answer":"答案：D\n解析：本题考查get sth. done的用法。get sth. done可以表示「遭遇某事」（常指不愉快的事），其中sth.与过去分词之间是被动关系。wallet（钱包）是被偷的，steal的过去分词是stolen。get her wallet stolen意为「她的钱包被偷了」。故选D。"},{"id":"g3_english_022_ex05","knowledge_id":"g3_english_022","question":"填空题：用所给动词的适当形式填空。\nI need to get my bike ______ (fix) this weekend. It's broken.","answer":"答案：fixed\n解析：本题考查get sth. done的用法。get sth. done意为「让某事被做；请别人做某事」，过去分词作宾语补足语，表示被动。bike与fix之间是被动关系，fix的过去分词是fixed。get my bike fixed意为「请人修理我的自行车」。"},{"id":"g3_english_022_ex06","knowledge_id":"g3_english_022","question":"填空题：用所给动词的适当形式填空。\nBefore the exam, you should get all your books ______ (prepare) well.","answer":"答案：prepared\n解析：本题考查get sth. done的用法。get sth. done意为「使某事被做好；准备好某事」，过去分词作宾语补足语，表示被动或完成的状态。books与prepare之间是被动关系，prepare的过去分词是prepared。get all your books prepared意为「把你所有的书都准备好」。"},{"id":"g3_english_022_ex07","knowledge_id":"g3_english_022","question":"句型转换题：改为同义句，每空一词。\nI asked someone to repair my watch yesterday.\n→ I ______ my watch ______ yesterday.","answer":"答案：got; repaired\n解析：本题考查get sth. done与ask sb. to do sth.的同义转换。原句I asked someone to repair my watch yesterday.（我昨天请人修了我的手表）可以用get sth. done结构来表达相同的意思，即「让某事被做」。时间状语是yesterday，用一般过去时，get的过去式是got，repair的过去分词是repaired。"},{"id":"g3_english_022_ex08","knowledge_id":"g3_english_022","question":"句型转换题：改为被动含义的同义句，每空一词。\nThe photographer took a photo of the beautiful girl.\n→ The beautiful girl got ______ ______ taken by the photographer.","answer":"答案：a photo\n解析：本题考查get sth. done的被动结构转换。原句是主动语态「摄影师给那个漂亮女孩拍了一张照片」，用get sth. done结构改写时，主语是the beautiful girl，结构为get + 宾语 + 过去分词。即get a photo taken（拍了一张照片）。注意这里是get sth. done的完整结构：get + a photo + taken。"},{"id":"g3_english_022_ex09","knowledge_id":"g3_english_022","question":"翻译题：将下列句子翻译成英语。\n我明天要去医院拔牙。（get sth. done; pull out）","answer":"答案：I will get my tooth pulled out in the hospital tomorrow. / I'm going to get my tooth pulled out in the hospital tomorrow.\n解析：本题考查get sth. done的用法。「拔牙」即「让牙齿被拔掉」，用get sth. done结构。「明天」用一般将来时will get或be going to get。pull out意为「拔出」，pull的过去分词是pulled。「在医院」是in the hospital。"},{"id":"g3_english_022_ex10","knowledge_id":"g3_english_022","question":"翻译题：将下列句子翻译成英语。\n你最好在旅行前把所有的事情安排好。（get sth. done; arrange）","answer":"答案：You'd better get everything arranged before the trip.\n解析：本题考查get sth. done的用法。had better do sth.意为「最好做某事」，后接动词原形。「把所有的事情安排好」用get everything arranged，arrange的过去分词是arranged，表示「被安排好」的状态。「在旅行前」是before the trip或before traveling。"},{"id":"g3_english_023_ex01","knowledge_id":"g3_english_023","question":"语法选择题：--- Look! The man at the gate ______ be our headmaster. He is always standing there every morning.\n--- No, it ______ be him. He is holding a meeting in the office now.\nA. must; can't\nB. must; mustn't\nC. can; can't\nD. can; mustn't","answer":"答案：A\n解析：本题考查情态动词表推测的用法。第一空：根据后句「他每天早上总是站在那里」，表示肯定推测，用must（一定）。第二空：根据后句「他现在正在办公室开会」，表示否定推测「不可能」，用can't。mustn't表示「禁止」，不表示推测。故选A。"},{"id":"g3_english_023_ex02","knowledge_id":"g3_english_023","question":"语法选择题：--- Whose book is this? Is it Tom's?\n--- It ______ be his. His name is on the cover.\nA. can\nB. may\nC. must\nD. need","answer":"答案：C\n解析：本题考查情态动词表推测。根据后句「他的名字在封面上」，表示非常有把握的肯定推测，用must（一定）。can表推测常用于否定句或疑问句；may表示「可能」，把握性较小；need不表示推测。故选C。"},{"id":"g3_english_023_ex03","knowledge_id":"g3_english_023","question":"语法选择题：The light in his office is still on. He ______ be working there now.\nA. can't\nB. mustn't\nC. must\nD. need","answer":"答案：C\n解析：本题考查情态动词表推测。根据「他办公室的灯还亮着」，可以推测他「一定」还在工作。must be doing表示「一定正在做某事」，是对现在正在进行动作的肯定推测。can't是否定推测「不可能」；mustn't表示「禁止」；need不表示推测。故选C。"},{"id":"g3_english_023_ex04","knowledge_id":"g3_english_023","question":"语法选择题：--- Is that Lucy's sister?\n--- It ______ be. She has gone to Paris with her parents.\nA. mustn't\nB. can't\nC. needn't\nD. won't","answer":"答案：B\n解析：本题考查情态动词表否定推测。根据后句「她和父母去巴黎了」，表示「不可能」是她，用can't。mustn't表示「禁止」，不表示推测；needn't表示「不必」；won't表示「不会」，是将来时的否定。故选B。"},{"id":"g3_english_023_ex05","knowledge_id":"g3_english_023","question":"填空题：根据语境，填入适当的情态动词表推测。\n--- Where is Li Lei? I can't find him anywhere.\n--- He ______ be in the library. He likes reading there after class.","answer":"答案：may/might/could\n解析：本题考查情态动词表推测。根据语境「我到处找不到他」以及「他喜欢课后在那里看书」，表示可能性不是很大的肯定推测，可用may、might或could，都表示「可能」。might和could的语气比may更委婉一些。"},{"id":"g3_english_023_ex06","knowledge_id":"g3_english_023","question":"填空题：根据语境，填入适当的情态动词。\nThe baby is sleeping. You ______ make any noise, or you will wake him up.","answer":"答案：mustn't\n解析：本题考查情态动词的用法。根据语境「婴儿在睡觉」，表示「禁止、不许」制造噪音，用mustn't，意为「禁止，不许」。注意：mustn't不表示推测，而是表示「禁止」。"},{"id":"g3_english_023_ex07","knowledge_id":"g3_english_023","question":"句型转换题：改为同义句，每空一词。\nMaybe the woman is our new English teacher.\n→ The woman ______ ______ our new English teacher.","answer":"答案：may be\n解析：本题考查maybe与may be的转换。maybe是副词，意为「也许，可能」，常放在句首；may be是「情态动词+be动词」结构，意为「可能是」，在句中作谓语。原句Maybe the woman is...可以转换为The woman may be...，意思相同。"},{"id":"g3_english_023_ex08","knowledge_id":"g3_english_023","question":"句型转换题：改为表示否定推测的句子，每空一词。\nThe boy must be Mr. Smith's son.\n→ The boy ______ ______ Mr. Smith's son.","answer":"答案：can't be\n解析：本题考查情态动词表推测的否定形式。must表示肯定推测「一定」，其否定形式「不可能」用can't，而不能用mustn't（mustn't表示「禁止」）。所以The boy must be...的否定推测是The boy can't be...。"},{"id":"g3_english_023_ex09","knowledge_id":"g3_english_023","question":"翻译题：将下列句子翻译成英语。\n这一定是李明的书，他的名字在上面。","answer":"答案：This must be Li Ming's book. His name is on it.\n解析：本题考查情态动词表肯定推测。「一定」用must，must be表示「一定是」，表示很有把握的推测。「李明的书」用名词所有格Li Ming's book。「在上面」用on it，it指代前面的book。"},{"id":"g3_english_023_ex10","knowledge_id":"g3_english_023","question":"翻译题：将下列句子翻译成英语。\n那个穿红色衣服的女孩不可能是Lucy，因为她昨天去北京了。","answer":"答案：The girl in red can't be Lucy, because she went to Beijing yesterday.\n解析：本题考查情态动词表否定推测。「不可能」用can't，can't be表示「不可能是」，表示有把握的否定推测。注意不能用mustn't，mustn't表示「禁止」。「穿红色衣服的女孩」是the girl in red。「去北京了」用一般过去时went to Beijing。"},{"id":"g3_english_024_ex01","knowledge_id":"g3_english_024","question":"语法选择题：--- Whose dictionary is this?\n--- It must ______ Tom. I saw him use it yesterday.\nA. belong to\nB. belong\nC. be\nD. is","answer":"答案：A\n解析：本题考查belong to的用法。belong to意为「属于」，后接名词或代词宾格，表示某物属于某人。belong是不及物动词，后面不能直接接宾语，必须加介词to。must是情态动词，后面接动词原形。根据语境「这一定属于汤姆」，故选A。"},{"id":"g3_english_024_ex02","knowledge_id":"g3_english_024","question":"语法选择题：The beautiful house ______ my grandfather. He bought it fifty years ago.\nA. is belonging to\nB. belongs to\nC. is belonged to\nD. belong to","answer":"答案：B\n解析：本题考查belong to的用法。belong to意为「属于」，没有进行时态，也没有被动语态，所以排除A和C选项。主语The beautiful house是第三人称单数，谓语动词用第三人称单数形式belongs to。故选B。"},{"id":"g3_english_024_ex03","knowledge_id":"g3_english_024","question":"语法选择题：--- Does this pair of shoes belong to you?\n--- No, they don't ______ me. Mine are over there.\nA. /; belong to\nB. Does; belong to\nC. Do; belong\nD. Does; belong","answer":"答案：B\n解析：本题考查belong to的疑问句和否定句。第一空：this pair of shoes作主语，中心词是pair，是单数，所以助动词用Does。第二空：否定句中，belong to是固定搭配，to不能省略，don't后面接动词原形belong to。故选B。"},{"id":"g3_english_024_ex04","knowledge_id":"g3_english_024","question":"语法选择题：The car belongs to ______. It's ______ car.\nA. hers; her\nB. her; hers\nC. her; her\nD. hers; hers","answer":"答案：C\n解析：本题考查belong to与物主代词的用法。第一空：belong to后面接代词宾格或名词，her是宾格「她」。第二空：后面有名词car，要用形容词性物主代词her（她的）。hers是名词性物主代词，后面不能接名词。句意：这辆车属于她。这是她的车。故选C。"},{"id":"g3_english_024_ex05","knowledge_id":"g3_english_024","question":"填空题：用所给词的适当形式填空。\nThe blue bike ______ (belong) to my brother. He rides it to school every day.","answer":"答案：belongs\n解析：本题考查belong to的用法。belong to意为「属于」，没有进行时态和被动语态。主语The blue bike是第三人称单数，一般现在时，所以谓语动词用第三人称单数形式belongs。"},{"id":"g3_english_024_ex06","knowledge_id":"g3_english_024","question":"填空题：根据句意和首字母提示填空。\n--- Who does the book b______ to?\n--- It belongs to my deskmate Lily.","answer":"答案：belong\n解析：本题考查belong to的用法。根据答语It belongs to...可知问句是问「这本书属于谁」，belong to意为「属于」。前面有助动词does，后面的动词用原形belong。"},{"id":"g3_english_024_ex07","knowledge_id":"g3_english_024","question":"句型转换题：改为同义句，每空一词。\nThis is my sister's computer.\n→ This computer ______ ______ my sister.","answer":"答案：belongs to\n解析：本题考查belong to与名词所有格的同义转换。This is my sister's computer.（这是我姐姐的电脑）可以转换为This computer belongs to my sister.（这台电脑属于我姐姐）。主语This computer是第三人称单数，一般现在时，谓语动词用belongs to。"},{"id":"g3_english_024_ex08","knowledge_id":"g3_english_024","question":"句型转换题：改为一般疑问句，每空一词。\nThe house belongs to the old man.\n→ ______ the house ______ to the old man?","answer":"答案：Does; belong\n解析：本题考查belong to的一般疑问句。belong to是实义动词短语，变一般疑问句时要借助助动词do/does。主语The house是第三人称单数，所以用Does开头，后面的动词belong还原为原形。"},{"id":"g3_english_024_ex09","knowledge_id":"g3_english_024","question":"翻译题：将下列句子翻译成英语。\n这辆新自行车属于我最好的朋友。","answer":"答案：This new bike/bicycle belongs to my best friend.\n解析：本题考查belong to的翻译。「属于」用belong to表示。主语This new bike/bicycle是第三人称单数，一般现在时，谓语动词用belongs to。「我最好的朋友」是my best friend。"},{"id":"g3_english_024_ex10","knowledge_id":"g3_english_024","question":"翻译题：将下列句子翻译成英语。\n你知道这台电脑属于谁吗？","answer":"答案：Do you know who this computer belongs to? / Do you know whom this computer belongs to?\n解析：本题考查belong to在宾语从句中的用法。主句是Do you know，后面接宾语从句，宾语从句用陈述语序。「属于谁」用who/whom...belongs to。who和whom都可以使用，who更口语化，whom更正式。"},{"id":"g3_english_025_ex01","knowledge_id":"g3_english_025","question":"语法选择题：The girl ______ is standing under the tree is my best friend Lily.\nA. who\nB. which\nC. what\nD. whom","answer":"答案：A\n解析：本题考查定语从句关系代词的用法。先行词是the girl（人），关系代词在从句中作主语，因此用who。which用于先行词是物的情况；what不能引导定语从句；whom在从句中作宾语。故选A。"},{"id":"g3_english_025_ex02","knowledge_id":"g3_english_025","question":"语法选择题：This is the book ______ my father bought for me last week.\nA. who\nB. whom\nC. which\nD. whose","answer":"答案：C\n解析：本题考查定语从句关系代词的用法。先行词是the book（物），关系代词在从句中作bought的宾语，因此用which。who和whom用于先行词是人的情况；whose表示所属关系。故选C。"},{"id":"g3_english_025_ex03","knowledge_id":"g3_english_025","question":"语法选择题：The movie ______ we watched last night was very exciting.\nA. who\nB. that\nC. what\nD. whom","answer":"答案：B\n解析：本题考查定语从句关系代词that的用法。先行词是the movie（物），关系代词在从句中作宾语，that既可指人也可指物，符合题意。what不能引导定语从句；who和whom用于指人。故选B。"},{"id":"g3_english_025_ex04","knowledge_id":"g3_english_025","question":"填空题：用适当的关系代词填空。\nThe man ______ is talking to our teacher is Tom's father.\n（提示：先行词是人，在从句中作主语）","answer":"答案：who/that\n解析：先行词the man指人，关系代词在定语从句中作主语，可用who或that。who专指人，that既可指人也可指物，两者都可以在从句中作主语。"},{"id":"g3_english_025_ex05","knowledge_id":"g3_english_025","question":"填空题：用适当的关系代词填空。\nThe letter ______ I received yesterday was from my pen pal.\n（提示：先行词是物，在从句中作宾语）","answer":"答案：which/that\n解析：先行词the letter指物，关系代词在定语从句中作received的宾语，可用which或that，也可以省略。which专指物，that既可指人也可指物。"},{"id":"g3_english_025_ex06","knowledge_id":"g3_english_025","question":"句型转换题：将两个句子合并为含有定语从句的复合句。\nThe girl is from America. She can speak Chinese very well.\n（提示：先行词the girl，关系代词用who或that）","answer":"答案：The girl who/that can speak Chinese very well is from America.\n解析：本题考查定语从句的合并。先行词是the girl（人），关系代词用who或that，在从句中作主语。合并后句意为：中文说得很好的那个女孩来自美国。"},{"id":"g3_english_025_ex07","knowledge_id":"g3_english_025","question":"句型转换题：将两个句子合并为含有定语从句的复合句。\nI have a cat. The cat is white and black.\n（提示：先行词a cat，关系代词用which或that）","answer":"答案：I have a cat which/that is white and black.\n解析：本题考查定语从句的合并。先行词是a cat（物），关系代词用which或that，在从句中作主语。合并后句意为：我有一只黑白相间的猫。"},{"id":"g3_english_025_ex08","knowledge_id":"g3_english_025","question":"翻译题：翻译句子。\n正在弹钢琴的那个女孩是我的表妹。\n（提示：先行词the girl，弹钢琴play the piano，用现在进行时）","answer":"答案：The girl who/that is playing the piano is my cousin.\n解析：本题考查定语从句的翻译。先行词the girl指人，用who或that引导定语从句，从句用现在进行时is playing the piano表示正在进行的动作。"},{"id":"g3_english_025_ex09","knowledge_id":"g3_english_025","question":"翻译题：翻译句子。\n这是我上周买的那本字典。\n（提示：先行词the dictionary，用一般过去时）","answer":"答案：This is the dictionary which/that I bought last week.\n解析：本题考查定语从句的翻译。先行词the dictionary指物，用which或that引导定语从句，也可以省略关系代词。从句用一般过去时bought表示上周发生的动作。"},{"id":"g3_english_025_ex10","knowledge_id":"g3_english_025","question":"语法选择题：—Do you know the boy ______ is running on the playground?\n—Yes, he is my classmate.\nA. which\nB. who\nC. whom\nD. whose","answer":"答案：B\n解析：本题考查定语从句关系代词的辨析。先行词是the boy（人），关系代词在从句中作主语，所以用who。which指物；whom在从句中作宾语；whose表示所属关系。故选B。"},{"id":"g3_english_026_ex01","knowledge_id":"g3_english_026","question":"语法选择题：—What kind of music do you like?\n—I prefer music that ______ great lyrics.\nA. have\nB. has\nC. having\nD. had","answer":"答案：B\n解析：本题考查prefer后接宾语从句的用法。prefer后接that引导的宾语从句，从句主语that指代music（不可数名词），所以谓语动词用第三人称单数形式has。故选B。"},{"id":"g3_english_026_ex02","knowledge_id":"g3_english_026","question":"语法选择题：My younger brother prefers ______ basketball rather than ______ computer games on weekends.\nA. to play; play\nB. playing; play\nC. to play; playing\nD. play; play","answer":"答案：A\n解析：本题考查prefer的固定搭配。prefer to do A rather than do B表示\"宁愿做A也不做B\"，这是固定结构，prefer后接不定式，rather than后接动词原形。故选A。"},{"id":"g3_english_026_ex03","knowledge_id":"g3_english_026","question":"语法选择题：In her spare time, she prefers reading books ______ watching TV.\nA. than\nB. to\nC. for\nD. of","answer":"答案：B\n解析：本题考查prefer的固定搭配。prefer doing A to doing B表示\"比起做B更喜欢做A\"，这是固定搭配，to是介词，后接动名词形式。故选B。"},{"id":"g3_english_026_ex04","knowledge_id":"g3_english_026","question":"填空题：用所给词的适当形式填空。\nI prefer ______ (swim) to ______ (run) in summer.\n（提示：prefer doing A to doing B 结构）","answer":"答案：swimming; running\n解析：本题考查prefer doing A to doing B结构。prefer...to...表示\"比起...更喜欢...\"，其中to是介词，前后都接动名词形式，即prefer doing A to doing B。"},{"id":"g3_english_026_ex05","knowledge_id":"g3_english_026","question":"填空题：用适当的词填空。\nShe prefers to stay at home ______ than go to the party.\n（提示：prefer to do... rather than do... 结构）","answer":"答案：rather\n解析：本题考查prefer to do... rather than do...的固定结构。该结构表示\"宁愿做...也不做...\"，prefer后接不定式，rather than后接动词原形。"},{"id":"g3_english_026_ex06","knowledge_id":"g3_english_026","question":"句型转换题：同义句转换。\nI like apples better than bananas.\n= I ______ apples ______ bananas.","answer":"答案：prefer; to\n解析：本题考查prefer的用法。like A better than B = prefer A to B，表示\"比起B更喜欢A\"。prefer...to...是固定搭配，to是介词。"},{"id":"g3_english_026_ex07","knowledge_id":"g3_english_026","question":"句型转换题：同义句转换。\nHe would rather watch TV at home than go shopping.\n= He ______ ______ watch TV at home ______ go shopping.","answer":"答案：prefers to; rather than\n解析：本题考查would rather...than...与prefer to...rather than...的同义转换。would rather do A than do B = prefer to do A rather than do B，都表示\"宁愿做A也不做B\"。注意主语是he，prefer用第三人称单数形式prefers。"},{"id":"g3_english_026_ex08","knowledge_id":"g3_english_026","question":"翻译题：翻译句子。\n比起咖啡，我更喜欢茶。","answer":"答案：I prefer tea to coffee.\n解析：本题考查prefer的基本用法。prefer A to B表示\"比起B更喜欢A\"，这是最常用的prefer搭配，to是介词，注意前后比较对象的形式要一致。"},{"id":"g3_english_026_ex09","knowledge_id":"g3_english_026","question":"翻译题：翻译句子。\n我宁愿步行去学校也不愿坐公交车。","answer":"答案：I prefer to walk to school rather than take the bus.\n解析：本题考查prefer to do... rather than do...结构。该结构表示\"宁愿做...也不做...\"，prefer后接不定式，rather than后接动词原形。步行去学校：walk to school；坐公交车：take the bus。"},{"id":"g3_english_026_ex10","knowledge_id":"g3_english_026","question":"语法选择题：Which of the following sentences is correct?\nA. She prefers sing to dance.\nB. She prefers singing to dancing.\nC. She prefers to singing to dancing.\nD. She prefers singing than dancing.","answer":"答案：B\n解析：本题考查prefer的正确用法。prefer doing A to doing B表示\"比起做B更喜欢做A\"，前后都要用动名词形式，中间用介词to连接。A选项动词形式错误；C选项prefer后接动名词时不需要to；D选项介词搭配错误，应用to而不是than。故选B。"},{"id":"g3_english_027_ex01","knowledge_id":"g3_english_027","question":"语法选择题：The girl who ______ reading under the tree is my sister.\nA. is\nB. are\nC. was\nD. were","answer":"答案：A\n解析：本题考查定语从句中的主谓一致。定语从句中谓语动词的单复数取决于先行词。本题先行词是the girl（单数），所以从句谓语动词用单数形式is。时态为现在进行时，故选A。"},{"id":"g3_english_027_ex02","knowledge_id":"g3_english_027","question":"语法选择题：The students who ______ from Class 3 will visit the museum tomorrow.\nA. is\nB. are\nC. was\nD. comes","answer":"答案：B\n解析：本题考查定语从句中的主谓一致。先行词是the students（复数），所以定语从句中的谓语动词用复数形式are。be from表示\"来自\"，故选B。"},{"id":"g3_english_027_ex03","knowledge_id":"g3_english_027","question":"语法选择题：This is one of the best books that ______ been published this year.\nA. has\nB. have\nC. is\nD. are","answer":"答案：B\n解析：本题考查定语从句中的主谓一致。当先行词被one of修饰时，定语从句的谓语动词用复数形式，因为先行词是the best books（复数）。现在完成时用have + 过去分词，故选B。"},{"id":"g3_english_027_ex04","knowledge_id":"g3_english_027","question":"语法选择题：She is the only one of the girls who ______ passed the exam.\nA. have\nB. has\nC. is\nD. are","answer":"答案：B\n解析：本题考查定语从句中的主谓一致。当先行词被the only one of修饰时，定语从句的谓语动词用单数形式，因为先行词是the only one（单数）。现在完成时用has + 过去分词，故选B。"},{"id":"g3_english_027_ex05","knowledge_id":"g3_english_027","question":"填空题：用be动词的适当形式填空。\nThe book that ______ on the desk belongs to my brother.","answer":"答案：is\n解析：本题考查定语从句中的主谓一致。先行词是the book（单数可数名词），所以定语从句中的谓语动词用单数形式is。句意为：桌子上的那本书是我哥哥的。"},{"id":"g3_english_027_ex06","knowledge_id":"g3_english_027","question":"填空题：用所给动词的适当形式填空。\nThe people who ______ (come) from the UK like Chinese food very much.","answer":"答案：come\n解析：本题考查定语从句中的主谓一致。先行词是the people（集合名词，表复数概念），所以定语从句中的谓语动词用原形come。句意为：来自英国的人们非常喜欢中国食物。"},{"id":"g3_english_027_ex07","knowledge_id":"g3_english_027","question":"句型转换题：将两个句子合并为含有定语从句的复合句，并保证主谓一致。\nThe teacher is very kind. She teaches us English.","answer":"答案：The teacher who/that teaches us English is very kind.\n解析：本题考查定语从句的合并和主谓一致。先行词是the teacher（单数），所以定语从句中的谓语动词teach要用第三人称单数形式teaches。"},{"id":"g3_english_027_ex08","knowledge_id":"g3_english_027","question":"句型转换题：改为同义句，注意主谓一致。\nThis is the best movie. It has been shown this year.\n= This is the best movie that ______ ______ shown this year.","answer":"答案：has been\n解析：本题考查定语从句中的主谓一致和被动语态。先行词是the best movie（单数），所以定语从句中的谓语动词用单数形式。现在完成时的被动语态为has been + 过去分词，故填has been。"},{"id":"g3_english_027_ex09","knowledge_id":"g3_english_027","question":"翻译题：翻译句子。\n正在操场上跑步的那个男孩是我的同班同学。","answer":"答案：The boy who/that is running on the playground is my classmate.\n解析：本题考查定语从句的翻译和主谓一致。先行词the boy是单数，所以定语从句中的谓语动词用is running。现在进行时表示正在进行的动作。"},{"id":"g3_english_027_ex10","knowledge_id":"g3_english_027","question":"翻译题：翻译句子。\n那些来自澳大利亚的学生正在学习中文。","answer":"答案：The students who/that are from Australia are learning Chinese.\n解析：本题考查定语从句的翻译和主谓一致。先行词the students是复数，所以定语从句中的谓语动词用are from。主句也用复数形式are learning。"},{"id":"g3_english_028_ex01","knowledge_id":"g3_english_028","question":"语法选择题：You ______ arrive at the meeting on time tomorrow.\nA. are suppose to\nB. are supposed to\nC. suppose to\nD. supposed to","answer":"答案：B\n解析：本题考查be supposed to的正确形式。be supposed to表示\"应该、被期望\"，其中supposed是过去分词作形容词用，结构为be + supposed + to + 动词原形。主语是you，be动词用are。故选B。"},{"id":"g3_english_028_ex02","knowledge_id":"g3_english_028","question":"语法选择题：—What am I supposed ______ when I meet someone for the first time in China?\n—You are supposed to shake hands.\nA. do\nB. to do\nC. doing\nD. did","answer":"答案：B\n解析：本题考查be supposed to的用法。be supposed to后接动词原形，表示\"应该做某事\"。疑问句中把be动词提前，结构为be + 主语 + supposed + to + 动词原形。故选B。"},{"id":"g3_english_028_ex03","knowledge_id":"g3_english_028","question":"语法选择题：She ______ supposed to come to the party yesterday, but she didn't.\nA. is\nB. was\nC. were\nD. be","answer":"答案：B\n解析：本题考查be supposed to的时态。根据句中的yesterday可知用一般过去时，主语是she，be动词用was。be supposed to的过去式表示\"本应该做某事（但实际上没做）\"。故选B。"},{"id":"g3_english_028_ex04","knowledge_id":"g3_english_028","question":"填空题：用be supposed to的适当形式填空。\nWe ______ ______ (finish) our homework before watching TV.","answer":"答案：are supposed to finish\n解析：本题考查be supposed to的基本用法。be supposed to后接动词原形，表示\"应该做某事\"。主语是we，be动词用are，所以填are supposed to finish。"},{"id":"g3_english_028_ex05","knowledge_id":"g3_english_028","question":"填空题：用适当的词填空。\nThey were supposed ______ ______ (arrive) at 5 o'clock, but they were late.","answer":"答案：to arrive\n解析：本题考查be supposed to的用法。be supposed to后接动词原形，表示\"应该做某事\"。were supposed to arrive表示\"本应该到达\"，暗含实际上没按时到达的意思。"},{"id":"g3_english_028_ex06","knowledge_id":"g3_english_028","question":"句型转换题：改为同义句。\nYou should hand in your homework on time.\n= You ______ ______ ______ hand in your homework on time.","answer":"答案：are supposed to\n解析：本题考查should与be supposed to的同义转换。should表示\"应该\"，相当于be supposed to，都表示责任、义务或预期。主语是you，be动词用are。"},{"id":"g3_english_028_ex07","knowledge_id":"g3_english_028","question":"句型转换题：改为否定句。\nShe is supposed to wear a uniform at school.\n= She ______ ______ to wear a uniform at school.","answer":"答案：isn't supposed\n解析：本题考查be supposed to的否定形式。be supposed to的否定形式是在be动词后加not，即be not supposed to，表示\"不应该做某事\"。主语是she，be动词用is，否定形式是isn't supposed。"},{"id":"g3_english_028_ex08","knowledge_id":"g3_english_028","question":"翻译题：翻译句子。\n你应该在课堂上说英语。","answer":"答案：You are supposed to speak English in class.\n解析：本题考查be supposed to的翻译。be supposed to表示\"应该\"，后接动词原形。说英语：speak English；在课堂上：in class。主语是you，be动词用are。"},{"id":"g3_english_028_ex09","knowledge_id":"g3_english_028","question":"翻译题：翻译句子。\n他们本应该昨天就完成这项工作的。","answer":"答案：They were supposed to finish the work yesterday.\n解析：本题考查be supposed to的过去式用法。be supposed to的过去式（was/were supposed to）表示\"本应该做某事\"，暗含实际上没做的意思。完成工作：finish the work。"},{"id":"g3_english_028_ex10","knowledge_id":"g3_english_028","question":"语法选择题：Which of the following is wrong?\nA. We are supposed to help each other.\nB. What am I supposed to do?\nC. He was supposed to come, but he didn't.\nD. They suppose to finish it today.","answer":"答案：D\n解析：本题考查be supposed to的正确用法。be supposed to结构中必须有be动词，D选项缺少be动词，应该是They are supposed to finish it today。A、B、C选项用法都正确。故选D。"},{"id":"g3_english_029_ex01","knowledge_id":"g3_english_029","question":"语法选择题：I think ______ important to learn English well.\nA. that\nB. this\nC. it\nD. its","answer":"答案：C\n解析：本题考查it作形式宾语的用法。在think/find/consider/make等动词后，常用it作形式宾语，真正的宾语是后面的不定式to learn English well。结构为：主语 + 谓语 + it + 形容词 + to do sth.。故选C。"},{"id":"g3_english_029_ex02","knowledge_id":"g3_english_029","question":"语法选择题：She found ______ difficult to work out the math problem.\nA. it\nB. that\nC. this\nD. one","answer":"答案：A\n解析：本题考查it作形式宾语的用法。find it + 形容词 + to do sth. 表示\"发现做某事是...的\"，其中it是形式宾语，真正的宾语是后面的不定式to work out the math problem。故选A。"},{"id":"g3_english_029_ex03","knowledge_id":"g3_english_029","question":"语法选择题：We think it necessary ______ more books.\nA. read\nB. reading\nC. to read\nD. reads","answer":"答案：C\n解析：本题考查it作形式宾语的用法。think it + 形容词 + to do sth. 表示\"认为做某事是...的\"，其中it是形式宾语，真正的宾语是后面的不定式to read more books。故选C。"},{"id":"g3_english_029_ex04","knowledge_id":"g3_english_029","question":"填空题：用适当的词填空。\nI find ______ easy to learn English if you work hard.","answer":"答案：it\n解析：本题考查it作形式宾语的用法。find it + 形容词 + to do sth. 是固定结构，it作形式宾语，真正的宾语是后面的不定式to learn English。"},{"id":"g3_english_029_ex05","knowledge_id":"g3_english_029","question":"填空题：用所给动词的适当形式填空。\nShe thinks it very interesting ______ (play) basketball with her friends.","answer":"答案：to play\n解析：本题考查it作形式宾语的用法。think it + 形容词 + to do sth. 结构中，it是形式宾语，真正的宾语是后面的不定式短语to play basketball with her friends。"},{"id":"g3_english_029_ex06","knowledge_id":"g3_english_029","question":"句型转换题：改为简单句（用it作形式宾语）。\nI think that learning English well is important.\n= I think ______ important ______ ______ English well.","answer":"答案：it; to learn\n解析：本题考查宾语从句与it作形式宾语的转换。原句是that引导的宾语从句，可以转换为\"主语 + 谓语 + it + 形容词 + to do sth.\"结构，it作形式宾语，真正的宾语是后面的不定式。"},{"id":"g3_english_029_ex07","knowledge_id":"g3_english_029","question":"句型转换题：改为复合句（改为宾语从句）。\nWe find it necessary to protect the environment.\n= We find ______ ______ necessary to protect the environment.","answer":"答案：that it is\n解析：本题考查it作形式宾语与宾语从句的转换。it作形式宾语的简单句可以转换为that引导的宾语从句，从句中it作形式主语，真正的主语是后面的不定式。"},{"id":"g3_english_029_ex08","knowledge_id":"g3_english_029","question":"翻译题：翻译句子。\n我认为每天锻炼很重要。","answer":"答案：I think it important to exercise every day.\n解析：本题考查it作形式宾语的翻译。think it + 形容词 + to do sth. 表示\"认为做某事是...的\"，it作形式宾语，真正的宾语是to exercise every day。锻炼：exercise；每天：every day。"},{"id":"g3_english_029_ex09","knowledge_id":"g3_english_029","question":"翻译题：翻译句子。\n我们发现和他交朋友很难。","answer":"答案：We find it difficult to make friends with him.\n解析：本题考查it作形式宾语的翻译。find it + 形容词 + to do sth. 表示\"发现做某事是...的\"，it作形式宾语，真正的宾语是to make friends with him。和某人交朋友：make friends with sb.。"},{"id":"g3_english_029_ex10","knowledge_id":"g3_english_029","question":"语法选择题：Which sentence is wrong?\nA. I find it easy to learn English.\nB. She thinks it important to study hard.\nC. We found that difficult to finish the work.\nD. They consider it necessary to help others.","answer":"答案：C\n解析：本题考查it作形式宾语的正确用法。A、B、D选项都正确使用了it作形式宾语的结构。C选项错误，应该用it作形式宾语，即We found it difficult to finish the work. 或者改为宾语从句We found that it was difficult to finish the work."},{"id":"g3_english_030_ex01","knowledge_id":"g3_english_030","question":"语法选择题：______ he is very tired, he still keeps working.\nA. Although\nB. But\nC. So\nD. Because","answer":"答案：A\n解析：本题考查although/though的用法。although/though表示\"虽然、尽管\"，引导让步状语从句，不能与but同时出现在同一个句子中。句意为：虽然他很累，但他仍然继续工作。故选A。"},{"id":"g3_english_030_ex02","knowledge_id":"g3_english_030","question":"语法选择题：______ it was raining hard, they still went out to play football.\nA. Because\nB. Though\nC. If\nD. When","answer":"答案：B\n解析：本题考查though的用法。though表示\"虽然、尽管\"，引导让步状语从句。句意为：尽管雨下得很大，他们仍然出去踢足球了。because表示原因；if表示条件；when表示时间。故选B。"},{"id":"g3_english_030_ex03","knowledge_id":"g3_english_030","question":"语法选择题：Which of the following sentences is correct?\nA. Although he is young, but he knows a lot.\nB. Although he is young, he knows a lot.\nC. He is young, although he knows a lot.\nD. But he is young, he knows a lot.","answer":"答案：B\n解析：本题考查although/though与but的区别。although/though和but不能同时出现在同一个句子中，只能用其中一个。A选项同时用了although和but，错误；C选项逻辑关系不对；D选项but不能放在句首。故选B。"},{"id":"g3_english_030_ex04","knowledge_id":"g3_english_030","question":"填空题：用适当的连词填空。\n______ she is only 8 years old, she can play the piano very well.","answer":"答案：Although/Though\n解析：本题考查although/though引导让步状语从句的用法。although/though表示\"虽然、尽管\"，引导让步状语从句。句意为：虽然她只有8岁，但她钢琴弹得很好。"},{"id":"g3_english_030_ex05","knowledge_id":"g3_english_030","question":"填空题：用适当的连词填空。\nHe went to school ______ he didn't feel well.","answer":"答案：though/although\n解析：本题考查though/although引导让步状语从句的用法。though/although表示\"虽然、尽管\"，可以放在句中。句意为：虽然他感觉不舒服，但他还是去上学了。"},{"id":"g3_english_030_ex06","knowledge_id":"g3_english_030","question":"句型转换题：改为同义句。\nHe is very young, but he can speak three languages.\n= ______ he is very young, he can speak three languages.","answer":"答案：Although/Though\n解析：本题考查but与although/though的同义转换。but表示转折，放在句中；although/though表示\"虽然、尽管\"，放在句首引导让步状语从句。两者表达的意思相近，但不能同时使用。"},{"id":"g3_english_030_ex07","knowledge_id":"g3_english_030","question":"句型转换题：改为同义句。\nAlthough the problem is difficult, I will work it out.\n= The problem is difficult, ______ I will work it out.","answer":"答案：but\n解析：本题考查although/though与but的转换。although/though引导让步状语从句，可以转换为but连接的并列句。注意although/though和but不能同时出现在同一个句子中。"},{"id":"g3_english_030_ex08","knowledge_id":"g3_english_030","question":"翻译题：翻译句子。\n虽然他很穷，但他很快乐。","answer":"答案：Although/Though he is very poor, he is very happy.\n解析：本题考查although/though引导让步状语从句的翻译。although/though表示\"虽然、尽管\"，引导让步状语从句，不能与but同时使用。也可以翻译为：He is very poor, but he is very happy."},{"id":"g3_english_030_ex09","knowledge_id":"g3_english_030","question":"翻译题：翻译句子。\n尽管下着雨，他们还是继续工作。","answer":"答案：Although/Though it was raining, they went on working.\n解析：本题考查although/though引导让步状语从句的翻译。although/though表示\"尽管、虽然\"，引导让步状语从句。继续工作：go on working；下雨：rain。根据语境用过去进行时或一般过去时。"},{"id":"g3_english_030_ex10","knowledge_id":"g3_english_030","question":"语法选择题：______ his grandma is old, she can still dance very well.\nA. Because\nB. If\nC. Although\nD. So","answer":"答案：C\n解析：本题考查连词辨析。although表示\"虽然、尽管\"，引导让步状语从句，符合句意：虽然他的奶奶年纪大了，但她仍然跳舞跳得很好。because因为；if如果；so所以。故选C。"},{"id":"g3_english_031_ex01","knowledge_id":"g3_english_031","question":"语法选择题：The teacher made the students ______ the homework again.\nA. do\nB. to do\nC. doing\nD. did","answer":"答案：A\n解析：本题考查使役动词make的用法。make sb. do sth. 表示\"使某人做某事\"，make后接不带to的不定式作宾语补足语。在主动语态中，不定式符号to要省略。故选A。"},{"id":"g3_english_031_ex02","knowledge_id":"g3_english_031","question":"语法选择题：The boy was made ______ the classroom by his teacher.\nA. clean\nB. to clean\nC. cleaning\nD. cleaned","answer":"答案：B\n解析：本题考查使役动词make的被动语态。make sb. do sth. 的被动形式是sb. be made to do sth.，在被动语态中，省略的不定式符号to要还原。故选B。"},{"id":"g3_english_031_ex03","knowledge_id":"g3_english_031","question":"语法选择题：The movie made us ______.\nA. happily\nB. happy\nC. happiness\nD. happierly","answer":"答案：B\n解析：本题考查make的用法。make sb. + 形容词 表示\"使某人处于某种状态\"，形容词作宾语补足语。happily是副词；happiness是名词；happierly形式错误。故选B。"},{"id":"g3_english_031_ex04","knowledge_id":"g3_english_031","question":"填空题：用所给动词的适当形式填空。\nThe loud music makes me ______ (want) to leave.","answer":"答案：want\n解析：本题考查make sb. do sth. 的用法。make sb. do sth. 表示\"使某人做某事\"，make后接不带to的不定式作宾语补足语，所以填动词原形want。"},{"id":"g3_english_031_ex05","knowledge_id":"g3_english_031","question":"填空题：用所给词的适当形式填空。\nThe news made everyone ______ (excite).","answer":"答案：excited\n解析：本题考查make sb. + 形容词的用法。make sb. + 形容词 表示\"使某人处于某种状态\"。excite的形容词形式有excited（感到兴奋的，修饰人）和exciting（令人兴奋的，修饰物）。这里修饰everyone，所以用excited。"},{"id":"g3_english_031_ex06","knowledge_id":"g3_english_031","question":"句型转换题：改为被动语态。\nThe boss made the workers work 12 hours a day.\n= The workers ______ ______ ______ work 12 hours a day by the boss.","answer":"答案：were made to\n解析：本题考查make的被动语态。make sb. do sth. 的被动形式是sb. be made to do sth.。原句是一般过去时，被动语态也用一般过去时，主语the workers是复数，所以be动词用were，made后接带to的不定式to work。"},{"id":"g3_english_031_ex07","knowledge_id":"g3_english_031","question":"句型转换题：同义句转换。\nThe story was so funny that we all laughed.\n= The funny story made ______ ______ ______.","answer":"答案：us all laugh\n解析：本题考查so...that...句型与make的转换。so...that...表示\"如此...以至于...\"，可以转换为make sb. do sth. 结构，表示\"使某人做某事\"。make后接不带to的不定式作宾语补足语。"},{"id":"g3_english_031_ex08","knowledge_id":"g3_english_031","question":"翻译题：翻译句子。\n这个消息让我们很开心。","answer":"答案：The news made us very happy.\n解析：本题考查make sb. + 形容词的用法。make sb. + 形容词 表示\"使某人处于某种状态\"。消息：news；开心的：happy。根据语境用一般过去时made。"},{"id":"g3_english_031_ex09","knowledge_id":"g3_english_031","question":"翻译题：翻译句子。\n他妈妈让他每天练习钢琴。","answer":"答案：His mother makes him practice the piano every day.\n解析：本题考查make sb. do sth. 的用法。make sb. do sth. 表示\"使某人做某事\"，make后接不带to的不定式作宾语补足语。练习钢琴：practice the piano；每天：every day。主语his mother是第三人称单数，所以make用makes。"},{"id":"g3_english_031_ex10","knowledge_id":"g3_english_031","question":"语法选择题：Which of the following sentences is correct?\nA. The sad movie made me to cry.\nB. He was made work all day.\nC. The good news made us happy.\nD. Our teacher makes us to study hard.","answer":"答案：C\n解析：本题考查make的正确用法。A选项错误，make sb. do sth. 中不定式不带to；B选项错误，被动语态中要还原to，应该是He was made to work all day；D选项错误，make sb. do sth. 中不定式不带to；C选项正确，make sb. + 形容词表示\"使某人...\"。故选C。"},{"id":"g3_english_032_ex01","knowledge_id":"g3_english_032","question":"语法选择题：I would rather ______ at home than go out on rainy days.\nA. stay\nB. to stay\nC. staying\nD. stayed","answer":"答案：A\n解析：本题考查would rather的用法。would rather do sth. than do sth. 表示\"宁愿做某事而不愿做某事\"，would rather和than后面都接动词原形。故选A。"},{"id":"g3_english_032_ex02","knowledge_id":"g3_english_032","question":"语法选择题：She would rather ______ a doctor than a teacher.\nA. be\nB. is\nC. to be\nD. being","answer":"答案：A\n解析：本题考查would rather的用法。would rather后接动词原形，表示\"宁愿、宁可\"。would rather be... than be... 表示\"宁愿做...而不愿做...\"。故选A。"},{"id":"g3_english_032_ex03","knowledge_id":"g3_english_032","question":"语法选择题：—Would you like to go shopping with me?\n—I'd rather ______ books at home.\nA. read\nB. to read\nC. reading\nD. reads","answer":"答案：A\n解析：本题考查would rather的用法。would rather后接动词原形，表示\"宁愿做某事\"。I'd rather是I would rather的缩写形式。故选A。"},{"id":"g3_english_032_ex04","knowledge_id":"g3_english_032","question":"填空题：用所给动词的适当形式填空。\nHe would rather ______ (play) football than ______ (watch) TV.","answer":"答案：play; watch\n解析：本题考查would rather...than...的用法。would rather do A than do B 表示\"宁愿做A也不做B\"，would rather和than后面都接动词原形。"},{"id":"g3_english_032_ex05","knowledge_id":"g3_english_032","question":"填空题：用适当的词填空。\nI would ______ have a cup of tea than coffee.","answer":"答案：rather\n解析：本题考查would rather...than...的固定搭配。would rather do A than do B 表示\"宁愿做A也不做B\"，是固定结构。"},{"id":"g3_english_032_ex06","knowledge_id":"g3_english_032","question":"句型转换题：同义句转换。\nI prefer to walk to school rather than take the bus.\n= I ______ ______ walk to school ______ take the bus.","answer":"答案：would rather; than\n解析：本题考查prefer to...rather than...与would rather...than...的同义转换。prefer to do A rather than do B = would rather do A than do B，都表示\"宁愿做A也不做B\"，后面都接动词原形。"},{"id":"g3_english_032_ex07","knowledge_id":"g3_english_032","question":"句型转换题：同义句转换。\nShe likes apples better than bananas.\n= She ______ ______ eat apples ______ bananas.","answer":"答案：would rather; than\n解析：本题考查like...better than...与would rather...than...的同义转换。like A better than B = would rather do A than do B，都表示\"比起B更喜欢A\"。注意would rather后要接动词原形，所以加上eat。"},{"id":"g3_english_032_ex08","knowledge_id":"g3_english_032","question":"翻译题：翻译句子。\n我宁愿待在家里也不愿去看电影。","answer":"答案：I would rather stay at home than go to the movies.\n解析：本题考查would rather...than...的翻译。would rather do A than do B 表示\"宁愿做A也不做B\"，would rather和than后面都接动词原形。待在家里：stay at home；去看电影：go to the movies。"},{"id":"g3_english_032_ex09","knowledge_id":"g3_english_032","question":"翻译题：翻译句子。\n他宁愿步行也不愿坐公交车去上班。","answer":"答案：He would rather walk to work than take the bus.\n解析：本题考查would rather...than...的翻译。would rather do A than do B 表示\"宁愿做A也不做B\"，would rather和than后面都接动词原形。步行去上班：walk to work；坐公交车：take the bus。"},{"id":"g3_english_032_ex10","knowledge_id":"g3_english_032","question":"语法选择题：Which of the following sentences is correct?\nA. I would rather to stay at home.\nB. She would rather playing sports.\nC. He would rather read books than watch TV.\nD. They would rather to go shopping.","answer":"答案：C\n解析：本题考查would rather的正确用法。would rather后接动词原形，would rather do A than do B 表示\"宁愿做A也不做B\"。A选项多了to；B选项playing应该是play；D选项多了to。只有C选项形式正确。故选C。"},{"id":"g3_english_033_ex01","knowledge_id":"g3_english_033","question":"语法选择题：______ my brother ______ I am interested in playing basketball. We both like football.\nA. Neither; nor\nB. Both; and\nC. Either; or\nD. Not only; but also","answer":"答案：A\n解析：本题考查neither...nor...的用法。neither...nor...表示\"既不...也不...\"，连接两个并列成分。根据后一句\"我们都喜欢足球\"可知，我和我哥哥都不喜欢篮球。both...and...表示两者都；either...or...表示或者...或者...；not only...but also...表示不但...而且...。故选A。"},{"id":"g3_english_033_ex02","knowledge_id":"g3_english_033","question":"语法选择题：Neither Tom nor his parents ______ at home yesterday.\nA. is\nB. are\nC. was\nD. were","answer":"答案：D\n解析：本题考查neither...nor...连接主语时的主谓一致。neither...nor...连接两个主语时，谓语动词的单复数遵循\"就近原则\"，即与nor后面的主语保持一致。本题中nor后面的主语是his parents（复数），且时间状语是yesterday，所以用were。故选D。"},{"id":"g3_english_033_ex03","knowledge_id":"g3_english_033","question":"语法选择题：—Which would you like, tea or coffee?\n—______. I'd like some water.\nA. Neither\nB. Both\nC. Either\nD. All","answer":"答案：A\n解析：本题考查neither的用法。neither表示\"两者都不\"。根据答语\"我想要一些水\"可知，茶和咖啡都不想要。both表示两者都；either表示两者中的任何一个；all表示三者或三者以上都。故选A。"},{"id":"g3_english_033_ex04","knowledge_id":"g3_english_033","question":"填空题：用适当的词填空。\n______ Lily ______ Lucy has been to Beijing. They hope to go there someday.","answer":"答案：Neither; nor\n解析：本题考查neither...nor...的用法。neither...nor...表示\"既不...也不...\"，连接两个并列主语。根据后一句\"她们希望有一天能去那里\"可知，Lily和Lucy都没去过北京。"},{"id":"g3_english_033_ex05","knowledge_id":"g3_english_033","question":"填空题：用所给动词的适当形式填空。\nNeither he nor I ______ (be) from America.","answer":"答案：am\n解析：本题考查neither...nor...连接主语时的主谓一致。neither...nor...连接两个主语时，谓语动词的单复数遵循\"就近原则\"，即与nor后面的主语保持一致。本题中nor后面的主语是I，所以be动词用am。"},{"id":"g3_english_033_ex06","knowledge_id":"g3_english_033","question":"句型转换题：改为同义句。\nShe doesn't like singing. She doesn't like dancing, either.\n= She likes ______ singing ______ dancing.","answer":"答案：neither; nor\n解析：本题考查neither...nor...的用法。neither...nor...表示\"既不...也不...\"，连接两个并列的宾语。原句表示她不喜欢唱歌也不喜欢跳舞，可以转换为neither...nor...结构。"},{"id":"g3_english_033_ex07","knowledge_id":"g3_english_033","question":"句型转换题：改为否定句（用neither...nor...改写）。\nHe can't speak English. He can't speak Japanese, either.\n= He can speak ______ English ______ Japanese.","answer":"答案：neither; nor\n解析：本题考查neither...nor...的用法。neither...nor...表示\"既不...也不...\"，连接两个并列的宾语。原句是两个否定句，可以用neither...nor...连接两个并列成分，注意谓语动词用肯定形式表示整体否定。"},{"id":"g3_english_033_ex08","knowledge_id":"g3_english_033","question":"翻译题：翻译句子。\n他和他的爸爸都不喜欢看电视。","answer":"答案：Neither he nor his father likes watching TV.\n解析：本题考查neither...nor...的翻译和主谓一致。neither...nor...表示\"既不...也不...\"，连接两个主语时，谓语动词遵循\"就近原则\"，即与nor后面的主语his father保持一致，所以用likes。喜欢做某事：like doing sth.。"},{"id":"g3_english_033_ex09","knowledge_id":"g3_english_033","question":"翻译题：翻译句子。\n数学和英语我都不擅长。","answer":"答案：I am good at neither math nor English.\n解析：本题考查neither...nor...的翻译。neither...nor...表示\"既不...也不...\"，连接两个并列的宾语。擅长：be good at。也可以翻译为：I am not good at math or English. 但用neither...nor...更正式。"},{"id":"g3_english_033_ex10","knowledge_id":"g3_english_033","question":"语法选择题：Which of the following sentences is correct?\nA. Neither Tom nor Jack are from the UK.\nB. Neither he nor she likes reading books.\nC. Neither I nor he am a student.\nD. Neither of them like sports.","answer":"答案：B\n解析：本题考查neither...nor...和neither of的用法及主谓一致。A选项错误，就近原则应与Jack一致，用is；B选项正确，就近原则与she一致，用likes；C选项错误，就近原则应与he一致，用is；D选项错误，neither of + 复数名词/代词，谓语动词用单数likes。故选B。"},{"id":"g3_english_034_ex01","knowledge_id":"g3_english_034","question":"语法选择：By the time I got to the cinema, the movie ______ for ten minutes.\nA. had started\nB. had been on\nC. has started\nD. has been on","answer":"答案：B\n解析：本题考查过去完成时的用法。by the time引导的从句用一般过去时（got），主句表示在从句动作之前已经完成的动作，即\"过去的过去\"，要用过去完成时，排除C和D。start是短暂性动词，不能与for ten minutes表示的一段时间连用，需转换为延续性动词短语be on，故选B。"},{"id":"g3_english_034_ex02","knowledge_id":"g3_english_034","question":"填空题：When I arrived at the station, the train ______（leave）already.","answer":"答案：had left\n解析：本题考查过去完成时。火车离开的动作发生在我到达车站之前，即\"过去的过去\"，所以用过去完成时had + 过去分词。leave的过去分词是left。句中already是完成时的标志词。"},{"id":"g3_english_034_ex03","knowledge_id":"g3_english_034","question":"句型转换：The bus left. Then I got to the bus stop.（合并为一句，用过去完成时）\nBy the time I got to the bus stop, ______ ______ ______ ______.","answer":"答案：the bus had left\n解析：本题考查过去完成时与by the time的搭配。by the time引导的从句用一般过去时，主句用过去完成时，表示主句动作发生在从句动作之前。原句中公交车离开在前，我到达在后，所以主句用the bus had left。"},{"id":"g3_english_034_ex04","knowledge_id":"g3_english_034","question":"翻译题：到上学期末，我们已经学了两千多个英语单词。","answer":"答案：By the end of last term, we had learned more than 2,000 English words.\n解析：本题考查过去完成时的时间状语。by the end of + 过去时间（last term）是过去完成时的标志，表示\"到过去某一时间为止\"，主句用had + 过去分词。learn的过去分词是learned或learnt。\"两千多\"译为more than 2,000或over 2,000。"},{"id":"g3_english_034_ex05","knowledge_id":"g3_english_034","question":"语法选择：He ______ in the factory for three years before he joined the army.\nA. worked\nB. has worked\nC. had worked\nD. was working","answer":"答案：C\n解析：本题考查过去完成时的用法。before引导的从句用一般过去时（joined），主句的动作发生在从句动作之前，即\"过去的过去\"，要用过去完成时had + 过去分词。for three years表示动作持续了一段时间，与完成时连用，故选C。"},{"id":"g3_english_034_ex06","knowledge_id":"g3_english_034","question":"填空题：By the time my parents came back, I ______（finish）my homework.","answer":"答案：had finished\n解析：本题考查过去完成时。by the time引导的从句用一般过去时（came back），主句的动作（完成作业）发生在父母回来之前，是\"过去的过去\"，所以用过去完成时had + 过去分词。finish的过去分词是finished。"},{"id":"g3_english_034_ex07","knowledge_id":"g3_english_034","question":"语法选择：— Did you see Tom at the party?\n— No, he ______ by the time I got there.\nA. left\nB. was leaving\nC. had left\nD. has left","answer":"答案：C\n解析：本题考查过去完成时。问句用一般过去时，答语中by the time I got there表示\"到我到达那里为止\"，到达是过去的动作，而Tom离开发生在到达之前，即\"过去的过去\"，所以用过去完成时had left，故选C。"},{"id":"g3_english_034_ex08","knowledge_id":"g3_english_034","question":"句型转换：I had cleaned the room before my mother came back.（改为一般疑问句）\n______ you ______ the room before your mother came back?","answer":"答案：Had; cleaned\n解析：本题考查过去完成时的一般疑问句。过去完成时的结构是had + 过去分词，变一般疑问句时只需把had提前到句首，过去分词cleaned保持不变。注意句首首字母大写。"},{"id":"g3_english_034_ex09","knowledge_id":"g3_english_034","question":"翻译题：我以前从未去过北京，直到去年夏天才第一次去。","answer":"答案：I had never been to Beijing before I went there for the first time last summer.\n解析：本题考查过去完成时表示\"过去以前从未做过某事\"。去北京是去年夏天（过去），而在此之前从未去过是\"过去的过去\"，所以用过去完成时had never been。never是完成时中常用的频度副词。\"第一次\"译为for the first time。"},{"id":"g3_english_034_ex10","knowledge_id":"g3_english_034","question":"语法选择：She told me that she ______ the novel three times.\nA. read\nB. has read\nC. had read\nD. was reading","answer":"答案：C\n解析：本题考查过去完成时在宾语从句中的用法。主句是一般过去时（told），从句的动作（读小说）发生在主句动作之前，即\"过去的过去\"，所以从句要用过去完成时had + 过去分词。read的过去分词还是read，故选C。"},{"id":"g3_english_035_ex01","knowledge_id":"g3_english_035","question":"语法选择：By the time I got to the classroom, the first class ______.\nA. began\nB. has begun\nC. had begun\nD. begins","answer":"答案：C\n解析：本题考查by the time的用法。by the time意为\"到……时候为止\"，引导时间状语从句。当从句用一般过去时（got）时，主句要用过去完成时，表示主句动作发生在从句动作之前，即\"过去的过去\"。过去完成时的结构是had + 过去分词，begin的过去分词是begun，故选C。"},{"id":"g3_english_035_ex02","knowledge_id":"g3_english_035","question":"填空题：By the time you come back, I ______（finish）the work.","answer":"答案：will have finished\n解析：本题考查by the time表示将来时间的用法。当by the time引导的从句用一般现在时（come back）表示将来时，主句要用将来完成时（will have + 过去分词），表示到将来某个时间为止动作已经完成。finish的过去分词是finished。"},{"id":"g3_english_035_ex03","knowledge_id":"g3_english_035","question":"句型转换：The meeting had started when I arrived.（用by the time改写）\n______ ______ ______ I arrived, the meeting had started.","answer":"答案：By the time\n解析：本题考查by the time与when的转换。by the time和when都可以引导时间状语从句，表示\"当……时候\"，但by the time更强调\"到……时候为止\"，主句常用完成时。原句用过去完成时，与by the time的用法完全吻合。注意句首首字母大写。"},{"id":"g3_english_035_ex04","knowledge_id":"g3_english_035","question":"翻译题：当我到达机场时，飞机已经起飞了。","answer":"答案：By the time I arrived at the airport, the plane had already taken off.\n解析：本题考查by the time引导的时间状语从句。\"到达机场\"是过去的动作用一般过去时（arrived），\"飞机起飞\"发生在到达之前，是\"过去的过去\"用过去完成时（had taken off）。take off表示\"（飞机）起飞\"。already常放在助动词had之后，实义动词之前。"},{"id":"g3_english_035_ex05","knowledge_id":"g3_english_035","question":"语法选择：By the time he was ten, he ______ about 1,000 English words.\nA. learned\nB. has learned\nC. had learned\nD. learns","answer":"答案：C\n解析：本题考查by the time + 过去时间的用法。by the time he was ten表示\"到他十岁时为止\"，这是一个过去的时间点，在这个时间点之前已经完成的动作要用过去完成时had + 过去分词。learn的过去分词是learned或learnt，故选C。"},{"id":"g3_english_035_ex06","knowledge_id":"g3_english_035","question":"填空题：By the time the bell rang, all the students ______（sit）down quietly.","answer":"答案：had sat\n解析：本题考查by the time引导的时间状语从句。从句the bell rang用一般过去时，表示过去的时间点，主句动作（坐下）发生在铃响之前，是\"过去的过去\"，所以用过去完成时had + 过去分词。sit的过去分词是sat。"},{"id":"g3_english_035_ex07","knowledge_id":"g3_english_035","question":"语法选择：______ the time we got to the bus stop, the bus had already left.\nA. In\nB. On\nC. By\nD. At","answer":"答案：C\n解析：本题考查固定搭配by the time。by the time是固定短语，意为\"到……时候为止\"，引导时间状语从句，主句常用完成时。in the time和on the time不是固定搭配；at the time表示\"在那时\"，但不引导从句，故选C。"},{"id":"g3_english_035_ex08","knowledge_id":"g3_english_035","question":"句型转换：By the time I got home, my mother had cooked dinner.（改为否定句）\nBy the time I got home, my mother ______ ______ dinner.","answer":"答案：hadn't cooked\n解析：本题考查过去完成时的否定形式。过去完成时的结构是had + 过去分词，变否定句时在had后面加not，缩写为hadn't，过去分词cooked保持不变。注意by the time引导的从句时态不变。"},{"id":"g3_english_035_ex09","knowledge_id":"g3_english_035","question":"翻译题：到你读完这本书时，你会学到很多东西。","answer":"答案：By the time you finish reading this book, you will have learned a lot.\n解析：本题考查by the time表示将来时间的用法。by the time引导的从句用一般现在时（finish reading）表示将来，主句用将来完成时（will have learned），表示到将来某个时间为止动作已经完成。finish doing sth.表示\"完成做某事\"。a lot表示\"很多\"，作代词用。"},{"id":"g3_english_035_ex10","knowledge_id":"g3_english_035","question":"语法选择：By the time we arrived at the cinema, the movie ______ for half an hour.\nA. had started\nB. had been on\nC. has started\nD. has been on","answer":"答案：B\n解析：本题考查by the time与延续性动词的搭配。by the time从句用一般过去时（arrived），主句用过去完成时，排除C和D。start是短暂性动词，不能与for half an hour表示的一段时间连用，需转换为延续性动词短语be on，其过去完成时形式是had been on，故选B。"},{"id":"g3_english_036_ex01","knowledge_id":"g3_english_036","question":"语法选择：The bottle is ______ water.\nA. full of\nB. filled of\nC. full with\nD. fill with","answer":"答案：A\n解析：本题考查固定搭配。be full of表示\"充满……\"，强调状态，full是形容词，后接介词of。be filled with也表示\"充满……\"，但介词用with而不是of。选项B和C搭配错误；选项D应是be filled with，故选A。"},{"id":"g3_english_036_ex02","knowledge_id":"g3_english_036","question":"填空题：The room ______ ______（充满）smoke after the big fire.","answer":"答案：is full of / is filled with\n解析：本题考查\"充满\"的两种表达。be full of和be filled with都可以表示\"充满\"，前者强调状态，后者强调动作。主语the room是单数，be动词用is。所以答案可以是is full of，也可以是is filled with。"},{"id":"g3_english_036_ex03","knowledge_id":"g3_english_036","question":"句型转换：The basket is full of apples.（改为同义句）\nThe basket ______ ______ ______ apples.","answer":"答案：is filled with\n解析：本题考查be full of与be filled with的同义转换。be full of强调状态，be filled with强调动作，但在实际使用中两者常可互换。主语the basket是单数，be动词用is，所以答案是is filled with。"},{"id":"g3_english_036_ex04","knowledge_id":"g3_english_036","question":"翻译题：用be full of或be filled with将句子「生活充满了意外」翻译成英语","answer":"答案：Life is full of the unexpected. / Life is filled with the unexpected.\n解析：本题考查be full of / be filled with的用法。\"生活\"是life，作主语时谓语动词用单数is。\"意外\"可以用the unexpected表示，\"the + 形容词\"表示一类事物。两种表达都正确，be full of更常用。"},{"id":"g3_english_036_ex05","knowledge_id":"g3_english_036","question":"语法选择：Look! The box is ______ books. How heavy it is!\nA. full with\nB. filled of\nC. full of\nD. fill with","answer":"答案：C\n解析：本题考查固定搭配。be full of是固定短语，意为\"充满……\"，介词用of，不用with，排除A。be filled with也是固定短语，介词用with，不用of，排除B。be动词后不能直接接动词原形fill，排除D。故选C。"},{"id":"g3_english_036_ex06","knowledge_id":"g3_english_036","question":"填空题：He ______ the bottle ______（用……装满）water just now.","answer":"答案：filled; with\n解析：本题考查fill...with...的主动结构。fill...with...表示\"用……装满……\"，是主动语态。just now表示\"刚才\"，是一般过去时的时间状语，所以fill用过去式filled。"},{"id":"g3_english_036_ex07","knowledge_id":"g3_english_036","question":"语法选择：The park is ______ people on weekends.\nA. filled of\nB. full of\nC. full with\nD. fill with","answer":"答案：B\n解析：本题考查be full of的用法。be full of是固定搭配，意为\"充满……\"，介词用of。be filled with也是固定搭配，但介词必须用with。选项A和C搭配错误；选项D中be动词后不能直接接动词原形fill，故选B。"},{"id":"g3_english_036_ex08","knowledge_id":"g3_english_036","question":"句型转换：The glass is filled with milk.（改为同义句）\nThe glass ______ ______ ______ milk.","answer":"答案：is full of\n解析：本题考查be filled with与be full of的同义转换。be filled with（被……充满，强调动作）与be full of（充满……，强调状态）意思基本相同，常可互换使用。主语the glass是单数，be动词用is。"},{"id":"g3_english_036_ex09","knowledge_id":"g3_english_036","question":"翻译题：她的眼睛里充满了泪水。","answer":"答案：Her eyes are full of tears. / Her eyes are filled with tears.\n解析：本题考查be full of / be filled with的用法。主语her eyes是复数，be动词用are。\"泪水\"是tears，常用复数形式。两种表达都正确，be full of更强调满的状态，be filled with更强调被泪水充满的动作。"},{"id":"g3_english_036_ex10","knowledge_id":"g3_english_036","question":"语法选择：— Why does the bag look so heavy?\n— Because it's ______ books.\nA. full of\nB. full with\nC. filled of\nD. fill with","answer":"答案：A\n解析：本题考查be full of的固定搭配。be full of意为\"充满……\"，是正确的搭配。be filled with也是正确搭配，但选项B和C的介词搭配错误。选项D中be动词后不能直接接动词原形fill。故选A。"},{"id":"g3_english_037_ex01","knowledge_id":"g3_english_037","question":"语法选择：— Where are you going for vacation?\n— I ______ to Beijing with my parents next week.\nA. go\nB. went\nC. am going\nD. have gone","answer":"答案：C\n解析：本题考查现在进行时表示将来。表示位置移动的动词（如go, come, leave, arrive等）常用现在进行时表示按计划或安排即将发生的动作，常与表示将来的时间状语（如next week, tomorrow等）连用。答句中next week表示将来，故选C。"},{"id":"g3_english_037_ex02","knowledge_id":"g3_english_037","question":"填空题：— When ______ you ______（leave）for Shanghai?\n— The day after tomorrow.","answer":"答案：are; leaving\n解析：本题考查现在进行时表将来的特殊疑问句。leave是表示位置移动的动词，常用现在进行时表示按计划即将发生的动作。主语是you，be动词用are。答语the day after tomorrow（后天）表示将来时间。"},{"id":"g3_english_037_ex03","knowledge_id":"g3_english_037","question":"句型转换：The train will arrive soon.（用现在进行时改写，保持句意）\nThe train ______ ______ soon.","answer":"答案：is arriving\n解析：本题考查一般将来时与现在进行时表将来的转换。arrive是表示位置移动的动词，可以用现在进行时（is arriving）表示即将发生的动作，与will arrive意思相近。主语the train是单数，be动词用is。"},{"id":"g3_english_037_ex04","knowledge_id":"g3_english_037","question":"翻译题：用现在进行时表将来的结构，将「我明天要去上海出差」译成英语","answer":"答案：I'm going to Shanghai on business tomorrow.\n解析：本题考查现在进行时表将来。go是表示位置移动的动词，用现在进行时（am going）表示按计划即将发生的动作。tomorrow是将来时间状语。\"出差\"译为on business。"},{"id":"g3_english_037_ex05","knowledge_id":"g3_english_037","question":"语法选择：Look! The bus ______. Let's get on it.\nA. comes\nB. came\nC. is coming\nD. has come","answer":"答案：C\n解析：本题考查现在进行时表将来。come是表示位置移动的动词，用现在进行时（is coming）表示即将发生的动作，意思是\"公交车来了\"。Look!提示动作即将发生，故选C。"},{"id":"g3_english_037_ex06","knowledge_id":"g3_english_037","question":"填空题：My uncle ______（fly）to New York next month.","answer":"答案：is flying\n解析：本题考查现在进行时表将来。fly表示\"乘飞机、飞行\"，是表示位置移动的动词，可以用现在进行时表示按计划即将发生的动作。主语my uncle是第三人称单数，be动词用is，fly的现在分词是flying。"},{"id":"g3_english_037_ex07","knowledge_id":"g3_english_037","question":"语法选择：— What's your plan for the weekend?\n— I ______ my grandparents in the countryside.\nA. visit\nB. visited\nC. am visiting\nD. have visited","answer":"答案：C\n解析：本题考查现在进行时表将来。visit虽然不是典型的位置移动动词，但表示计划好的、安排好的将来动作时，也可以用现在进行时表示。问句询问周末的计划，是将来的时间，故选C。"},{"id":"g3_english_037_ex08","knowledge_id":"g3_english_037","question":"句型转换：We will start a new term next month.（用现在进行时改写）\nWe ______ ______ a new term next month.","answer":"答案：are starting\n解析：本题考查现在进行时表将来。start表示\"开始\"，是表示开始的动词，可以用现在进行时表示按计划即将发生的动作。主语we是复数，be动词用are，start的现在分词是starting。"},{"id":"g3_english_037_ex09","knowledge_id":"g3_english_037","question":"翻译题：快点！电影马上就要开始了。","answer":"答案：Hurry up! The movie is starting soon.\n解析：本题考查现在进行时表将来。start表示\"开始\"，可以用现在进行时（is starting）表示即将发生的动作。\"快点\"译为hurry up。soon表示\"很快、马上\"。主语the movie是单数，be动词用is。"},{"id":"g3_english_037_ex10","knowledge_id":"g3_english_037","question":"语法选择：— How soon ______ you ______ for London?\n— In three days.\nA. do; leave\nB. are; leaving\nC. did; leave\nD. have; left","answer":"答案：B\n解析：本题考查现在进行时表将来的特殊疑问句。how soon意为\"多久以后\"，询问将来的时间。leave是表示位置移动的动词，用现在进行时表示将来。主语是you，be动词用are，故选B。"},{"id":"g3_english_038_ex01","knowledge_id":"g3_english_038","question":"语法选择：Everyone should play a part in ______ the environment.\nA. protect\nB. protecting\nC. protects\nD. protected","answer":"答案：B\n解析：本题考查play a part in的用法。play a part in (doing) sth. 表示\"在……中起作用/参与做某事\"，其中in是介词，后面接名词、代词或动名词（v.ing形式）。protect是动词，要变成动名词protecting，故选B。"},{"id":"g3_english_038_ex02","knowledge_id":"g3_english_038","question":"填空题：Computers play an important p______ in our daily life.","answer":"答案：part\n解析：本题考查play a part in的固定搭配。play an important part in表示\"在……中起重要作用\"。根据首字母提示p和句意\"电脑在我们的日常生活中起着重要作用\"，可知应填part。"},{"id":"g3_english_038_ex03","knowledge_id":"g3_english_038","question":"句型转换：Everyone should help protect the environment.（用play a part in改写）\nEveryone should ______ ______ ______ in ______ the environment.","answer":"答案：play a part; protecting\n解析：本题考查play a part in的用法。play a part in doing sth. 表示\"参与做某事/在做某事中起作用\"。in是介词，后面接动名词，所以protect要变成protecting。should后接动词原形play。"},{"id":"g3_english_038_ex04","knowledge_id":"g3_english_038","question":"翻译题：每个人都应该在拯救地球中发挥作用。","answer":"答案：Everyone should play a part in saving the earth.\n解析：本题考查play a part in的用法。\"每个人\"译为everyone。\"应该\"用情态动词should，后接动词原形。play a part in doing sth.表示\"在做某事中发挥作用\"，in是介词，后面接动名词saving。\"拯救地球\"译为save the earth。"},{"id":"g3_english_038_ex05","knowledge_id":"g3_english_038","question":"语法选择：The Internet plays an important part ______ people's life.\nA. in\nB. on\nC. at\nD. for","answer":"答案：A\n解析：本题考查play a part in的固定搭配。play a part in sth./doing sth. 是固定短语，意为\"在……中起作用/参与……\"，介词用in，不用on, at或for，故选A。"},{"id":"g3_english_038_ex06","knowledge_id":"g3_english_038","question":"填空题：He played a part in ______（make）the decision.","answer":"答案：making\n解析：本题考查play a part in的用法。play a part in doing sth. 表示\"参与做某事\"，其中in是介词，后面接动名词（v.ing形式）。make的动名词形式是making（去掉不发音的e，再加ing）。"},{"id":"g3_english_038_ex07","knowledge_id":"g3_english_038","question":"语法选择：— Do you know the girl?\n— Yes, she ______ an active part in the English speech contest last term.\nA. plays\nB. played\nC. is playing\nD. will play","answer":"答案：B\n解析：本题考查play a part in的时态。play an active part in表示\"在……中起积极作用\"。句中时间状语last term（上学期）表示过去，所以用一般过去时，play的过去式是played，故选B。"},{"id":"g3_english_038_ex08","knowledge_id":"g3_english_038","question":"句型转换：The mobile phone plays an important role in our life.（改为同义句，用play a part in）\nThe mobile phone ______ ______ ______ ______ in our life.","answer":"答案：plays an important part\n解析：本题考查play a part in与play a role in的同义转换。play a part in和play a role in都表示\"在……中起作用/扮演角色\"，两者可以互换使用。主语the mobile phone是第三人称单数，谓语动词用plays。"},{"id":"g3_english_038_ex09","knowledge_id":"g3_english_038","question":"翻译题：教育在我们的生活中起着重要作用。","answer":"答案：Education plays an important part in our life. / Education plays an important role in our life.\n解析：本题考查play a part in / play a role in的用法。\"教育\"是education，不可数名词作主语，谓语动词用第三人称单数plays。\"起着重要作用\"译为play an important part in或play an important role in。\"在我们的生活中\"译为in our life。"},{"id":"g3_english_038_ex10","knowledge_id":"g3_english_038","question":"语法选择：Teachers play a part in ______ students learn better.\nA. help\nB. helps\nC. helping\nD. helped","answer":"答案：C\n解析：本题考查play a part in的用法。play a part in doing sth. 表示\"在做某事中起作用\"，其中in是介词，后面要接动名词（v.ing形式）。help的动名词形式是helping，故选C。"},{"id":"g3_english_039_ex01","knowledge_id":"g3_english_039","question":"语法选择：I ______ English for two hours, and I still need another hour.\nA. have learned\nB. have been learning\nC. learned\nD. am learning","answer":"答案：B\n解析：本题考查现在完成进行时的用法。现在完成进行时（have/has been + 现在分词）表示从过去某一时间开始一直延续到现在的动作，这个动作可能刚停止，也可能还在继续进行。句中for two hours表示动作持续了一段时间，and后面说还需要一小时，说明动作还在继续，所以用现在完成进行时，故选B。"},{"id":"g3_english_039_ex02","knowledge_id":"g3_english_039","question":"填空题：She ______ ______ ______（write）the letter all morning.","answer":"答案：has been writing\n解析：本题考查现在完成进行时的结构。现在完成进行时的结构是have/has been + 现在分词，表示动作从过去某一时间开始一直持续到现在。主语she是第三人称单数，助动词用has，write的现在分词是writing。all morning是现在完成进行时常用的时间状语。"},{"id":"g3_english_039_ex03","knowledge_id":"g3_english_039","question":"句型转换：I have learned English for five years.（用现在完成进行时改写，强调一直在学）\nI ______ ______ ______ English for five years.","answer":"答案：have been learning\n解析：本题考查现在完成时与现在完成进行时的转换。现在完成时（have learned）强调动作的结果或完成；现在完成进行时（have been learning）强调动作的持续，即\"一直在做某事\"。主语是I，助动词用have，learn的现在分词是learning。"},{"id":"g3_english_039_ex04","knowledge_id":"g3_english_039","question":"翻译题：用现在完成进行时，将句子「他整天都在做作业」翻译成英语","answer":"答案：He has been doing his homework all day.\n解析：本题考查现在完成进行时的用法。\"整天\"是all day，表示动作从过去开始一直持续到现在，用现在完成进行时has/have been + 现在分词。主语he是第三人称单数，助动词用has。\"做作业\"是do one's homework，do的现在分词是doing。"},{"id":"g3_english_039_ex05","knowledge_id":"g3_english_039","question":"语法选择：— Why are you so tired?\n— Because I ______ for three hours.\nA. run\nB. ran\nC. have run\nD. have been running","answer":"答案：D\n解析：本题考查现在完成进行时的用法。现在完成进行时表示动作从过去某一时间开始一直持续到现在，并且可能还在进行，常用来解释某种结果或状态的原因。问句问为什么这么累，答语说跑了三个小时，强调跑步这个动作一直在持续导致了累的结果，所以用现在完成进行时，故选D。"},{"id":"g3_english_039_ex06","knowledge_id":"g3_english_039","question":"填空题：They ______ ______ ______（plant）trees since 8 o'clock this morning.","answer":"答案：have been planting\n解析：本题考查现在完成进行时的用法。since + 时间点（8 o'clock this morning）是现在完成进行时的标志，表示动作从过去某一时间开始一直持续到现在。主语they是复数，助动词用have，plant的现在分词是planting。"},{"id":"g3_english_039_ex07","knowledge_id":"g3_english_039","question":"语法选择：The students ______ the classroom, so it looks very clean now.\nA. have cleaned\nB. have been cleaning\nC. cleaned\nD. are cleaning","answer":"答案：A\n解析：本题考查现在完成时与现在完成进行时的区别。现在完成时（have cleaned）强调动作的结果或完成；现在完成进行时（have been cleaning）强调动作的持续。后半句说教室现在看起来很干净，强调的是打扫的结果，所以用现在完成时，故选A。"},{"id":"g3_english_039_ex08","knowledge_id":"g3_english_039","question":"句型转换：She has been reading the novel for three days.（改为一般疑问句）\n______ she ______ ______ the novel for three days?","answer":"答案：Has; been reading\n解析：本题考查现在完成进行时的一般疑问句。现在完成进行时的结构是have/has been + 现在分词，变一般疑问句时把have/has提前到句首，其他部分不变。主语she是第三人称单数，助动词用has，注意句首首字母大写。"},{"id":"g3_english_039_ex09","knowledge_id":"g3_english_039","question":"翻译题：自从我来到这所学校，我就一直在学英语。","answer":"答案：I have been learning English since I came to this school.\n解析：本题考查现在完成进行时与since的搭配。since引导的时间状语从句用一般过去时（came），主句用现在完成进行时（have been learning），表示动作从过去某一时间开始一直持续到现在。主语是I，助动词用have。\"来到这所学校\"译为come to this school。"},{"id":"g3_english_039_ex10","knowledge_id":"g3_english_039","question":"语法选择：— Where is Tom? I can't find him anywhere.\n— He ______ in the library for the whole afternoon.\nA. reads\nB. read\nC. has been reading\nD. is reading","answer":"答案：C\n解析：本题考查现在完成进行时的用法。for the whole afternoon表示动作持续了一下午，从过去一直到现在，可能还在继续，用现在完成进行时has/have been + 现在分词。主语he是第三人称单数，助动词用has，故选C。"},{"id":"g3_english_040_ex01","knowledge_id":"g3_english_040","question":"语法选择：Don't forget ______ the door when you leave.\nA. close\nB. closing\nC. to close\nD. closed","answer":"答案：C\n解析：本题考查forget的用法。forget to do sth. 表示\"忘记要做某事\"（事情还没做）；forget doing sth. 表示\"忘记做过某事\"（事情已经做了）。根据句意\"你离开时别忘了关门\"，门还没关，是要去做的事，所以用forget to do sth.，故选C。"},{"id":"g3_english_040_ex02","knowledge_id":"g3_english_040","question":"填空题：I remember ______（see）her at the party last week.","answer":"答案：seeing\n解析：本题考查remember的用法。remember to do sth. 表示\"记得要做某事\"（还没做）；remember doing sth. 表示\"记得做过某事\"（已经做了）。句中last week表明看见她是上周发生的事，已经做过了，所以用remember doing sth.，see的动名词是seeing。"},{"id":"g3_english_040_ex03","knowledge_id":"g3_english_040","question":"句型转换：Please remember to bring your book here tomorrow.（改为同义句）\nDon't ______ ______ bring your book here tomorrow.","answer":"答案：forget to\n解析：本题考查remember与forget的转换。remember to do sth.（记得要做某事）的反义表达是forget to do sth.（忘记要做某事），在否定句中Don't forget to do sth. 就等于Please remember to do sth.。事情还没做，所以用to bring。"},{"id":"g3_english_040_ex04","knowledge_id":"g3_english_040","question":"翻译题：我记得已经把信寄出去了。","answer":"答案：I remember posting the letter. / I remember having posted the letter.\n解析：本题考查remember doing sth.的用法。\"记得做过某事\"用remember doing sth.，表示事情已经做了。\"寄信\"是post the letter或mail the letter，post的动名词是posting。也可以用remember having done sth. 强调动作已经完成。"},{"id":"g3_english_040_ex05","knowledge_id":"g3_english_040","question":"语法选择：— The light in the office is still on.\n— Oh, I forgot ______ it off.\nA. turn\nB. turning\nC. to turn\nD. turned","answer":"答案：C\n解析：本题考查forget的用法。根据前一句\"办公室的灯还亮着\"，说明关灯这件事还没有做，是忘记要去做的事，所以用forget to do sth.（忘记要做某事）。forget doing sth. 表示忘记做过某事（已经做了），不符合语境，故选C。"},{"id":"g3_english_040_ex06","knowledge_id":"g3_english_040","question":"填空题：He forgot ______（lock）the door, so he went back to check.","answer":"答案：locking\n解析：本题考查forget的用法。根据后半句\"所以他回去检查一下\"，说明他不确定自己是否锁了门，即忘记了自己是否做过锁门这件事，所以用forget doing sth.（忘记做过某事）。lock的动名词是locking。"},{"id":"g3_english_040_ex07","knowledge_id":"g3_english_040","question":"语法选择：Remember ______ your parents when you get there.\nA. call\nB. calling\nC. to call\nD. called","answer":"答案：C\n解析：本题考查remember的用法。根据句意\"你到那儿时记得给你父母打电话\"，打电话是到达之后要做的事，还没做，所以用remember to do sth.（记得要做某事）。remember doing sth. 表示记得做过某事（已经做了），不符合语境，故选C。"},{"id":"g3_english_040_ex08","knowledge_id":"g3_english_040","question":"句型转换：I forgot that I had told him the news.（改为简单句，用forget doing）\nI forgot ______ ______ the news.","answer":"答案：telling him\n解析：本题考查forget + 从句与forget doing的转换。forget that从句（过去完成时）表示忘记已经做过某事，可以转换为forget doing sth. 结构。tell的动名词是telling，后面接双宾语him the news。"},{"id":"g3_english_040_ex09","knowledge_id":"g3_english_040","question":"翻译题：用remember的正确搭配，将「离开教室时记得关灯」翻译成英语","answer":"答案：Remember to turn off the lights when you leave the classroom.\n解析：本题考查remember to do sth.的用法。\"记得要做某事\"用remember to do sth.，表示事情还没做，是要去做的。\"关灯\"是turn off the lights。\"离开教室\"是leave the classroom。when引导时间状语从句，用一般现在时表示将来。"},{"id":"g3_english_040_ex10","knowledge_id":"g3_english_040","question":"语法选择：— I can't find my keys anywhere.\n— Maybe you forgot ______ them at home.\nA. leave\nB. leaving\nC. to leave\nD. left","answer":"答案：B\n解析：本题考查forget的用法。根据语境\"找不到钥匙\"，可能是忘记把钥匙落在家里了，即把钥匙落在家里这件事已经做了，只是忘记了，所以用forget doing sth.（忘记做过某事）。forget to do sth. 表示忘记要去做某事（还没做），不符合语境，故选B。"},{"id":"g3_english_041_ex01","knowledge_id":"g3_english_041","question":"语法选择：I'm looking forward to ______ you soon.\nA. see\nB. seeing\nC. saw\nD. seen","answer":"答案：B\n解析：本题考查look forward to的用法。look forward to是固定短语，意为\"盼望、期待\"，其中to是介词，后面接名词、代词或动名词（v.ing形式），不能接动词原形。see是动词，要变成动名词seeing，故选B。"},{"id":"g3_english_041_ex02","knowledge_id":"g3_english_041","question":"填空题：We are looking forward to ______（visit）the Great Wall.","answer":"答案：visiting\n解析：本题考查look forward to的用法。look forward to中的to是介词，后面接动名词（v.ing形式）。visit是动词，意思是\"参观、拜访\"，其动名词形式是visiting，直接在后面加ing即可。"},{"id":"g3_english_041_ex03","knowledge_id":"g3_english_041","question":"句型转换：I expect your reply.（用look forward to改写）\nI ______ ______ ______ ______ your reply.","answer":"答案：look forward to\n解析：本题考查look forward to与expect的同义转换。expect sth.表示\"期待某事\"，可以转换为look forward to sth.。look forward to中的to是介词，后面直接接名词your reply。主语是I，谓语动词用原形look。"},{"id":"g3_english_041_ex04","knowledge_id":"g3_english_041","question":"翻译题：我期待着收到你的来信。","answer":"答案：I'm looking forward to hearing from you.\n解析：本题考查look forward to的用法。\"期待着\"用现在进行时I'm looking forward to，表示目前正在期待。to是介词，后面接动名词。\"收到某人的来信\"用hear from sb.，hear的动名词是hearing。"},{"id":"g3_english_041_ex05","knowledge_id":"g3_english_041","question":"语法选择：All the students are looking forward to ______ a holiday.\nA. have\nB. having\nC. has\nD. had","answer":"答案：B\n解析：本题考查look forward to的用法。look forward to中的to是介词，后面接动名词（v.ing形式），不能接动词原形、第三人称单数或过去式。have a holiday表示\"度假\"，have的动名词是having，故选B。"},{"id":"g3_english_041_ex06","knowledge_id":"g3_english_041","question":"填空题：She is looking forward to her mother's ______（come）back.","answer":"答案：coming\n解析：本题考查look forward to的用法。look forward to中的to是介词，后面接名词或动名词。her mother's是名词所有格，后面接动名词形式，构成动名词的复合结构。come的动名词是coming。"},{"id":"g3_english_041_ex07","knowledge_id":"g3_english_041","question":"语法选择：— How do you feel about the coming trip?\n— I'm really looking forward to ______ it.\nA. /\nB. to\nC. for\nD. in","answer":"答案：A\n解析：本题考查look forward to的用法。look forward to中的to本身就是介词，后面直接接名词、代词或动名词，不需要再加其他介词。it是代词，直接放在to后面，故选A。"},{"id":"g3_english_041_ex08","knowledge_id":"g3_english_041","question":"句型转换：We are expecting to meet you.（用look forward to改写）\nWe are ______ ______ ______ ______ you.","answer":"答案：looking forward to meeting\n解析：本题考查look forward to与expect的转换。expect to do sth.表示\"期待做某事\"，可以转换为look forward to doing sth.。to是介词，后面接动名词，所以meet要变成meeting。句中已有助动词are，所以用现在进行时are looking forward to。"},{"id":"g3_english_041_ex09","knowledge_id":"g3_english_041","question":"翻译题：孩子们期待着儿童节的到来。","answer":"答案：The children are looking forward to Children's Day.\n解析：本题考查look forward to的用法。\"孩子们\"是the children，作主语，be动词用are。\"期待着\"用现在进行时are looking forward to，表示目前正在期待。to是介词，后面直接接名词Children's Day（儿童节）。"},{"id":"g3_english_041_ex10","knowledge_id":"g3_english_041","question":"语法选择：He used to ______ late, but now he is used to ______ early.\nA. sleep; get up\nB. sleeping; getting up\nC. sleep; getting up\nD. sleeping; get up","answer":"答案：C\n解析：本题考查易混结构辨析。used to do sth.表示\"过去常常做某事\"，to是不定式符号，后接动词原形sleep；be used to doing sth.表示\"习惯于做某事\"，to是介词，后接动名词getting up。对比：look forward to中的to也是介词，后接动名词，故选C。"},{"id":"g3_english_042_ex01","knowledge_id":"g3_english_042","question":"语法选择：I ______ you a happy birthday.\nA. hope\nB. wish\nC. want\nD. like","answer":"答案：B\n解析：本题考查wish和hope的区别。wish后面可以接双宾语，表示\"祝愿\"，即wish sb. sth.，如wish you a happy birthday（祝你生日快乐）。hope后面不能接双宾语，不能说hope you sth.。want和like没有这种祝愿的用法，故选B。"},{"id":"g3_english_042_ex02","knowledge_id":"g3_english_042","question":"填空题：I ______（希望）I could fly like a bird.","answer":"答案：wish\n解析：本题考查wish后接虚拟语气的用法。根据句意\"我希望我能像鸟一样飞\"，这是不可能实现的愿望，要用wish。wish后接that从句时用虚拟语气，表示不太可能实现的愿望，从句用过去时表示现在的愿望（could是can的过去式）。hope后接从句用陈述语气，表示有可能实现的希望。"},{"id":"g3_english_042_ex03","knowledge_id":"g3_english_042","question":"句型转换：I hope that I will visit the moon some day.（改为简单句，用hope to do）\nI ______ ______ ______ the moon some day.","answer":"答案：hope to visit\n解析：本题考查hope后接从句与接不定式的转换。hope后面可以接that从句，也可以接不定式（to do sth.），即hope to do sth.，表示\"希望做某事\"。两者意思相同，只是句子结构不同。主语是I，谓语用hope。"},{"id":"g3_english_042_ex04","knowledge_id":"g3_english_042","question":"翻译题：我希望你能来参加我的生日派对。（用hope）","answer":"答案：I hope you can come to my birthday party.\n解析：本题考查hope后接宾语从句的用法。hope后面可以接that从句，用陈述语气，表示有可能实现的希望。\"来参加我的生日派对\"译为come to my birthday party。注意：不能说I hope you to come，因为hope不能用于hope sb. to do sth.结构。"},{"id":"g3_english_042_ex05","knowledge_id":"g3_english_042","question":"语法选择：He ______ he had been there yesterday.\nA. hopes\nB. wishes\nC. wants\nD. expects","answer":"答案：B\n解析：本题考查wish后接虚拟语气的用法。根据从句的时态had been（过去完成时），可知这是表示与过去事实相反的愿望，要用wish。wish后接that从句时用虚拟语气：表示现在的愿望用过去时，表示过去的愿望用过去完成时。hope后接从句用陈述语气，不用虚拟语气，故选B。"},{"id":"g3_english_042_ex06","knowledge_id":"g3_english_042","question":"填空题：I ______ you good luck in the exam.（用wish/hope填空）","answer":"答案：wish\n解析：本题考查wish接双宾语的用法。wish sb.
