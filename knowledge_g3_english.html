sth.表示\"祝愿某人……\"，可以接双宾语（间接宾语you + 直接宾语good luck）。hope不能接双宾语，不能说hope you sth.，所以只能用wish。"},{"id":"g3_english_042_ex07","knowledge_id":"g3_english_042","question":"语法选择：Which of the following is WRONG?\nA. I hope to see you again.\nB. I wish you success.\nC. I hope you to help me.\nD. I wish I were you.","answer":"答案：C\n解析：本题考查wish和hope的用法辨析。选项A：hope to do sth.是正确结构；选项B：wish sb. sth.（接双宾语表祝愿）是正确的；选项C：hope sb. to do sth.是错误的，hope不能用于此结构，可以说wish sb. to do sth.；选项D：wish后接从句用虚拟语气（were）是正确的。故选C。"},{"id":"g3_english_042_ex08","knowledge_id":"g3_english_042","question":"句型转换：I wish you a happy new year.（改为同义句，用hope）\nI ______ ______ you ______ a happy new year.","answer":"答案：hope that; have\n解析：本题考查wish和hope的同义转换。wish sb. sth.表示\"祝愿某人……\"，可以转换为hope + that从句的形式，从句用陈述语气。wish you a happy new year = I hope that you have a happy new year。"},{"id":"g3_english_042_ex09","knowledge_id":"g3_english_042","question":"翻译题：我要是像你一样聪明就好了。","answer":"答案：I wish I were as smart as you.\n解析：本题考查wish后接虚拟语气的用法。\"要是……就好了\"表示与现在事实不符的愿望，用wish引导宾语从句，从句用虚拟语气，be动词一律用were。\"像……一样聪明\"译为as smart as you。"},{"id":"g3_english_042_ex10","knowledge_id":"g3_english_042","question":"语法选择：— I'm going to have an English test tomorrow.\n— ______ you good luck!\nA. Hope\nB. Wish\nC. Want\nD. Like","answer":"答案：B\n解析：本题考查wish表示祝愿的用法。wish sb. sth.表示\"祝愿某人……\"，是表达祝愿的常用结构。hope不能接双宾语，不能说hope you sth.。want（想要）和like（喜欢）不符合语境。Wish you good luck!（祝你好运！）是常用的祝愿语，故选B。"},{"id":"g3_english_043_ex01","knowledge_id":"g3_english_043","question":"语法选择题：______ with a book in his hand, the teacher came into the classroom.\nA. Having\nB. Have\nC. Has\nD. To have","answer":"答案：A\n解析：本题考查现在分词作伴随状语。句意：老师手里拿着一本书走进了教室。现在分词短语作伴随状语，表示主句动作发生时的伴随情况。句子主语the teacher与have之间是主动关系，所以用现在分词having。to have作状语常表示目的或结果，不符合句意。"},{"id":"g3_english_043_ex02","knowledge_id":"g3_english_043","question":"语法选择题：The little girl was made ______ the piano for three hours every day by her strict mother.\nA. play\nB. playing\nC. to play\nD. played","answer":"答案：C\n解析：本题考查使役动词make的被动语态。make作使役动词时，主动语态中用不带to的不定式作宾语补足语，即make sb. do sth.（让某人做某事）；但在被动语态中，省略的to要还原，即be made to do sth.（被迫做某事）。根据句中的was made可知是被动语态，故选C。"},{"id":"g3_english_043_ex03","knowledge_id":"g3_english_043","question":"填空题：用所给动词的适当形式填空。\n______ (not know) his address, I can't visit him personally.","answer":"答案：Not knowing\n解析：本题考查现在分词的否定形式作原因状语。句意：因为不知道他的地址，我不能亲自去拜访他。现在分词的否定形式是not + 现在分词，放在句首作原因状语，相当于原因状语从句Because I don't know...。注意句首首字母大写。"},{"id":"g3_english_043_ex04","knowledge_id":"g3_english_043","question":"语法选择题：I have a lot of homework ______ tonight, so I can't go to the cinema with you.\nA. do\nB. doing\nC. to do\nD. done","answer":"答案：C\n解析：本题考查不定式作后置定语。句意：我今晚有很多作业要做，所以不能和你去看电影。have sth. to do 表示「有某事要做」，其中不定式作后置定语修饰前面的名词homework，用主动形式表示被动含义，因为句子主语I是动作do的执行者。"},{"id":"g3_english_043_ex05","knowledge_id":"g3_english_043","question":"句型转换题：改为同义句，每空一词。\nThe boy who is standing under the tree is my cousin.\n→ The boy ______ ______ the tree is my cousin.","answer":"答案：standing under\n解析：本题考查现在分词短语作定语。who is standing under the tree是定语从句，修饰先行词the boy，可以转换为现在分词短语standing under the tree作后置定语。因为the boy与stand之间是主动关系，所以用现在分词形式。"},{"id":"g3_english_043_ex06","knowledge_id":"g3_english_043","question":"语法选择题：The problem is too difficult for the students ______.\nA. work out\nB. to work out\nC. working out\nD. worked out","answer":"答案：B\n解析：本题考查不定式的用法。句意：这个问题对学生们来说太难了，他们解不出来。too...to...是固定结构，意为「太……而不能……」，其中to后面接动词原形。注意：不定式to work out与句子主语The problem虽然是被动关系，但在too...to...结构中，通常用主动形式表示被动含义。"},{"id":"g3_english_043_ex07","knowledge_id":"g3_english_043","question":"填空题：用所给动词的适当形式填空。\nThe speaker raised his voice to make himself ______ (hear) by all the people in the hall.","answer":"答案：heard\n解析：本题考查过去分词作宾语补足语。句意：演讲者提高了声音，以便大厅里所有的人都能听到他的话。make oneself + 过去分词 表示「使某人自己被……」，其中过去分词作宾语补足语，表示被动含义。himself与hear之间是被动关系，所以用过去分词heard。"},{"id":"g3_english_043_ex08","knowledge_id":"g3_english_043","question":"语法选择题：—Would you mind ______ the window? It's too hot in the room.\n—Of course not.\nA. open\nB. to open\nC. opening\nD. opened","answer":"答案：C\n解析：本题考查动名词作宾语。mind doing sth. 是固定搭配，意为「介意做某事」，mind后面要接动名词（动词-ing形式）作宾语。类似的动词还有enjoy, finish, practice, avoid, suggest等。"},{"id":"g3_english_043_ex09","knowledge_id":"g3_english_043","question":"翻译题：将下列句子翻译成英语。\n看到妈妈进来，那个小女孩停止了哭闹。","answer":"答案：Seeing her mother come in, the little girl stopped crying.\n解析：本题考查现在分词作时间状语。「看到妈妈进来」用现在分词短语seeing her mother come in作时间状语，相当于when she saw her mother come in。the little girl与see之间是主动关系，所以用现在分词。stop doing sth. 表示「停止做某事」，stop crying停止哭泣。"},{"id":"g3_english_043_ex10","knowledge_id":"g3_english_043","question":"翻译题：将下列句子翻译成英语。\n据说这本书已经被翻译成了好几种语言了。","answer":"答案：The book is said to have been translated into several languages.\n解析：本题考查不定式的完成被动式。sth. is said to do sth. 是固定句型，意为「据说某物……」。「已经被翻译」表示动作已经完成且有被动含义，所以要用不定式的完成被动式to have been translated。translate...into...表示「把……翻译成……」。"},{"id":"g3_english_044_ex01","knowledge_id":"g3_english_044","question":"语法选择题：The number of people who ______ cars in China ______ increasing rapidly.\nA. owns; are\nB. owns; is\nC. own; is\nD. own; are","answer":"答案：C\n解析：本题考查主谓一致。第一空：who引导的定语从句修饰先行词people，people是复数名词，所以定语从句的谓语动词用复数形式own。第二空：the number of...作主语时，谓语动词用单数形式，表示「……的数量」，所以用is。句意：在中国拥有汽车的人数正在快速增长。"},{"id":"g3_english_044_ex02","knowledge_id":"g3_english_044","question":"语法选择题：Not only the students but also their teacher ______ interested in the new teaching method.\nA. is\nB. are\nC. was\nD. were","answer":"答案：A\n解析：本题考查not only...but also...的主谓一致。not only...but also...连接两个并列主语时，谓语动词的单复数遵循「就近原则」，即与离它最近的主语保持一致。本题中离谓语最近的主语是their teacher（单数），所以谓语动词用单数形式is。"},{"id":"g3_english_044_ex03","knowledge_id":"g3_english_044","question":"填空题：用所给动词的适当形式填空。\nNeither my parents nor my brother ______ (have) been to the Great Wall before.","answer":"答案：has\n解析：本题考查neither...nor...的主谓一致。neither...nor...连接两个并列主语时，谓语动词的单复数遵循「就近原则」，即与离它最近的主语保持一致。本题中离谓语最近的主语是my brother（第三人称单数），所以助动词用has。"},{"id":"g3_english_044_ex04","knowledge_id":"g3_english_044","question":"语法选择题：The news that the Chinese team won the gold medal ______ very exciting.\nA. is\nB. are\nC. was\nD. were","answer":"答案：A\n解析：本题考查主谓一致中的形复意单。news（新闻、消息）是不可数名词，虽然以-s结尾，但表示单数意义，作主语时谓语动词用单数形式。that引导的是同位语从句，不影响主句的主谓一致。句意：中国队获得金牌的消息非常令人兴奋。"},{"id":"g3_english_044_ex05","knowledge_id":"g3_english_044","question":"句型转换题：改为同义句，每空一词。\nBoth Tom and his deskmate like playing basketball after school.\n→ ______ Tom ______ his deskmate ______ playing basketball after school.","answer":"答案：Not only; but also; likes\n解析：本题考查both...and...与not only...but also...的转换及主谓一致。both...and...连接主语时谓语用复数，not only...but also...连接主语时谓语遵循就近原则。最近的主语是his deskmate（单数），所以谓语用likes。"},{"id":"g3_english_044_ex06","knowledge_id":"g3_english_044","question":"语法选择题：The family ______ having dinner when the telephone suddenly rang.\nA. is\nB. are\nC. was\nD. were","answer":"答案：D\n解析：本题考查集体名词的主谓一致。family作为集体名词，当表示「家庭成员」时，谓语动词用复数；当表示「家庭」这个整体时，谓语动词用单数。本题中「正在吃饭」显然是指家庭成员，所以用复数。又因为后面是rang（过去时），所以用were。"},{"id":"g3_english_044_ex07","knowledge_id":"g3_english_044","question":"填空题：用所给动词的适当形式填空。\nEvery boy and every girl in our class ______ (be) going to take part in the English speech contest.","answer":"答案：is\n解析：本题考查主谓一致的特殊情况。当each/every + 单数名词 + and + each/every + 单数名词作主语时，谓语动词用单数形式，表示「每一个……和每一个……」。虽然有两个名词，但every强调的是每一个个体，所以谓语用单数is。"},{"id":"g3_english_044_ex08","knowledge_id":"g3_english_044","question":"语法选择题：Mr. Green, together with his wife and two children, ______ to Beijing for a visit next week.\nA. are going\nB. is going\nC. go\nD. goes","answer":"答案：B\n解析：本题考查主谓一致中的就远原则。当主语后面跟有with, together with, along with, as well as, besides, except, but等连接的名词时，谓语动词的单复数与前面的主语保持一致（就远原则）。本题中主语是Mr. Green（单数），所以谓语动词用单数形式is going。"},{"id":"g3_english_044_ex09","knowledge_id":"g3_english_044","question":"翻译题：将下列句子翻译成英语。\n我们学校的老师数量是两百人，他们大多数都是女老师。","answer":"答案：The number of teachers in our school is 200, and most of them are women teachers.\n解析：本题考查the number of与a number of的区别及主谓一致。the number of...表示「……的数量」，作主语时谓语用单数is。most of them中them指代teachers（复数），所以谓语用复数are。women teachers两个名词都要变复数。"},{"id":"g3_english_044_ex10","knowledge_id":"g3_english_044","question":"翻译题：将下列句子翻译成英语。\n要么你去，要么他去，总要有一个人去参加会议。","answer":"答案：Either you or he is going to attend the meeting. Someone has to go.\n解析：本题考查either...or...的主谓一致。either...or...连接两个并列主语时，谓语动词遵循「就近原则」，即与离它最近的主语保持一致。本题中离谓语最近的主语是he（第三人称单数），所以用is going to attend。attend the meeting表示「参加会议」。"},{"id":"g3_english_045_ex01","knowledge_id":"g3_english_045","question":"语法选择题：______ you have made a promise, you should keep it no matter what happens.\nA. Until\nB. Although\nC. Since\nD. Unless","answer":"答案：C\n解析：本题考查原因状语从句。since引导原因状语从句，意为「既然、因为」，通常表示已知的、显而易见的原因。句意：既然你已经许下了诺言，无论发生什么你都应该遵守。until（直到）引导时间状语从句，although（虽然）引导让步状语从句，unless（除非）引导条件状语从句，均不符合句意。"},{"id":"g3_english_045_ex02","knowledge_id":"g3_english_045","question":"语法选择题：I will never forget the day ______ I first came to this beautiful city.\nA. which\nB. when\nC. that\nD. where","answer":"答案：B\n解析：本题考查时间状语从句还是定语从句的辨析。本题中when引导的是定语从句，修饰先行词the day，when在从句中作时间状语。句意：我永远不会忘记我第一次来到这座美丽城市的那一天。注意区分：when引导时间状语从句时，没有先行词；引导定语从句时，前面有表示时间的先行词。"},{"id":"g3_english_045_ex03","knowledge_id":"g3_english_045","question":"填空题：根据句意填入适当的连词。\n______ it was raining heavily, the workers were still working on the construction site.","answer":"答案：Although/Though\n解析：本题考查让步状语从句。although/though引导让步状语从句，意为「虽然、尽管」，表示让步关系。句意：虽然雨下得很大，工人们仍然在建筑工地上工作。注意：although/though不能与but连用，但可以与yet/still连用。"},{"id":"g3_english_045_ex04","knowledge_id":"g3_english_045","question":"语法选择题：You will miss the train ______ you hurry up right now.\nA. if\nB. unless\nC. when\nD. because","answer":"答案：B\n解析：本题考查条件状语从句。unless引导条件状语从句，意为「除非、如果不」，相当于if...not。句意：除非你现在快点，否则你会赶不上火车的。if（如果）引导条件状语从句，但意思相反；when（当……时候）引导时间状语从句；because（因为）引导原因状语从句，均不符合句意。"},{"id":"g3_english_045_ex05","knowledge_id":"g3_english_045","question":"句型转换题：改为同义句，每空一词。\nThe boy is so young that he can't go to school alone.\n→ The boy is ______ young ______ go to school alone.","answer":"答案：too; to\n解析：本题考查so...that...与too...to...的转换。so...that...引导结果状语从句，意为「如此……以至于……」，当that从句是否定句且主从句主语一致时，可以转换为too...to...结构，意为「太……而不能……」。注意：too...to...本身含有否定意义，后面不能再加not。"},{"id":"g3_english_045_ex06","knowledge_id":"g3_english_045","question":"语法选择题：—What did the teacher say just now?\n—He said that we should go back to the classroom ______ the bell rang.\nA. while\nB. as soon as\nC. until\nD. since","answer":"答案：B\n解析：本题考查时间状语从句。as soon as引导时间状语从句，意为「一……就……」，表示主句动作紧跟从句动作发生。句意：他说铃一响我们就应该回教室。while（当……时候）引导的从句中动词必须是延续性动词，rang是短暂性动词；until（直到）和since（自从）均不符合语境。"},{"id":"g3_english_045_ex07","knowledge_id":"g3_english_045","question":"填空题：用所给动词的适当形式填空。\nI will go to visit my grandparents as soon as I ______ (finish) my homework this weekend.","answer":"答案：finish\n解析：本题考查时间状语从句的时态。在时间状语从句（如when, as soon as, until, before等引导）和条件状语从句（if, unless等引导）中，如果主句用一般将来时，从句要用一般现在时表示将来，即「主将从现」原则。所以从句用一般现在时finish。"},{"id":"g3_english_045_ex08","knowledge_id":"g3_english_045","question":"语法选择题：______ fast you run, you can't catch up with a professional athlete.\nA. However\nB. Whatever\nC. Whenever\nD. Wherever","answer":"答案：A\n解析：本题考查让步状语从句。however引导让步状语从句，意为「无论多么、不管怎样」，后面接形容词或副词，相当于no matter how。句意：无论你跑得多快，你都赶不上专业运动员。whatever（无论什么）后面接名词或动词；whenever（无论何时）和wherever（无论何地）均不符合语法。"},{"id":"g3_english_045_ex09","knowledge_id":"g3_english_045","question":"翻译题：将下列句子翻译成英语。\n自从我来到这所学校，我已经交了很多朋友了。","answer":"答案：I have made many friends since I came to this school.\n解析：本题考查since引导的时间状语从句。since引导时间状语从句时，从句用一般过去时，主句用现在完成时，表示「自从……以来」。「交朋友」是make friends，这里用现在完成时have made。注意：since从句中的动词必须是短暂性动词。"},{"id":"g3_english_045_ex10","knowledge_id":"g3_english_045","question":"翻译题：将下列句子翻译成英语。\n只要你努力学习，你就会在考试中取得好成绩的。","answer":"答案：As long as you study hard, you will get good grades in the exam.\n解析：本题考查条件状语从句。as long as引导条件状语从句，意为「只要」，相当于if only/so long as。遵循「主将从现」原则：从句用一般现在时study hard，主句用一般将来时will get good grades。「取得好成绩」是get good grades。"},{"id":"g3_english_046_ex01","knowledge_id":"g3_english_046","question":"语法选择题：The girl ______ you met at the school gate yesterday is my cousin from America.\nA. which\nB. who\nC. whose\nD. what","answer":"答案：B\n解析：本题考查定语从句的关系代词。先行词是the girl（人），关系代词在定语从句中作met的宾语，所以可以用who, whom或that，也可以省略。which只能指代物；whose表示「谁的」，在从句中作定语；what不能引导定语从句。故选B。"},{"id":"g3_english_046_ex02","knowledge_id":"g3_english_046","question":"语法选择题：This is the most beautiful place ______ I have ever visited in my life.\nA. which\nB. that\nC. where\nD. what","answer":"答案：B\n解析：本题考查定语从句中只能用that的情况。当先行词被形容词最高级（the most beautiful）修饰时，关系代词只能用that，不能用which。that在从句中作visited的宾语。where是关系副词，在从句中作状语，而本题从句中缺少宾语，所以不能用where。"},{"id":"g3_english_046_ex03","knowledge_id":"g3_english_046","question":"填空题：填入适当的关系代词或关系副词。\nThe man ______ daughter is a famous doctor is our new neighbor.","answer":"答案：whose\n解析：本题考查定语从句的关系代词whose。whose引导定语从句时，在从句中作定语，表示「……的」，可以指代人或物。本题中whose daughter = the man's daughter，意为「那个人的女儿」。句意：那个女儿是著名医生的人是我们的新邻居。"},{"id":"g3_english_046_ex04","knowledge_id":"g3_english_046","question":"语法选择题：—Do you know the reason ______ he was late for school again?\n—Yes, he missed the early bus.\nA. which\nB. that\nC. why\nD. what","answer":"答案：C\n解析：本题考查定语从句的关系副词。先行词是the reason（原因），关系副词why在定语从句中作原因状语，相当于for which。句意：你知道他又迟到的原因吗？which和that是关系代词，在从句中作主语或宾语，而本题从句中不缺主语或宾语，所以不能用。"},{"id":"g3_english_046_ex05","knowledge_id":"g3_english_046","question":"句型转换题：改为同义句，每空一词。\nThe woman who is wearing a red dress is our English teacher.\n→ The woman ______ a red dress is our English teacher.","answer":"答案：in/wearing\n解析：本题考查定语从句与介词短语/现在分词的转换。who is wearing a red dress是定语从句，修饰the woman，可以转换为介词短语in a red dress（穿着红色裙子）或现在分词短语wearing a red dress作后置定语。wear表示状态，be in也表示「穿着」的状态。"},{"id":"g3_english_046_ex06","knowledge_id":"g3_english_046","question":"语法选择题：I can't find the book ______ my mother bought me for my birthday last month.\nA. who\nB. what\nC. /\nD. whose","answer":"答案：C\n解析：本题考查定语从句关系代词的省略。先行词是the book（物），关系代词that或which在定语从句中作bought的宾语，此时关系代词可以省略。who指代人；what不能引导定语从句；whose作定语，均不符合。故选C。"},{"id":"g3_english_046_ex07","knowledge_id":"g3_english_046","question":"填空题：填入适当的关系代词或关系副词。\nThe little town ______ we spent our summer vacation last year is very beautiful.","answer":"答案：where/in which\n解析：本题考查定语从句的关系副词。先行词是the little town（地点），关系副词where在定语从句中作地点状语，相当于in which。we spent our summer vacation in the little town，所以用where或in which。注意：如果从句中缺少主语或宾语，就用which/that而不用where。"},{"id":"g3_english_046_ex08","knowledge_id":"g3_english_046","question":"语法选择题：Which is the way ______ leads to the nearest hospital? I'm a stranger here.\nA. that\nB. which\nC. who\nD. what","answer":"答案：A\n解析：本题考查定语从句中只能用that的情况。当主句是以which或who开头的特殊疑问句时，为了避免重复，定语从句的关系代词只能用that，不能用which。本题主句是Which开头的疑问句，所以用that。that在从句中作主语，指代the way。"},{"id":"g3_english_046_ex09","knowledge_id":"g3_english_046","question":"翻译题：将下列句子翻译成英语。\n我昨天在书店买的那本小说非常有趣。","answer":"答案：The novel (that/which) I bought in the bookstore yesterday is very interesting.\n解析：本题考查定语从句的翻译。先行词是the novel（物），「我昨天在书店买的」用定语从句表达，关系代词that/which在从句中作bought的宾语，可以省略。「在书店」是in the bookstore，「有趣的」是interesting。注意定语从句的时态：昨天买的用一般过去时bought。"},{"id":"g3_english_046_ex10","knowledge_id":"g3_english_046","question":"翻译题：将下列句子翻译成英语。\n你能告诉我你爸爸工作的那家工厂的名字吗？","answer":"答案：Can you tell me the name of the factory where your father works?\n解析：本题考查定语从句的翻译。先行词是the factory（地点），「你爸爸工作的」用定语从句where your father works表达，where在从句中作地点状语（your father works in the factory），所以用关系副词where，相当于in which。"},{"id":"g3_english_047_ex01","knowledge_id":"g3_english_047","question":"语法选择题：______ we will go camping this weekend depends on whether the weather will be fine.\nA. That\nB. Whether\nC. If\nD. What","answer":"答案：B\n解析：本题考查主语从句的引导词。句意：我们这个周末是否去露营取决于天气是否好。whether引导主语从句，意为「是否」，可位于句首。if也可表示「是否」，但不能引导位于句首的主语从句，也不能作介词的宾语。that引导主语从句时不充当成分，也没有实际意义；what在从句中要充当主语或宾语，均不符合。"},{"id":"g3_english_047_ex02","knowledge_id":"g3_english_047","question":"语法选择题：I'm not sure ______ they will arrive on time. There is always heavy traffic on the highway.\nA. that\nB. what\nC. whether\nD. which","answer":"答案：C\n解析：本题考查宾语从句的引导词。I'm not sure后面接宾语从句，根据句意「我不确定他们是否会准时到达」，表示「是否」要用whether或if。that引导宾语从句时不充当成分，无实际意义；what（什么）和which（哪一个）均不符合句意。"},{"id":"g3_english_047_ex03","knowledge_id":"g3_english_047","question":"填空题：填入适当的引导词。\nThe question is ______ we can finish the project before the deadline.","answer":"答案：whether\n解析：本题考查表语从句的引导词。句意：问题是我们能否在截止日期前完成这个项目。whether引导表语从句，意为「是否」，在从句中不充当成分，但有实际意义。if不能引导表语从句（也不能引导位于句首的主语从句和同位语从句）。"},{"id":"g3_english_047_ex04","knowledge_id":"g3_english_047","question":"语法选择题：The teacher told us that the earth ______ around the sun when we were in Grade Seven.\nA. go\nB. goes\nC. went\nD. going","answer":"答案：B\n解析：本题考查宾语从句的时态。当宾语从句表示的是客观真理、科学事实、格言警句等时，不管主句用什么时态，从句都用一般现在时。「地球绕着太阳转」是客观真理，所以用一般现在时，the earth是第三人称单数，所以用goes。"},{"id":"g3_english_047_ex05","knowledge_id":"g3_english_047","question":"句型转换题：改为同义句，每空一词。\nI find that it is necessary to learn a foreign language well.\n→ I find ______ ______ to learn a foreign language well.","answer":"答案：it necessary\n解析：本题考查宾语从句与it作形式宾语的转换。在find/think/feel/make等动词后，可以用it作形式宾语，真正的宾语是后面的不定式短语，即「动词 + it + adj. + to do sth.」结构。it is necessary to learn...可以转换为it necessary to learn...，it是形式宾语，necessary是宾语补足语。"},{"id":"g3_english_047_ex06","knowledge_id":"g3_english_047","question":"语法选择题：—I don't know ______ Mr. Green will come to see us.\n—He will come next week, I think. Let's prepare a welcome party for him.\nA. when\nB. how\nC. that\nD. where","answer":"答案：A\n解析：本题考查宾语从句的引导词。根据答语「他下周会来」，可知问句是问「什么时候」来，所以用when引导宾语从句。how（怎样）问方式，that引导陈述句意义的宾语从句，where（哪里）问地点，均不符合答语内容。"},{"id":"g3_english_047_ex07","knowledge_id":"g3_english_047","question":"填空题：用所给动词的适当形式填空。\nI wondered if he ______ (come) to my birthday party the next day.","answer":"答案：would come\n解析：本题考查宾语从句的时态。主句wondered是一般过去时，从句也要用相应的过去时态。根据时间状语the next day（第二天），可知从句用过去将来时would come。注意：if此处意为「是否」，引导宾语从句，不是「如果」（条件状语从句）。"},{"id":"g3_english_047_ex08","knowledge_id":"g3_english_047","question":"语法选择题：It is suggested that we ______ a meeting to discuss the problem as soon as possible.\nA. hold\nB. held\nC. would hold\nD. will hold","answer":"答案：A\n解析：本题考查主语从句中的虚拟语气。在It is suggested/ordered/required/important/necessary that...句型中，that引导的主语从句要用虚拟语气，谓语动词用「should + 动词原形」，其中should可以省略。所以用（should）hold。"},{"id":"g3_english_047_ex09","knowledge_id":"g3_english_047","question":"翻译题：将下列句子翻译成英语。\n他在会议上所说的话让在场的所有人都感到很惊讶。","answer":"答案：What he said at the meeting made all the people present feel very surprised.\n解析：本题考查what引导的主语从句。「他在会议上所说的话」用what引导的主语从句what he said at the meeting表达，what在从句中作said的宾语。「让某人做某事」是make sb. do sth.，「在场的所有人」是all the people present，「感到惊讶」是feel surprised。"},{"id":"g3_english_047_ex10","knowledge_id":"g3_english_047","question":"翻译题：将下列句子翻译成英语。\n我们赢得比赛的消息让全班同学都兴奋不已。","answer":"答案：The news that we won the game made all the students in our class very excited.\n解析：本题考查that引导的同位语从句。「我们赢得比赛的消息」中，「我们赢得比赛」是解释说明the news的内容，所以用that引导同位语从句。that在同位语从句中不充当成分，只起连接作用，不能省略。「让某人兴奋」是make sb. excited。"},{"id":"g3_english_048_ex01","knowledge_id":"g3_english_048","question":"语法选择题：If I ______ you, I ______ accept the invitation and go to the party tonight.\nA. am; will\nB. was; would\nC. were; would\nD. were; will","answer":"答案：C\n解析：本题考查与现在事实相反的虚拟语气。句意：如果我是你，我会接受邀请去参加今晚的聚会。if引导的非真实条件句表示与现在事实相反时，从句谓语用过去式（be动词统一用were，不分人称），主句谓语用would/should/could/might + 动词原形。故选C。"},{"id":"g3_english_048_ex02","knowledge_id":"g3_english_048","question":"语法选择题：If you ______ harder last term, you ______ the final exam successfully.\nA. studied; would pass\nB. had studied; would have passed\nC. have studied; would pass\nD. studied; would have passed","answer":"答案：B\n解析：本题考查与过去事实相反的虚拟语气。句意：如果你上学期学习更努力的话，你就会成功通过期末考试了。if引导的非真实条件句表示与过去事实相反时，从句谓语用had + 过去分词，主句谓语用would/should/could/might + have + 过去分词。last term表示过去时间，故选B。"},{"id":"g3_english_048_ex03","knowledge_id":"g3_english_048","question":"填空题：用所给动词的适当形式填空。\nIf it ______ (rain) tomorrow, we would have to put off the sports meeting.","answer":"答案：should rain/were to rain/rained\n解析：本题考查与将来事实相反的虚拟语气。if引导的非真实条件句表示与将来事实相反时，从句谓语有三种形式：should + 动词原形、were to + 动词原形、或动词过去式（be动词用were），主句用would/should/could/might + 动词原形。三种形式中should rain可能性最小，were to rain更具假设性。"},{"id":"g3_english_048_ex04","knowledge_id":"g3_english_048","question":"语法选择题：______ I been there yesterday, I would have helped you with your problem.\nA. If\nB. Had\nC. Have\nD. Were","answer":"答案：B\n解析：本题考查虚拟语气的倒装。在if引导的非真实条件句中，如果从句中含有were, should, had等词，可以将if省略，把were, should, had提到句首，形成倒装。本题是与过去事实相反的虚拟语气，从句本来是If I had been there yesterday，省略if后把had提前，变成Had I been there yesterday。"},{"id":"g3_english_048_ex05","knowledge_id":"g3_english_048","question":"句型转换题：改为同义句，每空一词。\nIf there were no water, fish couldn't live.\n→ ______ water, fish couldn't live.","answer":"答案：Without\n解析：本题考查虚拟语气与介词without的转换。if引导的非真实条件句可以转换为without/but for + 名词的形式，表示含蓄虚拟条件。Without water = If there were no water，意为「如果没有水」。注意：without引导的介词短语相当于虚拟条件句，主句要用虚拟语气。"},{"id":"g3_english_048_ex06","knowledge_id":"g3_english_048","question":"语法选择题：The teacher suggested that we ______ more attention to our pronunciation when speaking English.\nA. pay\nB. paid\nC. would pay\nD. had paid","answer":"答案：A\n解析：本题考查虚拟语气在宾语从句中的用法。在表示建议、命令、要求的动词（如suggest, advise, order, command, require, request, demand等）后面的宾语从句中，谓语动词要用虚拟语气，即should + 动词原形，其中should可以省略。所以用（should）pay。"},{"id":"g3_english_048_ex07","knowledge_id":"g3_english_048","question":"填空题：用所给动词的适当形式填空。\nIt is important that every student ______ (master) a foreign language in modern society.","answer":"答案：(should) master\n解析：本题考查虚拟语气在主语从句中的用法。在It is important/necessary/essential/strange/natural that...句型中，that引导的主语从句要用虚拟语气，谓语动词用should + 动词原形，其中should可以省略。所以用(should) master。"},{"id":"g3_english_048_ex08","knowledge_id":"g3_english_048","question":"语法选择题：I wish I ______ fly like a bird in the sky freely when I was a little child.\nA. can\nB. could\nC. am able to\nD. would","answer":"答案：B\n解析：本题考查wish后面宾语从句的虚拟语气。wish后面的宾语从句要用虚拟语气，表示与事实相反的愿望。表示与现在事实相反，从句谓语用过去式（be用were）；表示与过去事实相反，用had + 过去分词；表示与将来事实相反，用would/could + 动词原形。本题「我小时候希望能像鸟一样飞」是与过去事实相反的愿望，用could fly。"},{"id":"g3_english_048_ex09","knowledge_id":"g3_english_048","question":"翻译题：将下列句子翻译成英语。\n如果我是你的话，我会抓住这次出国深造的机会。","answer":"答案：If I were you, I would seize this chance to go abroad for further study.\n解析：本题考查与现在事实相反的虚拟语气。if引导非真实条件句，与现在事实相反，从句用过去式（be动词用were），主句用would + 动词原形。「抓住机会」是seize this chance/grab this opportunity，「出国深造」是go abroad for further study。"},{"id":"g3_english_048_ex10","knowledge_id":"g3_english_048","question":"翻译题：将下列句子翻译成英语。\n要不是你的帮助，我不可能按时完成这项艰巨的任务。","answer":"答案：But for / Without your help, I couldn't have finished this difficult task on time.\n解析：本题考查含蓄虚拟条件句。but for/without意为「要不是、如果没有」，相当于if it hadn't been for...，表示与过去事实相反的虚拟语气。主句用couldn't + have + 过去分词，表示「本不可能做某事（但实际做了）」。「按时完成任务」是finish the task on time。"}];
        const HAS_EXAMPLES = true;

        // 错题本管理器
        const WrongBookManager = {
            STORAGE_KEY_PREFIX: 'wrongbook_',
            getWrongBook(grade, subject) {
                const key = this.STORAGE_KEY_PREFIX + grade + '_' + subject;
                return JSON.parse(localStorage.getItem(key) || '[]');
            },
            addWrongBook(item) {
                const key = this.STORAGE_KEY_PREFIX + item.grade + '_' + item.subject;
                let wrongBook = this.getWrongBook(item.grade, item.subject);
                const exists = wrongBook.some(w => w.question === item.question);
                if (exists) return false;
                wrongBook.push({...item, id: item.knowledgeId + '_' + Date.now(), addedAt: new Date().toISOString()});
                localStorage.setItem(key, JSON.stringify(wrongBook));
                return true;
            }
        };

        // 学习进度管理器
        const ProgressManager = {
            STORAGE_KEY: 'study_progress',
            
            getProgress() {
                try {
                    return JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
                } catch(e) {
                    return {};
                }
            },
            
            saveProgress(progress) {
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(progress));
            },
            
            recordStudy(grade, subject, subjectName, semester, semesterName, knowledgeId, knowledgeName) {
                const progress = this.getProgress();
                const now = new Date().toISOString();
                const today = new Date().toISOString().split('T')[0];
                
                if (!progress.learnedKnowledge) progress.learnedKnowledge = {};
                if (!progress.dailyStats) progress.dailyStats = {};
                if (!progress.dailyStats[today]) {
                    progress.dailyStats[today] = { learnedCount: 0, subjects: [] };
                }
                
                const isNew = !progress.learnedKnowledge[knowledgeId];
                progress.learnedKnowledge[knowledgeId] = { learnedAt: now };
                
                if (isNew) {
                    progress.dailyStats[today].learnedCount++;
                    if (!progress.dailyStats[today].subjects.includes(subject)) {
                        progress.dailyStats[today].subjects.push(subject);
                    }
                }
                
                progress.lastStudy = {
                    grade, subject, subjectName, semester, semesterName,
                    knowledgeId, knowledgeName, timestamp: now
                };
                
                this.saveProgress(progress);
            },
            
            isLearned(knowledgeId) {
                const progress = this.getProgress();
                return !!(progress.learnedKnowledge && progress.learnedKnowledge[knowledgeId]);
            },
            
            getLastStudy() {
                const progress = this.getProgress();
                return progress.lastStudy || null;
            },
            
            getSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                if (!progress.learnedKnowledge) return { learned: 0, total: 0, percent: 0 };
                const prefix = grade + '_' + subject + '_';
                const learned = Object.keys(progress.learnedKnowledge).filter(k => k.startsWith(prefix)).length;
                const total = DATA_KNOWLEDGE.length;
                const percent = total > 0 ? Math.round((learned / total) * 100) : 0;
                return { learned, total, percent };
            },
            
            clearSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                const prefix = grade + '_' + subject + '_';
                
                if (progress.learnedKnowledge) {
                    Object.keys(progress.learnedKnowledge).forEach(k => {
                        if (k.startsWith(prefix)) {
                            delete progress.learnedKnowledge[k];
                        }
                    });
                }
                
                if (progress.lastStudy && progress.lastStudy.grade === grade && progress.lastStudy.subject === subject) {
                    delete progress.lastStudy;
                }
                
                this.saveProgress(progress);
                return true;
            }
        };

        function initPage() {
            const {grade, subject, semester} = currentParams;
            pageTitle.textContent = gradeNames[grade] + ' · ' + subjectNames[subject] + ' · ' + semesterNames[semester];
            loadKnowledge();
            updateProgressStat();
            
            const hash = window.location.hash.replace('#', '');
            if (hash && knowledgeList.some(k => k.id === hash)) {
                setTimeout(() => {
                    toggleExpand(hash);
                    const card = document.querySelector('[data-id="' + hash + '"]');
                    if (card) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
        }

        function updateProgressStat() {
            const {grade, subject} = currentParams;
            const learnedInSemester = knowledgeList.filter(k => ProgressManager.isLearned(k.id)).length;
            document.getElementById('progress-learned').textContent = learnedInSemester;
            document.getElementById('progress-total').textContent = knowledgeList.length;
        }

        function loadKnowledge() {
            const {grade, subject, semester} = currentParams;
            knowledgeList = DATA_KNOWLEDGE.filter(k => {
                return k.semester === semester;
            });
            renderKnowledgeList();
        }

        function renderKnowledgeList(items = knowledgeList) {
            if (items.length === 0) {
                knowledgeListEl.innerHTML = '';
                emptyStateEl.classList.remove('hidden');
                return;
            }
            emptyStateEl.classList.add('hidden');
            knowledgeListEl.innerHTML = items.map(item => {
                const isExpanded = expandedIds.has(item.id);
                const isLearned = ProgressManager.isLearned(item.id);
                return '<div class="card knowledge-card ' + (isLearned ? 'learned' : '') + '" data-id="' + item.id + '">' +
                    '<div class="knowledge-header p-4 flex items-center justify-between" onclick="toggleExpand(\'' + item.id + '\')">' +
                        '<div class="flex items-center gap-3 flex-1 min-w-0">' +
                            '<div class="expand-icon ' + (isExpanded ? 'expanded' : 'collapsed') + '">' + (isExpanded ? '−' : '+') + '</div>' +
                            '<div class="flex-1 min-w-0">' +
                                '<h3 class="text-lg font-semibold text-gray-800 flex items-center gap-2">' + escapeHtml(item.name) + (isLearned ? '<span class="text-green-500 text-sm">✓ 已学习</span>' : '') + '</h3>' +
                                '<p class="text-xs text-gray-500 mt-1">' + escapeHtml(item.chapter) + '</p>' +
                            '</div>' +
                        '</div>' +
                        (HAS_EXAMPLES ? '<button class="btn btn-secondary text-sm px-3 py-1" onclick="event.stopPropagation(); showExample(\'' + item.id + '\', \'' + escapeHtml(item.name) + '\')">例题</button>' : '') +
                    '</div>' +
                    '<div id="content-' + item.id + '" class="px-6 pb-4 ' + (isExpanded ? '' : 'hidden') + '">' +
                        (item.formula ? '<div class="mb-4"><h4 class="text-sm font-medium text-gray-500 mb-2">📐 公式</h4><p class="formula-box text-gray-800 text-lg bg-gray-50 p-3 rounded-lg">' + escapeHtml(item.formula) + '</p></div>' : '') +
                        (item.explanation ? '<div><h4 class="text-sm font-medium text-gray-500 mb-2">📝 解释</h4><p class="text-gray-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(item.explanation) + '</p></div>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function toggleExpand(id) {
            const isNewLearn = !expandedIds.has(id) && !ProgressManager.isLearned(id);
            if (expandedIds.has(id)) {
                expandedIds.delete(id);
            } else {
                expandedIds.add(id);
                const {grade, subject, semester} = currentParams;
                const item = knowledgeList.find(k => k.id === id);
                if (item) {
                    ProgressManager.recordStudy(
                        grade, subject, subjectNames[subject],
                        semester, semesterNames[semester],
                        id, item.name
                    );
                }
            }
            const card = document.querySelector('[data-id="' + id + '"]');
            const content = document.getElementById('content-' + id);
            const icon = card.querySelector('.expand-icon');
            const header = card.querySelector('.knowledge-header');
            const title = card.querySelector('h3');
            if (expandedIds.has(id)) {
                content.classList.remove('hidden');
                icon.classList.remove('collapsed');
                icon.classList.add('expanded');
                icon.textContent = '−';
                header.classList.add('expanded');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('expanded');
                icon.classList.add('collapsed');
                icon.textContent = '+';
                header.classList.remove('expanded');
            }
            if (isNewLearn) {
                card.classList.add('learned');
                if (!title.querySelector('.text-green-500')) {
                    title.innerHTML += '<span class="text-green-500 text-sm">✓ 已学习</span>';
                }
                updateProgressStat();
            }
        }

        function expandAll() {
            knowledgeList.forEach(item => expandedIds.add(item.id));
            renderKnowledgeList();
        }

        function collapseAll() {
            expandedIds.clear();
            renderKnowledgeList();
        }

        function searchKnowledge(keyword, list) {
            if (!keyword) return [];
            const lower = keyword.toLowerCase();
            return list.filter(k =>
                k.name.toLowerCase().includes(lower) ||
                k.chapter.toLowerCase().includes(lower)
            );
        }

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                searchResultsInfo.classList.add('hidden');
                renderKnowledgeList();
                return;
            }
            const results = searchKnowledge(keyword, knowledgeList);
            searchCountEl.textContent = results.length;
            searchResultsInfo.classList.remove('hidden');
            renderKnowledgeList(results);
        }

        function showExample(knowledgeId, knowledgeName) {
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === knowledgeId);
            if (examples.length === 0) {
                alert('暂无例题');
                return;
            }
            const example = examples[Math.floor(Math.random() * examples.length)];
            currentExample = {...example, knowledgeId, knowledgeName, ...currentParams};
            document.getElementById('example-knowledge-name').textContent = knowledgeName;
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
            document.getElementById('example-modal').classList.remove('hidden');
        }

        function nextExample() {
            if (!currentExample) return;
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === currentExample.knowledgeId);
            const otherExamples = examples.filter(e => e !== currentExample);
            if (otherExamples.length === 0) {
                alert('没有更多例题了');
                return;
            }
            const example = otherExamples[Math.floor(Math.random() * otherExamples.length)];
            currentExample = {...example, knowledgeId: currentExample.knowledgeId, knowledgeName: currentExample.knowledgeName, ...currentParams};
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
        }

        function addToWrongBook() {
            if (!currentExample) return;
            const item = {
                knowledgeId: currentExample.knowledgeId,
                knowledgeName: currentExample.knowledgeName,
                question: currentExample.question,
                answer: currentExample.answer,
                grade: currentParams.grade,
                subject: currentParams.subject
            };
            if (WrongBookManager.addWrongBook(item)) {
                alert('已加入错题本！');
            } else {
                alert('该题目已在错题本中');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearProgress() {
            const {grade, subject} = currentParams;
            const subjectName = subjectNames[subject];
            var msg = '确定要清除【' + subjectName + '】科目的所有学习进度吗？';
            msg += '\n\n';
            msg += '此操作将清除该科目所有已学习标记，且不可恢复。';
            if (!confirm(msg)) {
                return;
            }
            ProgressManager.clearSubjectProgress(grade, subject);
            updateProgressStat();
            renderKnowledgeList();
            alert('学习进度已清除');
        }

        document.getElementById('btn-expand-all').addEventListener('click', expandAll);
        document.getElementById('btn-collapse-all').addEventListener('click', collapseAll);
        document.getElementById('btn-clear-progress').addEventListener('click', clearProgress);
        searchInput.addEventListener('keyup', e => { if (e.key === 'Enter') performSearch(); });
        searchInput.addEventListener('input', () => { if (!searchInput.value) { searchResultsInfo.classList.add('hidden'); renderKnowledgeList(); }});
        document.getElementById('close-example').addEventListener('click', () => document.getElementById('example-modal').classList.add('hidden'));
        document.getElementById('btn-show-answer').addEventListener('click', () => {
            document.getElementById('example-answer-section').classList.remove('hidden');
            document.getElementById('btn-show-answer').classList.add('hidden');
        });
        document.getElementById('btn-next-example').addEventListener('click', nextExample);
        document.getElementById('btn-add-wrong').addEventListener('click', addToWrongBook);
        document.getElementById('example-modal').addEventListener('click', e => { if (e.target.id === 'example-modal') document.getElementById('example-modal').classList.add('hidden'); });

        initPage();
    </script>
</body>
</html>
