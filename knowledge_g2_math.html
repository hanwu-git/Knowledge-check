    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"id":"g2_math_027","chapter":"第十一章 三角形","name":"三角形的概念与分类","formula":"三角形内角和 = 180°","explanation":"由不在同一直线上的三条线段首尾顺次相接所组成的图形叫做三角形。\n\n分类：\n1. 按角分：\n   - 锐角三角形：三个角都是锐角\n   - 直角三角形：有一个角是直角\n   - 钝角三角形：有一个角是钝角\n\n2. 按边分：\n   - 不等边三角形：三边都不相等\n   - 等腰三角形：有两条边相等\n   - 等边三角形：三边都相等（特殊的等腰三角形）","semester":"upper"},{"id":"g2_math_028","chapter":"第十一章 三角形","name":"三角形的三边关系","formula":"a + b > c\n|b - a| < c < a + b","explanation":"三角形任意两边之和大于第三边，任意两边之差小于第三边。\n\n应用：\n1. 判断三条线段能否组成三角形\n2. 求三角形某边的取值范围\n\n例如：三边长为 3, 4, 5 的三角形，因为 3+4>5, 3+5>4, 4+5>3，所以能组成三角形。","semester":"upper"},{"id":"g2_math_029","chapter":"第十一章 三角形","name":"三角形的内角和","formula":"∠A + ∠B + ∠C = 180°","explanation":"三角形的内角和等于 180°。\n\n推论：\n1. 直角三角形的两个锐角互余（和为90°）\n2. 三角形的一个外角等于与它不相邻的两个内角之和\n3. 三角形的一个外角大于任何一个与它不相邻的内角","semester":"upper"},{"id":"g2_math_030","chapter":"第十一章 三角形","name":"三角形的外角","formula":"外角 = 不相邻两内角之和","explanation":"三角形的一边与另一边的延长线组成的角，叫做三角形的外角。\n\n性质：\n1. 三角形的一个外角等于与它不相邻的两个内角之和\n2. 三角形的一个外角大于任何一个与它不相邻的内角\n3. 三角形的外角和等于 360°","semester":"upper"},{"id":"g2_math_031","chapter":"第十一章 三角形","name":"多边形内角和","formula":"(n-2) × 180°","explanation":"n 边形的内角和等于 (n-2) × 180°。\n\n常用：\n- 四边形内角和 = 360°\n- 五边形内角和 = 540°\n- 六边形内角和 = 720°\n\nn 边形的外角和等于 360°。","semester":"upper"},{"id":"g2_math_032","chapter":"第十二章 全等三角形","name":"全等三角形的概念与性质","formula":"△ABC ≌ △A'B'C'","explanation":"能够完全重合的两个三角形叫做全等三角形。\n\n性质：\n1. 全等三角形的对应边相等\n2. 全等三角形的对应角相等\n3. 全等三角形的对应高、对应中线、对应角平分线相等\n4. 全等三角形的周长相等、面积相等","semester":"upper"},{"id":"g2_math_033","chapter":"第十二章 全等三角形","name":"三角形全等的判定-SSS","formula":"三边对应相等的两个三角形全等","explanation":"边边边（SSS）：\n如果两个三角形的三条边分别相等，那么这两个三角形全等。\n\n写作：\n在 △ABC 和 △A'B'C' 中，\nAB = A'B', BC = B'C', CA = C'A'\n∴ △ABC ≌ △A'B'C'（SSS）","semester":"upper"},{"id":"g2_math_034","chapter":"第十二章 全等三角形","name":"三角形全等的判定-SAS","formula":"两边和它们的夹角对应相等的两个三角形全等","explanation":"边角边（SAS）：\n如果两个三角形的两边和它们的夹角分别相等，那么这两个三角形全等。\n\n注意：必须是夹角，而不是任意一个角。","semester":"upper"},{"id":"g2_math_035","chapter":"第十二章 全等三角形","name":"三角形全等的判定-ASA","formula":"两角和它们的夹边对应相等的两个三角形全等","explanation":"角边角（ASA）：\n如果两个三角形的两角和它们的夹边分别相等，那么这两个三角形全等。","semester":"upper"},{"id":"g2_math_036","chapter":"第十二章 全等三角形","name":"三角形全等的判定-AAS","formula":"两角和其中一角的对边对应相等的两个三角形全等","explanation":"角角边（AAS）：\n如果两个三角形的两角和其中一角的对边分别相等，那么这两个三角形全等。","semester":"upper"},{"id":"g2_math_037","chapter":"第十二章 全等三角形","name":"直角三角形全等的判定-HL","formula":"斜边和一直角边对应相等的两个直角三角形全等","explanation":"HL 定理：\n斜边和一条直角边分别相等的两个直角三角形全等。\n\n这是直角三角形特有的判定方法，HL 代表 Hypotenuse-Leg（斜边-直角边）。","semester":"upper"},{"id":"g2_math_038","chapter":"第十三章 轴对称","name":"轴对称图形","formula":"对称轴","explanation":"如果一个平面图形沿一条直线折叠，直线两旁的部分能够完全重合，那么这个图形叫做轴对称图形，这条直线就是它的对称轴。\n\n常见的轴对称图形：\n- 等腰三角形（1条对称轴）\n- 等边三角形（3条对称轴）\n- 长方形（2条对称轴）\n- 正方形（4条对称轴）\n- 圆（无数条对称轴）","semester":"upper"},{"id":"g2_math_039","chapter":"第十三章 轴对称","name":"线段垂直平分线的性质","formula":"到线段两端距离相等的点在这条线段的垂直平分线上","explanation":"垂直平分线：经过线段中点并且垂直于这条线段的直线叫做这条线段的垂直平分线。\n\n性质：\n1. 线段垂直平分线上的点到这条线段两端点的距离相等\n2. 到一条线段两端点距离相等的点，在这条线段的垂直平分线上","semester":"upper"},{"id":"g2_math_040","chapter":"第十三章 轴对称","name":"等腰三角形的性质","formula":"等腰三角形两底角相等\n三线合一：顶角平分线、底边上的中线、底边上的高互相重合","explanation":"等腰三角形：有两条边相等的三角形。\n\n性质：\n1. 等腰三角形的两底角相等（等边对等角）\n2. 等腰三角形顶角的平分线、底边上的中线、底边上的高互相重合（三线合一）\n3. 等腰三角形是轴对称图形，对称轴是顶角平分线所在的直线","semester":"upper"},{"id":"g2_math_041","chapter":"第十三章 轴对称","name":"等边三角形的性质","formula":"三边相等，三个角都等于 60°","explanation":"等边三角形：三条边都相等的三角形。\n\n性质：\n1. 三边相等\n2. 三个内角都等于 60°\n3. 是轴对称图形，有 3 条对称轴\n4. 每条边上都存在\"三线合一\"","semester":"upper"},{"id":"g2_math_042","chapter":"第十四章 整式的乘除与因式分解","name":"同底数幂的乘法","formula":"aᵐ · aⁿ = aᵐ⁺ⁿ (m, n 是正整数)","explanation":"同底数幂相乘，底数不变，指数相加。\n\n推广：\naᵐ · aⁿ · aᵖ = aᵐ⁺ⁿ⁺ᵖ","semester":"upper"},{"id":"g2_math_043","chapter":"第十四章 整式的乘除与因式分解","name":"幂的乘方与积的乘方","formula":"(aᵐ)ⁿ = aᵐⁿ\n(ab)ⁿ = aⁿbⁿ","explanation":"幂的乘方：底数不变，指数相乘。(aᵐ)ⁿ = aᵐⁿ\n\n积的乘方：把积的每一个因式分别乘方，再把所得的幂相乘。(ab)ⁿ = aⁿbⁿ","semester":"upper"},{"id":"g2_math_044","chapter":"第十四章 整式的乘除与因式分解","name":"同底数幂的除法","formula":"aᵐ / aⁿ = aᵐ⁻ⁿ (a ≠ 0, m > n)","explanation":"同底数幂相除，底数不变，指数相减。\n\n零指数幂：a⁰ = 1 (a ≠ 0)\n\n负指数幂：a⁻ⁿ = 1/aⁿ (a ≠ 0)","semester":"upper"},{"id":"g2_math_045","chapter":"第十四章 整式的乘除与因式分解","name":"整式的乘法","formula":"(a + b)(c + d) = ac + ad + bc + bd\n单项式 × 多项式 = 各项相乘再相加","explanation":"单项式乘单项式：系数相乘，同底数幂相乘。\n\n单项式乘多项式：m(a+b+c) = ma + mb + mc\n\n多项式乘多项式：(a+b)(c+d) = ac + ad + bc + bd","semester":"upper"},{"id":"g2_math_046","chapter":"第十四章 整式的乘除与因式分解","name":"乘法公式-平方差公式","formula":"(a + b)(a - b) = a² - b²","explanation":"两个数的和与这两个数的差的积，等于这两个数的平方差。\n\n应用：\n- 简便计算：(x+3)(x-3) = x² - 9\n- 简化多项式乘法","semester":"upper"},{"id":"g2_math_047","chapter":"第十四章 整式的乘除与因式分解","name":"乘法公式-完全平方公式","formula":"(a + b)² = a² + 2ab + b²\n(a - b)² = a² - 2ab + b²","explanation":"两数和（或差）的平方，等于它们的平方和，加上（或减去）它们的积的 2 倍。\n\n应用：\n- 简便计算：(x+5)² = x² + 10x + 25\n- 完全平方式：a² ± 2ab + b²","semester":"upper"},{"id":"g2_math_048","chapter":"第十四章 整式的乘除与因式分解","name":"因式分解","formula":"提公因式法、公式法","explanation":"因式分解：把一个多项式化为几个整式的积的形式。\n\n常用方法：\n1. 提公因式法：ma + mb = m(a + b)\n2. 公式法：\n   - 平方差公式：a² - b² = (a+b)(a-b)\n   - 完全平方公式：a² ± 2ab + b² = (a ± b)²\n3. 十字相乘法（拓展）","semester":"upper"},{"id":"g2_math_049","chapter":"第十五章 分式","name":"分式的概念","formula":"A/B (B 中含有字母，B ≠ 0)","explanation":"一般地，如果 A、B 表示两个整式，并且 B 中含有字母，那么式子 A/B 叫做分式。\n\n注意：\n1. 分式中分母 B ≠ 0（分母为零时无意义）\n2. 当 A = 0 时，分式 A/B = 0（前提是 B ≠ 0）","semester":"upper"},{"id":"g2_math_050","chapter":"第十五章 分式","name":"分式的基本性质","formula":"A/B = A·C / B·C = A÷C / B÷C (B ≠ 0, C ≠ 0)","explanation":"分式的分子与分母同乘（或除以）一个不为 0 的整式，分式的值不变。\n\n应用：\n1. 约分：将分子分母同除以公因式\n2. 通分：将异分母分式化为同分母分式","semester":"upper"},{"id":"g2_math_051","chapter":"第十五章 分式","name":"分式的乘除法","formula":"a/b · c/d = ac/bd\na/b ÷ c/d = ad/bc","explanation":"分式乘分式：用分子的积作为积的分子，分母的积作为积的分母。\n\n分式除以分式：把除式的分子分母颠倒位置后，与被除式相乘。","semester":"upper"},{"id":"g2_math_052","chapter":"第十五章 分式","name":"分式的加减法","formula":"同分母：a/c ± b/c = (a ± b)/c\n异分母：先通分再相加减","explanation":"同分母分式相加减：分母不变，分子相加减。\n\n异分母分式相加减：先通分，化为同分母分式，然后再加减。","semester":"upper"},{"id":"g2_math_053","chapter":"第十五章 分式","name":"分式方程","formula":"解分式方程：去分母 → 解整式方程 → 验根","explanation":"分式方程：分母中含有未知数的方程。\n\n解法步骤：\n1. 在方程两边同乘最简公分母，去分母\n2. 解所得的整式方程\n3. 检验：将整式方程的根代入最简公分母，使分母不为 0 的根是原方程的根，否则是增根","semester":"upper"},{"id":"g2_math_001","chapter":"第十六章 二次根式","name":"二次根式的概念","formula":"√a (a ≥ 0)","explanation":"形如√a的代数式叫做二次根式，其中a必须是非负数。\n关键点：\n1. 二次根式必须有根号\n2. 被开方数a必须大于或等于0\n3. 二次根式是非负数，即√a ≥ 0\n\n注意：负数没有平方根，所以二次根式中被开方数必须非负。","semester":"lower"},{"id":"g2_math_002","chapter":"第十六章 二次根式","name":"二次根式的基本性质","formula":"(√a)² = a (a ≥ 0)\n√(a²) = |a|","explanation":"1. (√a)² = a（a ≥ 0）：一个非负数的算术平方根的平方等于它本身\n2. √(a²) = |a|：一个数的平方的算术平方根等于这个数的绝对值\n\n重要应用：\n√(a²) 不等于 a，要看 a 的正负性","semester":"lower"},{"id":"g2_math_003","chapter":"第十六章 二次根式","name":"二次根式的乘除法","formula":"√a · √b = √(ab) (a ≥ 0, b ≥ 0)\n√a / √b = √(a/b) (a ≥ 0, b > 0)","explanation":"二次根式乘除法法则：\n1. √a · √b = √(ab)\n2. √a / √b = √(a/b)\n\n前提条件：a ≥ 0, b ≥ 0","semester":"lower"},{"id":"g2_math_004","chapter":"第十六章 二次根式","name":"最简二次根式","formula":"√a (a为正整数且不含能开尽方的因数)","explanation":"最简二次根式必须满足两个条件：\n1. 被开方数不含分母\n2. 被开方数中不含能开得尽方的因数或因式","semester":"lower"},{"id":"g2_math_005","chapter":"第十六章 二次根式","name":"二次根式的加减法","formula":"a√m ± b√m = (a ± b)√m","explanation":"二次根式加减法法则：\n先把各个二次根式化成最简二次根式，再把被开方数相同的二次根式进行合并。","semester":"lower"},{"id":"g2_math_006","chapter":"第十六章 二次根式","name":"二次根式的混合运算","formula":"(a + b)(a - b) = a² - b²","explanation":"二次根式混合运算顺序：\n1. 先算乘方，再算乘除，最后算加减\n2. 有括号的先算括号内的\n3. 能利用乘法公式的要先用公式简化","semester":"lower"},{"id":"g2_math_007","chapter":"第十六章 二次根式","name":"分母有理化","formula":"1/√a = √a/a (a > 0)\n1/(√a ± √b) = (√a ∓ √b)/(a - b)","explanation":"分母有理化：把分母中的根号化去，使分母变为有理数。\n\n方法：\n1. 分子分母同乘以分母的有理化因式\n2. 如 1/√3，分子分母同乘以√3，得到 √3/3","semester":"lower"},{"id":"g2_math_008","chapter":"第十七章 勾股定理","name":"勾股定理","formula":"a² + b² = c²","explanation":"勾股定理：直角三角形两条直角边的平方和等于斜边的平方。\n\n其中：\n- a, b 是直角边\n- c 是斜边（最长边）","semester":"lower"},{"id":"g2_math_009","chapter":"第十七章 勾股定理","name":"勾股定理的逆定理","formula":"若 a² + b² = c²，则△ABC是直角三角形","explanation":"勾股定理的逆定理：\n如果三角形的三边长 a, b, c 满足 a² + b² = c²，那么这个三角形是直角三角形。","semester":"lower"},{"id":"g2_math_010","chapter":"第十七章 勾股定理","name":"勾股定理的应用","formula":"a² + b² = c²","explanation":"勾股定理在实际问题中的应用：\n\n1. 测量问题\n2. 最短路径问题\n3. 立体图形中的距离计算\n4. 等腰三角形、梯形等几何图形中的边长计算","semester":"lower"},{"id":"g2_math_011","chapter":"第十八章 平行四边形","name":"平行四边形的定义与性质","formula":"对边平行且相等；对角相等；对角线互相平分","explanation":"平行四边形定义：两组对边分别平行的四边形叫做平行四边形。\n\n性质：\n1. 对边平行且相等\n2. 对角相等\n3. 相邻内角互补\n4. 对角线互相平分","semester":"lower"},{"id":"g2_math_012","chapter":"第十八章 平行四边形","name":"矩形的性质与判定","formula":"对角线相等且互相平分；四个角都是直角","explanation":"矩形：有一个角是直角的平行四边形叫做矩形。\n\n性质：\n1. 具有平行四边形的所有性质\n2. 四个角都是直角\n3. 对角线相等且互相平分","semester":"lower"},{"id":"g2_math_013","chapter":"第十八章 平行四边形","name":"菱形的性质与判定","formula":"对角线互相垂直平分；四条边都相等","explanation":"菱形：有一组邻边相等的平行四边形叫做菱形。\n\n性质：\n1. 具有平行四边形的所有性质\n2. 四条边都相等\n3. 对角线互相垂直平分","semester":"lower"},{"id":"g2_math_014","chapter":"第十八章 平行四边形","name":"正方形的性质与判定","formula":"对角线相等且互相垂直平分；四条边都相等；四个角都是直角","explanation":"正方形：有一组邻边相等并且有一个角是直角的平行四边形叫做正方形。\n\n性质：\n1. 具有矩形和菱形的所有性质\n2. 四条边都相等\n3. 四个角都是直角","semester":"lower"},{"id":"g2_math_015","chapter":"第十八章 平行四边形","name":"三角形中位线","formula":"三角形的中位线平行于第三边，且等于第三边的一半","explanation":"三角形中位线：连接三角形两边中点的线段叫做三角形的中位线。\n\n性质：\n1. 中位线平行于第三边\n2. 中位线等于第三边的一半","semester":"lower"},{"id":"g2_math_016","chapter":"第十九章 一次函数","name":"变量与函数","formula":"y = f(x)","explanation":"变量：在一个变化过程中，数值发生变化的量称为变量。\n\n常量：数值始终不变的量称为常量。\n\n函数：在一个变化过程中，如果有两个变量 x 和 y，并且对于 x 的每一个确定的值，y 都有唯一确定的值与其对应，那么我们就说 x 是自变量，y 是 x 的函数。","semester":"lower"},{"id":"g2_math_017","chapter":"第十九章 一次函数","name":"正比例函数","formula":"y = kx (k ≠ 0)","explanation":"正比例函数：形如 y = kx（k 是常数，k ≠ 0）的函数叫做正比例函数。\n\n图象：经过原点的一条直线。\n\n性质：\n1. 当 k > 0 时，y 随 x 的增大而增大\n2. 当 k < 0 时，y 随 x 的增大而减小","semester":"lower"},{"id":"g2_math_018","chapter":"第十九章 一次函数","name":"一次函数","formula":"y = kx + b (k ≠ 0)","explanation":"一次函数：形如 y = kx + b（k, b 是常数，k ≠ 0）的函数叫做一次函数。\n\n图象：一条直线。\n\n性质：\n1. k 决定直线的倾斜方向\n2. b 决定直线与 y 轴的交点位置","semester":"lower"},{"id":"g2_math_019","chapter":"第十九章 一次函数","name":"一次函数的图象与性质","formula":"k > 0 时，y 随 x 的增大而增大\nk < 0 时，y 随 x 的增大而减小","explanation":"一次函数 y = kx + b 的图象与性质：\n\n1. k > 0：y 随 x 的增大而增大\n2. k < 0：y 随 x 的增大而减小\n3. 直线与 x 轴交点：(-b/k, 0)\n4. 直线与 y 轴交点：(0, b)","semester":"lower"},{"id":"g2_math_020","chapter":"第十九章 一次函数","name":"一次函数与二元一次方程","formula":"y = kx + b 对应 kx - y + b = 0","explanation":"一次函数与二元一次方程的关系：\n\n1. 一次函数 y = kx + b 的图象上的每一个点的坐标(x, y)都是二元一次方程 kx - y + b = 0 的解\n2. 以二元一次方程的解为坐标的点都在对应的一次函数的图象上","semester":"lower"},{"id":"g2_math_021","chapter":"第十九章 一次函数","name":"用函数观点看方程(组)与不等式","formula":"kx + b = 0 → x = -b/k","explanation":"用函数观点看方程与不等式：\n\n1. 解方程 kx + b = 0：求直线 y = kx + b 与 x 轴的交点的横坐标\n2. 解不等式 kx + b > 0：求直线 y = kx + b 在 x 轴上方时 x 的取值范围","semester":"lower"},{"id":"g2_math_022","chapter":"第二十章 数据的分析整理","name":"数据的描述","formula":"平均数、中位数、众数","explanation":"数据的描述：\n\n1. 平均数：所有数据的总和除以数据的个数\n2. 中位数：把数据按从小到大排列后，位于中间位置的数\n3. 众数：出现次数最多的数据","semester":"lower"},{"id":"g2_math_023","chapter":"第二十章 数据的分析整理","name":"加权平均数","formula":"x̄ = (w1x1 + w2x2 + ... + wn xn) / (w1 + w2 + ... + wn)","explanation":"加权平均数：如果 n 个数据 x₁, x₂, ..., xₙ 的权分别是 w₁, w₂, ..., wₙ，那么加权平均数为：\n\nx̄ = (w₁x₁ + w₂x₂ + ... + wₙxₙ) / (w₁ + w₂ + ... + wₙ)","semester":"lower"},{"id":"g2_math_024","chapter":"第二十章 数据的分析整理","name":"中位数和众数","formula":"中位数：中间位置的数\n众数：出现次数最多的数","explanation":"中位数：\n将一组数据按照从小到大（或从大到小）的顺序排列，如果数据的个数是奇数，则处于中间位置的数就是这组数据的中位数；如果数据的个数是偶数，则中间两个数据的平均数就是这组数据的中位数。\n\n众数：\n一组数据中出现次数最多的数据就是这组数据的众数。","semester":"lower"},{"id":"g2_math_025","chapter":"第二十章 数据的分析整理","name":"极差与方差","formula":"极差 = 最大值 - 最小值\n方差 s² = (1/n) Σ(xᵢ - x̄)²","explanation":"极差：\n一组数据中的最大值与最小值的差叫做极差。\n极差反映了一组数据的变动范围。\n\n方差：\n对于 n 个数据 x₁, x₂, ..., xₙ，各数据与它们的平均数 x̄ 的差的平方的平均数，叫做这组数据的方差。","semester":"lower"},{"id":"g2_math_026","chapter":"第二十章 数据的分析整理","name":"数据的分析整理","formula":"频数、频率、统计图","explanation":"数据的分析整理：\n\n1. 频数：每个对象出现的次数\n2. 频率：每个对象出现的次数与总次数的比值\n3. 各频率之和等于 1\n\n常用统计图：\n- 条形统计图\n- 折线统计图\n- 扇形统计图\n- 频数分布直方图\n\n作用：直观、清晰地表示数据，便于分析。","semester":"lower"}];

        // ==================== 内嵌例题数据 ====================
        const DATA_EXAMPLES = [{"id":"g2_math_001_ex01","knowledge_id":"g2_math_001","question":"选择题：下列式子中，属于二次根式的是（  ）\nA. √(-3)\nB. √4\nC. ³√8\nD. 2","answer":"答案：B\n解析：\nA. √(-3)不是二次根式，因为被开方数是负数\nB. √4是二次根式，满足√a (a≥0)的形式\nC. ³√8是三次根式，不是二次根式\nD. 2是常数，不是根式"},{"id":"g2_math_001_ex02","knowledge_id":"g2_math_001","question":"填空题：二次根式√(x-2)有意义的条件是______。","answer":"答案：x ≥ 2\n解析：二次根式有意义的条件是被开方数非负，即x-2 ≥ 0，所以x ≥ 2。"},{"id":"g2_math_001_ex03","knowledge_id":"g2_math_001","question":"选择题：若√(a+3)是二次根式，则a的取值范围是（  ）\nA. a > 3\nB. a ≥ -3\nC. a > -3\nD. a ≥ 3","answer":"答案：B\n解析：二次根式√(a+3)有意义，则a+3 ≥ 0，即a ≥ -3。"},{"id":"g2_math_001_ex04","knowledge_id":"g2_math_001","question":"判断题：√(-a)一定不是二次根式。","answer":"答案：错误\n解析：当a ≤ 0时，-a ≥ 0，此时√(-a)是二次根式。例如a=-4时，√(-(-4))=√4是二次根式。"},{"id":"g2_math_001_ex05","knowledge_id":"g2_math_001","question":"解答题：求二次根式√(x²+1)有意义的条件，并说明理由。","answer":"答案：x为任意实数\n解析：因为x² ≥ 0，所以x²+1 ≥ 1 > 0，无论x取什么实数，被开方数都是正数，所以x为任意实数。"},{"id":"g2_math_001_ex06","knowledge_id":"g2_math_001","question":"选择题：若√(4-x) + √(x-4)有意义，则x的值是（  ）\nA. 任意实数\nB. x = 4\nC. x > 4\nD. x < 4","answer":"答案：B\n解析：要使√(4-x)有意义，需要4-x ≥ 0，即x ≤ 4；\n要使√(x-4)有意义，需要x-4 ≥ 0，即x ≥ 4；\n所以x = 4。"},{"id":"g2_math_001_ex07","knowledge_id":"g2_math_001","question":"填空题：当x=______时，二次根式√(x-1)的值为0。","answer":"答案：1\n解析：√(x-1)=0，则x-1=0，所以x=1。"},{"id":"g2_math_001_ex08","knowledge_id":"g2_math_001","question":"判断题：二次根式的值一定是非负数。","answer":"答案：正确\n解析：算术平方根的结果是非负数，所以√a ≥ 0（a≥0）。"},{"id":"g2_math_001_ex09","knowledge_id":"g2_math_001","question":"解答题：若二次根式√(a²-9)有意义，求a的取值范围。","answer":"答案：a ≤ -3 或 a ≥ 3\n解析：a²-9 ≥ 0，即a² ≥ 9，所以|a| ≥ 3，即a ≤ -3或a ≥ 3。"},{"id":"g2_math_001_ex10","knowledge_id":"g2_math_001","question":"选择题：下列二次根式中，被开方数是完全平方数的是（  ）\nA. √2\nB. √8\nC. √16\nD. √12","answer":"答案：C\n解析：16是4的平方，是完全平方数，√16=4。"},{"id":"g2_math_002_ex01","knowledge_id":"g2_math_002","question":"选择题：(√5)²的值是（  ）\nA. 5\nB. -5\nC. 25\nD. √5","answer":"答案：A\n解析：根据性质(√a)² = a（a≥0），所以(√5)² = 5。"},{"id":"g2_math_002_ex02","knowledge_id":"g2_math_002","question":"填空题：√(7²) = ______，√((-7)²) = ______。","answer":"答案：7，7\n解析：√(a²) = |a|，所以√(7²) = |7| = 7，√((-7)²) = |-7| = 7。"},{"id":"g2_math_002_ex03","knowledge_id":"g2_math_002","question":"选择题：化简√(x²)的结果是（  ）\nA. x\nB. -x\nC. |x|\nD. x²","answer":"答案：C\n解析：√(a²) = |a|，所以√(x²) = |x|，需要考虑x的正负性。"},{"id":"g2_math_002_ex04","knowledge_id":"g2_math_002","question":"判断题：(√a)² = √(a²)对所有实数a都成立。","answer":"答案：错误\n解析：(√a)²要求a≥0才有意义；√(a²)对所有实数a都有意义。当a<0时，(√a)²无意义，而√(a²)=|a|=-a。"},{"id":"g2_math_002_ex05","knowledge_id":"g2_math_002","question":"解答题：化简√((x-3)²)，并说明化简结果与x取值的关系。","answer":"答案：当x≥3时，√((x-3)²)=x-3；当x<3时，√((x-3)²)=3-x\n解析：√((x-3)²)=|x-3|，根据绝对值的性质进行分段讨论。"},{"id":"g2_math_002_ex06","knowledge_id":"g2_math_002","question":"选择题：若(√(x-2))² = 2-x，则x的取值范围是（  ）\nA. x ≥ 2\nB. x ≤ 2\nC. x = 2\nD. x < 2","answer":"答案：B\n解析：左边(√(x-2))²=x-2（要求x≥2），右边=2-x。\n所以x-2=2-x，解得x=2。但考虑原式有意义的条件，x≤2。\n综合得x=2。"},{"id":"g2_math_002_ex07","knowledge_id":"g2_math_002","question":"填空题：若a < 0，则√(a²) = ______。","answer":"答案：-a\n解析：√(a²)=|a|，当a<0时，|a|=-a。"},{"id":"g2_math_002_ex08","knowledge_id":"g2_math_002","question":"判断题：√((-3)²) = -3。","answer":"答案：错误\n解析：√((-3)²)=√9=3，或者用性质√(a²)=|a|，即|-3|=3。"},{"id":"g2_math_002_ex09","knowledge_id":"g2_math_002","question":"解答题：已知x < 0，化简(√(-x))² + √(x²)。","answer":"答案：0\n解析：(√(-x))²=-x（因为x<0，所以-x>0）\n√(x²)=|x|=-x（因为x<0）\n所以原式=-x + (-x) = -2x？不对，重新计算：\n(√(-x))² = -x\n√(x²) = |x| = -x（因为x<0）\n原式 = -x + (-x) = -2x。\n等等，题目说x<0，比如x=-2，则(-x)=2>0\n(√2)²=2\n√((-2)²)=√4=2\n原式=2+2=4=-2×(-2)\n所以答案应该是-2x。"},{"id":"g2_math_002_ex10","knowledge_id":"g2_math_002","question":"选择题：若√((a-1)²) = 1-a，则a的取值范围是（  ）\nA. a > 1\nB. a ≥ 1\nC. a < 1\nD. a ≤ 1","answer":"答案：D\n解析：√((a-1)²)=|a-1|=1-a=-(a-1)，说明a-1≤0，即a≤1。"},{"id":"g2_math_003_ex01","knowledge_id":"g2_math_003","question":"选择题：计算 √2 × √8 的结果是（  ）\nA. 4\nB. √10\nC. 16\nD. 2√10","answer":"答案：A\n解析：根据二次根式乘法法则 √a · √b = √(ab)（a≥0, b≥0），√2 × √8 = √(2×8) = √16 = 4。"},{"id":"g2_math_003_ex02","knowledge_id":"g2_math_003","question":"选择题：计算 √27 ÷ √3 的结果是（  ）\nA. 3\nB. 9\nC. √24\nD. 3√3","answer":"答案：A\n解析：根据二次根式除法法则 √a / √b = √(a/b)（a≥0, b>0），√27 ÷ √3 = √(27/3) = √9 = 3。"},{"id":"g2_math_003_ex03","knowledge_id":"g2_math_003","question":"判断题：√a · √b = √(ab) 对任意实数a、b都成立。（  ）","answer":"答案：错误\n解析：二次根式乘法公式 √a · √b = √(ab) 的成立条件是 a≥0 且 b≥0，并非对任意实数都成立。"},{"id":"g2_math_003_ex04","knowledge_id":"g2_math_003","question":"填空题：计算 √12 × √3 = ______。","answer":"答案：6\n解析：√12 × √3 = √(12×3) = √36 = 6。"},{"id":"g2_math_003_ex05","knowledge_id":"g2_math_003","question":"选择题：下列计算正确的是（  ）\nA. √3 × √2 = √5\nB. √3 × √2 = 6\nC. √12 ÷ √3 = 2\nD. √8 ÷ √2 = 4","answer":"答案：C\n解析：选项A错误，√3 × √2 = √6 ≠ √5；选项B错误，√3 × √2 = √6 ≠ 6；选项C正确，√12 ÷ √3 = √(12/3) = √4 = 2；选项D错误，√8 ÷ √2 = √(8/2) = √4 = 2 ≠ 4。"},{"id":"g2_math_003_ex06","knowledge_id":"g2_math_003","question":"填空题：计算 √48 ÷ √6 = ______。","answer":"答案：2√2\n解析：√48 ÷ √6 = √(48/6) = √8 = 2√2。"},{"id":"g2_math_003_ex07","knowledge_id":"g2_math_003","question":"判断题：√18 ÷ √2 = 3。（  ）","answer":"答案：正确\n解析：√18 ÷ √2 = √(18/2) = √9 = 3，计算正确。"},{"id":"g2_math_003_ex08","knowledge_id":"g2_math_003","question":"解答题：已知一个长方形的长为 √18 cm，宽为 √8 cm，求这个长方形的面积。","answer":"答案：12 cm²\n解析：长方形面积 = 长 × 宽 = √18 × √8 = √(18×8) = √144 = 12（cm²）。所以这个长方形的面积是12平方厘米。"},{"id":"g2_math_003_ex09","knowledge_id":"g2_math_003","question":"选择题：若 √x · √(x-2) = √[x(x-2)] 成立，则x的取值范围是（  ）\nA. x ≥ 0\nB. x ≥ 2\nC. 0 ≤ x ≤ 2\nD. x 为任意实数","answer":"答案：B\n解析：根据二次根式乘法法则的条件，需要 x ≥ 0 且 x-2 ≥ 0，即 x ≥ 2。"},{"id":"g2_math_003_ex10","knowledge_id":"g2_math_003","question":"解答题：已知三角形的面积为 √24 cm²，底边长为 √3 cm，求这条底边上的高。","answer":"答案：4√2 cm\n解析：三角形面积公式 S = (1/2) × 底 × 高，所以高 = 2S ÷ 底 = 2√24 ÷ √3 = 2√(24/3) = 2√8 = 2×2√2 = 4√2（cm）。所以这条底边上的高为 4√2 厘米。"},{"id":"g2_math_004_ex01","knowledge_id":"g2_math_004","question":"选择题：下列二次根式中，属于最简二次根式的是（  ）\nA. √8\nB. √12\nC. √5\nD. √(1/2)","answer":"答案：C\n解析：最简二次根式需要满足两个条件：（1）被开方数不含分母；（2）被开方数中不含能开得尽方的因数或因式。√8 = 2√2，√12 = 2√3，√(1/2) = √2/2，都不是最简的；只有√5满足两个条件，是最简二次根式。"},{"id":"g2_math_004_ex02","knowledge_id":"g2_math_004","question":"填空题：将 √18 化为最简二次根式的结果是 ______。","answer":"答案：3√2\n解析：√18 = √(9×2) = √9 × √2 = 3√2。"},{"id":"g2_math_004_ex03","knowledge_id":"g2_math_004","question":"判断题：√24 是最简二次根式。（  ）","answer":"答案：错误\n解析：√24 = √(4×6) = 2√6，被开方数24中含有能开得尽方的因数4，所以√24不是最简二次根式。"},{"id":"g2_math_004_ex04","knowledge_id":"g2_math_004","question":"选择题：下列各式化简后，结果为 3√2 的是（  ）\nA. √6\nB. √12\nC. √18\nD. √24","answer":"答案：C\n解析：√18 = √(9×2) = 3√2，故选C。√6已是最简，√12 = 2√3，√24 = 2√6。"},{"id":"g2_math_004_ex05","knowledge_id":"g2_math_004","question":"填空题：将 √(4/9) 化为最简二次根式的结果是 ______。","answer":"答案：2/3\n解析：√(4/9) = √4 / √9 = 2/3。"},{"id":"g2_math_004_ex06","knowledge_id":"g2_math_004","question":"选择题：下列说法正确的是（  ）\nA. 被开方数中含有字母的二次根式一定不是最简二次根式\nB. 最简二次根式的被开方数一定是整数\nC. √(a²+b²) 是最简二次根式\nD. √0.5 是最简二次根式","answer":"答案：C\n解析：选项A错误，只要被开方数不含能开尽方的因式即可；选项B错误，被开方数可以是多项式等，只要不含分母和能开尽方的因数或因式即可；选项C正确，a²+b²不能再开方，也不含分母，是最简二次根式；选项D错误，√0.5被开方数是小数（含有分母），不是最简二次根式。"},{"id":"g2_math_004_ex07","knowledge_id":"g2_math_004","question":"判断题：最简二次根式的被开方数一定不含分母。（  ）","answer":"答案：正确\n解析：最简二次根式的定义要求被开方数不含分母，这是最简二次根式的两个必要条件之一。"},{"id":"g2_math_004_ex08","knowledge_id":"g2_math_004","question":"解答题：将下列各式化为最简二次根式：\n（1）√45\n（2）√(16/25)\n（3）√200","answer":"答案：（1）3√5；（2）4/5；（3）10√2\n解析：\n（1）√45 = √(9×5) = √9 × √5 = 3√5\n（2）√(16/25) = √16 / √25 = 4/5\n（3）√200 = √(100×2) = √100 × √2 = 10√2"},{"id":"g2_math_004_ex09","knowledge_id":"g2_math_004","question":"选择题：在 √15、√(1/3)、√8、√(a²b) 中，最简二次根式有（  ）个。\nA. 1个\nB. 2个\nC. 3个\nD. 4个","answer":"答案：A\n解析：√15是最简二次根式；√(1/3)被开方数含分母，不是；√8 = 2√2，不是；√(a²b) = |a|√b，不是。所以只有1个最简二次根式。"},{"id":"g2_math_004_ex10","knowledge_id":"g2_math_004","question":"解答题：已知一个正方形的面积为 72 平方厘米，求这个正方形的边长（结果化为最简二次根式）。","answer":"答案：6√2 厘米\n解析：设正方形边长为x cm，则 x² = 72，所以 x = √72 = √(36×2) = 6√2（cm）。所以这个正方形的边长为 6√2 厘米。"},{"id":"g2_math_005_ex01","knowledge_id":"g2_math_005","question":"选择题：计算 √8 + √2 的结果是（  ）\nA. √10\nB. 3√2\nC. 2+√2\nD. 2√2","answer":"答案：B\n解析：先化简，√8 = 2√2，所以 √8 + √2 = 2√2 + √2 = 3√2。二次根式加减法的关键是先化为最简二次根式，再合并同类二次根式。"},{"id":"g2_math_005_ex02","knowledge_id":"g2_math_005","question":"填空题：计算 √18 - √8 = ______。","answer":"答案：√2\n解析：√18 = 3√2，√8 = 2√2，所以 √18 - √8 = 3√2 - 2√2 = √2。"},{"id":"g2_math_005_ex03","knowledge_id":"g2_math_005","question":"判断题：√3 + √2 = √5。（  ）","answer":"答案：错误\n解析：√3与√2不是同类二次根式，不能直接合并相加。√3 + √2 就是最简结果，不等于√5。"},{"id":"g2_math_005_ex04","knowledge_id":"g2_math_005","question":"选择题：下列计算正确的是（  ）\nA. √2 + √3 = √5\nB. 2√3 - √3 = 2\nC. √12 - √3 = √3\nD. √9 + √4 = 5","answer":"答案：C\n解析：选项A错误，√2与√3不是同类二次根式，不能合并；选项B错误，2√3 - √3 = √3 ≠ 2；选项C正确，√12 - √3 = 2√3 - √3 = √3；选项D错误，√9 + √4 = 3 + 2 = 5，虽然结果正确，但√9和√4不是二次根式的加减运算的典型题型。"},{"id":"g2_math_005_ex05","knowledge_id":"g2_math_005","question":"填空题：计算 √27 + √12 - √3 = ______。","answer":"答案：4√3\n解析：√27 = 3√3，√12 = 2√3，所以 √27 + √12 - √3 = 3√3 + 2√3 - √3 = 4√3。"},{"id":"g2_math_005_ex06","knowledge_id":"g2_math_005","question":"选择题：下列二次根式中，与 √3 是同类二次根式的是（  ）\nA. √6\nB. √9\nC. √12\nD. √18","answer":"答案：C\n解析：同类二次根式是指化为最简二次根式后，被开方数相同的二次根式。√12 = 2√3，被开方数是3，与√3相同，所以是同类二次根式。√6的被开方数是6，√9=3，√18=3√2被开方数是2，都与√3不同。"},{"id":"g2_math_005_ex07","knowledge_id":"g2_math_005","question":"判断题：被开方数不同的二次根式一定不是同类二次根式。（  ）","answer":"答案：错误\n解析：判断同类二次根式需要先化为最简二次根式，再看被开方数是否相同。例如√8和√18，被开方数分别是8和18，但化简后都是√2的倍数，是同类二次根式。"},{"id":"g2_math_005_ex08","knowledge_id":"g2_math_005","question":"解答题：计算：\n（1）√32 + √18 - √50\n（2）(√12 + √27) ÷ √3","answer":"答案：（1）2√2；（2）5\n解析：\n（1）√32 + √18 - √50 = 4√2 + 3√2 - 5√2 = 2√2\n（2）(√12 + √27) ÷ √3 = (2√3 + 3√3) ÷ √3 = 5√3 ÷ √3 = 5"},{"id":"g2_math_005_ex09","knowledge_id":"g2_math_005","question":"填空题：若最简二次根式 √(2a+1) 与 √(3a-1) 是同类二次根式，则 a = ______。","answer":"答案：2\n解析：同类二次根式要求被开方数相同，所以 2a+1 = 3a-1，解得 a = 2。"},{"id":"g2_math_005_ex10","knowledge_id":"g2_math_005","question":"解答题：已知一个三角形的三边长分别为 √20 cm、√45 cm、√80 cm，求这个三角形的周长。","answer":"答案：9√5 cm\n解析：三角形周长 = √20 + √45 + √80 = 2√5 + 3√5 + 4√5 = 9√5（cm）。所以这个三角形的周长为 9√5 厘米。"},{"id":"g2_math_006_ex01","knowledge_id":"g2_math_006","question":"选择题：计算 (√3 + 2)(√3 - 2) 的结果是（  ）\nA. 1\nB. -1\nC. 7\nD. -7","answer":"答案：B\n解析：利用平方差公式 (a+b)(a-b) = a² - b²，(√3 + 2)(√3 - 2) = (√3)² - 2² = 3 - 4 = -1。"},{"id":"g2_math_006_ex02","knowledge_id":"g2_math_006","question":"填空题：计算 (√2 + 1)² = ______。","answer":"答案：3 + 2√2\n解析：利用完全平方公式 (a+b)² = a² + 2ab + b²，(√2 + 1)² = (√2)² + 2×√2×1 + 1² = 2 + 2√2 + 1 = 3 + 2√2。"},{"id":"g2_math_006_ex03","knowledge_id":"g2_math_006","question":"判断题：(√3 + √2)² = 3 + 2 = 5。（  ）","answer":"答案：错误\n解析：(√3 + √2)² = (√3)² + 2×√3×√2 + (√2)² = 3 + 2√6 + 2 = 5 + 2√6，不等于5。注意完全平方公式中间的交叉项不能漏掉。"},{"id":"g2_math_006_ex04","knowledge_id":"g2_math_006","question":"选择题：下列计算正确的是（  ）\nA. (√5 - √3)² = 2\nB. √3 × √6 = 3√2\nC. √2 + √3 = √5\nD. (√3 + 1)(√3 - 1) = 2","answer":"答案：D\n解析：选项A错误，(√5 - √3)² = 5 - 2√15 + 3 = 8 - 2√15 ≠ 2；选项B虽然√3×√6=√18=3√2正确，但D选项更典型地考察混合运算中的乘法公式；选项C错误，√2与√3不能合并；选项D正确，(√3 + 1)(√3 - 1) = 3 - 1 = 2。"},{"id":"g2_math_006_ex05","knowledge_id":"g2_math_006","question":"填空题：计算 √8 + √18 - √(1/2) = ______。","answer":"答案：(9/2)√2\n解析：√8 = 2√2，√18 = 3√2，√(1/2) = √2/2，所以 √8 + √18 - √(1/2) = 2√2 + 3√2 - (√2/2) = 5√2 - (√2/2) = (10√2 - √2)/2 = 9√2/2 = (9/2)√2。"},{"id":"g2_math_006_ex06","knowledge_id":"g2_math_006","question":"选择题：计算 (2√3 - 1)(2√3 + 1) 的结果是（  ）\nA. 11\nB. 13\nC. -11\nD. 4√3","answer":"答案：A\n解析：利用平方差公式，(2√3 - 1)(2√3 + 1) = (2√3)² - 1² = 4×3 - 1 = 12 - 1 = 11。"},{"id":"g2_math_006_ex07","knowledge_id":"g2_math_006","question":"判断题：二次根式的混合运算顺序与整式的混合运算顺序相同。（  ）","answer":"答案：正确\n解析：二次根式的混合运算顺序与整式的混合运算顺序一样，都是先算乘方，再算乘除，最后算加减，有括号的先算括号里面的。整式的乘法公式在二次根式运算中同样适用。"},{"id":"g2_math_006_ex08","knowledge_id":"g2_math_006","question":"解答题：计算：\n（1）(√6 - 2√2) × √3 - 6√(1/2)\n（2）(√3 + √2 - 1)(√3 - √2 + 1)","answer":"答案：（1）-2√6；（2）2√2\n解析：\n（1）(√6 - 2√2) × √3 - 6√(1/2)\n    = √6×√3 - 2√2×√3 - 6×(√2/2)\n    = √18 - 2√6 - 3√2\n    = 3√2 - 2√6 - 3√2\n    = -2√6\n\n（2）(√3 + √2 - 1)(√3 - √2 + 1)\n    = [√3 + (√2 - 1)][√3 - (√2 - 1)]\n    = (√3)² - (√2 - 1)²\n    = 3 - (2 - 2√2 + 1)\n    = 3 - (3 - 2√2)\n    = 3 - 3 + 2√2\n    = 2√2"},{"id":"g2_math_006_ex09","knowledge_id":"g2_math_006","question":"填空题：若 x = √2 + 1，则 x² - 2x + 1 = ______。","answer":"答案：2\n解析：x² - 2x + 1 = (x - 1)²，当 x = √2 + 1 时，x - 1 = √2，所以 (x - 1)² = (√2)² = 2。"},{"id":"g2_math_006_ex10","knowledge_id":"g2_math_006","question":"解答题：已知直角三角形的两条直角边长分别为 (√5 + √3) cm 和 (√5 - √3) cm，求这个直角三角形的面积和斜边的长。","answer":"答案：面积为 1 cm²，斜边长为 4 cm\n解析：\n面积 = (1/2) × (√5 + √3) × (√5 - √3) = (1/2) × [(√5)² - (√3)²] = (1/2) × (5 - 3) = (1/2) × 2 = 1（cm²）\n斜边² = (√5 + √3)² + (√5 - √3)² = (5 + 2√15 + 3) + (5 - 2√15 + 3) = 8 + 8 = 16\n所以斜边 = √16 = 4（cm）"},{"id":"g2_math_007_ex01","knowledge_id":"g2_math_007","question":"选择题：将 1/√3 分母有理化的结果是（  ）\nA. √3/3\nB. 1/3\nC. √3\nD. 3","answer":"答案：A\n解析：分子分母同乘以√3，1/√3 = (1×√3)/(√3×√3) = √3/3。"},{"id":"g2_math_007_ex02","knowledge_id":"g2_math_007","question":"填空题：将 1/(√2 - 1) 分母有理化的结果是 ______。","answer":"答案：√2 + 1\n解析：分子分母同乘以(√2 + 1)，1/(√2 - 1) = (√2 + 1)/[(√2 - 1)(√2 + 1)] = (√2 + 1)/(2 - 1) = √2 + 1。"},{"id":"g2_math_007_ex03","knowledge_id":"g2_math_007","question":"判断题：分母有理化就是把分母中的根号去掉的过程。（  ）","answer":"答案：正确\n解析：分母有理化的定义就是把分母中的根号化去，使分母成为有理数（或有理式）的过程。通常是分子分母同乘以分母的有理化因式。"},{"id":"g2_math_007_ex04","knowledge_id":"g2_math_007","question":"选择题：√3 + √2 的有理化因式是（  ）\nA. √3 + √2\nB. √3 - √2\nC. √6\nD. 5","answer":"答案：B\n解析：两个含有二次根式的代数式相乘，如果积不含有二次根式，那么这两个代数式互为有理化因式。(√3 + √2)(√3 - √2) = 3 - 2 = 1，积不含根号，所以√3 - √2是√3 + √2的有理化因式。"},{"id":"g2_math_007_ex05","knowledge_id":"g2_math_007","question":"填空题：化简 √(1/2) + √8 = ______。","answer":"答案：(5/2)√2\n解析：√(1/2) = √2/2，√8 = 2√2，所以 √(1/2) + √8 = √2/2 + 2√2 = √2/2 + 4√2/2 = 5√2/2 = (5/2)√2。"},{"id":"g2_math_007_ex06","knowledge_id":"g2_math_007","question":"选择题：下列各式分母有理化正确的是（  ）\nA. 2/√8 = 2/2√2 = √2\nB. 1/(1+√2) = √2 - 1\nC. 3/√6 = √2/2\nD. 1/√5 = √5","answer":"答案：B\n解析：选项A错误，2/√8 = 2/(2√2) = 1/√2 = √2/2 ≠ √2；选项B正确，1/(1+√2) = (√2-1)/[(1+√2)(√2-1)] = (√2-1)/(2-1) = √2 - 1；选项C错误，3/√6 = 3√6/6 = √6/2 ≠ √2/2；选项D错误，1/√5 = √5/5 ≠ √5。"},{"id":"g2_math_007_ex07","knowledge_id":"g2_math_007","question":"判断题：a√b 的有理化因式一定是 √b。（  ）","answer":"答案：正确\n解析：a√b × √b = a×b = ab，结果不含根号，所以√b是a√b的一个有理化因式。注意有理化因式不唯一，但√b是最简的一个。"},{"id":"g2_math_007_ex08","knowledge_id":"g2_math_007","question":"解答题：计算（结果分母有理化）：\n（1）√3/(√3 + 1)\n（2）(√5 - √3)/(√5 + √3)","answer":"答案：（1）(3 - √3)/2；（2）4 - √15\n解析：\n（1）√3/(√3 + 1)\n    = √3(√3 - 1)/[(√3 + 1)(√3 - 1)]\n    = (3 - √3)/(3 - 1)\n    = (3 - √3)/2\n\n（2）(√5 - √3)/(√5 + √3)\n    = (√5 - √3)²/[(√5 + √3)(√5 - √3)]\n    = (5 - 2√15 + 3)/(5 - 3)\n    = (8 - 2√15)/2\n    = 4 - √15"},{"id":"g2_math_007_ex09","knowledge_id":"g2_math_007","question":"填空题：若 a = 1/(√5 - 2)，则 a - 1/a = ______。","answer":"答案：4\n解析：先分母有理化，a = 1/(√5 - 2) = (√5 + 2)/[(√5 - 2)(√5 + 2)] = (√5 + 2)/(5 - 4) = √5 + 2。\n1/a = √5 - 2。\n所以 a - 1/a = (√5 + 2) - (√5 - 2) = 4。"},{"id":"g2_math_007_ex10","knowledge_id":"g2_math_007","question":"解答题：已知 x = (√3 - √2)/(√3 + √2)，y = (√3 + √2)/(√3 - √2)，求 x + y 和 xy 的值。","answer":"答案：x + y = 10，xy = 1\n解析：\n先分母有理化：\nx = (√3 - √2)/(√3 + √2) = (√3 - √2)²/[(√3 + √2)(√3 - √2)] = (3 - 2√6 + 2)/(3 - 2) = 5 - 2√6\ny = (√3 + √2)/(√3 - √2) = (√3 + √2)²/[(√3 - √2)(√3 + √2)] = (3 + 2√6 + 2)/(3 - 2) = 5 + 2√6\n\nx + y = (5 - 2√6) + (5 + 2√6) = 10\nxy = (5 - 2√6)(5 + 2√6) = 25 - (2√6)² = 25 - 24 = 1"},{"id":"g2_math_008_ex01","knowledge_id":"g2_math_008","question":"选择题：在直角三角形中，两条直角边分别为3和4，则斜边长为（  ）\nA. 5\nB. 7\nC. 25\nD. √7","answer":"答案：A\n解析：根据勾股定理，斜边²=3²+4²=9+16=25，所以斜边=5。"},{"id":"g2_math_008_ex02","knowledge_id":"g2_math_008","question":"填空题：直角三角形的两条直角边分别为6和8，则斜边长为______。","answer":"答案：10\n解析：斜边²=6²+8²=36+64=100，所以斜边=10。"},{"id":"g2_math_008_ex03","knowledge_id":"g2_math_008","question":"选择题：已知直角三角形的斜边为13，一条直角边为5，则另一条直角边为（  ）\nA. 8\nB. 12\nC. 18\nD. √194","answer":"答案：B\n解析：设另一条直角边为x，则x²+5²=13²，x²=169-25=144，所以x=12。"},{"id":"g2_math_008_ex04","knowledge_id":"g2_math_008","question":"判断题：勾股定理只适用于直角三角形。","answer":"答案：正确\n解析：勾股定理描述的是直角三角形三边之间的关系，a²+b²=c²（c为斜边），不适用于非直角三角形。"},{"id":"g2_math_008_ex05","knowledge_id":"g2_math_008","question":"解答题：一个直角三角形的周长为30cm，斜边长为13cm，求两条直角边的长度。","answer":"答案：5cm和12cm\n解析：设两条直角边分别为a和b，则a+b+13=30，即a+b=17。\n又a²+b²=13²=169。\n由(a+b)²=a²+2ab+b²，得17²=169+2ab，289=169+2ab，2ab=120，ab=60。\n解方程组a+b=17，ab=60，得a=5，b=12或a=12，b=5。"},{"id":"g2_math_008_ex06","knowledge_id":"g2_math_008","question":"选择题：等腰直角三角形的斜边长为10，则直角边长为（  ）\nA. 5\nB. 5√2\nC. 10√2\nD. √50","answer":"答案：B\n解析：设直角边为x，则x²+x²=10²，2x²=100，x²=50，x=√50=5√2。"},{"id":"g2_math_008_ex07","knowledge_id":"g2_math_008","question":"填空题：在直角三角形中，若一个锐角为30°，斜边为10，则较短的直角边为______。","answer":"答案：5\n解析：在含30°角的直角三角形中，30°角所对的直角边等于斜边的一半，所以较短的直角边=10÷2=5。"},{"id":"g2_math_008_ex08","knowledge_id":"g2_math_008","question":"判断题：边长为5, 12, 13的三角形是直角三角形。","answer":"答案：正确\n解析：因为5²+12²=25+144=169=13²，满足勾股定理，所以是直角三角形。"},{"id":"g2_math_008_ex09","knowledge_id":"g2_math_008","question":"解答题：一棵大树在离地面9米处折断，树顶落在离树根12米处，求这棵树原来的高度。","answer":"答案：24米\n解析：折断部分形成直角三角形的斜边，长度=√(9²+12²)=√(81+144)=√225=15米。\n原来的高度=9+15=24米。"},{"id":"g2_math_008_ex10","knowledge_id":"g2_math_008","question":"选择题：下列各组数中，能构成直角三角形三边的是（  ）\nA. 4, 5, 6\nB. 6, 8, 10\nC. 5, 6, 7\nD. 7, 8, 9","answer":"答案：B\n解析：6²+8²=36+64=100=10²，满足勾股定理。"},{"id":"g2_math_009_ex01","knowledge_id":"g2_math_009","question":"选择题：三角形三边长分别为6, 8, 10，则这个三角形是（  ）\nA. 锐角三角形\nB. 直角三角形\nC. 钝角三角形\nD. 无法确定","answer":"答案：B\n解析：因为6²+8²=36+64=100=10²，满足勾股定理的逆定理，所以是直角三角形。"},{"id":"g2_math_009_ex02","knowledge_id":"g2_math_009","question":"填空题：若三角形三边长满足a²+b²=c²，则这个三角形是______三角形。","answer":"答案：直角\n解析：这就是勾股定理的逆定理，c为斜边，对应直角。"},{"id":"g2_math_009_ex03","knowledge_id":"g2_math_009","question":"选择题：下列各组线段中，不能组成直角三角形的是（  ）\nA. 3, 4, 5\nB. 5, 12, 13\nC. 7, 24, 25\nD. 6, 7, 8","answer":"答案：D\n解析：6²+7²=36+49=85≠64=8²，不满足勾股定理的逆定理。"},{"id":"g2_math_009_ex04","knowledge_id":"g2_math_009","question":"判断题：如果三角形三边长a, b, c满足a²+b²≠c²，则这个三角形一定不是直角三角形。","answer":"答案：错误\n解析：可能是a²+c²=b²或b²+c²=a²，只要有两边的平方和等于第三边的平方就是直角三角形。"},{"id":"g2_math_009_ex05","knowledge_id":"g2_math_009","question":"解答题：判断三边长为15, 20, 25的三角形是否为直角三角形，并说明理由。","answer":"答案：是直角三角形\n解析：15²+20²=225+400=625=25²，满足勾股定理的逆定理，所以是直角三角形。"},{"id":"g2_math_009_ex06","knowledge_id":"g2_math_009","question":"选择题：三角形三边长为9, 12, 15，则最长边所对的角是（  ）\nA. 锐角\nB. 直角\nC. 钝角\nD. 无法确定","answer":"答案：B\n解析：9²+12²=81+144=225=15²，所以是直角三角形，最长边对直角。"},{"id":"g2_math_009_ex07","knowledge_id":"g2_math_009","question":"填空题：若三角形三边长为k, k+1, k+2，且是直角三角形，则k=______。","answer":"答案：3\n解析：(k+2)²=k²+(k+1)²，k²+4k+4=k²+k²+2k+1，k²-2k-3=0，(k-3)(k+1)=0，k=3或k=-1（舍去）。"},{"id":"g2_math_009_ex08","knowledge_id":"g2_math_009","question":"判断题：勾股定理的逆定理可以用来判断三角形是否为直角三角形。","answer":"答案：正确\n解析：勾股定理的逆定理就是专门用来判断三角形是否为直角三角形的方法。"},{"id":"g2_math_009_ex09","knowledge_id":"g2_math_009","question":"解答题：已知三角形三边长为a=7, b=24, c=25，求这个三角形的面积。","answer":"答案：84\n解析：因为7²+24²=49+576=625=25²，所以是直角三角形，直角边为7和24。\n面积=7×24÷2=84。"},{"id":"g2_math_009_ex10","knowledge_id":"g2_math_009","question":"选择题：下列说法正确的是（  ）\nA. 勾股定理的逆定理是勾股定理的逆命题\nB. 勾股定理的逆定理与勾股定理没有关系\nC. 只有等边三角形才能用勾股定理\nD. 勾股定理只适用于等腰三角形","answer":"答案：A\n解析：勾股定理的逆定理是勾股定理的逆命题，两者互为逆定理。"},{"id":"g2_math_010_ex01","knowledge_id":"g2_math_010","question":"选择题：一架梯子长13米，斜靠在墙上，梯子底端离墙5米，则梯子顶端离地面（  ）\nA. 8米\nB. 12米\nC. 18米\nD. √194米","answer":"答案：B\n解析：梯子、墙、地面构成直角三角形，梯子为斜边。\n顶端离地面=√(13²-5²)=√(169-25)=√144=12米。"},{"id":"g2_math_010_ex02","knowledge_id":"g2_math_010","question":"填空题：小明从家出发向东走800米，再向北走600米到达学校，则小明家到学校的直线距离是______米。","answer":"答案：1000\n解析：东西和南北方向垂直，构成直角三角形。\n直线距离=√(800²+600²)=√(640000+360000)=√1000000=1000米。"},{"id":"g2_math_010_ex03","knowledge_id":"g2_math_010","question":"选择题：一个长方形的长为12cm，宽为5cm，则对角线长为（  ）\nA. 13cm\nB. 17cm\nC. 7cm\nD. √89cm","answer":"答案：A\n解析：长方形对角线构成直角三角形的斜边，对角线=√(12²+5²)=√(144+25)=√169=13cm。"},{"id":"g2_math_010_ex04","knowledge_id":"g2_math_010","question":"判断题：在解决实际问题时，只要有直角三角形就能用勾股定理。","answer":"答案：正确\n解析：勾股定理的主要应用就是解决直角三角形中的边长计算问题。"},{"id":"g2_math_010_ex05","knowledge_id":"g2_math_010","question":"解答题：一只蚂蚁从长方体的一个顶点出发，沿表面爬到对角的顶点，已知长方体长3cm、宽4cm、高5cm，求最短路径长度。","answer":"答案：√74 cm\n解析：将长方体表面展开，有三种展开方式：\n1. 长×宽面展开：路径=√((3+4)²+5²)=√(49+25)=√74\n2. 长×高面展开：路径=√((3+5)²+4²)=√(64+16)=√80\n3. 宽×高面展开：路径=√((4+5)²+3²)=√(81+9)=√90\n最短路径为√74 cm。"},{"id":"g2_math_010_ex06","knowledge_id":"g2_math_010","question":"选择题：一艘轮船从A港出发，向东北方向航行200海里到达B港，则A港到B港的南北距离和东西距离分别是（  ）\nA. 100海里，100海里\nB. 200海里，200海里\nC. 100√2海里，100√2海里\nD. 200√2海里，200√2海里","answer":"答案：C\n解析：东北方向即与南北、东西方向成45°角，构成等腰直角三角形。\n南北距离=东西距离=200×cos45°=200×(√2/2)=100√2海里。"},{"id":"g2_math_010_ex07","knowledge_id":"g2_math_010","question":"填空题：在平静的湖面上，有一支红莲，高出水面1米，一阵风吹来，红莲被吹到一边，花朵齐及水面，已知红莲移动的水平距离为2米，则水深为______米。","answer":"答案：1.5\n解析：设水深为x米，则红莲总长为x+1米。\n根据勾股定理：x²+2²=(x+1)²，x²+4=x²+2x+1，2x=3，x=1.5米。"},{"id":"g2_math_010_ex08","knowledge_id":"g2_math_010","question":"判断题：立体图形中的最短路径问题，通常需要将立体图形展开成平面图形来解决。","answer":"答案：正确\n解析：将立体图形展开后，最短路径就是平面上两点之间的线段，然后用勾股定理计算。"},{"id":"g2_math_010_ex09","knowledge_id":"g2_math_010","question":"解答题：如图，在高为3米，斜坡长为5米的楼梯表面铺地毯，求地毯的长度。","answer":"答案：7米\n解析：楼梯水平部分总长=√(5²-3²)=√(25-9)=√16=4米\n地毯长度=水平部分+垂直部分=4+3=7米。"},{"id":"g2_math_010_ex10","knowledge_id":"g2_math_010","question":"选择题：在直角三角形中，若两直角边的比为3:4，斜边长为20，则两直角边的长分别为（  ）\nA. 6, 8\nB. 9, 12\nC. 12, 16\nD. 15, 20","answer":"答案：C\n解析：设两直角边分别为3x和4x，则(3x)²+(4x)²=20²，9x²+16x²=400，25x²=400，x²=16，x=4。\n两直角边分别为12和16。"},{"id":"g2_math_011_ex01","knowledge_id":"g2_math_011","question":"选择题：在平行四边形ABCD中，若∠A = 60°，则∠C的度数是（  ）\nA. 30°\nB. 60°\nC. 120°\nD. 150°","answer":"答案：B\n解析：平行四边形的对角相等，所以∠C = ∠A = 60°。"},{"id":"g2_math_011_ex02","knowledge_id":"g2_math_011","question":"填空题：平行四边形ABCD中，AB = 5cm，BC = 3cm，则它的周长为 ______ cm。","answer":"答案：16\n解析：平行四边形对边相等，所以AB = CD = 5cm，BC = AD = 3cm，周长 = 2×(5+3) = 16cm。"},{"id":"g2_math_011_ex03","knowledge_id":"g2_math_011","question":"判断题：平行四边形的对角线互相平分。（  ）","answer":"答案：正确\n解析：平行四边形的对角线互相平分是平行四边形的重要性质之一。"},{"id":"g2_math_011_ex04","knowledge_id":"g2_math_011","question":"选择题：平行四边形ABCD中，对角线AC和BD交于点O，若AC = 8，BD = 6，则AO和BO的长分别是（  ）\nA. 4和3\nB. 8和6\nC. 2和1.5\nD. 16和12","answer":"答案：A\n解析：平行四边形的对角线互相平分，所以AO = AC/2 = 8/2 = 4，BO = BD/2 = 6/2 = 3。"},{"id":"g2_math_011_ex05","knowledge_id":"g2_math_011","question":"填空题：在平行四边形ABCD中，∠A + ∠C = 140°，则∠B = ______ 度。","answer":"答案：110\n解析：平行四边形对角相等，所以∠A = ∠C = 140°÷2 = 70°。又因为平行四边形相邻内角互补，所以∠B = 180° - ∠A = 180° - 70° = 110°。"},{"id":"g2_math_011_ex06","knowledge_id":"g2_math_011","question":"选择题：下列条件中，不能判定四边形ABCD是平行四边形的是（  ）\nA. AB ∥ CD，AD ∥ BC\nB. AB = CD，AD = BC\nC. AB ∥ CD，AD = BC\nD. AB ∥ CD，AB = CD","answer":"答案：C\n解析：选项A由两组对边分别平行可判定是平行四边形；选项B由两组对边分别相等可判定是平行四边形；选项C不能判定，可能是等腰梯形；选项D由一组对边平行且相等可判定是平行四边形。"},{"id":"g2_math_011_ex07","knowledge_id":"g2_math_011","question":"判断题：平行四边形的四条边都相等。（  ）","answer":"答案：错误\n解析：平行四边形的对边相等，但四条边不一定都相等。四条边都相等的四边形是菱形（特殊的平行四边形）。"},{"id":"g2_math_011_ex08","knowledge_id":"g2_math_011","question":"解答题：如图，在平行四边形ABCD中，DE⊥AB于E，DF⊥BC于F。若AB = 6，BC = 4，DE = 3，求DF的长。","answer":"答案：DF = 4.5\n解析：平行四边形的面积 = 底 × 高。\n以AB为底，DE为高，面积 = AB × DE = 6 × 3 = 18。\n以BC为底，DF为高，面积 = BC × DF = 4 × DF。\n所以 4DF = 18，DF = 18/4 = 4.5。"},{"id":"g2_math_011_ex09","knowledge_id":"g2_math_011","question":"填空题：在平行四边形ABCD中，对角线AC、BD相交于点O，若△AOB的面积为5，则平行四边形ABCD的面积为 ______。","answer":"答案：20\n解析：平行四边形的对角线把平行四边形分成四个面积相等的三角形，所以平行四边形的面积 = 4 × 5 = 20。"},{"id":"g2_math_011_ex10","knowledge_id":"g2_math_011","question":"解答题：已知：如图，在四边形ABCD中，AB ∥ CD，对角线AC、BD相交于点O，且AO = CO。\n求证：四边形ABCD是平行四边形。","answer":"答案：证明见解析\n解析：证明：\n∵ AB ∥ CD（已知）\n∴ ∠OAB = ∠OCD（两直线平行，内错角相等）\n在△AOB和△COD中：\n∠OAB = ∠OCD（已证）\nAO = CO（已知）\n∠AOB = ∠COD（对顶角相等）\n∴ △AOB ≌ △COD（ASA）\n∴ AB = CD（全等三角形对应边相等）\n又∵ AB ∥ CD（已知）\n∴ 四边形ABCD是平行四边形（一组对边平行且相等的四边形是平行四边形）"},{"id":"g2_math_012_ex01","knowledge_id":"g2_math_012","question":"选择题：矩形具有而一般平行四边形不具有的性质是（  ）\nA. 对边相等\nB. 对角相等\nC. 对角线相等\nD. 对角线互相平分","answer":"答案：C\n解析：矩形是特殊的平行四边形，具有平行四边形的所有性质。除此之外，矩形的对角线相等，四个角都是直角，这是一般平行四边形不具有的性质。"},{"id":"g2_math_012_ex02","knowledge_id":"g2_math_012","question":"填空题：矩形ABCD中，AB = 3，BC = 4，则对角线AC的长为 ______。","answer":"答案：5\n解析：矩形的四个角都是直角，所以△ABC是直角三角形。由勾股定理，AC = √(AB² + BC²) = √(3² + 4²) = √(9+16) = √25 = 5。"},{"id":"g2_math_012_ex03","knowledge_id":"g2_math_012","question":"判断题：有一个角是直角的平行四边形是矩形。（  ）","answer":"答案：正确\n解析：这是矩形的定义，也是矩形最基本的判定方法。"},{"id":"g2_math_012_ex04","knowledge_id":"g2_math_012","question":"选择题：下列条件中，不能判定一个四边形是矩形的是（  ）\nA. 三个角都是直角的四边形\nB. 对角线相等的平行四边形\nC. 对角线互相平分且相等的四边形\nD. 一组对边平行且有一个角是直角的四边形","answer":"答案：D\n解析：选项A，三个角是直角的四边形是矩形，正确；选项B，对角线相等的平行四边形是矩形，正确；选项C，对角线互相平分说明是平行四边形，再加相等就是矩形，正确；选项D，一组对边平行且有一个角是直角，可能是直角梯形，不一定是矩形。"},{"id":"g2_math_012_ex05","knowledge_id":"g2_math_012","question":"填空题：矩形的两条对角线的夹角为60°，较短的边长为6cm，则对角线长为 ______ cm。","answer":"答案：12\n解析：矩形对角线相等且互相平分，所以两条对角线的一半与较短边构成等边三角形（因为夹角60°，且两边相等）。所以对角线的一半 = 6cm，对角线长 = 12cm。"},{"id":"g2_math_012_ex06","knowledge_id":"g2_math_012","question":"选择题：矩形ABCD中，对角线AC、BD交于点O，若∠AOB = 100°，则∠OAD的度数是（  ）\nA. 40°\nB. 50°\nC. 60°\nD. 25°","answer":"答案：B\n解析：矩形对角线相等且互相平分，所以OA = OD，∠OAD = ∠ODA。\n又∠AOB = 100°，所以∠AOD = 180° - 100° = 80°。\n在△AOD中，∠OAD = (180° - ∠AOD) ÷ 2 = (180° - 80°) ÷ 2 = 50°。"},{"id":"g2_math_012_ex07","knowledge_id":"g2_math_012","question":"判断题：矩形的对角线互相垂直。（  ）","answer":"答案：错误\n解析：矩形的对角线相等且互相平分，但不一定互相垂直。对角线互相垂直的矩形是正方形（特殊的矩形）。"},{"id":"g2_math_012_ex08","knowledge_id":"g2_math_012","question":"解答题：如图，在矩形ABCD中，E是BC的中点，连接AE、DE。求证：AE = DE。","answer":"答案：证明见解析\n解析：证明：\n∵ 四边形ABCD是矩形（已知）\n∴ AB = DC，∠B = ∠C = 90°（矩形的对边相等，四个角都是直角）\n∵ E是BC的中点（已知）\n∴ BE = CE\n在△ABE和△DCE中：\nAB = DC（已证）\n∠B = ∠C（已证）\nBE = CE（已证）\n∴ △ABE ≌ △DCE（SAS）\n∴ AE = DE（全等三角形对应边相等）"},{"id":"g2_math_012_ex09","knowledge_id":"g2_math_012","question":"填空题：已知矩形的周长为20cm，长比宽多2cm，则矩形的面积为 ______ cm²。","answer":"答案：24\n解析：设宽为x cm，则长为(x+2) cm。\n周长 = 2×(长+宽) = 2×(x+2+x) = 2×(2x+2) = 4x+4 = 20\n解得 4x = 16，x = 4。\n所以宽 = 4cm，长 = 6cm，面积 = 4×6 = 24 cm²。"},{"id":"g2_math_012_ex10","knowledge_id":"g2_math_012","question":"解答题：已知：如图，平行四边形ABCD中，AC、BD相交于点O，且AC = BD。\n求证：四边形ABCD是矩形。","answer":"答案：证明见解析\n解析：证明：\n∵ 四边形ABCD是平行四边形（已知）\n∴ OA = OC，OB = OD（平行四边形对角线互相平分）\n∵ AC = BD（已知）\n∴ OA = OB = OC = OD\n在△ABC中，\n∵ OA = OC = OB\n∴ ∠OAB = ∠OBA，∠OBC = ∠OCB\n又∵ ∠ABC + ∠BAD = 180°（平行四边形邻角互补）\n且 OA = OB = OC = OD，可证 ∠ABC = 90°（由三角形内角和可推得）\n或者：\n∵ 四边形ABCD是平行四边形，且AC = BD\n∴ 平行四边形ABCD是矩形（对角线相等的平行四边形是矩形）"},{"id":"g2_math_013_ex01","knowledge_id":"g2_math_013","question":"选择题：菱形具有而一般平行四边形不具有的性质是（  ）\nA. 对边平行\nB. 对角相等\nC. 对角线互相垂直\nD. 对角线互相平分","answer":"答案：C\n解析：菱形是特殊的平行四边形，具有平行四边形的所有性质。除此之外，菱形的四条边都相等，对角线互相垂直，这是一般平行四边形不具有的性质。"},{"id":"g2_math_013_ex02","knowledge_id":"g2_math_013","question":"填空题：菱形的两条对角线长分别为6和8，则菱形的边长为 ______。","answer":"答案：5\n解析：菱形的对角线互相垂直平分，所以两条对角线的一半分别为3和4，它们与菱形的一边构成直角三角形。由勾股定理，边长 = √(3² + 4²) = √(9+16) = √25 = 5。"},{"id":"g2_math_013_ex03","knowledge_id":"g2_math_013","question":"判断题：四条边都相等的四边形是菱形。（  ）","answer":"答案：正确\n解析：这是菱形的一个判定定理。四条边都相等的四边形是菱形。"},{"id":"g2_math_013_ex04","knowledge_id":"g2_math_013","question":"选择题：下列条件中，能判定一个四边形是菱形的是（  ）\nA. 对角线互相平分的四边形\nB. 对角线相等的平行四边形\nC. 对角线互相垂直的四边形\nD. 一组邻边相等的平行四边形","answer":"答案：D\n解析：选项A，对角线互相平分只能判定是平行四边形，不一定是菱形；选项B，对角线相等的平行四边形是矩形，不是菱形；选项C，对角线互相垂直的四边形不一定是平行四边形，更不一定是菱形；选项D，一组邻边相等的平行四边形是菱形，这是菱形的定义。"},{"id":"g2_math_013_ex05","knowledge_id":"g2_math_013","question":"填空题：菱形的边长为5，一条对角线长为6，则另一条对角线长为 ______。","answer":"答案：8\n解析：菱形对角线互相垂直平分，已知一条对角线长为6，则它的一半是3。设另一条对角线的一半为x，由勾股定理：3² + x² = 5²，9 + x² = 25，x² = 16，x = 4。所以另一条对角线长 = 2×4 = 8。"},{"id":"g2_math_013_ex06","knowledge_id":"g2_math_013","question":"选择题：菱形ABCD中，对角线AC、BD交于点O，若AC = 8，BD = 6，则菱形的面积是（  ）\nA. 48\nB. 24\nC. 12\nD. 20","answer":"答案：B\n解析：菱形的面积等于两条对角线乘积的一半。面积 = (1/2) × AC × BD = (1/2) × 8 × 6 = 24。"},{"id":"g2_math_013_ex07","knowledge_id":"g2_math_013","question":"判断题：菱形的对角线相等。（  ）","answer":"答案：错误\n解析：菱形的对角线互相垂直平分，但不一定相等。对角线相等的菱形是正方形（特殊的菱形）。"},{"id":"g2_math_013_ex08","knowledge_id":"g2_math_013","question":"解答题：如图，菱形ABCD中，E、F分别是BC、CD的中点。\n求证：AE = AF。","answer":"答案：证明见解析\n解析：证明：\n∵ 四边形ABCD是菱形（已知）\n∴ AB = AD = BC = CD，∠B = ∠D（菱形的四条边相等，对角相等）\n∵ E、F分别是BC、CD的中点（已知）\n∴ BE = (1/2)BC，DF = (1/2)CD\n又∵ BC = CD（菱形四边相等）\n∴ BE = DF\n在△ABE和△ADF中：\nAB = AD（已证）\n∠B = ∠D（已证）\nBE = DF（已证）\n∴ △ABE ≌ △ADF（SAS）\n∴ AE = AF（全等三角形对应边相等）"},{"id":"g2_math_013_ex09","knowledge_id":"g2_math_013","question":"填空题：菱形的周长为20cm，一个内角为60°，则菱形的面积为 ______ cm²。","answer":"答案：(25/2)√3 或 12.5√3\n解析：菱形周长为20cm，所以边长 = 20÷4 = 5cm。\n一个内角为60°，则菱形由两个边长为5的等边三角形拼成。\n一个等边三角形的面积 = (√3/4) × 5² = (25√3)/4。\n菱形面积 = 2 × (25√3)/4 = (25√3)/2 = 12.5√3 (cm²)。"},{"id":"g2_math_013_ex10","knowledge_id":"g2_math_013","question":"解答题：已知：如图，平行四边形ABCD中，AC⊥BD于点O。\n求证：四边形ABCD是菱形。","answer":"答案：证明见解析\n解析：证明：\n∵ 四边形ABCD是平行四边形（已知）\n∴ OA = OC（平行四边形对角线互相平分）\n∵ AC ⊥ BD（已知）\n∴ ∠AOB = ∠COB = 90°\n在△AOB和△COB中：\nOA = OC（已证）\n∠AOB = ∠COB（已证）\nOB = OB（公共边）\n∴ △AOB ≌ △COB（SAS）\n∴ AB = CB（全等三角形对应边相等）\n又∵ 四边形ABCD是平行四边形（已知）\n∴ 平行四边形ABCD是菱形（一组邻边相等的平行四边形是菱形）\n\n或者直接用定理：对角线互相垂直的平行四边形是菱形。"},{"id":"g2_math_014_ex01","knowledge_id":"g2_math_014","question":"选择题：正方形具有而矩形不一定具有的性质是（  ）\nA. 四个角都是直角\nB. 对角线相等\nC. 对角线互相垂直\nD. 对角线互相平分","answer":"答案：C\n解析：正方形是特殊的矩形，具有矩形的所有性质。但正方形的对角线互相垂直，而一般矩形的对角线不一定互相垂直。四个角都是直角、对角线相等、对角线互相平分是矩形和正方形共有的性质。"},{"id":"g2_math_014_ex02","knowledge_id":"g2_math_014","question":"填空题：正方形的边长为4，则它的对角线长为 ______。","answer":"答案：4√2\n解析：正方形的对角线长 = 边长 × √2。所以对角线长 = 4√2。也可以用勾股定理：对角线 = √(4² + 4²) = √32 = 4√2。"},{"id":"g2_math_014_ex03","knowledge_id":"g2_math_014","question":"判断题：有一组邻边相等的矩形是正方形。（  ）","answer":"答案：正确\n解析：这是正方形的一个判定定理。有一组邻边相等的矩形是正方形。"},{"id":"g2_math_014_ex04","knowledge_id":"g2_math_014","question":"选择题：下列说法错误的是（  ）\nA. 正方形的四条边都相等\nB. 正方形的四个角都是直角\nC. 正方形的对角线相等但不垂直\nD. 正方形的对角线互相垂直平分且相等","answer":"答案：C\n解析：正方形的对角线不仅相等，而且互相垂直平分。所以选项C说对角线相等但不垂直是错误的。其他选项都是正方形的正确性质。"},{"id":"g2_math_014_ex05","knowledge_id":"g2_math_014","question":"填空题：正方形的对角线长为6，则它的边长为 ______。","answer":"答案：3√2\n解析：正方形的对角线长 = 边长 × √2，所以边长 = 对角线 ÷ √2 = 6/√2 = 3√2。"},{"id":"g2_math_014_ex06","knowledge_id":"g2_math_014","question":"选择题：在四边形ABCD中，O是对角线的交点，能判定这个四边形是正方形的条件是（  ）\nA. AC = BD，AB ∥ CD，AB = CD\nB. AD ∥ BC，∠A = ∠C\nC. AO = BO = CO = DO，AC ⊥ BD\nD. AO = CO，BO = DO，AB = BC","answer":"答案：C\n解析：选项A只能判定是矩形；选项B只能判定是平行四边形；选项C中，AO=BO=CO=DO说明对角线相等且互相平分，是矩形，再加AC⊥BD就是菱形，既是矩形又是菱形就是正方形；选项D只能判定是菱形。"},{"id":"g2_math_014_ex07","knowledge_id":"g2_math_014","question":"判断题：正方形既是矩形又是菱形。（  ）","answer":"答案：正确\n解析：正方形具有矩形的所有性质（四个角都是直角，对角线相等），也具有菱形的所有性质（四条边都相等，对角线互相垂直），所以正方形既是矩形又是菱形。"},{"id":"g2_math_014_ex08","knowledge_id":"g2_math_014","question":"解答题：如图，正方形ABCD中，E是BC上一点，F是CD上一点，且BE = CF。\n求证：AE = BF，且AE ⊥ BF。","answer":"答案：证明见解析\n解析：证明：设AE与BF交于点G。\n∵ 四边形ABCD是正方形（已知）\n∴ AB = BC，∠ABC = ∠C = 90°（正方形四边相等，四个角都是直角）\n在△ABE和△BCF中：\nAB = BC（已证）\n∠ABE = ∠C（已证）\nBE = CF（已知）\n∴ △ABE ≌ △BCF（SAS）\n∴ AE = BF（全等三角形对应边相等），∠BAE = ∠CBF（全等三角形对应角相等）\n∵ ∠BAE + ∠AEB = 90°（直角三角形两锐角互余）\n∴ ∠CBF + ∠AEB = 90°（等量代换）\n∴ ∠BGE = 90°（三角形内角和）\n∴ AE ⊥ BF"},{"id":"g2_math_014_ex09","knowledge_id":"g2_math_014","question":"填空题：正方形的面积为8，则它的对角线长为 ______。","answer":"答案：4\n解析：正方形的面积 = 边长² = 8，所以边长 = √8 = 2√2。\n对角线长 = 边长 × √2 = 2√2 × √2 = 4。\n也可以用正方形面积 = 对角线²/2，所以对角线² = 2×8 = 16，对角线 = 4。"},{"id":"g2_math_014_ex10","knowledge_id":"g2_math_014","question":"解答题：已知：如图，矩形ABCD中，∠ABC的平分线交AD于点E，EF⊥BC于点F。\n求证：四边形ABFE是正方形。","answer":"答案：证明见解析\n解析：证明：\n∵ 四边形ABCD是矩形（已知）\n∴ ∠A = ∠ABC = 90°（矩形四个角都是直角）\n∵ EF ⊥ BC（已知）\n∴ ∠EFB = 90°\n∴ 四边形ABFE有三个角是直角\n∴ 四边形ABFE是矩形（三个角是直角的四边形是矩形）\n∵ BE平分∠ABC（已知）\n∴ ∠ABE = 45°\n在Rt△ABE中，∠ABE = 45°，∠A = 90°\n∴ ∠AEB = 45°\n∴ AB = AE（等角对等边）\n∴ 矩形ABFE是正方形（一组邻边相等的矩形是正方形）"},{"id":"g2_math_015_ex01","knowledge_id":"g2_math_015","question":"选择题：三角形的中位线______于第三边，且等于第三边的______。（  ）\nA. 平行，一半\nB. 垂直，一半\nC. 平行，两倍\nD. 垂直，两倍","answer":"答案：A\n解析：三角形中位线定理：三角形的中位线平行于第三边，且等于第三边的一半。"},{"id":"g2_math_015_ex02","knowledge_id":"g2_math_015","question":"填空题：在△ABC中，D、E分别是AB、AC的中点，若BC = 8，则DE = ______。","answer":"答案：4\n解析：DE是△ABC的中位线，根据三角形中位线定理，DE = BC/2 = 8/2 = 4。"},{"id":"g2_math_015_ex03","knowledge_id":"g2_math_015","question":"判断题：三角形的中位线就是三角形的中线。（  ）","answer":"答案：错误\n解析：三角形的中位线是连接三角形两边中点的线段，而三角形的中线是连接顶点和对边中点的线段，两者是不同的概念。"},{"id":"g2_math_015_ex04","knowledge_id":"g2_math_015","question":"选择题：在△ABC中，D、E、F分别是AB、BC、CA的中点，若△ABC的周长为20，则△DEF的周长是（  ）\nA. 5\nB. 10\nC. 15\nD. 20","answer":"答案：B\n解析：根据三角形中位线定理，DE = AC/2，EF = AB/2，FD = BC/2。\n所以△DEF的周长 = DE + EF + FD = (AC + AB + BC)/2 = △ABC的周长/2 = 20/2 = 10。"},{"id":"g2_math_015_ex05","knowledge_id":"g2_math_015","question":"填空题：在△ABC中，D、E分别是AB、AC的中点，若DE = 5，∠B = 50°，则BC = ______，∠ADE = ______度。","answer":"答案：10，50\n解析：由中位线定理，BC = 2DE = 2×5 = 10。\n又因为DE ∥ BC，所以∠ADE = ∠B = 50°（两直线平行，同位角相等）。"},{"id":"g2_math_015_ex06","knowledge_id":"g2_math_015","question":"选择题：如图，在四边形ABCD中，E、F、G、H分别是AB、BC、CD、DA的中点，则四边形EFGH是（  ）\nA. 矩形\nB. 菱形\nC. 平行四边形\nD. 正方形","answer":"答案：C\n解析：连接AC，在△ABC中，E、F分别是AB、BC的中点，所以EF ∥ AC且EF = AC/2。\n同理，在△ADC中，GH ∥ AC且GH = AC/2。\n所以EF ∥ GH且EF = GH，故四边形EFGH是平行四边形。\n这是一个经典结论：任意四边形各边中点连线构成的四边形是平行四边形（称为中点四边形）。"},{"id":"g2_math_015_ex07","knowledge_id":"g2_math_015","question":"判断题：三角形有三条中位线。（  ）","answer":"答案：正确\n解析：三角形有三条边，每条边对应一条中位线，所以三角形有三条中位线，它们构成了三角形的中点三角形。"},{"id":"g2_math_015_ex08","knowledge_id":"g2_math_015","question":"解答题：已知：如图，D、E分别是△ABC的边AB、AC的中点，点F在DE的延长线上，且EF = DE。\n求证：（1）BD = FC；（2）AB ∥ CF。","answer":"答案：证明见解析\n解析：证明：\n（1）∵ D、E分别是AB、AC的中点（已知）\n    ∴ AE = CE\n    在△ADE和△CFE中：\n    AE = CE（已证）\n    ∠AED = ∠CEF（对顶角相等）\n    DE = FE（已知）\n    ∴ △ADE ≌ △CFE（SAS）\n    ∴ AD = CF（全等三角形对应边相等）\n    又∵ D是AB中点（已知）\n    ∴ AD = BD\n    ∴ BD = FC（等量代换）\n\n（2）由（1）知△ADE ≌ △CFE\n    ∴ ∠A = ∠ECF（全等三角形对应角相等）\n    ∴ AB ∥ CF（内错角相等，两直线平行）"},{"id":"g2_math_015_ex09","knowledge_id":"g2_math_015","question":"填空题：在△ABC中，D是AB的中点，DE ∥ BC交AC于E，若AC = 10，则AE = ______。","answer":"答案：5\n解析：因为D是AB中点，DE ∥ BC，根据平行线分线段成比例（或三角形中位线定理的逆用），E是AC的中点，所以AE = AC/2 = 10/2 = 5。"},{"id":"g2_math_015_ex10","knowledge_id":"g2_math_015","question":"解答题：求证：顺次连接矩形各边中点所得的四边形是菱形。","answer":"答案：证明见解析\n解析：已知：矩形ABCD中，E、F、G、H分别是AB、BC、CD、DA的中点。\n求证：四边形EFGH是菱形。\n\n证明：\n连接AC、BD。\n∵ 四边形ABCD是矩形（已知）\n∴ AC = BD（矩形对角线相等）\n∵ E、F分别是AB、BC的中点（已知）\n∴ EF = AC/2（三角形中位线定理）\n同理：FG = BD/2，GH = AC/2，HE = BD/2\n∴ EF = FG = GH = HE\n∴ 四边形EFGH是菱形（四条边都相等的四边形是菱形）"},{"id":"g2_math_016_ex01","knowledge_id":"g2_math_016","question":"选择题：在圆的周长公式 C = 2πr 中，变量是（  ）\nA. C、2π、r\nB. C、r\nC. 2π\nD. π、r","answer":"答案：B\n解析：在一个变化过程中，数值发生变化的量称为变量。在 C = 2πr 中，C和r的数值可以变化，是变量；2和π是固定不变的，是常量。"},{"id":"g2_math_016_ex02","knowledge_id":"g2_math_016","question":"填空题：函数 y = √(x-2) 中，自变量x的取值范围是 ______。","answer":"答案：x ≥ 2\n解析：二次根式的被开方数必须非负，所以 x - 2 ≥ 0，即 x ≥ 2。"},{"id":"g2_math_016_ex03","knowledge_id":"g2_math_016","question":"判断题：在一个变化过程中，只有一个变量。（  ）","answer":"答案：错误\n解析：在一个变化过程中，可以有多个变量。例如在路程公式 s = vt 中，s、v、t都可以是变量。"},{"id":"g2_math_016_ex04","knowledge_id":"g2_math_016","question":"选择题：下列关系式中，y不是x的函数的是（  ）\nA. y = 2x\nB. y = x²\nC. y = |x|\nD. y² = x","answer":"答案：D\n解析：函数的定义是：对于x的每一个确定的值，y都有唯一确定的值与之对应。选项D中，当x=4时，y=2或y=-2，有两个值对应，不满足唯一性，所以y不是x的函数。"},{"id":"g2_math_016_ex05","knowledge_id":"g2_math_016","question":"填空题：已知函数 y = 2x - 1，当 x = 3 时，y = ______。","answer":"答案：5\n解析：把 x = 3 代入 y = 2x - 1，得 y = 2×3 - 1 = 6 - 1 = 5。"},{"id":"g2_math_016_ex06","knowledge_id":"g2_math_016","question":"选择题：函数 y = 1/(x+1) 中，自变量x的取值范围是（  ）\nA. x ≠ 0\nB. x ≠ 1\nC. x ≠ -1\nD. x 为任意实数","answer":"答案：C\n解析：分式的分母不能为零，所以 x + 1 ≠ 0，即 x ≠ -1。"},{"id":"g2_math_016_ex07","knowledge_id":"g2_math_016","question":"判断题：对于函数 y = x²，当 x = 2 时，y = ±2。（  ）","answer":"答案：错误\n解析：对于函数 y = x²，当 x = 2 时，y = 2² = 4，只有一个确定的值4，不是±2。"},{"id":"g2_math_016_ex08","knowledge_id":"g2_math_016","question":"解答题：某商店购进某种商品的单价为8元，销售价为10元/件，每天可卖出100件。若每件售价每提高1元，每天销售量就减少10件。设每件售价为x元（x≥10），每天的利润为y元。\n（1）求y与x的函数关系式；\n（2）当x=12时，求y的值。","answer":"答案：（1）y = -10x² + 280x - 1600；（2）320\n解析：\n（1）每件利润 = (x - 8) 元\n    每天销售量 = 100 - 10(x - 10) = 100 - 10x + 100 = 200 - 10x 件\n    利润 y = (x - 8)(200 - 10x) = 200x - 10x² - 1600 + 80x = -10x² + 280x - 1600\n\n（2）当x=12时，\n    y = -10×12² + 280×12 - 1600 = -10×144 + 3360 - 1600 = -1440 + 3360 - 1600 = 320（元）"},{"id":"g2_math_016_ex09","knowledge_id":"g2_math_016","question":"填空题：函数 y = √x + 1/(x-2) 中，自变量x的取值范围是 ______。","answer":"答案：x ≥ 0 且 x ≠ 2\n解析：需要同时满足两个条件：二次根式的被开方数非负，即 x ≥ 0；分式的分母不为零，即 x - 2 ≠ 0，x ≠ 2。所以x的取值范围是 x ≥ 0 且 x ≠ 2。"},{"id":"g2_math_016_ex10","knowledge_id":"g2_math_016","question":"解答题：已知等腰三角形的周长为20cm，设底边长为y cm，腰长为x cm。\n（1）求y与x的函数关系式；\n（2）求自变量x的取值范围。","answer":"答案：（1）y = 20 - 2x；（2）5 < x < 10\n解析：\n（1）等腰三角形周长 = 2×腰长 + 底边长，即 20 = 2x + y，所以 y = 20 - 2x。\n\n（2）根据三角形三边关系：\n    ① 两腰之和 > 底边长：2x > y，即 2x > 20 - 2x，4x > 20，x > 5\n    ② 底边长 > 0：y > 0，即 20 - 2x > 0，x < 10\n    所以自变量x的取值范围是 5 < x < 10。"},{"id":"g2_math_017_ex01","knowledge_id":"g2_math_017","question":"选择题：下列函数中，是正比例函数的是（  ）\nA. y = 2x\nB. y = x + 2\nC. y = x²\nD. y = 2/x","answer":"答案：A\n解析：正比例函数的一般形式是 y = kx（k为常数，k ≠ 0）。选项A符合 y = 2x，是正比例函数；选项B是一次函数但不是正比例函数；选项C是二次函数；选项D是反比例函数。"},{"id":"g2_math_017_ex02","knowledge_id":"g2_math_017","question":"填空题：正比例函数 y = -3x 的图象经过第 ______ 象限。","answer":"答案：二、四\n解析：正比例函数 y = kx，当 k > 0 时，图象经过一、三象限；当 k < 0 时，图象经过二、四象限。这里 k = -3 < 0，所以图象经过二、四象限。"},{"id":"g2_math_017_ex03","knowledge_id":"g2_math_017","question":"判断题：正比例函数的图象一定经过原点。（  ）","answer":"答案：正确\n解析：正比例函数 y = kx，当 x = 0 时，y = 0，所以图象一定经过原点 (0, 0)。"},{"id":"g2_math_017_ex04","knowledge_id":"g2_math_017","question":"选择题：已知正比例函数 y = kx 的图象经过点 (2, 6)，则k的值为（  ）\nA. 2\nB. 3\nC. 1/3\nD. -3","answer":"答案：B\n解析：把点 (2, 6) 代入 y = kx，得 6 = 2k，解得 k = 3。"},{"id":"g2_math_017_ex05","knowledge_id":"g2_math_017","question":"填空题：正比例函数 y = (m-1)x 中，y随x的增大而减小，则m的取值范围是 ______。","answer":"答案：m < 1\n解析：正比例函数 y = kx，当 k < 0 时，y随x的增大而减小。所以 m - 1 < 0，即 m < 1。"},{"id":"g2_math_017_ex06","knowledge_id":"g2_math_017","question":"选择题：若正比例函数 y = kx（k ≠ 0）的图象经过点 (-1, 2)，则下列点也在该函数图象上的是（  ）\nA. (1, 2)\nB. (-2, 1)\nC. (2, -4)\nD. (2, -1)","answer":"答案：C\n解析：把 (-1, 2) 代入 y = kx，得 2 = -k，所以 k = -2，函数解析式为 y = -2x。\n验证各选项：A. x=1时，y=-2≠2；B. x=-2时，y=4≠1；C. x=2时，y=-4，正确；D. x=2时，y=-4≠-1。"},{"id":"g2_math_017_ex07","knowledge_id":"g2_math_017","question":"判断题：y = 2x 和 y = -2x 的图象关于x轴对称。（  ）","answer":"答案：正确\n解析：对于相同的x值，y = 2x 和 y = -2x 的函数值互为相反数，所以它们的图象关于x轴对称。"},{"id":"g2_math_017_ex08","knowledge_id":"g2_math_017","question":"解答题：已知y与x成正比例，且当x = 3时，y = 12。\n（1）求y与x的函数关系式；\n（2）当y = 20时，求x的值；\n（3）画出这个函数的图象。","answer":"答案：（1）y = 4x；（2）x = 5；（3）过原点和(1,4)的直线\n解析：\n（1）∵ y与x成正比例\n    ∴ 设 y = kx（k ≠ 0）\n    把 x = 3，y = 12 代入，得 12 = 3k\n    解得 k = 4\n    ∴ y与x的函数关系式为 y = 4x。\n\n（2）当 y = 20 时，20 = 4x，解得 x = 5。\n\n（3）函数 y = 4x 的图象是经过原点 (0, 0) 和点 (1, 4) 的一条直线。"},{"id":"g2_math_017_ex09","knowledge_id":"g2_math_017","question":"填空题：已知正比例函数 y = kx 的图象在一、三象限，则k ______ 0（填 > 或 < ）。","answer":"答案：>\n解析：正比例函数 y = kx，当 k > 0 时，图象经过一、三象限，y随x的增大而增大。"},{"id":"g2_math_017_ex10","knowledge_id":"g2_math_017","question":"解答题：某工厂生产某种零件，已知每个工人每天生产的零件数与工作天数成正比例。如果一个工人3天生产了120个零件。\n（1）求这个工人每天生产零件数y（个）与工作天数x（天）的函数关系式；\n（2）按这个速度，这个工人工作10天能生产多少个零件？","answer":"答案：（1）y = 40x；（2）400个\n解析：\n（1）∵ y与x成正比例\n    ∴ 设 y = kx（k ≠ 0）\n    把 x = 3，y = 120 代入，得 120 = 3k\n    解得 k = 40\n    ∴ 函数关系式为 y = 40x。\n\n（2）当 x = 10 时，y = 40×10 = 400（个）\n    所以这个工人工作10天能生产400个零件。"},{"id":"g2_math_018_ex01","knowledge_id":"g2_math_018","question":"选择题：下列函数中，是一次函数但不是正比例函数的是（  ）\nA. y = 3x\nB. y = 2x + 1\nC. y = x²\nD. y = 1/x","answer":"答案：B\n解析：一次函数的一般形式是 y = kx + b（k、b为常数，k ≠ 0）。当 b = 0 时，就是正比例函数。选项A是正比例函数也是一次函数；选项B是一次函数但不是正比例函数（b=1≠0）；选项C是二次函数；选项D是反比例函数。"},{"id":"g2_math_018_ex02","knowledge_id":"g2_math_018","question":"填空题：一次函数 y = 2x - 3 中，k = ______，b = ______。","answer":"答案：2，-3\n解析：一次函数 y = kx + b 中，k是斜率（比例系数），b是截距。y = 2x - 3 可以写成 y = 2x + (-3)，所以 k = 2，b = -3。"},{"id":"g2_math_018_ex03","knowledge_id":"g2_math_018","question":"判断题：一次函数的图象是一条直线。（  ）","answer":"答案：正确\n解析：一次函数 y = kx + b（k ≠ 0）的图象是一条直线，这条直线经过点 (0, b)，且斜率为k。"},{"id":"g2_math_018_ex04","knowledge_id":"g2_math_018","question":"选择题：一次函数 y = -2x + 3 的图象与y轴的交点坐标是（  ）\nA. (0, 3)\nB. (3, 0)\nC. (0, -2)\nD. (-2, 0)","answer":"答案：A\n解析：一次函数 y = kx + b 与y轴的交点坐标是 (0, b)。在 y = -2x + 3 中，b = 3，所以与y轴交点为 (0, 3)。"},{"id":"g2_math_018_ex05","knowledge_id":"g2_math_018","question":"填空题：一次函数 y = x - 2 与x轴的交点坐标是 ______。","answer":"答案：(2, 0)\n解析：与x轴交点处 y = 0，令 y = 0，则 0 = x - 2，解得 x = 2。所以交点坐标是 (2, 0)。"},{"id":"g2_math_018_ex06","knowledge_id":"g2_math_018","question":"选择题：若函数 y = (m-2)x + 3 是一次函数，则m的取值范围是（  ）\nA. m = 2\nB. m ≠ 2\nC. m ≠ 0\nD. m 为任意实数","answer":"答案：B\n解析：一次函数要求一次项系数不为零，即 m - 2 ≠ 0，所以 m ≠ 2。"},{"id":"g2_math_018_ex07","knowledge_id":"g2_math_018","question":"判断题：正比例函数是特殊的一次函数。（  ）","answer":"答案：正确\n解析：当一次函数 y = kx + b 中 b = 0 时，就变成了 y = kx，这就是正比例函数。所以正比例函数是 b = 0 的特殊一次函数。"},{"id":"g2_math_018_ex08","knowledge_id":"g2_math_018","question":"解答题：已知一次函数的图象经过点 A(0, 2) 和点 B(1, 5)。\n（1）求这个一次函数的解析式；\n（2）若点 C(2, a) 在这个函数图象上，求a的值。","answer":"答案：（1）y = 3x + 2；（2）a = 8\n解析：\n（1）设一次函数解析式为 y = kx + b（k ≠ 0）。\n    ∵ 图象经过点 A(0, 2)，代入得 2 = 0 + b，∴ b = 2。\n    ∵ 图象经过点 B(1, 5)，代入得 5 = k + 2，∴ k = 3。\n    ∴ 这个一次函数的解析式为 y = 3x + 2。\n\n（2）∵ 点 C(2, a) 在函数图象上\n    ∴ 把 x = 2 代入 y = 3x + 2，得 a = 3×2 + 2 = 8。"},{"id":"g2_math_018_ex09","knowledge_id":"g2_math_018","question":"填空题：已知一次函数 y = 2x + b 的图象经过点 (1, 5)，则 b = ______。","answer":"答案：3\n解析：把点 (1, 5) 代入 y = 2x + b，得 5 = 2×1 + b，即 5 = 2 + b，解得 b = 3。"},{"id":"g2_math_018_ex10","knowledge_id":"g2_math_018","question":"解答题：某移动公司的手机通话费标准为：月租费20元，每分钟通话费0.2元。设每月通话时间为x分钟，每月总费用为y元。\n（1）求y与x的函数关系式；\n（2）若某月通话时间为100分钟，该月的费用是多少元？\n（3）若某月的费用为60元，该月通话多少分钟？","answer":"答案：（1）y = 0.2x + 20；（2）40元；（3）200分钟\n解析：\n（1）每月总费用 = 月租费 + 通话费，所以 y = 0.2x + 20（x ≥ 0）。\n\n（2）当 x = 100 时，y = 0.2×100 + 20 = 20 + 20 = 40（元）。\n\n（3）当 y = 60 时，60 = 0.2x + 20，\n    0.2x = 40，\n    x = 200（分钟）。"},{"id":"g2_math_019_ex01","knowledge_id":"g2_math_019","question":"选择题：一次函数 y = 2x - 1 的图象不经过（  ）\nA. 第一象限\nB. 第二象限\nC. 第三象限\nD. 第四象限","answer":"答案：B\n解析：一次函数 y = kx + b 中，k=2>0，图象从左下到右上；b=-1<0，图象与y轴交于负半轴。所以图象经过一、三、四象限，不经过第二象限。"},{"id":"g2_math_019_ex02","knowledge_id":"g2_math_019","question":"填空题：一次函数 y = -x + 3 中，y随x的增大而 ______。（填增大或减小）","answer":"答案：减小\n解析：一次函数 y = kx + b，当 k > 0 时，y随x的增大而增大；当 k < 0 时，y随x的增大而减小。这里 k = -1 < 0，所以y随x的增大而减小。"},{"id":"g2_math_019_ex03","knowledge_id":"g2_math_019","question":"判断题：若一次函数 y = kx + b 的图象经过一、二、三象限，则 k > 0，b > 0。（  ）","answer":"答案：正确\n解析：一次函数图象经过一、二、三象限，说明图象从左下到右上（k>0），且与y轴交于正半轴（b>0）。"},{"id":"g2_math_019_ex04","knowledge_id":"g2_math_019","question":"选择题：下列一次函数中，y随x的增大而减小的是（  ）\nA. y = 3x\nB. y = x - 2\nC. y = -x + 1\nD. y = 2x + 3","answer":"答案：C\n解析：一次函数 y = kx + b，当 k < 0 时，y随x的增大而减小。选项C中 k = -1 < 0，所以y随x的增大而减小。"},{"id":"g2_math_019_ex05","knowledge_id":"g2_math_019","question":"填空题：一次函数 y = 2x + 4 与x轴的交点坐标是 ______，与y轴的交点坐标是 ______。","answer":"答案：(-2, 0)，(0, 4)\n解析：与x轴交点：令 y = 0，则 0 = 2x + 4，解得 x = -2，所以交点为 (-2, 0)。\n与y轴交点：令 x = 0，则 y = 4，所以交点为 (0, 4)。"},{"id":"g2_math_019_ex06","knowledge_id":"g2_math_019","question":"选择题：直线 y = 2x + 3 与直线 y = 2x - 1 的位置关系是（  ）\nA. 相交\nB. 平行\nC. 重合\nD. 垂直","answer":"答案：B\n解析：两条直线的斜率k相同（都是2），截距b不同（3和-1），所以这两条直线平行。"},{"id":"g2_math_019_ex07","knowledge_id":"g2_math_019","question":"判断题：一次函数 y = kx + b 的图象与x轴交点的横坐标就是方程 kx + b = 0 的解。（  ）","answer":"答案：正确\n解析：一次函数 y = kx + b 的图象与x轴交点处 y = 0，即 kx + b = 0，所以交点的横坐标就是方程 kx + b = 0 的解。"},{"id":"g2_math_019_ex08","knowledge_id":"g2_math_019","question":"解答题：已知一次函数 y = (2m + 1)x + m - 3。\n（1）若函数图象经过原点，求m的值；\n（2）若函数图象与y轴交于点 (0, -2)，求m的值；\n（3）若y随x的增大而减小，求m的取值范围。","answer":"答案：（1）m = 3；（2）m = 1；（3）m < -1/2\n解析：\n（1）图象经过原点 (0, 0)，代入得 0 = (2m+1)×0 + m - 3，即 0 = m - 3，m = 3。\n\n（2）图象与y轴交于 (0, -2)，即当x=0时，y = -2，代入得 -2 = m - 3，解得 m = 1。\n\n（3）y随x的增大而减小，说明斜率 k < 0，即 2m + 1 < 0，解得 2m < -1，m < -1/2。"},{"id":"g2_math_019_ex09","knowledge_id":"g2_math_019","question":"填空题：把直线 y = -2x 向上平移3个单位，得到的直线解析式是 ______。","answer":"答案：y = -2x + 3\n解析：直线上下平移时，斜率k不变，截距b变化。向上平移3个单位，b增加3，所以新解析式为 y = -2x + 3。"},{"id":"g2_math_019_ex10","knowledge_id":"g2_math_019","question":"解答题：已知一次函数的图象经过点 (2, 5)，且 y 随 x 的增大而减小，写出满足条件的一个一次函数解析式，并说明理由。","answer":"答案：y = -x + 7（答案不唯一）\n解析：设一次函数解析式为 y = kx + b。\n因为 y 随 x 的增大而减小，所以 k < 0，可取 k = -1。\n把点 (2, 5) 代入 y = -x + b，得 5 = -2 + b，解得 b = 7。\n所以满足条件的一个解析式为 y = -x + 7。\n（只要满足 k < 0 且过点 (2, 5) 即可，答案不唯一。）"},{"id":"g2_math_020_ex01","knowledge_id":"g2_math_020","question":"选择题：以二元一次方程 2x + y = 5 的解为坐标的点都在一次函数（  ）的图象上。\nA. y = 2x + 5\nB. y = -2x + 5\nC. y = 2x - 5\nD. y = -2x - 5","answer":"答案：B\n解析：把二元一次方程 2x + y = 5 变形为用x表示y的形式：y = -2x + 5，这就是一次函数的形式。所以以方程 2x + y = 5 的解为坐标的点都在一次函数 y = -2x + 5 的图象上。"},{"id":"g2_math_020_ex02","knowledge_id":"g2_math_020","question":"填空题：一次函数 y = x + 1 的图象上的任意一点的坐标都是二元一次方程 ______ 的解。","answer":"答案：x - y + 1 = 0（或 y - x = 1，答案不唯一）\n解析：一次函数 y = x + 1 移项得 x - y + 1 = 0，这是一个二元一次方程。一次函数图象上任意一点的坐标都满足这个方程，所以都是它的解。"},{"id":"g2_math_020_ex03","knowledge_id":"g2_math_020","question":"判断题：两个一次函数图象的交点坐标就是对应的二元一次方程组的解。（  ）","answer":"答案：正确\n解析：两个一次函数图象的交点坐标同时满足两个函数解析式，也就是同时满足对应的两个二元一次方程，所以就是对应的二元一次方程组的解。"},{"id":"g2_math_020_ex04","knowledge_id":"g2_math_020","question":"选择题：一次函数 y = 2x - 1 与 y = -x + 5 的图象交点坐标是（  ）\nA. (1, 1)\nB. (2, 3)\nC. (3, 2)\nB. (1, 3)","answer":"答案：B\n解析：求两个一次函数图象的交点坐标，就是解方程组：\n{ y = 2x - 1\n{ y = -x + 5\n令 2x - 1 = -x + 5，得 3x = 6，x = 2。\n把 x = 2 代入 y = 2x - 1，得 y = 4 - 1 = 3。\n所以交点坐标是 (2, 3)。"},{"id":"g2_math_020_ex05","knowledge_id":"g2_math_020","question":"填空题：若二元一次方程组 { x + y = 3, { x - y = 1 的解是 { x = 2, { y = 1，则一次函数 y = -x + 3 与 y = x - 1 的图象交点坐标是 ______。","answer":"答案：(2, 1)\n解析：二元一次方程组的解就是对应的两个一次函数图象的交点坐标。方程组的解是 x=2, y=1，所以交点坐标是 (2, 1)。"},{"id":"g2_math_020_ex06","knowledge_id":"g2_math_020","question":"选择题：若一次函数 y = x + a 与 y = -x + b 的图象交于点 (m, 4)，则 a + b 的值为（  ）\nA. 2\nB. 4\nC. 6\nD. 8","answer":"答案：D\n解析：因为点 (m, 4) 在两个函数图象上，所以：\n4 = m + a  ①\n4 = -m + b ②\n① + ② 得：8 = a + b\n所以 a + b = 8。"},{"id":"g2_math_020_ex07","knowledge_id":"g2_math_020","question":"判断题：如果二元一次方程组无解，那么对应的两个一次函数的图象平行。（  ）","answer":"答案：正确\n解析：二元一次方程组无解，说明两个方程没有公共解，对应的两个一次函数图象没有交点，所以两条直线平行（斜率相同，截距不同）。"},{"id":"g2_math_020_ex08","knowledge_id":"g2_math_020","question":"解答题：用图象法解方程组 { 2x + y = 4, { 2x - y = 0。","answer":"答案：{ x = 1, { y = 2\n解析：先把两个方程化为一次函数形式：\n2x + y = 4 → y = -2x + 4\n2x - y = 0 → y = 2x\n\n在同一坐标系中画出两个函数的图象，它们的交点坐标就是方程组的解。\n令 -2x + 4 = 2x，得 4x = 4，x = 1。\n把 x = 1 代入 y = 2x，得 y = 2。\n所以方程组的解为 { x = 1, { y = 2。"},{"id":"g2_math_020_ex09","knowledge_id":"g2_math_020","question":"填空题：若一次函数 y = 2x + 3 与 y = 3x - 2 的图象交于点 P，则点 P 的坐标为 ______。","answer":"答案：(5, 13)\n解析：求交点坐标，令 2x + 3 = 3x - 2，解得 x = 5。\n把 x = 5 代入 y = 2x + 3，得 y = 10 + 3 = 13。\n所以点 P 的坐标为 (5, 13)。"},{"id":"g2_math_020_ex10","knowledge_id":"g2_math_020","question":"解答题：某校八年级举行数学竞赛，设一、二等奖。已知购买3本一等奖奖品和2本二等奖奖品共需120元；购买5本一等奖奖品和4本二等奖奖品共需210元。\n（1）求一、二等奖奖品的单价各是多少元？\n（2）若设一等奖奖品单价为x元，二等奖奖品单价为y元，你能画出对应的一次函数图象，并用图象法验证你的答案吗？","answer":"答案：（1）一等奖30元，二等奖15元；（2）交点(30, 15)\n解析：\n（1）设一等奖奖品单价为x元，二等奖奖品单价为y元。\n    根据题意列方程组：\n    { 3x + 2y = 120  ①\n    { 5x + 4y = 210  ②\n    ①×2 - ② 得：6x + 4y - 5x - 4y = 240 - 210\n    x = 30\n    把 x = 30 代入 ①：90 + 2y = 120，2y = 30，y = 15。\n    所以一等奖奖品单价30元，二等奖奖品单价15元。\n\n（2）将方程化为一次函数形式：\n    3x + 2y = 120 → y = -1.5x + 60\n    5x + 4y = 210 → y = -1.25x + 52.5\n    两个函数图象的交点坐标为 (30, 15)，与计算结果一致。"},{"id":"g2_math_021_ex01","knowledge_id":"g2_math_021","question":"选择题：方程 2x + 6 = 0 的解，就是一次函数 y = 2x + 6 的图象与（  ）\nA. x轴交点的横坐标\nB. y轴交点的横坐标\nC. x轴交点的纵坐标\nD. y轴交点的纵坐标","answer":"答案：A\n解析：方程 2x + 6 = 0 的解就是使 y = 2x + 6 中 y = 0 时的x值，也就是一次函数图象与x轴交点的横坐标。"},{"id":"g2_math_021_ex02","knowledge_id":"g2_math_021","question":"填空题：不等式 2x - 4 > 0 的解集是 ______，它可以看作一次函数 y = 2x - 4 当 y ______ 0 时的自变量x的取值范围。","answer":"答案：x > 2，>\n解析：解不等式 2x - 4 > 0，得 2x > 4，x > 2。\n从函数角度看，y = 2x - 4 > 0 就是函数值大于0时x的取值范围，即图象在x轴上方时对应的x的范围。"},{"id":"g2_math_021_ex03","knowledge_id":"g2_math_021","question":"判断题：不等式 kx + b > 0 的解集就是一次函数 y = kx + b 的图象在x轴上方部分对应的x的取值范围。（  ）","answer":"答案：正确\n解析：kx + b > 0 就是 y > 0，对应函数图象在x轴上方的部分，这部分图象所对应的x值的范围就是不等式的解集。"},{"id":"g2_math_021_ex04","knowledge_id":"g2_math_021","question":"选择题：若一次函数 y = -x + 2 的值大于0，则x的取值范围是（  ）\nA. x > 2\nB. x < 2\nC. x > -2\nD. x < -2","answer":"答案：B\n解析：由题意得 -x + 2 > 0，解得 -x > -2，即 x < 2。\n也可以从图象角度理解：y = -x + 2 与x轴交于 (2, 0)，k<0图象从左上到右下，当 y > 0 时，图象在x轴上方，对应 x < 2。"},{"id":"g2_math_021_ex05","knowledge_id":"g2_math_021","question":"填空题：已知一次函数 y = kx + b 的图象与x轴交于点 (-3, 0)，则方程 kx + b = 0 的解是 ______。","answer":"答案：x = -3\n解析：一次函数 y = kx + b 的图象与x轴交点的横坐标就是方程 kx + b = 0 的解。交点为 (-3, 0)，所以方程的解是 x = -3。"},{"id":"g2_math_021_ex06","knowledge_id":"g2_math_021","question":"选择题：如图，直线 y = kx + b 经过点 A(-1, 0) 和 B(2, 3)，则不等式 kx + b > 0 的解集是（  ）\nA. x > -1\nB. x < -1\nC. x > 2\nD. x < 2","answer":"答案：A\n解析：直线 y = kx + b 与x轴交于点 A(-1, 0)，且经过点 B(2, 3)，说明k > 0，图象从左下到右上。当 y > 0 时，图象在x轴上方，对应 x > -1。"},{"id":"g2_math_021_ex07","knowledge_id":"g2_math_021","question":"判断题：不等式 k1x + b1 > k2x + b2 的解集，就是使一次函数 y = k1x + b1 的值大于 y = k2x + b2 的值时x的取值范围。（  ）","answer":"答案：正确\n解析：不等式 k1x + b1 > k2x + b2 的几何意义就是：在同一坐标系中，一次函数 y = k1x + b1 的图象在 y = k2x + b2 的图象上方时对应的x的取值范围。"},{"id":"g2_math_021_ex08","knowledge_id":"g2_math_021","question":"解答题：用函数图象法解方程组 { x + y = 3, { x - y = 1，并用图象说明不等式 x + y > 3 的解集。","answer":"答案：方程组的解为 x = 2, y = 1；不等式 x + y > 3 的几何意义是直线 x + y = 3 右上方的区域\n解析：\n（1）将方程组变形为两个一次函数：\n    x + y = 3 即 y = -x + 3\n    x - y = 1 即 y = x - 1\n    在同一坐标系中画出这两条直线，它们的交点坐标为 (2, 1)。\n    所以方程组的解为 x = 2, y = 1。\n    验证：将 x=2, y=1 代入原方程组：\n    2 + 1 = 3 ✓\n    2 - 1 = 1 ✓\n\n（2）不等式 x + y > 3 即 y > -x + 3。\n    从函数图象角度看，它表示直线 y = -x + 3 上方的区域。\n    由于 x + y > 3 是二元不等式，其解集是一个平面区域（直线右上方），不能简单地只用x的范围表示。\n    如果结合方程组的交点来看：在交点右侧（x > 2），直线 y = x - 1 在直线 y = -x + 3 的上方。"},{"id":"g2_math_021_ex09","knowledge_id":"g2_math_021","question":"填空题：已知直线 y1 = 2x + 1 和 y2 = -x + 4，当 y1 > y2 时，x的取值范围是 ______。","answer":"答案：x > 1\n解析：令 2x + 1 > -x + 4，得 3x > 3，x > 1。\n所以当 x > 1 时，y1 > y2。"},{"id":"g2_math_021_ex10","knowledge_id":"g2_math_021","question":"解答题：某学校计划组织师生去春游，现有甲、乙两家旅行社，其定价相同。甲旅行社表示：教师全价，学生半价；乙旅行社表示：全部师生按八折优惠。已知全价为200元/人，设学生人数为x人，教师有5人。\n（1）分别写出甲、乙两家旅行社的收费y（元）与学生人数x的函数关系式；\n（2）当学生人数为多少时，两家旅行社的收费相同？\n（3）就学生人数x讨论，哪家旅行社更优惠？","answer":"答案：（1）y甲 = 100x + 1000，y乙 = 160x + 800；（2）x≈3.33；（3）当学生数>10/3时甲优惠，<10/3时乙优惠\n解析：\n（1）甲旅行社：教师5人全价，学生x人半价。\n    y甲 = 5×200 + x×100 = 1000 + 100x = 100x + 1000\n    乙旅行社：师生共 (x+5) 人，全部八折。\n    y乙 = (x+5)×200×0.8 = (x+5)×160 = 160x + 800\n\n（2）令 y甲 = y乙，即 100x + 1000 = 160x + 800\n    60x = 200\n    x = 200/60 = 10/3 ≈ 3.33\n    所以当学生人数为 10/3（约3.33）人时，两家收费相同。\n\n（3）当 100x + 1000 < 160x + 800 时，即 x > 10/3 时，甲旅行社更优惠；\n    当 100x + 1000 > 160x + 800 时，即 x < 10/3 时，乙旅行社更优惠。\n    （因为人数为整数，所以当学生数≥4时甲优惠，≤3时乙优惠。）"},{"id":"g2_math_022_ex01","knowledge_id":"g2_math_022","question":"选择题：数据 2, 3, 5, 5, 5 的众数是（  ）\nA. 2\nB. 3\nC. 4\nD. 5","answer":"答案：D\n解析：众数是一组数据中出现次数最多的数据。在 2, 3, 5, 5, 5 中，5出现了3次，出现次数最多，所以众数是5。"},{"id":"g2_math_022_ex02","knowledge_id":"g2_math_022","question":"填空题：数据 3, 1, 4, 2, 5 的平均数是 ______。","answer":"答案：3\n解析：平均数 = 所有数据的和 ÷ 数据个数 = (3+1+4+2+5) ÷ 5 = 15 ÷ 5 = 3。"},{"id":"g2_math_022_ex03","knowledge_id":"g2_math_022","question":"判断题：一组数据的平均数一定是这组数据中的某一个数。（  ）","answer":"答案：错误\n解析：平均数是所有数据的和除以数据个数，它不一定是这组数据中的数。例如数据 1, 2, 3 的平均数是2，在数据中；但数据 1, 2, 4 的平均数约为2.33，不在数据中。"},{"id":"g2_math_022_ex04","knowledge_id":"g2_math_022","question":"选择题：数据 1, 2, 3, 4, 5 的中位数是（  ）\nA. 2\nB. 3\nC. 3.5\nD. 4","answer":"答案：B\n解析：把数据按从小到大排列：1, 2, 3, 4, 5，共5个数据，中间位置的数是第3个，即3，所以中位数是3。"},{"id":"g2_math_022_ex05","knowledge_id":"g2_math_022","question":"填空题：数据 2, 4, 6, 8, 10, 12 的中位数是 ______。","answer":"答案：7\n解析：把数据按从小到大排列：2, 4, 6, 8, 10, 12，共6个数据，中位数是中间两个数（第3个和第4个）的平均数，即 (6+8)÷2 = 7。"},{"id":"g2_math_022_ex06","knowledge_id":"g2_math_022","question":"选择题：某班5名学生的身高（单位：cm）分别为：160, 162, 165, 162, 160。下列说法正确的是（  ）\nA. 平均数是162\nB. 众数是160和162\nC. 中位数是165\nD. 众数是162","answer":"答案：B\n解析：平均数 = (160+162+165+162+160)÷5 = 809÷5 = 161.8，故A错误；\n众数是出现次数最多的数，160出现2次，162也出现2次，所以众数是160和162，故B正确，D错误；\n把数据排序：160, 160, 162, 162, 165，中位数是162，故C错误。"},{"id":"g2_math_022_ex07","knowledge_id":"g2_math_022","question":"判断题：一组数据的众数可能不止一个。（  ）","answer":"答案：正确\n解析：如果一组数据中有多个数据出现的次数相同且都是最多的，那么这几个数都是众数。例如数据 1, 2, 2, 3, 3 中，2和3都出现2次，都是最多的，所以众数是2和3两个。"},{"id":"g2_math_022_ex08","knowledge_id":"g2_math_022","question":"解答题：某小组10名学生的数学测验成绩如下（单位：分）：\n85, 90, 92, 88, 90, 95, 90, 88, 92, 90\n（1）求这10名学生成绩的平均数；\n（2）求这组数据的众数；\n（3）求这组数据的中位数。","answer":"答案：（1）90分；（2）90分；（3）90分\n解析：\n（1）平均数 = (85+90+92+88+90+95+90+88+92+90) ÷ 10 = 900 ÷ 10 = 90（分）\n\n（2）在这组数据中，90分出现了4次，出现次数最多，所以众数是90分。\n\n（3）把数据从小到大排列：85, 88, 88, 90, 90, 90, 90, 92, 92, 95\n    共10个数据，中位数是第5个和第6个的平均数，即 (90+90)÷2 = 90（分）。"},{"id":"g2_math_022_ex09","knowledge_id":"g2_math_022","question":"填空题：已知数据 2, 3, 5, x, 7 的平均数是4，则 x = ______。","answer":"答案：3\n解析：平均数 = (2+3+5+x+7) ÷ 5 = 4\n所以 (17+x) ÷ 5 = 4\n17 + x = 20\nx = 3"},{"id":"g2_math_022_ex10","knowledge_id":"g2_math_022","question":"解答题：某商店销售5种规格的文具盒，单价分别为10元、15元、20元、25元、30元。某天的销售情况如下：\n单价（元）：10  15  20  25  30\n销量（个）： 8   12  15  10   5\n（1）求这天销售文具盒单价的众数；\n（2）求这天销售文具盒单价的中位数；\n（3）求这天平均每个文具盒的售价。","answer":"答案：（1）20元；（2）20元；（3）19.2元\n解析：\n总销量 = 8+12+15+10+5 = 50（个）\n\n（1）销量最多的是20元的，卖了15个，所以众数是20元。\n\n（2）共50个数据，中位数是第25个和第26个数据的平均数。\n    10元的有8个（1-8），15元的有12个（9-20），20元的有15个（21-35）。\n    第25个和第26个都是20元，所以中位数是20元。\n\n（3）总销售额 = 10×8 + 15×12 + 20×15 + 25×10 + 30×5\n           = 80 + 180 + 300 + 250 + 150 = 960（元）\n    平均售价 = 960 ÷ 50 = 19.2（元）"},{"id":"g2_math_023_ex01","knowledge_id":"g2_math_023","question":"选择题：某班期末数学成绩中，100分的有2人，90分的有10人，80分的有20人，70分的有15人。则该班数学成绩的加权平均数是（  ）\nA. 80分\nB. 79.8分\nC. 79分\nD. 81分","answer":"答案：B\n解析：加权平均数 = (100×2 + 90×10 + 80×20 + 70×15) ÷ (2+10+20+15)\n= (200 + 900 + 1600 + 1050) ÷ 47\n= 3750 ÷ 47 ≈ 79.8（分）"},{"id":"g2_math_023_ex02","knowledge_id":"g2_math_023","question":"填空题：若数据 2, 3, 5 的权分别是 3, 2, 1，则这组数据的加权平均数是 ______。","answer":"答案：17/6 或 约2.83\n解析：加权平均数 = (2×3 + 3×2 + 5×1) ÷ (3+2+1) = (6 + 6 + 5) ÷ 6 = 17/6 ≈ 2.83。"},{"id":"g2_math_023_ex03","knowledge_id":"g2_math_023","question":"判断题：加权平均数中的权就是数据出现的次数。（  ）","answer":"答案：错误\n解析：权可以是数据出现的次数，也可以是比例、百分比、权重等，表示数据的重要程度。权的含义更广泛，不仅仅是次数。"},{"id":"g2_math_023_ex04","knowledge_id":"g2_math_023","question":"选择题：某校规定学生的学期体育成绩由三部分组成：课外活动占20%，期中考试成绩占30%，期末考试成绩占50%。小明的三项成绩依次为90分、80分、86分，则小明这学期的体育成绩是（  ）\nA. 85分\nB. 84分\nC. 86分\nD. 87分","answer":"答案：A\n解析：加权平均数 = 90×20% + 80×30% + 86×50%\n= 18 + 24 + 43\n= 85（分）"},{"id":"g2_math_023_ex05","knowledge_id":"g2_math_023","question":"填空题：有甲、乙两种糖果，甲种糖果每千克20元，乙种糖果每千克30元。现将甲种糖果3千克和乙种糖果2千克混合成什锦糖，则什锦糖每千克的售价为 ______ 元。","answer":"答案：24\n解析：什锦糖单价 = (20×3 + 30×2) ÷ (3+2) = (60 + 60) ÷ 5 = 120 ÷ 5 = 24（元/千克）。"},{"id":"g2_math_023_ex06","knowledge_id":"g2_math_023","question":"选择题：某公司对应聘者进行面试，按专业知识、工作经验、仪表形象给应聘者打分，这三个方面的权重之比为 6:3:1。应聘者A的三项得分分别为90分、80分、85分，则应聘者A的最终成绩是（  ）\nA. 85分\nB. 85.5分\nC. 86.5分\nD. 87分","answer":"答案：C\n解析：最终成绩 = (90×6 + 80×3 + 85×1) ÷ (6+3+1)\n= (540 + 240 + 85) ÷ 10\n= 865 ÷ 10 = 86.5（分）"},{"id":"g2_math_023_ex07","knowledge_id":"g2_math_023","question":"判断题：在加权平均数中，权越大，对平均数的影响越大。（  ）","answer":"答案：正确\n解析：权反映了数据的重要程度，权越大，说明该数据越重要，对平均数的影响也就越大。"},{"id":"g2_math_023_ex08","knowledge_id":"g2_math_023","question":"解答题：某班有40名学生，其中12岁的有5人，13岁的有20人，14岁的有10人，15岁的有5人。\n（1）求这个班学生的平均年龄；\n（2）这个班学生年龄的众数和中位数分别是多少？","answer":"答案：（1）13.375岁；（2）众数13岁，中位数13岁\n解析：\n（1）平均年龄 = (12×5 + 13×20 + 14×10 + 15×5) ÷ 40\n    = (60 + 260 + 140 + 75) ÷ 40\n    = 535 ÷ 40 = 13.375（岁）\n\n（2）13岁的人数最多，有20人，所以众数是13岁。\n    共40名学生，中位数是第20个和第21个学生年龄的平均数。\n    12岁：1-5人，13岁：6-25人\n    第20个和第21个都是13岁，所以中位数是13岁。"},{"id":"g2_math_023_ex09","knowledge_id":"g2_math_023","question":"填空题：已知数据 x₁, x₂, x₃ 的平均数是10，则数据 2x₁, 2x₂, 2x₃ 的平均数是 ______。","answer":"答案：20\n解析：因为 (x₁+x₂+x₃)/3 = 10，所以 x₁+x₂+x₃ = 30。\n(2x₁+2x₂+2x₃)/3 = 2(x₁+x₂+x₃)/3 = 2×30/3 = 20。"},{"id":"g2_math_023_ex10","knowledge_id":"g2_math_023","question":"解答题：某水果店购进苹果、香蕉、橙子三种水果，它们的单价和重量如下表：\n\n| 水果 | 单价（元/千克） | 重量（千克） |\n|------|----------------|------------|\n| 苹果 | 8              | 50         |\n| 香蕉 | 5              | 30         |\n| 橙子 | 6              | 20         |\n\n（1）求这批水果的平均单价；\n（2）若店主计划将这批水果混合后以高于平均单价20%的价格出售，求混合后的单价。","answer":"答案：（1）6.7元/千克；（2）8.04元/千克\n解析：\n（1）总金额 = 8×50 + 5×30 + 6×20 = 400 + 150 + 120 = 670（元）\n    总重量 = 50 + 30 + 20 = 100（千克）\n    平均单价 = 670 ÷ 100 = 6.7（元/千克）\n\n（2）混合后单价 = 6.7 × (1 + 20%) = 6.7 × 1.2 = 8.04（元/千克）"},{"id":"g2_math_024_ex01","knowledge_id":"g2_math_024","question":"选择题：数据 5, 2, 7, 2, 6 的中位数是（  ）\nA. 2\nB. 5\nC. 6\nD. 7","answer":"答案：B\n解析：先把数据从小到大排列：2, 2, 5, 6, 7，共5个数据，中位数是第3个，即5。"},{"id":"g2_math_024_ex02","knowledge_id":"g2_math_024","question":"填空题：数据 3, 7, 5, 3, 7, 3 的众数是 ______。","answer":"答案：3\n解析：在这组数据中，3出现了3次，出现次数最多，所以众数是3。"},{"id":"g2_math_024_ex03","knowledge_id":"g2_math_024","question":"判断题：中位数是一组数据中间的数，与数据的排列顺序无关。（  ）","answer":"答案：错误\n解析：中位数是将一组数据按从小到大（或从大到小）的顺序排列后，处于中间位置的数。中位数与数据的排列顺序有关，必须先排序再找中位数。"},{"id":"g2_math_024_ex04","knowledge_id":"g2_math_024","question":"选择题：数据 1, 2, 3, 4, 5, 6 的中位数是（  ）\nA. 3\nB. 3.5\nC. 4\nD. 3或4","answer":"答案：B\n解析：数据已按从小到大排列，共6个数据，中位数是第3个和第4个数据的平均数，即 (3+4)÷2 = 3.5。"},{"id":"g2_math_024_ex05","knowledge_id":"g2_math_024","question":"填空题：数据 2, 4, 4, 6, 6, 6, 8 的众数是 ______，中位数是 ______。","answer":"答案：6，6\n解析：6出现了3次，出现次数最多，所以众数是6。\n数据已排序，共7个，中位数是第4个，即6。"},{"id":"g2_math_024_ex06","knowledge_id":"g2_math_024","question":"选择题：某班10名学生的体育测试成绩（单位：分）如下：58, 60, 65, 70, 72, 75, 75, 80, 85, 90。下列说法正确的是（  ）\nA. 众数是72\nB. 中位数是73.5\nC. 中位数是75\nD. 众数是70","answer":"答案：B\n解析：75分出现了2次，出现次数最多，所以众数是75，故A、D错误。\n共10个数据，中位数是第5个和第6个的平均数，即 (72+75)÷2 = 73.5，故B正确，C错误。"},{"id":"g2_math_024_ex07","knowledge_id":"g2_math_024","question":"判断题：一组数据的众数一定是这组数据中的数。（  ）","answer":"答案：正确\n解析：众数是一组数据中出现次数最多的数，它一定是这组数据中的某个数。"},{"id":"g2_math_024_ex08","knowledge_id":"g2_math_024","question":"解答题：某品牌女鞋在一周内的销售情况如下表：\n\n| 鞋码（码） | 35 | 36 | 37 | 38 | 39 | 40 |\n|----------|----|----|----|----|----|----|\n| 销量（双） | 3  | 8  | 15 | 10 | 6  | 2  |\n\n（1）求这些女鞋鞋码的众数；\n（2）求这些女鞋鞋码的中位数；\n（3）如果你是鞋店老板，你会多进哪种鞋码的女鞋？为什么？","answer":"答案：（1）37码；（2）37码；（3）多进37码的，因为销量最大\n解析：\n总销量 = 3+8+15+10+6+2 = 44（双）\n\n（1）37码的销量最大，卖了15双，所以众数是37码。\n\n（2）共44个数据，中位数是第22个和第23个数据的平均数。\n    35码：1-3双\n    36码：4-11双（3+8=11）\n    37码：12-26双（11+15=26）\n    第22个和第23个都是37码，所以中位数是37码。\n\n（3）多进37码的女鞋，因为37码的销量最高，最畅销。"},{"id":"g2_math_024_ex09","knowledge_id":"g2_math_024","question":"填空题：已知一组数据 2, 5, 7, x, 8 的中位数是7，则x的取值范围是 ______。","answer":"答案：x ≥ 7\n解析：共5个数据，中位数是第3个。已知中位数是7，说明排序后7在第3位。\n数据中有2, 5, 7, 8，若x≥7，则排序后为 2, 5, 7, x, 8 或 2, 5, 7, 8, x，中位数都是7。\n若x<7，则中位数可能是5或x，都不等于7。所以x ≥ 7。"},{"id":"g2_math_024_ex10","knowledge_id":"g2_math_024","question":"解答题：某公司有15名员工，他们的月工资如下（单位：元）：\n5000, 4000, 3000, 3000, 3000, 2500, 2500, 2000, 2000, 2000, 2000, 2000, 1800, 1800, 1500\n（1）求这15名员工月工资的平均数、中位数和众数；\n（2）你认为用哪个统计量反映该公司员工的工资水平更合适？为什么？","answer":"答案：（1）平均数2540元，中位数2000元，众数2000元；（2）用中位数或众数更合适\n解析：\n（1）平均数 = (5000+4000+3000×3+2500×2+2000×5+1800×2+1500) ÷ 15\n    = (5000+4000+9000+5000+10000+3600+1500) ÷ 15\n    = 38100 ÷ 15 = 2540（元）\n\n    共15个数据，中位数是第8个，即2000元。\n    众数是出现次数最多的，2000元出现了5次，所以众数是2000元。\n\n（2）用中位数或众数更合适，因为大部分员工的工资在2000元左右，而平均数受高工资的影响较大，不能很好地反映大多数员工的工资水平。"},{"id":"g2_math_025_ex01","knowledge_id":"g2_math_025","question":"选择题：数据 3, 5, 2, 7, 1 的极差是（  ）\nA. 5\nB. 6\nC. 7\nD. 8","answer":"答案：B\n解析：极差 = 最大值 - 最小值 = 7 - 1 = 6。"},{"id":"g2_math_025_ex02","knowledge_id":"g2_math_025","question":"填空题：数据 5, 5, 5, 5, 5 的方差是 ______。","answer":"答案：0\n解析：这组数据的平均数是5，每个数据与平均数的差都是0，所以方差 s² = (1/5)[(5-5)²+(5-5)²+(5-5)²+(5-5)²+(5-5)²] = 0。方差为0说明数据没有波动。"},{"id":"g2_math_025_ex03","knowledge_id":"g2_math_025","question":"判断题：一组数据的极差越大，说明这组数据的波动越大。（  ）","answer":"答案：正确\n解析：极差是最大值与最小值的差，反映了数据的变化范围。极差越大，说明数据的波动范围越大。"},{"id":"g2_math_025_ex04","knowledge_id":"g2_math_025","question":"选择题：甲、乙两名运动员在10次百米赛跑训练中，平均成绩都是10.8秒，甲的方差是0.024，乙的方差是0.008。下列说法正确的是（  ）\nA. 甲的成绩更稳定\nB. 乙的成绩更稳定\nC. 甲、乙成绩一样稳定\nD. 无法确定谁的成绩更稳定","answer":"答案：B\n解析：方差越小，数据的波动越小，成绩越稳定。因为乙的方差0.008小于甲的方差0.024，所以乙的成绩更稳定。"},{"id":"g2_math_025_ex05","knowledge_id":"g2_math_025","question":"填空题：数据 1, 2, 3, 4, 5 的平均数是3，则这组数据的方差是 ______。","answer":"答案：2\n解析：s² = (1/5)[(1-3)²+(2-3)²+(3-3)²+(4-3)²+(5-3)²]\n    = (1/5)[4+1+0+1+4]\n    = (1/5)×10 = 2"},{"id":"g2_math_025_ex06","knowledge_id":"g2_math_025","question":"选择题：数据 1, 0, -1, 2, -2 的极差和方差分别是（  ）\nA. 极差4，方差2\nB. 极差3，方差2\nC. 极差4，方差1\nD. 极差2，方差4","answer":"答案：A\n解析：极差 = 最大值 - 最小值 = 2 - (-2) = 4\n平均数 = (1+0-1+2-2)÷5 = 0÷5 = 0\ns² = (1/5)[(1-0)²+(0-0)²+(-1-0)²+(2-0)²+(-2-0)²]\n    = (1/5)[1+0+1+4+4] = (1/5)×10 = 2"},{"id":"g2_math_025_ex07","knowledge_id":"g2_math_025","question":"判断题：方差越大，说明数据的波动越大。（  ）","answer":"答案：正确\n解析：方差是各个数据与平均数之差的平方的平均数，反映了数据的离散程度。方差越大，数据的波动越大；方差越小，数据的波动越小。"},{"id":"g2_math_025_ex08","knowledge_id":"g2_math_025","question":"解答题：甲、乙两台机床同时生产直径为40mm的零件，为了检验产品质量，从各机床生产的零件中各抽取5件进行测量，结果如下（单位：mm）：\n甲：40.0, 39.8, 40.1, 40.2, 39.9\n乙：40.0, 40.1, 40.2, 39.7, 40.0\n（1）分别计算甲、乙两组数据的平均数；\n（2）分别计算甲、乙两组数据的方差；\n（3）哪台机床生产的零件质量更稳定？为什么？","answer":"答案：（1）甲的平均数40mm，乙的平均数40mm；（2）甲的方差0.02，乙的方差0.028；（3）甲机床更稳定\n解析：\n（1）甲的平均数 = (40.0+39.8+40.1+40.2+39.9)÷5 = 200.0÷5 = 40.0(mm)\n    乙的平均数 = (40.0+40.1+40.2+39.7+40.0)÷5 = 200.0÷5 = 40.0(mm)\n\n（2）甲的方差：\n    s甲² = (1/5)[(40.0-40)²+(39.8-40)²+(40.1-40)²+(40.2-40)²+(39.9-40)²]\n         = (1/5)[0+0.04+0.01+0.04+0.01]\n         = (1/5)×0.1 = 0.02\n    乙的方差：\n    s乙² = (1/5)[(40.0-40)²+(40.1-40)²+(40.2-40)²+(39.7-40)²+(40.0-40)²]\n         = (1/5)[0+0.01+0.04+0.09+0]\n         = (1/5)×0.14 = 0.028\n\n（3）因为 s甲² < s乙²，所以甲机床生产的零件质量更稳定。"},{"id":"g2_math_025_ex09","knowledge_id":"g2_math_025","question":"填空题：已知一组数据的极差是12，最大值是30，则这组数据的最小值是 ______。","answer":"答案：18\n解析：极差 = 最大值 - 最小值，所以最小值 = 最大值 - 极差 = 30 - 12 = 18。"},{"id":"g2_math_025_ex10","knowledge_id":"g2_math_025","question":"解答题：某农场种植了甲、乙两种水稻品种，各随机抽取了10株水稻苗，测得苗高如下（单位：cm）：\n甲：23, 23, 24, 23, 22, 24, 23, 22, 23, 23\n乙：21, 25, 27, 22, 26, 20, 25, 23, 24, 27\n（1）求甲、乙两种水稻苗的平均高度；\n（2）哪种水稻苗长得比较整齐？请通过计算说明理由。","answer":"答案：（1）甲的平均高度23cm，乙的平均高度24cm；（2）甲种水稻苗长得比较整齐\n解析：\n（1）甲的平均数 = (23+23+24+23+22+24+23+22+23+23)÷10 = 230÷10 = 23(cm)\n    乙的平均数 = (21+25+27+22+26+20+25+23+24+27)÷10 = 240÷10 = 24(cm)\n\n（2）甲的方差：\n    s甲² = (1/10)[(23-23)²×6 + (24-23)²×2 + (22-23)²×2]\n         = (1/10)[0×6 + 1×2 + 1×2]\n         = (1/10)×4 = 0.4\n    乙的方差：\n    s乙² = (1/10)[(21-24)²+(25-24)²+(27-24)²+(22-24)²+(26-24)²+(20-24)²+(25-24)²+(23-24)²+(24-24)²+(27-24)²]\n         = (1/10)[9+1+9+4+4+16+1+1+0+9]\n         = (1/10)×54 = 5.4\n    因为 s甲² < s乙²，所以甲种水稻苗长得比较整齐。"},{"id":"g2_math_026_ex01","knowledge_id":"g2_math_026","question":"选择题：某班有50名学生，在一次数学测验中，得优的有15人，则得优的频数和频率分别是（  ）\nA. 15，0.3\nB. 15，0.15\nC. 0.3，15\nD. 50，0.3","answer":"答案：A\n解析：频数是指每个对象出现的次数，得优的有15人，所以频数是15。\n频率 = 频数 ÷ 总数 = 15 ÷ 50 = 0.3。"},{"id":"g2_math_026_ex02","knowledge_id":"g2_math_026","question":"填空题：一组数据共有40个，分成5组，若前4组的频数分别是8、10、7、6，则第5组的频率是 ______。","answer":"答案：0.225\n解析：第5组的频数 = 总数 - 前4组频数之和 = 40 - (8+10+7+6) = 40 - 31 = 9\n第5组的频率 = 9 ÷ 40 = 0.225"},{"id":"g2_math_026_ex03","knowledge_id":"g2_math_026","question":"判断题：所有组的频率之和等于1。（  ）","answer":"答案：正确\n解析：频率是各组频数与总数的比值，所有组的频数之和等于总数，所以所有组的频率之和等于1。"},{"id":"g2_math_026_ex04","knowledge_id":"g2_math_026","question":"选择题：对60个数据进行处理时，适当分组，各组数据个数之和与各组频率之和分别等于（  ）\nA. 60，1\nB. 60，60\nC. 1，60\nD. 1，1","answer":"答案：A\n解析：各组数据个数之和就是数据总数，即60。各组频率之和等于1，因为频率是各组数据个数与总数的比值，加起来就是1。"},{"id":"g2_math_026_ex05","knowledge_id":"g2_math_026","question":"填空题：一个样本有50个数据，分成若干组，其中一组的频率是0.2，则这一组的频数是 ______。","answer":"答案：10\n解析：频数 = 总数 × 频率 = 50 × 0.2 = 10。"},{"id":"g2_math_026_ex06","knowledge_id":"g2_math_026","question":"选择题：某班40名学生的数学成绩如下（单位：分）：60分以下有4人，60~70分有8人，70~80分有12人，80~90分有10人，90分以上有6人。下列说法错误的是（  ）\nA. 80~90分这一组的频率是0.2\nB. 60分以下这一组的频率是0.1\nC. 70~80分这一组的频率是0.3\nD. 90分以上这一组的频率是0.15","answer":"答案：A\n解析：\nA选项：80~90分这一组的频率 = 10÷40 = 0.25 ≠ 0.2，故A错误；\nB选项：60分以下这一组的频率 = 4÷40 = 0.1，正确；\nC选项：70~80分这一组的频率 = 12÷40 = 0.3，正确；\nD选项：90分以上这一组的频率 = 6÷40 = 0.15，正确。"},{"id":"g2_math_026_ex07","knowledge_id":"g2_math_026","question":"判断题：频数分布直方图中，各小长方形的面积等于相应各组的频数。（  ）","answer":"答案：正确\n解析：在频数分布直方图中，横轴表示数据分组，纵轴表示频数与组距的比值。小长方形的面积 = 组距 × (频数/组距) = 频数，所以各小长方形的面积等于相应各组的频数。"},{"id":"g2_math_026_ex08","knowledge_id":"g2_math_026","question":"解答题：某中学为了了解七年级学生的身高情况，抽取了50名学生测量身高（单位：cm），结果如下：\n140~145：5人\n145~150：10人\n150~155：15人\n155~160：12人\n160~165：6人\n165~170：2人\n（1）求各组的频率；\n（2）身高在150cm以上（含150cm）的学生占百分之几？\n（3）画出频数分布直方图的大致形状。","answer":"答案：（1）各组频率分别为0.1, 0.2, 0.3, 0.24, 0.12, 0.04；（2）70%\n解析：\n（1）140~145：频率 = 5÷50 = 0.1\n    145~150：频率 = 10÷50 = 0.2\n    150~155：频率 = 15÷50 = 0.3\n    155~160：频率 = 12÷50 = 0.24\n    160~165：频率 = 6÷50 = 0.12\n    165~170：频率 = 2÷50 = 0.04\n\n（2）身高在150cm以上的学生人数 = 15+12+6+2 = 35（人）\n    占比 = 35÷50 = 0.7 = 70%\n\n（3）频数分布直方图以身高为横轴，频数为纵轴，画6个小长方形，高度分别对应5、10、15、12、6、2。"},{"id":"g2_math_026_ex09","knowledge_id":"g2_math_026","question":"填空题：在频数分布直方图中，各组频率之和等于 ______，各组频数之和等于 ______。","answer":"答案：1，数据总数\n解析：各组频率之和等于1，因为频率 = 频数÷总数，各组频数加起来就是总数，所以频率加起来就是1。各组频数之和等于数据总数。"},{"id":"g2_math_026_ex10","knowledge_id":"g2_math_026","question":"解答题：某商场统计了某月30天的营业额（单位：万元），结果如下：\n2.8, 3.2, 3.4, 3.5, 2.9, 3.0, 3.3, 3.6, 3.8, 3.1,\n3.0, 2.7, 3.5, 3.4, 3.2, 3.1, 3.7, 2.6, 3.3, 3.5,\n3.9, 3.0, 2.5, 3.6, 3.2, 3.4, 3.1, 3.8, 3.0, 2.9\n（1）列出频数分布表（组距为0.5万元，从2.5万元开始）；\n（2）计算营业额在3.0万元以上（含3.0万元）的天数占总天数的百分比。","answer":"答案：（1）见解析；（2）约76.7%\n解析：\n（1）频数分布表：\n    营业额（万元）  | 划记 | 频数\n    2.5~3.0        | 正   | 7\n    3.0~3.5        | 正正正 | 16\n    3.5~4.0        | 正T  | 7\n    合计           |      | 30\n    （验证：7+16+7 = 30 ✓）\n\n（2）营业额在3.0万元以上的天数 = 16+7 = 23（天）\n    百分比 = 23÷30 ≈ 0.767 = 76.7%"},{"id":"g2_math_027_ex01","knowledge_id":"g2_math_027","question":"选择题：下列说法正确的是（  ）\nA. 三角形按边分只有等边三角形和等腰三角形\nB. 直角三角形一定不是等腰三角形\nC. 等边三角形是特殊的等腰三角形\nD. 钝角三角形的三个角都是钝角","answer":"答案：C\n解析：\nA. 错误，按边分有不等边三角形、等腰三角形和等边三角形\nB. 错误，等腰直角三角形既是直角三角形也是等腰三角形\nC. 正确，等边三角形三条边相等，满足等腰三角形条件\nD. 错误，钝角三角形只有一个钝角"},{"id":"g2_math_027_ex02","knowledge_id":"g2_math_027","question":"选择题：若三角形的三个内角都相等，则这个三角形是（  ）\nA. 锐角三角形\nB. 直角三角形\nC. 钝角三角形\nD. 无法确定","answer":"答案：A\n解析：三个内角相等，则每个角 = 180° ÷ 3 = 60°，60°是锐角，所以是锐角三角形，同时也是等边三角形。"},{"id":"g2_math_027_ex03","knowledge_id":"g2_math_027","question":"填空题：三角形按角分类可分为______三角形、______三角形和______三角形。","answer":"答案：锐角、直角、钝角\n解析：根据三角形内角大小分类，三个角都是锐角的是锐角三角形，有一个直角的是直角三角形，有一个钝角的是钝角三角形。"},{"id":"g2_math_027_ex04","knowledge_id":"g2_math_027","question":"判断题：有两条边相等的三角形一定是等边三角形。","answer":"答案：错误\n解析：有两条边相等的三角形是等腰三角形，等边三角形需要三条边都相等。等边三角形是特殊的等腰三角形，但等腰三角形不一定是等边三角形。"},{"id":"g2_math_027_ex05","knowledge_id":"g2_math_027","question":"解答题：一个三角形的两个内角分别是30°和60°，请判断这个三角形的类型。","answer":"答案：直角三角形\n解析：第三个内角 = 180° - 30° - 6
