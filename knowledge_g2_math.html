0° = 90°，有一个角是90°，所以是直角三角形。"},{"id":"g2_math_027_ex06","knowledge_id":"g2_math_027","question":"选择题：下列三角形中，属于等腰三角形的是（  ）\nA. 三边分别为3, 4, 5\nB. 三边分别为5, 5, 6\nC. 三边分别为2, 3, 4\nD. 三边分别为4, 4, 8","answer":"答案：B\n解析：\nA. 三边都不相等，是不等边三角形\nB. 有两条边都是5，是等腰三角形\nC. 三边都不相等，是不等边三角形\nD. 4+4=8，不满足三角形三边关系，不能组成三角形"},{"id":"g2_math_027_ex07","knowledge_id":"g2_math_027","question":"填空题：等边三角形的每个内角都是______度。","answer":"答案：60\n解析：三角形内角和为180°，等边三角形三个内角相等，所以每个角 = 180° ÷ 3 = 60°。"},{"id":"g2_math_027_ex08","knowledge_id":"g2_math_027","question":"判断题：钝角三角形的最大内角大于90°且小于180°。","answer":"答案：正确\n解析：钝角的定义是大于90°且小于180°，钝角三角形有一个钝角，这个钝角就是最大内角。"},{"id":"g2_math_027_ex09","knowledge_id":"g2_math_027","question":"解答题：三角形ABC中，∠A=40°，∠B=50°，求∠C的度数，并判断三角形类型。","answer":"答案：∠C=90°，直角三角形\n解析：∠C = 180° - 40° - 50° = 90°，有一个直角，所以是直角三角形。"},{"id":"g2_math_027_ex10","knowledge_id":"g2_math_027","question":"选择题：下列说法错误的是（  ）\nA. 锐角三角形的三个角都小于90°\nB. 直角三角形有一个角等于90°\nC. 钝角三角形有一个角大于90°\nD. 所有三角形都至少有两个钝角","answer":"答案：D\n解析：三角形内角和为180°，如果有两个钝角（每个都大于90°），它们的和就会超过180°，不可能。所以三角形最多只能有一个钝角。"},{"id":"g2_math_028_ex01","knowledge_id":"g2_math_028","question":"选择题：下列各组线段中，能组成三角形的是（  ）\nA. 2, 3, 5\nB. 2, 3, 4\nC. 2, 2, 5\nD. 1, 3, 5","answer":"答案：B\n解析：根据三角形三边关系，任意两边之和大于第三边。\nA. 2+3=5，不满足\nB. 2+3>4, 2+4>3, 3+4>2，满足\nC. 2+2<5，不满足\nD. 1+3<5，不满足"},{"id":"g2_math_028_ex02","knowledge_id":"g2_math_028","question":"填空题：三角形的两边长分别为4cm和6cm，则第三边的取值范围是______。","answer":"答案：2cm < 第三边 < 10cm\n解析：根据三边关系，第三边大于两边之差，小于两边之和。\n6-4=2，6+4=10，所以第三边在2cm和10cm之间。"},{"id":"g2_math_028_ex03","knowledge_id":"g2_math_028","question":"选择题：若三角形的三边长分别为a, b, c，且a=3, b=5，则c的取值范围是（  ）\nA. 2 < c < 8\nB. 2 ≤ c ≤ 8\nC. c > 2\nD. c < 8","answer":"答案：A\n解析：第三边c需要满足：|a-b| < c < a+b，即|3-5| < c < 3+5，所以2 < c < 8。"},{"id":"g2_math_028_ex04","knowledge_id":"g2_math_028","question":"判断题：三条线段长度分别为5, 5, 10，可以组成三角形。","answer":"答案：错误\n解析：5+5=10，不满足\"两边之和大于第三边\"的条件，不能组成三角形。"},{"id":"g2_math_028_ex05","knowledge_id":"g2_math_028","question":"解答题：三角形两边长分别为3和7，第三边为整数，求第三边的可能值。","answer":"答案：5, 6, 7, 8, 9\n解析：第三边c满足：7-3 < c < 7+3，即4 < c < 10。\n因为c是整数，所以c可以是5, 6, 7, 8, 9。"},{"id":"g2_math_028_ex06","knowledge_id":"g2_math_028","question":"选择题：等腰三角形的两边长分别为3和7，则其周长为（  ）\nA. 13\nB. 17\nC. 13或17\nD. 无法确定","answer":"答案：B\n解析：等腰三角形两腰相等，分两种情况：\n1. 腰长为3，底边为7：3+3=6<7，不能组成三角形\n2. 腰长为7，底边为3：7+7>3, 7+3>7，能组成三角形\n周长 = 7+7+3 = 17"},{"id":"g2_math_028_ex07","knowledge_id":"g2_math_028","question":"填空题：三角形的三边长为5, 12, 13，这个三角形是______三角形（按角分类）。","answer":"答案：直角\n解析：因为5² + 12² = 25 + 144 = 169 = 13²，满足勾股定理，所以是直角三角形。"},{"id":"g2_math_028_ex08","knowledge_id":"g2_math_028","question":"判断题：三角形的任意两边之差一定小于第三边。","answer":"答案：正确\n解析：这是三角形三边关系的推论。由a+b>c可得c-b<a，即任意两边之差小于第三边。"},{"id":"g2_math_028_ex09","knowledge_id":"g2_math_028","question":"解答题：一个三角形的周长为18cm，其中两边长分别为5cm和6cm，求第三边长。","answer":"答案：7cm\n解析：第三边 = 周长 - 已知两边之和 = 18 - (5+6) = 18 - 11 = 7cm。\n验证：5+6>7, 5+7>6, 6+7>5，满足三边关系。"},{"id":"g2_math_028_ex10","knowledge_id":"g2_math_028","question":"选择题：若三角形三边长为a, b, c，且a > b > c，则下列不等式成立的是（  ）\nA. b + c < a\nB. b + c ≤ a\nC. b + c > a\nD. b + c ≥ a","answer":"答案：C\n解析：三角形中，最短两边之和大于最长边。因为a是最长边，所以b+c > a。"},{"id":"g2_math_029_ex01","knowledge_id":"g2_math_029","question":"选择题：三角形的内角和等于（  ）\nA. 90°\nB. 180°\nC. 270°\nD. 360°","answer":"答案：B\n解析：三角形内角和定理：三角形三个内角的和等于180°。"},{"id":"g2_math_029_ex02","knowledge_id":"g2_math_029","question":"填空题：在三角形ABC中，∠A=50°，∠B=60°，则∠C=______度。","answer":"答案：70\n解析：∠C = 180° - ∠A - ∠B = 180° - 50° - 60° = 70°。"},{"id":"g2_math_029_ex03","knowledge_id":"g2_math_029","question":"选择题：直角三角形的两个锐角之和等于（  ）\nA. 90°\nB. 180°\nC. 360°\nD. 45°","answer":"答案：A\n解析：直角三角形有一个90°的直角，所以两个锐角之和 = 180° - 90° = 90°，即互余。"},{"id":"g2_math_029_ex04","knowledge_id":"g2_math_029","question":"判断题：任意三角形的内角和都是180°，与三角形的大小和形状无关。","answer":"答案：正确\n解析：三角形内角和定理是几何学的基本定理，无论三角形是大是小、是什么形状，内角和都是180°。"},{"id":"g2_math_029_ex05","knowledge_id":"g2_math_029","question":"解答题：三角形ABC中，∠A:∠B:∠C=1:2:3，求三个内角的度数。","answer":"答案：∠A=30°, ∠B=60°, ∠C=90°\n解析：设∠A=x，则∠B=2x，∠C=3x。\nx + 2x + 3x = 180°\n6x = 180°\nx = 30°\n所以∠A=30°, ∠B=60°, ∠C=90°。"},{"id":"g2_math_029_ex06","knowledge_id":"g2_math_029","question":"选择题：等腰三角形的一个底角为70°，则顶角为（  ）\nA. 70°\nB. 40°\nC. 50°\nD. 60°","answer":"答案：B\n解析：等腰三角形两底角相等，所以顶角 = 180° - 70° - 70° = 40°。"},{"id":"g2_math_029_ex07","knowledge_id":"g2_math_029","question":"填空题：等边三角形的每个内角都是______度。","answer":"答案：60\n解析：等边三角形三个内角相等，所以每个角 = 180° ÷ 3 = 60°。"},{"id":"g2_math_029_ex08","knowledge_id":"g2_math_029","question":"判断题：三角形中最多有一个直角或一个钝角。","answer":"答案：正确\n解析：因为直角=90°，钝角>90°，如果有两个直角或钝角，它们的和就会≥180°，超过三角形内角和180°，不可能。"},{"id":"g2_math_029_ex09","knowledge_id":"g2_math_029","question":"解答题：在三角形ABC中，∠A=2∠B，∠C=∠A+30°，求三个内角的度数。","answer":"答案：∠A=60°, ∠B=30°, ∠C=90°\n解析：设∠B=x，则∠A=2x，∠C=2x+30°。\n2x + x + (2x+30°) = 180°\n5x + 30° = 180°\n5x = 150°\nx = 30°\n所以∠A=60°, ∠B=30°, ∠C=90°。"},{"id":"g2_math_029_ex10","knowledge_id":"g2_math_029","question":"选择题：三角形中，如果一个内角等于另外两个内角的和，则这个三角形是（  ）\nA. 锐角三角形\nB. 直角三角形\nC. 钝角三角形\nD. 等边三角形","answer":"答案：B\n解析：设三个角为∠A, ∠B, ∠C，且∠A=∠B+∠C。\n因为∠A+∠B+∠C=180°，所以∠A+∠A=180°，∠A=90°，是直角三角形。"},{"id":"g2_math_030_ex01","knowledge_id":"g2_math_030","question":"选择题：三角形的一个外角等于（  ）\nA. 与它相邻的内角\nB. 与它不相邻的两个内角之和\nC. 与它不相邻的一个内角\nD. 任意两个内角之和","answer":"答案：B\n解析：三角形外角定理：三角形的一个外角等于与它不相邻的两个内角之和。"},{"id":"g2_math_030_ex02","knowledge_id":"g2_math_030","question":"填空题：三角形的外角和等于______度。","answer":"答案：360\n解析：任意多边形的外角和都是360°，三角形也不例外。"},{"id":"g2_math_030_ex03","knowledge_id":"g2_math_030","question":"选择题：三角形的一个外角大于（  ）\nA. 任意一个内角\nB. 与它相邻的内角\nC. 与它不相邻的任何一个内角\nD. 只有直角三角形才有外角","answer":"答案：C\n解析：三角形的一个外角大于任何一个与它不相邻的内角，这是外角的重要性质。"},{"id":"g2_math_030_ex04","knowledge_id":"g2_math_030","question":"判断题：三角形的外角一定是钝角。","answer":"答案：错误\n解析：三角形的外角可能是锐角、直角或钝角，取决于与它相邻的内角。如果相邻内角是钝角，外角就是锐角。"},{"id":"g2_math_030_ex05","knowledge_id":"g2_math_030","question":"解答题：三角形ABC中，∠A=40°，∠B=60°，求与∠C相邻的外角的度数。","answer":"答案：100°\n解析：方法一：∠C = 180° - 40° - 60° = 80°，外角 = 180° - 80° = 100°\n方法二：外角 = ∠A + ∠B = 40° + 60° = 100°（更简便）"},{"id":"g2_math_030_ex06","knowledge_id":"g2_math_030","question":"选择题：三角形的一个外角是120°，与它不相邻的两个内角之比为2:3，则这两个内角分别是（  ）\nA. 48°, 72°\nB. 40°, 80°\nC. 36°, 84°\nD. 45°, 75°","answer":"答案：A\n解析：外角等于不相邻两内角之和，设两内角分别为2x和3x，则2x+3x=120°，5x=120°，x=24°。\n所以两内角分别为48°和72°。"},{"id":"g2_math_030_ex07","knowledge_id":"g2_math_030","question":"填空题：三角形的三个外角中，最多有______个锐角。","answer":"答案：1\n解析：外角是锐角意味着相邻内角是钝角。三角形最多只能有一个钝角，所以外角中最多有一个锐角。"},{"id":"g2_math_030_ex08","knowledge_id":"g2_math_030","question":"判断题：三角形的外角和等于它的内角和的两倍。","answer":"答案：正确\n解析：三角形内角和=180°，外角和=360°，360°=2×180°，所以外角和是内角和的两倍。"},{"id":"g2_math_030_ex09","knowledge_id":"g2_math_030","question":"解答题：在三角形ABC中，∠A=50°，∠B的外角是110°，求∠C的度数。","answer":"答案：60°\n解析：∠B的外角=∠A+∠C，所以∠C=外角-∠A=110°-50°=60°。"},{"id":"g2_math_030_ex10","knowledge_id":"g2_math_030","question":"选择题：下列关于三角形外角的说法，正确的是（  ）\nA. 外角与相邻内角相等\nB. 外角一定大于内角\nC. 外角与相邻内角互补\nD. 外角是内角的两倍","answer":"答案：C\n解析：外角与相邻内角组成平角（180°），所以它们互补。"},{"id":"g2_math_031_ex01","knowledge_id":"g2_math_031","question":"选择题：n边形的内角和公式是（  ）\nA. n×180°\nB. (n-2)×180°\nC. (n-1)×180°\nD. n×90°","answer":"答案：B\n解析：n边形内角和公式为(n-2)×180°。可以通过将n边形分割成(n-2)个三角形来推导。"},{"id":"g2_math_031_ex02","knowledge_id":"g2_math_031","question":"填空题：四边形的内角和等于______度。","answer":"答案：360\n解析：(4-2)×180° = 2×180° = 360°。"},{"id":"g2_math_031_ex03","knowledge_id":"g2_math_031","question":"选择题：一个多边形的内角和为720°，则这个多边形是（  ）\nA. 四边形\nB. 五边形\nC. 六边形\nD. 七边形","answer":"答案：C\n解析：设边数为n，则(n-2)×180°=720°，n-2=4，n=6，所以是六边形。"},{"id":"g2_math_031_ex04","knowledge_id":"g2_math_031","question":"判断题：任意多边形的外角和都是360°。","answer":"答案：正确\n解析：这是多边形外角和定理，无论多边形有多少条边，外角和都是360°。"},{"id":"g2_math_031_ex05","knowledge_id":"g2_math_031","question":"解答题：一个多边形的内角和是外角和的3倍，求这个多边形的边数。","answer":"答案：8\n解析：设边数为n，外角和=360°，内角和=3×360°=1080°。\n(n-2)×180°=1080°\nn-2=6\nn=8"},{"id":"g2_math_031_ex06","knowledge_id":"g2_math_031","question":"选择题：正五边形每个内角的度数是（  ）\nA. 108°\nB. 120°\nC. 90°\nD. 135°","answer":"答案：A\n解析：五边形内角和=(5-2)×180°=540°，正五边形每个内角=540°÷5=108°。"},{"id":"g2_math_031_ex07","knowledge_id":"g2_math_031","question":"填空题：正六边形每个内角的度数是______度。","answer":"答案：120\n解析：六边形内角和=(6-2)×180°=720°，正六边形每个内角=720°÷6=120°。"},{"id":"g2_math_031_ex08","knowledge_id":"g2_math_031","question":"判断题：多边形边数每增加1，内角和增加90°。","answer":"答案：错误\n解析：边数增加1，内角和增加180°。因为(n+1-2)×180° - (n-2)×180° = 180°。"},{"id":"g2_math_031_ex09","knowledge_id":"g2_math_031","question":"解答题：一个多边形除一个内角外，其余各内角之和为1870°，求这个多边形的边数和这个内角的度数。","answer":"答案：13边形，110°\n解析：设边数为n，这个内角为x°，则(n-2)×180°=1870°+x°。\n1870÷180=10...70，所以n-2=11，n=13。\n内角和=(13-2)×180°=1980°，x=1980-1870=110°。"},{"id":"g2_math_031_ex10","knowledge_id":"g2_math_031","question":"选择题：下列图形中，内角和等于外角和的是（  ）\nA. 三角形\nB. 四边形\nC. 五边形\nD. 六边形","answer":"答案：B\n解析：外角和=360°，四边形内角和=(4-2)×180°=360°，两者相等。"},{"id":"g2_math_032_ex01","knowledge_id":"g2_math_032","question":"选择题：下列说法正确的是（  ）\nA. 全等三角形的对应边不一定相等\nB. 全等三角形的对应角不一定相等\nC. 全等三角形的周长一定相等\nD. 面积相等的两个三角形一定全等","answer":"答案：C\n解析：\nA. 错误，全等三角形对应边相等\nB. 错误，全等三角形对应角相等\nC. 正确，全等三角形对应边相等，周长=三边之和也相等\nD. 错误，面积相等的三角形不一定全等"},{"id":"g2_math_032_ex02","knowledge_id":"g2_math_032","question":"填空题：若△ABC ≌ △DEF，则∠A=______，BC=______。","answer":"答案：∠D，EF\n解析：全等三角形对应角相等，对应边相等。∠A对应∠D，BC对应EF。"},{"id":"g2_math_032_ex03","knowledge_id":"g2_math_032","question":"选择题：全等三角形的对应高、对应中线、对应角平分线的关系是（  ）\nA. 都不相等\nB. 都相等\nC. 只有对应高相等\nD. 只有对应中线相等","answer":"答案：B\n解析：全等三角形的对应高、对应中线、对应角平分线都相等，这是全等三角形的重要性质。"},{"id":"g2_math_032_ex04","knowledge_id":"g2_math_032","question":"判断题：全等三角形的面积一定相等，但面积相等的三角形不一定全等。","answer":"答案：正确\n解析：全等三角形对应边相等，高也相等，所以面积相等。但面积相等只说明底×高相等，形状可以不同。"},{"id":"g2_math_032_ex05","knowledge_id":"g2_math_032","question":"解答题：已知△ABC ≌ △A'B'C'，AB=5cm，BC=6cm，∠A=40°，求A'B'、B'C'和∠A'的度数。","answer":"答案：A'B'=5cm，B'C'=6cm，∠A'=40°\n解析：全等三角形对应边相等，对应角相等。AB对应A'B'，BC对应B'C'，∠A对应∠A'。"},{"id":"g2_math_032_ex06","knowledge_id":"g2_math_032","question":"选择题：若△ABC ≌ △DEF，且△ABC的周长为20cm，则△DEF的周长为（  ）\nA. 10cm\nB. 20cm\nC. 40cm\nD. 无法确定","answer":"答案：B\n解析：全等三角形周长相等，所以△DEF的周长也是20cm。"},{"id":"g2_math_032_ex07","knowledge_id":"g2_math_032","question":"填空题：全等三角形的对应边和对应角都______。","answer":"答案：相等\n解析：这是全等三角形最基本的性质。"},{"id":"g2_math_032_ex08","knowledge_id":"g2_math_032","question":"判断题：只有完全重合的两个三角形才是全等三角形。","answer":"答案：正确\n解析：全等三角形的定义就是能够完全重合的两个三角形。"},{"id":"g2_math_032_ex09","knowledge_id":"g2_math_032","question":"解答题：如图，△ABC ≌ △ADC，指出对应顶点、对应边和对应角。","answer":"答案：对应顶点：A-A, B-D, C-C\n对应边：AB-AD, BC-DC, AC-AC\n对应角：∠B-∠D, ∠BAC-∠DAC, ∠BCA-∠DCA\n解析：根据全等符号的顺序确定对应关系。"},{"id":"g2_math_032_ex10","knowledge_id":"g2_math_032","question":"选择题：下列条件中，不能判定两个三角形全等的是（  ）\nA. 三边对应相等\nB. 两边和夹角对应相等\nC. 两角和夹边对应相等\nD. 三个角对应相等","answer":"答案：D\n解析：AAA只能证明相似，不能证明全等。"},{"id":"g2_math_033_ex01","knowledge_id":"g2_math_033","question":"选择题：下列各组条件中，能判定△ABC ≌ △DEF的是（  ）\nA. AB=DE, BC=EF, ∠A=∠D\nB. AB=DE, BC=EF, AC=DF\nC. AB=DE, ∠A=∠D, ∠B=∠E\nD. ∠A=∠D, ∠B=∠E, ∠C=∠F","answer":"答案：B\n解析：B选项是三边对应相等（SSS），可以判定全等。"},{"id":"g2_math_033_ex02","knowledge_id":"g2_math_033","question":"填空题：如果两个三角形的三条边分别对应______，那么这两个三角形全等（SSS）。","answer":"答案：相等\n解析：SSS判定定理：三边对应相等的两个三角形全等。"},{"id":"g2_math_033_ex03","knowledge_id":"g2_math_033","question":"选择题：在△ABC和△DEF中，AB=DE=3cm，BC=EF=4cm，AC=DF=5cm，则△ABC与△DEF（  ）\nA. 不全等\nB. 全等\nC. 面积相等但不全等\nD. 无法确定","answer":"答案：B\n解析：三边分别相等，符合SSS判定定理，所以全等。"},{"id":"g2_math_033_ex04","knowledge_id":"g2_math_033","question":"判断题：SSS是三角形全等的判定方法之一。","answer":"答案：正确\n解析：SSS（边边边）是五种全等判定方法之一。"},{"id":"g2_math_033_ex05","knowledge_id":"g2_math_033","question":"解答题：如图，已知AB=AD，BC=DC，求证：△ABC ≌ △ADC。","answer":"答案：证明：在△ABC和△ADC中\nAB=AD（已知）\nBC=DC（已知）\nAC=AC（公共边）\n∴ △ABC ≌ △ADC（SSS）\n解析：利用SSS判定定理，三条边都对应相等。"},{"id":"g2_math_033_ex06","knowledge_id":"g2_math_033","question":"选择题：用SSS判定两个三角形全等，需要知道（  ）\nA. 三个角对应相等\nB. 三条边对应相等\nC. 两条边和一个角对应相等\nD. 两个角和一条边对应相等","answer":"答案：B\n解析：SSS即边边边，需要三条边对应相等。"},{"id":"g2_math_033_ex07","knowledge_id":"g2_math_033","question":"填空题：SSS的全称是______。","answer":"答案：边边边\n解析：SSS是Side-Side-Side的缩写，即三边对应相等。"},{"id":"g2_math_033_ex08","knowledge_id":"g2_math_033","question":"判断题：只要三条边对应相等，两个三角形就一定全等。","answer":"答案：正确\n解析：这是SSS判定定理的内容。"},{"id":"g2_math_033_ex09","knowledge_id":"g2_math_033","question":"解答题：已知△ABC中，AB=6cm，BC=8cm，AC=10cm，△DEF中，DE=6cm，EF=8cm，DF=10cm，求证△ABC ≌ △DEF。","answer":"答案：证明：在△ABC和△DEF中\nAB=DE=6cm（已知）\nBC=EF=8cm（已知）\nAC=DF=10cm（已知）\n∴ △ABC ≌ △DEF（SSS）\n解析：三边对应相等，满足SSS条件。"},{"id":"g2_math_033_ex10","knowledge_id":"g2_math_033","question":"选择题：下列说法错误的是（  ）\nA. SSS可以判定三角形全等\nB. SSS需要三条边对应相等\nC. 只有SSS一种方法判定全等\nD. SSS是常用的全等判定方法","answer":"答案：C\n解析：除了SSS，还有SAS、ASA、AAS、HL等方法。"},{"id":"g2_math_034_ex01","knowledge_id":"g2_math_034","question":"选择题：下列各组条件中，能判定△ABC ≌ △DEF的是（  ）\nA. AB=DE, BC=EF, ∠B=∠E\nB. AB=DE, BC=EF, ∠A=∠D\nC. AB=DE, ∠A=∠D, ∠B=∠E\nD. ∠A=∠D, ∠B=∠E, ∠C=∠F","answer":"答案：A\n解析：A选项是两边和它们的夹角对应相等（SAS），可以判定全等。"},{"id":"g2_math_034_ex02","knowledge_id":"g2_math_034","question":"填空题：如果两个三角形的两边和它们的______分别对应相等，那么这两个三角形全等（SAS）。","answer":"答案：夹角\n解析：SAS判定定理：两边和它们的夹角对应相等的两个三角形全等。"},{"id":"g2_math_034_ex03","knowledge_id":"g2_math_034","question":"选择题：在△ABC和△DEF中，AB=DE=5cm，BC=EF=6cm，∠B=∠E=60°，则△ABC与△DEF（  ）\nA. 不全等\nB. 全等\nC. 面积相等但不全等\nD. 无法确定","answer":"答案：B\n解析：两边和夹角对应相等，符合SAS判定定理。"},{"id":"g2_math_034_ex04","knowledge_id":"g2_math_034","question":"判断题：SAS中的角必须是两边的夹角。","answer":"答案：正确\n解析：如果不是夹角而是对角，则不能判定全等（SSA不能判定全等）。"},{"id":"g2_math_034_ex05","knowledge_id":"g2_math_034","question":"解答题：如图，已知AB=AD，∠BAC=∠DAC，求证：△ABC ≌ △ADC。","answer":"答案：证明：在△ABC和△ADC中\nAB=AD（已知）\n∠BAC=∠DAC（已知）\nAC=AC（公共边）\n∴ △ABC ≌ △ADC（SAS）\n解析：AB和AC的夹角是∠BAC，AD和AC的夹角是∠DAC，符合SAS。"},{"id":"g2_math_034_ex06","knowledge_id":"g2_math_034","question":"选择题：用SAS判定两个三角形全等，需要知道（  ）\nA. 三条边对应相等\nB. 两条边和它们的夹角对应相等\nC. 两条边和其中一边的对角对应相等\nD. 三个角对应相等","answer":"答案：B\n解析：SAS即边角边，需要两条边和它们的夹角对应相等。"},{"id":"g2_math_034_ex07","knowledge_id":"g2_math_034","question":"填空题：SAS的全称是______。","answer":"答案：边角边\n解析：SAS是Side-Angle-Side的缩写，即两边和夹角对应相等。"},{"id":"g2_math_034_ex08","knowledge_id":"g2_math_034","question":"判断题：两边和其中一边的对角对应相等，可以判定两个三角形全等。","answer":"答案：错误\n解析：这是SSA，不能判定全等。必须是两边的夹角才行。"},{"id":"g2_math_034_ex09","knowledge_id":"g2_math_034","question":"解答题：已知△ABC中，AB=8cm，AC=10cm，∠A=45°，△DEF中，DE=8cm，DF=10cm，∠D=45°，求证△ABC ≌ △DEF。","answer":"答案：证明：在△ABC和△DEF中\nAB=DE=8cm（已知）\n∠A=∠D=45°（已知）\nAC=DF=10cm（已知）\n∴ △ABC ≌ △DEF（SAS）\n解析：AB和AC的夹角是∠A，DE和DF的夹角是∠D，符合SAS。"},{"id":"g2_math_034_ex10","knowledge_id":"g2_math_034","question":"选择题：下列说法正确的是（  ）\nA. SAS和SSA都能判定全等\nB. SAS中的角可以是任意角\nC. SAS需要两边和夹角对应相等\nD. SAS只适用于直角三角形","answer":"答案：C\n解析：SAS需要两条边和它们之间的夹角对应相等。"},{"id":"g2_math_035_ex01","knowledge_id":"g2_math_035","question":"选择题：下列各组条件中，能判定△ABC ≌ △DEF的是（  ）\nA. ∠A=∠D, ∠B=∠E, AB=DE\nB. ∠A=∠D, ∠B=∠E, BC=EF\nC. AB=DE, BC=EF, ∠A=∠D\nD. ∠A=∠D, ∠B=∠E, ∠C=∠F","answer":"答案：A\n解析：A选项是两角和它们的夹边对应相等（ASA），可以判定全等。"},{"id":"g2_math_035_ex02","knowledge_id":"g2_math_035","question":"填空题：如果两个三角形的两角和它们的______分别对应相等，那么这两个三角形全等（ASA）。","answer":"答案：夹边\n解析：ASA判定定理：两角和它们的夹边对应相等的两个三角形全等。"},{"id":"g2_math_035_ex03","knowledge_id":"g2_math_035","question":"选择题：在△ABC和△DEF中，∠A=∠D=50°，∠B=∠E=60°，AB=DE=7cm，则△ABC与△DEF（  ）\nA. 不全等\nB. 全等\nC. 面积相等但不全等\nD. 无法确定","answer":"答案：B\n解析：两角和夹边对应相等，符合ASA判定定理。"},{"id":"g2_math_035_ex04","knowledge_id":"g2_math_035","question":"判断题：ASA中的边必须是两角的夹边。","answer":"答案：正确\n解析：ASA即角边角，边必须在两个角之间。"},{"id":"g2_math_035_ex05","knowledge_id":"g2_math_035","question":"解答题：如图，已知∠BAD=∠CAD，AD为公共边，∠ADB=∠ADC，求证：△ABD ≌ △ACD。","answer":"答案：证明：在△ABD和△ACD中\n∠BAD=∠CAD（已知）\nAD=AD（公共边）\n∠ADB=∠ADC（已知）\n∴ △ABD ≌ △ACD（ASA）\n解析：∠BAD和∠ADB的夹边是AD，∠CAD和∠ADC的夹边是AD，符合ASA。"},{"id":"g2_math_035_ex06","knowledge_id":"g2_math_035","question":"选择题：用ASA判定两个三角形全等，需要知道（  ）\nA. 三条边对应相等\nB. 两个角和它们的夹边对应相等\nC. 两个角和其中一角的对边对应相等\nD. 三条边对应相等","answer":"答案：B\n解析：ASA即角边角，需要两个角和它们的夹边对应相等。"},{"id":"g2_math_035_ex07","knowledge_id":"g2_math_035","question":"填空题：ASA的全称是______。","answer":"答案：角边角\n解析：ASA是Angle-Side-Angle的缩写，即两角和夹边对应相等。"},{"id":"g2_math_035_ex08","knowledge_id":"g2_math_035","question":"判断题：ASA和AAS是两种不同的全等判定方法。","answer":"答案：正确\n解析：ASA是两角和夹边，AAS是两角和其中一角的对边。"},{"id":"g2_math_035_ex09","knowledge_id":"g2_math_035","question":"解答题：已知△ABC中，∠A=70°，∠B=50°，AB=9cm，△DEF中，∠D=70°，∠E=50°，DE=9cm，求证△ABC ≌ △DEF。","answer":"答案：证明：在△ABC和△DEF中\n∠A=∠D=70°（已知）\nAB=DE=9cm（已知）\n∠B=∠E=50°（已知）\n∴ △ABC ≌ △DEF（ASA）\n解析：∠A和∠B的夹边是AB，∠D和∠E的夹边是DE，符合ASA。"},{"id":"g2_math_035_ex10","knowledge_id":"g2_math_035","question":"选择题：下列说法错误的是（  ）\nA. ASA可以判定三角形全等\nB. ASA需要两个角和夹边对应相等\nC. ASA中的边在两个角之间\nD. ASA只适用于等腰三角形","answer":"答案：D\n解析：ASA适用于所有三角形，不是只适用于等腰三角形。"},{"id":"g2_math_036_ex01","knowledge_id":"g2_math_036","question":"选择题：下列各组条件中，能判定△ABC ≌ △DEF的是（  ）\nA. ∠A=∠D, ∠B=∠E, AB=DE\nB. ∠A=∠D, ∠B=∠E, BC=EF\nC. AB=DE, BC=EF, ∠A=∠D\nD. ∠A=∠D, ∠B=∠E, ∠C=∠F","answer":"答案：B\n解析：B选项是两角和其中一角的对边对应相等（AAS），可以判定全等。"},{"id":"g2_math_036_ex02","knowledge_id":"g2_math_036","question":"填空题：如果两个三角形的两角和其中一角的______分别对应相等，那么这两个三角形全等（AAS）。","answer":"答案：对边\n解析：AAS判定定理：两角和其中一角的对边对应相等的两个三角形全等。"},{"id":"g2_math_036_ex03","knowledge_id":"g2_math_036","question":"选择题：在△ABC和△DEF中，∠A=∠D=50°，∠B=∠E=60°，BC=EF=8cm，则△ABC与△DEF（  ）\nA. 不全等\nB. 全等\nC. 面积相等但不全等\nD. 无法确定","answer":"答案：B\n解析：∠A和∠B对应∠D和∠E，BC是∠A的对边，EF是∠D的对边，符合AAS判定定理。"},{"id":"g2_math_036_ex04","knowledge_id":"g2_math_036","question":"判断题：AAS可以看作是ASA的推论。","answer":"答案：正确\n解析：因为三角形内角和是180°，已知两个角相等，第三个角也相等，所以AAS可以转化为ASA。"},{"id":"g2_math_036_ex05","knowledge_id":"g2_math_036","question":"解答题：如图，已知∠B=∠C，BD=CD，∠ADB=∠ADC，求证：△ABD ≌ △ACD。","answer":"答案：证明：在△ABD和△ACD中\n∠B=∠C（已知）\n∠ADB=∠ADC（已知）\nBD=CD（已知）\n∴ △ABD ≌ △ACD（AAS）\n解析：∠B和∠ADB的对边是AD，∠C和∠ADC的对边是AD，加上BD=CD，符合AAS。"},{"id":"g2_math_036_ex06","knowledge_id":"g2_math_036","question":"选择题：用AAS判定两个三角形全等，需要知道（  ）\nA. 三条边对应相等\nB. 两个角和它们的夹边对应相等\nC. 两个角和其中一角的对边对应相等\nD. 三个角对应相等","answer":"答案：C\n解析：AAS即角角边，需要两个角和其中一角的对边对应相等。"},{"id":"g2_math_036_ex07","knowledge_id":"g2_math_036","question":"填空题：AAS的全称是______。","answer":"答案：角角边\n解析：AAS是Angle-Angle-Side的缩写，即两角和其中一角的对边对应相等。"},{"id":"g2_math_036_ex08","knowledge_id":"g2_math_036","question":"判断题：AAS和ASA都能判定三角形全等。","answer":"答案：正确\n解析：两者都是常用的全等判定方法。"},{"id":"g2_math_036_ex09","knowledge_id":"g2_math_036","question":"解答题：已知△ABC中，∠A=70°，∠B=50°，BC=10cm，△DEF中，∠D=70°，∠E=50°，EF=10cm，求证△ABC ≌ △DEF。","answer":"答案：证明：在△ABC和△DEF中\n∠A=∠D=70°（已知）\n∠B=∠E=50°（已知）\nBC=EF=10cm（已知）\n∴ △ABC ≌ △DEF（AAS）\n解析：BC是∠A的对边，EF是∠D的对边，符合AAS。"},{"id":"g2_math_036_ex10","knowledge_id":"g2_math_036","question":"选择题：下列说法正确的是（  ）\nA. AAS和ASA是完全相同的方法\nB. AAS中的边是两个角的夹边\nC. AAS中的边是其中一个角的对边\nD. AAS不能判定全等","answer":"答案：C\n解析：AAS中的边是其中一个角的对边，而不是夹边。"},{"id":"g2_math_037_ex01","knowledge_id":"g2_math_037","question":"选择题：下列各组条件中，能判定两个直角三角形全等的是（  ）\nA. 两个锐角对应相等\nB. 一条直角边对应相等\nC. 斜边和一条直角边对应相等\nD. 两条直角边对应相等","answer":"答案：C\n解析：C选项是HL（斜边-直角边），可以判定直角三角形全等。D选项也可以（SAS），但题目问的是HL方法。"},{"id":"g2_math_037_ex02","knowledge_id":"g2_math_037","question":"填空题：如果两个直角三角形的______和______分别对应相等，那么这两个直角三角形全等（HL）。","answer":"答案：斜边，一条直角边\n解析：HL判定定理：斜边和一条直角边对应相等的两个直角三角形全等。"},{"id":"g2_math_037_ex03","knowledge_id":"g2_math_037","question":"选择题：在Rt△ABC和Rt△DEF中，∠C=∠F=90°，AB=DE=13cm，AC=DF=5cm，则△ABC与△DEF（  ）\nA. 不全等\nB. 全等\nC. 面积相等但不全等\nD. 无法确定","answer":"答案：B\n解析：斜边AB=DE，直角边AC=DF，符合HL判定定理。"},{"id":"g2_math_037_ex04","knowledge_id":"g2_math_037","question":"判断题：HL只适用于直角三角形。","answer":"答案：正确\n解析：HL是直角三角形特有的全等判定方法。"},{"id":"g2_math_037_ex05","knowledge_id":"g2_math_037","question":"解答题：如图，已知∠C=∠D=90°，AC=BD，求证：Rt△ABC ≌ Rt△BAD。","answer":"答案：证明：在Rt△ABC和Rt△BAD中\n∠C=∠D=90°（已知）\nAB=BA（公共边，斜边）\nAC=BD（已知，直角边）\n∴ Rt△ABC ≌ Rt△BAD（HL）\n解析：斜边AB=BA，直角边AC=BD，符合HL。"},{"id":"g2_math_037_ex06","knowledge_id":"g2_math_037","question":"选择题：用HL判定两个直角三角形全等，需要知道（  ）\nA. 三个角对应相等\nB. 斜边和一条直角边对应相等\nC. 两条直角边对应相等\nD. 三个边对应相等","answer":"答案：B\n解析：HL即斜边-直角边，需要斜边和一条直角边对应相等。"},{"id":"g2_math_037_ex07","knowledge_id":"g2_math_037","question":"填空题：HL的全称是______。","answer":"答案：斜边-直角边\n解析：HL是Hypotenuse-Leg的缩写。"},{"id":"g2_math_037_ex08","knowledge_id":"g2_math_037","question":"判断题：两个直角三角形，如果斜边相等，就一定全等。","answer":"答案：错误\n解析：还需要一条直角边对应相等（HL），只有斜边相等不能判定全等。"},{"id":"g2_math_037_ex09","knowledge_id":"g2_math_037","question":"解答题：已知Rt△ABC中，∠C=90°，AB=10cm，BC=6cm，Rt△DEF中，∠F=90°，DE=10cm，EF=6cm，求证Rt△ABC ≌ Rt△DEF。","answer":"答案：证明：在Rt△ABC和Rt△DEF中\n∠C=∠F=90°（已知）\nAB=DE=10cm（斜边相等）\nBC=EF=6cm（直角边相等）\n∴ Rt△ABC ≌ Rt△DEF（HL）\n解析：斜边和直角边对应相等，符合HL。"},{"id":"g2_math_037_ex10","knowledge_id":"g2_math_037","question":"选择题：下列说法正确的是（  ）\nA. HL可以用于任意三角形\nB. HL需要斜边和两条直角边对应相等\nC. HL是直角三角形特有的判定方法\nD. HL和SSS是完全相同的","answer":"答案：C\n解析：HL是直角三角形特有的全等判定方法。"},{"id":"g2_math_038_ex01","knowledge_id":"g2_math_038","question":"选择题：下列图形中，是轴对称图形的是（  ）\nA. 平行四边形\nB. 等腰三角形\nC. 直角三角形\nD. 不等边三角形","answer":"答案：B\n解析：\nA. 错误，一般平行四边形不是轴对称图形\nB. 正确，等腰三角形有1条对称轴\nC. 错误，一般直角三角形不是轴对称图形\nD. 错误，不等边三角形没有对称轴"},{"id":"g2_math_038_ex02","knowledge_id":"g2_math_038","question":"填空题：等边三角形有______条对称轴，正方形有______条对称轴。","answer":"答案：3，4\n解析：等边三角形有3条对称轴（每条边上的高所在直线都是对称轴），正方形有4条对称轴（两条对角线和两条中线）。"},{"id":"g2_math_038_ex03","knowledge_id":"g2_math_038","question":"选择题：下列关于轴对称图形的说法，正确的是（  ）\nA. 轴对称图形只有一条对称轴\nB. 轴对称图形的对称轴是一条射线\nC. 轴对称图形沿对称轴折叠后能完全重合\nD. 圆只有一条对称轴","answer":"答案：C\n解析：\nA. 错误，有的轴对称图形有多条对称轴，如正方形有4条\nB. 错误，对称轴是一条直线，不是射线\nC. 正确，这是轴对称图形的定义\nD. 错误，圆有无数条对称轴（每条直径所在直线都是对称轴）"},{"id":"g2_math_038_ex04","knowledge_id":"g2_math_038","question":"判断题：长方形有4条对称轴。","answer":"答案：错误\n解析：长方形只有2条对称轴（水平中线和垂直中线），正方形才有4条对称轴。"},{"id":"g2_math_038_ex05","knowledge_id":"g2_math_038","question":"解答题：请列举出5个常见的轴对称图形，并分别说明它们各有几条对称轴。","answer":"答案：\n1. 等腰三角形：1条对称轴（底边的高所在直线）\n2. 等边三角形：3条对称轴（每条边上的高所在直线）\n3. 长方形：2条对称轴（水平和垂直中线）\n4. 正方形：4条对称轴（两条对角线和两条中线）\n5. 圆：无数条对称轴（每条直径所在直线）\n解析：根据轴对称图形的定义，沿对称轴折叠后直线两旁的部分能完全重合。"},{"id":"g2_math_038_ex06","knowledge_id":"g2_math_038","question":"选择题：下列图形中，对称轴最多的是（  ）\nA. 等腰三角形\nB. 等边三角形\nC. 长方形\nD. 正方形","answer":"答案：D\n解析：等腰三角形1条，等边三角形3条，长方形2条，正方形4条，所以正方形对称轴最多。"},{"id":"g2_math_038_ex07","knowledge_id":"g2_math_038","question":"填空题：如果一个平面图形沿一条直线折叠，直线两旁的部分能够完全重合，那么这个图形叫做______，这条直线就是它的______。","answer":"答案：轴对称图形，对称轴\n解析：这是轴对称图形的定义。"},{"id":"g2_math_038_ex08","knowledge_id":"g2_math_038","question":"判断题：圆是轴对称图形，它的对称轴是直径。","answer":"答案：错误\n解析：圆是轴对称图形，但对称轴是直径所在的直线，而不是直径本身。对称轴是直线，不是线段。"},{"id":"g2_math_038_ex09","knowledge_id":"g2_math_038","question":"选择题：下列英文字母中，是轴对称图形的是（  ）\nA. S\nB. N\nC. A\nD. Z","answer":"答案：C\n解析：字母A沿竖直中线折叠后能完全重合，是轴对称图形。S、N、Z都是中心对称图形，不是轴对称图形。"},{"id":"g2_math_038_ex10","knowledge_id":"g2_math_038","question":"解答题：如图，已知点A和直线l，画出点A关于直线l的对称点A'，并说明画法。","answer":"答案：画法：\n1. 过点A作直线l的垂线，垂足为O\n2. 延长AO到A'，使OA' = AO\n3. 点A'就是点A关于直线l的对称点\n解析：根据轴对称的性质，对称轴是对应点连线的垂直平分线。"},{"id":"g2_math_039_ex01","knowledge_id":"g2_math_039","question":"选择题：线段垂直平分线上的点到这条线段两个端点的距离（  ）\nA. 相等\nB. 不相等\nC. 不一定相等\nD. 只有中点才相等","answer":"答案：A\n解析：线段垂直平分线上的点到这条线段两端点的距离相等，这是线段垂直平分线的性质定理。"},{"id":"g2_math_039_ex02","knowledge_id":"g2_math_039","question":"填空题：到一条线段两端点距离相等的点，在这条线段的______上。","answer":"答案：垂直平分线\n解析：这是线段垂直平分线的判定定理，与性质定理互为逆定理。"},{"id":"g2_math_039_ex03","knowledge_id":"g2_math_039","question":"选择题：如图，直线l是线段AB的垂直平分线，点P在l上，若PA=5cm，则PB的长度为（  ）\nA. 2.5cm\nB. 5cm\nC. 10cm\nD. 无法确定","answer":"答案：B\n解析：因为点P在AB的垂直平分线上，根据垂直平分线的性质，PA=PB=5cm。"},{"id":"g2_math_039_ex04","knowledge_id":"g2_math_039","question":"判断题：线段的垂直平分线是一条射线。","answer":"答案：错误\n解析：线段的垂直平分线是一条直线，它经过线段的中点并且垂直于这条线段。"},{"id":"g2_math_039_ex05","knowledge_id":"g2_math_039","question":"解答题：已知线段AB=8cm，点P是AB的垂直平分线上一点，PA=5cm，求PB的长度和△PAB的周长。","answer":"答案：PB=5cm，△PAB的周长为18cm\n解析：\n因为点P在AB的垂直平分线上\n所以PB=PA=5cm（垂直平分线上的点到线段两端距离相等）\n△PAB的周长 = PA + PB + AB = 5 + 5 + 8 = 18cm"},{"id":"g2_math_039_ex06","knowledge_id":"g2_math_039","question":"选择题：下列说法正确的是（  ）\nA. 线段有两条垂直平分线\nB. 线段的垂直平分线就是线段的中线\nC. 到线段两端距离相等的点有且只有一个\nD. 线段的垂直平分线可以看作到线段两端距离相等的所有点的集合","answer":"答案：D\n解析：\nA. 错误，一条线段只有一条垂直平分线\nB. 错误，中线是线段，垂直平分线是直线\nC. 错误，到线段两端距离相等的点有无数个，都在垂直平分线上\nD. 正确，这是线段垂直平分线的集合定义"},{"id":"g2_math_039_ex07","knowledge_id":"g2_math_039","question":"填空题：经过线段中点并且垂直于这条线段的直线，叫做这条线段的______。","answer":"答案：垂直平分线\n解析：这是线段垂直平分线的定义。"},{"id":"g2_math_039_ex08","knowledge_id":"g2_math_039","question":"判断题：如果PA=PB，那么点P一定是线段AB的中点。","answer":"答案：错误\n解析：PA=PB只能说明点P在AB的垂直平分线上，不一定是中点。垂直平分线上有无数个点。"},{"id":"g2_math_039_ex09","knowledge_id":"g2_math_039","question":"解答题：如图，在△ABC中，AB=AC，D是BC的中点。求证：AD垂直平分BC。","answer":"答案：证明：\n∵ D是BC的中点（已知）\n∴ BD=CD\n在△ABD和△ACD中\nAB=AC（已知）\nBD=CD（已证）\nAD=AD（公共边）\n∴ △ABD ≌ △ACD（SSS）\n∴ ∠ADB=∠ADC（全等三角形对应角相等）\n又∵ ∠ADB+∠ADC=180°（平角定义）\n∴ ∠ADB=∠ADC=90°\n∴ AD⊥BC\n又∵ BD=CD\n∴ AD垂直平分BC\n解析：先证三角形全等，再证垂直，最后得出垂直平分的结论。"},{"id":"g2_math_039_ex10","knowledge_id":"g2_math_039","question":"选择题：点P到△ABC的三个顶点距离相等，则点P是（  ）\nA. 三条角平分线的交点\nB. 三条中线的交点\nC. 三条高的交点\nD. 三边垂直平分线的交点","answer":"答案：D\n解析：到三角形三个顶点距离相等的点是三边垂直平分线的交点，也就是三角形的外心。"},{"id":"g2_math_040_ex01","knowledge_id":"g2_math_040","question":"选择题：等腰三角形的两个底角（  ）\nA. 相等\nB. 不相等\nC. 互补\nD. 互余","answer":"答案：A\n解析：等腰三角形的两个底角相等，简称\"等边对等角\"。"},{"id":"g2_math_040_ex02","knowledge_id":"g2_math_040","question":"填空题：等腰三角形的顶角平分线、底边上的中线、底边上的高互相______。","answer":"答案：重合\n解析：这是等腰三角形的\"三线合一\"性质。"},{"id":"g2_math_040_ex03","knowledge_id":"g2_math_040","question":"选择题：已知等腰三角形的顶角为70°，则它的底角为（  ）\nA. 35°\nB. 55°\nC. 70°\nD. 110°","answer":"答案：B\n解析：等腰三角形两底角相等，三角形内角和180°，所以底角 = (180° - 70°) ÷ 2 = 55°。"},{"id":"g2_math_040_ex04","knowledge_id":"g2_math_040","question":"判断题：等腰三角形的对称轴是底边上的高。","answer":"答案：错误\n解析：等腰三角形的对称轴是底边上的高所在的直线。对称轴是直线，而高是线段。"},{"id":"g2_math_040_ex05","knowledge_id":"g2_math_040","question":"解答题：已知等腰三角形的一个内角是80°，求其他两个内角的度数。","answer":"答案：分两种情况：\n情况1：80°是顶角，则底角 = (180° - 80°) ÷ 2 = 50°，另外两个角都是50°\n情况2：80°是底角，则另一个底角也是80°，顶角 = 180° - 80° × 2 = 20°，另外两个角是80°和20°\n解析：等腰三角形的两个底角相等，已知一个角需要分顶角和底角两种情况讨论。"},{"id":"g2_math_040_ex06","knowledge_id":"g2_math_040","question":"选择题：等腰三角形的两边长分别为3和7，则它的周长为（  ）\nA. 10\nB. 13\nC. 17\nD. 13或17","answer":"答案：C\n解析：分两种情况：\n情况1：3为腰，7为底，则三边为3, 3, 7，但3+3=6<7，不能构成三角形\n情况2：7为腰，3为底，则三边为7, 7, 3，7+7>3，能构成三角形，周长=7+7+3=17\n所以选C。"},{"id":"g2_math_040_ex07","knowledge_id":"g2_math_040","question":"填空题：在等腰三角形中，如果一个角是直角，那么另外两个角分别是______°和______°。","answer":"答案：45，45\n解析：等腰直角三角形中，直角是顶角，两个底角相等，各为45°。"},{"id":"g2_math_040_ex08","knowledge_id":"g2_math_040","question":"判断题：等腰三角形的底角一定是锐角。","answer":"答案：正确\n解析：如果底角是直角或钝角，那么两个底角之和就会等于或大于180°，不符合三角形内角和定理。所以等腰三角形的底角一定是锐角。"},{"id":"g2_math_040_ex09","knowledge_id":"g2_math_040","question":"解答题：如图，在△ABC中，AB=AC，点D在BC上，且AD=AE，∠BAD=30°，求∠EDC的度数。","answer":"答案：∠EDC = 15°\n解析：设∠B=∠C=x（等边对等角），∠ADE=∠AED=y（等边对等角）\n∠AED = ∠C + ∠EDC = x + ∠EDC（外角等于不相邻两内角之和）\n所以 y = x + ∠EDC ...(1)\n∠ADC = ∠B + ∠BAD = x + 30°（外角等于不相邻两内角之和）\n又 ∠ADC = ∠ADE + ∠EDC = y + ∠EDC ...(2)\n由(1)(2)得：x + 30° = x + ∠EDC + ∠EDC\n30° = 2∠EDC\n∠EDC = 15°"},{"id":"g2_math_040_ex10","knowledge_id":"g2_math_040","question":"选择题：下列说法错误的是（  ）\nA. 等腰三角形是轴对称图形\nB. 等腰三角形的两个底角相等\nC. 等腰三角形的三条高都在三角形内部\nD. 等腰三角形顶角的平分线平分底边","answer":"答案：C\n解析：\nA. 正确，等腰三角形有1条对称轴\nB. 正确，等边对等角\nC. 错误，钝角等腰三角形有两条高在外部\nD. 正确，三线合一，顶角平分线也是底边上的中线"},{"id":"g2_math_041_ex01","knowledge_id":"g2_math_041","question":"选择题：等边三角形的三个内角（  ）\nA. 都相等，且等于60°\nB. 都相等，但不一定等于60°\nC. 不一定相等\nD. 有两个相等","answer":"答案：A\n解析：等边三角形的三个内角都相等，且每个角都等于60°。"},{"id":"g2_math_041_ex02","knowledge_id":"g2_math_041","question":"填空题：等边三角形有______条对称轴。","answer":"答案：3\n解析：等边三角形每条边上的高所在的直线都是它的对称轴，共有3条对称轴。"},{"id":"g2_math_041_ex03","knowledge_id":"g2_math_041","question":"选择题：等边三角形的边长为6cm，则它的周长为（  ）\nA. 12cm\nB. 15cm\nC. 18cm\nD. 24cm","answer":"答案：C\n解析：等边三角形三边相等，周长 = 6 × 3 = 18cm。"},{"id":"g2_math_041_ex04","knowledge_id":"g2_math_041","question":"判断题：等边三角形是特殊的等腰三角形。","answer":"答案：正确\n解析：等边三角形满足等腰三角形的定义（有两条边相等），并且三条边都相等，所以是特殊的等腰三角形。"},{"id":"g2_math_041_ex05","knowledge_id":"g2_math_041","question":"解答题：如图，△ABC是等边三角形，AD是BC边上的高，AB=6cm，求BD、AD的长度和∠BAD的度数。","answer":"答案：BD=3cm，AD=3√3cm，∠BAD=30°\n解析：\n∵ △ABC是等边三角形\n∴ AB=BC=AC=6cm，∠B=∠BAC=60°\n∵ AD是BC边上的高\n∴ BD = BC/2 = 3cm（三线合一）\n∠BAD = ∠BAC/2 = 30°（三线合一）\n在Rt△ABD中，由勾股定理：\nAD² + BD² = AB²\nAD² + 9 = 36\nAD² = 27\nAD = 3√3 cm"},{"id":"g2_math_041_ex06","knowledge_id":"g2_math_041","question":"选择题：下列说法正确的是（  ）\nA. 有一个角是60°的三角形是等边三角形\nB. 有两个角是60°的三角形是等边三角形\nC. 等腰三角形一定是等边三角形\nD. 等边三角形的高都不相等","answer":"答案：B\n解析：\nA. 错误，需要有一个角是60°的等腰三角形才是等边三角形\nB. 正确，有两个角是60°，第三个角也是60°，三个角都相等，是等边三角形\nC. 错误，等腰三角形不一定是等边三角形\nD. 错误，等边三角形的三条高都相等"},{"id":"g2_math_041_ex07","knowledge_id":"g2_math_041","question":"填空题：等边三角形的三个内角都等于______°。","answer":"答案：60\n解析：三角形内角和180°，三个角相等，所以每个角 = 180° ÷ 3 = 60°。"},{"id":"g2_math_041_ex08","knowledge_id":"g2_math_041","question":"判断题：等边三角形每条边上都存在\"三线合一\"。","answer":"答案：正确\n解析：等边三角形每条边上的高、中线和对角的平分线都互相重合，即每条边上都存在三线合一。"},{"id":"g2_math_041_ex09","knowledge_id":"g2_math_041","question":"解答题：如图，△ABC和△CDE都是等边三角形，点B、C、D在同一直线上，连接BE、AD。求证：BE=AD。","answer":"答案：证明：\n∵ △ABC和△CDE都是等边三角形\n∴ AC=BC，CD=CE，∠ACB=∠DCE=60°（等边三角形性质）\n∴ ∠ACB + ∠ACE = ∠DCE + ∠ACE（等式性质）\n即 ∠BCE = ∠ACD\n在△BCE和△ACD中\nBC=AC（已证）\n∠BCE=∠ACD（已证）\nCE=CD（已证）\n∴ △BCE ≌ △ACD（SAS）\n∴ BE=AD（全等三角形对应边相等）\n解析：利用等边三角形的性质证明三角形全等，从而得出对应边相等。"},{"id":"g2_math_041_ex10","knowledge_id":"g2_math_041","question":"选择题：等边三角形的高为3√3，则它的边长为（  ）\nA. 3\nB. 4\nC. 6\nD. 9","answer":"答案：C\n解析：设边长为x，则高把等边三角形分成两个直角三角形，底边为x/2\n由勾股定理：(x/2)² + (3√3)² = x²\nx²/4 + 27 = x²\n3x²/4 = 27\nx² = 36\nx = 6（取正值）"},{"id":"g2_math_042_ex01","knowledge_id":"g2_math_042","question":"选择题：计算 a³ · a² 的结果是（  ）\nA. a⁵\nB. a⁶\nC. a⁹\nD. 2a⁵","answer":"答案：A\n解析：同底数幂相乘，底数不变，指数相加。a³ · a² = a³⁺² = a⁵。"},{"id":"g2_math_042_ex02","knowledge_id":"g2_math_042","question":"填空题：同底数幂相乘，底数______，指数______。","answer":"答案：不变，相加\n解析：这是同底数幂的乘法法则：aᵐ · aⁿ = aᵐ⁺ⁿ（m, n是正整数）。"},{"id":"g2_math_042_ex03","knowledge_id":"g2_math_042","question":"选择题：下列计算正确的是（  ）\nA. x² · x³ = x⁶\nB. x² · x² = 2x²\nC. x³ + x³ = x⁶\nD. x³ · x² = x⁵","answer":"答案：D\n解析：\nA. 错误，x² · x³ = x²⁺³ = x⁵ ≠ x⁶\nB. 错误，x² · x² = x⁴ ≠ 2x²\nC. 错误，x³ + x³ = 2x³ ≠ x⁶（这是合并同类项，不是同底数幂乘法）\nD. 正确，x³ · x² = x³⁺² = x⁵"},{"id":"g2_math_042_ex04","knowledge_id":"g2_math_042","question":"判断题：a³ · a⁴ = a¹²。","answer":"答案：错误\n解析：同底数幂相乘，指数应该相加，不是相乘。a³ · a⁴ = a³⁺⁴ = a⁷ ≠ a¹²。"},{"id":"g2_math_042_ex05","knowledge_id":"g2_math_042","question":"解答题：计算下列各式：\n(1) 10³ × 10⁴\n(2) (-2)² × (-2)³\n(3) a · a³ · a⁵","answer":"答案：\n(1) 10³ × 10⁴ = 10³⁺⁴ = 10⁷\n(2) (-2)² × (-2)³ = (-2)²⁺³ = (-2)⁵ = -32\n(3) a · a³ · a⁵ = a¹⁺³⁺⁵ = a⁹\n解析：同底数幂相乘，底数不变，指数相加。推广到三个或更多同底数幂相乘也适用。"},{"id":"g2_math_042_ex06","knowledge_id":"g2_math_042","question":"选择题：若 aᵐ = 3，aⁿ = 4，则 aᵐ⁺ⁿ 的值为（  ）\nA. 7\nB. 12\nC. 3⁴\nD. 4³","answer":"答案：B\n解析：aᵐ⁺ⁿ = aᵐ · aⁿ = 3 × 4 = 12。这是同底数幂乘法法则的逆用。"},{"id":"g2_math_042_ex07","knowledge_id":"g2_math_042","question":"填空题：若 2ˣ = 8，则 x = ______。","answer":"答案：3\n解析：8 = 2³，所以 2ˣ = 2³，x = 3。"},{"id":"g2_math_042_ex08","knowledge_id":"g2_math_042","question":"判断题：a + a = a²。","answer":"答案：错误\n解析：a + a = 2a，这是合并同类项，不是同底数幂的乘法。a · a = a² 才是对的。"},{"id":"g2_math_042_ex09","knowledge_id":"g2_math_042","question":"解答题：已知 2ˣ = 3，2ʸ = 5，求 2ˣ⁺ʸ 的值。","answer":"答案：2ˣ⁺ʸ = 15\n解析：根据同底数幂乘法法则的逆用：\n2ˣ⁺ʸ = 2ˣ · 2ʸ = 3 × 5 = 15"},{"id":"g2_math_042_ex10","knowledge_id":"g2_math_042","question":"选择题：下列各式中，不能用同底数幂乘法法则计算的是（  ）\nA. a² · a³\nB. (-x)² · (-x)³\nC. (a+b)² · (a+b)³\nD. x² · y³","answer":"答案：D\n解析：同底数幂乘法要求底数相同。A中底数都是a，B中底数都是(-x)，C中底数都是(a+b)，D中底数不同（x和y），所以不能用同底数幂乘法法则。"},{"id":"g2_math_043_ex01","knowledge_id":"g2_math_043","question":"选择题：计算 (a³)² 的结果是（  ）\nA. a⁵\nB. a⁶\nC. a⁸\nD. a⁹","answer":"答案：B\n解析：幂的乘方，底数不变，指数相乘。(a³)² = a³ˣ² = a⁶。"},{"id":"g2_math_043_ex02","knowledge_id":"g2_math_043","question":"填空题：幂的乘方，底数______，指数______。","answer":"答案：不变，相乘\n解析：这是幂的乘方法则：(aᵐ)ⁿ = aᵐⁿ。"},{"id":"g2_math_043_ex03","knowledge_id":"g2_math_043","question":"选择题：计算 (ab)³ 的结果是（  ）\nA. ab³\nB. a³b\nC. a³b³\nD. 3ab","answer":"答案：C\n解析：积的乘方，把积的每一个因式分别乘方，再把所得的幂相乘。(ab)³ = a³b³。"},{"id":"g2_math_043_ex04","knowledge_id":"g2_math_043","question":"判断题：(a²)³ = a⁵。","answer":"答案：错误\n解析：幂的乘方，指数应该相乘，不是相加。(a²)³ = a²ˣ³ = a⁶ ≠ a⁵。"},{"id":"g2_math_043_ex05","knowledge_id":"g2_math_043","question":"解答题：计算下列各式：\n(1) (10²)³\n(2) (-2xy)³\n(3) (a²)³ · (a³)²","answer":"答案：\n(1) (10²)³ = 10²ˣ³ = 10⁶\n(2) (-2xy)³ = (-2)³ · x³ · y³ = -8x³y³\n(3) (a²)³ · (a³)² = a⁶ · a⁶ = a¹²\n解析：(1)(2)直接用幂的乘方和积的乘方法则；(3)先用幂的乘方，再用同底数幂的乘法。"},{"id":"g2_math_043_ex06","knowledge_id":"g2_math_043","question":"选择题：下列计算正确的是（  ）\nA. (a³)² = a⁵\nB. (ab)² = ab²\nC. (-x²)³ = -x⁶\nD. (2a)³ = 6a³","answer":"答案：C\n解析：\nA. 错误，(a³)² = a⁶ ≠ a⁵\nB. 错误，(ab)² = a²b² ≠ ab²\nC. 正确，(-x²)³ = (-1)³ · (x²)³ = -x⁶\nD. 错误，(2a)³ = 8a³ ≠ 6a³"},{"id":"g2_math_043_ex07","knowledge_id":"g2_math_043","question":"填空题：积的乘方，等于把积的每一个因式分别______，再把所得的幂______。","answer":"答案：乘方，相乘\n解析：这是积的乘方法则：(ab)ⁿ = aⁿbⁿ。"},{"id":"g2_math_043_ex08","knowledge_id":"g2_math_043","question":"判断题：(x + y)² = x² + y²。","answer":"答案：错误\n解析：(x + y)² 不是积的乘方，不能直接用积的乘方法则。正确的展开是 x² + 2xy + y²（完全平方公式）。"},{"id":"g2_math_043_ex09","knowledge_id":"g2_math_043","question":"解答题：用简便方法计算：\n(1) 0.125⁸ × 8⁸\n(2) (-0.25)²⁰²⁴ × 4²⁰²⁴","answer":"答案：\n(1) 0.125⁸ × 8⁸ = (0.125 × 8)⁸ = 1⁸ = 1\n(2) (-0.25)²⁰²⁴ × 4²⁰²⁴ = [(-0.25) × 4]²⁰²⁴ = (-1)²⁰²⁴ = 1\n解析：积的乘方法则的逆用：aⁿbⁿ = (ab)ⁿ。当两个幂的指数相同时，可以先把底数相乘。"},{"id":"g2_math_043_ex10","knowledge_id":"g2_math_043","question":"选择题：若 aⁿ = 2，bⁿ = 3，则 (ab)³ⁿ 的值为（  ）\nA. 6\nB. 18\nC. 36\nD. 216","answer":"答案：D\n解析：\n(ab)³ⁿ = a³ⁿ · b³ⁿ = (aⁿ)³ · (bⁿ)³ = 2³ × 3³ = 8 × 27 = 216"},{"id":"g2_math_044_ex01","knowledge_id":"g2_math_044","question":"选择题：计算 a⁵ ÷ a² 的结果是（  ）\nA. a³\nB. a²·⁵\nC. a⁷\nD. a¹⁰","answer":"答案：A\n解析：同底数幂相除，底数不变，指数相减。a⁵ ÷ a² = a⁵⁻² = a³。"},{"id":"g2_math_044_ex02","knowledge_id":"g2_math_044","question":"填空题：同底数幂相除，底数______，指数______。","answer":"答案：不变，相减\n解析：这是同底数幂的除法法则：aᵐ ÷ aⁿ = aᵐ⁻ⁿ（a ≠ 0，m > n）。"},{"id":"g2_math_044_ex03","knowledge_id":"g2_math_044","question":"选择题：下列计算正确的是（  ）\nA. a⁶ ÷ a² = a³\nB. a⁴ ÷ a = a⁴\nC. a³ ÷ a³ = 0\nD. (-x)⁵ ÷ (-x)³ = x²","answer":"答案：D\n解析：\nA. 错误，a⁶ ÷ a² = a⁴ ≠ a³\nB. 错误，a⁴ ÷ a = a³ ≠ a⁴\nC. 错误，a³ ÷ a³ = a⁰ = 1 ≠ 0\nD. 正确，(-x)⁵ ÷ (-x)³ = (-x)² = x²"},{"id":"g2_math_044_ex04","knowledge_id":"g2_math_044","question":"判断题：任何数的零次幂都等于1。","answer":"答案：错误\n解析：零指数幂的前提是底数不为零。a⁰ = 1（a ≠ 0），0的0次幂没有意义。"},{"id":"g2_math_044_ex05","knowledge_id":"g2_math_044","question":"解答题：计算下列各式：\n(1) 10⁸ ÷ 10⁵\n(2) (-a)⁷ ÷ (-a)⁴\n(3) (2x)⁵ ÷ (2x)³","answer":"答案：\n(1) 10⁸ ÷ 10⁵ = 10⁸⁻⁵ = 10³ = 1000\n(2) (-a)⁷ ÷ (-a)⁴ = (-a)⁷⁻⁴ = (-a)³ = -a³\n(3) (2x)⁵ ÷ (2x)³ = (2x)⁵⁻³ = (2x)² = 4x²\n解析：同底数幂相除，底数不变，指数相减。注意底数可以是单项式或多项式。"},{"id":"g2_math_044_ex06","knowledge_id":"g2_math_044","question":"选择题：计算 3⁰ + 2⁻¹ 的结果是（  ）\nA. 0\nB. 1\nC. 3/2\nD. 2","answer":"答案：C\n解析：3⁰ = 1（零指数幂），2⁻¹ = 1/2（负指数幂），所以 3⁰ + 2⁻¹ = 1 + 1/2 = 3/2。"},{"id":"g2_math_044_ex07","knowledge_id":"g2_math_044","question":"填空题：a⁰ = ______（a ≠ 0）；a⁻ⁿ = ______（a ≠ 0）。","answer":"答案：1，1/aⁿ\n解析：零指数幂：任何非零数的0次幂都等于1。\n负指数幂：任何非零数的-n次幂等于这个数的n次幂的倒数。"},{"id":"g2_math_044_ex08","knowledge_id":"g2_math_044","question":"判断题：a⁻² = -a²。","answer":"答案：错误\n解析：负指数幂表示倒数，不是负数。a⁻² = 1/a² ≠ -a²。"},{"id":"g2_math_044_ex09","knowledge_id":"g2_math_044","question":"解答题：用科学记数法表示下列各数：\n(1) 0.000012\n(2) 0.0000000314","answer":"答案：\n(1) 0.000012 = 1.2 × 10⁻⁵\n(2) 0.0000000314 = 3.14 × 10⁻⁸\n解析：用科学记数法表示绝对值小于1的数，形式为a × 10⁻ⁿ，其中1 ≤ a < 10，n是正整数，等于原数左边第一个非零数字前所有零的个数。"},{"id":"g2_math_044_ex10","knowledge_id":"g2_math_044","question":"选择题：若 aᵐ = 5，aⁿ = 2，则 aᵐ⁻ⁿ 的值为（  ）\nA. 3\nB. 10\nC. 5/2\nD. 2/5","answer":"答案：C\n解析：同底数幂除法法则的逆用：aᵐ⁻ⁿ = aᵐ ÷ aⁿ = 5 ÷ 2 = 5/2。"},{"id":"g2_math_045_ex01","knowledge_id":"g2_math_045","question":"选择题：计算 3x² · 2x³ 的结果是（  ）\nA. 5x⁵\nB. 6x⁵\nC. 6x⁶\nD. 5x⁶","answer":"答案：B\n解析：单项式乘单项式，系数相乘，同底数幂相乘。3x² · 2x³ = (3×2) · (x²·x³) = 6x⁵。"},{"id":"g2_math_045_ex02","knowledge_id":"g2_math_045","question":"填空题：单项式与多项式相乘，就是用单项式去乘多项式的______，再把所得的积______。","answer":"答案：每一项，相加\n解析：这是单项式乘多项式的法则：m(a+b+c) = ma + mb + mc。"},{"id":"g2_math_045_ex03","knowledge_id":"g2_math_045","question":"选择题：计算 (x + 2)(x + 3) 的结果是（  ）\nA. x² + 5x + 6\nB. x² + 6x + 6\nC. x² + 5x + 5\nD. x² + 6","answer":"答案：A\n解析：多项式乘多项式，用一个多项式的每一项乘另一个多项式的每一项：\n(x + 2)(x + 3) = x·x + x·3 + 2·x + 2·3 = x² + 3x + 2x + 6 = x² + 5x + 6。"},{"id":"g2_math_045_ex04","knowledge_id":"g2_math_045","question":"判断题：3a · 2a = 5a。","answer":"答案：错误\n解析：单项式乘单项式，系数相乘，同底数幂相乘。3a · 2a = (3×2)·(a·a) = 6a² ≠ 5a。"},{"id":"g2_math_045_ex05","knowledge_id":"g2_math_045","question":"解答题：计算下列各式：\n(1) 2x(x² - 3x + 1)\n(2) (a + 3)(a - 2)\n(3) (2x + 1)(x - 3)","answer":"答案：\n(1) 2x(x² - 3x + 1) = 2x·x² - 2x·3x + 2x·1 = 2x³ - 6x² + 2x\n(2) (a + 3)(a - 2) = a·a - a·2 + 3·a - 3·2 = a² - 2a + 3a - 6 = a² + a - 6\n(3) (2x + 1)(x - 3) = 2x·x - 2x·3 + 1·x - 1·3 = 2x² - 6x + x - 3 = 2x² - 5x - 3\n解析：(1)单项式乘多项式，用分配律展开；(2)(3)多项式乘多项式，逐项相乘后合并同类项。"},{"id":"g2_math_045_ex06","knowledge_id":"g2_math_045","question":"选择题：若 (x + 2)(x - 1) = x² + mx + n，则 m + n 的值为（  ）\nA. 1\nB. -1\nC. 3\nD. -3","answer":"答案：B\n解析：先展开左边：(x + 2)(x - 1) = x² - x + 2x - 2 = x² + x - 2\n与右边 x² + mx + n 比较，得 m = 1，n = -2\n所以 m + n = 1 + (-2) = -1。"},{"id":"g2_math_045_ex07","knowledge_id":"g2_math_045","question":"填空题：多项式与多项式相乘，先用一个多项式的______乘另一个多项式的______，再把所得的积______。","answer":"答案：每一项，每一项，相加\n解析：这是多项式乘多项式的法则：(a+b)(c+d) = ac + ad + bc + bd。"},{"id":"g2_math_045_ex08","knowledge_id":"g2_math_045","question":"判断题：(x + y)² = x² + y²。","answer":"答案：错误\n解析：(x + y)² = (x + y)(x + y) = x² + xy + xy + y² = x² + 2xy + y² ≠ x² + y²。少了交叉项 2xy。"},{"id":"g2_math_045_ex09","knowledge_id":"g2_math_045","question":"解答题：先化简，再求值：\n(x + 3)(x - 2) - x(x - 1)，其中 x = 4。","answer":"答案：化简结果为 2x - 6，当 x = 4 时，值为 2\n解析：\n(x + 3)(x - 2) - x(x - 1)\n= (x² - 2x + 3x - 6) - (x² - x)\n= x² + x - 6 - x² + x\n= 2x - 6\n当 x = 4 时，原式 = 2×4 - 6 = 8 - 6 = 2"},{"id":"g2_math_045_ex10","knowledge_id":"g2_math_045","question":"选择题：计算 (3x - 2y)(2x + 3y) 的结果是（  ）\nA. 6x² + 5xy - 6y²\nB. 6x² - 5xy - 6y²\nC. 6x² + 5xy + 6y²\nD. 6x² - 5xy + 6y²","answer":"答案：A\n解析：\n(3x - 2y)(2x + 3y)\n= 3x·2x + 3x·3y - 2y·2x - 2y·3y\n= 6x² + 9xy - 4xy - 6y²\n= 6x² + 5xy - 6y²"},{"id":"g2_math_046_ex01","knowledge_id":"g2_math_046","question":"选择题：计算 (x + 3)(x - 3) 的结果是（  ）\nA. x² - 9\nB. x² - 6\nC. x² + 9\nD. x² + 6","answer":"答案：A\n解析：平方差公式：(a + b)(a - b) = a² - b²。所以 (x + 3)(x - 3) = x² - 3² = x² - 9。"},{"id":"g2_math_046_ex02","knowledge_id":"g2_math_046","question":"填空题：(a + b)(a - b) = ______。","answer":"答案：a² - b²\n解析：这是平方差公式：两个数的和与这两个数的差的积，等于这两个数的平方差。"},{"id":"g2_math_046_ex03","knowledge_id":"g2_math_046","question":"选择题：下列各式中，能用平方差公式计算的是（  ）\nA. (x + y)(x + y)\nB. (x - y)(y - x)\nC. (x + 2)(x - 3)\nD. (a + b)(a - b)","answer":"答案：D\n解析：\nA. 不能，这是完全平方公式\nB. 不能，(x - y)(y - x) = -(x - y)²\nC. 不能，两项不完全相同\nD. 能，符合(a + b)(a - b)的形式"},{"id":"g2_math_046_ex04","knowledge_id":"g2_math_046","question":"判断题：(a + b)(a - b) = a² - b² 中，a 和 b 只能是单项式。","answer":"答案：错误\n解析：平方差公式中的 a 和 b 可以是单项式，也可以是多项式。只要符合\"两数和乘两数差\"的形式就可以用。"},{"id":"g2_math_046_ex05","knowledge_id":"g2_math_046","question":"解答题：利用平方差公式计算：\n(1) 102 × 98\n(2) (2x + y)(2x - y)\n(3) (-m + n)(-m - n)","answer":"答案：\n(1) 102 × 98 = (100 + 2)(100 - 2) = 100² - 2² = 10000 - 4 = 9996\n(2) (2x + y)(2x - y) = (2x)² - y² = 4x² - y²\n(3) (-m + n)(-m - n) = (-m)² - n² = m² - n²\n解析：(1)把102写成100+2，98写成100-2，用平方差公式简化计算；\n(2)直接用公式；(3)注意(-m)是相同项，n和-n是相反项。"},{"id":"g2_math_046_ex06","knowledge_id":"g2_math_046","question":"选择题：若 x² - y² = 12，x + y = 4，则 x - y 的值为（  ）\nA. 2\nB. 3\nC. 4\nD. 8","answer":"答案：B\n解析：x² - y² = (x + y)(x - y) = 12，已知 x + y = 4，所以 4(x - y) = 12，x - y = 3。"},{"id":"g2_math_046_ex07","knowledge_id":"g2_math_046","question":"填空题：平方差公式的特点是：左边是两个二项式相乘，这两个二项式中有一项______，另一项______；右边是乘式中两项的平方差。","answer":"答案：完全相同，互为相反数\n解析：这是平方差公式的结构特征：(相同项 + 相反项)(相同项 - 相反项) = 相同项² - 相反项²。"},{"id":"g2_math_046_ex08","knowledge_id":"g2_math_046","question":"判断题：(a + b)(-a - b) = a² - b²。","answer":"答案：错误\n解析：(a + b)(-a - b) = -(a + b)(a + b) = -(a + b)²，不符合平方差公式的形式。平方差公式需要一项相同，一项相反。"},{"id":"g2_math_046_ex09","knowledge_id":"g2_math_046","question":"解答题：先化简，再求值：\n(2x + 3)(2x - 3) - 4x(x - 1)，其中 x = 2。","answer":"答案：化简结果为 4x - 9，当 x = 2 时，值为 -1\n解析：\n(2x + 3)(2x - 3) - 4x(x - 1)\n= (4x² - 9) - (4x² - 4x)\n= 4x² - 9 - 4x² + 4x\n= 4x - 9\n当 x = 2 时，原式 = 4×2 - 9 = 8 - 9 = -1"},{"id":"g2_math_046_ex10","knowledge_id":"g2_math_046","question":"选择题：计算 (a - 2b)(-a - 2b) 的结果是（  ）\nA. a² - 4b²\nB. -a² + 4b²\nC. -a² - 4b²\nD. a² + 4b²","answer":"答案：B\n解析：(a - 2b)(-a - 2b) = (-2b + a)(-2b - a) = (-2b)² - a² = 4b² - a² = -a² + 4b²。这里相同项是 -2b，相反项是 a 和 -a。"},{"id":"g2_math_047_ex01","knowledge_id":"g2_math_047","question":"选择题：计算 (x + 2)² 的结果是（  ）\nA. x² + 4\nB. x² + 2x + 4\nC. x² + 4x + 4\nD. x² - 4x + 4","answer":"答案：C\n解析：完全平方公式：(a + b)² = a² + 2ab + b²。所以 (x + 2)² = x² + 2·x·2 + 2² = x² + 4x + 4。"},{"id":"g2_math_047_ex02","knowledge_id":"g2_math_047","question":"填空题：(a + b)² = ______；(a - b)² = ______。","answer":"答案：a² + 2ab + b²，a² - 2ab + b²\n解析：这是完全平方公式：两数和（或差）的平方，等于它们的平方和，加上（或减去）它们的积的2倍。"},{"id":"g2_math_047_ex03","knowledge_id":"g2_math_047","question":"选择题：下列计算正确的是（  ）\nA. (x - y)² = x² - y²\nB. (x + y)² = x² + y²\nC. (x - 3)² = x² - 6x + 9\nD. (x + 1)² = x² + x + 1","answer":"答案：C\n解析：\nA. 错误，(x - y)² = x² - 2xy + y² ≠ x² - y²\nB. 错误，(x + y)² = x² + 2xy + y² ≠ x² + y²\nC. 正确，(x - 3)² = x² - 2·x·3 + 3² = x² - 6x + 9\nD. 错误，(x + 1)² = x² + 2x + 1 ≠ x² + x + 1"},{"id":"g2_math_047_ex04","knowledge_id":"g2_math_047","question":"判断题：(a - b)² = a² - b²。","answer":"答案：错误\n解析：(a - b)² = a² - 2ab + b²，这是完全平方公式。a² - b² 是平方差公式，两者不要混淆。"},{"id":"g2_math_047_ex05","knowledge_id":"g2_math_047","question":"解答题：利用完全平方公式计算：\n(1) 99²\n(2) (2x - y)²\n(3) (m + n)² - (m - n)²","answer":"答案：\n(1) 99² = (100 - 1)² = 100² - 2×100×1 + 1² = 10000 - 200 + 1 = 9801\n(2) (2x - y)² = (2x)² - 2·2x·y + y² = 4x² - 4xy + y²\n(3) (m + n)² - (m - n)² = (m² + 2mn + n²) - (m² - 2mn + n²) = 4mn\n解析：(1)把99写成100-1，用完全平方公式简化计算；\n(2)直接用公式；(3)分别展开后相减。"},{"id":"g2_math_047_ex06","knowledge_id":"g2_math_047","question":"选择题：若 x² + kx + 9 是完全平方式，则 k 的值为（  ）\nA. 6\nB. -6\nC. ±6\nD. ±3","answer":"答案：C\n解析：x² + kx + 9 = x² + kx + 3²，根据完全平方公式 (a ± b)² = a² ± 2ab + b²，\n这里 a = x，b = 3，所以 kx = ±2·x·3 = ±6x，因此 k = ±6。"},{"id":"g2_math_047_ex07","knowledge_id":"g2_math_047","question":"填空题：完全平方公式的特点是：左边是一个二项式的______，右边是二次三项式，其中两项是二项式中每一项的______，中间一项是二项式中两项乘积的______。","answer":"答案：平方，平方，2倍\n解析：(a ± b)² = a² ± 2ab + b²，首平方，尾平方，积的2倍在中央。"},{"id":"g2_math_047_ex08","knowledge_id":"g2_math_047","question":"判断题：(a + b)² = a² + b²。","answer":"答案：错误\n解析：(a + b)² = a² + 2ab + b²，中间项 2ab 不能少。可以用几何意义理解：边长为(a+b)的正方形面积，不等于两个小正方形面积之和。"},{"id":"g2_math_047_ex09","knowledge_id":"g2_math_047","question":"解答题：已知 a + b = 5，ab = 6，求 a² + b² 的值。","answer":"答案：a² + b² = 13\n解析：由完全平方公式 (a + b)² = a² + 2ab + b²，\n得 a² + b² = (a + b)² - 2ab = 5² - 2×6 = 25 - 12 = 13。"},{"id":"g2_math_047_ex10","knowledge_id":"g2_math_047","question":"选择题：计算 (x + 2y - 1)² 的结果是（  ）\nA. x² + 4y² + 1\nB. x² + 4y² + 4xy - 2x - 4y + 1\nC. x² + 4y² + 4xy + 1\nD. x² + 4y² - 4xy - 2x + 4y + 1","answer":"答案：B\n解析：把 (x + 2y) 看作一个整体：\n(x + 2y - 1)² = [(x + 2y) - 1]² = (x + 2y)² - 2(x + 2y) + 1\n= x² + 4xy + 4y² - 2x - 4y + 1"},{"id":"g2_math_048_ex01","knowledge_id":"g2_math_048","question":"选择题：下列从左到右的变形，是因式分解的是（  ）\nA. a(x + y) = ax + ay\nB. x² - 4x + 4 = x(x - 4) + 4\nC. x² - 16 = (x + 4)(x - 4)\nD. x² + 1 = x(x + 1/x)","answer":"答案：C\n解析：因式分解是把一个多项式化为几个整式的积的形式。\nA. 是整式乘法，不是因式分解\nB. 右边不是积的形式\nC. 是因式分解（平方差公式）\nD. 右边含有分式，不是整式"},{"id":"g2_math_048_ex02","knowledge_id":"g2_math_048","question":"填空题：因式分解的常用方法有______和______。","answer":"答案：提公因式法，公式法\n解析：初中阶段因式分解的常用方法：1.提公因式法；2.公式法（平方差公式、完全平方公式）。"},{"id":"g2_math_048_ex03","knowledge_id":"g2_math_048","question":"选择题：把多项式 3x² - 6x 分解因式，结果正确的是（  ）\nA. 3x(x - 2)\nB. 3(x² - 2x)\nC. x(3x - 6)\nD. 3x²(1 - 2/x)","answer":"答案：A\n解析：提公因式 3x：3x² - 6x = 3x·x - 3x·2 = 3x(x - 2)。\nB和C没有分解到最简，D出现了分式。"},{"id":"g2_math_048_ex04","knowledge_id":"g2_math_048","question":"判断题：x² - y² = (x + y)(x - y) 是因式分解。","answer":"答案：正确\n解析：左边是多项式，右边是两个整式的积，符合因式分解的定义，这是用平方差公式进行因式分解。"},{"id":"g2_math_048_ex05","knowledge_id":"g2_math_048","question":"解答题：把下列各式分解因式：\n(1) 2a²b + 4ab²\n(2) x² - 25\n(3) x² + 6x + 9","answer":"答案：\n(1) 2a²b + 4ab² = 2ab(a + 2b)（提公因式法）\n(2) x² - 25 = x² - 5² = (x + 5)(x - 5)（平方差公式）\n(3) x² + 6x + 9 = x² + 2·x·3 + 3² = (x + 3)²（完全平方公式）\n解析：(1)先找公因式2ab，再提取；(2)符合平方差形式；(3)符合完全平方形式。"},{"id":"g2_math_048_ex06","knowledge_id":"g2_math_048","question":"选择题：多项式 a² - 4a + 4 分解因式的结果是（  ）\nA. a(a - 4) + 4\nB. (a - 2)²\nC. (a + 2)²\nD. (a - 2)(a + 2)","answer":"答案：B\n解析：a² - 4a + 4 = a² - 2·a·2 + 2² = (a - 2)²，这是完全平方公式。"},{"id":"g2_math_048_ex07","knowledge_id":"g2_math_048","question":"填空题：因式分解的一般步骤：先______，再______，直到不能再分解为止。","answer":"答案：提公因式，用公式\n解析：因式分解的一般步骤：一提（提公因式）、二套（套公式）、三检查（检查是否分解彻底）。"},{"id":"g2_math_048_ex08","knowledge_id":"g2_math_048","question":"判断题：x² + 4 可以用平方差公式分解因式。","answer":"答案：错误\n解析：平方差公式是 a² - b²，需要是两数的平方差，而 x² + 4 是平方和，不能用平方差公式分解。在实数范围内不能分解。"},{"id":"g2_math_048_ex09","knowledge_id":"g2_math_048","question":"解答题：把下列各式分解因式：\n(1) 3x³ - 12x\n(2) (x + y)² - 4(x + y) + 4","answer":"答案：\n(1) 3x³ - 12x = 3x(x² - 4) = 3x(x + 2)(x - 2)\n    （先提公因式3x，再用平方差公式）\n(2) (x + y)² - 4(x + y) + 4\n    把(x+y)看作整体，设A = x + y\n    原式 = A² - 4A + 4 = (A - 2)² = (x + y - 2)²\n    （用完全平方公式）\n解析：(1)分解因式要分解到不能再分解为止；(2)整体思想的应用。"},{"id":"g2_math_048_ex10","knowledge_id":"g2_math_048","question":"选择题：把多项式 x² - y² - 2y - 1 分解因式，结果正确的是（  ）\nA. (x + y + 1)(x - y - 1)\nB. (x + y - 1)(x - y - 1)\nC. (x + y + 1)(x - y + 1)\nD. (x + y - 1)(x + y + 1)","answer":"答案：A\n解析：x² - y² - 2y - 1 = x² - (y² + 2y + 1) = x² - (y + 1)² = (x + y + 1)(x - y - 1)\n先分组，把后三项看成一个整体，用完全平方公式，再用平方差公式。"},{"id":"g2_math_049_ex01","knowledge_id":"g2_math_049","question":"选择题：下列式子中，是分式的是（  ）\nA. x/2\nB. (x + y)/π\nC. 3/(x + 1)\nD. x² + 1","answer":"答案：C\n解析：分式的定义：如果A、B表示两个整式，并且B中含有字母，那么式子A/B叫做分式。\nA. 分母是2，不含字母，是整式\nB. 分母是π，π是常数，不是字母，是整式\nC. 分母含有字母x，是分式\nD. 没有分母，是整式"},{"id":"g2_math_049_ex02","knowledge_id":"g2_math_049","question":"填空题：分式有意义的条件是______；分式的值为零的条件是______。","answer":"答案：分母不为零，分子为零且分母不为零\n解析：分式A/B中，B≠0时分式有意义；A=0且B≠0时分式的值为0。"},{"id":"g2_math_049_ex03","knowledge_id":"g2_math_049","question":"选择题：分式 1/(x - 2) 有意义的条件是（  ）\nA. x ≠ 0\nB. x ≠ 2\nC. x > 2\nD. x < 2","answer":"答案：B\n解析：分式有意义的条件是分母不为零。x - 2 ≠ 0，即 x ≠ 2。"},{"id":"g2_math_049_ex04","knowledge_id":"g2_math_049","question":"判断题：分母含有字母的式子叫做分式。","answer":"答案：错误\n解析：分式的定义是：如果A、B表示两个整式，并且B中含有字母，那么式子A/B叫做分式。前提是A和B都是整式。"},{"id":"g2_math_049_ex05","knowledge_id":"g2_math_049","question":"解答题：当x为何值时，下列分式有意义？\n(1) 2/(x - 3)\n(2) (x + 1)/(x² - 1)\n(3) x/(x² + 1)","answer":"答案：\n(1) 分母 x - 3 ≠ 0，即 x ≠ 3 时分式有意义\n(2) 分母 x² - 1 ≠ 0，即 x² ≠ 1，x ≠ ±1 时分式有意义\n(3) 分母 x² + 1，因为 x² ≥ 0，所以 x² + 1 ≥ 1 > 0，x为任意实数时分式都有意义\n解析：分式有意义的条件是分母不为零，解出使分母为零的x值，排除这些值即可。"},{"id":"g2_math_049_ex06","knowledge_id":"g2_math_049","question":"选择题：若分式 (x - 2)/(x + 1) 的值为0，则x的值为（  ）\nA. 2\nB. -1\nC. 2或-1\nD. 0","answer":"答案：A\n解析：分式值为0的条件：分子为0且分母不为0。\n分子 x - 2 = 0，得 x = 2\n分母 x + 1 ≠ 0，得 x ≠ -1\n所以 x = 2。"},{"id":"g2_math_049_ex07","knowledge_id":"g2_math_049","question":"填空题：一般地，如果A、B表示两个整式，并且B中含有______，那么式子A/B叫做______。","answer":"答案：字母，分式\n解析：这是分式的定义。"},{"id":"g2_math_049_ex08","knowledge_id":"g2_math_049","question":"判断题：分式的分子为零时，分式的值为零。","answer":"答案：错误\n解析：分式的值为零需要同时满足两个条件：分子为零，且分母不为零。如果分母也为零，分式无意义，不能说值为零。"},{"id":"g2_math_049_ex09","knowledge_id":"g2_math_049","question":"解答题：当x为何值时，分式 (x² - 4)/(x + 2) 的值为0？","answer":"答案：x = 2 时分式的值为0\n解析：分式值为0的条件：分子为0且分母不为0。\n分子 x² - 4 = 0，即 (x + 2)(x - 2) = 0，得 x = 2 或 x = -2\n分母 x + 2 ≠ 0，得 x ≠ -2\n所以 x = 2（x = -2时分母为0，分式无意义，舍去）。"},{"id":"g2_math_049_ex10","knowledge_id":"g2_math_049","question":"选择题：下列说法正确的是（  ）\nA. 整式和分式统称为有理式\nB. 分母中含有字母的式子是分式\nC. 分式的分子可以为零，分母也可以为零\nD. 分数是分式","answer":"答案：A\n解析：\nA. 正确，有理式包括整式和分式\nB. 错误，分子分母都必须是整式\nC. 错误，分母不能为零\nD. 错误，分数的分母是常数，不是字母，所以是整式不是分式"},{"id":"g2_math_050_ex01","knowledge_id":"g2_math_050","question":"选择题：下列等式成立的是（  ）\nA. b/a = b²/a²\nB. b/a = (b + c)/(a + c)\nC. b/a = bc/ac (c ≠ 0)\nD. b/a = (b - c)/(a - c)","answer":"答案：C\n解析：分式的基本性质：分式的分子与分母同乘（或除以）一个不为0的整式，分式的值不变。\nA. 错误，分子分母乘的不是同一个整式\nB. 错误，分子分母同加一个数，分式的值一般会变\nC. 正确，分子分母同乘c（c≠0），符合分式基本性质\nD. 错误，分子分母同减一个数，分式的值一般会变"},{"id":"g2_math_050_ex02","knowledge_id":"g2_math_050","question":"填空题：分式的分子与分母同乘（或除以）一个______的整式，分式的值______。","answer":"答案：不为0，不变\n解析：这是分式的基本性质。注意：所乘（或除以）的整式不能为0。"},{"id":"g2_math_050_ex03","knowledge_id":"g2_math_050","question":"选择题：把分式 2x/(x + y) 中的x和y都扩大为原来的2倍，则分式的值（  ）\nA. 扩大为原来的2倍\nB. 缩小为原来的1/2\nC. 不变\nD. 扩大为原来的4倍","answer":"答案：C\n解析：x和y都扩大为原来的2倍，即变为2x和2y。\n代入得：2·(2x)/(2x + 2y) = 4x/[2(x + y)] = 2x/(x + y)\n分式的值不变。"},{"id":"g2_math_050_ex04","knowledge_id":"g2_math_050","question":"判断题：分式的分子和分母都乘以同一个数，分式的值不变。","answer":"答案：错误\n解析：分式的基本性质中，所乘的数（或整式）不能为0。如果乘以0，分式就没有意义了。"},{"id":"g2_math_050_ex05","knowledge_id":"g2_math_050","question":"解答题：约分：\n(1) 12xy/18x²\n(2) (x² - 4)/(x + 2)\n(3) (a² + 2a + 1)/(a² - 1)","answer":"答案：\n(1) 12xy/18x² = (6x · 2y)/(6x · 3x) = 2y/(3x)\n(2) (x² - 4)/(x + 2) = [(x + 2)(x - 2)]/(x + 2) = x - 2（x ≠ -2）\n(3) (a² + 2a + 1)/(a² - 1) = (a + 1)²/[(a + 1)(a - 1)] = (a + 1)/(a - 1)（a ≠ ±1）\n解析：约分就是把分式的分子和分母的公因式约去，约分时要先分解因式。"},{"id":"g2_math_050_ex06","knowledge_id":"g2_math_050","question":"选择题：分式 1/(2a²b) 和 1/(3ab²) 的最简公分母是（  ）\nA. 6a²b²\nB. 6ab\nC. a²b²\nD. ab","answer":"答案：A\n解析：最简公分母：取各分母系数的最小公倍数，相同字母取最高次幂。\n系数：2和3的最小公倍数是6\n字母a：最高次幂是a²\n字母b：最高次幂是b²\n所以最简公分母是 6a²b²。"},{"id":"g2_math_050_ex07","knowledge_id":"g2_math_050","question":"填空题：分式的基本性质是分式______、______、______的依据。","answer":"答案：约分，通分，分式运算\n解析：分式的基本性质是分式变形的基础，约分、通分、分式的运算都要用到它。"},{"id":"g2_math_050_ex08","knowledge_id":"g2_math_050","question":"判断题：约分的结果一定是整式。","answer":"答案：错误\n解析：约分的结果可能是整式，也可能还是分式。例如 2y/3x 约分后仍然是分式。约分后分子分母没有公因式的分式叫做最简分式。"},{"id":"g2_math_050_ex09","knowledge_id":"g2_math_050","question":"解答题：通分：\n(1) 1/(2x) 和 1/(3y)\n(2) 1/(x² - y²) 和 1/(x + y)","answer":"答案：\n(1) 最简公分母是 6xy\n    1/(2x) = 3y/(6xy)\n    1/(3y) = 2x/(6xy)\n(2) 先分解因式：x² - y² = (x + y)(x - y)\n    最简公分母是 (x + y)(x - y)\n    1/(x² - y²) = 1/[(x + y)(x - y)]\n    1/(x + y) = (x - y)/[(x + y)(x - y)]\n解析：通分的关键是确定最简公分母，然后利用分式的基本性质把各分式化为同分母分式。"},{"id":"g2_math_050_ex10","knowledge_id":"g2_math_050","question":"选择题：下列变形正确的是（  ）\nA. (a - b)/(a + b) = (b - a)/(a + b)\nB. (-a + b)/(a + b) = (a + b)/(a - b)\nC. (-x - y)/(-x + y) = (x + y)/(x + y)\nD. (-x + y)/(-x - y) = (x - y)/(x + y)","answer":"答案：D\n解析：\nA. 错误，只改变了分子的符号，分母没变，分式值变号了\nB. 错误，分子分母都变了，不是简单的符号变化\nC. 错误，分子分母变号后分母应该是x - y，不是x + y\nD. 正确：(-x + y)/(-x - y) = [-(x - y)]/[-(x + y)] = (x - y)/(x + y)\n（分子分母同时变号，分式的值不变）"},{"id":"g2_math_051_ex01","knowledge_id":"g2_math_051","question":"选择题：计算 (2/x) · (x/3) 的结果是（  ）\nA. 2x/3\nB. 2/3x\nC. 2/3\nD. 3/2","answer":"答案：C\n解析：分式乘分式，用分子的积作为积的分子，分母的积作为积的分母。\n(2/x) · (x/3) = (2 · x)/(x · 3) = 2x/(3x) = 2/3（约分）"},{"id":"g2_math_051_ex02","knowledge_id":"g2_math_051","question":"填空题：分式乘分式，用______作为积的分子，______作为积的分母。","answer":"答案：分子的积，分母的积\n解析：这是分式乘法法则：a/b · c/d = ac/bd。"},{"id":"g2_math_051_ex03","knowledge_id":"g2_math_051","question":"选择题：计算 (3/x) ÷ (6/x²) 的结果是（  ）\nA. 2/x\nB. x/2\nC. 2x\nD. 18/x³","answer":"答案：B\n解析：分式除以分式，把除式的分子分母颠倒位置后，与被除式相乘。\n(3/x) ÷ (6/x²) = (3/x) · (x²/6) = (3 · x²)/(x · 6) = 3x²/(6x) = x/2"},{"id":"g2_math_051_ex04","knowledge_id":"g2_math_051","question":"判断题：分式除法中，除式的分子分母要颠倒位置。","answer":"答案：正确\n解析：分式除以分式，把除式的分子分母颠倒位置后，与被除式相乘。即 a/b ÷ c/d = a/b · d/c = ad/bc。"},{"id":"g2_math_051_ex05","knowledge_id":"g2_math_051","question":"解答题：计算：\n(1) (4a²b/3cd²) · (5c²d/4ab²)\n(2) (x² - 4)/(x + 3) · (x + 3)/(x + 2)\n(3) (2x²y/3mn²) ÷ (4xy²/9m²n)","answer":"答案：\n(1) (4a²b/3cd²) · (5c²d/4ab²)\n    = (4a²b · 5c²d)/(3cd² · 4ab²)\n    = (20a²bc²d)/(12ab²cd²)\n    = 5ac/(6bd)\n(2) (x² - 4)/(x + 3) · (x + 3)/(x + 2)\n    = [(x + 2)(x - 2)]/(x + 3) · (x + 3)/(x + 2)\n    = x - 2\n(3) (2x²y/3mn²) ÷ (4xy²/9m²n)\n    = (2x²y/3mn²) · (9m²n/4xy²)\n    = (2x²y · 9m²n)/(3mn² · 4xy²)\n    = 18x²ym²n/(12mxy²n²)\n    = 3xm/(2yn)\n解析：分式乘除法，先把除法转化为乘法，然后约分。有多项式的先分解因式。"},{"id":"g2_math_051_ex06","knowledge_id":"g2_math_051","question":"选择题：计算 (a/b)² 的结果是（  ）\nA. a²/b\nB. a/b²\nC. a²/b²\nD. 2a/2b","answer":"答案：C\n解析：分式的乘方：把分子分母分别乘方。(a/b)² = a²/b²。"},{"id":"g2_math_051_ex07","knowledge_id":"g2_math_051","question":"填空题：分式除以分式，把除式的______颠倒位置后，与被除式______。","answer":"答案：分子分母，相乘\n解析：这是分式除法法则：a/b ÷ c/d = a/b · d/c = ad/bc。"},{"id":"g2_math_051_ex08","knowledge_id":"g2_math_051","question":"判断题：分式乘法的结果一定是分式。","answer":"答案：错误\n解析：分式乘法的结果可能是整式。例如 (2/x) · (x/3) = 2/3，结果是整式（分数）。"},{"id":"g2_math_051_ex09","knowledge_id":"g2_math_051","question":"解答题：先化简，再求值：\n[(x² - y²)/(x² + 2xy + y²)] · [x/(x - y)]，其中x = 3，y = 2。","answer":"答案：化简结果为 x/(x + y)，当x = 3，y = 2时，值为 3/5\n解析：\n[(x² - y²)/(x² + 2xy + y²)] · [x/(x - y)]\n= [(x + y)(x - y)]/(x + y)² · x/(x - y)\n= [(x + y)(x - y) · x] / [(x + y)² · (x - y)]\n= x/(x + y)\n当x = 3，y = 2时，原式 = 3/(3 + 2) = 3/5"},{"id":"g2_math_051_ex10","knowledge_id":"g2_math_051","question":"选择题：计算 (-a/b)³ 的结果是（  ）\nA. -a³/b³\nB. -a³/b\nC. a³/b³\nD. -3a/3b","answer":"答案：A\n解析：分式的乘方：分子分母分别乘方，注意符号。(-a/b)³ = (-a)³/b³ = -a³/b³。"},{"id":"g2_math_052_ex01","knowledge_id":"g2_math_052","question":"选择题：计算 1/x + 2/x 的结果是（  ）\nA. 3/(2x)\nB. 3/x\nC. 3/x²\nD. 2/x²","answer":"答案：B\n解析：同分母分式相加减，分母不变，分子相加减。\n1/x + 2/x = (1 + 2)/x = 3/x"},{"id":"g2_math_052_ex02","knowledge_id":"g2_math_052","question":"填空题：同分母分式相加减，______不变，______相加减。","answer":"答案：分母，分子\n解析：这是同分母分式加减法法则：a/c ± b/c = (a ± b)/c。"},{"id":"g2_math_052_ex03","knowledge_id":"g2_math_052","question":"选择题：计算 1/a + 1/b 的结果是（  ）\nA. 2/(a + b)\nB. 1/(ab)\nC. (a + b)/(ab)\nD. (b + a)/(a + b)","answer":"答案：C\n解析：异分母分式相加减，先通分，化为同分母分式，再加减。\n1/a + 1/b = b/(ab) + a/(ab) = (a + b)/(ab)"},{"id":"g2_math_052_ex04","knowledge_id":"g2_math_052","question":"判断题：异分母分式相加减，分子分母分别相加减。","answer":"答案：错误\n解析：异分母分式相加减，要先通分，化为同分母分式，然后分母不变，分子相加减。不能直接分子分母分别相加减。"},{"id":"g2_math_052_ex05","knowledge_id":"g2_math_052","question":"解答题：计算：\n(1) 3/(x - 1) - 1/(x - 1)\n(2) 1/(x² - 4) + 1/(x + 2)\n(3) a/(a - b) + b²/(a(b - a))","answer":"答案：\n(1) 3/(x - 1) - 1/(x - 1) = (3 - 1)/(x - 1) = 2/(x - 1)\n(2) 先通分，最简公分母是(x + 2)(x - 2)\n    1/(x² - 4) + 1/(x + 2)\n    = 1/[(x + 2)(x - 2)] + (x - 2)/[(x + 2)(x - 2)]\n    = [1 + (x - 2)] / [(x + 2)(x - 2)]\n    = (x - 1) / [(x + 2)(x - 2)]\n(3) 注意 b - a = -(a - b)\n    a/(a - b) + b²/(a(b - a))\n    = a/(a - b) - b²/[a(a - b)]\n    = a²/[a(a - b)] - b²/[a(a - b)]\n    = (a² - b²)/[a(a - b)]\n    = [(a + b)(a - b)]/[a(a - b)]\n    = (a + b)/a\n解析：(1)同分母直接加减；(2)(3)异分母先通分再加减，注意分解因式和约分。"},{"id":"g2_math_052_ex06","knowledge_id":"g2_math_052","question":"选择题：化简 1/(x - 1) - 1/(x + 1) 的结果是（  ）\nA. 2/(x² - 1)\nB. 2x/(x² - 1)\nC. -2/(x² - 1)\nD. -2x/(x² - 1)","answer":"答案：A\n解析：最简公分母是(x - 1)(x + 1) = x² - 1\n1/(x - 1) - 1/(x + 1)\n= (x + 1)/(x² - 1) - (x - 1)/(x² - 1)\n= [(x + 1) - (x - 1)]/(x² - 1)\n= (x + 1 - x + 1)/(x² - 1)\n= 2/(x² - 1)"},{"id":"g2_math_052_ex07","knowledge_id":"g2_math_052","question":"填空题：异分母分式相加减，先______，变为______分式，再加减。","answer":"答案：通分，同分母\n解析：这是异分母分式加减法的法则，关键是通分。"},{"id":"g2_math_052_ex08","knowledge_id":"g2_math_052","question":"判断题：分式加减的结果一定是最简分式。","answer":"答案：错误\n解析：分式加减的结果需要约分化为最简分式，但计算过程中的中间结果不一定是最简的。最终结果要化成最简分式或整式。"},{"id":"g2_math_052_ex09","knowledge_id":"g2_math_052","question":"解答题：先化简，再求值：\n(1 + 1/(x - 1)) · (x² - 1)/x，其中x = 3。","answer":"答案：化简结果为 x + 1，当x = 3时，值为 4\n解析：\n(1 + 1/(x - 1)) · (x² - 1)/x\n= [(x - 1)/(x - 1) + 1/(x - 1)] · [(x + 1)(x - 1)]/x\n= [(x - 1 + 1)/(x - 1)] · [(x + 1)(x - 1)]/x\n= [x/(x - 1)] · [(x + 1)(x - 1)]/x\n= x + 1\n当x = 3时，原式 = 3 + 1 = 4"},{"id":"g2_math_052_ex10","knowledge_id":"g2_math_052","question":"选择题：计算 a/b - b/a - (a² + b²)/(ab) 的结果是（  ）\nA. 0\nB. -2b/a\nC. -2a/b\nD. 2b/a","answer":"答案：B\n解析：最简公分母是ab\na/b - b/a - (a² + b²)/(ab)\n= a²/(ab) - b²/(ab) - (a² + b²)/(ab)\n= [a² - b² - (a² + b²)]/(ab)\n= [a² - b² - a² - b²]/(ab)\n= (-2b²)/(ab)\n= -2b/a"},{"id":"g2_math_053_ex01","knowledge_id":"g2_math_053","question":"选择题：下列方程中，是分式方程的是（  ）\nA. x/2 + 1 = 3\nB. (x + 1)/2 = 5\nC. 1/x + 1 = 0\nD. x² - 1 = 0","answer":"答案：C\n解析：分式方程的定义：分母中含有未知数的方程叫做分式方程。\nA. 分母是常数，是整式方程\nB. 分母是常数，是整式方程\nC. 分母含有未知数x，是分式方程\nD. 没有分母，是整式方程"},{"id":"g2_math_053_ex02","knowledge_id":"g2_math_053","question":"填空题：解分式方程的一般步骤是：(1)去分母；(2)解整式方程；(3)______。","answer":"答案：验根\n解析：解分式方程必须验根，因为去分母可能产生增根。检验方法是将整式方程的根代入最简公分母，使分母为0的根是增根，要舍去。"},{"id":"g2_math_053_ex03","knowledge_id":"g2_math_053","question":"选择题：分式方程 2/x = 3/(x + 1) 的解是（  ）\nA. x = 2\nB. x = 1\nC. x = -2\nD. x = -1","answer":"答案：A\n解析：去分母，两边同乘x(x + 1)得：\n2(x + 1) = 3x\n2x + 2 = 3x\nx = 2\n检验：当x = 2时，x(x + 1) = 2×3 = 6 ≠ 0\n所以x = 2是原方程的解。"},{"id":"g2_math_053_ex04","knowledge_id":"g2_math_053","question":"判断题：解分式方程时，去分母后所得整式方程的解就是原分式方程的解。","answer":"答案：错误\n解析：去分母可能产生增根（使分母为0的根），所以解分式方程必须验根。只有使最简公分母不为0的根才是原方程的解。"},{"id":"g2_math_053_ex05","knowledge_id":"g2_math_053","question":"解答题：解下列分式方程：\n(1) 1/x = 2/(x + 3)\n(2) (x - 1)/(x - 2) + 2 = 3/(2 - x)","answer":"答案：\n(1) 1/x = 2/(x + 3)\n    去分母，两边同乘x(x + 3)：\n    x + 3 = 2x\n    x = 3\n    检验：当x = 3时，x(x + 3) = 3×6 = 18 ≠ 0\n    所以x = 3是原方程的解。\n(2) (x - 1)/(x - 2) + 2 = 3/(2 - x)\n    注意2 - x = -(x - 2)，方程变形为：\n    (x - 1)/(x - 2) + 2 = -3/(x - 2)\n    去分母，两边同乘(x - 2)：\n    x - 1 + 2(x - 2) = -3\n    x - 1 + 2x - 4 = -3\n    3x - 5 = -3\n    3x = 2\n    x = 2/3\n    检验：当x = 2/3时，x - 2 = 2/3 - 2 = -4/3 ≠ 0\n    所以x = 2/3是原方程的解。\n解析：解分式方程的步骤：去分母→解整式方程→验根。注意符号问题。"},{"id":"g2_math_053_ex06","knowledge_id":"g2_math_053","question":"选择题：若分式方程 1/(x - 2) + m/(x - 2) = 0 有增根，则m的值为（  ）\nA. 1\nB. -1\nC. 0\nD. 2","answer":"答案：B\n解析：增根是使分母为0的根，即x = 2。\n去分母得：1 + m = 0，m = -1\n当m = -1时，方程变为1/(x-2) - 1/(x-2) = 0，即0=0，但x=2时分母为0，是增根。\n所以m = -1。"},{"id":"g2_math_053_ex07","knowledge_id":"g2_math_053","question":"填空题：分母中含有______的方程叫做分式方程。解分式方程必须______。","answer":"答案：未知数，验根\n解析：这是分式方程的定义和解分式方程的注意事项。"},{"id":"g2_math_053_ex08","knowledge_id":"g2_math_053","question":"判断题：分式方程的增根也是方程的根。","answer":"答案：错误\n解析：增根是去分母后整式方程的根，但它使原分式方程的分母为0，分式无意义，所以增根不是原分式方程的根。"},{"id":"g2_math_053_ex09","knowledge_id":"g2_math_053","question":"解答题：甲、乙两地相距360千米，一辆货车从甲地开往乙地，速度为x千米/时，返回时速度比去时快20千米/时，返回时比去时少用1小时。求货车去时的速度。（列分式方程求解）","answer":"答案：货车去时的速度为80千米/时\n解析：设货车去时的速度为x千米/时，则返回时速度为(x + 20)千米/时。\n根据题意，去时时间 - 返回时间 = 1小时\n列方程：360/x - 360/(x + 20) = 1\n去分母，两边同乘x(x + 20)：\n360(x + 20) - 360x = x(x + 20)\n360x + 7200 - 360x = x² + 20x\n7200 = x² + 20x\nx² + 20x - 7200 = 0\n(x + 90)(x - 80) = 0\n解得 x = -90（舍去，速度不能为负）或 x = 80\n检验：x = 80时，x(x + 20) = 80×100 = 8000 ≠ 0\n所以x = 80是原方程的解。\n答：货车去时的速度为80千米/时。"},{"id":"g2_math_053_ex10","knowledge_id":"g2_math_053","question":"选择题：关于x的方程 2/(x - 1) + a/(1 - x) = 1 的解是正数，则a的取值范围是（  ）\nA. a < 3\nB. a < 3且a ≠ 2\nC. a > 3\nD. a > 3且a ≠ 2","answer":"答案：B\n解析：方程变形为：2/(x - 1) - a/(x - 1) = 1\n去分母：2 - a = x - 1\nx = 3 - a\n因为解是正数，所以 3 - a > 0，a < 3\n又因为分母不能为0，即 x ≠ 1，所以 3 - a ≠ 1，a ≠ 2\n所以 a < 3 且 a ≠ 2。"}];
        const HAS_EXAMPLES = true;

        // 错题本管理器
        const WrongBookManager = {
            STORAGE_KEY_PREFIX: 'wrongbook_',
            getWrongBook(grade, subject) {
                const key = this.STORAGE_KEY_PREFIX + grade + '_' + subject;
                return JSON.parse(localStorage.getItem(key) || '[]');
            },
            addWrongBook(item) {
                const key = this.STORAGE_KEY_PREFIX + item.grade + '_' + item.subject;
                let wrongBook = this.getWrongBook(item.grade, item.subject);
                const exists = wrongBook.some(w => w.question === item.question);
                if (exists) return false;
                wrongBook.push({...item, id: item.knowledgeId + '_' + Date.now(), addedAt: new Date().toISOString()});
                localStorage.setItem(key, JSON.stringify(wrongBook));
                return true;
            }
        };

        // 学习进度管理器
        const ProgressManager = {
            STORAGE_KEY: 'study_progress',
            
            getProgress() {
                try {
                    return JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
                } catch(e) {
                    return {};
                }
            },
            
            saveProgress(progress) {
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(progress));
            },
            
            recordStudy(grade, subject, subjectName, semester, semesterName, knowledgeId, knowledgeName) {
                const progress = this.getProgress();
                const now = new Date().toISOString();
                const today = new Date().toISOString().split('T')[0];
                
                if (!progress.learnedKnowledge) progress.learnedKnowledge = {};
                if (!progress.dailyStats) progress.dailyStats = {};
                if (!progress.dailyStats[today]) {
                    progress.dailyStats[today] = { learnedCount: 0, subjects: [] };
                }
                
                const isNew = !progress.learnedKnowledge[knowledgeId];
                progress.learnedKnowledge[knowledgeId] = { learnedAt: now };
                
                if (isNew) {
                    progress.dailyStats[today].learnedCount++;
                    if (!progress.dailyStats[today].subjects.includes(subject)) {
                        progress.dailyStats[today].subjects.push(subject);
                    }
                }
                
                progress.lastStudy = {
                    grade, subject, subjectName, semester, semesterName,
                    knowledgeId, knowledgeName, timestamp: now
                };
                
                this.saveProgress(progress);
            },
            
            isLearned(knowledgeId) {
                const progress = this.getProgress();
                return !!(progress.learnedKnowledge && progress.learnedKnowledge[knowledgeId]);
            },
            
            getLastStudy() {
                const progress = this.getProgress();
                return progress.lastStudy || null;
            },
            
            getSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                if (!progress.learnedKnowledge) return { learned: 0, total: 0, percent: 0 };
                const prefix = grade + '_' + subject + '_';
                const learned = Object.keys(progress.learnedKnowledge).filter(k => k.startsWith(prefix)).length;
                const total = DATA_KNOWLEDGE.length;
                const percent = total > 0 ? Math.round((learned / total) * 100) : 0;
                return { learned, total, percent };
            },
            
            clearSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                const prefix = grade + '_' + subject + '_';
                
                if (progress.learnedKnowledge) {
                    Object.keys(progress.learnedKnowledge).forEach(k => {
                        if (k.startsWith(prefix)) {
                            delete progress.learnedKnowledge[k];
                        }
                    });
                }
                
                if (progress.lastStudy && progress.lastStudy.grade === grade && progress.lastStudy.subject === subject) {
                    delete progress.lastStudy;
                }
                
                this.saveProgress(progress);
                return true;
            }
        };

        // URL参数解析
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                grade: 'g2',
                subject: 'math',
                semester: params.get('semester') || 'upper'
            };
        }

        const gradeNames = {'g1':'初一','g2':'初二','g3':'初三'};
        const subjectNames = {'math':'数学'};
        const semesterNames = {'upper':'上册','lower':'下册'};

        let currentParams = getUrlParams();
        let knowledgeList = [];
        let expandedIds = new Set();
        let currentExample = null;

        const pageTitle = document.getElementById('page-title');
        const pageSubtitle = document.getElementById('page-subtitle');
        const knowledgeListEl = document.getElementById('knowledge-list');
        const emptyStateEl = document.getElementById('empty-state');
        const searchResultsInfo = document.getElementById('search-results-info');
        const searchCountEl = document.getElementById('search-count');
        const searchInput = document.getElementById('search-input');

        function initPage() {
            const {grade, subject, semester} = currentParams;
            pageTitle.textContent = gradeNames[grade] + ' · ' + subjectNames[subject] + ' · ' + semesterNames[semester];
            loadKnowledge();
            updateProgressStat();
            
            const hash = window.location.hash.replace('#', '');
            if (hash && knowledgeList.some(k => k.id === hash)) {
                setTimeout(() => {
                    toggleExpand(hash);
                    const card = document.querySelector('[data-id="' + hash + '"]');
                    if (card) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
        }

        function updateProgressStat() {
            const {grade, subject} = currentParams;
            const learnedInSemester = knowledgeList.filter(k => ProgressManager.isLearned(k.id)).length;
            document.getElementById('progress-learned').textContent = learnedInSemester;
            document.getElementById('progress-total').textContent = knowledgeList.length;
        }

        function loadKnowledge() {
            const {grade, subject, semester} = currentParams;
            knowledgeList = DATA_KNOWLEDGE.filter(k => {
                return k.semester === semester;
            });
            renderKnowledgeList();
        }

        function renderKnowledgeList(items = knowledgeList) {
            if (items.length === 0) {
                knowledgeListEl.innerHTML = '';
                emptyStateEl.classList.remove('hidden');
                return;
            }
            emptyStateEl.classList.add('hidden');
            knowledgeListEl.innerHTML = items.map(item => {
                const isExpanded = expandedIds.has(item.id);
                const isLearned = ProgressManager.isLearned(item.id);
                return '<div class="card knowledge-card ' + (isLearned ? 'learned' : '') + '" data-id="' + item.id + '">' +
                    '<div class="knowledge-header p-4 flex items-center justify-between" onclick="toggleExpand(\'' + item.id + '\')">' +
                        '<div class="flex items-center gap-3 flex-1 min-w-0">' +
                            '<div class="expand-icon ' + (isExpanded ? 'expanded' : 'collapsed') + '">' + (isExpanded ? '−' : '+') + '</div>' +
                            '<div class="flex-1 min-w-0">' +
                                '<h3 class="text-lg font-semibold text-gray-800 flex items-center gap-2">' + escapeHtml(item.name) + (isLearned ? '<span class="text-green-500 text-sm">✓ 已学习</span>' : '') + '</h3>' +
                                '<p class="text-xs text-gray-500 mt-1">' + escapeHtml(item.chapter) + '</p>' +
                            '</div>' +
                        '</div>' +
                        (HAS_EXAMPLES ? '<button class="btn btn-secondary text-sm px-3 py-1" onclick="event.stopPropagation(); showExample(\'' + item.id + '\', \'' + escapeHtml(item.name) + '\')">例题</button>' : '') +
                    '</div>' +
                    '<div id="content-' + item.id + '" class="px-6 pb-4 ' + (isExpanded ? '' : 'hidden') + '">' +
                        (item.formula ? '<div class="mb-4"><h4 class="text-sm font-medium text-gray-500 mb-2">📐 公式</h4><p class="formula-box text-gray-800 text-lg bg-gray-50 p-3 rounded-lg">' + escapeHtml(item.formula) + '</p></div>' : '') +
                        (item.explanation ? '<div><h4 class="text-sm font-medium text-gray-500 mb-2">📝 解释</h4><p class="text-gray-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(item.explanation) + '</p></div>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function toggleExpand(id) {
            const isNewLearn = !expandedIds.has(id) && !ProgressManager.isLearned(id);
            if (expandedIds.has(id)) {
                expandedIds.delete(id);
            } else {
                expandedIds.add(id);
                const {grade, subject, semester} = currentParams;
                const item = knowledgeList.find(k => k.id === id);
                if (item) {
                    ProgressManager.recordStudy(
                        grade, subject, subjectNames[subject],
                        semester, semesterNames[semester],
                        id, item.name
                    );
                }
            }
            const card = document.querySelector('[data-id="' + id + '"]');
            const content = document.getElementById('content-' + id);
            const icon = card.querySelector('.expand-icon');
            const header = card.querySelector('.knowledge-header');
            const title = card.querySelector('h3');
            if (expandedIds.has(id)) {
                content.classList.remove('hidden');
                icon.classList.remove('collapsed');
                icon.classList.add('expanded');
                icon.textContent = '−';
                header.classList.add('expanded');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('expanded');
                icon.classList.add('collapsed');
                icon.textContent = '+';
                header.classList.remove('expanded');
            }
            if (isNewLearn) {
                card.classList.add('learned');
                if (!title.querySelector('.text-green-500')) {
                    title.innerHTML += '<span class="text-green-500 text-sm">✓ 已学习</span>';
                }
                updateProgressStat();
            }
        }

        function expandAll() {
            knowledgeList.forEach(item => expandedIds.add(item.id));
            renderKnowledgeList();
        }

        function collapseAll() {
            expandedIds.clear();
            renderKnowledgeList();
        }

        function searchKnowledge(keyword, list) {
            if (!keyword) return [];
            const lower = keyword.toLowerCase();
            return list.filter(k =>
                k.name.toLowerCase().includes(lower) ||
                k.chapter.toLowerCase().includes(lower)
            );
        }

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                searchResultsInfo.classList.add('hidden');
                renderKnowledgeList();
                return;
            }
            const results = searchKnowledge(keyword, knowledgeList);
            searchCountEl.textContent = results.length;
            searchResultsInfo.classList.remove('hidden');
            renderKnowledgeList(results);
        }

        function showExample(knowledgeId, knowledgeName) {
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === knowledgeId);
            if (examples.length === 0) {
                alert('暂无例题');
                return;
            }
            const example = examples[Math.floor(Math.random() * examples.length)];
            currentExample = {...example, knowledgeId, knowledgeName, ...currentParams};
            document.getElementById('example-knowledge-name').textContent = knowledgeName;
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
            document.getElementById('example-modal').classList.remove('hidden');
        }

        function nextExample() {
            if (!currentExample) return;
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === currentExample.knowledgeId);
            const otherExamples = examples.filter(e => e !== currentExample);
            if (otherExamples.length === 0) {
                alert('没有更多例题了');
                return;
            }
            const example = otherExamples[Math.floor(Math.random() * otherExamples.length)];
            currentExample = {...example, knowledgeId: currentExample.knowledgeId, knowledgeName: currentExample.knowledgeName, ...currentParams};
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
        }

        function addToWrongBook() {
            if (!currentExample) return;
            const item = {
                knowledgeId: currentExample.knowledgeId,
                knowledgeName: currentExample.knowledgeName,
                question: currentExample.question,
                answer: currentExample.answer,
                grade: currentParams.grade,
                subject: currentParams.subject
            };
            if (WrongBookManager.addWrongBook(item)) {
                alert('已加入错题本！');
            } else {
                alert('该题目已在错题本中');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearProgress() {
            const {grade, subject} = currentParams;
            const subjectName = subjectNames[subject];
            var msg = '确定要清除【' + subjectName + '】科目的所有学习进度吗？';
            msg += '\n\n';
            msg += '此操作将清除该科目所有已学习标记，且不可恢复。';
            if (!confirm(msg)) {
                return;
            }
            ProgressManager.clearSubjectProgress(grade, subject);
            updateProgressStat();
            renderKnowledgeList();
            alert('学习进度已清除');
        }

        document.getElementById('btn-expand-all').addEventListener('click', expandAll);
        document.getElementById('btn-collapse-all').addEventListener('click', collapseAll);
        document.getElementById('btn-clear-progress').addEventListener('click', clearProgress);
        searchInput.addEventListener('keyup', e => { if (e.key === 'Enter') performSearch(); });
        searchInput.addEventListener('input', () => { if (!searchInput.value) { searchResultsInfo.classList.add('hidden'); renderKnowledgeList(); }});
        document.getElementById('close-example').addEventListener('click', () => document.getElementById('example-modal').classList.add('hidden'));
        document.getElementById('btn-show-answer').addEventListener('click', () => {
            document.getElementById('example-answer-section').classList.remove('hidden');
            document.getElementById('btn-show-answer').classList.add('hidden');
        });
        document.getElementById('btn-next-example').addEventListener('click', nextExample);
        document.getElementById('btn-add-wrong').addEventListener('click', addToWrongBook);
        document.getElementById('example-modal').addEventListener('click', e => { if (e.target.id === 'example-modal') document.getElementById('example-modal').classList.add('hidden'); });

        initPage();
    </script>
</body>
</html>
