    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"id":"g3_chemistry_001","chapter":"第一单元 走进化学世界","name":"物质的变化和性质","formula":"物理变化：没有新物质生成；化学变化：有新物质生成","explanation":"物理变化和化学变化的本质区别是是否有新物质生成。物理性质包括颜色、状态、气味、熔点、沸点、硬度、密度等；化学性质是物质在化学变化中表现出来的性质，如可燃性、氧化性、还原性、稳定性等。","semester":"upper"},{"id":"g3_chemistry_002","chapter":"第一单元 走进化学世界","name":"化学是一门以实验为基础的科学","formula":"科学探究的基本环节：提出问题→猜想与假设→设计实验→进行实验→收集证据→得出结论","explanation":"化学是一门以实验为基础的科学，实验是学习化学的重要途径。对蜡烛及其燃烧的探究体现了化学学习的特点：关注物质的性质、关注物质的变化、关注物质的变化过程以及对结果的解释和讨论。","semester":"upper"},{"id":"g3_chemistry_003","chapter":"第一单元 走进化学世界","name":"走进化学实验室","formula":"药品取用原则：\"三不\"原则（不尝、不摸、不直接闻）","explanation":"化学实验基本操作包括：药品的取用（固体药品的取用：块状用镊子，粉末状用药匙或纸槽；液体药品的取用：倾倒、滴加、量取）、物质的加热（酒精灯的使用方法、给物质加热的注意事项）、仪器的连接与洗涤、气密性检查等。","semester":"upper"},{"id":"g3_chemistry_004","chapter":"第二单元 我们周围的空气","name":"空气","formula":"空气成分（体积分数）：N₂约78%，O₂约21%，稀有气体约0.94%，CO₂约0.03%","explanation":"空气是由多种单质和化合物组成的混合物。测定空气中氧气含量的实验原理是利用红磷燃烧消耗氧气，使集气瓶内压强减小，水进入集气瓶，进入水的体积约等于氧气的体积。实验成功的关键是：红磷要过量、装置气密性要好、冷却到室温再读数。","semester":"upper"},{"id":"g3_chemistry_005","chapter":"第二单元 我们周围的空气","name":"氧气","formula":"氧气的化学性质：支持燃烧，供给呼吸；C + O₂ 点燃 CO₂","explanation":"氧气是无色无味的气体，密度比空气略大，不易溶于水。氧气是一种化学性质比较活泼的气体，在一定条件下能与许多物质发生化学反应，同时放出热量。物质在氧气中燃烧比在空气中更剧烈。","semester":"upper"},{"id":"g3_chemistry_006","chapter":"第二单元 我们周围的空气","name":"制取氧气","formula":"2KMnO₄ 加热 K₂MnO₄ + MnO₂ + O₂↑；2H₂O₂ MnO₂ 2H₂O + O₂↑","explanation":"实验室制取氧气的方法：加热高锰酸钾、分解过氧化氢（二氧化锰作催化剂）、加热氯酸钾（二氧化锰作催化剂）。收集方法：排水法（氧气不易溶于水）、向上排空气法（氧气密度比空气大）。催化剂在化学反应中能改变其他物质的化学反应速率，而本身的质量和化学性质在反应前后都没有发生变化。","semester":"upper"},{"id":"g3_chemistry_007","chapter":"第三单元 物质构成的奥秘","name":"分子和原子","formula":"分子是保持物质化学性质的最小粒子；原子是化学变化中的最小粒子","explanation":"分子的性质：分子的质量和体积都很小；分子总是在不断运动着；分子之间有间隔；同种物质的分子性质相同，不同种物质的分子性质不同。在化学变化中，分子可以分成原子，原子又可以重新组合成新的分子。","semester":"upper"},{"id":"g3_chemistry_008","chapter":"第三单元 物质构成的奥秘","name":"原子的结构","formula":"原子由原子核（质子+中子）和核外电子构成；核电荷数=质子数=核外电子数","explanation":"原子是由居于原子中心的原子核和核外电子构成的。原子核由质子和中子构成。每个质子带一个单位正电荷，每个电子带一个单位负电荷，中子不带电。核外电子是分层排布的，可以用原子结构示意图表示。最外层电子数决定元素的化学性质。","semester":"upper"},{"id":"g3_chemistry_009","chapter":"第三单元 物质构成的奥秘","name":"元素","formula":"元素是具有相同核电荷数（即核内质子数）的一类原子的总称","explanation":"元素的种类由质子数决定。元素符号的意义：表示一种元素，表示这种元素的一个原子。元素周期表共有7个横行（7个周期），18个纵行（16个族）。同周期元素的原子电子层数相同，同主族元素的原子最外层电子数相同，化学性质相似。","semester":"upper"},{"id":"g3_chemistry_010","chapter":"第四单元 自然界的水","name":"爱护水资源","formula":"水资源短缺的原因：人类用水量增加、水体污染","explanation":"地球上的水储量是丰富的，但可利用的淡水资源是有限的。爱护水资源一方面要节约用水，另一方面要防止水体污染。水体污染的来源主要有工业污染、农业污染和生活污染。","semester":"upper"},{"id":"g3_chemistry_011","chapter":"第四单元 自然界的水","name":"水的净化","formula":"净化水的方法：静置、吸附、过滤、蒸馏（净化程度由低到高）","explanation":"常用的净水方法：静置沉淀、吸附沉淀（加明矾）、过滤、活性炭吸附、消毒、蒸馏。过滤操作要点：\"一贴二低三靠\"。硬水是含有较多可溶性钙、镁化合物的水，软水是不含或含较少可溶性钙、镁化合物的水。常用肥皂水区分硬水和软水，生活中用煮沸的方法降低水的硬度。","semester":"upper"},{"id":"g3_chemistry_012","chapter":"第四单元 自然界的水","name":"水的组成","formula":"2H₂O 通电 2H₂↑ + O₂↑；水是由氢元素和氧元素组成的化合物","explanation":"电解水实验：正极产生氧气，负极产生氢气，体积比为1:2（\"正氧负氢，氢二氧一\"）。该实验证明水是由氢元素和氧元素组成的。化合物是由不同种元素组成的纯净物，单质是由同种元素组成的纯净物。","semester":"upper"},{"id":"g3_chemistry_013","chapter":"第四单元 自然界的水","name":"化学式与化合价","formula":"化学式：用元素符号和数字的组合表示物质组成的式子；化合价有正价和负价","explanation":"化学式的意义：表示一种物质、表示这种物质的元素组成、表示这种物质的一个分子、表示这种物质的分子构成。化合价原则：在化合物里正负化合价的代数和为0；单质分子中元素的化合价为0。根据化学式可以计算相对分子质量、组成元素的质量比、某元素的质量分数。","semester":"upper"},{"id":"g3_chemistry_014","chapter":"第五单元 化学方程式","name":"质量守恒定律","formula":"参加化学反应的各物质的质量总和，等于反应后生成的各物质的质量总和","explanation":"质量守恒定律的微观解释：在化学反应中，反应前后原子的种类没有改变，原子的数目没有增减，原子的质量也没有改变。化学反应前后五个不变（宏观：物质总质量、元素种类；微观：原子种类、原子数目、原子质量），两个一定变（宏观：物质种类；微观：分子种类），一个可能变（分子总数）。","semester":"upper"},{"id":"g3_chemistry_015","chapter":"第五单元 化学方程式","name":"化学方程式","formula":"化学方程式：用化学式来表示化学反应的式子；书写原则：以客观事实为基础，遵守质量守恒定律","explanation":"化学方程式的意义：表示反应物、生成物和反应条件；表示各物质之间的质量比；表示各粒子的相对数量关系。书写步骤：写（写出反应物和生成物的化学式）、配（配平化学方程式）、注（注明反应条件、标注气体或沉淀符号）、等（将短线改为等号）。","semester":"upper"},{"id":"g3_chemistry_016","chapter":"第五单元 化学方程式","name":"根据化学方程式的计算","formula":"计算步骤：设未知数→写化学方程式→找相关物质质量比→列比例式→求解→答","explanation":"根据化学方程式计算的理论依据是质量守恒定律。计算时要注意：化学方程式必须配平；计算时所用质量必须是纯净物的质量；单位要统一；步骤要完整。常见题型：求反应物或生成物的质量、含杂质的计算、与溶液相关的计算等。","semester":"upper"},{"id":"g3_chemistry_017","chapter":"第六单元 碳和碳的氧化物","name":"金刚石、石墨和C60","formula":"金刚石、石墨、C60都是由碳元素组成的单质，物理性质不同是因为碳原子的排列方式不同","explanation":"金刚石是天然存在的最硬的物质，可用于切割玻璃、钻探机钻头等。石墨很软，有滑腻感，具有优良的导电性，可用于制铅笔芯、电极等。活性炭具有吸附性，可用于防毒面具、净水等。常温下碳的化学性质不活泼；高温下，碳具有可燃性和还原性。","semester":"upper"},{"id":"g3_chemistry_018","chapter":"第六单元 碳和碳的氧化物","name":"二氧化碳制取的研究","formula":"CaCO₃ + 2HCl = CaCl₂ + H₂O + CO₂↑；收集方法：向上排空气法","explanation":"实验室制取二氧化碳用大理石（或石灰石）和稀盐酸反应，不能用稀硫酸（因生成的硫酸钙微溶于水，覆盖在碳酸钙表面，阻止反应继续进行），不能用碳酸钠（反应太快，不易收集）。收集用向上排空气法（二氧化碳密度比空气大，能溶于水且与水反应）。验满：将燃着的木条放在集气瓶口，木条熄灭，证明已收集满。","semester":"upper"},{"id":"g3_chemistry_019","chapter":"第六单元 碳和碳的氧化物","name":"二氧化碳和一氧化碳","formula":"CO₂ + H₂O = H₂CO₃；CO₂ + Ca(OH)₂ = CaCO₃↓ + H₂O；CO有剧毒","explanation":"二氧化碳是无色无味的气体，密度比空气大，能溶于水。化学性质：不燃烧也不支持燃烧；能与水反应生成碳酸；能使澄清石灰水变浑浊（检验CO₂的方法）。一氧化碳是无色无味的气体，难溶于水，有剧毒。化学性质：可燃性、还原性、毒性。二氧化碳和一氧化碳性质不同是因为分子构成不同。","semester":"upper"},{"id":"g3_chemistry_020","chapter":"第七单元 燃料及其利用","name":"燃烧和灭火","formula":"燃烧的三个条件：可燃物、氧气（或空气）、温度达到着火点（三者缺一不可）","explanation":"燃烧是可燃物与氧气发生的一种发光、放热的剧烈的氧化反应。灭火的原理和方法：清除可燃物或使可燃物与其他物品隔离；隔绝氧气（或空气）；使温度降到着火点以下。爆炸是可燃物在有限的空间内急剧地燃烧，在短时间内聚积大量的热，使气体的体积迅速膨胀而引起的。","semester":"upper"},{"id":"g3_chemistry_021","chapter":"第七单元 燃料及其利用","name":"燃料的合理利用与开发","formula":"三大化石燃料：煤、石油、天然气（都是混合物，都是不可再生能源）","explanation":"化学反应中的能量变化：放热反应和吸热反应。化石燃料包括煤、石油、天然气。煤主要含碳元素，石油主要含碳和氢元素，天然气的主要成分是甲烷（CH₄）。甲烷燃烧：CH₄ + 2O₂ 点燃 CO₂ + 2H₂O。燃料充分燃烧的条件：要有足够多的空气；燃料与空气要有足够大的接触面。使用燃料对环境的影响：酸雨、温室效应等。新能源：太阳能、风能、核能、地热能、氢能等。","semester":"upper"},{"id":"g3_chemistry_022","chapter":"第八单元 金属和金属材料","name":"金属材料","formula":"金属材料包括纯金属以及它们的合金；合金的硬度一般比组成它的纯金属大，熔点一般比组成它的纯金属低","explanation":"金属的物理性质：常温下都是固体（汞除外），有金属光泽，大多数为电和热的优良导体，有延展性，密度较大，熔点较高。合金是在金属中加热熔合某些金属或非金属，制得的具有金属特征的混合物。生铁和钢都是铁的合金，主要区别是含碳量不同。","semester":"lower"},{"id":"g3_chemistry_023","chapter":"第八单元 金属和金属材料","name":"金属的化学性质","formula":"金属活动性顺序：K Ca Na Mg Al Zn Fe Sn Pb (H) Cu Hg Ag Pt Au","explanation":"金属的化学性质：大多数金属能与氧气反应；活泼金属能与稀盐酸、稀硫酸反应产生氢气；位于前面的金属能把位于后面的金属从它们的化合物溶液中置换出来。金属活动性顺序的应用：判断金属活动性强弱、判断金属能否与酸反应、判断金属能否与金属化合物溶液反应。","semester":"lower"},{"id":"g3_chemistry_024","chapter":"第八单元 金属和金属材料","name":"金属资源的利用和保护","formula":"铁的冶炼原理：3CO + Fe₂O₃ 高温 2Fe + 3CO₂","explanation":"地球上的金属资源广泛地存在于地壳和浩瀚的海洋中，除少数很不活泼的金属如金、银等有单质形式存在外，其余都以化合物的形式存在。铁的冶炼：原料是铁矿石、焦炭、石灰石，设备是高炉。铁生锈是铁与氧气、水等发生的复杂的化学反应。防止铁生锈的方法：保持铁制品表面的洁净和干燥、涂保护膜、制成不锈钢等。","semester":"lower"},{"id":"g3_chemistry_025","chapter":"第九单元 溶液","name":"溶液的形成","formula":"溶液是均一、稳定的混合物；溶液由溶质和溶剂组成","explanation":"一种或几种物质分散到另一种物质里，形成均一的、稳定的混合物，叫做溶液。被溶解的物质叫做溶质，能溶解其他物质的物质叫做溶剂。水是最常用的溶剂，汽油、酒精等也可以作溶剂。饱和溶液是在一定温度下，向一定量溶剂里加入某种溶质，当溶质不能继续溶解时所得到的溶液。溶解时有的吸热（如硝酸铵），有的放热（如氢氧化钠、浓硫酸）。","semester":"lower"},{"id":"g3_chemistry_026","chapter":"第九单元 溶液","name":"溶解度","formula":"固体溶解度：在一定温度下，某固态物质在100g溶剂里达到饱和状态时所溶解的质量","explanation":"溶解度曲线表示物质的溶解度随温度变化的情况。大多数固体物质的溶解度随温度升高而增大（如KNO₃）；少数物质的溶解度受温度影响较小（如NaCl）；极少数物质的溶解度随温度升高而减小（如Ca(OH)₂）。气体的溶解度随温度升高而减小，随压强增大而增大。","semester":"lower"},{"id":"g3_chemistry_027","chapter":"第九单元 溶液","name":"溶液的浓度","formula":"溶质质量分数 = 溶质质量 / 溶液质量 × 100%","explanation":"溶质质量分数是溶质质量与溶液质量之比。配制一定溶质质量分数的溶液的步骤：计算、称量（量取）、溶解。溶液稀释前后溶质的质量不变。饱和溶液的溶质质量分数 = 溶解度 / (100g + 溶解度) × 100%。","semester":"lower"},{"id":"g3_chemistry_028","chapter":"第十单元 酸和碱","name":"常见的酸和碱","formula":"酸：解离时产生的阳离子全部是H⁺的化合物；碱：解离时产生的阴离子全部是OH⁻的化合物","explanation":"常见的酸：盐酸（HCl）、硫酸（H₂SO₄）、硝酸（HNO₃）等。浓盐酸具有挥发性，浓硫酸具有吸水性、脱水性和强腐蚀性。常见的碱：氢氧化钠（NaOH，俗称烧碱、火碱、苛性钠）、氢氧化钙（Ca(OH)₂，俗称熟石灰、消石灰）等。氢氧化钠易潮解，有强烈的腐蚀性。氢氧化钙微溶于水，其水溶液俗称石灰水。","semester":"lower"},{"id":"g3_chemistry_029","chapter":"第十单元 酸和碱","name":"酸和碱的中和反应","formula":"酸 + 碱 → 盐 + 水；中和反应的实质：H⁺ + OH⁻ = H₂O","explanation":"中和反应是酸与碱作用生成盐和水的反应。中和反应在实际中的应用：用熟石灰改良酸性土壤、用氢氧化铝治疗胃酸过多、用熟石灰处理硫酸厂的废水等。溶液的酸碱度常用pH来表示，pH的范围通常为0-14。pH < 7，溶液呈酸性；pH = 7，溶液呈中性；pH > 7，溶液呈碱性。","semester":"lower"},{"id":"g3_chemistry_030","chapter":"第十一单元 盐 化肥","name":"生活中常见的盐","formula":"盐：由金属离子（或铵根离子）和酸根离子构成的化合物","explanation":"氯化钠（NaCl，食盐的主要成分）：用作调味品、生理盐水、选种、融雪剂等。碳酸钠（Na₂CO₃，俗称纯碱、苏打）：用于玻璃、造纸、纺织、洗涤剂的生产。碳酸氢钠（NaHCO₃，俗称小苏打）：发酵粉的主要成分，治疗胃酸过多症。碳酸钙（CaCO₃，大理石、石灰石的主要成分）：建筑材料、补钙剂。复分解反应是两种化合物互相交换成分，生成另外两种化合物的反应。","semester":"lower"},{"id":"g3_chemistry_031","chapter":"第十一单元 盐 化肥","name":"化学肥料","formula":"氮肥、磷肥、钾肥是最主要的化学肥料，含两种或两种以上营养元素的化肥叫复合肥","explanation":"氮肥作用：促进植物茎、叶生长茂盛，叶色浓绿。磷肥作用：促进作物根系发达，增强抗寒抗旱能力，促进作物提早成熟，穗粒增多，籽粒饱满。钾肥作用：促进植物生长健壮，茎秆粗硬，增强对病虫害和倒伏的抵抗能力。化肥与农药对提高农作物的产量具有重要作用，但不合理使用会带来环境问题。","semester":"lower"},{"id":"g3_chemistry_032","chapter":"第十二单元 化学与生活","name":"人类重要的营养物质","formula":"六大基本营养素：蛋白质、糖类、油脂、维生素、无机盐、水","explanation":"蛋白质是构成细胞的基本物质，是机体生长及修补受损组织的主要原料。糖类是生命活动的主要供能物质。油脂是重要的供能物质，是维持生命活动的备用能源。维生素可以起到调节新陈代谢、预防疾病、维持身体健康的作用。缺乏维生素A会引起夜盲症，缺乏维生素C会引起坏血病。","semester":"lower"},{"id":"g3_chemistry_033","chapter":"第十二单元 化学与生活","name":"化学元素与人体健康","formula":"人体中的常量元素（含量>0.01%）：O、C、H、N、Ca、P、K、S、Na、Cl、Mg等","explanation":"人体中含量较多的元素有11种，它们约占人体质量的99.95%。钙是人体内含量最高的金属元素，幼儿及青少年缺钙会得佝偻病和发育不良，老年人缺钙会发生骨质疏松。缺铁会引起贫血，缺碘会引起甲状腺肿大，缺氟易产生龋齿，缺硒可能引起表皮角质化和癌症。","semester":"lower"},{"id":"g3_chemistry_034","chapter":"第十二单元 化学与生活","name":"有机合成材料","formula":"三大合成材料：塑料、合成纤维、合成橡胶","explanation":"化合物分为无机化合物和有机化合物（含碳的化合物，简称有机物）。有机高分子材料分为天然有机高分子材料（如棉花、羊毛、天然橡胶等）和合成有机高分子材料（塑料、合成纤维、合成橡胶）。塑料分为热塑性塑料和热固性塑料。白色污染是指废弃塑料带来的环境污染。","semester":"lower"}];

        // ==================== 内嵌例题数据 ====================
        const DATA_EXAMPLES = [{"id":"g3_chemistry_001_ex01","knowledge_id":"g3_chemistry_001","question":"选择题：下列生活中的变化，属于化学变化的是\nA. 冰雪融化（0℃的冰融化成0℃的水）\nB. 蜡烛燃烧（蜡烛燃烧后生成二氧化碳和水）\nC. 汽油挥发（汽油由液态变为气态）\nD. 玻璃破碎（玻璃从完整变成碎片）","answer":"答案：B\n解析：判断物理变化和化学变化的根本依据是是否有新物质生成。\nA. 冰雪融化只是状态从固态变为液态，没有新物质生成，属于物理变化。\nB. 蜡烛燃烧生成了二氧化碳和水，有新物质生成，属于化学变化。\nC. 汽油挥发只是状态从液态变为气态，没有新物质生成，属于物理变化。\nD. 玻璃破碎只是形状改变，没有新物质生成，属于物理变化。"},{"id":"g3_chemistry_001_ex02","knowledge_id":"g3_chemistry_001","question":"填空题：化学变化的基本特征是______，常表现为______、______、______等，而且还伴随着能量的变化，常表现为______、______、______等。","answer":"答案：有新物质生成，颜色改变，放出气体，生成沉淀，吸热，放热，发光\n解析：化学变化的基本特征是有新物质生成，这是判断化学变化的根本依据。化学变化常伴随的现象有：颜色改变、放出气体、生成沉淀等。同时化学变化还伴随着能量变化，通常表现为吸热、放热、发光等。注意：有这些现象不一定是化学变化（如电灯发光放热是物理变化），但化学变化往往伴随这些现象。"},{"id":"g3_chemistry_001_ex03","knowledge_id":"g3_chemistry_001","question":"选择题：下列物质的性质中，属于化学性质的是\nA. 酒精能挥发（沸点78℃）\nB. 氧气的密度是1.429g/L（标准状况下）\nC. 二氧化碳能使澄清石灰水变浑浊\nD. 金刚石硬度很大（莫氏硬度10）","answer":"答案：C\n解析：物理性质是不需要发生化学变化就能表现出来的性质，如颜色、状态、气味、密度、硬度、熔点、沸点、挥发性、溶解性等。化学性质是在化学变化中表现出来的性质，如可燃性、氧化性、还原性、稳定性、腐蚀性等。\nA. 挥发性是物理性质\nB. 密度是物理性质\nC. 二氧化碳使澄清石灰水变浑浊是因为发生了化学反应生成碳酸钙沉淀，属于化学性质\nD. 硬度是物理性质"},{"id":"g3_chemistry_001_ex04","knowledge_id":"g3_chemistry_001","question":"判断题：有发光、放热现象的变化一定是化学变化。（  ）","answer":"答案：错误\n解析：有发光、放热现象的变化不一定是化学变化。例如：电灯通电发光放热，只是电能转化为光能和热能，灯丝本身还是钨，没有新物质生成，属于物理变化。再如：蜡烛燃烧发光放热，生成了二氧化碳和水，有新物质生成，才是化学变化。所以判断化学变化的根本依据是有没有新物质生成，而不是看现象。"},{"id":"g3_chemistry_001_ex05","knowledge_id":"g3_chemistry_001","question":"选择题：古诗词是古人留给我们的宝贵精神财富。下列诗词中不涉及化学变化的是\nA. 野火烧不尽，春风吹又生（枯草燃烧）\nB. 春蚕到死丝方尽，蜡炬成灰泪始干（蜡烛燃烧）\nC. 只要功夫深，铁杵磨成针（铁棒磨细）\nD. 千锤万凿出深山，烈火焚烧若等闲（煅烧石灰石）","answer":"答案：C\n解析：\nA. 枯草燃烧生成二氧化碳和水等新物质，属于化学变化。\nB. 蜡烛燃烧生成二氧化碳和水，属于化学变化。\nC. 铁杵磨成针只是形状和大小改变，铁还是铁，没有新物质生成，属于物理变化。\nD. 烈火焚烧石灰石（碳酸钙）生成氧化钙和二氧化碳，属于化学变化。"},{"id":"g3_chemistry_001_ex06","knowledge_id":"g3_chemistry_001","question":"填空题：物质在______中表现出来的性质叫做化学性质，例如______；物质不需要发生______就表现出来的性质叫做物理性质，例如______、______、______（举三例）。","answer":"答案：化学变化，可燃性（或氧化性、还原性、稳定性等），化学变化，颜色，状态，气味（或密度、硬度、熔点、沸点、溶解性、挥发性等）\n解析：化学性质是物质在化学变化中表现出来的性质，如可燃性、助燃性、氧化性、还原性、酸碱性、稳定性、腐蚀性、毒性等。物理性质是物质不需要发生化学变化就表现出来的性质，可以直接观察或测量，如颜色、状态、气味、密度、硬度、熔点、沸点、溶解性、挥发性、导电性、导热性、延展性等。"},{"id":"g3_chemistry_001_ex07","knowledge_id":"g3_chemistry_001","question":"解答题：某同学对一种无色液体进行了以下实验：①闻气味，有酒精味；②测密度为0.8g/mL；③点燃，液体燃烧，发出淡蓝色火焰，生成使澄清石灰水变浑浊的气体和水雾。请分析：\n（1）以上描述中，哪些属于物理性质？哪些属于化学性质？\n（2）该液体可能是什么物质？\n（3）写出该物质燃烧的文字表达式。","answer":"答案：（1）物理性质：无色液体、有酒精味、密度为0.8g/mL；化学性质：可燃性\n（2）该液体可能是酒精（乙醇）\n（3）酒精 + 氧气 --(点燃)→ 二氧化碳 + 水\n解析：\n（1）物理性质是不需要化学变化就能表现的性质：颜色（无色）、状态（液体）、气味（酒精味）、密度（0.8g/mL）都属于物理性质。化学性质是在化学变化中表现的性质：能燃烧（可燃性）是在燃烧这个化学变化中表现的，属于化学性质。\n（2）酒精是无色液体，有特殊香味，密度约0.8g/mL，能燃烧，生成二氧化碳和水，符合所有描述。\n（3）酒精燃烧的反应物是酒精和氧气，条件是点燃，生成物是二氧化碳和水。"},{"id":"g3_chemistry_001_ex08","knowledge_id":"g3_chemistry_001","question":"选择题：下列各组变化中，前者属于物理变化，后者属于化学变化的是\nA. 铜生锈、轮胎爆炸\nB. 高粱酿酒、白磷自燃\nC. 胆矾研碎、石油液化气燃烧\nD. 金属导电、食物腐烂","answer":"答案：C\n解析：\nA. 铜生锈生成铜绿（碱式碳酸铜），是化学变化；轮胎爆炸只是形状改变，是物理变化。顺序不符。\nB. 高粱酿酒生成酒精，是化学变化；白磷自燃生成五氧化二磷，是化学变化。两个都是化学变化。\nC. 胆矾研碎只是形状改变，没有新物质生成，是物理变化；石油液化气燃烧生成二氧化碳和水，是化学变化。顺序符合。\nD. 金属导电没有新物质生成，是物理性质的表现，属于物理变化；食物腐烂生成新物质，是化学变化。这个也对？再比较一下C更典型。\n注：本题C和D中前者都是物理变化，后者都是化学变化。但更经典的答案是C。金属导电严格说是物理性质，不是变化过程。"},{"id":"g3_chemistry_001_ex09","knowledge_id":"g3_chemistry_001","question":"判断题：物质的性质决定物质的用途，物质的用途反映物质的性质。（  ）","answer":"答案：正确\n解析：物质的性质与用途的关系是：性质决定用途，用途反映性质。\n例如：\n- 酒精具有可燃性（性质），所以酒精可作燃料（用途）\n- 铜具有良好的导电性（性质），所以铜可作导线（用途）\n- 金刚石硬度大（性质），所以金刚石可用于切割玻璃（用途）\n我们可以通过物质的用途推测其性质，也可以根据性质预测其用途。"},{"id":"g3_chemistry_001_ex10","knowledge_id":"g3_chemistry_001","question":"选择题：下列关于物质变化和性质的说法，正确的是\nA. 物理变化和化学变化一定同时发生\nB. 爆炸一定是化学变化\nC. 物质的颜色改变一定发生了化学变化\nD. 化学变化过程中一定同时发生物理变化","answer":"答案：D\n解析：\nA. 物理变化和化学变化不一定同时发生。比如冰融化只是物理变化，没有化学变化。A错误。\nB. 爆炸不一定是化学变化。比如气球爆炸、轮胎爆炸只是压强变化导致的，没有新物质生成，是物理变化；火药爆炸才是化学变化。B错误。\nC. 物质颜色改变不一定是化学变化。比如将红色的铁块磨成红色的铁粉，还是铁，只是颗粒变小颜色加深，是物理变化。C错误。\nD. 化学变化过程中一定同时发生物理变化。比如蜡烛燃烧是化学变化，但同时蜡烛熔化是物理变化。化学变化中物质的状态、形状等往往也会改变，所以一定伴随物理变化。D正确。"},{"id":"g3_chemistry_002_ex01","knowledge_id":"g3_chemistry_002","question":"选择题：实验室中有一瓶失去标签的气体，已知是空气、氧气或氮气中的一种。为鉴别它，将一根燃着的木条伸入瓶中，木条立即熄灭。该气体是\nA. 空气\nB. 氧气\nC. 氮气\nD. 无法确定","answer":"答案：C\n解析：根据燃着的木条在不同气体中的现象不同来鉴别：\n- 在空气中：木条正常燃烧，无明显变化\n- 在氧气中：木条燃烧得更旺（氧气助燃）\n- 在氮气中：木条立即熄灭（氮气不支持燃烧）\n木条立即熄灭，说明该气体不能支持燃烧，所以是氮气。"},{"id":"g3_chemistry_002_ex02","knowledge_id":"g3_chemistry_002","question":"填空题：对蜡烛及其燃烧的探究实验中，蜡烛火焰分为______、______、______三层，其中______温度最高，______温度最低。取一根火柴梗，拿住一端迅速平放入火焰中，约______秒后取出，可以观察到火柴梗的______（填位置）最先碳化变黑。","answer":"答案：外焰，内焰，焰心，外焰，焰心，1~2，外焰部分\n解析：蜡烛火焰分为三层：外焰（最外层）、内焰（中间层）、焰心（最内层）。外焰与空气接触最充分，燃烧最充分，所以温度最高；焰心燃烧不充分，温度最低。将火柴梗平放入火焰中约1~2秒，外焰部分的火柴梗最先碳化变黑，证明外焰温度最高。"},{"id":"g3_chemistry_002_ex03","knowledge_id":"g3_chemistry_002","question":"选择题：在“对人体吸入的空气和呼出的气体的探究”实验中，下列说法错误的是\nA. 呼出气体中二氧化碳含量比空气中高\nB. 呼出气体中水蒸气含量比空气中高\nC. 呼出气体中氧气含量比空气中高\nD. 证明呼出气体中水蒸气多的方法是对着干冷的玻璃片哈气","answer":"答案：C\n解析：人体吸入空气，呼出气体时会消耗氧气，产生二氧化碳和水蒸气。所以：\nA. 呼出气体中二氧化碳含量比空气中高——正确，呼吸作用产生二氧化碳\nB. 呼出气体中水蒸气含量比空气中高——正确，呼吸作用产生水蒸气\nC. 呼出气体中氧气含量比空气中高——错误，呼吸作用消耗氧气，呼出气体中氧气含量减少\nD. 对着干冷玻璃片哈气，玻璃片上出现水雾，证明呼出气体中水蒸气多——正确"},{"id":"g3_chemistry_002_ex04","knowledge_id":"g3_chemistry_002","question":"判断题：将一只干冷的烧杯罩在蜡烛火焰上方，烧杯内壁出现水雾，说明蜡烛燃烧生成了水。（  ）","answer":"答案：正确\n解析：干冷的烧杯温度低，蜡烛燃烧产生的水蒸气遇到冷的烧杯内壁，凝结成小水珠，形成水雾。这是检验水生成的常用方法。如果要证明蜡烛燃烧还生成二氧化碳，可以将烧杯迅速倒转过来，倒入少量澄清石灰水，振荡，石灰水变浑浊，说明生成了二氧化碳。"},{"id":"g3_chemistry_002_ex05","knowledge_id":"g3_chemistry_002","question":"选择题：某同学将燃着的木条分别伸入甲、乙两瓶气体中，甲瓶中木条燃烧更旺，乙瓶中木条熄灭。下列判断正确的是\nA. 甲是氧气，乙是空气\nB. 甲是空气，乙是二氧化碳\nC. 甲是氧气，乙是二氧化碳\nD. 甲是二氧化碳，乙是氧气","answer":"答案：C\n解析：氧气具有助燃性，能使燃着的木条燃烧更旺；二氧化碳、氮气等不支持燃烧，能使燃着的木条熄灭。\n甲瓶中木条燃烧更旺 → 甲是氧气\n乙瓶中木条熄灭 → 乙可能是二氧化碳或氮气等不支持燃烧的气体\n选项中只有C符合：甲是氧气，乙是二氧化碳。\n注意：使木条熄灭的不一定就是二氧化碳，也可能是氮气等，需要进一步检验（如通入澄清石灰水）才能确定。"},{"id":"g3_chemistry_002_ex06","knowledge_id":"g3_chemistry_002","question":"填空题：化学学习的特点（三个关注）：关注物质的______；关注物质的______；关注物质变化的______以及对结果的______。","answer":"答案：性质，变化，过程，解释和讨论\n解析：化学学习的特点是：\n1. 关注物质的性质：如颜色、状态、气味、硬度、密度、可燃性等\n2. 关注物质的变化：如物理变化、化学变化\n3. 关注物质变化的过程以及对结果的解释和讨论：不仅关注变化的结果，还要关注变化的过程和现象，并进行分析、推理和判断。"},{"id":"g3_chemistry_002_ex07","knowledge_id":"g3_chemistry_002","question":"解答题：某同学在探究蜡烛燃烧的实验中，做了以下实验：\n①点燃蜡烛，观察火焰分层；\n②将一根火柴梗平放入火焰中，约1秒后取出；\n③将干冷烧杯罩在火焰上方；\n④将内壁涂有澄清石灰水的烧杯罩在火焰上方。\n请回答：\n（1）实验②的目的是什么？观察到什么现象？得出什么结论？\n（2）实验③观察到什么现象？说明什么？\n（3）实验④观察到什么现象？说明什么？\n（4）写出蜡烛燃烧的文字表达式。","answer":"答案：（1）目的：探究火焰各层温度高低。现象：火柴梗接触外焰的部分最先碳化变黑。结论：外焰温度最高。\n（2）现象：烧杯内壁出现水雾。说明：蜡烛燃烧生成了水。\n（3）现象：澄清石灰水变浑浊。说明：蜡烛燃烧生成了二氧化碳。\n（4）石蜡 + 氧气 --(点燃)→ 二氧化碳 + 水\n解析：\n（1）火焰分外焰、内焰、焰心三层，外焰温度最高，所以外焰部分的火柴梗最先碳化。\n（2）干冷烧杯能使水蒸气凝结成小水珠，出现水雾证明生成了水。\n（3）二氧化碳能使澄清石灰水变浑浊，这是检验二氧化碳的常用方法。\n（4）蜡烛主要成分是石蜡，燃烧时与氧气反应，生成二氧化碳和水，条件是点燃。"},{"id":"g3_chemistry_002_ex08","knowledge_id":"g3_chemistry_002","question":"选择题：下列方法中，能鉴别空气、氧气、二氧化碳三瓶气体的最简便方法是\nA. 闻气味\nB. 将带火星的木条伸入瓶中\nC. 将燃着的木条伸入瓶中\nD. 倒入澄清石灰水振荡","answer":"答案：C\n解析：\nA. 空气、氧气、二氧化碳都是无色无味的气体，闻气味无法鉴别。A错误。\nB. 带火星的木条在氧气中复燃，但在空气和二氧化碳中都可能熄灭（空气中带火星木条也容易熄灭），无法区分空气和二氧化碳。B错误。\nC. 燃着的木条：在空气中正常燃烧，在氧气中燃烧更旺，在二氧化碳中立即熄灭。现象明显不同，可以一次鉴别三种气体。C正确。\nD. 澄清石灰水只能鉴别出二氧化碳（变浑浊），无法区分空气和氧气。D错误。"},{"id":"g3_chemistry_002_ex09","knowledge_id":"g3_chemistry_002","question":"判断题：用排水法收集呼出气体时，当集气瓶口有气泡冒出时，说明气体已收集满。（  ）","answer":"答案：正确\n解析：排水法收集气体时，集气瓶装满水倒放在水槽中，气体通入后水被排出。当气泡从集气瓶口向外冒出时，说明瓶内的水已经排完，气体收集满了。这是排水法验满的方法。收集呼出气体实验中，就是用排水法收集的，因为呼出气体不易溶于水。"},{"id":"g3_chemistry_002_ex10","knowledge_id":"g3_chemistry_002","question":"选择题：下列关于科学探究的说法，不正确的是\nA. 科学探究是学习化学的重要方法\nB. 科学探究必须提出问题、作出假设、设计实验、得出结论\nC. 实验是科学探究的重要手段\nD. 进行科学探究时，实验失败了就不用管了","answer":"答案：D\n解析：\nA. 化学是一门以实验为基础的科学，科学探究是学习化学的重要方法。A正确。\nB. 科学探究的基本环节包括：提出问题、猜想与假设、设计实验、进行实验、收集证据、得出结论、反思与评价等。B正确。\nC. 实验是科学探究的重要手段，通过实验验证假设、得出结论。C正确。\nD. 科学探究中，实验失败了要分析原因，改进实验方案，重新实验，不能放弃。失败的实验也有价值，可以从中发现问题。D错误。"},{"id":"g3_chemistry_003_ex01","knowledge_id":"g3_chemistry_003","question":"选择题：下列仪器中，可以直接在酒精灯火焰上加热的是\nA. 烧杯\nB. 量筒\nC. 试管\nD. 集气瓶","answer":"答案：C\n解析：常见仪器的加热规则：\n- 可直接加热的仪器：试管、蒸发皿、燃烧匙、坩埚等\n- 需垫石棉网加热的仪器：烧杯、烧瓶、锥形瓶等（使受热均匀，防止炸裂）\n- 不能加热的仪器：量筒、集气瓶、漏斗、广口瓶、细口瓶等\nA. 烧杯需垫石棉网加热\nB. 量筒只能量取液体，不能加热\nC. 试管可以直接加热\nD. 集气瓶不能加热"},{"id":"g3_chemistry_003_ex02","knowledge_id":"g3_chemistry_003","question":"填空题：给试管里的液体加热时，液体体积不能超过试管容积的______；试管口应与桌面成______角；试管口不要______；加热时要先______，再集中加热药品部位。","answer":"答案：1/3，45°，对着自己或他人，预热\n解析：给试管中液体加热的注意事项：\n1. 液体体积不超过试管容积的1/3，防止液体沸腾喷出\n2. 试管与桌面成45°角，增大受热面积，使液体受热均匀\n3. 试管口不能对着自己或他人，防止液体喷出伤人\n4. 加热前要先预热（使试管均匀受热），防止试管炸裂，然后再集中加热药品部位\n5. 用酒精灯外焰加热"},{"id":"g3_chemistry_003_ex03","knowledge_id":"g3_chemistry_003","question":"选择题：下列实验操作正确的是\nA. 用嘴吹灭酒精灯\nB. 用酒精灯的内焰加热\nC. 向燃着的酒精灯里添加酒精\nD. 用火柴点燃酒精灯","answer":"答案：D\n解析：酒精灯的使用注意事项：\nA. 不能用嘴吹灭酒精灯，要用灯帽盖灭（盖两次），防止火焰进入灯内引发爆炸。A错误。\nB. 酒精灯外焰温度最高，应用外焰加热。B错误。\nC. 绝对禁止向燃着的酒精灯里添加酒精，防止失火。C错误。\nD. 用火柴点燃酒精灯，正确。D正确。\n\n补充：酒精灯内酒精量不能超过容积的2/3，也不能少于1/4。"},{"id":"g3_chemistry_003_ex04","knowledge_id":"g3_chemistry_003","question":"判断题：用量筒量取液体时，视线应与液体凹液面的最低处保持水平。（  ）","answer":"答案：正确\n解析：量筒读数时，视线要与量筒内液体凹液面的最低处保持水平。如果仰视读数，读数会偏小，实际液体体积偏大；如果俯视读数，读数会偏大，实际液体体积偏小。记忆口诀：俯大仰小（俯视读数大，仰视读数小）。"},{"id":"g3_chemistry_003_ex05","knowledge_id":"g3_chemistry_003","question":"选择题：某同学用量筒量取液体，量筒放平稳，且面对刻度线。初次仰视液面读数为18mL，倒出部分液体后，俯视液面读数为12mL，则该同学实际倒出液体的体积\nA. 等于6mL\nB. 大于6mL\nC. 小于6mL\nD. 无法确定","answer":"答案：B\n解析：\n仰视读数：读数偏小，实际体积偏大。初次仰视读数为18mL，说明实际体积大于18mL（假设为19mL）。\n俯视读数：读数偏大，实际体积偏小。倒出后俯视读数为12mL，说明实际体积小于12mL（假设为11mL）。\n实际倒出的体积 = 19mL - 11mL = 8mL，大于6mL。\n所以实际倒出的液体体积大于6mL。"},{"id":"g3_chemistry_003_ex06","knowledge_id":"g3_chemistry_003","question":"填空题：托盘天平只能用于粗略称量，能称准到______g。称量时把称量物放在______盘，砝码放在______盘。易潮解的药品（如氢氧化钠）必须放在______里称量。","answer":"答案：0.1，左，右，玻璃器皿（或烧杯、表面皿）\n解析：托盘天平使用要点：\n1. 精确度：0.1g（只能精确到小数点后一位）\n2. 左物右码：左边放药品，右边放砝码\n3. 砝码用镊子夹取，先大后小\n4. 一般药品在左右两盘各放一张相同质量的纸\n5. 易潮解、有腐蚀性的药品（如NaOH）必须放在玻璃器皿（烧杯、表面皿）中称量，防止腐蚀托盘\n6. 物体质量 = 砝码质量 + 游码示数（左盘 = 右盘 + 游码）"},{"id":"g3_chemistry_003_ex07","knowledge_id":"g3_chemistry_003","question":"解答题：请指出下列操作可能造成的不良后果：\n（1）加热试管中的液体时，试管口对着人\n（2）酒精灯不用时没有盖上灯帽\n（3）取用液体药品时，标签没有向着手心\n（4）把块状固体药品直接丢入直立的试管中\n（5）用试管刷刷洗试管时用力过猛","answer":"答案：\n（1）液体沸腾喷出伤人\n（2）酒精挥发，灯芯上留有水分，下次难以点燃\n（3）残留在瓶口的药液流下，腐蚀标签\n（4）打破试管底部\n（5）捣碎试管底部，损坏试管\n解析：\n（1）加热液体时试管口不能对着人，防止液体沸腾喷出烫伤人。\n（2）酒精灯不用时要盖灯帽，防止酒精挥发，酒精挥发后灯芯留水，下次不易点燃。\n（3）倾倒液体时标签向手心，防止瓶口残留的药液流下腐蚀标签，导致药品无法辨认。\n（4）块状药品取用方法：一横二放三慢竖，先把试管横放，用镊子把药品放在试管口，再慢慢竖立试管，使药品滑到试管底部，防止打破试管。\n（5）刷洗试管时要转动或上下移动试管刷，不能用力过猛，防止捣碎试管。"},{"id":"g3_chemistry_003_ex08","knowledge_id":"g3_chemistry_003","question":"选择题：下列关于取用药品的操作，错误的是\nA. 取用粉末状固体药品用药匙\nB. 取用块状固体用镊子\nC. 实验时如果没有说明用量，液体取1~2mL，固体只需盖满试管底部\nD. 从试剂瓶中取出的药品如果用不完，应放回原瓶","answer":"答案：D\n解析：\nA. 粉末状药品用药匙或纸槽取用，方法：一斜二送三直立。A正确。\nB. 块状药品用镊子取用，方法：一横二放三慢竖。B正确。\nC. 节约原则：没有说明用量时，液体取1~2mL，固体只需盖满试管底部。C正确。\nD. 用剩的药品不能放回原瓶，也不能随意丢弃，更不能带出实验室，要放入指定的容器内。放回原瓶会污染整瓶试剂。D错误。"},{"id":"g3_chemistry_003_ex09","knowledge_id":"g3_chemistry_003","question":"判断题：玻璃仪器洗干净的标准是：内壁附着的水既不聚成水滴，也不成股流下。（  ）","answer":"答案：正确\n解析：玻璃仪器洗涤干净的标准是：仪器内壁附着的水既不聚成水滴，也不成股流下，表示仪器已洗干净。洗干净的试管要倒放在试管架上晾干。"},{"id":"g3_chemistry_003_ex10","knowledge_id":"g3_chemistry_003","question":"选择题：下列实验操作中，正确的是\nA. 为了节约火柴，用燃着的酒精灯引燃另一只酒精灯\nB. 为了获得感性认识，可触摸药品或尝药品的味道\nC. 为了防止液体流出，将胶头滴管伸入试管内滴加液体\nD. 为了防止试管炸裂，给试管中的固体加热时试管口略向下倾斜","answer":"答案：D\n解析：\nA. 绝对禁止用燃着的酒精灯引燃另一只酒精灯，防止酒精洒出失火。应用火柴点燃。A错误。\nB. 化学药品很多有毒、有腐蚀性，不能用手触摸药品，不能尝任何药品的味道。B错误。\nC. 胶头滴管滴加液体时，应垂直悬空在试管口上方，不能伸入试管内，防止污染试剂。C错误。\nD. 给固体加热时试管口略向下倾斜，防止冷凝水回流到热的试管底部，使试管炸裂。D正确。"},{"id":"g3_chemistry_004_ex01","knowledge_id":"g3_chemistry_004","question":"选择题：空气的成分中，体积分数约占78%的是\nA. 氧气\nB. 氮气\nC. 二氧化碳\nD. 稀有气体","answer":"答案：B\n解析：空气的成分按体积分数计算，大约是：\n- 氮气（N₂）：78%\n- 氧气（O₂）：21%\n- 稀有气体：0.94%\n- 二氧化碳（CO₂）：0.03%\n- 其他气体和杂质：0.03%\n所以体积分数最大的是氮气，约占78%。注意：是体积分数，不是质量分数。"},{"id":"g3_chemistry_004_ex02","knowledge_id":"g3_chemistry_004","question":"填空题：测定空气中氧气含量的实验中，红磷燃烧的现象是______；冷却后打开弹簧夹，观察到______；由此得出的结论是______。该实验中红磷必须足量的原因是______。","answer":"答案：产生大量白烟，放出热量；烧杯中的水进入集气瓶，约占集气瓶内空气体积的1/5；氧气约占空气体积的1/5；确保将集气瓶内的氧气完全消耗掉\n解析：测定空气中氧气含量实验（红磷燃烧法）：\n1. 现象：红磷燃烧，产生大量白烟（不是白雾，白烟是五氧化二磷固体小颗粒），放出热量。\n2. 冷却后打开弹簧夹，烧杯中的水沿导管进入集气瓶，约占集气瓶内空气体积的1/5。\n3. 结论：氧气约占空气体积的1/5。\n4. 红磷要足量的原因：保证将集气瓶内的氧气完全消耗，使测量结果准确。如果红磷不足，氧气未完全消耗，测量结果会偏小。"},{"id":"g3_chemistry_004_ex03","knowledge_id":"g3_chemistry_004","question":"选择题：下列物质中，属于纯净物的是\nA. 空气\nB. 海水\nC. 蒸馏水\nD. 水泥砂浆","answer":"答案：C\n解析：纯净物是由一种物质组成的，有固定的组成和性质；混合物是由两种或多种物质组成的，没有固定的组成。\nA. 空气中含有氮气、氧气、二氧化碳等多种物质，是混合物。\nB. 海水中含有水、氯化钠、氯化镁等多种物质，是混合物。\nC. 蒸馏水只含水一种物质，是纯净物。\nD. 水泥砂浆含有水泥、沙子、水等多种物质，是混合物。"},{"id":"g3_chemistry_004_ex04","knowledge_id":"g3_chemistry_004","question":"判断题：氮气的化学性质不活泼，所以氮气不能与任何物质发生化学反应。（  ）","answer":"答案：错误\n解析：氮气的化学性质不活泼，一般情况下不易与其他物质发生化学反应，但不是不能反应。在一定条件下，氮气也能发生化学反应，例如：\n1. 工业上用氮气和氢气合成氨（N₂ + 3H₂ → 2NH₃）\n2. 放电条件下，氮气和氧气反应生成一氧化氮\n3. 镁条能在氮气中燃烧\n所以\"不活泼\"不等于\"不反应\"，只是反应条件较难、反应较少。"},{"id":"g3_chemistry_004_ex05","knowledge_id":"g3_chemistry_004","question":"选择题：某同学用红磷燃烧法测定空气中氧气的含量，实验后发现测得的氧气体积分数小于1/5。下列原因分析中，不可能的是\nA. 红磷的量不足\nB. 装置漏气\nC. 未冷却至室温就打开弹簧夹\nD. 红磷点燃后伸入集气瓶太慢","answer":"答案：D\n解析：测定空气中氧气含量实验结果偏小（小于1/5）的原因：\nA. 红磷不足，氧气没有完全消耗 → 结果偏小，可能。\nB. 装置漏气，外界空气进入 → 结果偏小，可能。\nC. 未冷却就打开弹簧夹，瓶内气体温度高、压强大，进入的水少 → 结果偏小，可能。\nD. 红磷点燃后伸入集气瓶太慢，塞紧瓶塞前瓶内部分空气受热膨胀逸出 → 冷却后瓶内压强更小，进入的水更多，结果偏大（大于1/5）。不可能偏小。\n所以答案是D。"},{"id":"g3_chemistry_004_ex06","knowledge_id":"g3_chemistry_004","question":"填空题：下列物质中，属于混合物的是______，属于纯净物的是______（填序号）。\n①氧气 ②空气 ③五氧化二磷 ④澄清石灰水 ⑤冰水混合物 ⑥稀有气体 ⑦二氧化碳 ⑧矿泉水","answer":"答案：②④⑥⑧，①③⑤⑦\n解析：\n混合物（由多种物质组成）：\n②空气（含氮气、氧气等多种气体）\n④澄清石灰水（含氢氧化钙和水）\n⑥稀有气体（氦、氖、氩、氪、氙等气体的总称）\n⑧矿泉水（含水和多种矿物质）\n\n纯净物（由一种物质组成）：\n①氧气（O₂，只有一种物质）\n③五氧化二磷（P₂O₅，只有一种物质）\n⑤冰水混合物（冰和水都是H₂O，只是状态不同，是同一种物质，属于纯净物）\n⑦二氧化碳（CO₂，只有一种物质）\n注意：冰水混合物容易被误认为是混合物，但实际上冰和水是同一种物质的不同状态，所以是纯净物。"},{"id":"g3_chemistry_004_ex07","knowledge_id":"g3_chemistry_004","question":"解答题：请回答下列与空气有关的问题：\n（1）空气中含量最多的气体是什么？它有哪些用途？（举两例）\n（2）稀有气体为什么可以作保护气？\n（3）计入空气污染指数的项目有哪些？（举三项）\n（4）保护空气的措施有哪些？（举两条）","answer":"答案：\n（1）氮气（N₂）。用途：制硝酸和化肥、作保护气（如焊接金属时保护金属、食品包装中充氮防腐）、液氮冷冻麻醉等。\n（2）稀有气体化学性质很不活泼（很稳定），一般不与其他物质反应，所以可以作保护气。\n（3）二氧化硫、一氧化碳、二氧化氮、可吸入颗粒物（PM10）、细颗粒物（PM2.5）、臭氧等。（任选三项即可）\n（4）加强大气质量监测；使用清洁能源；积极植树造林种草；减少化石燃料的使用；工厂废气处理后排放等。（任选两条即可）\n解析：\n（1）氮气约占空气体积的78%，是空气中含量最多的气体。化学性质不活泼，用途广泛。\n（2）稀有气体（氦、氖、氩、氪、氙）化学性质极不活泼，曾被称为\"惰性气体\"，常用于保护气、霓虹灯等。\n（3）二氧化碳是空气的成分之一，虽然过多会导致温室效应，但目前不计入空气污染指数。\n（4）保护空气从减少污染物排放和增加吸收两方面入手。"},{"id":"g3_chemistry_004_ex08","knowledge_id":"g3_chemistry_004","question":"选择题：下列关于空气的说法，正确的是\nA. 空气是一种重要的自然资源，其中含量最多的是氧气\nB. 空气中稀有气体约占空气质量的0.94%\nC. 洁净的空气是纯净物\nD. 空气中的氧气主要来自植物的光合作用","answer":"答案：D\n解析：\nA. 空气是重要的自然资源，但含量最多的是氮气（78%），不是氧气（21%）。A错误。\nB. 稀有气体约占空气体积的0.94%，是体积分数，不是质量分数。B错误。\nC. 洁净的空气中仍含有氮气、氧气、二氧化碳等多种物质，是混合物。\"洁净\"不等于\"纯净\"。C错误。\nD. 植物的光合作用吸收二氧化碳，释放氧气，是空气中氧气的主要来源。D正确。"},{"id":"g3_chemistry_004_ex09","knowledge_id":"g3_chemistry_004","question":"判断题：在测定空气中氧气含量的实验中，可以用木炭代替红磷来做实验。（  ）","answer":"答案：错误\n解析：不能用木炭代替红磷。因为木炭燃烧生成二氧化碳气体（C + O₂ → CO₂），消耗氧气的同时又生成了新的气体，瓶内压强变化不大，水不能进入集气瓶或进入很少，无法准确测定氧气含量。\n选择可燃物的条件：\n1. 能在空气中燃烧\n2. 燃烧产物是固体（不能是气体），这样瓶内压强才能明显减小\n3. 只与氧气反应，不与空气中其他成分反应\n红磷燃烧生成五氧化二磷固体，符合要求；木炭、硫粉燃烧生成气体，不能用。"},{"id":"g3_chemistry_004_ex10","knowledge_id":"g3_chemistry_004","question":"选择题：集气瓶中装满某气体，可能是下列气体中的一种：①二氧化碳 ②氧气 ③空气 ④氮气。将燃着的木条伸入瓶中，火焰立即熄灭，则该瓶气体可能是\nA. ①或②\nB. ②或③\nC. ①或④\nD. ③或④","answer":"答案：C\n解析：\n分析各气体对燃着木条的作用：\n①二氧化碳：不支持燃烧，也不能燃烧，木条立即熄灭\n②氧气：支持燃烧，木条燃烧得更旺\n③空气：含有约21%的氧气，木条正常燃烧\n④氮气：不支持燃烧，木条立即熄灭\n木条立即熄灭，说明该气体不支持燃烧，可能是①二氧化碳或④氮气。\n所以选C。"},{"id":"g3_chemistry_005_ex01","knowledge_id":"g3_chemistry_005","question":"选择题：下列关于氧气性质的描述，错误的是\nA. 氧气是无色无味的气体\nB. 氧气不易溶于水\nC. 氧气的密度比空气略大\nD. 氧气具有可燃性","answer":"答案：D\n解析：氧气的物理性质：\n- 通常状况下，氧气是无色、无味的气体\n- 氧气不易溶于水（水中鱼靠溶解的氧气生存）\n- 标准状况下，氧气密度为1.429g/L，比空气（1.293g/L）略大\n- 降温加压可变为淡蓝色液体或淡蓝色雪花状固体\n\n氧气的化学性质：\n- 氧气具有助燃性（支持燃烧），但不具有可燃性，不能燃烧，不能作燃料\n- 氧气化学性质比较活泼，能与许多物质发生化学反应\n所以D错误，氧气有助燃性，没有可燃性。"},{"id":"g3_chemistry_005_ex02","knowledge_id":"g3_chemistry_005","question":"填空题：硫在空气中燃烧发出______色火焰，在氧气中燃烧发出______色火焰，放出热量，生成一种有______气味的气体，该气体是______。硫燃烧实验中，集气瓶底要放少量水的目的是______。","answer":"答案：淡蓝，蓝紫，刺激性，二氧化硫（SO₂），吸收二氧化硫，防止污染空气\n解析：硫燃烧的现象：\n- 在空气中：发出淡蓝色火焰，放出热量，生成有刺激性气味的气体\n- 在氧气中：发出明亮的蓝紫色火焰，放出热量，生成有刺激性气味的气体\n\n反应的文字表达式：硫 + 氧气 --(点燃)→ 二氧化硫（S + O₂ → SO₂）\n\n集气瓶底放水的原因：二氧化硫有毒，会污染空气，二氧化硫能溶于水并与水反应，所以放水可以吸收二氧化硫，防止污染空气。"},{"id":"g3_chemistry_005_ex03","knowledge_id":"g3_chemistry_005","question":"选择题：下列物质在氧气中燃烧，火星四射、生成黑色固体的是\nA. 木炭\nB. 红磷\nC. 铁丝\nD. 硫粉","answer":"答案：C\n解析：各物质在氧气中燃烧的现象：\nA. 木炭：发白光，放出热量，生成使澄清石灰水变浑浊的气体（二氧化碳）\nB. 红磷：产生大量白烟，放出热量，生成白色固体（五氧化二磷）\nC. 铁丝：剧烈燃烧，火星四射，放出大量热，生成黑色固体（四氧化三铁）\nD. 硫粉：发出明亮的蓝紫色火焰，放出热量，生成有刺激性气味的气体（二氧化硫）\n所以答案是C。注意：铁丝在空气中不能燃烧，只能红热；在氧气中才能燃烧。"},{"id":"g3_chemistry_005_ex04","knowledge_id":"g3_chemistry_005","question":"判断题：化合反应一定是氧化反应，氧化反应也一定是化合反应。（  ）","answer":"答案：错误\n解析：化合反应和氧化反应是从不同角度对反应的分类，两者没有必然联系。\n- 化合反应：由两种或两种以上物质生成另一种物质的反应（多变一），是基本反应类型之一。\n- 氧化反应：物质与氧发生的反应（这里的\"氧\"指氧元素，不只是氧气）。\n\n例如：\n- 碳 + 氧气 → 二氧化碳：既是化合反应，又是氧化反应\n- 石蜡 + 氧气 → 二氧化碳 + 水：是氧化反应，但生成物有两种，不是化合反应\n- 二氧化碳 + 水 → 碳酸：是化合反应，但没有氧参与，不是氧化反应\n所以两者是交叉关系，不是包含关系。"},{"id":"g3_chemistry_005_ex05","knowledge_id":"g3_chemistry_005","question":"选择题：下列关于氧气的说法，正确的是\nA. 氧气能支持燃烧，可作燃料\nB. 氧气能跟所有物质发生氧化反应\nC. 水中的鱼能生存，是因为氧气易溶于水\nD. 氧气可用于医疗急救、炼钢、气焊等","answer":"答案：D\n解析：\nA. 氧气能支持燃烧（助燃性），但氧气本身不能燃烧，不能作燃料。A错误。\nB. 氧气化学性质比较活泼，能与许多物质反应，但不是跟所有物质都反应（如金、氧气常温下不反应）。B错误。\nC. 水中的鱼能生存，是因为水中溶解了少量氧气，但氧气是不易溶于水的（不是易溶）。C错误。\nD. 氧气的用途：供给呼吸（医疗急救、潜水、登山等）、支持燃烧（炼钢、气焊、火箭发射助燃剂等）。D正确。"},{"id":"g3_chemistry_005_ex06","knowledge_id":"g3_chemistry_005","question":"填空题：铁丝在氧气中燃烧的实验中，铁丝要绕成螺旋状的目的是______；铁丝末端系一根火柴的作用是______；集气瓶底要放少量水或铺一层细沙的目的是______。","answer":"答案：增大受热面积，提高铁丝温度（或增大与氧气的接触面积）；引燃铁丝；防止高温熔融物溅落，炸裂集气瓶底\n解析：铁丝燃烧实验注意事项：\n1. 铁丝绕成螺旋状：增大铁丝的受热面积，提高铁丝局部温度，同时增大与氧气的接触面积，使铁丝更容易持续燃烧。\n2. 铁丝末端系火柴：火柴燃烧放热，使温度达到铁丝的着火点，引燃铁丝。注意：要等火柴快燃尽时再伸入集气瓶，防止火柴燃烧消耗过多氧气。\n3. 集气瓶底放水或细沙：铁丝燃烧生成高温的四氧化三铁熔融物，溅落下来会使集气瓶底受热不均而炸裂，放水或细沙可以防止炸裂。"},{"id":"g3_chemistry_005_ex07","knowledge_id":"g3_chemistry_005","question":"解答题：有A、B、C、D四种物质。A是无色无味的气体；B在A中燃烧发出明亮的蓝紫色火焰，同时生成一种有刺激性气味的气体C；D是一种无色无味的气体，能使澄清石灰水变浑浊。\n（1）试判断A、B、C、D各是什么物质，写出它们的名称：\nA______，B______，C______，D______。\n（2）写出B在A中燃烧的文字表达式。\n（3）该反应属于基本反应类型中的______反应，同时也是______反应。","answer":"答案：（1）A：氧气，B：硫，C：二氧化硫，D：二氧化碳\n（2）硫 + 氧气 --(点燃)→ 二氧化硫\n（3）化合，氧化\n解析：\n推断题的突破口：\n1. \"B在A中燃烧发出明亮的蓝紫色火焰\"——这是硫在氧气中燃烧的特征现象，所以B是硫，A是氧气。\n2. \"生成有刺激性气味的气体C\"——硫燃烧生成二氧化硫，有刺激性气味，所以C是二氧化硫。\n3. \"D能使澄清石灰水变浑浊\"——这是二氧化碳的特征性质，所以D是二氧化碳。\n\n反应：硫 + 氧气 → 二氧化硫（条件点燃）\n- 两种物质生成一种物质，属于化合反应\n- 物质与氧气发生的反应，属于氧化反应"},{"id":"g3_chemistry_005_ex08","knowledge_id":"g3_chemistry_005","question":"选择题：下列反应中，既属于化合反应又属于氧化反应的是\nA. 酒精 + 氧气 --(点燃)→ 二氧化碳 + 水\nB. 氧化汞 --(加热)→ 汞 + 氧气\nC. 氢气 + 氧气 --(点燃)→ 水\nD. 二氧化碳 + 水 → 碳酸","answer":"答案：C\n解析：\n化合反应：多变一（两种或两种以上物质生成一种物质）\n氧化反应：物质与氧发生的反应\n\nA. 酒精燃烧：生成物有两种，不是化合反应；有氧气参与，是氧化反应。不符合。\nB. 氧化汞分解：反应物一种，生成物两种，是分解反应；没有氧参与，不是氧化反应。不符合。\nC. 氢气燃烧：反应物两种，生成物一种，是化合反应；有氧气参与，是氧化反应。符合。\nD. 二氧化碳和水反应：反应物两种，生成物一种，是化合反应；没有与氧反应，不是氧化反应。不符合。\n所以选C。"},{"id":"g3_chemistry_005_ex09","knowledge_id":"g3_chemistry_005","question":"判断题：缓慢氧化不发光，也不放热。（  ）","answer":"答案：错误\n解析：缓慢氧化是氧化反应的一种，进行得很慢，不容易被察觉。缓慢氧化的特点是：不发光，但放热。\n例如：\n- 动植物的呼吸：放出热量（维持体温）\n- 食物的腐烂：放出热量\n- 酒和醋的酿造：放出热量\n- 农家肥的腐熟：放出热量\n- 铁生锈：放出热量\n缓慢氧化放出的热量虽然不多，但如果热量积累，温度升高，可能引发自燃（如白磷自燃、稻草堆自燃）。所以缓慢氧化是放热的，只是放热慢、温度升得不明显。"},{"id":"g3_chemistry_005_ex10","knowledge_id":"g3_chemistry_005","question":"选择题：下列关于物质在氧气中燃烧现象的描述，正确的是\nA. 红磷在氧气中燃烧，产生大量白雾\nB. 木炭在氧气中燃烧，发出红光，生成二氧化碳\nC. 铁丝在空气中燃烧，火星四射，生成黑色固体\nD. 硫在氧气中燃烧，发出蓝紫色火焰，生成有刺激性气味的气体","answer":"答案：D\n解析：\nA. 红磷燃烧产生大量白烟（五氧化二磷固体小颗粒），不是白雾（白雾是液体小液滴）。A错误。\nB. 木炭在氧气中燃烧发白光，不是红光；\"生成二氧化碳\"是实验结论，不是实验现象（现象是观察到的，结论是推断的）。B错误。\nC. 铁丝在空气中不能燃烧，只能红热；在氧气中才能燃烧，火星四射。C错误。\nD. 硫在氧气中燃烧发出明亮的蓝紫色火焰，生成有刺激性气味的气体。D正确。"},{"id":"g3_chemistry_006_ex01","knowledge_id":"g3_chemistry_006","question":"选择题：实验室制取氧气时，必不可少的最简单的一组仪器是\nA. 试管、酒精灯、带导管的橡胶塞、集气瓶、铁架台\nB. 试管、酒精灯、水槽、集气瓶\nC. 集气瓶、铁架台、试管、带导管的橡胶塞\nD. 铁架台、烧瓶、集气瓶、玻璃片","answer":"答案：A\n解析：实验室制取氧气（加热高锰酸钾或氯酸钾的方法）需要的仪器：\n- 发生装置：试管（反应容器）、酒精灯（加热）、铁架台（固定试管）、带导管的橡胶塞（密封和导气）\n- 收集装置：集气瓶（收集气体）、水槽（排水法收集时用）\n- 其他：玻璃片（盖集气瓶）\n\n题目说\"必不可少的最简单的一组\"，A选项包含了发生装置和收集装置的主要仪器，是最完整的。\nB选项缺少铁架台，无法固定试管。\nC选项缺少酒精灯，无法加热。\nD选项缺少酒精灯和试管等关键仪器。\n所以选A。\n注意：如果是过氧化氢制氧气（不加热），则不需要酒精灯，但需要分液漏斗或长颈漏斗和锥形瓶。"},{"id":"g3_chemistry_006_ex02","knowledge_id":"g3_chemistry_006","question":"填空题：实验室制取氧气的三种方法（写出文字表达式）：\n（1）加热高锰酸钾：______\n（2）加热氯酸钾和二氧化锰：______\n（3）分解过氧化氢：______\n其中，二氧化锰在反应中起______作用，是______剂。","answer":"答案：\n（1）高锰酸钾 --(加热)→ 锰酸钾 + 二氧化锰 + 氧气\n（2）氯酸钾 --(二氧化锰、加热)→ 氯化钾 + 氧气\n（3）过氧化氢 --(二氧化锰)→ 水 + 氧气\n催化，催化\n解析：三种制氧方法：\n1. 加热高锰酸钾（紫黑色固体）：KMnO₄ → K₂MnO₄ + MnO₂ + O₂↑（条件加热）\n2. 加热氯酸钾和二氧化锰（白色固体和黑色固体）：KClO₃ → KCl + O₂↑（条件MnO₂作催化剂、加热）\n3. 过氧化氢（双氧水）和二氧化锰（无色液体和黑色固体）：H₂O₂ → H₂O + O₂↑（条件MnO₂作催化剂，常温）\n\n催化剂：在化学反应里能改变其他物质的化学反应速率，而本身的质量和化学性质在反应前后都没有发生变化的物质。催化剂在反应中起催化作用。"},{"id":"g3_chemistry_006_ex03","knowledge_id":"g3_chemistry_006","question":"选择题：用高锰酸钾制取氧气的实验中，试管口要放一团棉花的作用是\nA. 防止高锰酸钾粉末进入导管，堵塞导管\nB. 防止水倒吸入试管，使试管炸裂\nC. 加快反应速度\nD. 使生成的氧气更纯净","answer":"答案：A\n解析：加热高锰酸钾制取氧气时，试管口要塞一团棉花，目的是防止加热时高锰酸钾粉末进入导管，堵塞导管或进入水槽使水变红。\nB选项是\"试管口略向下倾斜\"的作用，防止冷凝水倒流使试管炸裂。\nC选项催化剂才能加快反应速度，棉花不能加快反应。\nD选项棉花不能使氧气更纯净。\n所以选A。"},{"id":"g3_chemistry_006_ex04","knowledge_id":"g3_chemistry_006","question":"判断题：催化剂只能加快化学反应速率。（  ）","answer":"答案：错误\n解析：催化剂的定义是：能改变其他物质的化学反应速率，而本身的质量和化学性质在反应前后都没有发生变化的物质。\n\"改变\"包括加快和减慢两种情况：\n- 正催化剂：加快反应速率（大多数催化剂）\n- 负催化剂（抑制剂）：减慢反应速率（如橡胶中的防老剂、食品中的防腐剂）\n所以说催化剂\"只能加快\"是错误的，应该是\"改变\"。"},{"id":"g3_chemistry_006_ex05","knowledge_id":"g3_chemistry_006","question":"选择题：用排水法收集氧气时，下列操作正确的是\nA. 刚开始加热时，导管口有气泡冒出立即收集\nB. 收集满氧气后，将集气瓶拿出水面，再盖上玻璃片\nC. 实验结束时，先熄灭酒精灯，再将导管移出水面\nD. 收集满氧气后，在水下盖上玻璃片，再将集气瓶拿出水面，正放在桌面上","answer":"答案：D\n解析：\nA. 刚开始加热时排出的是试管内的空气，立即收集会使收集的氧气不纯。要等气泡连续均匀冒出时再收集。A错误。\nB. 收集满后应在水下盖上玻璃片，再拿出水面，否则氧气会逸出。B错误。\nC. 实验结束时应先将导管移出水面，再熄灭酒精灯，防止水倒吸使试管炸裂。C错误。\nD. 排水法收集满后，在水下盖玻璃片，拿出后正放（因为氧气密度比空气大，正放不易逸散）。D正确。"},{"id":"g3_chemistry_006_ex06","knowledge_id":"g3_chemistry_006","question":"填空题：检验氧气的方法是______；检验氧气收集满的方法（排水法）是______；向上排空气法验满的方法是______。","answer":"答案：将带火星的木条伸入集气瓶中，若木条复燃，证明是氧气；当集气瓶口有大气泡冒出时，证明已收集满；将带火星的木条放在集气瓶口，若木条复燃，证明已收集满\n解析：\n1. 检验氧气（验满）的区别：\n- 检验：不知道这瓶气体是不是氧气 → 将带火星的木条伸入瓶中，复燃则是氧气\n- 验满：知道是氧气，看满不满 → 将带火星的木条放在瓶口，复燃则满\n\n2. 排水法验满：气泡从瓶口向外冒出，说明水排完了，收集满了。\n\n3. 向上排空气法验满：氧气密度比空气大，从瓶底往上满，所以木条放瓶口，复燃说明已满。"},{"id":"g3_chemistry_006_ex07","knowledge_id":"g3_chemistry_006","question":"解答题：实验室用高锰酸钾制取氧气的实验步骤（排水法收集），请回答：\n（1）实验开始前，首先要进行的操作是什么？\n（2）试管口为什么要略向下倾斜？\n（3）加热时为什么要先预热？\n（4）用排水法收集氧气，什么时候开始收集？\n（5）实验结束时，为什么要先移导管后熄灯？\n（6）收集到的氧气不纯，可能的原因有哪些？（写两条）","answer":"答案：\n（1）检查装置的气密性\n（2）防止冷凝水回流到热的试管底部，使试管炸裂\n（3）使试管均匀受热，防止试管炸裂\n（4）当气泡连续并均匀地冒出时开始收集\n（5）防止水槽中的水倒吸入热的试管，使试管炸裂\n（6）①装置漏气；②未等气泡连续均匀冒出就开始收集；③集气瓶内未装满水，留有空气（任选两条即可）\n解析：\n（1）有气体参与的实验，装药品前必须检查装置气密性，防止漏气。\n（2）固体加热时，药品中的水分蒸发后在试管口冷凝成水滴，若试管口向上，水倒流回试管底，冷热相遇试管炸裂。\n（3）玻璃仪器受热不均易炸裂，先预热使试管均匀受热。\n（4）开始排出的是试管内的空气，等气泡连续均匀冒出时，说明空气排完了，此时收集的氧气较纯。\n（5）先熄灯，试管内温度降低，压强减小，水会沿导管倒吸入试管，使试管炸裂。\n（6）不纯的原因从\"混有空气\"角度分析：装置漏气会进空气；刚开始就收集，收集了刚开始排出的空气；集气瓶没装满水，本身就有空气。"},{"id":"g3_chemistry_006_ex08","knowledge_id":"g3_chemistry_006","question":"选择题：下列反应中，属于分解反应的是\nA. 木炭 + 氧气 --(点燃)→ 二氧化碳\nB. 石蜡 + 氧气 --(点燃)→ 二氧化碳 + 水\nC. 过氧化氢 --(二氧化锰)→ 水 + 氧气\nD. 铁 + 氧气 --(点燃)→ 四氧化三铁","answer":"答案：C\n解析：分解反应：由一种物质生成两种或两种以上其他物质的反应（一变多），是基本反应类型之一。\n化合反应：由两种或两种以上物质生成一种物质的反应（多变一）。\n\nA. 碳 + 氧气 → 二氧化碳：多变一，是化合反应。\nB. 石蜡 + 氧气 → 二氧化碳 + 水：反应物两种，生成物两种，既不是化合反应也不是分解反应。\nC. 过氧化氢 → 水 + 氧气：一变多，是分解反应。\nD. 铁 + 氧气 → 四氧化三铁：多变一，是化合反应。\n所以选C。"},{"id":"g3_chemistry_006_ex09","knowledge_id":"g3_chemistry_006","question":"判断题：二氧化锰是催化剂，所有化学反应都需要催化剂。（  ）","answer":"答案：错误\n解析：这个说法有两处错误：\n1. 二氧化锰不一定是催化剂。催化剂是针对具体反应而言的，二氧化锰在过氧化氢分解、氯酸钾分解反应中是催化剂，但在高锰酸钾分解反应中是生成物。所以不能笼统地说二氧化锰是催化剂，要看具体反应。\n2. 不是所有化学反应都需要催化剂。很多反应不需要催化剂也能进行，比如木炭燃烧、铁丝燃烧等，有些反应需要催化剂，有些不需要。催化剂只是改变反应速率，不是反应能不能发生不取决于催化剂。"},{"id":"g3_chemistry_006_ex10","knowledge_id":"g3_chemistry_006","question":"选择题：实验室制取氧气的方法有多种，下列说法正确的是\nA. 必须加热高锰酸钾制氧气时，试管口不需要放一团棉花\nB. 用过氧化氢和二氧化锰混合制氧气时，二氧化锰增加了氧气的质量\nC. 工业上制取氧气是分解反应\nD. 用高锰酸钾制氧气时，实验结束先移导管后熄灯，是为了防止水倒吸使试管炸裂","answer":"答案：D\n解析：\nA. 加热高锰酸钾制氧气时，试管口要塞一团棉花，防止粉末进入导管。A说\"不需要\"，错误。\nB. 催化剂只能改变反应速率，不能改变生成物的质量。二氧化锰是催化剂，不能增加氧气的质量。B错误。\nC. 工业上制取氧气是利用液氮和液氧的沸点不同，分离液态空气，属于物理变化，不是分解反应（分解反应是化学变化）。C错误。\nD. 先移导管后熄灯，防止水槽中的水倒吸入热的试管，使试管炸裂。D正确。"},{"id":"g3_chemistry_007_ex01","knowledge_id":"g3_chemistry_007","question":"选择题：下列关于分子的说法，正确的是（  ）\nA. 分子是构成物质的最小粒子\nB. 分子是保持物质化学性质的最小粒子\nC. 分子是保持物质物理性质的最小粒子\nD. 分子是不可再分的粒子","answer":"答案：B\n解析：分子是保持物质化学性质的最小粒子。选项A错误，因为分子还可以再分为原子；选项C错误，物质的物理性质（如颜色、状态、密度等）是由大量分子聚集在一起表现出来的，单个分子不能保持物质的物理性质；选项D错误，分子在化学变化中可以再分。"},{"id":"g3_chemistry_007_ex02","knowledge_id":"g3_chemistry_007","question":"填空题：1滴水中大约含有1.67×10²¹个水分子，这说明分子的______和______都很小。","answer":"答案：质量，体积\n解析：1滴水的质量约为0.05g，体积约为0.05mL，却含有1.67×10²¹个水分子，说明分子的质量和体积都非常小。如果把水分子与乒乓球相比，就相当于乒乓球与地球相比。"},{"id":"g3_chemistry_007_ex03","knowledge_id":"g3_chemistry_007","question":"选择题：从分子的角度分析，下列解释错误的是（  ）\nA. 酒香不怕巷子深——分子在不断运动\nB. 热胀冷缩——分子的大小随温度改变而改变\nC. 给轮胎打气——分子之间有间隔\nD. 湿衣服在阳光下比在阴凉处干得快——温度高，分子运动速率快","answer":"答案：B\n解析：热胀冷缩是因为分子之间的间隔随温度改变而改变，温度升高时间隔变大，温度降低时间隔变小，而分子本身的大小不变。选项A正确，酒精分子不断运动扩散到空气中；选项C正确，空气可以被压入轮胎是因为分子间有间隔；选项D正确，温度越高分子运动越快。"},{"id":"g3_chemistry_007_ex04","knowledge_id":"g3_chemistry_007","question":"判断题：原子是化学变化中的最小粒子，所以原子在任何情况下都不能再分。（  ）","answer":"答案：错误\n解析：原子是化学变化中的最小粒子，即在化学变化中原子不能再分。但原子本身是有结构的，可以再分为原子核和核外电子，原子核又可以分为质子和中子。只是在化学变化中，原子的种类和数目不会改变。"},{"id":"g3_chemistry_007_ex05","knowledge_id":"g3_chemistry_007","question":"选择题：下列变化中，能说明分子可以再分的是（  ）\nA. 水蒸发变成水蒸气\nB. 将胆矾研磨成粉末\nC. 水通电分解生成氢气和氧气\nD. 100mL水和100mL酒精混合后总体积小于200mL","answer":"答案：C\n解析：在化学变化中，分子可以再分，原子不能再分。选项C水通电分解是化学变化，水分子分解成氢原子和氧原子，氢原子重新结合成氢分子，氧原子重新结合成氧分子，说明分子可以再分。选项A、B、D都是物理变化，分子本身没有改变。"},{"id":"g3_chemistry_007_ex06","knowledge_id":"g3_chemistry_007","question":"填空题：用分子的观点解释：（1）混合物与纯净物的区别是______；（2）物理变化与化学变化的区别是______。","answer":"答案：（1）混合物是由不同种分子构成的，纯净物是由同种分子构成的；（2）物理变化中分子本身没有改变，只是分子间的间隔发生变化；化学变化中分子本身发生改变，生成了新的分子\n解析：从微观角度看，纯净物只含一种分子，混合物含有多种分子。物理变化中分子不变，只是分子间间隔或运动状态改变；化学变化中分子破裂为原子，原子重新组合成新分子。"},{"id":"g3_chemistry_007_ex07","knowledge_id":"g3_chemistry_007","question":"选择题：将50mL水与50mL酒精混合，所得溶液体积小于100mL。下列对此现象的解释，最合理的是（  ）\nA. 分子的质量和体积都很小\nB. 分子是由原子构成的\nC. 分子之间有间隔\nD. 分子总是在不断运动","answer":"答案：C\n解析：50mL水和50mL酒精混合后体积小于100mL，是因为水分子和酒精分子之间有间隔，混合时两种分子相互穿插渗透，进入彼此的间隔中，所以总体积减小。这说明分子之间存在间隔。"},{"id":"g3_chemistry_007_ex08","knowledge_id":"g3_chemistry_007","question":"判断题：分子的质量和体积一定比原子大，因为分子是由原子构成的。（  ）","answer":"答案：错误\n解析：分子和原子不能简单比较大小。分子由原子构成，对于由原子直接构成的分子来说，分子比构成它的原子大，比如氧分子（O₂）比氧原子大。但不同种类的分子和原子之间无法比较大小，例如氢分子很小，而汞原子比氢分子大得多。"},{"id":"g3_chemistry_007_ex09","knowledge_id":"g3_chemistry_007","question":"解答题：请用分子和原子的观点解释水蒸发和水通电分解这两种变化的本质区别。","answer":"答案：水蒸发是物理变化，水分子本身没有改变，只是水分子间的间隔变大，水分子运动速率加快，由液态变为气态；水通电分解是化学变化，水分子破裂成氢原子和氧原子，每2个氢原子结合成1个氢分子，每2个氧原子结合成1个氧分子，生成了新的物质（氢气和氧气）。\n解析：物理变化和化学变化的本质区别在于是否有新物质生成。从微观角度看，物理变化中分子本身不变，只是分子间间隔或运动状态改变；化学变化中分子破裂，原子重新组合成新分子，有新物质生成。"},{"id":"g3_chemistry_007_ex10","knowledge_id":"g3_chemistry_007","question":"选择题：下列说法中，正确的个数有（  ）\n①分子可以构成物质，原子不能直接构成物质\n②分子是保持物质性质的最小粒子\n③分子和原子的本质区别是分子可分，原子不可分\n④同种分子构成的物质一定是纯净物\nA. 1个\nB. 2个\nC. 3个\nD. 4个","answer":"答案：A\n解析：①错误，原子也可以直接构成物质，如金属铁由铁原子直接构成；②错误，分子是保持物质化学性质的最小粒子，不能保持物理性质；③错误，分子和原子的本质区别是在化学变化中分子可分，原子不可分，原子本身也有结构可以再分；④正确，纯净物由同种分子构成，混合物由不同种分子构成。所以正确的只有1个。"},{"id":"g3_chemistry_008_ex01","knowledge_id":"g3_chemistry_008","question":"选择题：下列关于原子结构的说法，正确的是（  ）\nA. 原子是实心球体\nB. 原子核都由质子和中子构成\nC. 原子的质量主要集中在原子核上\nD. 原子核带正电，电子带负电，所以原子带电","answer":"答案：C\n解析：选项A错误，原子不是实心球体，原子内部有很大空间；选项B错误，氢原子核内只有1个质子，没有中子；选项C正确，电子质量很小（约为质子质量的1/1836），原子质量主要集中在原子核上；选项D错误，原子核所带正电荷数与核外电子所带负电荷数相等，电性相反，所以整个原子不显电性。"},{"id":"g3_chemistry_008_ex02","knowledge_id":"g3_chemistry_008","question":"填空题：碳原子的核电荷数为6，核内有6个质子，则碳原子核外有______个电子，相对原子质量约为12，则碳原子核内有______个中子。","answer":"答案：6，6\n解析：在原子中，核电荷数=质子数=核外电子数，所以碳原子核外电子数为6。相对原子质量≈质子数+中子数，所以中子数=12-6=6。"},{"id":"g3_chemistry_008_ex03","knowledge_id":"g3_chemistry_008","question":"选择题：已知某原子的核外电子数为26，中子数比质子数多4，则该原子的相对原子质量约为（  ）\nA. 26\nB. 30\nC. 56\nD. 52","answer":"答案：C\n解析：在原子中，质子数=核外电子数=26。中子数比质子数多4，所以中子数=26+4=30。相对原子质量≈质子数+中子数=26+30=56。"},{"id":"g3_chemistry_008_ex04","knowledge_id":"g3_chemistry_008","question":"判断题：相对原子质量就是原子的实际质量。（  ）","answer":"答案：错误\n解析：相对原子质量是以一种碳原子（碳-12）质量的1/12为标准，其他原子的质量与它相比较所得到的比。相对原子质量是一个比值，单位是\"1\"，常省略不写，不是原子的实际质量。原子的实际质量很小，如1个氢原子的质量约为1.67×10⁻²⁷kg。"},{"id":"g3_chemistry_008_ex05","knowledge_id":"g3_chemistry_008","question":"选择题：下列粒子结构示意图中，表示原子的是（  ）\nA. +11  2  8  1\nB. +11  2  8\nC. +17  2  8  8\nD. +8  2  8","answer":"答案：A\n解析：在原子中，质子数=核外电子数。选项A质子数为11，核外电子数=2+8+1=11，质子数=电子数，是原子；选项B质子数11，电子数10，质子数>电子数，是阳离子；选项C质子数17，电子数18，质子数<电子数，是阴离子；选项D质子数8，电子数10，质子数<电子数，是阴离子。"},{"id":"g3_chemistry_008_ex06","knowledge_id":"g3_chemistry_008","question":"填空题：某元素的原子结构示意图为 +17  2  8  7，该原子的核电荷数为______，核外有______个电子层，最外层有______个电子，在化学反应中容易______（填\"得到\"或\"失去\"）电子。","answer":"答案：17，3，7，得到\n解析：原子结构示意图中，圆圈内数字表示核电荷数（质子数），弧线表示电子层，弧线上的数字表示该层的电子数。该原子核电荷数为17，有3个电子层，最外层有7个电子。最外层电子数大于4，在化学反应中容易得到电子形成阴离子。"},{"id":"g3_chemistry_008_ex07","knowledge_id":"g3_chemistry_008","question":"选择题：下列关于钠原子和钠离子的说法，正确的是（  ）\nA. 它们的核外电子数相同\nB. 它们的化学性质相同\nC. 它们属于同一种元素\nD. 它们都是带电的粒子","answer":"答案：C\n解析：钠原子失去最外层的1个电子形成钠离子。选项A错误，钠原子有11个电子，钠离子有10个电子；选项B错误，化学性质由最外层电子数决定，钠原子最外层1个电子，钠离子最外层8个电子，化学性质不同；选项C正确，它们的质子数都是11，属于同一种元素（钠元素）；选项D错误，钠原子不显电性，钠离子带正电。"},{"id":"g3_chemistry_008_ex08","knowledge_id":"g3_chemistry_008","question":"判断题：最外层电子数为8的粒子一定是稀有气体元素的原子。（  ）","answer":"答案：错误\n解析：最外层电子数为8的粒子不一定是稀有气体元素的原子，还可能是阳离子或阴离子。例如钠离子（Na⁺）最外层电子数为8，但它不是原子而是阳离子；氯离子（Cl⁻）最外层电子数也为8，是阴离子。只有原子且最外层电子数为8（氦为2）时，才是稀有气体元素的原子。"},{"id":"g3_chemistry_008_ex09","knowledge_id":"g3_chemistry_008","question":"解答题：已知一个碳-12原子的质量为1.993×10⁻²⁶kg，一个铁原子的质量为9.288×10⁻²⁶kg，请计算铁原子的相对原子质量（结果保留整数）。","answer":"答案：铁原子的相对原子质量约为56\n解析：相对原子质量 = 原子的实际质量 ÷（碳-12原子质量 × 1/12）\n铁的相对原子质量 = 9.288×10⁻²⁶kg ÷（1.993×10⁻²⁶kg × 1/12）\n= 9.288×10⁻²⁶ ÷ 1.661×10⁻²⁷\n≈ 56\n所以铁原子的相对原子质量约为56。"},{"id":"g3_chemistry_008_ex10","knowledge_id":"g3_chemistry_008","question":"选择题：元素X的核电荷数为a，它的阳离子Xᵐ⁺与元素Y的阴离子Yⁿ⁻的电子层结构相同，则元素Y的核电荷数是（  ）\nA. a + m + n\nB. a - m - n\nC. a + m - n\nD. a - m + n","answer":"答案：B\n解析：Xᵐ⁺是X原子失去m个电子形成的，所以Xᵐ⁺的核外电子数 = a - m。\nYⁿ⁻是Y原子得到n个电子形成的，设Y的核电荷数为b，则Yⁿ⁻的核外电子数 = b + n。\n因为Xᵐ⁺与Yⁿ⁻电子层结构相同，即核外电子数相等，所以：\na - m = b + n\nb = a - m - n\n所以元素Y的核电荷数是a - m - n。"},{"id":"g3_chemistry_009_ex01","knowledge_id":"g3_chemistry_009","question":"选择题：决定元素种类的是（  ）\nA. 质子数\nB. 中子数\nC. 电子数\nD. 最外层电子数","answer":"答案：A\n解析：元素是质子数（即核电荷数）相同的一类原子的总称。不同种元素最本质的区别是质子数不同，所以决定元素种类的是质子数（即核电荷数）。选项D最外层电子数决定元素的化学性质。"},{"id":"g3_chemistry_009_ex02","knowledge_id":"g3_chemistry_009","question":"填空题：地壳中含量最多的元素是______，含量最多的金属元素是______，二者组成的化合物的化学式为______。","answer":"答案：氧（O），铝（Al），Al₂O₃\n解析：地壳中含量居前五位的元素依次是氧、硅、铝、铁、钙。含量最多的元素是氧元素（O），含量最多的金属元素是铝元素（Al）。铝元素化合价为+3价，氧元素化合价为-2价，二者组成的化合物是氧化铝，化学式为Al₂O₃。"},{"id":"g3_chemistry_009_ex03","knowledge_id":"g3_chemistry_009","question":"选择题：下列各组粒子中，属于同一种元素的是（  ）\nA. Cl和Cl⁻\nB. CO₂和CO\nC. H₂和O₂\nD. Ne和Na⁺","answer":"答案：A\n解析：元素是质子数相同的一类原子的总称，同种元素的粒子质子数相同。选项A中Cl和Cl⁻质子数都是17，属于同种元素（氯元素）；选项B中CO₂和CO是分子，不是同一种元素；选项C中H₂和O₂分别由氢元素和氧元素组成；选项D中Ne质子数为10，Na⁺质子数为11，不是同种元素。"},{"id":"g3_chemistry_009_ex04","knowledge_id":"g3_chemistry_009","question":"判断题：元素周期表中，同一周期的元素从左到右原子序数依次递增，电子层数相同。（  ）","answer":"答案：正确\n解析：元素周期表中，横行叫做周期，共有7个周期。同一周期的元素，电子层数相同，从左到右原子序数（即质子数）依次递增，最外层电子数也依次递增。"},{"id":"g3_chemistry_009_ex05","knowledge_id":"g3_chemistry_009","question":"选择题：元素周期表是学习和研究化学的重要工具。右图是元素周期表中氯元素的示意图，下列说法不正确的是（  ）\n 17  Cl\n 氯 35.45\nA. 氯元素符号为Cl\nB. 氯原子的核内质子数为17\nC. 氯元素属于金属元素\nD. 氯的相对原子质量为35.45","answer":"答案：C\n解析：元素周期表中，左上角数字表示原子序数（等于质子数），右上角字母表示元素符号，中间汉字表示元素名称，下方数字表示相对原子质量。选项C错误，氯元素名称带\"气\"字头，属于非金属元素，不是金属元素。"},{"id":"g3_chemistry_009_ex06","knowledge_id":"g3_chemistry_009","question":"填空题：人体中含量最多的元素是______，空气中含量最多的元素是______，海水中含量最多的元素是______。","answer":"答案：氧（O），氮（N），氧（O）\n解析：人体中水的质量约占体重的70%，所以人体中含量最多的元素是氧元素；空气中氮气约占78%，所以空气中含量最多的元素是氮元素；海水中水的质量约占96.5%，所以海水中含量最多的元素是氧元素。"},{"id":"g3_chemistry_009_ex07","knowledge_id":"g3_chemistry_009","question":"选择题：下列符号中，既能表示一种元素，又能表示一个原子，还能表示一种物质的是（  ）\nA. H\nB. O₂\nC. Fe\nD. N","answer":"答案：C\n解析：元素符号能表示一种元素和一个原子。由原子直接构成的物质（金属、稀有气体、某些非金属固体），其元素符号还能表示该物质。选项A H表示氢元素和1个氢原子，但氢气是H₂，不能直接表示氢气；选项B O₂是化学式，不是元素符号；选项C Fe表示铁元素、1个铁原子，还表示铁这种物质；选项D N表示氮元素和1个氮原子，氮气是N₂。"},{"id":"g3_chemistry_009_ex08","knowledge_id":"g3_chemistry_009","question":"判断题：一种元素只能组成一种物质。（  ）","answer":"答案：错误\n解析：一种元素可以组成多种不同的物质，这些物质互为同素异形体。例如氧元素可以组成氧气（O₂）和臭氧（O₃）；碳元素可以组成金刚石、石墨、C₆₀等多种物质。"},{"id":"g3_chemistry_009_ex09","knowledge_id":"g3_chemistry_009","question":"解答题：有A、B、C三种元素，A元素的原子核内只有1个质子；B元素的原子有3个电子层，最外层有7个电子；C元素的单质在空气中燃烧，发出耀眼的白光，生成白色固体。请推断：\n（1）A、B、C三种元素的元素符号分别是什么？\n（2）A和B组成的化合物的化学式是什么？","answer":"答案：（1）A是H，B是Cl，C是Mg；（2）HCl\n解析：（1）A元素原子核内只有1个质子，说明A是氢元素（H）；B元素有3个电子层，最外层7个电子，核外电子总数=2+8+7=17，质子数为17，是氯元素（Cl）；C元素单质在空气中燃烧发出耀眼白光，生成白色固体，这是镁条燃烧的现象，所以C是镁元素（Mg）。\n（2）氢元素化合价为+1价，氯元素化合价为-1价，二者组成的化合物是氯化氢，化学式为HCl。"},{"id":"g3_chemistry_009_ex10","knowledge_id":"g3_chemistry_009","question":"选择题：下列说法正确的个数有（  ）\n①同种元素组成的物质一定是单质\n②具有相同质子数的粒子一定属于同种元素\n③不同元素的根本区别是质子数不同\n④元素周期表共有7个周期和16个族\nA. 1个\nB. 2个\nC. 3个\nD. 4个","answer":"答案：B\n解析：①错误，同种元素组成的物质不一定是单质，例如氧气和臭氧混合，只含氧元素，但属于混合物，不是单质；②错误，\"粒子\"可能是分子、原子、离子等，例如水分子（H₂O）和氖原子（Ne）质子数都是10，但不属于同种元素；③正确，不同元素的根本区别是质子数不同；④正确，元素周期表有7个周期（7个横行），16个族（18个纵行，其中8、9、10三个纵行组成一个族）。所以正确的有2个。"},{"id":"g3_chemistry_010_ex01","knowledge_id":"g3_chemistry_010","question":"选择题：下列关于水资源的说法，正确的是（  ）\nA. 地球上的水资源十分丰富，取之不尽，用之不竭\nB. 地球上淡水储量约占全球总水量的2.53%\nC. 人类可以直接利用的淡水占全球总水量的96.5%\nD. 海水是纯净物，可以直接饮用","answer":"答案：B\n解析：选项A错误，地球上总水量很大，但淡水很少，且分布不均；选项B正确，地球上淡水储量约占全球总水量的2.53%；选项C错误，海洋水约占全球总水量的96.5%，人类可以直接利用的淡水还不到总水量的1%；选项D错误，海水中含有多种物质，是混合物，不能直接饮用。"},{"id":"g3_chemistry_010_ex02","knowledge_id":"g3_chemistry_010","question":"填空题：爱护水资源一方面要______，另一方面要______。","answer":"答案：节约用水，防治水体污染\n解析：爱护水资源主要从两方面入手：一是节约用水，提高水的利用效益；二是防治水体污染，减少对水资源的破坏。日常生活中可以通过一水多用、使用节水器具等方式节约用水；工业、农业和生活污水需处理达标后排放以防治水体污染。"},{"id":"g3_chemistry_010_ex03","knowledge_id":"g3_chemistry_010","question":"选择题：下列做法中，不利于节约用水的是（  ）\nA. 洗菜水用来浇花\nB. 使用节水龙头\nC. 用流动的水给西瓜降温\nD. 工业用水循环使用","answer":"答案：C\n解析：选项A洗菜水浇花属于一水多用，可以节约用水；选项B使用节水龙头可以减少水的浪费；选项C用流动的水给西瓜降温会造成大量水资源浪费，不利于节约用水；选项D工业用水循环使用可以提高水的利用率，节约用水。"},{"id":"g3_chemistry_010_ex04","knowledge_id":"g3_chemistry_010","question":"判断题：水体污染的来源主要有工业污染、农业污染和生活污染。（  ）","answer":"答案：正确\n解析：水体污染的来源主要有三个方面：（1）工业污染：工业废水的任意排放；（2）农业污染：农药、化肥的不合理施用；（3）生活污染：生活污水的任意排放。这三方面的污染都会导致水质恶化，影响水生生态和人类健康。"},{"id":"g3_chemistry_010_ex05","knowledge_id":"g3_chemistry_010","question":"选择题：2025年世界水日的主题是\"水与可持续发展\"。下列做法会造成水体污染的是（  ）\nA. 工业废水处理达标后排放\nB. 生活污水集中处理后排放\nC. 在水库周边兴建化工厂\nD. 合理使用农药和化肥","answer":"答案：C\n解析：选项A工业废水处理达标后排放，可以减少水体污染；选项B生活污水集中处理后排放，可以防止生活污染；选项C在水库周边兴建化工厂，如果化工厂的废水、废气处理不当，容易造成水库水体污染；选项D合理使用农药和化肥可以减少农业污染，过量使用才会造成污染。"},{"id":"g3_chemistry_010_ex06","knowledge_id":"g3_chemistry_010","question":"填空题：一个坏了的水龙头每秒钟滴2滴水，每20滴水约为1mL。请计算这个水龙头一天（24小时）浪费水的体积约为______L。","answer":"答案：8.64\n解析：1天=24小时=24×60×60=86400秒\n每秒滴2滴水，一天滴水总数=86400×2=172800滴\n每20滴为1mL，所以浪费水的体积=172800÷20=8640mL=8.64L\n所以这个水龙头一天浪费约8.64升水。"},{"id":"g3_chemistry_010_ex07","knowledge_id":"g3_chemistry_010","question":"选择题：某学校组织学生调查当地水资源状况，下列调查结论中错误的是（  ）\nA. 我国水资源总量丰富，但人均水量少\nB. 地球上可利用的淡水资源有限，要节约用水\nC. 东南沿海地区水资源丰富，不存在缺水问题\nD. 生活污水的任意排放会造成水体污染","answer":"答案：C\n解析：选项A正确，我国水资源总量居世界第六位，但人均水量约为世界人均水量的1/4；选项B正确，地球上可利用的淡水资源不到总水量的1%，十分有限；选项C错误，东南沿海地区虽然降水较多，但人口密集、工业发达，用水量大，也存在水质型缺水等问题；选项D正确，生活污水任意排放是水体污染的重要来源。"},{"id":"g3_chemistry_010_ex08","knowledge_id":"g3_chemistry_010","question":"判断题：地球上的总水储量虽然很大，但大部分是海水，淡水只约占全球水储量的2.53%，而可利用的淡水还不到其中的30.4%。（  ）","answer":"答案：正确\n解析：地球表面约71%被水覆盖，但海洋水约占全球总水量的96.5%，淡水只约占2.53%。淡水中大部分分布在两极和高山的冰雪及永久冻土层中，难以利用，可利用的淡水只约占淡水总量的30.4%，即不到全球总水量的1%。"},{"id":"g3_chemistry_010_ex09","knowledge_id":"g3_chemistry_010","question":"解答题：某化工厂每天排放未经处理的废水约500吨，其中含有的污染物浓度严重超标。请回答：\n（1）这些废水如果直接排入河流，会造成哪些危害？（至少答3点）\n（2）请你提出防治水体污染的合理化建议。（至少答3点）","answer":"答案：（1）危害：①造成水质恶化，鱼虾等水生生物死亡，破坏水生生态系统；②人饮用被污染的水后会危害人体健康，引发疾病；③用被污染的水灌溉农田，会污染土壤，导致农产品质量下降，甚至危害食品安全。\n（2）建议：①工业废水必须处理达标后再排放；②农业上合理使用农药和化肥，提倡使用农家肥；③生活污水要集中处理后排放；④加强水质监测，严格执法；⑤推广使用无磷洗衣粉，减少水体富营养化。\n解析：水体污染不仅影响工农业生产，还直接威胁人体健康和生态平衡。防治水体污染需要从污染源入手，工业、农业、生活多方面综合治理。"},{"id":"g3_chemistry_010_ex10","knowledge_id":"g3_chemistry_010","question":"选择题：下列说法中正确的个数有（  ）\n①我国人均水量约为世界人均水量的1/4\n②节约用水就是要提高水的利用效益\n③工业废水只要无色透明就可以直接排放\n④农业上提倡使用农家肥，合理使用农药和化肥\n⑤生活污水集中处理后排放有利于保护水资源\nA. 2个\nB. 3个\nC. 4个\nD. 5个","answer":"答案：C\n解析：①正确，我国人均水量约为世界人均水量的1/4；②正确，节约用水的核心就是提高水的利用效益；③错误，无色透明的水不一定没有污染，可能含有可溶性的有害物质，必须检测达标才能排放；④正确，合理使用农药化肥、提倡农家肥可以减少农业污染；⑤正确，生活污水集中处理后排放可以防止生活污染。所以正确的有4个。"},{"id":"g3_chemistry_011_ex01","knowledge_id":"g3_chemistry_011","question":"选择题：下列净化水的方法中，净化程度最高的是（  ）\nA. 沉淀\nB. 过滤\nC. 吸附\nD. 蒸馏","answer":"答案：D\n解析：沉淀只能使水中的不溶性大颗粒固体沉降；过滤可以除去水中的不溶性固体杂质；吸附可以除去水中的色素和异味，以及部分可溶性杂质；蒸馏通过加热使水变成水蒸气，再冷凝成水，可以除去水中所有杂质，得到的蒸馏水是纯净物，净化程度最高。"},{"id":"g3_chemistry_011_ex02","knowledge_id":"g3_chemistry_011","question":"填空题：在自来水厂净水过程中，常用的净水方法依次是______、______、______、______。其中活性炭的作用是______，投药消毒属于______变化。","answer":"答案：沉淀，过滤，吸附，消毒；吸附水中的色素和异味，化学\n解析：自来水厂净水流程：取水→沉淀（加絮凝剂明矾）→过滤→吸附（活性炭）→消毒（投药）→配水。活性炭具有疏松多孔的结构，能吸附水中的色素和异味。投药消毒过程中有新物质生成，属于化学变化。"},{"id":"g3_chemistry_011_ex03","knowledge_id":"g3_chemistry_011","question":"选择题：关于过滤操作的下列叙述中，正确的是（  ）\nA. 可以降低水的硬度\nB. 玻璃棒要靠在单层滤纸的一边\nC. 漏斗下端的管口要紧靠烧杯的内壁\nD. 滤纸的边缘要高于漏斗口","answer":"答案：C\n解析：选项A错误，过滤只能除去不溶性杂质，不能除去可溶性的钙、镁化合物，所以不能降低水的硬度；选项B错误，玻璃棒要靠在三层滤纸的一边，防止戳破滤纸；选项C正确，漏斗下端管口紧靠烧杯内壁，可以防止滤液溅出；选项D错误，滤纸的边缘要低于漏斗口，液面要低于滤纸边缘。"},{"id":"g3_chemistry_011_ex04","knowledge_id":"g3_chemistry_011","question":"判断题：硬水是混合物，软水是纯净物。（  ）","answer":"答案：错误\n解析：硬水是含有较多可溶性钙、镁化合物的水；软水是不含或含较少可溶性钙、镁化合物的水。硬水和软水都是混合物，都含有多种物质。软水只是钙镁化合物含量少，但仍然含有其他物质，不是纯净物。蒸馏水可以看作纯净物，但软水不一定是蒸馏水。"},{"id":"g3_chemistry_011_ex05","knowledge_id":"g3_chemistry_011","question":"选择题：要鉴别硬水和软水，可以选用的试剂是（  ）\nA. 食盐水\nB. 肥皂水\nC. 石灰水\nD. 蒸馏水","answer":"答案：B\n解析：鉴别硬水和软水通常使用肥皂水。方法是：取等量的水样，分别加入等量的肥皂水，振荡。产生泡沫多、浮渣少的是软水；产生泡沫少、浮渣多的是硬水。这是因为硬水中的钙、镁化合物会与肥皂反应，生成不溶性物质，从而减少泡沫。"},{"id":"g3_chemistry_011_ex06","knowledge_id":"g3_chemistry_011","question":"填空题：生活中常用______的方法降低水的硬度；实验室中常用______的方法降低水的硬度。","answer":"答案：煮沸，蒸馏\n解析：硬水软化的方法有多种。生活中常用煮沸的方法，加热煮沸时，水中可溶性的钙、镁化合物会转化为沉淀（水垢），从而降低水的硬度。实验室中常用蒸馏的方法，可以得到几乎纯净的蒸馏水，硬度几乎为零。工业上常用离子交换法等。"},{"id":"g3_chemistry_011_ex07","knowledge_id":"g3_chemistry_011","question":"选择题：某同学在做过滤实验时，发现过滤后的液体仍然浑浊。下列原因分析中不可能的是（  ）\nA. 滤纸破损\nB. 液面高于滤纸边缘\nC. 仪器不干净\nD. 玻璃棒紧靠三层滤纸处","answer":"答案：D\n解析：过滤后滤液仍然浑浊的可能原因有：①滤纸破损，液体从破损处流下，没有经过过滤；②液面高于滤纸边缘，液体从滤纸和漏斗之间的缝隙流下；③承接滤液的烧杯不干净。选项D玻璃棒紧靠三层滤纸处是正确操作，不会导致滤液浑浊。"},{"id":"g3_chemistry_011_ex08","knowledge_id":"g3_chemistry_011","question":"判断题：明矾可以吸附水中的悬浮杂质，加速沉降，所以明矾在净水过程中起到杀菌消毒的作用。（  ）","answer":"答案：错误\n解析：明矾溶于水后生成的胶状物可以吸附水中的悬浮杂质，加速其沉降，起到的是絮凝作用，使不溶性杂质沉淀下来。但明矾没有杀菌消毒的作用。杀菌消毒通常使用氯气、漂白粉、二氧化氯等消毒剂，这些物质会与水中的细菌发生化学反应。"},{"id":"g3_chemistry_011_ex09","knowledge_id":"g3_chemistry_011","question":"解答题：在乡村，人们常取用河水作为生活用水。某兴趣小组取了一杯浑浊的河水样品，进行以下实验操作：\n（1）向河水中加入明矾粉末，搅拌溶解后静置一段时间。加入明矾的作用是什么？\n（2）静置后进行过滤操作，请说出过滤操作中的\"一贴二低三靠\"分别指什么？\n（3）过滤后得到的水是纯净物吗？为什么？","answer":"答案：（1）明矾溶于水后生成的胶状物可以吸附水中的悬浮杂质，使杂质沉降，达到净水的目的。\n（2）一贴：滤纸紧贴漏斗内壁，中间不要留有气泡。\n二低：滤纸边缘低于漏斗边缘；液面低于滤纸边缘。\n三靠：玻璃棒下端紧靠三层滤纸处；烧杯口紧靠玻璃棒；漏斗下端管口紧靠烧杯内壁。\n（3）不是纯净物。因为过滤只能除去水中的不溶性杂质，水中还含有可溶性的杂质，所以过滤后的水仍然是混合物。\n解析：明矾净水是利用明矾溶于水形成的胶状物吸附悬浮杂质，属于物理变化。过滤是分离固体和液体混合物的常用方法，只能除去不溶性杂质，不能除去可溶性杂质。"},{"id":"g3_chemistry_011_ex10","knowledge_id":"g3_chemistry_011","question":"选择题：下列说法中正确的个数有（  ）\n①活性炭可以除去水中的色素和异味\n②过滤可以使硬水转化为软水\n③蒸馏得到的蒸馏水是纯净物\n④用肥皂水可以区分硬水和软水\n⑤自来水厂净化水的过程中，投药消毒是物理变化\nA. 2个\nB. 3个\nC. 4个\nD. 5个","answer":"答案：B\n解析：①正确，活性炭具有吸附性，可以吸附色素和异味；②错误，过滤只能除去不溶性杂质，不能除去可溶性钙镁化合物，不能使硬水软化；③正确，蒸馏可以除去水中所有杂质，蒸馏水是纯净物；④正确，肥皂水遇硬水泡沫少浮渣多，遇软水泡沫多浮渣少，可以区分；⑤错误，投药消毒有新物质生成，是化学变化。所以正确的有3个。"},{"id":"g3_chemistry_012_ex01","knowledge_id":"g3_chemistry_012","question":"选择题：关于水的组成，下列说法正确的是（  ）\nA. 水是由氢气和氧气组成的\nB. 水是由氢元素和氧元素组成的\nC. 水是由2个氢原子和1个氧原子构成的\nD. 水分子是由氢元素和氧元素组成的","answer":"答案：B\n解析：选项A错误，水是纯净物，不是由氢气和氧气混合而成的；选项B正确，通过电解水实验可以证明水是由氢元素和氧元素组成的；选项C错误，水是由水分子构成的，1个水分子是由2个氢原子和1个氧原子构成的；选项D错误，分子是由原子构成的，应该说水分子是由氢原子和氧原子构成的。物质的组成用元素来描述，物质的构成用分子、原子等来描述。"},{"id":"g3_chemistry_012_ex02","knowledge_id":"g3_chemistry_012","question":"填空题：电解水实验中，正极产生的气体是______，负极产生的气体是______，二者的体积比约为______，质量比约为______。该实验说明水是由______组成的。","answer":"答案：氧气（O₂），氢气（H₂），1:2，8:1，氢元素和氧元素\n解析：电解水时，正极产生氧气，负极产生氢气，可简记为\"正氧负氢\"。体积比约为1:2（氧气:氢气），质量比约为8:1。根据质量守恒定律，化学反应前后元素种类不变，电解水生成氢气和氧气，说明水是由氢元素和氧元素组成的。"},{"id":"g3_chemistry_012_ex03","knowledge_id":"g3_chemistry_012","question":"选择题：下列物质中，属于氧化物的是（  ）\nA. 空气\nB. 氧气\nC. 高锰酸钾\nD. 冰水混合物","answer":"答案：D\n解析：氧化物是由两种元素组成，且其中一种元素是氧元素的化合物。选项A空气是混合物，不是化合物；选项B氧气（O₂）只由一种元素组成，是单质；选项C高锰酸钾（KMnO₄）由三种元素组成，不是氧化物；选项D冰水混合物只含一种物质水（H₂O），由氢元素和氧元素两种元素组成，属于氧化物。"},{"id":"g3_chemistry_012_ex04","knowledge_id":"g3_chemistry_012","question":"判断题：电解水生成氢气和氧气，说明水是由氢气和氧气组成的混合物。（  ）","answer":"答案：错误\n解析：电解水生成氢气和氧气，说明水是由氢元素和氧元素组成的化合物，不是混合物。水是纯净物，由水分子构成，不含氢气和氧气。氢气和氧气是水分解后生成的新物质，不是原来就存在于水中的。"},{"id":"g3_chemistry_012_ex05","knowledge_id":"g3_chemistry_012","question":"选择题：下列物质中，属于单质的是（  ）\nA. 水\nB. 二氧化碳\nC. 铁粉\nD. 氯化钠","answer":"答案：C\n解析：单质是由同种元素组成的纯净物。选项A水（H₂O）由氢、氧两种元素组成，是化合物；选项B二氧化碳（CO₂）由碳、氧两种元素组成，是化合物；选项C铁粉（Fe）只由铁元素组成，是单质；选项D氯化钠（NaCl）由钠、氯两种元素组成，是化合物。"},{"id":"g3_chemistry_012_ex06","knowledge_id":"g3_chemistry_012","question":"填空题：下列物质中，属于混合物的是______，属于纯净物的是______，属于单质的是______，属于化合物的是______，属于氧化物的是______。（填序号）\n①氮气 ②空气 ③氧化镁 ④稀有气体 ⑤矿泉水 ⑥蒸馏水 ⑦铁粉 ⑧高锰酸钾","answer":"答案：②④⑤，①③⑥⑦⑧，①⑦，③⑥⑧，③⑥\n解析：混合物由两种或多种物质混合而成，没有固定组成：②空气含有多种气体，④稀有气体是氦、氖、氩等气体的总称，⑤矿泉水含有水和矿物质。纯净物由一种物质组成，有固定组成：①氮气N₂、③氧化镁MgO、⑥蒸馏水H₂O、⑦铁粉Fe、⑧高锰酸钾KMnO₄。单质是由同种元素组成的纯净物：①N₂、⑦Fe。化合物是由不同种元素组成的纯净物：③MgO、⑥H₂O、⑧KMnO₄。氧化物是由两种元素组成且其中一种是氧元素的化合物：③MgO、⑥H₂O。"},{"id":"g3_chemistry_012_ex07","knowledge_id":"g3_chemistry_012","question":"选择题：电解水实验中，常向水中加入少量硫酸钠或氢氧化钠的目的是（  ）\nA. 增加水的质量\nB. 使水分解产生更多的气体\nC. 增强水的导电性\nD. 使水变成混合物","answer":"答案：C\n解析：纯水的导电能力很弱，电解水时反应很慢。向水中加入少量硫酸钠（Na₂SO₄）或氢氧化钠（NaOH），这些物质溶于水后能产生自由移动的离子，可以大大增强水的导电性，使电解水的反应更快进行。加入的物质本身不参与反应，只是增强导电性。"},{"id":"g3_chemistry_012_ex08","knowledge_id":"g3_chemistry_012","question":"判断题：由同种元素组成的物质一定是单质。（  ）","answer":"答案：错误\n解析：由同种元素组成的物质不一定是单质，还可能是混合物。例如氧气（O₂）和臭氧（O₃）都是由氧元素组成的，但它们是两种不同的物质，混合在一起就是混合物，不是单质。单质必须是由同种元素组成的纯净物。"},{"id":"g3_chemistry_012_ex09","knowledge_id":"g3_chemistry_012","question":"解答题：在电解水实验中，若正极产生了16g氧气，求同时产生了多少克氢气？这些氢气在标准状况下的体积是多少升？（标准状况下氢气的密度为0.0899g/L，结果保留两位小数）","answer":"答案：产生氢气的质量为2g，体积约为22.25L\n解析：电解水生成氢气和氧气，反应的化学方程式为：2H₂O 通电 2H₂↑ + O₂↑\n根据化学方程式可知，氢气与氧气的质量比为4:32=1:8。\n设产生氢气的质量为x。\n2H₂O 通电 2H₂↑ + O₂↑\n        4    32\n        x    16g\n4/32 = x/16g\nx = 4×16g/32 = 2g\n氢气的体积 = 质量÷密度 = 2g ÷ 0.0899g/L ≈ 22.25L\n所以同时产生约2g氢气，体积约为22.25升。"},{"id":"g3_chemistry_012_ex10","knowledge_id":"g3_chemistry_012","question":"选择题：下列说法中正确的个数有（  ）\n①水是由氢元素和氧元素组成的化合物\n②电解水实验中，正极和负极产生的气体质量比为1:2\n③冰水混合物是纯净物，也是氧化物\n④单质一定是由同种元素组成的\n⑤由两种元素组成的物质一定是化合物\nA. 2个\nB. 3个\nC. 4个\nD. 5个","answer":"答案：B\n解析：①正确，水（H₂O）由氢、氧两种元素组成，是化合物；②错误，正极和负极产生的气体体积比为1:2，质量比为8:1；③正确，冰水混合物只含H₂O一种物质，是纯净物，由两种元素组成且其中一种是氧元素，属于氧化物；④正确，单质定义就是由同种元素组成的纯净物；⑤错误，由两种元素组成的物质不一定是化合物，还可能是混合物，如氢气和氧气的混合气体。所以正确的有3个。"},{"id":"g3_chemistry_013_ex01","knowledge_id":"g3_chemistry_013","question":"选择题：下列物质的化学式书写正确的是（  ）\nA. 氧化镁 MgO₂\nB. 氯化铝 AlCl₂\nC. 碳酸钠 NaCO₃\nD. 硫酸 H₂SO₄","answer":"答案：D\n解析：化学式的书写要根据化合价来确定，化合物中正负化合价代数和为零。选项A错误，氧化镁中镁为+2价，氧为-2价，化学式应为MgO；选项B错误，氯化铝中铝为+3价，氯为-1价，化学式应为AlCl₃；选项C错误，碳酸钠中钠为+1价，碳酸根为-2价，化学式应为Na₂CO₃；选项D正确，硫酸中氢为+1价，硫酸根为-2价，化学式H₂SO₄正确。"},{"id":"g3_chemistry_013_ex02","knowledge_id":"g3_chemistry_013","question":"填空题：标出下列物质中加点元素的化合价：\n（1）KMnO₄ 中Mn的化合价为______\n（2）K₂MnO₄ 中Mn的化合价为______\n（3）ClO₂ 中Cl的化合价为______\n（4）HNO₃ 中N的化合价为______","answer":"答案：（1）+7；（2）+6；（3）+4；（4）+5\n解析：化合物中正负化合价代数和为零，常见元素化合价：K为+1，O为-2，H为+1。\n（1）KMnO₄：设Mn化合价为x，则(+1) + x + 4×(-2) = 0，x = +7\n（2）K₂MnO₄：设Mn化合价为x，则2×(+1) + x + 4×(-2) = 0，x = +6\n（3）ClO₂：设Cl化合价为x，则x + 2×(-2) = 0，x = +4\n（4）HNO₃：设N化合价为x，则(+1) + x + 3×(-2) = 0，x = +5"},{"id":"g3_chemistry_013_ex03","knowledge_id":"g3_chemistry_013","question":"选择题：维生素C（化学式为C₆H₈O₆）主要存在于蔬菜和水果中，它能促进人体生长发育，增强人体对疾病的抵抗力。下列关于维生素C的说法中正确的是（  ）\nA. 维生素C是由6个碳元素、8个氢元素和6个氧元素组成的\nB. 维生素C的相对分子质量为176g\nC. 维生素C中C、H、O三种元素的质量比为3:4:3\nD. 维生素C中氧元素的质量分数最大","answer":"答案：D\n解析：选项A错误，元素只讲种类，不讲个数，应该说维生素C由碳、氢、氧三种元素组成；选项B错误，相对分子质量的单位是\"1\"，不是\"g\"，常省略不写；选项C错误，C、H、O三种元素的质量比=(12×6):(1×8):(16×6)=72:8:96=9:1:12，不是3:4:3（3:4:3是原子个数比）；选项D正确，氧元素质量比为96，在三种元素中最大，所以氧元素质量分数最大。"},{"id":"g3_chemistry_013_ex04","knowledge_id":"g3_chemistry_013","question":"判断题：在化合物中，金属元素一定显正价，非金属元素一定显负价。（  ）","answer":"答案：错误\n解析：在化合物中，金属元素通常显正价，但非金属元素不一定显负价。例如在CO₂中，碳是非金属元素，显+4价；在SO₂中，硫是非金属元素，显+4价；在H₂O中，氢是非金属元素，显+1价。非金属元素与氧元素结合时通常显正价，与金属元素或氢元素结合时通常显负价。"},{"id":"g3_chemistry_013_ex05","knowledge_id":"g3_chemistry_013","question":"选择题：某氮的氧化物中，氮元素与氧元素的质量比为7:16，则该氧化物的化学式为（  ）\nA. NO\nB. NO₂\nC. N₂O₃\nD. N₂O₅","answer":"答案：B\n解析：设该氧化物的化学式为NₓOᵧ。\n氮元素与氧元素的质量比 = (14×x):(16×y) = 7:16\n即 14x/16y = 7/16\n14x × 16 = 7 × 16y\n224x = 112y\nx/y = 112/224 = 1/2\n所以x:y = 1:2，化学式为NO₂。"},{"id":"g3_chemistry_013_ex06","knowledge_id":"g3_chemistry_013","question":"填空题：写出下列物质的化学式：\n（1）氧化铁______  （2）氢氧化钙______\n（3）硫酸铝______  （4）硝酸铵______\n（5）氯化亚铁______","answer":"答案：（1）Fe₂O₃；（2）Ca(OH)₂；（3）Al₂(SO₄)₃；（4）NH₄NO₃；（5）FeCl₂\n解析：根据化合价书写化学式，化合物中正负化合价代数和为零。\n（1）氧化铁：铁为+3价，氧为-2价，Fe₂O₃\n（2）氢氧化钙：钙为+2价，氢氧根（OH⁻）为-1价，Ca(OH)₂\n（3）硫酸铝：铝为+3价，硫酸根（SO₄²⁻）为-2价，Al₂(SO₄)₃\n（4）硝酸铵：铵根（NH₄⁺）为+1价，硝酸根（NO₃⁻）为-1价，NH₄NO₃\n（5）氯化亚铁：亚铁为+2价，氯为-1价，FeCl₂"},{"id":"g3_chemistry_013_ex07","knowledge_id":"g3_chemistry_013","question":"选择题：已知R₂(SO₄)₃的相对分子质量为342，则R(NO₃)₃的相对分子质量为（  ）（S=32，O=16，N=14）\nA. 96\nB. 134\nC. 213\nD. 240","answer":"答案：C\n解析：设R的相对原子质量为x。\nR₂(SO₄)₃的相对分子质量 = 2x + 3×(32 + 4×16) = 2x + 3×96 = 2x + 288 = 342\n2x = 342 - 288 = 54\nx = 27\nR(NO₃)₃的相对分子质量 = 27 + 3×(14 + 3×16) = 27 + 3×62 = 27 + 186 = 213"},{"id":"g3_chemistry_013_ex08","knowledge_id":"g3_chemistry_013","question":"判断题：同种元素在同一化合物中只能显示一种化合价。（  ）","answer":"答案：错误\n解析：同种元素在同一化合物中可能显示不同的化合价。例如在硝酸铵（NH₄NO₃）中，铵根（NH₄⁺）中的氮元素显-3价，硝酸根（NO₃⁻）中的氮元素显+5价，氮元素在同一化合物中显示了两种不同的化合价。"},{"id":"g3_chemistry_013_ex09","knowledge_id":"g3_chemistry_013","question":"解答题：某化肥厂生产的尿素化肥，包装袋上标有\"含氮量≥46.3%\"。已知尿素的化学式为CO(NH₂)₂，请计算：\n（1）尿素的相对分子质量。\n（2）尿素中氮元素的质量分数。（结果保留一位小数）\n（3）该袋化肥中尿素的质量分数至少为多少？（结果保留一位小数，假设杂质不含氮元素）","answer":"答案：（1）60；（2）46.7%；（3）99.1%\n解析：\n（1）尿素的相对分子质量 = 12 + 16 + 2×(14 + 2×1) = 12 + 16 + 2×16 = 12 + 16 + 32 = 60\n（2）尿素中氮元素的质量分数 = (2×14)/60 × 100% = 28/60 × 100% ≈ 46.7%\n（3）设该袋化肥中尿素的质量分数为x。\nx × 46.7% = 46.3%\nx = 46.3% ÷ 46.7% ≈ 99.1%\n所以该袋化肥中尿素的质量分数至少约为99.1%。"},{"id":"g3_chemistry_013_ex10","knowledge_id":"g3_chemistry_013","question":"选择题：下列关于化合价的说法中，正确的个数有（  ）\n①在化合物中，氧元素通常显-2价\n②在化合物中，氢元素通常显+1价\n③在单质中，元素的化合价为0\n④一种元素只能显示一种化合价\n⑤在化合物中，各元素正负化合价的代数和为零\nA. 2个\nB. 3个\nC. 4个\nD. 5个","answer":"答案：C\n解析：①正确，在化合物中氧元素通常显-2价（如H₂O、CO₂），但也有例外（如H₂O₂中氧显-1价）；②正确，在化合物中氢元素通常显+1价（如H₂O、HCl），但也有例外（如NaH中氢显-1价）；③正确，在单质中，元素的化合价为0；④错误，一种元素可以显示多种化合价，例如铁有+2、+3价，氮有-3、+2、+4、+5价等；⑤正确，这是化合价规则，化合物中正负化合价代数和为零。所以正确的有4个。"},{"id":"g3_chemistry_014_ex01","knowledge_id":"g3_chemistry_014","question":"选择题：下列说法中，符合质量守恒定律的是\nA. 蜡烛完全燃烧后，蜡烛没有了，这违背了质量守恒定律\nB. 10g水蒸发变成10g水蒸气，符合质量守恒定律\nC. 12g木炭在32g氧气中完全燃烧，生成44g二氧化碳\nD. 铁丝在氧气中燃烧后，生成物质量比铁丝大，这不符合质量守恒定律","answer":"答案：C\n解析：A选项错误，蜡烛燃烧生成了二氧化碳和水，逸散到空气中，所以蜡烛消失了，但总质量守恒；B选项错误，水蒸发是物理变化，质量守恒定律只适用于化学变化；C选项正确，C+O₂=CO₂，12g碳与32g氧气恰好完全反应生成44g二氧化碳；D选项错误，铁丝燃烧是铁与氧气反应，生成物质量增加是因为参加反应的氧气质量计算在内，符合质量守恒定律。"},{"id":"g3_chemistry_014_ex02","knowledge_id":"g3_chemistry_014","question":"填空题：质量守恒定律：参加化学反应的______，等于反应后生成的______。这个规律叫做质量守恒定律。","answer":"答案：各物质的质量总和，各物质的质量总和\n解析：质量守恒定律是自然界的基本定律之一。注意是\"参加反应\"的各物质质量总和，不是所有反应物质量的简单相加，未参加反应的部分不算在内。"},{"id":"g3_chemistry_014_ex03","knowledge_id":"g3_chemistry_014","question":"选择题：某物质在空气中燃烧生成二氧化碳和水，则该物质中\nA. 只含有碳元素和氢元素\nB. 一定含有碳、氢、氧三种元素\nC. 一定含有碳元素和氢元素，可能含有氧元素\nD. 一定含有碳元素和氧元素，可能含有氢元素","answer":"答案：C\n解析：根据质量守恒定律，化学反应前后元素种类不变。生成物二氧化碳和水中含有碳、氢、氧三种元素，反应物氧气中只含氧元素，所以该物质中一定含有碳元素和氢元素，氧元素可能来自氧气，也可能部分来自该物质，因此是可能含有氧元素。"},{"id":"g3_chemistry_014_ex04","knowledge_id":"g3_chemistry_014","question":"判断题：化学反应前后，分子的种类和数目都不变。（  ）","answer":"答案：错误\n解析：化学反应前后，原子的种类、数目、质量都不变，这是质量守恒的原因。但分子的种类一定改变（因为生成了新物质），分子的数目可能改变也可能不变。"},{"id":"g3_chemistry_014_ex05","knowledge_id":"g3_chemistry_014","question":"填空题：在A+B→C+D的反应中，5gA与足量的B充分反应，生成3gC和8gD，则参加反应的B的质量是______g。","answer":"答案：6\n解析：根据质量守恒定律，参加反应的A和B的质量总和等于生成的C和D的质量总和。设参加反应的B的质量为x，则5g+x=3g+8g，解得x=6g。"},{"id":"g3_chemistry_014_ex06","knowledge_id":"g3_chemistry_014","question":"选择题：在化学反应2H₂+O₂=2H₂O中，反应前后肯定发生变化的是\nA. 原子的种类\nB. 分子的种类\nC. 元素的种类\nD. 物质的总质量","answer":"答案：B\n解析：根据质量守恒定律，化学反应前后原子的种类、数目、质量都不变，元素种类不变，物质总质量不变。但分子的种类一定改变，因为反应前是氢分子和氧分子，反应后变成了水分子。"},{"id":"g3_chemistry_014_ex07","knowledge_id":"g3_chemistry_014","question":"解答题：某同学做红磷燃烧实验验证质量守恒定律。实验前称量红磷和装置总质量为150g，点燃红磷后充分反应，冷却后再次称量，发现总质量仍为150g。请回答：（1）该实验是否符合质量守恒定律？为什么？（2）红磷燃烧的化学方程式是什么？（3）如果将装置打开后再称量，质量会如何变化？为什么？","answer":"答案：（1）符合，因为在密闭容器中反应，参加反应的红磷和氧气的质量总和等于生成的五氧化二磷的质量；（2）4P+5O₂=2P₂O₅；（3）质量会增加，因为打开装置后，外界空气进入，补充了消耗的氧气，所以质量增加。\n解析：（1）质量守恒定律适用于一切化学反应，红磷燃烧是化学变化，在密闭容器中进行，所以总质量不变，符合质量守恒定律。（2）红磷燃烧生成五氧化二磷。（3）打开装置后，由于消耗了氧气，瓶内压强减小，外界空气会进入，使总质量增加。"},{"id":"g3_chemistry_014_ex08","knowledge_id":"g3_chemistry_014","question":"选择题：在化学反应A+2B=C+2D中，8gA与足量的B完全反应，生成22gC和18gD。若A的相对分子质量为16，则B的相对分子质量是\nA. 16\nB. 32\nC. 64\nD. 96","answer":"答案：B\n解析：根据质量守恒定律，参加反应的B的质量=22g+18g-8g=32g。设B的相对分子质量为x。\nA + 2B = C + 2D\n16  2x\n8g  32g\n则16/8g = 2x/32g，解得x=32。"},{"id":"g3_chemistry_014_ex09","knowledge_id":"g3_chemistry_014","question":"填空题：从微观角度看，质量守恒的原因是：化学反应前后，______没有改变，______没有增减，______也没有改变。","answer":"答案：原子的种类，原子的数目，原子的质量\n解析：化学反应的实质是分子分裂成原子，原子重新组合成新分子的过程。在这个过程中，原子的种类、数目、质量都不变，所以反应前后各物质的质量总和必然相等。"},{"id":"g3_chemistry_014_ex10","knowledge_id":"g3_chemistry_014","question":"判断题：镁条在空气中燃烧后，生成物的质量比镁条的质量大，这不符合质量守恒定律。（  ）","answer":"答案：错误\n解析：镁条燃烧是镁与空气中的氧气反应生成氧化镁。根据质量守恒定律，参加反应的镁和氧气的质量总和等于生成的氧化镁的质量，所以生成物质量比镁条大，多出来的质量就是参加反应的氧气的质量，这恰恰符合质量守恒定律。"},{"id":"g3_chemistry_015_ex01","knowledge_id":"g3_chemistry_015","question":"选择题：下列化学方程式书写正确的是\nA. 4Fe+3O₂=2Fe₂O₃\nB. 2H₂+O₂=2H₂O\nC. Mg+O₂=MgO₂\nD. S+O₂=SO₂↑","answer":"答案：B\n解析：A选项错误，铁在氧气中燃烧生成四氧化三铁(Fe₃O₄)，不是三氧化二铁；B选项正确，氢气燃烧生成水，方程式配平正确；C选项错误，氧化镁的化学式是MgO，不是MgO₂；D选项错误，反应物中有气体，生成物气体不用标↑符号。"},{"id":"g3_chemistry_015_ex02","knowledge_id":"g3_chemistry_015","question":"填空题：化学方程式的意义：（1）表示______、______和______；（2）表示各物质之间的______之比；（3）表示各物质粒子之间的______之比。","answer":"答案：反应物，生成物，反应条件，质量，个数\n解析：化学方程式有三层意义：质的意义（反应物、生成物、反应条件）、量的意义（各物质的质量比）、微观意义（各物质的粒子个数比）。"},{"id":"g3_chemistry_015_ex03","knowledge_id":"g3_chemistry_015","question":"选择题：化学方程式2H₂O=2H₂↑+O₂↑（通电条件下）表示的意义中，正确的是\nA. 水等于氢气加氧气\nB. 水在通电条件下，生成氢气和氧气\nC. 每2份质量的水通电反应，生成2份质量的氢气和1份质量的氧气\nD. 2个水分子反应生成2个氢分子和1个氧分子","answer":"答案：D\n解析：A选项错误，化学方程式中的\"=\"不能读作\"等于\"，应读作\"反应生成\"；B选项不完整，虽然描述正确，但D选项更准确地描述了粒子个数关系；C选项错误，质量比应为(2×18):(2×2):32=36:4:32=9:1:8，不是2:2:1；D选项正确，从微观角度，2个水分子分解生成2个氢分子和1个氧分子。"},{"id":"g3_chemistry_015_ex04","knowledge_id":"g3_chemistry_015","question":"判断题：配平化学方程式时，可以改变化学式中元素符号右下角的数字。（  ）","answer":"答案：错误\n解析：配平化学方程式时，只能在化学式前面添加化学计量数（系数），不能改变化学式中元素符号右下角的数字。因为右下角的数字表示分子中原子的个数，改变它就改变了物质的种类。"},{"id":"g3_chemistry_015_ex05","knowledge_id":"g3_chemistry_015","question":"填空题：配平下列化学方程式：______Al+______O₂——______Al₂O₃；______C₂H₅OH+______O₂——______CO₂+______H₂O。","answer":"答案：4，3，2；1，3，2，3\n解析：第一题：用最小公倍数法，氧原子：左边2个，右边3个，最小公倍数6。所以O₂前配3，Al₂O₃前配2，Al前配4。即4Al+3O₂=2Al₂O₃。第二题：用观察法，C₂H₅OH中有2个C，6个H，1个O。所以CO₂前配2，H₂O前配3，右边O总数=2×2+3=7，左边C₂H₅OH中1个O，所以O₂前配(7-1)/2=3。即C₂H₅OH+3O₂=2CO₂+3H₂O。"},{"id":"g3_chemistry_015_ex06","knowledge_id":"g3_chemistry_015","question":"选择题：下列关于化学反应2H₂+O₂=2H₂O的读法中，错误的是\nA. 氢气和氧气在点燃条件下反应生成水\nB. 每2份质量的氢气和1份质量的氧气反应生成2份质量的水\nC. 每4份质量的氢气和32份质量的氧气反应生成36份质量的水\nD. 每2个氢分子和1个氧分子反应生成2个水分子","answer":"答案：B\n解析：A选项正确，是质的读法；B选项错误，质量比应该是(2×2):32:(2×18)=4:32:36=1:8:9，不是2:1:2；C选项正确，4:32:36化简后就是1:8:9；D选项正确，是微观读法。"},{"id":"g3_chemistry_015_ex07","knowledge_id":"g3_chemistry_015","question":"解答题：写出下列反应的化学方程式，并指出基本反应类型。（1）铁丝在氧气中燃烧；（2）加热高锰酸钾制氧气；（3）锌和稀硫酸反应生成硫酸锌和氢气；（4）碳酸钙高温分解。","answer":"答案：（1）3Fe+2O₂=Fe₃O₄（点燃），化合反应；（2）2KMnO₄=K₂MnO₄+MnO₂+O₂↑（加热），分解反应；（3）Zn+H₂SO₄=ZnSO₄+H₂↑，置换反应；（4）CaCO₃=CaO+CO₂↑（高温），分解反应。\n解析：（1）铁在氧气中燃烧生成四氧化三铁，两种物质生成一种，是化合反应。（2）高锰酸钾受热分解生成锰酸钾、二氧化锰和氧气，一种物质生成多种，是分解反应。（3）锌和硫酸反应，锌置换出氢气，是置换反应。（4）碳酸钙高温分解成氧化钙和二氧化碳，是分解反应。"},{"id":"g3_chemistry_015_ex08","knowledge_id":"g3_chemistry_015","question":"选择题：在化学方程式aC₂H₆+bO₂=mCO₂+nH₂O中，各化学式前的化学计量数正确的是\nA. a=2，b=7，m=4，n=6\nB. a=1，b=7，m=2，n=3\nC. a=1，b=3.5，m=2，n=3\nD. a=2，b=5，m=4，n=6","answer":"答案：A\n解析：用待定系数法配平。C₂H₆中有2个C，6个H。所以m=2a，n=3a。右边O总数=2m+n=4a+3a=7a。左边O₂中O=2b，所以2b=7a-b？不对，左边只有O₂提供O，所以2b=2m+n=2×2a+3a=7a，即2b=7a。取a=2，则b=7，m=4，n=6。故选A。注意化学计量数必须是最简整数比，C选项有小数是错误的。"},{"id":"g3_chemistry_015_ex09","knowledge_id":"g3_chemistry_015","question":"填空题：书写化学方程式要遵守两个原则：一是必须以______为基础；二是要遵守______定律，等号两边各原子的______和______必须相等。","answer":"答案：客观事实，质量守恒，种类，数目\n解析：书写化学方程式的两个原则：（1）必须以客观事实为基础，不能凭空臆造不存在的物质和反应；（2）要遵守质量守恒定律，反应前后原子的种类和数目保持不变，即方程式需要配平。"},{"id":"g3_chemistry_015_ex10","knowledge_id":"g3_chemistry_015","question":"判断题：化学方程式中\"↑\"表示生成物是气体，所以只要生成物中有气体就必须标\"↑\"。（  ）","answer":"答案：错误\n解析：\"↑\"标注规则：只有当生成物是气体，且反应物中没有气体时，才在生成物气体化学式后标\"↑\"。如果反应物中有气体，则生成物气体不需要标\"↑\"。例如：C+O₂=CO₂，反应物O₂是气体，所以CO₂后面不标\"↑\"。"},{"id":"g3_chemistry_016_ex01","knowledge_id":"g3_chemistry_016","question":"选择题：实验室用13g锌粒与足量的稀硫酸反应制取氢气（Zn+H₂SO₄=ZnSO₄+H₂↑）。已知锌的相对原子质量为65，则生成氢气的质量是\nA. 0.2g\nB. 0.4g\nC. 2g\nD. 4g","answer":"答案：B\n解析：设生成氢气的质量为x。\nZn + H₂SO₄ = ZnSO₄ + H₂↑\n65               2\n13g              x\n则65/13g = 2/x，解得x=0.4g。"},{"id":"g3_chemistry_016_ex02","knowledge_id":"g3_chemistry_016","question":"填空题：工业上煅烧石灰石（CaCO₃）制取生石灰（CaO）和二氧化碳。如果要制取5.6t氧化钙，需要碳酸钙的质量是______t。（反应方程式：CaCO₃=CaO+CO₂↑，高温条件；相对原子质量：Ca-40，C-12，O-16）","answer":"答案：10\n解析：设需要碳酸钙的质量为x。\nCaCO₃ = CaO + CO₂↑（高温）\n100    56\nx      5.6t\n则100/x = 56/5.6t，解得x=10t。"},{"id":"g3_chemistry_016_ex03","knowledge_id":"g3_chemistry_016","question":"选择题：将24g木炭在足量氧气中完全燃烧，生成二氧化碳的质量是\nA. 44g\nB. 88g\nC. 12g\nD. 56g","answer":"答案：B\n解析：设生成二氧化碳的质量为x。\nC + O₂ = CO₂（点燃）\n12      44\n24g     x\n则12/24g = 44/x，解得x=88g。"},{"id":"g3_chemistry_016_ex04","knowledge_id":"g3_chemistry_016","question":"判断题：根据化学方程式计算时，已知量和未知量必须都是纯物质的质量。（  ）","answer":"答案：正确\n解析：根据化学方程式计算的质量关系是纯净物之间的质量比。如果是含杂质的物质，必须先换算成纯净物的质量才能代入方程式计算。纯净物质量=混合物质量×纯度。"},{"id":"g3_chemistry_016_ex05","knowledge_id":"g3_chemistry_016","question":"填空题：某工厂用100t含氧化铁80%的赤铁矿石炼铁，理论上可炼出含铁96%的生铁的质量是______t。（反应方程式：3CO+Fe₂O₃=2Fe+3CO₂，高温条件；相对原子质量：Fe-56，O-16）","answer":"答案：58.3\n解析：氧化铁的质量=100t×80%=80t。设生成铁的质量为x。\n3CO + Fe₂O₃ = 2Fe + 3CO₂（高温）\n       160      112\n       80t      x\n则160/80t = 112/x，解得x=56t。折合含铁96%的生铁质量=56t÷96%≈58.3t。"},{"id":"g3_chemistry_016_ex06","knowledge_id":"g3_chemistry_016","question":"选择题：电解36g水可得到氢气和氧气的质量分别是\nA. 4g和32g\nB. 2g和34g\nC. 2g和16g\nD. 6g和30g","answer":"答案：A\n解析：设生成氢气质量为x，氧气质量为y。\n2H₂O = 2H₂↑ + O₂↑（通电）\n36     4     32\n36g    x     y\n则36/36g = 4/x，解得x=4g；36/36g = 32/y，解得y=32g。"},{"id":"g3_chemistry_016_ex07","knowledge_id":"g3_chemistry_016","question":"解答题：实验室用氯酸钾和二氧化锰的混合物制取氧气。加热28g氯酸钾和二氧化锰的混合物至完全反应，冷却后称量剩余固体质量为18.4g。求：（1）生成氧气的质量；（2）原混合物中氯酸钾的质量。","answer":"答案：（1）生成氧气9.6g；（2）原混合物中氯酸钾质量为24.5g\n解析：（1）根据质量守恒定律，生成氧气的质量=28g-18.4g=9.6g。（2）设氯酸钾的质量为x。\n2KClO₃ = 2KCl + 3O₂↑（MnO₂催化、加热）\n245            96\nx              9.6g\n则245/x = 96/9.6g，解得x=24.5g。"},{"id":"g3_chemistry_016_ex08","knowledge_id":"g3_chemistry_016","question":"选择题：镁在空气中燃烧，生成氧化镁。反应中镁、氧气、氧化镁的质量比是\nA. 2:1:2\nB. 24:32:40\nC. 48:32:80\nD. 24:32:56","answer":"答案：C\n解析：2Mg + O₂ = 2MgO（点燃），各物质质量比=(2×24):32:(2×40)=48:32:80=3:2:5。A选项是分子个数比，不是质量比。"},{"id":"g3_chemistry_016_ex09","knowledge_id":"g3_chemistry_016","question":"填空题：过氧化氢溶液在二氧化锰催化下分解制氧气。用34g10%的过氧化氢溶液完全反应，可生成氧气的质量是______g。（相对原子质量：H-1，O-16）","answer":"答案：1.6\n解析：过氧化氢的质量=34g×10%=3.4g。设生成氧气质量为x。\n2H₂O₂ = 2H₂O + O₂↑（MnO₂催化）\n68           32\n3.4g         x\n则68/3.4g = 32/x，解得x=1.6g。"},{"id":"g3_chemistry_016_ex10","knowledge_id":"g3_chemistry_016","question":"判断题：根据化学方程式计算时，只要化学方程式写对了，计算结果就一定正确。（  ）","answer":"答案：错误\n解析：化学方程式写对只是计算正确的前提之一，还需要注意：配平正确、相对分子质量计算正确、单位统一、带入的是纯净物质量、计算过程正确等。任何一步出错都会导致结果错误。"},{"id":"g3_chemistry_017_ex01","knowledge_id":"g3_chemistry_017","question":"选择题：下列物质中，属于碳的单质的一组是\nA. 金刚石和石墨\nB. 一氧化碳和二氧化碳\nC. 碳酸钙和大理石\nD. 甲烷和乙醇","answer":"答案：A\n解析：由同种元素组成的纯净物叫单质。金刚石和石墨都是由碳元素组成的不同单质，属于同素异形体。B选项CO和CO₂是化合物；C选项CaCO₃是化合物，大理石是混合物；D选项CH₄和C₂H₅OH都是化合物。"},{"id":"g3_chemistry_017_ex02","knowledge_id":"g3_chemistry_017","question":"填空题：金刚石是天然存在的最______的物质，常用于切割玻璃、钻探机钻头等；石墨质地______，有______感，具有优良的______性，常用于制铅笔芯、电极等。","answer":"答案：硬，软，滑腻，导电\n解析：金刚石和石墨物理性质差异大的原因是碳原子的排列方式不同。金刚石是正八面体结构，硬度大；石墨是层状结构，层间作用力小，所以质软、有滑腻感，能导电。"},{"id":"g3_chemistry_017_ex03","knowledge_id":"g3_chemistry_017","question":"选择题：金刚石、石墨、C60的物理性质有很大差异，其原因是\nA. 构成它们的原子大小不同\nB. 构成它们的原子数目不同\nC. 碳原子的排列方式不同\nD. 它们由不同种原子构成","answer":"答案：C\n解析：金刚石、石墨、C60都是由碳元素组成的单质，它们的碳原子种类相同，但排列方式不同，导致物理性质差异很大。金刚石是空间网状结构，石墨是层状结构，C60是足球状结构。"},{"id":"g3_chemistry_017_ex04","knowledge_id":"g3_chemistry_017","question":"判断题：所有由碳元素组成的单质都是黑色的固体物质。（  ）","answer":"答案：错误\n解析：不同的碳单质颜色不同。纯净的金刚石是无色透明的正八面体形状的固体；石墨是深灰色的有金属光泽的细鳞片状固体；C60是紫红色固体。所以不能说碳单质都是黑色的。"},{"id":"g3_chemistry_017_ex05","knowledge_id":"g3_chemistry_017","question":"填空题：活性炭和木炭具有______的结构，因此具有______性，可以用来吸附色素和异味。防毒面具中就是利用______来吸附毒气的。","answer":"答案：疏松多孔，吸附，活性炭\n解析：木炭和活性炭都是由石墨的微小晶体和少量杂质构成的，具有疏松多孔的结构，表面积大，因此有很强的吸附能力。活性炭的吸附性比木炭更强，常用于防毒面具、净水、制糖工业脱色等。"},{"id":"g3_chemistry_017_ex06","knowledge_id":"g3_chemistry_017","question":"选择题：下列关于C60的说法中，正确的是\nA. C60是一种新型的化合物\nB. C60的相对分子质量是60\nC. C60分子由60个碳原子构成\nD. C60中碳元素的化合价为+4价","answer":"答案：C\n解析：A选项错误，C60是由碳元素组成的单质，不是化合物；B选项错误，C60的相对分子质量=12×60=720；C选项正确，C60分子是由60个碳原子构成的，形似足球；D选项错误，单质中元素化合价为0。"},{"id":"g3_chemistry_017_ex07","knowledge_id":"g3_chemistry_017","question":"解答题：请根据金刚石、石墨、C60的性质和结构特点，回答下列问题：（1）为什么金刚石和石墨都是由碳元素组成，但物理性质差异很大？（2）石墨可以作电极是利用了它的什么性质？（3）为什么古代用墨书写的字画可以保存很长时间而不褪色？","answer":"答案：（1）因为碳原子的排列方式不同；（2）利用了石墨具有优良的导电性；（3）因为墨的主要成分是碳，在常温下碳的化学性质不活泼，不容易与其他物质发生化学反应。\n解析：（1）金刚石是空间网状结构，石墨是层状结构，结构不同导致物理性质差异很大，这说明物质的结构决定物质的性质。（2）石墨中每个碳原子与其他三个碳原子结合，留有一个自由电子，因此能导电。（3）碳在常温下化学性质稳定，受日光照射或与空气、水分接触，都不容易起变化，所以古代字画能保存很久。"},{"id":"g3_chemistry_017_ex08","knowledge_id":"g3_chemistry_017","question":"选择题：下列碳单质的用途中，利用其化学性质的是\nA. 金刚石切割玻璃\nB. 石墨作电极\nC. 焦炭用于冶炼金属\nD. 活性炭吸附毒气","answer":"答案：C\n解析：A选项利用金刚石硬度大，是物理性质；B选项利用石墨的导电性，是物理性质；C选项焦炭用于冶炼金属是利用碳的还原性，属于化学性质；D选项利用活性炭的吸附性，是物理性质。"},{"id":"g3_chemistry_017_ex09","knowledge_id":"g3_chemistry_017","question":"填空题：碳在氧气充足时燃烧生成______，化学方程式为______；在氧气不充足时燃烧生成______，化学方程式为______。这说明反应物的用量不同，生成物可能不同。","answer":"答案：CO₂，C+O₂=CO₂（点燃），CO，2C+O₂=2CO（点燃）\n解析：碳具有可燃性，氧气充足时完全燃烧生成二氧化碳，放出大量热；氧气不充足时不完全燃烧生成一氧化碳，也放热，但放出热量比完全燃烧少，且一氧化碳有毒。"},{"id":"g3_chemistry_017_ex10","knowledge_id":"g3_chemistry_017","question":"判断题：同一种元素只能组成一种单质。（  ）","answer":"答案：错误\n解析：同一种元素可以组成不同的单质，这些单质互称为同素异形体。例如碳元素可以组成金刚石、石墨、C60等多种单质；氧元素可以组成O₂和O₃；磷元素可以组成红磷和白磷。"},{"id":"g3_chemistry_018_ex01","knowledge_id":"g3_chemistry_018","question":"选择题：实验室制取二氧化碳，最适宜的药品是\nA. 碳酸钠粉末和稀盐酸\nB. 石灰石和稀硫酸\nC. 大理石和稀盐酸\nD. 大理石和浓盐酸","answer":"答案：C\n解析：A选项错误，碳酸钠粉末与稀盐酸反应太快，不易控制和收集；B选项错误，稀硫酸与碳酸钙反应生成微溶于水的硫酸钙，覆盖在大理石表面，阻止反应继续进行；C选项正确，大理石（主要成分CaCO₃）与稀盐酸反应速率适中，便于收集；D选项错误，浓盐酸易挥发，使制得的CO₂中混有HCl气体，不纯。"},{"id":"g3_chemistry_018_ex02","knowledge_id":"g3_chemistry_018","question":"填空题：实验室制取二氧化碳的化学方程式为______。收集方法是______，因为二氧化碳______。不能用排水法收集是因为______。","answer":"答案：CaCO₃+2HCl=CaCl₂+H₂O+CO₂↑，向上排空气法，密度比空气大，能溶于水且与水反应\n解析：二氧化碳密度比空气大（约是空气的1.5倍），所以用向上排空气法收集。二氧化碳能溶于水（1体积水约能溶解1体积CO₂），且能与水反应生成碳酸，所以不能用排水法收集。"},{"id":"g3_chemistry_018_ex03","knowledge_id":"g3_chemistry_018","question":"选择题：检验集气瓶中是否收集满二氧化碳的正确方法是\nA. 向集气瓶中倒入澄清石灰水\nB. 将燃着的木条伸入集气瓶中\nC. 将燃着的木条放在集气瓶口\nD. 将带火星的木条放在集气瓶口","answer":"答案：C\n解析：验满时要放在集气瓶口，不能伸入瓶中。二氧化碳不支持燃烧，使燃着的木条熄灭，所以用燃着的木条放在瓶口，若木条熄灭，说明已收集满。A选项是检验二氧化碳的方法，不是验满；D选项带火星的木条用于检验氧气。"},{"id":"g3_chemistry_018_ex04","knowledge_id":"g3_chemistry_018","question":"判断题：实验室制取二氧化碳和制取氧气的发生装置一定不同。（  ）","answer":"答案：错误\n解析：实验室制取二氧化碳是固液不加热型（大理石和稀盐酸）。制取氧气如果用过氧化氢和二氧化锰，也是固液不加热型，发生装置相同；如果用高锰酸钾或氯酸钾制氧气，是固体加热型，发生装置不同。所以说\"一定不同\"是错误的。"},{"id":"g3_chemistry_018_ex05","knowledge_id":"g3_chemistry_018","question":"填空题：检验二氧化碳的方法是将气体通入______中，现象是______，化学方程式为______。","answer":"答案：澄清石灰水，澄清石灰水变浑浊，CO₂+Ca(OH)₂=CaCO₃↓+H₂O\n解析：这是检验CO₂的特征反应。二氧化碳与氢氧化钙反应生成碳酸钙白色沉淀和水，使石灰水变浑浊。注意化学方程式中碳酸钙要标↓符号，因为反应物中没有固体，生成物有沉淀。"},{"id":"g3_chemistry_018_ex06","knowledge_id":"g3_chemistry_018","question":"选择题：实验室制取二氧化碳的步骤有：①检查装置气密性；②按要求装配好仪器；③向长颈漏斗中注入稀盐酸；④向锥形瓶中放入小块大理石；⑤收集气体。正确的操作顺序是\nA. ①②③④⑤\nB. ②①④③⑤\nC. ②①③④⑤\nD. ①②④③⑤","answer":"答案：B\n解析：实验操作步骤：先组装仪器（②），再检查气密性（①），然后装药品（先固后液，即先加大理石④，再加稀盐酸③），最后收集（⑤）。所以顺序是②①④③⑤。注意装药品时先固后液，加液体时长颈漏斗下端要伸入液面以下，防止气体从漏斗逸出。"},{"id":"g3_chemistry_018_ex07","knowledge_id":"g3_chemistry_018","question":"解答题：下图是实验室制取二氧化碳的装置图，请回答下列问题：（1）写出标号仪器的名称：①______，②______。（2）指出图中的两处错误并改正：a______；b______。（3）用改正后的装置制取CO₂，检验是否收集满的方法是______。","answer":"答案：（1）长颈漏斗，集气瓶；（2）a.长颈漏斗下端未伸入液面以下，应伸入液面以下形成液封；b.导管伸入集气瓶太短，应伸到接近集气瓶底部；（3）将燃着的木条放在集气瓶口，若木条熄灭，证明已收集满\n解析：（2）长颈漏斗下端必须伸入液面以下，否则气体会从漏斗口逸出。用排空气法收集气体时，导管应伸到接近集气瓶底部，这样才能把瓶内空气排净，收集到较纯的气体。"},{"id":"g3_chemistry_018_ex08","knowledge_id":"g3_chemistry_018","question":"选择题：下列气体既能用向上排空气法收集，又能用排水法收集的是\nA. H₂\nB. O₂\nC. CO₂\nD. 都不行","answer":"答案：B\n解析：A选项H₂密度比空气小，用向下排空气法，难溶于水可用排水法；B选项O₂密度比空气大（可用向上排空气法），不易溶于水（可用排水法）；C选项CO₂密度比空气大（可用向上排空气法），但能溶于水且与水反应（不能用排水法）。故选B。"},{"id":"g3_chemistry_018_ex09","knowledge_id":"g3_chemistry_018","question":"填空题：工业上制取二氧化碳的方法是煅烧______，反应的化学方程式为______。该反应的另一种产物是______，俗称______，常常用作______剂。","answer":"答案：石灰石，CaCO₃=CaO+CO₂↑（高温），氧化钙，生石灰，干燥\n解析：工业上用石灰石为原料，高温煅烧制得生石灰（CaO）和CO₂。生石灰能与水反应，常用作食品干燥剂等。这是分解反应。"},{"id":"g3_chemistry_018_ex10","knowledge_id":"g3_chemistry_018","question":"判断题：将燃着的木条伸入集气瓶中，木条熄灭，说明瓶中的气体是二氧化碳。（  ）","answer":"答案：错误\n解析：能使燃着木条熄灭的气体不一定是二氧化碳，氮气等不支持燃烧的气体也能使木条熄灭。检验二氧化碳的唯一特征方法是通入澄清石灰水，石灰水变浑浊才能证明是二氧化碳。"},{"id":"g3_chemistry_019_ex01","knowledge_id":"g3_chemistry_019","question":"选择题：下列关于二氧化碳性质的描述中，正确的是\nA. 二氧化碳有毒，能使人窒息死亡\nB. 二氧化碳是一种有刺激性气味的气体\nC. 二氧化碳能溶于水，且能与水反应\nD. 二氧化碳气体密度比空气小","answer":"答案：C\n解析：A选项错误，二氧化碳本身无毒，但不能供给呼吸，浓度过高会使人窒息；B选项错误，二氧化碳是无色无味的气体；C选项正确，二氧化碳能溶于水（1体积水约溶解1体积CO₂），且与水反应生成碳酸；D选项错误，二氧化碳密度比空气大，约是空气的1.5倍。"},{"id":"g3_chemistry_019_ex02","knowledge_id":"g3_chemistry_019","question":"填空题：将CO₂通入紫色石蕊溶液中，观察到的现象是______，原因是（用化学方程式表示）______；将此溶液加热，又观察到______，原因是（用化学方程式表示）______。","answer":"答案：紫色石蕊溶液变红，CO₂+H₂O=H₂CO₃，溶液又变成紫色，H₂CO₃=H₂O+CO₂↑\n解析：二氧化碳与水反应生成碳酸，碳酸呈酸性，使紫色石蕊变红。碳酸不稳定，受热易分解成水和二氧化碳，酸性消失，所以溶液又变回紫色。这说明CO₂能与水反应生成碳酸，碳酸不稳定。"},{"id":"g3_chemistry_019_ex03","knowledge_id":"g3_chemistry_019","question":"选择题：下列物质中，能与CO₂发生反应的是\n①澄清石灰水 ②水 ③灼热的氧化铜 ④灼热的碳\nA. ①②③④\nB. ①②④\nC. ②③④\nD. ①③④","answer":"答案：B\n解析：①CO₂与澄清石灰水反应生成碳酸钙和水；②CO₂与水反应生成碳酸；③CO₂与灼热的氧化铜不反应（CO才与CuO反应）；④CO₂与灼热的碳在高温下反应生成CO。所以①②④能反应，选B。"},{"id":"g3_chemistry_019_ex04","knowledge_id":"g3_chemistry_019","question":"判断题：一氧化碳和二氧化碳都是由碳元素和氧元素组成的，所以它们的性质相同。（  ）","answer":"答案：错误\n解析：虽然组成元素相同，但分子构成不同（CO和CO₂），结构决定性质，所以它们的性质差异很大。CO有毒，有可燃性和还原性；CO₂无毒，不能燃烧，能与水和石灰水反应等。"},{"id":"g3_chemistry_019_ex05","knowledge_id":"g3_chemistry_019","question":"填空题：一氧化碳的化学性质主要有：（1）______性，燃烧时火焰呈______色，反应方程式为______；（2）______性，能与氧化铜等金属氧化物反应；（3）______性，能与人体血红蛋白结合使人中毒。","answer":"答案：可燃，蓝，2CO+O₂=2CO₂（点燃），还原，毒\n解析：一氧化碳有三个重要化学性质：可燃性（作燃料）、还原性（冶炼金属）、毒性（使人中毒）。CO燃烧产生蓝色火焰，生成CO₂。CO还原CuO生成Cu和CO₂。CO有毒是因为它与血红蛋白的结合能力比O₂强200多倍，使人体缺氧。"},{"id":"g3_chemistry_019_ex06","knowledge_id":"g3_chemistry_019","question":"选择题：下列有关CO的说法中，错误的是\nA. CO能与血液中的血红蛋白结合，使人中毒\nB. CO可用于冶炼金属\nC. CO可以用向下排空气法收集\nD. CO可以燃烧，可作燃料","answer":"答案：C\n解析：A选项正确，这是CO有毒的原因；B选项正确，CO有还原性，可用于炼铁等；C选项错误，CO密度与空气接近（相对分子质量28，空气平均29），且有毒，不能用排空气法收集，应该用排水法收集；D选项正确，CO有可燃性，是煤气的主要成分。"},{"id":"g3_chemistry_019_ex07","knowledge_id":"g3_chemistry_019","question":"解答题：长期盛放石灰水的试剂瓶内壁上常有一层白色固体，它是什么？是怎样形成的？如何除去它？写出有关反应的化学方程式。","answer":"答案：白色固体是碳酸钙（CaCO₃）；是石灰水中的氢氧化钙与空气中的二氧化碳反应生成的；可以用稀盐酸除去。\n相关反应方程式：\n形成：CO₂+Ca(OH)₂=CaCO₃↓+H₂O\n除去：CaCO₃+2HCl=CaCl₂+H₂O+CO₂↑\n解析：石灰水的主要成分是Ca(OH)₂，能与空气中的CO₂反应生成不溶于水的碳酸钙白色沉淀，附着在瓶壁上。碳酸钙能与稀盐酸反应生成可溶于水的氯化钙，所以可以用稀盐酸清洗。"},{"id":"g3_chemistry_019_ex08","knowledge_id":"g3_chemistry_019","question":"选择题：除去CO中混有的少量CO₂，应采用的方法是\nA. 将混合气体点燃\nB. 将混合气体通过灼热的氧化铜\nC. 将混合气体通过澄清石灰水\nD. 将混合气体通过水","answer":"答案：C\n解析：A选项错误，点燃时CO燃烧生成CO₂，反而把主要成分CO除去了；B选项错误，CO与灼热的CuO反应生成CO₂，也是除去了CO；C选项正确，CO₂能与澄清石灰水反应而被吸收，CO不反应，可除去CO₂；D选项错误，CO₂在水中溶解度不大，不能完全除去，效果不好。"},{"id":"g3_chemistry_019_ex09","knowledge_id":"g3_chemistry_019","question":"填空题：固态二氧化碳俗称______，升华时______大量的热，因此可作______剂，用于人工降雨、冷藏食品等。二氧化碳还可用于灭火，是因为它具有______、______、______的性质。","answer":"答案：干冰，吸收，制冷，密度比空气大，不能燃烧，不支持燃烧\n解析：干冰是固态CO₂，升华吸热使周围温度降低，所以可作制冷剂、用于人工降雨。CO₂能灭火是利用了：密度比空气大（能覆盖在可燃物表面）、不能燃烧、不支持燃烧这三个性质。"},{"id":"g3_chemistry_019_ex10","knowledge_id":"g3_chemistry_019","question":"判断题：有人说，为了防止煤气中毒，可以在煤炉上放一盆水。这种说法对吗？为什么？","answer":"答案：错误\n解析：煤气中毒主要是一氧化碳中毒。一氧化碳难溶于水，也不与水反应，所以放一盆水不能吸收一氧化碳，不能防止煤气中毒。正确的做法是保持通风，安装烟囱等使CO及时排出。"},{"id":"g3_chemistry_020_ex01","knowledge_id":"g3_chemistry_020","question":"选择题：下列关于燃烧的说法中，正确的是\nA. 燃烧一定是化合反应\nB. 发光发热的变化一定是燃烧\nC. 燃烧是一种剧烈的氧化反应\nD. 可燃物只要与氧气接触就会燃烧","answer":"答案：C\n解析：A选项错误，燃烧不一定是化合反应，例如蜡烛燃烧生成二氧化碳和水，就不是化合反应；B选项错误，发光发热的变化不一定是燃烧，如灯泡发光发热是物理变化；C选项正确，燃烧是可燃物与氧气发生的一种发光、放热的剧烈的氧化反应；D选项错误，燃烧需要同时满足三个条件：可燃物、氧气（或空气）、温度达到着火点，三者缺一不可。"},{"id":"g3_chemistry_020_ex02","knowledge_id":"g3_chemistry_020","question":"填空题：燃烧需要同时满足三个条件：（1）______；（2）______；（3）______。灭火的原理就是破坏燃烧的条件，只要破坏其中______个条件，就能灭火。","answer":"答案：可燃物，与氧气（或空气）接触，温度达到可燃物的着火点，一\n解析：燃烧的三个条件缺一不可，必须同时满足。灭火时只要破坏其中任何一个条件，燃烧就会停止。对应灭火的三个原理：清除或隔离可燃物、隔绝氧气（或空气）、降低温度到可燃物的着火点以下。"},{"id":"g3_chemistry_020_ex03","knowledge_id":"g3_chemistry_020","question":"选择题：下列灭火措施中，利用\"降低温度到可燃物着火点以下\"这一原理的是\nA. 油锅着火，盖上锅盖\nB. 森林着火，开辟隔离带\nC. 图书档案着火，用液态二氧化碳灭火\nD. 房屋着火，用高压水枪喷水灭火","answer":"答案：D\n解析：A选项盖上锅盖是隔绝氧气；B选项开辟隔离带是清除可燃物；C选项液态CO₂灭火主要是隔绝氧气，同时也有降温作用，但主要原理是隔绝氧气；D选项用水灭火，水蒸发吸热，使温度降低到可燃物着火点以下，主要利用的是降温原理。"},{"id":"g3_chemistry_020_ex04","knowledge_id":"g3_chemistry_020","question":"判断题：可燃物的着火点越低，越容易燃烧。（  ）","answer":"答案：正确\n解析：着火点是物质燃烧所需的最低温度，是物质的固有属性，一般不随外界条件改变。着火点越低的物质，越容易达到燃烧所需的温度，所以越容易燃烧。例如白磷着火点只有40℃，很容易自燃。"},{"id":"g3_chemistry_020_ex05","knowledge_id":"g3_chemistry_020","question":"填空题：使燃料充分燃烧通常需要考虑两点：一是______；二是______。燃料不充分燃烧不仅浪费资源，还会产生______等有害气体，污染空气。","answer":"答案：燃烧时要有足够多的空气（或氧气），燃料与空气要有足够大的接触面积，一氧化碳\n解析：促进燃烧的方法：增大氧气浓度、增大可燃物与氧气的接触面积。燃料不充分燃烧时，碳不完全燃烧生成一氧化碳，既浪费燃料又污染空气。"},{"id":"g3_chemistry_020_ex06","knowledge_id":"g3_chemistry_020","question":"选择题：下列做法中，存在安全隐患的是\nA. 加油站内严禁烟火\nB. 夜晚发现煤气泄漏，立即开灯检查\nC. 进入久未开启的菜窖前，先做灯火实验\nD. 用液态二氧化碳灭火器扑灭图书档案火灾","answer":"答案：B\n解析：A选项正确，加油站周围空气中混有油气，遇明火可能爆炸，所以严禁烟火；B选项错误，煤气泄漏时，空气中混有可燃性气体，开灯时产生的电火花可能引起爆炸，应该先关闭阀门，开窗通风；C选项正确，久未开启的菜窖中可能积聚大量CO₂，做灯火实验检验CO₂浓度；D选项正确，液态CO₂灭火后不留痕迹，不会损坏图书档案。"},{"id":"g3_chemistry_020_ex07","knowledge_id":"g3_chemistry_020","question":"解答题：在500mL的烧杯中注入400mL热水，在烧杯上盖一片铜片，铜片上一端放一小堆干燥的红磷，另一端放一小块已用滤纸吸去表面水的白磷。（已知白磷着火点约40℃，红磷着火点约240℃）请回答：（1）实验中观察到的现象是什么？（2）通过该实验可以得出燃烧需要哪些条件？（3）如果向热水中的白磷通入氧气，会观察到什么现象？说明了什么？","answer":"答案：（1）铜片上的白磷燃烧，产生大量白烟；铜片上的红磷不燃烧；热水中的白磷不燃烧。（2）燃烧需要温度达到可燃物的着火点，且可燃物要与氧气（或空气）接触。（3）热水中的白磷也会燃烧起来；说明只要满足燃烧的三个条件，即使在水中也能燃烧。\n解析：（1）铜片上的白磷：有可燃物、有氧气、温度达到着火点（热水温度超过40℃），所以燃烧；红磷：温度没达到着火点（240℃），所以不燃烧；水中白磷：没有氧气，所以不燃烧。（2）对比白磷和红磷，说明燃烧需要温度达到着火点；对比铜片上白磷和水中白磷，说明燃烧需要与氧气接触。（3）向水中白磷通氧气后，三个条件都满足，白磷在水下也能燃烧。"},{"id":"g3_chemistry_020_ex08","knowledge_id":"g3_chemistry_020","question":"选择题：爆炸是一种剧烈的燃烧现象。下列关于爆炸的说法中，正确的是\nA. 爆炸一定是化学变化\nB. 可燃物在有限空间内急速燃烧就可能发生爆炸\nC. 只要有可燃性气体，遇明火就会爆炸\nD. 爆炸都是有害的，没有利用价值","answer":"答案：B\n解析：A选项错误，爆炸不一定是化学变化，如气球爆炸、轮胎爆炸是物理变化；B选项正确，爆炸的条件：可燃物在有限空间内急速燃烧，短时间聚积大量热，使气体体积迅速膨胀就会爆炸；C选项错误，可燃性气体遇明火爆炸需要达到爆炸极限，且在有限空间内；D选项错误，爆炸也可以利用，如开山爆破、定向爆破等。"},{"id":"g3_chemistry_020_ex09","knowledge_id":"g3_chemistry_020","question":"填空题：缓慢氧化是进行得很______的氧化反应，甚至不容易被察觉。例如：______、______、______等都属于缓慢氧化。缓慢氧化也会______热，如果热量不能及时散失，可能引发______。","answer":"答案：缓慢，铁生锈，食物腐烂，动植物呼吸（合理即可），放，自燃\n解析：缓慢氧化特点：反应慢、不易察觉、放热但不发光。常见例子：铁生锈、食物腐败、动植物呼吸、酒和醋的酿造、农家肥腐熟等。缓慢氧化放出的热量如果积聚，使温度升高达到可燃物的着火点，就会引起自燃，如白磷自燃、稻草堆自燃等。"},{"id":"g3_chemistry_020_ex10","knowledge_id":"g3_chemistry_020","question":"判断题：用嘴吹灭蜡烛的灭火原理是降低了蜡烛的着火点。（  ）","answer":"答案：错误\n解析：着火点是物质的固有属性，一般不会改变。用嘴吹灭蜡烛，是因为空气流动带走热量，使温度降低到蜡烛的着火点以下，从而使火焰熄灭。灭火原理是\"降低温度到可燃物的着火点以下\"，而不是\"降低着火点\"。"},{"id":"g3_chemistry_021_ex01","knowledge_id":"g3_chemistry_021","question":"选择题：下列关于煤、石油、天然气的说法中，正确的是\nA. 它们都是可再生能源\nB. 它们都是纯净物\nC. 它们都是重要的化石燃料\nD. 它们在地球上的蕴藏量是无限的","answer":"答案：C\n解析：A选项错误，煤、石油、天然气都是古代生物遗骸经过漫长的地质年代形成的，属于不可再生能源；B选项错误，它们都是由多种物质组成的复杂混合物；C选项正确，三大化石燃料是煤、石油、天然气，是当今世界最重要的能源；D选项错误，化石燃料是有限的，属于不可再生能源，不是取之不尽用之不竭的。"},{"id":"g3_chemistry_021_ex02","knowledge_id":"g3_chemistry_021","question":"填空题：天然气的主要成分是______，俗称沼气，它燃烧的化学方程式为______。它是一种比较清洁的能源，因为燃烧产物主要是______和______，对空气污染较小。","answer":"答案：甲烷（CH₄），CH₄+2O₂=CO₂+2H₂O（点燃），二氧化碳，水\n解析：甲烷是最简单的有机物，化学式CH₄。甲烷燃烧产生蓝色火焰，生成二氧化碳和水，放出大量热。天然气和沼气的主要成分都是甲烷，是比较清洁的燃料。"},{"id":"g3_chemistry_021_ex03","knowledge_id":"g3_chemistry_021","question":"选择题：下列关于石油的说法中，错误的是\nA. 石油是一种化工原料\nB. 石油是由多种物质组成的混合物\nC. 石油可以直接用作燃料\nD. 石油分馏可以得到汽油、柴油等产品","answer":"答案：C\n解析：A选项正确，石油是重要的化工原料，可制得塑料、合成纤维、合成橡胶等；B选项正确，石油是由多种碳氢化合物组成的复杂混合物；C选项错误，石油一般不直接用作燃料，而是经过分馏等加工后得到汽油、柴油、煤油等产品再使用，直接燃烧浪费资源且污染大；D选项正确，石油分馏利用各成分沸点不同，分离出汽油、煤油、柴油、润滑油等多种产品。"},{"id":"g3_chemistry_021_ex04","knowledge_id":"g3_chemistry_021","question":"判断题：煤的干馏和石油的分馏都是化学变化。（  ）","answer":"答案：错误\n解析：煤的干馏（炼焦）是将煤隔绝空气加强热使其分解的过程，生成焦炭、煤焦油、焦炉气等新物质，是化学变化。石油的分馏是利用石油中各成分沸点不同，将它们分离的方法，没有生成新物质，是物理变化。"},{"id":"g3_chemistry_021_ex05","knowledge_id":"g3_chemistry_021","question":"填空题：化石燃料燃烧对空气造成的污染主要有：（1）燃料中的杂质（如硫）燃烧产生______等；（2）燃料不充分燃烧产生______；（3）未燃烧的碳氢化合物及炭粒、尘粒等排放到空气中。其中，______和______溶于雨水会形成酸雨。","answer":"答案：二氧化硫，一氧化碳，二氧化硫，二氧化氮\n解析：化石燃料中的硫燃烧生成SO₂，氮燃烧生成NO₂，这些气体溶于雨水形成酸雨（pH<5.6）。燃料不充分燃烧产生CO有毒气体。减少化石燃料使用、使用清洁能源是防治空气污染的重要措施。"},{"id":"g3_chemistry_021_ex06","knowledge_id":"g3_chemistry_021","question":"选择题：下列能源中，属于可再生能源的一组是\n①太阳能 ②风能 ③石油 ④氢能 ⑤煤 ⑥地热能 ⑦天然气\nA. ①②③④\nB. ①②④⑥\nC. ②③④⑦\nD. ①③⑤⑦","answer":"答案：B\n解析：可再生能源是可以源源不断从自然界获得的能源。①太阳能、②风能、④氢能（可由水制取）、⑥地热能都是可再生的；③石油、⑤煤、⑦天然气是化石燃料，属于不可再生能源。"},{"id":"g3_chemistry_021_ex07","knowledge_id":"g3_chemistry_021","question":"解答题：为什么说氢气是最理想的清洁燃料？目前氢能源没有广泛应用的原因是什么？写出氢气燃烧的化学方程式。","answer":"答案：氢气作为理想燃料的优点：（1）原料来源广泛（可由水制取）；（2）燃烧热值高（比同质量的汽油、甲烷放热量高）；（3）燃烧产物是水，不污染环境。目前未广泛应用的原因：制取成本高（电解水耗能大）、贮存和运输困难（氢气密度小，易燃易爆）。氢气燃烧方程式：2H₂+O₂=2H₂O（点燃）\n解析：氢气被认为是最清洁的能源，因为燃烧产物只有水，对环境无污染。但目前制取氢气主要靠电解水，消耗大量电能，成本高；而且氢气难液化，贮存运输都不方便，所以还没有大规模使用。"},{"id":"g3_chemistry_021_ex08","knowledge_id":"g3_chemistry_021","question":"选择题：下列关于乙醇（C₂H₅OH）的说法中，错误的是\nA. 乙醇属于可再生能源\nB. 乙醇燃烧的产物是二氧化碳和水\nC. 乙醇是由碳、氢、氧三种元素组成的有机物\nD. 乙醇是一种不可再生能源","answer":"答案：D\n解析：A选项正确，乙醇可由高粱、玉米等粮食发酵制取，属于可再生能源；B选项正确，乙醇完全燃烧生成CO₂和H₂O，是较清洁的燃料；C选项正确，乙醇化学式C₂H₅OH，含碳元素，是有机物；D选项错误，乙醇是可再生的，不是不可再生能源。"},{"id":"g3_chemistry_021_ex09","knowledge_id":"g3_chemistry_021","question":"填空题：煤、石油、天然气是三大化石燃料。煤被称为\"______\"，主要含有______元素；石油被称为\"______\"，主要含有______和______元素。为了节约化石能源，我们应该开发和利用新能源，请你举出三种新能源：______、______、______。","answer":"答案：工业的粮食，碳，工业的血液，碳，氢，太阳能，风能，核能（或地热能、潮汐能、生物质能、氢能等，合理即可）\n解析：煤主要含碳元素，被称为\"工业的粮食\"，用于冶金、发电、化工等。石油主要含碳氢两种元素，被称为\"工业的血液\"。新能源包括太阳能、风能、核能、地热能、潮汐能、生物质能、氢能等。"},{"id":"g3_chemistry_021_ex10","knowledge_id":"g3_chemistry_021","question":"判断题：化学反应都伴随着能量变化，通常表现为热量变化，即放热或吸热。（  ）","answer":"答案：正确\n解析：化学反应在生成新物质的同时，还伴随着能量的变化，这种能量变化经常表现为热量变化。有些反应放热（如燃烧、中和反应、金属与酸反应等），有些反应吸热（如碳与二氧化碳反应、高锰酸钾分解等）。利用化学反应放出的热量可以用来取暖、发电、冶炼金属等。"},{"id":"g3_chemistry_022_ex01","knowledge_id":"g3_chemistry_022","question":"选择题：下列物质中，不属于金属材料的是（  ）\nA. 黄铜\nB. 不锈钢\nC. 铁矿石\nD. 硬铝","answer":"答案：C\n解析：金属材料包括纯金属和合金。黄铜是铜锌合金，不锈钢是铁铬镍合金，硬铝是铝铜镁硅合金，都属于金属材料。铁矿石是含有铁元素的矿石，主要成分是氧化铁等化合物，不是金属材料。"},{"id":"g3_chemistry_022_ex02","knowledge_id":"g3_chemistry_022","question":"填空题：金属具有很多共同的物理性质：常温下，它们都是______体（汞除外），有______光泽，大多数为______和______的优良导体，有______性，密度______，熔点______。","answer":"
