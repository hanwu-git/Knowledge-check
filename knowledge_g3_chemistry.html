答案：固，金属，电，热，延展，较大，较高\n解析：金属的共同物理性质：常温下大多是固体（汞为液态），有金属光泽，具有良好的导电性、导热性和延展性，密度较大，熔点较高。但不同金属也有各自的特性，如铜呈紫红色、金呈黄色等。"},{"id":"g3_chemistry_022_ex03","knowledge_id":"g3_chemistry_022","question":"选择题：下列关于合金的说法，正确的是（  ）\nA. 合金中至少含有两种金属元素\nB. 合金中的元素以化合物的形式存在\nC. 合金的硬度一般比组成它的纯金属大\nD. 合金的熔点一般比组成它的纯金属高","answer":"答案：C\n解析：合金是在金属中加热熔合某些金属或非金属制得的具有金属特征的物质。A错误，合金中可以含非金属，如生铁含碳；B错误，合金中元素以单质形式存在，不是化合物；C正确，合金硬度一般比纯金属大；D错误，合金熔点一般比纯金属低。"},{"id":"g3_chemistry_022_ex04","knowledge_id":"g3_chemistry_022","question":"判断题：地壳中含量最高的金属元素是铁。（  ）","answer":"答案：错误\n解析：地壳中含量最高的金属元素是铝（Al），不是铁。地壳中元素含量前四位：氧、硅、铝、铁。铝是地壳中含量最多的金属元素，铁是其次。"},{"id":"g3_chemistry_022_ex05","knowledge_id":"g3_chemistry_022","question":"选择题：某新型钢材，强度是普通钢材的3倍，重量却只有普通钢材的1/5，可用于制造高铁车身。这种钢材最可能属于（  ）\nA. 纯铁\nB. 生铁\nC. 不锈钢\nD. 合金钢","answer":"答案：D\n解析：纯铁质软，不适合做结构材料；生铁硬而脆，不能锻造；不锈钢主要特性是耐腐蚀；合金钢是在钢中加入不同合金元素制成的，具有高强度、低密度等特殊性能，适合制造高铁车身等高端装备。"},{"id":"g3_chemistry_022_ex06","knowledge_id":"g3_chemistry_022","question":"填空题：日常生活中，用于制作导线的紫红色金属是______；体温计中填充的银白色液态金属是______；家用热水瓶内胆壁上的银白色金属是______；涂在铁栏杆上的\"银粉漆\"主要成分是______。","answer":"答案：铜，汞，银，铝\n解析：铜呈紫红色，导电性好，用于制导线；汞是常温下唯一的液态金属，用于体温计；银反射性好，镀在热水瓶内胆上保温；铝是银白色金属，涂在铁表面形成\"银粉漆\"防止生锈。"},{"id":"g3_chemistry_022_ex07","knowledge_id":"g3_chemistry_022","question":"选择题：铁和钛都是重要的金属材料。下列说法错误的是（  ）\nA. 铁是目前世界年产量最高的金属\nB. 钛合金与人体具有很好的\"相容性\"，可用来制造人造骨\nC. 铁在地壳中的含量比钛高\nD. 钛的熔点比铁低，所以钛合金更容易加工","answer":"答案：D\n解析：A正确，铁是目前世界年产量最高的金属；B正确，钛合金与人体相容性好，可制造人造骨；C正确，地壳中铁含量约5%，钛约0.44%，铁比钛高；D错误，钛的熔点（1668℃）比铁（1538℃）高，且钛加工难度大，不是因为熔点低。"},{"id":"g3_chemistry_022_ex08","knowledge_id":"g3_chemistry_022","question":"判断题：合金都是混合物，没有固定的组成和性质。（  ）","answer":"答案：正确\n解析：合金是混合物，由多种物质组成，没有固定的化学式。合金的组成可以在一定范围内变化，其性质也随组成的改变而改变。例如铁碳合金，含碳量不同，性质也不同，生铁含碳2%~4.3%，钢含碳0.03%~2%。"},{"id":"g3_chemistry_022_ex09","knowledge_id":"g3_chemistry_022","question":"解答题：某同学在实验室进行实验：将黄铜片（铜锌合金）和纯铜片互相刻画，发现纯铜片上留下明显划痕，而黄铜片上没有明显痕迹。请回答：\n（1）该实验说明什么问题？\n（2）请再举两个生活中利用合金这一性质的实例。","answer":"答案：（1）说明合金（黄铜）的硬度比组成它的纯金属（纯铜）大。\n（2）生活实例：① 用锰钢制作钢轨、挖掘机铲斗，利用其硬度大、韧性好的性质；② 用硬铝制造飞机、汽车外壳，利用其硬度大、密度小的性质。\n解析：合金与组成它的纯金属相比，一般硬度更大、熔点更低、抗腐蚀性更好。本题通过互相刻画的实验方法比较硬度，纯铜片上有划痕说明黄铜硬度更大。生活中合金的应用非常广泛，都是利用了合金比纯金属更优良的性能。"},{"id":"g3_chemistry_022_ex10","knowledge_id":"g3_chemistry_022","question":"选择题：有一块铜锌合金（黄铜），质量为50g，体积为6cm³。已知铜的密度为8.9g/cm³，锌的密度为7.1g/cm³。则该合金中铜的质量约为（  ）\nA. 20g\nB. 28g\nC. 36g\nD. 42g","answer":"答案：C\n解析：设铜的质量为m铜，锌的质量为m锌。\n根据题意列方程：\nm铜 + m锌 = 50g  （总质量）\nV铜 + V锌 = 6cm³  （总体积）\nV铜 = m铜/ρ铜 = m铜/8.9\nV锌 = m锌/ρ锌 = m锌/7.1\n代入得：m铜/8.9 + m锌/7.1 = 6\n将m锌 = 50 - m铜代入：\nm铜/8.9 + (50 - m铜)/7.1 = 6\n两边同乘8.9×7.1 = 63.19：\n7.1m铜 + 8.9(50 - m铜) = 379.14\n7.1m铜 + 445 - 8.9m铜 = 379.14\n-1.8m铜 = -65.86\nm铜 ≈ 36.6g ≈ 36g\n所以铜的质量约为36g，答案选C。"},{"id":"g3_chemistry_023_ex01","knowledge_id":"g3_chemistry_023","question":"选择题：下列金属中，不能与稀盐酸发生反应的是（  ）\nA. 镁\nB. 锌\nC. 铜\nD. 铁","answer":"答案：C\n解析：在金属活动性顺序中，排在氢前面的金属能与稀盐酸、稀硫酸反应生成氢气，排在氢后面的金属则不能。镁、锌、铁都排在氢前面，能与稀盐酸反应；铜排在氢后面，不能与稀盐酸反应。金属活动性顺序：K Ca Na Mg Al Zn Fe Sn Pb (H) Cu Hg Ag Pt Au。"},{"id":"g3_chemistry_023_ex02","knowledge_id":"g3_chemistry_023","question":"填空题：铝在空气中与氧气反应，其表面生成一层致密的______薄膜，从而阻止铝进一步氧化，因此铝具有很好的______性能。该反应的化学方程式为______。","answer":"答案：氧化铝（或Al₂O₃），抗腐蚀，4Al + 3O₂ = 2Al₂O₃\n解析：铝在常温下就能与空气中的氧气反应，生成一层致密的氧化铝（Al₂O₃）薄膜，这层薄膜能阻止内部的铝继续被氧化，所以铝制品耐腐蚀。反应的化学方程式为：4Al + 3O₂ = 2Al₂O₃。这也是铝制品不宜用钢刷、沙等来擦洗的原因，以免破坏氧化膜。"},{"id":"g3_chemistry_023_ex03","knowledge_id":"g3_chemistry_023","question":"选择题：将等质量的镁、铁、锌分别与足量的稀硫酸反应，产生氢气的质量与反应时间的关系如图所示。下列说法正确的是（  ）\nA. 反应速率最快的是镁\nB. 生成氢气最多的是锌\nC. 三种金属的活动性顺序是镁 > 铁 > 锌\nD. 最终消耗硫酸的质量相等","answer":"答案：A\n解析：A正确，镁最活泼，反应速率最快，斜率最大。B错误，等质量的Mg、Fe、Zn与足量酸反应，Mg生成H₂最多（相对原子质量最小且化合价相同，生成H₂质量与相对原子质量成反比）。C错误，活动性顺序是镁 > 锌 > 铁，不是镁 > 铁 > 锌。D错误，生成H₂质量不同，消耗硫酸质量也不同，Mg消耗硫酸最多。"},{"id":"g3_chemistry_023_ex04","knowledge_id":"g3_chemistry_023","question":"判断题：铁在空气中燃烧生成黑色的四氧化三铁。（  ）","answer":"答案：错误\n解析：铁在空气中不能燃烧，只能发生缓慢氧化生成铁锈（主要成分是Fe₂O₃·xH₂O）。铁在纯氧中才能燃烧，火星四射，生成黑色的四氧化三铁（Fe₃O₄）。注意区分铁在空气和氧气中的反应不同。"},{"id":"g3_chemistry_023_ex05","knowledge_id":"g3_chemistry_023","question":"选择题：将一定质量的铁粉放入硫酸铜溶液中，充分反应后过滤，得到滤渣和滤液。下列说法正确的是（  ）\nA. 滤渣中一定含有铜和铁\nB. 滤液中一定含有硫酸亚铁，可能含有硫酸铜\nC. 反应后溶液的质量变大\nD. 该反应属于复分解反应","answer":"答案：B\n解析：铁与硫酸铜反应：Fe + CuSO₄ = FeSO₄ + Cu。A错误，滤渣中一定有铜，但不一定有铁，要看铁是否过量。B正确，滤液中一定有生成的FeSO₄，如果铁不足，还可能有剩余的CuSO₄。C错误，每56份质量的铁进入溶液，析出64份质量的铜，溶液质量减小。D错误，这是置换反应，不是复分解反应。"},{"id":"g3_chemistry_023_ex06","knowledge_id":"g3_chemistry_023","question":"填空题：某学生将打磨过的镁条放入盛有稀盐酸的试管中，观察到的现象是______，反应的化学方程式为______，该反应属于______反应（填基本反应类型）。反应后试管壁发烫，说明该反应是______（填\"吸热\"或\"放热\"）反应。","answer":"答案：镁条表面产生大量气泡，镁条逐渐减少，Mg + 2HCl = MgCl₂ + H₂↑，置换，放热\n解析：镁是活泼金属，排在氢前面，能与稀盐酸剧烈反应生成氯化镁和氢气。现象是产生大量气泡，镁条逐渐溶解减少。该反应是一种单质和一种化合物反应生成另一种单质和另一种化合物，属于置换反应。反应放热，试管壁发烫。"},{"id":"g3_chemistry_023_ex07","knowledge_id":"g3_chemistry_023","question":"选择题：现有X、Y、Z三种金属，如果把X和Y分别放入稀硫酸中，X溶解并产生氢气，Y不反应；如果把Y和Z分别放入硝酸银溶液中，过一会儿，在Y表面有银析出，而Z没有变化。根据以上实验事实，判断X、Y、Z的金属活动性顺序为（  ）\nA. X > Y > Z\nB. Y > X > Z\nC. X > Z > Y\nD. Z > Y > X","answer":"答案：A\n解析：第一步实验：X放入稀硫酸中产生氢气，说明X排在氢前面；Y不反应，说明Y排在氢后面。所以X > H > Y。第二步实验：Y放入硝酸银溶液中有银析出，说明Y > Ag；Z没有变化，说明Ag > Z。所以Y > Ag > Z。综合得：X > H > Y > Ag > Z，即X > Y > Z。"},{"id":"g3_chemistry_023_ex08","knowledge_id":"g3_chemistry_023","question":"判断题：置换反应中一定有元素化合价发生改变。（  ）","answer":"答案：正确\n解析：置换反应是一种单质和一种化合物反应生成另一种单质和另一种化合物的反应。单质中元素化合价为0，化合物中元素化合价不为0，反应前后有单质参与和生成，所以一定有元素化合价的改变。例如：Fe + CuSO₄ = FeSO₄ + Cu，Fe从0价变为+2价，Cu从+2价变为0价。"},{"id":"g3_chemistry_023_ex09","knowledge_id":"g3_chemistry_023","question":"解答题：实验室中，某同学将6.5g锌粒放入100g稀硫酸中，恰好完全反应。请计算：\n（1）生成氢气的质量是多少克？\n（2）所用稀硫酸的溶质质量分数是多少？\n（相对原子质量：Zn-65，H-1，S-32，O-16）","answer":"答案：（1）0.2g （2）9.8%\n解析：设生成氢气的质量为x，参加反应的硫酸质量为y。\nZn + H₂SO₄ = ZnSO₄ + H₂↑\n65    98           2\n6.5g  y            x\n\n（1）65/2 = 6.5g/x\nx = 2×6.5g/65 = 0.2g\n生成氢气0.2g。\n\n（2）65/98 = 6.5g/y\ny = 98×6.5g/65 = 9.8g\n稀硫酸溶质质量分数 = 9.8g/100g × 100% = 9.8%\n\n答：生成氢气0.2g，稀硫酸溶质质量分数为9.8%。"},{"id":"g3_chemistry_023_ex10","knowledge_id":"g3_chemistry_023","question":"选择题：向硝酸银和硝酸铜的混合溶液中加入一定量的锌粉，充分反应后过滤，得到滤渣和蓝色滤液。下列判断正确的是（  ）\nA. 滤渣中一定有银和铜，可能有锌\nB. 滤液中一定有硝酸锌，可能有硝酸铜和硝酸银\nC. 滤液中一定含有硝酸锌和硝酸铜，可能含有硝酸银\nD. 向滤渣中滴加稀盐酸，一定有气泡产生","answer":"答案：C\n解析：锌粉加入硝酸银和硝酸铜的混合溶液中，锌先与硝酸银反应，硝酸银完全反应后，锌再与硝酸铜反应。滤液呈蓝色，说明溶液中有硝酸铜。\nA错误，滤渣中一定有银，但因为滤液有硝酸铜，说明铜没有完全置换出来，锌已全部反应，滤渣中没有锌；铜可能部分置换，也可能没置换。\nB错误，滤液中一定有硝酸锌和硝酸铜（因为蓝色）。\nC正确，一定有生成的硝酸锌和剩余的硝酸铜；如果锌很少，只置换部分银，则硝酸银可能还有剩余。\nD错误，锌已完全反应，滤渣中没有锌，加稀盐酸不会有气泡。"},{"id":"g3_chemistry_024_ex01","knowledge_id":"g3_chemistry_024","question":"选择题：工业上用一氧化碳还原氧化铁炼铁，下列有关说法正确的是（  ）\nA. 该反应属于置换反应\nB. 实验时应先加热，再通入一氧化碳\nC. 实验中红棕色粉末逐渐变为黑色\nD. 尾气可以直接排放到空气中","answer":"答案：C\n解析：A错误，置换反应是单质与化合物反应生成新单质和新化合物，而CO和Fe₂O₃都是化合物，所以不是置换反应。B错误，应先通入CO排尽装置内空气，再加热，防止CO与空气混合加热爆炸。C正确，氧化铁（Fe₂O₃）是红棕色粉末，被还原成黑色的铁粉。D错误，CO有毒，尾气要点燃处理或收集，不能直接排放。"},{"id":"g3_chemistry_024_ex02","knowledge_id":"g3_chemistry_024","question":"填空题：铁制品锈蚀的过程，实际上是铁与空气中的______、______等发生化学反应的过程。铁锈的主要成分是______，结构很______，不能阻止里层的铁继续被锈蚀，因此铁制品可以全部被锈蚀。","answer":"答案：氧气（或O₂），水（或H₂O），Fe₂O₃·xH₂O（或氧化铁），疏松\n解析：铁生锈是铁与氧气和水共同作用的结果，两个条件缺一不可。铁锈的主要成分是Fe₂O₃·xH₂O，结构疏松多孔，不能保护内部的铁，反而会吸附水分，加速内部铁的锈蚀，所以铁制品一旦生锈要及时除锈。"},{"id":"g3_chemistry_024_ex03","knowledge_id":"g3_chemistry_024","question":"选择题：某钢铁厂日产含杂质4%的生铁100t，该厂每天至少需要含氧化铁80%的赤铁矿石多少吨？（相对原子质量：Fe-56，O-16）（  ）\nA. 171.4t\nB. 175t\nC. 192t\nD. 200t","answer":"答案：A\n解析：生铁中铁的质量 = 100t × (1 - 4%) = 96t\n设需要Fe₂O₃的质量为x。\n3CO + Fe₂O₃ =高温= 2Fe + 3CO₂\n        160         112\n         x          96t\n160/112 = x/96t\nx = 160×96t/112 ≈ 137.14t\n需要赤铁矿石质量 = 137.14t ÷ 80% ≈ 171.4t\n答案选A。"},{"id":"g3_chemistry_024_ex04","knowledge_id":"g3_chemistry_024","question":"判断题：铝的活动性比铁强，所以铝制品比铁制品更容易被腐蚀。（  ）","answer":"答案：错误\n解析：铝的活动性确实比铁强，但铝在空气中与氧气反应，表面生成一层致密的氧化铝薄膜，能阻止内部的铝继续被氧化，所以铝制品耐腐蚀。而铁生锈后，铁锈疏松多孔，不能保护内部的铁，铁会继续生锈。所以虽然铝比铁活泼，但铝制品比铁制品更耐腐蚀。"},{"id":"g3_chemistry_024_ex05","knowledge_id":"g3_chemistry_024","question":"选择题：下列防止铁制品生锈的方法中，不正确的是（  ）\nA. 在铁制暖气片上刷一层\"银粉\"（铝粉）\nB. 用食盐水清洗铁制品表面的污垢\nC. 在自行车链条上涂润滑油\nD. 将铁制品放在干燥通风的地方","answer":"答案：B\n解析：防止铁生锈的原理是隔绝氧气和水。A正确，铝粉氧化后形成致密氧化膜，保护内部铁。B错误，食盐水是电解质溶液，会加速铁的电化学腐蚀，不能用食盐水清洗铁制品。C正确，涂油能隔绝水和氧气。D正确，干燥通风的环境缺少水分，铁不易生锈。"},{"id":"g3_chemistry_024_ex06","knowledge_id":"g3_chemistry_024","question":"填空题：工业炼铁的主要设备是______；主要原料有______、______、石灰石和空气；石灰石的作用是______。炼铁的原理是利用______的还原性，将铁从铁矿石中还原出来。","answer":"答案：高炉，铁矿石，焦炭，将矿石中的二氧化硅转变为炉渣，一氧化碳\n解析：工业炼铁在高炉中进行，原料包括铁矿石、焦炭、石灰石和空气。焦炭的作用是提供热量和生成还原剂CO；石灰石的作用是将矿石中的二氧化硅转变为炉渣（造渣材料）。炼铁原理是利用CO的还原性，在高温下将铁从氧化铁中还原出来：3CO + Fe₂O₃ =高温= 2Fe + 3CO₂。"},{"id":"g3_chemistry_024_ex07","knowledge_id":"g3_chemistry_024","question":"选择题：某同学设计实验探究铁生锈的条件，将三根洁净的铁钉分别放入A、B、C三支试管中：A试管中铁钉半浸在蒸馏水中，B试管中铁钉浸没在经煮沸迅速冷却的蒸馏水中并在水面上加一层植物油，C试管中放干燥剂并塞紧橡皮塞。下列说法错误的是（  ）\nA. A试管中的铁钉最先生锈\nB. B试管中植物油的作用是隔绝空气\nC. 通过B、C两支试管的对比，说明铁生锈需要水和氧气\nD. 通过A、C对比，说明铁生锈需要水","answer":"答案：C\n解析：A正确，A试管中铁钉同时接触水和空气（氧气），最容易生锈。B正确，B试管中植物油覆盖在水面上，隔绝空气（氧气），煮沸蒸馏水也是为了除去水中溶解的氧气。C错误，B试管中有水无氧气，C试管中有氧气无水，变量有两个（水和氧气都不同），不能通过B、C对比得出结论，因为不符合控制变量法的要求。D正确，A和C对比，变量是水（A有水，C无水），都有氧气，A生锈C不生锈，说明铁生锈需要水。"},{"id":"g3_chemistry_024_ex08","knowledge_id":"g3_chemistry_024","question":"判断题：用一氧化碳还原氧化铁的实验中，结束时应先停止通一氧化碳，再熄灭酒精灯。（  ）","answer":"答案：错误\n解析：实验结束时，应先熄灭酒精灯，继续通一氧化碳直到玻璃管冷却。如果先停止通CO，空气进入玻璃管，高温下铁会与空气中的氧气反应重新被氧化。同时，先熄灭酒精灯继续通CO还可以防止石灰水倒吸入热的玻璃管，使玻璃管炸裂。所以正确顺序是：先熄灯，后停气。"},{"id":"g3_chemistry_024_ex09","knowledge_id":"g3_chemistry_024","question":"解答题：某化学兴趣小组用一氧化碳与氧化铁反应制取铁，实验装置如下图所示。请回答下列问题：\n（1）硬质玻璃管中观察到的现象是什么？写出反应的化学方程式。\n（2）试管中澄清石灰水的作用是什么？观察到什么现象？\n（3）为什么要点燃尾气？写出尾气燃烧的化学方程式。\n（4）实验开始时，为什么要先通入一会儿一氧化碳，再加热？","answer":"答案：见解析\n解析：\n（1）现象：红棕色粉末逐渐变成黑色。\n化学方程式：3CO + Fe₂O₃ =高温= 2Fe + 3CO₂\n氧化铁（红棕色）被还原为铁粉（黑色）。\n\n（2）澄清石灰水的作用是检验生成的二氧化碳气体。\n现象：澄清石灰水变浑浊。\nCO₂ + Ca(OH)₂ = CaCO₃↓ + H₂O\n\n（3）因为一氧化碳有毒，直接排放会污染空气，所以要点燃尾气，将其转化为无毒的二氧化碳。\n尾气燃烧的化学方程式：2CO + O₂ =点燃= 2CO₂\n\n（4）先通一氧化碳是为了排尽玻璃管内的空气，防止加热时一氧化碳与空气混合发生爆炸。"},{"id":"g3_chemistry_024_ex10","knowledge_id":"g3_chemistry_024","question":"选择题：将一枚洁净的铁钉放入稀盐酸中，下列叙述正确的是（  ）\n① 铁钉表面产生气泡  ② 溶液由无色逐渐变为浅绿色  ③ 铁钉质量减轻  ④ 溶液质量减轻\nA. ①②③\nB. ①②④\nC. ①③④\nD. ②③④","answer":"答案：A\n解析：铁与稀盐酸反应：Fe + 2HCl = FeCl₂ + H₂↑\n① 正确，生成氢气，铁钉表面有气泡。\n② 正确，生成FeCl₂，氯化亚铁溶液是浅绿色的，溶液由无色变浅绿色。\n③ 正确，铁参与反应被溶解，铁钉质量减轻。\n④ 错误，每56份质量的铁进入溶液，逸出2份质量的氢气，溶液质量增加56-2=54份，溶液质量增加，不是减轻。\n所以①②③正确，选A。"},{"id":"g3_chemistry_025_ex01","knowledge_id":"g3_chemistry_025","question":"选择题：下列物质放入水中，能形成溶液的是（  ）\nA. 面粉\nB. 牛奶\nC. 蔗糖\nD. 花生油","answer":"答案：C\n解析：溶液是均一、稳定的混合物。蔗糖溶于水形成均一、稳定的蔗糖溶液。面粉不溶于水，放入水中形成悬浊液；牛奶和花生油不溶于水，形成乳浊液。悬浊液和乳浊液都不均一、不稳定，静置后会分层或沉淀。"},{"id":"g3_chemistry_025_ex02","knowledge_id":"g3_chemistry_025","question":"填空题：溶液是由______和______组成的。被溶解的物质叫做______，能溶解其他物质的物质叫做______。最常用的溶剂是______。溶液的特征是______性和______性。","answer":"答案：溶质，溶剂，溶质，溶剂，水，均一，稳定\n解析：溶液由溶质和溶剂两部分组成。溶质是被溶解的物质，溶剂是能溶解其他物质的物质。水是最常用的溶剂，汽油、酒精等也可以作溶剂。溶液具有均一性（溶液各部分性质完全相同）和稳定性（温度不变、水分不蒸发，溶质不会从溶剂中分离出来）。"},{"id":"g3_chemistry_025_ex03","knowledge_id":"g3_chemistry_025","question":"选择题：下列关于溶液的说法，正确的是（  ）\nA. 溶液一定是无色透明的液体\nB. 溶液中只能有一种溶质\nC. 溶液的质量等于溶质质量与溶剂质量之和\nD. 溶液的体积等于溶质体积与溶剂体积之和","answer":"答案：C\n解析：A错误，溶液不一定无色，如硫酸铜溶液是蓝色的，氯化铁溶液是黄色的。B错误，溶液中的溶质可以是一种或多种，如海水中含有氯化钠、氯化镁等多种溶质。C正确，溶液质量 = 溶质质量 + 溶剂质量。D错误，由于分子间有间隙，溶液体积不等于溶质体积加溶剂体积，如100mL水和100mL酒精混合后体积小于200mL。"},{"id":"g3_chemistry_025_ex04","knowledge_id":"g3_chemistry_025","question":"判断题：凡是均一、稳定的液体一定是溶液。（  ）","answer":"答案：错误\n解析：溶液是均一、稳定的混合物。但均一、稳定的液体不一定是溶液，还必须是混合物。例如纯水、纯酒精都是均一、稳定的液体，但它们是纯净物，不是溶液。溶液必须是混合物，由溶质和溶剂组成。"},{"id":"g3_chemistry_025_ex05","knowledge_id":"g3_chemistry_025","question":"选择题：小明同学在配制蔗糖溶液时，发现蔗糖溶解得很慢。下列操作不能加快蔗糖溶解速率的是（  ）\nA. 用玻璃棒搅拌\nB. 升高水的温度\nC. 将蔗糖研成粉末\nD. 增加水的质量","answer":"答案：D\n解析：加快溶解速率的方法有：搅拌（加快分子运动）、升温（加快分子运动）、将固体研碎（增大接触面积）。增加水的质量只能增加溶解的总量，但不能加快溶解速率。溶解速率与溶剂多少无关。"},{"id":"g3_chemistry_025_ex06","knowledge_id":"g3_chemistry_025","question":"填空题：写出下列溶液中的溶质和溶剂（填化学式或名称）：\n（1）碘酒：溶质______，溶剂______；\n（2）澄清石灰水：溶质______，溶剂______；\n（3）稀盐酸：溶质______，溶剂______；\n（4）硫酸铜溶液：溶质______，溶剂______。","answer":"答案：（1）碘，酒精  （2）氢氧化钙（或Ca(OH)₂），水（或H₂O）  （3）氯化氢（或HCl），水（或H₂O）  （4）硫酸铜（或CuSO₄），水（或H₂O）\n解析：固体、气体溶于液体时，固体、气体是溶质，液体是溶剂。两种液体互相溶解时，量多的是溶剂，量少的是溶质。如果有水，水一般是溶剂。碘酒是碘的酒精溶液，碘是溶质，酒精是溶剂。澄清石灰水是氢氧化钙的水溶液。稀盐酸是氯化氢气体的水溶液。"},{"id":"g3_chemistry_025_ex07","knowledge_id":"g3_chemistry_025","question":"选择题：下列洗涤方法中，利用乳化原理的是（  ）\nA. 用汽油洗去衣服上的油污\nB. 用洗洁精洗去餐具上的油污\nC. 用稀盐酸洗去铁制品表面的铁锈\nD. 用酒精洗去试管内壁的碘","answer":"答案：B\n解析：A错误，汽油洗油污是因为油污能溶解在汽油中，形成溶液，是溶解原理。B正确，洗洁精有乳化作用，能将大的油滴分散成细小的油滴，随水流走，是乳化原理。C错误，稀盐酸除锈是盐酸与铁锈（氧化铁）发生化学反应。D错误，酒精洗碘是碘溶解在酒精中，是溶解原理。"},{"id":"g3_chemistry_025_ex08","knowledge_id":"g3_chemistry_025","question":"判断题：硝酸铵溶于水时，溶液温度会升高。（  ）","answer":"答案：错误\n解析：物质溶解时伴随着热量变化。硝酸铵（NH₄NO₃）溶于水时吸收热量，溶液温度降低；氢氧化钠（NaOH）溶于水时放出热量，溶液温度升高；氯化钠（NaCl）等大多数物质溶于水时温度变化不明显。所以硝酸铵溶于水温度是降低的，不是升高。"},{"id":"g3_chemistry_025_ex09","knowledge_id":"g3_chemistry_025","question":"解答题：某同学在家中做了一个有趣的实验：向一个小烧杯中加入半杯水，烧杯底部用蜡粘着一只塑料小船。然后向烧杯中加入一种固体物质，用玻璃棒搅拌。过一会儿，小船浮了起来。请回答：\n（1）加入的固体物质可能是什么？（写出一种即可）\n（2）小船浮起来的原因是什么？\n（3）如果加入的是硝酸铵固体，小船会浮起来吗？为什么？","answer":"答案：见解析\n解析：\n（1）加入的固体物质可能是氢氧化钠（NaOH），也可以是浓硫酸、生石灰（CaO）等溶于水（或与水反应）放热的物质。\n\n（2）小船浮起来的原因是：氢氧化钠固体溶于水放出大量的热，使烧杯底部的蜡熔化，小船失去蜡的粘接力，就浮起来了。\n\n（3）如果加入的是硝酸铵固体，小船不会浮起来。因为硝酸铵溶于水时吸收热量，溶液温度降低，蜡不会熔化，小船仍然被粘在烧杯底部。\n\n物质溶解时伴随着热量变化：氢氧化钠、浓硫酸等溶于水放热；硝酸铵溶于水吸热；氯化钠等大多数物质溶于水温度变化不明显。"},{"id":"g3_chemistry_025_ex10","knowledge_id":"g3_chemistry_025","question":"选择题：t℃时，向100g水中加入20g硝酸钾，充分搅拌后仍有2g硝酸钾未溶解。下列说法正确的是（  ）\nA. 该溶液是不饱和溶液\nB. 该溶液中溶质质量为20g\nC. 该溶液的质量为120g\nD. 该溶液中溶质与溶剂的质量比为9:50","answer":"答案：D\n解析：A错误，还有2g未溶解，说明溶液已达到饱和状态。B错误，溶解的溶质质量是20g - 2g = 18g。C错误，溶液质量 = 溶剂质量 + 溶解的溶质质量 = 100g + 18g = 118g。D正确，溶质质量18g，溶剂质量100g，溶质与溶剂的质量比 = 18:100 = 9:50。"},{"id":"g3_chemistry_026_ex01","knowledge_id":"g3_chemistry_026","question":"选择题：下列关于饱和溶液的说法，正确的是（  ）\nA. 饱和溶液一定是浓溶液\nB. 饱和溶液降温后一定有晶体析出\nC. 同一温度下，同种溶质的饱和溶液一定比不饱和溶液浓\nD. 饱和溶液是指不能再溶解任何物质的溶液","answer":"答案：C\n解析：A错误，饱和溶液不一定是浓溶液，如氢氧化钙微溶于水，其饱和溶液也是稀溶液。B错误，有些物质的溶解度随温度降低而增大，如氢氧化钙，降温后不会析出晶体，反而变成不饱和溶液。C正确，同一温度下，同种溶质的饱和溶液是该温度下浓度最大的溶液，一定比不饱和溶液浓。D错误，饱和溶液是指在一定温度下、一定量溶剂里，不能再溶解某种溶质的溶液，但还可以溶解其他溶质。"},{"id":"g3_chemistry_026_ex02","knowledge_id":"g3_chemistry_026","question":"填空题：固体溶解度表示在一定______下，某固体物质在______g溶剂里达到______状态时所溶解的______。影响固体溶解度的外界因素主要是______，大多数固体物质的溶解度随温度升高而______，如______；少数固体物质的溶解度受温度影响______，如______；极少数固体物质的溶解度随温度升高而______，如______。","answer":"答案：温度，100，饱和，质量，温度，增大，硝酸钾，很小，氯化钠，减小，氢氧化钙\n解析：固体溶解度四要素：一定温度、100g溶剂、饱和状态、溶质质量（单位g）。影响因素：温度。变化规律：大多数随温度升高而增大（如KNO₃），少数受温度影响小（如NaCl），极少数随温度升高而减小（如Ca(OH)₂）。"},{"id":"g3_chemistry_026_ex03","knowledge_id":"g3_chemistry_026","question":"选择题：20℃时，氯化钠的溶解度是36g。下列说法正确的是（  ）\nA. 20℃时，100g氯化钠饱和溶液中含氯化钠36g\nB. 20℃时，100g水中最多溶解36g氯化钠\nC. 20℃时，氯化钠饱和溶液中溶质的质量分数为36%\nD. 将36g氯化钠放入100g水中，一定能得到氯化钠的饱和溶液","answer":"答案：B\n解析：A错误，溶解度是指100g溶剂中溶解的溶质，不是100g溶液。20℃时，136g饱和溶液中含36g NaCl。B正确，溶解度的定义就是一定温度下，100g溶剂中达到饱和时溶解的溶质质量。C错误，质量分数 = 36g/136g × 100% ≈ 26.5%，不是36%。D错误，没有说明温度，溶解度与温度有关，不同温度下溶解度不同。"},{"id":"g3_chemistry_026_ex04","knowledge_id":"g3_chemistry_026","question":"判断题：气体的溶解度随温度升高而增大，随压强增大而减小。（  ）","answer":"答案：错误\n解析：气体的溶解度随温度升高而减小，随压强增大而增大。例如：喝汽水后会打嗝，是因为体内温度高，二氧化碳溶解度减小，逸出；打开汽水瓶盖有大量气泡冒出，是因为压强减小，二氧化碳溶解度减小。所以题干说反了。"},{"id":"g3_chemistry_026_ex05","knowledge_id":"g3_chemistry_026","question":"选择题：a、b两种固体物质的溶解度曲线如图所示。下列说法正确的是（  ）\nA. a的溶解度大于b的溶解度\nB. t₁℃时，a、b两种物质的溶解度相等\nC. t₂℃时，a溶液的溶质质量分数一定比b溶液大\nD. 将t₂℃时a的饱和溶液降温到t₁℃，溶液变成不饱和溶液","answer":"答案：B\n解析：A错误，比较溶解度大小必须指明温度，不同温度下a、b溶解度大小不同。B正确，t₁℃时，a、b的溶解度曲线交于一点，说明该温度下两物质溶解度相等。C错误，没有说明溶液是否饱和，无法比较浓度。D错误，a的溶解度随温度升高而增大，降温后溶解度减小，饱和溶液会析出晶体，仍然是饱和溶液。"},{"id":"g3_chemistry_026_ex06","knowledge_id":"g3_chemistry_026","question":"填空题：结晶的方法有两种：对于溶解度受温度影响较大的物质，如硝酸钾，可用______的方法使溶质从溶液中结晶析出；对于溶解度受温度影响较小的物质，如氯化钠，可用______的方法使溶质从溶液中结晶析出。提纯含有少量氯化钠的硝酸钾，应采用______法；提纯含有少量硝酸钾的氯化钠，应采用______法。","answer":"答案：降温结晶（或冷却热饱和溶液），蒸发结晶，降温结晶，蒸发结晶\n解析：结晶方法选择：溶解度受温度影响大的用降温结晶（冷却热饱和溶液），如KNO₃；溶解度受温度影响小的用蒸发结晶，如NaCl。\n提纯KNO₃（含少量NaCl）：降温结晶，KNO₃大量析出，NaCl留在母液中。\n提纯NaCl（含少量KNO₃）：蒸发结晶，NaCl大量析出，KNO₃留在母液中。"},{"id":"g3_chemistry_026_ex07","knowledge_id":"g3_chemistry_026","question":"选择题：如图是a、b两种固体物质的溶解度曲线，下列说法正确的是（  ）\nA. a的溶解度大于b的溶解度\nB. t₁℃时，a、b两物质的饱和溶液中溶质的质量一定相等\nC. t₂℃时，a的饱和溶液降温至t₁℃，溶质质量分数不变\nD. 当a中混有少量b时，可用降温结晶的方法提纯a","answer":"答案：D\n解析：A错误，比较溶解度大小必须指明温度，不同温度下a、b溶解度大小不同。t₁℃以下b的溶解度大于a，t₁℃以上a的溶解度大于b。B错误，t₁℃时a、b溶解度相等，饱和溶液的溶质质量分数相等，但溶质质量还与溶液质量有关，没有说明溶液质量相等，溶质质量不一定相等。C错误，a的溶解度随温度升高而增大，降温后溶解度减小，饱和溶液会析出晶体，溶质质量减小，溶剂质量不变，溶质质量分数变小。D正确，a的溶解度受温度影响较大，b的溶解度受温度影响较小，所以当a中混有少量b时，可用降温结晶（冷却热饱和溶液）的方法提纯a。"},{"id":"g3_chemistry_026_ex08","knowledge_id":"g3_chemistry_026","question":"判断题：将某温度下的不饱和溶液变为饱和溶液，其溶质质量分数一定变大。（  ）","answer":"答案：错误\n解析：不饱和溶液变饱和溶液的方法有三种：增加溶质、蒸发溶剂、改变温度。前两种方法溶质质量分数会变大，但如果通过改变温度（降温，对于溶解度随温度升高而增大的物质）使溶液恰好饱和，则溶质质量分数不变，因为溶质和溶剂的质量都没有变。所以不一定变大。"},{"id":"g3_chemistry_026_ex09","knowledge_id":"g3_chemistry_026","question":"解答题：已知硝酸钾在不同温度下的溶解度如下表：\n温度/℃      0    20    40    60    80    100\n溶解度/g    13.3  31.6  63.9  110   169   246\n请回答：\n（1）60℃时，将100g硝酸钾放入100g水中，充分搅拌，所得溶液是饱和溶液还是不饱和溶液？溶液质量是多少克？\n（2）将上述溶液降温到20℃，会析出多少克晶体？\n（3）20℃时，硝酸钾饱和溶液中溶质的质量分数是多少？（结果精确到0.1%）","answer":"答案：（1）不饱和溶液，200g （2）68.4g （3）24.0%\n解析：\n（1）60℃时，硝酸钾的溶解度是110g，即100g水中最多溶解110g KNO₃。\n现在加入100g KNO₃，小于110g，所以全部溶解，形成不饱和溶液。\n溶液质量 = 100g（溶质） + 100g（溶剂）= 200g\n\n（2）降温到20℃时，硝酸钾的溶解度变为31.6g，即100g水中最多溶解31.6g KNO₃。\n析出晶体质量 = 100g - 31.6g = 68.4g\n\n（3）20℃时，饱和溶液溶质质量分数 = 溶解度/(100g+溶解度) × 100%\n= 31.6g/(100g+31.6g) × 100%\n= 31.6/131.6 × 100%\n≈ 24.0%"},{"id":"g3_chemistry_026_ex10","knowledge_id":"g3_chemistry_026","question":"选择题：t℃时，将一定量的某物质的不饱和溶液均分为三份，分别加热蒸发溶剂，然后把温度降至t℃。已知从三份溶液中蒸发的溶剂分别为10g、20g、30g，析出晶体（不含结晶水）分别为a g、b g、c g。则a、b、c三者的关系为（  ）\nA. c = 2b - a\nB. c = a + b\nC. c = a + 2b\nD. c = 2a + b","answer":"答案：A\n解析：由于原溶液是不饱和溶液，蒸发10g水析出a g晶体后，溶液变为饱和溶液。\n从饱和溶液中继续蒸发溶剂，析出晶体质量与蒸发溶剂质量成正比。\n从蒸发10g到蒸发20g，多蒸发了10g水，多析出(b - a)g晶体，说明饱和溶液中每蒸发10g水析出(b - a)g晶体。\n从蒸发20g到蒸发30g，又多蒸发了10g水，应该又多析出(b - a)g晶体。\n所以 c = b + (b - a) = 2b - a\n答案选A。"},{"id":"g3_chemistry_027_ex01","knowledge_id":"g3_chemistry_027","question":"选择题：将20g氯化钠完全溶于80g水中，所得溶液中溶质的质量分数为（  ）\nA. 20%\nB. 25%\nC. 15%\nD. 30%","answer":"答案：A\n解析：溶质质量分数 = 溶质质量/溶液质量 × 100%\n溶质质量 = 20g\n溶液质量 = 溶质质量 + 溶剂质量 = 20g + 80g = 100g\n溶质质量分数 = 20g/100g × 100% = 20%\n答案选A。"},{"id":"g3_chemistry_027_ex02","knowledge_id":"g3_chemistry_027","question":"填空题：配制一定溶质质量分数的氯化钠溶液，步骤是：①______，②______，③______，④装瓶贴标签。需要用到的仪器有托盘天平、______、______、______、______、细口瓶等。","answer":"答案：计算，称量，溶解，量筒，烧杯，玻璃棒，胶头滴管\n解析：配制一定质量分数溶液的步骤：计算（计算所需溶质和溶剂的质量）、称量（用天平称固体质量，用量筒量液体体积）、溶解（在烧杯中溶解，用玻璃棒搅拌）、装瓶贴标签。用到的仪器有：托盘天平、药匙、量筒、胶头滴管、烧杯、玻璃棒、细口瓶等。"},{"id":"g3_chemistry_027_ex03","knowledge_id":"g3_chemistry_027","question":"选择题：要使100g 10%的氯化钠溶液变成20%的氯化钠溶液，可采取的方法是（  ）\nA. 加入10g氯化钠\nB. 蒸发掉45g水\nC. 加入12.5g氯化钠\nD. 倒掉50g溶液","answer":"答案：C\n解析：原溶液中溶质质量 = 100g × 10% = 10g，溶剂质量 = 90g。\n\nA选项：加10g NaCl\n质量分数 = (10g+10g)/(100g+10g) × 100% = 20/110 × 100% ≈ 18.2%，不是20%。\n\nB选项：蒸发45g水\n质量分数 = 10g/(100g-45g) × 100% = 10/55 × 100% ≈ 18.2%，不是20%。\n\nC选项：加12.5g NaCl\n设需要加NaCl质量为x：\n(10g+x)/(100g+x) = 20%\n10+x = 0.2(100+x)\n10+x = 20+0.2x\n0.8x = 10\nx = 12.5g\n加入12.5g氯化钠后质量分数变为20%，正确。\n\nD选项：倒掉50g溶液，溶液具有均一性，剩余溶液质量分数仍为10%，不变。\n\n所以答案选C。"},{"id":"g3_chemistry_027_ex04","knowledge_id":"g3_chemistry_027","question":"判断题：从100g 20%的碳酸钠溶液中取出50g溶液，剩余溶液中溶质的质量分数变为10%。（  ）","answer":"答案：错误\n解析：溶液具有均一性，即溶液各部分的性质完全相同。从溶液中取出一部分，取出的溶液和剩余的溶液的溶质质量分数都与原溶液相同，仍然是20%。只有当改变溶质或溶剂的质量时，溶质质量分数才会改变。"},{"id":"g3_chemistry_027_ex05","knowledge_id":"g3_chemistry_027","question":"选择题：将100g质量分数为98%的浓硫酸稀释为质量分数为20%的稀硫酸，需要加水的质量为（  ）\nA. 390g\nB. 290g\nC. 490g\nD. 190g","answer":"答案：A\n解析：溶液稀释前后，溶质的质量不变。\n设稀释后溶液质量为x。\n100g × 98% = x × 20%\nx = 100g × 98% / 20% = 98g / 0.2 = 490g\n需要加水的质量 = 稀溶液质量 - 浓溶液质量 = 490g - 100g = 390g\n答案选A。"},{"id":"g3_chemistry_027_ex06","knowledge_id":"g3_chemistry_027","question":"填空题：已知20℃时氯化钠的溶解度为36g。则20℃时：\n（1）氯化钠饱和溶液中溶质、溶剂、溶液的质量比为______；\n（2）氯化钠饱和溶液中溶质的质量分数为______（精确到0.1%）；\n（3）100g水中最多能溶解______g氯化钠，形成______g饱和溶液。","answer":"答案：（1）9:25:34 （2）26.5% （3）36，136\n解析：20℃时NaCl溶解度为36g，即100g水中最多溶解36g NaCl。\n（1）溶质质量:溶剂质量:溶液质量 = 36g:100g:136g = 9:25:34\n（2）饱和溶液溶质质量分数 = 溶解度/(100g+溶解度) × 100%\n= 36g/136g × 100% ≈ 26.5%\n（3）100g水中最多溶解36g氯化钠，形成136g饱和溶液。"},{"id":"g3_chemistry_027_ex07","knowledge_id":"g3_chemistry_027","question":"选择题：某同学在配制50g质量分数为6%的氯化钠溶液的过程中，用量筒量取水时仰视读数，其他操作均正确。则他所配溶液中溶质的质量分数（  ）\nA. 大于6%\nB. 小于6%\nC. 等于6%\nD. 无法判断","answer":"答案：B\n解析：用量筒量取液体时，仰视读数会导致读数偏小，实际量取的水的体积偏大。溶剂质量偏大，溶质质量不变，则溶质质量分数偏小。俯视读数则相反，读数偏大，实际量取体积偏小，质量分数偏大。本题仰视读数，水多了，所以质量分数小于6%。"},{"id":"g3_chemistry_027_ex08","knowledge_id":"g3_chemistry_027","question":"判断题：在一定温度下，向一定量的饱和氯化钠溶液中加入少量硝酸钾，硝酸钾不能溶解。（  ）","answer":"答案：错误\n解析：饱和溶液是指在一定温度下、一定量溶剂里，不能再溶解某种溶质的溶液，叫做这种溶质的饱和溶液。但饱和溶液只是对某一种溶质饱和，对其他溶质可能还能溶解。氯化钠的饱和溶液只是不能再溶解氯化钠，但还可以溶解硝酸钾等其他溶质。"},{"id":"g3_chemistry_027_ex09","knowledge_id":"g3_chemistry_027","question":"解答题：为了测定某赤铁矿石中氧化铁的质量分数，取矿石样品20g，加入足量稀盐酸，完全反应后，共用去稀盐酸200g，过滤、洗涤、干燥后得滤渣4g（矿石中的杂质既不溶于水也不与盐酸反应）。请计算：\n（1）赤铁矿石中氧化铁的质量分数；\n（2）稀盐酸中溶质的质量分数。\n（相对原子质量：Fe-56，O-16，H-1，Cl-35.5）","answer":"答案：（1）80% （2）10.95%\n解析：\n（1）氧化铁能与稀盐酸反应，杂质不反应，所以滤渣就是杂质。\n氧化铁的质量 = 20g - 4g = 16g\n赤铁矿石中氧化铁的质量分数 = 16g/20g × 100% = 80%\n\n（2）设稀盐酸中溶质的质量为x。\nFe₂O₃ + 6HCl = 2FeCl₃ + 3H₂O\n 160    219\n 16g     x\n160/219 = 16g/x\nx = 219 × 16g / 160 = 21.9g\n稀盐酸中溶质的质量分数 = 21.9g/200g × 100% = 10.95%\n\n答：赤铁矿石中氧化铁的质量分数为80%，稀盐酸中溶质的质量分数为10.95%。"},{"id":"g3_chemistry_027_ex10","knowledge_id":"g3_chemistry_027","question":"选择题：现有100g 10%的硝酸钾溶液，若分别进行如下操作：①加入10g硝酸钾，全部溶解；②蒸发掉50g水，无晶体析出；③加入100g 10%的硝酸钾溶液；④加入10g水。操作后溶液的溶质质量分数由大到小的顺序是（  ）\nA. ①②③④\nB. ②①③④\nC. ②①④③\nD. ③②①④","answer":"答案：B\n解析：原溶液：溶质10g，溶液100g，质量分数10%。\n①加10g KNO₃：质量分数 = (10+10)/(100+10) = 20/110 ≈ 18.2%\n②蒸发50g水：质量分数 = 10/(100-50) = 10/50 = 20%\n③加100g 10%的溶液：质量分数不变，仍为10%（溶液具有均一性，同浓度混合不变）\n④加10g水：质量分数 = 10/(100+10) = 10/110 ≈ 9.1%\n由大到小：②(20%) > ①(18.2%) > ③(10%) > ④(9.1%)\n答案选B。"},{"id":"g3_chemistry_028_ex01","knowledge_id":"g3_chemistry_028","question":"选择题：实验室中常用浓硫酸作干燥剂，这是利用了浓硫酸的\nA. 脱水性\nB. 吸水性\nC. 强腐蚀性\nD. 酸性","answer":"答案：B\n解析：浓硫酸具有吸水性，能够吸收气体中的水分，因此常用作干燥剂。脱水性是指浓硫酸能将有机物中的氢、氧元素按水的组成比脱去，使有机物碳化。强腐蚀性和酸性与作干燥剂无关。例如，浓硫酸可以干燥O₂、H₂、CO₂等气体，但不能干燥NH₃等碱性气体。"},{"id":"g3_chemistry_028_ex02","knowledge_id":"g3_chemistry_028","question":"填空题：浓盐酸敞口放置在空气中，瓶口会出现______，这是因为浓盐酸具有______性，挥发出的______气体与空气中的______接触，形成盐酸小液滴。","answer":"答案：白雾，挥发，氯化氢（HCl），水蒸气\n解析：浓盐酸具有挥发性，敞口放置时，挥发出的HCl气体与空气中的水蒸气结合，形成盐酸小液滴，在瓶口呈现白雾状。因此浓盐酸必须密封保存，否则质量会减小，溶质质量分数会降低。"},{"id":"g3_chemistry_028_ex03","knowledge_id":"g3_chemistry_028","question":"选择题：下列物质中，属于碱的是\nA. 纯碱（Na₂CO₃）\nB. 烧碱（NaOH）\nC. 生石灰（CaO）\nD. 食盐（NaCl）","answer":"答案：B\n解析：碱是指电离时产生的阴离子全部是OH⁻的化合物。烧碱NaOH电离时产生Na⁺和OH⁻，属于碱。纯碱Na₂CO₃虽然俗称纯碱，但它是由金属离子和酸根离子构成的，属于盐。生石灰CaO是金属氧化物。食盐NaCl是盐。记住：纯碱不是碱，是盐。"},{"id":"g3_chemistry_028_ex04","knowledge_id":"g3_chemistry_028","question":"判断题：稀释浓硫酸时，应将水沿烧杯壁慢慢注入浓硫酸中，并用玻璃棒不断搅拌。（  ）","answer":"答案：错误\n解析：稀释浓硫酸时，一定要将浓硫酸沿器壁慢慢注入水中，并不断搅拌。切不可将水倒入浓硫酸中。因为浓硫酸密度比水大（约1.84 g/cm³），且溶于水时放出大量的热（98%的浓硫酸稀释时温度可超过100℃）。如果将水倒入浓硫酸中，水浮在浓硫酸上面，溶解时放出的热会使水立即沸腾，导致硫酸液滴向四周飞溅，非常危险。"},{"id":"g3_chemistry_028_ex05","knowledge_id":"g3_chemistry_028","question":"填空题：氢氧化钠俗名是______、______、______，它是一种______色固体，______溶于水，溶解时______（填\"吸收\"或\"放出\"）大量的热。氢氧化钠固体暴露在空气中容易吸收水分而______，因此可作某些气体的干燥剂。","answer":"答案：烧碱、火碱、苛性钠，白，极易，放出，潮解\n解析：NaOH有三个俗名：烧碱、火碱、苛性钠，反映了它的强腐蚀性。它是白色片状固体，极易溶于水（20℃时溶解度达109 g/100 g水），溶解时放出大量热。固体NaOH能吸收空气中的水蒸气而潮解，因此可作干燥剂，但不能干燥CO₂、SO₂、HCl等酸性气体。"},{"id":"g3_chemistry_028_ex06","knowledge_id":"g3_chemistry_028","question":"选择题：将一枚生锈的铁钉放入足量的稀盐酸中，首先观察到的现象是铁锈逐渐消失，溶液由无色变为黄色，过一段时间后，还会观察到有气泡产生。产生气泡的原因是\nA. 铁与盐酸反应生成氢气\nB. 氧化铁与盐酸反应生成氢气\nC. 盐酸挥发产生氯化氢气体\nD. 水受热蒸发产生水蒸气","answer":"答案：A\n解析：铁锈的主要成分是Fe₂O₃，它先与盐酸反应：Fe₂O₃ + 6HCl = 2FeCl₃ + 3H₂O，FeCl₃溶液呈黄色。当铁锈反应完后，里面的铁继续与盐酸反应：Fe + 2HCl = FeCl₂ + H₂↑，所以有气泡产生。这也是为什么用盐酸除铁锈时，不能将铁制品长时间浸泡在酸中的原因。"},{"id":"g3_chemistry_028_ex07","knowledge_id":"g3_chemistry_028","question":"解答题：小明在实验室发现一瓶氢氧化钠固体没有盖瓶塞，他想知道这瓶氢氧化钠是否变质。请你帮他设计一个实验方案来检验氢氧化钠是否变质，写出操作步骤、现象和结论。","answer":"答案：取少量样品于试管中，加入足量稀盐酸（或稀硫酸），如果有气泡产生，说明氢氧化钠已经变质；如果没有气泡产生，说明没有变质。（也可用氢氧化钙溶液、氯化钙溶液等检验）\n\n解析：氢氧化钠变质的原因是与空气中的CO₂反应：2NaOH + CO₂ = Na₂CO₃ + H₂O。检验是否变质就是检验是否有Na₂CO₃存在。\n\n方法一：加酸。Na₂CO₃ + 2HCl = 2NaCl + H₂O + CO₂↑，有气泡产生则变质。\n方法二：加碱。Na₂CO₃ + Ca(OH)₂ = CaCO₃↓ + 2NaOH，有白色沉淀则变质。\n方法三：加盐。Na₂CO₃ + CaCl₂ = CaCO₃↓ + 2NaCl，有白色沉淀则变质。"},{"id":"g3_chemistry_028_ex08","knowledge_id":"g3_chemistry_028","question":"选择题：下列关于氢氧化钙的说法中，错误的是\nA. 氢氧化钙俗名熟石灰或消石灰\nB. 氢氧化钙是一种微溶于水的白色粉末状固体\nC. 氢氧化钙的溶解度随温度升高而增大\nD. 氢氧化钙可用于改良酸性土壤","answer":"答案：C\n解析：氢氧化钙Ca(OH)₂俗名熟石灰、消石灰，是白色粉末，微溶于水（20℃时溶解度仅0.165 g/100 g水）。特殊的是，Ca(OH)₂的溶解度随温度升高而减小，这与大多数固体物质不同。氢氧化钙呈碱性，可用来改良酸性土壤，也是建筑材料（石灰浆）。"},{"id":"g3_chemistry_028_ex09","knowledge_id":"g3_chemistry_028","question":"判断题：酸具有相似的化学性质，是因为酸溶液中都含有氢离子（H⁺）；碱具有相似的化学性质，是因为碱溶液中都含有氢氧根离子（OH⁻）。（  ）","answer":"答案：正确\n解析：酸在水溶液中都能电离出H⁺，这是酸具有通性的原因。例如酸都能使紫色石蕊变红、能与活泼金属反应生成H₂、能与金属氧化物反应、能与碱发生中和反应等，本质上都是H⁺在起作用。碱在水溶液中都能电离出OH⁻，这是碱具有通性的原因。例如碱溶液都能使紫色石蕊变蓝、使无色酚酞变红、能与酸发生中和反应等，本质上都是OH⁻在起作用。"},{"id":"g3_chemistry_028_ex10","knowledge_id":"g3_chemistry_028","question":"填空题：将二氧化碳通入澄清石灰水中，观察到的现象是______，反应的化学方程式为______。如果继续通入过量的二氧化碳，会观察到的现象是______，这是因为生成了可溶于水的______（填化学式）。","answer":"答案：澄清石灰水变浑浊，CO₂ + Ca(OH)₂ = CaCO₃↓ + H₂O，浑浊又变澄清，Ca(HCO₃)₂\n解析：CO₂通入石灰水，生成不溶于水的CaCO₃白色沉淀，石灰水变浑浊。这是检验CO₂的经典方法。继续通过量CO₂，CaCO₃与CO₂和H₂O反应：CaCO₃ + CO₂ + H₂O = Ca(HCO₃)₂，生成可溶的碳酸氢钙，浑浊又变澄清。钟乳石、石笋的形成就与此原理有关。"},{"id":"g3_chemistry_029_ex01","knowledge_id":"g3_chemistry_029","question":"选择题：下列反应中，属于中和反应的是\nA. Zn + H₂SO₄ = ZnSO₄ + H₂↑\nB. CaO + H₂O = Ca(OH)₂\nC. HCl + NaOH = NaCl + H₂O\nD. Na₂CO₃ + 2HCl = 2NaCl + H₂O + CO₂↑","answer":"答案：C\n解析：中和反应是酸和碱作用生成盐和水的反应。判断中和反应要满足两个条件：反应物必须是酸和碱；生成物是盐和水。A是金属与酸的置换反应；B是化合反应；D是盐与酸的复分解反应。C中HCl是酸，NaOH是碱，反应生成NaCl（盐）和H₂O，属于中和反应。注意：生成盐和水的反应不一定是中和反应，如金属氧化物与酸、非金属氧化物与碱的反应都生成盐和水，但不是中和反应。"},{"id":"g3_chemistry_029_ex02","knowledge_id":"g3_chemistry_029","question":"填空题：中和反应的实质是酸中的______和碱中的______结合生成______的过程，其符号表达式为______。","answer":"答案：氢离子（H⁺），氢氧根离子（OH⁻），水（H₂O），H⁺ + OH⁻ = H₂O\n解析：中和反应的本质是H⁺和OH⁻结合生成水分子。不同的酸和碱发生中和反应，H⁺和OH⁻的作用是一样的，而金属离子和酸根离子只是作为旁观者存在于溶液中（或形成盐）。例如：HCl + NaOH = NaCl + H₂O 和 H₂SO₄ + 2KOH = K₂SO₄ + 2H₂O，本质都是H⁺ + OH⁻ = H₂O。"},{"id":"g3_chemistry_029_ex03","knowledge_id":"g3_chemistry_029","question":"选择题：某同学在做氢氧化钠溶液与稀盐酸中和反应实验时，忘记滴加指示剂。为了判断反应是否恰好完全进行，他取反应后的溶液少许于试管中，滴加几滴酚酞溶液，溶液不变色。下列说法正确的是\nA. 反应后溶液一定呈中性\nB. 反应后溶液一定呈酸性\nC. 反应后溶液可能呈酸性，也可能呈中性\nD. 反应后溶液一定呈碱性","answer":"答案：C\n解析：酚酞溶液在酸性和中性溶液中都不变色，只有在碱性溶液中才变红色。滴加酚酞后溶液不变色，说明溶液不显碱性，可能是恰好完全反应（中性，NaCl溶液），也可能是盐酸过量（酸性，NaCl和HCl混合溶液）。要进一步判断，可加入紫色石蕊（变红则酸过量，不变色则恰好反应）、锌粒（有气泡则酸过量）、碳酸钠（有气泡则酸过量）等。"},{"id":"g3_chemistry_029_ex04","knowledge_id":"g3_chemistry_029","question":"判断题：中和反应属于复分解反应，复分解反应也一定是中和反应。（  ）","answer":"答案：错误\n解析：中和反应是酸和碱之间发生的反应，属于复分解反应的一种。但复分解反应不一定是中和反应。复分解反应包括：酸 + 金属氧化物 → 盐 + 水、酸 + 碱 → 盐 + 水（中和反应）、酸 + 盐 → 新酸 + 新盐、碱 + 盐 → 新碱 + 新盐、盐 + 盐 → 两种新盐。中和反应只是复分解反应中的一类。复分解反应的范围比中和反应大。"},{"id":"g3_chemistry_029_ex05","knowledge_id":"g3_chemistry_029","question":"填空题：胃酸过多的病人常服用含氢氧化铝的药物来治疗，其反应的化学方程式为______。农业上常用______来改良酸性土壤，其原理是利用了______反应。","answer":"答案：Al(OH)₃ + 3HCl = AlCl₃ + 3H₂O，熟石灰（或氢氧化钙、Ca(OH)₂），中和\n解析：这是中和反应在生活中的两个重要应用。胃酸的主要成分是盐酸（HCl），Al(OH)₃是弱碱，能中和过多的胃酸：Al(OH)₃ + 3HCl = AlCl₃ + 3H₂O。改良酸性土壤用熟石灰Ca(OH)₂，利用中和反应原理，Ca(OH)₂与土壤中的酸发生中和反应，降低土壤酸性。注意：氢氧化钠碱性太强且价格高，不能用于改良酸性土壤。"},{"id":"g3_chemistry_029_ex06","knowledge_id":"g3_chemistry_029","question":"选择题：用溶质质量分数为10%的氢氧化钠溶液中和200 g稀盐酸，恰好完全反应时共消耗氢氧化钠溶液40 g。则稀盐酸中溶质的质量分数是（相对原子质量：H-1，O-16，Na-23，Cl-35.5）\nA. 1.825%\nB. 3.65%\nC. 7.3%\nD. 10%","answer":"答案：A\n解析：首先计算NaOH的质量：40 g × 10% = 4 g\n设稀盐酸中溶质HCl的质量为x\nNaOH + HCl = NaCl + H₂O\n 40    36.5\n 4 g    x\n40/36.5 = 4 g/x\nx = 3.65 g\n稀盐酸中溶质质量分数 = 3.65 g / 200 g × 100% = 1.825%\n答案选A。"},{"id":"g3_chemistry_029_ex07","knowledge_id":"g3_chemistry_029","question":"解答题：在做稀盐酸和氢氧化钠溶液中和反应的实验时，小敏同学先在烧杯中加入约20 mL氢氧化钠溶液，滴入几滴酚酞溶液，溶液变红。然后用胶头滴管慢慢滴加稀盐酸，并用玻璃棒不断搅拌。请回答：\n（1）为什么要用玻璃棒不断搅拌？\n（2）判断中和反应恰好完全进行的现象是什么？\n（3）如果不小心滴加稀盐酸过量，此时溶液呈什么性？溶液中的溶质有哪些（酚酞除外）？","answer":"答案：（1）搅拌是为了使盐酸和氢氧化钠溶液充分接触，加快反应速率，使反应更充分。\n（2）当溶液由红色恰好变成无色时，说明中和反应恰好完全进行。\n（3）盐酸过量时溶液呈酸性；溶液中的溶质有NaCl和HCl。\n\n解析：（1）在滴加盐酸的过程中，用玻璃棒搅拌可以使两种溶液充分混合，确保每一滴盐酸都能与NaOH充分反应，避免局部酸过量而整体还呈碱性的情况。\n（2）酚酞在碱性溶液中显红色，在中性和酸性溶液中无色。当红色恰好褪去时，说明NaOH刚好被完全中和。\n（3）盐酸过量时，HCl有剩余，溶液呈酸性。反应生成NaCl，加上过量的HCl，所以溶质是NaCl和HCl。"},{"id":"g3_chemistry_029_ex08","knowledge_id":"g3_chemistry_029","question":"选择题：下列做法中，利用中和反应原理的是\n①用生石灰作食品干燥剂  ②用熟石灰改良酸性土壤  ③用浓硫酸干燥氧气\n④用氢氧化钠溶液处理泄漏的浓硫酸  ⑤用小苏打治疗胃酸过多\nA. ①②③\nB. ②④\nC. ②③⑤\nD. ②④⑤","answer":"答案：B\n解析：判断是否利用中和反应，关键看反应物是不是酸和碱。\n①生石灰CaO作干燥剂：CaO + H₂O = Ca(OH)₂，化合反应，不是中和。\n②熟石灰改良酸性土壤：酸和碱的反应，是中和反应。\n③浓硫酸干燥氧气：利用吸水性，物理变化，不是中和反应。\n④NaOH溶液处理泄漏的浓硫酸：H₂SO₄ + 2NaOH = Na₂SO₄ + 2H₂O，酸和碱反应，是中和反应。\n⑤小苏打NaHCO₃治疗胃酸：NaHCO₃ + HCl = NaCl + H₂O + CO₂↑，盐和酸反应，不是中和反应。\n所以②④正确，选B。"},{"id":"g3_chemistry_029_ex09","knowledge_id":"g3_chemistry_029","question":"判断题：中和反应都没有明显的实验现象，因此必须借助指示剂才能判断反应是否发生。（  ）","answer":"答案：错误\n解析：有些中和反应有明显现象，不一定都要借助指示剂。例如：\n（1）难溶性碱与酸的反应，如Cu(OH)₂ + H₂SO₄ = CuSO₄ + 2H₂O，蓝色固体溶解，溶液变蓝色，现象明显。\n（2）有颜色变化的，如Fe(OH)₃ + 3HCl = FeCl₃ + 3H₂O，红褐色固体溶解，溶液变黄色。\n（3）反应放热明显的，如NaOH固体与盐酸反应，温度升高。\n只有像NaOH溶液与稀盐酸这样既没有沉淀、颜色变化，又没有明显气体产生的中和反应，才需要借助指示剂来判断反应的发生和恰好完全反应。"},{"id":"g3_chemistry_029_ex10","knowledge_id":"g3_chemistry_029","question":"填空题：将稀盐酸逐滴滴入到含有酚酞的氢氧化钠溶液中，溶液的pH逐渐______（填\"升高\"或\"降低\"）。当滴入稀盐酸的量恰好使溶液由红色变为无色时，溶液的pH______7（填\"大于\"\"等于\"或\"小于\"，下同）；继续滴加稀盐酸，溶液的pH______7。整个过程中，溶液温度的变化是______。","answer":"答案：降低，等于，小于，先升高后降低（或先升高，反应结束后逐渐恢复至室温）\n解析：NaOH溶液呈碱性（pH > 7），滴加盐酸时，盐酸与NaOH反应，碱性减弱，pH降低。恰好完全反应时，溶液呈中性（NaCl溶液），pH = 7。继续滴加盐酸，盐酸过量，溶液呈酸性，pH < 7。中和反应是放热反应，所以反应过程中溶液温度升高；反应结束后，不再放热，温度逐渐恢复到室温。"},{"id":"g3_chemistry_030_ex01","knowledge_id":"g3_chemistry_030","question":"选择题：下列物质中，不属于盐的是\nA. 氯化钠（NaCl）\nB. 碳酸钠（Na₂CO₃）\nC. 氢氧化钠（NaOH）\nD. 碳酸氢钠（NaHCO₃）","answer":"答案：C\n解析：盐是由金属离子（或铵根离子）和酸根离子构成的化合物。氯化钠NaCl由Na⁺和Cl⁻构成，碳酸钠Na₂CO₃由Na⁺和CO₃²⁻构成，碳酸氢钠NaHCO₃由Na⁺和HCO₃⁻构成，都属于盐。氢氧化钠NaOH由Na⁺和OH⁻构成，阴离子全部是OH⁻，属于碱。注意：盐的组成中不一定含有金属元素，如NH₄Cl、NH₄NO₃等铵盐也是盐，它们含有铵根离子NH₄⁺。"},{"id":"g3_chemistry_030_ex02","knowledge_id":"g3_chemistry_030","question":"填空题：氯化钠俗名是______，它是一种______色晶体，______溶于水，溶解度受温度变化影响______（填\"大\"或\"小\"）。氯化钠的用途很广，请列举两种：______、______。","answer":"答案：食盐，白，易，小，作调味品，腌制食品（或配制生理盐水、作化工原料、融雪剂等，任选两种即可）\n解析：NaCl就是食盐的主要成分，白色晶体，易溶于水（20℃溶解度约36 g/100 g水），其溶解度受温度影响小（从0℃到100℃，溶解度从35.7 g变到39.8 g），所以从海水中提取食盐常用蒸发结晶的方法。\n用途：①调味品，每人每天约需3-5 g食盐；②腌制食品，防腐；③医疗上配制生理盐水（0.9%的NaCl溶液）；④农业上用NaCl溶液选种；⑤工业上制碳酸钠、氢氧化钠、盐酸等；⑥道路融雪。"},{"id":"g3_chemistry_030_ex03","knowledge_id":"g3_chemistry_030","question":"选择题：碳酸钠俗称纯碱或苏打，下列关于碳酸钠的说法中，正确的是\nA. 碳酸钠是碱，其水溶液呈碱性\nB. 碳酸钠是盐，其水溶液呈中性\nC. 碳酸钠是盐，其水溶液呈碱性\nD. 碳酸钠是酸，其水溶液呈酸性","answer":"答案：C\n解析：碳酸钠Na₂CO₃是由金属离子Na⁺和酸根离子CO₃²⁻构成的，属于盐。但它的水溶液呈碱性，pH > 7，能使酚酞变红，所以俗称\"纯碱\"。这是初中化学中一个重要的特例：盐溶液不一定呈中性，有的呈碱性（如Na₂CO₃、NaHCO₃），有的呈酸性。纯碱\"不是碱\"，是盐，但它的水溶液呈碱性。"},{"id":"g3_chemistry_030_ex04","knowledge_id":"g3_chemistry_030","question":"判断题：碳酸氢钠俗称小苏打，它受热易分解，可用于焙制糕点，也可用于治疗胃酸过多。（  ）","answer":"答案：正确\n解析：碳酸氢钠NaHCO₃，俗名小苏打，是白色粉末，能溶于水。两个重要性质：\n（1）受热易分解：2NaHCO₃ △ Na₂CO₃ + H₂O + CO₂↑，焙制糕点时，产生的CO₂气体使糕点疏松多孔。\n（2）能与酸反应：NaHCO₃ + HCl = NaCl + H₂O + CO₂↑，可治疗胃酸过多。注意：NaHCO₃与胃酸反应产生CO₂，会使胃内气压增大，胃溃疡病人慎用。"},{"id":"g3_chemistry_030_ex05","knowledge_id":"g3_chemistry_030","question":"填空题：碳酸钙是大理石、石灰石的主要成分，化学式为______，它是一种______色固体，______溶于水。碳酸钙的用途有：______（作建筑材料）、______（作补钙剂）。实验室制取二氧化碳的反应原理（化学方程式）：______。","answer":"答案：CaCO₃，白，难，大理石/石灰石，碳酸钙钙片，CaCO₃ + 2HCl = CaCl₂ + H₂O + CO₂↑\n解析：CaCO₃是白色难溶固体，是大理石、石灰石的主要成分。\n用途：①建筑材料，如大理石做台面、石灰石烧制生石灰等；②补钙剂，碳酸钙能与胃酸反应生成可被人体吸收的Ca²⁺：CaCO₃ + 2HCl = CaCl₂ + H₂O + CO₂↑；③工业上煅烧石灰石制生石灰：CaCO₃ 高温 CaO + CO₂↑。\n实验室制CO₂用大理石或石灰石与稀盐酸反应。"},{"id":"g3_chemistry_030_ex06","knowledge_id":"g3_chemistry_030","question":"选择题：下列各组物质中，能在同一溶液中大量共存的是\nA. NaOH、HNO₃、NaCl\nB. Na₂CO₃、HCl、CaCl₂\nC. KNO₃、NaCl、NaOH\nD. AgNO₃、HNO₃、MgCl₂","answer":"答案：C\n解析：判断物质能否共存，就是看组内物质能否发生复分解反应（生成沉淀、气体或水）。\nA中NaOH和HNO₃反应：NaOH + HNO₃ = NaNO₃ + H₂O，生成水，不能共存。\nB中Na₂CO₃与HCl反应生成CO₂气体，Na₂CO₃与CaCl₂反应生成CaCO₃沉淀，不能共存。\nC中三种物质之间相互都不反应，可以共存。\nD中AgNO₃与MgCl₂反应：2AgNO₃ + MgCl₂ = 2AgCl↓ + Mg(NO₃)₂，生成AgCl白色沉淀，不能共存。\n所以选C。"},{"id":"g3_chemistry_030_ex07","knowledge_id":"g3_chemistry_030","question":"解答题：有一包白色粉末，可能含有碳酸钠、硫酸钠、氯化钠、硫酸铜、硝酸钡中的一种或几种。为确定其组成，进行如下实验：\n①取少量白色粉末，加足量水溶解，过滤，得到白色沉淀和无色滤液。\n②向白色沉淀中加入足量稀硝酸，沉淀部分溶解，并有气泡产生。\n③向无色滤液中加入硝酸银溶液，有白色沉淀生成，再加稀硝酸，沉淀不溶解。\n请分析：\n（1）白色粉末中一定含有什么物质？\n（2）一定不含有什么物质？\n（3）可能含有什么物质？\n（4）为确定可能含有的物质是否存在，应如何改进实验？","answer":"答案：（1）一定含有：碳酸钠（Na₂CO₃）、硫酸钠（Na₂SO₄）、硝酸钡（Ba(NO₃)₂）\n（2）一定不含有：硫酸铜（CuSO₄）\n（3）可能含有：氯化钠（NaCl）\n（4）将步骤②中的稀硝酸换成稀盐酸，或在步骤①中加入足量的Ba(NO₃)₂溶液后再检验Cl⁻。\n\n解析：①白色粉末加足量水溶解，得白色沉淀和无色滤液。无色滤液说明没有CuSO₄（CuSO₄溶液呈蓝色）。白色沉淀可能是BaCO₃或BaSO₄或两者混合物，说明粉末中含有Ba(NO₃)₂。\n②白色沉淀加足量稀硝酸，部分溶解且有气泡。溶解的是BaCO₃（产生CO₂气泡），不溶解的是BaSO₄，说明沉淀是BaCO₃和BaSO₄的混合物，因此原粉末中既有Na₂CO₃又有Na₂SO₄。\n③滤液加AgNO₃有不溶于稀硝酸的白色沉淀，说明有Cl⁻。但这个Cl⁻可能来自原粉末中的NaCl，也可能来自步骤②中加入的稀盐酸（如果用了盐酸）。本题中用的是稀硝酸，所以Cl⁻来自哪里呢？实际上，由于Na₂CO₃和Na₂SO₄与Ba(NO₃)₂反应都生成硝酸盐和BaCO₃/BaSO₄，滤液中本身没有Cl⁻，所以③中检测出的Cl⁻应该来自原粉末中的NaCl。但严格来说，为了排除干扰，应该先加Ba(NO₃)₂除去SO₄²⁻和CO₃²⁻，再用AgNO₃检验Cl⁻。"},{"id":"g3_chemistry_030_ex08","knowledge_id":"g3_chemistry_030","question":"选择题：下列复分解反应不能发生的是\nA. NaOH + HCl = NaCl + H₂O\nB. Na₂CO₃ + H₂SO₄ = Na₂SO₄ + H₂O + CO₂↑\nC. NaCl + KNO₃ = NaNO₃ + KCl\nD. CuSO₄ + 2NaOH = Cu(OH)₂↓ + Na₂SO₄","answer":"答案：C\n解析：复分解反应发生的条件：两种化合物互相交换成分，生成物中有沉淀、气体或水生成。\nA生成水，能发生；B生成CO₂气体和水，能发生；D生成Cu(OH)₂沉淀，能发生。C中NaCl和KNO₃交换成分得到NaNO₃和KCl，都是可溶的，没有沉淀、气体或水生成，所以反应不能发生。因此选C。记住：钾盐、钠盐、铵盐、硝酸盐都可溶，所以KNO₃和NaNO₃一般不参与复分解反应。"},{"id":"g3_chemistry_030_ex09","knowledge_id":"g3_chemistry_030","question":"判断题：粗盐提纯的实验步骤是：溶解、过滤、蒸发。在这三步操作中都要用到玻璃棒，玻璃棒的作用相同。（  ）","answer":"答案：错误\n解析：粗盐提纯三步：溶解、过滤、蒸发，每步都用玻璃棒，但作用不同：\n（1）溶解时：搅拌，加快溶解速率。\n（2）过滤时：引流，使液体沿玻璃棒流入漏斗，防止液体洒出。\n（3）蒸发时：搅拌，使液体受热均匀，防止局部温度过高造成液滴飞溅。\n三步中玻璃棒的作用各不相同，不能混淆。"},{"id":"g3_chemistry_030_ex10","knowledge_id":"g3_chemistry_030","question":"填空题：侯氏制碱法（联合制碱法）中的\"碱\"指的是______（填物质名称），其化学式为______。侯氏制碱法的发明者是我国化学家______。该方法以______、______、______（填化学式）等为原料，不仅制得纯碱，还得到一种氮肥______（填化学式），大大提高了原料利用率。","answer":"答案：碳酸钠（纯碱），Na₂CO₃，侯德榜，NaCl，NH₃，CO₂，NH₄Cl\n解析：侯氏制碱法又称联合制碱法，是我国化学家侯德榜在1926年发明的。原料是食盐（NaCl）、氨气（NH₃）、二氧化碳（CO₂）和水。先向饱和食盐水中通入NH₃，再通入CO₂，析出NaHCO₃：NaCl + NH₃ + CO₂ + H₂O = NaHCO₃↓ + NH₄Cl。将NaHCO₃加热分解得到Na₂CO₃：2NaHCO₃ △ Na₂CO₃ + H₂O + CO₂↑。滤液中含有NH₄Cl，是一种氮肥。侯氏制碱法的优点是将制碱和制氨联合起来，既得到纯碱又得到氮肥NH₄Cl，提高了食盐利用率，降低了成本。"},{"id":"g3_chemistry_031_ex01","knowledge_id":"g3_chemistry_031","question":"选择题：下列化肥中，属于氮肥的是\nA. K₂SO₄\nB. Ca(H₂PO₄)₂\nC. NH₄NO₃\nD. K₂CO₃","answer":"答案：C\n解析：化学肥料根据所含营养元素可分为氮肥、磷肥、钾肥、复合肥。只含有氮元素的肥料叫氮肥，只含有磷元素的叫磷肥，只含有钾元素的叫钾肥，同时含有N、P、K中两种或两种以上营养元素的叫复合肥。\nA. K₂SO₄含钾元素，是钾肥；\nB. Ca(H₂PO₄)₂含磷元素，是磷肥；\nC. NH₄NO₃含氮元素，是氮肥；\nD. K₂CO₃含钾元素，是钾肥。\n所以选C。"},{"id":"g3_chemistry_031_ex02","knowledge_id":"g3_chemistry_031","question":"填空题：农作物生长必需的营养元素有很多，其中需要量较大的三种元素是______、______、______（填元素符号）。因此化学肥料主要包括______肥、______肥、______肥和______肥。","answer":"答案：N，P，K，氮，磷，钾，复合\n解析：植物生长需要多种营养元素，包括C、H、O、N、P、K、Ca、Mg、S等。其中N、P、K需要量较大，土壤中常缺乏，因此氮肥、磷肥、钾肥是最主要的化学肥料。氮肥促进植物茎、叶生长茂盛，叶色浓绿；磷肥促进根系发达，增强抗寒抗旱能力，使作物穗粒增多、籽粒饱满；钾肥促进茎秆健壮，增强抗病虫害和抗倒伏能力，促进淀粉和糖分的生成。复合肥同时含有两种或以上营养元素，如KNO₃、NH₄H₂PO₄等。"},{"id":"g3_chemistry_031_ex03","knowledge_id":"g3_chemistry_031","question":"选择题：小明家种植的小麦出现了植株矮小、叶片发黄的现象，而且茎秆细弱，容易倒伏。根据所学知识，你认为小明应该施加的化肥是\nA. 尿素 CO(NH₂)₂\nB. 磷矿粉 Ca₃(PO₄)₂\nC. 氯化钾 KCl\nD. 硝酸钾 KNO₃","answer":"答案：D\n解析：植株矮小、叶片发黄是缺氮元素的表现（氮肥使叶色浓绿），茎秆细弱、容易倒伏是缺钾元素的表现（钾肥使茎秆健壮，抗倒伏）。所以需要同时补充氮和钾，应选含N和K的复合肥。\nA. 尿素只含N，是氮肥；\nB. 磷矿粉只含P，是磷肥；\nC. 氯化钾只含K，是钾肥；\nD. 硝酸钾含N和K，是复合肥，同时补充氮和钾，符合题意。\n所以选D。"},{"id":"g3_chemistry_031_ex04","knowledge_id":"g3_chemistry_031","question":"判断题：铵态氮肥不能与碱性物质混合施用，否则会降低肥效。（  ）","answer":"答案：正确\n解析：铵态氮肥是指含有铵根离子NH₄⁺的氮肥，如NH₄Cl、NH₄NO₃、(NH₄)₂SO₄、NH₄HCO₃等。铵态氮肥能与碱性物质反应，放出氨气（NH₃），使肥效降低（因为N元素以NH₃形式散失了）。例如：2NH₄Cl + Ca(OH)₂ = CaCl₂ + 2H₂O + 2NH₃↑。因此铵态氮肥不能与熟石灰、草木灰（主要成分K₂CO₃，水溶液呈碱性）等碱性物质混合施用。"},{"id":"g3_chemistry_031_ex05","knowledge_id":"g3_chemistry_031","question":"填空题：常见的氮肥有尿素（化学式______）、硝酸铵（______）、碳酸氢铵（______）、氯化铵（______）等。其中含氮量最高的氮肥是______，其含氮量为______（写出计算过程和结果，保留一位小数）。","answer":"答案：CO(NH₂)₂，NH₄NO₃，NH₄HCO₃，NH₄Cl，尿素，46.7%\n解析：\n尿素CO(NH₂)₂的相对分子质量 = 12 + 16 + (14 + 1×2)×2 = 60\n尿素中氮元素的质量分数 = (14×2)/60 × 100% = 28/60 × 100% ≈ 46.7%\n\nNH₄NO₃的相对分子质量 = 14 + 1×4 + 14 + 16×3 = 80\nNH₄NO₃中氮元素质量分数 = 28/80 × 100% = 35%\n\nNH₄HCO₃的相对分子质量 = 14 + 1×5 + 12 + 16×3 = 79\nNH₄HCO₃中氮元素质量分数 = 14/79 × 100% ≈ 17.7%\n\nNH₄Cl的相对分子质量 = 14 + 1×4 + 35.5 = 53.5\nNH₄Cl中氮元素质量分数 = 14/53.5 × 100% ≈ 26.2%\n所以含氮量最高的是尿素，约46.7%。"},{"id":"g3_chemistry_031_ex06","knowledge_id":"g3_chemistry_031","question":"选择题：下列关于化肥的说法中，正确的是\nA. 化肥能提高农作物产量，施用越多越好\nB. 尿素CO(NH₂)₂是一种复合肥\nC. 氯化铵与熟石灰混合施用，既可以增加肥效，又可以改良酸性土壤\nD. 化肥和农药的不合理施用，会造成环境污染，要合理施用","answer":"答案：D\n解析：A错，化肥不是施用越多越好，过量施用会造成土壤酸化、板结，还会造成水体富营养化（水华、赤潮），污染环境，要合理施用。\nB错，尿素只含N元素，是氮肥，不是复合肥（复合肥要含两种或以上营养元素）。\nC错，氯化铵是铵态氮肥，与熟石灰（碱性）混合会反应放出NH₃，降低肥效。\nD对，化肥和农药对提高农作物产量有重要作用，但不合理施用会造成环境污染，因此要合理施用化肥和农药。同时提倡施用农家肥，与化肥配合施用。"},{"id":"g3_chemistry_031_ex07","knowledge_id":"g3_chemistry_031","question":"解答题：实验室有三瓶失去标签的化肥，分别是氯化铵(NH₄)₂SO₄、氯化钾KCl和磷矿粉Ca₃(PO₄)₂。请设计一个实验方案将它们区分开来，写出操作步骤、现象和结论。","answer":"答案：方法一：\n第一步：观察颜色和溶解性。灰白色、不溶于水的是磷矿粉；白色晶体、易溶于水的是氯化铵和氯化钾。\n第二步：取剩余两种白色固体少量，分别与熟石灰混合研磨，有刺激性气味气体产生的是氯化铵，没有明显现象的是氯化钾。\n\n方法二：\n第一步：加熟石灰研磨。有刺激性气味产生的是氯化铵。\n第二步：观察另外两种，灰白色的是磷矿粉，白色的是氯化钾。\n\n解析：区分化肥常用的方法：\n（1）看外观：氮肥、钾肥一般是白色晶体，磷肥是灰白色粉末。\n（2）加水：氮肥、钾肥都易溶于水，磷肥大多不溶于水或部分溶于水。\n（3）加熟石灰研磨（加碱性物质）：铵态氮肥有刺激性气味（NH₃），钾肥无气味。\n本题中，磷矿粉是磷肥，灰白色、难溶，可先鉴别出来。氯化铵是铵态氮肥，与碱反应放氨气，有刺激性气味。氯化钾与碱不反应。"},{"id":"g3_chemistry_031_ex08","knowledge_id":"g3_chemistry_031","question":"选择题：下列化肥中，属于复合肥料的是\n①KNO₃  ②NH₄H₂PO₄  ③CO(NH₂)₂  ④K₂SO₄  ⑤KH₂PO₄  ⑥Ca(H₂PO₄)₂\nA. ①②③\nB. ①②⑤\nC. ②③⑤⑥\nD. ①③⑤","answer":"答案：B\n解析：复合肥是指同时含有N、P、K三种营养元素中的两种或两种以上的化肥。\n①KNO₃含有K和N，是复合肥；\n②NH₄H₂PO₄含有N和P，是复合肥；\n③CO(NH₂)₂只含N，是氮肥；\n④K₂SO₄只含K，是钾肥；\n⑤KH₂PO₄含有K和P，是复合肥；\n⑥Ca(H₂PO₄)₂只含P，是磷肥。\n所以①②⑤是复合肥，选B。"},{"id":"g3_chemistry_031_ex09","knowledge_id":"g3_chemistry_031","question":"判断题：碳酸氢铵（NH₄HCO₃）不稳定，受热易分解，所以保存时要密封，放在阴凉干燥处，施用时要盖土或立即灌溉，避免在烈日下施用。（  ）","answer":"答案：正确\n解析：碳酸氢铵NH₄HCO₃，俗称碳铵，是一种常用的氮肥。它不稳定，受热易分解：NH₄HCO₃ △ NH₃↑ + H₂O + CO₂↑，放出氨气，降低肥效。因此保存碳铵时要密封包装，放在阴凉干燥处，避免高温。施用时最好深施盖土，或施后立即浇水，防止NH₃挥发损失。碳铵分解产生的CO₂还能被植物光合作用利用，因此碳铵是一种不残留有害物质的氮肥。"},{"id":"g3_chemistry_031_ex10","knowledge_id":"g3_chemistry_031","question":"填空题：某农场需要购买100 kg尿素[CO(NH₂)₂]用作氮肥，由于缺货，改用硝酸铵（NH₄NO₃）。要达到同样的施肥效果（即氮元素质量相等），需要购买硝酸铵的质量是______kg。（相对原子质量：C-12，O-16，N-14，H-1）","answer":"答案：133.3\n解析：施肥效果相同即氮元素质量相等。\n第一步：计算100 kg尿素中氮元素的质量。\n尿素CO(NH₂)₂的相对分子质量 = 12 + 16 + (14 + 2)×2 = 60\n尿素中氮元素质量分数 = 28/60 × 100%\n100 kg尿素中氮元素质量 = 100 kg × 28/60 = 46.67 kg\n\n第二步：设需要硝酸铵的质量为x。\n硝酸铵NH₄NO₃的相对分子质量 = 14 + 4 + 14 + 48 = 80\n硝酸铵中氮元素质量分数 = 28/80 × 100% = 35%\nx × 35% = 46.67 kg\nx = 46.67 kg / 35% = 133.3 kg\n所以需要购买硝酸铵约133.3 kg。\n\n也可以用关系式法：设需要NH₄NO₃质量为x\nCO(NH₂)₂ ~ 2N ~ NH₄NO₃\n    60                  80\n   100 kg               x\n60/80 = 100 kg/x\nx = 133.3 kg"},{"id":"g3_chemistry_032_ex01","knowledge_id":"g3_chemistry_032","question":"选择题：下列食物中，富含蛋白质的是\nA. 米饭、馒头\nB. 鱼、鸡蛋\nC. 蔬菜、水果\nD. 花生油、肥肉","answer":"答案：B\n解析：人类重要的六大营养素是：蛋白质、糖类、油脂、维生素、无机盐和水。\nA. 米饭、馒头富含淀粉，淀粉属于糖类；\nB. 鱼、鸡蛋、瘦肉、牛奶、豆类等富含蛋白质；\nC. 蔬菜、水果富含维生素；\nD. 花生油、肥肉、奶油等富含油脂。\n所以选B。"},{"id":"g3_chemistry_032_ex02","knowledge_id":"g3_chemistry_032","question":"填空题：人体必需的六大营养素是______、______、______、______、______和水。其中能为人体提供能量的三种营养素是______、______、______。等质量的三种营养素中，______放出的能量最多。","answer":"答案：蛋白质，糖类，油脂，维生素，无机盐，蛋白质，糖类，油脂，油脂\n解析：六大营养素：蛋白质、糖类、油脂、维生素、无机盐、水。其中能提供能量的是蛋白质、糖类和油脂，这三种被称为\"三大供能物质\"。维生素、无机盐和水不能提供能量。\n每克蛋白质完全氧化约放出18 kJ能量，每克葡萄糖约放出16 kJ，每克油脂约放出39 kJ。等质量时，油脂放出的能量最多，是重要的储能物质。糖类是人体最主要的供能物质，人体所需能量的60%~70%来自糖类。"},{"id":"g3_chemistry_032_ex03","knowledge_id":"g3_chemistry_032","question":"选择题：下列关于蛋白质的说法中，错误的是\nA. 蛋白质是构成细胞的基本物质，是机体生长和修补受损组织的主要原料\nB. 血红蛋白在人体内起着运输氧气和二氧化碳的作用\nC. 酶是一类重要的蛋白质，是生物催化剂，能催化生物体内的反应\nD. 甲醛能使蛋白质变性，因此可用甲醛水溶液浸泡水产品保鲜","answer":"答案：D\n解析：A正确，蛋白质是构成细胞的基本物质，机体生长、修补受损组织都需要蛋白质。\nB正确，血红蛋白是蛋白质的一种，它能与O₂结合，随血液流遍全身，同时运输CO₂。煤气中毒就是因为CO与血红蛋白的结合能力比O₂强（约200~300倍），使血红蛋白失去携氧能力。\nC正确，酶是生物催化剂，一种酶只能催化一种反应，具有专一性和高效性，且在体温和接近中性的条件下才能很好发挥作用。\nD错误，甲醛（福尔马林）能使蛋白质变性，这是它能防腐的原因，但甲醛有毒，会破坏人体蛋白质，危害健康，绝对不能用甲醛浸泡水产品。用甲醛浸泡水产品是违法行为。"},{"id":"g3_chemistry_032_ex04","knowledge_id":"g3_chemistry_032","question":"判断题：淀粉属于糖类，它在人体内直接被吸收，为人体提供能量。（  ）","answer":"答案：错误\n解析：淀粉是糖类的一种，但淀粉是大分子的多糖（化学式(C₆H₁₀O₅)ₙ），不能直接被人体吸收。淀粉在口腔中被唾液淀粉酶初步消化为麦芽糖，在小肠中最终被消化为葡萄糖（C₆H₁₂O₆），葡萄糖才能被人体吸收进入血液，通过血液循环送到全身各组织细胞，氧化分解释放能量。反应式：C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O，释放能量。所以淀粉必须先消化为葡萄糖才能被吸收利用。"},{"id":"g3_chemistry_032_ex05","knowledge_id":"g3_chemistry_032","question":"填空题：维生素有20多种，它们多数在人体内不能合成，需要从食物中摄取。人体缺乏维生素A会引起______，缺乏维生素C会引起______，缺乏维生素D会影响______的吸收，导致______。富含维生素的食物主要有______和______。","answer":"答案：夜盲症，坏血病，钙，骨质疏松（或佝偻病），蔬菜，水果\n解析：维生素在人体内需要量很小（每天以毫克或微克计），但作用很大，能调节新陈代谢、预防疾病、维持身体健康。\n缺乏维生素A：夜盲症、皮肤干燥。\n缺乏维生素B₁：脚气病。\n缺乏维生素C：坏血病（牙龈出血、抵抗力下降）。\n缺乏维生素D：影响钙的吸收，儿童易得佝偻病，老人易得骨质疏松症。\n维生素主要存在于蔬菜、水果、种子食物、动物肝脏等中。注意：维生素多数不能在体内合成，必须从食物中摄取，但维生素D可以在人体内合成（晒太阳有助于合成维生素D）。"},{"id":"g3_chemistry_032_ex06","knowledge_id":"g3_chemistry_032","question":"选择题：某同学午餐食谱如下：米饭、红烧肉、清蒸鱼、豆腐汤。从营养均衡的角度考虑，你认为该食谱中还缺少的营养素是\nA. 蛋白质\nB. 糖类\nC. 维生素\nD. 油脂","answer":"答案：C\n解析：米饭主要提供糖类（淀粉）；红烧肉提供蛋白质和油脂；清蒸鱼提供蛋白质；豆腐汤提供蛋白质、水和无机盐。食谱中缺乏蔬菜和水果，因此缺少维生素。合理膳食要求营养均衡，应该荤素搭配，还应补充蔬菜或水果来提供维生素。所以选C。"},{"id":"g3_chemistry_032_ex07","knowledge_id":"g3_chemistry_032","question":"解答题：某食品包装上的配料表如下：小麦粉、白砂糖、精炼植物油、鸡蛋、食盐、食用香精、碳酸氢钠、维生素D。请分析回答：\n（1）配料中富含蛋白质的是______。\n（2）配料中富含糖类的是______。\n（3）配料中富含油脂的是______。\n（4）配料中富含无机盐的是______。\n（5）配料中能提供维生素的是______。\n（6）碳酸氢钠的作用是什么？","answer":"答案：（1）鸡蛋\n（2）小麦粉、白砂糖\n（3）精炼植物油\n（4）食盐（氯化钠）\n（5）维生素D\n（6）碳酸氢钠是发酵粉的主要成分，受热或与酸反应产生CO₂气体，使食品疏松多孔。\n\n解析：分析各配料中的主要营养素：\n- 小麦粉：主要含淀粉，属于糖类；\n- 白砂糖：蔗糖，属于糖类；\n- 精炼植物油：油脂；\n- 鸡蛋：富含蛋白质；\n- 食盐：NaCl，无机盐；\n- 食用香精：改善食品味道，不属于六大营养素；\n- 碳酸氢钠：NaHCO₃，俗称小苏打，是食品膨松剂，受热分解：2NaHCO₃ △ Na₂CO₃ + H₂O + CO₂↑，产生CO₂使食品疏松。也可与发酵产生的酸反应产生CO₂。\n- 维生素D：维生素。"},{"id":"g3_chemistry_032_ex08","knowledge_id":"g3_chemistry_032","question":"选择题：下列说法中，正确的是\nA. 油脂是重要的营养物质，摄入量越多越好\nB. 人体所需的能量全部由糖类提供\nC. 用甲醛水溶液浸泡过的海产品，口感好，可以放心食用\nD. 人体摄入糖类不足时，会消耗体内脂肪来提供能量，人就会消瘦","answer":"答案：D\n解析：A错，油脂是重要营养物质，但摄入过多会引起肥胖、心血管疾病等，应适量摄入，不是越多越好。\nB错，人体所需能量主要由糖类提供（约60%~70%），但不是全部，还有部分由蛋白质和油脂提供。\nC错，甲醛有毒，能破坏人体蛋白质结构，危害健康，绝对不能食用甲醛浸泡过的食品。\nD对，糖类是主要供能物质，当摄入糖类不足时，人体会消耗脂肪来提供能量，脂肪储备减少，人就会消瘦。当糖类和脂肪都不足时，还会消耗蛋白质来供能。"},{"id":"g3_chemistry_032_ex09","knowledge_id":"g3_chemistry_032","question":"判断题：纤维素也是糖类的一种，它不能被人体消化吸收，因此对人体没有任何作用。（  ）","answer":"答案：错误\n解析：纤维素确实是糖类（多糖，化学式也是(C₆H₁₀O₅)ₙ），人体中没有能消化纤维素的酶，所以纤维素不能被人体消化吸收，不能提供能量。但是纤维素对人体有重要作用：它能促进肠道蠕动，帮助消化，预防便秘，减少大肠癌的发生，还能降低血脂和血糖。因此，纤维素被称为\"第七营养素\"。蔬菜、水果、粗粮等富含膳食纤维。所以不能说纤维素对人体没有作用。"},{"id":"g3_chemistry_032_ex10","knowledge_id":"g3_chemistry_032","question":"填空题：葡萄糖的化学式为______，它在人体内缓慢氧化，放出能量，反应的化学方程式为______。每克葡萄糖完全氧化约放出______kJ的能量。一个成年人每天大约需要消耗______kJ的能量，如果这些能量全部由葡萄糖提供，则每天大约需要葡萄糖______g（保留整数）。","answer":"答案：C₆H₁₂O₆，C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O，16，10000（约数，合理即可），625\n解析：葡萄糖C₆H₁₂O₆是人体重要的供能物质，在酶的催化作用下与O₂反应，生成CO₂和H₂O，同时释放能量。\n反应方程式：C₆H₁₂O₆ + 6O₂ →(酶) 6CO₂ + 6H₂O\n每克葡萄糖完全氧化约放出16 kJ能量。\n一个成年人每天消耗的能量约为10000 kJ（因年龄、体重、活动量不同而不同，一般在8400~12600 kJ之间）。\n若全部由葡萄糖提供，则需要葡萄糖质量 = 10000 kJ / 16 kJ/g = 625 g。\n实际上，人体所需能量大部分来自糖类（约占60%~70%），其余由脂肪和蛋白质提供。"},{"id":"g3_chemistry_033_ex01","knowledge_id":"g3_chemistry_033","question":"选择题：人体中含量最多的金属元素是\nA. 铁\nB. 钙\nC. 锌\nD. 碘","answer":"答案：B\n解析：人体中含有50多种元素，含量较多的有11种，约占人体质量的99.95%。其中含量最多的元素是氧（O，约占65%），含量最多的金属元素是钙（Ca，约占2%）。钙主要存在于骨骼和牙齿中，使骨骼和牙齿具有坚硬的结构支架。铁是人体必需的微量元素，是血红蛋白的成分；锌影响人体发育；碘是甲状腺激素的重要成分。所以选B。"},{"id":"g3_chemistry_033_ex02","knowledge_id":"g3_chemistry_033","question":"填空题：人体中的化学元素按含量多少可分为______元素和______元素。其中含量超过______%的称为常量元素，共______种，分别是氧、碳、氢、______、钙、磷、钾、硫、钠、氯、镁。含量在______%以下的称为微量元素，如铁、锌、硒、碘、氟等，这些元素主要以______的形式存在于人体内。","answer":"答案：常量，微量，0.01，11，氮，0.01，无机盐\n解析：人体中约有50多种元素，根据含量分为常量元素和微量元素。\n常量元素：含量在0.01%以上，共11种，包括O、C、H、N、Ca、P、K、S、Na、Cl、Mg。这11种元素约占人体质量的99.95%。\n微量元素：含量在0.01%以下，如铁Fe、锌Zn、硒Se、碘I、氟F、铜Cu等。微量元素虽然含量少，但对人体健康的影响很大，它们能够调节新陈代谢，预防疾病，维持身体健康。\n这些元素在人体内主要以无机盐的形式存在。"},{"id":"g3_chemistry_033_ex03","knowledge_id":"g3_chemistry_033","question":"选择题：人体缺少某些元素会影响健康，甚至引起疾病。下列说法中错误的是\nA. 缺铁会引起贫血\nB. 缺碘会引起甲状腺肿大\nC. 缺锌会引起食欲不振，生长迟缓，发育不良\nD. 缺氟会引起表皮角质化和癌症","answer":"答案：D\n解析：\nA正确，铁是血红蛋白的成分，缺铁会引起缺铁性贫血，可通过食用肝脏、瘦肉、豆类等补充。\nB正确，碘是甲状腺激素的重要成分，缺碘会引起甲状腺肿大（大脖子病），幼儿缺碘会影响生长发育，造成思维迟钝。食用加碘盐（含KIO₃）可预防。\nC正确，锌影响人体发育，缺锌会引起食欲不振、生长迟缓、发育不良。\nD错误，缺氟易产生龋齿，氟过量会引起氟斑牙和氟骨病。引起表皮角质化和癌症的是缺硒，硒有防癌、抗癌作用。所以D错误。"},{"id":"g3_chemistry_033_ex04","knowledge_id":"g3_chemistry_033","question":"判断题：钙是人体必需的微量元素，青少年缺钙会引起佝偻病。（  ）","answer":"答案：错误\n解析：钙是人体中的常量元素（含量超过0.01%），不是微量元素。钙是人体内含量最多的金属元素，约占体重的2%，主要存在于骨骼和牙齿中。青少年缺钙会引起佝偻病和发育不良，老年人缺钙会发生骨质疏松，容易骨折。为了补钙，可以多吃奶制品、豆制品、虾皮等富含钙的食物，同时补充维生素D以促进钙的吸收。注意：钙是常量元素，不是微量元素。"},{"id":"g3_chemistry_033_ex05","knowledge_id":"g3_chemistry_033","question":"填空题：人体中的钙元素主要以羟基磷酸钙晶体的形式存在于骨骼和牙齿中，羟基磷酸钙的化学式为Ca₁₀(PO₄)₆(OH)₂。羟基磷酸钙中钙元素和氧元素的质量比为______，钙元素的质量分数为______。（相对原子质量：Ca-40，P-31，O-16，H-1，结果保留一位小数）","answer":"答案：25:26（或200:208），39.8%\n解析：\n羟基磷酸钙的相对分子质量 = 40×10 + (31 + 16×4)×6 + (16 + 1)×2\n= 400 + (31 + 64)×6 + 17×2\n= 400 + 95×6 + 34\n= 400 + 570 + 34 = 1004\n\n钙元素质量 = 40×10 = 400\n氧元素质量 = 16×(4×6 + 2) = 16×26 = 416\n钙元素与氧元素的质量比 = 400:416 = 25:26\n\n钙元素的质量分数 = 400/1004 × 100% ≈ 39.8%"},{"id":"g3_chemistry_033_ex06","knowledge_id":"g3_chemistry_033","question":"选择题：下列关于化学元素与人体健康的说法中，正确的是\nA. 微量元素对人体健康十分重要，摄入量越多越好\nB. 人体中含量最多的元素是碳元素\nC. 为了预防缺铁性贫血，我们应该大量服用补铁保健品\nD. 即使是必需元素，也有合理摄入量的问题，摄入不足或过量都不利于人体健康","answer":"答案：D\n解析：A错，微量元素虽然重要，但并非越多越好，过量摄入也会危害健康。例如碘过量也会引起甲状腺肿大，氟过量会引起氟斑牙和氟骨病，硒过量会使人中毒。\nB错，人体中含量最多的元素是氧（O），约占65%；碳排第二，约占18%；氢排第三，约占10%；氮排第四，约占3%。\nC错，补铁应通过合理膳食为主，保健品适量服用，不能大量服用，过量补铁对身体有害。\nD对，即使是必需元素，也要合理摄入，摄入不足会引起缺乏症，摄入过量也会中毒，都不利于健康。所以要均衡膳食，不要盲目补充。"},{"id":"g3_chemistry_033_ex07","knowledge_id":"g3_chemistry_033","question":"解答题：某品牌加碘食盐标签上的部分文字说明如下：配料表：氯化钠、碘酸钾（KIO₃）；含碘量：20 mg/kg ~ 30 mg/kg；保质期：18个月；食用方法：勿长时间炖炒；贮藏指南：避光、避热、密封防潮。请回答：\n（1）碘酸钾中碘元素的化合价是多少？\n（2）碘酸钾（KIO₃）的相对分子质量是多少？碘元素的质量分数是多少？\n（3）为什么食用方法要求\"勿长时间炖炒\"，贮藏要求\"避光、避热\"？\n（4）若某人每天食用5 g这种食盐，且碘的摄入量按25 mg/kg计算，则他每天摄入碘的质量是多少？","answer":"答案：（1）+5价\n（2）相对分子质量214，碘元素质量分数约59.3%\n（3）碘酸钾受热、见光易分解，长时间炖炒或高温光照会使碘酸钾分解，碘元素损失，降低补碘效果。\n（4）0.125 mg（或125 μg）\n\n解析：（1）KIO₃中K为+1价，O为-2价，设I的化合价为x，则(+1) + x + (-2)×3 = 0，x = +5。\n（2）KIO₃的相对分子质量 = 39 + 127 + 16×3 = 39 + 127 + 48 = 214\n碘元素质量分数 = 127/214 × 100% ≈ 59.3%\n（3）碘酸钾不稳定，受热、见光易分解，使碘元素流失，所以要避光、避热保存，且不宜长时间炖炒。\n（4）5 g = 0.005 kg，每天摄入碘的质量 = 0.005 kg × 25 mg/kg = 0.125 mg = 125 μg。"},{"id":"g3_chemistry_033_ex08","knowledge_id":"g3_chemistry_033","question":"选择题：人体中化学元素含量的多少，会直接影响人体健康。下列元素中，因摄入量不足可能导致骨质疏松的是\nA. 铁\nB. 钙\nC. 锌\nD. 碘","answer":"答案：B\n解析：钙主要存在于骨骼和牙齿中，使骨骼和牙齿具有坚硬的结构支架。幼儿和青少年缺钙会患佝偻病和发育不良，老年人缺钙会发生骨质疏松，容易骨折。\n铁是合成血红蛋白的原料，缺铁引起贫血。\n锌影响生长发育，缺锌引起食欲不振、生长迟缓。\n碘是甲状腺激素的成分，缺碘引起甲状腺肿大。\n所以选B。"},{"id":"g3_chemistry_033_ex09","knowledge_id":"g3_chemistry_033","question":"判断题：人体中必需的微量元素有铁、锌、硒、碘、氟等，对这些元素摄入越多越有利于健康。（  ）","answer":"答案：错误\n解析：人体必需的微量元素虽然对健康很重要，但并非摄入越多越好。任何元素都有合理摄入量的问题，摄入不足和摄入过量都不利于人体健康。例如：\n- 碘：缺碘引起甲状腺肿大，碘过量也会引起甲状腺肿大。\n- 氟：缺氟易患龋齿，氟过量会引起氟斑牙和氟骨病。\n- 硒：缺硒可能引起表皮角质化和癌症，摄入量过高会使人中毒。\n- 铁：缺铁会贫血，过量摄入铁也会导致中毒。\n所以必须合理摄入，均衡膳食，不挑食、不偏食，不能盲目大量补充。"},{"id":"g3_chemistry_033_ex10","knowledge_id":"g3_chemistry_033","question":"填空题：将下列元素与缺乏时引起的病症连接起来：\nA. 钙    ① 贫血\nB. 铁    ② 甲状腺肿大\nC. 碘    ③ 骨质疏松、佝偻病\nD. 锌    ④ 龋齿\nE. 氟    ⑤ 食欲不振、生长迟缓\nF. 硒    ⑥ 表皮角质化、癌症\nA—______，B—______，C—______，D—______，E—______，F—______。","answer":"答案：A—③，B—①，C—②，D—⑤，E—④，F—⑥\n解析：各元素的作用与缺乏症：\n- 钙（Ca）：构成骨骼和牙齿的主要成分，缺乏时幼儿和青少年患佝偻病，老年人患骨质疏松症。A→③\n- 铁（Fe）：血红蛋白的成分，帮助氧气运输，缺铁引起缺铁性贫血。B→①\n- 碘（I）：甲状腺激素的重要成分，缺碘引起甲状腺肿大（大脖子病），幼儿缺碘影响智力发育。C→②\n- 锌（Zn）：影响人体发育，缺锌引起食欲不振、生长迟缓、发育不良。D→⑤\n- 氟（F）：防治龋齿，缺氟易产生龋齿，过量会引起氟斑牙和氟骨病。E→④\n- 硒（Se）：有防癌、抗癌作用，缺硒可能引起表皮角质化和癌症，摄入量过高会中毒。F→⑥"},{"id":"g3_chemistry_034_ex01","knowledge_id":"g3_chemistry_034","question":"选择题：下列物质中，属于有机合成材料的是\nA. 棉花\nB. 羊毛\nC. 塑料\nD. 天然橡胶","answer":"答案：C\n解析：有机合成材料简称合成材料，是用有机高分子化合物制成的材料，主要包括三大类：塑料、合成纤维、合成橡胶。\n棉花、羊毛、天然橡胶都属于天然有机高分子材料，是自然界中存在的，不是人工合成的。塑料是人工合成的，属于有机合成材料。\n所以选C。"},{"id":"g3_chemistry_034_ex02","knowledge_id":"g3_chemistry_034","question":"填空题：化合物根据是否含有碳元素可分为______化合物和______化合物。但少数含碳的化合物，如______、______、碳酸盐等具有无机化合物的特点，因此把它们看作无机化合物。最简单的有机物是______（填化学式）。","answer":"答案：有机，无机，一氧化碳（CO），二氧化碳（CO₂），CH₄\n解析：含碳的化合物叫有机化合物，简称有机物。不含碳的化合物叫无机化合物，简称无机物。但要注意：CO、CO₂、H₂CO₃、碳酸盐（如Na₂CO₃、CaCO₃等）虽然含有碳元素，但它们的组成和性质与无机物相似，所以把它们归为无机物。\n最简单的有机物是甲烷CH₄，它是天然气、沼气的主要成分。有机物的特点：一般都含有碳、氢元素，可能还含有氧、氮、氯、磷、硫等元素；大多数有机物难溶于水，易溶于有机溶剂；受热易分解，容易燃烧；熔点较低；不导电等。"},{"id":"g3_chemistry_034_ex03","knowledge_id":"g3_chemistry_034","question":"选择题：下列关于塑料的说法中，错误的是\nA. 塑料是一类有机合成高分子材料\nB. 塑料可以分为热塑性塑料和热固性塑料两类\nC. 塑料都具有热塑性，都可以反复加工、多次使用\nD. 塑料的优点是质轻、易加工、耐腐蚀、价格便宜等","answer":"答案：C\n解析：A正确，塑料是三大有机合成材料之一，是合成高分子化合物。\nB正确，塑料按受热后的表现分为热塑性塑料和热固性塑料。热塑性塑料受热时熔化，冷却后变成固体，加热后又可以熔化，如聚乙烯、聚丙烯、聚氯乙烯等，可以反复加工。热固性塑料一经加工成型就不会受热熔化，如酚醛塑料（电木）、脲醛塑料（电玉）等，不能反复加工。\nC错误，不是所有塑料都有热塑性，热固性塑料就没有热塑性，不能反复加工。\nD正确，塑料具有很多优良性能：质轻、密度小、易加工成型、耐腐蚀、不导电、价格便宜等，因此被广泛应用。"},{"id":"g3_chemistry_034_ex04","knowledge_id":"g3_chemistry_034","question":"判断题：棉花、羊毛、蚕丝都属于天然纤维，涤纶、锦纶、腈纶都属于合成纤维。（  ）","answer":"答案：正确\n解析：纤维分为天然纤维和合成纤维两大类。\n天然纤维是自然界中存在的纤维，包括：植物纤维（如棉花、亚麻等，主要成分是纤维素）和动物纤维（如羊毛、蚕丝等，主要成分是蛋白质）。\n合成纤维是用石油化工产品为原料人工合成的高分子化合物，常见的有涤纶（聚酯纤维）、锦纶（尼龙，聚酰胺纤维）、腈纶（聚丙烯腈纤维，俗称人造羊毛）等。合成纤维的优点是强度高、弹性好、耐磨、耐化学腐蚀；缺点是吸水性和透气性较差。因此衣服常混纺天然纤维和合成纤维，取长补短。"},{"id":"g3_chemistry_034_ex05","knowledge_id":"g3_chemistry_034","question":"填空题：合成材料的应用与发展，大大方便了人类的生活，但废弃塑料带来的\"______\"问题也日益严重。要解决这个问题，主要措施有：（1）减少使用不必要的塑料制品，如用布袋代替塑料袋；（2）______使用某些塑料制品，如塑料袋、塑料盒等；（3）使用一些新型的、可______的塑料，如微生物降解塑料和光降解塑料等；（4）______各种废弃塑料。","answer":"答案：白色污染，重复，降解，回收\n解析：废弃塑料带来的环境污染称为\"白色污染\"，因为塑料大多是白色的。白色污染的危害：塑料难以降解（一般塑料需200~400年才能降解），长期堆积会破坏土壤，污染地下水，危害海洋生物的生存；焚烧含氯塑料会产生有毒的氯化氢气体，污染空气。\n治理白色污染的措施：\n（1）减少使用不必要的塑料制品，如用布袋代替塑料袋；\n（2）重复使用某些塑料制品，如塑料袋、塑料瓶等；\n（3）使用新型的、可降解的塑料，如生物降解塑料、光降解塑料；\n（4）回收各种废弃塑料，回收再利用。\n记住：\"白色污染\"是指废弃塑料带来的污染，不一定是白色的塑料。"},{"id":"g3_chemistry_034_ex06","knowledge_id":"g3_chemistry_034","question":"选择题：下列各组物质中，都属于有机合成材料的是\nA. 塑料、合成纤维、合成橡胶\nB. 棉花、羊毛、蚕丝\nC. 金属、塑料、木材\nD. 玻璃、陶瓷、水泥","answer":"答案：A\n解析：三大有机合成材料是：塑料、合成纤维、合成橡胶。\nA正确，这三种都是有机合成材料。\nB都是天然有机高分子材料（天然纤维），不是合成的。\nC中金属是金属材料，木材是天然材料，只有塑料是合成材料。\nD中玻璃、陶瓷、水泥都是无机非金属材料，不是有机合成材料。\n所以选A。"},{"id":"g3_chemistry_034_ex07","knowledge_id":"g3_chemistry_034","question":"解答题：妈妈买了一件羊毛衫，标签上写着\"成分：羊毛80%，涤纶20%\"。请回答：\n（1）羊毛属于什么纤维？涤纶属于什么纤维？\n（2）如何通过简单的实验方法来鉴别羊毛纤维和合成纤维？\n（3）在羊毛衫中加入涤纶有什么好处？","answer":"答案：（1）羊毛属于天然纤维（动物纤维，主要成分是蛋白质）；涤纶属于合成纤维（聚酯纤维）。\n（2）用燃烧法鉴别。取样，灼烧闻气味：如果有烧焦羽毛的气味，燃烧后剩余物用手挤压能捏成粉末的是羊毛纤维；如果燃烧时产生特殊气味，燃烧后剩余物是硬块，不易碎的是合成纤维。\n（3）羊毛的优点是吸水性、透气性好，穿着舒适；涤纶的优点是强度高、弹性好、耐磨、不易起皱。将两者混纺，可以取长补短，使衣服既舒适又耐穿、不易起皱。\n\n解析：（1）羊毛是天然的动物纤维，主要成分是蛋白质；涤纶是人工合成的聚酯纤维，属于合成纤维。\n（2）燃烧法是鉴别天然纤维和合成纤维的常用方法：\n- 羊毛（蛋白质）：燃烧时有烧焦羽毛的气味，灰烬疏松，一压就碎。\n- 棉花（纤维素）：燃烧时有烧纸的气味，灰烬少，呈灰黑色，易碎。\n- 合成纤维：燃烧时熔化、收缩，产生特殊气味，灰烬是硬的黑色或褐色小球，不易碎。\n（3）天然纤维的优点是吸水性、透气性好，穿着舒适；缺点是不耐磨、易皱、易变形。合成纤维的优点是强度高、弹性好、耐磨、耐腐蚀、不起皱；缺点是吸水性、透气性差。混纺结合了两者的优点。"},{"id":"g3_chemistry_034_ex08","knowledge_id":"g3_chemistry_034","question":"选择题：下列说法中，正确的是\nA. 有机物一定含有碳元素，含有碳元素的化合物一定是有机物\nB. 甲烷是最简单的有机物，它是天然气、沼气的主要成分\nC. 塑料都有毒，不能用来包装食品\nD. 所有塑料都可以加热熔化，反复加工使用","answer":"答案：B\n解析：A错，有机物一定含碳元素，但含碳元素的化合物不一定是有机物，如CO、CO₂、H₂CO₃、碳酸盐等虽然含碳，但性质与无机物相似，归为无机物。\nB正确，甲烷CH₄是最简单的有机物，是天然气、沼气、瓦斯气的主要成分，是重要的燃料。\nC错，不是所有塑料都有毒。聚乙烯塑料无毒，可用于包装食品；聚氯乙烯塑料有毒，不能用于包装食品。可以通过燃烧的气味区分：聚乙烯燃烧时无刺激性气味，聚氯乙烯燃烧时有刺激性气味（产生HCl）。\nD错，热塑性塑料可以加热熔化反复使用，热固性塑料（如电木）不能。"},{"id":"g3_chemistry_034_ex09","knowledge_id":"g3_chemistry_034","question":"判断题：有机高分子化合物的相对分子质量很大，从几万到几十万，甚至高达几百万或更高，如蛋白质、淀粉等都是有机高分子化合物。（  ）","answer":"答案：正确\n解析：有机高分子化合物（简称有机高分子）的相对分子质量很大，一般从几万到几十万，甚至高达几百万或更高。例如：\n- 蛋白质的相对分子质量可达几万到几百万；\n- 淀粉(C₆H₁₀O₅)ₙ，n的值可以从几百到几千，相对分子质量可达几万到几十万；\n- 聚乙烯(C₂H₄)ₙ，n值可达几千到几万，相对分子质量可达几万到几十万。\n有机高分子化合物分为天然有机高分子（如淀粉、纤维素、蛋白质、天然橡胶等）和合成有机高分子（如塑料、合成纤维、合成橡胶等）两大类。"},{"id":"g3_chemistry_034_ex10","knowledge_id":"g3_chemistry_034","question":"填空题：化学在材料科学中发挥着重要作用。请将下列材料进行分类（填序号）：\n① 玻璃  ② 塑料  ③ 陶瓷  ④ 水泥  ⑤ 合成纤维  ⑥ 合成橡胶\n⑦ 棉花  ⑧ 羊毛  ⑨ 天然橡胶  ⑩ 不锈钢  ⑪ 黄铜  ⑫ 玻璃钢\n（1）属于金属材料的是______；\n（2）属于无机非金属材料的是______；\n（3）属于天然有机高分子材料的是______；\n（4）属于有机合成材料的是______；\n（5）属于复合材料的是______。","answer":"答案：（1）⑩⑪（2）①③④（3）⑦⑧⑨（4）②⑤⑥（5）⑫\n解析：材料大致可分为以下几类：\n（1）金属材料：包括纯金属和合金。不锈钢是铁的合金，黄铜是铜锌合金，都属于金属材料。选⑩⑪。\n（2）无机非金属材料：如玻璃、陶瓷、水泥等，传统的三大无机非金属材料。选①③④。\n（3）天然有机高分子材料：自然界存在的高分子材料，包括棉花、羊毛（天然纤维）、天然橡胶等。选⑦⑧⑨。\n（4）有机合成材料：人工合成的高分子材料，三大合成材料是塑料、合成纤维、合成橡胶。选②⑤⑥。\n（5）复合材料：由两种或两种以上材料复合而成的具有新性能的材料，如玻璃钢（玻璃纤维增强塑料）、碳纤维复合材料等。选⑫。\n注意：玻璃钢不是钢，是复合材料。"}];
        const HAS_EXAMPLES = true;

        // 错题本管理器
        const WrongBookManager = {
            STORAGE_KEY_PREFIX: 'wrongbook_',
            getWrongBook(grade, subject) {
                const key = this.STORAGE_KEY_PREFIX + grade + '_' + subject;
                return JSON.parse(localStorage.getItem(key) || '[]');
            },
            addWrongBook(item) {
                const key = this.STORAGE_KEY_PREFIX + item.grade + '_' + item.subject;
                let wrongBook = this.getWrongBook(item.grade, item.subject);
                const exists = wrongBook.some(w => w.question === item.question);
                if (exists) return false;
                wrongBook.push({...item, id: item.knowledgeId + '_' + Date.now(), addedAt: new Date().toISOString()});
                localStorage.setItem(key, JSON.stringify(wrongBook));
                return true;
            }
        };

        // 学习进度管理器
        const ProgressManager = {
            STORAGE_KEY: 'study_progress',
            
            getProgress() {
                try {
                    return JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
                } catch(e) {
                    return {};
                }
            },
            
            saveProgress(progress) {
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(progress));
            },
            
            recordStudy(grade, subject, subjectName, semester, semesterName, knowledgeId, knowledgeName) {
                const progress = this.getProgress();
                const now = new Date().toISOString();
                const today = new Date().toISOString().split('T')[0];
                
                if (!progress.learnedKnowledge) progress.learnedKnowledge = {};
                if (!progress.dailyStats) progress.dailyStats = {};
                if (!progress.dailyStats[today]) {
                    progress.dailyStats[today] = { learnedCount: 0, subjects: [] };
                }
                
                const isNew = !progress.learnedKnowledge[knowledgeId];
                progress.learnedKnowledge[knowledgeId] = { learnedAt: now };
                
                if (isNew) {
                    progress.dailyStats[today].learnedCount++;
                    if (!progress.dailyStats[today].subjects.includes(subject)) {
                        progress.dailyStats[today].subjects.push(subject);
                    }
                }
                
                progress.lastStudy = {
                    grade, subject, subjectName, semester, semesterName,
                    knowledgeId, knowledgeName, timestamp: now
                };
                
                this.saveProgress(progress);
            },
            
            isLearned(knowledgeId) {
                const progress = this.getProgress();
                return !!(progress.learnedKnowledge && progress.learnedKnowledge[knowledgeId]);
            },
            
            getLastStudy() {
                const progress = this.getProgress();
                return progress.lastStudy || null;
            },
            
            getSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                if (!progress.learnedKnowledge) return { learned: 0, total: 0, percent: 0 };
                const prefix = grade + '_' + subject + '_';
                const learned = Object.keys(progress.learnedKnowledge).filter(k => k.startsWith(prefix)).length;
                const total = DATA_KNOWLEDGE.length;
                const percent = total > 0 ? Math.round((learned / total) * 100) : 0;
                return { learned, total, percent };
            },
            
            clearSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                const prefix = grade + '_' + subject + '_';
                
                if (progress.learnedKnowledge) {
                    Object.keys(progress.learnedKnowledge).forEach(k => {
                        if (k.startsWith(prefix)) {
                            delete progress.learnedKnowledge[k];
                        }
                    });
                }
                
                if (progress.lastStudy && progress.lastStudy.grade === grade && progress.lastStudy.subject === subject) {
                    delete progress.lastStudy;
                }
                
                this.saveProgress(progress);
                return true;
            }
        };

        // URL参数解析
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                grade: 'g3',
                subject: 'chemistry',
                semester: params.get('semester') || 'upper'
            };
        }

        const gradeNames = {'g1':'初一','g2':'初二','g3':'初三'};
        const subjectNames = {'chemistry':'化学'};
        const semesterNames = {'upper':'上册','lower':'下册'};

        let currentParams = getUrlParams();
        let knowledgeList = [];
        let expandedIds = new Set();
        let currentExample = null;

        const pageTitle = document.getElementById('page-title');
        const pageSubtitle = document.getElementById('page-subtitle');
        const knowledgeListEl = document.getElementById('knowledge-list');
        const emptyStateEl = document.getElementById('empty-state');
        const searchResultsInfo = document.getElementById('search-results-info');
        const searchCountEl = document.getElementById('search-count');
        const searchInput = document.getElementById('search-input');

        function initPage() {
            const {grade, subject, semester} = currentParams;
            pageTitle.textContent = gradeNames[grade] + ' · ' + subjectNames[subject] + ' · ' + semesterNames[semester];
            loadKnowledge();
            updateProgressStat();
            
            const hash = window.location.hash.replace('#', '');
            if (hash && knowledgeList.some(k => k.id === hash)) {
                setTimeout(() => {
                    toggleExpand(hash);
                    const card = document.querySelector('[data-id="' + hash + '"]');
                    if (card) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
        }

        function updateProgressStat() {
            const {grade, subject} = currentParams;
            const learnedInSemester = knowledgeList.filter(k => ProgressManager.isLearned(k.id)).length;
            document.getElementById('progress-learned').textContent = learnedInSemester;
            document.getElementById('progress-total').textContent = knowledgeList.length;
        }

        function loadKnowledge() {
            const {grade, subject, semester} = currentParams;
            knowledgeList = DATA_KNOWLEDGE.filter(k => {
                return k.semester === semester;
            });
            renderKnowledgeList();
        }

        function renderKnowledgeList(items = knowledgeList) {
            if (items.length === 0) {
                knowledgeListEl.innerHTML = '';
                emptyStateEl.classList.remove('hidden');
                return;
            }
            emptyStateEl.classList.add('hidden');
            knowledgeListEl.innerHTML = items.map(item => {
                const isExpanded = expandedIds.has(item.id);
                const isLearned = ProgressManager.isLearned(item.id);
                return '<div class="card knowledge-card ' + (isLearned ? 'learned' : '') + '" data-id="' + item.id + '">' +
                    '<div class="knowledge-header p-4 flex items-center justify-between" onclick="toggleExpand(\'' + item.id + '\')">' +
                        '<div class="flex items-center gap-3 flex-1 min-w-0">' +
                            '<div class="expand-icon ' + (isExpanded ? 'expanded' : 'collapsed') + '">' + (isExpanded ? '−' : '+') + '</div>' +
                            '<div class="flex-1 min-w-0">' +
                                '<h3 class="text-lg font-semibold text-gray-800 flex items-center gap-2">' + escapeHtml(item.name) + (isLearned ? '<span class="text-green-500 text-sm">✓ 已学习</span>' : '') + '</h3>' +
                                '<p class="text-xs text-gray-500 mt-1">' + escapeHtml(item.chapter) + '</p>' +
                            '</div>' +
                        '</div>' +
                        (HAS_EXAMPLES ? '<button class="btn btn-secondary text-sm px-3 py-1" onclick="event.stopPropagation(); showExample(\'' + item.id + '\', \'' + escapeHtml(item.name) + '\')">例题</button>' : '') +
                    '</div>' +
                    '<div id="content-' + item.id + '" class="px-6 pb-4 ' + (isExpanded ? '' : 'hidden') + '">' +
                        (item.formula ? '<div class="mb-4"><h4 class="text-sm font-medium text-gray-500 mb-2">📐 公式</h4><p class="formula-box text-gray-800 text-lg bg-gray-50 p-3 rounded-lg">' + escapeHtml(item.formula) + '</p></div>' : '') +
                        (item.explanation ? '<div><h4 class="text-sm font-medium text-gray-500 mb-2">📝 解释</h4><p class="text-gray-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(item.explanation) + '</p></div>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function toggleExpand(id) {
            const isNewLearn = !expandedIds.has(id) && !ProgressManager.isLearned(id);
            if (expandedIds.has(id)) {
                expandedIds.delete(id);
            } else {
                expandedIds.add(id);
                const {grade, subject, semester} = currentParams;
                const item = knowledgeList.find(k => k.id === id);
                if (item) {
                    ProgressManager.recordStudy(
                        grade, subject, subjectNames[subject],
                        semester, semesterNames[semester],
                        id, item.name
                    );
                }
            }
            const card = document.querySelector('[data-id="' + id + '"]');
            const content = document.getElementById('content-' + id);
            const icon = card.querySelector('.expand-icon');
            const header = card.querySelector('.knowledge-header');
            const title = card.querySelector('h3');
            if (expandedIds.has(id)) {
                content.classList.remove('hidden');
                icon.classList.remove('collapsed');
                icon.classList.add('expanded');
                icon.textContent = '−';
                header.classList.add('expanded');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('expanded');
                icon.classList.add('collapsed');
                icon.textContent = '+';
                header.classList.remove('expanded');
            }
            if (isNewLearn) {
                card.classList.add('learned');
                if (!title.querySelector('.text-green-500')) {
                    title.innerHTML += '<span class="text-green-500 text-sm">✓ 已学习</span>';
                }
                updateProgressStat();
            }
        }

        function expandAll() {
            knowledgeList.forEach(item => expandedIds.add(item.id));
            renderKnowledgeList();
        }

        function collapseAll() {
            expandedIds.clear();
            renderKnowledgeList();
        }

        function searchKnowledge(keyword, list) {
            if (!keyword) return [];
            const lower = keyword.toLowerCase();
            return list.filter(k =>
                k.name.toLowerCase().includes(lower) ||
                k.chapter.toLowerCase().includes(lower)
            );
        }

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                searchResultsInfo.classList.add('hidden');
                renderKnowledgeList();
                return;
            }
            const results = searchKnowledge(keyword, knowledgeList);
            searchCountEl.textContent = results.length;
            searchResultsInfo.classList.remove('hidden');
            renderKnowledgeList(results);
        }

        function showExample(knowledgeId, knowledgeName) {
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === knowledgeId);
            if (examples.length === 0) {
                alert('暂无例题');
                return;
            }
            const example = examples[Math.floor(Math.random() * examples.length)];
            currentExample = {...example, knowledgeId, knowledgeName, ...currentParams};
            document.getElementById('example-knowledge-name').textContent = knowledgeName;
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
            document.getElementById('example-modal').classList.remove('hidden');
        }

        function nextExample() {
            if (!currentExample) return;
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === currentExample.knowledgeId);
            const otherExamples = examples.filter(e => e !== currentExample);
            if (otherExamples.length === 0) {
                alert('没有更多例题了');
                return;
            }
            const example = otherExamples[Math.floor(Math.random() * otherExamples.length)];
            currentExample = {...example, knowledgeId: currentExample.knowledgeId, knowledgeName: currentExample.knowledgeName, ...currentParams};
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
        }

        function addToWrongBook() {
            if (!currentExample) return;
            const item = {
                knowledgeId: currentExample.knowledgeId,
                knowledgeName: currentExample.knowledgeName,
                question: currentExample.question,
                answer: currentExample.answer,
                grade: currentParams.grade,
                subject: currentParams.subject
            };
            if (WrongBookManager.addWrongBook(item)) {
                alert('已加入错题本！');
            } else {
                alert('该题目已在错题本中');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearProgress() {
            const {grade, subject} = currentParams;
            const subjectName = subjectNames[subject];
            var msg = '确定要清除【' + subjectName + '】科目的所有学习进度吗？';
            msg += '\n\n';
            msg += '此操作将清除该科目所有已学习标记，且不可恢复。';
            if (!confirm(msg)) {
                return;
            }
            ProgressManager.clearSubjectProgress(grade, subject);
            updateProgressStat();
            renderKnowledgeList();
            alert('学习进度已清除');
        }

        document.getElementById('btn-expand-all').addEventListener('click', expandAll);
        document.getElementById('btn-collapse-all').addEventListener('click', collapseAll);
        document.getElementById('btn-clear-progress').addEventListener('click', clearProgress);
        searchInput.addEventListener('keyup', e => { if (e.key === 'Enter') performSearch(); });
        searchInput.addEventListener('input', () => { if (!searchInput.value) { searchResultsInfo.classList.add('hidden'); renderKnowledgeList(); }});
        document.getElementById('close-example').addEventListener('click', () => document.getElementById('example-modal').classList.add('hidden'));
        document.getElementById('btn-show-answer').addEventListener('click', () => {
            document.getElementById('example-answer-section').classList.remove('hidden');
            document.getElementById('btn-show-answer').classList.add('hidden');
        });
        document.getElementById('btn-next-example').addEventListener('click', nextExample);
        document.getElementById('btn-add-wrong').addEventListener('click', addToWrongBook);
        document.getElementById('example-modal').addEventListener('click', e => { if (e.target.id === 'example-modal') document.getElementById('example-modal').classList.add('hidden'); });

        initPage();
    </script>
</body>
</html>
