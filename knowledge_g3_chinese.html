憔悴。与记忆中\"紫色的圆脸\"、\"红活圆实的手\"的少年闰土相比，中年闰土苍老了许多，完全没有了少年时的生气。③麻木、迟钝。从他的外貌可以看出，长期的贫困生活已经把他折磨得失去了活力，变得像一个\"木偶人\"。\n这段肖像描写，通过中年闰土与少年闰土的对比，突出了闰土二十多年来的巨大变化，反映了他生活的艰辛和精神的麻木，有力地揭示了小说的主题。\n解析：本题考查对人物描写方法及其作用的分析。分析肖像描写，要抓住描写的重点，思考作者为什么要这样写，它对表现人物性格、揭示主题有什么作用。"},{"id":"g3_chinese_016_ex04","knowledge_id":"g3_chinese_016","question":"选择题：对\"我们之间已经隔了一层可悲的厚障壁了\"一句理解有误的一项是（  ）\nA. \"厚障壁\"是一种比喻的说法，指的是人与人之间的隔膜。\nB. 这层\"厚障壁\"是封建等级观念造成的，是社会的悲剧。\nC. 这层\"厚障壁\"只存在于\"我\"和闰土之间，是两人缺乏沟通造成的。\nD. 这句话表达了\"我\"对人与人之间隔膜的悲哀和无奈。","answer":"答案：C。解析：A、B、D三项的理解都是正确的。C项错误，这层\"厚障壁\"不只是存在于\"我\"和闰土之间，而是一个普遍的社会现象。在封建社会，等级制度森严，人与人之间（特别是不同阶级之间）普遍存在着隔膜。不仅\"我\"和闰土之间有，闰土和杨二嫂之间也有，甚至闰土自己和他的孩子之间将来也可能有。这不是两个人缺乏沟通造成的，而是整个社会制度造成的，是社会的悲剧。作者通过\"我\"和闰土之间的隔膜，反映了更广泛、更深刻的社会问题，这正是小说深刻的地方。解析：本题考查对文中关键语句的理解，要结合全文和主题来分析，不能孤立地看一句话。"},{"id":"g3_chinese_016_ex05","knowledge_id":"g3_chinese_016","question":"填空题：《故乡》中运用了多种对比手法，请写出至少三种对比：______、______、______。","answer":"答案：少年闰土与中年闰土的对比、杨二嫂前后变化的对比、故乡前后景象的对比（或：\"我\"与闰土的关系前后变化的对比、闰土与杨二嫂的对比、\"我\"的心情前后变化的对比等，任选三种即可）。解析：对比是《故乡》最突出的写作手法。主要的对比有：①少年闰土与中年闰土的对比：少年闰土活泼勇敢、聪明能干、见多识广，是一个小英雄形象；中年闰土麻木迟钝、辛苦麻木、谦恭卑微，像一个木偶人。通过对比，突出了闰土的巨大变化，反映了农民生活的困苦和精神的麻木。②故乡前后景象的对比：记忆中的故乡美丽神奇，有深蓝的天空、金黄的圆月、碧绿的沙地；现实中的故乡萧条荒凉，苍黄的天底、萧索的荒村。通过对比，突出了故乡的每况愈下，反映了农村经济的凋敝。③\"我\"与闰土关系的对比：少年时两人是亲密无间的好朋友，平等相处，无话不谈；二十多年后，两人之间却隔了一层厚障壁，闰土恭敬地叫\"我\"\"老爷\"。通过对比，表现了封建等级观念对人与人关系的毒害。对比手法的运用，使人物形象更鲜明，主题更突出。"},{"id":"g3_chinese_016_ex06","knowledge_id":"g3_chinese_016","question":"阅读理解：阅读下面的文字，完成后面的题目。\n\n\"哈！这模样了！胡子这么长了！\"一种尖利的怪声突然大叫起来。\n\n我吃了一吓，赶忙抬起头，却见一个凸颧骨，薄嘴唇，五十岁上下的女人站在我面前，两手搭在髀间，没有系裙，张着两脚，正像一个画图仪器里细脚伶仃的圆规。\n\n……\n\n\"啊呀呀，你放了道台了，还说不阔？你现在有三房姨太太；出门便是八抬的大轿，还说不阔？吓，什么都瞒不过我。\"\n\n我知道无话可说了，便闭了口，默默的站着。\n\n\"阿呀阿呀，真是愈有钱，便愈是一毫不肯放松，愈是一毫不肯放松，便愈有钱……\"圆规一面愤愤的回转身，一面絮絮的说，慢慢向外走，顺便将我母亲的一副手套塞在裤腰里，出去了。\n\n（1）杨二嫂这个人物形象在小说中有什么作用？","answer":"答案：杨二嫂这个人物形象在小说中的作用主要有：①衬托主要人物闰土。杨二嫂的尖酸刻薄、自私贪婪，与闰土的忠厚老实、善良淳朴形成鲜明对比，使闰土的形象更加突出、更加感人。②深化小说主题。杨二嫂是小市民阶层的典型，她的变化说明，不仅农民生活日益贫困，小市民的日子也越来越不好过，他们的精神也在日益堕落。这就扩大了小说反映的社会生活面，使主题更深刻、更有普遍意义。③推动情节发展。杨二嫂的出场，引出了对闰土的回忆和描写，推动了故事情节的发展。④丰富了小说内容。杨二嫂这个形象生动活泼、个性鲜明，增加了小说的生活气息和可读性。\n总之，杨二嫂虽然不是小说的主要人物，但她是小说中不可或缺的人物，在塑造人物、表现主题、推动情节等方面都有重要作用。\n解析：本题考查对次要人物作用的分析。分析次要人物的作用，要从衬托主要人物、深化主题、推动情节、丰富内容等多个角度来思考。"},{"id":"g3_chinese_016_ex07","knowledge_id":"g3_chinese_016","question":"选择题：下面对《故乡》主题的理解，不够准确的一项是（  ）\nA. 小说通过闰土的变化，反映了辛亥革命后中国农村破产、农民生活日益贫困的社会现实。\nB. 小说通过\"我\"与闰土关系的变化，表现了封建等级观念对人与人关系的毒害，表达了对人与人之间隔膜的悲哀。\nC. 小说表达了作者对现实的彻底失望和悲观绝望的情绪，认为故乡已经没有希望了。\nD. 小说表达了作者对新生活的向往和追求，坚信只要大家努力，就一定能走出一条新路来。","answer":"答案：C。解析：A、B、D三项对小说主题的理解都是准确的。C项不准确，小说虽然描写了故乡的萧条景象和人物的悲剧命运，表达了对现实的失望，但并没有彻底绝望，更不是悲观的。小说结尾写道：\"希望是本无所谓有，无所谓无的。这正如地上的路；其实地上本没有路，走的人多了，也便成了路。\"这句话充满了哲理，表达了作者对未来的信心和希望，鼓励人们去勇敢地探索、去创造新的生活。小说的基调是悲凉中有希望，失望中有追求，而不是完全的悲观绝望。解析：本题考查对小说主题的准确把握，要注意作者的情感是复杂的，不能简单化、片面化。"},{"id":"g3_chinese_016_ex08","knowledge_id":"g3_chinese_016","question":"填空题：\"希望是本无所谓有，无所谓无的。这正如地上的路；其实地上本没有路，走的人多了，也便成了路。\"这句话是《故乡》的点睛之笔，请谈谈你对这句话的理解。\n\n（1）这句话的字面意思是：________。\n（2）这句话的深层含义是：________。\n（3）这句话在文中的作用是：________。","answer":"答案：（1）字面意思是：希望的有无，就像地上的路一样。地上本来没有路，走的人多了，就变成了路。\n（2）深层含义是：希望不是凭空就有的，也不是凭空就没有的。如果只是空有希望而不去奋斗、不去实践，那么希望也就\"无所谓有\"；如果为了希望去努力奋斗、勇敢探索，那么希望就会变成现实，也就\"无所谓无\"。作者把希望比作路，告诉人们：新生活不是等来的，而是靠我们的双手创造出来的，只要大家都去努力、都去探索，就一定能迎来新的生活。这句话表达了作者对未来新生活的坚定信念和执着追求。\n（3）作用：①总结全文，点明主旨，升华了小说的主题；②富有哲理，给读者以深刻的启示和鼓舞；③照应开头和文中的景物描写，使文章结构严谨、浑然一体；④以议论结尾，发人深省，给读者留下了思考的空间。\n解析：本题考查对文章关键语句的理解，要从表层含义到深层含义，再到表达作用，逐层深入地分析。"},{"id":"g3_chinese_016_ex09","knowledge_id":"g3_chinese_016","question":"阅读理解：阅读下面的文字，完成后面的题目。\n\n我躺着，听船底潺潺的水声，知道我在走我的路。我想：我竟与闰土隔绝到这地步了，但我们的后辈还是一气，宏儿不是正在想念水生么。我希望他们不再像我，又大家隔膜起来……然而我又不愿意他们因为要一气，都如我的辛苦展转而生活，也不愿意他们都如闰土的辛苦麻木而生活，也不愿意都如别人的辛苦恣睢而生活。他们应该有新的生活，为我们所未经生活过的。\n\n（1）文中提到了几种\"生活\"？分别是什么样的生活？\n（2）\"新的生活\"是怎样的生活？表达了作者怎样的思想感情？","answer":"答案：（1）文中提到了三种\"生活\"：①\"我的辛苦展转而生活\"，就是像\"我\"一样的知识分子的生活，为了生活四处奔波、劳碌，但精神上是觉醒的、痛苦的；②\"闰土的辛苦麻木而生活\"，就是像闰土一样的广大农民的生活，终日辛勤劳作，却生活贫困，精神上麻木愚昧；③\"别人的辛苦恣睢而生活\"，就是像杨二嫂一样的小市民的生活，处心积虑、挖空心思地占便宜，自私贪婪、尖酸刻薄。\n这三种生活虽然表现形式不同，但本质上都是\"辛苦\"的，都是作者所不愿意看到的，所以作者希望下一代能过上\"新的生活\"。\n（2）\"新的生活\"就是没有压迫、没有剥削、没有等级、没有隔膜，人人平等、自由幸福的生活，是\"我们所未经生活过的\"生活。虽然作者没有具体描绘新生活是什么样的，但可以看出，那是一种与旧生活截然不同的、充满希望的生活。\n表达了作者对旧生活的不满和否定，对新生活的向往和追求，以及对下一代的殷切期望。\n解析：本题考查对文中重点语句和作者思想感情的理解，要结合全文和写作背景来分析。"},{"id":"g3_chinese_016_ex10","knowledge_id":"g3_chinese_016","question":"简答题：《故乡》中的闰土是一个怎样的人物形象？他的变化说明了什么？请结合课文内容谈谈你的看法。\n\n答：________________________________","answer":"答案：闰土是《故乡》的主要人物，是旧中国贫苦农民的典型形象。\n少年闰土是一个活泼勇敢、聪明能干、见多识广、热情纯真的小英雄形象。他会捕鸟、会捡贝壳、会看瓜刺猹、会看跳鱼儿，知道很多\"我\"不知道的新鲜事。他和\"我\"年纪相仿，两人平等相处，亲密无间，是无话不谈的好朋友。\n中年闰土却变成了一个麻木迟钝、辛苦麻木、谦恭卑微的\"木偶人\"。他外貌苍老，灰黄的脸、深深的皱纹、松树皮一样的手；他精神麻木，见了\"我\"恭敬地叫\"老爷\"，还让水生\"给老爷磕头\"；他生活困苦，多子、饥荒、苛税、兵、匪、官、绅，都苦得他像一个木偶人了。\n闰土的巨大变化，说明：①辛亥革命后中国农村经济日益凋敝，农民生活越来越贫困；②封建等级观念和封建礼教对劳动人民的精神毒害很深，人与人之间有了厚障壁；③帝国主义和封建主义的双重压迫，是造成农民苦难的根本原因；④旧中国的农民要想摆脱苦难，单靠个人的努力是不行的，必须寻找一条新的道路。\n闰土的形象，凝聚了作者对劳动人民的深切同情和对旧社会的有力批判，具有很高的典型意义和艺术价值。\n解析：本题是开放性题目，考查对人物形象的综合分析能力，要结合课文内容，言之有理即可。"},{"id":"g3_chinese_017_ex01","knowledge_id":"g3_chinese_017","question":"选择题：下列关于《我的叔叔于勒》的说法，不正确的一项是（  ）\nA. 本文作者莫泊桑，是法国19世纪后半期著名的批判现实主义作家，被誉为\"短篇小说巨匠\"。\nB. 小说以\"我的叔叔于勒\"为题，是因为于勒是小说的主人公，小说主要通过于勒的遭遇来表现主题。\nC. 小说运用对比手法，通过菲利普夫妇对于勒态度的前后变化，深刻地揭露了资本主义社会人与人之间赤裸裸的金钱关系。\nD. 小说以\"我\"的视角来叙述故事，用一个孩子的眼光来看成人世界，增强了作品的真实性和讽刺效果。","answer":"答案：B。解析：A、C、D三项的说法都是正确的。B项错误，于勒不是小说的主人公，小说的主人公是菲利普夫妇。于勒虽然是小说的核心人物，他的命运推动着情节的发展，但小说主要刻画的是菲利普夫妇的形象，通过他们对于勒态度的前后变化来表现主题。于勒只是小说中的线索人物，用来推动情节发展、衬托主要人物。小说以\"我的叔叔于勒\"为题，有两个作用：一是点明了线索人物，二是带有讽刺意味——\"我的叔叔\"本应是亲人，可菲利普夫妇却像躲瘟神一样躲着他，这就更有讽刺效果了。解析：本题考查对小说基本常识和人物形象的把握，要注意区分主要人物和次要人物、线索人物。"},{"id":"g3_chinese_017_ex02","knowledge_id":"g3_chinese_017","question":"填空题：《我的叔叔于勒》的作者是______国作家______，他的代表作有《______》《______》等。小说以______为线索，按照______于勒——______于勒——______于勒——______于勒的顺序来安排情节。","answer":"答案：法、莫泊桑；羊脂球、项链（或：我的叔叔于勒、菲菲小姐等，写出两个即可）；菲利普夫妇对于勒的态度变化（或：于勒的命运变化）；盼、赞、遇、躲（或：盼、怕、遇、躲）。解析：莫泊桑是法国著名的批判现实主义作家，与俄国的契诃夫、美国的欧·亨利并称为\"世界三大短篇小说巨匠\"。他的代表作有《羊脂球》《项链》《我的叔叔于勒》《菲菲小姐》等。《我的叔叔于勒》的线索是菲利普夫妇对于勒态度的变化，也可以说是于勒的命运变化。小说的情节结构：开端是盼于勒，全家人都盼望着于勒回来；发展是赞于勒，于勒来信说发财了，全家人都把他当救星，赞不绝口；高潮是遇于勒，在去哲尔赛岛旅行的船上，巧遇穷困潦倒的于勒，美梦破灭；结局是躲于勒，为了躲开于勒，回来时改乘另一艘船。\"盼—赞—遇—躲\"四个字概括了小说的主要情节，也浓缩了菲利普夫妇对于勒态度的巨大变化。解析：本题考查对小说基本常识和情节结构的掌握。"},{"id":"g3_chinese_017_ex03","knowledge_id":"g3_chinese_017","question":"阅读理解：阅读下面的文字，完成后面的题目。\n\n我父亲突然好像不安起来，他向旁边走了几步，瞪着眼看了看挤在卖牡蛎的身边的女儿女婿，就赶紧向我们走来。他的脸色十分苍白，两只眼也跟寻常不一样。他低声对我母亲说：\n\"真奇怪！这个卖牡蛎的怎么这样像于勒？\"\n\n母亲有点莫名其妙，就问：\"哪个于勒？\"\n\n父亲说：\"就……就是我的弟弟呀。……如果我不知道他现在是在美洲，有很好的地位，我真会以为就是他哩。\"\n\n我母亲也怕起来了，吞吞吐吐地说：\"你疯了！既然你知道不是他，为什么这样胡说八道？\"\n\n（1）这段文字主要运用了哪些描写方法？表现了菲利普夫妇怎样的性格特点？","answer":"答案：这段文字主要运用了动作描写、神态描写和语言描写。\n动作描写：父亲\"向旁边走了几步\"、\"瞪着眼看了看\"、\"赶紧向我们走来\"，这一连串的动作，生动地表现了他发现卖牡蛎的人像于勒时的慌张和不安，他害怕女儿女婿知道真相，所以赶紧过来报信。\n神态描写：\"脸色十分苍白，两只眼也跟寻常不一样\"，通过脸色和眼神的变化，细腻地表现了父亲内心的惊恐和不安，发财的美梦可能要破灭了，他吓得脸色都变了。\n语言描写：父亲说话吞吞吐吐，\"就……就是我的弟弟呀\"，语无伦次，表现了他内心的慌乱；母亲\"吞吞吐吐\"地说\"你疯了\"，看似在否定，实际上她心里也害怕了，不愿意相信这是真的。\n性格特点：表现了菲利普夫妇（特别是菲利普）的虚荣、势利、恐慌、虚伪。他们朝思暮想发财的于勒，可真的见到穷困潦倒的于勒时，却惊慌失措，唯恐避之不及，生怕影响了自己的体面和女儿的婚事。\n解析：本题考查人物描写方法及其作用的分析，要结合具体语句深入分析人物的内心世界和性格特点。"},{"id":"g3_chinese_017_ex04","knowledge_id":"g3_chinese_017","question":"选择题：对小说中\"我\"（若瑟夫）这个人物形象，理解不正确的一项是（  ）\nA. \"我\"是小说的叙事者，故事是通过\"我\"的眼睛来展现的，增强了故事的真实性。\nB. \"我\"是一个有同情心、有正义感的孩子，和菲利普夫妇的势利冷酷形成了鲜明对比。\nC. \"我\"给了于勒叔叔10个铜子的小费，表现了\"我\"对叔叔的同情和对父母做法的不满。\nD. \"我\"是小说的主人公，小说主要是通过\"我\"的视角来批判金钱社会的罪恶。","answer":"答案：D。解析：A、B、C三项对\"我\"这个形象的理解都是正确的。D项错误，\"我\"不是小说的主人公，小说的主人公是菲利普夫妇。\"我\"在小说中的作用主要有：①作为叙事者，以第一人称\"我\"来叙述故事，增强了故事的真实性和亲切感；②作为人物形象，\"我\"的纯真善良与菲利普夫妇的势利冷酷形成鲜明对比，反衬出菲利普夫妇的丑恶嘴脸；③寄托了作者的理想和希望，\"我\"对叔叔的同情，暗示了社会还有真情在，还有希望。小说的主人公是菲利普夫妇，主题是通过他们对于勒态度的变化来表现的，不是通过\"我\"来表现的。解析：本题考查对小说中人物形象及其作用的理解，要注意区分叙事者和主人公。"},{"id":"g3_chinese_017_ex05","knowledge_id":"g3_chinese_017","question":"填空题：《我的叔叔于勒》中，菲利普夫妇对于勒的态度前后发生了巨大的变化：于勒挥霍家产时，他们骂于勒是______、______；于勒发财来信时，他们夸于勒是______、______；于勒穷困潦倒时，他们骂于勒是______、______。态度变化的根本原因是______。","answer":"答案：坏蛋、流氓、无赖（写出两个即可）；正直的人、有良心的人、好心的于勒、有办法的人（写出两个即可）；贼骨头、讨饭的、流氓（写出两个即可）；金钱（或：于勒是否有钱）。解析：菲利普夫妇对于勒的态度，完全是随着于勒是否有钱而变化的：当于勒挥霍家产时，他是\"坏蛋\"\"流氓\"\"无赖\"，是全家的\"恐怖\"，被打发到美洲去；当于勒来信说赚了钱，要赔偿哥哥的损失时，他一下子变成了\"正直的人\"\"有良心的人\"\"好心的于勒\"\"有办法的人\"，成了全家唯一的\"希望\"和\"福音\"；当在船上巧遇穷困潦倒的于勒时，他又变成了\"贼骨头\"\"讨饭的\"\"流氓\"，全家像躲瘟神一样躲着他。态度变化之快、反差之大，令人瞠目。变化的根本原因就是金钱，就是于勒有没有钱。这种前后对比，有力地揭露了资本主义社会人与人之间赤裸裸的金钱关系，鞭挞了小市民的虚荣、势利和冷酷。解析：本题考查对小说对比手法和主题思想的把握。"},{"id":"g3_chinese_017_ex06","knowledge_id":"g3_chinese_017","question":"阅读理解：阅读下面的文字，完成后面的题目。\n\n我看了看他的手，那是一只满是皱纹的水手的手。我又看了看他的脸，那是一张又老又穷苦的脸，满脸愁容，狼狈不堪。我心里默念道：\"这是我的叔叔，父亲的弟弟，我的亲叔叔。\"\n\n我给了他10个铜子的小费。他赶紧谢我：\"上帝保佑您，我的年轻的先生！\"\n\n等我把2法郎交给父亲，母亲诧异起来，就问：\"吃了3个法郎？这是不可能的。\"\n\n我说：\"我给了他10个铜子的小费。\"\n\n我母亲吓了一跳，直望着我说：\"你简直是疯了！拿10个铜子给这个人，给这个流氓！\"她没再往下说，因为父亲指着女婿对她使了个眼色。\n\n（1）\"我心里默念道：'这是我的叔叔，父亲的弟弟，我的亲叔叔。'\"这句话表现了\"我\"怎样的心理？有什么作用？","answer":"答案：这句话表现了\"我\"（若瑟夫）复杂的心理：①对叔叔于勒的深切同情。看到叔叔穷困潦倒的样子，\"我\"心里很难过，很同情他的遭遇。②对父母做法的不满和困惑。父母明明知道这是自己的亲弟弟，却不肯相认，还骂他是流氓，\"我\"对父母的这种做法感到不解和不满。③对人与人之间关系隔膜的悲哀。本是至亲骨肉，却因为穷富的差别而形同陌路，甚至像仇人一样，这让\"我\"感到悲哀。\n作用：①与菲利普夫妇的势利、冷酷形成鲜明对比，反衬出菲利普夫妇的丑恶嘴脸；②表现了孩子的纯真善良，寄托了作者的社会理想和希望；③从孩子的视角来反思成人世界，更有感染力和震撼力，深化了小说的主题；④\"我的叔叔，父亲的弟弟，我的亲叔叔\"，三个称呼连用，强调了亲情关系，与父母的做法形成强烈反差，讽刺效果更强。\n解析：本题考查对人物心理和关键语句作用的分析，要结合上下文和全文主题来理解。"},{"id":"g3_chinese_017_ex07","knowledge_id":"g3_chinese_017","question":"选择题：下列对小说结尾\"我们回来的时候改乘圣玛洛船，以免再遇见他\"的分析，不正确的一项是（  ）\nA. 这句话表现了菲利普夫妇的势利和冷酷，连亲弟弟都避之唯恐不及。\nB. 这句话与开头全家人盼于勒归来形成鲜明对比，增强了小说的讽刺效果。\nC. 这样的结尾含蓄有力，发人深省，给读者留下了思考的空间。\nD. 这样的结尾太突兀，没有把故事讲完，是作者的疏忽。","answer":"答案：D。解析：A、B、C三项对结尾的分析都是正确的。D项错误，这个结尾不是突兀的，更不是作者的疏忽，而是作者的精心安排。①从情节上看，巧遇于勒是高潮，躲开于勒是结局，故事是完整的，没有讲完的是人物以后的命运，而这恰恰给读者留下了想象的空间；②从人物塑造上看，改乘圣玛洛船的做法，把菲利普夫妇的势利、冷酷、虚荣刻画得入木三分，连亲弟弟都躲着走，连回来的船都要换，人物形象更加鲜明；③从主题表达上看，这样的结尾含蓄有力，比直接议论更有力量，它让读者在震惊和反思中体会小说的主题；④从艺术效果上看，以行动结束全文，戛然而止，余味无穷，是短篇小说常见的结尾方式，体现了莫泊桑短篇小说的艺术特色。解析：本题考查对小说结尾作用的分析，要从人物、主题、结构、艺术效果等多个角度来思考。"},{"id":"g3_chinese_017_ex08","knowledge_id":"g3_chinese_017","question":"填空题：《我的叔叔于勒》是一篇批判现实主义的杰作，小说的主题可以从多个角度来理解，请写出至少三个角度：______、______、______。","answer":"答案：揭露资本主义社会人与人之间赤裸裸的金钱关系、批判小市民的虚荣势利和冷酷自私、同情小人物的辛酸和不幸（或：对亲情的呼唤、对金钱至上观念的批判、对人性异化的反思等，写出三个言之有理的角度即可）。解析：《我的叔叔于勒》的主题是丰富的、多元的，可以从多个角度来理解：①从社会批判的角度：小说通过菲利普夫妇对于勒态度的前后变化，深刻揭露了资本主义社会人与人之间赤裸裸的金钱关系，金钱主宰了一切，包括亲情。②从人性批判的角度：小说批判了小市民阶层的虚荣、势利、冷酷、自私，菲利普夫妇把金钱看得比亲情还重，他们的人性被金钱扭曲了。③从人文关怀的角度：小说对小人物的命运给予了深切的同情，于勒的遭遇令人同情，菲利普夫妇的势利中也有生活的无奈和辛酸，他们都是金钱社会的受害者。④从亲情的角度：小说呼唤真诚的亲情，批判被金钱异化的人际关系，渴望人与人之间温暖的感情。这些角度并不矛盾，而是相互联系、相互补充的，共同构成了小说丰富的主题内涵。解析：本题考查对小说主题的多角度理解，主题的理解可以是多元的，只要言之成理即可。"},{"id":"g3_chinese_017_ex09","knowledge_id":"g3_chinese_017","question":"阅读理解：阅读下面的文字，完成后面的题目。\n\n可是每星期日，我们都要衣冠整齐地到海边栈桥上去散步。那时候，只要一看见从远方回来的大海船开进港口来，父亲总要说他那句永不变更的话：\n\n\"唉！如果于勒竟在这只船上，那会叫人多么惊喜呀！\"\n\n……\n\n我们上了轮船，离开栈桥，在一片平静的好似绿色大理石桌面的海上驶向远处。正如那些不常旅行的人们一样，我们感到快活而骄傲。\n\n……\n\n在我们面前，天边远处仿佛有一片紫色的阴影从海里钻出来。那就是哲尔赛岛了。\n\n（1）文中有两处景物描写，请分别分析它们的作用。","answer":"答案：第一处（\"平静的好似绿色大理石桌面的海\"）：作用是烘托人物轻松愉快的心情。全家人满怀希望地去旅行，梦想着于勒叔叔发了财回来，所以心情非常愉快，看到的海面也像\"绿色大理石桌面\"一样美丽平静。景与情和谐统一，以美丽的景色烘托人物欢快的心情。\n第二处（\"一片紫色的阴影从海里钻出来\"）：作用是烘托人物失望、沉重的心情。这时候已经证实卖牡蛎的就是于勒，发财的美梦破灭了，全家人的心情一落千丈，所以看什么都觉得阴暗，哲尔赛岛也变成了\"紫色的阴影\"。景随情变，用阴暗的景色烘托人物沮丧的心情。\n两处景物描写前后对比，从轻松愉快到沉重压抑，形成了鲜明的反差，有力地烘托了人物心情的变化，推动了情节发展，也从侧面表现了主题。这种\"以景衬情\"的写法，含蓄而有韵味，体现了莫泊桑小说的艺术特色。\n解析：本题考查景物描写的作用。分析景物描写的作用，一定要联系上下文，看它是在什么情境下写的，烘托了人物什么样的心情，对表现主题有什么作用。"},{"id":"g3_chinese_017_ex10","knowledge_id":"g3_chinese_017","question":"简答题：有人说，菲利普夫妇是可憎的，也有人说他们是可怜的。你怎么看？请结合小说内容，谈谈你对菲利普夫妇的看法。\n\n答：________________________________","answer":"答案：我认为菲利普夫妇既可憎又可怜，是一个复杂的、立体的人物形象。\n首先，他们是可憎的。①他们虚荣、势利、冷酷、自私，把金钱看得比亲情还重。于勒有钱时，他们把他捧上天，赞不绝口；于勒没钱时，他们把他踩在脚下，骂他是流氓、贼骨头，连亲弟弟都不肯相认，还躲着走。②他们虚伪、爱面子，明明家里很穷，却要\"衣冠整齐\"地去海边散步，装出体面的样子；明明知道是自己的弟弟，却不肯相认，生怕女儿女婿知道了丢脸。③他们的所作所为，揭露了资本主义社会人与人之间赤裸裸的金钱关系，让人感到可憎可恨。\n其次，他们也是可怜的。①他们是生活在社会底层的小人物，家境贫寒，生活拮据，为了生计而操劳。菲利普只是一个小职员，薪水不高，家里还有两个女儿待嫁，生活压力很大。②他们的势利和冷酷，某种程度上也是社会环境造成的。在那个金钱至上的社会里，没有钱就没有地位，就会被人看不起。他们想通过于勒发财来改变处境，这种想法虽然庸俗，但也反映了小人物的无奈和辛酸。③他们也是受害者，是被金钱社会异化的人，他们扭曲的人性也是社会造成的。\n总之，菲利普夫妇是可憎的，也是可怜的。作者对他们的态度是讽刺中带着同情，批判中带着悲悯。这正是莫泊桑小说的深刻之处，他不是简单地塑造好人坏人，而是写出了人性的复杂和社会的真实。\n解析：本题是开放性题目，考查对人物形象的辩证分析能力。分析人物形象要全面、客观，不能简单化、脸谱化，要看到人物性格的复杂性，言之有理即可。"},{"id":"g3_chinese_018_ex01","knowledge_id":"g3_chinese_018","question":"选择题：下列关于驳论文的说法，不正确的一项是（  ）\nA. 驳论文是议论文的一种，以反驳对方的观点为主\nB. 驳论文只需要反驳对方的论点，不需要有自己的观点\nC. 驳论文可以通过反驳论点、反驳论据、反驳论证三种方式进行\nD. 驳论文在反驳的同时，往往树立自己的正确观点","answer":"答案：B\n解析：驳论文不仅要反驳对方的错误观点，还要在反驳的过程中树立自己的正确观点，做到\"破中有立\"。驳论文的核心是通过反驳错误观点来证明自己观点的正确性。选项A、C、D的表述都是正确的。"},{"id":"g3_chinese_018_ex02","knowledge_id":"g3_chinese_018","question":"选择题：\"有的人活着，他已经死了；有的人死了，他还活着。\"这句话运用的反驳方式是（  ）\nA. 反驳论点\nB. 反驳论据\nC. 反驳论证\nD. 对比论证","answer":"答案：A\n解析：这句话通过对比两种人的不同人生价值，直接反驳了\"活着就是一切\"的错误论点，属于反驳论点的方式。作者用鲜明的对比指出，有的人虽然生命存在，但精神已经死亡；有的人虽然生命逝去，但精神永存。这是从根本上否定对方论点的正确性。"},{"id":"g3_chinese_018_ex03","knowledge_id":"g3_chinese_018","question":"填空题：驳论文的三种基本反驳方式是______、______、______。","answer":"答案：反驳论点、反驳论据、反驳论证\n解析：反驳论点是直接证明对方论点的错误；反驳论据是证明对方论据的虚假或不足，从而动摇其论点；反驳论证是指出对方论证过程中的逻辑错误，证明其论点与论据之间没有必然联系。三种方式可以单独使用，也可以结合使用。"},{"id":"g3_chinese_018_ex04","knowledge_id":"g3_chinese_018","question":"选择题：某文章说：\"读书无用，因为很多大学生毕业找不到工作。\"如果要反驳这一观点，最有力的方式是（  ）\nA. 反驳论点：直接说读书是有用的\nB. 反驳论据：指出找不到工作的大学生只是少数，大部分都能就业\nC. 反驳论证：指出找不到工作不能证明读书无用，两者没有因果关系\nD. 以上方式都可以，但反驳论证最深刻","answer":"答案：D\n解析：这三种方式都可以用来反驳这一观点。反驳论点直接亮明观点；反驳论据指出其论据以偏概全；反驳论证则从根本上指出\"找不到工作\"与\"读书无用\"之间没有必然的因果联系，读书的价值不仅体现在就业上，还体现在个人素养、思维能力等多个方面。三种方式结合使用效果最佳。"},{"id":"g3_chinese_018_ex05","knowledge_id":"g3_chinese_018","question":"填空题：驳论文的写作结构一般是：先______，再______，最后______。","answer":"答案：树靶子（摆出错误观点）、打靶子（反驳错误观点）、立观点（树立正确观点）\n解析：驳论文的基本思路是：首先摆出对方的错误论点或论据，作为反驳的\"靶子\"；然后运用各种方法进行反驳，即\"打靶子\"；最后在反驳的基础上树立自己的正确观点，做到破立结合。"},{"id":"g3_chinese_018_ex06","knowledge_id":"g3_chinese_018","question":"选择题：下列对\"反驳论证\"的理解，正确的一项是（  ）\nA. 反驳论证就是指出对方论点是错误的\nB. 反驳论证就是证明对方的论据是不真实的\nC. 反驳论证就是揭示对方论点与论据之间的逻辑矛盾\nD. 反驳论证就是用事实说话","answer":"答案：C\n解析：反驳论证是指通过分析对方的论证过程，指出其论点与论据之间没有必然的逻辑联系，或者其论证过程存在逻辑错误（如偷换概念、以偏概全、因果倒置等），从而证明对方的论点不能成立。选项A是反驳论点，选项B是反驳论据，选项D太笼统。"},{"id":"g3_chinese_018_ex07","knowledge_id":"g3_chinese_018","question":"阅读理解：阅读下面的文段，回答问题。\n\n①\"近朱者赤，近墨者黑\"，这句话常被用来说明环境对人的影响。②然而，这句话并不完全正确。③一个人如果意志坚定、有明确的目标，即使身处不良环境，也能保持自己的本色。④屈原身处混浊的官场，却能\"出淤泥而不染\"；周恩来在白色恐怖的环境中，始终坚守共产主义信仰。⑤可见，近墨者未必黑，关键在于个人的意志和信念。\n\n问题：这段文字的反驳方式是什么？请简要分析。","answer":"答案：这段文字运用了反驳论点的方式。\n解析：作者首先摆出\"近朱者赤，近墨者黑\"这一传统观点作为反驳的靶子，然后提出\"近墨者未必黑\"的观点，接着用屈原\"出淤泥而不染\"和周恩来在白色恐怖中坚守信仰两个具体事例作为论据，直接证明了原论点的片面性，从而树立了\"关键在于个人的意志和信念\"的正确观点。这是典型的反驳论点，用事实论据直接证明对方论点的错误。"},{"id":"g3_chinese_018_ex08","knowledge_id":"g3_chinese_018","question":"选择题：\"中国有一部分人确实失掉了自信力，但这并不等于全体中国人都失掉了自信力。\"这句话运用的反驳方式是（  ）\nA. 反驳论点，直接指出对方论点错误\nB. 反驳论据，指出对方论据不充分\nC. 反驳论证，指出对方以偏概全的逻辑错误\nD. 以上都不是","answer":"答案：C\n解析：这句话指出了对方论证过程中的逻辑错误——以偏概全。对方用\"一部分人失掉自信力\"的论据，推出\"全体中国人失掉自信力\"的结论，这在逻辑上是不成立的，因为部分不能代替整体。作者正是抓住了这个论证漏洞进行反驳，属于反驳论证的方式。"},{"id":"g3_chinese_018_ex09","knowledge_id":"g3_chinese_018","question":"填空题：驳论文中\"破\"与\"立\"的关系是：______是手段，______是目的；______是为了更好地______。","answer":"答案：破、立、破、立\n解析：在驳论文中，\"破\"是指反驳错误观点，\"立\"是指树立正确观点。破是手段，立是目的；破是为了更好地立。驳论文的最终目的不是单纯地否定对方，而是通过反驳错误观点来确立正确的观点，让读者接受正确的认识。因此，写驳论文要做到破立结合，有破有立。"},{"id":"g3_chinese_018_ex10","knowledge_id":"g3_chinese_018","question":"阅读理解：阅读下面的材料，按要求答题。\n\n某班同学在讨论\"逆境是否有利于成才\"时，甲同学说：\"逆境不利于成才，因为很多人在逆境中消沉了，比如方仲永就是因为环境不好才最终'泯然众人矣'的。\"\n\n问题：请你运用驳论文的知识，分析甲同学的论证有什么问题，并进行反驳。","answer":"答案：甲同学的论证存在两个问题：一是以偏概全，二是论据不当。\n解析：（1）以偏概全的逻辑错误：甲同学用\"很多人在逆境中消沉\"这一现象，推出\"逆境不利于成才\"的普遍性结论，这是以偏概全。事实上，也有很多人在逆境中成才，如司马迁受宫刑而著《史记》，贝多芬失聪却谱写出不朽乐章。\n（2）论据不当：方仲永的例子不能证明逆境不利于成才。方仲永\"泯然众人\"的原因是他父亲\"日扳仲永环谒于邑人，不使学\"，是缺乏后天教育，而不是逆境的问题。恰恰相反，方仲永年少时家境贫寒（逆境）却能天资出众，后来条件好了（顺境）反而退步了。\n因此，甲同学的论证在逻辑和论据上都存在问题，不能证明\"逆境不利于成才\"的观点。"},{"id":"g3_chinese_019_ex01","knowledge_id":"g3_chinese_019","question":"选择题：《中国人失掉自信力了吗》的作者是（  ）\nA. 鲁迅\nB. 茅盾\nC. 郭沫若\nD. 巴金","answer":"答案：A\n解析：《中国人失掉自信力了吗》是鲁迅先生于1934年9月25日写的一篇著名的驳论文，选自《且介亭杂文》。当时，日本帝国主义的铁蹄在践踏了东北三省之后，又向关内步步紧逼，亡国灭种的威胁迫在眉睫，悲观失望的情绪主宰了一部分人的头脑。针对这种错误论调，鲁迅先生写下了这篇文章，批驳了错误观点，鼓舞了民族自信心。"},{"id":"g3_chinese_019_ex02","knowledge_id":"g3_chinese_019","question":"选择题：对方的错误论点是（  ）\nA. 中国人失掉自信力了\nB. 中国有一部分人失掉了自信力\nC. 中国人从来就没有自信力\nD. 中国人现在正在发展着自信力","answer":"答案：A\n解析：文章标题就直接亮出了对方的错误论点——\"中国人失掉自信力了\"。这是当时舆论界流行的一种悲观论调，认为中华民族已经失去了自信力。鲁迅先生正是针对这一错误观点进行批驳，指出\"我们有并不失掉自信力的中国人在\"，极大地鼓舞了民族自信心。"},{"id":"g3_chinese_019_ex03","knowledge_id":"g3_chinese_019","question":"填空题：文章中对方用以证明论点的三个论据是：______、______、______。","answer":"答案：两年以前，我们总自夸着\"地大物博\"；不久就不再自夸了，只希望着国联；现在是既不夸自己，也不信国联，改为一味求神拜佛，怀古伤今了\n解析：这是文章开头摆出的对方的三个论据。作者用这些看似\"事实\"的论据，通过层层递进的方式揭示了对方论点的虚假性。这三个阶段分别代表了三种不同的心态：从自我吹嘘到依赖外援，再到求神拜佛，一步步走向沉沦。"},{"id":"g3_chinese_019_ex04","knowledge_id":"g3_chinese_019","question":"选择题：文章中作者说\"中国人现在是在发展着'自欺力'\"，这里的\"自欺力\"指的是（  ）\nA. 自我欺骗的能力\nB. 自我安慰的心理\nC. 求神拜佛、麻醉自己的行为\nD. 以上都是","answer":"答案：D\n解析：作者所说的\"自欺力\"是指一部分中国人面对现实困境，不去正视问题、寻求解决办法，而是通过求神拜佛、怀古伤今等方式自我麻醉、自我欺骗。这是对当时社会上一部分人精神状态的深刻批判，指出他们不是在发展自信力，而是在发展自欺力。"},{"id":"g3_chinese_019_ex05","knowledge_id":"g3_chinese_019","question":"填空题：\"我们从古以来，就有______的人，有______的人，有______的人，有______的人……虽是等于为帝王将相作家谱的所谓'正史'，也往往掩不住他们的光耀，这就是______。\"","answer":"答案：埋头苦干、拼命硬干、为民请命、舍身求法、中国的脊梁\n解析：这是文章中的名句，也是作者提出的正面论点的有力论据。作者列举了四种人：埋头苦干的人（指广大劳动人民和科学家）、拼命硬干的人（指反抗剥削压迫的革命者和民族英雄）、为民请命的人（指关心人民疾苦的正直官员和知识分子）、舍身求法的人（指为追求真理而献身的人）。这些人是\"中国的脊梁\"，是中华民族的中坚力量。"},{"id":"g3_chinese_019_ex06","knowledge_id":"g3_chinese_019","question":"选择题：对\"中国的脊梁\"理解不正确的一项是（  ）\nA. \"中国的脊梁\"是指那些埋头苦干、拼命硬干、为民请命、舍身求法的人\nB. \"中国的脊梁\"是中华民族的中坚力量\nC. \"中国的脊梁\"主要指的是帝王将相等历史名人\nD. \"中国的脊梁\"体现了中华民族不屈不挠的精神","answer":"答案：C\n解析：\"中国的脊梁\"指的是那些埋头苦干、拼命硬干、为民请命、舍身求法的人，他们是中华民族的中坚力量，体现了中华民族不屈不挠的精神。而帝王将相大多是\"正史\"的主角，作者说\"虽是等于为帝王将相作家谱的所谓'正史'，也往往掩不住他们的光耀\"，说明\"中国的脊梁\"不是帝王将相，而是那些被正史所忽略的真正的民族英雄。"},{"id":"g3_chinese_019_ex07","knowledge_id":"g3_chinese_019","question":"阅读理解：阅读下面的语段，回答问题。\n\n\"从公开的文字上看起来：两年以前，我们总自夸着'地大物博'，是事实；不久就不再自夸了，只希望着国联，也是事实；现在是既不夸自己，也不信国联，改为一味求神拜佛，怀古伤今了——却也是事实。于是有人慨叹曰：中国人失掉自信力了。\"\n\n问题：这段文字在文章中的作用是什么？作者为什么要先承认这些是\"事实\"？","answer":"答案：这段文字的作用是摆出对方的论点和论据，为下文的反驳树立靶子。作者先承认这些是\"事实\"，是为了先\"抬\"后\"压\"，先肯定对方论据的真实性，然后通过分析论证，指出这些论据不能证明\"中国人失掉自信力\"的论点，从而使反驳更有力量。\n解析：这是驳论文常用的写法：先摆出对方的论点和论据，然后进行反驳。作者先承认对方说的都是\"事实\"，这样可以先让一步，使对方放松警惕，然后笔锋一转，从这些\"事实\"中得出截然不同的结论，指出这些事实只能证明一部分人失掉了\"他信力\"，发展着\"自欺力\"，而不能证明全体中国人失掉了自信力。这种写法叫做\"欲擒故纵\"，使反驳更加有力。"},{"id":"g3_chinese_019_ex08","knowledge_id":"g3_chinese_019","question":"选择题：本文的论证方式是（  ）\nA. 立论\nB. 驳论\nC. 立论与驳论相结合\nD. 以上都不是","answer":"答案：C\n解析：本文是一篇典型的驳论文，但驳论与立论相结合。文章前半部分主要是驳论，通过反驳对方的论证过程（以偏概全），指出对方的论点不能成立；后半部分主要是立论，提出\"我们有并不失掉自信力的中国人在\"的正面论点，并用事实加以证明。破立结合，有力地批驳了错误观点，鼓舞了民族自信心。"},{"id":"g3_chinese_019_ex09","knowledge_id":"g3_chinese_019","question":"填空题：文章最后说：\"说中国人失掉了自信力，用以指一部分人则可，倘若加于全体，那简直是诬蔑。\"这句话指出了对方论证的错误是______。要论中国人自信力的有无，应该看______。","answer":"答案：以偏概全（用部分代替整体）、他们的筋骨和脊梁（要看中国的脊梁）\n解析：作者在文章结尾一针见血地指出了对方论证的逻辑错误——以偏概全，用一部分人的情况来推断全体中国人的情况，这是诬蔑。同时，作者指出了正确的评价标准：要看\"中国的脊梁\"，要看那些埋头苦干、拼命硬干、为民请命、舍身求法的人，他们才是中华民族的代表。"},{"id":"g3_chinese_019_ex10","knowledge_id":"g3_chinese_019","question":"阅读理解：阅读下面的文字，回答问题。\n\n\"我们从古以来，就有埋头苦干的人，有拼命硬干的人，有为民请命的人，有舍身求法的人……虽是等于为帝王将相作家谱的所谓'正史'，也往往掩不住他们的光耀，这就是中国的脊梁。\"\n\n问题：（1）请分别举例说明\"埋头苦干的人\"、\"拼命硬干的人\"、\"为民请命的人\"、\"舍身求法的人\"各指什么样的人？（2）作者为什么说他们是\"中国的脊梁\"？","answer":"答案：（1）埋头苦干的人：指为了国家和人民的利益，辛勤劳作、默默奉献的人，如毕昇、李时珍等科学家、发明家；拼命硬干的人：指为了民族独立和人民解放，英勇斗争、不怕牺牲的人，如岳飞、文天祥等民族英雄；为民请命的人：指关心人民疾苦，为人民利益而奔走呼号的人，如包拯、海瑞等清官；舍身求法的人：指为追求真理而不惜牺牲生命的人，如谭嗣同、李大钊等革命志士。\n（2）因为这些人是中华民族的中坚力量，他们代表着中华民族的精神和希望，他们就像脊梁一样支撑着中华民族的大厦，使中华民族历经磨难而不衰。作者用\"中国的脊梁\"这个比喻，高度赞扬了这些人的精神品格，也表达了对中华民族前途的信心。\n解析：这道题考查对文章重点语句的理解。作者列举的四种人，涵盖了中华民族历史上不同类型的优秀人物，他们虽然身份不同、事迹各异，但都体现了中华民族的精神。\"中国的脊梁\"这个比喻非常形象，既说明了这些人的重要作用，也表达了作者的赞美之情。"},{"id":"g3_chinese_020_ex01","knowledge_id":"g3_chinese_020","question":"选择题：《创造宣言》的作者是（  ）\nA. 陶行知\nB. 蔡元培\nC. 叶圣陶\nD. 梁启超","answer":"答案：A\n解析：《创造宣言》的作者是陶行知先生。陶行知是我国近现代著名的教育家，他提出了\"生活即教育\"\"社会即学校\"\"教学做合一\"等著名教育理论，创办了晓庄师范等学校，为中国的教育事业做出了巨大贡献。《创造宣言》写于1943年，是陶行知先生为了鼓励人们培养创造精神而写的一篇战斗檄文。"},{"id":"g3_chinese_020_ex02","knowledge_id":"g3_chinese_020","question":"选择题：下列不属于文章中反驳的五种错误观点的是（  ）\nA. 环境太平凡了，不能创造\nB. 生活太单调了，不能创造\nC. 年纪太小，不能创造\nD. 身体不好，不能创造","answer":"答案：D\n解析：文章中反驳了五种\"不能创造\"的错误观点，分别是：（1）环境太平凡了，不能创造；（2）生活太单调了，不能创造；（3）年纪太小，不能创造；（4）我是太无能了，不能创造；（5）山穷水尽，走投无路，陷入绝境，等死而已，不能创造。\"身体不好，不能创造\"不在这五种观点之列。"},{"id":"g3_chinese_020_ex03","knowledge_id":"g3_chinese_020","question":"填空题：文章的中心论点是：______。作者在文章结尾发出的宣言是：______。","answer":"答案：处处是创造之地，天天是创造之时，人人是创造之人；只要有一滴汗，一滴血，一滴热情，便是创造之神所爱住的行宫，就能开创造之花，结创造之果，繁殖创造之森林\n解析：文章的中心论点是\"处处是创造之地，天天是创造之时，人人是创造之人\"。作者通过反驳五种错误观点，层层递进地论证了这个中心论点。在文章结尾，作者以饱满的热情发出了创造宣言，号召大家用自己的汗水、鲜血和热情去创造，让创造之神常驻人间，开出绚丽的创造之花，结出丰硕的创造之果。"},{"id":"g3_chinese_020_ex04","knowledge_id":"g3_chinese_020","question":"选择题：文章在反驳\"环境太平凡了，不能创造\"这一观点时，用的事例是（  ）\nA. 监狱中的囚徒创造了不少名著\nB. 雕刻家、画家、音乐家在平凡中创造出不平凡的作品\nC. 莫扎特、爱迪生在小时候就有创造发明\nD. 玄奘、哥伦布在困境中取得成功","answer":"答案：B\n解析：在反驳\"环境太平凡了，不能创造\"时，作者举了雕刻家、画家、音乐家的例子，指出他们能在平凡的石头、色彩、声音中创造出不朽的杰作，说明平凡的环境同样可以创造。选项A是反驳\"生活太单调了，不能创造\"的例子，选项C是反驳\"年纪太小，不能创造\"的例子，选项D是反驳\"山穷水尽，走投无路，陷入绝境，等死而已，不能创造\"的例子。"},{"id":"g3_chinese_020_ex05","knowledge_id":"g3_chinese_020","question":"填空题：\"创造主未完成之工作，让我们接过来，继续创造。\"这句话中，\"创造主\"指的是______，这句话的意思是______。","answer":"答案：上帝（或造物主）；我们要接过前人未完成的事业，继续创造，不断开拓创新\n解析：这句话是文章的开头，作者从宗教典故入手，说上帝创造世界后就休息了，而人类要继续创造。这里的\"创造主\"指的是西方宗教中的上帝。作者借用这个典故，意在说明人类不能满足于已有的世界，要在上帝创造的基础上继续创造，不断开拓创新。这句话开门见山，点明了创造的主题。"},{"id":"g3_chinese_020_ex06","knowledge_id":"g3_chinese_020","question":"选择题：对本文的写作特点分析不正确的一项是（  ）\nA. 本文是一篇驳论文，采用了先破后立的写法\nB. 文章大量运用排比、比喻等修辞手法，气势磅礴\nC. 文章主要用道理论证来证明论点\nD. 文章语言生动形象，富有感染力","answer":"答案：C\n解析：本文主要运用了举例论证的方法，而不是道理论证。作者在反驳每一种错误观点时，都列举了具体的事例来证明，如用雕刻家、画家的例子反驳\"环境太平凡\"，用监狱中的例子反驳\"生活太单调\"，用莫扎特、爱迪生的例子反驳\"年纪太小\"，用玄奘、哥伦布的例子反驳\"陷入绝境\"等。大量的事例使文章论证有力，令人信服。"},{"id":"g3_chinese_020_ex07","knowledge_id":"g3_chinese_020","question":"阅读理解：阅读下面的语段，回答问题。\n\n\"有人说：环境太平凡了，不能创造。平凡无过于一张白纸，八大山人挥毫画他几笔，便成为一幅名贵的杰作。平凡也无过于一块石头，到了飞帝亚斯、米开朗基的手里可以成为不朽的塑像。\"\n\n问题：（1）这段话反驳的是什么观点？（2）这段话运用了什么论证方法？（3）这段话告诉我们什么道理？","answer":"答案：（1）反驳的是\"环境太平凡了，不能创造\"的错误观点。\n（2）运用了举例论证的方法，举了八大山人在白纸上作画、飞帝亚斯和米开朗基在石头上雕刻的例子。\n（3）这段话告诉我们：环境平凡不是不能创造的理由，平凡的环境同样可以创造出不平凡的业绩。关键在于人有没有创造的意识和能力，有没有一双发现美的眼睛和一双创造美的手。\n解析：这段话是文章反驳的第一个错误观点。作者用艺术家的创作实践来说明，白纸、石头都是极其平凡的东西，但在艺术家的手中就能变成不朽的艺术珍品。这说明决定创造的不是环境，而是人本身。只要我们有创造的热情和能力，即使在平凡的环境中也能做出不平凡的创造。"},{"id":"g3_chinese_020_ex08","knowledge_id":"g3_chinese_020","question":"选择题：\"活人的塑像和大理石的塑像有一点不同，刀法如果用得不对，可以万像同毁；刀法如果用得对，则一笔下去，画龙点睛。\"对这句话理解正确的一项是（  ）\nA. 活人的塑像比大理石的塑像更难\nB. 教育方法很重要，方法不对，会毁了很多人；方法对头，就能培养出人才\nC. 画画要讲究刀法\nD. 大理石雕像是死的，人是活的","answer":"答案：B\n解析：这句话用比喻的手法，把教育比作塑像，把教育方法比作刀法。作者的意思是，教育人的工作比雕刻石头更复杂，如果教育方法不对，就会毁了很多人；如果教育方法正确，就能点石成金，培养出优秀的人才。这里的\"万像同毁\"指很多人被错误的教育毁掉，\"画龙点睛\"指正确的教育能使人成才。"},{"id":"g3_chinese_020_ex09","knowledge_id":"g3_chinese_020","question":"填空题：文章中说\"遭遇八十一难之玄奘，毕竟取得佛经；粮水断绝、众叛亲离之哥伦布，毕竟发现了美洲；冻饿病三重压迫下之莫扎尔特，毕竟写出了《安魂曲》。\"这些事例用来反驳______的错误观点，证明了______。","answer":"答案：山穷水尽，走投无路，陷入绝境，等死而已，不能创造；即使陷入绝境，也能创造奇迹，绝境中往往孕育着创造\n解析：这些事例都是在极其困难的绝境中取得巨大成就的例子。玄奘取经路上历经八十一难，哥伦布发现美洲时粮水断绝、众叛亲离，莫扎特在冻饿病三重压迫下写出了不朽的音乐作品。这些例子有力地反驳了\"陷入绝境不能创造\"的错误观点，证明了绝境不是创造的终点，而往往是创造的新起点，只要不放弃，就能在绝境中创造奇迹。"},{"id":"g3_chinese_020_ex10","knowledge_id":"g3_chinese_020","question":"阅读理解：阅读下面的文字，回答问题。\n\n\"处处是创造之地，天天是创造之时，人人是创造之人，让我们至少走两步退一步，向着创造之路迈进吧。像屋檐水一样，一点一滴，滴穿阶沿石。点滴的创造固不如整体的创造，但不要轻视点滴的创造而不为，呆望着大创造从天而降。\"\n\n问题：（1）这段话的主要观点是什么？（2）\"走两步退一步\"是什么意思？（3）\"屋檐水滴穿阶沿石\"这个比喻说明了什么道理？","answer":"答案：（1）主要观点是：创造无处不在，无时不有，人人都能创造，我们要从点滴做起，脚踏实地地去创造。\n（2）\"走两步退一步\"是指创造的道路不是一帆风顺的，有前进也有后退，但总体上是向前发展的。这说明创造需要坚持不懈，不能因为遇到挫折就放弃。\n（3）这个比喻说明了点滴积累的重要性。一点一滴的创造虽然不如整体的创造那样引人注目，但只要坚持不懈，点滴的积累最终能够产生巨大的力量，创造出伟大的业绩。它告诫我们不要轻视小的创造，要从点滴做起，持之以恒。\n解析：这段话是文章的核心观点之一。作者用生动的比喻告诉我们，创造不是少数天才的专利，而是每个人都可以做的事情；创造也不是一蹴而就的，需要点滴积累，需要有不怕失败、持之以恒的精神。这对于我们今天培养创新精神仍然具有重要的指导意义。"},{"id":"g3_chinese_021_ex01","knowledge_id":"g3_chinese_021","question":"选择题：下列关于史传文的说法，不正确的一项是（  ）\nA. 史传文是以记载历史人物和历史事件为主的文章\nB. 《史记》是我国第一部纪传体通史\nC. 史传文只有纪传体一种体例\nD. 史传文通常兼具史学价值和文学价值","answer":"答案：C\n解析：史传文有多种体例，主要包括编年体、纪传体、国别体、纪事本末体等。编年体按时间顺序记载历史，如《左传》《资治通鉴》；纪传体以人物传记为中心，如《史记》《汉书》；国别体按国家分别记载历史，如《国语》《战国策》。因此不能说史传文只有纪传体一种体例。"},{"id":"g3_chinese_021_ex02","knowledge_id":"g3_chinese_021","question":"选择题：被鲁迅誉为\"史家之绝唱，无韵之《离骚》\"的史书是（  ）\nA. 《左传》\nB. 《史记》\nC. 《资治通鉴》\nD. 《汉书》","answer":"答案：B\n解析：鲁迅先生评价《史记》为\"史家之绝唱，无韵之《离骚》\"。\"史家之绝唱\"是说《史记》在史学上的成就最高，\"无韵之《离骚》\"是说《史记》具有很高的文学价值，可以与屈原的《离骚》相媲美。《史记》的作者是西汉的司马迁，它是我国第一部纪传体通史，记载了从传说中的黄帝到汉武帝时期约三千年的历史。"},{"id":"g3_chinese_021_ex03","knowledge_id":"g3_chinese_021","question":"填空题：《史记》的体例包括______、______、______、______、______五部分，其中______是全书的主体。","answer":"答案：本纪、世家、列传、书、表；列传\n解析：《史记》全书共一百三十篇，包括本纪十二篇（记帝王）、世家三十篇（记诸侯）、列传七十篇（记各类人物）、书八篇（记典章制度）、表十篇（记大事年表）。其中列传是全书的主体，占的篇幅最多，记载了从将相大臣到平民百姓等各类人物的事迹，最能体现《史记》的文学价值。"},{"id":"g3_chinese_021_ex04","knowledge_id":"g3_chinese_021","question":"文言文阅读：阅读下面的文段，回答问题。\n\n陈胜者，阳城人也，字涉。吴广者，阳夏人也，字叔。陈涉少时，尝与人佣耕，辍耕之垄上，怅恨久之，曰：\"苟富贵，无相忘。\"佣者笑而应曰：\"若为佣耕，何富贵也？\"陈涉太息曰：\"嗟乎！燕雀安知鸿鹄之志哉！\"\n\n问题：（1）解释下列加点词的意思。\n①尝与人佣耕（  ） ②辍耕之垄上（  ）\n③苟富贵（  ） ④若为佣耕（  ）\n（2）翻译句子：燕雀安知鸿鹄之志哉！\n（3）从这段文字可以看出陈涉是怎样一个人？","answer":"答案：（1）①曾经；②停止；③如果；④你。\n（2）燕雀怎么知道鸿鹄的志向呢！比喻平庸的人不了解杰出人物的远大抱负。\n（3）从这段文字可以看出陈涉出身贫寒，但胸怀大志，不甘心于贫困的处境，有远大的抱负和反抗精神。\n解析：这段文字出自《史记·陈涉世家》，是《史记》中的名篇。文章开头先介绍陈涉的籍贯、身份，然后通过\"与人佣耕\"时的一个细节，表现了陈涉的远大志向。\"燕雀安知鸿鹄之志哉\"这句话，用比喻的手法，把陈涉的远大抱负和同伴们的安于现状作了对比，为下文写陈涉领导大泽乡起义埋下了伏笔。"},{"id":"g3_chinese_021_ex05","knowledge_id":"g3_chinese_021","question":"选择题：下列对史传文特点的概括，不正确的一项是（  ）\nA. 以历史事实为依据，具有真实性\nB. 通过人物的言行表现人物性格\nC. 可以虚构情节，不受历史事实约束\nD. 往往融入作者的思想感情","answer":"答案：C\n解析：史传文是以记载历史人物和历史事件为主的文章，必须以历史事实为依据，不能随意虚构情节。虽然史传文可以有适当的艺术加工，如对人物对话、心理活动的描写，对场景的渲染等，但这些都必须建立在历史事实的基础上，不能违背历史真相。这是史传文与历史小说的根本区别。"},{"id":"g3_chinese_021_ex06","knowledge_id":"g3_chinese_021","question":"填空题：《史记》的作者是______（朝代）的______，他是我国古代伟大的______、______。他因为替李陵辩护而触怒汉武帝，被处以宫刑，但他忍辱负重，完成了这部不朽的著作。","answer":"答案：西汉、司马迁、史学家、文学家\n解析：司马迁是西汉时期伟大的史学家和文学家。他继承父亲司马谈的遗志，撰写《史记》。后因替投降匈奴的李陵辩护，触怒了汉武帝，被处以宫刑。这是一种极其耻辱的刑罚，但司马迁忍辱负重，以惊人的毅力完成了《史记》的写作，实现了\"究天人之际，通古今之变，成一家之言\"的理想。"},{"id":"g3_chinese_021_ex07","knowledge_id":"g3_chinese_021","question":"文言文阅读：阅读下面的文段，回答问题。\n\n项王军壁垓下，兵少食尽，汉军及诸侯兵围之数重。夜闻汉军四面皆楚歌，项王乃大惊曰：\"汉皆已得楚乎？是何楚人之多也！\"项王则夜起，饮帐中。有美人名虞，常幸从；骏马名骓，常骑之。于是项王乃悲歌忼慨，自为诗曰：\"力拔山兮气盖世，时不利兮骓不逝。骓不逝兮可奈何，虞兮虞兮奈若何！\"歌数阕，美人和之。项王泣数行下，左右皆泣，莫能仰视。\n\n问题：（1）这段文字出自哪部史书？作者是谁？（2）解释加点词：①项王军壁垓下（  ）②时不利兮骓不逝（  ）（3）这段文字表现了项羽怎样的性格特点？","answer":"答案：（1）出自《史记》，作者是司马迁。这段文字出自《项羽本纪》。\n（2）①壁：驻军、驻扎；②逝：奔驰、奔跑。\n（3）这段文字表现了项羽多愁善感、英雄末路的悲壮情怀。项羽是一个勇猛善战的英雄，但在四面楚歌的困境中，他也表现出了儿女情长的一面。他悲歌忼慨，泣数行下，既表现了他对虞姬的不舍，也表现了他对自己失败的无奈和悲哀。这个场景让我们看到了项羽性格中柔情的一面，使人物形象更加丰满。\n解析：这段文字是《史记·项羽本纪》中著名的\"垓下之围\"片段。司马迁通过四面楚歌、霸王别姬等细节，生动地刻画了项羽这个悲剧英雄的形象。四面楚歌的背景描写，渲染了悲凉的气氛；项羽的悲歌和眼泪，表现了他内心的痛苦和无奈。这种写法叫做\"以情动人\"，使读者对项羽这个人物产生了复杂的感情。"},{"id":"g3_chinese_021_ex08","knowledge_id":"g3_chinese_021","question":"选择题：下列史学名著与体例对应正确的一项是（  ）\nA. 《左传》——纪传体\nB. 《史记》——编年体\nC. 《战国策》——国别体\nD. 《资治通鉴》——纪事本末体","answer":"答案：C\n解析：《左传》是编年体史书，《史记》是纪传体史书，《战国策》是国别体史书，《资治通鉴》是编年体史书。因此只有选项C对应正确。《战国策》主要记载了战国时期谋臣策士游说各国诸侯的事迹和言论，按东周、西周、秦、齐、楚、赵、魏、韩、燕、宋、卫、中山等国分别编排，是典型的国别体史书。"},{"id":"g3_chinese_021_ex09","knowledge_id":"g3_chinese_021","question":"填空题：阅读史传文的基本方法是：第一步，______；第二步，______；第三步，______。","answer":"答案：疏通文字，读懂内容；理清脉络，把握人物；体会写法，鉴赏评价\n解析：阅读史传文，首先要解决文字障碍，疏通文意，读懂文章的基本内容；其次要理清文章的叙事脉络，把握主要人物的性格特点和主要事迹；最后还要体会作者的写作手法，如人物刻画的方法、叙事的技巧等，并对历史人物和历史事件做出自己的评价。这样才能全面理解史传文的思想内容和艺术特色。"},{"id":"g3_chinese_021_ex10","knowledge_id":"g3_chinese_021","question":"文言文阅读：阅读下面的文段，回答问题。\n\n既克，公问其故。对曰：\"夫战，勇气也。一鼓作气，再而衰，三而竭。彼竭我盈，故克之。夫大国，难测也，惧有伏焉。吾视其辙乱，望其旗靡，故逐之。\"\n\n问题：（1）这段文字出自哪篇文章？选自哪部史书？（2）解释加点词：①既克（  ）②望其旗靡（  ）（3）曹刿认为取得战争胜利的原因有哪些？（4）从这段文字可以看出曹刿是怎样一个人？","answer":"答案：（1）出自《曹刿论战》，选自《左传》。\n（2）①已经战胜；②倒下。\n（3）曹刿认为取得战争胜利的原因有两个：一是抓住了有利的进攻时机——\"彼竭我盈\"之时，即敌方士气衰竭、我方士气正旺的时候；二是在确认敌方没有埋伏的情况下才追击，即\"辙乱旗靡\"之时。\n（4）从这段文字可以看出曹刿是一个有卓越的军事才能、善于把握战机、沉着冷静、谨慎小心的人。\n解析：这段文字是《曹刿论战》的结尾部分，通过曹刿对战争取胜原因的分析，表现了曹刿的军事才能。曹刿的分析包含两个方面：一是关于士气的问题，\"一鼓作气，再而衰，三而竭\"，说明打仗要靠士气，要善于把握进攻的时机；二是关于追击的问题，担心大国可能有埋伏，要\"视其辙乱，望其旗靡\"才能追击，表现了曹刿的谨慎。这段文字充分体现了《左传》善于通过对话表现人物性格的特点。"},{"id":"g3_chinese_022_ex01","knowledge_id":"g3_chinese_022","question":"选择题：《智取生辰纲》节选自（  ）\nA. 《三国演义》\nB. 《水浒传》\nC. 《西游记》\nD. 《红楼梦》","answer":"答案：B\n解析：《智取生辰纲》节选自《水浒传》第十六回，原题为\"杨志押送金银担 吴用智取生辰纲\"。《水浒传》是我国第一部以农民起义为题材的长篇章回体小说，作者一般认为是元末明初的施耐庵。小说描写了北宋末年以宋江为首的一百零八将在山东梁山泊聚义的故事，反映了\"官逼民反\"的社会现实。"},{"id":"g3_chinese_022_ex02","knowledge_id":"g3_chinese_022","question":"选择题：\"生辰纲\"指的是（  ）\nA. 生日吃的蛋糕\nB. 运送生日礼物的队伍\nC. 梁中书给他岳父蔡京送的生日贺礼（十万贯金珠宝贝）\nD. 官府征发的赋税","answer":"答案：C\n解析：\"生辰纲\"指的是北宋末年北京大名府留守梁中书给他的岳父——当朝太师蔡京送的生日贺礼，价值十万贯的金珠宝贝。\"纲\"是旧时成批运输货物的组织。因为这批财物是为蔡京祝寿用的，所以叫\"生辰纲\"。"},{"id":"g3_chinese_022_ex03","knowledge_id":"g3_chinese_022","question":"填空题：智取生辰纲的八条好汉分别是：______、______、______、______、______、______、______、______。其中策划者是______，绰号是______。","answer":"答案：晁盖、吴用、公孙胜、刘唐、阮小二、阮小五、阮小七、白胜；吴用、智多星\n解析：智取生辰纲的八条好汉分别是：托塔天王晁盖、智多星吴用、入云龙公孙胜、赤发鬼刘唐、立地太岁阮小二、短命二郎阮小五、活阎罗阮小七、白日鼠白胜。其中主要策划者是吴用，因为他足智多谋，所以绰号\"智多星\"。整个计划都是吴用一手策划的，充分体现了他的智慧。"},{"id":"g3_chinese_022_ex04","knowledge_id":"g3_chinese_022","question":"选择题：杨志押送生辰纲为什么要选择在天气最热的时候赶路？正确的一项是（  ）\nA. 杨志想尽快赶到东京\nB. 天气热，路上行人少，安全\nC. 强盗一般不会在大热天出来抢劫，这样更安全\nD. 杨志想考验手下军汉的耐力","answer":"答案：C\n解析：杨志选择在天气最热的时候赶路，是因为他考虑到大热天强盗一般不会出来活动，反而早晚凉爽的时候容易遇到强盗。这体现了杨志的精明谨慎。但他没有想到吴用等人正是利用了天热口渴这个条件，用蒙汗药麻倒了他们。杨志虽然精明，但还是中了吴用的计，这更反衬出吴用等人的智慧。"},{"id":"g3_chinese_022_ex05","knowledge_id":"g3_chinese_022","question":"填空题：\"智取生辰纲\"的\"智\"主要体现在三个方面：一是______，利用天热口渴的条件；二是______，卖酒的计策天衣无缝；三是______，让杨志等人放松警惕。","answer":"答案：智用天时、智用地利（或智用计谋）、智用矛盾（或智用人和）\n解析：吴用等人的\"智\"体现在多个方面：一是智用天时，利用天气炎热、军士口渴的有利条件；二是智用地利，选择在黄泥冈这个偏僻的地方下手，松林可以掩护；三是智用计谋，卖酒的计策设计得非常巧妙，先吃一桶酒证明酒中无药，再借舀酒之机下蒙汗药，让人防不胜防；四是智用矛盾，利用杨志与众军汉之间的矛盾，使杨志陷入孤立。"},{"id":"g3_chinese_022_ex06","knowledge_id":"g3_chinese_022","question":"选择题：对杨志的性格特点分析不正确的一项是（  ）\nA. 精明能干，小心谨慎\nB. 武艺高强，有丰富的江湖经验\nC. 粗暴蛮横，不善于团结人\nD. 足智多谋，善于用人","answer":"答案：D\n解析：杨志的性格特点是精明能干、小心谨慎、武艺高强、有丰富的江湖经验，但同时又粗暴蛮横、不善于团结人。他对手下的军汉非打即骂，引起了众人的不满，导致内部矛盾激化，这也是他失败的重要原因之一。杨志虽然精明，但\"足智多谋、善于用人\"不符合他的性格特点，这恰恰是吴用的特点。"},{"id":"g3_chinese_022_ex07","knowledge_id":"g3_chinese_022","question":"阅读理解：阅读下面的语段，回答问题。\n\n那对过众军汉见了，心内痒起来，都待要吃。数中一个看着老都管道：\"老爷爷，与我们说一声！那卖枣子的客人买他一桶吃了，我们胡乱也买他这桶吃，润一润喉也好。其实热渴了，没奈何；这里冈子上又没讨水吃处。老爷方便！\"\n\n老都管见众军所说，自心里也要吃得些，竟来对杨志说：\"那贩枣子客人已买了他一桶酒吃，只有这一桶，胡乱教他们买吃了避暑气。冈子上端的没处讨水吃。\"杨志寻思道：\"俺在远远处望这厮们都买他的酒吃了；那桶里当面也见吃了半瓢，想是好的。打了他们半日，胡乱容他买碗吃罢。\"\n\n问题：（1）这段文字运用了哪些描写方法？（2）杨志为什么最后同意军汉们买酒吃？（3）这表现了吴用等人计策的什么特点？","answer":"答案：（1）这段文字运用了语言描写、心理描写、动作描写等描写方法。\n（2）杨志最后同意军汉们买酒吃，一是因为天确实太热，军汉们口渴难耐；二是因为他亲眼看到贩枣子的客人吃了一桶酒都没事，而且那桶里也当面吃了半瓢，以为酒里没有问题；三是因为他打了军汉们半日，心里也有些过意不去。\n（3）这表现了吴用等人计策的巧妙，他们充分利用了天热口渴的天时条件，又通过当面吃酒打消了杨志的疑虑，让杨志自己走进圈套，防不胜防。\n解析：这段文字是故事的关键部分。吴用等人的计策妙在让杨志\"亲眼所见\"都没有问题，从而放松警惕。其实，药就是在那\"半瓢\"里下的——卖酒的白胜假装去夺瓢，实际上是趁机把蒙汗药倒进了酒里。这种写法叫做\"悬念\"，读者一开始也不知道酒里有药，直到最后才揭晓，增加了故事的吸引力。"},{"id":"g3_chinese_022_ex08","knowledge_id":"g3_chinese_022","question":"选择题：本文的主人公是杨志，但题目却叫\"智取生辰纲\"，其原因是（  ）\nA. 杨志不是主要人物\nB. 故事的重点是表现吴用等人的智慧\nC. 杨志在故事中表现不好\nD. 以上都不对","answer":"答案：B\n解析：本文虽然用了很多笔墨写杨志，但故事的核心是表现吴用等人的智慧。作者用大量笔墨写杨志的精明谨慎、小心戒备，是为了反衬吴用等人的智慧更高明——连杨志这样精明的人都中计了，足见吴用等人计策之妙。这是衬托的写法，杨志只是衬托吴用等人智慧的陪衬人物，所以题目叫\"智取生辰纲\"。"},{"id":"g3_chinese_022_ex09","knowledge_id":"g3_chinese_022","question":"填空题：《水浒传》中\"智取生辰纲\"是梁山好汉聚义的开始。在这之前，好汉们都是各自分散的；通过这件事，他们聚到了一起，然后一起上了梁山。这个故事的主人公杨志，绰号叫______，他是杨家将的后代，因为失陷了______和______，走投无路，后来也上了梁山。","answer":"答案：青面兽、花石纲、生辰纲\n解析：杨志的绰号叫\"青面兽\"，因为他脸上有一块青色的胎记。他是北宋名将杨继业（杨家将）的后代，武艺高强。他先因为押送花石纲在黄河里翻了船，丢了官职；后来又因为押送生辰纲被吴用等人劫走，再次走投无路，最后被迫上了梁山。杨志的命运可以说是\"倒霉透顶\"，但这也从一个侧面反映了当时社会的黑暗。"},{"id":"g3_chinese_022_ex10","knowledge_id":"g3_chinese_022","question":"阅读理解：杨志失陷生辰纲的原因有哪些？请结合全文分析。","answer":"答案：杨志失陷生辰纲的原因是多方面的，既有主观原因，也有客观原因。\n主观原因：（1）杨志性格粗暴蛮横，不善于团结人。他对手下的军汉非打即骂，引起了众人的不满，内部矛盾激化，导致他的命令得不到有效执行。（2）杨志虽然精明，但过于自信，对吴用等人的计策缺乏足够的警惕，最终还是中了计。\n客观原因：（1）天气炎热，军汉们口渴难耐，这是吴用等人利用的\"天时\"。（2）黄泥冈地势偏僻，松林掩护，这是\"地利\"。（3）吴用等人计策巧妙，天衣无缝，让人防不胜防。（4）梁中书的生辰纲本身就是搜刮民脂民膏得来的不义之财，劫富济贫、取不义之财是正义的行为，符合民心。\n综上所述，杨志失陷生辰纲，既有他自身性格的原因，也有吴用等人智慧过人的原因，最根本的原因是当时社会的黑暗和阶级矛盾的尖锐。\n解析：这道题考查对文章内容的整体理解和分析能力。分析杨志失败的原因，要从多个角度入手，既要看杨志自身的问题，也要看对手的特点，还要考虑当时的社会背景。这样分析才能全面、深刻。"},{"id":"g3_chinese_023_ex01","knowledge_id":"g3_chinese_023","question":"选择题：《范进中举》节选自（  ）\nA. 《水浒传》\nB. 《儒林外史》\nC. 《聊斋志异》\nD. 《三国演义》","answer":"答案：B\n解析：《范进中举》节选自清代小说家吴敬梓的长篇讽刺小说《儒林外史》第三回。《儒林外史》是我国古代最杰出的讽刺小说，主要描写封建社会后期知识分子及官绅的活动和精神面貌，批判了科举制度对人的毒害。"},{"id":"g3_chinese_023_ex02","knowledge_id":"g3_chinese_023","question":"选择题：《儒林外史》的作者是（  ）\nA. 蒲松龄\nB. 吴承恩\nC. 吴敬梓\nD. 曹雪芹","answer":"答案：C\n解析：《儒林外史》的作者是清代小说家吴敬梓。吴敬梓（1701-1754），字敏轩，号粒民，晚年又号文木老人，安徽全椒人。他出身于官僚地主家庭，但晚年生活贫困，对科举制度和封建社会的黑暗有深刻的认识，写出了这部不朽的讽刺杰作。"},{"id":"g3_chinese_023_ex03","knowledge_id":"g3_chinese_023","question":"填空题：范进中举前后，胡屠户对他的态度发生了巨大的变化：中举前称范进为______、______；中举后称范进为______、______。这种变化表现了胡屠户______的性格特点。","answer":"答案：现世宝、烂忠厚没用的人；贤婿老爷、文曲星；嫌贫爱富、趋炎附势（或前倨后恭）\n解析：胡屠户是范进的岳父，在范进中举前，他对范进百般辱骂，称他为\"现世宝\"\"烂忠厚没用的人\"，看不起范进；范进中举后，他却一百八十度大转弯，称范进为\"贤婿老爷\"\"文曲星\"，百般奉承。胡屠户态度的前后对比，充分表现了他嫌贫爱富、趋炎附势、前倨后恭的市侩嘴脸，具有强烈的讽刺效果。"},{"id":"g3_chinese_023_ex04","knowledge_id":"g3_chinese_023","question":"选择题：范进中举后为什么会发疯？下列分析最准确的一项是（  ）\nA. 范进太高兴了，乐极生悲\nB. 范进身体不好，经受不住刺激\nC. 科举制度对知识分子的毒害，使范进对功名极度渴望，一旦实现便喜极而疯\nD. 范进本来精神就不正常","answer":"答案：C\n解析：范进中举后发疯，表面上看是因为太高兴了，乐极生悲，但深层原因是科举制度对知识分子的毒害。范进考了二十多次，一直考到五十多岁才中举，他把一生的希望都寄托在科举考试上，功名富贵对他来说比什么都重要。一旦中举，长期积压的喜悦和兴奋突然爆发，就导致了精神失常。作者通过这个情节，深刻地批判了科举制度对人的精神摧残。"},{"id":"g3_chinese_023_ex05","knowledge_id":"g3_chinese_023","question":"填空题：本文最突出的写作手法是______，通过人物______的对比，来达到讽刺的效果。请举出两个例子：①______；②______。","answer":"答案：对比、前后态度；①胡屠户对范进中举前后态度的对比；②张乡绅对范进中举前后态度的对比（或众乡邻对范进中举前后态度的对比）\n解析：对比是本文最突出的写作手法。作者通过多组对比，如胡屠户的前后对比、张乡绅的前后对比、众乡邻的前后对比、范进自己中举前后境遇的对比等，鲜明地揭示了封建社会世态炎凉、趋炎附势的社会风气，达到了强烈的讽刺效果。"},{"id":"g3_chinese_023_ex06","knowledge_id":"g3_chinese_023","question":"选择题：对\"范进中举\"这个故事的主题理解不正确的一项是（  ）\nA. 批判了科举制度对知识分子的毒害\nB. 讽刺了封建社会趋炎附势、世态炎凉的社会风气\nC. 反映了封建社会的黑暗现实\nD. 歌颂了范进坚持不懈、终于成功的精神","answer":"答案：D\n解析：《范进中举》是一篇讽刺小说，作者的写作目的是批判科举制度和封建社会的黑暗，而不是歌颂范进。范进是作者批判的对象，他深受科举制度的毒害，把一生都浪费在科举考试上，甚至连家都养不起，人格也受到了践踏。作者通过范进这个人物，揭露了科举制度对人的精神摧残和对社会的不良影响。"},{"id":"g3_chinese_023_ex07","knowledge_id":"g3_chinese_023","question":"阅读理解：阅读下面的语段，回答问题。\n\n范进不看便罢，看了一遍，又念一遍，自己把两手拍了一下，笑了一声，道：\"噫！好了！我中了！\"说着，往后一交跌倒，牙关咬紧，不省人事。老太太慌了，慌将几口开水灌了过来。他爬将起来，又拍着手大笑道：\"噫！好！我中了！\"笑着，不由分说，就往门外飞跑，把报录人和邻居都吓了一跳。走出大门不多路，一脚踹在塘里，挣起来，头发都跌散了，两手黄泥，淋淋漓漓一身的水。众人拉他不住，拍着笑着，一直走到集上去了。\n\n问题：（1）这段文字描写了什么情景？（2）这段文字运用了哪些描写方法？（3）这段描写有什么作用？","answer":"答案：（1）这段文字描写了范进中举后喜极而疯的情景。\n（2）这段文字运用了动作描写、语言描写、神态描写、外貌描写等多种描写方法。\n（3）这段描写生动形象地刻画了范进中举后发疯的丑态，具有强烈的讽刺效果，深刻地揭露了科举制度对知识分子的精神毒害，批判了封建科举制度的罪恶。\n解析：这段文字是小说的高潮部分，也是最精彩的部分。作者通过细腻的描写，把范进中举后发疯的样子刻画得入木三分：\"看了一遍，又念一遍\"，表现了他不敢相信的心理；\"两手拍了一下，笑了一声\"，表现了他喜出望外的心情；\"往后一交跌倒，牙关咬紧，不省人事\"，表现了他喜极而昏厥的状态；\"往门外飞跑\"\"一脚踹在塘里\"\"头发都跌散了，两手黄泥，淋淋漓漓一身的水\"，更是把他发疯后的丑态刻画得淋漓尽致。这段描写看似夸张，实则有其现实基础，是对科举制度的有力控诉。"},{"id":"g3_chinese_023_ex08","knowledge_id":"g3_chinese_023","question":"选择题：胡屠户打了范进一巴掌，众人为什么\"都笑起来\"？下列理解正确的一项是（  ）\nA. 众人觉得胡屠户打人的样子很滑稽\nB. 众人觉得范进挨打很可笑\nC. 众人知道胡屠户是为了治范进的疯病，这一巴掌打在范进身上，却像是打在胡屠户自己心上一样，所以众人觉得既好笑又讽刺\nD. 众人事不关己，看热闹","answer":"答案：C\n解析：众人的笑是复杂的，既有对胡屠户前倨后恭的嘲讽，也有对范进发疯的可笑之感，但更主要的是对胡屠户的讽刺。胡屠户以前天天骂范进，现在却不敢打了，好不容易打了一下，心里却忐忑不安，还觉得手都疼了，看了看手，越发疼得厉害了。这种前后对比极具讽刺意味，众人的笑就是对此心领神会的反应。"},{"id":"g3_chinese_023_ex09","knowledge_id":"g3_chinese_023","question":"填空题：张乡绅在范进中举前______，范进中举后他______，这表现了张乡绅______的性格特点。作者塑造张乡绅这个人物的作用是______。","answer":"答案：从不理睬范进；主动登门拜访，送银子，送房子；趋炎附势、老奸巨猾；说明在封建社会，一旦中举就会名利双收，这也是读书人热衷于科举的原因之一，深化了主题\n解析：张乡绅是作者塑造的另一个典型人物。他在范进中举前从不理睬范进，甚至连范进是谁都不知道；范进一中举，他立刻登门拜访，又是送银子又是送房子，百般拉拢。他这样做的目的，是为了扩大自己的势力，巩固自己的地位。这个人物说明，中举就意味着金钱、地位、权势，这就是为什么读书人对科举考试趋之若鹜的原因，从而深化了文章的主题。"},{"id":"g3_chinese_023_ex10","knowledge_id":"g3_chinese_023","question":"阅读理解：结合全文，谈谈范进这个人物形象的社会意义。","answer":"答案：范进是封建社会深受科举制度毒害的知识分子的典型形象，他的形象具有深刻的社会意义。\n（1）范进的形象揭露了科举制度对知识分子的精神摧残。范进考了二十多次，从二十多岁考到五十多岁，把一生都耗费在科举考试上，连家庭生活都难以维持，人格也受到了极大的侮辱。中举后竟喜极而疯，精神失常，这充分说明了科举制度对人的毒害之深。\n（2）范进的形象反映了封建社会的世态炎凉。范进中举前，家里穷得揭不开锅，没有人帮助他，连他的岳父都看不起他；一中举，邻居们送米送面，乡绅送钱送房，一个个都来奉承。这种鲜明的对比，深刻地反映了封建社会趋炎附势的社会风气。\n（3）范进的形象批判了封建等级制度。在封建社会，科举考试是读书人改变命运的唯一途径，一旦中举，就身价百倍，进入统治阶层。这种制度造成了人与人之间的不平等，也扭曲了人的灵魂。\n总之，范进这个形象不仅是一个文学典型，更是一面镜子，照出了封建社会的种种弊病，具有深刻的批判意义。\n解析：这道题考查对人物形象社会意义的理解。分析人物形象的社会意义，要把人物放在特定的社会背景中去考察，看这个人物反映了什么样的社会现实，揭示了什么样的社会问题。范进这个人物的意义，就在于他揭露了科举制度的罪恶，反映了封建社会的黑暗现实。"},{"id":"g3_chinese_024_ex01","knowledge_id":"g3_chinese_024","question":"选择题：《三顾茅庐》节选自（  ）\nA. 《水浒传》\nB. 《三国演义》\nC. 《西游记》\nD. 《红楼梦》","answer":"答案：B\n解析：《三顾茅庐》节选自《三国演义》第三十七回\"司马徽再荐名士 刘玄德三顾草庐\"。《三国演义》是我国第一部长篇章回体历史演义小说，作者是元末明初的小说家罗贯中。小说描写了东汉末年和三国时期魏、蜀、吴三个政治集团之间的政治斗争和军事斗争，反映了当时的社会现实。"},{"id":"g3_chinese_024_ex02","knowledge_id":"g3_chinese_024","question":"选择题：\"三顾茅庐\"的两个人物是（  ）\nA. 刘备和曹操\nB. 刘备和诸葛亮\nC. 关羽和张飞\nD. 诸葛亮和周瑜","answer":"答案：B\n解析：\"三顾茅庐\"讲的是刘备为了请诸葛亮出山辅佐自己，三次亲自到诸葛亮隐居的隆中草庐去拜访他的故事。第一次去，诸葛亮外出了；第二次去，诸葛亮又出去闲游了；第三次去，诸葛亮正在睡觉，刘备在门外等候，直到诸葛亮醒来才见面。诸葛亮被刘备的诚意所感动，终于答应出山辅佐刘备。"},{"id":"g3_chinese_024_ex03","knowledge_id":"g3_chinese_024","question":"填空题：在隆中对策中，诸葛亮为刘备分析了天下形势，提出了______的战略构想，即先取______为家，再取______以成鼎足之势，然后图取中原，兴复汉室。","answer":"答案：三分天下、荆州、益州\n解析：这就是著名的\"隆中对\"的核心内容。诸葛亮高瞻远瞩，对当时的天下形势了如指掌。他为刘备规划了三步走的战略：第一步，先取荆州作为根据地；第二步，再攻取益州，形成三分天下的局面；第三步，待时机成熟，从荆州和益州两路北伐，夺取中原，兴复汉室。后来的历史发展，基本上印证了诸葛亮的预见。"},{"id":"g3_chinese_024_ex04","knowledge_id":"g3_chinese_024","question":"选择题：刘备三顾茅庐的根本目的是（  ）\nA. 欣赏诸葛亮的才华，想结识他\nB. 复兴汉室，成就霸业\nC. 想让诸葛亮帮他打仗\nD. 以上都是","answer":"答案：B\n解析：刘备三顾茅庐的根本目的是请诸葛亮出山辅佐自己，实现兴复汉室、成就霸业的政治理想。刘备是一个有远大政治抱负的人，他不甘心寄人篱下，想要建立自己的基业。他深知要成就大事，必须有杰出的人才辅佐，所以才不辞辛劳，三顾茅庐，请诸葛亮出山。"},{"id":"g3_chinese_024_ex05","knowledge_id":"g3_chinese_024","question":"填空题：本文中张飞的性格特点是______，刘备的性格特点是______，诸葛亮的性格特点是______。作者通过______的手法来刻画人物。","answer":"答案：鲁莽急躁、直爽率真；求贤若渴、礼贤下士、真诚宽厚；雄才大略、淡泊名利；对比衬托\n解析：本文通过对比衬托的手法来刻画人物。张飞的鲁莽急躁，反衬出刘备的耐心和诚意；而刘备三顾茅庐的诚意，又衬托出诸葛亮的雄才大略和不同凡响。通过这种多方面的衬托，人物形象更加鲜明突出。"},{"id":"g3_chinese_024_ex06","knowledge_id":"g3_chinese_024","question":"选择题：对\"三顾茅庐\"的故事理解不正确的一项是（  ）\nA. 表现了刘备求贤若渴、礼贤下士的品格\nB. 表现了诸葛亮的雄才大略和不同凡响\nC. 说明要想成就大事，必须尊重人才、重用人才\nD. 诸葛亮故意让刘备跑三趟，是为了摆架子","answer":"答案：D\n解析：诸葛亮并不是故意摆架子。他\"躬耕于南阳\"，本来是\"苟全性命于乱世，不求闻达于诸侯\"，并不想出来做官。他之所以避而不见，一方面是他确实经常外出，另一方面也是在考验刘备的诚意。他需要确认刘备是不是真心想请他出山，是不是一个值得辅佐的明主。最后他被刘备的诚意所感动，才决定出山辅佐刘备，成就了一段君臣相知的佳话。"},{"id":"g3_chinese_024_ex07","knowledge_id":"g3_chinese_024","question":"阅读理解：阅读下面的语段，回答问题。\n\n玄德曰：\"大丈夫抱经世奇才，岂可空老于林泉之下？愿先生以天下苍生为念，开备愚鲁而赐教。\"孔明笑曰：\"愿闻将军之志。\"玄德屏人促席而告曰：\"汉室倾颓，奸臣窃命，备不量力，欲伸大义于天下，而智术浅短，迄无所就。惟先生开其愚而拯其厄，实为万幸！\"\n\n问题：（1）从这段文字可以看出刘备和诸葛亮各是怎样的人？（2）刘备说自己\"智术浅短\"，你怎么看？这体现了刘备怎样的特点？","answer":"答案：（1）刘备：胸怀大志，求贤若渴，真诚谦逊，以天下苍生为念。诸葛亮：胸有丘壑，沉稳持重，在没有了解对方的真实想法之前，不轻易表态。\n（2）刘备说自己\"智术浅短\"，既是自谦，也是实话——他确实在谋略方面有所不足，所以才需要诸葛亮的辅佐。但刘备有知人之明，他知道自己的不足，也知道诸葛亮的才能，所以才会诚心诚意地来请诸葛亮。这体现了刘备谦逊、真诚、有自知之明的特点，也是他能够成就大事的重要原因。\n解析：这段对话是\"隆中对\"的开场，虽然简短，但两个人物的性格特点都展现了出来。刘备直奔主题，表达自己的志向和诚意；诸葛亮则沉着冷静，先问对方的志向，再决定要不要出山。这种对话方式，既符合两个人的身份和性格，也为下文诸葛亮的\"隆中对\"做了铺垫。"},{"id":"g3_chinese_024_ex08","knowledge_id":"g3_chinese_024","question":"选择题：\"身长八尺，面如冠玉，头戴纶巾，身披鹤氅，飘飘然有神仙之概。\"这段外貌描写的是（  ）\nA. 刘备\nB. 关羽\nC. 诸葛亮\nD. 张飞","answer":"答案：C\n解析：这是《三国演义》中对诸葛亮的经典外貌描写。\"身长八尺\"说明诸葛亮身材高大；\"面如冠玉\"形容他面容俊秀；\"头戴纶巾，身披鹤氅\"是当时隐士的装束，显得飘逸脱俗；\"飘飘然有神仙之概\"更是突出了诸葛亮超凡脱俗、不同凡响的气质。这段外貌描写，不仅写出了诸葛亮的外形特点，也暗示了他的智慧和才华。"},{"id":"g3_chinese_024_ex09","knowledge_id":"g3_chinese_024","question":"填空题：《三国演义》中与诸葛亮有关的故事还有很多，例如______、______、______、______等，这些故事都表现了诸葛亮的______。","answer":"答案：草船借箭、空城计、七擒孟获、挥泪斩马谡；足智多谋\n解析：诸葛亮是《三国演义》中的核心人物之一，作者用大量笔墨塑造了这个智慧的化身。与诸葛亮有关的故事数不胜数，如草船借箭、空城计、七擒孟获、挥泪斩马谡、舌战群儒、借东风、三气周瑜、六出祁山等等，这些故事都表现了诸葛亮的足智多谋和忠心耿耿。诸葛亮已经成为了中华民族智慧的象征。"},{"id":"g3_chinese_024_ex10","knowledge_id":"g3_chinese_024","question":"阅读理解：\"三顾茅庐\"的故事为什么能流传千古？谈谈你的理解。","answer":"答案：\"三顾茅庐\"的故事能够流传千古，主要有以下几个原因：\n（1）这个故事塑造了两个令人敬仰的人物形象：刘备的求贤若渴、礼贤下士，诸葛亮的雄才大略、淡泊名利，都为后人所称道。\n（2）这个故事蕴含着深刻的道理：要想成就大事，必须尊重人才、重用人才；人才是事业成功的关键。这个道理在任何时代都有其现实意义。\n（3）这个故事体现了中国传统文化中\"君臣相知\"的理想，刘备和诸葛亮之间的关系成为了君臣关系的典范，为历代统治者和读书人所向往。\n（4）《三国演义》的文学魅力。作者通过生动的描写，把这个故事写得跌宕起伏、引人入胜，具有很强的艺术感染力。\n总之，\"三顾茅庐\"不仅是一个历史故事，更是中国传统文化的一个符号，它所蕴含的思想价值和文化价值，使它能够流传千古，家喻户晓。\n解析：这道题考查对故事的深层理解和分析能力。分析一个故事为什么能流传千古，要从多个角度入手，既要考虑人物形象的魅力，也要考虑故事的思想内涵，还要考虑其文化意义和艺术价值。这样分析才能全面、深刻。"},{"id":"g3_chinese_025_ex01","knowledge_id":"g3_chinese_025","question":"默写题：请默写范仲淹《岳阳楼记》中\"衔远山，吞长江\"之后的四句。","answer":"答案：衔远山，吞长江，浩浩汤汤，横无际涯；朝晖夕阴，气象万千。\n解析：这几句是描写岳阳楼大观的名句，从空间和时间两个角度写出了洞庭湖的雄伟壮阔和变幻多姿。\"衔远山，吞长江\"运用拟人的修辞手法，气势磅礴；\"浩浩汤汤，横无际涯\"从空间上写湖面的广阔；\"朝晖夕阴，气象万千\"从时间上写景色的变化。这几句总写洞庭湖的全景，为下文写迁客骚人的览物之情做铺垫。"},{"id":"g3_chinese_025_ex02","knowledge_id":"g3_chinese_025","question":"默写题：请默写范仲淹《岳阳楼记》中揭示全文主旨、表达作者旷达胸襟和远大政治抱负的名句。","answer":"答案：不以物喜，不以己悲；居庙堂之高则忧其民；处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰\"先天下之忧而忧，后天下之乐而乐\"乎！\n解析：\"不以物喜，不以己悲\"表现了作者旷达的胸襟，不因为外界环境的好坏和个人的得失而或喜或悲；\"先天下之忧而忧，后天下之乐而乐\"表达了作者远大的政治抱负，把国家和人民的利益放在首位，在天下人忧愁之前先忧愁，在天下人快乐之后才快乐。这是全文的主旨句，也是流传千古的名句。"},{"id":"g3_chinese_025_ex03","knowledge_id":"g3_chinese_025","question":"填空题：欧阳修《醉翁亭记》中描写山间朝暮之景的句子是：______，______，晦明变化者，山间之朝暮也。描写四时之景的句子是：野芳发而幽香，______，风霜高洁，______，山间之四时也。","answer":"答案：日出而林霏开、云归而岩穴暝；佳木秀而繁阴、水落而石出者\n解析：《醉翁亭记》中这几句描写山间朝暮和四时之景，非常精彩。写朝暮之景，用\"日出\"和\"云归\"的动态描写，表现光线的明暗变化；写四时之景，抓住每个季节最有代表性的景物特点：春天野花盛开，夏天树木繁茂，秋天天高云淡，冬天水落石出。每句各写一季，语言简练而意境优美。"},{"id":"g3_chinese_025_ex04","knowledge_id":"g3_chinese_025","question":"默写题：请默写苏轼《水调歌头·明月几时有》的下阕（\"转朱阁\"起）。","answer":"答案：转朱阁，低绮户，照无眠。不应有恨，何事长向别时圆？人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。\n解析：词的下阕由中秋望月联想到人间的离别，表达了对亲人的思念之情。\"转朱阁，低绮户，照无眠\"写月光移动，照着无眠的人，暗示思念之深；\"不应有恨，何事长向别时圆\"用埋怨的语气，看似埋怨月亮，实则表达离别的痛苦；\"人有悲欢离合，月有阴晴圆缺，此事古难全\"转为豁达，说明人生不可能完美；\"但愿人长久，千里共婵娟\"表达了对亲人的美好祝愿，成为千古名句。"},{"id":"g3_chinese_025_ex05","knowledge_id":"g3_chinese_025","question":"选择题：下列诗句中，表达作者积极进取精神的一项是（  ）\nA. 欲渡黄河冰塞川，将登太行雪满山\nB. 停杯投箸不能食，拔剑四顾心茫然\nC. 长风破浪会有时，直挂云帆济沧海\nD. 行路难，行路难，多歧路，今安在","answer":"答案：C\n解析：这几句都出自李白的《行路难》（其一）。A、B、D三项都表现了诗人前途迷茫、内心苦闷的心情，而C项\"长风破浪会有时，直挂云帆济沧海\"则表达了诗人对未来充满信心，相信终有一天能实现自己的理想抱负，体现了积极进取的精神。这句诗是千古名句，常用来激励人们在困境中不要放弃希望。"},{"id":"g3_chinese_025_ex06","knowledge_id":"g3_chinese_025","question":"填空题：刘禹锡《酬乐天扬州初逢席上见赠》中运用典故的两句是：______，______。蕴含哲理、表明新事物必将取代旧事物的名句是：______，______。","answer":"答案：怀旧空吟闻笛赋、到乡翻似烂柯人；沉舟侧畔千帆过、病树前头万木春\n解析：\"怀旧空吟闻笛赋\"用向秀作《思旧赋》的典故，表达对已故友人的怀念；\"到乡翻似烂柯人\"用王质烂柯的典故，暗示自己被贬时间之长，世事沧桑。\"沉舟侧畔千帆过，病树前头万木春\"是千古名句，以\"沉舟\"\"病树\"自比，但并不消沉，反而充满乐观精神，说明新事物必将取代旧事物，社会总是向前发展的，蕴含着深刻的哲理。"},{"id":"g3_chinese_025_ex07","knowledge_id":"g3_chinese_025","question":"默写题：请默写张岱《湖心亭看雪》中描写雪景的名句（\"雾凇沆砀\"起）。","answer":"答案：雾凇沆砀，天与云与山与水，上下一白。湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。\n解析：这段文字是描写雪景的千古绝唱。作者用白描的手法，寥寥几笔就勾勒出了一幅水墨雪景图。\"天与云与山与水，上下一白\"写天地之间一片白茫茫，境界开阔；\"一痕\"\"一点\"\"一芥\"\"两三粒\"这些数量词的运用，由大到小，由远及近，写出了大雪弥漫中景物的渺小，营造了一种空旷、寂寥、悠远的意境，体现了作者孤高自赏的情怀。"},{"id":"g3_chinese_025_ex08","knowledge_id":"g3_chinese_025","question":"选择题：下列对《岳阳楼记》和《醉翁亭记》的比较，说法不正确的一项是（  ）\nA. 两篇文章都是宋代散文的名篇，都写于作者被贬之后\nB. 《岳阳楼记》表达了\"先天下之忧而忧，后天下之乐而乐\"的政治抱负，《醉翁亭记》抒发了\"与民同乐\"的思想\nC. 两篇文章都运用了借景抒情的写法\nD. 两篇文章的作者都是\"唐宋八大家\"之一","answer":"答案：D\n解析：《岳阳楼记》的作者是范仲淹，《醉翁亭记》的作者是欧阳修。欧阳修是\"唐宋八大家\"之一，但范仲淹不是\"唐宋八大家\"的成员。\"唐宋八大家\"是唐代的韩愈、柳宗元和宋代的欧阳修、苏洵、苏轼、苏辙、王安石、曾巩。因此D项说法不正确。A、B、C三项的说法都是正确的。"},{"id":"g3_chinese_025_ex09","knowledge_id":"g3_chinese_025","question":"填空题：古诗文默写。\n（1）露从今夜白，______。（杜甫《月夜忆舍弟》）\n（2）______，怜君何事到天涯！（刘长卿《长沙过贾谊宅》）\n（3）云横秦岭家何在？______。（韩愈《左迁至蓝关示侄孙湘》）\n（4）鸡声茅店月，______。（温庭筠《商山早行》）","answer":"答案：（1）月是故乡明；（2）寂寂江山摇落处；（3）雪拥蓝关马不前；（4）人迹板桥霜\n解析：这四句都是唐诗中的名句。（1）杜甫的《月夜忆舍弟》写于安史之乱中，表达了对故乡和亲人的思念，\"月是故乡明\"是千古名句。（2）刘长卿的《长沙过贾谊宅》借凭吊贾谊抒发自己被贬的感慨。（3）韩愈的《左迁至蓝关示侄孙湘》写于被贬潮州途中，表达了忠而获罪的悲愤和坚强不屈的精神。（4）温庭筠的《商山早行》写早行的情景，\"鸡声茅店月，人迹板桥霜\"用六个名词组合，营造了清冷孤寂的意境，是写早行的千古名句。"},{"id":"g3_chinese_025_ex10","knowledge_id":"g3_chinese_025","question":"阅读理解：阅读下面这首词，回答问题。\n\n水调歌头\n苏轼\n\n明月几时有？把酒问青天。不知天上宫阙，今夕是何年。我欲乘风归去，又恐琼楼玉宇，高处不胜寒。起舞弄清影，何似在人间。\n\n转朱阁，低绮户，照无眠。不应有恨，何事长向别时圆？人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。\n\n问题：（1）这首词的上阕和下阕分别写了什么内容？（2）\"人有悲欢离合，月有阴晴圆缺，此事古难全\"蕴含了怎样的哲理？（3）\"但愿人长久，千里共婵娟\"表达了作者怎样的思想感情？为什么成为千古名句？","answer":"答案：（1）上阕写望月问天，表达了对天上宫阙的向往和对人间生活的热爱，在\"出世\"与\"入世\"之间的矛盾纠结，最终表达了对人间的眷恋。下阕写对月怀人，由中秋赏月联想到人间的离别，表达了对亲人的思念和美好的祝愿。\n（2）这句话蕴含的哲理是：世界上不可能有永远圆满的事情，人生有欢聚，也必然有离别，就像月亮有圆的时候，也有缺的时候一样，这是自然的规律，自古以来就是如此。这句话体现了作者豁达乐观的人生态度。\n（3）\"但愿人长久，千里共婵娟\"表达了作者对远方亲人的思念和美好的祝愿，希望亲人能够平安健康，虽然相隔千里，也能共享这美好的月光。\n这句词之所以成为千古名句，是因为它不仅表达了真挚的亲情，更体现了一种豁达乐观的精神，能够超越个人的悲欢离合，把对亲人的思念升华为一种普遍的人类情感，给人以安慰和力量。古往今来，多少离别之人都用这句话来表达自己的思念和祝愿，引起了广泛的共鸣。\n解析：这道题考查对古诗词的理解和鉴赏能力。《水调歌头》是苏轼的代表作之一，也是中秋词中的千古绝唱。鉴赏这首词，要结合作者的生平经历和写作背景，理解词中蕴含的思想感情和人生哲理。苏轼写这首词时，与弟弟苏辙已经七年没有见面了，中秋佳节，望月思亲，写下了这首词。但词人并没有沉浸在离别的痛苦中，而是以豁达乐观的态度对待人生的离别，这正是这首词的可贵之处。"},{"id":"g3_chinese_026_ex01","knowledge_id":"g3_chinese_026","question":"选择题：下列关于小说三要素的说法，不正确的一项是（  ）\nA. 人物是小说的核心，小说通过塑造人物形象来反映社会生活\nB. 故事情节是小说的骨架，包括开端、发展、高潮、结局四部分\nC. 环境描写包括自然环境和社会环境，社会环境是指人物活动的具体场景\nD. 小说的三要素是人物、情节、环境，三者缺一不可","answer":"答案：C\n解析：本题考查对小说三要素的理解。A、B、D三项说法都是正确的。C项说法有误，自然环境是指人物活动的具体场景，如地点、气候、时间、景色、场面等；而社会环境是指能反映社会、时代特征的建筑、场所、陈设等景物以及民俗民风等，它交代了人物的生存环境、社会关系等。环境描写是小说的重要组成部分，对塑造人物、推动情节发展、揭示主题都有重要作用。"},{"id":"g3_chinese_026_ex02","knowledge_id":"g3_chinese_026","question":"填空题：小说塑造人物的方法多种多样，主要有______描写和______描写两大类。其中，______描写又包括外貌、语言、动作、神态、心理等描写方法。","answer":"答案：正面（直接）、侧面（间接）、正面（直接）\n解析：本题考查小说塑造人物的方法。小说塑造人物的方法主要有正面描写（直接描写）和侧面描写（间接描写）两大类。正面描写是直接刻画人物的外貌、语言、动作、神态、心理等，使人物形象直接呈现在读者面前；侧面描写是通过对其他人物或环境的描写来烘托、反衬主要人物，使人物形象更加鲜明突出。两种描写方法往往结合使用，共同塑造丰满的人物形象。"},{"id":"g3_chinese_026_ex03","knowledge_id":"g3_chinese_026","question":"选择题：下列对小说故事情节的理解，正确的一项是（  ）\nA. 小说的故事情节必须按照时间顺序来安排，不能有任何变化\nB. 高潮是故事情节发展的顶点，也是矛盾冲突最激烈的阶段\nC. 结局是故事的收尾，必须交代清楚所有人物的最终命运\nD. 小说的开端部分可以省略，直接进入发展阶段","answer":"答案：B\n解析：本题考查对小说故事情节的理解。A项错误，小说的故事情节可以根据表达需要灵活安排，除了顺叙，还有倒叙、插叙、补叙等叙述方式；B项正确，高潮是故事情节发展到最紧张、最激烈的阶段，主要矛盾冲突在此得到最充分的展现；C项错误，结局是故事的收尾，但不一定非要交代所有人物的命运，有时留有余味反而更好；D项错误，开端是故事情节的起始部分，交代故事发生的背景、原因等，一般不能省略。"},{"id":"g3_chinese_026_ex04","knowledge_id":"g3_chinese_026","question":"简答题：什么是小说的环境描写？环境描写有哪些作用？请结合具体例子简要说明。","answer":"答案：小说的环境描写是指对人物活动的环境和事情发生的背景所作的描写，包括自然环境描写和社会环境描写。\n环境描写的作用主要有：\n1. 交代故事发生的时间、地点，揭示时代背景。如《孔乙己》开头对鲁镇酒店格局的描写，交代了故事发生的社会环境。\n2. 渲染气氛，烘托人物心情。如《孤独之旅》中对暴风雨的描写，渲染了紧张的气氛，烘托了杜小康的恐惧心理。\n3. 衬托人物性格，表现人物品质。如《变色龙》中对广场冷清景象的描写，烘托了沙皇统治下社会的压抑。\n4. 推动故事情节的发展。如《智取生辰纲》中对炎热天气的描写，为下文杨志等人买酒中计埋下伏笔。\n5. 深化作品主题。如《故乡》结尾的景物描写，深化了作者对新生活的向往这一主题。\n解析：本题考查对小说环境描写作用的理解。环境描写是小说三要素之一，在小说中有着重要作用。答题时要全面考虑，从多个角度来分析，并结合具体例子来说明，这样才能回答得充分、到位。"},{"id":"g3_chinese_026_ex05","knowledge_id":"g3_chinese_026","question":"阅读理解：阅读下面这篇小小说，回答问题。\n\n\n**最后一片叶子**（节选）\n\n\n琼珊躺在那里，几乎一动不动，脸对着窗户。她正在数着——倒着数。\n\n\"十二，\"她说，过了一会儿又说\"十一\"，接着是\"十\"\"九\"，再接着是几乎同时说出来的\"八\"和\"七\"。\n\n苏艾关切地向窗外望去。有什么可数的呢？外面见到的只是一个空荡荡、阴沉沉的院子，和二十英尺外的一幢砖砌房屋的墙壁。一株老极了的常春藤，枯萎的叶子几乎落光了，攀附在墙上。\n\n\"亲爱的，怎么啦？\"苏艾问道。\n\n\"六，\"琼珊说，声音低得像耳语，\"它们现在掉得快些了。三天前差不多有一百片。数得我头都疼。现在可容易了。喏，又掉了一片。只剩下五片了。\"\n\n\"五片什么，亲爱的？告诉你的苏艾。\"\n\n\"叶子。常春藤上的叶子。等最后一片掉落下来，我也得去了。三天前我就知道了。难道医生没有告诉你吗？\"\n\n问题：（1）选文中琼珊为什么要数叶子？（2）选文主要运用了什么描写方法来刻画人物？有什么作用？（3）从选文中可以看出琼珊怎样的心理状态？","answer":"答案：（1）琼珊把自己的生命寄托在常春藤的叶子上，认为最后一片叶子掉落的时候，自己的生命也就结束了。她数叶子实际上是在数着自己剩余的日子。\n（2）选文主要运用了语言描写和神态描写来刻画人物。通过琼珊数叶子时的话语和她\"声音低得像耳语\"的状态，生动地表现了琼珊病情严重、内心绝望的状态，同时也表现了苏艾对朋友的关切。\n（3）从选文中可以看出琼珊因为生病而陷入了极度的绝望之中，她对生活失去了信心，把自己的命运寄托在一片叶子上，这种心理是病态的、消极的。\n解析：本题考查对小说内容和人物形象的理解。第（1）题考查对文章内容的理解，要结合上下文来分析琼珊数叶子的原因；第（2）题考查小说的描写方法及其作用，要明确主要运用了什么描写方法，并结合具体内容分析其作用；第（3）题考查对人物心理状态的把握，要从人物的言行中去体会其内心世界。这道题全面考查了小说阅读的基本能力。"},{"id":"g3_chinese_026_ex06","knowledge_id":"g3_chinese_026","question":"选择题：下列关于小说标题作用的说法，不正确的一项是（  ）\nA. 标题可以概括文章的主要内容\nB. 标题可以作为文章的线索，贯穿全文\nC. 标题只能点明写作对象，没有其他作用\nD. 标题可以揭示文章主旨，暗示作者情感","answer":"答案：C\n解析：本题考查对小说标题作用的理解。小说的标题有多种作用：A项正确，标题可以概括文章的主要内容，如《智取生辰纲》就概括了主要事件；B项正确，标题可以作为文章的线索，如《项链》就是以项链为线索贯穿全文；C项错误，标题的作用很多，不仅仅是点明写作对象，还可以有其他多种作用；D项正确，标题可以揭示文章主旨，如《变色龙》就暗示了主人公善变的性格特点，揭示了主题。此外，标题还有设置悬念、吸引读者等作用。"},{"id":"g3_chinese_026_ex07","knowledge_id":"g3_chinese_026","question":"填空题：小说的叙述视角主要有______和______两种。其中，______叙述的叙述者是故事中的人物，以\"我\"的口吻讲述故事；______叙述的叙述者是全知全能的，能够看到所有人物的内心活动。","answer":"答案：第一人称、第三人称、第一人称、第三人称\n解析：本题考查小说的叙述视角。第一人称叙述是以\"我\"的口吻来讲述故事，\"我\"是故事中的人物，这样写的好处是真实可信，便于抒发感情，但只能写\"我\"的所见所闻所感，有一定的局限性。第三人称叙述的叙述者站在旁观者的角度，以\"他\"或\"她\"的口吻讲述故事，叙述者是全知全能的，能够看到所有人物的内心活动，了解所有事情的来龙去脉，这样写的好处是自由灵活，可以从不同角度来叙述故事。两种叙述视角各有优劣，作家会根据表达需要来选择。"},{"id":"g3_chinese_026_ex08","knowledge_id":"g3_chinese_026","question":"简答题：如何分析小说中的人物形象？请简要说说你的方法。","answer":"答案：分析小说中的人物形象，可以从以下几个方面入手：\n1. 通过人物的正面描写来分析。外貌描写可以看出人物的身份、地位、性格等；语言描写可以体现人物的思想感情和性格特点；动作描写可以反映人物的心理和性格；神态描写可以表现人物的内心世界；心理描写可以直接揭示人物的内心活动。\n2. 通过侧面描写来分析。通过其他人物的反应、评价，或者通过环境描写来烘托人物形象。\n3. 通过故事情节来分析。人物的性格是在情节发展中展现出来的，要关注人物在矛盾冲突中的表现。\n4. 关注人物的身份、地位、经历等背景信息，这些都会影响人物的性格和行为。\n5. 结合小说的主题来分析。人物形象往往是为表现主题服务的，要理解作者塑造这个人物的意图。\n解析：本题考查分析小说人物形象的方法。人物是小说的核心，分析人物形象是小说阅读的重点。答题时要条理清晰，从多个角度来回答，并适当举例说明，这样才能答得全面、深入。在阅读小说时，要养成细致分析人物形象的好习惯。"},{"id":"g3_chinese_026_ex09","knowledge_id":"g3_chinese_026","question":"选择题：下列关于小说主题的说法，不正确的一项是（  ）\nA. 小说的主题就是作者通过小说要表达的中心思想\nB. 小说的主题是唯一的，读者不能有其他理解\nC. 小说的主题是通过人物、情节、环境等要素表现出来的\nD. 理解小说主题要联系作品的时代背景和作者的生平","answer":"答案：B\n解析：本题考查对小说主题的理解。A项正确，小说的主题就是作者通过塑造人物、叙述故事所要表达的中心思想，是作品的灵魂；B项错误，小说的主题往往不是单一的，而是丰富的、多义的，不同的读者可能会有不同的理解，正所谓\"一千个读者有一千个哈姆雷特\"；C项正确，小说的主题不是直接说出来的，而是通过人物、情节、环境等要素自然地表现出来的；D项正确，理解小说的主题不能脱离时代背景和作者的生平经历，只有\"知人论世\"，才能更准确地把握作品的主题。"},{"id":"g3_chinese_026_ex10","knowledge_id":"g3_chinese_026","question":"阅读理解：阅读下面的文字，回答问题。\n\n\n**孔乙己**（节选）\n\n\n孔乙己是站着喝酒而穿长衫的唯一的人。他身材很高大；青白脸色，皱纹间时常夹些伤痕；一部乱蓬蓬的花白的胡子。穿的虽然是长衫，可是又脏又破，似乎十多年没有补，也没有洗。他对人说话，总是满口之乎者也，教人半懂不懂的。因为他姓孔，别人便从描红纸上的\"上大人孔乙己\"这半懂不懂的话里，替他取下一个绰号，叫作孔乙己。孔乙己一到店，所有喝酒的人便都看着他笑，有的叫道，\"孔乙己，你脸上又添上新伤疤了！\"他不回答，对柜里说，\"温两碗酒，要一碟茴香豆。\"便排出九文大钱。他们又故意的高声嚷道，\"你一定又偷了人家的东西了！\"孔乙己睁大眼睛说，\"你怎么这样凭空污人清白……\"\"什么清白？我前天亲眼见你偷了何家的书，吊着打。\"孔乙己便涨红了脸，额上的青筋条条绽出，争辩道，\"窃书不能算偷……窃书！……读书人的事，能算偷么？\"接连便是难懂的话，什么\"君子固穷\"，什么\"者乎\"之类，引得众人都哄笑起来：店内外充满了快活的空气。\n\n\n问题：（1）选文开头画线句在文中有什么作用？（2）选文主要运用了哪些描写方法来刻画孔乙己这个人物？试举例说明。（3）选文中多次写到众人的\"笑\"，这有什么深意？","answer":"答案：（1）\"站着喝酒而穿长衫\"是孔乙己最鲜明的特点，这句话概括了孔乙己的特殊身份，既写出了他经济地位低下（站着喝酒），又写出了他思想意识上的优越感（穿长衫），生动地点出了孔乙己的尴尬处境，总领下文对孔乙己的描写。\n（2）选文运用了多种描写方法：①外貌描写：\"他身材很高大；青白脸色，皱纹间时常夹些伤痕；一部乱蓬蓬的花白的胡子。穿的虽然是长衫，可是又脏又破\"，这些描写形象地刻画了孔乙己的形象，暗示了他的身世遭遇和性格特点。②语言描写：\"窃书不能算偷……窃书！……读书人的事，能算偷么？\"满口之乎者也，表现了他自命清高、迂腐不堪的性格。③神态描写：\"涨红了脸，额上的青筋条条绽出\"，表现了他被人揭短时的窘迫和气愤。④动作描写：\"便排出九文大钱\"的\"排\"字，写出了他故作姿态的样子。\n（3）众人的\"笑\"是麻木的笑、无聊的笑。用众人的笑来衬托孔乙己的可悲，以乐景写哀情，更增添了悲剧意味。这笑声反映了当时社会人与人之间的冷漠无情，揭示了国民精神的麻木愚昧，深化了小说的主题。\n解析：本题考查对小说选段的综合阅读理解能力。第（1）题考查关键句的作用，要结合内容和结构两方面来分析；第（2）题考查人物描写方法，要从文中找出具体例子并分析其作用；第（3）题考查对重要内容的深层理解，要结合小说主题来分析\"笑\"的深意。解答这类题目，要在读懂文本的基础上，结合小说的相关知识来回答。"},{"id":"g3_chinese_027_ex01","knowledge_id":"g3_chinese_027","question":"填空题：《孔乙己》的作者是______，原名______，字豫才，浙江绍兴人，是我国现代伟大的文学家、思想家、革命家。本文选自小说集《______》。","answer":"答案：鲁迅、周树人、呐喊\n解析：本题考查文学常识。鲁迅是中国现代文学的奠基人，原名周树人，字豫才，浙江绍兴人。《孔乙己》是鲁迅的短篇小说代表作之一，写于1918年冬，最初发表在1919年4月《新青年》第六卷第四号上，后收入小说集《呐喊》。鲁迅的小说集有《呐喊》《彷徨》《故事新编》，散文集有《朝花夕拾》，散文诗集有《野草》，杂文集有《坟》《热风》《华盖集》等。"},{"id":"g3_chinese_027_ex02","knowledge_id":"g3_chinese_027","question":"选择题：下列对《孔乙己》一文的理解，不正确的一项是（  ）\nA. 小说以\"我\"（小伙计）的口吻来叙述故事，使故事显得真实可信\nB. 孔乙己是一个深受封建科举制度毒害的下层知识分子形象\nC. 小说中多次写到众人的笑，这笑声表现了人们乐观积极的生活态度\nD. 小说的主题是批判封建科举制度的罪恶和国民精神的麻木","answer":"答案：C\n解析：本题考查对《孔乙己》内容和主题的理解。A、B、D三项说法都是正确的。C项说法有误，小说中多次写到众人的笑，这不是乐观积极的笑，而是麻木的笑、无聊的笑。在封建社会中，民众精神麻木，他们把自己的快乐建立在别人的痛苦之上，拿孔乙己的不幸来取乐。作者写这笑声，是为了批判国民的劣根性，以乐景写哀情，更增添了悲剧意味。"},{"id":"g3_chinese_027_ex03","knowledge_id":"g3_chinese_027","question":"填空题：《孔乙己》以\"我\"——______的所见所闻为线索来组织材料，\"我\"在文中既是______，又是______。文章开头对鲁镇酒店格局的描写属于______描写，交代了故事发生的社会环境。","answer":"答案：小伙计（咸亨酒店的小伙计）、叙事者、线索人物、环境（社会环境）\n解析：本题考查对小说线索和叙述视角的理解。《孔乙己》以小伙计\"我\"的见闻感受为线索来叙述故事，这样写的好处是：第一，故事由\"我\"这个小伙计讲出来，显得真实可信；第二，通过\"我\"的眼光来看孔乙己，更能表现周围人对孔乙己的态度；第三，\"我\"也是一个被冷落、被歧视的人，连\"我\"都看不起孔乙己，更能说明孔乙己的悲惨。开头对鲁镇酒店格局的描写属于社会环境描写，交代了当时的社会背景，为孔乙己的出场做了铺垫。"},{"id":"g3_chinese_027_ex04","knowledge_id":"g3_chinese_027","question":"简答题：孔乙己是一个怎样的人物形象？请结合课文内容简要分析。","answer":"答案：孔乙己是一个深受封建科举制度毒害的下层知识分子形象，他的性格具有复杂性：\n1. 自命清高、迂腐不堪：他虽然穷困潦倒，却不肯脱下那件又脏又破的长衫，说话满口之乎者也，认为\"万般皆下品，惟有读书高\"，以读书人自居。\n2. 好喝懒做、自欺欺人：他不肯劳动，连笔墨书籍都要散失，偶尔做些抄书的活也坐不住，却经常到酒店喝酒。被人揭穿偷书时，还强词夺理说\"窃书不能算偷\"。\n3. 善良诚实、有羞耻心：他教小伙计写字，给孩子们分茴香豆，从不拖欠酒钱，这些都说明他本性善良。被人嘲笑时会\"涨红了脸\"，说明他还有羞耻之心。\n4. 可怜可悲、命运悲惨：他在社会上没有地位，受人嘲笑和欺凌，最后因为偷窃被打折了腿，在人们的笑声中走向死亡。\n总之，孔乙己是一个既可笑又可怜、既可悲又可叹的人物，他是封建科举制度的牺牲品。\n解析：本题考查对孔乙己人物形象的分析。分析人物形象要全面，不能简单化、脸谱化。孔乙己的性格是复杂的，既有迂腐、懒惰、自欺欺人的一面，也有善良、诚实的一面。他既是封建科举制度的受害者，自身也有性格弱点。答题时要结合课文中的具体描写来分析，做到有理有据。"},{"id":"g3_chinese_027_ex05","knowledge_id":"g3_chinese_027","question":"选择题：\"孔乙己是站着喝酒而穿长衫的唯一的人\"这句话在文中的作用，理解不正确的一项是（  ）\nA. 这句话是对孔乙己整体形象的概括，是文章的总起句\nB. \"站着喝酒\"说明孔乙己经济地位低下，和短衣帮一样\nC. \"穿长衫\"说明孔乙己思想上仍以读书人自居，不愿与短衣帮为伍\nD. 这句话主要是为了说明孔乙己喜欢穿长衫，有特别的审美趣味","answer":"答案：D\n解析：本题考查对关键句的理解。\"孔乙己是站着喝酒而穿长衫的唯一的人\"是全文最精彩的一句话，概括了孔乙己的特殊身份和尴尬处境。A、B、C三项的理解都是正确的。D项理解有误，这句话不是为了说明孔乙己的审美趣味，而是为了揭示他的矛盾处境：经济上他和短衣帮一样贫困，只能站着喝酒；思想上他又以读书人自居，不肯脱下长衫。这种矛盾正是孔乙己性格的核心特征，也预示了他的悲剧命运。"},{"id":"g3_chinese_027_ex06","knowledge_id":"g3_chinese_027","question":"填空题：《孔乙己》中写孔乙己\"排出九文大钱\"的\"排\"字，生动地表现了孔乙己______的心理；写他最后一次到店\"摸出四文大钱\"的\"摸\"字，表现了孔乙己______的处境。这两个动词形成了鲜明的______，突出了孔乙己命运的变化。","answer":"答案：炫耀（得意、炫耀自己有钱、故作姿态）、穷困潦倒（悲惨、窘迫）、对比\n解析：本题考查对小说中重点词语的品味。\"排\"字用得非常精妙，孔乙己本来没有多少钱，却偏要\"排\"出九文大钱，这个动作表现了他想在短衣帮面前炫耀一下、摆读书人的架子的心理，刻画了他的虚荣和迂腐。而\"摸\"字则写出了孔乙己被打折腿后，身体残废、生活更加穷困的悲惨处境。\"排\"和\"摸\"两个动词形成了鲜明的对比，前者神气，后者悲惨，突出了孔乙己每况愈下的命运，具有强烈的艺术感染力。"},{"id":"g3_chinese_027_ex07","knowledge_id":"g3_chinese_027","question":"简答题：小说《孔乙己》的主题是什么？请谈谈你的理解。","answer":"答案：《孔乙己》的主题是多方面的，主要有以下几层：\n1. 批判封建科举制度的罪恶。孔乙己是封建科举制度的牺牲品，他一辈子苦读却连半个秀才也没捞到，反而被科举制度毒害了灵魂，造成了他的悲剧命运。小说通过孔乙己的遭遇，深刻地揭露了封建科举制度对知识分子的摧残。\n2. 批判国民的劣根性，揭示民众精神的麻木。小说中周围的人对孔乙己的不幸不但没有同情，反而把他当作笑料，拿他的痛苦来取乐。这种冷漠无情、麻木不仁的精神状态，是国民劣根性的体现。鲁迅写这篇小说，就是为了\"揭出病苦，引起疗救的注意\"。\n3. 反映封建社会的世态炎凉和人与人之间的冷漠。在咸亨酒店里，人与人之间缺乏同情和温暖，只有嘲笑和冷漠。孔乙己的存在只是给人们增添了一点笑料，他的死也无人关心，这反映了封建社会的冷酷现实。\n4. 对底层知识分子命运的关注和同情。鲁迅虽然批判孔乙己的迂腐和懒惰，但对他的悲惨命运也是寄予同情的，体现了作者对底层知识分子命运的深切关注。\n解析：本题考查对小说主题的理解。小说的主题往往不是单一的，而是丰富的、多义的。理解《孔乙己》的主题，要从多个角度来思考，既要看到对封建科举制度的批判，也要看到对国民性的批判，还要看到作者对人物的同情。答题时要结合课文内容，做到言之有理、持之有据。"},{"id":"g3_chinese_027_ex08","knowledge_id":"g3_chinese_027","question":"选择题：下列对《孔乙己》结尾\"大约孔乙己的确死了\"这句话的理解，不正确的一项是（  ）\nA. \"大约\"表示推测，因为没有人确切知道孔乙己的下落\nB. \"的确\"表示肯定，根据孔乙己的处境，他的死是必然的\nC. 这句话看似矛盾，实际上并不矛盾，有深刻的含义\nD. 这句话说明作者对孔乙己的死持怀疑态度，不确定他是否真的死了","answer":"答案：D\n解析：本题考查对小说结尾的理解。\"大约孔乙己的确死了\"这句话看似矛盾，实际上蕴含着深刻的含义。\"大约\"是因为人们并不关心孔乙己的死活，没有人确切知道他的下落，只能推测；\"的确\"是因为根据孔乙己的悲惨处境和当时的社会现实，他的死是必然的。这句话既表现了孔乙己的悲惨命运——死了都无人知晓，又表现了社会的冷漠——没有人关心一个小人物的生死。A、B、C三项的理解都是正确的，D项理解有误，这句话并不是说作者对孔乙己的死持怀疑态度，而是有其深刻用意的。"},{"id":"g3_chinese_027_ex09","knowledge_id":"g3_chinese_027","question":"填空题：《孔乙己》中，作者运用了多种手法来刻画人物。写孔乙己\"青白脸色，皱纹间时常夹些伤痕；一部乱蓬蓬的花白的胡子\"属于______描写；写他\"窃书不能算偷……窃书！……读书人的事，能算偷么？\"属于______描写；写他\"从破衣袋里摸出四文大钱\"属于______描写；写小伙计觉得\"孔乙己是那样的使人快活，可是没有他，别人也便这么过\"属于______描写。","answer":"答案：外貌（肖像）、语言、动作、侧面（间接）\n解析：本题考查对人物描写方法的辨析。\"青白脸色，皱纹间时常夹些伤痕；一部乱蓬蓬的花白的胡子\"是对孔乙己外貌的描写，属于肖像描写（外貌描写），刻画了孔乙己穷困潦倒、经常挨打的形象。\"窃书不能算偷……\"是孔乙己说的话，属于语言描写，表现了他迂腐、自欺欺人的性格特点。\"从破衣袋里摸出四文大钱\"是孔乙己的动作，属于动作描写，表现了他的穷困和悲惨。写小伙计对孔乙己的感受，是从侧面来烘托孔乙己的可有可无，属于侧面描写（间接描写）。"},{"id":"g3_chinese_027_ex10","knowledge_id":"g3_chinese_027","question":"阅读理解：阅读下面的课文选段，回答问题。\n\n\n中秋过后，秋风是一天凉比一天，看看将近初冬；我整天的靠着火，也须穿上棉袄了。一天的下半天，没有一个顾客，我正合了眼坐着。忽然间听得一个声音，\"温一碗酒。\"这声音虽然极低，却很耳熟。看时又全没有人。站起来向外一望，那孔乙己便在柜台下对了门槛坐着。他脸上黑而且瘦，已经不成样子；穿一件破夹袄，盘着两腿，下面垫一个蒲包，用草绳在肩上挂住；见了我，又说道，\"温一碗酒。\"掌柜也伸出头去，一面说，\"孔乙己么？你还欠十九个钱呢！\"孔乙己很颓唐的仰面答道，\"这……下回还清罢。这一回是现钱，酒要好。\"掌柜仍然同平常一样，笑着对他说，\"孔乙己，你又偷了东西了！\"但他这回却不十分分辩，单说了一句\"不要取笑！\"\"取笑？要是不偷，怎么会打断腿？\"孔乙己低声说道，\"跌断，跌，跌……\"他的眼色，很像恳求掌柜，不要再提。此时已经聚集了几个人，便和掌柜都笑了。我温了酒，端出去，放在门槛上。他从破衣袋里摸出四文大钱，放在我手里，见他满手是泥，原来他便用这手走来的。不一会，他喝完酒，便又在旁人的说笑声中，坐着用这手慢慢走去了。\n\n\n问题：（1）选文开头的环境描写有什么作用？（2）选文中孔乙己的形象与前文相比有什么变化？这说明了什么？（3）选文中多次写\"笑\"，有什么作用？（4）如何理解\"满手是泥，原来他便用这手走来的\"这句话？","answer":"答案：（1）开头写秋风一天凉比一天，将近初冬，\"我\"靠着火还要穿棉袄，渲染了悲凉、阴冷的氛围，为孔乙己的出场做了铺垫，烘托了孔乙己的悲惨命运。\n（2）孔乙己的形象发生了巨大变化：前文他虽然穷困，但还能站起来走路，脸色虽然青白但还算完整；现在他\"脸上黑而且瘦，已经不成样子\"，穿着破夹袄，盘着两腿，用手走来。这说明孔乙己的命运每况愈下，他已经被封建制度和丁举人之流摧残得不成人样了，突出了他遭遇的悲惨。\n（3）选文中掌柜和旁人的笑，是麻木的笑、冷漠的笑。用笑声来衬托孔乙己的悲惨，以乐写哀，更增添了悲剧意味。这笑声反映了当时社会人与人之间的冷漠无情，揭示了国民精神的麻木，深化了小说的主题。\n（4）\"满手是泥\"说明孔乙己是用手撑着地面走来的，路途遥远而艰难。这句话深刻地表现了孔乙己遭遇的悲惨——他已经被打折了腿，只能用手走路，而他还要来酒店喝酒，说明酒是他唯一的精神慰藉，也表现了他命运的凄惨。\n解析：本题考查对小说选段的综合分析能力。第（1）题考查环境描写的作用，要从渲染气氛、烘托人物、推动情节等角度来分析；第（2）题考查对人物形象变化的理解，要结合前后文的对比来分析其变化及原因；第（3）题考查对\"笑\"的理解，要结合主题来分析；第（4）题考查对重点语句的理解，要体会其中蕴含的情感。"},{"id":"g3_chinese_028_ex01","knowledge_id":"g3_chinese_028","question":"填空题：《变色龙》的作者是______，______国作家，是世界三大短篇小说巨匠之一。他的代表作有小说《______》《______》，剧本《万尼亚舅舅》《樱桃园》等。","answer":"答案：契诃夫、俄、装在套子里的人、小公务员之死（或《胖子和瘦子》等）\n解析：本题考查文学常识。契诃夫是俄国伟大的批判现实主义作家，与莫泊桑、欧·亨利并称为\"世界三大短篇小说巨匠\"。他的短篇小说善于从日常小事中发现社会问题，以幽默讽刺的笔法揭露沙皇专制制度的黑暗和丑恶。代表作有《变色龙》《装在套子里的人》《小公务员之死》《胖子和瘦子》等，剧本有《万尼亚舅舅》《樱桃园》《三姊妹》等。"},{"id":"g3_chinese_028_ex02","knowledge_id":"g3_chinese_028","question":"选择题：下列对《变色龙》标题含义的理解，不正确的一项是（  ）\nA. 以变色龙为题目，是因为奥楚蔑洛夫像变色龙一样善变\nB. 变色龙是一种蜥蜴，皮肤颜色会随着环境的变化而变化\nC. 题目具有讽刺意义，讽刺了奥楚蔑洛夫见风使舵、趋炎附势的特点\nD. 题目用了比喻的修辞手法，把奥楚蔑洛夫比作变色龙","answer":"答案：B\n解析：本题考查对小说标题含义的理解。A、C、D三项的理解都是正确的。B项只是说明了变色龙这种动物的特点，还停留在表面，没有揭示题目的深层含义。小说以\"变色龙\"为题，是用了比喻的修辞手法，把主人公奥楚蔑洛夫比作变色龙，讽刺他像变色龙一样善于根据周围环境的变化而改变自己的态度和立场，见风使舵、趋炎附势、媚上欺下。题目具有强烈的讽刺意味，形象地揭示了人物的性格特征。"},{"id":"g3_chinese_028_ex03","knowledge_id":"g3_chinese_028","question":"填空题：《变色龙》的主人公是______，他是沙皇俄国的一个______。小说围绕______的事件展开情节，主人公在处理这件事的过程中，态度前后发生了______次变化，充分表现了他______的性格特点。","answer":"答案：奥楚蔑洛夫、警官（巡警）、狗咬人（小狗咬了首饰匠赫留金）、六、见风使舵（趋炎附势、媚上欺下、反复无常）\n解析：本题考查对小说内容和人物形象的整体把握。《变色龙》的主人公是警官奥楚蔑洛夫，故事围绕小狗咬了首饰匠赫留金的事件展开。在处理事件的过程中，奥楚蔑洛夫根据狗的主人是谁不断改变自己的态度，前后共变化了六次：一开始他不知狗的主人是谁，扬言要弄死狗，罚狗的主人；听说狗是将军家的，他马上改变态度，指责赫留金；后来又听说不是将军家的狗，他又改变态度，说狗是下贱胚子；接着又有人说是将军家的狗，他又变色，说狗是名贵的狗；后来将军家的厨师说不是将军的狗，他又说狗是野狗，要弄死它；最后厨师说是将军哥哥的狗，他又满脸堆笑，夸狗机灵，还恐吓赫留金。这六次变化，生动地表现了奥楚蔑洛夫见风使舵、趋炎附势、媚上欺下的性格特点。"},{"id":"g3_chinese_028_ex04","knowledge_id":"g3_chinese_028","question":"简答题：奥楚蔑洛夫是一个怎样的人物形象？这一形象有什么社会意义？","answer":"答案：奥楚蔑洛夫是沙皇俄国时期一个见风使舵、趋炎附势、媚上欺下、反复无常的警官形象。\n他的性格特点主要有：\n1. 见风使舵、反复无常：他在处理狗咬人的事件中，根据狗的主人是谁不断改变自己的态度，前后变化了六次，活像一条变色龙。\n2. 趋炎附势、媚上欺下：对有权有势的人，他阿谀奉承、百般讨好；对普通老百姓，他专横跋扈、欺压凌辱。\n3. 虚伪无耻、自相矛盾：他一会儿说狗是下贱胚子，一会儿又说狗是名贵的狗，前后自相矛盾，却不以为耻，反而振振有词。\n奥楚蔑洛夫这一形象的社会意义：这一形象是沙皇俄国专制制度的产物，他的丑恶灵魂是沙皇警察制度的体现。小说通过这个人物，揭露了沙皇专制统治的黑暗腐朽，讽刺了当时社会上那些趋炎附势、见风使舵的势利小人，具有强烈的批判意义。\n解析：本题考查对人物形象和社会意义的分析。分析人物形象要结合小说的具体情节，抓住人物的言行举止来分析其性格特点。分析形象的社会意义，要结合作品的时代背景，理解作者塑造这一形象的目的和意义。奥楚蔑洛夫已经成为见风使舵、趋炎附势的代名词，具有普遍的典型意义。"},{"id":"g3_chinese_028_ex05","knowledge_id":"g3_chinese_028","question":"选择题：下列关于《变色龙》的说法，不正确的一项是（  ）\nA. 小说运用了对比和夸张的手法，突出了人物的性格特点\nB. 小说以小见大，通过一件小事反映了深刻的社会问题\nC. 小说的主人公是赫留金，他是一个受害者的形象\nD. 小说语言简洁、幽默，具有强烈的讽刺效果","answer":"答案：C\n解析：本题考查对小说的综合理解。A、B、D三项的说法都是正确的。C项说法有误，小说的主人公是警官奥楚蔑洛夫，而不是赫留金。赫留金是狗咬人事件中的受害者，他是一个小市民形象，作者通过他的遭遇来表现奥楚蔑洛夫的性格特点，同时也反映了当时社会的黑暗。主人公是作品中集中体现主题的人物，《变色龙》的主题是通过奥楚蔑洛夫的表现来体现的，因此他才是主人公。"},{"id":"g3_chinese_028_ex06","knowledge_id":"g3_chinese_028","question":"填空题：《变色龙》中，奥楚蔑洛夫穿着新的军大衣，这______描写有特殊作用。他开头穿着军大衣出场，表现了他______的样子；中间他让叶尔德林帮他脱大衣、穿大衣，是为了______；结尾他裹紧大衣扬长而去，表现了他______。大衣这一细节贯穿全文，推动了情节的发展，也刻画了人物的心理。","answer":"答案：细节（外貌）、威风凛凛（装腔作势、官气十足）、掩饰自己的狼狈和尴尬（为自己变色打掩护）、厚颜无耻（媚上欺下的丑态）\n解析：本题考查对细节描写作用的理解。军大衣是奥楚蔑洛夫身份的象征，也是小说中一个重要的细节。开头他穿着新的军大衣出场，耀武扬威，装腔作势，表现了他作为警官的威风。中间他一会儿脱大衣，一会儿穿大衣，这是因为他的态度不断变化，用脱穿大衣来掩饰自己的尴尬和不安，同时也为他的\"变色\"做掩护。结尾他裹紧大衣大摇大摆地走了，说明他虽然出了洋相，但仍然厚颜无耻，继续作威作福。大衣这一细节贯穿全文，既是人物身份的标志，也是其内心活动的外在表现，对刻画人物性格起了重要作用。"},{"id":"g3_chinese_028_ex07","knowledge_id":"g3_chinese_028","question":"简答题：《变色龙》这篇小说是如何运用讽刺手法的？请结合课文内容简要分析。","answer":"答案：《变色龙》是一篇优秀的讽刺小说，作者运用了多种讽刺手法，取得了强烈的艺术效果：\n1. 运用夸张的手法。奥楚蔑洛夫在短短几分钟内，态度前后变化了六次，这种夸张的写法，突出了人物善变的性格，增强了讽刺效果。\n2. 运用对比的手法。奥楚蔑洛夫对狗和对赫留金的态度，前后形成了鲜明的对比。他一会儿骂狗是\"下贱胚子\"，一会儿夸狗是\"名贵的狗\"\"伶俐的狗\"；一会儿说赫留金受了伤要主持公道，一会儿又说赫留金敲诈，这种鲜明的对比，入木三分地刻画了他见风使舵的丑态。\n3. 运用精彩的细节描写。比如军大衣的细节，奥楚蔑洛夫脱大衣、穿大衣的动作，生动地表现了他内心的不安和掩饰窘态的心理，具有强烈的讽刺意味。\n4. 运用幽默风趣的语言。作者用诙谐幽默的语言来写人物，使读者在笑声中认识到人物的丑恶本质，达到了讽刺的目的。\n5. 以小见大。通过一件狗咬人的小事，揭露了沙皇专制制度的黑暗腐朽，讽刺了社会上的势利小人，使小说的主题更加深刻。\n解析：本题考查对小说讽刺手法的分析。契诃夫是短篇小说大师，也是讽刺艺术的大师。分析《变色龙》的讽刺手法，要从多个角度入手，结合具体的例子来分析。讽刺手法的运用，使这篇小说既有生动的形象，又有深刻的思想，成为世界短篇小说的经典之作。"},{"id":"g3_chinese_028_ex08","knowledge_id":"g3_chinese_028","question":"选择题：下列对《变色龙》中赫留金这一人物形象的分析，不正确的一项是（  ）\nA. 赫留金是一个小市民形象，他是狗咬人事件的受害者\nB. 赫留金被狗咬了，想借此讹诈一笔钱，说明他也有市侩的一面\nC. 赫留金的遭遇值得同情，他是沙皇专制制度的受害者\nD. 赫留金是小说的主要人物，作者主要是为了批判他的市侩习气","answer":"答案：D\n解析：本题考查对次要人物形象的理解。A、B、C三项的分析都是正确的。D项说法有误，赫留金不是小说的主要人物，主要人物是奥楚蔑洛夫。作者写赫留金，一方面是为了推动故事情节的发展——狗咬人事件是小说的中心事件；另一方面，通过赫留金的遭遇，更能反衬出奥楚蔑洛夫的丑恶嘴脸。同时，赫留金身上也有市侩的习气，他想借机讹诈，这也反映了当时社会的不良风气。但作者主要批判的不是赫留金，而是以奥楚蔑洛夫为代表的沙皇警察制度和趋炎附势的社会风气。"},{"id":"g3_chinese_028_ex09","knowledge_id":"g3_chinese_028","question":"填空题：《变色龙》中，作者两次写到围观的群众，第一次写他们\"仿佛一下子从地底下钻出来的\"，第二次写他们\"对着赫留金哈哈大笑\"。这属于______描写，作用是______。","answer":"答案：侧面（场面）、表现了群众的麻木、无聊和庸俗，揭示了当时社会的世态炎凉，深化了小说的主题\n解析：本题考查对场面描写和侧面描写作用的理解。围观的群众是小说中的次要人物，他们的出现有重要作用。第一次写他们\"仿佛一下子从地底下钻出来的\"，说明他们无聊、爱看热闹；第二次写他们\"对着赫留金哈哈大笑\"，说明他们不同情受害者，反而嘲笑他，表现了他们的麻木和庸俗。这些描写从侧面反映了当时社会的世态炎凉和国民的劣根性，使小说的主题更加深刻——不仅批判了奥楚蔑洛夫这样的统治者爪牙，也批判了整个社会的病态。"},{"id":"g3_chinese_028_ex10","knowledge_id":"g3_chinese_028","question":"阅读理解：阅读下面的课文选段，回答问题。\n\n\n\"不对，这不是将军家里的狗……\"巡警深思地说，\"将军家里没有这样的狗。他家的狗，全是大猎狗。\"\n\n\"你拿得准吗？\"\n\n\"拿得准，长官……\"\n\n\"我也知道。将军家里都是些名贵的、纯种的狗；这条狗呢，鬼才知道是什么玩意儿！毛色既不好，模样也不中看，完全是个下贱胚子。居然有人养这种狗！这人的脑子上哪儿去啦？要是这样的狗在彼得堡或者莫斯科让人碰见，你们猜猜看，结果会怎样？那儿的人可不管什么法律不法律，一眨眼的工夫就叫它断了气！你呢，赫留金，受了害，我们绝不能不管。得好好教训他们一下！是时候了。\"\n\n\"不过也说不定就是将军家的狗……\"巡警把他的想法说出来，\"它的脸上又没写着……前几天我在将军家院子里见过这样的狗。\"\n\n\"没错儿，将军家的！\"人群里有人说。\n\n\"哦！……叶尔德林老弟，给我穿上大衣吧……好像起风了，挺冷……你把这条狗带到将军家里去，问问清楚。就说这狗是我找着，派人送上的。告诉他们别再把狗放到街上来了。说不定这是条名贵的狗；可要是每个猪崽子都拿烟卷戳到它的鼻子上去，那它早就毁了。狗是娇贵的动物……你这混蛋，把手放下来！不用把你那蠢手指头伸出来！怪你自己不好！……\"\n\n\n问题：（1）选文中奥楚蔑洛夫对狗和赫留金的态度发生了怎样的变化？（2）奥楚蔑洛夫为什么让叶尔德林给他穿上大衣？这一细节有什么作用？（3）从选文中可以看出奥楚蔑洛夫怎样的性格特点？（4）巡警和人群的话在小说中起什么作用？","answer":"答案：（1）当听说不是将军家的狗时，奥楚蔑洛夫骂狗是\"下贱胚子\"，说要教训狗的主人，要为赫留金主持公道；当听说可能是将军家的狗时，他马上改变态度，说狗可能是\"名贵的狗\"，是\"娇贵的动物\"，反而指责赫留金，说\"怪你自己不好\"。\n（2）奥楚蔑洛夫让叶尔德林给他穿上大衣，是因为他知道自己刚才骂了狗，现在又要改变态度，有些难堪和尴尬，用穿大衣来掩饰自己的不安和狼狈，为自己的\"变色\"打掩护。这一细节描写，生动地表现了奥楚蔑洛夫内心的恐慌和强作镇定的窘态，极具讽刺意味。\n（3）从选文中可以看出奥楚蔑洛夫见风使舵、趋炎附势、媚上欺下、反复无常的性格特点。他根据狗的主人是谁不断改变自己的态度，前后自相矛盾，却不以为耻，活脱脱一条变色龙。\n（4）巡警和人群的话推动了故事情节的发展，是奥楚蔑洛夫不断\"变色\"的依据和由头。正是因为他们不断提供新的信息，奥楚蔑洛夫的态度才会不断变化。同时，巡警的见风使舵和人群的无聊起哄，也从侧面烘托了奥楚蔑洛夫的形象，反映了当时社会的风气。\n解析：本题考查对小说选段的综合阅读理解能力。第（1）题考查对内容的概括，要抓住态度的前后变化来回答；第（2）题考查细节描写的作用，要结合人物的心理来分析；第（3）题考查对人物性格的把握，要从人物的言行中总结其性格特点；第（4）题考查次要人物的作用，要从推动情节、衬托主要人物、反映社会现实等角度来分析。"},{"id":"g3_chinese_029_ex01","knowledge_id":"g3_chinese_029","question":"选择题：下列关于散文特点的说法，不正确的一项是（  ）\nA. 散文的特点是\"形散神不散\"，形式灵活多样，主题集中鲜明\nB. 散文只能写真人真事，不能有任何想象和虚构\nC. 散文的表达方式灵活，可以记叙、描写、抒情、议论相结合\nD. 散文的语言优美，富有文采，具有很强的感染力","answer":"答案：B\n解析：本题考查对散文特点的理解。A、C、D三项的说法都是正确的。B项说法有误，散文虽然大多写真人真事，但并不排斥想象和虚构。在真实的基础上，散文也可以有合理的想象和一定的艺术加工，比如一些抒情散文和哲理散文，就有较多的想象成分。当然，散文的虚构和小说不同，散文的想象是为了更好地表达真情实感，而不是为了塑造人物和编造情节。"},{"id":"g3_chinese_029_ex02","knowledge_id":"g3_chinese_029","question":"填空题：散文的种类很多，根据表达方式和侧重点的不同，一般可以分为______散文、______散文、______散文三类。其中，以写人记事为主的是______散文。","answer":"答案：叙事（记叙）、抒情、议论（哲理）、叙事（记叙）\n解析：本题考查散文的分类。根据表达方式和侧重点的不同，散文一般可以分为三类：叙事散文（记叙散文）、抒情散文、议论散文（哲理散文）。叙事散文以写人记事为主，如《背影》《藤野先生》；抒情散文以抒发情感为主，如《白杨礼赞》《春》；议论散文以说理为主，往往借助形象来说理，富有哲理，如《谈生命》。三种类型的散文并不是截然分开的，往往是你中有我、我中有你，只是侧重点不同而已。"},{"id":"g3_chinese_029_ex03","knowledge_id":"g3_chinese_029","question":"选择题：下列对散文线索的理解，不正确的一项是（  ）\nA. 散文虽然\"形散\"，但必须有一条线索贯穿全文\nB. 散文的线索只能是具体的事物，不能是情感或事理\nC. 线索可以是事物、人物、事件、情感、时间、空间等\nD. 线索是组织材料的\"红线\"，使文章结构严谨、主题鲜明","answer":"答案：B\n解析：本题考查对散文线索的理解。A、C、D三项的说法都是正确的。B项说法有误，散文的线索不仅可以是具体的事物，也可以是情感、事理等抽象的东西。常见的线索有：①以具体事物为线索，如《项链》；②以人物为线索，如《回忆我的母亲》；③以事件为线索，如《故乡》；④以思想感情为线索，如《荔枝蜜》；⑤以时间为线索，如《老山界》；⑥以空间为线索，如《从百草园到三味书屋》。有的文章还有明暗两条线索，如《藤野先生》。"},{"id":"g3_chinese_029_ex04","knowledge_id":"g3_chinese_029","question":"简答题：什么是散文的\"形散神不散\"？请结合具体例子谈谈你的理解。","answer":"答案：\"形散神不散\"是散文的基本特点。所谓\"形散\"，是指散文的形式灵活自由，不受拘束，主要表现在以下几个方面：\n1. 选材广泛自由。散文可以上下五千年，纵横几万里，古今中外，天文地理，无所不包。作者可以根据表达主题的需要，自由选择材料。\n2. 表达方式多种多样。散文可以记叙、描写、抒情、议论、说明等多种表达方式并用，灵活多变。\n3. 结构自由灵活。散文的结构没有固定的格式，可以根据内容和表达的需要自由安排。\n4. 语言运用自如。散文的语言可以或朴素或华丽，或庄重或诙谐，各有特色。\n所谓\"神不散\"，是指文章的主题必须明确、集中，无论材料多么丰富，表达方式多么灵活，都必须为表现主题服务。\n例如，《藤野先生》一文，写了东京的见闻、仙台的学医、与藤野先生的交往、弃医从文的经过等，材料很丰富，这就是\"形散\"；但所有材料都围绕着对藤野先生的怀念和爱国主义思想感情这一中心，这就是\"神不散\"。\n解析：本题考查对散文基本特点的理解。\"形散神不散\"是散文的核心特点，也是阅读和写作散文的关键。答题时要分别解释\"形散\"和\"神不散\"的含义，并结合具体例子来说明，这样才能答得清楚明白。"},{"id":"g3_chinese_029_ex05","knowledge_id":"g3_chinese_029","question":"阅读理解：阅读下面的散文，回答问题。\n\n\n**春**（节选）\n朱自清\n\n\n盼望着，盼望着，东风来了，春天的脚步近了。\n\n一切都像刚睡醒的样子，欣欣然张开了眼。山朗润起来了，水涨起来了，太阳的脸红起来了。\n\n小草偷偷地从土里钻出来，嫩嫩的，绿绿的。园子里，田野里，瞧去，一大片一大片满是的。坐着，躺着，打两个滚，踢几脚球，赛几趟跑，捉几回迷藏。风轻悄悄的，草软绵绵的。\n\n桃树、杏树、梨树，你不让我，我不让你，都开满了花赶趟儿。红的像火，粉的像霞，白的像雪。花里带着甜味儿；闭了眼，树上仿佛已经满是桃儿、杏儿、梨儿。花下成千成百的蜜蜂嗡嗡地闹着，大小的蝴蝶飞来飞去。野花遍地是：杂样儿，有名字的，没名字的，散在草丛里，像眼睛，像星星，还眨呀眨的。\n\n\n问题：（1）选文第一段表达了作者怎样的感情？有什么作用？（2）选文是从哪几个方面来描写春天的？分别表现了春天的什么特点？（3）选文中有很多精彩的句子，请任选一句从修辞角度赏析。（4）这几段文字运用了什么写作顺序？","answer":"答案：（1）第一段表达了作者对春天的期盼和喜爱之情。运用了反复和拟人的修辞手法，两个\"盼望着\"，突出了期待之情，\"春天的脚步近了\"把春天拟人化，赋予春天以人的动作，表达了作者的喜悦之情。作用：开篇点题，总领全文，奠定了全文欢快的感情基调。\n（2）选文从春草、春花两个方面来描写春天（还有对春天总体感受的描写）。春草：写出了春草嫩绿、多、软的特点，表现了春草的勃勃生机。春花：写出了春花多、艳、甜的特点，表现了春天百花盛开、热闹繁荣的景象。\n（3）示例一：\"小草偷偷地从土里钻出来，嫩嫩的，绿绿的。\"这句话运用了拟人的修辞手法，\"偷偷地\"\"钻\"把小草拟人化，生动形象地写出了小草破土而出的情态，表现了春草旺盛的生命力。\n示例二：\"红的像火，粉的像霞，白的像雪。\"这句话运用了比喻和排比的修辞手法，生动形象地写出了春花色彩艳丽的特点，增强了语势，表达了作者的喜爱之情。\n示例三：\"野花遍地是：杂样儿，有名字的，没名字的，散在草丛里，像眼睛，像星星，还眨呀眨的。\"这句话运用了比喻的修辞手法，把野花比作眼睛和星星，生动形象地写出了野花多而明丽、在春风中摇曳的情态。\n（4）这几段文字运用了由整体到局部的写作顺序。先总写春天到来的景象，再分别写春草、春花等具体景物。\n解析：本题考查对散文的阅读理解能力。第（1）题考查开头段的作用，要从内容和结构两方面来回答；第（2）题考查对内容的概括，要抓住景物特点来分析；第（3）题考查语言赏析，要明确修辞手法并分析其表达效果；第（4）题考查写作顺序，要理清文章的思路。"},{"id":"g3_chinese_029_ex06","knowledge_id":"g3_chinese_029","question":"选择题：下列关于散文语言特色的说法，不正确的一项是（  ）\nA. 散文的语言讲究文采，追求生动形象、富有感染力\nB. 散文的语言可以是朴素自然的，也可以是华丽优美的\nC. 散文的语言必须华丽典雅，越难懂越好\nD. 散文的语言往往饱含作者的情感，具有抒情性","answer":"答案：C\n解析：本题考查对散文语言的理解。A、B、D三项的说法都是正确的。C项说法有误，散文的语言风格是多种多样的，有的朴素自然，有的华丽优美，有的幽默诙谐，有的深沉含蓄。不同的作家有不同的语言风格，不同的内容也需要不同的语言来表达。并不是越华丽、越难懂就越好，关键是要恰当地表达思想感情，做到文质兼美。语言是为内容服务的，好的散文语言应该是准确、鲜明、生动的。"},{"id":"g3_chinese_029_ex07","knowledge_id":"g3_chinese_029","question":"填空题：散文中常见的表现手法有______、______、______等。其中，通过对某种事物的描写来表现人的品格和志向的手法叫______。","answer":"答案：象征、托物言志、借景抒情（或对比、衬托、欲扬先抑等）、托物言志（象征）\n解析：本题考查散文的表现手法。散文中常见的表现手法有：象征、托物言志、借景抒情、情景交融、对比衬托、欲扬先抑、以小见大、联想想象等。托物言志是指通过对物品的描写和叙述，表达自己的志向和意愿，如《白杨礼赞》借白杨树来赞颂北方抗日军民的精神。借景抒情是指通过对景物的描写来抒发感情，如《春》通过对春天景物的描写，表达了作者对春天的热爱和赞美之情。象征手法是指用具体的事物来表现某种抽象的概念、思想或感情。"},{"id":"g3_chinese_029_ex08","knowledge_id":"g3_chinese_029","question":"简答题：如何赏析散文的语言？请简要说说你的方法。","answer":"答案：赏析散文的语言，可以从以下几个方面入手：\n1. 从修辞手法的角度赏析。看句子运用了什么修辞手法，如比喻、拟人、排比、夸张、对偶、反复、设问、反问等，分析这些修辞手法的表达效果。\n2. 从词语运用的角度赏析。看句子中哪些动词、形容词、副词等用得好，分析这些词语的表达效果，特别是那些富有表现力的关键词语。\n3. 从句式的角度赏析。看句子是长句还是短句，是整句还是散句，是肯定句还是否定句，是陈述句还是疑问句等，分析不同句式的表达效果。\n4. 从表达方式的角度赏析。看句子运用了什么表达方式，是记叙、描写，还是抒情、议论，分析其作用。\n5. 从语言风格的角度赏析。看文章的语言具有什么特点，是朴素自然还是华丽优美，是幽默诙谐还是深沉含蓄等。\n6. 结合思想感情来赏析。语言是为表达思想感情服务的，赏析语言不能脱离文章的主题和作者的情感。\n解析：本题考查赏析散文语言的方法。语言赏析是散文阅读的重要考点，掌握正确的方法很重要。答题时要条理清晰，从多个角度来回答，并结合具体例子来说明。在平时的阅读中，要养成品味语言的好习惯，不断提高自己的语言鉴赏能力。"},{"id":"g3_chinese_029_ex09","knowledge_id":"g3_chinese_029","question":"选择题：下列关于散文阅读方法的说法，不正确的一项是（  ）\nA. 阅读散文首先要理清线索，把握文章的结构\nB. 阅读散文只需要理解字面意思，不需要体会深层含义\nC. 阅读散文要品味语言，体会作者的思想感情\nD. 阅读散文要把握文章的主题，理解作者的写作意图","answer":"答案：B\n解析：本题考查对散文阅读方法的理解。A、C、D三项的说法都是正确的。B项说法有误，阅读散文不仅要理解字面意思，更要深入体会文章的深层含义。散文往往\"言在此而意在彼\"，有丰富的意蕴。比如托物言志的散文，作者写物是为了写人、写志，不能只停留在对物的描写上，要理解物的象征意义。阅读散文要反复品味，深入思考，才能真正读懂文章的内涵。"},{"id":"g3_chinese_029_ex10","knowledge_id":"g3_chinese_029","question":"阅读理解：阅读下面的文字，回答问题。\n\n\n**白杨礼赞**（节选）\n茅盾\n\n\n那是力争上游的一种树，笔直的干，笔直的枝。它的干通常是丈把高，像加过人工似的，一丈以内绝无旁枝。它所有的丫枝一律向上，而且紧紧靠拢，也像加过人工似的，成为一束，绝不旁逸斜出。它的宽大的叶子也是片片向上，几乎没有斜生的，更不用说倒垂了。它的皮光滑而有银色的晕圈，微微泛出淡青色。这是虽在北方风雪的压迫下却保持着倔强挺立的一种树！哪怕只有碗那样粗细，它却努力向上发展，高到丈许，两丈，参天耸立，不折不挠，对抗着西北风。\n\n这就是白杨树，西北极普通的一种树，然而决不是平凡的树！\n\n它没有婆娑的姿态，没有屈曲盘旋的虬枝。也许你要说它不美。如果美是专指\"婆娑\"或\"旁逸斜出\"之类而言，那么，白杨树算不得树中的好女子。但是它伟岸，正直，朴质，严肃，也不缺乏温和，更不用提它的坚强不屈与挺拔，它是树中的伟丈夫！当你在积雪初融的高原上走过，看见平坦的大地上傲然挺立这么一株或一排白杨树，难道你就觉得它只是树？难道你就不想到它的朴质，严肃，坚强不屈，至少也象征了北方的农民？难道你竟一点也不联想到，在敌后的广大土地上，到处有坚强不屈，就像这白杨树一样傲然挺立的守卫他们家乡的哨兵？难道你又不更远一点想到，这样枝枝叶叶靠紧团结，力求上进的白杨树，宛然象征了今天在华北平原纵横决荡，用血写出新中国历史的那种精神和意志？\n\n\n问题：（1）选文第一段是从哪几个方面来描写白杨树的？写出了白杨树的什么特点？（2）选文说白杨树\"是树中的伟丈夫\"，为什么？用文中的话回答。（3）选文第三段中，作者由树联想到了什么？这是什么表现手法？（4）选文中四个反问句是什么关系？有什么作用？","answer":"答案：（1）选文第一段从干、枝、叶、皮四个方面来描写白杨树。写出了白杨树笔直、向上、团结、力争上游、倔强挺立的特点，突出了白杨树的不平凡。\n（2）因为\"它伟岸，正直，朴质，严肃，也不缺乏温和，更不用提它的坚强不屈与挺拔\"。\n（3）作者由树联想到了北方的农民，联想到了守卫家乡的哨兵，联想到了华北平原上抗日军民的精神和意志。这是象征（托物言志、借物喻人）的表现手法，借白杨树来赞颂抗日军民的精神。\n（4）四个反问句是层层递进的关系，由浅入深，由树到人，由具体到抽象，逐步深化。作用：四个反问句形成排比，层层递进，气势磅礴，逐步揭示了白杨树的象征意义，点明了文章的主题，表达了作者强烈的赞美之情。\n解析：本题考查对散文选段的综合阅读理解能力。第（1）题考查对内容的概括，要抓住描写的角度和景物特点；第（2）题考查对信息的筛选，从文中找出相关语句即可；第（3）题考查对象征手法的理解，要结合上下文分析联想的内容和手法；第（4）题考查对重点句子的理解，要从结构和内容两方面来分析其作用。"},{"id":"g3_chinese_030_ex01","knowledge_id":"g3_chinese_030","question":"填空题：《鱼我所欲也》选自《______》，本文作者是______，名______，字______，是______时期______家学派的代表人物，被尊称为\"______\"。","answer":"答案：孟子·告子上、孟子、轲、子舆、战国、儒、亚圣\n解析：本题考查文学常识。《鱼我所欲也》选自《孟子·告子上》，作者是孟子。孟子，名轲，字子舆（一说字子车、子居），战国时期邹国人，是儒家学派的重要代表人物，被后世尊称为\"亚圣\"，与孔子并称\"孔孟\"。《孟子》一书是记录孟子及其弟子言行的著作，是儒家经典之一，与《论语》《大学》《中庸》合称为\"四书\"。"},{"id":"g3_chinese_030_ex02","knowledge_id":"g3_chinese_030","question":"选择题：下列句子中加点词的解释，不正确的一项是（  ）\nA. 故不为苟得也（苟且取得，这里是苟且偷生的意思）\nB. 故患有所不辟也（祸患，灾难）\nC. 贤者能勿丧耳（丧失）\nD. 一豆羹（豆子）","answer":"答案：D\n解析：本题考查对文言实词的理解。A、B、C三项的解释都是正确的。D项解释有误，\"豆\"是古代盛食物的一种容器，形似高脚盘，不是\"豆子\"的意思。\"一豆羹\"就是一碗汤。古代汉语中很多词的意思和现代汉语不同，学习时要注意积累古今异义词。"},{"id":"g3_chinese_030_ex03","knowledge_id":"g3_chinese_030","question":"填空题：《鱼我所欲也》中，\"所欲有甚于生者\"指的是______，\"所恶有甚于死者\"指的是______。文中的中心论点是：______，______。","answer":"答案：义、不义、二者不可得兼、舍生而取义者也\n解析：本题考查对文章内容和中心论点的理解。《鱼我所欲也》一文的中心论点是\"二者不可得兼，舍生而取义者也\"，即当生命和道义不能同时得到的时候，要舍弃生命而选取道义。这是孟子\"性善论\"思想的体现，他认为人天生就有羞恶之心，有向善的本性，所以在关键时刻能够舍生取义。\"所欲有甚于生者\"指的是\"义\"，\"所恶有甚于死者\"指的是\"不义\"。全文围绕这个中心论点展开论证，阐明了义重于生、义重于利的道理。"},{"id":"g3_chinese_030_ex04","knowledge_id":"g3_chinese_030","question":"简答题：《鱼我所欲也》一文运用了哪些论证方法？请举例说明。","answer":"答案：《鱼我所欲也》运用了多种论证方法，主要有：\n1. 比喻论证。文章开头用\"鱼，我所欲也；熊掌，亦我所欲也。二者不可得兼，舍鱼而取熊掌者也\"来比喻生和义的关系，引出\"舍生而取义\"的中心论点，形象生动，通俗易懂。\n2. 道理论证。第一段围绕中心论点，从正面和反面进行讲道理，论述了义重于生、不义重于死的道理，逻辑严密，说理透彻。\n3. 举例论证。第二段举\"一箪食，一豆羹\"的例子，说明即使在饥饿的时候，人也有羞恶之心，不会接受不义之食；又举\"万钟则不辩礼义而受之\"的例子，说明很多人为了功名利禄而丧失了本心，从反面论证了中心论点。两个例子形成对比，论证有力。\n4. 对比论证。第一段将\"所欲有甚于生者\"和\"所恶有甚于死者\"进行对比，将人求生避死的本能和舍生取义的选择进行对比；第二段将\"乡为身死而不受\"和\"今为宫室之美为之\"等进行对比，突出了舍生取义的重要性，增强了论证效果。\n解析：本题考查对论证方法的辨析和理解。议论文常见的论证方法有举例论证、道理论证、比喻论证、对比论证等。答题时要结合文章具体内容，指出每种论证方法在文中的体现，并分析其作用。《鱼我所欲也》是一篇优秀的议论文，论证严密，方法多样，学习时要认真体会。"},{"id":"g3_chinese_030_ex05","knowledge_id":"g3_chinese_030","question":"选择题：下列各组句子中，加点词的意义和用法相同的一项是（  ）\nA. 由是则生而有不用也 / 人不知而不愠\nB. 所欲有甚于生者 / 万钟于我何加焉\nC. 得之则生 / 今为妻妾之奉为之\nD. 则凡可以得生者何不用也 / 入则无法家拂士","answer":"答案：A\n解析：本题考查文言虚词的意义和用法。A项中两个\"而\"都是转折连词，相当于\"却\"\"但是\"，用法相同；B项中前一个\"于\"是\"比\"的意思，后一个\"于\"是\"对于\"的意思，用法不同；C项中前一个\"之\"是代词，代指\"一箪食，一豆羹\"，后一个\"之\"是助词，相当于\"的\"，用法不同；D项中前一个\"则\"是\"那么\"的意思，后一个\"则\"是\"如果\"的意思，用法不同。学习文言文要注意积累常见虚词的用法，结合具体语境来辨析。"},{"id":"g3_chinese_030_ex06","knowledge_id":"g3_chinese_030","question":"填空题：《鱼我所欲也》中，\"______，______\"两句说明人人都有向善之心，但只有贤者能做到坚守本心，不丧失。\"______\"一词在文中出现多次，意思是\"天性，天良\"，指人天生就有的羞恶廉耻之心。","answer":"答案：非独贤者有是心也、人皆有之、本心\n解析：本题考查对文章内容和关键词语的理解。\"非独贤者有是心也，人皆有之，贤者能勿丧耳\"是孟子\"性善论\"思想的体现，他认为人天生就有善良的本性，有羞恶之心，只是普通人容易丧失，而贤者能够保持不丧失。\"本心\"在文中出现多次，指的是人的天性、天良，也就是人天生就有的羞恶廉耻之心，即\"义\"。文章最后说\"此之谓失其本心\"，就是批评那些为了功名利禄而丧失了本心的人。"},{"id":"g3_chinese_030_ex07","knowledge_id":"g3_chinese_030","question":"文言文阅读：阅读下面的文言文，回答问题。\n\n\n鱼，我所欲也；熊掌，亦我所欲也。二者不可得兼，舍鱼而取熊掌者也。生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也。生亦我所欲，所欲有甚于生者，故不为苟得也；死亦我所恶，所恶有甚于死者，故患有所不辟也。如使人之所欲莫甚于生，则凡可以得生者何不用也？使人之所恶莫甚于死者，则凡可以辟患者何不为也？由是则生而有不用也，由是则可以辟患而有不为也。是故所欲有甚于生者，所恶有甚于死者。非独贤者有是心也，人皆有之，贤者能勿丧耳。\n\n\n问题：（1）解释下列加点的词语。①故患有所不辟也 ②如使人之所欲莫甚于生 ③贤者能勿丧耳\n（2）将下面的句子翻译成现代汉语。①二者不可得兼，舍生而取义者也。 ②由是则生而有不用也，由是则可以辟患而有不为也。\n（3）选文的中心论点是什么？是怎样提出的？\n（4）\"非独贤者有是心也\"中的\"是心\"指的是什么？（用原文回答）","answer":"答案：（1）①祸患，灾难；同\"避\"，躲避。②假如，假使。③丧失。\n（2）①如果这两样东西不能同时都得到的话，那么我就只好牺牲生命而选取道义了。②采用某种手段就能够活命，可是有的人却不肯采用；采用某种办法就能够躲避灾祸，可是有的人也不肯采用。\n（3）中心论点是\"二者不可得兼，舍生而取义者也\"，即舍生取义。文章开头用鱼和熊掌的比喻引出中心论点，把抽象的道理具体化，形象生动，通俗易懂，易于读者接受。\n（4）\"是心\"指的是\"所欲有甚于生者，所恶有甚于死者\"，也就是舍生取义之心。\n解析：本题考查文言文的阅读理解能力。第（1）题考查文言实词，要注意通假字、古今异义词等特殊现象；第（2）题考查句子翻译，要做到准确、通顺，注意关键词语的翻译；第（3）题考查中心论点及其提出方式，要结合文章开头来分析；第（4）题考查对内容的理解，从上下文中找出相关语句即可。阅读文言文，要在理解字词、读懂文章的基础上，深入理解文章的思想内容。"},{"id":"g3_chinese_030_ex08","knowledge_id":"g3_chinese_030","question":"选择题：下列对《鱼我所欲也》的理解和分析，不正确的一项是（  ）\nA. 文章开头用比喻引出中心论点，生动形象，通俗易懂\nB. 第一段从正反两方面进行道理论证，论述了义重于生的道理\nC. 第二段用两个例子进行对比论证，说明人人都有本心\nD. 文章的主旨是告诫人们，在任何情况下都不要放弃生命","answer":"答案：D\n解析：本题考查对文章内容和主旨的理解。A、B、C三项的说法都是正确的。D项说法有误，文章的主旨恰恰相反，不是告诫人们不要放弃生命，而是阐明了\"舍生取义\"的道理，告诫人们在生命和道义不能同时得到的时候，要舍弃生命而选取道义，要保持自己的本心，不能为了功名利禄而丧失道义。孟子认为义比生命更重要，所以在关键时刻要舍生取义。"},{"id":"g3_chinese_030_ex09","knowledge_id":"g3_chinese_030","question":"填空题：《鱼我所欲也》中，作者用\"______\"和\"______\"两个例子，从正反两方面论证了义重于生的道理。其中，\"______\"的例子从正面论证，\"______\"的例子从反面论证。","answer":"答案：一箪食一豆羹（行道之人弗受、乞人不屑）、万钟则不辩礼义而受之、一箪食一豆羹（不食嗟来之食）、万钟则不辩礼义而受之\n解析：本题考查对文章论证思路的理解。第二段举了两个例子：第一个是\"一箪食，一豆羹\"的例子，说即使是饥饿的路人、乞丐也不会接受不义之食，这是从正面论证舍生取义是人的本心；第二个是\"万钟则不辩礼义而受之\"的例子，说很多人为了宫室之美、妻妾之奉、所识穷乏者得我而接受了不合礼义的厚禄，这是从反面论证，说明这些人丧失了本心。两个例子一正一反，形成对比，有力地论证了中心论点。"},{"id":"g3_chinese_030_ex10","knowledge_id":"g3_chinese_030","question":"简答题：如何理解《鱼我所欲也》中\"舍生取义\"的观点？在今天还有现实意义吗？请结合现实谈谈你的看法。","answer":"答案：\"舍生取义\"是孟子提出的重要观点，意思是当生命和道义不能同时得到的时候，要舍弃生命而选取道义。这一观点体现了孟子对人格尊严和道德价值的重视，认为人活着要有尊严、有道义，不能苟且偷生。\n在今天，\"舍生取义\"仍然具有重要的现实意义：\n1. 它告诉我们，生命的价值不仅仅在于长度，更在于质量和意义。人活着要有追求、有原则、有底线，不能为了个人利益而损害道义。\n2. 在当今社会，我们仍然需要这种精神。比如，在国家和人民利益受到威胁的时候，需要有人挺身而出，甚至牺牲个人利益；在面对各种诱惑的时候，需要坚守原则，不做有损人格、有损国家和人民利益的事情。\n3. 当然，今天我们讲\"舍生取义\"，并不是要轻易放弃生命，而是说在关键时刻，在大是大非面前，要把道义放在第一位。在和平年代，更多的时候是要舍弃个人的私利，维护正义和道德。\n4. 在现实生活中，有许多舍生取义的例子，比如那些见义勇为的英雄、那些为了国家和人民利益默默奉献的人，他们都是新时代\"舍生取义\"精神的体现。\n总之，孟子的\"舍生取义\"思想虽然产生于两千多年前，但在今天仍然闪耀着光芒，激励着我们做一个有道德、有良知、有担当的人。\n解析：本题考查对文章主旨的理解和拓展思考能力。答题时首先要准确理解\"舍生取义\"的含义，然后结合现实谈其现实意义。可以从不同角度来谈，只要言之有理即可。这类题目既考查对课文的理解，又考查联系实际的能力，是中考常见的题型。平时要注意积累，培养辩证思维和联系实际的能力。"},{"id":"g3_chinese_031_ex01","knowledge_id":"g3_chinese_031","question":"选择题：下列关于诸子散文的说法，不正确的一项是（  ）\nA. 诸子散文是春秋战国时期各个学派的著作，反映了不同学派的思想主张\nB. \"诸子百家\"中的\"诸子\"是指孔子、孟子、老子、庄子等各位思想家\nC. 诸子散文都是以议论为主的论说文，没有记叙的成分\nD. 《论语》《孟子》《庄子》《墨子》《韩非子》等都是诸子散文的代表作品","answer":"答案：C\n解析：本题考查对诸子散文的了解。A、B、D三项的说法都是正确的。C项说法有误，诸子散文并不都是纯粹的论说文，很多都包含记叙的成分。比如《论语》主要是语录体，记录了孔子及其弟子的言行；《孟子》虽然以论说为主，但也有很多精彩的叙事成分；《庄子》更是想象丰富，有很多寓言故事，叙事性很强。早期的诸子散文往往记叙和议论结合，后来才逐渐发展为比较成熟的论说文。"},{"id":"g3_chinese_031_ex02","knowledge_id":"g3_chinese_031","question":"填空题：春秋战国时期，社会急剧变化，许多思想家发表各自的主张和见解，形成了不同的学派，史称\"______\"。其中，影响最大的四个学派是______、______、______、______。","answer":"答案：百家争鸣、儒家、道家、墨家、法家\n解析：本题考查对诸子百家的了解。春秋战国时期，社会大动荡、大变革，学术思想非常活跃，形成了\"百家争鸣\"的局面。\"百家\"是泛指，意思是学派很多，其中影响最大的四个学派是儒家、道家、墨家、法家。儒家的代表人物有孔子、孟子、荀子，主张仁政、礼治；道家的代表人物有老子、庄子，主张无为而治、顺应自然；墨家的代表人物是墨子，主张兼爱、非攻；法家的代表人物是韩非子，主张以法治国、加强中央集权。各家学派的思想对中国传统文化产生了深远影响。"},{"id":"g3_chinese_031_ex03","knowledge_id":"g3_chinese_031","question":"选择题：下列作品与作者、学派对应不正确的一项是（  ）\nA. 《论语》——孔子——儒家\nB. 《孟子》——孟子——儒家\nC. 《庄子》——庄周——道家\nD. 《韩非子》——韩非——墨家","answer":"答案：D\n解析：本题考查文学常识。A、B、C三项的对应都是正确的。D项对应有误，《韩非子》是法家代表人物韩非的著作，不是墨家的。韩非是战国末期法家思想的集大成者，他主张改革，提倡法治，提出建立君主专制中央集权的封建国家，他的思想被秦始皇所采纳。墨家的代表人物是墨子，其著作是《墨子》，主张兼爱、非攻、尚贤、节用等。"},{"id":"g3_chinese_031_ex04","knowledge_id":"g3_chinese_031","question":"简答题：什么是诸子散文？诸子散文的发展经历了哪几个阶段？各有什么特点？","answer":"答案：诸子散文是春秋战国时期各个学派的著作，反映了不同学派的思想主张和学术观点，是中国古代散文的重要组成部分。\n诸子散文的发展大致经历了三个阶段：\n第一阶段是春秋末期到战国初期，代表作有《论语》《老子》《墨子》等。这一时期的诸子散文多为语录体，篇幅短小，语言简练，主要是记录思想家的言行，还没有形成完整的论说体系。比如《论语》就是记录孔子及其弟子言行的语录体散文集。\n第二阶段是战国中期，代表作有《孟子》《庄子》等。这一时期的诸子散文逐渐由语录体向对话式论辩文过渡，文章篇幅加长，说理更加透彻，逻辑更加严密，文学性也有所增强。比如《孟子》以对话和辩论为主，富有气势和感染力；《庄子》想象丰富，文采飞扬，具有浓厚的浪漫主义色彩。\n第三阶段是战国末期，代表作有《荀子》《韩非子》等。这一时期的诸子散文已经发展为成熟的专题论文，有明确的标题，结构完整，论证严密，标志着我国古代论说文已经发展成熟。比如《韩非子》的文章，说理透辟，锋芒锐利，逻辑性强。\n总之，诸子散文的发展是一个由简到繁、由低级到高级、由语录体到专题论文的演变过程。\n解析：本题考查对诸子散文发展脉络的掌握。答题时要条理清晰，分阶段来回答，并结合具体作品来说明每个阶段的特点。诸子散文是中国古代文学和思想的重要遗产，了解其发展脉络，有助于我们更好地学习和理解古代文化。"},{"id":"g3_chinese_031_ex05","knowledge_id":"g3_chinese_031","question":"文言文阅读：阅读下面的文言文，回答问题。\n\n\n天时不如地利，地利不如人和。三里之城，七里之郭，环而攻之而不胜。夫环而攻之，必有得天时者矣，然而不胜者，是天时不如地利也。城非不高也，池非不深也，兵革非不坚利也，米粟非不多也，委而去之，是地利不如人和也。\n\n故曰：域民不以封疆之界，固国不以山溪之险，威天下不以兵革之利。得道者多助，失道者寡助。寡助之至，亲戚畔之；多助之至，天下顺之。以天下之所顺，攻亲戚之所畔，故君子有不战，战必胜矣。\n\n\n问题：（1）解释下列加点的词语。①池非不深也 ②委而去之 ③域民不以封疆之界 ④亲戚畔之\n（2）将下面的句子翻译成现代汉语。①天时不如地利，地利不如人和。 ②得道者多助，失道者寡助。\n（3）选文的中心论点是什么？主要运用了哪些论证方法？\n（4）结合生活实际，谈谈你对\"人和\"重要性的理解。","answer":"答案：（1）①护城河。②放弃。③限制。④同\"叛\"，背叛。\n（2）①有利于作战的天气、时令，比不上有利于作战的地理形势；有利于作战的地理形势，比不上作战中的人心所向、内部团结。\n②能施行仁政的君主，帮助支持他的人就多；不施行仁政的君主，帮助支持他的人就少。\n（3）中心论点是\"天时不如地利，地利不如人和\"。主要运用了举例论证、对比论证、道理论证等论证方法。文章先以攻城为例，论证天时不如地利；再以守城为例，论证地利不如人和；最后从道理上阐述人和的重要性，得出\"得道者多助，失道者寡助\"的结论。\n（4）示例：\"人和\"指的是人心所向、内部团结，它是成功的关键。在现实生活中，\"人和\"非常重要。一个集体、一个团队，只有内部团结，心往一处想，劲往一处使，才能取得成功。如果内部矛盾重重，人心涣散，那就什么事情也做不成。比如一个班级，只有同学们团结友爱，互相帮助，才能形成良好的班风，大家才能共同进步。在体育比赛中，队员之间的配合和团结更是获胜的关键。所以，我们要珍惜团结，维护集体的和谐。\n解析：本题考查文言文的阅读理解能力。这段文字选自《孟子·公孙丑下》，是孟子的名篇。第（1）题考查文言实词，要注意古今异义、通假字等特殊现象；第（2）题考查句子翻译，要准确翻译关键词；第（3）题考查中心论点和论证方法，要结合具体内容分析；第（4）题是开放性试题，要联系实际来谈，言之有理即可。"},{"id":"g3_chinese_031_ex06","knowledge_id":"g3_chinese_031","question":"选择题：下列对《论语》的说法，不正确的一项是（  ）\nA. 《论语》是记录孔子及其弟子言行的一部书，是儒家经典著作之一\nB. 《论语》是孔子亲自撰写的，集中体现了孔子的思想\nC. 《论语》的体裁是语录体，语言简练，含义深刻\nD. 《论语》与《大学》《中庸》《孟子》合称为\"四书\"","answer":"答案：B\n解析：本题考查对《论语》的了解。A、C、D三项的说法都是正确的。B项说法有误，《论语》不是孔子亲自撰写的，而是孔子的弟子及再传弟子记录整理的。孔子名丘，字仲尼，春秋时期鲁国人，是我国古代伟大的思想家、教育家，儒家学派的创始人。他周游列国，宣传自己的政治主张，但都没有被采纳。晚年回到鲁国，整理古籍，招收弟子讲学。他的言行被弟子们记录下来，整理成《论语》一书。"},{"id":"g3_chinese_031_ex07","knowledge_id":"g3_chinese_031","question":"填空题：《庄子》是______时期______家代表人物______及其后学的著作，善于运用______来说理，想象丰富，具有浓厚的______主义色彩。我们学过的《北冥有鱼》就选自《庄子》中的《______》篇。","answer":"答案：战国、道、庄周（庄子）、寓言、浪漫、逍遥游\n解析：本题考查对《庄子》的了解。《庄子》是战国时期道家学派代表人物庄子（庄周）及其后学的著作，是道家经典之一。庄子的文章想象丰富，意境开阔，善于运用寓言故事来说理，语言生动形象，具有浓厚的浪漫主义色彩，对后世文学产生了深远影响。《庄子》一书分为内篇、外篇、杂篇三部分，其中内篇的《逍遥游》《齐物论》等是庄子的代表作。我们学过的《北冥有鱼》就选自《逍遥游》。"},{"id":"g3_chinese_031_ex08","knowledge_id":"g3_chinese_031","question":"简答题：阅读诸子散文有什么意义？请谈谈你的看法。","answer":"答案：阅读诸子散文有非常重要的意义，主要体现在以下几个方面：\n1. 了解传统文化，增长知识。诸子散文是中国传统文化的重要组成部分，包含了丰富的哲学、历史、文学、伦理等方面的知识。阅读诸子散文，可以让我们了解古代先贤的思想智慧，开阔视野，增长见识。\n2. 学习古人的智慧，指导现实生活。诸子百家的思想虽然产生于两千多年前，但其中很多智慧在今天仍然具有借鉴意义。比如儒家的仁爱思想、道家的辩证思维、墨家的兼爱精神、法家的法治观念等，都可以为我们今天的生活和工作提供启示。\n3. 提高文言文阅读能力。诸子散文是文言文的经典作品，语言规范，表达精炼。阅读诸子散文，可以积累文言词汇，掌握文言文的表达方式，提高阅读文言文的能力。\n4. 提高文学素养和写作能力。诸子散文往往文质兼美，有很高的文学价值。比如《孟子》的雄辩、《庄子》的飘逸、《韩非子》的犀利，各有特色。阅读诸子散文，可以学习古人的写作技巧，提高我们的文学素养和写作水平。\n5. 培养民族自豪感和文化自信。诸子散文是中华民族智慧的结晶，是我们的文化瑰宝。阅读这些经典作品，可以让我们感受到中华文化的博大精深，增强民族自豪感和文化自信心。\n解析：本题考查对诸子散文价值的认识。答题时可以从文化传承、思想借鉴、语言学习、文学修养等多个角度来谈，只要言之有理即可。作为新时代的中学生，我们应该多读经典，从优秀传统文化中汲取营养。"},{"id":"g3_chinese_031_ex09","knowledge_id":"g3_chinese_031","question":"选择题：下列诸子散文作品中，想象最丰富、最富有浪漫主义色彩的是（  ）\nA. 《论语》\nB. 《孟子》\nC. 《庄子》\nD. 《韩非子》","answer":"答案：C\n解析：本题考查对诸子散文艺术特色的把握。《论语》的特点是语言简练、含义深刻，是语录体的典范；《孟子》的特点是富有气势、长于论辩、感情充沛；《庄子》的特点是想象丰富、意境开阔、善用寓言、具有浓厚的浪漫主义色彩；《韩非子》的特点是说理透辟、锋芒锐利、逻辑严密。因此，想象最丰富、最富有浪漫主义色彩的是《庄子》，选C。"},{"id":"g3_chinese_031_ex10","knowledge_id":"g3_chinese_031","question":"文言文阅读：阅读下面的文言文，回答问题。\n\n\n子曰：\"学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？\"（《学而》）\n\n曾子曰：\"吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？\"（《学而》）\n\n子曰：\"温故而知新，可以为师矣。\"（《为政》）\n\n子曰：\"学而不思则罔，思而不学则殆。\"（《为政》）\n\n子曰：\"知之者不如好之者，好之者不如乐之者。\"（《雍也》）\n\n子曰：\"三人行，必有我师焉。择其善者而从之，其不善者而改之。\"（《述而》）\n\n\n问题：（1）解释下列加点的词语。①不亦说乎 ②人不知而不愠 ③吾日三省吾身 ④学而不思则罔\n（2）将下面的句子翻译成现代汉语。①温故而知新，可以为师矣。 ②知之者不如好之者，好之者不如乐之者。\n（3）选文中有很多关于学习的名言，你最喜欢哪一句？为什么？\n（4）结合选文，说说孔子在学习方法和学习态度上有哪些主张。","answer":"答案：（1）①同\"悦\"，愉快。②生气，恼怒。③多次进行自我检查。④迷惑，意思是感到迷茫而无所适从。\n（2）①温习学过的知识，可以得到新的理解和体会，就可以凭借这一点做老师了。\n②懂得某种学问和事业的人，不如喜爱它的人；喜爱它的人，不如以它为快乐的人。\n（3）示例：我最喜欢\"三人行，必有我师焉\"这句话。因为它告诉我们，每个人都有自己的长处和短处，要善于向身边的人学习，虚心求教，取长补短。只有这样，才能不断进步。在生活中，我们要保持谦虚的态度，善于发现别人的优点，努力学习，不断完善自己。\n（4）孔子在学习方法上的主张有：①要按时复习，\"学而时习之\"\"温故而知新\"；②学思结合，\"学而不思则罔，思而不学则殆\"。在学习态度上的主张有：①以学习为乐趣，\"知之者不如好之者，好之者不如乐之者\"；②虚心好学，\"三人行，必有我师焉\"，要善于向别人学习，取长补短。\n解析：本题考查对《论语》选段的阅读理解能力。第（1）题考查文言实词，要注意通假字、古今异义等现象；第（2）题考查句子翻译，要准确翻译关键词语；第（3）题是开放性试题，选择自己最喜欢的一句，说明理由即可；第（4）题考查对内容的理解和概括，要从学习方法和学习态度两个方面来归纳。《论语》中有很多关于学习的格言警句，对我们今天的学习仍然有重要的指导意义。"},{"id":"g3_chinese_032_ex01","knowledge_id":"g3_chinese_032","question":"填空题：《送东阳马生序》的作者是______，字______，号______，______（朝代）初期文学家。本文是一篇______，是作者写给同乡后学马生的临别赠言。","answer":"答案：宋濂、景濂、潜溪、明、赠序\n解析：本题考查文学常识。宋濂，字景濂，号潜溪，元末明初文学家，被明太祖朱元璋誉为\"开国文臣之首\"，与高启、刘基并称为\"明初诗文三大家\"。《送东阳马生序》是宋濂写给同乡晚辈马君则的一篇赠序。赠序是一种文体，是临别赠言性质的文字，内容多为勉励、赞许、推重之辞。这篇文章通过叙述作者年轻时求学的艰难和勤奋学习的经历，勉励马生珍惜现在优越的学习条件，专心刻苦地学习。"},{"id":"g3_chinese_032_ex02","knowledge_id":"g3_chinese_032","question":"选择题：下列句子中加点词的解释，不正确的一项是（  ）\nA. 无从致书以观（得到）\nB. 以是人多以书假余（假装）\nC. 尝趋百里外（快步走）\nD. 援疑质理（提出；询问）","answer":"答案：B\n解析：本题考查对文言实词的理解。A、C、D三项的解释都是正确的。B项解释有误，\"假\"在这里是\"借\"的意思，不是\"假装\"。\"以是人多以书假余\"的意思是\"因此人家大多愿意把书借给我\"。\"假\"在古代汉语中常作\"借\"讲，如\"假道伐虢\"\"久假不归\"等成语中的\"假\"都是\"借\"的意思。学习文言文要注意积累一词多义的现象。"},{"id":"g3_chinese_032_ex03","knowledge_id":"g3_chinese_032","question":"填空题：《送东阳马生序》中，作者从四个方面叙述了自己年轻时求学的艰难：一是______，二是______，三是______，四是______。作者写自己求学经历的目的是______。","answer":"答案：借书之难、求师之难、旅途之艰、生活之苦、用自己的亲身经历，勉励马生珍惜现在优越的学习条件，刻苦勤奋地学习\n解析：本题考查对文章内容和写作目的的理解。《送东阳马生序》一文，作者从四个方面叙述了自己年轻时求学的艰难：一是借书之难——家贫无书，只能借书抄录，天大寒也不敢懈怠；二是求师之难——跑到百里之外向名师请教，恭敬地拜师求学；三是旅途之艰——背着书箱，拖着鞋子，在深山大谷中行走，寒冬腊月，足肤皲裂而不知；四是生活之苦——每天只吃两顿饭，穿的是破旧的衣服，而同舍生都衣着华丽，作者却毫无羡慕之意。作者之所以这样写，是要用自己的亲身经历来现身说法，勉励马生珍惜现在优越的学习条件，刻苦勤奋地学习，以期学有所成。"},{"id":"g3_chinese_032_ex04","knowledge_id":"g3_chinese_032","question":"简答题：《送东阳马生序》中，作者为什么要写同舍生的奢华生活？这是什么写作手法？有什么作用？","answer":"答案：作者写同舍生\"皆被绮绣，戴朱缨宝饰之帽，腰白玉之环，左佩刀，右备容臭，烨然若神人\"的奢华生活，是为了与自己\"缊袍敝衣处其间\"的艰苦生活形成对比。\n这是对比（反衬）的写作手法。\n作用：①用同舍生的奢华生活反衬出作者生活的艰苦，突出了作者求学条件的恶劣；②通过对比，表现了作者因为心中有读书的乐趣，所以不觉得吃的穿的不如人，突出了作者勤奋刻苦、一心向学的精神；③用这种鲜明的对比，给读者留下深刻印象，增强了文章的感染力和说服力，更能激励马生勤奋学习，也使文章的中心更加突出。\n解析：本题考查对比手法的运用及其作用。对比是文学作品中常用的写作手法，通过把两种相反或相对的事物放在一起进行比较，能够突出被表现事物的特点，增强文章的艺术效果和感染力。答题时要结合文章具体内容，分析对比的双方是什么，以及这种对比对表现人物、突出中心的作用。"},{"id":"g3_chinese_032_ex05","knowledge_id":"g3_chinese_032","question":"选择题：下列各组句子中，加点词的意义和用法相同的一项是（  ）\nA. 以是人多以书假余 / 以衾拥覆\nB. 走送之 / 当余之从师也\nC. 足肤皲裂而不知 / 久而乃和\nD. 盖余之勤且艰若此 / 且欲与常马等不可得","answer":"答案：A\n解析：本题考查文言虚词的意义和用法。A项中两个\"以\"都是介词，\"用\"的意思，用法相同；B项中前一个\"之\"是代词，代指书，后一个\"之\"是助词，用在主谓之间，取消句子独立性，用法不同；C项中前一个\"而\"是转折连词，\"却\"的意思，后一个\"而\"是表修饰的连词，用法不同；D项中前一个\"且\"是\"并且\"的意思，表并列，后一个\"且\"是\"尚且\"的意思，用法不同。学习文言文要注意积累常见虚词的用法，结合具体语境来辨析。"},{"id":"g3_chinese_032_ex06","knowledge_id":"g3_chinese_032","question":"填空题：《送东阳马生序》中，揭示作者不怕艰苦、勤奋学习原因的句子是：\"______，______。\"这说明作者心中有更高的追求，所以才能不介意物质生活的贫乏。","answer":"答案：以中有足乐者、不知口体之奉不若人也\n解析：本题考查对文章内容的理解。\"以中有足乐者，不知口体之奉不若人也\"是全文的点睛之笔，意思是\"因为内心有值得快乐的事（指读书），所以不觉得吃的穿的不如人\"。这句话揭示了作者为什么能在那么艰苦的条件下仍然坚持学习的原因——他从读书中获得了精神上的快乐和满足，所以不在意物质生活的贫困。这正是宋濂能够学有所成的关键所在，也是作者要告诉马生的道理：学习要有浓厚的兴趣，要有精神追求。"},{"id":"g3_chinese_032_ex07","knowledge_id":"g3_chinese_032","question":"文言文阅读：阅读下面的文言文，回答问题。\n\n\n余幼时即嗜学。家贫，无从致书以观，每假借于藏书之家，手自笔录，计日以还。天大寒，砚冰坚，手指不可屈伸，弗之怠。录毕，走送之，不敢稍逾约。以是人多以书假余，余因得遍观群书。既加冠，益慕圣贤之道。又患无硕师名人与游，尝趋百里外，从乡之先达执经叩问。先达德隆望尊，门人弟子填其室，未尝稍降辞色。余立侍左右，援疑质理，俯身倾耳以请；或遇其叱咄，色愈恭，礼愈至，不敢出一言以复；俟其欣悦，则又请焉。故余虽愚，卒获有所闻。\n\n\n问题：（1）解释下列加点的词语。①无从致书以观 ②走送之 ③尝趋百里外 ④礼愈至\n（2）将下面的句子翻译成现代汉语。①天大寒，砚冰坚，手指不可屈伸，弗之怠。 ②故余虽愚，卒获有所闻。\n（3）选文中，作者是从哪两个
