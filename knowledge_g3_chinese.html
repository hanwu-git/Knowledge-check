    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"id":"g3_chinese_001","chapter":"第一单元 活动·探究","name":"现代诗歌阅读","formula":"现代诗歌三要素：意象、情感、语言","explanation":"现代诗歌（新诗）是\"五四\"新文化运动时期产生的新体诗，特点是形式自由、意涵丰富、意象经营重于修辞。阅读方法：1. 把握诗歌的意象（意象是融入了诗人主观情感的客观物象）；2. 体会诗人的情感（借助意象体会诗人的思想感情）；3. 品味诗歌的语言（凝练、形象、富有节奏感）；4. 分析诗歌的表现手法（比喻、拟人、排比、反复、象征等）。","semester":"upper"},{"id":"g3_chinese_002","chapter":"第一单元 活动·探究","name":"《沁园春·雪》毛泽东","formula":"词牌名沁园春，题目雪；上阕写景，下阕议论抒情","explanation":"《沁园春·雪》是毛泽东创作的一首词，\"沁园春\"是词牌名，\"雪\"是题目。上阕描写北国雪景，展现祖国山河的壮丽；下阕由祖国山河的壮丽引出英雄人物，纵论历代英雄，抒发诗人的抱负。艺术特色：1. 写景、议论、抒情相结合；2. 语言凝练，气势磅礴；3. 运用比喻、拟人、对偶等修辞手法。\"俱往矣，数风流人物，还看今朝\"是主旨句，点明主题。","semester":"upper"},{"id":"g3_chinese_003","chapter":"第一单元 活动·探究","name":"《乡愁》余光中","formula":"乡愁是一枚小小的邮票……邮票—船票—坟墓—海峡","explanation":"《乡愁》是台湾诗人余光中的代表作。诗人以时间的发展为序，以情感为线索，选取了四个象征性的意象：邮票（小时候）邮票、（长大后）船票、（后来啊）坟墓、（而现在）海峡，将抽象的乡愁具体化、具体化，表达了对家乡的思念和对祖国统一的渴望。艺术特色：1. 结构整齐，富有音乐美；2. 意象独特，意蕴深厚；3. 反复咏叹，情感层层递进。","semester":"upper"},{"id":"g3_chinese_004","chapter":"第一单元 活动·探究","name":"我爱这土地","formula":"意象：鸟、土地、河流、风、黎明；象征手法","explanation":"《我爱这土地》是艾青的代表作。诗人假设自己是一只鸟，以鸟的形象来抒发对土地（祖国）的挚爱。土地象征着繁衍养育中华民族的祖国大地；河流象征着中国人民不屈不挠的反抗精神；风象征着人民心中对侵略者的愤怒；黎明象征着充满生机与希望的解放区。\"为什么我的眼里常含泪水？因为我对这土地爱得深沉……\"点明主题。","semester":"upper"},{"id":"g3_chinese_005","chapter":"第二单元","name":"议论文阅读（一）论点","formula":"议论文三要素：论点、论据、论证","explanation":"议论文是以议论为主要表达方式，通过摆事实、讲道理，直接表达作者的观点和主张的文体。三要素：1. 论点（作者对所论述问题的见解和主张，是议论文的灵魂）；2. 论据（证明论点的材料，包括事实论据和道理论据）；3. 论证（用论据证明论点的过程和方法）。论点的位置：标题、开头、中间、结尾。找论点的方法：看标题、看开头、看结尾、看中间承上启下的过渡句。","semester":"upper"},{"id":"g3_chinese_006","chapter":"第二单元","name":"议论文阅读（二）论据与论证","formula":"论证方法：举例论证、道理论证、比喻论证、对比论证","explanation":"论据类型：1. 事实论据（史实、典型事例、统计数据等）；2. 道理论据（名人名言、谚语俗语、原理公式等）。论证方法：1. 举例论证（列举确凿充分的事实，具体有力地论证了……）；2. 道理论证（引用名言警句、公理等，权威有力地论证了……）；3. 比喻论证（用人们熟知的事物作比喻，生动形象地论证了……）；4. 对比论证（正反两方面对比，突出强调了……）。论证方式：立论、驳论。","semester":"upper"},{"id":"g3_chinese_007","chapter":"第二单元","name":"敬业与乐业","formula":"中心论点：敬业乐业是人类生活的不二法门","explanation":"《敬业与乐业》是梁启超的一篇演讲稿。中心论点是\"敬业乐业四个字，是人类生活的不二法门\"。文章结构：总—分—总。开头提出论点，中间从\"有业之必要\"\"敬业之重要\"\"乐业之重要\"三个方面分别论述，最后总结全文，勉励人们要发扬敬业乐业的精神。论证方法：举例论证、道理论证、对比论证。语言特点：通俗易懂，多用口语，富有鼓动性。","semester":"upper"},{"id":"g3_chinese_008","chapter":"第二单元","name":"论教养","formula":"论题：教养；论点：教养的本质是尊重","explanation":"《论教养》是利哈乔夫的一篇议论文。文章开门见山，引出论题——什么是真正的教养。然后从\"无教养\"和\"有教养\"的表现进行对比论证，论述了真正的教养表现在日常生活的细节中，教养的本质是尊重。最后强调优雅风度是教养的外在表现，教养首先要尊重别人，要有礼貌，要学会体谅别人。论证方法：举例论证、对比论证。语言特点：逻辑严密，事例丰富。","semester":"upper"},{"id":"g3_chinese_009","chapter":"第三单元","name":"文言文阅读（一）实词","formula":"文言实词：通假字、古今异义、一词多义、词类活用","explanation":"文言实词是文言文阅读的基础。常见现象：1. 通假字（用读音相同或相近的字代替本字，如\"便要还家\"中\"要\"通\"邀\"，邀请）；2. 古今异义（古义和今义不同，如\"妻子\"古义是妻子和儿女，今义是男子的配偶）；3. 一词多义（一个词有多个义项，如\"亡\"有灭亡、丢失、逃跑等义）；4. 词类活用（名词作动词、形容词作动词、名词作状语、使动用法、意动用法等）。","semester":"upper"},{"id":"g3_chinese_010","chapter":"第三单元","name":"文言文阅读（二）虚词与句式","formula":"常见虚词：之、其、而、以、于、乃、虽、为；特殊句式：判断句、省略句、倒装句、被动句","explanation":"文言虚词数量少但用法灵活。常见虚词：之（的、代词、主谓之间取消句子独立性、到往）、其（他的、大概、难道）、而（表并列、承接、转折、修饰）、以（用、把、因为、来）、于（在、比、对、从）。特殊句式：1. 判断句（……者，……也/乃/则/皆等）；2. 省略句（省主语、省谓语、省宾语）；3. 倒装句（宾语前置、状语后置、定语后置）；4. 被动句（为……所……/见……于……/被）。","semester":"upper"},{"id":"g3_chinese_011","chapter":"第三单元","name":"岳阳楼记","formula":"先天下之忧而忧，后天下之乐而乐","explanation":"《岳阳楼记》是范仲淹的代表作。文章通过对岳阳楼景物的描写和对\"迁客骚人\"登楼览物之情的分析，表达了作者\"不以物喜，不以己悲\"的旷达胸襟和\"先天下之忧而忧，后天下之乐而乐\"的政治抱负。写作特色：1. 叙事、写景、抒情、议论相结合；2. 对比手法（迁客骚人的\"以物喜，以己悲\"与古仁人的\"不以物喜，不以己悲\"对比）；3. 骈散结合，语言优美。成语：政通人和、百废具兴、气象万千、心旷神怡。","semester":"upper"},{"id":"g3_chinese_012","chapter":"第三单元","name":"醉翁亭记","formula":"醉翁之意不在酒，在乎山水之间也","explanation":"《醉翁亭记》是欧阳修的代表作。文章描写了醉翁亭秀丽的自然风光和游人的山水之乐，表达了作者\"与民同乐\"的旷达情怀。\"醉翁之意不在酒，在乎山水之间也\"点明了\"醉\"是表象，\"乐\"是实质。写作特色：1. 结构精巧，一线串珠（\"乐\"字贯穿全文）；2. 情景交融，景中有情；3. 骈散结合，语言凝练优美；4. 21个\"也\"字，一韵到底。成语：醉翁之意不在酒、水落石出、觥筹交错。","semester":"upper"},{"id":"g3_chinese_013","chapter":"第三单元","name":"湖心亭看雪","formula":"白描手法；舟子的话点明主旨","explanation":"《湖心亭看雪》是张岱的一篇小品文。文章用清新淡雅的笔墨，写出了雪后西湖的奇景和游湖人的雅趣，表达了作者清高自赏的感情和淡淡的愁绪。写作特色：1. 白描手法（\"一痕、一点、一芥、两三粒\"，用极简的笔墨勾勒出景物的形与神）；2. 情景交融，景中含情；3. 侧面烘托（以舟子的话\"莫说相公痴，更有痴似相公者\"收束全文，点明\"痴\"字是点睛之笔。","semester":"upper"},{"id":"g3_chinese_014","chapter":"第四单元","name":"小说阅读（一）","formula":"小说三要素：人物、情节、环境","explanation":"小说是以塑造人物形象为中心，通过完整的故事情节和具体的环境描写来反映社会生活的一种文学体裁。三要素：1. 人物（小说的核心，塑造人物的方法：外貌描写、语言描写、动作描写、心理描写、神态描写、细节描写等，还有正面描写和侧面描写）；2. 情节（开端、发展、高潮、结局四部分，有的还有序幕和尾声）；3. 环境（自然环境和社会环境）。人物描写的作用：表现人物性格，推动情节发展，突出文章主题。","semester":"upper"},{"id":"g3_chinese_015","chapter":"第四单元","name":"小说阅读（二）环境与主题","formula":"环境描写的作用：渲染气氛、烘托心情、推动情节、交代背景","explanation":"环境描写包括自然环境和社会环境。自然环境描写的作用：1. 交代故事发生的时间、地点、季节、气候等；2. 渲染气氛；3. 烘托人物心情；4. 推动情节发展；5. 为下文作铺垫。社会环境描写的作用：1. 交代故事发生的时代背景；2. 渲染环境氛围；3. 烘托人物心情；4. 推动情节发展；5. 深化主题。概括小说主题的方法：从题目、开头结尾、重点段落、人物事件入手。","semester":"upper"},{"id":"g3_chinese_016","chapter":"第四单元","name":"故乡","formula":"对比手法；闰土、杨二嫂人物形象；主题：辛亥革命前后农村破产","explanation":"《故乡》是鲁迅的小说，选自《呐喊》。小说以\"我\"回故乡的见闻和感受为线索，通过闰土20多年前后的变化，描绘了辛亥革命后十年间中国农村经济萧条、破产的悲惨景象，揭示了广大农民生活痛苦的社会根源，表达了作者改造旧社会、创造新生活的强烈愿望。人物形象：闰土（勤劳善良，但麻木、迟钝，受封建等级观念毒害）、杨二嫂（自私、刻薄、势利的小市民形象）。对比手法：少年闰土与中年闰土对比、故乡前后景对比。","semester":"upper"},{"id":"g3_chinese_017","chapter":"第四单元","name":"我的叔叔于勒","formula":"莫泊桑；线索：于勒的贫富变化；主题：资本主义社会金钱至上","explanation":"《我的叔叔于勒》是法国作家莫泊桑的短篇小说（世界三大短篇小说巨匠：莫泊桑、契诃夫、欧·亨利）。小说以菲利普夫妇对于勒的态度变化为主线，以于勒的贫富变化为暗线，揭露了资本主义社会人与人之间赤裸裸的金钱关系。人物形象：菲利普夫妇（虚荣、势利、自私、冷酷）。艺术特色：1. 以小见大，通过家庭小事反映社会大主题；2. 对比手法（菲利普夫妇对于勒态度前后对比）；3. 出人意料的结尾。","semester":"upper"},{"id":"g3_chinese_018","chapter":"第五单元","name":"议论文阅读（三）驳论与思辨","formula":"驳论方法：驳论点、驳论据、驳论证","explanation":"议论文按论证方式分为立论和驳论。驳论是就一定的事件和问题发表议论，揭露和驳斥错误的、反动的见解或主张。驳论方法：1. 驳论点（直接驳斥对方论点的错误）；2. 驳论据（通过批驳对方论据的错误来驳倒对方论点）；3. 驳论证（通过批驳对方论证过程中的逻辑错误来驳倒对方论点）。驳论文的一般结构：树靶子（摆出错误论点）—批靶子（直接批驳或间接批驳）—立观点（提出自己的正确观点）。","semester":"upper"},{"id":"g3_chinese_019","chapter":"第五单元","name":"中国人失掉自信力了吗","formula":"驳论证；中国的脊梁","explanation":"《中国人失掉自信力了吗》是鲁迅的一篇驳论文，选自《且介亭杂文》。文章针对当时有人散布\"中国人失掉自信力了\"的错误论调，义正辞严地批驳了这种错误观点，指出\"我们有并不失掉自信力的中国人在\"，极大地鼓舞了民族自信心和自豪感。论证思路：先摆出对方的论点和论据（树靶子），然后直接批驳对方的论证（信\"地\"、信\"物\"、信\"国联\"，从来就没有信过\"自己\"），再间接批驳（从古至今都有中国的脊梁在），最后得出结论。","semester":"upper"},{"id":"g3_chinese_020","chapter":"第五单元","name":"创造宣言","formula":"中心论点：处处是创造之地，天天是创造之时，人人是创造之人","explanation":"《创造宣言》是陶行知的一篇议论文。作者用生动的事例驳斥了五种不能创造的错误观点（环境太平凡、生活太单调、年纪太小、太无能、山穷水尽走投无路），得出\"处处是创造之地，天天是创造之时，人人是创造之人\"的结论，鼓励人们要敢于创造，勇于创造。论证方法：举例论证、道理论证、比喻论证、对比论证。语言特点：激情澎湃，富有号召力。","semester":"upper"},{"id":"g3_chinese_021","chapter":"第六单元","name":"文言文阅读（三）史传文","formula":"史传文分类：编年体、纪传体、国别体、纪事本末体","explanation":"史传文是以记载历史事件和历史人物为主的文言文。体例：1. 编年体（按年代顺序编排，如《左传》《资治通鉴》）；2. 纪传体（以人物传记为中心，如《史记》）；3. 国别体（按国家分别记载，如《战国策》《国语》）；4. 纪事本末体（以事件为中心）。《史记》是我国第一部纪传体通史，被鲁迅誉为\"史家之绝唱，无韵之离骚\"。阅读史传文要注意：了解历史背景、把握人物形象、体会作者情感。","semester":"upper"},{"id":"g3_chinese_022","chapter":"第六单元","name":"智取生辰纲","formula":"《水浒》；智取生辰纲；双线结构；智多星吴用","explanation":"《智取生辰纲》节选自《水浒》（《水浒传》），作者施耐庵，元末明初小说家。《水浒》是我国第一部歌颂农民起义的长篇章回体小说。课文通过对杨志押送生辰纲失败经过的描写，刻画了杨志精明能干、小心谨慎但又粗暴蛮横、刚愎自用的性格特点，展现了吴用等人的足智多谋。双线结构：明线是杨志押送生辰纲（上路—中计—失纲），暗线是吴用等人智取生辰纲（定计—施计—劫纲）。\"智\"的体现：智用天时、智用地利、智用矛盾、智用计谋。","semester":"upper"},{"id":"g3_chinese_023","chapter":"第六单元","name":"范进中举","formula":"《儒林外史》；讽刺艺术；范进、胡屠户","explanation":"《范进中举》节选自《儒林外史》，作者吴敬梓，清代小说家。《儒林外史》是我国清代一部杰出的现实主义的长篇讽刺小说，主要描写封建社会后期知识分子及官绅的活动和精神面貌。课文通过范进中举前后的生活变化，刻画了范进醉心功名、热衷科举的形象和胡屠户趋炎附势、嫌贫爱富的市侩形象，抨击了封建科举制度对知识分子的毒害。讽刺手法：夸张、对比、细节描写。","semester":"upper"},{"id":"g3_chinese_024","chapter":"第六单元","name":"三顾茅庐","formula":"《三国演义》；刘备、诸葛亮；隆中对","explanation":"《三顾茅庐》节选自《三国演义》，作者罗贯中，元末明初小说家。《三国演义》是我国第一部章回体长篇历史演义小说。课文讲述了刘备三次亲自到隆中拜访诸葛亮，请他出山辅佐自己的故事，表现了刘备求贤若渴、礼贤下士的品质和诸葛亮的雄才大略、高瞻远瞩。人物形象：刘备（求贤若渴、礼贤下士）、诸葛亮（胸怀大志、足智多谋、淡泊名利）。写作特色：1. 对比烘托（用张飞的急躁反衬刘备的诚意）；2. 层层铺垫；3. 细节描写。","semester":"upper"},{"id":"g3_chinese_025","chapter":"九年级上册古诗文背诵","formula":"必背古诗文：行路难、酬乐天扬州初逢席上见赠、水调歌头、月夜忆舍弟等","explanation":"九年级上册必背古诗文：1. 《沁园春·雪》毛泽东；2. 《岳阳楼记》范仲淹；3. 《醉翁亭记》欧阳修；4. 《湖心亭看雪》张岱；5. 《行路难（其一）》李白；6. 《酬乐天扬州初逢席上见赠》刘禹锡；7. 《水调歌头》苏轼；8. 《月夜忆舍弟》杜甫；9. 《长沙过贾谊宅》刘长卿；10. 《左迁至蓝关示侄孙湘》韩愈；11. 《商山早行》温庭筠。背诵方法：理解记忆、反复诵读、结合写作背景记忆。","semester":"upper"},{"id":"g3_chinese_026","chapter":"第一单元","name":"现代诗阅读（二）","formula":"小说阅读：把握故事情节、分析人物形象、理解环境描写","explanation":"九年级下册第一单元是小说单元。阅读小说要注意：1. 梳理故事情节（开端、发展、高潮、结局）；2. 分析人物形象（通过外貌、语言、动作、心理、神态描写分析人物性格）；3. 理解环境描写的作用（自然环境和社会环境）；4. 把握小说主题（通过人物命运和故事情节理解主题）；5. 品味小说语言（不同作家的语言风格不同）。小说的线索：可以是人、物、事、情、时间、空间等。","semester":"lower"},{"id":"g3_chinese_027","chapter":"第一单元","name":"孔乙己","formula":"鲁迅；孔乙己形象；主题：科举制度害人","explanation":"《孔乙己》是鲁迅的短篇小说，选自《呐喊》。小说塑造了孔乙己这样一个迂腐、清高、好喝懒做、自欺欺人但又善良诚实的封建社会下层知识分子形象，深刻揭露了封建科举制度的罪恶和封建社会的冷酷无情。孔乙己是\"站着喝酒而穿长衫的唯一的人\"。描写方法：外貌描写、语言描写、动作描写、神态描写。艺术特色：1. 以小伙计\"我\"的视角叙事；2. 社会环境描写（咸亨酒店是当时社会的缩影）；3. 对比手法。","semester":"lower"},{"id":"g3_chinese_028","chapter":"第一单元","name":"变色龙","formula":"契诃夫；奥楚蔑洛夫；见风使舵、趋炎附势","explanation":"《变色龙》是俄国作家契诃夫的短篇小说。小说通过描写警官奥楚蔑洛夫处理狗咬人事件中，随着狗主人身份的变化而态度不断变化的过程，刻画了一个见风使舵、趋炎附势、媚上欺下的沙皇专制制度走狗的形象，揭露了沙皇专制统治的黑暗。\"变色龙\"成为世界文学史上的典型形象。艺术特色：1. 夸张讽刺；2. 对比手法（奥楚蔑洛夫态度的前后对比）；3. 细节描写（军大衣的穿脱）；4. 以小见大。","semester":"lower"},{"id":"g3_chinese_029","chapter":"第二单元","name":"散文阅读","formula":"散文特点：形散神不散","explanation":"散文是一种自由、灵活的抒写见闻感受的文体。特点：形散神不散（形散：选材广泛自由、表达方式多样、结构自由；神不散：主题集中）。散文分类：叙事散文、抒情散文、议论散文。阅读方法：1. 把握文章主题（找线索、找文眼）；2. 体会作者情感（结合写作背景、关键语句）；3. 品味散文语言（优美、凝练、富有表现力）；4. 分析表现手法（象征、托物言志、借景抒情、欲扬先抑、对比衬托等）；5. 理清文章结构（总分、并列、层进等）。","semester":"lower"},{"id":"g3_chinese_030","chapter":"第二单元","name":"鱼我所欲也","formula":"孟子；中心论点：舍生取义","explanation":"《鱼我所欲也》选自《孟子·告子上》。孟子，名轲，字子舆，战国时期思想家、教育家，儒家学派代表人物，被尊称为\"亚圣\"。文章以鱼和熊掌设喻，提出中心论点\"舍生而取义者也\"，然后从正反两方面进行论述，告诉我们人人都有向善之心，贤者能坚守本心。论证方法：比喻论证、举例论证、对比论证、道理论证。\"本心\"指的是人的羞恶之心，即\"义\"。成语：舍生取义、嗟来之食。","semester":"lower"},{"id":"g3_chinese_031","chapter":"第三单元","name":"文言文阅读（四）诸子散文","formula":"儒家：孔子、孟子、荀子；道家：老子、庄子；墨家：墨子；法家：韩非子","explanation":"诸子散文是春秋战国时期各个学派的著作，反映着不同学派的思想倾向。重要学派：1. 儒家（孔子、孟子、荀子，主张仁政、礼治）；2. 道家（老子、庄子，主张无为而治、道法自然）；3. 墨家（墨子，主张兼爱、非攻、尚贤）；4. 法家（韩非子，主张以法治国、中央集权）。《孟子》《庄子》《墨子》《韩非子》等是诸子散文的代表作品。阅读诸子散文要注意：了解各学派思想主张、体会论辩艺术。","semester":"lower"},{"id":"g3_chinese_032","chapter":"第三单元","name":"送东阳马生序","formula":"宋濂；劝学；对比手法","explanation":"《送东阳马生序》是宋濂写给同乡后学马生的一篇赠序。文章叙述了作者青少年时代求学的艰难和勤奋学习的经历，勉励马生珍惜现有的学习条件，专心治学，以期学有所成。对比手法：1. 老师的严厉和作者的恭敬对比；2. 同舍生的奢华和作者的贫寒对比；3. 作者求学的艰难和现在太学生条件的优越对比。写作目的：劝学，告诉年轻人要刻苦勤奋学习。成语：德隆望尊、俯身倾耳、缊袍敝衣。","semester":"lower"},{"id":"g3_chinese_033","chapter":"第三单元","name":"曹刿论战","formula":"《左传》；长勺之战；取信于民、以弱胜强","explanation":"《曹刿论战》选自《左传·庄公十年》。《左传》是我国第一部叙事详细的编年体史书，相传是春秋时期左丘明所作。文章记叙了齐鲁长勺之战，以弱胜强的史实，说明了政治上取信于民、军事上把握时机是弱国战胜强国的必要条件，表现了曹刿的政治远见和军事才能。人物形象：曹刿（深谋远虑、谨慎果断、有政治远见和军事才能）、鲁庄公（鄙陋、鲁莽，但能听取意见）。写作特色：1. 详略得当（详写论战，略写作战过程）；2. 对比手法。","semester":"lower"},{"id":"g3_chinese_034","chapter":"第四单元","name":"戏剧阅读","formula":"戏剧三要素：戏剧冲突、戏剧语言、舞台说明","explanation":"戏剧是一种综合的舞台艺术，它借助文学、音乐、舞蹈、美术等艺术手段塑造舞台艺术形象，揭示社会矛盾，反映社会生活。三要素：1. 戏剧冲突（人与人之间、人物内心的矛盾冲突，是戏剧的核心）；2. 戏剧语言（包括人物语言即台词和舞台说明，台词包括对话、独白、旁白等）；3. 舞台说明（写在剧本每一幕的开头、结尾和对话中间的说明性文字）。戏剧分类：按表现形式分为话剧、歌剧、舞剧等；按剧情繁简和结构分为独幕剧和多幕剧。","semester":"lower"},{"id":"g3_chinese_035","chapter":"第四单元","name":"威尼斯商人","formula":"莎士比亚；夏洛克；喜剧；鲍西娅","explanation":"《威尼斯商人》是英国戏剧大师莎士比亚的早期喜剧作品。课文节选的是全剧最精彩的\"法庭审判\"一场，描写了威尼斯商人安东尼奥为了帮助朋友巴萨尼奥向高利贷者夏洛克借钱，到期无力偿还，夏洛克坚持要按约从安东尼奥身上割下一磅肉的故事。鲍西娅女扮男装，巧妙地利用法律条款，机智地战胜了夏洛克。人物形象：夏洛克（贪婪、吝啬、狠毒、狡猾的高利贷者）、鲍西娅（聪明、机智、勇敢、善良、有才智）。主题：谴责仇恨和残忍，歌颂友谊和仁爱。","semester":"lower"},{"id":"g3_chinese_036","chapter":"第五单元","name":"文言文阅读（五）诗词曲","formula":"唐诗、宋词、元曲；表现手法：借景抒情、托物言志、用典、对比","explanation":"古代诗歌发展脉络：《诗经》→楚辞→汉乐府→唐诗→宋词→元曲。唐诗体裁：古体诗（古风）、近体诗（律诗、绝句）。宋词：婉约派（柳永、李清照）、豪放派（苏轼、辛弃疾）。元曲：散曲和杂剧。鉴赏方法：1. 理解词句意思；2. 把握意象意境；3. 体会思想感情；4. 分析表现手法（借景抒情、托物言志、用典、对比、衬托、动静结合、虚实结合等）；5. 品味语言风格。","semester":"lower"},{"id":"g3_chinese_037","chapter":"第五单元","name":"出师表","formula":"诸葛亮；表；亲贤臣，远小人","explanation":"《出师表》是诸葛亮率师北上伐魏前给后主刘禅上的奏章。\"表\"是古代向帝王上书陈情言事的一种文体。文章表达了诸葛亮\"报先帝而忠陛下\"的真挚感情和\"北定中原\"\"兴复汉室\"的决心。主要内容：1. 分析当前形势，提出广开言路、严明赏罚、亲贤远佞三条建议；2. 追忆往事，表达对先帝的感激和对陛下的忠诚；3. 表明出师北伐的决心。成语：妄自菲薄、作奸犯科、计日而待、三顾茅庐、鞠躬尽瘁、临危受命。","semester":"lower"},{"id":"g3_chinese_038","chapter":"第五单元","name":"诗词曲五首","formula":"十五从军征、白雪歌送武判官归京、南乡子·登京口北固亭有怀、过零丁洋、山坡羊·潼关怀古","explanation":"诗词曲五首：1. 《十五从军征》（乐府诗），揭露了封建社会兵役制度的不合理；2. 《白雪歌送武判官归京》岑参，边塞诗，\"忽如一夜春风来，千树万树梨花开\"；3. 《南乡子·登京口北固亭有怀》辛弃疾，词，借古讽今，表达对南宋朝廷的不满；4. 《过零丁洋》文天祥，\"人生自古谁无死？留取丹心照汗青\"，表现了诗人舍生取义的决心；5. 《山坡羊·潼关怀古》张养浩，散曲，\"兴，百姓苦；亡，百姓苦\"，揭示了历史兴亡给人民带来的苦难。","semester":"lower"},{"id":"g3_chinese_039","chapter":"第六单元","name":"名著阅读（一）","formula":"《水浒》《儒林外史》《简·爱》","explanation":"九年级名著阅读：《水浒》《儒林外史》《简·爱》是必考内容。《水浒》：作者施耐庵，元末明初，我国第一部歌颂农民起义的长篇章回体小说，主题官逼民反，人物鲁智深、林冲、武松、宋江等。《儒林外史》：吴敬梓，清代，长篇讽刺小说，讽刺科举制度。《简·爱》：夏洛蒂·勃朗特，英国，简·爱自尊自爱自强的女性形象。阅读方法：了解作者背景、把握主要内容、分析人物形象、理解主题思想、体会艺术特色。","semester":"lower"},{"id":"g3_chinese_040","chapter":"第六单元","name":"名著阅读（二）","formula":"《朝花夕拾》《骆驼祥子》《钢铁是怎样炼成的》","explanation":"初中必读名著还有：《朝花夕拾》鲁迅，回忆性散文集，十篇散文。《骆驼祥子》老舍，讲述了人力车夫祥子三起三落的人生经历，揭露了旧社会的黑暗。《钢铁是怎样炼成的》奥斯特洛夫斯基，苏联，保尔·柯察金的成长道路，革命者的形象。此外还有《西游记》《三国演义》《红楼梦》《水浒传》四大名著。考查题型：文学常识、故事情节、人物形象、主题思想、艺术特色。","semester":"lower"},{"id":"g3_chinese_041","chapter":"写作专题（一）","name":"作文审题与立意","formula":"审题要准；立意要新、要深、要明","explanation":"审题就是认真分析题目，把握题旨，明确要求。审题方法：1. 抓关键词语；2. 理解比喻义象征义；3. 把握关系型题目的关系；4. 注意提示语和要求。立意就是确立文章的中心思想。立意要求：1. 正确（思想健康，积极向上）；2. 明确（中心突出，观点鲜明）；3. 深刻（挖掘事物的本质，有思想深度）；4. 新颖（见解独到，不落俗套）。立意方法：以小见大、由表及里、由此及彼、逆向思维等。","semester":"lower"},{"id":"g3_chinese_042","chapter":"写作专题（二）","name":"记叙文写作","formula":"六要素：时间、地点、人物、起因、经过、结果","explanation":"记叙文是以记人、叙事、写景、状物为主要内容的一种文体。六要素：时间、地点、人物、起因、经过、结果。记叙文写作要求：1. 选材要典型新颖；2. 叙事要有条理（顺叙、倒叙、插叙）；3. 人物要生动形象（多种描写方法）；4. 中心要明确突出；5. 感情要真挚自然。开头结尾方法：开头（开门见山、设置悬念、描写环境、引用名言等）；结尾（首尾呼应、点明中心、抒情议论、景物烘托等）。","semester":"lower"},{"id":"g3_chinese_043","chapter":"写作专题（三）","name":"议论文写作","formula":"三段式：引论—本论—结论","explanation":"议论文写作三要素：论点、论据、论证。基本结构：引论（提出问题）—本论（分析问题）—结论（解决问题）。本论部分常见结构：1. 并列式（分论点并列）；2. 递进式（层层深入）；3. 对比式（正反对比）。议论文写作要求：1. 论点要正确鲜明；2. 论据要充分典型（事实论据和道理论据结合）；3. 论证要严密有力（多种论证方法结合）；4. 结构要清晰完整；5. 语言要准确严密。","semester":"lower"},{"id":"g3_chinese_044","chapter":"综合性学习","name":"综合性学习与口语交际","formula":"语言表达要简明、连贯、得体","explanation":"综合性学习考查学生语文综合运用能力。常见题型：1. 语言表达（开场白、结束语、串词、颁奖词、发言稿等）；2. 材料探究（从材料中提取信息、得出结论）；3. 图文转换（图表、漫画、徽标等）；4. 活动设计（活动方案设计、活动步骤设计）。口语交际要求：1. 简明（简洁明了，不啰嗦）；2. 连贯（话题统一，句序合理，过渡自然）；3. 得体（符合语境和语体）。答题技巧：看清要求、结合语境、注意对象、讲究文明。","semester":"lower"},{"id":"g3_chinese_045","chapter":"古诗文默写","name":"古诗文名句默写","formula":"理解性默写；易错字提醒","explanation":"古诗文默写是中考必考内容。考查形式：直接默写、理解性默写、情境默写。易错字：1. 生僻难写字（如\"瀚海阑干百丈冰\"的\"瀚\"）；2. 同音异义词（如\"天涯若比邻\"的\"涯\"不要写成\"崖\"）；3. 同义异形词；4. 通假字。复习方法：1. 理解记忆（理解意思记忆）；2. 反复诵读（熟读成诵）；3. 动笔默写（好记性不如烂笔头）；4. 归纳整理（归类整理名句）；5. 易错字强化（重点突破易错字）。","semester":"lower"},{"id":"g3_chinese_046","chapter":"文言文实词归类（一）","name":"常见文言实词归类","formula":"一词多义、通假字、古今异义、词类活用","explanation":"中考常见文言实词：安、兵、策、道、得、发、故、顾、观、国、过、患、间、见、举、具、绝、类、临、名、奇、强、请、穷、去、如、胜、施、食、使、书、数、说、素、汤、亡、为、鲜、向、许、寻、阳、阴、余、语、狱、御、远、走、足、作等。复习方法：1. 归类整理（按义项归类）；2. 结合例句记忆（结合句子记意思）；3. 语境推断（根据上下文推断）；4. 迁移运用（学过的知识迁移）。","semester":"lower"},{"id":"g3_chinese_047","chapter":"文言文虚词归类","name":"常见文言虚词用法","formula":"之、其、而、以、于、为、乃、虽、则、然","explanation":"中考常见文言虚词：1. 之（代词、助词\"的\"、主谓之间取消句子独立性、动词\"到\"\"往\"、宾语前置标志、定语后置标志）；2. 其（代词\"他的\"\"其中的\"、语气词\"大概\"\"难道\"）；3. 而（表并列、承接、转折、修饰、递进）；4. 以（介词\"用\"\"把\"\"因为\"\"按照\"、连词\"来\"\"以致\"）；5. 于（介词\"在\"\"比\"\"对\"\"从\"\"被\"）；6. 为（介词\"被\"\"对\"\"替\"、动词\"做\"\"成为\"）。复习方法：归类整理、结合例句、反复练习。","semester":"lower"},{"id":"g3_chinese_048","chapter":"现代文阅读（一）","name":"记叙文阅读答题技巧","formula":"概括内容、分析人物、赏析句子、理解含义","explanation":"记叙文阅读常见题型及答题方法：1. 概括内容（谁做了什么，结果怎么样）；2. 分析人物形象（从描写方法、故事情节、作者评价入手）；3. 赏析句子（修辞手法＋表达效果，描写方法＋表达效果，关键词语＋表达效果）；4. 理解词语含义（本义＋语境义＋情感）；5. 题目的作用（概括内容、点明中心、线索、吸引读者）；6. 开头结尾作用（开头：点题、引出下文、设置悬念；结尾：点题、呼应开头、点明中心）。","semester":"lower"},{"id":"g3_chinese_049","chapter":"现代文阅读（二）","name":"说明文阅读答题技巧","formula":"说明对象、说明方法、说明顺序、说明语言","explanation":"说明文是以说明为主要表达方式的文体。常见题型：1. 说明对象及其特征（找中心句、关键词）；2. 说明方法及其作用（举例子：具体真切；列数字：准确具体；作比较：突出强调；打比方：生动形象；分类别：条理清楚；下定义：科学准确；作诠释：解释说明；摹状貌：具体生动）；3. 说明顺序（时间顺序、空间顺序、逻辑顺序）；4. 说明语言（准确性、生动性）；5. 文章结构（总分、总分总、并列、递进）。","semester":"lower"},{"id":"g3_chinese_050","chapter":"中考总复习","name":"语文中考总复习策略","formula":"基础、阅读、写作三大板块","explanation":"中考语文总复习三大板块：1. 积累与运用（字音字形、词语运用、病句辨析、句子排序、文学常识、古诗文默写、名著阅读、综合性学习）；2. 阅读（文言文阅读、现代文阅读）；3. 写作。复习策略：1. 夯实基础（字音字形、古诗文默写等一分不丢）；2. 掌握方法（各种文体的阅读答题方法）；3. 强化训练（限时训练，提高速度和准确率）；4. 积累素材（作文素材积累）；5. 查漏补缺（针对薄弱环节重点突破）。心态调整：保持良好心态，合理安排时间。","semester":"lower"}];

        // ==================== 内嵌例题数据 ====================
        const DATA_EXAMPLES = [{"id":"g3_chinese_001_ex01","knowledge_id":"g3_chinese_001","question":"选择题：下列关于现代诗歌的表述，不正确的一项是（  ）\nA. 现代诗歌也叫新诗，指五四运动前后产生的、有别于古典诗歌的、以白话作为基本语言手段的诗歌体裁\nB. 现代诗歌形式自由，意涵丰富，意象经营重于修辞运用\nC. 现代诗歌必须严格遵守格律和押韵的要求\nD. 现代诗歌一般不拘格式和韵律，形式自由","answer":"答案：C\n解析：现代诗歌的特点是形式自由、意涵丰富、意象经营重于修辞运用，与古典诗歌相比，现代诗歌不严格遵守格律和押韵的要求，而是更注重自由表达。因此C项错误，故选C。"},{"id":"g3_chinese_001_ex02","knowledge_id":"g3_chinese_001","question":"选择题：现代诗歌的三美不包括以下哪一项？（  ）\nA. 音乐美\nB. 绘画美\nC. 建筑美\nD. 语言美","answer":"答案：D\n解析：新月派提出的\"三美\"主张包括音乐美（音节）、绘画美（词藻）、建筑美（节的匀称和句的均齐），是闻一多先生提出的诗歌理论。不包括\"语言美\"这一说法，故选D。"},{"id":"g3_chinese_001_ex03","knowledge_id":"g3_chinese_001","question":"填空题：现代诗歌的主要特点是______、意涵丰富、意象经营重于修辞运用。","answer":"答案：形式自由\n解析：现代诗歌也叫新诗，其主要特点是形式自由、意涵丰富、意象经营重于修辞运用。它打破了旧体诗的格律束缚，更有利于自由表达思想感情。"},{"id":"g3_chinese_001_ex04","knowledge_id":"g3_chinese_001","question":"填空题：现代诗歌中，______是指诗中寄托诗人情感的具体事物，它是诗歌情感的载体。","answer":"答案：意象\n解析：意象是现代诗歌中非常重要的概念，指的是诗中寄托诗人情感的具体事物。诗人通过意象来表达抽象的情感和思想，使诗歌更具感染力和表现力。"},{"id":"g3_chinese_001_ex05","knowledge_id":"g3_chinese_001","question":"阅读理解题：阅读下面这首小诗，回答问题。\n\n《断章》\n卞之琳\n你站在桥上看风景，\n看风景的人在楼上看你。\n明月装饰了你的窗子，\n你装饰了别人的梦。\n\n问题：这首诗运用了什么表现手法？表达了怎样的哲理？","answer":"答案：这首诗运用了对比、映衬的表现手法。\n解析：诗中通过\"你站在桥上看风景\"与\"看风景的人在楼上看你\"形成对照，\"明月装饰了你的窗子\"与\"你装饰了别人的梦\"形成映衬。表达的哲理是：世间万物相互关联，互相依存，你在欣赏风景的同时，自己也成为别人眼中的风景；人与人、物与物之间都是相对的，都可以互为风景，体现了相对论的观点。"},{"id":"g3_chinese_001_ex06","knowledge_id":"g3_chinese_001","question":"选择题：下列对现代诗歌意象的理解，有误的一项是（  ）\nA. 意象是诗人主观情感与客观事物的结合\nB. 意象就是诗中出现的所有事物\nC. 意象是诗歌情感的载体\nD. 意象可以烘托意境","answer":"答案：B\n解析：意象不是诗中出现的所有事物，而是融入了诗人主观情感的客观事物。是诗人通过意象来表达情感，因此意象是主观与客观的统一，是情感的载体，可以烘托意境。B项认为意象就是诗中出现的所有事物，这是错误的，因为有些事物只是背景或描写的对象，不一定是意象。"},{"id":"g3_chinese_001_ex07","knowledge_id":"g3_chinese_001","question":"简答题：请简要说说现代诗歌与古典诗歌的主要区别。","answer":"答案：现代诗歌与古典诗歌的主要区别在于语言、格律、表现手法等方面。\n解析：（1）语言上：古典诗歌以文言为主，现代诗歌以白话为主；（2）格律上：古典诗歌讲究格律、押韵、平仄，形式固定，现代诗歌形式自由，不拘格律和韵律；（3）表现手法上：古典诗歌多用比兴、用典，现代诗歌更注重意象经营和自由表达；（4）内容上：现代诗歌更贴近现实生活，表达现代人的思想情感。"},{"id":"g3_chinese_001_ex08","knowledge_id":"g3_chinese_001","question":"填空题：现代诗歌的阅读方法包括：______、品味意象、体会情感、赏析手法。","answer":"答案：把握节奏\n解析：阅读现代诗歌的方法主要有：（1）把握节奏，感受诗歌的音乐美；（2）品味意象，理解诗歌的内涵；（3）体会情感，把握诗人的思想感情；（4）赏析手法，学习诗歌的艺术特色。"},{"id":"g3_chinese_001_ex09","knowledge_id":"g3_chinese_001","question":"选择题：\"轻轻的我走了，正如我轻轻的来；我轻轻的招手，作别西天的云彩。\"对这句话理解有误的一项是（  ）\nA. \"轻轻的\"反复出现，奠定了全诗轻柔缠绵的基调\nB. 诗句运用了反复的修辞手法\nC. 诗句描绘了诗人悄悄离开时的欢快心情\nD. 诗句表达了诗人对康桥的不舍和眷恋","answer":"答案：C\n解析：这是徐志摩《再别康桥》的开头句。\"轻轻的\"反复出现，奠定了全诗轻柔缠绵的基调，运用了反复的修辞手法，表达了诗人对康桥的不舍和眷恋。但诗人的心情并不是欢快的，而是带着淡淡的哀愁和不舍，因此C项错误。"},{"id":"g3_chinese_001_ex10","knowledge_id":"g3_chinese_001","question":"阅读理解题：阅读下面这首诗，回答问题。\n\n《乡愁》（节选）\n小时候\n乡愁是一枚小小的邮票\n我在这头\n母亲在那头\n\n问题：这节诗中运用了什么意象？有什么作用？","answer":"答案：这节诗运用了\"邮票\"这一意象。\n解析：\"邮票\"是连接\"我\"和母亲之间的纽带，象征着思念的传递。诗人将抽象的乡愁具体化为\"小小的邮票\"，化抽象为具体，使乡愁变得形象可感，表达了小时候对母亲的思念之情。邮票虽小，却承载着浓浓的乡愁，以小见大，意蕴丰富。"},{"id":"g3_chinese_002_ex01","knowledge_id":"g3_chinese_002","question":"选择题：《沁园春·雪》的作者是（  ）\nA. 李大钊\nB. 毛泽东\nC. 鲁迅\nD. 郭沫若","answer":"答案：B\n解析：《沁园春·雪》的作者是毛泽东。这首词是毛泽东于1936年2月创作的，气势磅礴，意境雄浑，是中国现代诗词的经典之作。"},{"id":"g3_chinese_002_ex02","knowledge_id":"g3_chinese_002","question":"选择题：下列对《沁园春·雪》的理解有误的一项是（  ）\nA. \"沁园春\"是词牌名，\"雪\"是题目\nB. 这首词上阕写景，下阕议论抒情\nC. 这首词的主旨是歌颂祖国大好河山\nD. \"俱往矣，数风流人物，还看今朝\"点明了全词的主旨","answer":"答案：C\n解析：《沁园春·雪》这首词的主旨不仅仅是歌颂祖国大好河山，更重要的是通过评价历史人物，歌颂当代无产阶级革命英雄，表达了诗人作为无产阶级革命家的伟大抱负和坚定信念。因此C项表述不全面。"},{"id":"g3_chinese_002_ex03","knowledge_id":"g3_chinese_002","question":"默写题：请默写《沁园春·雪》的上阕。\n北国风光，______，______。\n望长城内外，______；大河上下，______。\n山舞银蛇，______，欲与天公试比高。\n须晴日，______，______。","answer":"答案：千里冰封，万里雪飘。惟余莽莽；顿失滔滔。原驰蜡象。看红装素裹，分外妖娆。\n解析：这是《沁园春·雪》的上阕，描写北国雪景，展现了一幅雄伟壮阔的雪景图。\"千里冰封，万里雪飘\"总写北国雪景，\"望\"字领起下文，\"山舞银蛇，原驰蜡象\"运用了比喻和拟人的修辞手法，化静为动，写出了雪后山原的壮丽景象。"},{"id":"g3_chinese_002_ex04","knowledge_id":"g3_chinese_002","question":"填空题：《沁园春·雪》中，\"______，______，______\"点明了全词的主旨，表达了对无产阶级革命英雄的赞美。","answer":"答案：俱往矣，数风流人物，还看今朝\n解析：\"俱往矣\"三字将中国封建社会的历史一笔带过，转向诗人所处的当今时代，点出全词\"数风流人物，还看今朝\"的主题。\"今朝\"的风流人物不负历史的使命，必将创造空前伟大的业绩，这是诗人坚定的自信和伟大的抱负。"},{"id":"g3_chinese_002_ex05","knowledge_id":"g3_chinese_002","question":"选择题：对\"山舞银蛇，原驰蜡象，欲与天公试比高\"一句的赏析有误的一项是（  ）\nA. 这句话运用了比喻的修辞手法，把山比作银蛇，把高原比作蜡象\nB. \"舞\"和\"驰\"这两个字化静为动，写出了雪后山原的生机与活力\nC. \"欲与天公试比高\"运用了拟人的修辞手法，表现了山原的雄心壮志\nD. 这句话实写了作者看到的山和高原在雪中舞动、奔跑的景象","answer":"答案：D\n解析：这句话是作者的想象，是虚写，并不是实写。\"山舞银蛇，原驰蜡象\"是说群山好像银蛇在舞动，高原好像白象在奔跑，这是化静为动的写法，把静止的山和原写活了，并不是说它们真的在舞动、奔跑。"},{"id":"g3_chinese_002_ex06","knowledge_id":"g3_chinese_002","question":"阅读理解题：阅读《沁园春·雪》下阕，回答问题。\n\n江山如此多娇，引无数英雄竞折腰。惜秦皇汉武，略输文采；唐宗宋祖，稍逊风骚。一代天骄，成吉思汗，只识弯弓射大雕。俱往矣，数风流人物，还看今朝。\n\n问题：\"惜\"字包含了作者怎样的情感？","answer":"答案：\"惜\"字定下了对历史人物的评价基调，既有肯定也有批判。\n解析：\"惜\"字中含褒义：肯定了秦皇汉武、唐宗宋祖、成吉思汗等人是历史上的英雄，对历史的发展有巨大贡献；\"惜\"字中有贬义：委婉地批评了他们文治不足，缺少文学才华；\"惜\"字中有志：体现了诗人后来者居上的气概和超越历代英雄的自信。一个\"惜\"字，意蕴丰富，含义深刻。"},{"id":"g3_chinese_002_ex07","knowledge_id":"g3_chinese_002","question":"选择题：《沁园春·雪》中，\"江山如此多娇，引无数英雄竞折腰\"在结构上的作用是（  ）\nA. 总结上文，引出下文\nB. 承上启下的过渡作用\nC. 开启下文\nD. 总结全词","answer":"答案：B\n解析：\"江山如此多娇\"承接上文，对上阕的景物描写作总结，总括北国雪景的壮丽；\"引无数英雄竞折腰\"开启下文，引出下阕对历史人物的评价。因此这句话在结构上起到了承上启下的过渡作用，使全词浑然一体。"},{"id":"g3_chinese_002_ex08","knowledge_id":"g3_chinese_002","question":"填空题：\"须晴日，看红装素裹，分外妖娆\"中，\"红装素裹\"运用了______的修辞手法，\"须\"是______的意思。","answer":"答案：比喻，等到\n解析：\"红装素裹\"把江山美景比作妇女的衣装，用\"红装\"形容红日照耀，\"素裹\"形容白雪覆盖，运用了比喻的修辞手法。\"须\"是\"等到\"的意思，表明这是作者想象雪后晴日当空的景象，是虚写。"},{"id":"g3_chinese_002_ex09","knowledge_id":"g3_chinese_002","question":"简答题：《沁园春·雪》中\"望\"字统领了哪些内容？有什么作用？","answer":"答案：\"望\"字统领了从\"长城内外\"到\"欲与天公试比高\"的内容。\n解析：\"望\"字领起的内容包括：长城内外、大河上下的雄伟景观，以及山舞银蛇、原驰蜡象的壮丽景象。\"望\"字的作用：（1）在结构上起到领起下文的作用；（2）在内容上，\"望\"字之下，展现了长城、黄河、山脉、高原这些最能反映北国风貌的雄伟景观，这些景观也正是我们伟大祖国的形象；（3）\"望\"字有登高远眺的意思，并有很大的想象成分，显示了诗人的形象，使人感受到他那豪迈的意兴。"},{"id":"g3_chinese_002_ex10","knowledge_id":"g3_chinese_002","question":"默写题：请默写词中评价历史人物的句子。\n\n惜秦皇汉武，______；唐宗宋祖，______。\n一代天骄，______，______。","answer":"答案：略输文采；稍逊风骚。成吉思汗，只识弯弓射大雕。\n解析：这几句是词中评价历史人物的句子。诗人以\"惜\"字总领，展开对历代英雄人物的评价。\"略输文采\"\"稍逊风骚\"\"只识弯弓射大雕\"，用词极有分寸，既肯定了他们的历史功绩，又指出了他们在文化、思想方面的不足，措辞委婉而有分寸。"},{"id":"g3_chinese_003_ex01","knowledge_id":"g3_chinese_003","question":"选择题：《乡愁》的作者是（  ）\nA. 舒婷\nB. 余光中\nC. 艾青\nD. 徐志摩","answer":"答案：B\n解析：《乡愁》的作者是台湾诗人余光中。这首诗通过邮票、船票、坟墓、海峡四个意象，抒发了游子对故乡、对祖国的深切思念之情。"},{"id":"g3_chinese_003_ex02","knowledge_id":"g3_chinese_003","question":"选择题：下列对《乡愁》这首诗的理解，有误的一项是（  ）\nA. 本诗以时间为序，以感情为线索，把对母亲、妻子的爱熔铸在对祖国的爱中\nB. 本诗的意象分别是邮票、船票、坟墓、海峡，对应人生的不同阶段\nC. 本诗语言质朴，而意蕴丰富，读起来朗朗上口\nD. 本诗主要表达了作者对亲人的思念，与祖国统一无关","answer":"答案：D\n解析：《乡愁》这首诗通过四个生活阶段的意象，层层递进，由个人的故乡之思上升到普遍的家国之思，表达了诗人对祖国统一的强烈渴望。D项认为与祖国统一无关是错误的。"},{"id":"g3_chinese_003_ex03","knowledge_id":"g3_chinese_003","question":"默写题：请默写《乡愁》全诗。\n\n小时候\n乡愁是______\n我在这头\n______\n\n长大后\n乡愁是______\n我在这头\n______\n\n后来啊\n乡愁是______\n我在外头\n______\n\n而现在\n乡愁是______\n我在这头\n______","answer":"答案：\n一枚小小的邮票\n母亲在那头\n\n一张窄窄的船票\n新娘在那头\n\n一方矮矮的坟墓\n母亲在里头\n\n一湾浅浅的海峡\n大陆在那头\n\n解析：全诗以时间为顺序，依次描写了童年、青年、中年、老年四个阶段的乡愁，意象分别是邮票、船票、坟墓、海峡。四个意象层层递进，由个人的亲情之思上升到普遍的家国之思，表达了诗人对祖国统一的渴望。"},{"id":"g3_chinese_003_ex04","knowledge_id":"g3_chinese_003","question":"填空题：《乡愁》中，诗人把乡愁比作______、______、______、______，对应人生的四个阶段。","answer":"答案：邮票、船票、坟墓、海峡\n解析：《乡愁》中，诗人运用了比喻（或意象）的手法，将抽象的乡愁具体化为四个鲜明的意象：小时候的邮票、长大后的船票、后来的坟墓、现在的海峡，分别对应人生的四个阶段，使抽象的乡愁变得形象可感。"},{"id":"g3_chinese_003_ex05","knowledge_id":"g3_chinese_003","question":"选择题：对\"乡愁是一湾浅浅的海峡\"一句理解有误的一项是（  ）\nA. \"浅浅的海峡\"是说台湾和大陆相隔很近\nB. \"浅浅的\"是说海峡不深，可以轻易跨越\nC. 虽然海峡很浅，但人为的阻隔使得两岸亲人难以相见\nD. 诗句表达了诗人对祖国统一的渴望","answer":"答案：B\n解析：\"浅浅的\"不是实指海峡不深，而是诗人一种无可奈何的心理感受。海峡虽浅，却横亘在大陆和台湾之间，阻碍了两岸亲人的团聚。以\"浅浅\"反衬乡愁之浓，突出了人为阻隔造成的巨大伤痛，表达了诗人对祖国统一的强烈渴望。"},{"id":"g3_chinese_003_ex06","knowledge_id":"g3_chinese_003","question":"阅读理解题：阅读《乡愁》，回答问题。\n\n问题：这首诗的结构有什么特点？这样写有什么好处？","answer":"答案：这首诗采用了重章叠句（或复沓）的结构形式。\n解析：全诗四节，每节四行，结构整齐对称，句式基本相同，只在关键处更换个别词语。这样写的好处是：（1）增强了诗歌的节奏感和音乐美，读起来朗朗上口；（2）回环往复，一唱三叹，深化了思乡的主题，使情感表达层层递进；（3）整齐的结构形式也体现了诗歌的建筑美。"},{"id":"g3_chinese_003_ex07","knowledge_id":"g3_chinese_003","question":"选择题：《乡愁》这首诗的感情基调是（  ）\nA. 欢快舒畅\nB. 忧郁悲伤\nC. 激愤昂扬\nD. 深沉悠远","answer":"答案：D\n解析：《乡愁》这首诗的感情基调是深沉悠远。诗人将个人的故乡之思与家国之思融合在一起，既有对亲人的思念，也有对祖国统一的渴望，情感深沉而不悲伤，悠远而不颓废，给人以深沉的美感和强烈的感染力。"},{"id":"g3_chinese_003_ex08","knowledge_id":"g3_chinese_003","question":"填空题：《乡愁》中，\"小时候\"\"长大后\"\"后来啊\"\"而现在\"这些词语表明诗歌是以______为顺序来组织材料的，使诗歌层次清晰，层层递进。","answer":"答案：时间\n解析：诗歌以时间为顺序，依次写了童年、青年、中年、老年四个阶段的乡愁。随着时间的推移，乡愁的内涵越来越丰富，从个人的亲情之思逐步上升到普遍的家国之思，使诗歌的主题得到深化。"},{"id":"g3_chinese_003_ex09","knowledge_id":"g3_chinese_003","question":"简答题：《乡愁》中，四个意象之间有什么关系？诗人这样安排有什么用意？","answer":"答案：四个意象之间是层层递进的关系。\n解析：四个意象分别对应人生的四个阶段，从童年到成年，从生离到死别，从个人到国家，情感层层递进，内涵不断丰富。诗人这样安排的用意是：（1）以时间为线索，使诗歌结构清晰，层次分明；（2）前三个意象铺垫，最后一个意象升华，将个人的故乡之思上升到普遍的家国之思，深化了诗歌的主题；（3）由个人的悲欢离合上升到民族的悲欢离合，使诗歌具有了更广泛的社会意义和时代意义。"},{"id":"g3_chinese_003_ex10","knowledge_id":"g3_chinese_003","question":"选择题：下列关于《乡愁》一诗的说法，不正确的一项是（  ）\nA. 本诗的作者余光中是台湾诗人\nB. \"小小的\"\"窄窄的\"\"矮矮的\"\"浅浅的\"都是叠词，增强了诗歌的音乐美\nC. \"坟墓\"这一意象表达了诗人对母亲去世的悲痛，与乡愁主题无关\nD. 全诗语言质朴，但意蕴深厚，具有很强的感染力","answer":"答案：C\n解析：\"坟墓\"这一意象是乡愁的重要组成部分，它表达了诗人与母亲生死相隔的悲痛，是人生中最沉痛的乡愁。正是有了前三个阶段的铺垫，最后一阶段的家国之思才更显厚重。因此C项认为与乡愁主题无关是错误的。"},{"id":"g3_chinese_004_ex01","knowledge_id":"g3_chinese_004","question":"选择题：《我爱这土地》的作者是（  ）\nA. 徐志摩\nB. 艾青\nC. 冰心\nD. 戴望舒","answer":"答案：B\n解析：《我爱这土地》的作者是艾青。这首诗写于抗日战争时期的1938年，表达了诗人对祖国深沉的爱和对侵略者的无比愤怒。"},{"id":"g3_chinese_004_ex02","knowledge_id":"g3_chinese_004","question":"选择题：下列对《我爱这土地》一诗的理解，有误的一项是（  ）\nA. 诗中\"鸟\"的意象是诗人的自我写照\nB. \"用嘶哑的喉咙歌唱\"表现了鸟唱歌的声音不好听\nC. 诗中的\"土地\"象征着祖国\nD. \"连羽毛也腐烂在土地里面\"表达了诗人对土地的挚爱","answer":"答案：B\n解析：\"用嘶哑的喉咙歌唱\"不是说鸟唱歌的声音不好听，而是象征着诗人即使受尽磨难，即使声音嘶哑，也要为祖国歌唱，表达了诗人对祖国深沉、执着的爱。因此B项错误。"},{"id":"g3_chinese_004_ex03","knowledge_id":"g3_chinese_004","question":"默写题：请默写《我爱这土地》全诗。\n\n假如我是一只鸟，\n我也应该______：\n这被暴风雨所打击着的土地，\n这永远汹涌着我们的悲愤的河流，\n这无止息地吹刮着的激怒的风，\n和那来自林间的______……\n——然后我死了，\n连羽毛也腐烂在土地里面。\n\n为什么我的眼里常含泪水？\n因为我对这土地爱得深沉……","answer":"答案：用嘶哑的喉咙歌唱；无比温柔的黎明\n解析：这是艾青的代表作《我爱这土地》。诗人以\"假如我是一只鸟\"起笔，运用比喻的手法，表达了对祖国深沉的爱。\"用嘶哑的喉咙歌唱\"表现了歌唱的艰辛和执着，\"无比温柔的黎明\"象征着希望和光明。最后两句直抒胸臆，是全诗的点睛之笔。"},{"id":"g3_chinese_004_ex04","knowledge_id":"g3_chinese_004","question":"填空题：《我爱这土地》中，\"土地\"象征______，\"河流\"象征______，\"风\"象征______，\"黎明\"象征______。","answer":"答案：祖国；人民的悲愤；人民的反抗（或激怒的力量）；光明和希望\n解析：这首诗运用了象征手法。\"被暴风雨所打击着的土地\"象征着遭受苦难的祖国；\"悲愤的河流\"象征着中国人民的悲愤之情；\"激怒的风\"象征着中国人民的反抗精神和激怒的力量；\"温柔的黎明\"象征着光明和希望，预示着抗日战争必将胜利。"},{"id":"g3_chinese_004_ex05","knowledge_id":"g3_chinese_004","question":"选择题：\"为什么我的眼里常含泪水？因为我对这土地爱得深沉……\"运用的修辞手法是（  ）\nA. 反问\nB. 设问\nC. 比喻\nD. 拟人","answer":"答案：B\n解析：这句话运用了设问的修辞手法。自问自答，先提出问题\"为什么我的眼里常含泪水？\"，然后自己回答\"因为我对这土地爱得深沉\"，直抒胸臆，表达了诗人对祖国深沉的爱，是全诗的点睛之笔。"},{"id":"g3_chinese_004_ex06","knowledge_id":"g3_chinese_004","question":"阅读理解题：阅读《我爱这土地》，回答问题。\n\n问题：诗中\"鸟\"这一意象有什么特点？有什么象征意义？","answer":"答案：诗中的\"鸟\"是一个饱受磨难、拼尽全力用整个生命去歌唱的形象。\n解析：\"鸟\"的形象特点：（1）它歌唱的对象是土地、河流、风、黎明，都是博大的意象；（2）它用\"嘶哑的喉咙\"歌唱，歌唱得很艰辛，甚至耗尽了生命；（3）它死后\"连羽毛也腐烂在土地里面\"，与土地融为一体。象征意义：这只鸟象征着诗人自己，象征着所有热爱祖国、愿意为祖国奉献一切的中华儿女。鸟的歌唱，就是诗人的歌唱；鸟对土地的爱，就是诗人对祖国的爱。"},{"id":"g3_chinese_004_ex07","knowledge_id":"g3_chinese_004","question":"选择题：对\"连羽毛也腐烂在土地里面\"一句理解有误的一项是（  ）\nA. 这句话表达了诗人对土地的挚爱\nB. 这句话说明鸟死了之后，羽毛埋在土里，这是自然现象\nC. 这句话有\"生于斯、歌于斯、葬于斯\"的意思\nD. 这句话表达了诗人愿为祖国奉献一切的决心","answer":"答案：B\n解析：这句话不是简单地说鸟死了之后羽毛埋在土里的自然现象，而是具有深刻的象征意义。它象征着诗人愿意把自己的一切都奉献给祖国，生于斯、歌于斯、葬于斯，表达了对祖国至死不渝的爱和奉献一切的决心。"},{"id":"g3_chinese_004_ex08","knowledge_id":"g3_chinese_004","question":"填空题：《我爱这土地》中，\"假如我是一只鸟\"运用了______的修辞手法，把______比作______，生动形象地表达了诗人对祖国的热爱。","answer":"答案：比喻；诗人自己（或\"我\"）；一只鸟\n解析：\"假如我是一只鸟\"运用了比喻的修辞手法，将诗人自己比作一只鸟。鸟虽然渺小，但它用整个生命去歌唱，表达了即使自己很渺小，也要为祖国歌唱、为祖国奉献一切的决心，使抽象的情感变得形象可感。"},{"id":"g3_chinese_004_ex09","knowledge_id":"g3_chinese_004","question":"简答题：《我爱这土地》中，诗的第一节和第二节在抒情方式上有什么不同？两节之间有什么关系？","answer":"答案：第一节是借鸟的形象间接抒情，第二节是直抒胸臆。\n解析：第一节，诗人把自己假设成一只鸟，通过鸟的歌唱和死后腐烂在土地里，间接表达对祖国的爱，感情含蓄而深沉；第二节，诗人以设问的形式直接表白，直抒胸臆，感情强烈而真挚。两节之间的关系：第一节是铺垫，是蓄势，通过鸟的形象把感情积聚起来；第二节是升华，是爆发，在第一节的基础上直接抒发对祖国的深沉之爱，点明了全诗的主旨。第一节是具体的形象，第二节是抽象的概括，互为补充，相得益彰。"},{"id":"g3_chinese_004_ex10","knowledge_id":"g3_chinese_004","question":"选择题：下列关于艾青的说法，有误的一项是（  ）\nA. 艾青原名蒋正涵，号海澄，是中国现代著名诗人\nB. 艾青的诗多写国家民族的苦难、悲伤与反抗，具有浓郁的爱国主义情感\nC. 艾青的代表作有《大堰河——我的保姆》《我爱这土地》《乡愁》等\nD. 艾青被称为\"太阳与火把\"的歌手","answer":"答案：C\n解析：《乡愁》不是艾青的作品，而是余光中的作品。艾青的代表作有《大堰河——我的保姆》《我爱这土地》《向太阳》《火把》等。艾青的诗歌多描写土地、太阳等意象，充满对祖国、对土地的深沉之爱，因此他被称为\"太阳与火把\"的歌手。"},{"id":"g3_chinese_005_ex01","knowledge_id":"g3_chinese_005","question":"选择题：下列关于议论文的说法，有误的一项是（  ）\nA. 议论文的三要素是论点、论据、论证\nB. 论点是作者对所论述问题的见解和主张\nC. 论点就是文章的中心论点，一篇议论文只能有一个论点\nD. 论点应该明确、正确，是作者看法的完整陈述","answer":"答案：C\n解析：一篇议论文一般有一个中心论点，但可以有多个分论点。中心论点是作者对所论述问题的最基本的看法，是全部分论点的高度概括和集中。分论点是从不同角度、不同层次支撑中心论点的观点，它们都是为中心论点服务的。因此C项认为只能有一个论点是错误的。"},{"id":"g3_chinese_005_ex02","knowledge_id":"g3_chinese_005","question":"选择题：下列关于论点的说法，正确的一项是（  ）\nA. 论点就是文章的标题\nB. 论点可以是一个明确的判断句\nC. 论点可以用疑问句的形式出现\nD. 论点必须在文章开头出现","answer":"答案：B\n解析：论点是作者对所论述问题的见解和主张，应该是一个明确的判断，表述完整的句子。A项错误，因为有些文章的标题不是论点，可能只是引出话题；C项错误，论点不能是疑问句，必须是明确的判断；D项错误，论点可以在文章的开头、中间或结尾出现，也有的文章的论点需要读者自己概括。"},{"id":"g3_chinese_005_ex03","knowledge_id":"g3_chinese_005","question":"填空题：议论文的三要素是______、______、______。其中，______是议论文的灵魂。","answer":"答案：论点、论据、论证；论点\n解析：议论文的三要素是论点、论据、论证。论点是作者对所论述问题的见解和主张，是议论文的灵魂。论据是用来证明论点的材料，是论点的基础。论证是运用论据来证明论点的过程和方法，是论点和论据之间的逻辑纽带。"},{"id":"g3_chinese_005_ex04","knowledge_id":"g3_chinese_005","question":"填空题：找中心论点的常用方法有：看标题即论点、______即论点、______即论点、自己归纳论点。","answer":"答案：开头；结尾\n解析：找中心论点的常用方法有：（1）看标题，有的议论文的标题就是中心论点；（2）看开头，很多议论文在开头就提出中心论点；（3）看结尾，有的议论文在结尾归纳出中心论点；（4）看中间，有的文章在论述过程中提出中心论点；（5）自己归纳，有的文章没有明确的中心论点句，需要自己归纳概括。"},{"id":"g3_chinese_005_ex05","knowledge_id":"g3_chinese_005","question":"阅读理解题：阅读下面的文字，回答问题。\n\n《谈骨气》（节选）\n\n我们中国人是有骨气的。\n\n战国时代的孟子，有几句很好的话：\"富贵不能淫，贫贱不能移，威武不能屈，此之谓大丈夫。\"意思是说，高官厚禄收买不了，贫穷困苦折磨不了，强暴武力威胁不了，这就是所谓大丈夫。大丈夫的这种种行为，表现出了英雄气概，我们今天就叫做有骨气。\n\n问题：这篇文章的中心论点是什么？是怎样提出的？","answer":"答案：中心论点是\"我们中国人是有骨气的\"。在文章开头直接提出。\n解析：文章开门见山，第一句话就直接提出了中心论点\"我们中国人是有骨气的\"，然后引用孟子的话来解释什么是骨气。这种提出论点的方式叫开门见山式，能够让读者一眼就能抓住文章的中心观点，鲜明突出，给人留下深刻印象。"},{"id":"g3_chinese_005_ex06","knowledge_id":"g3_chinese_005","question":"选择题：下列标题中，可以作为中心论点的一项是（  ）\nA. 《谈读书》\nB. 《论教养》\nC. 《敬业与乐业》\nD. 《学业与乐业是人类生活的不二法门","answer":"答案：D\n解析：中心论点应该是一个明确的判断，是作者看法的完整陈述。A、B、C都是论题，只是论述的话题，不是明确的观点判断。D项\"敬业与乐业是人类生活的不二法门\"是一个明确的判断句，表明了作者的观点，可以作为中心论点。"},{"id":"g3_chinese_005_ex07","knowledge_id":"g3_chinese_005","question":"选择题：下列关于中心论点和分论点的关系，说法有误的一项是（  ）\nA. 中心论点统率分论点，分论点从属于中心论点\nB. 分论点是中心论点的道理论据\nC. 分论点是从不同角度、不同层次证明中心论点\nD. 一篇议论文只能有一个分论点","answer":"答案：D\n解析：一篇议论文一般有一个中心论点，但可以有多个分论点。分论点从不同角度、不同层次支撑中心论点，它们都是为中心论点服务的。中心论点统率分论点，分论点从属于中心论点。因此D项认为只能有一个分论点是错误的。"},{"id":"g3_chinese_005_ex08","knowledge_id":"g3_chinese_005","question":"填空题：论点的位置一般有四个：文章的标题、文章的______、文章的______、文章的中间。","answer":"答案：开头；结尾\n解析：论点在文章中的位置一般有四种情况：（1）标题就是中心论点；（2）开头提出中心论点，即开门见山；（3）结尾归纳出中心论点；（4）在文章论述过程中提出中心论点。此外，有些文章没有明确的中心论点句，需要读者自己概括归纳。"},{"id":"g3_chinese_005_ex09","knowledge_id":"g3_chinese_005","question":"简答题：请简要说说论点和论题的区别。","answer":"答案：论点和论题是不同的概念，主要区别在于：\n解析：（1）定义不同：论点是作者对所论述问题的见解和主张；论题是有待于论述的问题、话题。（2）形式不同：论点一般是一个明确的判断句，是作者完整的看法；论题可以是一个短语或一个问题，不表明作者的观点。（3）作用不同：论点是议论文的灵魂，统率全文；论题只是规定了文章的论述范围和对象。例如，《谈读书》是论题，\"读书足以怡情\"是论点。"},{"id":"g3_chinese_005_ex10","knowledge_id":"g3_chinese_005","question":"阅读理解题：阅读下面的文字，回答问题。\n\n\"读书足以怡情，足以傅彩，足以长才。其怡情也，最见于独处幽居之时；其傅彩也，最见于高谈阔论之中；其长才也，最见于处世判事之际。练达之士虽能分别处理细事或一一判别枝节，然纵观统筹，全局策划，则舍好学深思者莫属。读书费时过多易惰，文采藻饰太盛则矫，全凭条文断事乃学究故态。读书补天然之不足，经验又补读书之不足，盖天生才干犹如自然花草，读书然后知如何修剪移接；而书中所示，如不以经验范之，则又大而无当。\n\n问题：本段文字的中心论点是什么？作者是从哪几个方面来论述的？","answer":"答案：中心论点是\"读书足以怡情，足以傅彩，足以长才\"。作者从怡情、傅彩、长才三个方面来论述读书的益处。\n解析：文段第一句就提出了中心论点\"读书足以怡情，足以傅彩，足以长才\"，然后分别从这三个方面展开论述，阐述了读书在不同方面的作用。开门见山提出论点，然后从三个并列的角度进行论证，条理清晰，论证有力。"},{"id":"g3_chinese_006_ex01","knowledge_id":"g3_chinese_006","question":"选择题：下列关于论据的说法，有误的一项是（  ）\nA. 论据分为事实论据和道理论据两大类\nB. 事实论据包括史实、典型事例、统计数据等\nC. 道理论据包括名人名言、谚语俗语、科学原理等\nD. 论据越多，议论文的说服力就越强","answer":"答案：D\n解析：论据是用来证明论点的材料，但并不是论据越多说服力就越强。论据要典型、充分，与论点有必然的联系，能够有力地证明论点。如果论据不典型、不充分，或者与论点关系不大，再多也没有说服力。因此D项错误。"},{"id":"g3_chinese_006_ex02","knowledge_id":"g3_chinese_006","question":"选择题：下列论证方法中，属于摆事实的是（  ）\nA. 举例论证\nB. 道理论证\nC. 对比论证\nD. 比喻论证","answer":"答案：A\n解析：常见的论证方法有举例论证、道理论证、对比论证、比喻论证等。其中，举例论证是列举确凿、充分、有代表性的事例证明论点，属于摆事实。道理论证是用经典著作中的精辟见解、古今中外名人的名言警句以及人们公认的定理公式等来证明论点，属于讲道理。"},{"id":"g3_chinese_006_ex03","knowledge_id":"g3_chinese_006","question":"填空题：常见的论证方法有______、______、______、______等。","answer":"答案：举例论证、道理论证、对比论证、比喻论证\n解析：常见的论证方法有：（1）举例论证：列举确凿、充分、有代表性的事例证明论点；（2）道理论证：用经典著作中的精辟见解、名人名言、科学原理等来证明论点；（3）对比论证：用正反两方面的论点或论据作对比，在对比中证明论点；（4）比喻论证：用人们熟知的事物作比喻来证明论点。此外还有类比论证、因果论证等。"},{"id":"g3_chinese_006_ex04","knowledge_id":"g3_chinese_006","question":"填空题：事实论据包括______、______、______等；道理论据包括______、______、______等。","answer":"答案：史实、典型事例、统计数据；名人名言、谚语俗语、科学原理\n解析：论据分为事实论据和道理论据两大类。事实论据包括史实、典型事例、统计数据等，具有真实可靠、有说服力的特点。道理论据包括名人名言、谚语俗语、科学原理、经典著作中的精辟见解等，具有权威性、深刻性的特点。"},{"id":"g3_chinese_006_ex05","knowledge_id":"g3_chinese_006","question":"阅读理解题：阅读下面的文字，回答问题。\n\n\"勤奋是成功的阶梯。汉代的司马迁，忍辱负重，勤奋著书，历时十四年，终于写成了被誉为\"史家之绝唱，无韵之离骚\"的《史记》。北宋的司马光，勤奋好学，用了十九年时间，编成了编年体通史《资治通鉴》。由此可见，勤奋是通往成功的必由之路。\n\n问题：这段文字运用了什么论证方法？有什么作用？","answer":"答案：这段文字运用了举例论证的方法。\n解析：文中列举了司马迁忍辱负重、勤奋著书写成《史记》，司马光勤奋好学编成《资治通鉴》两个事例，具体有力地论证了\"勤奋是成功的阶梯\"这一论点。举例论证的作用是：列举典型事例，具体有力地证明了中心论点（或分论点），增强了文章的说服力。"},{"id":"g3_chinese_006_ex06","knowledge_id":"g3_chinese_006","question":"选择题：下列关于对比论证的说法，有误的一项是（  ）\nA. 对比论证可以是正反对比，也可以是今昔对比\nB. 对比论证可以使正确与错误分明，是非曲直明确\nC. 对比论证就是拿两个相似的事物进行比较\nD. 对比论证能给人留下深刻的印象，增强说服力","answer":"答案：C\n解析：对比论证是用正反两方面的论点或论据作对比，在对比中证明论点。它可以是正反对比，也可以是今昔对比、不同事物之间的对比等。对比论证的作用是使正确与错误分明，是非曲直明确，给人留下深刻的印象，增强说服力。拿两个相似的事物进行比较是类比论证，不是对比论证，因此C项错误。"},{"id":"g3_chinese_006_ex07","knowledge_id":"g3_chinese_006","question":"选择题：\"天生才干犹如自然花草，读书然后知如何修剪移接\"运用的论证方法是（  ）\nA. 举例论证\nB. 道理论证\nC. 对比论证\nD. 比喻论证","answer":"答案：D\n解析：这句话运用了比喻论证的方法。把\"天生才干\"比作\"自然花草\"，把\"读书\"比作\"修剪移接\"，生动形象地论证了读书能够弥补天然之不足的观点，使抽象的道理变得通俗易懂，增强了文章的趣味性和说服力。"},{"id":"g3_chinese_006_ex08","knowledge_id":"g3_chinese_006","question":"填空题：论证是运用______来证明______的过程和方法，是______和______之间逻辑联系的纽带。","answer":"答案：论据；论点；论点；论据\n解析：论证是议论文的三要素之一，是运用论据来证明论点的过程和方法。它是论点和论据之间逻辑联系的纽带，解决的是\"怎样证明\"的问题。论点是要证明什么，论据是用什么来证明，论证是怎样来证明。"},{"id":"g3_chinese_006_ex09","knowledge_id":"g3_chinese_006","question":"简答题：请简要说说举例论证和道理论证的区别。","answer":"答案：举例论证和道理论证是两种最基本的论证方法，主要区别在于：\n解析：（1）论据不同：举例论证用的是事实论据，包括史实、典型事例、统计数据等；道理论证用的是道理论据，包括名人名言、谚语俗语、科学原理等。（2）作用不同：举例论证的作用是具体有力地证明论点，增强文章的说服力和可信度；道理论证的作用是权威有力地证明论点，增加论证的深度和权威性。（3）角度不同：举例论证是从具体到抽象，从个别到一般；道理论证是从抽象到具体，从一般到个别。"},{"id":"g3_chinese_006_ex10","knowledge_id":"g3_chinese_006","question":"阅读理解题：阅读下面的文字，回答问题。\n\n\"有的人就不具备宽容的美德，他们心胸狭隘，凡事斤斤计较，不肯吃亏。如慈禧太后，仅因为与一大臣下棋时，对方无意中说了一句：\"我杀老佛爷的马。\"就勃然大怒而起，\"你杀我的马，我杀你全家\"，于是这位大臣被满门抄斩，惨不忍睹。像这样的狭隘心胸，这样的暴行，又怎会不遭人唾弃呢？当今社会上有一些人，也是这样，你不小心碰了他一下，他就会破口大骂，甚至大打出手，还有的人对别人的过失总是耿耿于怀，时时想着揪别人的小辫子。这样的人，典型的\"小肚鸡肠\"，心胸狭隘，待人刻薄，根本没有一点宽容之心，这种人还能谈什么成大器，立大业呢？\n\n问题：这段文字运用了什么论证方法？有什么作用？","answer":"答案：这段文字运用了举例论证的方法。\n解析：文中列举了慈禧太后因为一句话就满门抄斩大臣的历史事例，以及当今社会上一些人心胸狭隘、不宽容的现象，从反面具体有力地论证了不具备宽容美德的人不能成大器、立大业的观点（或论证了宽容的重要性），使论证更具体、更有说服力，同时也增强了文章的现实意义。"},{"id":"g3_chinese_007_ex01","knowledge_id":"g3_chinese_007","question":"选择题：《敬业与乐业》的作者是（  ）\nA. 梁启超\nB. 康有为\nC. 胡适\nD. 陈独秀","answer":"答案：A\n解析：《敬业与乐业》的作者是梁启超。梁启超是中国近代思想家、政治家、教育家、史学家、文学家，戊戌变法的领袖之一。这篇文章是他1922年在上海中华职业学校的演讲稿。"},{"id":"g3_chinese_007_ex02","knowledge_id":"g3_chinese_007","question":"选择题：《敬业与乐业》的中心论点是（  ）\nA. 敬业与乐业是人类生活的不二法门\nB. 我们要敬业\nC. 我们要乐业\nD. 敬业就是责任心，乐业就是趣味","answer":"答案：A\n解析：《敬业与乐业》的中心论点是\"敬业与乐业是人类生活的不二法门\"。文章开头引用《礼记》和《老子》中的名言，开宗明义地提出了中心论点，然后分别从\"有业\"\"敬业\"\"乐业\"三个方面进行论述，最后总结全文。"},{"id":"g3_chinese_007_ex03","knowledge_id":"g3_chinese_007","question":"填空题：《敬业与乐业》中，作者引用了孔子的名言\"饱食终日，______，难矣哉！\"和\"群居终日，______，好行小慧，难矣哉！\"来证明\"有业\"的必要性。","answer":"答案：无所用心；言不及义\n解析：作者引用孔子的这两句话，从反面论证了\"有业\"的必要性，说明无所事事、不肯做事的人是无可救药的，从而强调了\"有业\"是做人之本。这是道理论证，增强了文章的说服力和权威性。"},{"id":"g3_chinese_007_ex04","knowledge_id":"g3_chinese_007","question":"选择题：\"百丈禅师\"的例子是为了论证什么观点？（  ）\nA. 敬业的重要性\nB. 乐业的重要性\nC. 有业的重要性\nD. 百行业为先","answer":"答案：C\n解析：作者举百丈禅师\"一日不做事，一日不吃饭\"的例子，是为了论证\"有业之必要\"，强调每个人都要有正当职业，都要不断地劳作。这是举例论证，从正面论证了\"有业\"的重要性，与孔子的话形成对比，一正一反，论证有力。"},{"id":"g3_chinese_007_ex05","knowledge_id":"g3_chinese_007","question":"阅读理解题：阅读下面的文字，回答问题。\n\n\"第一要敬业。敬字为古圣贤教人做人最简易、直捷的法门，可惜被后来有些人说得太精微，倒变得不适实用了。惟有朱子解得最好，他说：'主一无适便是敬。'用现在的话讲，凡做一件事，便忠于一件事，将全副精力集中到这事上头，一点不旁骛，便是敬。业有什么可敬呢？为什么该敬呢？人类一面为生活而劳动，一面也是为劳动而生活。人类既不是上帝特地制来充当消化面包的机器，自然该各人因自己的地位和才力，认定一件事去做。凡可以名为一件事的，其性质都是可敬。\n\n问题：这段文字的论点是什么？引用朱子的话有什么作用？","answer":"答案：论点是\"我们要敬业\"（或\"第一要敬业\"）。\n解析：引用朱子的话，解释了\"敬\"的含义，即\"主一无适便是敬\"，也就是凡做一件事，便忠于一件事，将全副精力集中到这事上头，一点不旁骛。这是道理论证，引用名人名言，权威有力地解释了什么是\"敬\"，增强了文章的说服力和权威性，为下文论述敬业的重要性做了铺垫。"},{"id":"g3_chinese_007_ex06","knowledge_id":"g3_chinese_007","question":"选择题：下列关于《敬业与乐业》的说法，有误的一项是（  ）\nA. 这是一篇演讲稿，语言通俗，文白夹杂，让人觉得亲切自然\nB. 文章运用了举例论证、道理论证、对比论证等多种论证方法\nC. 文章的结构是总—分—总\nD. 作者认为，做事情最重要的是要有乐趣，至于是否敬业并不重要","answer":"答案：D\n解析：作者认为，敬业和乐业都是人生的不二法门，二者缺一不可。敬业是责任心，乐业是趣味，二者结合才是人生的最高境界。D项认为敬业不重要，这与文章观点不符，因此是错误的。"},{"id":"g3_chinese_007_ex07","knowledge_id":"g3_chinese_007","question":"选择题：\"凡职业没有不是神圣的，所以凡职业没有不是可敬的\"运用的论证方法是（  ）\nA. 举例论证\nB. 道理论证\nC. 对比论证\nD. 比喻论证","answer":"答案：B\n解析：这句话运用了道理论证的方法。通过逻辑推理，从\"凡职业没有不是神圣的\"推出\"凡职业没有不是可敬的\"，有力地论证了职业都是值得尊敬的这一观点。道理论证能够增加论证的深度和权威性，使论证更有说服力。"},{"id":"g3_chinese_007_ex08","knowledge_id":"g3_chinese_007","question":"填空题：《敬业与乐业》中，\"知之者不如好之者，好之者不如乐之者\"出自《______》，是______说的，作者引用这句话是为了证明______的重要性。","answer":"答案：论语；孔子；乐业\n解析：\"知之者不如好之者，好之者不如乐之者\"出自《论语》，是孔子的名言。意思是知道它的人不如喜爱它的人，喜爱它的人不如以它为乐的人。作者引用这句话，是为了证明\"乐业\"的重要性，说明只有从职业中领略出趣味，生活才有价值。"},{"id":"g3_chinese_007_ex09","knowledge_id":"g3_chinese_007","question":"简答题：《敬业与乐业》中，作者是从哪几个方面来论述中心论点的？","answer":"答案：作者从\"有业\"\"敬业\"\"乐业\"三个方面来论述中心论点。\n解析：文章开头提出中心论点\"敬业与乐业是人类生活的不二法门\"之后，分三个层次展开论述：（1）\"有业之必要\"：论述了有职业的必要性，是敬业和乐业的前提；（2）\"敬业之可贵\"：论述了什么是敬业，为什么要敬业，怎样做到敬业；（3）\"乐业之乐趣\"：论述了乐业的重要性，指出乐业才是人生的最高境界。三个方面层层递进，论证严密，最后总结全文，强调人类合理的生活应该是敬业和乐业。"},{"id":"g3_chinese_007_ex10","knowledge_id":"g3_chinese_007","question":"阅读理解题：阅读下面的文字，回答问题。\n\n\"第二要乐业。'做工好苦呀！'这种叹气的声音，无论何人都会常在口边流露出来。但我要问他：'做工苦，难道不做工就不苦吗？'今日大热天气，我在这里喊破喉咙来讲，诸君扯直耳朵来听，有些人看着我们好苦；翻过来，倘若我们去赌钱去吃酒，还不是一样在淘神费力？难道又不苦？须知苦乐全在主观的心，不在客观的事。人生从出胎的那一秒钟起到咽气的那一秒钟止，除了睡觉以外，总不能把四肢、五官都搁起不用。只要一用，不是淘神，便是费力，劳苦总是免不掉的。会打算盘的人，只有从劳苦中找出快乐来。\n\n问题：这段文字主要运用了什么论证方法？有什么作用？","answer":"答案：主要运用了对比论证和道理论证的方法。\n解析：（1）对比论证：将做工的苦与不做工的苦进行对比，说明苦乐全在主观的心，不在客观的事，从而论证了乐业的可能性和重要性。对比论证使是非分明，让读者清楚地认识到苦乐的本质在于主观态度。（2）道理论证：通过分析人生的本质，说明劳苦总是免不掉的，只有从劳苦中找出快乐来，从道理上论证了乐业的必要性，增加了论证的深度。此外，文段以对话的形式展开，亲切自然，通俗易懂，容易引起读者的共鸣。"},{"id":"g3_chinese_008_ex01","knowledge_id":"g3_chinese_008","question":"选择题：《论教养》的作者是（  ）\nA. 利哈乔夫\nB. 苏霍姆林斯基\nC. 契诃夫\nD. 托尔斯泰","answer":"答案：A\n解析：《论教养》的作者是德米特里·利哈乔夫，他是苏联学者、作家，被誉为\"俄罗斯知识分子的良心\"。这篇文章节选自作者的《世界文坛》，是一篇探讨教养问题的议论文。"},{"id":"g3_chinese_008_ex02","knowledge_id":"g3_chinese_008","question":"选择题：下列关于《论教养》的说法，有误的一项是（  ）\nA. 本文通过列举大量事例，对比分析了有教养和无教养的表现\nB. 文章的中心论点是做一个有教养的人\nC. 文章认为教养首先体现在家庭里，体现在对亲人的态度上\nD. 文章认为有教养的人就是说话好听、会讨好别人的人","answer":"答案：D\n解析：有教养的人并不是指说话好听、会讨好别人的人。作者认为，有教养的人尊重别人，友善待人，有自我牺牲精神，能够尊重他人的尊严和权利，言谈举止优雅得体。D项对教养的理解表面化、庸俗化，因此是错误的。"},{"id":"g3_chinese_008_ex03","knowledge_id":"g3_chinese_008","question":"填空题：《论教养》中，作者认为判断一个人是不是真正有教养，首先要看他在______、在______的表现，看他和______的关系怎样。","answer":"答案：家里；亲属之间；自己亲人\n解析：作者认为，判断一个人是不是真正有教养，首先要看他在自己家里、在自己亲属之间的表现，看他和亲人们的关系究竟怎么样。一个人如果对自己亲人都缺乏教养，那么他在外面的表现往往是虚伪的。这一观点独特而深刻，引人深思。"},{"id":"g3_chinese_008_ex04","knowledge_id":"g3_chinese_008","question":"选择题：\"一个男人，如果他在街道上为陌生人让路，让座给孕妇，可是在家里却懒得帮助疲惫不堪的妻子刷洗餐具\"，作者举这个例子是为了说明（  ）\nA. 这个男人是有教养的人\nB. 这个男人在外面有教养，在家里没有教养，说明他不是真正有教养\nC. 教养主要体现在公共场合\nD. 在家里不需要有教养","answer":"答案：B\n解析：作者举这个例子，是为了说明一个人如果在外面表现得彬彬有礼，在家里却对亲人冷漠无情，那么他不是真正有教养的人。真正的教养应该是内外一致的，首先体现在对待自己亲人的态度上。因此B项正确。"},{"id":"g3_chinese_008_ex05","knowledge_id":"g3_chinese_008","question":"阅读理解题：阅读下面的文字，回答问题。\n\n\"良好的教养不仅来自家庭和学校，而且可以得之于自身。但是必须了解，什么是真正的教养。我不敢贸然提供有关教养的'处方'，因为我不认为自己是教养完美的典范。不过，我倒是愿意就某些想法跟读者交换意见。比方说，我确信，一个人是不是真正有教养，首先要看他在自己家里、在自己亲属之间的表现，看他和亲人们的关系究竟怎么样。\n\n问题：这段文字在全文中起什么作用？作者是如何引出论题的？","answer":"答案：这段文字在全文中起到了引出论题、总领下文的作用。\n解析：作者开门见山，指出良好的教养来自家庭、学校和自身，但关键是什么是真正的教养。然后用谦虚的口吻，说不敢贸然提供有关教养的'处方'，愿意就某些想法跟读者交换意见，自然地引出了论题——什么是真正的教养。接着提出了自己的核心观点：判断一个人是不是真正有教养，首先要看他在自己家里、在自己亲属之间的表现。这样的开头既自然亲切，又点明了论题，为下文的展开做了铺垫。"},{"id":"g3_chinese_008_ex06","knowledge_id":"g3_chinese_008","question":"选择题：《论教养》中，作者列举了大量有教养和无教养的表现进行对比，这种论证方法是（  ）\nA. 举例论证\nB. 道理论证\nC. 对比论证\nD. 以上都是","answer":"答案：D\n解析：作者列举有教养和无教养的表现，既运用了举例论证（列举具体事例），又运用了对比论证（正反对比），同时在分析中也包含了道理论证。多种论证方法综合运用，使论证更全面、更深刻、更有说服力。因此D项正确。"},{"id":"g3_chinese_008_ex07","knowledge_id":"g3_chinese_008","question":"填空题：《论教养》中，作者认为有教养的本质是______。有教养的人______别人，______别人，善于______别人的意见。","answer":"答案：尊重；尊重；体谅；听取\n解析：作者认为，有教养的本质是尊重。有教养的人尊重别人，体谅别人，善于听取别人的意见，能够顾及他人的尊严和权利。一个有教养的人，必定从心里愿意尊重别人，也善于尊重别人。尊重是教养的核心和基础。"},{"id":"g3_chinese_008_ex08","knowledge_id":"g3_chinese_008","question":"选择题：下列关于《论教养》的写作特点，说法有误的一项是（  ）\nA. 文章行文活泼，思路清晰，语言亲切自然\nB. 文章主要运用了举例论证和对比论证的方法\nC. 文章采用了总—分—总的结构\nD. 文章的说理方式是板起面孔说教，严肃古板","answer":"答案：D\n解析：《论教养》的说理方式不是板起面孔说教，而是亲切自然，娓娓道来。作者就像和读者聊天一样，平等地交流意见，用大量生动的事例来说明道理，让人容易接受。文章语言生动活泼，富有生活气息。因此D项错误。"},{"id":"g3_chinese_008_ex09","knowledge_id":"g3_chinese_008","question":"简答题：《论教养》中，作者认为\"风度\"和\"教养\"是什么关系？","answer":"答案：作者认为，风度是教养的外在表现，教养是风度的内在基础。\n解析：（1）风度是外在的，是可以学习和模仿的；教养是内在的，是一个人品德和修养的体现。（2）真正的风度来源于良好的教养，没有教养的人，再怎么模仿也不会有真正的风度。（3）风度是教养的自然流露，有教养的人自然而然地会表现出优雅的风度。（4）二者是表里关系，教养是里，风度是表；教养是本质，风度是表现。只有注重内在修养，才能拥有真正的风度。"},{"id":"g3_chinese_008_ex10","knowledge_id":"g3_chinese_008","question":"阅读理解题：阅读下面的文字，回答问题。\n\n\"切记不要互相妨碍，因此不应当大声喧哗。听到吵闹声不必捂住耳朵——在许多场合未必能做到这一点。比如说，吃饭的时候，千万不要让汤匙碰碗碟叮当作响，不要把勺子放在桌子上，免得给邻座的人造成不便。说话要轻声细语，这样你就不会妨碍那些在埋头工作的人。在有些地方，比如图书馆或者医院，连轻声细语也是不允许的，因此在这些地方最好一句话也不说。\n\n问题：这段文字的中心意思是什么？运用了什么论证方法？","answer":"答案：中心意思是：有教养的人不要互相妨碍，要尊重他人的感受。\n解析：文段围绕\"不要互相妨碍\"这一中心，从多个方面举例说明有教养的人在日常生活中应该怎样做：不大声喧哗，吃饭时不弄出声响，说话轻声细语，在图书馆、医院等场所保持安静。运用了举例论证的方法，列举日常生活中的具体事例，具体生动地说明了有教养的表现，使论证更贴近生活，更有说服力，也更容易被读者理解和接受。"},{"id":"g3_chinese_009_ex01","knowledge_id":"g3_chinese_009","question":"选择题：下列加点词解释有误的一项是（  ）\nA. 百废具兴（通\"俱\"，全、皆）\nB. 朝晖夕阴（日光）\nC. 前人之述备矣（准备）\nD. 薄暮冥冥（迫近）","answer":"答案：C。解析：A项\"具\"通\"俱\"，全、皆，解释正确；B项\"晖\"指日光，解释正确；C项\"备\"应解释为\"详尽、完备\"，而非\"准备\"，前人之述备矣意思是前人的记述很详尽了；D项\"薄\"指迫近，薄暮即傍晚，解释正确。本题考查对文言实词的准确理解，注意\"备\"的多义性。"},{"id":"g3_chinese_009_ex02","knowledge_id":"g3_chinese_009","question":"填空题：解释下列句中加点的词。\n（1）醉翁之意不在酒________\n（2）佳木秀而繁阴________\n（3）湖中人鸟声俱绝________\n（4）拥毳衣炉火________","answer":"答案：（1）意趣，情趣；（2）茂盛；（3）消失；（4）裹、围。解析：（1）\"意\"在\"醉翁之意不在酒\"中指意趣、情趣，而非意思或意义，这是古今异义；（2）\"秀\"形容树木长势茂盛，注意与\"山清水秀\"中\"秀\"（秀丽）的区别；（3）\"绝\"指消失、断绝，湖中人声鸟声都消失了；（4）\"拥\"指裹、围，此处是名词作动词用，穿着毳衣带着炉火。"},{"id":"g3_chinese_009_ex03","knowledge_id":"g3_chinese_009","question":"选择题：下列各组句子中，加点词意思相同的一项是（  ）\nA. 南极潇湘 / 感极而悲者矣\nB. 予观夫巴陵胜状 / 岳阳楼之大观也\nC. 则有去国怀乡 / 游人去而禽鸟乐也\nD. 得无异乎 / 奇山异水","answer":"答案：C。解析：A项\"极\"：到、直达/极点，意思不同；B项\"观\"：看、观赏/景象，意思不同；C项\"去\"都是\"离开\"的意思，意思相同；D项\"异\"：不同/奇特的，意思不同。本题考查一词多义，需要结合具体语境准确判断实词含义。"},{"id":"g3_chinese_009_ex04","knowledge_id":"g3_chinese_009","question":"文言文阅读：阅读下面文段，解释加点词。\n\n【甲】若夫日出而林霏开，云归而岩穴暝，晦明变化者，山间之朝暮也。野芳发而幽香，佳木秀而繁阴，风霜高洁，水落而石出者，山间之四时也。朝而往，暮而归，四时之景不同，而乐亦无穷也。\n\n（1）林霏开 ________ （2）岩穴暝 ________\n（3）野芳发 ________ （4）乐亦无穷 ________","answer":"答案：（1）弥漫的云气；（2）昏暗；（3）花；开放；（4）尽。解析：（1）\"霏\"指弥漫的云气，林霏即树林中的雾气，\"开\"是散开的意思；（2）\"暝\"指昏暗，与\"晦明变化\"中的\"晦\"对应；（3）\"芳\"指花，是文言中常见的以香代花的用法，\"发\"是开放的意思；（4）\"穷\"指尽、穷尽，乐亦无穷即乐趣也是无穷无尽的。这些都是《醉翁亭记》中的重点实词。"},{"id":"g3_chinese_009_ex05","knowledge_id":"g3_chinese_009","question":"选择题：下列各句中加点词的古今意义相同的一项是（  ）\nA. 越明年，政通人和\nB. 微斯人，吾谁与归\nC. 醉翁之意不在酒\nD. 山间之四时也","answer":"答案：D。解析：A项\"明年\"古义是第二年，今义是今年的下一年，古今意义不同；B项\"微\"古义是如果没有，今义是细小、轻微，古今意义不同；C项\"意\"古义是意趣、情趣，今义是意思、意愿，古今意义不同；D项\"四时\"古今都指四季，古今意义相同。本题考查古今异义词，学习文言文时要特别注意这类词语。"},{"id":"g3_chinese_009_ex06","knowledge_id":"g3_chinese_009","question":"填空题：写出下列句子中加点词的活用类型并解释。\n（1）先天下之忧而忧 ________（活用类型：________）\n（2）名之者谁 ________（活用类型：________）\n（3）大雪三日 ________（活用类型：________）\n（4）刻唐贤今人诗赋于其上 ________（活用类型：________）","answer":"答案：（1）在……之前，名词作状语；（2）命名、取名，名词作动词；（3）下大雪，名词作动词；（4）贤明的人，形容词作名词。解析：（1）\"先\"本是名词，这里用在动词\"忧\"前面作状语，表示\"在……之前\"；（2）\"名\"本是名词名字，这里带宾语\"之\"，活用为动词，是命名的意思；（3）\"大雪\"本是名词，后面跟时间状语\"三日\"，活用为动词，指下大雪；（4）\"贤\"本是形容词贤明的，这里作\"唐\"的中心语，活用为名词，指贤明的人。词类活用是文言实词的重要考点。"},{"id":"g3_chinese_009_ex07","knowledge_id":"g3_chinese_009","question":"选择题：下列句子中，不含通假字的一项是（  ）\nA. 属予作文以记之\nB. 百废具兴\nC. 玉盘珍羞直万钱\nD. 山水之乐，得之心而寓之酒也","answer":"答案：D。解析：A项\"属\"通\"嘱\"，嘱托的意思，通假字；B项\"具\"通\"俱\"，全、皆，通假字；C项\"羞\"通\"馐\"，美味的食物，\"直\"通\"值\"，价值，有两个通假字；D项没有通假字。本题考查通假字，通假字是文言文中常见的语言现象，学习时要注意积累。"},{"id":"g3_chinese_009_ex08","knowledge_id":"g3_chinese_009","question":"文言文阅读：阅读下面两段文字，完成后面题目。\n\n【甲】崇祯五年十二月，余住西湖。大雪三日，湖中人鸟声俱绝。是日更定矣，余拏一小舟，拥毳衣炉火，独往湖心亭看雪。雾凇沆砀，天与云与山与水，上下一白。湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。\n\n（1）解释下列句中加点的词。\n①余拏一小舟 ________ ②雾凇沆砀 ________\n③上下一白 ________ ④舟中人两三粒而已 ________","answer":"答案：①撑（船）；②白汽弥漫的样子；③全、都；④罢了。解析：①\"拏\"（ná）指撑船，这是古汉语中比较生僻的动词；②\"沆砀\"（hàng dàng）形容白汽弥漫的样子，是叠韵联绵词；③\"一\"在这里是副词，表范围，意思是\"全、都\"，上下一白即上下全白；④\"而已\"是语气词，罢了的意思，表示限止语气。《湖心亭看雪》中有许多重点实词需要掌握。"},{"id":"g3_chinese_009_ex09","knowledge_id":"g3_chinese_009","question":"选择题：下列对加点词的解释，全部正确的一项是（  ）\nA. 增其旧制（规模）  连月不开（开放）\nB. 沙鸥翔集（停息）  宠辱偕忘（一起）\nC. 泉香而酒洌（凉）  山肴野蔌（蔬菜）\nD. 更有痴似相公者（更加）  湖中焉得更有此人（还）","answer":"答案：B。解析：A项\"连月不开\"中\"开\"应解释为\"天气放晴\"，而非开放，该项有误；B项\"集\"指停息，\"偕\"指一起，两项都正确；C项\"洌\"应解释为\"清\"，形容酒清，而非凉，该项有误；D项\"更有痴似相公者\"中\"更\"应解释为\"还\"，表示出乎意料，而非更加，该项有误。本题考查多个实词的理解，综合性较强。"},{"id":"g3_chinese_009_ex10","knowledge_id":"g3_chinese_009","question":"填空题：文言实词推断方法练习——根据语境推断加点词的意思。\n\n（1）\"庆历四年春，滕子京谪守巴陵郡。越明年，政通人和，百废具兴。\"句中\"谪\"的意思是________，依据是________________。\n（2）\"若夫淫雨霏霏，连月不开，阴风怒号，浊浪排空\"句中\"排空\"的意思是________，依据是________________。","answer":"答案：（1）贬官、降职或远调；依据是后文\"政通人和，百废具兴\"，说明滕子京是被降职到巴陵郡做太守，且\"谪\"在文言文中常指官吏降职或远调；（2）冲向天空；依据是\"阴风怒号，浊浪排空\"描写的是风浪的气势，\"排\"有推、冲击之意，\"空\"指天空，形容浪涛巨大冲向天空。解析：文言实词推断要学会\"以文解文\"，即根据上下文语境来推断词义，这是学习文言文的重要方法。常见的推断方法有：语境推断法、语法分析法、联想推断法、成语对应法等。"},{"id":"g3_chinese_010_ex01","knowledge_id":"g3_chinese_010","question":"选择题：下列各组句子中，\"之\"字的用法与其他三项不同的一项是（  ）\nA. 前人之述备矣\nB. 览物之情，得无异乎\nC. 予尝求古仁人之心\nD. 居庙堂之高则忧其民","answer":"答案：D。解析：A、B、C三项中的\"之\"都是结构助词，译为\"的\"，表示领属或修饰关系；D项中的\"之\"是定语后置的标志，正常语序应为\"居高庙堂则忧其民\"，\"之\"在这里帮助定语后置，不译。本题考查文言虚词\"之\"的多种用法，学习时要注意归纳总结。"},{"id":"g3_chinese_010_ex02","knowledge_id":"g3_chinese_010","question":"填空题：解释下列句中\"其\"字的含义。\n（1）其喜洋洋者矣 ________\n（2）居庙堂之高则忧其民 ________\n（3）其必曰\"先天下之忧而忧\" ________\n（4）醉能同其乐 ________","answer":"答案：（1）那，那种；（2）他的；（3）大概，或许；（4）他们的。解析：（1）\"其\"是指示代词，那、那种，\"其喜洋洋者矣\"意思是那真是高兴到了极点啊；（2）\"其\"是第三人称代词，他的，指古仁人的；（3）\"其\"是语气副词，表示推测、估计，大概、或许的意思；（4）\"其\"是第三人称代词，他们的，指一同游玩的人。\"其\"的用法比较复杂，要结合语境具体分析。"},{"id":"g3_chinese_010_ex03","knowledge_id":"g3_chinese_010","question":"选择题：下列句子中，\"而\"字表示转折关系的一项是（  ）\nA. 朝而往，暮而归\nB. 饮少辄醉，而年又最高\nC. 禽鸟知山林之乐，而不知人之乐\nD. 日出而林霏开","answer":"答案：C。解析：A项\"而\"表示修饰关系，连接状语和中心语，可不译；B项\"而\"表示递进关系，而且、并且；C项\"而\"表示转折关系，却、但是，禽鸟知道山林的乐趣，却不知道人的乐趣；D项\"而\"表示承接关系，就、便，太阳出来后树林里的雾气就散开了。本题考查文言虚词\"而\"的多种关系，要根据上下文语义判断。"},{"id":"g3_chinese_010_ex04","knowledge_id":"g3_chinese_010","question":"文言文阅读：阅读下面文段，完成后面题目。\n\n嗟夫！予尝求古仁人之心，或异二者之为，何哉？不以物喜，不以己悲，居庙堂之高则忧其民，处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰\"先天下之忧而忧，后天下之乐而乐\"乎！噫！微斯人，吾谁与归？\n\n（1）\"不以物喜，不以己悲\"运用了什么修辞方法和文言句式？有何表达效果？","answer":"答案：运用了互文的修辞方法和对偶句式。这是一个互文句，意思是\"不因外物（好坏）和自己（得失）而或喜或悲\"，不能理解为\"不因为外物好就高兴，不因为自己失意就悲伤\"。表达效果：句式整齐，音韵和谐，高度凝练地表达了古仁人的旷达胸襟，增强了语言的气势和感染力。解析：互文是古汉语中常见的修辞方法，上下两句或一句话中的两个部分，看似各说两件事，实则是互相呼应、互相阐发、互相补充，说的是一件事。理解时要将两部分合起来看。"},{"id":"g3_chinese_010_ex05","knowledge_id":"g3_chinese_010","question":"选择题：下列句子中，句式与其他三项不同的一项是（  ）\nA. 微斯人，吾谁与归\nB. 负者歌于途，行者休于树\nC. 泻出于两峰之间者\nD. 雪拥蓝关马不前","answer":"答案：D。解析：A项\"吾谁与归\"是宾语前置句，正常语序应为\"吾与谁归\"，疑问代词\"谁\"作介词\"与\"的宾语前置；B项\"歌于途\"\"休于树\"都是状语后置句，正常语序应为\"于途歌\"\"于树休\"；C项\"泻出于两峰之间\"是状语后置句，正常语序应为\"于两峰之间泻出\"；D项是一般陈述句，没有特殊句式。本题考查文言特殊句式，重点是宾语前置和状语后置。"},{"id":"g3_chinese_010_ex06","knowledge_id":"g3_chinese_010","question":"填空题：指出下列句子的文言句式，并将其译为现代汉语。\n（1）此则岳阳楼之大观也。  句式：________  译文：________\n（2）醒能述以文者。  句式：________  译文：________\n（3）更有痴似相公者。  句式：________  译文：________","answer":"答案：（1）判断句；这就是岳阳楼的壮丽景象啊。解析：\"……也\"是判断句的标志，\"则\"起强调确认作用。（2）状语后置句（介词结构后置句）；醒来能够用文章记述这事的人。解析：正常语序应为\"醒能以文述者\"，\"以文\"是介宾短语作状语，放在动词\"述\"的后面。（3）状语后置句；还有像相公您一样痴的人呢。解析：正常语序应为\"更有似相公痴者\"，\"似相公\"是介宾短语作状语，修饰\"痴\"。掌握文言句式有助于准确翻译文言文。"},{"id":"g3_chinese_010_ex07","knowledge_id":"g3_chinese_010","question":"选择题：下列对\"以\"字的用法分类正确的一项是（  ）\n①属予作文以记之  ②不以物喜  ③策之不以其道  ④醒能述以文者\nA. ①②/③④\nB. ①/②/③④\nC. ①③/②④\nD. ①/②③/④","answer":"答案：B。解析：①\"以\"是连词，表目的，来、用来，嘱托我写文章来记述这件事；②\"以\"是介词，因为，不因为外物的好坏而或喜或悲；③\"以\"是介词，用、按照，不按照正确的方法驱使它；④\"以\"是介词，用，醒来能够用文章记述这事的人。所以①是连词，②表原因，③④表方式工具，分为三类。本题考查虚词\"以\"的多种用法，要注意区分。"},{"id":"g3_chinese_010_ex08","knowledge_id":"g3_chinese_010","question":"文言文阅读：阅读下面两段文字，完成后面题目。\n\n【甲】若夫淫雨霏霏，连月不开，阴风怒号，浊浪排空，日星隐曜，山岳潜形，商旅不行，樯倾楫摧，薄暮冥冥，虎啸猿啼。登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。\n\n【乙】至若春和景明，波澜不惊，上下天光，一碧万顷，沙鸥翔集，锦鳞游泳，岸芷汀兰，郁郁青青。而或长烟一空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何极！登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。\n\n（1）两段文字都运用了什么写法？有什么作用？","answer":"答案：两段文字都运用了对比和情景交融的写法。对比写法：甲文写的是阴雨连绵时的景象和悲凉的心情，乙文写的是春光明媚时的景象和喜悦的心情，一阴一晴，一悲一喜，形成鲜明对比。情景交融：两段文字都是先写景后抒情，景是情的基础，情是景的升华，景与情高度融合。作用：通过对比，突出了迁客骚人\"以物喜，以己悲\"的特点，为下文写古仁人\"不以物喜，不以己悲\"的旷达胸襟作铺垫，从而突出文章主旨。解析：对比和情景交融是《岳阳楼记》最突出的写作手法，也是文言文阅读常考的知识点。"},{"id":"g3_chinese_010_ex09","knowledge_id":"g3_chinese_010","question":"选择题：下列各组句子中，加点虚词的意义和用法相同的一项是（  ）\nA. 然则何时而乐耶 / 作亭者谁？山之僧智仙也\nB. 感极而悲者矣 / 而不知太守之乐其乐也\nC. 览物之情，得无异乎 / 山间之四时也\nD. 其必曰 / 颓然乎其间者","answer":"答案：C。解析：A项\"者\"：与\"耶\"构成疑问语气/……的人，用法不同；B项\"而\"：表承接/表转折，却，用法不同；C项\"之\"都是结构助词\"的\"，用法相同；D项\"其\"：大概，表推测/他们的，人称代词，用法不同。本题综合考查多个虚词的用法，需要熟练掌握每个虚词的多种意义和用法。"},{"id":"g3_chinese_010_ex10","knowledge_id":"g3_chinese_010","question":"填空题：文言虚词推断练习——分析下列句中\"焉\"字的用法和意义。\n\n（1）湖中焉得更有此人 ________  用法：________\n（2）三人行，必有我师焉 ________  用法：________\n（3）可远观而不可亵玩焉 ________  用法：________\n（4）且焉置土石 ________  用法：________","answer":"答案：（1）哪里、怎么；疑问代词。解析：湖中怎么还会有这样的人呢？\"焉\"表反问。（2）于之、在其中；兼词。解析：几个人同行，其中一定有可以做我老师的人。\"焉\"是\"于之\"的合音。（3）啊、呢；句末语气词。解析：可以远远地观赏却不能亲近而不庄重地把玩啊。\"焉\"表感叹语气。（4）哪里；疑问代词。解析：况且把土石放到哪里去呢？\"焉\"表疑问。解析：文言虚词\"焉\"的用法比较丰富，常见的有疑问代词、兼词、语气词三种用法，学习时要注意结合语境区分。判断虚词用法的关键是看它在句子中的位置和前后词语的词性。"},{"id":"g3_chinese_011_ex01","knowledge_id":"g3_chinese_011","question":"选择题：下列关于《岳阳楼记》的说法，不正确的一项是（  ）\nA. 本文作者范仲淹，字希文，北宋政治家、文学家，谥号\"文正\"。\nB. 文章以\"记\"为名，借题发挥，表达了作者\"不以物喜，不以己悲\"的旷达胸襟和\"先天下之忧而忧，后天下之乐而乐\"的政治抱负。\nC. 文章开头简述作记缘由，中间详写岳阳楼的雄伟壮观，结尾点明主旨。\nD. 本文骈散结合，句式整齐，音韵和谐，具有很强的艺术感染力。","answer":"答案：C。解析：A项正确，范仲淹是北宋著名的政治家、文学家，谥号文正；B项正确，文章借岳阳楼记题发挥，表达了作者的旷达胸襟和政治抱负，这是文章主旨；C项错误，文章并没有详写岳阳楼的雄伟壮观，而是略写岳阳楼之大观，详写迁客骚人的览物之情，进而引出古仁人之心，点明主旨；D项正确，本文语言骈散结合，大量运用对偶、排比等修辞，具有很强的艺术感染力。本题考查对文章内容和写作特色的整体把握。"},{"id":"g3_chinese_011_ex02","knowledge_id":"g3_chinese_011","question":"填空题：根据课文内容填空。\n（1）《岳阳楼记》中描写岳阳楼\"大观\"的句子是：________。\n（2）表现迁客骚人因物而喜的两个四字句是：________。\n（3）表达作者旷达胸襟的句子是：________。\n（4）阐述古仁人内涵的句子是：________。","answer":"答案：（1）衔远山，吞长江，浩浩汤汤，横无际涯，朝晖夕阴，气象万千。（2）心旷神怡，宠辱偕忘。（3）不以物喜，不以己悲。（4）居庙堂之高则忧其民，处江湖之远则忧其君。解析：本题考查对课文重点语句的理解和默写。（1）句从空间和时间两个角度描写了洞庭湖的雄伟壮观；（2）句与\"忧谗畏讥，满目萧然\"形成对比，表达了登楼者因晴天美景而产生的喜悦之情；（3）句是古仁人的处世态度，也是作者的旷达胸襟；（4）句从进退两个方面写出了古仁人以天下为己任的胸怀。这些句子都是文章的核心内容，要在理解的基础上背诵。"},{"id":"g3_chinese_011_ex03","knowledge_id":"g3_chinese_011","question":"文言文阅读：阅读课文第3-4段，完成下面的问题。\n\n若夫淫雨霏霏，连月不开，阴风怒号，浊浪排空，日星隐曜，山岳潜形，商旅不行，樯倾楫摧，薄暮冥冥，虎啸猿啼。登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。\n\n至若春和景明，波澜不惊，上下天光，一碧万顷，沙鸥翔集，锦鳞游泳，岸芷汀兰，郁郁青青。而或长烟一空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何极！登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。\n\n（1）这两段文字写景的角度有什么不同？分别渲染了怎样的气氛？","answer":"答案：第3段写的是阴雨天气的景象，从视觉、听觉等角度，描绘了一幅阴冷萧条的画面，渲染了悲凉凄清的气氛；第4段写的是晴朗天气的景象，从视觉、听觉等角度，描绘了一幅明丽欢快的画面，渲染了喜悦欢快的气氛。解析：第3段的景物如\"淫雨霏霏\"\"阴风怒号\"\"浊浪排空\"\"薄暮冥冥\"\"虎啸猿啼\"都是阴冷凄凉的，烘托出人物悲凉的心情；第4段的景物如\"春和景明\"\"一碧万顷\"\"沙鸥翔集\"\"锦鳞游泳\"\"皓月千里\"都是明丽美好的，烘托出人物喜悦的心情。这两段一阴一晴、一悲一喜，形成鲜明对比，为下文写古仁人之心作铺垫。"},{"id":"g3_chinese_011_ex04","knowledge_id":"g3_chinese_011","question":"选择题：\"浮光跃金，静影沉璧\"运用的修辞手法是（  ）\nA. 比喻  排比\nB. 对偶  比喻\nC. 夸张  对偶\nD. 比喻  夸张","answer":"答案：B。解析：这句话运用了对偶和比喻两种修辞手法。对偶：\"浮光\"对\"静影\"，\"跃金\"对\"沉璧\"，上下句字数相等、结构相同、意义对称，是工整的对偶句。比喻：\"浮光跃金\"把月光照耀下的水波比喻成跳动的金子，\"静影沉璧\"把静静的月影像沉入水中的玉璧，两个比喻生动形象地写出了月夜洞庭湖的美丽景色。这句话没有使用排比和夸张，所以选B。解析：《岳阳楼记》中大量运用对偶、比喻等修辞手法，使文章语言优美、意境深远，学习时要注意体会。"},{"id":"g3_chinese_011_ex05","knowledge_id":"g3_chinese_011","question":"填空题：理解性默写。\n（1）由\"四面湖光归眼底，万家忧乐到心头\"这副对联，你能想到范仲淹《岳阳楼记》中的两句话是：________，________。\n（2）范仲淹在《岳阳楼记》中揭示\"古仁人之心\"内涵的句子是：________，________。\n（3）范仲淹在《岳阳楼记》中表达自己远大政治抱负的句子是：________，________。\n（4）新市长上任以来，全市面貌大变，百姓安居乐业，真是\"________，________\"。（用《岳阳楼记》中的原句填写）","answer":"答案：（1）先天下之忧而忧，后天下之乐而乐。（2）不以物喜，不以己悲。（3）先天下之忧而忧，后天下之乐而乐。（4）政通人和，百废具兴。解析：本题考查理解性默写，要求在理解文章内容的基础上准确填写句子。（1）对联中的\"万家忧乐\"与\"先天下之忧而忧，后天下之乐而乐\"表达的意思一致；（2）\"古仁人之心\"的核心就是不因外物和自己处境的变化而或喜或悲；（3）作者的政治抱负就是以天下为己任，忧在天下人之前，乐在天下人之后；（4）\"政通人和，百废具兴\"正是政治清明、百姓安居乐业的写照。理解性默写是文言文考查的重要题型，要在理解的基础上记忆。"},{"id":"g3_chinese_011_ex06","knowledge_id":"g3_chinese_011","question":"文言文阅读：阅读下面的文段，回答问题。\n\n嗟夫！予尝求古仁人之心，或异二者之为，何哉？不以物喜，不以己悲，居庙堂之高则忧其民，处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰\"先天下之忧而忧，后天下之乐而乐\"乎！噫！微斯人，吾谁与归？\n\n（1）\"微斯人，吾谁与归\"一句有什么深刻含义？表达了作者怎样的思想感情？","answer":"答案：这句话的意思是：如果没有这种人，我同谁一道呢？深刻含义：这句话一方面表达了作者对古仁人\"不以物喜，不以己悲\"旷达胸襟和\"先天下之忧而忧，后天下之乐而乐\"远大抱负的仰慕和追求；另一方面也含蓄地表达了自己愿与古仁人同道的决心，同时也包含着对友人滕子京的劝慰和勉励，希望他也能具有古仁人之心。思想感情：表达了作者忧国忧民、以天下为己任的政治情怀，以及知音难觅的孤独感慨。解析：这句话是全文的点睛之笔，作者用反问句结尾，发人深省，既点明了主旨，又表达了自己的人生追求和政治理想，具有很强的感染力。"},{"id":"g3_chinese_011_ex07","knowledge_id":"g3_chinese_011","question":"选择题：下面对文章内容的理解和分析，不正确的一项是（  ）\nA. 文章开头即切入正题，叙述作记缘由，说滕子京\"谪守巴陵郡\"，已经暗含着仕途沉浮的悲慨。\nB. 第2段中\"前人之述备矣\"一句，既回应了前文的\"唐贤今人诗赋\"，又转写洞庭湖的独特景观，引出下文。\nC. 文章3、4段写景，一阴一晴，一悲一喜，两相对照，表现了迁客骚人因物而喜、因己而悲的特点。\nD. 文章最后一段，在列举了悲喜两种情境后，笔调突然激扬，道出了超乎这两者之上的一种更高的理想境界，那就是\"不以物喜，不以己悲\"，作者对此持否定态度。","answer":"答案：D。解析：A、B、C三项对文章内容的理解和分析都是正确的。D项错误，作者对\"不以物喜，不以己悲\"的古仁人之心不是持否定态度，而是持肯定和推崇的态度。作者正是通过迁客骚人以物喜、以己悲的表现，反衬古仁人不以物喜、不以己悲的旷达胸襟，进而表达自己\"先天下之忧而忧，后天下之乐而乐\"的政治抱负。解析：本题考查对文章主旨和作者情感态度的把握，要注意区分文中不同人物的情感态度和作者的情感态度。"},{"id":"g3_chinese_011_ex08","knowledge_id":"g3_chinese_011","question":"填空题：本文标题为《岳阳楼记》，内容上却大量描写洞庭湖的景色，试分析作者这样写的用意。\n\n答：________________________________","answer":"答案：①为了衬托岳阳楼的雄伟气势，临湖观景，气势磅礴，增强文章的感染力；②洞庭湖的阴晴变化，是迁客骚人\"览物之情\"产生的缘由，写景是为了写情，一阴一晴之景对应一悲一喜之情，为下文写古仁人之心作铺垫；③洞庭湖是连接岳阳楼和作者思想感情的纽带，通过对洞庭湖景色的描写，自然引出登楼者的心情，进而引出古仁人之心，点明文章主旨；④以壮阔的景象来烘托作者\"先天下之忧而忧，后天下之乐而乐\"的宏大抱负，情景交融，景与情相得益彰。解析：本题考查对文章写作手法的理解。文章题为《岳阳楼记》，但并没有把重点放在描写楼上，而是通过写登楼所见的洞庭湖景色，引出登楼者的心情，进而引出作者的见解。这种由景入情、由情入理的写法，层层递进，水到渠成，是文章的高明之处。"},{"id":"g3_chinese_011_ex09","knowledge_id":"g3_chinese_011","question":"文言文阅读：对比阅读，完成后面题目。\n\n【甲】嗟夫！予尝求古仁人之心，或异二者之为，何哉？不以物喜，不以己悲，居庙堂之高则忧其民，处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰\"先天下之忧而忧，后天下之乐而乐\"乎！噫！微斯人，吾谁与归？\n\n【乙】黄冈之地多竹，大者如椽。竹工破之，刳去其节，用代陶瓦。比屋皆然，以其价廉而工省也。……宜鼓琴，琴调虚畅；宜咏诗，诗韵清绝；宜围棋，子声丁丁然；宜投壶，矢声铮铮然：皆竹楼之所助也。\n公退之暇，被鹤氅衣，戴华阳巾，手执《周易》一卷，焚香默坐，消遣世虑。江山之外，第见风帆沙鸟、烟云竹树而已。待其酒力醒，茶烟歇，送夕阳，迎素月，亦谪居之胜概也。（节选自王禹偁《黄冈竹楼记》）\n\n（1）两文的作者都被贬官，但表现出的人生态度有何异同？","answer":"答案：相同点：两人被贬后都没有消极沉沦，都体现了旷达乐观的情怀。不同点：范仲淹在《岳阳楼记》中表达的是\"不以物喜，不以己悲\"的旷达胸襟和\"先天下之忧而忧，后天下之乐而乐\"的政治抱负，他忧国忧民，以天下为己任，积极入世；王禹偁在《黄冈竹楼记》中则表现出一种寄情山水、随遇而安的闲适恬淡的情怀，他在竹楼中读书、抚琴、饮酒、赏月，享受谪居生活的乐趣，偏向于出世、自娱。解析：同是被贬，不同的人有不同的态度。范仲淹是政治家，他想到的是国家和人民；王禹偁是文人，他更注重个人的精神修养和生活情趣。两相对比，可以看出两人不同的人生追求和精神境界。"},{"id":"g3_chinese_011_ex10","knowledge_id":"g3_chinese_011","question":"简答题：范仲淹\"先天下之忧而忧，后天下之乐而乐\"的思想在今天有什么现实意义？请结合实际谈谈你的看法。\n\n答：________________________________","answer":"答案：范仲淹\"先天下之忧而忧，后天下之乐而乐\"的思想，强调以天下为己任，吃苦在前、享乐在后，在今天仍然具有重要的现实意义。\n①对于国家和社会而言，这种精神是激励人们奋发有为、为国奉献的强大精神动力。正是因为有无数具有这种精神的人，我们的国家才能不断发展进步。\n②对于青少年来说，树立这种远大志向，可以帮助我们克服学习和生活中的困难，把个人理想和国家需要结合起来，实现人生的价值。\n③在现实生活中，我们身边也有许多这样的人，比如扎根基层的扶贫干部、救死扶伤的医护人员、默默奉献的教师等，他们用实际行动践行着这种精神。\n④当然，我们也要辩证地看待，在强调奉献的同时，也要尊重个人的合法权益，实现个人价值与社会价值的统一。\n总之，范仲淹的这句名言，已经成为中华民族宝贵的精神财富，激励着一代又一代中国人为国家和民族的发展而努力奋斗。解析：本题是开放性题目，考查对文章主旨的现实意义的理解，要求学生联系实际谈看法，言之有理即可。"},{"id":"g3_chinese_012_ex01","knowledge_id":"g3_chinese_012","question":"选择题：下列关于《醉翁亭记》的说法，正确的一项是（  ）\nA. 本文作者欧阳修，字永叔，自号醉翁，晚年又号六一居士，唐代文学家。\nB. 文章以\"乐\"字贯穿全文，依次写了滁人游、太守宴、众宾欢、太守醉，最后点明\"醉能同其乐\"的主旨。\nC. 文中的\"醉翁之意不在酒，在乎山水之间也\"已经成为千古名句，现在常用来比喻本意不在此而在别的方面。\nD. 文章语言华丽典雅，大量运用排比、夸张等修辞手法，具有很强的艺术感染力。","answer":"答案：C。解析：A项错误，欧阳修是北宋文学家，不是唐代；B项错误，文章以\"乐\"字贯穿全文是对的，但依次写的是山水之乐、宴酣之乐、禽鸟之乐、游人之乐、太守之乐，主旨是\"与民同乐\"，不是简单的\"醉能同其乐\"；C项正确，\"醉翁之意不在酒\"现在已经成为常用成语，比喻本意不在此而在别的方面；D项错误，文章语言清丽自然，多用对偶句，风格平易流畅，不是华丽典雅，也没有大量运用夸张手法。本题考查对文章基本常识和写作特色的掌握。"},{"id":"g3_chinese_012_ex02","knowledge_id":"g3_chinese_012","question":"填空题：根据课文内容填空。\n（1）文中描写山间朝暮之景的句子是：________，________。\n（2）文中描写山间四时之景的句子是：________，________，________，________。\n（3）奠定全文抒情基调的千古名句是：________，________。\n（4）点明全文主旨的句子是：________。","answer":"答案：（1）日出而林霏开，云归而岩穴暝。（2）野芳发而幽香，佳木秀而繁阴，风霜高洁，水落而石出者。（3）醉翁之意不在酒，在乎山水之间也。（4）醉能同其乐（或：人知从太守游而乐，而不知太守之乐其乐也）。解析：本题考查对课文重点语句的理解和默写。（1）句从早晚两个角度描写山间景色的变化，\"开\"和\"暝\"形成对比；（2）句用四幅画面写出了四季的不同景色，每幅画面都抓住了季节特征，春花香、夏木繁、秋霜洁、冬石出；（3）句是全文的核心句，点明了\"乐\"字，奠定了全文的抒情基调；（4）句点明了文章\"与民同乐\"的主旨，太守之乐的最高境界就是与民同乐。这些句子都是考试常考的内容，要熟练背诵和理解。"},{"id":"g3_chinese_012_ex03","knowledge_id":"g3_chinese_012","question":"文言文阅读：阅读课文第1段，完成下面的问题。\n\n环滁皆山也。其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也。山行六七里，渐闻水声潺潺，而泻出于两峰之间者，酿泉也。峰回路转，有亭翼然临于泉上者，醉翁亭也。作亭者谁？山之僧智仙也。名之者谁？太守自谓也。太守与客来饮于此，饮少辄醉，而年又最高，故自号曰醉翁也。醉翁之意不在酒，在乎山水之间也。山水之乐，得之心而寓之酒也。\n\n（1）本段写景的顺序是什么？这样写有什么好处？","answer":"答案：写景顺序：由远到近，由整体到局部。先从大处落笔，写\"环滁皆山也\"，这是全景、远景；然后拉近镜头，写西南诸峰，再到琅琊山，再到酿泉，最后推出醉翁亭。好处：①层层推进，逐步引出描写对象醉翁亭，给读者留下悬念，增强了文章的吸引力；②由远及近，视野逐步缩小，符合人们观察事物的一般规律，显得自然流畅；③用层层烘托的手法，突出了醉翁亭环境的优美，为下文写山水之乐作铺垫；④使文章曲折有致，避免了平铺直叙，增加了文章的波澜。解析：本题考查对文章写景顺序和写作技巧的理解。第1段的写景很有特色，像电影镜头一样由远及近，逐步推出主角，这种写法值得学习。"},{"id":"g3_chinese_012_ex04","knowledge_id":"g3_chinese_012","question":"选择题：对\"人知从太守游而乐，而不知太守之乐其乐也\"一句理解有误的一项是（  ）\nA. 这句话用了对比手法，众人之乐和太守之乐形成对比，突出了太守之乐的与众不同。\nB. 太守的\"乐其乐\"是指太守以游人的快乐为快乐，也就是与民同乐。\nC. 这句话含蓄地表达了作者复杂的情感，既有寄情山水排遣抑郁的一面，也有与民同乐的政治理想。\nD. 这句话表明太守的快乐是建立在众人快乐基础之上的，众人不快乐，太守也不会快乐。","answer":"答案：D。解析：A项正确，众人之乐是游玩之乐，太守之乐是乐人之乐，两者境界不同，对比鲜明；B项正确，\"乐其乐\"就是以游人的快乐为快乐，即与民同乐，这是文章主旨；C项正确，欧阳修被贬滁州，寄情山水有排遣抑郁的成分，但更主要的是表达了与民同乐的政治理想，情感是复杂的；D项错误，太守之乐的内涵更丰富，除了与民同乐，还有山水之乐、宴酣之乐等，不能简单地说众人不快乐太守就不快乐。解析：本题考查对文章主旨句的理解，要结合全文内容和写作背景来分析，不能片面化、绝对化。"},{"id":"g3_chinese_012_ex05","knowledge_id":"g3_chinese_012","question":"填空题：本文用了21个\"也\"字，形成了独特的语言风格，请分析\"也\"字的表达作用。\n\n（1）从语气角度看，\"也\"字使全文形成了一种________的语气，恰到好处地表达了作者________的心情。\n（2）从结构角度看，\"也\"字有助于________，使文章层次分明。\n（3）从节奏角度看，\"也\"字使文章形成了________的节奏感，读起来朗朗上口。","answer":"答案：（1）舒缓从容；愉悦平和（或：闲适自得）。（2）理清层次脉络（或：使段与段之间、句与句之间关系清晰）。（3）一唱三叹、回环往复（或：整齐中有变化、抑扬顿挫）。解析：《醉翁亭记》中21个\"也\"字的运用是本文的一大特色。（1）语气方面，\"也\"字使全文不用一个强烈的语气词，语气舒缓从容，像是一位老者在娓娓道来，很好地表达了作者闲适自得的心情；（2）结构方面，每段都用\"也\"字结尾，使段与段之间界限清晰，每段内部的句子也常用\"也\"字，使句间关系明确，层次非常清楚；（3）节奏方面，\"也\"字造成了一种咏叹的语调，一唱三叹，回环往复，富有音乐美。这种独特的语言风格，使文章具有很强的艺术感染力。"},{"id":"g3_chinese_012_ex06","knowledge_id":"g3_chinese_012","question":"文言文阅读：阅读下面的文段，回答问题。\n\n至于负者歌于途，行者休于树，前者呼，后者应，伛偻提携，往来而不绝者，滁人游也。临溪而渔，溪深而鱼肥，酿泉为酒，泉香而酒洌，山肴野蔌，杂然而前陈者，太守宴也。宴酣之乐，非丝非竹，射者中，弈者胜，觥筹交错，起坐而喧哗者，众宾欢也。苍颜白发，颓然乎其间者，太守醉也。\n\n（1）这段文字描绘了四幅画面，请各用三个字概括。这四幅画面的核心是什么？","answer":"答案：四幅画面依次是：滁人游、太守宴、众宾欢、太守醉。核心是\"太守醉\"（或：太守之乐）。解析：这段文字用了四个排比句，描绘了四幅生动的画面。第一幅\"滁人游\"，写滁州百姓出游的欢乐场景，说明百姓生活安定富足，这是太守治理有方的结果；第二幅\"太守宴\"，写宴会的丰盛，就地取材，简朴而有野趣；第三幅\"众宾欢\"，写宴会的热闹欢乐；第四幅\"太守醉\"，写太守喝醉的样子，他为百姓的快乐而陶醉，为自己的政绩而陶醉。四幅画面中，前三幅都是陪衬，最后一幅\"太守醉\"是核心，因为它集中体现了文章\"与民同乐\"的主旨。太守的\"醉\"不是真正的醉酒，而是为百姓安居乐业而陶醉，为山水之美而陶醉。"},{"id":"g3_chinese_012_ex07","knowledge_id":"g3_chinese_012","question":"选择题：对《岳阳楼记》和《醉翁亭记》的比较分析，不正确的一项是（  ）\nA. 两文都是作者被贬后的作品，都表达了积极向上的人生态度。\nB. 两文都大量运用了骈偶句，句式整齐，音韵和谐。\nC. 两文都以\"记\"为名，借题发挥，表达了作者的政治理想。范仲淹的理想是\"先天下之忧而忧，后天下之乐而乐\"，欧阳修的理想是\"与民同乐\"。\nD. 两文的表达方式相同，都是先描写、叙事，后议论、抒情，卒章显志。","answer":"答案：D。解析：A项正确，范仲淹被贬邓州，欧阳修被贬滁州，两人都没有消极沉沦，而是积极作为，表达了积极向上的人生态度；B项正确，两文都大量运用对偶句，骈散结合，语言优美；C项正确，两文都是借景抒情、托物言志的名篇，分别表达了两位文学家的政治理想；D项错误，两文的表达方式并不完全相同，《岳阳楼记》是先叙事、再写景、再抒情、最后议论，卒章显志；而《醉翁亭记》则是叙事、写景、抒情紧密结合，议论成分较少，主旨蕴含在描写之中，不是典型的卒章显志。本题通过比较阅读考查对两篇文章的深入理解。"},{"id":"g3_chinese_012_ex08","knowledge_id":"g3_chinese_012","question":"填空题：本文的文眼是\"乐\"字，作者写了多种\"乐\"，请根据课文内容梳理作者写了哪几种\"乐\"，它们之间有什么关系。\n\n（1）作者写了哪几种\"乐\"？\n答：________\n（2）这些\"乐\"之间有什么关系？\n答：________","answer":"答案：（1）作者写了五种\"乐\"：山水之乐、宴酣之乐、禽鸟之乐、游人之乐、太守之乐。（2）关系：①山水之乐、宴酣之乐是太守个人的乐趣，是浅层的乐；②禽鸟之乐、游人之乐是他人（物）的乐，是中层的乐；③太守之乐是最高层次的乐，它包含了前几种乐，但又超越了前几种乐，它是以游人的快乐为快乐，也就是与民同乐；④几种乐层层递进，最后归结到太守之乐，突出了文章主旨；⑤禽鸟之乐和游人之乐形成对比，游人之乐和太守之乐又形成对比，通过两层对比，突出了太守之乐的境界之高。解析：本题考查对文章线索和主旨的把握。\"乐\"是贯穿全文的主线，多种\"乐\"不是并列关系，而是层层递进的关系，最终都指向\"与民同乐\"这个核心主旨。"},{"id":"g3_chinese_012_ex09","knowledge_id":"g3_chinese_012","question":"文言文阅读：阅读下面的文段，回答问题。\n\n已而夕阳在山，人影散乱，太守归而宾客从也。树林阴翳，鸣声上下，游人去而禽鸟乐也。然而禽鸟知山林之乐，而不知人之乐；人知从太守游而乐，而不知太守之乐其乐也。醉能同其乐，醒能述以文者，太守也。太守谓谁？庐陵欧阳修也。\n\n（1）本段用了什么写作手法？有什么作用？\n（2）\"醉能同其乐，醒能述以文者\"表达了作者怎样的志趣？","answer":"答案：（1）写作手法：对比。作用：①用禽鸟之乐和人之乐对比，说明人比禽鸟高级，能享受更多的乐趣；②用人之乐和太守之乐对比，说明太守的乐境界更高，是以游人的快乐为快乐；③通过两层对比，层层递进，突出了太守之乐的与众不同，点明了文章\"与民同乐\"的主旨；④使文章富有波澜，避免了平铺直叙。\n（2）表达了作者：①寄情山水、热爱自然的情趣；②与民同乐的政治理想和旷达情怀；③醉心文墨、以文记乐的文人雅趣；④虽遭贬谪但仍积极乐观、有所作为的人生态度。解析：本题考查对文章结尾段的深入理解。结尾是全文的点睛之笔，对比手法的运用和\"醉能同其乐，醒能述以文\"的自我评价，都集中体现了作者的思想感情和志趣追求。"},{"id":"g3_chinese_012_ex10","knowledge_id":"g3_chinese_012","question":"简答题：欧阳修在《醉翁亭记》中表达了\"与民同乐\"的思想，这种思想在今天有什么现实意义？请结合实际谈谈你的理解。\n\n答：________________________________","answer":"答案：欧阳修\"与民同乐\"的思想，在今天仍然具有重要的现实意义。\n①从政府治理的角度看，\"与民同乐\"体现了以人民为中心的发展思想。我们的政府是人民的政府，一切工作的出发点和落脚点都是为了人民的幸福。只有真正做到发展为了人民、发展依靠人民、发展成果由人民共享，才能实现社会的和谐稳定。\n②从干部作风的角度看，\"与民同乐\"要求领导干部深入群众、贴近群众，关心群众的疾苦，与群众同甘共苦。那些高高在上、脱离群众的官僚主义作风，是与\"与民同乐\"的精神背道而驰的。\n③从个人层面看，\"与民同乐\"告诉我们，个人的快乐如果能和他人的快乐、社会的福祉结合起来，才是更有意义、更有价值的快乐。赠人玫瑰，手有余香，帮助他人、奉献社会，能让我们获得更深层次的幸福感。\n④当然，我们今天讲的\"与民同乐\"，是建立在人人平等基础上的，与封建社会官员对百姓的恩赐式的\"乐\"有本质区别，但其中蕴含的民本思想和人文关怀，仍然值得我们继承和发扬。\n总之，\"与民同乐\"的思想虽然产生于古代，但它所蕴含的价值理念，在今天仍然熠熠生辉，给我们以深刻的启迪。解析：本题是开放性试题，考查对文章思想内涵的现实意义的理解，言之有理即可。"},{"id":"g3_chinese_013_ex01","knowledge_id":"g3_chinese_013","question":"选择题：下列关于《湖心亭看雪》的说法，不正确的一项是（  ）\nA. 本文作者张岱，字宗子，号陶庵，明末清初文学家，著有《陶庵梦忆》《西湖梦寻》等。\nB. 文章用清新淡雅的笔墨，描绘了雪后西湖宁静清绝的景象，表现了作者孤独寂寞的心境和淡淡的愁绪。\nC. \"独往湖心亭看雪\"一句中\"独\"字，充分展示了作者遗世独立的高洁情怀和不随流俗的生活方式。\nD. 文中\"湖中焉得更有此人\"一句，是作者对金陵客人的嘲讽，认为他们不懂得欣赏西湖雪景。","answer":"答案：D。解析：A项正确，张岱是明末清初著名文学家，《湖心亭看雪》选自《陶庵梦忆》；B项正确，文章描绘了雪后西湖的美景，也流露了作者的故国之思和孤独之感；C项正确，\"独\"字是文眼，表现了作者独特的个性和高洁的情怀；D项错误，\"湖中焉得更有此人\"不是嘲讽，而是一种惊喜和赞叹，意思是想不到在湖中还会有这样的人！表现了作者遇到知音的惊喜，金陵客人说\"莫说相公痴，更有痴似相公者\"也印证了这一点，两人都是\"痴\"人，是知音。本题考查对文章内容和情感的整体把握。"},{"id":"g3_chinese_013_ex02","knowledge_id":"g3_chinese_013","question":"填空题：根据课文内容填空。\n（1）文中运用白描手法描写雪景的千古名句是：________，________，________。湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。\n（2）点明时间地点的句子是：________，________。\n（3）描写湖上雪景的总体感受的句子是：________。\n（4）点明文章主旨（点睛之笔）的句子是：________，________。","answer":"答案：（1）雾凇沆砀，天与云与山与水，上下一白。（2）崇祯五年十二月，余住西湖。（3）大雪三日，湖中人鸟声俱绝。（4）莫说相公痴，更有痴似相公者。解析：本题考查对课文重点语句的理解和默写。（1）句是本文最精彩的写景句，用白描手法，由整体到局部，写出了雪后西湖的茫茫一片，极具画面感；（2）句开头点明时间地点，简洁明了；（3）句从听觉角度写雪后的寂静，为下文看雪作铺垫；（4）句是结尾舟子的话，看似随意，实则点睛，\"痴\"字是对作者最准确的评价。这些句子都是考试常考内容，要熟练掌握。"},{"id":"g3_chinese_013_ex03","knowledge_id":"g3_chinese_013","question":"文言文阅读：阅读下面的文段，回答问题。\n\n崇祯五年十二月，余住西湖。大雪三日，湖中人鸟声俱绝。是日更定矣，余拏一小舟，拥毳衣炉火，独往湖心亭看雪。雾凇沆砀，天与云与山与水，上下一白。湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。\n\n（1）\"大雪三日，湖中人鸟声俱绝\"一句是从什么角度写景的？有什么作用？\n（2）赏析文中画线的写景句（\"雾凇沆砀……两三粒而已\"）。","answer":"答案：（1）角度：从听觉角度写景（或：侧面描写/烘托）。作用：①写出了大雪后西湖的寂静清冷，万籁俱寂；②渲染了一种肃杀、冷寂的氛围；③为下文作者\"独往湖心亭看雪\"作铺垫，突出了作者的与众不同；④\"绝\"字用得好，从听觉入手，巧妙地写出了大雪封湖、万籁无声的景象。\n（2）赏析：①运用了白描手法，用简洁的笔触勾勒出雪后西湖的景色，不加修饰，却意境深远；②写景顺序由整体到局部，先写全景\"上下一白\"，再写具体景物，层次清晰；③巧妙运用量词，\"一痕\"\"一点\"\"一芥\"\"两三粒\"，准确地写出了景物的渺小和朦胧，富有层次感和诗意；④对比鲜明，天地的广阔与人的渺小形成对比，突出了宇宙的浩大和人生的渺小；⑤文字清新淡雅，如诗如画，给人以美的享受。\n解析：本题考查对文章写景技巧的赏析。《湖心亭看雪》的写景是一绝，白描手法的运用和量词的巧妙使用，都是学习的重点。"},{"id":"g3_chinese_013_ex04","knowledge_id":"g3_chinese_013","question":"选择题：对\"独往湖心亭看雪\"中\"独\"字的理解，不正确的一项是（  ）\nA. \"独\"字写出了作者独自一人前往湖心亭看雪，表现了他孤独寂寞的心境。\nB. \"独\"字充分展示了作者遗世独立的高洁情怀和不随流俗的生活方式。\nC. \"独\"字反衬出环境的幽静空旷，暗示了作者超凡脱俗的性格。\nD. \"独\"字与后文\"舟中人两三粒而已\"\"舟子\"相矛盾，说明作者写作时不够严谨。","answer":"答案：D。解析：A、B、C三项对\"独\"字的理解都是正确的，\"独\"字有丰富的内涵。D项错误，\"独\"字并不与后文矛盾。作者写\"独往\"，是强调自己独特的感受和情趣，舟子虽然也在船上，但他不是作者的知音，不懂作者的情趣，所以在精神上作者是\"独\"的。而且\"舟中人两三粒\"是远观的视角，是从整体画面来看的，不能据此否定\"独\"字的用法。这是艺术的真实，不是生活的真实，不能用生活逻辑来套文学作品。解析：本题考查对关键词语的理解，要结合全文内容和作者情感来分析，不能片面化。"},{"id":"g3_chinese_013_ex05","knowledge_id":"g3_chinese_013","question":"填空题：\"莫说相公痴，更有痴似相公者\"是本文的点睛之笔，请说说你对这句话的理解。\n\n（1）句中的\"痴\"是什么意思？________________________________\n（2）作者的\"痴\"表现在哪些方面？________________________________\n（3）这句话有什么作用？________________________________","answer":"答案：（1）\"痴\"在这里不是傻的意思，而是指对某件事极度痴迷、执着，是对西湖雪景的痴迷，是一种高雅的情趣。\n（2）作者的\"痴\"表现在：①痴行：\"独往湖心亭看雪\"，选择别人都不会去的\"更定\"时分，独自去看雪，行为与众不同；②痴景：痴迷于雪后西湖的美景，那种天人合一的山水之乐；③痴情：痴迷于世俗之外的雅情雅趣，有故国之思，有孤高自赏的情怀。\n（3）作用：①借舟子之口，用一个\"痴\"字，对作者的形象作了最准确的概括，点明了文章主旨；②似贬实褒，表面是说作者傻，实际是赞美作者的高雅情趣；③与前文的\"独\"字相呼应，突出了作者独特的个性；④\"更有痴似相公者\"，说明作者并不孤单，还有知音，丰富了文章内涵；⑤以俗人之见反衬雅士之趣，增加了文章的趣味性。\n解析：本题考查对文章主旨句的理解。\"痴\"是全文的文眼，理解了\"痴\"字，就理解了全文。"},{"id":"g3_chinese_013_ex06","knowledge_id":"g3_chinese_013","question":"文言文阅读：阅读下面两个文段，回答问题。\n\n【甲】湖心亭看雪（节选）\n到亭上，有两人铺毡对坐，一童子烧酒炉正沸。见余大喜曰：\"湖中焉得更有此人！\"拉余同饮。余强饮三大白而别。问其姓氏，是金陵人，客此。及下船，舟子喃喃曰：\"莫说相公痴，更有痴似相公者。\"\n\n（1）\"见余大喜曰：'湖中焉得更有此人！'\"表现了人物怎样的心情？\"此人\"指的是怎样的人？","answer":"答案：心情：表现了金陵客人在湖心亭意外遇到知音的惊喜和兴奋之情。在这样冷的天气、这样晚的时间，竟有人和自己一样来湖心亭看雪，这完全出乎他们的意料，所以\"大喜\"。\n\"此人\"指的是：①指与作者一样痴迷于西湖雪景、有高雅情趣的人；②指不随流俗、遗世独立的人；③指有着共同审美情趣的知音；④从更深层次说，指的是有着故国之思、亡国之痛的明朝遗民（因为作者和客人都是明朝人，写此文时明朝已亡）。\n解析：这句话看似简单，实则内涵丰富。表面上是意外遇到同好的惊喜，深层则是两个亡国遗民在雪景中相遇的心灵共鸣。\"湖中焉得更有此人\"既是对方的惊喜，也是作者的心声，两人互为知音。这也是本文的精彩之处，通过偶遇知音的情节，既丰富了文章内容，又深化了主题。"},{"id":"g3_chinese_013_ex07","knowledge_id":"g3_chinese_013","question":"选择题：下面对文章的分析鉴赏，不正确的一项是（  ）\nA. 文章篇幅短小，但内涵丰富，既有对西湖雪景的精彩描绘，又有对故国的怀念之情，还有对人生的感慨。\nB. 文章将叙事、写景、抒情融为一体，叙事简洁，写景生动，情在景中，情景交融。\nC. 文章结尾借舟子的话收束全文，画龙点睛，意味深长，既赞美了作者的\"痴\"，也委婉地表达了对世俗之人的嘲讽。\nD. 全文用白描手法，语言华丽典雅，辞藻丰富，处处显示出作者深厚的文学功底。","answer":"答案：D。解析：A、B、C三项对文章的分析鉴赏都是正确的。D项错误，白描手法是对的，但语言不是华丽典雅、辞藻丰富，而是清新自然、简洁质朴，用极简的笔墨勾勒出极美的意境，这正是白描手法的特点，也是本文语言的特色。本文语言最大的特点就是简练、朴素、自然，没有华丽的辞藻，却能描绘出最美的画面，正所谓\"一切景语皆情语\"。解析：本题考查对文章写作特色和语言风格的把握。"},{"id":"g3_chinese_013_ex08","knowledge_id":"g3_chinese_013","question":"填空题：比较《湖心亭看雪》和《江雪》（千山鸟飞绝，万径人踪灭。孤舟蓑笠翁，独钓寒江雪），说说两篇作品在内容和情感上的异同。\n\n（1）相同点：________\n（2）不同点：________","answer":"答案：（1）相同点：①都描写了雪景，都写出了雪后景象的空旷寂寥、万籁俱寂；②都有一个\"独\"字，都写了一个孤独的形象（独往看雪的作者/独钓的渔翁）；③都表达了作者孤高自赏、不随流俗的情怀；④都运用了烘托、对比的手法，用广阔的背景衬托人物的渺小。\n（2）不同点：①体裁不同，《湖心亭看雪》是散文，《江雪》是诗歌；②内容上，《湖心亭看雪》还有与人相遇、把酒言欢的情节，《江雪》则是纯写景，只有渔翁一个人；③情感上，《湖心亭看雪》的情感更复杂，既有孤高自赏，又有故国之思，还有遇到知音的惊喜，情感是淡淡的愁中带着些许暖意；《江雪》的情感更孤冷、更峭拔，是一种不与世俗同流合污的高洁品格的象征，情感更浓烈、更决绝；④意境上，《湖心亭看雪》的意境更清新淡雅、空灵悠远，《江雪》的意境更冷峻苍凉、雄浑壮阔。\n解析：本题是比较阅读题，考查学生的比较分析能力。同是写雪，两位作者的心境不同，作品的风格和内涵也不同。"},{"id":"g3_chinese_013_ex09","knowledge_id":"g3_chinese_013","question":"文言文阅读：阅读下面的文段，回答问题。\n\n【甲】湖心亭看雪\n崇祯五年十二月，余住西湖。大雪三日，湖中人鸟声俱绝。是日更定矣，余拏一小舟，拥毳衣炉火，独往湖心亭看雪。雾凇沆砀，天与云与山与水，上下一白。湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。\n\n到亭上，有两人铺毡对坐，一童子烧酒炉正沸。见余大喜曰：\"湖中焉得更有此人！\"拉余同饮。余强饮三大白而别。问其姓氏，是金陵人，客此。及下船，舟子喃喃曰：\"莫说相公痴，更有痴似相公者。\"\n\n（1）文章开头说\"独往湖心亭看雪\"，后来又写了舟子、金陵人等，这样写是否矛盾？为什么？","answer":"答案：不矛盾。原因如下：\n①\"独往\"强调的是作者独特的审美情趣和精神追求，他是带着对西湖雪景的痴迷独自去的，舟子虽然也在船上，但他只是随从，不懂作者的情趣，在精神层面作者是\"独\"的；\n②后来写遇到金陵人，是情节的发展和主题的深化。金陵人和作者一样，也是\"痴\"人，是知音，这是意外的惊喜，说明作者并不孤单，还有和他一样高雅的人；\n③作者写舟子，是为了结尾借舟子之口点出\"痴\"字，从俗人的角度来反衬作者的雅趣，起到画龙点睛的作用；\n④从结构上看，\"独\"是线索，贯穿全文，开头的\"独\"是行为之独，中间的遇知音是精神之遇，结尾的\"痴\"是对\"独\"的升华，层层递进，结构严谨。\n总之，这样写不仅不矛盾，反而使文章内容更丰富，主题更深刻，结构更精巧。\n解析：本题考查对文章构思的理解。看似矛盾的地方，往往是作者的匠心所在，要从表现主题的角度来思考。"},{"id":"g3_chinese_013_ex10","knowledge_id":"g3_chinese_013","question":"简答题：张岱的《湖心亭看雪》只有一百多字，却成为千古名篇，请结合文章内容，说说它的艺术魅力体现在哪些方面。\n\n答：________________________________","answer":"答案：《湖心亭看雪》虽然篇幅短小，但艺术魅力无穷，主要体现在以下几个方面：\n①意境之美：文章描绘的雪后西湖景色，雾凇沆砀，天地一白，长堤一痕，湖心亭一点，小舟一芥，人两三粒，构成了一幅空灵淡雅、意境悠远的水墨画，给人以美的享受和无限的想象空间。\n②手法之妙：运用白描手法，不用华丽的辞藻，只用简洁的笔触勾勒景物，却形神兼备；运用对比手法，天地的广阔与人的渺小形成对比，突出了宇宙的浩大和人生的微茫；运用侧面烘托手法，以\"人鸟声俱绝\"烘托雪后的寂静。\n③情感之真：文章情感真挚自然，既有对西湖雪景的痴迷热爱，又有故国之思、沧桑之感，还有遇到知音的惊喜，多种情感融合在一起，淡而浓，浅而深，耐人寻味。\n④结构之巧：文章篇幅虽短，但有头有尾，有景有情，有叙有议，从看雪到遇人，再到舟子的评论，层层递进，结尾点睛，结构精巧完整。\n⑤语言之精：语言极为简练，字字珠玑，没有一句多余的话，却含义丰富，余味悠长。特别是量词的运用，\"一痕\"\"一点\"\"一芥\"\"两三粒\"，准确传神，堪称神来之笔。\n总之，文章以极简的笔墨，写出了极美的意境、极真的情感、极深的内涵，是小品文中的极品，所以能成为千古名篇。\n解析：本题是开放性题目，考查对文章艺术特色的综合鉴赏能力，言之有理即可。"},{"id":"g3_chinese_014_ex01","knowledge_id":"g3_chinese_014","question":"选择题：下列关于小说人物形象分析的说法，不正确的一项是（  ）\nA. 分析人物形象可以从正面描写和侧面描写入手，正面描写包括肖像、语言、动作、心理、神态描写等。\nB. 小说中的人物都是作者虚构的，所以分析人物形象时不需要结合时代背景。\nC. 分析人物形象要抓住人物的性格特征，注意人物性格的复杂性和发展变化。\nD. 人物形象是小说的核心，小说的主题往往是通过人物形象来表现的。","answer":"答案：B。解析：A、C、D三项的说法都是正确的。B项错误，小说中的人物虽然是作者虚构的，但虚构不等于凭空捏造，人物总是生活在一定的社会环境中，其性格的形成和命运的发展都与时代背景密切相关。分析人物形象必须结合人物所处的时代背景、社会环境，这样才能准确把握人物形象的典型意义。比如《故乡》中的闰土，只有结合旧中国农村破产的社会背景，才能理解他性格变化的深层原因。解析：本题考查小说人物形象分析的基本方法。"},{"id":"g3_chinese_014_ex02","knowledge_id":"g3_chinese_014","question":"填空题：小说的三要素是______、______、______。其中，______是小说的核心，______是人物活动的舞台，______是小说的骨架。","answer":"答案：人物、情节、环境；人物、环境、情节。解析：小说是以刻画人物形象为中心，通过完整的故事情节和具体的环境描写来反映社会生活的一种文学体裁。人物、情节、环境是小说的三要素。人物是小说的核心，作者通过塑造人物形象来反映社会生活、表达主题思想；环境是人物活动的舞台，包括自然环境和社会环境，环境描写对塑造人物、表现主题有重要作用；情节是小说的骨架，是人物性格发展的历史，一般包括开端、发展、高潮、结局四个部分，有的还有序幕和尾声。三要素相互联系、相互作用，共同构成了完整的小说世界。"},{"id":"g3_chinese_014_ex03","knowledge_id":"g3_chinese_014","question":"阅读理解：阅读下面的文字，完成后面的题目。\n\n他站住了，脸上现出欢喜和凄凉的神情；动着嘴唇，却没有作声。他的态度终于恭敬起来了，分明的叫道：\n\"老爷！……\"\n我似乎打了一个寒噤；我就知道，我们之间已经隔了一层可悲的厚障壁了。我也说不出话。\n\n（1）这段文字主要运用了什么描写方法？有什么作用？\n（2）闰土脸上为什么会现出\"欢喜和凄凉\"的神情？","answer":"答案：（1）主要运用了神态描写、语言描写和心理描写。作用：①神态描写（\"欢喜和凄凉的神情\"、\"态度终于恭敬起来\"），生动地表现了闰土见到\"我\"时既高兴又凄凉、既亲切又生疏的复杂心情；②语言描写（\"老爷！……\"），闰土的一声\"老爷\"，道尽了他对\"我\"的恭敬和两人之间的隔膜，让人感到悲哀；③心理描写（\"我似乎打了一个寒噤\"、\"说不出话\"），通过\"我\"的心理感受，从侧面表现了闰土变化之大给\"我\"带来的震惊和悲哀，突出了两人之间的厚障壁。\n（2）\"欢喜\"是因为见到了儿时的好朋友，唤起了对童年美好时光的回忆，所以感到高兴；\"凄凉\"是因为二十多年的贫困生活使他感到痛苦、难堪，知道自己和\"我\"已经不是同一个阶级的人了，身份地位的差距让他感到凄凉和悲哀。两种看似矛盾的神情统一在闰土身上，真实地反映了他复杂的内心世界。\n解析：本题考查人物描写方法及其作用的分析。分析人物描写要结合语境，联系上下文，理解人物当时的心情和性格特点。"},{"id":"g3_chinese_014_ex04","knowledge_id":"g3_chinese_014","question":"选择题：下列对小说情节的理解和分析，不正确的一项是（  ）\nA. 小说的情节一般包括开端、发展、高潮、结局四个部分，有的还有序幕和尾声。\nB. 情节的安排要为塑造人物形象和表现主题服务，情节越曲折越好。\nC. 情节的发展要符合人物性格发展的逻辑，不能脱离人物性格随意编造。\nD. 小说的高潮部分往往是矛盾冲突最激烈、人物性格展现最充分的部分。","answer":"答案：B。解析：A、C、D三项的说法都是正确的。B项错误，情节要为塑造人物和表现主题服务，这是对的，但不能说情节越曲折越好。情节的曲折程度要与内容相适应，不能为了曲折而曲折，故意设置离奇的情节。好的情节应该是既在意料之外，又在情理之中，符合人物性格发展的逻辑，能够很好地表现主题。情节只是手段，塑造人物、表现主题才是目的。解析：本题考查对小说情节的理解。"},{"id":"g3_chinese_014_ex05","knowledge_id":"g3_chinese_014","question":"填空题：人物描写的方法有很多种，请写出五种正面描写人物的方法：______、______、______、______、______。另外，还可以通过______描写来烘托人物形象，这种描写叫侧面描写。","answer":"答案：肖像描写（外貌描写）、语言描写、动作描写、心理描写、神态描写；环境（或：他人的反应、他人的评价等）。解析：正面描写也叫直接描写，就是直接对人物进行刻画。五种正面描写分别是：①肖像描写（外貌描写）：对人物的容貌、衣着、姿态等进行描写；②语言描写：通过人物的对话、独白来表现人物性格；③动作描写：通过人物的动作、行为来表现人物性格；④心理描写：直接描写人物的内心活动、思想感情；⑤神态描写：描写人物的面部表情、神情变化。侧面描写也叫间接描写，就是不直接描写人物，而是通过周围的环境、其他人物的反应等来烘托、衬托人物形象。正面描写和侧面描写相结合，可以使人物形象更加丰满、立体。解析：本题考查人物描写方法的基础知识。"},{"id":"g3_chinese_014_ex06","knowledge_id":"g3_chinese_014","question":"阅读理解：阅读下面的文字，完成后面的题目。\n\n我这时很兴奋，但不知道怎么说才好，只是说：\n\"阿！闰土哥，——你来了？……\"\n我接着便有许多话，想要连珠一般涌出：角鸡，跳鱼儿，贝壳，猹，……但又总觉得被什么挡着似的，单在脑里面回旋，吐不出口外去。\n\n他站住了，脸上现出欢喜和凄凉的神情；动着嘴唇，却没有作声。他的态度终于恭敬起来了，分明的叫道：\n\"老爷！……\"\n\n（1）请概括这几段文字的主要内容。\n（2）这段文字在情节发展中处于什么位置？有什么作用？","answer":"答案：（1）主要内容：写\"我\"回到故乡，见到了阔别二十多年的儿时伙伴闰土，\"我\"很兴奋，有很多话想说，但闰土却恭敬地叫\"我\"\"老爷\"，两人之间已经有了厚障壁。\n（2）这段文字在情节发展中处于高潮部分（或：是情节发展的关键转折点）。作用：①从人物塑造来看，闰土的一声\"老爷\"，充分展现了他性格的巨大变化，把一个深受封建等级观念毒害的农民形象刻画得入木三分；②从主题表达来看，这声\"老爷\"道破了人与人之间的隔膜，有力地揭示了封建等级制度对人性的摧残，深化了小说的主题；③从情节发展来看，这是\"我\"与闰土重逢最关键的一刻，是全文情感冲击力最强的地方，给读者留下了深刻的印象；④从结构来看，与前文\"我\"对闰土的美好回忆形成对比，突出了变化之大，增加了文章的悲剧色彩。\n解析：本题考查对小说情节作用的分析。分析情节的作用，要从人物、主题、结构、读者感受等多个角度入手。"},{"id":"g3_chinese_014_ex07","knowledge_id":"g3_chinese_014","question":"选择题：下列关于《我的叔叔于勒》中菲利普夫妇的形象分析，不正确的一项是（  ）\nA. 菲利普夫妇是典型的小市民形象，他们虚荣、势利、冷酷、自私，金钱至上。\nB. 菲利普夫妇对于勒的态度前后发生了巨大变化，变化的根本原因是于勒是否有钱。\nC. 作者对菲利普夫妇持完全否定的态度，认为他们一无是处，是纯粹的反面人物。\nD. 菲利普夫妇的形象具有典型意义，反映了资本主义社会人与人之间赤裸裸的金钱关系。","answer":"答案：C。解析：A、B、D三项对菲利普夫妇形象的分析都是正确的。C项错误，作者对菲利普夫妇的态度并不是完全否定，而是讽刺中带着同情，批判中带着无奈。菲利普夫妇固然有虚荣、势利、冷酷的一面，令人厌恶；但他们也是小人物，生活窘迫，为生计发愁，他们的势利也是社会环境造成的，有其可怜的一面。作者对他们的态度是复杂的，既有讽刺批判，也有同情悲悯，不能简单地说他们是纯粹的反面人物。这正是莫泊桑小说的深刻之处，他笔下的人物往往是复杂的、立体的，不是脸谱化的。解析：本题考查对小说人物形象的分析能力，要注意人物性格的复杂性。"},{"id":"g3_chinese_014_ex08","knowledge_id":"g3_chinese_014","question":"填空题：分析人物形象可以从多个角度入手，请根据所学知识，填写下面的人物形象分析角度。\n\n（1）从______入手，看人物做了什么、说了什么、想什么、长什么样；\n（2）从______入手，看人物在什么背景下活动，人物性格形成的社会原因；\n（3）从______入手，看人物在情节发展中的表现，看人物性格的发展变化；\n（4）从______入手，看作者对人物的态度和评价；\n（5）从______入手，看人物与人物之间的关系，通过对比衬托来把握人物性格。","answer":"答案：（1）人物描写方法；（2）环境描写；（3）故事情节；（4）作者的情感倾向（或：主题思想）；（5）人物之间的关系（或：对比衬托）。解析：分析人物形象是小说阅读的核心任务，要掌握正确的分析方法。①从人物描写方法入手：肖像、语言、动作、心理、神态描写，都是分析人物性格的重要依据；②从环境描写入手：人创造环境，环境也创造人，人物性格的形成离不开特定的社会环境；③从故事情节入手：情节是人物性格的历史，人物性格在情节发展中逐步展现；④从作者的情感倾向入手：作者对人物的褒贬态度，往往体现在字里行间；⑤从人物之间的关系入手：有比较才有鉴别，通过人物之间的对比衬托，可以更清楚地看出人物的性格特点。这五个角度结合起来，就能比较全面准确地把握人物形象。"},{"id":"g3_chinese_014_ex09","knowledge_id":"g3_chinese_014","question":"阅读理解：阅读下面的文字，完成后面的题目。\n\n我父亲突然好像不安起来，他向旁边走了几步，瞪着眼看了看挤在卖牡蛎的身边的女儿女婿，就赶紧向我们走来。他的脸色十分苍白，两只眼也跟寻常不一样。他低声对我母亲说：\n\"真奇怪！这个卖牡蛎的怎么这样像于勒？\"\n\n母亲有点莫名其妙，就问：\"哪个于勒？\"\n\n父亲说：\"就……就是我的弟弟呀。……如果我不知道他现在是在美洲，有很好的地位，我真会以为就是他哩。\"\n\n（1）这段文字主要运用了哪些描写方法来刻画父亲的形象？表现了父亲怎样的性格特点？\n（2）父亲为什么会\"突然好像不安起来\"？","answer":"答案：（1）主要运用了动作描写、神态描写和语言描写。\n动作描写：\"向旁边走了几步\"、\"瞪着眼看了看\"、\"赶紧向我们走来\"，这一连串的动作，生动地表现了父亲发现卖牡蛎的像于勒时的慌张和不安。\n神态描写：\"脸色十分苍白，两只眼也跟寻常不一样\"，通过脸色和眼神的变化，细腻地表现了父亲内心的惊恐和不安。\n语言描写：\"真奇怪！这个卖牡蛎的怎么这样像于勒？\"、\"就……就是我的弟弟呀。……如果我不知道他现在是在美洲，有很好的地位，我真会以为就是他哩\"，说话吞吞吐吐，语无伦次，表现了他内心的慌乱和不愿相信现实的心理。\n性格特点：表现了父亲（菲利普）是一个势利、虚荣、恐慌、没有主见的小市民形象，他朝思暮想发财的弟弟于勒，可真的见到穷困潦倒的于勒时，却惊慌失措，唯恐避之不及。\n（2）\"不安\"的原因：①他发现卖牡蛎的人像于勒，担心自己发财的美梦破灭，内心充满了恐惧；②他害怕穷困的于勒认出自己，让自己在女儿女婿面前丢脸，有失体面；③他不知道该怎么办，内心充满了慌乱和不安。\n解析：本题考查对人物描写方法和人物形象的分析，要结合具体语句，深入分析人物的内心世界。"},{"id":"g3_chinese_014_ex10","knowledge_id":"g3_chinese_014","question":"简答题：有人说，小说的情节就是故事，你同意这种说法吗？请结合具体作品，谈谈你对小说情节的理解。\n\n答：________________________________","answer":"答案：我不同意这种说法。情节和故事有联系，但不完全是一回事。\n①故事是按照时间顺序排列的事件，而情节是按照因果逻辑组织起来的事件。故事强调的是\"后来发生了什么\"，情节强调的是\"为什么会发生\"。比如《我的叔叔于勒》，如果按故事讲，就是我们全家去旅行，在船上遇到了穷困潦倒的于勒叔叔，然后躲开了。但作为情节，它有前因后果：因为于勒年轻时挥霍家产，被家人打发到美洲；后来于勒发财了，写信回家说要赔偿哥哥的损失，全家就把他当救星，日思夜盼；结果在船上巧遇穷困的于勒，美梦破灭，全家像躲瘟神一样躲开了。情节的每一步发展都有因果关系，引人入胜。\n②情节的核心是矛盾冲突。故事可以没有冲突，但情节必须有冲突。比如《故乡》，如果只是讲\"我\"回故乡搬家的故事，那就很平淡；但作为情节，它有深刻的矛盾：记忆中活泼勇敢的闰土变成了麻木迟钝的\"木偶人\"，儿时的好朋友变成了\"老爷\"和\"下人\"，这种变化就是矛盾冲突，它揭示了社会的悲剧。\n③情节是为塑造人物、表现主题服务的。故事只要讲清楚事情的来龙去脉就行，而情节要通过事件的发展来展现人物性格、揭示主题。《我的叔叔于勒》中，菲利普夫妇对于勒态度的前后变化，构成了小说的主要情节，正是通过这些情节，塑造了菲利普夫妇势利冷酷的形象，揭示了资本主义社会人与人之间的金钱关系。\n总之，情节比故事更丰富、更深刻，它不仅有事件的发展，还有因果关系、矛盾冲突、人物性格和主题思想，是小说的重要组成部分。\n解析：本题是开放性题目，考查对小说情节的深入理解，言之有理即可。"},{"id":"g3_chinese_015_ex01","knowledge_id":"g3_chinese_015","question":"选择题：下列关于小说环境描写的说法，不正确的一项是（  ）\nA. 小说的环境描写包括自然环境描写和社会环境描写。\nB. 自然环境描写又叫景物描写，主要作用是渲染气氛、烘托人物心情。\nC. 社会环境描写主要交代人物活动的时代背景、社会习俗、思想观念等，对表现主题有重要作用。\nD. 环境描写在小说中可有可无，没有环境描写就不是好小说。","answer":"答案：D。解析：A、B、C三项的说法都是正确的。D项错误，环境描写是小说的三要素之一，在小说中有着重要的作用，不是可有可无的。但也不能说没有环境描写就不是好小说，有些小说环境描写比较少，侧重刻画人物和叙述情节，也可能是优秀的作品。环境描写的多少要根据内容和主题的需要来定，不能一概而论。一般来说，好的环境描写能够烘托人物、渲染气氛、推动情节、深化主题，是小说不可或缺的组成部分。解析：本题考查对环境描写作用的理解。"},{"id":"g3_chinese_015_ex02","knowledge_id":"g3_chinese_015","question":"填空题：小说的环境描写包括______和______。其中，______指的是人物活动的具体场景，如时间、地点、气候、景色等；______指的是人物活动的历史背景、社会情态、人际关系等。","answer":"答案：自然环境描写、社会环境描写；自然环境、社会环境。解析：自然环境描写包括人物活动的时间、地点、季节、气候以及景物等，它在小说中的作用主要有：①交代故事发生的时间、地点、背景；②渲染气氛，烘托人物心情；③衬托人物性格，表现人物精神面貌；④推动情节发展，为下文作铺垫；⑤暗示社会环境，深化作品主题。社会环境描写是指对人物活动和事件发生的社会背景、时代氛围、社会习俗、人际关系等的描写，它在小说中的作用主要有：①交代人物活动及其成长的时代背景，揭示各种复杂的社会关系；②交代人物身份，表现人物性格，或影响甚至决定人物性格；③揭示社会本质特征，揭示小说主题。环境描写的方法很多，作用也很多，学习时要注意归纳总结。"},{"id":"g3_chinese_015_ex03","knowledge_id":"g3_chinese_015","question":"阅读理解：阅读下面的文字，完成后面的题目。\n\n时候既然是深冬；渐近故乡时，天气又阴晦了，冷风吹进船舱中，呜呜的响，从篷隙向外一望，苍黄的天底下，远近横着几个萧索的荒村，没有一些活气。我的心禁不住悲凉起来了。\n\n阿！这不是我二十年来时时记得的故乡？\n\n（1）这段文字属于什么描写？有什么作用？","answer":"答案：这段文字属于自然环境描写（景物描写）。作用：①交代了故事发生的时间——深冬，地点——故乡，渲染了一种阴冷、萧索、沉寂的氛围；②烘托了人物悲凉的心情，看到故乡的萧条景象，\"我\"的心禁不住悲凉起来了，景与情相互映衬；③为全文奠定了悲凉的感情基调，暗示了故乡经济的凋敝和人民生活的困苦；④为下文写闰土、杨二嫂的变化作铺垫，环境的变化是人物变化的原因之一；⑤与记忆中的故乡形成对比，突出了故乡每况愈下的变化，深化了小说的主题。解析：本题考查环境描写的作用。分析环境描写的作用，要从渲染气氛、烘托人物、推动情节、深化主题等多个角度入手，结合具体语境来分析，不能生搬硬套。本段景物描写是《故乡》开头的精彩之笔，寥寥几笔就勾勒出一幅萧条荒凉的故乡冬景图，为全文奠定了悲凉的基调。"},{"id":"g3_chinese_015_ex04","knowledge_id":"g3_chinese_015","question":"选择题：下列对小说主题的理解，不正确的一项是（  ）\nA. 小说的主题就是小说通过对现实生活的描绘和艺术形象的塑造所表现出来的中心思想。\nB. 小说的主题是小说的灵魂，是作者写作目的之所在，也是作品价值意义之所在。\nC. 小说的主题是单一的、明确的，一部小说只能有一个主题。\nD. 分析小说主题可以从人物、情节、环境等多个角度入手。","answer":"答案：C。解析：A、B、D三项的说法都是正确的。C项错误，小说的主题不一定是单一的，有些小说的主题是丰富的、多元的，可以从不同角度去理解。比如《故乡》，可以理解为表现了辛亥革命后农村经济凋敝、农民生活贫困的社会现实，可以理解为表现了人与人之间的隔膜，也可以理解为表达了作者对新生活的向往和追求。所谓\"一千个读者有一千个哈姆雷特\"，说的就是主题理解的多样性。当然，主题的多样性不等于没有主题，主题的理解也要建立在文本的基础上，不能脱离文本随意发挥。解析：本题考查对小说主题的理解。"},{"id":"g3_chinese_015_ex05","knowledge_id":"g3_chinese_015","question":"填空题：分析小说主题的方法有很多，请写出至少五种：______、______、______、______、______。","answer":"答案：从人物形象入手、从情节发展入手、从环境描写入手、从标题含义入手、从关键语句入手（或：从作者的思想倾向入手、从时代背景入手、从对比手法入手、从主要事件入手、从开头结尾入手等，任选五种即可）。解析：分析小说主题的方法主要有：①从人物形象入手：人物形象，特别是主要人物的性格命运，往往反映了社会生活的某些本质方面，体现了小说的主题；②从情节发展入手：情节是小说的骨架，小说主题往往在情节的发展中逐步显现；③从环境描写入手：环境，特别是社会环境，往往直接或间接地揭示了小说的主题；④从标题含义入手：标题是小说的眼睛，好的标题往往暗示了小说的主题；⑤从关键语句入手：文中的议论句、抒情句、主旨句等，往往直接或间接点明了主题；⑥从时代背景入手：联系作品产生的时代背景，有助于准确把握小说的主题。掌握这些方法，并综合运用，就能比较准确地把握小说的主题。"},{"id":"g3_chinese_015_ex06","knowledge_id":"g3_chinese_015","question":"阅读理解：阅读下面的文字，完成后面的题目。\n\n我在朦胧中，眼前展开一片海边碧绿的沙地来，上面深蓝的天空中挂着一轮金黄的圆月。我想：希望是本无所谓有，无所谓无的。这正如地上的路；其实地上本没有路，走的人多了，也便成了路。\n\n（1）这段文字中既有景物描写，又有作者的议论。请分别分析景物描写的特点和议论句的含义。\n（2）这段文字在全文中起什么作用？","answer":"答案：（1）景物描写特点：这段景物描写色彩明丽、充满生机，碧绿的沙地、深蓝的天空、金黄的圆月，构成了一幅美丽神奇的画面。这是\"我\"想象中的画面，象征着\"我\"对美好未来的憧憬和希望，与开头萧索荒凉的故乡景象形成鲜明对比。\n议论句含义：这句话的意思是：希望的有无取决于人们的实践和追求，如果只是空有希望而不去奋斗、不去追求，那么希望也就无所谓有；如果为了希望去努力奋斗、勇敢实践，那么希望就会变成现实。作者把希望比作地上的路，意思是路是人走出来的，希望也是人通过奋斗实现的，只要大家都去努力、去探索，就一定能迎来新的生活。这句话富有哲理，给人以鼓舞和力量。\n（2）作用：①从结构上看，这是小说的结尾，总结全文，点明主旨，与开头的景物描写遥相呼应；②从内容上看，它不仅表达了\"我\"对故乡现状的失望，更表达了对未来新生活的向往和追求，使小说的主题得到了升华；③从表达效果上看，富有哲理的议论给读者留下了深刻的印象和广阔的思考空间，增强了小说的思想深度。\n解析：本题考查对环境描写和主题思想的综合理解，是一道难度较大的题目，需要结合全文来分析。"},{"id":"g3_chinese_015_ex07","knowledge_id":"g3_chinese_015","question":"选择题：下列对《我的叔叔于勒》主题的理解，不恰当的一项是（  ）\nA. 小说通过菲利普夫妇对于勒态度的前后变化，揭露了资本主义社会人与人之间赤裸裸的金钱关系。\nB. 小说反映了小人物的辛酸与无奈，对菲利普夫妇既有讽刺批判，也有同情悲悯。\nC. 小说表达了对金钱社会的批判，呼唤人与人之间真诚的亲情和温暖的人际关系。\nD. 小说主要是为了批判于勒的好吃懒做和穷困潦倒，告诉我们不要做像于勒那样的人。","answer":"答案：D。解析：A、B、C三项对小说主题的理解都是有道理的，从不同角度解读了小说的主题。D项不恰当，小说的主要人物不是于勒，而是菲利普夫妇，小说的主要批判对象也不是于勒，而是以菲利普夫妇为代表的势利、冷酷的小市民，是金钱至上的社会风气。于勒虽然年轻时荒唐过，但他也努力过、奋斗过，他的悲剧主要是社会造成的，作者对他更多的是同情，而不是批判。小说的主题应该从更宏观的角度去理解，不能把矛头指向于勒个人。解析：本题考查对小说主题的理解，要注意从整体上把握，不能片面化、简单化。"},{"id":"g3_chinese_015_ex08","knowledge_id":"g3_chinese_015","question":"填空题：《故乡》和《我的叔叔于勒》都是经典小说，两篇小说在环境描写上各有特色，请根据课文内容填写下面的表格。\n\n（1）《故乡》开头的景物描写是：________，作用是：________。\n（2）《故乡》结尾的景物描写是：________，作用是：________。\n（3）《我的叔叔于勒》中\"哲尔赛岛的旅行\"在文中的作用是：________。","answer":"答案：（1）深冬时节，阴晦的天气，苍黄的天底下，远近横着几个萧索的荒村；作用是渲染了萧索、悲凉的气氛，烘托了\"我\"悲凉的心情，为全文奠定了感情基调，暗示了故乡经济的凋敝。\n（2）海边碧绿的沙地，深蓝的天空，金黄的圆月；作用是与开头的景物形成对比，象征着\"我\"对美好未来的憧憬和希望，升华了小说主题。\n（3）作用：①推动情节发展，去哲尔赛岛旅行是故事的开端，是巧遇于勒的前提；②烘托人物心情，旅行前全家的兴奋、期盼，反衬了后来遇到于勒时的沮丧、恐慌；③作为故事发生的背景和舞台，巧遇于勒的核心情节就是在去哲尔赛岛的船上发生的；④哲尔赛岛是\"我们\"全家向往的地方，它象征着对美好生活的向往，而梦想的破灭更增强了小说的讽刺意味和悲剧色彩。\n解析：本题考查对两篇小说环境描写作用的比较分析，要结合具体内容来回答。"},{"id":"g3_chinese_015_ex09","knowledge_id":"g3_chinese_015","question":"阅读理解：阅读下面的文字，完成后面的题目。\n\n我们上了轮船，离开栈桥，在一片平静的好似绿色大理石桌面的海上驶向远处。\n\n……\n\n在我们面前，天边远处仿佛有一片紫色的阴影从海里钻出来。那就是哲尔赛岛了。\n\n我们回来的时候改乘圣玛洛船，以免再遇见他。\n\n（1）文中两处画线的景物描写分别有什么作用？\n（2）\"我们回来的时候改乘圣玛洛船，以免再遇见他\"这句话在文中有什么作用？","answer":"答案：（1）第一处景物描写：\"平静的好似绿色大理石桌面的海\"，写出了海面的平静、美丽，烘托了人物轻松愉快的心情。这时候全家正满怀希望地去旅行，梦想着于勒叔叔发了财会回来，所以看到的景色也是美丽的，景与情和谐统一。\n第二处景物描写：\"天边远处仿佛有一片紫色的阴影从海里钻出来\"，写出了哲尔赛岛给人的感觉，不是美丽光明的，而是\"紫色的阴影\"，烘托了人物失望、沮丧、沉重的心情。这时候已经证实卖牡蛎的就是于勒，发财的美梦破灭了，所以看到的景色也变得阴暗了。\n两处景物描写前后对比，从轻松愉快到沉重压抑，有力地烘托了人物心情的变化，突出了小说的主题。\n（2）作用：①从人物塑造来看，这句话表现了菲利普夫妇的势利、冷酷、自私，为了躲开穷困的于勒，连回来的船都要换，把他们的性格特点刻画得入木三分；②从主题表达来看，这句话有力地揭露了资本主义社会人与人之间赤裸裸的金钱关系，连亲兄弟都避之唯恐不及，深化了小说主题；③从结构来看，这是故事的结局，收尾干脆利落，给读者留下了深刻的印象和思考空间；④从表达效果来看，以行动结束全文，比直接议论更含蓄、更有力量，讽刺意味更浓。\n解析：本题考查对景物描写作用和结尾作用的分析，是一道综合性较强的题目。"},{"id":"g3_chinese_015_ex10","knowledge_id":"g3_chinese_015","question":"简答题：环境描写在小说中有什么重要作用？请以《故乡》或《我的叔叔于勒》为例，结合具体内容谈谈你的理解。\n\n答：________________________________","answer":"答案：环境描写是小说的三要素之一，在小说中有着非常重要的作用。以《故乡》为例，环境描写的作用主要体现在以下几个方面：\n①渲染气氛，奠定基调。小说开头的景物描写：\"时候既然是深冬；渐近故乡时，天气又阴晦了，冷风吹进船舱中，呜呜的响，从篷隙向外一望，苍黄的天底下，远近横着几个萧索的荒村，没有一些活气。\"寥寥几笔，就渲染出一种萧条、荒凉、冷寂的氛围，为全文奠定了悲凉的感情基调。\n②烘托人物心情。\"一切景语皆情语\"，景物描写往往是人物心情的外化。开头看到萧索的荒村，\"我的心禁不住悲凉起来了\"，景与情相互映衬，很好地烘托了人物悲凉的心情。\n③推动情节发展，为下文作铺垫。故乡的萧条景象，是闰土、杨二嫂等人变化的社会背景，环境的变化暗示了人物命运的变化，为下文写闰土的变化作了铺垫。\n④对比映衬，深化主题。小说结尾处想象中的海边沙地、圆月美景，与开头的萧索景象形成鲜明对比，一暗一明，一悲一喜，突出了作者对现实的失望和对未来的希望，深化了小说的主题。\n⑤暗示社会环境。故乡的景象不仅是自然景象，也是当时中国农村社会的缩影，它暗示了辛亥革命后中国农村经济凋敝、农民生活困苦的社会现实。\n总之，成功的环境描写，能够使人物更丰满、情节更生动、主题更深刻，是小说不可或缺的重要组成部分。\n解析：本题是开放性题目，考查对环境描写作用的综合理解，言之有理、结合具体内容即可。"},{"id":"g3_chinese_016_ex01","knowledge_id":"g3_chinese_016","question":"选择题：下列关于《故乡》的说法，不正确的一项是（  ）\nA. 《故乡》是鲁迅先生的一篇短篇小说，选自小说集《呐喊》，写于1921年。\nB. 小说以\"我\"回故乡的见闻和感受为线索，通过闰土二十多年前后的变化，反映了辛亥革命后中国农村破产、农民生活痛苦的社会现实。\nC. 小说中的\"我\"就是作者本人，所以这篇小说是一篇自传体小说。\nD. 小说运用对比手法，通过人物、环境的前后对比，突出了主题。","answer":"答案：C。解析：A、B、D三项的说法都是正确的。C项错误，小说中的\"我\"虽然有作者的影子，但不能等同于作者本人。小说是虚构的艺术，\"我\"是小说中的一个人物形象，是叙事者，不能说就是鲁迅本人。《故乡》是小说，不是自传，自传是纪实的，小说是虚构的，这是两种不同的文体。当然，小说中的\"我\"身上确实有作者的一些经历和感受，但那是经过艺术加工的，不能与真人真事划等号。解析：本题考查对小说基本常识和文体特点的理解，要注意区分小说中的\"我\"和现实中的作者。"},{"id":"g3_chinese_016_ex02","knowledge_id":"g3_chinese_016","question":"填空题：《故乡》中塑造了三个主要人物形象，他们分别是：______、______、______。其中，______是旧中国贫苦农民的典型，______是小市民阶层的典型，______是同情劳动人民、追求新生活的知识分子的代表。","answer":"答案：闰土、杨二嫂、\"我\"（或：我）；闰土、杨二嫂、\"我\"（或：我）。解析：闰土是小说的主要人物，是旧中国贫苦农民的典型代表。他年轻时活泼勇敢、聪明能干，二十多年后却变得麻木迟钝、辛苦麻木，像一个\"木偶人\"。他的变化，反映了辛亥革命后中国农村经济的凋敝和农民生活的困苦。杨二嫂是小市民阶层的典型，她年轻时被称为\"豆腐西施\"，二十多年后却变得尖酸刻薄、自私贪婪、爱占便宜。她的变化，反映了当时城镇小市民的日益贫困和精神的堕落。\"我\"是小说中的叙事者，是一个同情劳动人民、不满现实、追求新生活的知识分子形象。\"我\"的形象，代表了当时觉醒的知识分子，是连接过去和未来的桥梁。三个人物形象，各有各的典型意义，共同构成了当时中国社会的缩影。解析：本题考查对小说人物形象及其典型意义的把握。"},{"id":"g3_chinese_016_ex03","knowledge_id":"g3_chinese_016","question":"阅读理解：阅读下面的文字，完成后面的题目。\n\n这来的便是闰土。虽然我一见便知道是闰土，但又不是我这记忆上的闰土了。他身材增加了一倍；先前的紫色的圆脸，已经变作灰黄，而且加上了很深的皱纹；眼睛也像他父亲一样，周围都肿得通红，这我知道，在海边种地的人，终日吹着海风，大抵是这样的。他头上是一顶破毡帽，身上只一件极薄的棉衣，浑身瑟索着；手里提着一个纸包和一支长烟管，那手也不是我所记得的红活圆实的手，却又粗又笨而且开裂，像是松树皮了。\n\n（1）这段文字运用了什么描写方法？写出了闰土怎样的特点？","answer":"答案：这段文字运用了肖像描写（外貌描写）的方法。写出了中年闰土的以下特点：①生活贫困、艰辛。从\"灰黄\"的脸、\"很深的皱纹\"、\"破毡帽\"、\"极薄的棉衣\"、\"又粗又笨而且开裂，像是松树皮\"的手等可以看出，闰土常年劳作，生活非常困苦。②衰老、
