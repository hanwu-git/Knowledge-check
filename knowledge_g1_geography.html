    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"chapter":"第一章 地球和地图","name":"地球的形状和大小","formula":"球体，平均半径6371千米，表面积5.1亿平方千米","explanation":"【地球的形状】\n地球是一个两极稍扁、赤道略鼓的不规则球体。\n\n【人类对地球形状的认识过程】\n1. 古代：天圆地方说\n2. 近代：麦哲伦船队环球航行，证实地球是球体\n3. 现代：地球卫星照片，确证地球是球体\n\n【地球的大小】\n1. 平均半径：6371千米\n2. 最大周长（赤道周长）：约4万千米\n3. 表面积：约5.1亿平方千米","id":"g1_geography_u001","semester":"upper"},{"chapter":"第一章 地球和地图","name":"纬线和纬度","formula":"纬线指示东西方向，赤道是最长的纬线","explanation":"【纬线定义】\n在地球仪上，顺着东西方向，环绕地球仪一周的圆圈，叫做纬线。\n\n【纬线特点】\n1. 纬线指示东西方向\n2. 纬线的形状是圆圈（纬线圈）\n3. 纬线的长度不相等，赤道最长，向两极逐渐缩短\n4. 所有纬线都相互平行\n\n【纬度】\n1. 赤道的纬度为0°，是纬度的起始线\n2. 从赤道向北和向南，各分90°，称为北纬和南纬，分别用\"N\"和\"S\"表示\n3. 北极和南极各为90°\n4. 高中低纬度划分：0°-30°为低纬度，30°-60°为中纬度，60°-90°为高纬度","id":"g1_geography_u002","semester":"upper"},{"chapter":"第一章 地球和地图","name":"经线和经度","formula":"经线指示南北方向，本初子午线为0°经线","explanation":"【经线定义】\n在地球仪上，连接南北两极并垂直于纬线的线，叫做经线，也叫子午线。\n\n【经线特点】\n1. 经线指示南北方向\n2. 经线的形状是半圆\n3. 所有经线的长度都相等\n4. 所有经线都相交于南北两极\n\n【经度】\n1. 本初子午线（0°经线）是经度的起始线\n2. 从本初子午线向东和向西，各分180°，称为东经和西经，分别用\"E\"和\"W\"表示\n3. 东西半球的分界线：20°W和160°E组成的经线圈","id":"g1_geography_u003","semester":"upper"},{"chapter":"第一章 地球和地图","name":"经纬网","formula":"确定地球表面任意一点的位置","explanation":"【定义】\n由经线和纬线相互交织所构成的网络，叫做经纬网。\n\n【作用】\n利用经纬网，我们可以确定地球表面任意一点的位置。\n\n【应用】\n1. 航海：确定船只在海洋中的位置\n2. 航空：确定飞机的飞行位置\n3. 军事：军事定位和导航\n4. 气象：天气预报和气象观测\n5. 日常生活：GPS定位导航\n\n【表示方法】\n例如：北京（40°N，116°E）表示北京位于北纬40度，东经116度。","id":"g1_geography_u004","semester":"upper"},{"chapter":"第一章 地球和地图","name":"地球的自转","formula":"自西向东，周期约24小时，产生昼夜交替","explanation":"【定义】\n地球绕着地轴不停地旋转，叫做地球的自转。\n\n【特点】\n1. 方向：自西向东\n2. 周期：约24小时（一天）\n3. 中心：地轴（假想轴）\n\n【产生的地理现象】\n1. 昼夜交替：地球是一个不透明的球体，太阳只能照亮地球的一半，被照亮的是白天，未被照亮的是黑夜。地球不停地自转，昼夜也就不断地交替。\n2. 时间差异：地球上不同经度的地方，出现时间的差异（东边早，西边晚）。\n3. 日月星辰的东升西落。","id":"g1_geography_u005","semester":"upper"},{"chapter":"第一章 地球和地图","name":"地球的公转","formula":"自西向东，周期一年，产生四季变化","explanation":"【定义】\n地球在自转的同时，还围绕太阳不停地公转。\n\n【特点】\n1. 方向：自西向东\n2. 周期：一年（约365天）\n3. 中心：太阳\n4. 重要特征：地轴是倾斜的，而且它的空间指向保持不变，北极始终指向北极星附近\n\n【产生的地理现象】\n1. 四季的变化：地球在公转轨道的不同位置，表面受太阳照射的情况不完全相同，便产生了季节的变化。\n2. 昼夜长短的变化：除赤道外，其他地方一年中都有昼夜长短的变化。\n3. 五带的划分：根据各地获得太阳光热的多少，把地球表面划分为五个带。","id":"g1_geography_u006","semester":"upper"},{"chapter":"第一章 地球和地图","name":"五带的划分","formula":"热带、北温带、南温带、北寒带、南寒带","explanation":"【划分依据】\n根据各地获得太阳光热的多少，把地球表面划分为五个带：热带、北温带、南温带、北寒带、南寒带。\n\n【各带特点】\n1. 热带：23.5°N-23.5°S，有太阳直射现象，终年炎热\n2. 北温带：23.5°N-66.5°N，无太阳直射，无极昼极夜，四季分明\n3. 南温带：23.5°S-66.5°S，四季分明\n4. 北寒带：66.5°N-90°N，有极昼极夜现象，终年寒冷\n5. 南寒带：66.5°S-90°S，有极昼极夜现象，终年寒冷\n\n【重要纬线】\n北回归线（23.5°N）、南回归线（23.5°S）、北极圈（66.5°N）、南极圈（66.5°S）","id":"g1_geography_u007","semester":"upper"},{"chapter":"第一章 地球和地图","name":"地图的基本要素","formula":"比例尺、方向、图例","explanation":"【地图三要素】\n1. 比例尺：表示图上距离比实地距离缩小的程度\n   - 公式：比例尺 = 图上距离 / 实地距离\n   - 表示方式：数字式、线段式、文字式\n   - 大小比较：分母越大，比例尺越小；分母越小，比例尺越大\n\n2. 方向：\n   - 一般地图：上北下南，左西右东\n   - 有指向标的地图：指向标箭头一般指向北方\n   - 有经纬网的地图：经线指示南北方向，纬线指示东西方向\n\n3. 图例：地图上表示各种地理事物的符号\n   注记：地图上的文字说明，以及标明山高、水深的数字等","id":"g1_geography_u008","semester":"upper"},{"chapter":"第一章 地球和地图","name":"等高线地形图","formula":"等高线密集坡陡，稀疏坡缓","explanation":"【海拔和相对高度】\n1. 海拔（绝对高度）：地面某个地点高出海平面的垂直距离\n2. 相对高度：某个地点高出另一个地点的垂直距离\n\n【等高线】\n在地图上，把海拔相同的各点连接成线，就是等高线。\n\n【等高线特点】\n1. 同一条等高线上各点的海拔相等\n2. 等高距（两条相邻等高线的高度差）相等\n3. 等高线是闭合的曲线\n4. 等高线密集，表示坡度较陡；等高线稀疏，表示坡度较缓\n\n【不同山体部位的等高线特征】\n1. 山顶：等高线闭合，数值从中间向四周逐渐降低\n2. 山脊：等高线的弯曲部分向低处凸出\n3. 山谷：等高线的弯曲部分向高处凸出（易形成河流）\n4. 鞍部：两座山顶之间的低地\n5. 陡崖：等高线重叠","id":"g1_geography_u009","semester":"upper"},{"chapter":"第一章 地球和地图","name":"地形图的判读","formula":"分层设色地形图、地形剖面图","explanation":"【分层设色地形图】\n1. 定义：在绘有等高线和等深线的地形图上，把不同高度和深度的范围，着上不同的颜色，以表示地面和海底的起伏形态\n2. 颜色含义：绿色表示平原，蓝色表示海洋，黄色、褐色表示高原和山地\n3. 作用：可以直观地看出地面的高低形态和海底的起伏状况\n\n【地形剖面图】\n1. 定义：沿等高线地形图某条直线下切而显露出来的地形垂直剖面\n2. 作用：可以更直观地表示地面上沿某一方向地势的起伏和坡度的陡缓\n\n【五种基本地形】\n1. 平原：海拔一般在200米以下，地面平坦广阔\n2. 高原：海拔在500米以上，面积较大，外围较陡、内部起伏较为和缓\n3. 山地：海拔在500米以上，具有耸立的山峰、陡峭的山坡\n4. 丘陵：海拔在500米以下，地势起伏较大\n5. 盆地：四周高，中间低","id":"g1_geography_u010","semester":"upper"},{"chapter":"第二章 陆地和海洋","name":"海陆分布","formula":"七分海洋三分陆地，海洋71%，陆地29%","explanation":"【海陆比例】\n地球表面71%是海洋，而陆地面积仅占29%。概括地说，地球上七分是海洋，三分是陆地。\n\n【海陆分布特点】\n1. 世界海陆分布很不均匀\n2. 陆地主要集中在北半球，但北极周围却是一片海洋（北冰洋）\n3. 海洋大多分布在南半球，而南极周围却是一块陆地（南极洲）\n4. 无论怎样划分，地球上任何两个大小相等的半球，都是海洋面积大于陆地面积\n\n【海陆分布基本概念】\n1. 大陆：面积广大的陆地（如亚欧大陆、非洲大陆等）\n2. 岛屿：面积较小的陆地（如台湾岛、海南岛）\n3. 半岛：陆地伸进海洋的凸出部分（如朝鲜半岛、阿拉伯半岛）\n4. 海：大洋的边缘部分（如南海、地中海）\n5. 海峡：沟通两个海洋的狭窄水道（如马六甲海峡、白令海峡）","id":"g1_geography_u011","semester":"upper"},{"chapter":"第二章 陆地和海洋","name":"七大洲","formula":"亚洲、非洲、北美洲、南美洲、南极洲、欧洲、大洋洲","explanation":"【七大洲面积排序（从大到小）】\n亚非北南美，南极欧大洋（亚洲、非洲、北美洲、南美洲、南极洲、欧洲、大洋洲）\n\n【各大洲分界线】\n1. 亚洲与欧洲分界线：乌拉尔山脉-乌拉尔河-里海-大高加索山脉-黑海-土耳其海峡\n2. 亚洲与非洲分界线：苏伊士运河\n3. 亚洲与北美洲分界线：白令海峡\n4. 北美洲与南美洲分界线：巴拿马运河\n5. 欧洲与非洲分界线：直布罗陀海峡\n\n【其他要点】\n1. 面积最大的大洲：亚洲\n2. 面积最小的大洲：大洋洲\n3. 跨经度最广的大洲：南极洲\n4. 纬度最高的大洲：南极洲\n5. 完全在北半球的大洲：欧洲、北美洲\n6. 完全在南半球的大洲：南极洲","id":"g1_geography_u012","semester":"upper"},{"chapter":"第二章 陆地和海洋","name":"四大洋","formula":"太平洋、大西洋、印度洋、北冰洋","explanation":"【四大洋面积排序（从大到小）】\n太平洋、大西洋、印度洋、北冰洋\n\n【各大洋特点】\n1. 太平洋：面积最大，约占世界海洋总面积的一半，最深，岛屿最多\n2. 大西洋：形状呈\"S\"形，面积第二大\n3. 印度洋：大部分位于南半球，面积第三大\n4. 北冰洋：面积最小，深度最浅，跨经度最广，纬度最高，终年被冰层覆盖\n\n【其他要点】\n1. 跨经度最广的大洋：北冰洋\n2. 纬度最高的大洋：北冰洋\n3. 完全在东半球的大洋：印度洋\n4. 完全在北半球的大洋：北冰洋\n5. 呈\"S\"形的大洋：大西洋","id":"g1_geography_u013","semester":"upper"},{"chapter":"第二章 陆地和海洋","name":"海陆的变迁","formula":"地壳变动、海平面升降、人类活动","explanation":"【海陆变迁的原因】\n1. 地壳的变动（主要原因）：如喜马拉雅山中发现海洋生物化石\n2. 海平面的升降（主要原因）：如我国东部海底发现古河流遗迹\n3. 人类活动：如荷兰的围海造陆、填海造陆等\n\n【实例】\n1. 喜马拉雅山：曾经是海洋，由于地壳变动隆起形成山脉\n2. 台湾海峡：曾经是陆地，后来由于海平面上升成为海峡\n3. 荷兰：全国约1/4的陆地低于海平面，通过围海造陆扩大陆地面积\n\n【大陆漂移说】\n提出者：德国科学家魏格纳\n主要内容：两亿年前，地球上各大洲是相互连接的一块大陆，后来原始大陆才分裂成几块大陆，缓慢地漂移分离，逐渐形成了今天七大洲、四大洋的分布状况。","id":"g1_geography_u014","semester":"upper"},{"chapter":"第二章 陆地和海洋","name":"板块运动","formula":"板块构造学说，六大板块，板块交界地带地壳活跃","explanation":"【板块构造学说】\n20世纪60年代，在大陆漂移说的基础上，科学家提出了板块构造学说。\n\n【六大板块】\n亚欧板块、非洲板块、印度洋板块、太平洋板块、美洲板块、南极洲板块\n\n【板块运动特点】\n1. 板块内部地壳比较稳定\n2. 板块与板块交界的地带，地壳比较活跃，多火山、地震\n3. 板块运动的两种形式：张裂拉伸（常形成裂谷或海洋）、碰撞挤压（常形成山脉）\n\n【世界两大火山地震带】\n1. 环太平洋火山地震带\n2. 地中海-喜马拉雅火山地震带\n\n【实例】\n1. 红海：位于非洲板块和印度洋板块之间，两大板块发生张裂，面积不断扩大\n2. 喜马拉雅山：位于亚欧板块和印度洋板块之间，两大板块碰撞挤压，形成山脉\n3. 日本：位于亚欧板块和太平洋板块交界处，多火山、地震","id":"g1_geography_u015","semester":"upper"},{"chapter":"第三章 天气与气候","name":"天气与气候的区别","formula":"天气是短时间的，气候是长期的平均状况","explanation":"【天气】\n1. 定义：一个地区短时间里的大气状况，它是时刻在变化的\n2. 特点：短时间、多变性、不稳定性\n3. 常用语：晴、雨、大风、气温高、气温低、风力大、雾、沙尘暴等\n\n【气候】\n1. 定义：一个地区多年的天气平均状况，一般变化不大\n2. 特点：长时间、相对稳定、平均状况\n3. 常用语：全年高温多雨、冬季寒冷干燥、夏季炎热多雨、四季分明等\n\n【区别】\n天气是短时间的、多变的；气候是长时间的、相对稳定的。\n\n【联系】\n天气是形成气候的基础；气候是对多年天气状况的概括。","id":"g1_geography_u016","semester":"upper"},{"chapter":"第三章 天气与气候","name":"气温的变化与分布","formula":"气温日变化和年变化，从低纬向高纬递减","explanation":"【气温的日变化】\n1. 一天中，最高气温出现在午后2时左右（14时左右）\n2. 一天中，最低气温出现在日出前后\n3. 气温日较差 = 一天中最高气温 - 最低气温\n\n【气温的年变化】\n1. 北半球：陆地最高气温在7月，最低气温在1月；海洋最高气温在8月，最低气温在2月\n2. 南半球：陆地最高气温在1月，最低气温在7月；海洋最高气温在2月，最低气温在8月\n3. 气温年较差 = 一年中最高月平均气温 - 最低月平均气温\n\n【气温的分布规律】\n1. 纬度因素：气温大致由低纬向高纬递减\n2. 海陆因素：同纬度地带，夏季陆地气温高，海洋气温低；冬季相反\n3. 地形因素：在山地，气温随海拔升高而降低，大致海拔每升高100米，气温约下降0.6℃","id":"g1_geography_u017","semester":"upper"},{"chapter":"第三章 天气与气候","name":"降水的变化与分布","formula":"降水季节变化，赤道多两极少，沿海多内陆少","explanation":"【降水的定义】\n从大气中降落的雨、雪、冰雹等，统称为降水。降雨是降水的主要形式。\n\n【降水的季节变化】\n1. 全年多雨型：如热带雨林气候\n2. 全年少雨型：如热带沙漠气候\n3. 夏季多雨型：如季风气候\n4. 冬季多雨型：如地中海气候\n5. 常年湿润型：如温带海洋性气候\n\n【降水的分布规律】\n1. 赤道附近降水多，两极地区降水少（纬度因素）\n2. 南北回归线附近，大陆东岸降水多，大陆西岸降水少\n3. 中纬度地区，沿海地区降水多，内陆地区降水少（海陆因素）\n4. 山地迎风坡降水多，背风坡降水少（地形因素）\n\n【世界雨极】乞拉朋齐（印度，喜马拉雅山南坡，地形雨）","id":"g1_geography_u018","semester":"upper"},{"chapter":"第三章 天气与气候","name":"世界的气候类型","formula":"热带、亚热带、温带、寒带气候和高原山地气候","explanation":"【热带气候类型】\n1. 热带雨林气候：全年高温多雨（赤道附近）\n2. 热带草原气候：全年高温，分干湿两季（热带雨林南北两侧）\n3. 热带季风气候：全年高温，分旱雨两季（亚洲中南半岛、印度半岛）\n4. 热带沙漠气候：全年炎热干燥（南北回归线附近大陆西岸）\n\n【亚热带气候类型】\n1. 亚热带季风和湿润气候：夏季高温多雨，冬季温和少雨\n2. 地中海气候：夏季炎热干燥，冬季温和多雨（南北纬30°-40°大陆西岸）\n\n【温带气候类型】\n1. 温带季风气候：夏季高温多雨，冬季寒冷干燥（亚洲东部）\n2. 温带海洋性气候：全年温和湿润（南北纬40°-60°大陆西岸）\n3. 温带大陆性气候：冬冷夏热，降水较少，集中在夏季（亚欧大陆和北美大陆内部）\n\n【寒带气候和高原山地气候】\n1. 寒带气候：终年寒冷，降水稀少（两极地区）\n2. 高原山地气候：垂直变化明显（高山、高原地区）","id":"g1_geography_u019","semester":"upper"},{"chapter":"第三章 天气与气候","name":"影响气候的主要因素","formula":"纬度位置、海陆位置、地形","explanation":"【纬度位置】\n- 纬度低，太阳高度角大，获得太阳光热多，气温高\n- 纬度高，太阳高度角小，获得太阳光热少，气温低\n- 是影响气候的最主要因素\n\n【海陆位置】\n- 气温：同纬度地带，夏季陆地气温高，海洋气温低；冬季相反\n- 降水：沿海地区降水多，内陆地区降水少\n- 原因：陆地受热快、散热也快；海洋受热慢、散热也慢\n\n【地形因素】\n- 气温：气温随海拔升高而降低，每升高100米，气温约下降0.6℃\n- 降水：山地迎风坡降水多，背风坡降水少（地形雨）\n\n【人类活动】\n- 人工造林、修建水库、灌溉工程等可以改善局部气候\n- 二氧化碳等温室气体增加，导致全球气候变暖\n- 臭氧层破坏、酸雨等环境问题","id":"g1_geography_u020","semester":"upper"},{"chapter":"第四章 居民与聚落","name":"人口与人种","formula":"世界人口增长，人口分布，三大人种","explanation":"【世界人口增长】\n1. 人口总数：2011年10月31日，世界人口总数突破70亿\n2. 增长特点：18世纪以前，人口增长十分缓慢；工业革命以后，世界人口增长速度大大加快；第二次世界大战后，世界人口迅速增长\n3. 人口自然增长率 = 出生率 - 死亡率\n4. 人口自然增长率最高的大洲：非洲；最低的大洲：欧洲\n\n【世界人口分布】\n1. 人口稠密区：亚洲东部、亚洲南部、欧洲、北美洲东部（中低纬度沿海平原地区）\n2. 人口稀疏区：极端干旱的沙漠地区、气候过于湿热的雨林地区、终年严寒的高纬度地区、地势高峻的高原山区\n\n【三大人种】\n1. 黄色人种：主要分布在亚洲东部\n2. 白色人种：主要分布在欧洲、北美洲、大洋洲\n3. 黑色人种：主要分布在非洲中部和南部","id":"g1_geography_u021","semester":"upper"},{"chapter":"第四章 居民与聚落","name":"世界的语言和宗教","formula":"联合国六大工作语言，三大宗教","explanation":"【世界的语言】\n1. 联合国六大工作语言：汉语、英语、法语、俄语、西班牙语、阿拉伯语\n2. 使用人数最多的语言：汉语（主要在中国及东南亚地区）\n3. 使用范围最广的语言：英语（英国、美国、加拿大、澳大利亚、印度等）\n4. 西班牙语：西班牙及拉丁美洲许多国家\n5. 阿拉伯语：亚洲西部、非洲北部的阿拉伯国家\n\n【世界三大宗教】\n1. 基督教：\n   - 世界上信仰人数最多的宗教\n   - 起源地：亚洲西部\n   - 经典：《圣经》\n   - 建筑：教堂（尖顶）\n2. 伊斯兰教：\n   - 第二大宗教，教徒被称为穆斯林\n   - 起源地：阿拉伯半岛\n   - 经典：《古兰经》\n   - 建筑：清真寺（圆顶）\n3. 佛教：\n   - 第三大宗教\n   - 起源地：古印度\n   - 建筑：寺庙、佛塔","id":"g1_geography_u022","semester":"upper"},{"chapter":"第四章 居民与聚落","name":"人类的聚居地——聚落","formula":"乡村和城市，聚落与自然环境的关系","explanation":"【聚落的定义】\n人们的集中居住地称为聚落。\n\n【聚落的类型】\n1. 乡村聚落：规模较小，居民主要从事农业生产活动\n   - 农村、牧村、渔村、林场等\n2. 城市聚落：规模较大，居民主要从事非农业生产活动\n   - 工业、服务业等\n\n【聚落形成与发展的有利条件】\n1. 地形平坦\n2. 土壤肥沃，适于耕作\n3. 水源充足（井、泉、湖滨、河畔等地）\n4. 交通便利（交通沿线和交汇处、沿海港口等地）\n5. 自然资源丰富（林、渔、矿等地）\n\n【不同地区的聚落】\n1. 沙漠地区：厚墙、小窗（隔热、防风沙）\n2. 热带雨林地区：高架屋（通风防潮、防虫蛇）\n3. 黄土高原：窑洞（冬暖夏凉、就地取材）\n4. 北极地区：冰屋（防寒保暖）\n\n【聚落的发展与保护】\n保护传统聚落的意义：保存历史文化、传承民族文化等","id":"g1_geography_u023","semester":"upper"},{"chapter":"第五章 发展与合作","name":"发展中国家与发达国家","formula":"经济发展水平差异，南北对话和南南合作","explanation":"【划分依据】\n根据经济发展水平的差异，通常把世界上的国家分为发达国家和发展中国家。\n\n【分布】\n1. 发达国家：北美洲（美国、加拿大）、欧洲（英、法、德、意等）、大洋洲（澳大利亚、新西兰），亚洲的日本\n   - 主要分布在北半球，故称为\"北\"\n2. 发展中国家：亚洲、非洲、拉丁美洲的绝大多数国家\n   - 主要分布在北半球的南部和南半球，故称为\"南\"\n\n【经济差异】\n1. 发达国家：经济发展水平高，工业以高技术制造业为主，农业生产技术水平高，服务设施完善\n2. 发展中国家：经济发展水平低，工业以资源型和资源加工型为主，农业生产技术水平较低\n\n【国际合作】\n1. 南北对话：发达国家与发展中国家之间的政治、经济商谈\n2. 南南合作：发展中国家之间的互助合作\n3. 重要国际组织：联合国（UN）、世界贸易组织（WTO）等","id":"g1_geography_u024","semester":"upper"},{"chapter":"第五章 发展与合作","name":"国际经济合作","formula":"经济全球化，国际合作的重要性","explanation":"【经济全球化】\n当今世界，一方面是全球性的资源、技术、人才、信息等逐渐成为全球共享的财富，各国各地区的经济联系越来越紧密；另一方面是不同国家和地区之间的竞争日益激烈。\n\n【国际合作的重要性】\n1. 人口、资源、环境、发展等问题已经成为全球性问题，需要人类携手共同应对\n2. 任何国家在世界上都不是孤立存在的，总是与其他国家发生不同程度的联系\n3. 发达国家需要在发展中国家购买原料、出售产品\n4. 发展中国家则需要从发达国家引进资金、设备、先进的生产技术和管理经验，并购买一些本国难以生产的产品\n\n【重要的国际组织】\n1. 联合国（UN）：世界最大的国际组织，总部设在美国纽约\n2. 世界贸易组织（WTO）：重要的全球性经济贸易组织\n3. 国际奥林匹克委员会：国际体育组织\n4. 红十字会：人道主义组织\n5. 欧洲联盟（EU）：欧洲地区的政治经济一体化组织","id":"g1_geography_u025","semester":"upper"},{"chapter":"第五章 发展与合作","name":"世界上的国家和地区","formula":"面积大小、人口多少、政治制度不同","explanation":"【国家的数量】\n目前，世界上有220多个国家和地区。\n\n【国家的差异】\n1. 面积大小不同：\n   - 面积最大的国家：俄罗斯（1700多万平方千米）\n   - 面积第二：加拿大（997万平方千米）\n   - 面积第三：中国（约960万平方千米）\n   - 面积第四：美国（937万平方千米）\n   - 面积最小的国家：梵蒂冈（0.44平方千米）\n\n2. 人口多少不同：\n   - 人口最多的国家：中国（约14亿）\n   - 人口第二：印度（约13亿）\n   - 人口第三：美国（约3亿）\n\n3. 政治制度不同：\n   - 社会主义国家：如中国\n   - 资本主义国家：如美国、英国、法国等\n\n【国家主权】\n1. 国家不论面积大小、人口多少、政治制度有何不同、经济发达与否，地位都是平等的\n2. 领土包括领陆、领水和领空，是一个国家行使主权的空间，神圣不可侵犯","id":"g1_geography_u026","semester":"upper"},{"chapter":"第五章 发展与合作","name":"联合国","formula":"最大的国际组织，安理会常任理事国","explanation":"【地位】\n联合国是世界上规模最大、最有影响力的全球性国际组织。\n\n【成立时间】\n1945年10月24日（联合国日）\n\n【总部】\n美国纽约\n\n【基本宗旨】\n\"促进国家发展，维护世界和平\"\n\n【六大机构】\n1. 联合国大会\n2. 安全理事会（安理会）：是联合国中最重要的机构，由中国、法国、俄罗斯、英国、美国5个常任理事国和10个非常任理事国组成。常任理事国拥有否决权。\n3. 经济及社会理事会\n4. 托管理事会\n5. 国际法院\n6. 秘书处：秘书长是联合国的行政首长\n\n【作用】\n在维护世界和平、促进国际合作和发展等方面做了大量工作。","id":"g1_geography_u027","semester":"upper"},{"chapter":"第五章 发展与合作","name":"世界贸易组织","formula":"WTO，全球性经济贸易组织，2001年中国加入","explanation":"【英文缩写】\nWTO（World Trade Organization）\n\n【地位】\n是重要的全球性经济贸易组织，被称为\"经济联合国\"。\n\n【总部】\n瑞士日内瓦\n\n【宗旨】\n促进世界经济发展和福利进步，主张贸易自由与公平。\n\n【主要职能】\n减少各个国家和地区之间的贸易限制，控制和减免关税，促进国际贸易的发展。\n\n【中国加入时间】\n2001年12月11日，中国正式加入世界贸易组织。\n\n【其他重要国际组织】\n1. 国际奥林匹克委员会（国际奥委会）：奥林匹克运动的领导机构，总部在瑞士洛桑。奥林匹克精神是\"重要的不是胜利，而是参与\"；理想是\"和平、友谊、进步\"。\n2. 红十字会：以人道主义为宗旨，主要任务是防止并减轻人类疾苦，保护人的生命健康。","id":"g1_geography_u028","semester":"upper"},{"chapter":"第五章 发展与合作","name":"人口问题","formula":"人口增长过快过慢都会带来问题，人口要与资源环境相协调","explanation":"【人口增长过快带来的问题】\n1. 资源短缺：耕地减少、水资源短缺、粮食供应不足等\n2. 环境问题：水土流失、土地荒漠化、环境污染等\n3. 社会问题：交通拥挤、住房紧张、就业困难、教育医疗资源不足、贫困问题等\n4. 主要分布在：亚洲、非洲、拉丁美洲的一些国家\n\n【人口增长过慢带来的问题】\n1. 劳动力短缺\n2. 国防兵源不足\n3. 人口老龄化严重\n4. 社会养老负担加重\n5. 主要分布在：欧洲、北美洲的一些发达国家，如意大利、德国、瑞典等\n\n【正确的人口观】\n人口的增长应与资源、环境相协调，与社会经济发展相适应。\n\n【措施】\n1. 人口增长过快的国家：实行计划生育政策\n2. 人口增长过慢的国家：采取鼓励生育、接纳移民等政策","id":"g1_geography_u029","semester":"upper"},{"chapter":"第五章 发展与合作","name":"可持续发展","formula":"既满足当代人的需求，又不损害后代人满足其需求的能力","explanation":"【概念】\n可持续发展是指既满足当代人的需求，又不损害后代人满足其需求的能力的发展。\n\n【提出背景】\n1. 20世纪以来，人口激增、资源短缺、环境污染、生态破坏等问题日益突出\n2. 人类被迫重新审视自己的经济行为和社会发展\n3. 1987年，联合国世界环境与发展委员会提出可持续发展概念\n4. 1992年，联合国环境与发展大会（里约热内卢）通过《21世纪议程》，标志着可持续发展从理论走向实践\n\n【内涵】\n1. 生态持续发展：基础，强调发展要与资源环境承载力相协调\n2. 经济持续发展：条件，强调发展不仅要重视数量增长，更要追求质量改善、效益提高\n3. 社会持续发展：目的，强调发展要以改善和提高生活质量为目的，与社会进步相适应\n\n【基本原则】\n1. 公平性原则：同代人之间、代际之间、不同国家和地区之间的公平\n2. 持续性原则：人类的经济活动和社会发展不能超越资源环境的承载力\n3. 共同性原则：地球是一个整体，地区性问题往往会转化为全球性问题，需要全球共同行动\n\n【中国的可持续发展】\n1. 中国是可持续发展的积极参与者和实践者\n2. 科学发展观：坚持以人为本，树立全面、协调、可持续的发展观\n3. 生态文明建设：建设资源节约型、环境友好型社会\n4. 绿色发展、循环发展、低碳发展","id":"g1_geography_u030","semester":"upper"},{"chapter":"第六章 我们生活的大洲——亚洲","name":"亚洲的位置和范围","formula":"东半球北半球，面积最大、跨纬度最广、东西距离最长","explanation":"【地理位置】\n1. 半球位置：大部分位于东半球、北半球\n2. 纬度位置：地跨热带、北温带和北寒带，大部分在北温带\n3. 海陆位置：位于亚欧大陆东部，北临北冰洋，东临太平洋，南临印度洋，西临地中海和黑海\n\n【范围】\n1. 西北以乌拉尔山脉、乌拉尔河、里海、大高加索山脉、黑海和土耳其海峡与欧洲为界\n2. 西南以苏伊士运河与非洲为界\n3. 东南与大洋洲隔海相望\n4. 东北以白令海峡与北美洲为界\n\n【亚洲是世界第一大洲】\n1. 面积最大（约4400万平方千米，占世界陆地总面积的1/3）\n2. 跨纬度最广（地跨寒、温、热三带）\n3. 东西距离最长\n\n【地理分区】\n东亚、东南亚、南亚、西亚、中亚、北亚6个地区","id":"g1_geography_l001","semester":"lower"},{"chapter":"第六章 我们生活的大洲——亚洲","name":"亚洲的地形与河流","formula":"中部高四周低，放射状分布","explanation":"【地形特点】\n1. 地形以高原、山地为主，平均海拔高（除南极洲外海拔最高的大洲）\n2. 地面起伏大，高低悬殊\n3. 地势中部高，四周低\n\n【主要地形区】\n1. 青藏高原：世界最高的大高原，号称\"世界屋脊\"\n2. 喜马拉雅山脉：世界最高大的山脉，主峰珠穆朗玛峰是世界最高峰（海拔8848.86米）\n3. 西西伯利亚平原：亚洲最大的平原\n4. 阿拉伯半岛：世界最大的半岛\n5. 马来群岛：世界最大的群岛\n\n【河流特点】\n受地形影响，亚洲的大河多发源于中部山地、高原，呈放射状流向周边的海洋。\n\n【主要河流】\n1. 注入北冰洋：鄂毕河、叶尼塞河、勒拿河\n2. 注入太平洋：黄河、长江、湄公河\n3. 注入印度洋：恒河、印度河\n4. 内流河：塔里木河（我国最长的内流河）、阿姆河、锡尔河","id":"g1_geography_l002","semester":"lower"},{"chapter":"第六章 我们生活的大洲——亚洲","name":"亚洲的气候","formula":"复杂多样、季风气候显著、大陆性气候分布广","explanation":"【气候特点】\n1. 气候复杂多样：除温带海洋性气候外，世界上的各种气候在亚洲都有分布\n2. 季风气候显著：亚洲东部和南部是世界上季风气候分布面积最广、季风特点最为典型的地区\n3. 大陆性气候分布广：广大的内陆地区分布着温带大陆性气候\n\n【气候类型分布】\n1. 热带雨林气候：马来群岛\n2. 热带季风气候：印度半岛、中南半岛\n3. 热带沙漠气候：阿拉伯半岛\n4. 亚热带季风气候：我国南方地区\n5. 温带季风气候：我国北方地区、日本、朝鲜半岛\n6. 温带大陆性气候：亚欧大陆内部（分布最广）\n7. 寒带气候：北冰洋沿岸\n8. 高原山地气候：青藏高原和高山地区\n\n【季风气候的影响】\n1. 有利影响：雨热同期，有利于农业生产\n2. 不利影响：降水不稳定，容易发生旱涝灾害","id":"g1_geography_l003","semester":"lower"},{"chapter":"第六章 我们生活的大洲——亚洲","name":"亚洲的人口与经济","formula":"人口最多的大洲，经济发展不平衡","explanation":"【人口特点】\n1. 人口总数：约40亿，是世界上人口最多的大洲\n2. 人口稠密区：东亚、东南亚、南亚（中国、印度、日本、孟加拉国等人口超过1亿）\n3. 人口过亿的国家：中国、印度、印度尼西亚、巴基斯坦、孟加拉国、日本、菲律宾等\n\n【人口问题】\n人口增长过快，带来了资源短缺、环境恶化、住房紧张、交通拥挤、就业困难等一系列问题。\n\n【经济发展特点】\n1. 经济发展不平衡：亚洲少数国家属于发达国家（如日本），大部分国家属于发展中国家\n2. 发展差异大：\n   - 发达国家：日本\n   - 高收入石油国家：沙特阿拉伯、阿联酋等西亚国家\n   - 新兴工业化国家：韩国、新加坡等\n   - 发展中大国：中国、印度等\n3. 产业差异：第一产业比重高的国家经济较落后，第三产业比重高的国家经济较发达","id":"g1_geography_l004","semester":"lower"},{"chapter":"第六章 我们生活的大洲——亚洲","name":"亚洲的多样地域文化","formula":"三大人类文明发祥地，多样的民族文化","explanation":"【亚洲的民族】\n亚洲有1000多个民族，约占世界民族总数的一半。\n\n【三大人类文明发祥地】\n1. 黄河-长江中下游地区：古代中国文明（华夏文明）\n2. 印度河流域：古代印度文明\n3. 美索不达米亚平原（两河流域）：古巴比伦文明\n\n【多样的地域文化】\n1. 东亚：华夏文化、日本文化、朝鲜文化等\n2. 东南亚：多元文化交融，如吴哥窟、婆罗浮屠等\n3. 南亚：古印度文明，印度教、佛教发源地\n4. 西亚：阿拉伯文化，伊斯兰教发源地\n5. 北亚：游牧文化\n\n【不同地区的文化与自然环境的关系】\n1. 西亚贝都因人：住帐篷，穿宽大袍子，过游牧生活——适应炎热干燥的沙漠气候\n2. 北亚亚库特人：住木屋，穿毛皮服装，运输工具是狗拉雪橇——适应寒冷的气候\n3. 南亚孟加拉人：以捕鱼为生，交通工具是船——气候湿热，河网密布\n4. 东南亚达雅克人：住高脚屋（长屋）——气候湿热，通风防潮","id":"g1_geography_l005","semester":"lower"},{"chapter":"第七章 我们邻近的地区和国家","name":"日本","formula":"岛国、多火山地震、加工贸易经济、东西方兼容的文化","explanation":"【位置与组成】\n1. 位置：亚洲东部，太平洋西北部的岛国\n2. 组成：北海道、本州、四国、九州四个大岛及其附近的一些小岛组成\n3. 首都：东京\n\n【自然环境】\n1. 地形：以山地、丘陵为主，平原面积狭小（最大平原：关东平原）\n2. 多火山、地震：位于亚欧板块和太平洋板块交界处，地壳活跃（富士山是著名的活火山）\n3. 气候：温带季风气候和亚热带季风气候，海洋性特征明显\n\n【经济特点】\n1. 经济发达：是世界经济强国\n2. 加工贸易型经济：进口原料和燃料，出口工业制成品\n3. 工业分布：集中在太平洋沿岸和濑户内海沿岸\n4. 海外投资：投资建厂的主要对象是欧洲、美国、东亚和东南亚等国家和地区\n\n【文化特点】\n东西方兼容的文化。民族构成单一，大和民族占绝对优势。","id":"g1_geography_l006","semester":"lower"},{"chapter":"第七章 我们邻近的地区和国家","name":"东南亚","formula":"十字路口位置，热带气候，华人华侨集中","explanation":"【位置与范围】\n1. 位置：位于亚洲东南部，地处亚洲与大洋洲、太平洋与印度洋之间的\"十字路口\"\n2. 范围：包括中南半岛和马来群岛两大部分\n3. 重要海峡：马六甲海峡——位于马来半岛和苏门答腊岛之间，是连接太平洋与印度洋的重要海上通道\n\n【自然环境】\n1. 地形：\n   - 中南半岛：山河相间、纵列分布\n   - 马来群岛：地形崎岖，多火山、地震\n2. 气候：\n   - 中南半岛：热带季风气候，全年高温，分旱雨两季\n   - 马来群岛：热带雨林气候，全年高温多雨\n\n【社会经济】\n1. 粮食作物：水稻（主要粮食作物）\n2. 热带经济作物：天然橡胶（泰国）、油棕（马来西亚）、椰子（印度尼西亚）、蕉麻（菲律宾）\n3. 人口与城市：多分布在河流沿岸及河口三角洲\n4. 华人华侨：是世界上华人、华侨分布最集中的地区\n5. 旅游：缅甸仰光的大金塔、泰国曼谷的水上市场、柬埔寨的吴哥窟、印度尼西亚的巴厘岛等","id":"g1_geography_l007","semester":"lower"},{"chapter":"第七章 我们邻近的地区和国家","name":"中南半岛的地形与城市分布","formula":"山河相间纵列分布，城市多分布在河流沿岸及河口三角洲","explanation":"【地形特点】\n中南半岛上山脉、大河多由北向南延伸，具有山河相间、纵列分布的特点。\n\n【主要河流】\n1. 红河：在中国境内叫元江，流经越南，注入北部湾\n2. 湄公河：在中国境内叫澜沧江，是东南亚流经国家最多的河流（中国、缅甸、老挝、泰国、柬埔寨、越南），注入南海\n3. 湄南河：主要流经泰国，注入泰国湾\n4. 萨尔温江：在中国境内叫怒江，注入安达曼海\n5. 伊洛瓦底江：主要流经缅甸，注入安达曼海\n\n【城市分布特点】\n中南半岛的大城市主要分布在河流沿岸及河口三角洲。\n\n【原因】\n1. 河流沿岸地区地势平坦，土壤肥沃\n2. 水源充足，易于灌溉\n3. 交通便利，河运发达\n4. 农业开发历史悠久，人口稠密\n\n【主要城市与河流】\n河内（红河）、金边（湄公河）、万象（湄公河）、曼谷（湄南河）、仰光（伊洛瓦底江）\n\n【城市分布的利弊】\n利：提供便利的水运、充足的水源等\n弊：容易发生洪涝灾害，水污染等问题","id":"g1_geography_l008","semester":"lower"},{"chapter":"第七章 我们邻近的地区和国家","name":"印度","formula":"第二人口大国，热带季风气候，服务外包产业","explanation":"【位置与首都】\n1. 位置：南亚面积最大的国家，东临孟加拉湾，西临阿拉伯海，南临印度洋\n2. 首都：新德里\n\n【人口】\n人口超过13亿，世界第二人口大国，人口增长速度快。\n\n【自然环境】\n1. 地形：北部是喜马拉雅山脉，中部是恒河平原，南部是德干高原\n2. 气候：以热带季风气候为主，全年高温，分旱雨两季\n   - 旱季：10月-次年5月，盛行东北季风，降水稀少\n   - 雨季：6-9月，盛行西南季风，降水丰沛\n3. 水旱灾害频繁：西南季风很不稳定，导致降水量的时间分配很不稳定\n\n【经济】\n1. 粮食作物：水稻和小麦\n2. 服务外包产业：印度是软件外包产业的发源地，被称为\"世界办公室\"。班加罗尔是软件外包产业中心。\n\n【主要城市】\n新德里（首都）、孟买（最大城市和棉纺织中心）、加尔各答（麻纺织中心）、班加罗尔（软件中心）","id":"g1_geography_l009","semester":"lower"},{"chapter":"第七章 我们邻近的地区和国家","name":"印度的粮食生产与服务外包产业","formula":"绿色革命，世界办公室，班加罗尔","explanation":"【粮食生产】\n1. 主要粮食作物：水稻和小麦\n   - 水稻：主要分布在东北部平原和半岛沿海平原（降水丰富地区）\n   - 小麦：主要分布在德干高原西北部和恒河中上游地区（降水较少地区）\n2. \"绿色革命\"：\n   - 第一次绿色革命（20世纪60年代）：引进培育新品种，使用化肥，改进灌溉技术，粮食产量大幅提高\n   - 第二次绿色革命（2004年开始）：生物技术革命，提高粮食产量，改善生态环境\n3. 粮食自给自足：通过两次\"绿色革命\"，印度实现了粮食自给\n\n【服务外包产业】\n1. 发展条件：人力资源丰富、劳动力成本较低、英语普及、信息技术发展较早等\n2. 特点：信息技术含量高、利润大、资源消耗少等\n3. 地位：印度是软件外包产业的发源地，被称为\"世界办公室\"\n4. 业务范围：信息技术服务（ITES）、业务流程外包（BPO）等\n5. 主要城市：\n   - 班加罗尔：印度软件外包产业的发源地和中心，\"印度硅谷\"\n   - 加尔各答、新德里、孟买、金奈等也是重要的服务外包产业中心","id":"g1_geography_l010","semester":"lower"},{"chapter":"第七章 我们邻近的地区和国家","name":"俄罗斯","formula":"面积最大的国家，横跨亚欧两大洲，重工业发达","explanation":"【位置与范围】\n1. 位置：横跨亚欧大陆的北部，西临波罗的海，北临北冰洋，东临太平洋，西南临黑海和里海\n2. 面积：超过1700万平方千米，是世界上面积最大的国家\n3. 首都：莫斯科\n\n【自然环境】\n1. 地形：以平原和高原为主，东高西低。自西向东依次为东欧平原、西西伯利亚平原、中西伯利亚高原、东西伯利亚山地\n2. 气候：以温带大陆性气候为主，冬季寒冷而漫长，夏季温暖而短促\n3. 河流：伏尔加河（欧洲最长河流，\"母亲伏尔加\"，注入里海）、鄂毕河、叶尼塞河、勒拿河\n4. 湖泊：贝加尔湖（世界上最深、蓄水量最大的淡水湖）\n\n【经济】\n1. 资源丰富：自然资源丰富，种类齐全，是世界上少数几个资源基本自给的大国之一\n2. 工业：重工业发达，轻工业相对薄弱。四大工业区：莫斯科工业区、圣彼得堡工业区、乌拉尔工业区、新西伯利亚工业区\n3. 交通：以铁路运输为主。西伯利亚大铁路，被称为\"亚欧大陆桥\"\n\n【城市】\n莫斯科（首都，最大城市）、圣彼得堡（第二大城市，波罗的海沿岸重要港口）、摩尔曼斯克（北冰洋沿岸不冻港）、符拉迪沃斯托克（海参崴，太平洋沿岸港口）","id":"g1_geography_l011","semester":"lower"},{"chapter":"第七章 我们邻近的地区和国家","name":"俄罗斯的工业与交通","formula":"重工业发达轻工业薄弱，铁路运输为主","explanation":"【自然资源】\n1. 特点：俄罗斯自然资源丰富，种类齐全，是世界上少数几个资源能够自给的大国之一\n2. 主要资源：石油、天然气、煤、铁、有色金属等的储量和产量都在世界上名列前茅\n3. 森林资源丰富：拥有世界上面积最大的亚寒带针叶林\n4. 被称为\"世界加油站\"：大量出口石油和天然气\n\n【工业特点】\n1. 重工业发达：核工业、航空航天工业、机械工业、钢铁工业等在世界上占有重要地位\n2. 轻工业相对薄弱：消费品制造业发展相对滞后，大量进口日用消费品\n3. 工业分布：靠近原料产地\n\n【四大工业区】\n1. 莫斯科工业区：全国工业最发达的地区，主要有钢铁、汽车、飞机、火箭和电子等工业部门\n2. 圣彼得堡工业区：石油化工、造船、电子、造纸和航空航天等工业发达，也是俄罗斯食品和纺织工业最发达的地区\n3. 乌拉尔工业区：主要有石油、钢铁、机械等工业部门\n4. 新西伯利亚工业区：主要有煤炭、石油、天然气、电力、钢铁等工业部门\n\n【交通】\n1. 特点：交通部门齐全，铁路、公路、航空、内河与海洋航运和管道运输均很发达\n2. 分布不平衡：欧洲部分铁路网非常密集，以莫斯科为中心呈放射状分布；亚洲部分铁路网比较稀疏，但有一条非常重要的铁路——西伯利亚大铁路，被称为\"亚欧大陆桥\"\n3. 客运：以铁路和公路为主\n4. 货运：以铁路和管道为主（管道主要运输石油和天然气）","id":"g1_geography_l012","semester":"lower"},{"chapter":"第八章 东半球其他的地区和国家","name":"中东","formula":"三洲五海之地，石油宝库，水资源匮乏，文化差异","explanation":"【位置与范围】\n1. 位置：位于亚洲西南部和非洲东北部，地处\"三洲五海之地\"（三洲：亚、非、欧；五海：阿拉伯海、红海、地中海、黑海、里海）\n2. 范围：包括西亚的大部分和非洲的埃及\n3. 重要运河：苏伊士运河——沟通了地中海和红海，缩短了大西洋到印度洋的航程\n4. 重要海峡：霍尔木兹海峡——波斯湾石油外运的必经之地，被称为\"世界油阀\"\n\n【世界石油宝库】\n1. 地位：是世界上石油储量最大、生产和输出石油最多的地区\n2. 分布：石油主要分布在波斯湾及其沿岸地区\n3. 产油国：沙特阿拉伯、伊朗、伊拉克、科威特、阿拉伯联合酋长国等\n4. 输出路线：三条航线运往东亚、欧洲西部和北美洲\n\n【水资源匮乏】\n气候干燥（热带沙漠气候为主），河流稀少，水资源分配矛盾突出。\n\n【多元的文化】\n多数居民信仰伊斯兰教，主要是阿拉伯人。是基督教、伊斯兰教、犹太教的发源地。耶路撒冷是三教圣城。","id":"g1_geography_l013","semester":"lower"},{"chapter":"第八章 东半球其他的地区和国家","name":"中东的石油输出路线","formula":"波斯湾及其沿岸，三条主要输出航线","explanation":"【石油地位】\n中东是目前世界上石油储量最大、生产石油最多、输出石油最多的地区。\n\n【石油分布】\n主要分布在波斯湾及其沿岸地区。\n\n【主要产油国】\n沙特阿拉伯、伊朗、伊拉克、科威特、阿拉伯联合酋长国等。\n\n【石油输出路线】\n1. 输往东亚（中国、日本等）：\n   波斯湾→霍尔木兹海峡→阿拉伯海→印度洋→马六甲海峡→太平洋→东亚\n\n2. 输往欧洲西部和北美洲（苏伊士运河航线）：\n   波斯湾→霍尔木兹海峡→阿拉伯海→红海→苏伊士运河→地中海→直布罗陀海峡→大西洋→欧洲西部、北美洲\n   （特点：航程短，运量小，25万吨以下油轮可通过）\n\n3. 输往欧洲西部和北美洲（好望角航线）：\n   波斯湾→霍尔木兹海峡→阿拉伯海→印度洋→好望角→大西洋→欧洲西部、北美洲\n   （特点：航程长，运量大，大型油轮通过）\n\n【石油输出对产油国的影响】\n1. 有利：石油出口带来了巨大的财富，带动了经济发展\n2. 不利：经济过分依赖石油，经济结构单一；未来石油资源枯竭，需要考虑经济可持续发展","id":"g1_geography_l014","semester":"lower"},{"chapter":"第八章 东半球其他的地区和国家","name":"欧洲西部","formula":"发达国家集中，工业发达，畜牧业发达，旅游繁荣","explanation":"【位置与范围】\n1. 位置：位于欧洲的西半部，北临北冰洋，西临大西洋，南临地中海\n2. 范围：约占欧洲的一半左右，人口稠密，国家众多\n\n【经济特点】\n1. 发达国家集中：是世界上发达国家最为集中的地区\n2. 工业：工业工艺精，技术水平和生产效率高，是世界上工业发达的地区之一\n3. 农业：以畜牧业为主，劳动力短缺，但生产高度机械化、自动化\n4. 服务业：体系完善，服务质量优，产值大，成为国民经济的支柱\n\n【畜牧业发达的原因】\n1. 位置：地处中纬度大陆西岸\n2. 气候：温带海洋性气候广布，全年温和湿润，有利于多汁牧草生长\n3. 地形：以平原为主，草场广布\n\n【旅游业】\n是世界上旅游业最发达的地区之一。\n著名景点：英国白金汉宫、法国巴黎卢浮宫、意大利古罗马斗兽场、西班牙斗牛、荷兰风车、挪威峡湾风光等。\n\n【欧盟】\n欧洲联盟（EU），是世界上最大的区域性国际组织。","id":"g1_geography_l015","semester":"lower"},{"chapter":"第八章 东半球其他的地区和国家","name":"欧洲西部的气候与农业","formula":"温带海洋性气候为主，畜牧业发达","explanation":"【气候类型】\n1. 温带海洋性气候：分布最广，主要在大西洋沿岸\n   - 特点：全年温和湿润\n   - 成因：终年受西风带控制，北大西洋暖流增温增湿\n2. 地中海气候：主要分布在地中海沿岸\n   - 特点：夏季炎热干燥，冬季温和多雨\n3. 温带大陆性气候：主要分布在东部内陆地区\n4. 寒带气候：分布在北极圈以内\n\n【地形】\n1. 以平原为主：西欧平原、波德平原（中欧平原）\n2. 山地：北部是斯堪的纳维亚山脉，南部是阿尔卑斯山脉\n3. 地势：南北高，中间低\n\n【发达的畜牧业】\n1. 有利条件：\n   - 地形：以平原为主，地势低平，草场广布\n   - 气候：温带海洋性气候，全年温和湿润，有利于多汁牧草生长\n   - 社会经济条件：人口稠密，市场需求量大；交通运输便利；科技水平高等\n2. 地位：在欧洲西部，人们称牧草为\"绿色金子\"，畜牧业产值占农业总产值的比重高（英国在70%以上，法国和德国也高于50%）\n3. 特点：生产高度机械化、自动化，劳动力短缺\n4. 主要农牧产品：牛肉、羊肉、牛奶、乳制品等\n\n【地中海沿岸的园艺业】\n地中海气候区，夏季炎热干燥，冬季温和多雨，是亚热带水果产区，盛产柑橘、柠檬、葡萄、油橄榄等。","id":"g1_geography_l016","semester":"lower"},{"chapter":"第八章 东半球其他的地区和国家","name":"撒哈拉以南非洲","formula":"黑种人的故乡，高原大陆，热带大陆，经济发展缓慢","explanation":"【位置与范围】\n1. 位置：位于世界最大的沙漠——撒哈拉沙漠以南，东临印度洋，西临大西洋\n2. 范围：绝大部分位于热带，有\"热带大陆\"之称\n\n【自然环境】\n1. 地形：以高原为主，被称为\"高原大陆\"。埃塞俄比亚高原（\"非洲屋脊\"）、东非高原、南非高原\n2. 气候：以热带草原气候和热带雨林气候为主，热带草原气候分布最广。气候以赤道为中心，南北对称分布\n3. 河流：尼罗河（世界最长河，自南向北注入地中海）、刚果河（水量大，水能资源丰富）\n4. 湖泊：维多利亚湖（非洲最大的湖泊）\n\n【人文特点】\n1. 黑种人的故乡：90%以上是黑种人，有\"黑非洲\"之称\n2. 文化：独特的文化习俗，如鼓乐、舞蹈、雕刻等\n\n【经济特点】\n1. 经济发展缓慢：历史上长期受殖民主义者占领和掠夺\n2. 出口初级农矿产品，进口工业制成品，在国际贸易中处于不利地位\n3. 发展方向：努力改变经济过分依赖初级农矿产品生产的情况，使经济稳步增长\n\n【人口、粮食与环境】\n人口自然增长率高，粮食供应不足，生态环境恶化。","id":"g1_geography_l017","semester":"lower"},{"chapter":"第八章 东半球其他的地区和国家","name":"撒哈拉以南非洲的人口粮食环境问题","formula":"人口增长快，粮食不足，环境恶化，恶性循环","explanation":"【人口问题】\n1. 人口自然增长率：是世界上人口自然增长率最高的地区（约2.3%，有些国家甚至超过3%）\n2. 人口增长速度快，人口总数已超过10亿\n\n【粮食问题】\n1. 粮食供应不足，是世界上粮食问题最严重的地区\n2. 原因：\n   - 人口增长过快，人口增长速度超过了粮食增长速度\n   - 农牧业生产落后，农产品产量低\n   - 热带草原气候区，降水不稳定，常受旱灾威胁\n   - 频繁的战争和冲突\n   - 生态环境恶化\n\n【环境问题】\n1. 表现：土地荒漠化、水土流失、草原退化、生物多样性减少等\n2. 原因：\n   - 人口增长过快，对粮食和肉类的需求增加\n   - 砍伐森林、开垦草原、过度放牧，导致生态环境恶化\n   - 只使用不养护，土壤肥力下降\n\n【恶性循环】\n人口增长过快→需要更多的粮食和肉类→砍伐森林、开垦草原、过度放牧→土地荒漠化、生态环境恶化→粮食产量下降→粮食不足→继续破坏环境...\n\n【解决措施】\n1. 控制人口增长，提高人口素质\n2. 保护生态环境，合理利用自然资源\n3. 大力发展粮食生产，解决粮食短缺问题\n4. 加强民族团结与合作，减少部族冲突\n5. 引进人才和技术，发展民族经济等","id":"g1_geography_l018","semester":"lower"},{"chapter":"第八章 东半球其他的地区和国家","name":"澳大利亚","formula":"世界活化石博物馆，骑在羊背上的国家，坐在矿车上的国家","explanation":"【位置与范围】\n1. 位置：位于南半球，东濒太平洋，西临印度洋，南回归线穿过中部\n2. 范围：包括澳大利亚大陆、塔斯马尼亚岛和周围岛屿，是世界上唯一独占一个大陆的国家\n3. 首都：堪培拉\n\n【世界活化石博物馆】\n特有动物：袋鼠、鸸鹋、考拉（树袋熊）、鸭嘴兽、琴鸟等。\n原因：澳大利亚大陆长期孤立存在于南半球的海洋中，自然条件单一，生物进化缓慢。\n\n【骑在羊背上的国家】\n是世界上绵羊数和出口羊毛最多的国家。\n三大牧羊带：羊、牛与经济作物混合经营带，绵羊与小麦混合经营带，粗放牧羊带。\n\n【坐在矿车上的国家】\n1. 矿产资源丰富，品种多，品质优，埋藏浅，易开采\n2. 是世界矿产品的主要出口国之一\n3. 主导产业：20世纪70年代以来，服务业发展迅速，超过工业和农牧业，成为澳大利亚的经济支柱\n\n【人口与城市】\n主要分布在东南沿海地区。\n主要城市：堪培拉（首都）、悉尼（最大城市，悉尼歌剧院）、墨尔本（第二大城市）","id":"g1_geography_l019","semester":"lower"},{"chapter":"第八章 东半球其他的地区和国家","name":"澳大利亚的牧羊带与矿产","formula":"三大牧羊带，矿产丰富，服务业为支柱产业","explanation":"【骑在羊背上的国家】\n1. 地位：\n   - 世界上放养绵羊数量和出口羊毛最多的国家\n   - 重要的牛肉、小麦出口国\n2. 牧羊带的分布：\n   - 羊、牛与经济作物混合经营带：东南部和西南部沿海，土壤肥沃，规模较小，人工草场，产量高，品质好\n   - 绵羊与小麦混合经营带：中部和西南部，规模较大，人工草场与天然草场结合，产量较高\n   - 粗放牧羊带：西部和中部，规模大，天然草场，品质较差，产量低\n3. 特点：\n   - 因地制宜，农牧业生产机械化程度很高\n   - 耗用劳动力少\n   - 农牧产品大量出口，商品率高\n\n【坐在矿车上的国家】\n1. 矿产资源特点：\n   - 矿产资源丰富，品种多\n   - 品质优、埋藏浅、易开采\n2. 主要矿产：\n   - 铁矿：储量大，品质优，主要分布在西部\n   - 煤矿：主要分布在东部沿海\n   - 铝土矿：储量居世界首位\n   - 还有金、锰、石油等\n3. 采矿业和冶金业：\n   - 采矿业规模大，机械化、自动化程度高，效率高\n   - 矿产品出口额在出口总额中占有很大比重，主要销往中国、印度、日本、韩国等亚洲国家\n\n【经济发展】\n1. 二战前：农牧业是国民经济的主导产业\n2. 二战后：工矿业、服务业发展迅速，农牧业地位下降\n3. 20世纪70年代以来：服务业发展迅速，已经超过工业和农牧业，成为澳大利亚的经济支柱","id":"g1_geography_l020","semester":"lower"},{"chapter":"第九章 西半球的国家","name":"美国","formula":"移民国家，农业地区专业化，世界最发达的工业国家","explanation":"【位置与领土组成】\n1. 位置：位于西半球、北半球。本土位于太平洋和大西洋之间，北、南分别与加拿大、墨西哥相邻\n2. 领土组成：本土48个州，加上阿拉斯加州和夏威夷州，共50个州\n3. 首都：华盛顿\n\n【人口与民族】\n1. 人口：超过3亿，是世界第三人口大国\n2. 移民国家：是西半球人口最多的国家，主要人种是白色人种，原著居民是印第安人（黄色人种）\n3. 唐人街：旧金山、纽约、洛杉矶等城市有华人聚居的唐人街\n\n【农业】\n1. 特点：农业生产实现了机械化、专业化和商品化\n2. 农业带：玉米带、小麦区、乳畜带、棉花带、亚热带作物带、畜牧和灌溉农业区等\n3. 地位：是世界上的农业强国，许多农产品的生产量和出口量居世界前列\n\n【工业】\n1. 地位：世界上最发达的工业国家\n2. 三大工业区：东北部工业区、南部工业区、西部工业区\n3. 高新技术产业：硅谷（旧金山）是美国兴起最早、规模最大的高新技术产业中心\n4. 支柱产业：服务业和高新技术产业","id":"g1_geography_l021","semester":"lower"},{"chapter":"第九章 西半球的国家","name":"美国的农业地区专业化","formula":"机械化、专业化、商品化，农业带的分布","explanation":"【农业特点】\n1. 地区生产专业化：形成了一些农业带（区），生产规模大\n2. 生产过程机械化：农业生产的各个环节都实现了机械化，效率高，产量大\n3. 农产品商品化：农产品大量出口，是世界上出口农产品最多的国家\n\n【发展农业的有利条件】\n1. 位置：本土大部分在温带，热量充足\n2. 地形：平原面积广大，约占全国总面积的一半以上，耕地广大\n3. 气候：以温带大陆性气候为主，气候多样，适宜多种农作物生长\n4. 水源：密西西比河和五大湖为灌溉、航运等提供了良好的条件\n5. 科技：农业科技水平高，推广快\n\n【主要农业带（区）】\n1. 乳畜带：位置偏北，气候冷湿，适宜牧草生长；城市和人口密集，市场需求量大\n2. 玉米带：地势平坦，土壤肥沃，春夏气温较高，适合玉米生长\n3. 小麦区：地势平坦，土壤肥沃，雨热同期，适合小麦生长\n4. 棉花带：热量充足，无霜期长，春夏降水多，秋季降水少，适宜棉花成熟（现在植棉业已经衰落，转为以畜牧业为主的多种作物区）\n5. 亚热带作物带：地处亚热带，热量充足，降水丰富，适宜亚热带作物生长\n6. 畜牧和灌溉农业区：地形多高原山地，降水少，适宜发展畜牧业和灌溉农业\n7. 小麦和林牧业区、水果和灌溉农业区等\n\n【农业专业化的好处】\n1. 充分利用不同地区的自然条件\n2. 便于大规模使用农业机械，提高劳动生产率\n3. 便于推广先进的生物技术、耕作技术，提高农产品质量","id":"g1_geography_l022","semester":"lower"},{"chapter":"第九章 西半球的国家","name":"美国的工业与高新技术产业","formula":"三大工业区，硅谷，世界最发达的工业国家","explanation":"【工业地位】\n美国是世界上最发达的工业国家。\n\n【工业特点】\n1. 工业部门体系完整，产品种类齐全，产量大，技术先进\n2. 是世界上最发达的工业国家\n3. 能源、钢铁、机械、化工等工业在世界上占有重要地位\n4. 军事工业和尖端技术领域处于世界领先地位\n\n【三大工业区】\n1. 东北部工业区（传统工业区）：\n   - 发展最早，是美国也是世界最大的工业区\n   - 主要工业部门：钢铁、汽车、化学等\n   - 主要城市：纽约、芝加哥、底特律、匹兹堡等\n2. 南部工业区（新兴工业区）：\n   - 主要工业部门：石油、宇航、电子、飞机制造等\n   - 主要城市：休斯敦（宇航中心）、达拉斯等\n3. 西部工业区（新兴工业区）：\n   - 主要工业部门：宇航、电子、信息技术等\n   - 主要城市：旧金山（\"硅谷\"）、洛杉矶、西雅图等\n\n【高新技术产业】\n1. 地位：引领世界高新技术产业的发展，是世界最大的高新技术产业基地\n2. 兴起时间：20世纪70年代，以信息技术产业、生物技术产业、新材料技术产业等为代表\n3. 分布：旧金山东南的\"硅谷\"，是美国兴起最早、规模最大的高新技术产业中心，因大量生产电子工业的基本材料——硅片而得名\n4. 作用：\n   - 是美国经济增长的主要动力\n   - 新增就业机会，提高生产效率、产品质量和价值\n   - 应用广泛，形成许多新的部门\n   - 推动其他产业的发展","id":"g1_geography_l023","semester":"lower"},{"chapter":"第九章 西半球的国家","name":"巴西","formula":"热带面积最大的国家，混血种人多，工农业发展迅速，热带雨林危机","explanation":"【位置与首都】\n1. 位置：位于南美洲东部，东临大西洋，大部分位于热带（南回归线穿过南部），是拉丁美洲面积最大、人口最多的国家\n2. 首都：巴西利亚（1960年从里约热内卢迁都）\n\n【居民与文化】\n1. 人口：超过2亿，世界第五人口大国\n2. 种族构成复杂：最显著的人口特征是混血种人数量多。白种人占一半多，黑白混血种人约占40%\n3. 文化：狂欢节、桑巴舞、足球等\n\n【自然环境】\n1. 地形：以平原和高原为主。亚马孙平原（世界最大的平原）、巴西高原（世界最大的高原）\n2. 气候：以热带雨林气候和热带草原气候为主\n3. 河流：亚马孙河（世界第一大河，水量最大、流域面积最广，长度第二）\n\n【经济】\n1. 农业：热带经济作物的重要出口国，咖啡、甘蔗、柑橘的产量居世界首位（\"咖啡王国\"）\n2. 工业：钢铁、汽车、飞机制造等跻身于世界重要的生产国行列\n3. 资源：铁矿储量大，质地优良；水能资源丰富（伊泰普水电站）\n\n【热带雨林的开发与保护】\n亚马孙热带雨林被称为\"地球之肺\"，正在遭受严重破坏，需要保护。","id":"g1_geography_l024","semester":"lower"},{"chapter":"第九章 西半球的国家","name":"巴西的热带雨林与人口文化","formula":"地球之肺，热带雨林的开发与保护，多元文化","explanation":"【亚马孙热带雨林】\n1. 分布：主要分布在亚马孙平原，是世界上面积最大的热带雨林\n2. 环境效益（作用）：\n   - 调节全球气候，被称为\"地球之肺\"\n   - 涵养水源，保护淡水资源\n   - 保护土壤，防止水土流失\n   - 提供良好的生物生存环境，维护生物多样性\n   - 提供木材、药材、食品等（经济效益）\n3. 开发：\n   - 20世纪60年代以前：热带雨林地区人烟稀少，经济落后，开发缓慢\n   - 20世纪60年代以后：修路、采矿、办工厂、建城镇、开辟大型农牧场等，热带雨林遭到前所未有的破坏\n4. 破坏带来的问题：\n   - 水土流失加剧\n   - 生物多样性锐减\n   - 影响全球气候，加剧全球变暖\n   - 珍贵的热带雨林物种灭绝等\n5. 保护：\n   - 设立各种形式的雨林保护区\n   - 采取新的手段控制雨林的乱砍滥伐\n   - 与联合国相关组织合作，提出可持续发展的新方式\n   - 公民环保意识提高等\n\n【多元的巴西文化】\n1. 种族构成：\n   - 白种人占一半多\n   - 黑白混血种人约占40%（混血种人数量多，是巴西最显著的人口特征）\n   - 黑种人约占6%\n   - 还有少数黄种人和印第安人\n2. 特色文化：\n   - 狂欢节：欧洲天主教的节日与当地文化融合\n   - 桑巴舞：葡萄牙的民歌、游戏和非洲的鼓乐、舞蹈的完美结合\n   - 足球：现代足球的发源地是英国，但巴西足球的水平堪称世界一流\n3. 文化特点：多元性（各种地域文化相互融合、发展，形成了具有特色的巴西文化）","id":"g1_geography_l025","semester":"lower"},{"chapter":"第九章 西半球的国家","name":"巴西的经济发展","formula":"工农业大国，咖啡王国，金砖国家之一","explanation":"【经济地位】\n巴西是南美洲经济实力最强的国家，是\"金砖国家\"之一。\n\n【农业】\n1. 地位：\n   - 农业仍然是巴西国民经济的重要基础部门\n   - 是世界上著名的农业大国\n2. 发展条件：\n   - 热带面积广大，气候湿热，雨热同期，有利于热带作物生长\n   - 地形平坦，耕地面积广大\n   - 水资源丰富\n   - 农业机械化程度较高\n3. 主要农产品：\n   - 热带经济作物：咖啡、甘蔗、柑橘的产量居世界首位，被称为\"咖啡王国\"\n   - 大豆、玉米、水稻等也居世界前列\n   - 畜牧业发展较快，牛肉大量出口\n4. 分布：\n   - 农业主要分布在东南沿海地区\n   - 农牧业集中在巴西高原东南部\n\n【工业】\n1. 发展条件：\n   - 铁矿储量大，质地优良，产量和出口量都居世界前列\n   - 水能资源丰富（伊泰普水电站，由巴西和巴拉圭合资修建）\n   - 有丰富的热带农产品原料\n2. 工业部门：\n   - 钢铁、造船、汽车、飞机制造等已经跃居世界重要生产国家的行列\n   - 纺织、食品等轻工业也较发达\n3. 工业分布：\n   - 主要分布在东南沿海地区（靠近原料产地、交通便利、劳动力充足、市场广阔）\n   - 圣保罗、里约热内卢是重要的工业中心\n\n【经济发展变化】\n1. 二战前：经济长期依赖农矿产品的生产，单一商品经济，经济落后\n2. 二战后：加快了工业化的步伐，工业发展迅速，逐步成为一个工农业大国","id":"g1_geography_l026","semester":"lower"},{"chapter":"第十章 极地地区","name":"南极地区的自然环境","formula":"冰雪高原、白色荒漠、风库，酷寒干燥烈风","explanation":"【位置与范围】\n主要位于南极圈以南，包括南极洲及其周边的海域（太平洋、大西洋、印度洋的南部）。\n\n【地形】\n1. 南极洲平均海拔2350米，是世界上平均海拔最高的大洲\n2. 地表大部分覆盖着很厚的冰层，素有\"冰雪高原\"之称\n3. 冰山：南极大陆附近海面上漂浮的冰山，是人类可利用的巨大水库\n\n【气候特点】\n1. 酷寒：纬度高，太阳高度角小，获得的太阳辐射少；冰雪覆盖，对阳光反射强；海拔高，气温低\n2. 干燥：年平均降水量55毫米以下，最少的地方不足5毫米，被称为\"白色荒漠\"\n3. 烈风：年平均风速17-18米/秒，最大风速可达100米/秒，被称为\"风库\"或\"风极\"\n\n【代表动物】\n企鹅、磷虾、海豹、海狮、鲸等。企鹅是南极地区的代表性动物，被称为\"南极的主人\"。\n\n【自然资源】\n1. 矿产资源：煤、铁等资源丰富\n2. 固体淡水资源：地球上68%的淡水以冰雪形式储存在两极地区，南极地区是世界上最大的淡水资源库\n3. 海洋生物资源：磷虾、鲸、海豹等\n4. 原始的自然环境：是天然实验室","id":"g1_geography_l027","semester":"lower"},{"chapter":"第十章 极地地区","name":"北极地区的自然环境","formula":"以海洋为主，气温比南极高，北极熊","explanation":"【位置与范围】\n主要位于北极圈以北，包括北冰洋的大部分，以及沿岸的亚、欧、北美三洲的陆地和岛屿。\n\n【中心】\n北极地区以海洋为中心（北冰洋）。\n\n【气候特点】\n1. 气温：比南极地区高（因为北极地区以海洋为主，海拔低，而南极地区以陆地为主，海拔高，冰雪覆盖）\n2. 降水：比南极地区多，年降水量一般在100-250毫米\n3. 风速：比南极地区小，远不及南极\n\n【代表动物】\n北极熊、北极狐、海豹、海象、鲸等。北极熊是北极地区的代表性动物，有\"冰海霸王\"之称。\n\n【自然资源】\n1. 矿产资源：石油、天然气、煤、铁等资源丰富\n2. 生物资源：北极熊、北极狐、海象等\n3. 渔业资源：北冰洋海域有丰富的渔业资源\n\n【居民】\n北极地区有长期居住的居民——因纽特人（属于黄色人种，也叫爱斯基摩人），传统以狩猎和捕鱼为生，住雪屋，狗拉雪橇是传统的交通工具。\n\n【战略地位】\n北冰洋沿岸是亚洲、欧洲、北美洲三大洲空中交通的捷径，战略地位重要。","id":"g1_geography_l028","semester":"lower"},{"chapter":"第十章 极地地区","name":"极地科学考察","formula":"天然实验室，我国极地科考站","explanation":"【科学考察的宝地】\n极地地区是研究地球环境的\"天然实验室\"。\n\n【南极地区科考价值】\n1. 原始的自然环境，为科学家们进行气象、冰川、地质、海洋、生物等学科的科学研究，提供了领域最为广阔的天然实验室\n2. 丰富的自然资源：矿产资源、淡水资源、海洋生物资源等\n3. 研究全球气候变化：南极冰芯可以反映地球气候变化的历史\n\n【我国的极地科学考察站】\n1. 南极地区：\n   - 长城站：1985年建立，我国第一个南极科考站，位于乔治王岛，在南极圈以北，无极昼极夜现象\n   - 中山站：1989年建立，位于东南极大陆沿海，有极昼极夜现象\n   - 昆仑站：2009年建立，我国首个南极内陆考察站，位于南极冰盖最高点冰穹A地区\n   - 泰山站：2014年建立，南极内陆考察的度夏站\n   - 罗斯海新站：2018年开工建设，位于南极罗斯海地区\n2. 北极地区：\n   - 黄河站：2004年建立，位于挪威斯瓦尔巴群岛，是我国首个北极科考站\n\n【科考时间】\n1. 南极考察：每年11月到次年3月，是南极地区的暖季，气温较高，且有极昼现象，便于考察\n2. 北极考察：每年6-8月，是北极地区的暖季，有极昼现象\n\n【南极科考的意义】\n体现了我国的综合国力和科技水平，在国际极地事务中发挥着越来越重要的作用。","id":"g1_geography_l029","semester":"lower"},{"chapter":"第十章 极地地区","name":"极地地区的环境保护","formula":"《南极条约》，极地的环境问题，保护极地","explanation":"【极地的环境问题】\n1. 全球气候变暖：导致极地地区冰川、海冰消融速度加快，威胁极地生物的生存，也会导致海平面上升，威胁沿海低地\n2. 人类活动的破坏：\n   - 南极地区：捕鲸等活动，导致鲸等极地动物数量减少\n   - 北极地区：石油、天然气等资源的开采和加工，导致环境污染\n3. 臭氧层空洞：南极上空出现臭氧层空洞，危害地球生态\n4. 海洋污染：石油泄漏等污染事件，破坏极地生态环境\n5. 生物多样性减少：极地生物的生存环境受到威胁\n\n【为什么要保护极地地区】\n1. 极地地区是研究地球环境的\"天然实验室\"\n2. 极地地区有丰富的自然资源\n3. 极地地区的生态环境变化会影响全球气候和生态系统\n4. 极地地区是全人类共同的财富，需要全人类共同保护\n\n【保护措施】\n1. 《南极条约》：\n   - 签订时间：1959年12月，12个国家签订\n   - 主要内容：南极地区只用于和平目的，禁止一切军事活动和任何核爆炸或处理放射性废物等，保护南极的生态环境，保证科学考察的自由等\n   - 我国加入时间：1983年正式加入《南极条约》\n2. 《北极环境保护战略》等\n3. 国际合作：各国加强合作，共同保护极地地区\n4. 个人行动：增强环保意识，减少温室气体排放，践行低碳生活等\n\n【我国的态度】\n我国一贯主张和平利用南极地区，积极参与极地环境保护，是极地环境保护的重要力量。","id":"g1_geography_l030","semester":"lower"}];
