    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"id":"g2_physics_001","chapter":"第一章 机械运动","name":"长度的单位与测量","formula":"1 km = 1000 m\n1 m = 10 dm = 100 cm = 1000 mm\n1 mm = 1000 μm = 1 000 000 nm","explanation":"国际单位制中，长度的基本单位是米（m）。\n\n常用单位：\n- 千米（km）、米（m）、分米（dm）、厘米（cm）、毫米（mm）\n- 微米（μm）、纳米（nm）\n\n测量工具：刻度尺\n使用规则：\n1. 选：根据测量需要选择合适量程和分度值的刻度尺\n2. 放：零刻度线对准被测物体一端，刻度线紧贴被测物体\n3. 看：视线与刻度线垂直\n4. 读：读出准确值和估计值，注明单位\n5. 记：测量值 = 准确值 + 估计值 + 单位","semester":"upper"},{"id":"g2_physics_002","chapter":"第一章 机械运动","name":"时间的单位与测量","formula":"1 h = 60 min = 3600 s\n1 min = 60 s\n1 s = 1000 ms","explanation":"国际单位制中，时间的基本单位是秒（s）。\n\n常用单位：小时（h）、分钟（min）、秒（s）、毫秒（ms）。\n\n测量工具：停表（秒表）\n\n误差：\n- 误差是测量值与真实值之间的差异\n- 误差只能减小，不能避免\n- 减小误差的方法：多次测量取平均值、使用更精密的测量工具","semester":"upper"},{"id":"g2_physics_003","chapter":"第一章 机械运动","name":"机械运动与参照物","formula":"运动 = 位置变化（相对于参照物）","explanation":"在物理学中，把一个物体相对于另一个物体位置的改变叫做机械运动，简称运动。\n\n参照物：\n- 研究机械运动时，被选作标准的物体叫做参照物\n- 参照物可以任意选择，但一旦选定，就认为它是静止的\n- 同一物体是运动还是静止，取决于所选的参照物，这叫运动和静止的相对性","semester":"upper"},{"id":"g2_physics_004","chapter":"第一章 机械运动","name":"速度的概念与公式","formula":"v = s / t\n（v：速度，单位 m/s；s：路程，单位 m；t：时间，单位 s）","explanation":"速度是表示物体运动快慢的物理量。\n\n单位：\n- 国际单位：米/秒（m/s 或 m·s⁻¹）\n- 常用单位：千米/小时（km/h）\n- 换算：1 m/s = 3.6 km/h\n\n匀速直线运动：\n- 物体沿着直线且速度不变的运动\n- 公式：v = s / t（速度恒定，路程与时间成正比）","semester":"upper"},{"id":"g2_physics_005","chapter":"第一章 机械运动","name":"平均速度","formula":"v̄ = s总 / t总","explanation":"平均速度表示物体在某一段路程（或某一段时间）内的平均快慢程度。\n\n注意：\n1. 平均速度不是速度的平均值\n2. 平均速度 = 总路程 ÷ 总时间\n3. 平均速度的数值与所选的路程或时间有关","semester":"upper"},{"id":"g2_physics_006","chapter":"第二章 声现象","name":"声音的产生与传播","formula":"v声（空气，15°C）= 340 m/s\nv声（空气，25°C）= 346 m/s","explanation":"声音的产生：\n- 声音是由物体振动产生的\n- 振动停止，发声也停止（注意：此时仍可能有余音）\n\n声音的传播：\n- 声音需要介质（固体、液体、气体）才能传播，真空不能传声\n- 声音在不同介质中传播速度不同：固体 > 液体 > 气体\n- 声音在空气（15°C）中传播速度约为 340 m/s\n- 声音以波的形式传播，叫做声波","semester":"upper"},{"id":"g2_physics_007","chapter":"第二章 声现象","name":"声音的三要素","formula":"f = 1 / T（频率与周期互为倒数）","explanation":"声音的三要素：音调、响度、音色\n\n1. 音调：\n   - 声音的高低，由频率决定\n   - 频率：每秒内振动的次数，单位 Hz\n   - 频率越高，音调越高\n\n2. 响度：\n   - 声音的强弱（大小），由振幅决定\n   - 振幅：振动的幅度\n   - 振幅越大，响度越大\n   - 离声源越近，响度越大\n\n3. 音色：\n   - 声音的品质，由发声体本身决定\n   - 不同物体发出的声音音色不同","semester":"upper"},{"id":"g2_physics_008","chapter":"第二章 声现象","name":"超声波与次声波","formula":"人耳听觉范围：20 Hz ~ 20 000 Hz","explanation":"人耳能听到的声音频率范围：20 Hz ~ 20 000 Hz\n\n超声波：频率高于 20 000 Hz 的声音\n- 应用：B超、潜艇声呐、金属内部缺陷检测、灭鼠驱虫\n\n次声波：频率低于 20 Hz 的声音\n- 产生：地震、火山喷发、海啸、台风、机器振动\n- 危害：能破坏建筑物，损害人体健康\n- 应用：预测地震、台风，监测核爆炸","semester":"upper"},{"id":"g2_physics_009","chapter":"第二章 声现象","name":"噪声的危害与控制","formula":"0 dB 是人耳听觉下限\n> 90 dB 影响听力","explanation":"噪声：\n- 从物理学角度：发声体做无规则振动时发出的声音\n- 从环境保护角度：凡是妨碍人们正常休息、学习和工作的声音，以及对人们要听的声音起干扰作用的声音\n\n控制途径：\n1. 在声源处减弱（消声）\n2. 在传播过程中减弱（吸声、隔声）\n3. 在人耳处减弱（戴耳塞、护耳器）\n\n分贝（dB）是声音强弱的单位。","semester":"upper"},{"id":"g2_physics_010","chapter":"第三章 物态变化","name":"温度与温度计","formula":"T(K) = t(°C) + 273.15","explanation":"温度：表示物体冷热程度的物理量。\n\n单位：\n- 摄氏温度（°C）：冰水混合物为 0°C，沸水为 100°C\n- 热力学温度（K）：以 -273.15°C 为绝对零度\n- 换算：T = t + 273.15\n\n温度计：\n- 原理：液体的热胀冷缩\n- 使用：\n  1. 估：估计被测温度，选用合适量程的温度计\n  2. 浸：玻璃泡全部浸入液体中，不碰容器底和壁\n  3. 读：待示数稳定后读数，视线与液柱上表面相平\n  4. 取：读数时不能将温度计从液体中取出","semester":"upper"},{"id":"g2_physics_011","chapter":"第三章 物态变化","name":"熔化和凝固","formula":"晶体熔化条件：达到熔点 + 继续吸热","explanation":"物质从固态变成液态的过程叫熔化。\n物质从液态变成固态的过程叫凝固。\n\n固体分类：\n- 晶体：海波、冰、各种金属等，有固定熔点\n- 非晶体：松香、玻璃、蜡、沥青等，没有固定熔点\n\n晶体熔化特点：\n- 吸热但温度保持不变（熔点）\n- 熔液共存\n\n晶体凝固特点：\n- 放热但温度保持不变（凝固点）\n- 同一晶体的熔点和凝固点相同","semester":"upper"},{"id":"g2_physics_012","chapter":"第三章 物态变化","name":"汽化和液化","formula":"影响蒸发快慢：温度、表面积、空气流动","explanation":"汽化：物质从液态变为气态的过程（吸热）。\n液化：物质从气态变为液态的过程（放热）。\n\n汽化两种方式：\n1. 蒸发：\n   - 在任何温度下都能发生，只在液体表面进行\n   - 影响因素：液体温度、表面积、空气流动\n   - 蒸发吸热有致冷作用\n2. 沸腾：\n   - 在一定温度（沸点）下发生，在液体内部和表面同时进行\n   - 条件：达到沸点 + 继续吸热\n   - 液体沸腾时吸热但温度不变","semester":"upper"},{"id":"g2_physics_013","chapter":"第三章 物态变化","name":"升华和凝华","formula":"升华吸热；凝华放热","explanation":"升华：物质从固态直接变成气态的过程（吸热）。\n凝华：物质从气态直接变成固态的过程（放热）。\n\n常见现象：\n- 升华：樟脑丸变小、冬天冰冻的衣服变干、灯丝变细\n- 凝华：霜、雪、雾凇、冰花、碘蒸气遇冷凝华\n\n应用：\n- 人工降雨：干冰升华吸热，使空气中水蒸气液化\n- 舞台烟雾：干冰升华使空气中的水蒸气液化形成小水滴","semester":"upper"},{"id":"g2_physics_014","chapter":"第四章 光现象","name":"光的直线传播","formula":"光速 c ≈ 3 × 10⁸ m/s","explanation":"光在同种均匀介质中沿直线传播。\n\n光速：\n- 真空中的光速 c = 3 × 10⁸ m/s（自然界中最大的速度）\n- 空气中的光速略小于真空\n- 光在水中的速度约为真空的 3/4\n- 光在玻璃中的速度约为真空的 2/3\n\n应用：\n- 激光准直\n- 影子的形成\n- 日食、月食的形成\n- 小孔成像","semester":"upper"},{"id":"g2_physics_015","chapter":"第四章 光现象","name":"光的反射定律","formula":"∠r = ∠i\n（反射角等于入射角）","explanation":"光射到物体表面时，被物体表面反射回去的现象叫光的反射。\n\n反射定律：\n1. 反射光线、入射光线与法线在同一平面内\n2. 反射光线和入射光线分居法线两侧\n3. 反射角等于入射角（∠r = ∠i）\n\n两种反射：\n- 镜面反射：反射面光滑，平行光反射后仍平行\n- 漫反射：反射面凹凸不平，平行光反射后射向各个方向（我们能从不同方向看到物体是因为漫反射）","semester":"upper"},{"id":"g2_physics_016","chapter":"第四章 光现象","name":"平面镜成像","formula":"像距 = 物距\n像与物大小相等","explanation":"平面镜成像特点：\n1. 像与物大小相等\n2. 像与物到平面镜的距离相等（像距 = 物距）\n3. 像与物左右相反\n4. 像是正立的虚像（不是实际光线会聚而成）\n\n原理：光的反射。\n\n应用：\n- 日常生活：穿衣镜、整理仪容\n- 医学：口腔镜\n- 改变光路：潜望镜","semester":"upper"},{"id":"g2_physics_017","chapter":"第四章 光现象","name":"光的折射","formula":"光从空气斜射入水/玻璃：折射角 < 入射角","explanation":"光从一种介质斜射入另一种介质时，传播方向发生偏折的现象叫光的折射。\n\n折射定律：\n1. 折射光线、入射光线、法线在同一平面内\n2. 折射光线和入射光线分居法线两侧\n3. 光从空气斜射入水或其他介质时，折射角小于入射角\n4. 光从水或其他介质斜射入空气时，折射角大于入射角\n5. 当光线垂直射入时，传播方向不变\n\n现象：\n- 池水变浅\n- 筷子在水中\"折断\"\n- 海市蜃楼\n- 彩虹","semester":"upper"},{"id":"g2_physics_018","chapter":"第四章 光现象","name":"光的色散","formula":"红光偏折最小，紫光偏折最大","explanation":"太阳光（白光）通过三棱镜后，被分解成红、橙、黄、绿、蓝、靛、紫七种色光的现象叫光的色散。\n\n色光三原色：红、绿、蓝\n颜料三原色：品红、黄、青\n\n透明物体的颜色由它透过的色光决定；\n不透明物体的颜色由它反射的色光决定。","semester":"upper"},{"id":"g2_physics_019","chapter":"第五章 透镜及其应用","name":"凸透镜与凹透镜","formula":"凸透镜：对光有会聚作用\n凹透镜：对光有发散作用","explanation":"透镜：\n- 凸透镜：中间厚、边缘薄，对光有会聚作用\n- 凹透镜：中间薄、边缘厚，对光有发散作用\n\n基本概念：\n- 主光轴：通过透镜两个球面球心的直线\n- 光心（O）：主光轴上的特殊点，光线通过光心方向不变\n- 焦点（F）：平行于主光轴的光线经透镜后会聚（或反向延长线会聚）的点\n- 焦距（f）：焦点到光心的距离\n\n三条特殊光线：\n1. 平行于主光轴的光线经凸透镜后过焦点\n2. 过焦点的光线经凸透镜后平行于主光轴\n3. 过光心的光线传播方向不变","semester":"upper"},{"id":"g2_physics_020","chapter":"第五章 透镜及其应用","name":"凸透镜成像规律","formula":"1/u + 1/v = 1/f","explanation":"凸透镜成像规律（u 为物距，f 为焦距）：\n\n1. u > 2f：倒立、缩小的实像（应用：照相机）\n2. u = 2f：倒立、等大的实像（应用：测焦距）\n3. f < u < 2f：倒立、放大的实像（应用：投影仪、幻灯机）\n4. u = f：不成像（应用：得到平行光）\n5. u < f：正立、放大的虚像（应用：放大镜）\n\n实像：能用光屏承接；\n虚像：不能被光屏承接，只能用眼睛看到。","semester":"upper"},{"id":"g2_physics_021","chapter":"第五章 透镜及其应用","name":"眼睛与眼镜","formula":"近视眼戴凹透镜\n远视眼戴凸透镜","explanation":"眼睛：\n- 晶状体和角膜的共同作用相当于凸透镜\n- 视网膜相当于光屏\n- 成像：在视网膜上成倒立、缩小的实像\n\n近视眼：\n- 原因：晶状体太厚、折光能力太强或眼球前后径过长\n- 像成在视网膜前方\n- 矫正：配戴凹透镜\n\n远视眼（老花眼）：\n- 原因：晶状体太薄、折光能力太弱或眼球前后径过短\n- 像成在视网膜后方\n- 矫正：配戴凸透镜","semester":"upper"},{"id":"g2_physics_022","chapter":"第五章 透镜及其应用","name":"显微镜与望远镜","formula":"显微镜：物镜 + 目镜（都是凸透镜）","explanation":"显微镜：\n- 物镜：相当于投影仪，成倒立、放大的实像\n- 目镜：相当于放大镜，把物镜成的实像再次放大成虚像\n- 物体最终成倒立、放大的虚像\n\n望远镜：\n- 开普勒望远镜：物镜（使远处物体成缩小的实像）+ 目镜（放大虚像）\n- 最终成倒立、缩小的虚像（视角被放大）","semester":"upper"},{"id":"g2_physics_023","chapter":"第一章 机械运动","name":"测量平均速度","formula":"v̄ = s / t","explanation":"测量平均速度实验：\n\n实验原理：v̄ = s / t\n\n实验器材：斜面、小车、刻度尺、停表、金属片\n\n实验步骤：\n1. 使斜面保持一定坡度\n2. 用刻度尺测出小车通过的路程 s\n3. 用停表测出小车通过该路程所用的时间 t\n4. 改变斜面坡度或路程，重复实验\n\n注意事项：\n- 斜面坡度不宜过小（否则小车运动太慢）\n- 释放小车时应从同一位置由静止释放\n- 测量时间时应在小车开始下滑时开始计时，到达终点时停止计时","semester":"upper"},{"id":"g2_physics_024","chapter":"第二章 声现象","name":"声音在不同介质中的传播","formula":"v（固体）> v（液体）> v（气体）","explanation":"声音传播速度：\n- 在不同介质中传播速度不同\n- 一般情况下：v（固体）> v（液体）> v（气体）\n- 同种介质中，温度越高，传播速度越快\n\n应用：\n- 古代行军：士兵枕着牛皮箭筒睡觉，能及早听到敌方骑兵的马蹄声\n- 水中声呐：探测水下目标\n- 医学：听诊器","semester":"upper"},{"id":"g2_physics_025","chapter":"第四章 光现象","name":"红外线与紫外线","formula":"红外线：热作用强\n紫外线：化学作用强","explanation":"红外线：\n- 位于红光外侧，人眼看不见\n- 特性：热作用强\n- 应用：红外线遥感、红外线加热、红外线测温仪、夜视仪、遥控器\n\n紫外线：\n- 位于紫光外侧，人眼看不见\n- 特性：化学作用强，能使荧光物质发光\n- 应用：验钞机、紫外线消毒、合成维生素D、鉴别古字画\n- 危害：过强紫外线可伤害眼睛和皮肤","semester":"upper"},{"id":"g2_physics_026","chapter":"第三章 物态变化","name":"熔化与凝固图象","formula":"晶体有固定熔点；非晶体没有","explanation":"晶体熔化图象（以海波为例）：\n- 横轴：加热时间（t）\n- 纵轴：温度（T）\n- AB段：固态，吸热升温\n- BC段：固液共存，吸热但温度不变（熔点）\n- CD段：液态，吸热升温\n\n非晶体熔化图象（以蜡为例）：\n- 持续吸热，持续升温，没有固定熔点\n\n凝固图象与熔化图象相反：\n- 晶体凝固时放热温度不变（凝固点）","semester":"upper"},{"id":"g2_physics_027","chapter":"第五章 透镜及其应用","name":"生活中的透镜","formula":"照相机 u>2f\n投影仪 f<u<2f\n放大镜 u<f","explanation":"生活中的透镜应用：\n\n1. 照相机：\n   - 镜头相当于凸透镜\n   - u > 2f，成倒立、缩小的实像\n   - 像是光屏（底片）上的实际光线会聚而成\n\n2. 投影仪（幻灯机）：\n   - 镜头相当于凸透镜\n   - f < u < 2f，成倒立、放大的实像\n   - 平面镜的作用：改变光的传播方向\n\n3. 放大镜：\n   - 物体在焦点以内（u < f）\n   - 成正立、放大的虚像\n   - 物距越大，虚像越大（但最大不超过物体2倍）","semester":"upper"},{"id":"g2_physics_028","chapter":"第四章 光现象","name":"光现象的辨析与应用","formula":"光直线传播、反射、折射的区别","explanation":"三种光现象辨析：\n\n1. 光的直线传播：\n   - 同种均匀介质中光沿直线传播\n   - 现象：影子、日食、月食、小孔成像\n\n2. 光的反射：\n   - 光射到物体表面被反射回去\n   - 反射角 = 入射角\n   - 现象：平面镜成像、看见不发光的物体\n\n3. 光的折射：\n   - 光从一种介质斜射入另一种介质\n   - 现象：池水变浅、海市蜃楼、彩虹、铅笔在水中\"折断\"","semester":"upper"},{"id":"g2_physics_029","chapter":"第六章 质量与密度","name":"质量及其测量","formula":"m_总 = m1 + m2 + ...","explanation":"质量：物体所含物质的多少。\n\n性质：\n- 质量是物体本身的一种属性，与物体的形状、状态、位置无关\n- 单位：t、kg、g、mg\n- 换算：1 t = 1000 kg，1 kg = 1000 g，1 g = 1000 mg\n\n测量工具：托盘天平\n使用步骤：\n1. 看：量程、分度值\n2. 放：水平台面上，游码归零\n3. 调：调节平衡螺母使横梁平衡\n4. 称：左物右码，砝码由大到小\n5. 读：m物体 = m砝码 + m游码\n6. 收：砝码归盒，游码归零","semester":"lower"},{"id":"g2_physics_030","chapter":"第六章 质量与密度","name":"密度的概念与公式","formula":"ρ = m / V\n（ρ：密度，m：质量，V：体积）","explanation":"密度：单位体积某种物质的质量。\n\n性质：\n- 密度是物质的一种特性，与物体的质量、体积无关（与温度、状态有关）\n- 单位：kg/m³ 或 g/cm³\n- 换算：1 g/cm³ = 1000 kg/m³ = 10³ kg/m³\n\n常见物质密度（水=1.0 g/cm³）：\n- 铝 2.7 g/cm³\n- 铁 7.9 g/cm³\n- 铜 8.9 g/cm³\n- 水银 13.6 g/cm³","semester":"lower"},{"id":"g2_physics_031","chapter":"第六章 质量与密度","name":"密度的应用","formula":"m = ρV\nV = m / ρ","explanation":"密度公式变形：\n- m = ρV（已知体积求质量）\n- V = m / ρ（已知质量求体积）\n\n应用：\n1. 鉴别物质：测出密度，对照密度表\n2. 求质量：不便直接称量时，测体积查密度计算\n3. 求体积：不便直接测量时，称质量查密度计算\n4. 判断空心实心：\n   - 假设实心，计算密度与物质密度比较\n   - 假设实心，计算体积与物体体积比较","semester":"lower"},{"id":"g2_physics_032","chapter":"第六章 质量与密度","name":"测量物质的密度","formula":"ρ = m / V","explanation":"实验原理：ρ = m / V\n\n实验器材：天平、量筒、烧杯、水、待测物体\n\n实验步骤：\n1. 用天平测量物体质量 m\n2. 在量筒中倒入适量水，读体积 V1\n3. 用细线系住物体放入量筒，读体积 V2\n4. 计算 V = V2 - V1\n5. 计算 ρ = m / V\n\n注意事项：\n- 测量顺序：先测质量，再测体积（避免水使物体沾水影响质量测量）\n- 量筒读数：视线与凹液面最低处相平\n- 适量水：能浸没物体且能读出物体放入后体积","semester":"lower"},{"id":"g2_physics_033","chapter":"第七章 力","name":"力的概念与作用效果","formula":"力的单位：牛顿（N）","explanation":"力：物体对物体的作用。\n\n力的作用效果：\n1. 改变物体的形状（使物体发生形变）\n2. 改变物体的运动状态（速度大小或方向改变）\n\n力的三要素：大小、方向、作用点。\n\n单位：牛顿（N），1 N 大约等于拿起 2 个鸡蛋的力。\n\n力的相互性：\n- 物体间力的作用是相互的\n- 一个物体对另一个物体施力时，也一定受到另一个物体对它的力\n- 作用力与反作用力大小相等，方向相反，作用在两个不同物体上","semester":"lower"},{"id":"g2_physics_034","chapter":"第七章 力","name":"弹力与弹簧测力计","formula":"F = kx（胡克定律）","explanation":"弹力：物体发生弹性形变时产生的力。\n\n条件：\n- 物体间相互接触\n- 发生弹性形变\n\n常见弹力：压力、支持力、推力、拉力、绳的拉力等。\n\n弹簧测力计：\n- 原理：在弹性限度内，弹簧的伸长量与所受拉力成正比\n- 使用：\n  1. 看清量程、分度值\n  2. 校零\n  3. 拉力方向沿弹簧轴线方向\n  4. 读数时视线与刻度盘相平","semester":"lower"},{"id":"g2_physics_035","chapter":"第七章 力","name":"重力","formula":"G = mg\ng = 9.8 N/kg","explanation":"重力：由于地球吸引而使物体受到的力。\n\n符号：G\n单位：N\n方向：竖直向下（不是垂直向下）\n作用点：重心（质量分布均匀的物体的重心在几何中心）\n\n重力与质量的关系：\n- G = m × g\n- g = 9.8 N/kg，物理意义：质量为 1 kg 的物体受到的重力为 9.8 N\n- g 在地球不同位置略有不同\n\n注意：重力是物体受到的力，地球对物体的万有引力的一个分力。","semester":"lower"},{"id":"g2_physics_036","chapter":"第七章 力","name":"摩擦力","formula":"f = μN","explanation":"摩擦力：两个相互接触的物体发生相对运动或有相对运动趋势时，在接触面上产生的阻碍相对运动的力。\n\n分类：\n1. 滑动摩擦力：\n   - 方向：与相对运动方向相反\n   - 大小：与压力、接触面粗糙程度有关，与速度无关\n2. 静摩擦力：\n   - 方向：与相对运动趋势方向相反\n   - 大小：随外力的变化而变化\n3. 滚动摩擦力：比滑动摩擦力小得多\n\n增大有益摩擦：增大压力、使接触面更粗糙\n减小有害摩擦：减小压力、使接触面光滑、加润滑油、用滚动代替滑动","semester":"lower"},{"id":"g2_physics_037","chapter":"第八章 运动和力","name":"牛顿第一定律","formula":"一切物体在没有受到外力作用时\n总保持静止或匀速直线运动状态","explanation":"牛顿第一定律（惯性定律）：\n一切物体在没有受到外力作用时，总保持静止状态或匀速直线运动状态。\n\n说明：\n1. 该定律是在大量经验事实基础上，通过进一步的推理而概括出来的\n2. 不受力的物体是不存在的，所以牛顿第一定律是理想情况\n3. 力是改变物体运动状态的原因\n4. 物体的运动不需要力来维持","semester":"lower"},{"id":"g2_physics_038","chapter":"第八章 运动和力","name":"惯性","formula":"一切物体都有保持原来运动状态的性质","explanation":"惯性：物体保持原来运动状态不变的性质。\n\n性质：\n1. 一切物体在任何时候都具有惯性\n2. 惯性大小只与质量有关，质量越大惯性越大\n3. 惯性不是力，不能说「受到惯性作用」\n\n应用：\n- 跳远前的助跑\n- 拍打衣服上的灰尘\n- 锤头松了用撞击方法套紧\n- 安全带的作用","semester":"lower"},{"id":"g2_physics_039","chapter":"第八章 运动和力","name":"二力平衡","formula":"F1 = F2\n方向相反、作用在同一直线上、同一物体上","explanation":"二力平衡：物体在两个力的作用下保持静止或匀速直线运动状态。\n\n二力平衡条件（四同三不同原则）：\n1. 大小相等\n2. 方向相反\n3. 作用在同一直线上\n4. 作用在同一物体上\n\n注意：\n- 平衡力与相互作用力的区别：平衡力作用在同一物体上，相互作用力作用在不同物体上\n- 物体受平衡力时，一定处于静止或匀速直线运动状态","semester":"lower"},{"id":"g2_physics_040","chapter":"第八章 运动和力","name":"同一直线上二力的合成","formula":"同方向：F = F1 + F2\n反方向：F = |F1 - F2|","explanation":"合力：如果一个力产生的效果跟几个力共同作用产生的效果相同，这个力就叫做那几个力的合力。\n\n同一直线上二力的合成：\n1. 同方向：F合 = F1 + F2，方向与 F1、F2 相同\n2. 反方向：F合 = |F1 - F2|，方向与较大的力相同\n\n注意：\n- 合力可以大于、等于或小于任一分力\n- 合力是等效替代，不是真正存在的力","semester":"lower"},{"id":"g2_physics_041","chapter":"第九章 压强","name":"压强的概念与公式","formula":"p = F / S\n单位：Pa（帕斯卡），1 Pa = 1 N/m²","explanation":"压强：物体所受压力的大小与受力面积之比。\n\n物理意义：表示压力作用效果的物理量。\n\n公式：p = F / S\n- F：压力（单位 N）\n- S：受力面积（单位 m²）\n- p：压强（单位 Pa）\n\n应用：\n- 增大压强：增大压力、减小受力面积\n- 减小压强：减小压力、增大受力面积\n\n实例：\n- 啄木鸟的嘴尖、针尖、刀刃\n- 书包带宽、坦克履带、滑雪板","semester":"lower"},{"id":"g2_physics_042","chapter":"第九章 压强","name":"液体的压强","formula":"p = ρgh\n（ρ：液体密度，g = 9.8 N/kg，h：深度）","explanation":"液体压强：\n- 由于液体受到重力且具有流动性，所以液体对容器底和侧壁都有压强\n- 液体内部向各个方向都有压强\n\n液体压强公式：p = ρ液 g h\n- 适用条件：静止液体\n- 深度 h：液面到所求点的竖直距离\n- 同一深度，液体向各个方向压强相等\n- 深度越深，压强越大\n- 密度越大，压强越大\n\n连通器原理：\n- 上端开口、下部相连通的容器叫连通器\n- 连通器里同一种液体不流动时，各容器中液面总保持相平","semester":"lower"},{"id":"g2_physics_043","chapter":"第九章 压强","name":"大气压强","formula":"p0 ≈ 1.013 × 10⁵ Pa\n（标准大气压）","explanation":"大气压强：大气对浸在它里面的物体产生的压强。\n\n产生原因：\n- 空气受到重力作用且具有流动性\n\n标准大气压：\n- 1 标准大气压 = 760 mm 汞柱 = 1.013 × 10⁵ Pa\n- 大气压随高度增加而减小\n- 一切液体的沸点随气压降低而降低\n\n证明大气压存在的实验：\n- 马德堡半球实验\n- 覆杯实验\n\n测量工具：水银气压计、无液气压计","semester":"lower"},{"id":"g2_physics_044","chapter":"第九章 压强","name":"流体压强与流速的关系","formula":"流速越大，压强越小","explanation":"流体：液体和气体的统称。\n\n流速与压强的关系：\n- 在流体中，流速越大的地方，压强越小\n- 流速越小的地方，压强越大\n\n应用：\n1. 飞机机翼：上方凸起，下方平直。飞行时上方空气流速大、压强小，下方流速小、压强大，产生向上的升力。\n2. 火车站台安全线：火车通过时，靠近车身边缘空气流速大、压强小，远离的一侧大气压会把人推向火车。\n3. 喷雾器：\n4. 乒乓球的弧圈球：","semester":"lower"},{"id":"g2_physics_045","chapter":"第十章 浮力","name":"浮力的概念","formula":"F浮 = F下 - F上（压力差法）","explanation":"浮力：浸在液体（或气体）中的物体受到液体（或气体）向上的托力。\n\n方向：竖直向上\n施力物体：液体（或气体）\n\n称重法：F浮 = G物 - F示（物体在空气中的重力减去浸在液体中时弹簧测力计的示数）\n\n浮力产生原因：\n- 液体对物体上下表面的压力差\n- F浮 = F下表面 - F上表面\n- 当物体下表面没有液体时（如物体紧贴容器底部），F浮 = 0（特例）","semester":"lower"},{"id":"g2_physics_046","chapter":"第十章 浮力","name":"阿基米德原理","formula":"F浮 = G排 = ρ液 g V排","explanation":"阿基米德原理：\n浸在液体中的物体所受的浮力，等于它排开的液体所受的重力。\n\n公式：F浮 = G排液 = m排g = ρ液gV排\n- 适用：液体和气体\n- V排：物体排开液体的体积（不一定等于物体体积）\n- 当物体完全浸没时：V排 = V物\n- 当物体部分浸没时：V排 < V物\n\n注意：\n- 浮力大小只与液体密度和 V排 有关\n- 与物体本身的密度、形状、浸没深度无关","semester":"lower"},{"id":"g2_physics_047","chapter":"第十章 浮力","name":"物体的浮沉条件","formula":"漂浮：F浮 = G物\n悬浮：F浮 = G物且V排 = V物","explanation":"物体的浮沉：\n\n1. 下沉：F浮 < G物（ρ物 > ρ液）\n2. 悬浮：F浮 = G物（ρ物 = ρ液），可停留在液体内部任何位置\n3. 上浮：F浮 > G物（ρ物 < ρ液），最终漂浮\n4. 漂浮：F浮 = G物（ρ物 < ρ液），静止在液面上，部分浸入\n\n判断方法：\n- 比较 F浮 和 G 的大小\n- 比较 ρ物 和 ρ液 的大小（实心物体）\n\n注意：\n- 漂浮时 V排 < V物\n- 悬浮和漂浮都是平衡状态，F浮 = G物\n- 潜水艇：靠改变自身重力实现上浮和下沉","semester":"lower"},{"id":"g2_physics_048","chapter":"第十章 浮力","name":"浮力的应用","formula":"F浮 = ρ液gV排","explanation":"浮力应用：\n\n1. 轮船：\n   - 用钢铁制成，制成空心增大 V排，增大 F浮\n   - 排水量：满载时排开水的质量\n\n2. 潜水艇：\n   - 通过向水舱中充水或排水改变自身重力\n   - F浮不变（V排不变），改变 G 实现浮沉\n\n3. 气球、飞艇：\n   - 内部充入密度小于空气的气体（氢气、氦气、热空气）\n   - F浮 > G 时升空\n\n4. 密度计：\n   - 漂浮在液面，F浮 = G\n   - 液体密度越小，密度计浸入越深","semester":"lower"},{"id":"g2_physics_049","chapter":"第十一章 功和机械能","name":"功的概念与公式","formula":"W = Fs\n（W：功，F：力，s：沿力的方向移动的距离）","explanation":"功：力与物体在力的方向上移动距离的乘积。\n\n公式：W = Fs\n- 单位：J（焦耳），1 J = 1 N·m\n- 1 J 约等于把 1 个鸡蛋举高 1 m 做的功\n\n做功的两个必要因素：\n1. 作用在物体上的力\n2. 物体在力的方向上移动了一段距离\n\n不做功的三种情况：\n1. 物体不受力但运动（如冰在光滑冰面上滑行）\n2. 物体受力但没有移动\n3. 物体受力且移动，但力的方向与运动方向垂直","semester":"lower"},{"id":"g2_physics_050","chapter":"第十一章 功和机械能","name":"功率","formula":"P = W / t = Fv","explanation":"功率：单位时间内所做的功。\n\n物理意义：表示做功快慢的物理量。\n\n公式：\n- 定义式：P = W / t\n- 变形：P = Fv（v 为匀速运动速度）\n\n单位：W（瓦特），1 W = 1 J/s\n常用单位：kW（千瓦），1 kW = 1000 W\n\n注意：\n- 功率大不一定做功多，做功多不一定功率大\n- 功率与机械效率无关","semester":"lower"},{"id":"g2_physics_051","chapter":"第十一章 功和机械能","name":"动能和势能","formula":"Ek = ½mv²\nEp = mgh","explanation":"动能：物体由于运动而具有的能。\n- 大小与质量、速度有关\n- 公式：Ek = ½mv²\n- 质量越大、速度越大，动能越大\n\n势能：\n1. 重力势能：物体由于被举高而具有的能\n   - 大小与质量、被举高度有关\n   - 公式：Ep = mgh\n   - 质量越大、高度越高，重力势能越大\n\n2. 弹性势能：物体由于发生弹性形变而具有的能\n   - 与弹性形变程度有关\n   - 形变程度越大，弹性势能越大\n\n统称机械能：动能 + 势能","semester":"lower"},{"id":"g2_physics_052","chapter":"第十一章 功和机械能","name":"机械能及其转化","formula":"E机械 = Ek + Ep","explanation":"机械能转化：\n- 动能和势能可以相互转化\n- 转化过程中，若不计摩擦、空气阻力等，机械能总量保持不变（机械能守恒）\n\n实例：\n- 滚摆：下降时重力势能转化为动能；上升时动能转化为重力势能\n- 单摆：最高点势能最大、最低点动能最大\n- 弹簧：压缩时弹性势能增大\n- 过山车\n- 撑杆跳：动能 → 弹性势能 → 重力势能","semester":"lower"},{"id":"g2_physics_053","chapter":"第十二章 简单机械","name":"杠杆","formula":"F1 × L1 = F2 × L2","explanation":"杠杆：在力的作用下能绕着固定点转动的硬棒。\n\n五要素：\n1. 支点 O：杠杆绕着转动的点\n2. 动力 F1：使杠杆转动的力\n3. 阻力 F2：阻碍杠杆转动的力\n4. 动力臂 L1：支点到动力作用线的距离\n5. 阻力臂 L2：支点到阻力作用线的距离\n\n杠杆平衡条件：F1 × L1 = F2 × L2（动力×动力臂 = 阻力×阻力臂）\n\n杠杆分类：\n1. 省力杠杆：L1 > L2，F1 < F2，但费距离\n2. 费力杠杆：L1 < L2，F1 > F2，但省距离\n3. 等臂杠杆：L1 = L2，F1 = F2，不省力不费力","semester":"lower"},{"id":"g2_physics_054","chapter":"第十二章 简单机械","name":"滑轮","formula":"F = G / n\ns = nh","explanation":"滑轮分类：\n\n1. 定滑轮：\n   - 实质：等臂杠杆\n   - 特点：F = G，不省力但改变力的方向\n   - 物体移动距离 s = 绳端移动距离\n\n2. 动滑轮：\n   - 实质：动力臂 = 2 × 阻力臂的杠杆\n   - 特点：F = G/2，省一半力（不计摩擦和动滑轮重），但不改变力的方向\n   - 绳端移动距离 s = 2h\n\n3. 滑轮组：\n   - 既省力又改变力的方向\n   - F = G总 / n（n 为承担物重的绳子段数）\n   - s = nh（绳端移动距离 = n × 物体上升高度）\n   - s/v 关系：v绳 = nv物","semester":"lower"},{"id":"g2_physics_055","chapter":"第十二章 简单机械","name":"机械效率","formula":"η = W有用 / W总 × 100%","explanation":"有用功（W有用）：人们需要做的功，对人们有用的功。\n额外功（W额外）：人们不需要但又不得不做的功。\n总功（W总）：有用功与额外功的总和。\n\nW总 = W有用 + W额外\n\n机械效率：\n- 定义：有用功跟总功的比值\n- 公式：η = W有用 / W总 × 100%\n- η 永远小于 1（小于 100%）\n- η 没有单位，用百分数表示\n\n提高机械效率的方法：\n1. 减小机械自重\n2. 加润滑油减小摩擦\n3. 改进机械结构，使额外功减小","semester":"lower"},{"id":"g2_physics_056","chapter":"第九章 压强","name":"液体压强的计算","formula":"F = pS = ρ液ghS","explanation":"液体压力和压强：\n\n压力：F = pS = ρ液ghS\n- 不一定等于液体的重力\n- 容器形状决定 F 与 G液 关系：\n  - 上宽下窄：F < G液\n  - 上下等宽：F = G液\n  - 上窄下宽：F > G液\n\n特殊容器压力：\n- 装满水的规则容器底面受到的压力 F = ρ水gSh","semester":"lower"},{"id":"g2_physics_057","chapter":"第七章 力","name":"力的示意图","formula":"力的图示：标度 + 方向 + 大小","explanation":"力的示意图：用一根带箭头的线段把力的三要素表示出来。\n\n作图方法：\n1. 沿力的方向画一条线段\n2. 线段的起点或终点画在力的作用点上\n3. 在线段末端画箭头表示力的方向\n4. 在同一图上，线段长度需成比例（标度）\n\n注意事项：\n- 重力：作用点画在重心，方向竖直向下\n- 压力：作用点在受压物体的接触面上，方向垂直于接触面\n- 拉力：作用点在被拉物体的受力处，方向沿绳收缩方向","semester":"lower"},{"id":"g2_physics_058","chapter":"第七章 力","name":"力的平衡与运动状态","formula":"合力为零 ⇄ 平衡状态","explanation":"物体运动状态与受力关系：\n\n1. 物体不受力：保持静止或匀速直线运动\n2. 受平衡力：保持静止或匀速直线运动\n3. 受非平衡力：运动状态改变\n   - 力方向与运动方向相同：加速\n   - 力方向与运动方向相反：减速\n   - 力方向与运动方向不在同一直线上：运动方向改变（曲线运动）\n\n力是改变物体运动状态的原因，不是维持运动的原因。","semester":"lower"}];

        // ==================== 内嵌例题数据 ====================
        const DATA_EXAMPLES = [{"id":"g2_physics_001_ex01","knowledge_id":"g2_physics_001","question":"选择题：国际单位制中，长度的基本单位是？ A. 米（m）  B. 毫米（mm）  C. 厘米（cm）  D. 千米（km）","answer":"答案：A. 米（m）。解析：国际单位制中，长度的基本单位是米（m）。千米、厘米、毫米等是常用单位，但不是基本单位。"},{"id":"g2_physics_001_ex02","knowledge_id":"g2_physics_001","question":"选择题：1米等于多少厘米？ A. 10 cm  B. 1000 cm  C. 100 cm  D. 0.01 cm","answer":"答案：C. 100 cm。解析：1 m = 10 dm = 100 cm = 1000 mm。米和厘米之间的进率是100。"},{"id":"g2_physics_001_ex03","knowledge_id":"g2_physics_001","question":"填空题：1 km = ______ m。","answer":"答案：1000。解析：千米和米之间的进率是1000，即1 km = 1000 m。"},{"id":"g2_physics_001_ex04","knowledge_id":"g2_physics_001","question":"判断题：测量长度时，刻度尺的零刻度线必须对准被测物体的一端。（  ）","answer":"答案：错误。解析：如果零刻度线磨损，可以从某一整刻度线开始测量，最后减去起始刻度即可。不是必须用零刻度线。"},{"id":"g2_physics_001_ex05","knowledge_id":"g2_physics_001","question":"选择题：下列长度单位换算正确的是？ A. 1 mm = 1000 μm  B. 1 m = 100 mm  C. 1 cm = 100 mm  D. 1 km = 100 m","answer":"答案：A. 1 mm = 1000 μm。解析：1 mm = 1000 μm 是正确的。其他选项应为：1 m = 1000 mm，1 km = 1000 m，1 cm = 10 mm。"},{"id":"g2_physics_001_ex06","knowledge_id":"g2_physics_001","question":"填空题：测量长度的常用工具是______。","answer":"答案：刻度尺。解析：测量长度的工具很多，最常用的是刻度尺。更精确的测量可以用游标卡尺、螺旋测微器等。"},{"id":"g2_physics_001_ex07","knowledge_id":"g2_physics_001","question":"判断题：1纳米等于1000微米。（  ）","answer":"答案：错误。解析：1微米(μm) = 1000纳米(nm)，反过来1纳米 = 0.001微米。它们的关系是：1 mm = 1000 μm = 1 000 000 nm。"},{"id":"g2_physics_001_ex08","knowledge_id":"g2_physics_001","question":"选择题：用刻度尺测量长度时，视线应该怎样？ A. 怎么看都行  B. 与刻度线平行  C. 倾斜着看  D. 与刻度线垂直","answer":"答案：D. 与刻度线垂直。解析：读数时视线要与刻度线垂直（正对刻度线），否则会因为视角原因产生读数误差。"},{"id":"g2_physics_001_ex09","knowledge_id":"g2_physics_001","question":"简答题：使用刻度尺测量长度时，应该注意哪些问题？","answer":"答案：使用刻度尺要注意：①选：根据测量需要选择合适量程和分度值的刻度尺；②放：刻度尺要放正，刻度线紧贴被测物体，零刻度线（或某一整刻度）对准被测物体一端；③看：视线要与尺面垂直；④读：要估读到分度值的下一位；⑤记：测量结果 = 准确值 + 估计值 + 单位。"},{"id":"g2_physics_001_ex10","knowledge_id":"g2_physics_001","question":"选择题：某同学用刻度尺测物体长度，记录结果是1.234 m，则这把刻度尺的分度值是？ A. 1 mm  B. 1 dm  C. 1 cm  D. 1 m","answer":"答案：C. 1 cm。解析：测量结果的最后一位是估计值，倒数第二位对应的单位就是刻度尺的分度值。1.234 m中，倒数第二位是3，对应厘米位，所以分度值是1 cm。"},{"id":"g2_physics_002_ex01","knowledge_id":"g2_physics_002","question":"选择题：关于\"时间的单位与测量\"，下列说法正确的是？ A. 完全错误的说法  B. 混淆概念的说法  C. 与事实相反的说法  D. 这是时间的单位与测量的正确描述","answer":"答案：D. 这是时间的单位与测量的正确描述。解析：本题考察对\"时间的单位与测量\"的理解。学习物理概念要准确把握定义和本质特征。国际单位制中，时间的基本单位是秒（s）。\n\n常用单位：小时（h）、分钟（min）、秒（s）、毫秒（ms）。\n\n测量工具：停表（秒表）\n\n误差：\n- 误差是测量值"},{"id":"g2_physics_002_ex02","knowledge_id":"g2_physics_002","question":"选择题：下列关于时间的单位与测量的公式/规律，正确的是？ A. 单位弄错了  B. 1 h = 60 min = 3600 s  C. 适用条件反了  D. 公式写错了","answer":"答案：B. 1 h = 60 min = 3600 s。解析：时间的单位与测量的公式/规律是：1 h = 60 min = 3600 s。掌握公式的同时要理解其物理意义和适用条件。"},{"id":"g2_physics_002_ex03","knowledge_id":"g2_physics_002","question":"填空题：时间的单位与测量的公式/主要内容是：______。","answer":"答案：1 h = 60 min = 3600 s。解析：这是时间的单位与测量的重要公式/内容。国际单位制中，时间的基本单位是秒（s）。\n\n常用单位：小时（h）、分钟（min）、秒（s）、毫秒（ms）。\n\n测量工具：停表（秒表）\n\n误差：\n- 误差是测量值与真实值之间的差异\n- 误差只能减小，不..."},{"id":"g2_physics_002_ex04","knowledge_id":"g2_physics_002","question":"判断题：学习时间的单位与测量只需要背公式，不需要理解。（  ）","answer":"答案：错误。解析：学习物理不仅要记住公式，更要理解公式的物理意义、推导过程和适用条件。只有真正理解了，才能灵活运用。"},{"id":"g2_physics_002_ex05","knowledge_id":"g2_physics_002","question":"选择题：学习时间的单位与测量时，最重要的方法是？ A. 只看不练  B. 理解概念+动手实验+练习应用  C. 只做题不思考  D. 死记硬背","answer":"答案：B. 理解概念+动手实验+练习应用。解析：物理是一门以实验为基础的学科，学习时间的单位与测量要注重理解概念，动手实验，通过练习巩固应用。"},{"id":"g2_physics_002_ex06","knowledge_id":"g2_physics_002","question":"填空题：时间的单位与测量属于______（填章节名）的内容。","answer":"答案：第一章 机械运动。解析：时间的单位与测量是第一章 机械运动的重要知识点，学习时要注意与前后知识的联系。"},{"id":"g2_physics_002_ex07","knowledge_id":"g2_physics_002","question":"判断题：时间的单位与测量与其他物理知识没有联系。（  ）","answer":"答案：错误。解析：物理知识是相互联系的，时间的单位与测量与其他知识点有密切关系。学习时要注意构建知识网络，融会贯通。"},{"id":"g2_physics_002_ex08","knowledge_id":"g2_physics_002","question":"选择题：下列关于时间的单位与测量的应用，正确的是？ A. 完全没有实际用处  B. 可以解释相关的物理现象  C. 与生活无关  D. 只能用于考试","answer":"答案：B. 可以解释相关的物理现象。解析：物理知识来源于生活，又服务于生活。时间的单位与测量可以解释许多相关的物理现象，在生活和生产中有广泛应用。"},{"id":"g2_physics_002_ex09","knowledge_id":"g2_physics_002","question":"简答题：请简述时间的单位与测量的主要内容。","answer":"答案：时间的单位与测量的主要内容是：1 h = 60 min = 3600 s\n1 min = 60 s\n1 s = 1000 ms。国际单位制中，时间的基本单位是秒（s）。\n\n常用单位：小时（h）、分钟（min）、秒（s）、毫秒（ms）。\n\n测量工具：停表（秒表）\n\n误差：\n- 误差是测量值与真实值之间的差异\n- 误差只能减小，不能避免\n- 减小误差的方法：多次测量取平均值、使用更精密的测量工具... 这是一个重要的物理知识点，需要在理解的基础上掌握。"},{"id":"g2_physics_002_ex10","knowledge_id":"g2_physics_002","question":"选择题：关于时间的单位与测量，下列说法错误的是？ A. 需要理解和应用  B. 是物理基础知识  C. 不需要掌握，考试不考  D. 与实际生活有关","answer":"答案：C. 不需要掌握，考试不考。解析：时间的单位与测量是重要的物理基础知识，需要认真掌握。它不仅与考试有关，更与我们的生活实际密切相关。"},{"id":"g2_physics_003_ex01","knowledge_id":"g2_physics_003","question":"选择题：关于\"机械运动与参照物\"，下列说法正确的是？ A. 与事实相反的说法  B. 混淆概念的说法  C. 完全错误的说法  D. 这是机械运动与参照物的正确描述","answer":"答案：D. 这是机械运动与参照物的正确描述。解析：本题考察对\"机械运动与参照物\"的理解。学习物理概念要准确把握定义和本质特征。在物理学中，把一个物体相对于另一个物体位置的改变叫做机械运动，简称运动。\n\n参照物：\n- 研究机械运动时，被选作标准的物体叫做参照物\n- 参照物可以任意选择，但"},{"id":"g2_physics_003_ex02","knowledge_id":"g2_physics_003","question":"选择题：下列关于机械运动与参照物的公式/规律，正确的是？ A. 单位弄错了  B. 运动 = 位置变化（相对于参照物）  C. 适用条件反了  D. 公式写错了","answer":"答案：B. 运动 = 位置变化（相对于参照物）。解析：机械运动与参照物的公式/规律是：运动 = 位置变化（相对于参照物）。掌握公式的同时要理解其物理意义和适用条件。"},{"id":"g2_physics_003_ex03","knowledge_id":"g2_physics_003","question":"填空题：机械运动与参照物的公式/主要内容是：______。","answer":"答案：运动 = 位置变化（相对于参照物）。解析：这是机械运动与参照物的重要公式/内容。在物理学中，把一个物体相对于另一个物体位置的改变叫做机械运动，简称运动。\n\n参照物：\n- 研究机械运动时，被选作标准的物体叫做参照物\n- 参照物可以任意选择，但一旦选定，就认为它是静止的\n- 同一物体..."},{"id":"g2_physics_003_ex04","knowledge_id":"g2_physics_003","question":"判断题：学习机械运动与参照物只需要背公式，不需要理解。（  ）","answer":"答案：错误。解析：学习物理不仅要记住公式，更要理解公式的物理意义、推导过程和适用条件。只有真正理解了，才能灵活运用。"},{"id":"g2_physics_003_ex05","knowledge_id":"g2_physics_003","question":"选择题：学习机械运动与参照物时，最重要的方法是？ A. 只看不练  B. 只做题不思考  C. 理解概念+动手实验+练习应用  D. 死记硬背","answer":"答案：C. 理解概念+动手实验+练习应用。解析：物理是一门以实验为基础的学科，学习机械运动与参照物要注重理解概念，动手实验，通过练习巩固应用。"},{"id":"g2_physics_003_ex06","knowledge_id":"g2_physics_003","question":"填空题：机械运动与参照物属于______（填章节名）的内容。","answer":"答案：第一章 机械运动。解析：机械运动与参照物是第一章 机械运动的重要知识点，学习时要注意与前后知识的联系。"},{"id":"g2_physics_003_ex07","knowledge_id":"g2_physics_003","question":"判断题：机械运动与参照物与其他物理知识没有联系。（  ）","answer":"答案：错误。解析：物理知识是相互联系的，机械运动与参照物与其他知识点有密切关系。学习时要注意构建知识网络，融会贯通。"},{"id":"g2_physics_003_ex08","knowledge_id":"g2_physics_003","question":"选择题：下列关于机械运动与参照物的应用，正确的是？ A. 只能用于考试  B. 可以解释相关的物理现象  C. 完全没有实际用处  D. 与生活无关","answer":"答案：B. 可以解释相关的物理现象。解析：物理知识来源于生活，又服务于生活。机械运动与参照物可以解释许多相关的物理现象，在生活和生产中有广泛应用。"},{"id":"g2_physics_003_ex09","knowledge_id":"g2_physics_003","question":"简答题：请简述机械运动与参照物的主要内容。","answer":"答案：机械运动与参照物的主要内容是：运动 = 位置变化（相对于参照物）。在物理学中，把一个物体相对于另一个物体位置的改变叫做机械运动，简称运动。\n\n参照物：\n- 研究机械运动时，被选作标准的物体叫做参照物\n- 参照物可以任意选择，但一旦选定，就认为它是静止的\n- 同一物体是运动还是静止，取决于所选的参照物，这叫运动和静止的相对性... 这是一个重要的物理知识点，需要在理解的基础上掌握。"},{"id":"g2_physics_003_ex10","knowledge_id":"g2_physics_003","question":"选择题：关于机械运动与参照物，下列说法错误的是？ A. 与实际生活有关  B. 不需要掌握，考试不考  C. 是物理基础知识  D. 需要理解和应用","answer":"答案：B. 不需要掌握，考试不考。解析：机械运动与参照物是重要的物理基础知识，需要认真掌握。它不仅与考试有关，更与我们的生活实际密切相关。"},{"id":"g2_physics_004_ex01","knowledge_id":"g2_physics_004","question":"选择题：速度是表示什么的物理量？ A. 物体运动方向  B. 物体运动快慢  C. 物体运动路程  D. 物体运动时间","answer":"答案：B. 物体运动快慢。解析：速度是表示物体运动快慢的物理量。速度越大，表示物体运动得越快；速度越小，表示物体运动得越慢。"},{"id":"g2_physics_004_ex02","knowledge_id":"g2_physics_004","question":"选择题：速度的公式是？ A. v = s + t  B. v = s × t  C. v = s / t  D. v = t / s","answer":"答案：C. v = s / t。解析：速度 = 路程 ÷ 时间，公式 v = s/t。其中v表示速度，s表示路程，t表示时间。"},{"id":"g2_physics_004_ex03","knowledge_id":"g2_physics_004","question":"填空题：速度的国际单位是______。","answer":"答案：米/秒（m/s）。解析：速度的国际单位是米每秒，符号m/s或m·s⁻¹。常用单位还有千米/小时（km/h）。"},{"id":"g2_physics_004_ex04","knowledge_id":"g2_physics_004","question":"判断题：1 m/s = 3.6 km/h。（  ）","answer":"答案：正确。解析：1 m/s = 1米/1秒 = 0.001千米/(1/3600小时) = 3.6 km/h。这是速度单位换算的重要关系。"},{"id":"g2_physics_004_ex05","knowledge_id":"g2_physics_004","question":"选择题：一辆汽车以72 km/h的速度行驶，换算成m/s是多少？ A. 20 m/s  B. 72 m/s  C. 25 m/s  D. 15 m/s","answer":"答案：A. 20 m/s。解析：72 km/h = 72 ÷ 3.6 m/s = 20 m/s。也可以直接用72/3.6 = 20快速计算。"},{"id":"g2_physics_004_ex06","knowledge_id":"g2_physics_004","question":"填空题：做匀速直线运动的物体，在相等时间内通过的路程______。","answer":"答案：相等。解析：匀速直线运动是指物体沿着直线且速度不变的运动。速度不变意味着在相等时间内通过的路程相等。"},{"id":"g2_physics_004_ex07","knowledge_id":"g2_physics_004","question":"判断题：速度大的物体，通过的路程一定长。（  ）","answer":"答案：错误。解析：路程 = 速度 × 时间。路程的长短不仅与速度有关，还与时间有关。如果时间短，即使速度大，路程也不一定长。"},{"id":"g2_physics_004_ex08","knowledge_id":"g2_physics_004","question":"选择题：下列说法正确的是？ A. 运动时间越短，速度越大  B. 以上说法都对  C. 速度越大，路程越长  D. 匀速直线运动的速度是恒定不变的","answer":"答案：D. 匀速直线运动的速度是恒定不变的。解析：匀速直线运动的速度不变，路程与时间成正比。A正确。B和C都只说了一个因素，忽略了另一个因素，都是错误的。比较速度大小要同时考虑路程和时间。"},{"id":"g2_physics_004_ex09","knowledge_id":"g2_physics_004","question":"简答题：什么是匀速直线运动？它有什么特点？","answer":"答案：匀速直线运动：物体沿着直线且速度不变的运动，叫做匀速直线运动。特点：①运动路线是直线；②速度大小和方向都不变；③在相等时间内通过的路程相等；④路程与时间成正比（s=vt）；⑤速度的大小与路程和时间无关（v是恒定的）。匀速直线运动是最简单的机械运动。"},{"id":"g2_physics_004_ex10","knowledge_id":"g2_physics_004","question":"选择题：甲、乙两车都做匀速直线运动，甲在1小时内通过36 km，乙在1分钟内通过600 m，则？ A. 无法比较  B. 两车速度一样大  C. 甲车速度大  D. 乙车速度大","answer":"答案：B. 两车速度一样大。解析：甲的速度：v甲 = 36 km/h = 10 m/s。乙的速度：v乙 = 600 m / 60 s = 10 m/s。所以两车速度一样大，都是10 m/s。比较速度要统一单位后再比较。"},{"id":"g2_physics_005_ex01","knowledge_id":"g2_physics_005","question":"选择题：关于平均速度，下列说法正确的是？ A. 平均速度 = 总路程 ÷ 总时间  B. 平均速度越大，速度越大  C. 平均速度和速度是一回事  D. 平均速度就是速度的平均值","answer":"答案：A. 平均速度 = 总路程 ÷ 总时间。解析：平均速度表示物体在某段路程（或某段时间）内的平均快慢程度，公式是 v̄ = s总 / t总。平均速度不是速度的平均值！"},{"id":"g2_physics_005_ex02","knowledge_id":"g2_physics_005","question":"选择题：某物体在前一半路程的速度是v₁，后一半路程的速度是v₂，则全程的平均速度是？ A. (v₁+v₂) / v₁v₂  B. (v₁+v₂) / 2  C. 2v₁v₂ / (v₁+v₂)  D. v₁ + v₂","answer":"答案：C. 2v₁v₂ / (v₁+v₂)。解析：设总路程为2s，则前一半路程时间t₁=s/v₁，后一半路程时间t₂=s/v₂。平均速度v = 2s/(t₁+t₂) = 2s/(s/v₁+s/v₂) = 2v₁v₂/(v₁+v₂)。这是路程相等时的平均速度公式。"},{"id":"g2_physics_005_ex03","knowledge_id":"g2_physics_005","question":"填空题：平均速度______（填\"是\"或\"不是\"）速度的平均值。","answer":"答案：不是。解析：平均速度不是速度的平均值，而是总路程除以总时间。只有在特殊情况下（如各段时间相等），平均速度才等于速度的平均值。"},{"id":"g2_physics_005_ex04","knowledge_id":"g2_physics_005","question":"判断题：做变速运动的物体，平均速度就是速度的平均值。（  ）","answer":"答案：错误。解析：平均速度 = 总路程 ÷ 总时间，不是简单地把速度加起来除以次数。只有当各段运动时间相等时，平均速度才等于速度的平均值。"},{"id":"g2_physics_005_ex05","knowledge_id":"g2_physics_005","question":"选择题：小明跑100 m，前50 m用了8 s，后50 m用了12 s，则他跑完全程的平均速度是？ A. 10 m/s  B. 约5.2 m/s  C. 6 m/s  D. 5 m/s","answer":"答案：D. 5 m/s。解析：平均速度 = 总路程 ÷ 总时间 = 100 m ÷ (8 s + 12 s) = 100 m ÷ 20 s = 5 m/s。注意不是(50/8 + 50/12)/2，那是速度的平均值。"},{"id":"g2_physics_005_ex06","knowledge_id":"g2_physics_005","question":"填空题：说一个物体的平均速度，必须指明是在哪段______或哪段______内的平均速度才有意义。","answer":"答案：路程；时间。解析：平均速度的数值与所选的路程或时间有关，不同路段（或时间段）的平均速度可能不同，所以说平均速度必须指明是哪段路程（或哪段时间）的。"},{"id":"g2_physics_005_ex07","knowledge_id":"g2_physics_005","question":"判断题：平均速度为0，说明物体一定静止。（  ）","answer":"答案：错误。解析：平均速度为0，只是说明总位移为0（回到了出发点），但物体不一定静止。比如绕操场跑一圈回到起点，平均速度为0，但人一直在运动。"},{"id":"g2_physics_005_ex08","knowledge_id":"g2_physics_005","question":"选择题：一辆汽车从甲地到乙地，前一半时间的速度是v₁，后一半时间的速度是v₂，则全程的平均速度是？ A. v₁ + v₂  B. (v₁ + v₂) / 2  C. v₁v₂ / (v₁+v₂)  D. 2v₁v₂ / (v₁+v₂)","answer":"答案：B. (v₁ + v₂) / 2。解析：设总时间为2t，则前一半时间路程s₁=v₁t，后一半时间路程s₂=v₂t。平均速度v = (s₁+s₂)/2t = (v₁t+v₂t)/2t = (v₁+v₂)/2。这是时间相等时的平均速度，等于速度的平均值。"},{"id":"g2_physics_005_ex09","knowledge_id":"g2_physics_005","question":"简答题：平均速度和速度有什么区别？为什么说平均速度不是速度的平均值？","answer":"答案：区别：①速度描述的是某一时刻（或某一位置）物体运动的快慢；平均速度描述的是某段时间（或某段路程）内物体运动的平均快慢。②匀速直线运动中，速度处处相等，平均速度等于速度；变速运动中，各时刻速度可能不同，平均速度不等于速度。平均速度不是速度的平均值：因为平均速度的定义是总路程除以总时间（v̄ = s总/t总），而不是各段速度的算术平均值。只有在特殊条件下（如各段运动时间相等），平均速度才等于速度的平均值。"},{"id":"g2_physics_005_ex10","knowledge_id":"g2_physics_005","question":"选择题：关于平均速度的说法，正确的是？ A. 平均速度就是速度的平均值  B. 平均速度要指明是哪段路程或哪段时间  C. 平均速度越大，末速度越大  D. 平均速度等于初末速度的平均值","answer":"答案：B. 平均速度要指明是哪段路程或哪段时间。解析：平均速度与所选的路程（或时间）有关，必须指明是哪段路程或哪段时间内的平均速度。其他选项都不准确。"},{"id":"g2_physics_006_ex01","knowledge_id":"g2_physics_006","question":"选择题：声音是怎样产生的？ A. 由耳朵产生  B. 由空气产生  C. 由物体振动产生  D. 凭空产生的","answer":"答案：C. 由物体振动产生。解析：声音是由物体的振动产生的。一切发声的物体都在振动，振动停止，发声也停止。注意：发声停止≠声音立即消失（因为声音可能还在传播中）。"},{"id":"g2_physics_006_ex02","knowledge_id":"g2_physics_006","question":"选择题：下列乐器中，靠空气柱振动发声的是？ A. 吉他  B. 钢琴  C. 鼓  D. 笛子","answer":"答案：D. 笛子。解析：笛子是管乐器，靠管内空气柱振动发声。钢琴、吉他靠弦振动发声（弦乐器），鼓靠鼓面振动发声（打击乐器）。"},{"id":"g2_physics_006_ex03","knowledge_id":"g2_physics_006","question":"填空题：一切发声的物体都在______。","answer":"答案：振动。解析：声音是由物体振动产生的，一切正在发声的物体都在振动。振动停止，发声也停止。"},{"id":"g2_physics_006_ex04","knowledge_id":"g2_physics_006","question":"判断题：振动停止，声音也立即消失。（  ）","answer":"答案：错误。解析：振动停止，发声停止，但已经发出的声音还在继续传播，不会立即消失。比如回音，就是发声停止后声音的反射。"},{"id":"g2_physics_006_ex05","knowledge_id":"g2_physics_006","question":"选择题：声音的传播需要什么？ A. 介质  B. 真空  C. 光  D. 电","answer":"答案：A. 介质。解析：声音的传播需要介质。声音可以在固体、液体、气体中传播，但不能在真空中传播。"},{"id":"g2_physics_006_ex06","knowledge_id":"g2_physics_006","question":"填空题：声音在15°C空气中的传播速度约为______ m/s。","answer":"答案：340。解析：声音在不同介质中的传播速度不同。在15°C的空气中，声速约为340 m/s。温度越高，声速越大。"},{"id":"g2_physics_006_ex07","knowledge_id":"g2_physics_006","question":"判断题：声音在真空中也能传播。（  ）","answer":"答案：错误。解析：声音的传播需要介质，真空没有介质，所以声音不能在真空中传播。这就是为什么太空中的宇航员不能直接对话的原因。"},{"id":"g2_physics_006_ex08","knowledge_id":"g2_physics_006","question":"选择题：声音在下列哪种介质中传播最快？ A. 固体  B. 液体  C. 真空  D. 气体","answer":"答案：A. 固体。解析：一般情况下，声音在固体中传播最快，液体中次之，气体中最慢，真空中不能传播。即 v固 > v液 > v气。"},{"id":"g2_physics_006_ex09","knowledge_id":"g2_physics_006","question":"简答题：为什么宇航员在太空中不能直接对话？如果要对话，他们可以用什么方式？","answer":"答案：因为声音的传播需要介质，而太空中是真空，没有空气等介质，所以声音不能传播，宇航员不能直接对话。他们可以通过无线电（电磁波）进行对话，因为电磁波可以在真空中传播。也可以用手势交流，或者通过头盔接触传声（利用固体传声）。"},{"id":"g2_physics_006_ex10","knowledge_id":"g2_physics_006","question":"选择题：把正在响铃的闹钟放在玻璃罩内，逐渐抽出罩内的空气，听到的铃声会？ A. 逐渐变小  B. 时大时小  C. 逐渐变大  D. 保持不变","answer":"答案：A. 逐渐变小。解析：因为声音的传播需要介质，抽出空气后，传声的介质越来越少，所以铃声逐渐变小。如果完全抽成真空，就听不到声音了。这个实验说明真空不能传声。"},{"id":"g2_physics_007_ex01","knowledge_id":"g2_physics_007","question":"选择题：声音的三要素是？ A. 音调、响度、音色  B. 音调、频率、音色  C. 频率、振幅、波长  D. 声速、频率、响度","answer":"答案：A. 音调、响度、音色。解析：声音的三要素（也叫三个特征）是：音调、响度、音色。音调由频率决定，响度由振幅决定，音色由发声体本身决定。"},{"id":"g2_physics_007_ex02","knowledge_id":"g2_physics_007","question":"选择题：音调是由什么决定的？ A. 振幅  B. 频率  C. 发声体材料  D. 传播介质","answer":"答案：B. 频率。解析：音调指声音的高低，由发声体振动的频率决定。频率越高，音调越高；频率越低，音调越低。"},{"id":"g2_physics_007_ex03","knowledge_id":"g2_physics_007","question":"填空题：响度是指声音的______，由______决定。","answer":"答案：强弱（或大小）；振幅。解析：响度指声音的强弱（或大小），由发声体的振幅决定。振幅越大，响度越大；振幅越小，响度越小。另外，响度还与距离发声体的远近有关。"},{"id":"g2_physics_007_ex04","knowledge_id":"g2_physics_007","question":"判断题：频率越高，声音越大。（  ）","answer":"答案：错误。解析：频率决定音调，频率越高音调越高（声音越尖），而不是声音越大。声音大小是响度，由振幅决定。注意区分音调和响度。"},{"id":"g2_physics_007_ex05","knowledge_id":"g2_physics_007","question":"选择题：\"闻其声而知其人\"是根据声音的什么特征判断的？ A. 音调  B. 响度  C. 频率  D. 音色","answer":"答案：D. 音色。解析：音色是声音的品质，由发声体本身的材料、结构等决定。不同的人说话音色不同，所以可以\"闻其声而知其人\"。"},{"id":"g2_physics_007_ex06","knowledge_id":"g2_physics_007","question":"填空题：频率的单位是______，符号是______。","answer":"答案：赫兹；Hz。解析：频率是每秒内振动的次数，单位是赫兹，简称赫，符号Hz。1 Hz = 1次/秒。"},{"id":"g2_physics_007_ex07","knowledge_id":"g2_physics_007","question":"判断题：响度越大，音调越高。（  ）","answer":"答案：错误。解析：响度和音调是声音的两个不同特征。响度由振幅决定，音调由频率决定。响度大不一定音调高，音调高也不一定响度大。两者没有必然联系。"},{"id":"g2_physics_007_ex08","knowledge_id":"g2_physics_007","question":"选择题：下列做法中，能改变音调的是？ A. 用大小不同的力敲鼓  B. 改变钢尺伸出桌面的长度后拨动  C. 用不同的乐器演奏同一首曲子  D. 调节收音机的音量","answer":"答案：A. 用大小不同的力敲鼓。解析：改变钢尺伸出长度，振动频率改变，音调改变。A改变的是响度，C改变的是音色，D改变的也是响度。"},{"id":"g2_physics_007_ex09","knowledge_id":"g2_physics_007","question":"简答题：什么是音调、响度、音色？它们分别由什么因素决定？请各举一例说明。","answer":"答案：①音调：声音的高低，由频率决定。频率越高，音调越高。例如：女生声音比男生尖细，音调高；琴弦越短越细越紧，音调越高。②响度：声音的大小（强弱），由振幅决定。振幅越大，响度越大；还与距离发声体的远近有关。例如：用力击鼓比轻轻击鼓声音大。③音色：声音的品质，由发声体本身（材料、结构等）决定。例如：不同的人说话声音不同，不同乐器发出的声音不同，都可以用音色来区分。"},{"id":"g2_physics_007_ex10","knowledge_id":"g2_physics_007","question":"选择题：关于声音的三要素，下列说法正确的是？ A. 频率越高响度越大  B. 音色由发声体本身决定  C. 振幅越大音调越高  D. 音调越高响度越大","answer":"答案：B. 音色由发声体本身决定。解析：A正确：音色是声音的品质，由发声体本身决定。B错误：音调和响度是两个独立特征，没有必然联系。C错误：频率决定音调，不决定响度。D错误：振幅决定响度，不决定音调。"},{"id":"g2_physics_008_ex01","knowledge_id":"g2_physics_008","question":"选择题：关于\"超声波与次声波\"，下列说法正确的是？ A. 混淆概念的说法  B. 这是超声波与次声波的正确描述  C. 完全错误的说法  D. 与事实相反的说法","answer":"答案：B. 这是超声波与次声波的正确描述。解析：本题考察对\"超声波与次声波\"的理解。学习物理概念要准确把握定义和本质特征。人耳能听到的声音频率范围：20 Hz ~ 20 000 Hz\n\n超声波：频率高于 20 000 Hz 的声音\n- 应用：B超、潜艇声呐、金属内部缺陷检测、灭鼠驱"},{"id":"g2_physics_008_ex02","knowledge_id":"g2_physics_008","question":"选择题：下列关于超声波与次声波的公式/规律，正确的是？ A. 适用条件反了  B. 公式写错了  C. 单位弄错了  D. 人耳听觉范围：20 Hz ~ 20 000 Hz","answer":"答案：D. 人耳听觉范围：20 Hz ~ 20 000 Hz。解析：超声波与次声波的公式/规律是：人耳听觉范围：20 Hz ~ 20 000 Hz。掌握公式的同时要理解其物理意义和适用条件。"},{"id":"g2_physics_008_ex03","knowledge_id":"g2_physics_008","question":"填空题：超声波与次声波的公式/主要内容是：______。","answer":"答案：人耳听觉范围：20 Hz ~ 20 000 Hz。解析：这是超声波与次声波的重要公式/内容。人耳能听到的声音频率范围：20 Hz ~ 20 000 Hz\n\n超声波：频率高于 20 000 Hz 的声音\n- 应用：B超、潜艇声呐、金属内部缺陷检测、灭鼠驱虫\n\n次声波：频率低于 20 Hz 的声..."},{"id":"g2_physics_008_ex04","knowledge_id":"g2_physics_008","question":"判断题：学习超声波与次声波只需要背公式，不需要理解。（  ）","answer":"答案：错误。解析：学习物理不仅要记住公式，更要理解公式的物理意义、推导过程和适用条件。只有真正理解了，才能灵活运用。"},{"id":"g2_physics_008_ex05","knowledge_id":"g2_physics_008","question":"选择题：学习超声波与次声波时，最重要的方法是？ A. 死记硬背  B. 只做题不思考  C. 只看不练  D. 理解概念+动手实验+练习应用","answer":"答案：D. 理解概念+动手实验+练习应用。解析：物理是一门以实验为基础的学科，学习超声波与次声波要注重理解概念，动手实验，通过练习巩固应用。"},{"id":"g2_physics_008_ex06","knowledge_id":"g2_physics_008","question":"填空题：超声波与次声波属于______（填章节名）的内容。","answer":"答案：第二章 声现象。解析：超声波与次声波是第二章 声现象的重要知识点，学习时要注意与前后知识的联系。"},{"id":"g2_physics_008_ex07","knowledge_id":"g2_physics_008","question":"判断题：超声波与次声波与其他物理知识没有联系。（  ）","answer":"答案：错误。解析：物理知识是相互联系的，超声波与次声波与其他知识点有密切关系。学习时要注意构建知识网络，融会贯通。"},{"id":"g2_physics_008_ex08","knowledge_id":"g2_physics_008","question":"选择题：下列关于超声波与次声波的应用，正确的是？ A. 只能用于考试  B. 与生活无关  C. 完全没有实际用处  D. 可以解释相关的物理现象","answer":"答案：D. 可以解释相关的物理现象。解析：物理知识来源于生活，又服务于生活。超声波与次声波可以解释许多相关的物理现象，在生活和生产中有广泛应用。"},{"id":"g2_physics_008_ex09","knowledge_id":"g2_physics_008","question":"简答题：请简述超声波与次声波的主要内容。","answer":"答案：超声波与次声波的主要内容是：人耳听觉范围：20 Hz ~ 20 000 Hz。人耳能听到的声音频率范围：20 Hz ~ 20 000 Hz\n\n超声波：频率高于 20 000 Hz 的声音\n- 应用：B超、潜艇声呐、金属内部缺陷检测、灭鼠驱虫\n\n次声波：频率低于 20 Hz 的声音\n- 产生：地震、火山喷发、海啸、台风、机器振动\n- 危害：能破坏建筑物，损害人体健康\n- 应用：预测地震、台风，监测核爆炸... 这是一个重要的物理知识点，需要在理解的基础上掌握。"},{"id":"g2_physics_008_ex10","knowledge_id":"g2_physics_008","question":"选择题：关于超声波与次声波，下列说法错误的是？ A. 是物理基础知识  B. 与实际生活有关  C. 不需要掌握，考试不考  D. 需要理解和应用","answer":"答案：C. 不需要掌握，考试不考。解析：超声波与次声波是重要的物理基础知识，需要认真掌握。它不仅与考试有关，更与我们的生活实际密切相关。"},{"id":"g2_physics_009_ex01","knowledge_ . 在声源处减弱（消声）\n2. 在传播过程中减弱（吸声、隔声）\n3. 在人耳处减弱（戴耳塞、护耳器）\n\n分贝（dB）是声音强弱的单位。... 这是一个重要的物理知识点，需要在理解的基础上掌握。"},{"id":"g2_physics_009_ex10","knowledge_id":"g2_physics_009","question":"选择题：关于噪声的危害与控制，下列说法错误的是？ A. 是物理基础知识  B. 不需要掌握，考试不考  C. 需要理解和应用  D. 与实际生活有关","answer":"答案：B. 不需要掌握，考试不考。解析：噪声的危害与控制是重要的物理基础知识，需要认真掌握。它不仅与考试有关，更与我们的生活实际密切相关。"},{"id":"g2_physics_010_ex01","knowledge_id":"g2_physics_010","question":"选择题：关于\"温度与温度计\"，下列说法正确的是？ A. 混淆概念的说法  B. 这是温度与温度计的正确描述  C. 与事实相反的说法  D. 完全错误的说法","answer":"答案：B. 这是温度与温度计的正确描述。解析：本题考察对\"温度与温度计\"的理解。学习物理概念要准确把握定义和本质特征。温度：表示物体冷热程度的物理量。\n\n单位：\n- 摄氏温度（°C）：冰水混合物为 0°C，沸水为 100°C\n- 热力学温度（K）：以 -273.15°C 为绝对"},{"id":"g2_physics_010_ex02","knowledge_id":"g2_physics_010","question":"选择题：下列关于温度与温度计的公式/规律，正确的是？ A. 公式写错了  B. 单位弄错了  C. 适用条件反了  D. T(K) = t(°C) + 273.15","answer":"答案：D. T(K) = t(°C) + 273.15。解析：温度与温度计的公式/规律是：T(K) = t(°C) + 273.15。掌握公式的同时要理解其物理意义和适用条件。"},{"id":"g2_physics_010_ex03","knowledge_id":"g2_physics_010","question":"填空题：温度与温度计的公式/主要内容是：______。","answer":"答案：T(K) = t(°C) + 273.15。解析：这是温度与温度计的重要公式/内容。温度：表示物体冷热程度的物理量。\n\n单位：\n- 摄氏温度（°C）：冰水混合物为 0°C，沸水为 100°C\n- 热力学温度（K）：以 -273.15°C 为绝对零度\n- 换算：T = t + 273...."},{"id":"g2_physics_010_ex04","knowledge_id":"g2_physics_010","question":"判断题：学习温度与温度计只需要背公式，不需要理解。（  ）","answer":"答案：错误。解析：学习物理不仅要记住公式，更要理解公式的物理意义、推导过程和适用条件。只有真正理解了，才能灵活运用。"},{"id":"g2_physics_010_ex05","knowledge_id":"g2_physics_010","question":"选择题：学习温度与温度计时，最重要的方法是？ A. 只看不练  B. 理解概念+动手实验+练习应用  C. 只做题不思考  D. 死记硬背","answer":"答案：B. 理解概念+动手实验+练习应用。解析：物理是一门以实验为基础的学科，学习温度与温度计要注重理解概念，动手实验，通过练习巩固应用。"},{"id":"g2_physics_010_ex06","knowledge_id":"g2_physics_010","question":"填空题：温度与温度计属于______（填章节名）的内容。","answer":"答案：第三章 物态变化。解析：温度与温度计是第三章 物态变化的重要知识点，学习时要注意与前后知识的联系。"},{"id":"g2_physics_010_ex07","knowledge_id":"g2_physics_010","question":"判断题：温度与温度计与其他物理知识没有联系。（  ）","answer":"答案：错误。解析：物理知识是相互联系的，温度与温度计与其他知识点有密切关系。学习时要注意构建知识网络，融会贯通。"},{"id":"g2_physics_010_ex08","knowledge_id":"g2_physics_010","question":"选择题：下列关于温度与温度计的应用，正确的是？ A. 完全没有实际用处  B. 与生活无关  C. 可以解释相关的物理现象  D. 只能用于考试","answer":"答案：C. 可以解释相关的物理现象。解析：物理知识来源于生活，又服务于生活。温度与温度计可以解释许多相关的物理现象，在生活和生产中有广泛应用。"},{"id":"g2_physics_010_ex09","knowledge_id":"g2_physics_010","question":"简答题：请简述温度与温度计的主要内容。","answer":"答案：温度与温度计的主要内容是：T(K) = t(°C) + 273.15。温度：表示物体冷热程度的物理量。\n\n单位：\n- 摄氏温度（°C）：冰水混合物为 0°C，沸水为 100°C\n- 热力学温度（K）：以 -273.15°C 为绝对零度\n- 换算：T = t + 273.15\n\n温度计：\n- 原理：液体的热胀冷缩\n- 使用：\n  1. 估：估计被测温度，选用合适量程的温度计\n  2. 浸：玻璃泡全部浸入液体中，不碰容器底和壁\n  3. 读：待示数稳定后读数，视线与液柱... 这是一个重要的物理知识点，需要在理解的基础上掌握。"},{"id":"g2_physics_010_ex10","knowledge_id":"g2_physics_010","question":"选择题：关于温度与温度计，下列说法错误的是？ A. 需要理解和应用  B. 不需要掌握，考试不考  C. 是物理基础知识  D. 与实际生活有关","answer":"答案：B. 不需要掌握，考试不考。解析：温度与温度计是重要的物理基础知识，需要认真掌握。它不仅与考试有关，更与我们的生活实际密切相关。"},{"id":"g2_physics_011_ex01","knowledge_id":"g2_physics_011","question":"选择题：物质从固态变成液态的过程叫做？ A. 汽化  B. 液化  C. 凝固  D. 熔化","answer":"答案：D. 熔化。解析：物质从固态变成液态叫熔化（吸热）；从液态变成固态叫凝固（放热）。注意\"熔\"字是火字旁。"},{"id":"g2_physics_011_ex02","knowledge_id":"g2_physics_011","question":"选择题：下列物质中，有固定熔点的是？ A. 松香  B. 沥青  C. 冰  D. 玻璃","answer":"答案：C. 冰。解析：晶体有固定的熔点（如冰、海波、各种金属），非晶体没有固定的熔点（如玻璃、松香、蜡、沥青）。冰是晶体（属于水的固态）。"},{"id":"g2_physics_011_ex03","knowledge_id":"g2_physics_011","question":"填空题：晶体熔化时的特点是：继续吸热，温度______。","answer":"答案：不变。解析：晶体熔化的特点是：吸热但温度保持不变（保持在熔点）。熔化过程中处于固液共存状态。"},{"id":"g2_physics_011_ex04","knowledge_id":"g2_physics_011","question":"判断题：非晶体没有固定的熔点。（  ）","answer":"答案：正确。解析：晶体有固定的熔点，熔化时温度不变；非晶体没有固定的熔点，熔化时温度持续上升。这是晶体和非晶体的重要区别。"},{"id":"g2_physics_011_ex05","knowledge_id":"g2_physics_011","question":"选择题：冰的熔点是0°C，那么0°C的冰处于什么状态？ A. 一定是固液共存  B. 以上三种都有可能  C. 一定是液态  D. 一定是固态","answer":"答案：B. 以上三种都有可能。解析：0°C是冰的熔点，也是水的凝固点。0°C的冰可能是固态（还没开始熔化），可能是固液共存（正在熔化），也可能刚熔化完是液态。三种情况都有可能。"},{"id":"g2_physics_011_ex06","knowledge_id":"g2_physics_011","question":"填空题：同一晶体的熔点和凝固点______（填\"相同\"或\"不同\"）。","answer":"答案：相同。解析：同一晶体的熔点和凝固点相同。例如，冰的熔点是0°C，水的凝固点也是0°C。"},{"id":"g2_physics_011_ex07","knowledge_id":"g2_physics_011","question":"判断题：晶体在熔化过程中，温度不断升高。（  ）","answer":"答案：错误。解析：晶体熔化的特点是吸热但温度保持不变，温度保持在熔点。非晶体熔化时温度才不断升高。"},{"id":"g2_physics_011_ex08","knowledge_id":"g2_physics_011","question":"选择题：下列物态变化中，需要吸热的是？ A. 凝华  B. 熔化  C. 凝固  D. 液化","answer":"答案：B. 熔化。解析：六种物态变化中，吸热的有：熔化、汽化、升华；放热的有：凝固、液化、凝华。熔化是固态变液态，需要吸热。"},{"id":"g2_physics_011_ex09","knowledge_id":"g2_physics_011","question":"简答题：晶体和非晶体有什么区别？它们在熔化过程中有什么不同？","answer":"答案：晶体和非晶体的区别：①晶体有固定的熔点，非晶体没有；②晶体熔化时温度不变，非晶体熔化时温度持续上升；③晶体熔化时固液共存，非晶体没有明显的固液共存阶段。常见晶体：冰、海波、各种金属、食盐、萘等。常见非晶体：玻璃、松香、蜡、沥青等。熔化的条件（晶体）：达到熔点 + 继续吸热，二者缺一不可。"},{"id":"g2_physics_011_ex10","knowledge_id":"g2_physics_011","question":"选择题：把一块0°C的冰投入0°C的水中（周围温度也是0°C），过一段时间后？ A. 无法判断  B. 冰的质量增加  C. 水的质量增加  D. 冰和水的质量都不变","answer":"答案：D. 冰和水的质量都不变。解析：冰熔化需要吸热，水凝固需要放热。但冰、水、环境温度都是0°C，没有温度差，不能发生热传递。所以冰不能熔化，水也不能凝固，两者质量都不变。"},{"id":"g2_physics_012_ex01","knowledge_id":"g2_physics_012","question":"选择题：关于\"汽化和液化\"，下列说法正确的是？ A. 这是汽化和液化的正确描述  B. 混淆概念的说法  C. 与事实相反的说法  D. 完全错误的说法","answer":"答案：A. 这是汽化和液化的正确描述。解析：本题考察对\"汽化和液化\"的理解。学习物理概念要准确把握定义和本质特征。汽化：物质从液态变为气态的过程（吸热）。\n液化：物质从气态变为液态的过程（放热）。\n\n汽化两种方式：\n1. 蒸发：\n   - 在任何温度下都能发生，只在液体表面"},{"id":"g2_physics_012_ex02","knowledge_id":"g2_physics_012","question":"选择题：下列关于汽化和液化的公式/规律，正确的是？ A. 公式写错了  B. 适用条件反了  C. 影响蒸发快慢：温度、表面积、空气流动  D. 单位弄错了","answer":"答案：C. 影响蒸发快慢：温度、表面积、空气流动。解析：汽化和液化的公式/规律是：影响蒸发快慢：温度、表面积、空气流动。掌握公式的同时要理解其物理意义和适用条件。"},{"id":"g2_physics_012_ex03","knowledge_id":"g2_physics_012","question":"填空题：汽化和液化的公式/主要内容是：______。","answer":"答案：影响蒸发快慢：温度、表面积、空气流动。解析：这是汽化和液化的重要公式/内容。汽化：物质从液态变为气态的过程（吸热）。\n液化：物质从气态变为液态的过程（放热）。\n\n汽化两种方式：\n1. 蒸发：\n   - 在任何温度下都能发生，只在液体表面进行\n   - 影响因素：液体温度、表面..."},{"id":"g2_physics_012_ex04","knowledge_id":"g2_physics_012","question":"判断题：学习汽化和液化只需要背公式，不需要理解。（  ）","answer":"答案：错误。解析：学习物理不仅要记住公式，更要理解公式的物理意义、推导过程和适用条件。只有真正理解了，才能灵活运用。"},{"id":"g2_physics_012_ex05","knowledge_id":"g2_physics_012","question":"选择题：学习汽化和液化时，最重要的方法是？ A. 只做题不思考  B. 死记硬背  C. 理解概念+动手实验+练习应用  D. 只看不练","answer":"答案：C. 理解概念+动手实验+练习应用。解析：物理是一门以实验为基础的学科，学习汽化和液化要注重理解概念，动手实验，通过练习巩固应用。"},{"id":"g2_physics_012_ex06","knowledge_id":"g2_physics_012","question":"填空题：汽化和液化属于______（填章节名）的内容。","answer":"答案：第三章 物态变化。解析：汽化和液化是第三章 物态变化的重要知识点，学习时要注意与前后知识的联系。"},{"id":"g2_physics_012_ex07","knowledge_id":"g2_physics_012","question":"判断题：汽化和液化与其他物理知识没有联系。（  ）","answer":"答案：错误。解析：物理知识是相互联系的，汽化和液化与其他知识点有密切关系。学习时要注意构建知识网络，融会贯通。"},{"id":"g2_physics_012_ex08","knowledge_id":"g2_physics_012","question":"选择题：下列关于汽化和液化的应用，正确的是？ A. 完全没有实际用处  B. 与生活无关  C. 只能用于考试  D. 可以解释相关的物理现象","answer":"答案：D. 可以解释相关的物理现象。解析：物理知识来源于生活，又服务于生活。汽化和液化可以解释许多相关的物理现象，在生活和生产中有广泛应用。"},{"id":"g2_physics_012_ex09","knowledge_id":"g2_physics_012","question":"简答题：请简述汽化和液化的主要内容。","answer":"答案：汽化和液化的主要内容是：影响蒸发快慢：温度、表面积、空气流动。汽化：物质从液态变为气态的过程（吸热）。\n液化：物质从气态变为液态的过程（放热）。\n\n汽化两种方式：\n1. 蒸发：\n   - 在任何温度下都能发生，只在液体表面进行\n   - 影响因素：液体温度、表面积、空气流动\n   - 蒸发吸热有致冷作用\n2. 沸腾：\n   - 在一定温度（沸点）下发生，在液体内部和表面同时进行\n   - 条件：达到沸点 + 继续吸热\n   - 液体沸腾时吸热但温度不变... 这是一个重要的物理知识点，需要在理解的基础上掌握。"},{"id":"g2_physics_012_ex10","knowledge_id":"g2_physics_012","question":"选择题：关于汽化和液化，下列说法错误的是？ A. 与实际生活有关  B. 是物理基础知识  C. 需要理解和应用  D. 不需要掌握，考试不考","answer":"答案：D. 不需要掌握，考试不考。解析：汽化和液化是重要的物理基础知识，需要认真掌握。它不仅与考试有关，更与我们的生活实际密切相关。"},{"id":"g2_physics_013_ex01","knowledge_id":"g2_physics_013","question":"选择题：关于\"升华和凝华\"，下列说法正确的是？ A. 与事实相反的说法  B. 混淆概念的说法  C. 完全错误的说法  D. 这是升华和凝华的正确描述","answer":"答案：D. 这是升华和凝华的正确描述。解析：本题考察对\"升华和凝华\"的理解。学习物理概念要准确把握定义和本质特征。升华：物质从固态直接变成气态的过程（吸热）。\n凝华：物质从气态直接变成固态的过程（放热）。\n\n常见现象：\n- 升华：樟脑丸变小、冬天冰冻的衣服变干、灯丝变细\n-"},{"id":"g2_physics_013_ex02","knowledge_id":"g2_physics_013","question":"选择题：下列关于升华和凝华的公式/规律，正确的是？ A. 公式写错了  B. 单位弄错了  C. 升华吸热；凝华放热  D. 适用条件反了","answer":"答案：C. 升华吸热；凝华放热。解析：升华和凝华的公式/规律是：升华吸热；凝华放热。掌握公式的同时要理解其物理意义和适用条件。"},{"id":"g2_physics_013_ex03","knowledge_id":"g2_physics_013","question":"填空题：升华和凝华的公式/主要内容是：______。","answer":"答案：升华吸热；凝华放热。解析：这是升华和凝华的重要公式/内容。升华：物质从固态直接变成气态的过程（吸热）。\n凝华：物质从气态直接变成固态的过程（放热）。\n\n常见现象：\n- 升华：樟脑丸变小、冬天冰冻的衣服变干、灯丝变细\n- 凝华：霜、雪、雾凇、冰花、碘蒸气遇冷凝..."},{"id":"g2_physics_013_ex04","knowledge_id":"g2_physics_013","question":"判断题：学习升华和凝华只需要背公式，不需要理解。（  ）","answer":"答案：错误。解析：学习物理不仅要记住公式，更要理解公式的物理意义、推导过程和适用条件。只有真正理解了，才能灵活运用。"},{"id":"g2_physics_013_ex05","knowledge_id":"g2_physics_013","question":"选择题：学习升华和凝华时，最重要的方法是？ A. 死记硬背  B. 只做题不思考  C. 只看不练  D. 理解概念+动手实验+练习应用","answer":"答案：D. 理解概念+动手实验+练习应用。解析：物理是一门以实验为基础的学科，学习升华和凝华要注重理解概念，动手实验，通过练习巩固应用。"},{"id":"g2_physics_013_ex06","knowledge_id":"g2_physics_013","question":"填空题：升华和凝华属于______（填章节名）的内容。","answer":"答案：第三章 物态变化。解析：升华和凝华是第三章 物态变化的重要知识点，学习时要注意与前后知识的联系。"},{"id":"g2_physics_013_ex07","knowledge_id":"g2_physics_013","question":"判断题：升华和凝华与其他物理知识没有联系。（  ）","answer":"答案：错误。解析：物理知识是相互联系的，升华和凝华与其他知识点有密切关系。学习时要注意构建知识网络，融会贯通。"},{"id":"g2_physics_013_ex08","knowledge_id":"g2_physics_013","question":"选择题：下列关于升华和凝华的应用，正确的是？ A. 可以解释相关的物理现象  B. 只能用于考试  C. 完全没有实际用处  D. 与生活无关","answer":"答案：A. 可以解释相关的物理现象。解析：物理知识来源于生活，又服务于生活。升华和凝华可以解释许多相关的物理现象，在生活和生产中有广泛应用。"},{"id":"g2_physics_013_ex09","knowledge_id":"g2_physics_013","question":"简答题：请简述升华和凝华的主要内容。","answer":"答案：升华和凝华的主要内容是：升华吸热；凝华放热。升华：物质从固态直接变成气态的过程（吸热）。\n凝华：物质从气态直接变成固态的过程（放热）。\n\n常见现象：\n- 升华：樟脑丸变小、冬天冰冻的衣服变干、灯丝变细\n- 凝华：霜、雪、雾凇、冰花、碘蒸气遇冷凝华\n\n应用：\n- 人工降雨：干冰升华吸热，使空气中水蒸气液化\n- 舞台烟雾：干冰升华使空气中的水蒸气液化形成小水滴... 这是一个重要的物理知识点，需要在理解的基础上掌握。"},{"id":"g2_physics_013_ex10","knowledge_id":"g2_physics_013","question":"选择题：关于升华和凝华，下列说法错误的是？ A. 是物理基础知识  B. 需要理解和应用  C. 与实际生活有关  D. 不需要掌握，考试不考","answer":"答案：D. 不需要掌握，考试不考。解析：升华和凝华是重要的物理基础知识，需要认真掌握。它不仅与考试有关，更与我们的生活实际密切相关。"},{"id":"g2_physics_014_ex01","knowledge_id":"g2_physics_014","question":"选择题：光在什么介质中沿直线传播？ A. 只有在空气中  B. 只有在真空中  C. 同种均匀介质  D. 任何介质中","answer":"答案：C. 同种均匀介质。解析：光在同种均匀介质中沿直线传播。如果介质不均匀（如大气层疏密不均），光会发生偏折（折射）。"},{"id":"g2_physics_014_ex02","knowledge_id":"g2_physics_014","question":"选择题：下列现象中，不是光的直线传播的是？ A. 小孔成像  B. 水中的筷子弯折了  C. 影子的形成  D. 日食月食","answer":"答案：B. 水中的筷子弯折了。解析：水中筷子弯折是光的折射现象。影子、小孔成像、日食月食都是光的直线传播形成的。"},{"id":"g2_physics_014_ex03","knowledge_id":"g2_physics_014","question":"填空题：真空中的光速约为______ m/s。","answer":"答案：3×10⁸。解析：光在真空中的速度是宇宙中最快的速度，约为3×10⁸ m/s（或30万公里/秒）。在空气中的速度略小于真空，一般也近似取3×10⁸ m/s。"},{"id":"g2_physics_014_ex04","knowledge_id":"g2_physics_014","question":"判断题：光在所有介质中都是沿直线传播的。（  ）","answer":"答案：错误。解析：光只有在同种均匀介质中才沿直线传播。如果介质不均匀（如从空气进入水中，或大气层密度不均），光会发生偏折。"},{"id":"g2_physics_014_ex05","knowledge_id":"g2_physics_014","question":"选择题：小孔成像的特点是？ A. 成正立的虚像  B. 成倒立的实像  C. 成倒立的虚像  D. 成正立的实像","answer":"答案：B. 成倒立的实像。解析：小孔成像成的是倒立的实像，像的形状与物体形状相同，与孔的形状无关。像的大小与物体到孔的距离和光屏到孔的距离有关。"},{"id":"g2_physics_014_ex06","knowledge_id":"g2_physics_014","question":"填空题：光在水中的速度约为真空中的______（填几分之几）。","answer":"答案：3/4。解析：光在不同介质中的速度不同。真空中最快，空气中略小，水中约为真空中的3/4，玻璃中约为真空中的2/3。"},{"id":"g2_physics_014_ex07","knowledge_id":"g2_physics_014","question":"判断题：日食和月食都可以用光的直线传播来解释。（  ）","answer":"答案：正确。解析：日食是月球挡住了太阳射向地球的光，月食是地球挡住了太阳射向月球的光，都是由于光沿直线传播形成的。"},{"id":"g2_physics_014_ex08","knowledge_id":"g2_physics_014","question":"选择题：关于小孔成像，下列说法正确的是？ A. 成正立的像  B. 像的形状与孔的形状相同  C. 像的形状与物体形状相同  D. 孔越大像越清晰","answer":"答案：C. 像的形状与物体形状相同。解析：小孔成像中，像的形状与物体形状相同（倒立），与孔的形状无关。孔太小光太少，孔太大像会模糊。成的是倒立的实像。"},{"id":"g2_physics_014_ex09","knowledge_id":"g2_physics_014","question":"简答题：什么是光的直线传播？请举出至少5个光沿直线传播的例子或应用。","answer":"答案：光在同种均匀介质中沿直线传播。例子/应用：①影子的形成；②日食和月食；③小孔成像；④激光准直（挖隧道定向）；⑤排队看齐；⑥射击瞄准（三点一线）；⑦立竿见影；⑧一叶障目不见泰山。小孔成像还说明光是沿直线传播的，同时说明成的是倒立的实像。"},{"id":"g2_physics_014_ex10","knowledge_id":"g2_physics_014","question":"选择题：发生日食时，太阳、地球、月球三者的位置关系是？ A. 三者不在一条直线上  B. 地球在太阳和月球之间  C. 太阳在月球和地球之间  D. 月球在太阳和地球之间","answer":"答案：D. 月球在太阳和地球之间。解析：日食是月球挡住了太阳射向地球的光，所以此时月球在太阳和地球之间，三者在同一直线上。注意：月食时是地球在中间。"},{"id":"g2_physics_015_ex01","knowledge_id":"g2_physics_015","question":"选择题：关于\"光的反射定律\"，下列说法正确的是？ A. 这是光的反射定律的正确描述  B. 完全错误的说法  C. 与事实相反的说法  D. 混淆概念的说法","answer":"答案：A. 这是光的反射定律的正确描述。解析：本题考察对\"光的反射定律\"的理解。学习物理概念要准确把握定义和本质特征。光射到物体表面时，被物体表面反射回去的现象叫光的反射。\n\n反射定律：\n1. 反射光线、入射光线与法线在同一平面内\n2. 反射光线和入射光线分居法线两侧\n3. 反"},{"id":"g2_physics_015_ex02","knowledge_id":"g2_physics_015","question":"选择题：下列关于光的反射定律的公式/规律，正确的是？ A. 适用条件反了  B. 单位弄错了  C. ∠r = ∠i  D. 公式写错了","answer":"答案：C. ∠r = ∠i。解析：光的反射定律的公式/规律是：∠r = ∠i。掌握公式的同时要理解其物理意义和适用条件。"},{"id":"g2_physics_015_ex03","knowledge_id":"g2_physics_015","question":"填空题：光的反射定律的公式/主要内容是：______。","answer":"答案：∠r = ∠i。解析：这是光的反射定律的重要公式/内容。光射到物体表面时，被物体表面反射回去的现象叫光的反射。\n\n反射定律：\n1. 反射光线、入射光线与法线在同一平面内\n2. 反射光线和入射光线分居法线两侧\n3. 反射角等于入射角（∠r = ∠i）\n\n两种..."},{"id":"g2_physics_015_ex04","knowledge_id":"g2_physics_015","question":"判断题：学习光的反射定律只需要背公式，不需要理解。（  ）","answer":"答案：错误。解析：学习物理不仅要记住公式，更要理解公式的物理意义、推导过程和适用条件。只有真正理解了，才能灵活运用。"},{"id":"g2_physics_015_ex05","knowledge_id":"g2_physics_015","question":"选择题：学习光的反射定律时，最重要的方法是？ A. 理解概念+动手实验+练习应用  B. 只看不练  C. 只做题不思考  D. 死记硬背","answer":"答案：A. 理解概念+动手实验+练习应用。解析：物理是一门以实验为基础的学科，学习光的反射定律要注重理解概念，动手实验，通过练习巩固应用。"},{"id":"g2_physics_015_ex06","knowledge_id":"g2_physics_015","question":"填空题：光的反射定律属于______（填章节名）的内容。","answer":"答案：第四章 光现象。解析：光的反射定律是第四章 光现象的重要知识点，学习时要注意与前后知识的联系。"},{"id":"g2_physics_015_ex07","knowledge_id":"g2_physics_015","question":"判断题：光的反射定律与其他物理知识没有联系。（  ）","answer":"答案：错误。解析：物理知识是相互联系的，光的反射定律与其他知识点有密切关系。学习时要注意构建知识网络，融会贯通。"},{"id":"g2_physics_015_ex08","knowledge_id":"g2_physics_015","question":"选择题：下列关于光的反射定律的应用，正确的是？ A. 与生活无关  B. 只能用于考试  C. 完全没有实际用处  D. 可以解释相关的物理现象","answer":"答案：D. 可以解释相关的物理现象。解析：物理知识来源于生活，又服务于生活。光的反射定律可以解释许多相关的物理现象，在生活和生产中有广泛应用。"},{"id":"g2_physics_015_ex09","knowledge_id":"g2_physics_015","question":"简答题：请简述光的反射定律的主要内容。","answer":"答案：光的反射定律的主要内容是：∠r = ∠i\n（反射角等于入射角）。光射到物体表面时，被物体表面反射回去的现象叫光的反射。\n\n反射定律：\n1. 反射光线、入射光线与法线在同一平面内\n2. 反射光线和入射光线分居法线两侧\n3. 反射角等于入射角（∠r = ∠i）\n\n两种反射：\n- 镜面反射：反射面光滑，平行光反射后仍平行\n- 漫反射：反射面凹凸不平，平行光反射后射向各个方向（我们能从不同方向看到物体是因为漫反射）... 这是一个重要的物理知识点，需要在理解的基础上掌握。"},{"id":"g2_physics_015_ex10","knowledge_id":"g2_physics_015","question":"选择题：关于光的反射定律，下列说法错误的是？ A. 需要理解和应用  B. 不需要掌握，考试不考  C. 与实际生活有关  D. 是物理基础知识","answer":"答案：B. 不需要掌握，考试不考。解析：光的反射定律是重要的物理基础知识，需要认真掌握。它不仅与考试有关，更与我们的生活实际密切相关。"},{"id":"g2_physics_016_ex01","knowledge_id":"g2_physics_016","question":"选择题：关于\"平面镜成像\"，下列说法正确的是？ A. 与事实相反的说法  B. 混淆概念的说法  C. 这是平面镜成像的正确描述  D. 完全错误的说法","answer":"答案：C. 这是平面镜成像的正确描述。解析：本题考察对\"平面镜成像\ 物镜：相当于投影仪，成倒立、放大的实像\n- 目镜：相当于放大镜，把物镜成的实像再次放大成虚像\n- 物体最终成倒立、放大的虚像\n\n望远镜：\n- 开普"},{"id":"g2_physics_022_ex02","knowledge_id":"g2_physics_022","question":"选择题：下列关于显微镜与望远镜的公式/规律，正确的是？ A. 单位弄错了  B. 公式写错了  C. 适用条件反了  D. 显微镜：物镜 + 目镜（都是凸透镜）","answer":"答案：D. 显微镜：物镜 + 目镜（都是凸透镜）。解析：显微镜与望远镜的公式/规律是：显微镜：物镜 + 目镜（都是凸透镜）。掌握公式的同时要理解其物理意义和适用条件。"},{"id":"g2_physics_022_ex03","knowledge_id":"g2_physics_022","question":"填空题：显微镜与望远镜的公式/主要内容是：______。","answer":"答案：显微镜：物镜 + 目镜（都是凸透镜）。解析：这是显微镜与望远镜的重要公式/内容。显微镜：\n- 物镜：相当于投影仪，成倒立、放大的实像\n- 目镜：相当于放大镜，把物镜成的实像再次放大成虚像\n- 物体最终成倒立、放大的虚像\n\n望远镜：\n- 开普勒望远镜：物镜（使远处物体成缩小的实像）..."},{"id":"g2_physics_022_ex04","knowledge_id":"g2_physics_022","question":"判断题：学习显微镜与望远镜只需要背公式，不需要理解。（  ）","answer":"答案：错误。解析：学习物理不仅要记住公式，更要理解公式的物理意义、推导过程和适用条件。只有真正理解了，才能灵活运用。"},{"id":"g2_physics_022_ex05","knowledge_id":"g2_physics_022","question":"选择题：学习显微镜与望远镜时，最重要的方法是？ A. 死记硬背  B. 只做题不思考  C. 理解概念+动手实验+练习应用  D. 只看不练","answer":"答案：C. 理解概念+动手实验+练习应用。解析：物理是一门以实验为基础的学科，学习显微镜与望远镜要注重理解概念，动手实验，通过练习巩固应用。"},{"id":"g2_physics_022_ex06","knowledge_id":"g2_physics_022","question":"填空题：显微镜与望远镜属于______（填章节名）的内容。","answer":"答案：第五章 透镜及其应用。解析：显微镜与望远镜是第五章 透镜及其应用的重要知识点，学习时要注意与前后知识的联系。"},{"id":"g2_physics_022_ex07","knowledge_id":"g2_physics_022","question":"判断题：显微镜与望远镜与其他物理知识没有联系。（  ）","answer":"答案：错误。解析：物理知识是相互联系的，显微镜与望远镜与其他知识点有密切关系。学习时要注意构建知识网络，融会贯通。"},{"id":"g2_physics_022_ex08","knowledge_id":"g2_physics_022","question":"选择题：下列关于显微镜与望远镜的应用，正确的是？ A. 与生活无关  B. 完全没有实际用处  C. 可以解释相关的物理现象  D. 只能用于考试","answer":"答案：C. 可以解释相关的物理现象。解析：物理知识来源于生活，又服务于生活。显微镜与望远镜可以解释许多相关的物理现象，在生活和生产中有广泛应用。"},{"id":"g2_physics_022_ex09","knowledge_id":"g2_physics_022","question":"简答题：请简述显微镜与望远镜的主要内容。","answer":"答案：显微镜与望远镜的主要内容是：显微镜：物镜 + 目镜（都是凸透镜）。显微镜：\n- 物镜：相当于投影仪，成倒立、放大的实像\n- 目镜：相当于放大镜，把物镜成的实像再次放大成虚像\n- 物体最终成倒立、放大的虚像\n\n望远镜：\n- 开普勒望远镜：物镜（使远处物体成缩小的实像）+ 目镜（放大虚像）\n- 最终成倒立、缩小的虚像（视角被放大）... 这是一个重要的物理知识点，需要在理解的基础上掌握。"},{"id":"g2_physics_022_ex10","knowledge_id":"g2_physics_022","question":"选择题：关于显微镜与望远镜，下列说法错误的是？ A. 不需要掌握，考试不考  B. 与实际生活有关  C. 是物理基础知识  D. 需要理解和应用","answer":"答案：A. 不需要掌握，考试不考。解析：显微镜与望远镜是重要的物理基础知识，需要认真掌握。它不仅与考试有关，更与我们的生活实际密切相关。"},{"id":"g2_physics_023_ex01","knowledge_id":"g2_physics_023","question":"选择题：关于平均速度，下列说法正确的是？ A. 平均速度就是速度的平均值  B. 平均速度越大，速度越大  C. 平均速度和速度是一回事  D. 平均速度 = 总路程 ÷ 总时间","answer":"答案：D. 平均速度 = 总路程 ÷ 总时间。解析：平均速度表示物体在某段路程（或某段时间）内的平均快慢程度，公式是 v̄ = s总 / t总。平均速度不是速度的平均值！"},{"id":"g2_physics_023_ex02","knowledge_id":"g2_physics_023","question":"选择题：某物体在前一半路程的速度是v₁，后一半路程的速度是v₂，则全程的平均速度是？ A. v₁ + v₂  B. 2v₁v₂ / (v₁+v₂)  C. (v₁+v₂) / 2  D. (v₁+v₂) / v₁v₂","answer":"答案：B. 2v₁v₂ / (v₁+v₂)。解析：设总路程为2s，则前一半路程时间t₁=s/v₁，后一半路程时间t₂=s/v₂。平均速度v = 2s/(t₁+t₂) = 2s/(s/v₁+s/v₂) = 2v₁v₂/(v₁+v₂)。这是路程相等时的平均速度公式。"},{"id":"g2_physics_023_ex03","knowledge_id":"g2_physics_023","question":"填空题：平均速度______（填\"是\"或\"不是\"）速度的平均值。","answer":"答案：不是。解析：平均速度不是速度的平均值，而是总路程除以总时间。只有在特殊情况下（如各段时间相等），平均速度才等于速度的平均值。"},{"id":"g2_physics_023_ex04","knowledge_id":"g2_physics_023","question":"判断题：做变速运动的物体，平均速度就是速度的平均值。（  ）","answer":"答案：错误。解析：平均速度 = 总路程 ÷ 总时间，不是简单地把速度加起来除以次数。只有当各段运动时间相等时，平均速度才等于速度的平均值。"},{"id":"g2_physics_023_ex05","knowledge_id":"g2_physics_023","question":"选择题：小明跑100 m，前50 m用了8 s，后50 m用了12 s，则他跑完全程的平均速度是？ A. 约5.2 m/s  B. 6 m/s  C. 5 m/s  D. 10 m/s","answer":"答案：C. 5 m/s。解析：平均速度 = 总路程 ÷ 总时间 = 100 m ÷ (8 s + 12 s) = 100 m ÷ 20 s = 5 m/s。注意不是(50/8 + 50/12)/2，那是速度的平均值。"},{"id":"g2_physics_023_ex06","knowledge_id":"g2_physics_023","question":"填空题：说一个物体的平均速度，必须指明是在哪段______或哪段______内的平均速度才有意义。","answer":"答案：路程；时间。解析：平均速度的数值与所选的路程或时间有关，不同路段（或时间段）的平均速度可能不同，所以说平均速度必须指明是哪段路程（或哪段时间）的。"},{"id":"g2_physics_023_ex07","knowledge_id":"g2_physics_023","question":"判断题：平均速度为0，说明物体一定静止。（  ）","answer":"答案：错误。解析：平均速度为0，只是说明总位移为0（回到了出发点），但物体不一定静止。比如绕操场跑一圈回到起点，平均速度为0，但人一直在运动。"},{"id":"g2_physics_023_ex08","knowledge_id":"g2_physics_023","question":"选择题：一辆汽车从甲地到乙地，前一半时间的速度是v₁，后一半时间的速度是v₂，则全程的平均速度是？ A. (v₁ + v₂) / 2  B. 2v₁v₂ / (v₁+v₂)  C. v₁ + v₂  D. v₁v₂ / (v₁+v₂)","answer":"答案：A. (v₁ + v₂) / 2。解析：设总时间为2t，则前一半时间路程s₁=v₁t，后一半时间路程s₂=v₂t。平均速度v = (s₁+s₂)/2t = (v₁t+v₂t)/2t = (v₁+v₂)/2。这是时间相等时的平均速度，等于速度的平均值。"},{"id":"g2_physics_023_ex09","knowledge_id":"g2_physics_023","question":"简答题：平均速度和速度有什么区别？为什么说平均速度不是速度的平均值？","answer":"答案：区别：①速度描述的是某一时刻（或某一位置）物体运动的快慢；平均速度描述的是某段时间（或某段路程）内物体运动的平均快慢。②匀速直线运动中，速度处处相等，平均速度等于速度；变速运动中，各时刻速度可能不同，平均速度不等于速度。平均速度不是速度的平均值：因为平均速度的定义是总路程除以总时间（v̄ = s总/t总），而不是各段速度的算术平均值。只有在特殊条件下（如各段运动时间相等），平均速度才等于速度的平均值。"},{"id":"g2_physics_023_ex10","knowledge_id":"g2_physics_023","question":"选择题：关于平均速度的说法，正确的是？ A. 平均速度就是速度的平均值  B. 平均速度要指明是哪段路程或哪段时间  C. 平均速度等于初末速度的平均值  D. 平均速度越大，末速度越大","answer":"答案：B. 平均速度要指明是哪段路程或哪段时间。解析：平均速度与所选的路程（或时间）有关，必须指明是哪段路程或哪段时间内的平均速度。其他选项都不准确。"},{"id":"g2_physics_024_ex01","knowledge_id":"g2_physics_024","question":"选择题：关于\"声音在不同介质中的传播\"，下列说法正确的是？ A. 与事实相反的说法  B. 这是声音在不同介质中的传播的正确描述  C. 完全错误的说法  D. 混淆概念的说法","answer":"答案：B. 这是声音在不同介质中的传播的正确描述。解析：本题考察对\"声音在不同介质中的传播\"的理解。学习物理概念要准确把握定义和本质特征。声音传播速度：\n- 在不同介质中传播速度不同\n- 一般情况下：v（固体）> v（液体）> v（气体）\n- 同种介质中，温度越高，传播速度越快\n\n应用：\n- 古代"},{"id":"g2_physics_024_ex02","knowledge_id":"g2_physics_024","question":"选择题：下列关于声音在不同介质中的传播的公式/规律，正确的是？ A. 公式写错了  B. 单位弄错了  C. 适用条件反了  D. v（固体）> v（液体）> v（气体）","answer":"答案：D. v（固体）> v（液体）> v（气体）。解析：声音在不同介质中的传播的公式/规律是：v（固体）> v（液体）> v（气体）。掌握公式的同时要理解其物理意义和适用条件。"},{"id":"g2_physics_024_ex03","knowledge_id":"g2_physics_024","question":"填空题：声音在不同介质中的传播的公式/主要内容是：______。","answer":"答案：v（固体）> v（液体）> v（气体）。解析：这是声音在不同介质中的传播的重要公式/内容。声音传播速度：\n- 在不同介质中传播速度不同\n- 一般情况下：v（固体）> v（液体）> v（气体）\n- 同种介质中，温度越高，传播速度越快\n\n应用：\n- 古代行军：士兵枕着牛皮箭筒睡觉，能及早听到敌..."},{"id":"g2_physics_024_ex04","knowledge_id":"g2_physics_024","question":"判断题：学习声音在不同介质中的传播只需要背公式，不需要理解。（  ）","answer":"答案：错误。解析：学习物理不仅要记住公式，更要理解公式的物理意义、推导过程和适用条件。只有真正理解了，才能灵活运用。"},{"id":"g2_physics_024_ex05","knowledge_id":"g2_physics_024","question":"选择题：学习声音在不同介质中的传播时，最重要的方法是？ A. 只看不练  B. 死记硬背  C. 只做题不思考  D. 理解概念+动手实验+练习应用","answer":"答案：D. 理解概念+动手实验+练习应用。解析：物理是一门以实验为基础的学科，学习声音在不同介质中的传播要注重理解概念，动手实验，通过练习巩固应用。"},{"id":"g2_physics_024_ex06","knowledge_id":"g2 cs_030_ex05","knowledge_id":"g2_physics_030","question":"选择题：学习密度的概念与公式时，最重要的方法是？ A. 死记硬背  B. 理解概念+动手实验+练习应用  C. 只做题不思考  D. 只看不练","answer":"答案：B. 理解概念+动手实验+练习应用。解析：物理是一门以实验为基础的学科，学习密度的概念与公式要注重理解概念，动手实验，通过练习巩固应用。"},{"id":"g2_physics_030_ex06","knowledge_id":"g2_physics_030","question":"填空题：密度的概念与公式属于______（填章节名）的内容。","answer":"答案：第六章 质量与密度。解析：密度的概念与公式是第六章 质量与密度的重要知识点，学习时要注意与前后知识的联系。"},{"id":"g2_physics_030_ex07","knowledge_id":"g2_physics_030","question":"判断题：密度的概念与公式与其他物理知识没有联系。（  ）","answer":"答案：错误。解析：物理知识是相互联系的，密度的概念与公式与其他知识点有密切关系。学习时要注意构建知识网络，融会贯通。"},{"id":"g2_physics_030_ex08","knowledge_id":"g2_physics_030","question":"选择题：下列关于密度的概念与公式的应用，正确的是？ A. 可以解释相关的物理现象  B. 只能用于考试  C. 与生活无关  D. 完全没有实际用处","answer":"答案：A. 可以解释相关的物理现象。解析：物理知识来源于生活，又服务于生活。密度的概念与公式可以解释许多相关的物理现象，在生活和生产中有广泛应用。"},{"id":"g2_physics_030_ex09","knowledge_id":"g2_physics_030","question":"简答题：请简述密度的概念与公式的主要内容。","answer":"答案：密度的概念与公式的主要内容是：ρ = m / V\n（ρ：密度，m：质量，V：体积）。密度：单位体积某种物质的质量。\n\n性质：\n- 密度是物质的一种特性，与物体的质量、体积无关（与温度、状态有关）\n- 单位：kg/m³ 或 g/cm³\n- 换算：1 g/cm³ = 1000 kg/m³ = 10³ kg/m³\n\n常见物质密度（水=1.0 g/cm³）：\n- 铝 2.7 g/cm³\n- 铁 7.9 g/cm³\n- 铜 8.9 g/cm³\n- 水银 13.6 g/cm³... 这是一个重要的物理知识点，需要在理解的基础上掌握。"},{"id":"g2_physics_030_ex10","knowledge_id":"g2_physics_030","question":"选择题：关于密度的概念与公式，下列说法错误的是？ A. 是物理基础知识  B. 需要理解和应用  C. 与实际生活有关  D. 不需要掌握，考试不考","answer":"答案：D. 不需要掌握，考试不考。解析：密度的概念与公式是重要的物理基础知识，需要认真掌握。它不仅与考试有关，更与我们的生活实际密切相关。"},{"id":"g2_physics_031_ex01","knowledge_id":"g2_physics_031","question":"选择题：关于\"密度的应用\"，下列说法正确的是？ A. 混淆概念的说法  B. 这是密度的应用的正确描述  C. 与事实相反的说法  D. 完全错误的说法","answer":"答案：B. 这是密度的应用的正确描述。解析：本题考察对\"密度的应用\"的理解。学习物理概念要准确把握定义和本质特征。密度公式变形：\n- m = ρV（已知体积求质量）\n- V = m / ρ（已知质量求体积）\n\n应用：\n1. 鉴别物质：测出密度，对照密度表\n2. 求质量：不便"},{"id":"g2_physics_031_ex02","knowledge_id":"g2_physics_031","question":"选择题：下列关于密度的应用的公式/规律，正确的是？ A. 公式写错了  B. m = ρV  C. 单位弄错了  D. 适用条件反了","answer":"答案：B. m = ρV。解析：密度的应用的公式/规律是：m = ρV。掌握公式的同时要理解其物理意义和适用条件。"},{"id":"g2_physics_031_ex03","knowledge_id":"g2_physics_031","question" answer":"答案：力的概念与作用效果的主要内容是：力的单位：牛顿（N）。力：物体对物体的作用。\n\n力的作用效果：\n1. 改变物体的形状（使物体发生形变）\n2. 改变物体的运动状态（速度大小或方向改变）\n\n力的三要素：大小、方向、作用点。\n\n单位：牛顿（N），1 N 大约等于拿起 2 个鸡蛋的力。\n\n力的相互性：\n- 物体间力的作用是相互的\n- 一个物体对另一个物体施力时，也一定受到另一个物体对它的力\n- 作用力与反作用力大小相等，方向相反，作用在两个不同物体上... 这是一个重要的物理知识点，需要在理解的基础上掌握。"},{"id":"g2_physics_033_ex10","knowledge_id":"g2_physics_033","question":"选择题：关于力的概念与作用效果，下列说法错误的是？ A. 需要理解和应用  B. 与实际生活有关  C. 不需要掌握，考试不考  D. 是物理基础知识","answer":"答案：C. 不需要掌握，考试不考。解析：力的概念与作用效果是重要的物理基础知识，需要认真掌握。它不仅与考试有关，更与我们的生活实际密切相关。"},{"id":"g2_physics_034_ex01","knowledge_id":"g2_physics_034","question":"选择题：关于\"弹力与弹簧测力计\"，下列说法正确的是？ A. 这是弹力与弹簧测力计的正确描述  B. 混淆概念的说法  C. 与事实相反的说法  D. 完全错误的说法","answer":"答案：A. 这是弹力与弹簧测力计的正确描述。解析：本题考察对\"弹力与弹簧测力计\"的理解。学习物理概念要准确把握定义和本质特征。弹力：物体发生弹性形变时产生的力。\n\n条件：\n- 物体间相互接触\n- 发生弹性形变\n\n常见弹力：压力、支持力、推力、拉力、绳的拉力等。\n\n弹簧测力计：\n- 原理"},{"id":"g2_physics_034_ex02","knowledge_id":"g2_physics_034","question":"选择题：下列关于弹力与弹簧测力计的公式/规律，正确的是？ A. 单位弄错了  B. 适用条件反了  C. 公式写错了  D. F = kx（胡克定律）","answer":"答案：D. F = kx（胡克定律）。解析：弹力与弹簧测力计的公式/规律是：F = kx（胡克定律）。掌握公式的同时要理解其物理意义和适用条件。"},{"id":"g2_physics_034_ex03","knowledge_id":"g2_physics_034","question":"填空题：弹力与弹簧测力计的公式/主要内容是：______。","answer":"答案：F = kx（胡克定律）。解析：这是弹力与弹簧测力计的重要公式/内容。弹力：物体发生弹性形变时产生的力。\n\n条件：\n- 物体间相互接触\n- 发生弹性形变\n\n常见弹力：压力、支持力、推力、拉力、绳的拉力等。\n\n弹簧测力计：\n- 原理：在弹性限度内，弹簧的伸长量与所受拉力成..."},{"id":"g2_physics_034_ex04","knowledge_id":"g2_physics_034","question":"判断题：学习弹力与弹簧测力计只需要背公式，不需要理解。（  ）","answer":"答案：错误。解析：学习物理不仅要记住公式，更要理解公式的物理意义、推导过程和适用条件。只有真正理解了，才能灵活运用。"},{"id":"g2_physics_034_ex05","knowledge_id":"g2_physics_034","question":"选择题：学习弹力与弹簧测力计时，最重要的方法是？ A. 只看不练  B. 死记硬背  C. 理解概念+动手实验+练习应用  D. 只做题不思考","answer":"答案：C. 理解概念+动手实验+练习应用。解析：物理是一门以实验为基础的学科，学习弹力与弹簧测力计要注重理解概念，动手实验，通过练习巩固应用。"},{"id":"g2_physics_034_ex06","knowledge_id":"g2_physics_034","question":"填空题：弹力与弹簧测力计属于______（填章节名）的内容。","answer":"答案：第七章 力。解析：弹力与弹簧测力计是第七章 力的重要知识点，学习时要注意与前后知识的联系。"},{"id":"g2_physics_034_ex07","knowledge_id":"g2_physics_034","question":"判断题：弹力与弹簧测力计与其他物理知识没有 swer":"答案：错误。解析：学习物理不仅要记住公式，更要理解公式的物理意义、推导过程和适用条件。只有真正理解了，才能灵活运用。"},{"id":"g2_physics_036_ex05","knowledge_id":"g2_physics_036","question":"选择题：学习摩擦力时，最重要的方法是？ A. 只看不练  B. 理解概念+动手实验+练习应用  C. 死记硬背  D. 只做题不思考","answer":"答案：B. 理解概念+动手实验+练习应用。解析：物理是一门以实验为基础的学科，学习摩擦力要注重理解概念，动手实验，通过练习巩固应用。"},{"id":"g2_physics_036_ex06","knowledge_id":"g2_physics_036","question":"填空题：摩擦力属于______（填章节名）的内容。","answer":"答案：第七章 力。解析：摩擦力是第七章 力的重要知识点，学习时要注意与前后知识的联系。"},{"id":"g2_physics_036_ex07","knowledge_id":"g2_physics_036","question":"判断题：摩擦力与其他物理知识没有联系。（  ）","answer":"答案：错误。解析：物理知识是相互联系的，摩擦力与其他知识点有密切关系。学习时要注意构建知识网络，融会贯通。"},{"id":"g2_physics_036_ex08","knowledge_id":"g2_physics_036","question":"选择题：下列关于摩擦力的应用，正确的是？ A. 只能用于考试  B. 可以解释相关的物理现象  C. 与生活无关  D. 完全没有实际用处","answer":"答案：B. 可以解释相关的物理现象。解析：物理知识来源于生活，又服务于生活。摩擦力可以解释许多相关的物理现象，在生活和生产中有广泛应用。"},{"id":"g2_physics_036_ex09","knowledge_id":"g2_physics_036","question":"简答题：请简述摩擦力的主要内容。","answer":"答案：摩擦力的主要内容是：f = μN。摩擦力：两个相互接触的物体发生相对运动或有相对运动趋势时，在接触面上产生的阻碍相对运动的力。\n\n分类：\n1. 滑动摩擦力：\n   - 方向：与相对运动方向相反\n   - 大小：与压力、接触面粗糙程度有关，与速度无关\n2. 静摩擦力：\n   - 方向：与相对运动趋势方向相反\n   - 大小：随外力的变化而变化\n3. 滚动摩擦力：比滑动摩擦力小得多\n\n增大有益摩擦：增大压力、使接触面更粗糙\n减小有害摩... 这是一个重要的物理知识点，需要在理解的基础上掌握。"},{"id":"g2_physics_036_ex10","knowledge_id":"g2_physics_036","question":"选择题：关于摩擦力，下列说法错误的是？ A. 需要理解和应用  B. 不需要掌握，考试不考  C. 与实际生活有关  D. 是物理基础知识","answer":"答案：B. 不需要掌握，考试不考。解析：摩擦力是重要的物理基础知识，需要认真掌握。它不仅与考试有关，更与我们的生活实际密切相关。"},{"id":"g2_physics_037_ex01","knowledge_id":"g2_physics_037","question":"选择题：关于\"牛顿第一定律\"，下列说法正确的是？ A. 这是牛顿第一定律的正确描述  B. 完全错误的说法  C. 与事实相反的说法  D. 混淆概念的说法","answer":"答案：A. 这是牛顿第一定律的正确描述。解析：本题考察对\"牛顿第一定律\"的理解。学习物理概念要准确把握定义和本质特征。牛顿第一定律（惯性定律）：\n一切物体在没有受到外力作用时，总保持静止状态或匀速直线运动状态。\n\n说明：\n1. 该定律是在大量经验事实基础上，通过进一步的推理而概"},{"id":"g2_physics_037_ex02","knowledge_id":"g2_physics_037","question":"选择题：下列关于牛顿第一定律的公式/规律，正确的是？ A. 公式写错了  B. 一切物体在没有受到外力作用时  C. 适用条件反了  D. 单位弄错了","answer":"答案：B. 一切物体在没有受到外力作用时。解析：牛顿第一定律的公式/规律是：一切物体在没有受到外力作用时。掌握公式的同时要理解其物理意义和适用条件。"},{"id":"g2_physics_037_ex03","knowledge_id":"g2_physics_037","question":"填空题：牛顿第一定律的公式/主要内容是：______。","answer":"答案：一切物体在没有受到外力作用时。解析：这是牛顿第一定律的重要公式/内容。牛顿第一定律（惯性定律）：\n一切物体在没有受到外力作用时，总保持静止状态或匀速直线运动状态。\n\n说明：\n1. 该定律是在大量经验事实基础上，通过进一步的推理而概括出来的\n2. 不受力的物体是不存在的，..."},{"id":"g2_physics_037_ex04","knowledge_id":"g2_physics_037","question":"判断题：学习牛顿第一定律只需要背公式，不需要理解。（  ）","answer":"答案：错误。解析：学习物理不仅要记住公式，更要理解公式的物理意义、推导过程和适用条件。只有真正理解了，才能灵活运用。"},{"id":"g2_physics_037_ex05","knowledge_id":"g2_physics_037","question":"选择题：学习牛顿第一定律时，最重要的方法是？ A. 死记硬背  B. 只看不练  C. 理解概念+动手实验+练习应用  D. 只做题不思考","answer":"答案：C. 理解概念+动手实验+练习应用。解析：物理是一门以实验为基础的学科，学习牛顿第一定律要注重理解概念，动手实验，通过练习巩固应用。"},{"id":"g2_physics_037_ex06","knowledge_id":"g2_physics_037","question":"填空题：牛顿第一定律属于______（填章节名）的内容。","answer":"答案：第八章 运动和力。解析：牛顿第一定律是第八章 运动和力的重要知识点，学习时要注意与前后知识的联系。"},{"id":"g2_physics_037_ex07","knowledge_id":"g2_physics_037","question":"判断题：牛顿第一定律与其他物理知识没有联系。（  ）","answer":"答案：错误。解析：物理知识是相互联系的，牛顿第一定律与其他知识点有密切关系。学习时要注意构建知识网络，融会贯通。"},{"id":"g2_physics_037_ex08","knowledge_id":"g2_physics_037","question":"选择题：下列关于牛顿第一定律的应用，正确的是？ A. 与生活无关  B. 可以解释相关的物理现象  C. 完全没有实际用处  D. 只能用于考试","answer":"答案：B. 可以解释相关的物理现象。解析：物理知识来源于生活，又服务于生活。牛顿第一定律可以解释许多相关的物理现象，在生活和生产中有广泛应用。"},{"id":"g2_physics_037_ex09","knowledge_id":"g2_physics_037","question":"简答题：请简述牛顿第一定律的主要内容。","answer":"答案：牛顿第一定律的主要内容是：一切物体在没有受到外力作用时\n总保持静止或匀速直线运动状态。牛顿第一定律（惯性定律）：\n一切物体在没有受到外力作用时，总保持静止状态或匀速直线运动状态。\n\n说明：\n1. 该定律是在大量经验事实基础上，通过进一步的推理而概括出来的\n2. 不受力的物体是不存在的，所以牛顿第一定律是理想情况\n3. 力是改变物体运动状态的原因\n4. 物体的运动不需要力来维持... 这是一个重要的物理知识点，需要在理解的基础上掌握。"},{"id":"g2_physics_037_ex10","knowledge_id":"g2_physics_037","question":"选择题：关于牛顿第一定律，下列说法错误的是？ A. 与实际生活有关  B. 需要理解和应用  C. 是物理基础知识  D. 不需要掌握，考试不考","answer":"答案：D. 不需要掌握，考试不考。解析：牛顿第一定律是重要的物理基础知识，需要认真掌握。它不仅与考试有关，更与我们的生活实际密切相关。"},{"id":"g2_physics_038_ex01","knowledge_id":"g2_physics_038","question":"选择题：关于\"惯性\"，下列说法正确的是？ A. 混淆概念的说法  B. 完全错误的说法  C. 这是惯性的正确描述  D. 与事实相反的说法","answer":"答案：C. 这是惯性的正确描述。解析：本题考察对\"惯性\"的理解。学习物理概念要准确把握定义和本质特征。惯性：物体保持原来运动状态不变的性质。\n\n性质：\n1. 一切物体在任何时候都具有惯性\n2. 惯性大小只与质量有关，质量越大惯性越大\n3. 惯性不是力，不能说「受"},{"id":"g2_physics_038_ex02","knowledge_id":"g2_physics_038","question":"选择题：下列关于惯性的公式/规律，正确的是？ A. 适用条件反了  B. 公式写错了  C. 单位弄错了  D. 一切物体都有保持原来运动状态的性质","answer":"答案：D. 一切物体都有保持原来运动状态的性质。解析：惯性的公式/规律是：一切物体都有保持原来运动状态的性质。掌握公式的同时要理解其物理意义和适用条件。"},{"id":"g2_physics_038_ex03","knowledge_id":"g2_physics_038","question":"填空题：惯性的公式/主要内容是：______。","answer":"答案：一切物体都有保持原来运动状态的性质。解析：这是惯性的重要公式/内容。惯性：物体保持原来运动状态不变的性质。\n\n性质：\n1. 一切物体在任何时候都具有惯性\n2. 惯性大小只与质量有关，质量越大惯性越大\n3. 惯性不是力，不能说「受到惯性作用」\n\n应用：\n- 跳远前的助跑..."},{"id":"g2_physics_038_ex04","knowledge_id":"g2_physics_038","question":"判断题：学习惯性只需要背公式，不需要理解。（  ）","answer":"答案：错误。解析：学习物理不仅要记住公式，更要理解公式的物理意义、推导过程和适用条件。只有真正理解了，才能灵活运用。"},{"id":"g2_physics_038_ex05","knowledge_id":"g2_physics_038","question":"选择题：学习惯性时，最重要的方法是？ A. 只看不练  B. 只做题不思考  C. 死记硬背  D. 理解概念+动手实验+练习应用","answer":"答案：D. 理解概念+动手实验+练习应用。解析：物理是一门以实验为基础的学科，学习惯性要注重理解概念，动手实验，通过练习巩固应用。"},{"id":"g2_physics_038_ex06","knowledge_id":"g2_physics_038","question":"填空题：惯性属于______（填章节名）的内容。","answer":"答案：第八章 运动和力。解析：惯性是第八章 运动和力的重要知识点，学习时要注意与前后知识的联系。"},{"id":"g2_physics_038_ex07","knowledge_id":"g2_physics_038","question":"判断题：惯性与其他物理知识没有联系。（  ）","answer":"答案：错误。解析：物理知识是相互联系的，惯性与其他知识点有密切关系。学习时要注意构建知识网络，融会贯通。"},{"id":"g2_physics_038_ex08","knowledge_id":"g2_physics_038","question":"选择题：下列关于惯性的应用，正确的是？ A. 可以解释相关的物理现象  B. 完全没有实际用处  C. 只能用于考试  D. 与生活无关","answer":"答案：A. 可以解释相关的物理现象。解析：物理知识来源于生活，又服务于生活。惯性可以解释许多相关的物理现象，在生活和生产中有广泛应用。"},{"id":"g2_physics_038_ex09","knowledge_id":"g2_physics_038","question":"简答题：请简述惯性的主要内容。","answer":"答案：惯性的主要内容是：一切物体都有保持原来运动状态的性质。惯性：物体保持原来运动状态不变的性质。\n\n性质：\n1. 一切物体在任何时候都具有惯性\n2. 惯性大小只与质量有关，质量越大惯性越大\n3. 惯性不是力，不能说「受到惯性作用」\n\n应用：\n- 跳远前的助跑\n- 拍打衣服上的灰尘\n- 锤头松了用撞击方法套紧\n- 安全带的作用... 这是一个重要的物理知识点，需要在理解的基础上掌握。"},{"id":"g2_physics_038_ex10","knowledge_id":"g2_physics_038","question":"选择题：关于惯性，下列说法错误的是？ A. 不需要掌握，考试不考  B. 与实际生活有关  C. 需要理解和应用  D. 是物理基础知识","answer":"答案：A. 不需要掌握，考试不考。解析：惯性是重要的物理基础知识，需要认真掌握。它不仅与考试有关，更与我们的生活实际密切相关。"},{"id":"g 释相关的物理现象  C. 与生活无关  D. 只能用于考试","answer":"答案：B. 可以解释相关的物理现象。解析：物理知识来源于生活，又服务于生活。同一直线上二力的合成可以解释许多相关的物理现象，在生活和生产中有广泛应用。"},{"id":"g2_physics_040_ex09","knowledge_id":"g2_physics_040","question":"简答题：请简述同一直线上二力的合成的主要内容。","answer":"答案：同一直线上二力的合成的主要内容是：同方向：F = F1 + F2\n反方向：F = |F1 - F2|。合力：如果一个力产生的效果跟几个力共同作用产生的效果相同，这个力就叫做那几个力的合力。\n\n同一直线上二力的合成：\n1. 同方向：F合 = F1 + F2，方向与 F1、F2 相同\n2. 反方向：F合 = |F1 - F2|，方向与较大的力相同\n\n注意：\n- 合力可以大于、等于或小于任一分力\n- 合力是等效替代，不是真正存在的力... 这是一个重要的物理知识点，需要在理解的基础上掌握。"},{"id":"g2_physics_040_ex10","knowledge_id":"g2_physics_040","question":"选择题：关于同一直线上二力的合成，下列说法错误的是？ A. 与实际生活有关  B. 不需要掌握，考试不考  C. 是物理基础知识  D. 需要理解和应用","answer":"答案：B. 不需要掌握，考试不考。解析：同一直线上二力的合成是重要的物理基础知识，需要认真掌握。它不仅与考试有关，更与我们的生活实际密切相关。"},{"id":"g2_physics_041_ex01","knowledge_id":"g2_physics_041","question":"选择题：关于\"压强的概念与公式\"，下列说法正确的是？ A. 混淆概念的说法  B. 这是压强的概念与公式的正确描述  C. 与事实相反的说法  D. 完全错误的说法","answer":"答案：B. 这是压强的概念与公式的正确描述。解析：本题考察对\"压强的概念与公式\"的理解。学习物理概念要准确把握定义和本质特征。压强：物体所受压力的大小与受力面积之比。\n\n物理意义：表示压力作用效果的物理量。\n\n公式：p = F / S\n- F：压力（单位 N）\n- S：受力面积（单位 "},{"id":"g2_physics_041_ex02","knowledge_id":"g2_physics_041","question":"选择题：下列关于压强的概念与公式的公式/规律，正确的是？ A. p = F / S  B. 单位弄错了  C. 公式写错了  D. 适用条件反了","answer":"答案：A. p = F / S。解析：压强的概念与公式的公式/规律是：p = F / S。掌握公式的同时要理解其物理意义和适用条件。"},{"id":"g2_physics_041_ex03","knowledge_id":"g2_physics_041","question":"填空题：压强的概念与公式的公式/主要内容是：______。","answer":"答案：p = F / S。解析：这是压强的概念与公式的重要公式/内容。压强：物体所受压力的大小与受力面积之比。\n\n物理意义：表示压力作用效果的物理量。\n\n公式：p = F / S\n- F：压力（单位 N）\n- S：受力面积（单位 m²）\n- p：压强（单位 Pa）\n\n应..."},{"id":"g2_physics_041_ex04","knowledge_id":"g2_physics_041","question":"判断题：学习压强的概念与公式只需要背公式，不需要理解。（  ）","answer":"答案：错误。解析：学习物理不仅要记住公式，更要理解公式的物理意义、推导过程和适用条件。只有真正理解了，才能灵活运用。"},{"id":"g2_physics_041_ex05","knowledge_id":"g2_physics_041","question":"选择题：学习压强的概念与公式时，最重要的方法是？ A. 只看不练  B. 理解概念+动手实验+练习应用  C. 只做题不思考  D. 死记硬背","answer":"答案：B. 理解概念+动手实验+练习应用。解析：物理是一门以实验为基础的学科，学习压强的概念与公式要注重理解概念，动手实验，通过练习巩固应用。"},{"id":"g2_physics_041_ex06","knowledge_id":"g2_physics_041","question":"填空题：压强的概念与公式属于______（填章节名）的内容。","answer":"答案：第九章 压强。解析：压强的概念与公式是第九章 压强的重要知识点，学习时要注意与前后知识的联系。"},{"id":"g2_physics_041_ex07","knowledge_id":"g2_physics_041","question":"判断题：压强的概念与公式与其他物理知识没有联系。（  ）","answer":"答案：错误。解析：物理知识是相互联系的，压强的概念与公式与其他知识点有密切关系。学习时要注意构建知识网络，融会贯通。"},{"id":"g2_physics_041_ex08","knowledge_id":"g2_physics_041","question":"选择题：下列关于压强的概念与公式的应用，正确的是？ A. 可以解释相关的物理现象  B. 与生活无关  C. 完全没有实际用处  D. 只能用于考试","answer":"答案：A. 可以解释相关的物理现象。解析：物理知识来源于生活，又服务于生活。压强的概念与公式可以解释许多相关的物理现象，在生活和生产中有广泛应用。"},{"id":"g2_physics_041_ex09","knowledge_id":"g2_physics_041","question":"简答题：请简述压强的概念与公式的主要内容。","answer":"答案：压强的概念与公式的主要内容是：p = F / S\n单位：Pa（帕斯卡），1 Pa = 1 N/m²。压强：物体所受压力的大小与受力面积之比。\n\n物理意义：表示压力作用效果的物理量。\n\n公式：p = F / S\n- F：压力（单位 N）\n- S：受力面积（单位 m²）\n- p：压强（单位 Pa）\n\n应用：\n- 增大压强：增大压力、减小受力面积\n- 减小压强：减小压力、增大受力面积\n\n实例：\n- 啄木鸟的嘴尖、针尖、刀刃\n- 书包带宽、坦克履带、滑雪板... 这是一个重要的物理知识点，需要在理解的基础上掌握。"},{"id":"g2_physics_041_ex10","knowledge_id":"g2_physics_041","question":"选择题：关于压强的概念与公式，下列说法错误的是？ A. 不需要掌握，考试不考  B. 是物理基础知识  C. 与实际生活有关  D. 需要理解和应用","answer":"答案：A. 不需要掌握，考试不考。解析：压强的概念与公式是重要的物理基础知识，需要认真掌握。它不仅与考试有关，更与我们的生活实际密切相关。"},{"id":"g2_physics_042_ex01","knowledge_id":"g2_physics_042","question":"选择题：关于\"液体的压强\"，下列说法正确的是？ A. 与事实相反的说法  B. 这是液体的压强的正确描述  C. 混淆概念的说法  D. 完全错误的说法","answer":"答案：B. 这是液体的压强的正确描述。解析：本题考察对\"液体的压强\"的理解。学习物理概念要准确把握定义和本质特征。液体压强：\n- 由于液体受到重力且具有流动性，所以液体对容器底和侧壁都有压强\n- 液体内部向各个方向都有压强\n\n液体压强公式：p = ρ液 g h\n- 适用条件"},{"id":"g2_physics_042_ex02","knowledge_id":"g2_physics_042","question":"选择题：下列关于液体的压强的公式/规律，正确的是？ A. 适用条件反了  B. 公式写错了  C. p = ρgh  D. 单位弄错了","answer":"答案：C. p = ρgh。解析：液体的压强的公式/规律是：p = ρgh。掌握公式的同时要理解其物理意义和适用条件。"},{"id":"g2_physics_042_ex03","knowledge_id":"g2_physics_042","question":"填空题：液体的压强的公式/主要内容是：______。","answer":"答案：p = ρgh。解析：这是液体的压强的重要公式/内容。液体压强：\n- 由于液体受到重力且具有流动性，所以液体对容器底和侧壁都有压强\n- 液体内部向各个方向都有压强\n\n液体压强公式：p = ρ液 g h\n- 适用条件：静止液体\n- 深度 h：液面到所求点的..."},{"id":"g2_physics_042_ex04","knowledge_id":"g2_physics_042","question":"判断题：学习液体的压强只需要背公式，不需要理解。（  ）","ans "},{"id":"g2_physics_045_ex09","knowledge_id":"g2_physics_045","question":"简答题：请简述浮力的概念的主要内容。","answer":"答案：浮力的概念的主要内容是：F浮 = F下 - F上（压力差法）。浮力：浸在液体（或气体）中的物体受到液体（或气体）向上的托力。\n\n方向：竖直向上\n施力物体：液体（或气体）\n\n称重法：F浮 = G物 - F示（物体在空气中的重力减去浸在液体中时弹簧测力计的示数）\n\n浮力产生原因：\n- 液体对物体上下表面的压力差\n- F浮 = F下表面 - F上表面\n- 当物体下表面没有液体时（如物体紧贴容器底部），F浮 = 0（特例）... 这是一个重要的物理知识点，需要在理解的基础上掌握。"},{"id":"g2_physics_045_ex10","knowledge_id":"g2_physics_045","question":"选择题：关于浮力的概念，下列说法错误的是？ A. 不需要掌握，考试不考  B. 是物理基础知识  C. 与实际生活有关  D. 需要理解和应用","answer":"答案：A. 不需要掌握，考试不考。解析：浮力的概念是重要的物理基础知识，需要认真掌握。它不仅与考试有关，更与我们的生活实际密切相关。"},{"id":"g2_physics_046_ex01","knowledge_id":"g2_physics_046","question":"选择题：关于\"阿基米德原理\"，下列说法正确的是？ A. 与事实相反的说法  B. 这是阿基米德原理的正确描述  C. 完全错误的说法  D. 混淆概念的说法","answer":"答案：B. 这是阿基米德原理的正确描述。解析：本题考察对\"阿基米德原理\"的理解。学习物理概念要准确把握定义和本质特征。阿基米德原理：\n浸在液体中的物体所受的浮力，等于它排开的液体所受的重力。\n\n公式：F浮 = G排液 = m排g = ρ液gV排\n- 适用：液体和气体\n- V排："},{"id":"g2_physics_046_ex02","knowledge_id":"g2_physics_046","question":"选择题：下列关于阿基米德原理的公式/规律，正确的是？ A. 适用条件反了  B. F浮 = G排 = ρ液 g V排  C. 单位弄错了  D. 公式写错了","answer":"答案：B. F浮 = G排 = ρ液 g V排。解析：阿基米德原理的公式/规律是：F浮 = G排 = ρ液 g V排。掌握公式的同时要理解其物理意义和适用条件。"},{"id":"g2_physics_046_ex03","knowledge_id":"g2_physics_046","question":"填空题：阿基米德原理的公式/主要内容是：______。","answer":"答案：F浮 = G排 = ρ液 g V排。解析：这是阿基米德原理的重要公式/内容。阿基米德原理：\n浸在液体中的物体所受的浮力，等于它排开的液体所受的重力。\n\n公式：F浮 = G排液 = m排g = ρ液gV排\n- 适用：液体和气体\n- V排：物体排开液体的体积（不一定等于物体体积）..."},{"id":"g2_physics_046_ex04","knowledge_id":"g2_physics_046","question":"判断题：学习阿基米德原理只需要背公式，不需要理解。（  ）","answer":"答案：错误。解析：学习物理不仅要记住公式，更要理解公式的物理意义、推导过程和适用条件。只有真正理解了，才能灵活运用。"},{"id":"g2_physics_046_ex05","knowledge_id":"g2_physics_046","question":"选择题：学习阿基米德原理时，最重要的方法是？ A. 只看不练  B. 只做题不思考  C. 理解概念+动手实验+练习应用  D. 死记硬背","answer":"答案：C. 理解概念+动手实验+练习应用。解析：物理是一门以实验为基础的学科，学习阿基米德原理要注重理解概念，动手实验，通过练习巩固应用。"},{"id":"g2_physics_046_ex06","knowledge_id":"g2_physics_046","question":"填空题：阿基米德原理属于______（填章节名）的内容。","answer":"答案：第十章 浮力。解析：阿基米德原理是第十章 浮力的重要知识点，学习时要注意与前后知识的联系。"},{"id":"g2_physics_046_ex07","knowl         const HAS_EXAMPLES = true;

        // 错题本管理器
        const WrongBookManager = {
            STORAGE_KEY_PREFIX: 'wrongbook_',
            getWrongBook(grade, subject) {
                const key = this.STORAGE_KEY_PREFIX + grade + '_' + subject;
                return JSON.parse(localStorage.getItem(key) || '[]');
            },
            addWrongBook(item) {
                const key = this.STORAGE_KEY_PREFIX + item.grade + '_' + item.subject;
                let wrongBook = this.getWrongBook(item.grade, item.subject);
                const exists = wrongBook.some(w => w.question === item.question);
                if (exists) return false;
                wrongBook.push({...item, id: item.knowledgeId + '_' + Date.now(), addedAt: new Date().toISOString()});
                localStorage.setItem(key, JSON.stringify(wrongBook));
                return true;
            }
        };

        // 学习进度管理器
        const ProgressManager = {
            STORAGE_KEY: 'study_progress',
            
            getProgress() {
                try {
                    return JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
                } catch(e) {
                    return {};
                }
            },
            
            saveProgress(progress) {
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(progress));
            },
            
            recordStudy(grade, subject, subjectName, semester, semesterName, knowledgeId, knowledgeName) {
                const progress = this.getProgress();
                const now = new Date().toISOString();
                const today = new Date().toISOString().split('T')[0];
                
                if (!progress.learnedKnowledge) progress.learnedKnowledge = {};
                if (!progress.dailyStats) progress.dailyStats = {};
                if (!progress.dailyStats[today]) {
                    progress.dailyStats[today] = { learnedCount: 0, subjects: [] };
                }
                
                const isNew = !progress.learnedKnowledge[knowledgeId];
                progress.learnedKnowledge[knowledgeId] = { learnedAt: now };
                
                if (isNew) {
                    progress.dailyStats[today].learnedCount++;
                    if (!progress.dailyStats[today].subjects.includes(subject)) {
                        progress.dailyStats[today].subjects.push(subject);
                    }
                }
                
                progress.lastStudy = {
                    grade, subject, subjectName, semester, semesterName,
                    knowledgeId, knowledgeName, timestamp: now
                };
                
                this.saveProgress(progress);
            },
            
            isLearned(knowledgeId) {
                const progress = this.getProgress();
                return !!(progress.learnedKnowledge && progress.learnedKnowledge[knowledgeId]);
            },
            
            getLastStudy() {
                const progress = this.getProgress();
                return progress.lastStudy || null;
            },
            
            getSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                if (!progress.learnedKnowledge) return { learned: 0, total: 0, percent: 0 };
                const prefix = grade + '_' + subject + '_';
                const learned = Object.keys(progress.learnedKnowledge).filter(k => k.startsWith(prefix)).length;
                const total = DATA_KNOWLEDGE.length;
                const percent = total > 0 ? Math.round((learned / total) * 100) : 0;
                return { learned, total, percent };
            },
            
            clearSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                const prefix = grade + '_' + subject + '_';
                
                if (progress.learnedKnowledge) {
                    Object.keys(progress.learnedKnowledge).forEach(k => {
                        if (k.startsWith(prefix)) {
                            delete progress.learnedKnowledge[k];
                        }
                    });
                }
                
                if (progress.lastStudy && progress.lastStudy.grade === grade && progress.lastStudy.subject === subject) {
                    delete progress.lastStudy;
                }
                
                this.saveProgress(progress);
                return true;
            }
