利\nD. 欧仁·鲍狄埃创作了《国际歌》的歌词","answer":"答案：C\n解析：C选项错误，巴黎公社最终失败了，没有取得胜利。1871年5月28日，巴黎公社在资产阶级反动政府的镇压下失败了。A、B、D选项的说法都是正确的，巴黎公社建立于1871年，是世界上第一个无产阶级政权，欧仁·鲍狄埃创作了《国际歌》的歌词。"},{"id":"g3_history_019_ex08","knowledge_id":"g3_history_019","question":"简答题：巴黎公社失败的原因是什么？","answer":"答案：\n客观原因：\n1. 巴黎公社寡不敌众，敌我力量对比悬殊，反动势力过于强大；\n2. 巴黎公社没有得到广大农民的支持，缺乏工农联盟；\n3. 当时法国的资本主义还处于上升阶段，无产阶级革命的条件还不成熟。\n主观原因：\n1. 巴黎公社没有乘胜追击，给了敌人喘息的机会；\n2. 没有没收法兰西银行，导致经济上陷入被动；\n3. 没有建立起坚强的领导核心，组织上比较涣散；\n4. 缺乏统一的革命政党的领导，没有马克思主义理论的指导。\n根本原因：\n当时法国的资本主义还处于上升阶段，生产力发展水平还没有达到完成社会主义革命的程度，无产阶级革命的条件还不成熟。\n解析：巴黎公社的失败是多方面原因造成的，既有客观原因，也有主观原因。根本原因在于当时法国的资本主义还处于上升阶段，生产力发展水平还没有达到完成社会主义革命的程度。巴黎公社虽然失败了，但它的历史意义是伟大的。"},{"id":"g3_history_019_ex09","knowledge_id":"g3_history_019","question":"选择题：《国际歌》的词作者是（  ）\nA. 马克思\nB. 恩格斯\nC. 欧仁·鲍狄埃\nD. 狄盖特","answer":"答案：C\n解析：《国际歌》的词作者是欧仁·鲍狄埃，曲作者是狄盖特。巴黎公社失败后不久，公社的领导人之一欧仁·鲍狄埃创作了《国际歌》的歌词，后来，经工人作曲家狄盖特谱曲后，《国际歌》在全世界广泛传唱开来，成为全世界无产阶级的战歌。"},{"id":"g3_history_019_ex10","knowledge_id":"g3_history_019","question":"材料分析题：阅读下列材料，回答问题。\n材料：1871年3月18日，巴黎人民发动武装起义，建立了巴黎公社。公社成立后，采取了一系列革命措施：废除旧军队、旧警察，代之以国民自卫军；取消资产阶级的法庭，建立自己的司法机构；没收逃亡资本家的工厂，交给工人合作社管理；实行八小时工作日；等等。\n请回答：（1）巴黎公社是什么性质的政权？（2）根据材料，概括巴黎公社采取的革命措施。（3）巴黎公社有何历史意义？","answer":"答案：\n（1）巴黎公社是世界上第一个无产阶级政权，是无产阶级建立政权的第一次伟大尝试。\n（2）革命措施：\n① 政治方面：废除旧军队、旧警察，代之以国民自卫军；取消资产阶级的法庭，建立自己的司法机构；\n② 经济方面：没收逃亡资本家的工厂，交给工人合作社管理；实行八小时工作日；\n③ 社会方面：实行免费义务教育，提高教师待遇，等等。\n（3）历史意义：\n① 巴黎公社是世界上第一个无产阶级政权，是无产阶级建立政权的第一次伟大尝试；\n② 巴黎公社的实践，丰富了马克思主义的学说，为国际社会主义运动提供了宝贵的经验和教训；\n③ 公社战士在强大敌人面前表现出的大无畏精神永远激励着后人。\n解析：巴黎公社采取的一系列革命措施，充分体现了它的无产阶级性质。它打碎了旧的国家机器，建立了无产阶级自己的政权，在经济上也采取了有利于工人阶级的措施。巴黎公社虽然失败了，但它的历史意义是伟大的，它的革命精神永远激励着后人。"},{"id":"g3_history_020_ex01","knowledge_id":"g3_history_020","question":"选择题：拿破仑帝国建立于哪一年？（  ）\nA. 1789年\nB. 1799年\nC. 1804年\nD. 1815年","answer":"答案：C\n解析：1804年，经公民投票，法国改为帝国，史称'法兰西第一帝国'，拿破仑加冕称帝。拿破仑在位期间，对内巩固资产阶级统治，颁布了《拿破仑法典》；对外多次打败欧洲反法联盟的军队，乘胜扩大了法国的疆域。"},{"id":"g3_history_020_ex02","knowledge_id":"g3_history_020","question":"填空题：1799年拿破仑发动______，夺取了政权。1804年建立______。拿破仑主持制定了民法典，名为《______》，体现了自由平等和私有财产神圣不可侵犯等原则。","answer":"答案：雾月政变；法兰西第一帝国；拿破仑法典\n解析：1799年11月，拿破仑·波拿巴发动政变，组成了一个新的政府，很快建立起一套高效率的国家机器。1804年，经公民投票，法国改为帝国，史称'法兰西第一帝国'，拿破仑加冕称帝。拿破仑主持制定了民法典，名为《拿破仑法典》，体现了自由平等和私有财产神圣不可侵犯等原则。"},{"id":"g3_history_020_ex03","knowledge_id":"g3_history_020","question":"选择题：拿破仑帝国灭亡于哪一年？（  ）\nA. 1804年\nB. 1812年\nC. 1815年\nD. 1848年","answer":"答案：C\n解析：1812年，拿破仑远征俄国，大败而归。1815年，拿破仑在滑铁卢战役中战败，法兰西第一帝国覆灭。拿破仑帝国虽然灭亡了，但拿破仑的对外战争客观上打击了欧洲的封建势力，传播了资产阶级自由民主思想。"},{"id":"g3_history_020_ex04","knowledge_id":"g3_history_020","question":"简答题：如何评价拿破仑的对外战争？","answer":"答案：\n拿破仑的对外战争具有双重性：\n进步性：\n1. 拿破仑的对外战争打击了欧洲的封建势力，动摇了欧洲封建统治的基础；\n2. 战争传播了资产阶级自由民主思想，在客观上促进了欧洲封建制度的瓦解；\n3. 《拿破仑法典》在欧洲各国的推行，也促进了资本主义的发展。\n侵略性和争霸性：\n1. 拿破仑的对外战争也具有侵略和争霸的性质，对当地人民进行了压榨和掠夺，损害了被侵略国家人民的利益；\n2. 战争给欧洲各国人民带来了深重的灾难，也引起了当地人民的反抗；\n3. 连年的战争也给法国人民带来了沉重的负担，最终导致了帝国的覆灭。\n解析：拿破仑的对外战争是复杂的，具有双重性质。我们要全面、客观地评价拿破仑的对外战争，既要看到它的进步性，也要看到它的侵略性和争霸性。总的来说，拿破仑的对外战争在客观上推动了欧洲历史的发展进程。"},{"id":"g3_history_020_ex05","knowledge_id":"g3_history_020","question":"材料分析题：阅读下列材料，回答问题。\n材料：'我真正的光荣并非打了40次胜仗，滑铁卢之战抹去了关于这一切的记忆。但是，有一样东西是不会被人忘却的，它将永垂不朽——那就是我的民法典。'\n——拿破仑\n请回答：（1）材料中的'民法典'指的是什么？（2）这部民法典有什么历史意义？（3）如何评价拿破仑？","answer":"答案：\n（1）材料中的'民法典'指的是《拿破仑法典》（又称《法国民法典》）。\n（2）历史意义：\n① 《拿破仑法典》体现了自由平等和私有财产神圣不可侵犯等原则；\n② 它用法律的形式肯定了法国大革命的成果；\n③ 后来很多国家的民法都以《拿破仑法典》为参照蓝本，对后世产生了深远影响；\n④ 它巩固了资产阶级的统治，促进了资本主义的发展。\n（3）评价拿破仑：\n拿破仑是法国杰出的资产阶级政治家和军事家。他通过政变上台，建立了法兰西第一帝国，颁布了《拿破仑法典》，巩固了资产阶级的统治，传播了资产阶级自由民主思想。他的对外战争既打击了欧洲的封建势力，也具有侵略和争霸的性质，给被侵略国家人民带来了灾难。总的来说，拿破仑对历史的发展起了推动作用。\n解析：拿破仑是法国大革命时期的重要人物，他虽然最终失败了，但他颁布的《拿破仑法典》对后世产生了深远影响。拿破仑的这段话也说明，他自己也认为他最大的贡献是颁布了这部法典，而不是打了多少胜仗。"},{"id":"g3_history_020_ex06","knowledge_id":"g3_history_020","question":"填空题：《拿破仑法典》体现了______和______神圣不可侵犯等原则。后来很多国家的______都以《拿破仑法典》为参照蓝本。","answer":"答案：自由平等；私有财产；民法\n解析：拿破仑主持制定了民法典，名为《拿破仑法典》，体现了自由平等和私有财产神圣不可侵犯等原则。这部法典于1804年颁布实施，此后经过多次修改，今天仍然在法国施行。后来很多国家的民法都以《拿破仑法典》为参照蓝本。"},{"id":"g3_history_020_ex07","knowledge_id":"g3_history_020","question":"选择题：下列关于拿破仑的说法，错误的是（  ）\nA. 1799年发动雾月政变，夺取政权\nB. 1804年建立法兰西第一帝国\nC. 颁布了《拿破仑法典》\nD. 拿破仑的对外战争只有进步性，没有侵略性","answer":"答案：D\n解析：D选项错误，拿破仑的对外战争具有双重性，既有进步性，也有侵略性和争霸性。进步性在于打击了欧洲的封建势力，传播了资产阶级自由民主思想；侵略性和争霸性在于对当地人民进行了压榨和掠夺，损害了被侵略国家人民的利益。A、B、C选项的说法都是正确的。"},{"id":"g3_history_020_ex08","knowledge_id":"g3_history_020","question":"简答题：《拿破仑法典》有何历史地位和意义？","answer":"答案：\n1. 《拿破仑法典》是资产阶级国家的第一部民法典，它用法律的形式肯定了法国大革命的成果；\n2. 法典体现了自由平等和私有财产神圣不可侵犯等原则，巩固了资产阶级的统治，促进了资本主义的发展；\n3. 法典打击了欧洲的封建势力，推动了欧洲资本主义的发展；\n4. 后来很多国家的民法都以《拿破仑法典》为参照蓝本，对世界各国的法律产生了深远影响；\n5. 法典至今仍然在法国施行，显示出了强大的生命力。\n解析：《拿破仑法典》是拿破仑最重要的贡献之一，它不仅巩固了法国大革命的成果，也对世界各国的法律产生了深远影响。法典确立了资本主义社会的立法规范，是资产阶级国家的第一部民法典，在世界法制史上占有重要地位。"},{"id":"g3_history_020_ex09","knowledge_id":"g3_history_020","question":"选择题：法兰西第一帝国的建立者是（  ）\nA. 路易十六\nB. 罗伯斯庇尔\nC. 拿破仑\nD. 克伦威尔","answer":"答案：C\n解析：1804年，经公民投票，法国改为帝国，史称'法兰西第一帝国'，拿破仑加冕称帝。路易十六是法国大革命中被处死的国王，罗伯斯庇尔是雅各宾派的领导人，克伦威尔是英国资产阶级革命的领导人。"},{"id":"g3_history_020_ex10","knowledge_id":"g3_history_020","question":"材料分析题：阅读下列材料，回答问题。\n材料：拿破仑在位期间，对内巩固资产阶级统治，颁布了《拿破仑法典》；对外多次打败欧洲反法联盟的军队，乘胜扩大了法国的疆域，控制了欧洲很多地方。拿破仑的对外战争既打击了欧洲的封建势力，也损害了被侵略国家人民的利益。\n请回答：（1）拿破仑是怎样上台的？（2）根据材料，概括拿破仑的主要活动。（3）如何评价拿破仑？","answer":"答案：\n（1）1799年11月，拿破仑·波拿巴发动政变（雾月政变），组成了一个新的政府，很快建立起一套高效率的国家机器，夺取了政权。\n（2）主要活动：\n① 对内：巩固资产阶级统治，颁布了《拿破仑法典》，确立了资本主义社会的立法规范；\n② 对外：多次打败欧洲反法联盟的军队，扩大了法国的疆域，控制了欧洲很多地方。\n（3）评价拿破仑：\n拿破仑是法国杰出的资产阶级政治家和军事家。\n功绩：\n① 颁布了《拿破仑法典》，巩固了资产阶级的统治，确立了资本主义社会的立法规范，对后世产生了深远影响；\n② 他的对外战争打击了欧洲的封建势力，传播了资产阶级自由民主思想，推动了欧洲的历史进程。\n过失：\n① 他的对外战争也具有侵略和争霸的性质，对当地人民进行了压榨和掠夺，损害了被侵略国家人民的利益；\n② 建立了军事独裁帝国，违背了民主共和的原则。\n总的来说，拿破仑对历史的发展起了推动作用，功大于过。\n解析：拿破仑是法国大革命时期的重要人物，他的一生功过参半。我们要全面、客观地评价拿破仑，既要看到他的历史功绩，也要看到他的局限性。总的来说，拿破仑作为资产阶级的政治家和军事家，推动了历史的发展，功大于过。"},{"id":"g3_history_021_ex01","knowledge_id":"g3_history_021","question":"选择题：拉丁美洲独立运动爆发的时间大致是？\nA. 18世纪末19世纪初\nB. 19世纪初\nC. 19世纪中期\nD. 20世纪初","answer":"答案：B\n解析：拉丁美洲独立运动发生在19世纪初。受美国独立战争和法国大革命的影响，拉丁美洲掀起了一场反抗殖民统治、争取民族独立的运动。运动的主要领导人是玻利瓦尔和圣马丁，他们被誉为南美的\"解放者\"。"},{"id":"g3_history_021_ex02","knowledge_id":"g3_history_021","question":"填空题：被誉为南美的\"解放者\"的两位领导人是_________和_________。","answer":"答案：玻利瓦尔、圣马丁\n解析：玻利瓦尔和圣马丁是拉丁美洲独立运动的主要领导人。玻利瓦尔率军从北向南，解放了哥伦比亚、委内瑞拉和厄瓜多尔等地；圣马丁率军从南向北，解放了阿根廷和智利等地。两人在秘鲁会师后，圣马丁主动隐退，由玻利瓦尔继续领导斗争，最终彻底击溃西班牙殖民军。"},{"id":"g3_history_021_ex03","knowledge_id":"g3_history_021","question":"选择题：拉丁美洲独立运动主要反抗的殖民国家是？\nA. 英国和法国\nB. 西班牙和葡萄牙\nC. 荷兰和比利时\nD. 美国和德国","answer":"答案：B\n解析：新航路开辟后，拉丁美洲（美国以南的美洲地区）除巴西是葡萄牙的殖民地外，其余地区基本上都处于西班牙的殖民统治之下。因此，拉丁美洲独立运动主要反抗的是西班牙和葡萄牙的殖民统治。运动摧毁了西、葡在拉丁美洲的殖民统治，出现了一系列新兴独立国家。"},{"id":"g3_history_021_ex04","knowledge_id":"g3_history_021","question":"简答题：请简述拉丁美洲独立运动爆发的历史背景。\n要求：不少于100字","answer":"答案：拉丁美洲独立运动爆发的历史背景主要有以下几点：\n（1）18世纪末19世纪初，拉丁美洲的绝大部分地区仍处于西班牙和葡萄牙的殖民统治之下，殖民者残酷奴役和掠夺当地人民，引起了土生白人、印第安人和黑人的强烈不满。\n（2）18世纪末19世纪初，受美国独立战争和法国大革命的影响，拉丁美洲人民的民主意识日益增长，民族独立情绪高涨。\n（3）土生白人中的精英分子受到启蒙思想的影响，对殖民统治不满，要求摆脱宗主国的控制，发展民族经济。\n\n解析：拉丁美洲独立运动是世界近代史上一次规模宏大的民族解放运动，它不仅摧毁了西班牙和葡萄牙在拉丁美洲的殖民统治，还推动了拉丁美洲社会的发展，对世界民族解放运动产生了深远影响。"},{"id":"g3_history_021_ex05","knowledge_id":"g3_history_021","question":"材料分析题：阅读下列材料，回答问题。\n材料：\"我希望美洲人民永远不再把国王的宝座搬到自己的土地上来。\"\"解放者的称号已经高于一切，因此我决不会降低身份去登上王位。\"\n——玻利瓦尔\n问题：（1）材料中的玻利瓦尔被誉为什么？（2）结合所学知识，说说拉丁美洲独立运动取得胜利的原因有哪些？","answer":"答案：（1）玻利瓦尔被誉为南美的\"解放者\"。\n（2）拉丁美洲独立运动取得胜利的原因主要有：\n①正义的民族解放战争，得到拉丁美洲人民的广泛支持和参与；\n②玻利瓦尔、圣马丁等领导人的正确领导和卓越的军事才能；\n③各地起义军相互配合、协同作战；\n④利用了有利的国际环境，如拿破仑战争使西班牙、葡萄牙实力削弱。\n\n解析：玻利瓦尔是拉丁美洲独立运动的杰出领袖，他率领起义军由北向南，转战委内瑞拉和哥伦比亚等地，横扫南美大陆上的西班牙军队，解放了西班牙在南美洲的殖民地。圣马丁则由南向北，解放了阿根廷和智利等地。两人被誉为南美的\"解放者\"。"},{"id":"g3_history_021_ex06","knowledge_id":"g3_history_021","question":"选择题：下列关于拉丁美洲独立运动的表述，不正确的是？\nA. 运动的范围主要在美国以南的美洲地区\nB. 运动的领导人包括玻利瓦尔和圣马丁\nC. 运动主要反抗英国和法国的殖民统治\nD. 运动后出现了一系列新兴独立国家","answer":"答案：C\n解析：拉丁美洲独立运动主要反抗的是西班牙和葡萄牙的殖民统治，而非英国和法国。新航路开辟以后，西班牙和葡萄牙侵入拉丁美洲，除巴西是葡萄牙的殖民地外，其余地区基本上都在西班牙的殖民统治之下。因此C选项说法错误。"},{"id":"g3_history_021_ex07","knowledge_id":"g3_history_021","question":"填空题：拉丁美洲独立运动受_________和_________的影响，掀起了反抗殖民统治、争取民族独立的运动。","answer":"答案：美国独立战争、法国大革命\n解析：18世纪末19世纪初，受美国独立战争和法国大革命的影响，拉丁美洲掀起了一场反抗殖民统治、争取民族独立的运动。美国独立战争的胜利为拉丁美洲人民树立了榜样，法国大革命则传播了自由、平等、民主的思想，推动了拉丁美洲民族意识的觉醒。"},{"id":"g3_history_021_ex08","knowledge_id":"g3_history_021","question":"判断题：\"拉丁美洲独立运动摧毁了英国和法国在拉丁美洲的殖民统治，基本上形成了今天拉丁美洲的国家格局。\"这一说法是否正确？请说明理由。","answer":"答案：错误。\n理由：拉丁美洲独立运动摧毁的是西班牙和葡萄牙在拉丁美洲的殖民统治，而非英国和法国。新航路开辟以后，西班牙和葡萄牙侵入拉丁美洲，除巴西是葡萄牙的殖民地外，其余地区基本上都在西班牙的殖民统治之下。因此，拉丁美洲独立运动主要反对的是西班牙和葡萄牙的殖民统治。\n\n解析：拉丁美洲独立运动的胜利，摧毁了西班牙和葡萄牙在拉丁美洲的殖民统治，出现了一系列新兴独立国家，基本上形成了今天拉丁美洲的国家格局。"},{"id":"g3_history_021_ex09","knowledge_id":"g3_history_021","question":"简答题：拉丁美洲独立运动有何历史意义？\n要求：不少于100字","answer":"答案：拉丁美洲独立运动的历史意义主要有：\n（1）摧毁了西班牙和葡萄牙在拉丁美洲的殖民统治，出现了一系列新兴独立国家，基本上形成了今天拉丁美洲的国家格局。\n（2）拉丁美洲独立运动是一次规模宏大的民族解放运动，它打击了殖民主义势力，为拉丁美洲资本主义的发展创造了条件。\n（3）运动鼓舞了世界其他地区的民族解放斗争，对世界历史的发展产生了深远影响。\n\n解析：拉丁美洲独立运动是世界近代史上民族解放运动的重要组成部分。它不仅实现了拉丁美洲人民的民族独立，还传播了民主、自由、平等的思想，推动了拉丁美洲社会的进步和发展。"},{"id":"g3_history_021_ex10","knowledge_id":"g3_history_021","question":"材料分析题：阅读下列材料，回答问题。\n材料一：在没有打碎西班牙强加在我们身上的枷锁以前，我的手将不停地打击敌人，我的心将不会平静。\n——玻利瓦尔\n材料二：拉丁美洲独立运动后，诞生了一系列新兴独立国家，如墨西哥、阿根廷、委内瑞拉、哥伦比亚、秘鲁、智利、巴西等。\n问题：（1）材料一体现了玻利瓦尔怎样的精神？（2）结合材料二和所学知识，分析拉丁美洲独立运动的成果和影响。","answer":"答案：（1）材料一体现了玻利瓦尔为争取民族独立而不懈奋斗的决心和爱国主义精神。\n（2）拉丁美洲独立运动的成果和影响：\n成果：摧毁了西班牙和葡萄牙在拉丁美洲的殖民统治，诞生了一系列新兴独立国家，基本上形成了今天拉丁美洲的国家格局。\n影响：①拉丁美洲独立运动是一次规模宏大的民族解放运动，它打击了殖民主义势力；②为拉丁美洲资本主义的发展创造了条件；③鼓舞了世界其他地区的民族解放斗争，对世界历史的发展产生了深远影响。\n\n解析：玻利瓦尔是拉丁美洲独立运动的杰出代表，他率领起义军与西班牙殖民者展开了长期艰苦的斗争，最终赢得了民族独立。拉丁美洲独立运动的胜利，不仅改变了拉丁美洲的面貌，也对世界民族解放运动产生了重要影响。"},{"id":"g3_history_022_ex01","knowledge_id":"g3_history_022","question":"选择题：印度民族大起义爆发的时间是？\nA. 1851-1864年\nB. 1857-1859年\nC. 1861-1865年\nD. 1868-1873年","answer":"答案：B\n解析：印度民族大起义爆发于1857年，结束于1859年，历时两年多。1857年，印度土兵首先起来反抗英国殖民者，不久，印度北部和中部的很多地区纷纷响应，起义浪潮席卷了印度北部和中部的广大地区。"},{"id":"g3_history_022_ex02","knowledge_id":"g3_history_022","question":"填空题：印度民族大起义的核心力量是_________，杰出女英雄是_________。","answer":"答案：土兵、章西女王\n解析：印度民族大起义中，土兵是起义的核心力量。1857年，印度土兵因为不满英国殖民者的宗教侮辱和种族歧视，首先发动起义。章西女王是起义中的杰出女英雄，她领导军民与英军展开激战，直到壮烈牺牲，表现出了崇高的爱国主义精神和反抗殖民压迫的坚强意志。"},{"id":"g3_history_022_ex03","knowledge_id":"g3_history_022","question":"选择题：印度民族大起义反抗的是哪个国家的殖民统治？\nA. 法国\nB. 美国\nC. 英国\nD. 葡萄牙","answer":"答案：C\n解析：印度民族大起义反抗的是英国的殖民统治。19世纪中期，印度已经沦为英国的殖民地，英国完成了工业革命，进一步加强了对印度的经济掠夺和政治压迫。英国殖民者对印度的残酷剥削和压迫，激起了印度社会各阶层的强烈不满，最终引发了1857-1859年的印度民族大起义。"},{"id":"g3_history_022_ex04","knowledge_id":"g3_history_022","question":"简答题：请简述印度民族大起义爆发的原因。\n要求：不少于100字","answer":"答案：印度民族大起义爆发的原因主要有：\n（1）根本原因：英国对印度的殖民掠夺和殖民压迫，激起了印度人民的强烈不满。19世纪中期，印度已经沦为英国的殖民地，英国完成工业革命后，进一步加强了对印度的经济掠夺和政治压迫。\n（2）直接原因：\"涂油子弹事件\"成为起义的导火线。英国殖民者发给土兵的子弹上涂有牛油和猪油，信奉印度教和伊斯兰教的土兵认为这是对他们宗教信仰的侮辱，拒绝使用，遭到英国殖民者的残酷镇压。\n（3）英国殖民者对印度封建王公的政策损害了他们的利益，导致封建王公也加入到起义队伍中。\n\n解析：印度民族大起义是印度人民反抗英国殖民统治的一次大规模民族起义，虽然最终失败了，但它沉重打击了英国殖民者，反映了印度民族意识的觉醒。"},{"id":"g3_history_022_ex05","knowledge_id":"g3_history_022","question":"材料分析题：阅读下列材料，回答问题。\n材料：\"章西女王是一位杰出的女性领袖，她在印度民族大起义中表现出非凡的勇气和坚定的信念。1858年，英军进攻章西，章西女王亲临前线指挥战斗，与敌人展开殊死搏斗。在保卫章西的战斗失败后，她率军转战外地，始终坚持战斗，直到壮烈牺牲。\"\n问题：（1）材料中的\"章西女王\"是哪次民族解放运动中的英雄人物？（2）这次运动有何历史意义？","answer":"答案：（1）章西女王是1857-1859年印度民族大起义中的杰出女英雄。\n（2）印度民族大起义的历史意义：\n①沉重打击了英国殖民者，反映了印度民族意识的觉醒；\n②这次起义是19世纪中期亚洲民族解放运动的一个重要组成部分，与中国的太平天国运动等相互呼应，共同推动了亚洲民族解放运动的发展；\n③起义展现了印度人民不畏强暴、反抗侵略的英勇精神。\n\n解析：章西女王是印度民族大起义中的杰出女英雄。1858年，英军进攻章西，章西女王领导军民与英军展开激战，章西失陷后，她率军转战外地，始终坚持战斗，直到壮烈牺牲。章西女王和印度人民的英勇斗争，表现了殖民地人民不畏强暴、反抗侵略的决心和勇气，沉重打击了英国殖民者。"},{"id":"g3_history_022_ex06","knowledge_id":"g3_history_022","question":"选择题：下列关于印度民族大起义的表述，正确的是？\nA. 起义的核心力量是资产阶级\nB. 起义的导火线是\"涂油子弹事件\"\nC. 起义推翻了英国的殖民统治\nD. 起义发生在18世纪中期","answer":"答案：B\n解析：印度民族大起义的导火线是\"涂油子弹事件\"。英国殖民者发给土兵的子弹上涂有牛油和猪油，信奉印度教和伊斯兰教的土兵认为这是对他们宗教信仰的侮辱，拒绝使用，遭到英国殖民者的镇压，这一事件直接引发了起义。A选项错误，起义的核心力量是土兵；C选项错误，起义最终失败，没有推翻英国殖民统治；D选项错误，起义发生在19世纪中期（1857-1859年）。"},{"id":"g3_history_022_ex07","knowledge_id":"g3_history_022","question":"填空题：印度民族大起义的导火线是_________，这次起义是_________世纪中期亚洲民族解放运动的一个重要组成部分。","answer":"答案：涂油子弹事件、19\n解析：\"涂油子弹事件\"是印度民族大起义的导火线。英国殖民者发给土兵的子弹上涂有牛油和猪油，信奉印度教和伊斯兰教的土兵认为这是对他们宗教信仰的侮辱，拒绝使用，遭到英国殖民者的残酷镇压，这一事件直接引发了1857年的印度民族大起义。印度民族大起义是19世纪中期亚洲民族解放运动的一个重要组成部分。"},{"id":"g3_history_022_ex08","knowledge_id":"g3_history_022","question":"判断题：\"印度民族大起义推翻了英国的殖民统治，赢得了民族独立。\"这一说法是否正确？请说明理由。","answer":"答案：错误。\n理由：1857-1859年的印度民族大起义最终失败了，并没有推翻英国的殖民统治，也没有赢得民族独立。但是，这次起义沉重打击了英国殖民者，反映了印度民族意识的觉醒，是19世纪中期亚洲民族解放运动的一个重要组成部分。\n\n解析：印度民族大起义虽然失败了，但它产生了深远的影响。起义充分展现了印度人民不畏强暴、反抗侵略的英勇精神，沉重打击了英国的殖民统治，迫使英国殖民当局不得不改变统治策略。同时，这次起义也推动了印度民族意识的觉醒，为后来印度的民族独立运动奠定了基础。"},{"id":"g3_history_022_ex09","knowledge_id":"g3_history_022","question":"简答题：印度民族大起义有何历史意义？\n要求：不少于100字","answer":"答案：印度民族大起义的历史意义主要有：\n（1）沉重打击了英国殖民者，反映了印度民族意识的觉醒。起义虽然最终失败，但它使英国殖民当局认识到印度人民反抗的力量，迫使英国不得不调整对印度的统治政策。\n（2）印度民族大起义是19世纪中期亚洲民族解放运动的一个重要组成部分。它与中国的太平天国运动、伊朗巴布教徒起义等相互呼应，共同构成了19世纪中期亚洲民族解放运动的高潮，推动了亚洲民族解放运动的发展。\n（3）起义中涌现出的章西女王等英雄人物，展现了印度人民不畏强暴、反抗侵略的英勇精神，激励着后人继续为民族独立而斗争。\n\n解析：1857-1859年的印度民族大起义，是印度近代史上一次规模宏大的民族解放运动。虽然起义最终在英国殖民者的镇压下失败了，但它在印度民族解放运动史上占有重要地位，对后来印度的独立运动产生了深远影响。"},{"id":"g3_history_022_ex10","knowledge_id":"g3_history_022","question":"材料分析题：阅读下列材料，回答问题。\n材料一：1857年，印度土兵因为不满英国殖民者的宗教侮辱，首先发动起义。不久，印度北部和中部的很多地区纷纷响应，一些封建王公也加入起义队伍，起义浪潮席卷了印度北部和中部的广大地区。\n材料二：马克思说：\"印度人民英勇反抗英国殖民统治的斗争，将永远被铭记在世界人民的心中。\"\n问题：（1）材料一反映的是哪一历史事件？这一事件的导火线是什么？（2）结合材料二和所学知识，分析这一事件的历史影响。","answer":"答案：（1）材料一反映的是1857-1859年印度民族大起义。这一事件的导火线是\"涂油子弹事件\"。\n（2）印度民族大起义的历史影响：\n①国内影响：沉重打击了英国在印度的殖民统治，反映了印度民族意识的觉醒，展现了印度人民不畏强暴、反抗侵略的英勇精神；迫使英国殖民当局调整统治政策，加强了对印度的控制，同时也在一定程度上放松了对印度社会的某些限制。\n②国际影响：印度民族大起义是19世纪中期亚洲民族解放运动的一个重要组成部分，它与中国的太平天国运动等相互呼应，推动了亚洲民族解放运动的发展，鼓舞了世界其他被压迫民族的解放斗争。\n\n解析：印度民族大起义是印度近代史上一次重要的民族解放运动。虽然起义最终失败了，但它产生了深远的历史影响，不仅沉重打击了英国的殖民统治，也推动了印度民族意识的觉醒，为后来印度的独立运动奠定了基础。"},{"id":"g3_history_023_ex01","knowledge_id":"g3_history_023","question":"选择题：俄国农奴制改革发生在哪一年？\nA. 1861年\nB. 1868年\nC. 1871年\nD. 1898年","answer":"答案：A\n解析：俄国农奴制改革发生在1861年，由沙皇亚历山大二世颁布废除农奴制的法令。19世纪中期，俄国资本主义经济有所发展，但农奴制严重制约了这一时期俄国的经济发展。在内外交困的情况下，沙皇政府开始酝酿新的改革方案。1861年，亚历山大二世颁布了废除农奴制的法令。"},{"id":"g3_history_023_ex02","knowledge_id":"g3_history_023","question":"填空题：1861年俄国农奴制改革的领导人是_________，这次改革推动俄国走上了发展_________的道路。","answer":"答案：亚历山大二世、资本主义\n解析：1861年，俄国沙皇亚历山大二世颁布了废除农奴制的法令，进行了农奴制改革。1861年改革是俄国历史上的一个重要转折点。改革废除了农奴制，促使社会的各个方面出现了新的气象，推动俄国走上了发展资本主义的道路。但是，农奴制的残余仍然存在，影响着俄国经济与社会的发展。"},{"id":"g3_history_023_ex03","knowledge_id":"g3_history_023","question":"选择题：下列内容中，不属于1861年俄国农奴制改革法令的是？\nA. 农奴获得人身自由，可以改变身份\nB. 农奴可以自由转换职业\nC. 农奴可以免费获得一份土地\nD. 农奴在获得解放的同时，可以获得一份土地，但必须出钱赎买","answer":"答案：C\n解析：1861年，俄国沙皇亚历山大二世颁布了废除农奴制的法令。法令规定：农奴获得人身自由，可以改变身份，自由转换职业；农奴在获得解放的同时，可以获得一份土地，但是必须出钱赎买，所出的价钱高出当时的地价。因此C选项\"免费获得一份土地\"的说法是错误的。"},{"id":"g3_history_023_ex04","knowledge_id":"g3_history_023","question":"简答题：请简述1861年俄国农奴制改革的主要内容。\n要求：不少于100字","answer":"答案：1861年俄国农奴制改革的主要内容有：\n（1）政治方面：农奴获得人身自由，可以改变身份，自由转换职业。农奴不再是地主的私有财产，地主再也不能买卖农奴和干涉他们的生活。\n（2）经济方面：农奴在获得解放的同时，可以获得一份土地，但是必须出钱赎买，所出的价钱高出当时的地价。农民为此付出了沉重的代价。\n（3）组织方面：为了管理农民，还建立了地方和城市的自治机构。\n\n解析：1861年改革是俄国历史上的一个重要转折点。改革废除了农奴制，促使社会的各个方面出现了新的气象，推动俄国走上了发展资本主义的道路。但是，农奴制的残余仍然存在，影响着俄国经济与社会的发展。"},{"id":"g3_history_023_ex05","knowledge_id":"g3_history_023","question":"材料分析题：阅读下列材料，回答问题。\n材料：\"诸位会深信，凡能够维护地主利益的措施，都一一地做到了。\"\n——亚历山大二世在俄国国务会议最后审查改革方案时的讲话\n问题：（1）材料反映的是俄国历史上哪一次改革？这次改革的目的是什么？（2）结合材料和所学知识，谈谈你对这次改革的认识。","answer":"答案：（1）材料反映的是1861年俄国农奴制改革（又称亚历山大二世改革）。这次改革的根本目的是维护沙皇专制统治和地主阶级的利益，挽救统治危机。\n（2）对这次改革的认识：\n①性质：1861年改革是沙皇自上而下实行的资产阶级性质的改革。\n②进步性：改革废除了农奴制，促使社会的各个方面出现了新的气象，推动俄国走上了发展资本主义的道路，是俄国历史上的一个重要转折点。\n③局限性：改革很不彻底，保留了大量的封建残余，如沙皇专制制度、地主土地所有制等；改革是对农民的一次大规模掠夺，农民为此付出了沉重的代价。\n\n解析：从材料中亚历山大二世的话可以看出，这次改革的前提是维护地主阶级的利益。因此，改革虽然废除了农奴制，推动了俄国资本主义的发展，但也保留了大量封建残余。"},{"id":"g3_history_023_ex06","knowledge_id":"g3_history_023","question":"选择题：1861年俄国农奴制改革的性质是？\nA. 地主阶级性质的改革\nB. 资产阶级性质的改革\nC. 无产阶级性质的改革\nD. 社会主义性质的改革","answer":"答案：B\n解析：1861年俄国农奴制改革是沙皇自上而下实行的资产阶级性质的改革。改革废除了农奴制，为俄国资本主义的发展提供了自由劳动力、资金和国内市场，推动俄国走上了发展资本主义的道路。因此，1861年改革是俄国历史上的一个重要转折点。但改革保留了大量封建残余。"},{"id":"g3_history_023_ex07","knowledge_id":"g3_history_023","question":"填空题：1861年改革是俄国历史上的一个_________，推动了俄国走上了发展_________的道路。","answer":"答案：重要转折点、资本主义\n解析：1861年改革是俄国历史上的一个重要转折点。改革废除了农奴制，促使社会的各个方面出现了新的气象，推动俄国走上了发展资本主义的道路。但是，农奴制的残余仍然存在，影响着俄国经济与社会的发展。"},{"id":"g3_history_023_ex08","knowledge_id":"g3_history_023","question":"判断题：\"1861年俄国农奴制改革彻底废除了封建残余，使俄国成为一个发达的资本主义国家。\"这一说法是否正确？请说明理由。","answer":"答案：错误。\n理由：1861年俄国农奴制改革虽然废除了农奴制，推动俄国走上了发展资本主义的道路，是俄国历史上的一个重要转折点，但是改革很不彻底，保留了大量的封建残余，如沙皇专制制度、地主土地所有制等。农奴制的残余仍然存在，影响着俄国经济与社会的发展。因此，不能说改革彻底废除了封建残余，也不能说俄国成为了一个发达的资本主义国家。\n\n解析：1861年改革是沙皇自上而下实行的资产阶级性质的改革。改革的根本目的是维护沙皇专制统治和地主阶级的利益，因此改革不可能彻底废除封建残余。改革的局限性决定了俄国资本主义的发展仍然面临着诸多障碍。"},{"id":"g3_history_023_ex09","knowledge_id":"g3_history_023","question":"简答题：1861年俄国农奴制改革有何历史意义？\n要求：不少于100字","answer":"答案：1861年俄国农奴制改革的历史意义主要有：\n（1）进步性：\n①改革废除了农奴制，农奴获得了人身自由，为俄国资本主义的发展提供了自由劳动力、资金和国内市场，推动俄国走上了发展资本主义的道路。\n②改革促使社会的各个方面出现了新的气象，是俄国历史上的一个重要转折点。\n③改革在一定程度上缓和了社会矛盾，巩固了沙皇的统治。\n（2）局限性：\n①改革很不彻底，保留了大量的封建残余，如沙皇专制制度、地主土地所有制等。\n②改革是对农民的一次大规模掠夺，农民为获得土地付出了沉重的代价。\n③农奴制的残余仍然存在，影响着俄国经济与社会的发展。\n\n解析：1861年改革是沙皇自上而下实行的资产阶级性质的改革。我们应该一分为二地看待这次改革，既要看到它的进步性，也要认识到它的局限性。改革推动了俄国社会的进步，但也留下了诸多问题。"},{"id":"g3_history_023_ex10","knowledge_id":"g3_history_023","question":"材料分析题：阅读下列材料，回答问题。\n材料一：19世纪上半期，俄国资本主义有所发展，在工业生产中，机器生产逐渐排挤手工劳动，但是与西欧国家相比，俄国的工业生产仍然落后很多。\n材料二：1861年改革后，俄国的工业生产迅速增长。1870年，俄国的工业生产只占世界工业生产的3.7%，到1900年已经上升到5%。\n问题：（1）材料一反映了19世纪中期俄国面临的什么问题？这一问题的根源是什么？（2）材料二说明了什么？结合材料和所学知识，分析1861年改革对俄国经济发展的影响。","answer":"答案：（1）材料一反映了19世纪中期俄国资本主义经济有所发展，但工业生产仍然落后于西欧国家的问题。这一问题的根源是农奴制的存在严重阻碍了俄国资本主义的发展。\n（2）材料二说明1861年改革后，俄国工业生产迅速增长，资本主义经济得到了较快发展。\n1861年改革对俄国经济发展的影响：\n①积极影响：改革废除了农奴制，农奴获得了人身自由，为俄国资本主义的发展提供了大量的自由劳动力；农奴赎买土地的赎金为资本主义的发展提供了资金；农奴制的废除扩大了国内市场。这些都促进了俄国资本主义经济的发展，使俄国走上了发展资本主义的道路。\n②消极影响：改革保留了大量封建残余，农民背上了沉重的经济包袱，这些都在一定程度上制约了俄国经济的进一步发展。\n\n解析：19世纪中期，农奴制严重阻碍了俄国资本主义的发展，这是1861年改革的根本原因。改革废除了农奴制，为俄国资本主义的发展创造了有利条件，推动了俄国经济的发展。但改革的局限性也制约了俄国经济的进一步发展。"},{"id":"g3_history_024_ex01","knowledge_id":"g3_history_024","question":"选择题：美国内战（南北战争）的时间是？\nA. 1775-1783年\nB. 1861-1865年\nC. 1868-1873年\nD. 1914-1918年","answer":"答案：B\n解析：美国内战（又称南北战争）的时间是1861-1865年。1861年，南方军队挑起内战，美国内战爆发。1865年，南方军队投降，美国内战以北方胜利告终。美国内战是美国历史上第二次资产阶级革命，维护了国家统一，废除了奴隶制度，清除了资本主义发展的最大障碍。"},{"id":"g3_history_024_ex02","knowledge_id":"g3_history_024","question":"填空题：美国内战的导火线是_________当选为美国总统，战争中林肯政府颁布了《宅地法》和《_________》，扭转了战局。","answer":"答案：林肯、解放黑人奴隶宣言\n解析：1860年，共和党候选人林肯当选为美国总统，他主张限制奴隶制的发展，这成为南方奴隶主发动叛乱的借口，成为美国内战的导火线。1862年，林肯政府颁布了《宅地法》和《解放黑人奴隶宣言》，调动了农民和黑人奴隶的积极性，扭转了北方军队在战场上的被动局面。"},{"id":"g3_history_024_ex03","knowledge_id":"g3_history_024","question":"选择题：美国内战中，林肯政府颁布的扭转战局的文件是？\nA. 《独立宣言》和《1787年宪法》\nB. 《宅地法》和《解放黑人奴隶宣言》\nC. 《人权宣言》和《法典》\nD. 《权利法案》和《大宪章》","answer":"答案：B\n解析：1862年，林肯政府颁布了《宅地法》和《解放黑人奴隶宣言》。《宅地法》鼓励农民到西部耕种，调动了农民的积极性；《解放黑人奴隶宣言》废除了叛乱各州的奴隶制，调动了黑人奴隶的积极性，他们踊跃参军作战。这两个法令的颁布，扭转了北方军队在战场上的被动局面。"},{"id":"g3_history_024_ex04","knowledge_id":"g3_history_024","question":"简答题：请简述美国内战爆发的原因。\n要求：不少于100字","answer":"答案：美国内战爆发的原因主要有：\n（1）根本原因：南北两种经济制度之间的矛盾不可调和。北方资本主义工商业经济和南方奴隶制种植园经济之间的矛盾日益尖锐，双方在关税、劳动力、市场、西部土地等问题上矛盾重重，其中奴隶制的存废问题是双方矛盾的焦点。\n（2）直接原因（导火线）：1860年，共和党候选人林肯当选为美国总统。林肯主张限制奴隶制的发展，这成为南方奴隶主发动叛乱的借口。1861年，南方军队挑起内战，美国内战爆发。\n\n解析：美国内战又称南北战争，是美国历史上一场规模最大的内战。战争的根源在于南北两种经济制度之间的矛盾，矛盾的焦点是奴隶制的存废问题。林肯当选总统是内战的导火线。"},{"id":"g3_history_024_ex05","knowledge_id":"g3_history_024","question":"材料分析题：阅读下列材料，回答问题。\n材料：\"1863年元月1日起，凡在当地人民尚在反抗合众国的任何一州之内，或一州的指明地区之内，为人占有而做奴隶的人们都应在那时及以后永远获得自由。\"\n问题：（1）上述材料出自哪一文件？这一文件是在哪次战争中颁布的？（2）这一文件的颁布有何历史意义？","answer":"答案：（1）上述材料出自《解放黑人奴隶宣言》。这一文件是在美国内战（南北战争）中由林肯政府颁布的。\n（2）《解放黑人奴隶宣言》颁布的历史意义：\n①积极性：宣言废除了叛乱各州的奴隶制，调动了黑人奴隶的积极性，他们踊跃参军作战，扭转了北方军队在战场上的被动局面；宣言为最终废除全国的奴隶制奠定了基础。\n②局限性：宣言没有废除所有州的奴隶制，只是废除了叛乱各州的奴隶制；宣言没有给黑人与白人完全平等的权利。\n\n解析：1862年，林肯政府颁布了《解放黑人奴隶宣言》，规定从1863年元旦起，废除叛乱各州的奴隶制，并允许奴隶作为自由人参加北方军队。宣言的发表，在全国引起巨大反响，广大黑人欢庆解放，踊跃报名参军，北方军队因此获得了雄厚的兵源。"},{"id":"g3_history_024_ex06","knowledge_id":"g3_history_024","question":"选择题：下列关于美国内战的表述，不正确的是？\nA. 美国内战又称为南北战争\nB. 内战中颁布了《解放黑人奴隶宣言》\nC. 林肯政府最终失败\nD. 美国内战是美国历史上第二次资产阶级革命","answer":"答案：C\n解析：1865年，南方军队投降，美国内战以北方胜利告终，林肯政府取得了胜利，因此C选项说法错误。美国内战又称为南北战争，是美国历史上第二次资产阶级革命，维护了国家统一，废除了奴隶制度，清除了资本主义发展的最大障碍，为以后经济的迅速发展创造了条件。"},{"id":"g3_history_024_ex07","knowledge_id":"g3_history_024","question":"填空题：美国内战是美国历史上第_________次资产阶级革命，它维护了_________，废除了奴隶制度。","answer":"答案：二、国家统一\n解析：美国内战是美国历史上第二次资产阶级革命（美国独立战争是第一次资产阶级革命）。经过这场战争，美国维护了国家统一，废除了奴隶制度，清除了资本主义发展的最大障碍，为以后经济的迅速发展创造了条件。"},{"id":"g3_history_024_ex08","knowledge_id":"g3_history_024","question":"判断题：\"美国内战废除了奴隶制，彻底解决了美国的种族歧视问题。\"这一说法是否正确？请说明理由。","answer":"答案：错误。\n理由：美国内战废除了奴隶制度，清除了资本主义发展的最大障碍，维护了国家统一，为以后经济的迅速发展创造了条件。但是，内战并没有彻底解决美国的种族歧视问题，美国社会至今仍然存在严重的种族歧视现象，黑人在政治、经济、社会生活等方面仍然遭受不公正的待遇。\n\n解析：《解放黑人奴隶宣言》只是废除了叛乱各州的奴隶制，而且宣言没有给黑人与白人完全平等的权利。美国内战虽然废除了奴隶制度，但种族歧视问题并没有得到彻底解决，这成为美国社会长期存在的问题。"},{"id":"g3_history_024_ex09","knowledge_id":"g3_history_024","question":"简答题：美国内战有何历史意义？\n要求：不少于100字","answer":"答案：美国内战的历史意义主要有：\n（1）性质：美国内战是美国历史上第二次资产阶级革命（美国独立战争是第一次资产阶级革命）。\n（2）积极意义：\n①政治上：经过这场战争，美国维护了国家统一，避免了国家分裂；废除了奴隶制度，清除了资本主义发展的最大障碍。\n②经济上：为美国资本主义经济的迅速发展创造了条件，为美国成为世界上最发达的资本主义强国奠定了基础。\n（3）局限性：美国内战没有彻底消除种族歧视，黑人仍然受到不公正的待遇。\n\n解析：美国内战是美国历史上一场具有深远影响的战争。它不仅维护了国家统一，还废除了奴隶制度，为美国资本主义的发展扫清了道路。但是，内战也留下了种族歧视等问题，这些问题至今仍影响着美国社会。"},{"id":"g3_history_024_ex10","knowledge_id":"g3_history_024","question":"材料分析题：阅读下列材料，回答问题。\n材料一：美国内战初期，北方在军事上屡屡失利。为了扭转战局，1862年，林肯政府颁布了两个重要法令。\n材料二：马克思说：\"美国内战之所以爆发，是因为两种制度再也不能在北美大陆上一起和平共处了。\"\n问题：（1）材料一中林肯政府颁布了哪两个重要法令？这两个法令的颁布有何作用？（2）结合材料二和所学知识，分析美国内战爆发的根本原因是什么？","answer":"答案：（1）林肯政府颁布了《宅地法》和《解放黑人奴隶宣言》两个重要法令。\n作用：这两个法令的颁布，调动了农民和黑人奴隶的积极性，他们踊跃参军作战，扭转了北方军队在战场上的被动局面，为北方最终取得内战的胜利奠定了基础。\n（2）美国内战爆发的根本原因是：南北两种经济制度之间的矛盾不可调和。北方资本主义工商业经济和南方奴隶制种植园经济之间的矛盾日益尖锐，双方在关税、劳动力、市场、西部土地等问题上矛盾重重，其中奴隶制的存废问题是双方矛盾的焦点。两种制度的矛盾最终导致了内战的爆发。\n\n解析：美国内战是南北两种经济制度矛盾激化的必然结果。林肯政府为扭转战局而颁布的《宅地法》和《解放黑人奴隶宣言》，成为内战的转折点，为北方的胜利创造了条件。美国内战维护了国家统一，废除了奴隶制，具有重要的历史意义。"},{"id":"g3_history_025_ex01","knowledge_id":"g3_history_025","question":"选择题：日本明治维新开始于哪一年？\nA. 1861年\nB. 1868年\nC. 1871年\nD. 1898年","answer":"答案：B\n解析：日本明治维新开始于1868年。1868年，明治政府开始实行一系列改革，以西方为榜样，全面改造日本，史称\"明治维新\"。明治维新成为日本历史的重大转折点，使日本迅速走上了发展资本主义的道路，实现了富国强兵，开始跻身资本主义强国之列。"},{"id":"g3_history_025_ex02","knowledge_id":"g3_history_025","question":"填空题：日本明治维新在政治上实行_________，加强_________；经济上以\"_________\"为口号，大力发展近代经济。","answer":"答案：废藩置县、中央集权、殖产兴业\n解析：日本明治维新的主要内容有：政治上，废藩置县，加强中央集权；军事上，实行征兵制，建立新式军队，提倡忠君、服从、不怕死的\"武士道\"精神；经济上，推行地税改革，以\"殖产兴业\"为口号，大力发展近代经济；社会生活上，提倡\"文明开化\"，向西方学习，改造日本的教育、文化和生活方式。"},{"id":"g3_history_025_ex03","knowledge_id":"g3_history_025","question":"选择题：下列内容中，不属于日本明治维新内容的是？\nA. 废藩置县，加强中央集权\nB. 废除农奴制，农民可以赎买土地\nC. 提倡\"文明开化\"，向西方学习\nD. 实行征兵制，建立新式军队","answer":"答案：B\n解析：废除农奴制，农民可以赎买土地是1861年俄国农奴制改革的内容，不是日本明治维新的内容。日本明治维新的主要内容包括：政治上废藩置县，加强中央集权；军事上实行征兵制，建立新式军队；经济上推行地税改革，以\"殖产兴业\"为口号，大力发展近代经济；社会生活上提倡\"文明开化\"，向西方学习。因此B选项符合题意。"},{"id":"g3_history_025_ex04","knowledge_id":"g3_history_025","question":"简答题：请简述日本明治维新的主要内容。\n要求：不少于100字","answer":"答案：日本明治维新的主要内容有：\n（1）政治上：废藩置县，加强中央集权。废除全国所有的藩国，把全国划分为3府72县，由中央政府派官员直接管理。废除封建身份制度，取消武士特权。\n（2）军事上：实行征兵制，建立新式军队，提倡忠君、服从、不怕死的\"武士道\"精神。新式军队称为\"皇军\"。\n（3）经济上：推行地税改革，以\"殖产兴业\"为口号，大力发展近代经济。利用政府力量引进技术和设备，创办\"样板\"企业，供私人企业效仿；利用政府力量大力扶植和保护私人资本主义的发展。\n（4）社会生活上：提倡\"文明开化\"，向西方学习，改造日本的教育、文化和生活方式。提倡学习西方社会文化及习惯，翻译西方著作，引进西方近代工业技术等。\n\n解析：明治维新是日本历史上一次重要的资产阶级性质的改革，它使日本从一个闭关锁国的封建国家逐步转变为资本主义国家，实现了富国强兵。"},{"id":"g3_history_025_ex05","knowledge_id":"g3_history_025","question":"材料分析题：阅读下列材料，回答问题。\n材料：\"日本的明治维新是一次自上而下的资产阶级性质的改革。它使日本从一个闭关锁国的封建国家，逐步转变为资本主义国家，摆脱了沦为半殖民地国家的命运，是日本历史的重大转折点。\"\n问题：（1）日本明治维新是在什么背景下进行的？（2）结合材料和所学知识，谈谈明治维新对日本的影响。","answer":"答案：（1）日本明治维新的背景：\n①内忧：19世纪中期，日本处于德川幕府的统治之下，实行闭关锁国政策，封建专制统治阻碍了日本资本主义的发展，社会矛盾尖锐。\n②外患：1853-1854年，美国海军舰队两次强行进入日本港口，要求日本打开国门，日本被迫在不平等条约上签字，面临沦为半殖民地的民族危机。\n③前提条件：1868年，倒幕派发动政变，推翻了德川幕府的统治，明治天皇政府实行了一系列改革。\n（2）明治维新对日本的影响：\n①积极影响：明治维新成为日本历史的重大转折点。通过明治维新，日本迅速走上了发展资本主义的道路，实现了富国强兵，开始跻身资本主义强国之列；摆脱了沦为半殖民地国家的命运，维护了民族独立。\n②消极影响：明治维新保留了大量旧制度的残余，军国主义色彩浓厚；日本强大起来后，很快走上了对外侵略扩张的道路，给亚洲邻国带来了深重的灾难。\n\n解析：日本明治维新是19世纪中期在内忧外患的背景下进行的一次资产阶级性质的改革。改革使日本走上了资本主义发展道路，实现了富国强兵，但也保留了大量封建残余。"},{"id":"g3_history_025_ex06","knowledge_id":"g3_history_025","question":"选择题：日本明治维新在社会生活方面提倡什么？\nA. 废藩置县\nB. 殖产兴业\nC. 文明开化\nD. 富国强兵","answer":"答案：C\n解析：日本明治维新在社会生活方面提倡\"文明开化\"，向西方学习，改造日本的教育、文化和生活方式。A选项废藩置县是政治方面的措施；B选项殖产兴业是经济方面的措施；D选项富国强兵是明治维新的目的。因此C选项正确。"},{"id":"g3_history_025_ex07","knowledge_id":"g3_history_025","question":"填空题：日本明治维新的目的是_________，改革的性质是_________性质的改革。","answer":"答案：富国强兵、资产阶级\n解析：日本明治维新的目的是富国强兵，摆脱民族危机，发展资本主义。明治维新是自上而下实行的资产阶级性质的改革。通过改革，日本迅速走上了发展资本主义的道路，实现了富国强兵，开始跻身资本主义强国之列。但是，明治维新保留了大量旧制度的残余，军国主义色彩浓厚。"},{"id":"g3_history_025_ex08","knowledge_id":"g3_history_025","question":"判断题：\"日本明治维新是一次彻底的资产阶级革命，它使日本完全走上了资本主义民主道路。\"这一说法是否正确？请说明理由。","answer":"答案：错误。\n理由：日本明治维新不是资产阶级革命，而是一次自上而下的资产阶级性质的改革。改革虽然使日本走上了发展资本主义的道路，实现了富国强兵，但改革很不彻底，保留了大量旧制度的残余，如天皇制、军国主义色彩浓厚等。日本强大起来后，很快走上了对外侵略扩张的道路。因此，不能说明治维新是一次彻底的资产阶级革命，也不能说日本完全走上了资本主义民主道路。\n\n解析：明治维新是日本历史上一次重要的改革，它的性质是资产阶级性质的改革，而非资产阶级革命。改革由明治天皇政府自上而下推行，保留了大量封建残余。我们应该一分为二地看待明治维新，既要看到它的进步性，也要认识到它的局限性。"},{"id":"g3_history_025_ex09","knowledge_id":"g3_history_025","question":"简答题：日本明治维新有何历史意义？\n要求：不少于100字","answer":"答案：日本明治维新的历史意义主要有：\n（1）积极意义：\n①明治维新成为日本历史的重大转折点。通过明治维新，日本迅速走上了发展资本主义的道路，实现了富国强兵，开始跻身资本主义强国之列。\n②明治维新使日本摆脱了沦为半殖民地国家的命运，维护了民族独立，成为近代亚洲唯一保持民族独立的国家。\n③明治维新推动了日本社会的进步，传播了西方先进的思想文化和科学技术，促进了日本的近代化。\n（2）消极意义（局限性）：\n①明治维新保留了大量旧制度的残余，如天皇制、封建武士道精神等，军国主义色彩浓厚。\n②日本强大起来后，很快走上了对外侵略扩张的道路，给亚洲邻国和世界和平带来了严重威胁。\n\n解析：明治维新是日本历史上一次具有深远影响的改革。我们应该用一分为二的观点来看待明治维新，既要肯定它的进步性，也要认识到它的局限性。"},{"id":"g3_history_025_ex10","knowledge_id":"g3_history_025","question":"材料分析题：阅读下列材料，回答问题。\n材料一：1868年，明治天皇政府颁布了一系列改革法令，史称\"明治维新\"。明治维新后，日本迅速崛起，成为亚洲强国。\n材料二：大凡国之强弱，决定于人民之贫富；人民之贫富，系赖于物产之多寡；而物产之多寡，又起因于是否鼓励人民之工业。\n——大久保利通\n问题：（1）材料二反映了明治维新时期的哪一经济政策？这一政策的具体内容是什么？（2）结合材料和所学知识，分析日本明治维新取得成功的原因有哪些？","answer":"答案：（1）材料二反映了明治维新时期\"殖产兴业\"的经济政策。这一政策的具体内容是：以\"殖产兴业\"为口号，大力发展近代经济。利用政府力量引进技术和设备，创办\"样板\"企业，供私人企业效仿；利用政府力量大力扶植和保护私人资本主义的发展；推行地税改革，为工业发展提供资金。\n（2）日本明治维新取得成功的原因：\n①日本的封建专制统治相对薄弱，倒幕派力量迅速壮大，推翻了幕府的封建统治，为改革提供了政治前提。\n②明治政府实行了全面的、行之有效的改革措施，涉及政治、经济、军事、文化等各个方面。\n③日本善于学习外国先进的科学技术和思想文化，能够结合本国国情进行改革。\n④当时西方列强忙于侵略中国，客观上为日本提供了一个相对有利的国际环境。\n\n解析：明治维新是日本历史上一次成功的资产阶级性质的改革。\"殖产兴业\"是明治维新在经济方面的重要措施，它推动了日本资本主义经济的迅速发展。明治维新的成功是多种因素共同作用的结果。"},{"id":"g3_history_026_ex01","knowledge_id":"g3_history_026","question":"选择题：第二次工业革命开始的时间是？\nA. 18世纪60年代\nB. 19世纪六七十年代\nC. 19世纪末20世纪初\nD. 20世纪四五十年代","answer":"答案：B\n解析：第二次工业革命开始于19世纪六七十年代。19世纪，随着资本主义经济的发展，自然科学研究取得重大进展，新技术、新发明层出不穷，并被迅速应用于工业生产，促进了经济的进一步发展，这就是第二次工业革命。在这次工业革命中，最显著的成就是电力成为新的能源进入生产生活领域。"},{"id":"g3_history_026_ex02","knowledge_id":"g3_history_026","question":"填空题：第二次工业革命最显著的成就是_________成为新的能源进入生产生活领域，人类社会进入了\"_________时代\"。","answer":"答案：电力、电气\n解析：第二次工业革命最显著的成就是电力成为新的能源进入生产生活领域。19世纪六七十年代，发电机、电动机相继发明，电力开始带动机器运转，电力逐步取代蒸汽，成为工厂机器的主要动力，人类社会进入了\"电气时代\"。电力也被广泛地应用于生活领域，众多的家用电器产品，极大地改善了人们的生活。"},{"id":"g3_history_026_ex03","knowledge_id":"g3_history_026","question":"选择题：下列发明家中，被称为\"发明大王\"的是？\nA. 瓦特\nB. 爱迪生\nC. 卡尔·本茨\nD. 莱特兄弟","answer":"答案：B\n解析：美国发明家爱迪生发明了白炽灯泡、碱性蓄电池、电影摄影机和放映机等，为人类的生产生活带来了巨大的变化。他正式注册的发明就有1300种之多，被称为\"发明大王\"。A选项瓦特改良了蒸汽机；C选项卡尔·本茨发明了汽车；D选项莱特兄弟发明了飞机。"},{"id":"g3_history_026_ex04","knowledge_id":"g3_history_026","question":"简答题：请简述第二次工业革命的主要成就。\n要求：不少于100字","answer":"答案：第二次工业革命的主要成就有：\n（1）电力的广泛应用：19世纪六七十年代，发电机、电动机相继发明，电力成为新的能源进入生产生活领域，人类进入\"电气时代\"。爱迪生发明了白炽灯泡等众多电器产品。\n（2）内燃机的发明和新交通工具的出现：内燃机的发明解决了交通运输工具的发动机问题。19世纪80年代，德国人卡尔·本茨制造出一辆内燃机驱动的汽车。1903年，美国的莱特兄弟发明了飞机。\n（3）化学工业和新材料：现代化学工业的产生也是应用技术领域的一项重大突破。1867年，瑞典化学家诺贝尔发明了现代炸药。后来，美国人海厄特发明了赛璐珞，现代塑料工业由此诞生。\n（4）通讯技术的发展：电话、电报等新通讯手段的发明，进一步加强了世界各地的联系。\n\n解析：第二次工业革命促进了生产力的发展，极大地改善了人们的生活，使主要资本主义国家出现了垄断组织，资本主义由自由资本主义向垄断资本主义即帝国主义阶段过渡。"},{"id":"g3_history_026_ex05","knowledge_id":"g3_history_026","question":"材料分析题：阅读下列材料，回答问题。\n材料：19世纪，随着资本主义经济的发展，自然科学研究取得重大进展。1870年以后，新技术、新发明层出不穷，并被迅速应用于工业生产，促进了经济的进一步发展。\n问题：（1）材料反映的是哪一次工业革命？这次工业革命最显著的成就是什么？（2）这次工业革命有什么特点？","answer":"答案：（1）材料反映的是第二次工业革命。这次工业革命最显著的成就是电力成为新的能源进入生产生活领域。\n（2）第二次工业革命的特点：\n①科学研究同工业生产紧密结合，科学成为推动生产力发展的重要因素。在第一次工业革命时期，许多技术发明都来源于工匠的实践经验，科学和技术尚未真正结合；而在第二次工业革命期间，自然科学的新发展，开始同工业生产紧密地结合起来，科学在推动生产力发展方面发挥了更为重要的作用。\n②第二次工业革命几乎同时发生在几个先进的资本主义国家，新的技术和发明超出一国的范围，其规模更加广泛，发展也比较迅速。\n③有些国家的两次工业革命是交叉进行的，这些国家既可以吸收第一次工业革命的技术成果，又可以直接利用第二次工业革命的新技术，经济发展速度比较快，如德国、日本。\n\n解析：第二次工业革命是人类历史上一次重要的技术革命，它使人类进入了\"电气时代\"，促进了生产力的巨大发展，也使主要资本主义国家的经济结构发生了重大变化。"},{"id":"g3_history_026_ex06","knowledge_id":"g3_history_026","question":"选择题：汽车和飞机的发明，得益于下列哪项重大技术突破？\nA. 蒸汽机的广泛应用\nB. 电力的广泛应用\nC. 内燃机的发明\nD. 电子计算机的发明","answer":"答案：C\n解析：汽车和飞机的发明，得益于内燃机的发明。19世纪80年代，德国人卡尔·本茨制造出一辆内燃机驱动的汽车，这种汽车以汽油内燃机为动力。1903年，美国的莱特兄弟发明了飞机，飞机使用的也是内燃机。内燃机的发明解决了交通运输工具的发动机问题，在交通运输领域引发了一场变革。"},{"id":"g3_history_026_ex07","knowledge_id":"g3_history_026","question":"填空题：19世纪80年代，德国人_________制造出一辆内燃机驱动的汽车；1903年，美国的_________发明了飞机。","answer":"答案：卡尔·本茨、莱特兄弟\n解析：19世纪80年代，德国人卡尔·本茨制造出一辆内燃机驱动的汽车，这种汽车以汽油内燃机为动力，具有速度快、行驶灵活等特点，因此获得了广泛使用。1903年12月，美国的莱特兄弟制成的飞机试飞成功。后来，经过他们不断改进，飞机的性能不断提高，成为人们便利、快捷的空中交通工具。"},{"id":"g3_history_026_ex08","knowledge_id":"g3_history_026","question":"判断题：\"第二次工业革命以蒸汽机的广泛应用为主要标志，人类进入了蒸汽时代。\"这一说法是否正确？请说明理由。","answer":"答案：错误。\n理由：这一说法混淆了第一次工业革命和第二次工业革命的主要标志。第一次工业革命以蒸汽机的广泛应用为主要标志，人类进入了\"蒸汽时代\"。而第二次工业革命最显著的成就是电力成为新的能源进入生产生活领域，人类进入了\"电气时代\"。\n\n解析：第一次工业革命开始于18世纪60年代，以瓦特改良蒸汽机为标志，蒸汽机的广泛使用使人类进入了\"蒸汽时代\"。第二次工业革命开始于19世纪六七十年代，以电力的广泛应用为主要标志，人类进入了\"电气时代\"。两次工业革命各有其特点和标志性成就，不能混为一谈。"},{"id":"g3_history_026_ex09","knowledge_id":"g3_history_026","question":"简答题：第二次工业革命有什么历史影响？\n要求：不少于100字","answer":"答案：第二次工业革命的历史影响主要有：\n（1）对生产力的影响：第二次工业革命促进了生产力的巨大发展，使主要资本主义国家的经济结构发生了重大变化，工业在国民经济中的比重上升，人类社会进入了\"电气时代\"，极大地改善了人们的生活。\n（2）对生产关系的影响：第二次工业革命使生产和资本高度集中，主要资本主义国家出现了垄断组织，资本主义由自由资本主义向垄断资本主义即帝国主义阶段过渡。\n（3）对世界格局的影响：第二次工业革命使主要资本主义国家的经济发展不平衡加剧，帝国主义国家之间的矛盾日益尖锐，最终导致了第一次世界大战的爆发。\n（4）对世界市场的影响：第二次工业革命进一步加强了世界各地之间的联系，世界市场最终形成。\n\n解析：第二次工业革命是人类历史上一次重要的技术革命，它不仅推动了生产力的巨大发展，也对生产关系、世界格局等方面产生了深远的影响。我们应该全面地认识第二次工业革命的历史影响。"},{"id":"g3_history_026_ex10","knowledge_id":"g3_history_026","question":"材料分析题：阅读下列材料，回答问题。\n材料一：工业革命的第一阶段持续到19世纪中叶，包括棉纺织工业、采矿业、冶金业的机械化和蒸汽机的发明及其在工业和运输业中的运用。\n材料二：工业革命的第二阶段从19世纪下半叶开始，科学在工业中的作用得到了加强，科学开始对工业产生了更大的影响。\n问题：（1）材料一和材料二分别反映的是哪次工业革命？（2）结合所学知识，比较两次工业革命的不同点。","answer":"答案：（1）材料一反映的是第一次工业革命；材料二反映的是第二次工业革命。\n（2）两次工业革命的不同点：\n①开始时间不同：第一次工业革命开始于18世纪60年代；第二次工业革命开始于19世纪六七十年代。\n②主要标志不同：第一次工业革命以蒸汽机的广泛应用为主要标志，人类进入\"蒸汽时代\"；第二次工业革命以电力的广泛应用为主要标志，人类进入\"电气时代\"。\n③科学与技术的结合程度不同：第一次工业革命时期，许多技术发明都来源于工匠的实践经验，科学和技术尚未真正结合；第二次工业革命时期，自然科学的新发展开始同工业生产紧密地结合起来，科学在推动生产力发展方面发挥了更为重要的作用。\n④范围不同：第一次工业革命首先发生在英国，其他国家工业革命的发展相对缓慢；第二次工业革命几乎同时发生在几个先进的资本主义国家，新的技术和发明超出一国的范围，其规模更加广泛，发展也比较迅速。\n⑤影响不同：第一次工业革命使资本主义制度最终确立，世界市场初步形成；第二次工业革命使主要资本主义国家进入帝国主义阶段，世界市场最终形成。\n\n解析：两次工业革命是人类历史上两次重要的技术革命，它们既有联系又有区别。比较两次工业革命的不同点，有助于我们更深刻地认识两次工业革命的特点和历史影响。"},{"id":"g3_history_027_ex01","knowledge_id":"g3_history_027","question":"选择题：近代自然科学的奠基人之一，著有《自然哲学的数学原理》的科学家是？\nA. 达尔文\nB. 牛顿\nC. 爱因斯坦\nD. 哥白尼","answer":"答案：B\n解析：英国科学家牛顿是近代自然科学的奠基人之一，他在天文学、数学、力学等领域都有杰出贡献。1687年，牛顿出版了具有划时代意义的科学巨著《自然哲学的数学原理》，使物理学成为一门独立的科学。牛顿的主要贡献包括发现万有引力定律、光学分析和微积分学等。"},{"id":"g3_history_027_ex02","knowledge_id":"g3_history_027","question":"填空题：英国科学家_________著有《物种起源》，提出了_________的观点。","answer":"答案：达尔文、进化论\n解析：1859年，英国科学家达尔文的科学巨著《物种起源》出版了。在这部书中，达尔文提出了\"进化论\"的观点，指出自然界是在\"物竞天择、适者生存、优胜劣汰\"的法则中发展的。《物种起源》的出版，在欧洲乃至整个世界都引起轰动，沉重打击了神权统治的根基。"},{"id":"g3_history_027_ex03","knowledge_id":"g3_history_027","question":"选择题：下列作品中，属于巴尔扎克的是？\nA. 《战争与和平》\nB. 《复活》\nC. 《人间喜剧》\nD. 《向日葵》","answer":"答案：C\n解析：法国作家巴尔扎克的《人间喜剧》再现了法国19世纪早期纷繁复杂的社会图景。《人间喜剧》是巴尔扎克以毕生精力完成的光辉创作群，堪称是人类精神文明的奇迹。巴尔扎克是19世纪法国伟大的批判现实主义作家，欧洲批判现实主义文学的奠基人和杰出代表。A、B选项是俄国作家列夫·托尔斯泰的作品；D选项是荷兰画家梵高的代表作。"},{"id":"g3_history_027_ex04","knowledge_id":"g3_history_027","question":"简答题：请简述牛顿的主要科学成就。\n要求：不少于100字","answer":"答案：牛顿的主要科学成就有：\n（1）天文学领域：发现了万有引力定律。万有引力定律是解释物体之间的相互作用的引力的定律，是牛顿在1687年于《自然哲学的数学原理》上发表的。\n（2）数学领域：创建了微积分。微积分是高等数学中研究函数的微分、积分以及有关概念和应用的数学分支，它的创立是数学发展中的一个里程碑。\n（3）力学领域：建立了完整的力学理论体系，其中力学三定律，也称\"牛顿三定律\"，对近代自然科学的发展影响最大。\n（4）光学领域：进行了光的色散实验，发现了白光是由不同颜色的光组成的，为光谱学的发展奠定了基础。\n\n解析：牛顿是英国著名的物理学家、数学家，是近代自然科学的奠基人之一。他在1687年发表的论文《自然哲学的数学原理》里，对万有引力和三大运动定律进行了描述，奠定了此后三个世纪里物理世界的科学观点，并成为了现代工程学的基础。"},{"id":"g3_history_027_ex05","knowledge_id":"g3_history_027","question":"材料分析题：阅读下列材料，回答问题。\n材料一：生物母体生出的众多后代，为攫取生活的必需条件而斗争，众多的后代不会绝对相同，其中优秀的物种在生存竞争中取胜了，其他被淘汰了。\n材料二：他是德国历史上最伟大的音乐家，也是一位资产阶级革命运动的热情歌颂者。他的代表作充满了力量，表达了对自由、平等和博爱的渴望。\n问题：（1）材料一反映了哪位科学家的什么理论？这一理论的提出有什么历史意义？（2）材料二中的\"他\"是谁？请列举他的两部代表作。","answer":"答案：（1）材料一反映了英国科学家达尔文的进化论思想。\n历史意义：达尔文的进化论思想，第一次把生物学建立在完全科学的基础上，推翻了神创论和物种不变论，沉重打击了神权统治的根基，在欧洲乃至整个世界都引起轰动。\n（2）材料二中的\"他\"是德国音乐家贝多芬。\n代表作：《英雄交响曲》（《第三交响曲》）、《命运交响曲》（《第五交响曲》）、《欢乐颂》等。\n\n解析：达尔文是英国生物学家，进化论的奠基人。1859年，他的科学巨著《物种起源》出版，提出了\"进化论\"的观点。贝多芬是德国著名的作曲家，也是一位资产阶级革命运动的热情歌颂者，他的作品充满了力量，表达了对自由、平等和博爱的渴望。"},{"id":"g3_history_027_ex06","knowledge_id":"g3_history_027","question":"选择题：被称为\"俄国革命的镜子\"的文学巨匠是？\nA. 巴尔扎克\nB. 列夫·托尔斯泰\nC. 莎士比亚\nD. 雨果","answer":"答案：B\n解析：列夫·托尔斯泰是俄国伟大的作家，被列宁称为\"俄国革命的镜子\"。他的代表作有《战争与和平》《安娜·卡列尼娜》《复活》等。这些作品描写了俄国社会各阶层的生活图景，深刻揭露了19世纪后期到20世纪初俄国社会的基本矛盾。A选项巴尔扎克是法国作家；C选项莎士比亚是英国文艺复兴时期的剧作家；D选项雨果是法国作家。"},{"id":"g3_history_027_ex07","knowledge_id":"g3_history_027","question":"填空题：德国音乐家_________是一位资产阶级革命运动的热情歌颂者，他的代表作《_________》热情歌颂了英雄主义精神。","answer":"答案：贝多芬、英雄交响曲\n解析：德国音乐家贝多芬是一位资产阶级革命运动的热情歌颂者。他的代表作《英雄交响曲》（又称《第三交响曲》）是他的代表作之一，完成于1804年，是应法国驻维也纳大使的邀请为拿破仑写的。这首交响曲从内容到形式都富于革新精神，感情奔放，篇幅宏大，热情歌颂了英雄主义精神。"},{"id":"g3_history_027_ex08","knowledge_id":"g3_history_027","question":"判断题：\"牛顿的《物种起源》一书，提出了进化论的观点，推翻了神创论和物种不变论。\"这一说法是否正确？请说明理由。","answer":"答案：错误。\n理由：提出进化论观点、著有《物种起源》一书的是英国科学家达尔文，而不是牛顿。牛顿的主要成就是发现万有引力定律、创建微积分、建立力学理论体系等，他的科学巨著是《自然哲学的数学原理》。\n\n解析：牛顿和达尔文都是近代历史上著名的科学家，但他们的研究领域不同。牛顿主要在物理学、数学等领域有杰出贡献，是近代自然科学的奠基人之一；达尔文主要在生物学领域有杰出贡献，他提出的进化论思想，推翻了神创论和物种不变论，沉重打击了神权统治的根基。两者不能混淆。"},{"id":"g3_history_027_ex09","knowledge_id":"g3_history_027","question":"简答题：近代科学文化发展的原因是什么？\n要求：不少于100字","answer":"答案：近代科学文化发展的原因主要有：\n（1）经济基础：资本主义经济的发展，为科学文化的发展提供了物质基础。随着资本主义的发展，新兴的资产阶级对科学文化的需求日益增长，推动了科学文化的发展。\n（2）政治前提：资本主义制度的确立，为科学文化的发展提供了政治保障。资产阶级革命后，各国政府普遍重视科学文化的发展，采取了一系列鼓励科学文化发展的措施。\n（3）思想基础：文艺复兴、启蒙运动等思想解放运动，促进了人们的思想解放，打破了封建神学对人们思想的束缚，为科学文化的发展奠定了思想基础。\n（4）科学家的努力：众多科学家不懈探索、勇于创新的科学精神，推动了科学文化的发展。\n\n解析：近代科学文化的发展是多种因素共同作用的结果。资本主义经济的发展是根本原因，思想解放运动是重要的推动因素，科学家的个人努力也不可或缺。近代科学文化的发展，又反过来推动了社会的进步。"},{"id":"g3_history_027_ex10","knowledge_id":"g3_history_027","question":"材料分析题：阅读下列材料，回答问题。\n材料一：牛顿是英国著名的物理学家、数学家，他在1687年发表的论文《自然哲学的数学原理》里，对万有引力和三大运动定律进行了描述，奠定了此后三个世纪里物理世界的科学观点。\n材料二：一个不幸的人，贫穷、残废、孤独，由痛苦造成的人，世界不给他欢乐，他却创造了欢乐来给予世界！\n——罗曼·罗兰\n问题：（1）结合材料一和所学知识，谈谈牛顿对近代科学发展的贡献。（2）材料二是罗曼·罗兰对哪位艺术家的评价？这位艺术家有什么精神品质值得我们学习？","answer":"答案：（1）牛顿对近代科学发展的贡献：\n①牛顿是近代自然科学的奠基人之一，他在天文学、数学、力学等领域都有杰出贡献。\n②在天文学领域，他发现了万有引力定律；在数学领域，他创建了微积分；在力学领域，他建立了完整的力学理论体系，其中力学三定律对近代自然科学的发展影响最大。\n③1687年，牛顿出版了《自然哲学的数学原理》，使物理学成为一门独立的科学，奠定了近代物理学的基础。\n（2）材料二是罗曼·罗兰对德国音乐家贝多芬的评价。\n值得我们学习的精神品质：贝多芬虽然身处逆境，承受着贫穷、耳聋等痛苦，但他不向命运低头，敢于同命运抗争，具有坚忍不拔的毅力和对艺术的执着追求精神；他热爱自由、平等，热情歌颂资产阶级革命，具有强烈的社会责任感。\n\n解析：牛顿和贝多芬都是近代历史上的杰出人物，他们在各自的领域都取得了辉煌的成就。牛顿在科学领域的贡献使人类对自然界的认识产生了巨大飞跃；贝多芬在音乐领域的成就则给人类带来了美的享受和精神的鼓舞。他们的精神品质值得我们学习。"},{"id":"g3_history_028_ex01","knowledge_id":"g3_history_028","question":"选择题：第一次世界大战的导火线是？\nA. 波士顿倾茶事件\nB. 萨拉热窝事件\nC. 珍珠港事件\nD. 莱克星顿的枪声","answer":"答案：B\n解析：1914年6月28日，奥匈帝国皇位继承人斐迪南大公夫妇在萨拉热窝被塞尔维亚族青年普林西普刺杀，这就是萨拉热窝事件。这一事件成为第一次世界大战的导火线。1914年7月，奥匈帝国以萨拉热窝事件为借口，向塞尔维亚宣战，第一次世界大战爆发。"},{"id":"g3_history_028_ex02","knowledge_id":"g3_history_028","question":"填空题：第一次世界大战中，被称为\"绞肉机\"\"地狱\"\"屠场\"的战役是_________；第一次世界大战结束的时间是_________年。","answer":"答案：凡尔登战役、1918\n解析：1916年，德、法两国军队在法国的凡尔登展开了一场历时约10个月的阵地战。这场战役异常惨烈，交战双方损失近百万人。由于死亡人数太多，凡尔登战役有\"绞肉机\"\"地狱\"\"屠场\"之称。1918年11月，德国投降，第一次世界大战以同盟国的失败而结束。"},{"id":"g3_history_028_ex03","knowledge_id":"g3_history_028","question":"选择题：第一次世界大战中，先后加入战争的两大军事集团是？\nA. 三国同盟和三国协约\nB. 同盟国和轴心国\nC. 北约和华约\nD. 法西斯集团和反法西斯联盟","answer":"答案：A\n解析：第一次世界大战中，交战双方是三国同盟和三国协约两大军事集团。三国同盟由德国、奥匈帝国和意大利组成，以德国为核心；三国协约由英国、法国和俄国组成，以英国为核心。后来，意大利为了自身利益，参加到协约国一方作战。B选项是二战中的两大集团；C选项是冷战中的两大军事政治集团；D选项也是二战中的两大集团。"},{"id":"g3_history_028_ex04","knowledge_id":"g3_history_028","question":"简答题：请简述第一次世界大战爆发的原因。\n要求：不少于100字","answer":"答案：第一次世界大战爆发的原因主要有：\n（1）根本原因：19世纪末20世纪初，主要资本主义国家政治经济发展不平衡加剧。第二次工业革命后，美国、德国的经济实力超过了英国、法国，但它们占有的殖民地却远远少于英、法。后起的帝国主义国家要求重新瓜分世界，与英、法、俄等老牌帝国主义国家展开了激烈的争夺。\n（2）具体原因：帝国主义国家之间的矛盾十分尖锐，形成了三国同盟和三国协约两大敌对的帝国主义侵略集团。两大军事集团展开疯狂的扩军备战，冲突不断，世界大战一触即发。\n（3）直接原因（导火线）：1914年6月的萨拉热窝事件，成为第一次世界大战的导火线。\n\n解析：第一次世界大战是帝国主义国家之间为重新瓜分世界、争夺世界霸权而发动的一场帝国主义战争。它的爆发是多种因素共同作用的结果，其中根本原因是帝国主义国家政治经济发展不平衡。"},{"id":"g3_history_028_ex05","knowledge_id":"g3_history_028","question":"材料分析题：阅读下列材料，回答问题。\n材料一：1916年，德、法两国军队在法国的凡尔登展开了一场历时约10个月的阵地战。这场战役异常惨烈，交战双方损失近百万人。\n材料二：一战中，新式武器不断投入战场，如远程大炮、飞机、坦克、毒气弹等，造成了大量的人员伤亡。\n问题：（1）材料一描述的是哪次战役？这次战役有什么特点？（2）结合材料二和所学知识，谈谈第一次世界大战的性质和影响。","answer":"答案：（1）材料一描述的是凡尔登战役。\n特点：凡尔登战役是第一次世界大战中破坏性最大、时间最长的战役之一，被称为\"绞肉机\"\"地狱\"\"屠场\"，反映了战争的残酷性。\n（2）第一次世界大战的性质：第一次世界大战是西方列强为重新瓜分世界、争夺世界霸权而发动的一场帝国主义战争。对交战双方来说，都是非正义的战争。\n影响：\n①给人类带来了深重的灾难，造成了巨大的人员伤亡和财产损失。\n②大大削弱了欧洲的力量，从根本上动摇了欧洲的世界优势地位。\n③削弱了帝国主义的殖民力量，进一步促进了殖民地半殖民地国家的民族觉醒。\n④俄国爆发了十月革命，建立了世界上第一个社会主义国家。\n\n解析：第一次世界大战是人类历史上一次规模空前的战争，它给人类带来了巨大的灾难，也深刻影响了世界历史的发展进程。凡尔登战役是一战中最惨烈的战役之一，充分体现了战争的残酷性。"},{"id":"g3_history_028_ex06","knowledge_id":"g3_history_028","question":"选择题：第一次世界大战中，为维护自身利益而参加协约国一方作战的原同盟国成员是？\nA. 德国\nB. 奥匈帝国\nC. 意大利\nD. 俄国","answer":"答案：C\n解析：第一次世界大战爆发后，意大利为了自身的利益，见风使舵，参加到协约国一方作战。这充分说明了第一次世界大战是一场帝国主义的掠夺战争，帝国主义国家之间的关系一切以利益为转移。A、B选项始终是同盟国成员；D选项俄国始终是协约国成员。"},{"id":"g3_history_028_ex07","knowledge_id":"g3_history_028","question":"填空题：第一次世界大战的主战场在_________，形成了东线、西线和南线三条战线，其中_________战线是主要战线。","answer":"答案：欧洲、西\n解析：第一次世界大战的主战场在欧洲，形成了东线、西线和南线三条战线。其中，西线是英、法对德作战的战线，是一战中的主要战线，一战中的几次重大战役如马恩河战役、凡尔登战役、索姆河战役等都发生在西线。"},{"id":"g3_history_028_ex08","knowledge_id":"g3_history_028","question":"判断题：\"第一次世界大战是一场正义的反法西斯战争。\"这一说法是否正确？请说明理由。","answer":"答案：错误。\n理由：第一次世界大战是西方列强为重新瓜分世界、争夺世界霸权而发动的一场帝国主义战争，对交战双方来说，都是非正义的战争。虽然塞尔维亚是为了维护民族独立而战，具有正义的民族解放的性质，但这不能改变整个战争的非正义性。而反法西斯战争是第二次世界大战的性质。\n\n解析：第一次世界大战的交战双方是三国同盟和三国协约两大帝国主义军事集团，它们发动战争的目的都是为了重新瓜分世界、争夺世界霸权。因此，第一次世界大战的性质是帝国主义战争，是非正义的。第二次世界大战才是世界人民的反法西斯战争，是正义的战争。"},{"id":"g3_history_028_ex09","knowledge_id":"g3_history_028","question":"简答题：第一次世界大战有什么历史影响？\n要求：不少于100字","answer":"答案：第一次世界大战的历史影响主要有：\n（1）给人类带来了深重的灾难。第一次世界大战历时4年多，先后参战的国家共计30多个，牵涉人口约15亿，是人类历史上一次规模空前的战争，造成了大量的人员伤亡和财产损失。\n（2）大大削弱了欧洲的力量，从根本上动摇了欧洲的世界优势地位。大战使欧洲的英、法、德等国经济遭到严重破坏，实力下降；美国和日本则趁机崛起。\n（3）削弱了帝国主义的殖民力量，进一步促进了殖民地半殖民地国家的民族觉醒。一战中，帝国主义国家忙于战争，暂时放松了对殖民地半殖民地的控制，殖民地半殖民地人民的民族解放运动高涨。\n（4）战争中俄国爆发了十月革命，建立了世界上第一个社会主义国家，开创了人类历史的新纪元。\n\n解析：第一次世界大战是人类历史上一次规模空前的战争，它对人类社会产生了深远的影响。我们应该认识到战争的残酷性，珍惜来之不易的和平。"},{"id":"g3_history_028_ex10","knowledge_id":"g3_history_028","question":"材料分析题：阅读下列材料，回答问题。\n材料一：19世纪末20世纪初，主要资本主义国家工业产量占世界工业总产量的比重，美国由23%上升到38%，德国由13%上升到16%，英国由32%下降到14%，法国由10%下降到6%。\n材料二：让别的国家分割大陆和海洋，而我们德国满足于蓝色天空的时代已经过去，我们也要求阳光下的地盘。\n——德国外交大臣皮洛夫\n问题：（1）材料一反映了什么现象？这一现象产生的根本原因是什么？（2）结合材料二和所学知识，分析第一次世界大战爆发的根本原因。","answer":"答案：（1）材料一反映了19世纪末20世纪初，主要资本主义国家政治经济发展不平衡，美国、德国的经济实力超过了英国、法国。\n根本原因：第二次工业革命的推动。在第二次工业革命的推动下，主要资本主义国家的经济都有了发展，但发展不平衡，美、德等后起的资本主义国家经济发展迅速，超过了英、法等老牌资本主义国家。\n（2）第一次世界大战爆发的根本原因是：帝国主义国家政治经济发展不平衡，后起的帝国主义国家要求重新瓜分世界，与老牌帝国主义国家展开了激烈的争夺，最终导致了第一次世界大战的爆发。\n\n解析：帝国主义国家政治经济发展不平衡是第一次世界大战爆发的根本原因。第二次工业革命后，美、德等国经济实力迅速增长，但它们占有的殖民地却远远少于英、法等老牌殖民国家。后起的帝国主义国家要求重新瓜分世界，与英、法、俄等老牌帝国主义国家展开了激烈的争夺，形成了两大军事集团，最终导致了一战的爆发。"},{"id":"g3_history_029_ex01","knowledge_id":"g3_history_029","question":"选择题：俄国十月革命爆发的时间是？\nA. 1917年3月\nB. 1917年11月\nC. 1918年11月\nD. 1921年3月","answer":"答案：B\n解析：俄国十月革命爆发于1917年11月7日（俄历10月25日）。1917年11月6日晚，列宁秘密来到彼得格勒的起义总指挥部——斯莫尔尼宫，亲自领导起义。11月7日，彼得格勒武装起义取得胜利。这次革命因发生在俄历10月，被称为\"十月革命\"。"},{"id":"g3_history_029_ex02","knowledge_id":"g3_history_029","question":"填空题：十月革命的领导人是_________，起义首先在_________取得胜利。","answer":"答案：列宁、彼得格勒\n解析：1917年11月6日晚，列宁秘密来到彼得格勒的起义总指挥部——斯莫尔尼宫，亲自领导起义。11月7日，彼得格勒武装起义取得胜利。这次革命因发生在俄历10月，被称为\"十月革命\"。十月革命是人类历史上第一次胜利的社会主义革命，建立了第一个无产阶级专政的国家。"},{"id":"g3_history_029_ex03","knowledge_id":"g3_history_029","question":"选择题：人类历史上第一次胜利的社会主义革命是？\nA. 巴黎公社\nB. 俄国二月革命\nC. 俄国十月革命\nD. 中国新民主主义革命","answer":"答案：C\n解析：十月革命是人类历史上第一次胜利的社会主义革命，建立了第一个无产阶级专政的国家，推动了国际无产阶级革命运动，鼓舞了殖民地半殖民地人民的解放斗争。A选项巴黎公社是无产阶级建立政权的第一次伟大尝试，但最终失败了；B选项俄国二月革命是资产阶级民主革命；D选项中国新民主主义革命是无产阶级领导的反帝反封建的民主革命。"},{"id":"g3_history_029_ex04","knowledge_id":"g3_history_029","question":"简答题：请简述十月革命爆发的历史背景。\n要求：不少于100字","answer":"答案：十月革命爆发的历史背景主要有：\n（1）经济基础：19世纪末20世纪初，俄国资本主义经济有了一定的发展，但俄国仍然是一个落后的农业国，农奴制残余严重存在。\n（2）政治基础：俄国是一个军事封建帝国主义国家，各种社会矛盾十分尖锐，是帝国主义链条中最薄弱的环节。\n（3）直接原因：第一次世界大战给俄国人民带来了深重的灾难，激化了俄国的各种社会矛盾，加速了革命形势的发展。\n（4）阶级基础：俄国无产阶级力量不断壮大，具有很强的革命性，且有农民作为同盟军。\n（5）组织基础：有以列宁为首的布尔什维克党的正确领导。\n\n解析：十月革命的爆发是俄国社会矛盾激化的必然结果，也是多种因素共同作用的结果。第一次世界大战加速了革命的到来，布尔什维克党的正确领导是革命胜利的重要保证。"},{"id":"g3_history_029_ex05","knowledge_id":"g3_history_029","question":"材料分析题：阅读下列材料，回答问题。\n材料一：11月6日晚到7日清晨，20万起义工人和士兵迅速占领了彼得格勒的主要桥梁、火车站、邮电局、国家银行和政府机关等战略要地。\n材料二：十月革命一声炮响，给我们送来了马克思列宁主义。十月革命帮助了全世界的也帮助了中国的先进分子，用无产阶级的宇宙观作为观察国家命运的工具，重新考虑自己的问题。\n——毛泽东\n问题：（1）材料一描述的是哪一历史事件？这一事件的领导人是谁？（2）结合材料二和所学知识，分析十月革命的历史意义。","answer":"答案：（1）材料一描述的是俄国十月革命（彼得格勒武装起义）。这一事件的领导人是列宁。\n（2）十月革命的历史意义：\n①对俄国：十月革命是人类历史上第一次胜利的社会主义革命，建立了第一个无产阶级专政的国家，为俄国摆脱封建残余束缚和实现现代化创造了条件。\n②对世界：十月革命推动了国际无产阶级革命运动，鼓舞了殖民地半殖民地人民的解放斗争，开创了社会主义现代化的新模式，对20世纪的历史进程产生了深远影响。\n③对中国：十月革命给中国送来了马克思列宁主义，推动了马克思主义在中国的传播，为中国革命指明了方向，对中国共产党的成立和中国革命的发展产生了重要影响。\n\n解析：十月革命是人类历史上第一次取得胜利的社会主义革命，它不仅对俄国历史产生了深远影响，也对世界历史的发展产生了重要影响。毛泽东的话形象地说明了十月革命对中国的影响。"},{"id":"g3_history_029_ex06","knowledge_id":"g3_history_029","question":"选择题：下列关于俄国十月革命的表述，不正确的是？\nA. 十月革命发生在1917年11月\nB. 十月革命首先在莫斯科取得胜利\nC. 十月革命的领导人是列宁\nD. 十月革命是人类历史上第一次胜利的社会主义革命","answer":"答案：B\n解析：十月革命首先在彼得格勒取得胜利，而不是莫斯科。1917年11月6日晚，列宁秘密来到彼得格勒的起义总指挥部——斯莫尔尼宫，亲自领导起义。11月7日，彼得格勒武装起义取得胜利。因此B选项说法错误。A、C、D选项的说法都是正确的。"},{"id":"g3_history_029_ex07","knowledge_id":"g3_history_029","question":"填空题：十月革命建立了世界上第一个_________专政的国家，推动了国际_________革命运动。","answer":"答案：无产阶级、无产阶级\n解析：十月革命是人类历史上第一次胜利的社会主义革命，建立了第一个无产阶级专政的国家，推动了国际无产阶级革命运动，鼓舞了殖民地半殖民地人民的解放斗争。十月革命的胜利，开创了人类历史的新纪元，对20世纪的历史进程产生了深远影响。"},{"id":"g3_history_029_ex08","knowledge_id":"g3_history_029","question":"判断题：\"十月革命推翻了沙皇专制统治，建立了世界上第一个社会主义国家。\"这一说法是否正确？请说明理由。","answer":"答案：错误。\n理由：推翻沙皇专制统治的是俄国二月革命，而不是十月革命。十月革命推翻了资产阶级临时政府的统治，建立了世界上第一个社会主义国家——苏维埃俄国。\n\n解析：1917年3月，俄国爆发二月革命，推翻了沙皇专制统治，建立了资产阶级临时政府。但临时政府继续执行反人民的对外政策，并力图扑灭国内的革命火焰。1917年11月，俄国爆发十月革命，推翻了资产阶级临时政府的统治，建立了世界上第一个无产阶级专政的国家——苏维埃俄国。"},{"id":"g3_history_029_ex09","knowledge_id":"g3_history_029","question":"简答题：十月革命有什么历史意义？\n要求：不少于100字","answer":"答案：十月革命的历史意义主要有：\n（1）对俄国历史的影响：十月革命是人类历史上第一次胜利的社会主义革命，建立了第一个无产阶级专政的国家，为俄国摆脱封建残余束缚和实现现代化创造了条件，开辟了俄国历史的新纪元。\n（2）对世界历史的影响：十月革命推动了国际无产阶级革命运动，鼓舞了殖民地半殖民地人民的解放斗争，开创了社会主义现代化的新模式，打破了资本主义一统天下的局面，对20世纪的历史进程产生了深远影响。\n（3）对中国的影响：十月革命一声炮响，给中国送来了马克思列宁主义，推动了马克思主义在中国的传播，为中国革命指明了方向，对中国共产党的成立和中国革命的发展产生了重要影响。\n\n解析：十月革命是人类历史上一次具有划时代意义的革命，它不仅改变了俄国的历史命运，也深刻影响了世界历史的发展进程。我们应该从多个角度全面认识十月革命的历史意义。"},{"id":"g3_history_029_ex10","knowledge_id":"g3_history_029","question":"材料分析题：阅读下列材料，回答问题。\n材料一：1917年3月，俄国二月革命推翻了沙皇专制统治。二月革命后，俄国出现了两个政权并存的局面：一个是工兵代表苏维埃，一个是资产阶级临时政府。\n材料二：俄国当前形势的特点是从革命的第一阶段向革命的第二阶段过渡，第一阶段由于无产阶级的觉悟和组织程度不够，政权落到了资产阶级手中，第二阶段则应当使政权转到无产阶级和贫苦农民手中。\n——列宁《四月提纲》\n问题：（1）材料一中的\"两个政权\"分别是什么性质的政权？（2）结合材料二和所学知识，分析十月革命取得胜利的原因有哪些？","answer":"答案：（1）工兵代表苏维埃是工人士兵的革命政权，代表无产阶级和广大人民群众的利益；资产阶级临时政府是资产阶级性质的政权，代表资产阶级的利益。\n（2）十月革命取得胜利的原因：\n①客观原因：俄国是帝国主义链条中最薄弱的环节，各种社会矛盾十分尖锐；第一次世界大战给俄国人民带来了深重的灾难，激化了社会矛盾，加速了革命形势的发展；资产阶级临时政府继续执行反人民的政策，失去了民心。\n②主观原因：俄国无产阶级力量不断壮大，具有很强的革命性；有以列宁为首的布尔什维克党的正确领导；制定了正确的革命路线和策略；广大农民作为革命的同盟军，积极支持革命；革命军队的英勇作战。\n\n解析：二月革命后，俄国出现了两个政权并存的局面，但资产阶级临时政府掌握着主要权力。列宁在《四月提纲》中提出了从资产阶级民主革命向社会主义革命过渡的任务，为俄国革命指明了方向。十月革命的胜利是多种因素共同作用的结果，其中布尔什维克党的正确领导是革命胜利的重要保证。"},{"id":"g3_history_030_ex01","knowledge_id":"g3_history_030","question":"选择题：一战后，战胜国缔结和约、调整战后秩序的两次重要国际会议是？\nA. 巴黎和会和华盛顿会议\nB. 雅尔塔会议和波茨坦会议\nC. 德黑兰会议和开罗会议\nD. 慕尼黑会议和华盛顿会议","answer":"答案：A\n解析：第一次世界大战结束后，战胜的协约国集团为了缔结和约、调整战后秩序，先后召开了巴黎和会和华盛顿会议。1919年召开的巴黎和会，签订了对德的《凡尔赛条约》以及一系列和约，构成了凡尔赛体系，确立了帝国主义在欧洲、西亚、非洲统治的新秩序。1921-1922年召开的华盛顿会议，调整和确立了战胜国在东亚和太平洋地区的关系。通过这两次会议，列强建立了\"凡尔赛-华盛顿体系\"。"},{"id":"g3_history_030_ex02","knowledge_id":"g3_history_030","question":"填空题：1919年，巴黎和会签订了对德的《_________》；这次会议和华盛顿会议共同构成了一战后的国际新秩序——_________体系。","answer":"答案：凡尔赛条约、凡尔赛-华盛顿\n解析：1919年，巴黎和会召开，战胜的协约国集团与德国签订了《凡尔赛条约》。此后，协约国还分别与其他战败国签订了一系列和约，这些和约与《凡尔赛条约》一起构成了凡尔赛体系。1921-1922年华盛顿会议召开，调整和确立了战胜国在东亚和太平洋地区的关系。通过巴黎和会和华盛顿会议，列强建立了\"凡尔赛-华盛顿体系\"。"},{"id":"g3_history_030_ex03","knowledge_id":"g3_history_030","question":"选择题：下列关于凡尔赛-华盛顿体系的表述，正确的是？\nA. 它是一战后帝国主义重新瓜分世界的体系\nB. 它彻底消除了帝国主义国家之间的矛盾\nC. 它维护了世界的长期和平\nD. 它确立了帝国主义在全球统治的新秩序","answer":"答案：A\n解析：凡尔赛-华盛顿体系是一战后帝国主义重新瓜分世界的体系，它确立了帝国主义在欧洲、西亚、非洲、东亚和太平洋地区的统治新秩序。但它不可能彻底消除帝国主义国家之间的矛盾，因此不可能长期维持下去。B选项错误，体系不仅没有消除矛盾，反而埋下了新的矛盾种子；C选项错误，体系只是暂时缓和了帝国主义国家之间的矛盾，并没有维护世界长期和平；D选项错误，体系只是确立了帝国主义在欧洲、西亚、非洲、东亚和太平洋地区的统治新秩序，不是全球。"},{"id":"g3_history_030_ex04","knowledge_id":"g3_history_030","question":"简答题：请简述巴黎和会的主要内容。\n要求：不少于100字","answer":"答案：巴黎和会的主要内容有：\n（1）1919年1月，战胜的协约国集团在巴黎召开巴黎和会，讨论对德和约及战后安排。会议被法国总理克里孟梭、英国首相劳合·乔治和美国总统威尔逊操纵，这三人被称为巴黎和会\"三巨头\"。\n（2）1919年6月，协约国与德国签订了《凡尔赛条约》。条约的主要内容包括：领土方面，重划德国疆界，阿尔萨斯-洛林归还法国，萨尔煤矿归法国开采；军事方面，莱茵河西岸的德国领土由协约国占领15年，莱茵河东岸50千米内，德国不得设防，禁止德国实行义务兵役制，不许德国拥有空军，限制陆军人数；政治方面，德国承认奥地利、波兰等国独立；赔款方面，由协约国设立赔偿委员会，决定德国战争赔款的总数；殖民地方面，德国的全部海外殖民地由英、法、日等国瓜分。\n（3）协约国还分别与其他战败国签订了一系列和约，这些和约与《凡尔赛条约》一起构成了凡尔赛体系。\n\n解析：巴黎和会是一战后战胜的协约国集团召开的一次重要的国际会议，它确立了帝国主义在欧洲、西亚、非洲统治的新秩序。但这次会议实质上是一次帝国主义的分赃会议。"},{"id":"g3_history_030_ex05","knowledge_id":"g3_history_030","question":"材料分析题：阅读下列材料，回答问题。\n材料一：1919年召开的巴黎和会上，协约国与德国签订了《凡尔赛条约》。列宁说：\"靠《凡尔赛条约》来维系的整个国际体系、国际秩序是建立在火山上的。\"\n材料二：1921-1922年，美、英、法、日、意、荷、比、葡和中国九国代表在华盛顿举行会议。\n问题：（1）结合材料一和所学知识，谈谈你对列宁这句话的理解。（2）华盛顿会议的中心议题是什么？这次会议上签订了关于中国问题的什么条约？","answer":"答案：（1）对列宁这句话的理解：\n凡尔赛体系是建立在战胜国对战败国掠夺的基础上的，它不可能从根本上消除帝国主义国家之间的矛盾，反而埋下了新的矛盾种子。例如：\n①战胜国与战败国之间的矛盾：《凡尔赛条约》对德国的惩罚极为苛刻，激起了德国人民的复仇情绪，为后来希特勒上台和二战的爆发埋下了祸根。\n②战胜国之间的矛盾：巴黎和会是一次帝国主义的分赃会议，由于分赃不均，战胜国之间的矛盾也十分尖锐。\n③帝国主义国家与殖民地半殖民地人民之间的矛盾：体系牺牲了弱小国家和民族的利益，激起了殖民地半殖民地人民的反抗，民族解放运动不断高涨。\n因此，靠《凡尔赛条约》维系的国际秩序是极不稳定的，就像建立在火山上一样，随时都有可能崩溃。\n（2）华盛顿会议的中心议题是调整帝国主义国家在东亚和太平洋地区的关系，限制海军军备以及远东和太平洋地区问题。\n关于中国问题的条约：会议上签署了《九国公约》，该条约宣称尊重中国的主权、独立与领土完整，遵守各国在中国的\"门户开放\"\"机会均等\"的原则。这实际上为美国在中国的扩张提供了方便。\n\n解析：凡尔赛-华盛顿体系是一战后帝国主义重新瓜分世界的体系，它暂时调整了帝国主义国家之间的关系，但不可能从根本上消除它们之间的矛盾，因此不可能长期维持下去。"},{"id":"g3_history_030_ex06","knowledge_id":"g3_history_030","question":"选择题：华盛顿会议上签订的《九国公约》实质上是为哪个国家在中国的扩张提供了方便？\nA. 英国\nB. 日本\nC. 美国\nD. 法国","answer":"答案：C\n解析：华盛顿会议上签署的《九国公约》，宣称尊重中国的主权、独立与领土完整，遵守各国在中国的\"门户开放\"\"机会均等\"的原则。这实际上打破了日本独霸中国的局面，为美国在中国的扩张提供了方便，使中国恢复到几个帝国主义国家共同支配的局面。"},{"id":"g3_history_030_ex07","knowledge_id":"g3_history_030","question":"填空题：巴黎和会的\"三巨头\"是法国总理_________、英国首相_________和美国总统_________。","answer":"答案：克里孟梭、劳合·乔治、威尔逊\n解析：1919年1月，战胜的协约国集团在巴黎召开巴黎和会。会议被法国总理克里孟梭、英国首相劳合·乔治和美国总统威尔逊操纵，这三人被称为巴黎和会\"三巨头\"。作为战胜国的中国和其他弱国在和会上处于完全无权的地位。"},{"id":"g3_history_030_ex08","knowledge_id":"g3_history_030","question":"判断题：\"凡尔赛-华盛顿体系彻底消除了帝国主义国家之间的矛盾，维护了世界的长期和平。\"这一说法是否正确？请说明理由。","answer":"答案：错误。\n理由：凡尔赛-华盛顿体系是一战后帝国主义重新瓜分世界的体系，它暂时调整了帝国主义国家之间的关系，但不可能彻底消除帝国主义国家之间的矛盾。体系不仅没有消除矛盾，反而埋下了新的矛盾种子，如战胜国与战败国之间的矛盾、战胜国之间的矛盾、帝国主义国家与殖民地半殖民地人民之间的矛盾等。因此，它不可能长期维持下去，也不可能维护世界的长期和平。后来，随着1929-1933年经济大危机的爆发，德日法西斯上台，凡尔赛-华盛顿体系逐渐瓦解，最终导致了第二次世界大战的爆发。\n\n解析：凡尔赛-华盛顿体系是建立在战胜国对战败国掠夺的基础上的，是一种不稳固的、暂时的国际关系体系。它的矛盾性决定了它不可能长期维持下去，第二次世界大战的爆发标志着这一体系的彻底崩溃。"},{"id":"g3_history_030_ex09","knowledge_id":"g3_history_030","question":"简答题：如何评价凡尔赛-华盛顿体系？\n要求：不少于100字","answer":"答案：对凡尔赛-华盛顿体系的评价：\n（1）积极性：凡尔赛-华盛顿体系是一战后帝国主义重新瓜分世界的体系，它暂时调整了帝国主义国家之间的关系，确立了战后帝国主义世界的新秩序，使战后世界处于相对稳定的时期，为20世纪20年代资本主义经济的繁荣创造了条件。\n（2）消极性（局限性）：\n①体系是建立在战胜国对战败国掠夺的基础上的，不可能从根本上消除帝国主义国家之间的矛盾，反而埋下了新的矛盾种子。\n②战胜国与战败国之间的矛盾：《凡尔赛条约》对德国的惩罚极为苛刻，激起了德国人民的复仇情绪，为后来希特勒上台和二战的爆发埋下了祸根。\n③战胜国之间的矛盾：巴黎和会和华盛顿会议都是帝国主义的分赃会议，由于分赃不均，战胜国之间的矛盾也十分尖锐。\n④帝国主义国家与殖民地半殖民地人民之间的矛盾：体系牺牲了弱小国家和民族的利益，激起了殖民地半殖民地人民的反抗，民族解放运动不断高涨。\n\n因此，凡尔赛-华盛顿体系不可能长期维持下去，它的崩溃是历史的必然。\n\n解析：评价凡尔赛-华盛顿体系应该用一分为二的观点，既要看到它的积极性，也要认识到它的局限性。总体而言，这一体系的消极性是主要的，它的矛盾性决定了它不可能长期维持下去。"},{"id":"g3_history_030_ex10","knowledge_id":"g3_history_030","question":"材料分析题：阅读下列材料，回答问题。\n材料一：法国收回阿尔萨斯和洛林，萨尔煤矿交给法国开采15年，萨尔区由国际联盟代管15年；确定德波边界，把历来属于波兰的一些地区仍留给德国。总的来说，德国失去了原来领土的1/8，同时却保留下了10万平方千米历来属于波兰的领土。\n材料二：除中国外，缔约各国协定：（一）尊重中国之主权与独立，及领土与行政之完整；（二）给予中国完全无碍之机会，以发展并维持一有力巩固之政府；（三）施用各种之权势，以期切实设立并维持各国在中国全境之商务实业机会均等之原则……\n问题：（1）材料一指的是什么条约的内容？该条约是在哪次会议上通过的？（2）材料二指的是什么条约？它是在哪次会议上通过的？该条约对中国产生了什么影响？","answer":"答案：（1）材料一指的是《凡尔赛条约》的内容。该条约是在巴黎和会上通过的。\n（2）材料二指的是《九国公约》。它是在华盛顿会议上通过的。\n对中国的影响：《九国公约》表面上宣称尊重中国的主权、独立与领土完整，实际上是为美国在中国的扩张提供了方便，打破了日本独霸中国的局面，使中国恢复到几个帝国主义国家共同支配的局面，严重损害了中国的主权。\n\n解析：巴黎和会和华盛顿会议是一战后战胜的协约国集团召开的两次重要的国际会议。通过这两次会议，列强建立了\"凡尔赛-华盛顿体系\"，确立了战后帝国主义世界的新秩序。但这两次会议都损害了中国的利益，巴黎和会上中国外交的失败，引发了中国的五四运动；华盛顿会议上签订的《九国公约》，使中国恢复到几个帝国主义国家共同支配的局面。"},{"id":"g3_history_031_ex01","knowledge_id":"g3_history_031","question":"选择题：罗斯福新政开始实施的时间是？\nA. 1929年\nB. 1933年\nC. 1939年\nD. 1945年","answer":"答案：B\n解析：罗斯福新政开始实施的时间是1933年。1929-1933年，资本主义世界爆发了规模空前的经济大危机。1933年，罗斯福就任美国总统，为了应付日益严峻的经济大危机，罗斯福一上任，就宣布实施新政，采用国家干预手段来扭转经济形势。"},{"id":"g3_history_031_ex02","knowledge_id":"g3_history_031","question":"填空题：罗斯福新政的特点是_________，新政的中心措施是_________。","answer":"答案：国家干预经济（或加强国家对经济的干预和指导）、对工业的调整（或加强对工业的计划指导）\n解析：罗斯福新政的特点是采用国家干预手段来扭转经济形势（国家干预经济）。新政的中心措施是对工业的调整，通过《全国工业复兴法》，加强对工业的计划指导，防止盲目竞争引起的生产过剩，从而加强了政府对资本主义工业生产的控制与调节。"},{"id":"g3_history_031_ex03","knowledge_id":"g3_history_031","question":"选择题：罗斯福新政的中心措施是？\nA. 整顿金融体系\nB. 加强对工业的计划指导\nC. 调整农业政策\nD. 推行\"以工代赈\"","answer":"答案：B\n解析：罗斯福新政的中心措施是加强对工业的计划指导。1933年，罗斯福政府颁布《全国工业复兴法》，规定各行业企业制定本行业的公平经营规章，确定各企业的生产规模、价格水平、市场分配、工资标准和工作日时数等，以防止出现盲目竞争引起的生产过剩，从而加强了政府对资本主义工业生产的控制与调节。"},{"id":"g3_history_031_ex04","knowledge_id":"g3_history_031","question":"简答题：请简述罗斯福新政的主要内容。\n要求：不少于100字","answer":"答案：罗斯福新政的主要内容有：\n（1）整顿金融体系：通过《紧急银行法案》，对银行业进行整顿，恢复银行信用，使私人现款重新存入银行，进入流通。\n（2）加强对工业的计划指导（中心措施）：通过《全国工业复兴法》，制定公平竞争法规，协调各个工业部门的企业活动；规定雇员有组织起来进行谈判的权利，确定最低工资标准，限制工时；通过《全国劳工关系法》，在一定范围内维护工人合法权益。\n（3）调整农业政策：通过《农业调整法》，对全国农业生产和销售进行调节，限制产量，稳定农产品价格，销毁过剩农产品，政府给农民补贴。\n（4）推行\"以工代赈\"：通过投资兴建大量公共设施，如水库、发电站、公路、桥梁、机场、运动场、公园等，为失业者提供就业机会，既改善了基础设施，又刺激了消费和生产。\n（5）建立社会保障制度：通过《社会保障法》，建立社会保障制度；建立应急的救济机构，利用过剩物资救济失业家庭。\n\n解析：罗斯福新政是在不改变资本主义制度的前提下，加强国家对经济的干预和指导，以消除经济危机。新政使美国经济缓慢地恢复过来，人民生活得到改善，资本主义制度得到调整、巩固与发展。"},{"id":"g3_history_031_ex05","knowledge_id":"g3_history_031","question":"材料分析题：阅读下列材料，回答问题。\n材料一：1929年10月下旬，美国纽约股票市场出现抛售股票的浪潮，一场规模空前的经济大危机迅速席卷了整个资本主义世界。\n材料二：罗斯福说：\"作为一个国家，我们拒绝了任何彻底的革命计划。为了永远地纠正我们经济制度中的严重缺点，我们依靠的是旧民主秩序的新应用。\"\n问题：（1）材料一中的经济大危机有什么特点？（2）结合材料二和所学知识，谈谈你对罗斯福新政的认识。","answer":"答案：（1）经济大危机的特点：\n①波及范围特别广：危机从美国开始，迅速席卷了整个资本主义世界，造成工业、农业、商业和金融部门的危机。\n②持续时间比较长：从1929年到1933年，前后共5个年头。\n③破坏性特别大：整个资本主义世界的工业产量下降了40%以上，贸易额减少了2/3，失业人数超过3000万。\n（2）对罗斯福新政的认识：\n①性质：罗斯福新政是在不改变资本主义制度的前提下，加强国家对经济的干预和指导，以消除经济危机，是对资本主义生产关系的局部调整。\n②积极作用：新政期间，美国经济开始缓慢复苏，工业生产有所恢复，就业人数逐步增加，人民生活得到改善；新政增强了美国政府的宏观调控能力，恢复了美国人民的信心，对资本主义世界产生了深远影响；新政在一定程度上缓和了社会矛盾，遏制了美国的法西斯势力，巩固了资本主义制度。\n③局限性：新政是在维护资本主义制度的前提下作出的政策调整，它没有改变资本主义的本质，无法解决美国社会的根本矛盾，不可能从根本上消除经济危机。\n\n解析：1929-1933年的经济大危机是资本主义发展史上一次严重的经济危机。罗斯福新政是美国应对经济大危机的重要举措，它开创了国家干预经济的新模式，对美国和世界资本主义发展都产生了深远影响。"},{"id":"g3_history_031_ex06","knowledge_id":"g3_history_031","question":"选择题：罗斯福新政中，为解决失业问题而采取的措施是？\nA. 整顿金融体系\nB. 调整农业政策\nC. 推行\"以工代赈\"\nD. 加强对工业的计划指导","answer":"答案：C\n解析：罗斯福新政中，为解决失业问题而采取的措施是推行\"以工代赈\"。政府通过投资兴建大量公共设施，如水库、发电站、公路、桥梁、机场、运动场、公园等，为失业者提供就业机会。这一措施既改善了基础设施，又刺激了消费和生产，还增加了就业机会，稳定了社会秩序。"},{"id":"g3_history_031_ex07","knowledge_id":"g3_history_031","question":"填空题：罗斯福新政通过《_________》加强对工业的计划指导；通过《_________》建立社会保障制度。","answer":"答案：全国工业复兴法、社会保障法\n解析：罗斯福新政中，通过《全国工业复兴法》，制定公平竞争法规，协调各个工业部门的企业活动，加强对工业的计划指导，这是新政的中心措施。通过《社会保障法》，建立社会保障制度，建立应急的救济机构，利用过剩物资救济失业家庭，为弱势群体提供基本的生活保障。"},{"id":"g3_history_031_ex08","knowledge_id":"g3_history_031","question":"判断题：\"罗斯福新政从根本上消除了经济危机，改变了资本主义的本质。\"这一说法是否正确？请说明理由。","answer":"答案：错误。\n理由：罗斯福新政是在维护资本主义制度的前提下作出的政策调整，它没有改变资本主义的本质，无法解决美国社会的根本矛盾，不可能从根本上消除经济危机。因为经济危机的根源是资本主义制度的基本矛盾，即生产社会化和生产资料私人占有之间的矛盾，新政只是对资本主义生产关系的局部调整，不可能从根本上消除经济危机。\n\n解析：罗斯福新政虽然不能从根本上消除经济危机，但它使美国经济开始缓慢复苏，工业生产有所恢复，就业人数逐步增加，人民生活得到改善；新政增强了美国政府的宏观调控能力，恢复了美国人民的信心，对资本主义世界产生了深远影响。我们应该一分为二地看待罗斯福新政。"},{"id":"g3_history_031_ex09","knowledge_id":"g3_history_031","question":"简答题：罗斯福新政有什么历史意义？\n要求：不少于100字","answer":"答案：罗斯福新政的历史意义主要有：\n（1）对美国：\n①经济上：新政期间，美国经济开始缓慢复苏，工业生产有所恢复，就业人数逐步增加，人民生活得到改善。\n②政治上：新政增强了美国政府的宏观调控能力，恢复了美国人民的信心；在一定程度上缓和了社会矛盾，遏制了美国的法西斯势力，巩固了资本主义制度。\n（2）对资本主义世界：\n罗斯福新政开创了国家干预经济的新模式，资本主义告别\"自由放任\"政策占统治地位的时代，迎来以国家干预为特征的国家垄断资本主义时期，对资本主义世界产生了深远影响。\n（3）局限性：新政是在维护资本主义制度的前提下作出的政策调整，它没有改变资本主义的本质，无法解决美国社会的根本矛盾，不可能从根本上消除经济危机。\n\n解析：罗斯福新政是美国历史上一次重要的改革，它不仅对美国产生了深远影响，也对整个资本主义世界产生了重要影响。新政开创的国家干预经济的新模式，为二战后资本主义国家的经济发展提供了借鉴。"},{"id":"g3_history_031_ex10","knowledge_id":"g3_history_031","question":"材料分析题：阅读下列材料，回答问题。\n材料一：我们美国正在打一场伟大而成功的战争。这不仅是一种反对匮乏、贫穷与经济不景气的战争，而且是一种争取民主政治生存的战争。我们正为挽救一种伟大而珍贵的政府形式而战。\n——罗斯福1936年的一次演讲\n材料二：1933年5月，（罗斯福）发布《农业调整法》，强制农民减少耕地面积和牲畜繁殖，以提高农产品价格，解决农副产品过剩问题。国家对缩减耕地和降低牲畜繁殖的人进行补贴。\n问题：（1）材料一中罗斯福为什么说美国正在打一场\"争取民主政治生存的战争\"？（2）材料二反映了罗斯福新政的哪项措施？结合所学知识，分析罗斯福新政的特点。","answer":"答案：（1）因为经济大危机沉重打击了美国，激化了社会矛盾，美国的资本主义民主制度面临严峻的挑战，美国出现了法西斯势力抬头的迹象。罗斯福新政通过国家干预经济的方式来消除经济危机，同时也是在维护美国的资本主义民主制度，防止美国走上法西斯道路。所以罗斯福说美国正在打一场\"争取民主政治生存的战争\"。\n（2）材料二反映了罗斯福新政中调整农业政策的措施。通过《农业调整法》，对全国农业生产和销售进行调节，限制产量，稳定农产品价格，政府给农民补贴。\n罗斯福新政的特点：采用国家干预手段来扭转经济形势（或加强国家对经济的干预和指导）。新政通过法律形式，把国家保障经济稳定和发展的责任固定下来，在不触动资本主义制度的前提下，对美国经济制度进行了深刻改造。\n\n解析：罗斯福新政是美国应对经济大危机的重要举措。它的特点是国家干预经济，这也是它与以往资本主义经济政策的最大不同。新政不仅使美国逐渐从经济危机的阴影中走了出来，还在一定程度上缓和了社会矛盾，巩固了资本主义民主制度。"},{"id":"g3_history_032_ex01","knowledge_id":"g3_history_032","question":"选择题：意大利、德国、日本法西斯专政建立的先后顺序是？\nA. 意大利、德国、日本\nB. 德国、意大利、日本\nC. 日本、德国、意大利\nD. 意大利、日本、德国","answer":"答案：A\n解析：意大利、德国、日本法西斯专政建立的先后顺序是意大利、德国、日本。1922年，墨索里尼在意大利建立了法西斯专政。1933年，希特勒出任德国总理，开始掌握国家大权，不久，他将党、政、军大权集于一身，建立了法西斯专政，第二次世界大战的欧洲战争策源地形成。1936年，受军部控制的广田弘毅上台组阁，建立法西斯专政，第二次世界大战的亚洲战争策源地形成。"},{"id":"g3_history_032_ex02","knowledge_id":"g3_history_032","question":"填空题：1933年，_________出任德国总理，建立了法西斯专政，第二次世界大战的_________战争策源地形成；1936年，日本建立法西斯专政，第二次世界大战的_________战争策源地形成。","answer":"答案：希特勒、欧洲、亚洲\n解析：1933年，希特勒出任德国总理，开始掌握国家大权，不久，他将党、政、军大权集于一身，建立了法西斯专政，第二次世界大战的欧洲战争策源地形成。1936年，受军部控制的广田弘毅上台组阁，建立法西斯专政，第二次世界大战的亚洲战争策源地形成。"},{"id":"g3_history_032_ex03","knowledge_id":"g3_history_032","question":"选择题：下列事件中，标志着第二次世界大战欧洲战争策源地形成的是？\nA. 1922年墨索里尼在意大利建立法西斯专政\nB. 1933年希特勒出任德国总理，建立法西斯专政\nC. 1936年日本广田弘毅上台组阁，建立法西斯专政\nD. 1935年意大利入侵埃塞俄比亚","answer":"答案：B\n解析：1933年，希特勒出任德国总理，开始掌握国家大权，不久，他将党、政、军大权集于一身，建立了法西斯专政，标志着第二次世界大战的欧洲战争策源地形成。A选项是意大利法西斯专政建立的标志；C选项是亚洲战争策源地形成的标志；D选项是意大利法西斯侵略扩张的表现。"},{"id":"g3_history_032_ex04","knowledge_id":"g3_history_032","question":"简答题：请简述德、意、日法西斯专政建立的背景。\n要求：不少于100字","answer":"答案：德、意、日法西斯专政建立的背景主要有：\n（1）意大利：第一次世界大战后，意大利经济衰退，政治混乱，工农运动高涨，中央政府几乎瘫痪。墨索里尼乘机组织法西斯党，于1922年向罗马进军，建立了法西斯专政。\n（2）德国：1929-1933年的经济大危机沉重打击了德国，广大中下层民众困苦不堪，对政府的不满加剧。以希特勒为首的纳粹党乘机大肆活动，根据各个阶层民众的不同心理，进行针对性的蛊惑宣传，还利用民众对《凡尔赛条约》的不满，煽动复仇情绪，从而赢得了广泛的支持。1933年，希特勒出任德国总理，建立了法西斯专政。\n（3）日本：经济大危机中，日本经济受到重创，国内外矛盾激化，日本出现了形形色色的法西斯组织，军部是日本法西斯势力的核心。1936年，受军部控制的广田弘毅上台组阁，建立法西斯专政。\n\n解析：德、意、日法西斯专政的建立都与经济危机或战争后的困境有关，都宣扬极端民族主义，都实行独裁统治，都积极对外侵略扩张，对世界和平构成了严重威胁。"},{"id":"g3_history_032_ex05","knowledge_id":"g3_history_032","question":"材料分析题：阅读下列材料，回答问题。\n材料一：1929-1933年的资本主义世界经济危机，使德国的工业生产下降了40%多，失业人数超过600万，对外贸易额下降了60%。\n材料二：纳粹党党旗上有万字符，象征\"争取雅利安人胜利的斗争的使命\"。纳粹党宣扬\"种族优越论\"，认为雅利安人是优等种族，犹太人是劣等种族，必须被消灭。\n问题：（1）结合材料一和所学知识，分析德国法西斯专政建立的原因。（2）材料二反映了德国法西斯的什么特点？德国法西斯的暴行有哪些？","answer":"答案：（1）德国法西斯专政建立的原因：\n①根本原因：1929-1933年的经济大危机沉重打击了德国，广大中下层民众困苦不堪，对政府的不满加剧，社会矛盾尖锐。\n②历史原因：德国对凡尔赛体系的不满，民族复仇情绪强烈。\n③直接原因：以希特勒为首的纳粹党乘机大肆活动，进行蛊惑宣传，利用民众对《凡尔赛条约》的不满，煽动复仇情绪，从而赢得了广泛的支持。\n④缺乏民主传统：德国是一个具有专制传统的国家，魏玛共和国民主基础薄弱。\n（2）材料二反映了德国法西斯宣扬\"种族优越论\"，极端仇视犹太人，具有极端民族主义和种族主义的特点。\n德国法西斯的暴行：\n①制造\"国会纵火案\"，打击德国共产党。\n②解散工会，取缔纳粹党以外的所有政党。\n③加强思想控制，焚毁大量进步书籍。\n④残酷迫害犹太人，推行种族灭绝政策，屠杀了几百万犹太人。\n⑤实行普遍义务兵役制，疯狂扩军备战。\n\n解析：德、意、日法西斯专政的建立是20世纪二三十年代世界局势动荡的重要表现。法西斯势力对内实行独裁统治，对外积极侵略扩张，严重威胁世界和平，最终导致了第二次世界大战的爆发。"},{"id":"g3_history_032_ex06","knowledge_id":"g3_history_032","question":"选择题：日本法西斯势力的核心是？\nA. 天皇\nB. 军部\nC. 内阁\nD. 纳粹党","answer":"答案：B\n解析：日本法西斯势力的核心是军部。军部是日本法西斯势力的核心，它是日本庞大的军事官僚机构，独立于内阁、议会之外，直接对天皇负责。1936年，受军部控制的广田弘毅上台组阁，建立法西斯专政，第二次世界大战的亚洲战争策源地形成。A选项天皇是日本的国家象征，不是法西斯势力的核心；C选项内阁受军部控制；D选项纳粹党是德国的法西斯政党。"},{"id":"g3_history_032_ex07","knowledge_id":"g3_history_032","question":"填空题：意大利法西斯专政的建立者是_________，德国法西斯专政的建立者是_________。","answer":"答案：墨索里尼、希特勒\n解析：1922年，墨索里尼在意大利建立了法西斯专政。1933年，希特勒出任德国总理，开始掌握国家大权，不久，他将党、政、军大权集于一身，建立了法西斯专政。墨索里尼和希特勒分别是意大利和德国法西斯势力的头目，他们建立的法西斯专政，对内实行独裁统治，对外积极侵略扩张，对世界和平构成了严重威胁。"},{"id":"g3_history_032_ex08","knowledge_id":"g3_history_032","question":"判断题：\"日本法西斯专政的建立，标志着第二次世界大战欧洲战争策源地的形成。\"这一说法是否正确？请说明理由。","answer":"答案：错误。\n理由：日本法西斯专政的建立，标志着第二次世界大战亚洲战争策源地的形成，而不是欧洲战争策源地。1936年，受军部控制的广田弘毅上台组阁，建立法西斯专政，第二次世界大战的亚洲战争策源地形成。而第二次世界大战欧洲战争策源地形成的标志是1933年希特勒出任德国总理，建立法西斯专政。\n\n解析：20世纪二三十年代，意大利、德国和日本先后建立起法西斯专政，形成了欧洲和亚洲两个战争策源地。德、意、日法西斯国家的大肆侵略，激起了世界各国人民的愤怒，全世界反法西斯国家逐渐走向联合，最终取得了世界反法西斯战争的胜利。"},{"id":"g3_history_032_ex09","knowledge_id":"g3_history_032","question":"简答题：德、意、日法西斯专政的建立有什么共同特点和影响？\n要求：不少于100字","answer":"答案：德、意、日法西斯专政的共同特点：\n（1）建立背景：都与经济危机或战争后的困境有关，都是在社会矛盾尖锐的情况下建立的。\n（2）统治特点：都对内实行独裁统治，镇压人民革命运动，加强思想控制；都对外积极侵略扩张，试图通过对外战争摆脱危机。\n（3）思想特点：都宣扬极端民族主义，鼓吹种族优劣论或军国主义思想。\n\n影响：\n（1）对国内：法西斯专政的建立，使这些国家的民主制度被摧毁，人民失去了自由和权利，被置于法西斯独裁统治之下。\n（2）对世界：德、意、日法西斯国家的大肆侵略扩张，严重威胁世界和平，形成了欧洲和亚洲两个战争策源地，最终导致了第二次世界大战的爆发，给世界人民带来了深重的灾难。\n\n解析：德、意、日法西斯专政的建立是20世纪二三十年代世界局势动荡的重要表现。法西斯主义是一种极端反动的思潮和政权形式，它给世界人民带来了巨大的灾难。我们应该牢记历史，警惕法西斯势力的死灰复燃。"},{"id":"g3_history_032_ex10","knowledge_id":"g3_history_032","question":"材料分析题：阅读下列材料，回答问题。\n材料一：20世纪二三十年代，意大利、德国和日本先后建立起法西斯专政，对内实行独裁统治，对外积极侵略扩张，对世界和平构成了严重威胁。\n材料二：德国法西斯专政建立后，疯狂扩军备战，撕毁《凡尔赛条约》，实行普遍义务兵役制，把军队扩编到60万人，还进军莱茵非军事区。\n材料三：日本军部是日本法西斯势力的核心，1931年，日本发动了侵略中国的九一八事变，1937年又发动了全面侵华战争。\n问题：（1）结合材料一和所学知识，分析德、意、日三国法西斯专政建立的共同原因。（2）结合材料二、三和所学知识，说说德、日法西斯专政的建立对世界产生了什么影响？","answer":"答案：（1）德、意、日三国法西斯专政建立的共同原因：\n①经济危机的打击：1929-1933年的经济大危机沉重打击了德、日等国，激化了社会矛盾，为法西斯势力的崛起提供了条件（意大利法西斯专政建立在一战后，也是由于经济衰退、政治混乱）。\n②社会矛盾尖锐：经济危机或战争导致各国社会矛盾尖锐，民众对现政府不满，法西斯势力乘机蛊惑宣传，赢得支持。\n③缺乏民主传统：德、意、日三国都缺乏深厚的民主传统，容易走向独裁。\n④对现有国际秩序的不满：德国对凡尔赛体系不满，日本对华盛顿体系不满，都想打破现有国际秩序。\n（2）德、日法西斯专政的建立对世界的影响：\n①德、日法西斯专政建立后，疯狂扩军备战，积极对外侵略扩张，形成了欧洲和亚洲两个战争策源地，严重威胁世界和平。\n②德国撕毁《凡尔赛条约》，日本发动侵华战争，凡尔赛-华盛顿体系逐渐瓦解。\n③德、意、日法西斯国家的大肆侵略，激起了世界各国人民的愤怒，全世界反法西斯国家逐渐走向联合，最终导致了第二次世界大战的爆发。\n\n解析：20世纪二三十年代，德、意、日三国先后建立法西斯专政，它们对内独裁、对外扩张，给世界和平带来了严重威胁，最终引发了第二次世界大战。我们应该铭记历史，珍惜来之不易的和平。"},{"id":"g3_history_033_ex01","knowledge_id":"g3_history_033","question":"选择题：第二次世界大战全面爆发的标志是？\nA. 1931年九一八事变\nB. 1937年七七事变\nC. 1939年9月1日德国突袭波兰，英、法对德宣战\nD. 1941年12月日本偷袭珍珠港","answer":"答案：C\n解析：1939年9月1日，德国军队对波兰发动了突然进攻。9月3日，英国和法国被迫对德国宣战，第二次世界大战全面爆发。A选项是中国局部抗战开始的标志，也是二战亚洲策源地形成后的局部战争；B选项是中国全面抗战爆发的标志；D选项是太平洋战争爆发的标志，二战达到最大规模。"},{"id":"g3_history_033_ex02","knowledge_id":"g3_history_033","question":"填空题：1942年1月，美、英、苏、中等26个国家签署《_________》，标志着_________的正式形成。","answer":"答案：联合国家宣言、世界反法西斯联盟\n解析：1942年1月，美、英、苏、中等26个国家的代表在美国首都华盛顿签署《联合国家宣言》。宣言的发表，标志着世界反法西斯联盟的正式形成。各国为了一个共同的目标，相互支援，协同作战，逐渐扭转了战争的形势。"},{"id":"g3_history_033_ex03","knowledge_id":"g3_history_033","question":"选择题：第二次世界大战的转折点是？\nA. 莫斯科保卫战\nB. 斯大林格勒保卫战\nC. 诺曼底登陆\nD. 中途岛海战","answer":"答案：B\n解析：斯大林格勒保卫战是第二次世界大战的转折点。1942年7月，德国集中兵力进攻苏联战略重镇斯大林格勒，苏联军民英勇抗敌，于1943年2月大败德军。斯大林格勒保卫战是第二次世界大战的转折点，此后，苏军连续进攻，扭转了苏德战场的形势，德军被迫从战略进攻转入战略防御。"},{"id":"g3_history_033_ex04","knowledge_id":"g3_history_033","question":"简答题：请简述第二次世界大战的主要进程。\n要求：不少于100字","answer":"答案：第二次世界大战的主要进程：\n（1）全面爆发：1939年9月1日，德国突袭波兰，9月3日，英、法对德宣战，第二次世界大战全面爆发。\n（2）扩大：1941年6月，德国掉头向东，发动了对苏联的侵略战争，苏联取得了莫斯科保卫战的胜利，粉碎了德军不可战胜的神话。\n（3）达到最大规模：1941年12月7日，日军偷袭珍珠港，太平洋战争爆发，二战达到最大规模。\n（4）国际反法西斯联盟建立：1942年1月，《联合国家宣言》签署，标志着世界反法西斯联盟的正式形成。\n（5）转折：1942-1943年的斯大林格勒保卫战是第二次世界大战的转折点。\n（6）开辟欧洲第二战场：1944年6月，美、英盟军成功登陆法国诺曼底，开辟了欧洲第二战场。\n（7）结束：1945年5月8日，德国正式签署无条件投降书，欧洲战事结束；1945年9月2日，日本正式签署投降书，第二次世界大战结束。\n\n解析：第二次世界大战是人类历史上规模空前的战争，给世界人民带来了巨大的灾难。最终，世界反法西斯国家联合起来，取得了反法西斯战争的胜利。"},{"id":"g3_history_033_ex05","knowledge_id":"g3_history_033","question":"材料分析题：阅读下列材料，回答问题。\n材料一：每一（签字国）政府各自保证对与各该政府作战的三国同盟成员国及其附从者使用其全部资源，不论军事的或经济的。\n——《联合国家宣言》\n材料二：1945年9月2日，日本正式签署投降书，第二次世界大战以法西斯国家的彻底失败和世界人民反法西斯战争的胜利而告终。\n问题：（1）材料一中的\"三国同盟成员国\"指的是哪三个国家？《联合国家宣言》的签署有什么意义？（2）结合材料二和所学知识，分析世界反法西斯战争胜利的原因和历史意义。","answer":"答案：（1）\"三国同盟成员国\"指的是德国、意大利、日本三个法西斯国家。\n意义：《联合国家宣言》的签署，标志着世界反法西斯联盟的正式形成。各国为了一个共同的目标，相互支援，协同作战，逐渐扭转了战争的形势，为最终打败法西斯奠定了坚实的基础。\n（2）世界反法西斯战争胜利的原因：\n①世界反法西斯联盟的建立，各国相互支援，协同作战，这是胜利的根本保证。\n②反法西斯战争的正义性，得到了世界各国人民的支持。\n③各国人民的英勇作战，如中国人民的抗日战争、苏联人民的卫国战争等。\n历史意义：\n①第二次世界大战的胜利，彻底粉碎了法西斯主义和军国主义通过战争称霸世界的野心，彻底结束了列强通过争夺殖民地瓜分世界的历史，促进了世界殖民体系的瓦解。\n②对维护世界和平、促进共同发展产生了重大而深远的影响。\n③战后成立了联合国，在维护世界和平与安全方面发挥了积极作用。\n④战争客观上推动了科学技术的发展，加速了第三次科技革命的到来。\n\n解析：世界反法西斯战争的胜利，是人类历史上的一件大事，它深刻影响了战后世界的发展。建立世界反法西斯联盟，是战争取得胜利的重要保证。"},{"id":"g3_history_033_ex06","knowledge_id":"g3_history_033","question":"选择题：1944年6月，美、英盟军开辟欧洲第二战场的标志性事件是？\nA. 莫斯科保卫战\nB. 斯大林格勒保卫战\nC. 诺曼底登陆\nD. 珍珠港事件","answer":"答案：C\n解析：1944年6月，美、英盟军成功登陆法国诺曼底，开辟了欧洲第二战场，德国陷入东西两个战场的夹击之中，加速了德国法西斯的灭亡。A选项莫斯科保卫战打破了德军不可战胜的神话；B选项斯大林格勒保卫战是二战的转折点；D选项珍珠港事件使二战达到最大规模。"},{"id":"g3_history_033_ex07","knowledge_id":"g3_history_033","question":"填空题：第二次世界大战欧洲战事结束的标志是_________年5月8日德国正式签署无条件投降书；二战结束的标志是_________年9月2日日本正式签署投降书。","answer":"答案：1945、1945\n解析：1945年5月8日，德国正式签署无条件投降书，欧洲战事结束。1945年8月15日，日本法西斯宣布无条件投降。9月2日，日本正式签署投降书，第二次世界大战以法西斯国家的彻底失败和世界人民反法西斯战争的胜利而告终。"},{"id":"g3_history_033_ex08","knowledge_id":"g3_history_033","question":"判断题：\"第二次世界大战是一场帝国主义掠夺战争，对交战双方来说都是非正义的。\"这一说法是否正确？请说明理由。","answer":"答案：错误。\n理由：这一说法混淆了第一次世界大战和第二次世界大战的性质。第一次世界大战是西方列强为重新瓜分世界、争夺世界霸权而发动的一场帝国主义战争，对交战双方来说都是非正义的。而第二次世界大战是一场世界人民的反法西斯战争，是正义的战争。德、意、日法西斯国家是战争的发动者，它们到处侵略扩张，给世界人民带来了巨大灾难；而世界反法西斯国家和人民进行的是反抗法西斯侵略、维护世界和平的正义战争。\n\n解析：第二次世界大战是人类历史上规模空前的战争，德、意、日法西斯国家的大肆侵略，激起了世界各国人民的愤怒。全世界反法西斯国家逐渐走向联合，最终取得了反法西斯战争的胜利。这场战争的性质是世界人民的反法西斯战争，是正义的战争。"},{"id":"g3_history_033_ex09","knowledge_id":"g3_history_033","question":"简答题：第二次世界大战有什么历史影响？\n要求：不少于100字","answer":"答案：第二次世界大战的历史影响主要有：\n（1）给人类带来了巨大的灾难：第二次世界大战是人类历史上规模空前的战争，给世界各国人民带来了巨大的人员伤亡和财产损失，对人类文明造成了空前的破坏。\n（2）彻底粉碎了法西斯主义和军国主义通过战争称霸世界的野心：第二次世界大战的胜利，彻底打败了德、意、日三个法西斯国家，使法西斯主义和军国主义遭到了彻底失败。\n（3）促进了世界殖民体系的瓦解：第二次世界大战彻底结束了列强通过争夺殖民地瓜分世界的历史，促进了世界殖民体系的瓦解，战后亚非拉民族解放运动蓬勃发展。\n（4）对维护世界和平、促进共同发展产生了重大而深远的影响：战后成立了联合国，在维护世界和平与安全方面发挥了积极作用；战争的惨痛教训使和平与发展的思想日益深入人心。\n（5）客观上推动了科学技术的发展：战争客观上推动了科学技术的发展，加速了第三次科技革命的到来，如原子能技术、电子计算机技术等都是在二战期间或战后初期发展起来的。\n\n解析：第二次世界大战是人类历史上一次规模空前的战争，它对世界产生了深远的影响。我们应该铭记历史，珍惜来之不易的和平。"},{"id":"g3_history_033_ex10","knowledge_id":"g3_history_033","question":"材料分析题：阅读下列材料，回答问题。\n材料一：昨天，1941年12月7日——一个遗臭万年的日子——美利坚合众国遭到了日本帝国海空军部队突然和蓄谋的进攻。\n——罗斯福\n材料二：第二次世界大战中，中国战场是世界反法西斯战争的东方主战场，牵制和消灭了大量日军，为世界反法西斯战争的胜利作出了巨大贡献。\n问题：（1）材料一中罗斯福为什么说1941年12月7日是\"一个遗臭万年的日子\"？这一事件有什么影响？（2）结合材料二和所学知识，谈谈中国在世界反法西斯战争中的地位和作用。","answer":"答案：（1）因为1941年12月7日，日本偷袭美国海军基地珍珠港，重创美军太平洋舰队，这是日本对美国不宣而战的侵略行为，所以罗斯福说这是\"一个遗臭万年的日子\"。\n影响：珍珠港事件后，美国对日宣战，太平洋战争爆发，第二次世界大战达到最大规模。\n（2）中国在世界反法西斯战争中的地位和作用：\n①中国战场是世界反法西斯战争的东方主战场，中国人民的抗日战争是世界反法西斯战争的重要组成部分。\n②中国人民坚持抗战，牵制和消灭了大量日军，有力地配合和支援了其他反法西斯战场，为世界反法西斯战争的胜利作出了巨大贡献，也付出了巨大的民族牺牲。\n③中国的抗日战争是近代以来中国反抗外敌入侵第一次取得完全胜利的民族解放战争，它促进了中华民族的觉醒，提高了中国的国际地位。\n\n解析：中国人民的抗日战争是世界反法西斯战争的重要组成部分，中国战场是世界反法西斯战争的东方主战场。中国人民为世界反法西斯战争的胜利作出了巨大贡献，也付出了巨大的民族牺牲。"},{"id":"g3_history_034_ex01","knowledge_id":"g3_history_034","question":"选择题：冷战开始的标志是？\nA. 丘吉尔的\"铁幕演说\"\nB. 杜鲁门主义的出台\nC. 马歇尔计划的实施\nD. 北约和华约的成立","answer":"答案：B\n解析：1947年3月，杜鲁门主义的出台，标志着美、苏战时同盟关系正式破裂，冷战开始。A选项丘吉尔的\"铁幕演说\"揭开了冷战的序幕；C选项马歇尔计划是冷战在经济方面的表现；D选项北约和华约的成立标志着两极格局的形成。"},{"id":"g3_history_034_ex02","knowledge_id":"g3_history_034","question":"填空题：冷战是指第二次世界大战后的40多年间，以_________、_________为首的两大集团之间既非战争又非和平的对峙与竞争状态。","answer":"答案：美、苏（或美国、苏联）\n解析：冷战是指第二次世界大战后的40多年间（1947-1991年），以美、苏为首的两大集团之间既非战争又非和平的对峙与竞争状态。冷战的双方是以美国为首的资本主义阵营和以苏联为首的社会主义阵营。1991年苏联解体，冷战结束。"},{"id":"g3_history_034_ex03","knowledge_id":"g3_history_034","question":"选择题：标志着美苏两极格局形成的事件是？\nA. 杜鲁门主义的出台\nB. 马歇尔计划的实施\nC. 北约和华约的成立\nD. 苏联解体","answer":"答案：C\n解析：1949年，美、英、法等12个国家在华盛顿成立了\"北大西洋公约组织\"，简称\"北约\"。1955年，苏联同东欧7个社会主义国家成立了\"华沙条约组织\"，简称\"华约\"。美苏双方互相敌对，进而发展为两大集团的全面冷战对峙，两极格局形成。A选项是冷战开始的标志；B选项是冷战在经济方面的表现；D选项是冷战结束的标志。"},{"id":"g3_history_034_ex04","knowledge_id":"g3_history_034","question":"简答题：请简述冷战爆发的原因和主要表现。\n要求：不少于100字","answer":"答案：冷战爆发的原因：\n（1）根本原因：美苏两国国家战略的对立和社会制度的巨大差异，使双方的对抗、冲突不断加剧。二战后，美国成为世界上军事、经济实力最强大的国家，妄图凭借强大的实力称霸世界；而苏联的力量也逐渐壮大，国际地位大大提高，东欧一些国家在苏联的影响下走上了社会主义道路。\n（2）直接原因：1947年3月，杜鲁门主义的出台，标志着美、苏战时同盟关系正式破裂，冷战开始。\n\n冷战的主要表现：\n（1）政治上：杜鲁门主义的出台，这是冷战开始的标志，也是美国冷战政策在政治上的表现。\n（2）经济上：马歇尔计划的实施，这是美国冷战政策在经济上的表现，目的是通过援助西欧恢复经济，稳定资本主义制度，同时加强对西欧的控制。\n（3）军事上：1949年北约成立，1955年华约成立，两极格局形成。\n（4）德国分裂：1949年，德国分裂为联邦德国和民主德国，欧洲冷战对峙的局面基本形成。\n\n解析：冷战是二战后以美苏为首的两大集团之间既非战争又非和平的对峙与竞争状态。冷战持续了40多年，深刻影响了战后世界的发展。"},{"id":"g3_history_034_ex05","knowledge_id":"g3_history_034","question":"材料分析题：阅读下列材料，回答问题。\n材料一：从波罗的海的什切青到亚得里亚海边的里雅斯特，一幅横贯欧洲大陆的铁幕已经降落下来。\n——丘吉尔1946年\"铁幕演说\"\n材料二：1947年，美国总统杜鲁门在国会发表演说，声称希腊和土耳其受到共产主义威胁，要求国会拨款援助这两个国家。杜鲁门主义的出台，标志着美、苏战时同盟关系正式破裂。\n问题：（1）材料一的\"铁幕演说\"有什么影响？（2）结合材料二和所学知识，说说冷战开始的标志是什么？冷战的实质是什么？","answer":"答案：（1）\"铁幕演说\"揭开了冷战的序幕，为冷战的爆发制造了舆论准备。\n（2）冷战开始的标志是1947年杜鲁门主义的出台。\n冷战的实质是：冷战是以美、苏为首的两大集团之间既非战争又非和平的对峙与竞争状态，其实质是美苏两国为了争夺世界霸权，各自率领所控制的集团进行的除直接武装进攻以外的一切敌对活动和对抗形式。\n\n解析：冷战是二战后美苏两大集团之间的对峙与竞争。丘吉尔的\"铁幕演说\"揭开了冷战的序幕，杜鲁门主义的出台标志着冷战的开始。冷战的形式多样，包括政治对抗、经济封锁、军事对峙、意识形态斗争等，但双方都极力避免直接的大规模战争。"},{"id":"g3_history_034_ex06","knowledge_id":"g3_history_034","question":"选择题：冷战结束的标志是？\nA. 杜鲁门主义的出台\nB. 苏联解体\nC. 东欧剧变\nD. 德国统一","answer":"答案：B\n解析：1991年苏联解体，标志着冷战结束，也标志着两极格局的终结。A选项是冷战开始的标志；C选项东欧剧变是指1989年前后东欧一些社会主义国家共产党和工人党在短时间内纷纷丧失政权，社会制度随之发生根本性变化的事件，它加速了冷战的结束，但不是冷战结束的标志；D选项德国统一发生在1990年，也加速了冷战的结束。"},{"id":"g3_history_034_ex07","knowledge_id":"g3_history_034","question":"填空题：美国冷战政策在经济方面的表现是_________的实施；1949年成立的_________和1955年成立的_________标志着两极格局的形成。","answer":"答案：马歇尔计划、北约、华约\n解析：美国冷战政策在经济方面的表现是马歇尔计划的实施。马歇尔计划又称欧洲复兴计划，目的是通过援助西欧恢复经济，稳定资本主义制度，同时加强对西欧的控制。1949年北约成立，1955年华约成立，美苏双方互相敌对，进而发展为两大集团的全面冷战对峙，两极格局形成。"},{"id":"g3_history_034_ex08","knowledge_id":"g3_history_034","question":"判断题：\"冷战就是美苏两大集团之间直接的武装冲突。\"这一说法是否正确？请说明理由。","answer":"答案：错误。\n理由：冷战是指第二次世界大战后的40多年间，以美、苏为首的两大集团之间既非战争又非和平的对峙与竞争状态。冷战的特点是双方除直接武装进攻以外的一切敌对活动和对抗形式，包括政治对抗、经济封锁、军事对峙、意识形态斗争、代理人战争等。双方都极力避免直接的大规模战争，因此冷战不是直接的武装冲突。\n\n解析：冷战之所以称为\"冷\"战，就是因为美苏双方没有直接爆发大规模的战争。但是，冷战期间局部热战不断，如朝鲜战争、越南战争等，但这些都是冷战背景下的局部冲突，不是美苏之间的直接战争。"},{"id":"g3_history_034_ex09","knowledge_id":"g3_history_034","question":"简答题：冷战对世界产生了什么影响？\n要求：不少于100字","answer":"答案：冷战对世界产生了深远的影响：\n（1）消极影响：\n①冷战严重威胁了世界和平与安全。美苏两个超级大国之间的对抗，使世界长期不得安宁，造成了德国、朝鲜等国家的分裂，引发了一系列局部战争，给世界人民带来了巨大的痛苦和灾难。\n②冷战造成了世界经济的长期不稳定。两大阵营的对立和对抗，阻碍了经济全球化的发展，影响了世界经济的正常发展。\n③冷战还造成了人们精神上的压抑和恐惧，核战争的阴影长期笼罩着世界。\n（2）积极影响：\n①冷战期间，美苏双方势均力敌，都不敢轻易发动战争，避免了新的世界大战的爆发。\n②不同社会制度的国家在长期共存中都不同程度地从对方身上借鉴了经验，吸取了教训，并用于内部的调整和改革，推动了世界的整体发展。\n③面对两极对峙局面，亚非拉发展中国家组成不结盟运动，逐步发展壮大，第三世界由此崛起。\n\n解析：冷战是二战后世界格局的主要特征之一，它对世界产生了深远的影响。我们应该一分为二地看待冷战的影响，既要看到它的消极影响，也要看到它在客观上的一些积极作用。"},{"id":"g3_history_034_ex10","knowledge_id":"g3_history_034","question":"材料分析题：阅读下列材料，回答问题。\n材料一：1947年，美国总统杜鲁门在国会发表演说，宣称美国有领导\"自由世界\"的使命，以\"防止共产主义的渗入\"。这就是杜鲁门主义。\n材料二：1991年12月25日，戈尔巴乔夫辞去苏联最高领导人职务，苏联国旗从克里姆林宫上空降下，俄罗斯等11个加盟共和国组成独立国家联合体。苏联正式解体。\n问题：（1）材料一中的杜鲁门主义的出台有什么意义？它的实质是什么？（2）材料二反映了什么历史事件？这一事件对世界格局产生了什么影响？","answer":"答案：（1）意义：杜鲁门主义的出台，标志着美、苏战时同盟关系正式破裂，冷战开始。\n实质：杜鲁门主义的实质是美国要遏制共产主义，干涉别国内政，称霸世界。它是美国冷战政策在政治上的表现。\n（2）材料二反映了苏联解体这一历史事件。\n影响：苏联解体标志着冷战的结束，也标志着两极格局的终结。苏联解体后，美国成为唯一的超级大国，同时，欧盟、日本、中国和俄罗斯等一些具备较强综合实力的国家联盟或国家也在国际和地区事务中发挥着重要作用，推动世界朝着多极化方向发展。\n\n解析：杜鲁门主义的出台标志着冷战的开始，苏联解体标志着冷战的结束。冷战持续了40多年，深刻影响了战后世界的发展。苏联解体后，世界格局从两极格局向多极化方向发展。"},{"id":"g3_history_035_ex01","knowledge_id":"g3_history_035","question":"选择题：欧洲联盟（欧盟）正式成立的时间是？\nA. 1967年\nB. 1993年\nC. 1999年\nD. 2002年","answer":"答案：B\n解析：1993年，大部分西欧国家在欧共体的基础上组成了欧洲联盟，简称欧盟。1967年欧共体成立；1999年欧元正式启用；2002年欧元开始进入流通领域。欧盟的成立大大加快了欧洲一体化的进程。"},{"id":"g3_history_035_ex02","knowledge_id":"g3_history_035","question":"填空题：第二次世界大战后，西欧国家走向联合，1967年成立了_________，在此基础上，1993年成立了_________，大大加快了欧洲一体化的进程。","answer":"答案：欧洲共同体（或欧共体）、欧洲联盟（或欧盟）\n解析：第二次世界大战后，随着经济的发展，西欧国家之间的联系日益密切，逐渐走上了联合自强以提高国际地位的道路。20世纪50年代初，法国和联邦德国等六国组建欧洲煤钢共同体。1958年，六国又建立了欧洲经济共同体和欧洲原子能共同体。1967年，这三个组织合并为欧洲共同体，简称\"欧共体\"。1993年，大部分西欧国家在欧共体的基础上组成了欧洲联盟，简称\"欧盟\"，大大加快了欧洲一体化的进程。"},{"id":"g3_history_035_ex03","knowledge_id":"g3_history_035","question":"选择题：第二次世界大战后，日本经济迅速发展，成为资本主义世界仅次于美国的第二经济大国是在？\nA. 20世纪50年代中期\nB. 20世纪60年代末\nC. 1968年\nD. 20世纪70年代初","answer":"答案：C\n解析：第二次世界大战后，日本经济迅速发展。1968年，日本成为资本主义世界仅次于美国的第二经济大国。日本经济的迅速发展，既有外部因素，也有内部因素。外部因素主要是美国的扶持；内部因素主要包括日本政府制定适当的经济政策、大力引进先进技术、重视教育和人才培养等。"},{"id":"g3_history_035_ex04","knowledge_id":"g3_history_035","question":"简答题：请简述第二次世界大战后西欧经济恢复和发展的原因。\n要求：不少于100字","answer":"答案：第二次世界大战后西欧经济恢复和发展的原因主要有：\n（1）原有工业基础：西欧国家工业基础雄厚，技术力量强，劳动者素质高，这是战后经济恢复和发展的重要基础。\n（2）马歇尔计划的援助：第二次世界大战后，美国为了对付苏联，给予西欧资本主义国家大量援助，即马歇尔计划。马歇尔计划为西欧经济的恢复和发展提供了必要的资金和物资。\n（3）恰当的经济发展政策：西欧各国政府纷纷加强对经济的宏观调控，制定恰当的经济发展政策，促进了经济的恢复和发展。\n（4）第三次科技革命的推动：第三次科技革命的兴起，促进了生产力的发展，西欧国家充分利用第三次科技革命的成果，大力发展新兴工业，推动了经济的发展。\n（5）重视教育：西欧各国普遍重视教育，大力发展教育事业，培养了大批高素质的人才，为经济发展提供了人才保障。\n\n解析：第二次世界大战后，西欧国家经济迅速恢复和发展，是多种因素共同作用的结果。其中，既有外部的援助，也有内部的努力；既有历史的基础，也有现实的政策。"},{"id":"g3_history_035_ex05","knowledge_id":"g3_history_035","question":"材料分析题：阅读下列材料，回答问题。\n材料一：二战后，日本经济迅速发展。1968年，日本成为资本主义世界仅次于美国的第二经济大国。20世纪70年代以来，日本谋求政治大国的欲望也开始膨胀，军费支出不断增加，引起亚洲邻国的关注和不安。\n材料二：第二次世界大战后，为了缓和社会矛盾，主要资本主义国家纷纷调整政策，建立起社会保障制度。\n问题：（1）结合材料一和所学知识，分析二战后日本经济迅速发展的原因。（2）结合材料二和所学知识，谈谈你对西方社会保障制度的认识。","answer":"答案：（1）二战后日本经济迅速发展的原因：\n①外部因素：美国在日本推行非军事化和民主化改革，推动日本政府颁布了\"和平宪法\"；冷战开始后，美国出于本国的战略需要，开始扶持日本；朝鲜战争爆发后，日本获得了大量军需订单，刺激了日本经济的发展。\n②内部因素：日本政府制定适当的经济政策，大力引进先进技术；重视教育和人才培养，提高劳动者素质；实行\"贸易立国\"战略，积极开拓国际市场。\n（2）对西方社会保障制度的认识：\n①积极性：社会保障制度是工人阶级斗争的结果，资产阶级也认为实行这种制度，可以缓和阶级矛盾，创造一个有利于经济发展的稳定的社会环境。社会保障制度在一定程度上改善了人民生活，缓和了社会矛盾，对维护资本主义制度的稳定起到了一定的作用。\n②局限性：社会保障制度不能解决资本主义制度的基本矛盾，不能从根本上消除贫困和不平等。而且，社会保障制度的建立和完善也增加了政府的财政负担，20世纪70年代以后，随着经济\"滞胀\"现象的出现，西方主要资本主义国家的社会保障制度面临着新的挑战。\n\n解析：第二次世界大战后，主要资本主义国家的经济都得到了恢复和发展，资本主义制度也出现了一些新的变化，如欧洲的联合、日本的崛起、社会保障制度的建立等。这些变化对世界产生了深远的影响。"},{"id":"g3_history_035_ex06","knowledge_id":"g3_history_035","question":"选择题：下列关于二战后资本主义新变化的表述，不正确的是？\nA. 欧洲走向联合，成立了欧盟\nB. 日本崛起，成为资本主义世界第二经济大国\nC. 社会保障制度的建立，彻底消除了贫富差距\nD. 美国成为资本主义世界的霸主","answer":"答案：C\n解析：社会保障制度的建立，在一定程度上改善了人民生活，缓和了社会矛盾，但它不能解决资本主义制度的基本矛盾，不能从根本上消除贫富差距。因此C选项说法错误。A、B、D选项的说法都是正确的。"},{"id":"g3_history_035_ex07","knowledge_id":"g3_history_035","question":"填空题：第二次世界大战后，为了缓和社会矛盾，主要资本主义国家纷纷调整政策，建立起_________制度；20世纪六七十年代，西方主要资本主义国家的这一制度日渐_________。","answer":"答案：社会保障、完善\n解析：第二次世界大战后，为了缓和社会矛盾，主要资本主义国家纷纷调整政策，建立起社会保障制度。罗斯福新政期间，美国颁布了《社会保障法》，实行养老金制度、失业保险制度等。第二次世界大战后，为了缓和社会矛盾，主要资本主义国家纷纷调整政策，建立起社会保障制度。20世纪六七十年代，西方主要资本主义国家的社会保障制度日渐完善。"},{"id":"g3_history_035_ex08","knowledge_id":"g3_history_035","question":"判断题：\"第二次世界大战后，日本成为资本主义世界第二经济大国，标志着日本成为政治大国。\"这一说法是否正确？请说明理由。","answer":"答案：错误。\n理由：1968年，日本成为资本主义世界仅次于美国的第二经济大国，但这并不意味着日本成为了政治大国。随着经济的发展，日本的国际地位也得到提升，但日本还不是政治大国。20世纪70年代以来，日本谋求政治大国的欲望也开始膨胀，军费支出不断增加，引起亚洲邻国的关注和不安。日本要成为政治大国，还有很长的路要走。\n\n解析：第二次世界大战后，日本经济迅速发展，1968年成为资本主义世界第二经济大国。但经济大国并不等于政治大国。近年来，日本一直在谋求政治大国的地位，但由于历史等原因，日本的这一努力遭到了亚洲邻国的反对。"},{"id":"g3_history_035_ex09","knowledge_id":"g3_history_035","question":"简答题：第二次世界大战后资本主义的发展有哪些新变化？\n要求：不少于100字","answer":"答案：第二次世界大战后资本主义的发展出现了一些新变化，主要表现在：\n（1）欧洲走向联合：第二次世界大战后，西欧国家逐渐走上了联合自强的道路。从欧洲煤钢共同体到欧洲共同体，再到欧洲联盟，欧洲一体化的程度不断加深，大大加快了欧洲一体化的进程。\n（2）日本的崛起：第二次世界大战后，日本经济迅速恢复和发展，1968年成为资本主义世界仅次于美国的第二经济大国。随着经济的发展，日本的国际地位也得到提升。\n（3）社会保障制度的建立：第二次世界大战后，为了缓和社会矛盾，主要资本主义国家纷纷调整政策，建立起社会保障制度。20世纪六七十年代，西方主要资本主义国家的社会保障制度日渐完善。\n（4）美国成为资本主义世界的霸主：第二次世界大战后，美国成为世界上军事、经济实力最强大的国家，成为资本主义世界的霸主。\n（5）第三产业的发展和新经济的出现：第二次世界大战后，随着科技的进步和生产力的发展，主要资本主义国家的第三产业迅速发展，20世纪90年代美国出现了以全球化和信息化为特征的新经济。\n\n解析：第二次世界大战后，资本主义国家出现了一些新变化。这些变化是资本主义制度的自我调整，在一定程度上促进了生产力的发展，缓和了社会矛盾，但它没有改变资本主义的本质，也不能解决资本主义社会的基本矛盾。"},{"id":"g3_history_035_ex10","knowledge_id":"g3_history_035","question":"材料分析题：阅读下列材料，回答问题。\n材料一：1951年，法国、联邦德国、意大利、荷兰、比利时和卢森堡六国签订了《欧洲煤钢共同体条约》。1957年，六国又签订了《欧洲经济共同体条约》和《欧洲原子能共同体条约》。1967年，这三个组织合并为欧洲共同体。\n材料二：1993年，大部分西欧国家在欧共体的基础上组成了欧洲联盟。欧盟成员国公民有统一的欧洲护照，2002年，欧盟的大多数成员国开始使用统一的货币——欧元。\n问题：（1）结合材料一、二，说说欧洲走向联合的历程有什么特点？欧洲走向联合有什么意义？（2）欧洲走向联合给我们什么启示？","answer":"答案：（1）欧洲走向联合的历程特点：从经济一体化到政治、经济一体化，一体化的程度不断加深；从少数国家到多数国家，参与的国家越来越多；从单一领域到多个领域，合作的领域不断扩大。\n意义：欧洲走向联合，大大加快了欧洲一体化的进程，促进了欧洲经济的发展，提高了欧洲的国际地位，有利于欧洲的和平与稳定。同时，欧洲的联合也对世界格局产生了重要影响，推动了世界多极化趋势的发展。\n（2）启示：\n①和平与发展是时代主题，各国应加强合作，共同发展。\n②合作共赢，开放包容是时代潮流，各国应摒弃零和博弈，实现互利共赢。\n③区域经济一体化是当今世界经济发展的重要趋势，各国应积极参与区域合作，促进共同发展。\n④国家之间的合作应基于平等互利的原则，尊重各国的主权和利益。\n\n解析：欧洲走向联合是二战后欧洲发展的重要特征之一。欧洲的联合从经济一体化开始，逐渐向政治、经济一体化方向发展，一体化程度不断加深。欧洲的联合不仅促进了欧洲的发展，也对世界格局产生了深远影响。"},{"id":"g3_history_036_ex01","knowledge_id":"g3_history_036","question":"选择题：万隆会议（第一次亚非会议）召开的时间是？\nA. 1955年\nB. 1960年\nC. 1990年\nD. 1999年","answer":"答案：A\n解析：1955年，在印度尼西亚的万隆，亚洲、非洲29个国家和地区的代表举行了第一次亚非会议，也就是万隆会议。万隆会议提高了亚非国家和地区的民族自信，鼓舞了亚非拉人民争取民族独立的斗争。从万隆会议开始，发展中国家作为一支新兴独立的政治力量登上了国际舞台。"},{"id":"g3_history_036_ex02","knowledge_id":"g3_history_036","question":"填空题：被称为\"非洲年\"的是_________年，这一年非洲有_________个国家获得独立；标志着所有非洲国家都摆脱了殖民主义枷锁的事件是_________独立。","answer":"答案：1960、17、纳米比亚\n解析：1960年，非洲有17个国家获得独立，这一年因此被称为\"非洲年\"。1990年纳米比亚独立，标志着所有非洲国家都摆脱了殖民主义的枷锁。第二次世界大战后，民族解放运动空前高涨，席卷全球，殖民帝国纷纷瓦解，越来越多的亚洲和非洲国家取得独立。"},{"id":"g3_history_036_ex03","knowledge_id":"g3_history_036","question":"选择题：标志着所有非洲国家都摆脱了殖民主义枷锁的事件是？\nA. 埃及独立\nB. 纳米比亚独立\nC. 万隆会议召开\nD. 巴拿马收回运河主权","answer":"答案：B\n解析：1990年纳米比亚独立，标志着所有非洲国家都摆脱了殖民主义的枷锁，也标志着欧洲殖民者入侵和奴役非洲长达五个世纪历史的结束。A选项埃及独立是在1952年；C选项万隆会议是第一次亚非会议；D选项巴拿马收回运河主权是拉丁美洲捍卫国家主权的斗争。"},{"id":"g3_history_036_ex04","knowledge_id":"g3_history_036","question":"简答题：请简述万隆会议的历史意义。\n要求：不少于100字","answer":"答案：万隆会议的历史意义主要有：\n（1）万隆会议是历史上第一次没有西方殖民主义国家参加的亚非会议，它提高了亚非国家和地区的民族自信，鼓舞了亚非拉人民争取民族独立的斗争。\n（2）从万隆会议开始，发展中国家作为一支新兴独立的政治力量登上了国际舞台，在国际事务中发挥着越来越重要的作用。\n（3）万隆会议所体现的亚非国家和地区团结合作、友好相处，共同反对帝国主义和殖民主义，争取和巩固民族独立，保卫世界和平的精神，被称为\"万隆精神\"。万隆精神至今仍有重要的现实意义。\n（4）万隆会议加强了亚非国家的团结与合作，推动了亚非人民反帝反殖、争取和维护民族独立的斗争，促进了第三世界的崛起。\n\n解析：万隆会议是第一次亚非会议，它的召开具有重要的历史意义。万隆会议所体现的\"万隆精神\"，对亚非国家的团结与合作产生了深远的影响。"},{"id":"g3_history_036_ex05","knowledge_id":"g3_history_036","question":"材料分析题：阅读下列材料，回答问题。\n材料一：1960年，非洲有17个国家获得独立，这一年因此被称为\"非洲年\"。\n材料二：1990年3月，纳米比亚的独立标志着非洲民族解放运动历史使命的完成及欧洲殖民者入侵和奴役非洲历史的结束。\n问题：（1）结合材料一、二和所学知识，说说二战后非洲民族独立运动的特点。（2）二战后亚非拉国家的独立和振兴有什么历史意义？","answer":"答案：（1）二战后非洲民族独立运动的特点：\n①起步晚，但发展迅速，20世纪五六十年代，非洲先后有三十多个国家取得独立。\n②1960年被称为\"非洲年\"，这一年有17个国家获得独立。\n③1990年纳米比亚独立，标志着所有非洲国家都摆脱了殖民主义的枷锁，欧洲殖民者入侵和奴役非洲长达五个世纪的历史结束。\n（2）二战后亚非拉国家的独立和振兴的历史意义：\n①沉重打击了帝国主义和殖民主义，彻底瓦解了世界殖民体系。\n②亚非拉国家作为一支新兴独立的政治力量登上了国际舞台，在国际事务中发挥着越来越重要的作用，推动了世界格局向多极化方向发展。\n③亚非拉国家的独立和振兴，有利于维护世界和平与发展，有利于建立公正合理的国际政治经济新秩序。\n④鼓舞了世界被压迫民族和被压迫人民争取解放的斗争。\n\n解析：第二次世界大战后，民族解放运动空前高涨，席卷全球。殖民帝国纷纷瓦解，越来越多的亚洲和非洲国家取得独立。亚非拉国家的独立和振兴，对世界历史的发展产生了深远的影响。"},{"id":"g3_history_036_ex06","knowledge_id":"g3_history_036","question":"选择题：二战后，拉美人民捍卫国家主权的斗争中，走上社会主义道路的国家是？\nA. 阿根廷\nB. 巴西\nC. 古巴\nD. 巴拿马","answer":"答案：C\n解析：1959年，古巴通过武装斗争，推翻了美国支持的独裁政权，走上了社会主义发展道路。A、B选项阿根廷和巴西是拉美重要国家，但没有走上社会主义道路；D选项巴拿马人民经过长期斗争，在1999年底收回了巴拿马运河的全部主权，但没有走上社会主义道路。"},{"id":"g3_history_036_ex07","knowledge_id":"g3_history_036","question":"填空题：1959年，_________通过武装斗争，推翻了美国支持的独裁政权，走上了社会主义发展道路；1999年底，_________人民从美国手中收回了运河区的全部主权。","answer":"答案：古巴、巴拿马\n解析：1959年，古巴通过武装斗争，推翻了美国支持的独裁政权，走上了社会主义发展道路。古巴革命后，又挫败了美国支持的雇佣军入侵。20世纪六七十年代，巴拿马人民为从美国手中收回巴拿马运河的主权，展开了不断的斗争。1999年底，巴拿马人民从美国手中收回了运河区的全部主权。"},{"id":"g3_history_036_ex08","knowledge_id":"g3_history_036","question":"判断题：\"万隆会议是历史上第一次由亚非国家自己举行的国际会议，它标志着世界殖民体系的最终崩溃。\"这一说法是否正确？请说明理由。","answer":"答案：错误。\n理由：万隆会议是历史上第一次没有西方殖民主义国家参加的亚非会议，它提高了亚非国家和地区的民族自信，鼓舞了亚非拉人民争取民族独立的斗争，但它并不是世界殖民体系最终崩溃的标志。世界殖民体系最终崩溃的标志是1990年纳米比亚独立，标志着所有非洲国家都摆脱了殖民主义的枷锁，也标志着世界殖民体系的最终崩溃。\n\n解析：万隆会议和纳米比亚独立都具有重要的历史意义，但它们的历史地位不同。万隆会议是第一次亚非会议，标志着发展中国家作为一支新兴独立的政治力量登上了国际舞台；而纳米比亚独立则标志着世界殖民体系的最终崩溃。"},{"id":"g3_history_036_ex09","knowledge_id":"g3_history_036","question":"简答题：第二次世界大战后，亚非拉民族解放运动高涨的原因是什么？\n要求：不少于100字","answer":"答案：第二次世界大战后，亚非拉民族解放运动高涨的原因主要有：\n（1）二战的影响：第二次世界大战沉重打击了帝国主义势力，削弱了帝国主义国家的力量，为民族解放运动的发展创造了有利条件。\n（2）殖民地半殖民地人民的觉醒：第二次世界大战促进了殖民地半殖民地人民的觉醒，越来越多的人投入到民族解放斗争中来。\n（3）反法西斯战争胜利的鼓舞：世界反法西斯战争的胜利，为殖民地半殖民地人民的解放事业开辟了更加广阔的道路，鼓舞了被压迫民族的解放斗争。\n（4）亚非国家的团结与合作：万隆会议等国际会议的召开，加强了亚非国家的团结与合作，推动了民族解放运动的发展。\n（5）联合国的推动：联合国的成立和发展，也在一定程度上推动了民族解放运动的发展。\n\n解析：第二次世界大战后，民族解放运动空前高涨，席卷全球。殖民帝国纷纷瓦解，越来越多的亚洲、非洲和拉丁美洲国家取得独立。这是多种因素共同作用的结果，是历史发展的必然趋势。"},{"id":"g3_history_036_ex10","knowledge_id":"g3_history_036","question":"材料分析题：阅读下列材料，回答问题。\n材料一：1955年，在印度尼西亚的万隆，亚洲、非洲29个国家和地区的代表举行了第一次亚非会议。会议通过了和平相处、友好合作的十项原则。\n材料二：20世纪六七十年代，巴拿马人民为从美国手中收回巴拿马运河的主权，展开了不断的斗争。1977年，巴拿马与美国签订条约。1999年底，巴拿马收回了运河区的全部主权。\n问题：（1）材料一反映的是哪一历史事件？这一事件体现了什么精神？（2）结合材料二和所学知识，说说二战后拉丁美洲人民捍卫国家主权的斗争有哪些表现？","answer":"答案：（1）材料一反映的是万隆会议（第一次亚非会议）。\n万隆会议所体现的亚非国家和地区团结合作、友好相处，共同反对帝国主义和殖民主义，争取和巩固民族独立，保卫世界和平的精神，被称为\"万隆精神\"。\n（2）二战后拉丁美洲人民捍卫国家主权的斗争表现：\n①古巴革命：1959年，古巴通过武装斗争，推翻了美国支持的独裁政权，走上了社会主义发展道路。古巴革命后，又挫败了美国支持的雇佣军入侵。\n②巴拿马收回运河主权：20世纪六七十年代，巴拿马人民为从美国手中收回巴拿马运河的主权，展开了不断的斗争。1977年，巴拿马与美国签订条约。1999年底，巴拿马收回了运河区的全部主权。\n③拉美国家在经济上实行联合，推行各种经济改革，发展民族经济。\n\n解析：第二次世界大战后，拉丁美洲人民捍卫国家主权的斗争迅速发展。古巴革命和巴拿马收回运河主权是其中的典型代表。这些斗争维护了国家主权，促进了拉美国家的发展。"},{"id":"g3_history_037_ex01","knowledge_id":"g3_history_037","question":"选择题：联合国正式成立的时间是？\nA. 1945年10月\nB. 1945年6月\nC. 1995年1月\nD. 2001年12月","answer":"答案：A\n解析：1945年10月，联合国正式成立。1945年6月，50个国家的代表签署了《联合国宪章》。联合国是人类构建世界和平的成果，也是影响最大的国际组织。世界贸易组织是在1995年1月1日正式成立的。2001年12月，中国成为世界贸易组织的成员。"},{"id":"g3_history_037_ex02","knowledge_id":"g3_history_037","question":"填空题：世界贸易组织的前身是_________；世界贸易组织正式成立的时间是_________年1月1日；中国加入世界贸易组织的时间是_________年。","answer":"答案：关税及贸易总协定（或关贸总协定）、1995、2001\n解析：世界贸易组织的前身是关税及贸易总协定。1995年1月1日，世界贸易组织正式成立。世界贸易组织是当代最重要的国际经济组织之一，其宗旨是以非歧视性、开放、公平为原则，促进全球贸易和经济发展，保证就业、收入与需求的增长，提高人类的生活水平。2001年12月，中国成为世界贸易组织的成员。"},{"id":"g3_history_037_ex03","knowledge_id":"g3_history_037","question":"选择题：下列关于联合国的表述，不正确的是？\nA. 联合国是人类构建世界和平的成果\nB. 联合国是影响最大的国际组织\nC. 联合国的宗旨是维护国际和平与安全\nD. 联合国可以直接干涉各国的内政","answer":"答案：D\n解析：联合国是人类构建世界和平的成果，也是影响最大的国际组织。《联合国宪章》规定的联合国宗旨第一项是维持国际和平及安全。联合国在维护国际和平与安全方面发挥了积极作用，使许多国家和地区避免了一些可能发生的战争。但是联合国不能直接干涉各国的内政，它遵循不干涉任何国家内政的原则。因此D选项说法错误。"},{"id":"g3_history_037_ex04","knowledge_id":"g3_history_037","question":"简答题：请简述联合国的主要机构及其作用。\n要求：不少于100字","answer":"答案：联合国的主要机构有联合国大会、联合国安全理事会、联合国秘书处等。\n（1）联合国大会，简称\"联大\"，由全体会员国组成，每年举行一届大会。联合国大会是主要的审议、决策机构，拥有广泛职权。\n（2）联合国安全理事会，简称\"安理会\"，担负着维护国际和平与安全的主要责任。安理会由中国、法国、俄罗斯、英国、美国5个常任理事国和10个非常任理事国组成，常任理事国拥有否决权。\n（3）联合国秘书处是联合国的行政秘书事务机构，秘书长是联合国的最高行政首长。\n此外，联合国还设有经济及社会理事会、托管理事会、国际法院等机构。\n联合国在维护国际和平与安全方面发挥了积极作用，使许多国家和地区避免了一些可能发生的战争。同时，联合国在促进经济、社会、文化等领域的国际合作方面也发挥着重要作用。\n\n解析：联合国是人类构建世界和平的成果，也是影响最大的国际组织。它的主要机构各司其职，共同维护国际和平与安全，促进国际合作与发展。"},{"id":"g3_history_037_ex05","knowledge_id":"g3_history_037","question":"材料分析题：阅读下列材料，回答问题。\n材料一：世界贸易组织的前身是关税及贸易总协定。1995年1月1日，世界贸易组织正式成立。世界贸易组织的宗旨，是以非歧视性、开放、公平为原则，促进全球贸易和经济发展，保证就业、收入与需求的增长，提高人类的生活水平。\n材料二：2001年12月，中国成为世界贸易组织的成员。加入世界贸易组织，为我国参与经济全球化开辟了新途径，为国民经济和社会发展开拓了新空间。\n问题：（1）结合材料一和所学知识，说说世界贸易组织的职能主要有哪些？（2）结合材料二和所学知识，谈谈中国加入世界贸易组织有什么重要意义？","answer":"答案：（1）世界贸易组织的职能主要有：\n①制定和规范多边贸易协定，为国际贸易制定规则；\n②组织多边贸易谈判，促进贸易自由化；\n③解决贸易争端，协调各国贸易政策；\n④对发展中国家和最不发达国家提供技术援助及培训等。\n世界贸易组织成立后，其成员的关税水平普遍降低，贸易壁垒进一步减少，促进了全球贸易和世界经济的发展。\n（2）中国加入世界贸易组织的重要意义：\n①加入世界贸易组织，为我国参与经济全球化开辟了新途径，为国民经济和社会发展开拓了新空间。\n②加入世界贸易组织，有利于我国扩大出口，引进外资和先进技术，促进我国经济的发展。\n③加入世界贸易组织，有利于我国参与国际竞争，提高我国企业的竞争力。\n④加入世界贸易组织，有利于我国在国际经济舞台上发挥更大的作用，推动建立公正合理的国际经济新秩序。\n⑤加入世界贸易组织，也给中国的经济体制带来挑战，推动了中国经济体制改革的深化。\n\n解析：世界贸易组织是当代最重要的国际经济组织之一，它与联合国一起成为支撑、协调世界经济和政治的两大支柱，推动着世界的和平与发展。中国加入世界贸易组织，对中国和世界都产生了深远的影响。"},{"id":"g3_history_037_ex06","knowledge_id":"g3_history_037","question":"选择题：世界贸易组织的宗旨不包括？\nA. 非歧视性、开放、公平为原则\nB. 促进全球贸易和经济发展\nC. 提高人类的生活水平\nD. 维护国际和平与安全","answer":"答案：D\n解析：世界贸易组织的宗旨，是以非歧视性、开放、公平为原则，促进全球贸易和经济发展，保证就业、收入与需求的增长，提高人类的生活水平。维护国际和平与安全是联合国的宗旨，不是世界贸易组织的宗旨。因此D选项符合题意。"},{"id":"g3_history_037_ex07","knowledge_id":"g3_history_037","question":"填空题：联合国的主要机构有_________、_________、联合国秘书处等；其中，担负着维护国际和平与安全主要责任的是_________。","answer":"答案：联合国大会（或联大）、联合国安全理事会（或安理会）、联合国安全理事会（或安理会）\n解析：联合国的主要机构有联合国大会、联合国安全理事会、联合国秘书处等。联合国大会简称\"联大\"，由全体会员国组成，每年举行一届大会。联合国安全理事会，简称\"安理会\"，担负着维护国际和平与安全的主要责任。安理会由中国、法国、俄罗斯、英国、美国5个常任理事国和10个非常任理事国组成，常任理事国拥有否决权。联合国秘书处是联合国的行政秘书事务机构。"},{"id":"g3_history_037_ex08","knowledge_id":"g3_history_037","question":"判断题：\"世界贸易组织的成立，标志着世界殖民体系的最终崩溃。\"这一说法是否正确？请说明理由。","answer":"答案：错误。\n理由：世界贸易组织是当代最重要的国际经济组织之一，它的成立促进了全球贸易和世界经济的发展，与世界殖民体系的崩溃没有直接关系。世界殖民体系最终崩溃的标志是1990年纳米比亚独立，标志着所有非洲国家都摆脱了殖民主义的枷锁，也标志着世界殖民体系的最终崩溃。\n\n解析：世界贸易组织和联合国是支撑、协调当今世界经济和政治的两大支柱，它们在不同领域发挥着重要作用。世界贸易组织主要在经济领域发挥作用，促进全球贸易和经济发展；联合国主要在政治领域发挥作用，维护国际和平与安全。"},{"id":"g3_history_037_ex09","knowledge_id":"g3_history_037","question":"简答题：联合国和世界贸易组织在当今世界发挥着怎样的作用？\n要求：不少于100字","answer":"答案：联合国和世界贸易组织是支撑、协调当今世界政治和经济的两大支柱，它们在推动世界的和平与发展方面发挥着重要作用。\n（1）联合国的作用：\n①联合国在维护国际和平与安全方面发挥了积极作用，使许多国家和地区避免了一些可能发生的战争。联合国派遣维和部队，为缓和国际紧张局势和解决地区冲突作出了独特贡献。\n②联合国在促进国际经济、社会、文化等领域的合作方面发挥了重要作用，推动了全球发展。\n③联合国在制定国际规则、促进国际合作、解决全球性问题等方面也发挥着不可替代的作用。\n（2）世界贸易组织的作用：\n①世界贸易组织成立后，其成员的关税水平普遍降低，贸易壁垒进一步减少，促进了全球贸易和世界经济的发展。\n②世界贸易组织已经成为具有重大影响力的国际组织，它与联合国一起成为支撑、协调世界经济和政治的两大支柱，推动着世界的和平与发展。\n③世界贸易组织为国际贸易制定了一系列规则，规范了国际贸易秩序，为世界贸易的发展提供了制度保障。\n\n解析：联合国和世界贸易组织是当今世界最重要的两个国际组织，它们各司其职，共同推动着世界的和平与发展。联合国侧重于政治和安全领域，世界贸易组织侧重于经济和贸易领域。"},{"id":"g3_history_037_ex10","knowledge_id":"g3_history_037","question":"材料分析题：阅读下列材料，回答问题。\n材料一：1945年10月，联合国正式成立。联合国是人类构建世界和平的成果，也是影响最大的国际组织。\n材料二：世界贸易组织是当代最重要的国际经济组织之一，有\"经济联合国\"之称。1995年1月1日，世界贸易组织正式成立。\n问题：（1）联合国是在哪次会议上决定成立的？联合国的宗旨是什么？（2）世界贸易组织为什么被称为\"经济联合国\"？它与联合国是什么关系？","answer":"答案：（1）联合国是在雅尔塔会议上决定成立的。\n《联合国宪章》规定的联合国宗旨第一项是维持国际和平及安全；其次是发展国际间以尊重各国人民平等权利及自决原则为基础的友好关系；进行国际合作，以解决国际间经济、社会、文化和人道主义性质的问题，并促进对于全体人类的人权和基本自由的尊重；构成协调各国行动的中心，以达到上述共同目的。\n简单来说，联合国的宗旨就是维护国际和平与安全，促进国际合作与发展。\n（2）世界贸易组织被称为\"经济联合国\"，是因为它在世界经济贸易领域的影响很大，在国际贸易中发挥着重要的作用，就像联合国在国际政治领域的地位一样重要。\n世界贸易组织与联合国的关系：\n①它们都是当今世界最重要的国际组织，是支撑、协调当今世界经济和政治的两大支柱，推动着世界的和平与发展。\n②它们各司其职，联合国主要在政治、安全等领域发挥作用，世界贸易组织主要在经济、贸易领域发挥作用。\n③世界贸易组织是一个独立的国际组织，不是联合国的专门机构，但两者在很多方面有合作。\n\n解析：联合国和世界贸易组织是当今世界最重要的两个国际组织，它们在不同领域发挥着重要作用，共同推动着世界的和平与发展。"},{"id":"g3_history_038_ex01","knowledge_id":"g3_history_038","question":"选择题：下列不属于推动经济全球化趋势加强的因素是？\nA. 生产力和科技的迅速发展\nB. 跨国公司的推动\nC. 冷战结束后，国际形势趋于缓和\nD. 贸易保护主义的加强","answer":"答案：D\n解析：20世纪八九十年代以来，世界局势趋于缓和，和平与发展成为时代主题。各国把发展经济作为首要任务，生产力和科技水平有了新的提高。国家之间的经济联系日益紧密，世界经济全球化的趋势加强。推动经济全球化的因素主要有：生产力和科技的迅速发展（根本动力）、跨国公司的推动、冷战结束后国际形势趋于缓和、世界贸易组织的成立等。贸易保护主义的加强
