    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"id":"g3_history_001","chapter":"第一单元 古代亚非文明","name":"古埃及文明","formula":"尼罗河流域，约公元前3500年兴起","explanation":"古埃及文明发源于尼罗河流域，约公元前3500年出现奴隶制小国，公元前3100年左右实现初步统一。金字塔是古埃及文明的象征，反映了古埃及社会经济发展的较高水平，是古埃及人智慧的结晶。","semester":"upper"},{"id":"g3_history_002","chapter":"第一单元 古代亚非文明","name":"古代两河流域文明","formula":"幼发拉底河与底格里斯河，《汉谟拉比法典》","explanation":"古代两河流域文明又称美索不达米亚文明，发源于西亚的幼发拉底河和底格里斯河流域。古巴比伦王国国王汉谟拉比制定了《汉谟拉比法典》，是迄今已知世界上第一部较为完整的成文法典，是古巴比伦王国留给人类的宝贵文化遗产。","semester":"upper"},{"id":"g3_history_003","chapter":"第一单元 古代亚非文明","name":"古代印度文明","formula":"印度河流域，种姓制度，佛教创立","explanation":"古代印度文明最早出现于印度河流域，代表遗址有哈拉帕和摩亨佐·达罗。雅利安人入侵后建立种姓制度，将社会分为婆罗门、刹帝利、吠舍、首陀罗四个等级。佛教创立于公元前6世纪，创始人乔达摩·悉达多，提出众生平等，一度成为印度最重要的宗教之一。","semester":"upper"},{"id":"g3_history_004","chapter":"第二单元 古代欧洲文明","name":"古希腊文明","formula":"海洋文明，城邦民主政治","explanation":"古希腊文明是西方文明的源头，属于海洋文明。公元前8世纪出现城邦，雅典和斯巴达是最重要的城邦。雅典经过梭伦改革、伯里克利改革，奴隶制民主政治发展到高峰，公民大会是最高权力机构，但仅限于成年男性公民参与。","semester":"upper"},{"id":"g3_history_005","chapter":"第二单元 古代欧洲文明","name":"古罗马文明","formula":"从共和国到帝国，地跨欧亚非","explanation":"公元前509年罗马建立共和国，颁布《十二铜表法》，是罗马法制建设的第一步。公元前27年屋大维建立罗马帝国，2世纪罗马帝国进入黄金时期，帝国版图横跨欧、亚、非三洲，地中海成为其内湖。4世纪末罗马帝国分裂，476年西罗马帝国灭亡。","semester":"upper"},{"id":"g3_history_006","chapter":"第三单元 封建时代的欧洲","name":"西欧封建制度","formula":"封君封臣制，庄园经济","explanation":"8世纪前期法兰克王国对土地分封进行改革，形成封君封臣制度，以土地封赐为纽带，权利与义务交织，具有严格的等级性。庄园是西欧中世纪乡村的典型组织形式，是独立的自给自足的经济和政治单位，庄园土地分为领主自营地和佃户份地。","semester":"upper"},{"id":"g3_history_007","chapter":"第三单元 封建时代的欧洲","name":"中世纪城市和大学","formula":"城市自治，大学兴起","explanation":"从10世纪起，西欧城市重新兴起，市民阶级通过金钱赎买或武力斗争争取城市自由和自治。随着城市的发展和工商业的繁荣，市民阶级逐渐形成，富裕商人和银行家发展成早期资产阶级。12世纪大学兴起，被认为是欧洲中世纪教育最美好的花朵。","semester":"upper"},{"id":"g3_history_008","chapter":"第三单元 封建时代的欧洲","name":"拜占庭帝国","formula":"东罗马帝国，《查士丁尼法典》","explanation":"东罗马帝国定都君士坦丁堡（拜占庭），又称拜占庭帝国。查士丁尼一世统治时期，组织编纂《查士丁尼法典》《法学汇纂》《法理概要》《新法典》，统称《罗马民法大全》，奠定了欧洲民法的基础。1453年拜占庭帝国被奥斯曼帝国所灭。","semester":"upper"},{"id":"g3_history_009","chapter":"第四单元 封建时代的亚洲国家","name":"大化改新","formula":"646年，日本仿效唐朝制度改革","explanation":"646年，日本孝德天皇仿效唐朝的典章制度进行改革，史称大化改新。主要内容有：政治上建立以天皇为中心的中央集权制度；经济上土地收归国有，统一赋税。大化改新使日本发展成为一个中央集权制的封建国家。","semester":"upper"},{"id":"g3_history_010","chapter":"第四单元 封建时代的亚洲国家","name":"阿拉伯帝国","formula":"伊斯兰教创立，地跨欧亚非大帝国","explanation":"7世纪初穆罕默德在阿拉伯半岛创立伊斯兰教，622年建立穆斯林公社，阿拉伯国家雏形诞生。8世纪中期阿拉伯帝国形成，版图横跨亚、欧、非三大洲，是当时世界上疆域最大的帝国。阿拉伯人担当了沟通东西方文化的角色，为世界文化的发展作出了卓越贡献。","semester":"upper"},{"id":"g3_history_011","chapter":"第五单元 走向近代","name":"文艺复兴","formula":"14-16世纪，人文主义思潮","explanation":"14世纪中叶，文艺复兴在意大利兴起，核心思想是人文主义，要求建立以人为中心的生活哲学，提倡发扬人的个性。文艺复兴是一场反对教会神权至上和提倡人文主义的新文化运动，促进了人们思想的大解放，为欧洲资本主义社会的产生和发展奠定了思想文化基础。","semester":"upper"},{"id":"g3_history_012","chapter":"第五单元 走向近代","name":"新航路开辟","formula":"15-16世纪，世界开始连为一个整体","explanation":"1487年迪亚士到达好望角，1492年哥伦布发现美洲新大陆，1497年达·伽马到达印度，1519-1522年麦哲伦船队完成环球航行。新航路开辟以后，欧洲大西洋沿岸工商业经济繁荣起来，促进了资本主义的发展，世界开始连为一个整体，世界的观念也从此逐步确立起来。","semester":"upper"},{"id":"g3_history_013","chapter":"第五单元 走向近代","name":"早期殖民掠夺","formula":"三角贸易，资本原始积累","explanation":"新航路开辟后，葡萄牙和西班牙最早走上殖民掠夺道路，英国后来居上。三角贸易（黑奴贸易）为欧洲带来了巨额利润，加速了资本原始积累，有助于欧洲殖民国家的资本原始积累，但给殖民地人民带来了深重灾难，也客观上有助于世界市场逐渐形成。","semester":"upper"},{"id":"g3_history_014","chapter":"第六单元 资本主义制度的初步确立","name":"英国资产阶级革命","formula":"1640-1688年，君主立宪制确立","explanation":"1640年英国议会重新召开，标志着资产阶级革命开始。1688年光荣革命标志着革命结束。1689年议会通过《权利法案》，限制王权，确立了议会在国家政治生活中的最高地位，逐渐形成了君主立宪制，为资本主义发展扫清了道路。","semester":"upper"},{"id":"g3_history_015","chapter":"第六单元 资本主义制度的初步确立","name":"美国独立战争","formula":"1775-1783年，《独立宣言》","explanation":"1775年来克星顿的枪声标志着美国独立战争爆发。1776年7月4日大陆会议发表《独立宣言》，宣告北美13个殖民地脱离英国而独立，被称为第一个人权宣言。1787年美国宪法确立了三权分立原则，是世界上第一部资产阶级成文宪法。","semester":"upper"},{"id":"g3_history_016","chapter":"第六单元 资本主义制度的初步确立","name":"法国大革命","formula":"1789年开始，《人权宣言》","explanation":"1789年7月14日巴黎人民攻占巴士底狱，标志着法国大革命爆发。制宪议会通过《人权宣言》，宣告了人权、法治、自由、分权、平等和保护私有财产等基本原则。法国大革命摧毁了法国的君主统治，传播了资产阶级自由民主思想，具有世界性影响。","semester":"upper"},{"id":"g3_history_017","chapter":"第七单元 工业革命和国际共产主义运动的兴起","name":"第一次工业革命","formula":"18世纪60年代-19世纪中期，蒸汽时代","explanation":"第一次工业革命最早发生在英国的棉纺织业，哈格里夫斯发明珍妮机标志着工业革命开始。瓦特改良蒸汽机使人类进入蒸汽时代。1825年史蒂芬森设计的蒸汽机车试车成功，标志着铁路时代的开始。工业革命极大地提高了社会生产力水平，人类进入蒸汽时代。","semester":"upper"},{"id":"g3_history_018","chapter":"第七单元 工业革命和国际共产主义运动的兴起","name":"马克思主义诞生","formula":"1848年《共产党宣言》发表","explanation":"1848年，马克思、恩格斯为共产主义者同盟起草的纲领《共产党宣言》发表，标志着马克思主义的诞生。马克思主义主要包括马克思主义哲学、政治经济学和科学社会主义三个组成部分。从此，无产阶级的斗争有了科学理论的指导，国际共产主义运动兴起并蓬勃发展。","semester":"upper"},{"id":"g3_history_019","chapter":"第七单元 工业革命和国际共产主义运动的兴起","name":"巴黎公社","formula":"1871年，第一个无产阶级政权","explanation":"1871年3月巴黎无产阶级和人民群众举行武装起义，推翻了资产阶级反动统治，建立了世界上第一个无产阶级政权——巴黎公社。5月巴黎公社失败。巴黎公社是无产阶级建立政权的第一次伟大尝试，公社战士在强大敌人面前表现出的大无畏精神永远激励着后人。","semester":"upper"},{"id":"g3_history_020","chapter":"第六单元 资本主义制度的初步确立","name":"拿破仑帝国","formula":"1804-1815年，《拿破仑法典》","explanation":"1799年拿破仑发动雾月政变，1804年建立法兰西第一帝国。拿破仑主持制定了民法典，名为《拿破仑法典》，体现了自由平等和私有财产神圣不可侵犯等原则，后来很多国家的民法都以其为参照蓝本。拿破仑的对外战争传播了资产阶级自由民主思想，但也对当地人民进行了压榨和掠夺。","semester":"upper"},{"id":"g3_history_021","chapter":"第一单元 殖民地人民的反抗与资本主义制度的扩展","name":"拉丁美洲独立运动","formula":"19世纪初，玻利瓦尔和圣马丁领导","explanation":"19世纪初，受美国独立战争和法国大革命的影响，拉丁美洲掀起了一场反抗殖民统治、争取民族独立的运动。玻利瓦尔和圣马丁是运动的领导人，被誉为南美的解放者。运动摧毁了西班牙和葡萄牙在拉丁美洲的殖民统治，出现了一系列新兴独立国家，基本上形成了今天拉丁美洲的国家格局。","semester":"lower"},{"id":"g3_history_022","chapter":"第一单元 殖民地人民的反抗与资本主义制度的扩展","name":"印度民族大起义","formula":"1857-1859年，章西女王","explanation":"1857年印度爆发了一场反抗英国殖民统治的民族大起义，土兵是起义的核心力量。章西女王是起义中的杰出女英雄，她领导军民与英军展开激战，直到壮烈牺牲。起义沉重打击了英国殖民者，反映了印度民族意识的觉醒，是19世纪中期亚洲民族解放运动的一个重要组成部分。","semester":"lower"},{"id":"g3_history_023","chapter":"第一单元 殖民地人民的反抗与资本主义制度的扩展","name":"俄国农奴制改革","formula":"1861年，亚历山大二世改革","explanation":"1861年，俄国沙皇亚历山大二世颁布了废除农奴制的法令。法令规定：农奴获得人身自由，可以改变身份，自由转换职业；农奴在获得解放的同时，可以获得一份土地，但是必须出钱赎买。1861年改革是俄国历史上的一个重要转折点，推动了俄国走上了发展资本主义的道路。","semester":"lower"},{"id":"g3_history_024","chapter":"第一单元 殖民地人民的反抗与资本主义制度的扩展","name":"美国内战","formula":"1861-1865年，《解放黑人奴隶宣言》","explanation":"1861年美国内战爆发，又称南北战争，战争的导火线是林肯当选总统。1862年林肯政府颁布《宅地法》和《解放黑人奴隶宣言》，调动了农民和黑人奴隶的积极性，扭转了北方军队在战场上的被动局面。美国内战是美国历史上第二次资产阶级革命，维护了国家统一，废除了奴隶制度，清除了资本主义发展的最大障碍。","semester":"lower"},{"id":"g3_history_025","chapter":"第一单元 殖民地人民的反抗与资本主义制度的扩展","name":"日本明治维新","formula":"1868年开始，富国强兵、殖产兴业、文明开化","explanation":"1868年，日本明治政府开始实行一系列改革，史称明治维新。主要内容有：政治上废藩置县，加强中央集权；军事上实行征兵制，建立新式军队；经济上推行地税改革，以殖产兴业为口号，大力发展近代经济；社会生活上提倡文明开化，向西方学习。明治维新使日本迅速走上了发展资本主义的道路，实现了富国强兵。","semester":"lower"},{"id":"g3_history_026","chapter":"第二单元 第二次工业革命和近代科学文化","name":"第二次工业革命","formula":"19世纪六七十年代开始，电气时代","explanation":"19世纪六七十年代，第二次工业革命开始，最显著的成就是电力成为新的能源进入生产生活领域。美国发明家爱迪生发明了白炽灯泡、碱性蓄电池等。内燃机的发明解决了交通运输工具的发动机问题，汽车、飞机相继出现。第二次工业革命促进了生产力的发展，极大地改善了人们的生活，主要资本主义国家出现了垄断组织。","semester":"lower"},{"id":"g3_history_027","chapter":"第二单元 第二次工业革命和近代科学文化","name":"近代科学与文化","formula":"牛顿、达尔文、巴尔扎克、贝多芬","explanation":"英国科学家牛顿是近代自然科学的奠基人之一，著有《自然哲学的数学原理》，发现万有引力定律。英国科学家达尔文著有《物种起源》，提出了进化论的观点。法国作家巴尔扎克的《人间喜剧》再现了法国19世纪早期纷繁复杂的社会图景。德国音乐家贝多芬是一位资产阶级革命运动的热情歌颂者，代表作有《英雄交响曲》。","semester":"lower"},{"id":"g3_history_028","chapter":"第三单元 第一次世界大战和战后初期的世界","name":"第一次世界大战","formula":"1914-1918年，萨拉热窝事件","explanation":"1914年6月的萨拉热窝事件成为第一次世界大战的导火线。1914年7月奥匈帝国向塞尔维亚宣战，一战爆发。战争主要在欧洲战场进行，形成了东线、西线和南线三条战线。1916年的凡尔登战役有绞肉机、地狱、屠场之称。1918年11月德国投降，一战以同盟国的失败而结束。一战是西方列强为重新瓜分世界、争夺世界霸权而发动的一场帝国主义战争。","semester":"lower"},{"id":"g3_history_029","chapter":"第三单元 第一次世界大战和战后初期的世界","name":"十月革命","formula":"1917年，彼得格勒武装起义","explanation":"1917年11月6日晚，列宁秘密来到彼得格勒的起义总指挥部领导起义，11月7日彼得格勒武装起义取得胜利。这次革命因发生在俄历10月，被称为十月革命。十月革命是人类历史上第一次胜利的社会主义革命，建立了第一个无产阶级专政的国家，推动了国际无产阶级革命运动，鼓舞了殖民地半殖民地人民的解放斗争。","semester":"lower"},{"id":"g3_history_030","chapter":"第三单元 第一次世界大战和战后初期的世界","name":"凡尔赛-华盛顿体系","formula":"巴黎和会与华盛顿会议","explanation":"1919年巴黎和会召开，战胜的协约国集团与德国签订了《凡尔赛条约》。此后，协约国还分别与其他战败国签订了一系列和约，这些和约与《凡尔赛条约》一起构成了凡尔赛体系。1921-1922年华盛顿会议召开，调整和确立了战胜国在东亚和太平洋地区的关系。通过这两次会议，列强建立了凡尔赛-华盛顿体系。","semester":"lower"},{"id":"g3_history_031","chapter":"第四单元 经济大危机和第二次世界大战","name":"罗斯福新政","formula":"1933年开始，国家干预经济","explanation":"1929-1933年资本主义世界爆发了规模空前的经济大危机。1933年罗斯福就任美国总统，为了应付日益严峻的经济大危机，宣布实施新政，采用国家干预手段来扭转经济形势。主要内容有：整顿金融体系、加强对工业的计划指导、调整农业政策、推行以工代赈、建立社会保障制度等。新政增强了美国政府的宏观调控能力，恢复了美国人民的信心。","semester":"lower"},{"id":"g3_history_032","chapter":"第四单元 经济大危机和第二次世界大战","name":"法西斯国家的侵略扩张","formula":"意大利、德国、日本法西斯","explanation":"1922年墨索里尼在意大利建立了法西斯专政。1933年希特勒出任德国总理，开始掌握国家大权，建立了法西斯专政，第二次世界大战的欧洲战争策源地形成。1936年受军部控制的广田弘毅上台组阁，建立法西斯专政，第二次世界大战的亚洲战争策源地形成。德、意、日法西斯国家的大肆侵略，激起了世界各国人民的愤怒。","semester":"lower"},{"id":"g3_history_033","chapter":"第四单元 经济大危机和第二次世界大战","name":"第二次世界大战","formula":"1939-1945年，世界反法西斯联盟","explanation":"1939年9月1日德国突袭波兰，英、法对德宣战，第二次世界大战全面爆发。1941年6月德国进攻苏联，1941年12月日本偷袭珍珠港，二战达到最大规模。1942年《联合国家宣言》签署，标志着世界反法西斯联盟的正式形成。1945年9月2日，日本正式签署投降书，第二次世界大战结束。第二次世界大战的胜利，彻底粉碎了法西斯主义和军国主义通过战争称霸世界的野心。","semester":"lower"},{"id":"g3_history_034","chapter":"第五单元 二战后的世界变化","name":"冷战","formula":"1947-1991年，美苏对峙","explanation":"冷战是指第二次世界大战后的40多年间，以美、苏为首的两大集团之间既非战争又非和平的对峙与竞争状态。1947年杜鲁门主义的出台，标志着美、苏战时同盟关系正式破裂，冷战开始。1949年北约成立，1955年华约成立，两极格局形成。1991年苏联解体，冷战结束。","semester":"lower"},{"id":"g3_history_035","chapter":"第五单元 二战后的世界变化","name":"战后资本主义的新变化","formula":"欧洲联合、日本崛起、社会保障制度","explanation":"第二次世界大战后，西欧国家凭借原有的工业基础和马歇尔计划的援助，采用最先进的科学技术成果，制定恰当的经济发展政策，促进了经济的恢复和发展。1967年欧共体成立，1993年欧盟成立。战后日本经济迅速发展，1968年成为资本主义世界仅次于美国的第二经济大国。为了缓和社会矛盾，主要资本主义国家建立起社会保障制度。","semester":"lower"},{"id":"g3_history_036","chapter":"第五单元 二战后的世界变化","name":"亚非拉国家的新发展","formula":"万隆会议、非洲年、纳米比亚独立","explanation":"1955年万隆会议召开，提高了亚非国家和地区的民族自信，鼓舞了亚非拉人民争取民族独立的斗争。1960年非洲有17个国家获得独立，这一年因此被称为非洲年。1990年纳米比亚独立，标志着所有非洲国家都摆脱了殖民主义的枷锁。二战后，拉丁美洲人民捍卫国家主权的斗争迅速发展，古巴走上了社会主义道路，巴拿马收回了运河区的全部主权。","semester":"lower"},{"id":"g3_history_037","chapter":"第六单元 走向和平发展的世界","name":"联合国与世界贸易组织","formula":"国际合作的两大支柱","explanation":"1945年10月24日联合国正式成立，总部设在美国纽约。联合国是人类构建世界和平的成果，也是影响最大的国际组织。1995年1月1日世界贸易组织正式成立，其宗旨是以非歧视性、开放、公平为原则，促进全球贸易和经济发展。联合国和世界贸易组织成为支撑、协调世界政治和经济的两大支柱，推动着世界的和平与发展。","semester":"lower"},{"id":"g3_history_038","chapter":"第六单元 走向和平发展的世界","name":"经济全球化与世界多极化","formula":"时代发展的两大趋势","explanation":"20世纪八九十年代以来，世界局势趋于缓和，和平与发展成为时代主题。国家之间的经济联系日益紧密，世界经济全球化的趋势加强。苏联解体后，美国成为唯一的超级大国，欧盟、日本、中国和俄罗斯等一些具备较强综合实力的国家联盟或国家也在国际和地区事务中发挥着重要作用，推动世界朝着多极化方向发展。","semester":"lower"}];

        // ==================== 内嵌例题数据 ====================
        const DATA_EXAMPLES = [{"id":"g3_history_001_ex01","knowledge_id":"g3_history_001","question":"选择题：古埃及文明发源于哪条大河流域？（  ）\nA. 印度河流域\nB. 两河流域\nC. 尼罗河流域\nD. 黄河流域","answer":"答案：C\n解析：古埃及文明发源于尼罗河流域。尼罗河每年定期泛滥，为两岸带来肥沃的土壤，有利于农业生产，孕育了古埃及文明。古埃及被称为'尼罗河的赠礼'。"},{"id":"g3_history_001_ex02","knowledge_id":"g3_history_001","question":"填空题：古埃及文明大约在公元前______年出现奴隶制小国，公元前______年左右实现初步统一。","answer":"答案：3500；3100\n解析：约公元前3500年，尼罗河两岸陆续出现几十个奴隶制小国。公元前3100年左右，古埃及初步实现了统一，之后经历了古王国时代、中王国时代和新王国时代三个时代。"},{"id":"g3_history_001_ex03","knowledge_id":"g3_history_001","question":"选择题：古埃及文明的象征是什么？（  ）\nA. 空中花园\nB. 金字塔\nC. 长城\nD. 泰姬陵","answer":"答案：B\n解析：金字塔是古埃及文明的象征，反映了古埃及社会经济发展的较高水平，是古埃及人智慧的结晶。金字塔是古埃及国王法老的陵墓，因其形状类似汉字'金'而得名。"},{"id":"g3_history_001_ex04","knowledge_id":"g3_history_001","question":"简答题：为什么说古埃及文明是'尼罗河的赠礼'？","answer":"答案：\n1. 尼罗河每年定期泛滥，为两岸带来肥沃的土壤，有利于农业生产；\n2. 尼罗河为古埃及提供了充足的水源和便利的交通；\n3. 尼罗河的定期泛滥促使古埃及人发展天文学和数学，制定历法；\n4. 尼罗河两岸的农业发展为古埃及文明的产生和发展奠定了物质基础。\n解析：尼罗河是古埃及文明的发源地，它不仅为古埃及人提供了生存所需的水源和肥沃的土地，还推动了古埃及科学技术的发展。可以说，没有尼罗河就没有古埃及文明。"},{"id":"g3_history_001_ex05","knowledge_id":"g3_history_001","question":"材料分析题：阅读下列材料，回答问题。\n材料：'埃及是尼罗河的赠礼。'——古希腊历史学家希罗多德\n请回答：（1）这句话是什么意思？（2）尼罗河对古埃及文明有哪些贡献？","answer":"答案：\n（1）这句话的意思是古埃及文明是尼罗河孕育的，没有尼罗河就没有古埃及文明。\n（2）尼罗河对古埃及文明的贡献有：\n① 尼罗河每年定期泛滥，为两岸带来肥沃的土壤，有利于农业生产；\n② 尼罗河为古埃及提供了充足的水源和便利的水上交通；\n③ 尼罗河的定期泛滥促使古埃及人发展天文学，制定太阳历；\n④ 尼罗河的水利灌溉促进了古埃及统一国家的形成；\n⑤ 尼罗河两岸的农业发展为古埃及文明的繁荣奠定了物质基础。\n解析：希罗多德的这句话高度概括了尼罗河与古埃及文明的密切关系。尼罗河是古埃及的生命线，它不仅滋养了古埃及的农业，还推动了古埃及科技、文化和政治的发展。"},{"id":"g3_history_001_ex06","knowledge_id":"g3_history_001","question":"填空题：古埃及的国王称为______，金字塔是他们的______，其中最大的金字塔是______。","answer":"答案：法老；陵墓；胡夫金字塔\n解析：古埃及的国王称法老，法老作为全国最高的统治者，集军、政、财、神等大权于一身。金字塔是法老的陵墓，因形似汉字'金'而得名。胡夫金字塔是古埃及最大的金字塔，建于公元前2690年左右。"},{"id":"g3_history_001_ex07","knowledge_id":"g3_history_001","question":"选择题：下列哪一项不是古埃及文明的成就？（  ）\nA. 太阳历\nB. 象形文字\nC. 金字塔\nD. 种姓制度","answer":"答案：D\n解析：种姓制度是古代印度的文明成果，不是古埃及的。古埃及的文明成就包括：金字塔、太阳历、象形文字、木乃伊、数学等。古埃及人制定的太阳历是世界上最早的太阳历。"},{"id":"g3_history_001_ex08","knowledge_id":"g3_history_001","question":"简答题：金字塔反映了古埃及怎样的社会状况？","answer":"答案：\n1. 金字塔反映了古埃及国王法老的无限权力，法老能够驱使大量人力物力为自己修建陵墓；\n2. 金字塔反映了古埃及社会经济发展的较高水平，建造金字塔需要高超的建筑技术和雄厚的物质基础；\n3. 金字塔反映了古埃及人高超的建筑水平和数学、天文学成就，金字塔的精确程度令人惊叹；\n4. 金字塔反映了古埃及人的宗教信仰，他们相信灵魂不死，修建金字塔以保存尸体，等待灵魂归来。\n解析：金字塔不仅是古埃及文明的象征，也是研究古埃及历史的重要实物资料。它从多个方面反映了古埃及的政治、经济、文化和社会状况。"},{"id":"g3_history_001_ex09","knowledge_id":"g3_history_001","question":"选择题：古埃及初步实现统一是在什么时间？（  ）\nA. 约公元前3500年\nB. 公元前3100年左右\nC. 公元前2500年\nD. 公元前1500年","answer":"答案：B\n解析：约公元前3500年，尼罗河两岸陆续出现几十个奴隶制小国。公元前3100年左右，古埃及初步实现了统一。之后古埃及经历了古王国时代、中王国时代和新王国时代三个时代，在新王国时代法老图特摩斯三世统治时期，古埃及成为强大的军事帝国。"},{"id":"g3_history_001_ex10","knowledge_id":"g3_history_001","question":"材料分析题：阅读下列材料，回答问题。\n材料：金字塔建筑群分布在尼罗河下游西岸的吉萨一带，大小共约80座，是古埃及法老们的陵墓。最大的是胡夫金字塔，高约146.5米，底边长约230米，用了约230万块巨石，平均每块重约2.5吨。\n请回答：（1）金字塔是用来做什么的？（2）金字塔的修建说明了什么？","answer":"答案：\n（1）金字塔是古埃及国王法老的陵墓，古埃及人相信灵魂不死，修建金字塔以保存法老的尸体，等待灵魂归来。\n（2）金字塔的修建说明了：\n① 古埃及法老拥有至高无上的权力，能够调动大量人力物力；\n② 古埃及社会经济发展水平较高，有能力建造如此宏伟的建筑；\n③ 古埃及人具有高超的建筑技术和数学、天文学知识，金字塔的精确程度令人惊叹；\n④ 古埃及人有强烈的宗教信仰，相信来世和灵魂不死；\n⑤ 金字塔是古埃及劳动人民智慧和血汗的结晶，也反映了奴隶主对奴隶的残酷剥削。\n解析：金字塔是古埃及文明的象征，它不仅是古埃及人智慧的结晶，也反映了古埃及的政治、经济和文化状况。金字塔的建造需要大量的人力物力，体现了法老的权威和古埃及的国力。"},{"id":"g3_history_002_ex01","knowledge_id":"g3_history_002","question":"选择题：古代两河流域文明发源于哪两条河流？（  ）\nA. 尼罗河和刚果河\nB. 印度河和恒河\nC. 幼发拉底河和底格里斯河\nD. 长江和黄河","answer":"答案：C\n解析：古代两河流域文明又称美索不达米亚文明，发源于西亚的幼发拉底河和底格里斯河流域。两河流域是人类文明的重要发祥地之一，这里土地肥沃，水源充足，孕育了灿烂的古代文明。"},{"id":"g3_history_002_ex02","knowledge_id":"g3_history_002","question":"填空题：《汉谟拉比法典》是迄今已知世界上第一部较为完整的______法典，是______王国留给人类的宝贵文化遗产。","answer":"答案：成文；古巴比伦\n解析：《汉谟拉比法典》是古巴比伦王国国王汉谟拉比制定的，是迄今已知世界上第一部较为完整的成文法典。法典刻在一块黑色石柱上，正文共有282条，内容十分广泛，从中可以了解古巴比伦社会。"},{"id":"g3_history_002_ex03","knowledge_id":"g3_history_002","question":"选择题：《汉谟拉比法典》是哪个国家的文明成果？（  ）\nA. 古埃及\nB. 古巴比伦\nC. 古印度\nD. 古希腊","answer":"答案：B\n解析：《汉谟拉比法典》是古巴比伦王国的文明成果。古巴比伦王国原是幼发拉底河中游的一个小国，公元前18世纪，第六代国王汉谟拉比在位时，对外采取各个击破的策略，完成了两河流域中下游地区的统一事业，建立了统一、强大的奴隶制国家。"},{"id":"g3_history_002_ex04","knowledge_id":"g3_history_002","question":"简答题：《汉谟拉比法典》有何历史地位和意义？","answer":"答案：\n1. 《汉谟拉比法典》是迄今已知世界上第一部较为完整的成文法典；\n2. 法典内容十分广泛，从中可以清晰地了解古巴比伦社会；\n3. 法典表明人类社会的法制传统源远流长；\n4. 法典是古巴比伦王国留给人类的宝贵文化遗产；\n5. 法典维护奴隶主阶级的利益，是古巴比伦王国奴隶制的真实写照。\n解析：《汉谟拉比法典》是古巴比伦王国国王汉谟拉比为了加强统治而制定的，它刻在一块黑色石柱上，正文共有282条。法典内容十分广泛，包括诉讼程序、财产、婚姻、继承、奴隶等方面，是研究古巴比伦社会的重要史料。"},{"id":"g3_history_002_ex05","knowledge_id":"g3_history_002","question":"材料分析题：阅读下列材料，回答问题。\n材料：法典正文共有282条，刻在一块黑色石柱上。法典规定：奴隶可以买卖，可用来抵债；如果奴隶胆敢对主人说'你不是我的主人'，他的耳朵就要被割掉；如果理发师不经奴隶主许可，就把不属于他的奴隶头上的奴隶标记剃掉，理发师的手就要被砍掉。\n请回答：（1）上述材料出自哪部法典？（2）这部法典维护的是哪个阶级的利益？（3）这部法典有何历史地位？","answer":"答案：\n（1）上述材料出自《汉谟拉比法典》。\n（2）这部法典维护的是奴隶主阶级的利益，法典严格保护奴隶主对奴隶的所有权。\n（3）历史地位：《汉谟拉比法典》是迄今已知世界上第一部较为完整的成文法典，是古巴比伦王国留给人类的宝贵文化遗产，表明人类社会的法制传统源远流长。\n解析：从材料中可以看出，法典对奴隶的处罚非常残酷，而对奴隶主的利益则严加保护，这充分说明了法典的阶级本质——维护奴隶主阶级的利益。《汉谟拉比法典》是研究古巴比伦社会的重要史料。"},{"id":"g3_history_002_ex06","knowledge_id":"g3_history_002","question":"填空题：古代两河流域文明又称______文明，大体是以今天伊拉克首都______为中心的狭长地带。","answer":"答案：美索不达米亚；巴格达\n解析：古代两河流域文明又称美索不达米亚文明，美索不达米亚是希腊语，意思是'两河之间的地方'。两河流域大体是以今天伊拉克首都巴格达为中心的狭长地带，这里土地肥沃，水源充足，是人类文明的重要发祥地之一。"},{"id":"g3_history_002_ex07","knowledge_id":"g3_history_002","question":"选择题：下列哪一项是两河流域文明的成果？（  ）\nA. 金字塔\nB. 象形文字\nC. 《汉谟拉比法典》\nD. 种姓制度","answer":"答案：C\n解析：《汉谟拉比法典》是两河流域古巴比伦王国的文明成果。金字塔和象形文字是古埃及的文明成果，种姓制度是古印度的文明成果。两河流域的文明成果还包括楔形文字、阴历、60进位制等。"},{"id":"g3_history_002_ex08","knowledge_id":"g3_history_002","question":"简答题：简述汉谟拉比的主要贡献。","answer":"答案：\n1. 汉谟拉比是古巴比伦王国的第六代国王，他完成了两河流域中下游地区的统一事业，建立了统一、强大的奴隶制国家；\n2. 他实行君主专制制度，加强中央集权，使古巴比伦王国达到鼎盛；\n3. 他制定了《汉谟拉比法典》，这是迄今已知世界上第一部较为完整的成文法典，是古巴比伦王国留给人类的宝贵文化遗产；\n4. 他在位时期，古巴比伦王国的经济和文化都有了较大发展。\n解析：汉谟拉比是古巴比伦王国杰出的国王，他不仅完成了两河流域的统一，建立了中央集权的奴隶制国家，还制定了著名的《汉谟拉比法典》。这部法典是研究古代两河流域历史的重要资料。"},{"id":"g3_history_002_ex09","knowledge_id":"g3_history_002","question":"选择题：两河流域文明中，人们发明的文字是（  ）\nA. 象形文字\nB. 楔形文字\nC. 甲骨文\nD. 字母文字","answer":"答案：B\n解析：两河流域的苏美尔人很早就发明了文字，他们通常用削成三角形尖头的芦秆或木棒做笔，在未干的软泥板上压出字迹，这些笔画的形状很像楔子，因此被称为楔形文字。楔形文字后来流传到亚洲西部的许多地方，被西亚古代各民族所采用，为人类文明的发展作出了重大贡献。"},{"id":"g3_history_002_ex10","knowledge_id":"g3_history_002","question":"材料分析题：阅读下列材料，回答问题。\n材料：美索不达米亚平原上的苏美尔人不仅发明了楔形文字，还根据月亮的盈亏变化制定了阴历，一年354天，并设置闰月来调整阴历和阳历之间的天数差距。两河流域的人还发明了60进位制。\n请回答：（1）材料中的'美索不达米亚'是什么意思？（2）两河流域文明有哪些主要成就？（3）这些成就说明了什么？","answer":"答案：\n（1）美索不达米亚是希腊语，意思是'两河之间的地方'，指的是幼发拉底河和底格里斯河流域。\n（2）两河流域文明的主要成就有：楔形文字、阴历、60进位制、《汉谟拉比法典》等。\n（3）这些成就说明了两河流域文明的高度发达，是人类文明的重要发祥地之一。苏美尔人发明的楔形文字是世界上最古老的文字之一，60进位制至今仍在使用，《汉谟拉比法典》是世界上第一部较为完整的成文法典。\n解析：两河流域是人类文明的摇篮之一，这里诞生了世界上最古老的文明之一。苏美尔人的发明创造对后世产生了深远影响，特别是楔形文字和60进位制，至今仍在某些领域使用。"},{"id":"g3_history_003_ex01","knowledge_id":"g3_history_003","question":"选择题：古代印度文明最早出现在哪条河流域？（  ）\nA. 恒河流域\nB. 印度河流域\nC. 尼罗河流域\nD. 两河流域","answer":"答案：B\n解析：古代印度文明最早出现于印度河流域，代表遗址有哈拉帕和摩亨佐·达罗。这些早期文明遗址的年代大约为公元前23世纪—前18世纪，它们的发现证明了印度河流域是古代文明的重要发祥地之一。"},{"id":"g3_history_003_ex02","knowledge_id":"g3_history_003","question":"填空题：雅利安人入侵印度后建立了______制度，将社会分为______、______、______、______四个等级。","answer":"答案：种姓；婆罗门；刹帝利；吠舍；首陀罗\n解析：雅利安人进入印度后，逐渐建立了严格的社会等级制度，史称'种姓制度'。在这一制度中，第一等级是婆罗门，掌管祭祀；第二等级是刹帝利，掌管军事和行政权力；第三等级是吠舍，从事农业、畜牧业和商业；第四等级是首陀罗，主要由被征服居民构成，从事农业、畜牧业、捕鱼业和手工业，要为前三个等级服务。"},{"id":"g3_history_003_ex03","knowledge_id":"g3_history_003","question":"选择题：佛教的创始人是谁？（  ）\nA. 耶稣\nB. 穆罕默德\nC. 乔达摩·悉达多\nD. 老子","answer":"答案：C\n解析：佛教创立于公元前6世纪，创始人乔达摩·悉达多，后来被称为'释迦牟尼'。佛教提出'众生平等'，不拒绝低种姓的人入教，同时，由于佛教宣扬'忍耐顺从'，得到国王和一些富人的支持，一度成为印度最重要的宗教之一。"},{"id":"g3_history_003_ex04","knowledge_id":"g3_history_003","question":"简答题：简述种姓制度的特点和影响。","answer":"答案：\n特点：\n1. 种姓制度下的各等级世代相袭；\n2. 各等级之间贵贱分明，低等级的人不得从事高等级的人的职业；\n3. 不同等级的人不得通婚。\n影响：\n1. 种姓制度激化了当时的社会矛盾，并对后来印度社会的发展带来了不良影响；\n2. 它严重阻碍了印度社会的进步和发展；\n3. 种姓制度的影响至今在印度社会仍然存在。\n解析：种姓制度是雅利安人进入印度后逐渐建立的严格的社会等级制度。这一制度将人分为四个等级，各等级之间界限森严，严重影响了印度社会的发展。佛教就是在反对种姓制度的背景下产生的。"},{"id":"g3_history_003_ex05","knowledge_id":"g3_history_003","question":"材料分析题：阅读下列材料，回答问题。\n材料：'造物神梵天用自己的嘴创造出婆罗门，用手创造出刹帝利，用腿创造出吠舍，用脚创造出首陀罗。'\n请回答：（1）上述材料反映的是古代哪个国家的什么制度？（2）这一制度将社会分为哪几个等级？（3）这一制度有何特点？","answer":"答案：\n（1）上述材料反映的是古代印度的种姓制度。\n（2）种姓制度将社会分为四个等级：第一等级婆罗门，掌管祭祀；第二等级刹帝利，掌管军事和行政权力；第三等级吠舍，从事农业、畜牧业和商业；第四等级首陀罗，主要由被征服居民构成，从事农业、畜牧业、捕鱼业和手工业，要为前三个等级服务。\n（3）特点：各等级世代相袭，各等级之间贵贱分明，低等级的人不得从事高等级的人的职业，不同等级的人不得通婚。\n解析：种姓制度是古代印度社会的重要特征，它以神的名义将人分为高低贵贱不同的等级，这一制度对印度社会产生了深远影响。材料中用神的创造来解释种姓制度的合理性，目的是维护奴隶主阶级的统治。"},{"id":"g3_history_003_ex06","knowledge_id":"g3_history_003","question":"填空题：佛教创立于公元前______世纪，创始人是______，后来被称为______。佛教提出______，一度成为印度最重要的宗教之一。","answer":"答案：6；乔达摩·悉达多；释迦牟尼；众生平等\n解析：佛教创立于公元前6世纪的古代印度，创始人是乔达摩·悉达多，后来被称为'释迦牟尼'。佛教反对婆罗门的特权，提出'众生平等'，不拒绝低种姓的人入教。佛教宣扬'忍耐顺从'，得到国王和一些富人的支持，一度成为印度最重要的宗教之一。"},{"id":"g3_history_003_ex07","knowledge_id":"g3_history_003","question":"选择题：在古代印度种姓制度中，掌管军事和行政权力的是（  ）\nA. 婆罗门\nB. 刹帝利\nC. 吠舍\nD. 首陀罗","answer":"答案：B\n解析：在种姓制度中，第二等级是刹帝利，掌管军事和行政权力。第一等级婆罗门掌管祭祀；第三等级吠舍从事农业、畜牧业和商业；第四等级首陀罗主要由被征服居民构成，从事农业、畜牧业、捕鱼业和手工业，要为前三个等级服务。"},{"id":"g3_history_003_ex08","knowledge_id":"g3_history_003","question":"简答题：佛教为什么能够迅速传播和发展？","answer":"答案：\n1. 佛教反对婆罗门的特权，提出'众生平等'，不拒绝低种姓的人入教，得到了广大人民群众的支持；\n2. 佛教宣扬'忍耐顺从'，主张消灭欲望，刻苦修行，得到国王和一些富人的支持；\n3. 佛教反对种姓制度，适应了当时社会发展的需要；\n4. 佛教教义通俗易懂，适合各阶层人们的需要；\n5. 阿育王在位时，大力推广佛教，派僧侣向外传教，促进了佛教的传播。\n解析：佛教诞生于公元前6世纪的古代印度，是世界三大宗教之一。佛教能够迅速传播和发展，既有其教义本身的原因，也有社会历史原因。佛教的'众生平等'思想对反对种姓制度有积极意义，而'忍耐顺从'的教义又有利于维护统治阶级的利益。"},{"id":"g3_history_003_ex09","knowledge_id":"g3_history_003","question":"选择题：古代印度文明的早期代表遗址是（  ）\nA. 哈拉帕和摩亨佐·达罗\nB. 克诺索斯王宫\nC. 金字塔\nD. 空中花园","answer":"答案：A\n解析：古代印度文明最早出现于印度河流域，代表遗址有哈拉帕和摩亨佐·达罗。这些遗址的年代大约为公元前23世纪—前18世纪，它们的发现证明了印度河流域是古代文明的重要发祥地之一。克诺索斯王宫是克里特文明的遗址，金字塔是古埃及文明的象征，空中花园是古巴比伦文明的代表。"},{"id":"g3_history_003_ex10","knowledge_id":"g3_history_003","question":"材料分析题：阅读下列材料，回答问题。\n材料：'当时婆罗门教宣传婆罗门种姓至上，说梵天用口造婆罗门，用手造刹帝利，用腿造吠舍，用脚造首陀罗，并说造物神为了各个等级的幸福，让他们各守本分。佛教反对婆罗门的特权地位，但不反对奴隶制度，只要求人们忍耐服从。'\n请回答：（1）佛教是什么时候由谁创立的？（2）佛教为什么要反对婆罗门的特权地位？（3）佛教的基本教义是什么？","answer":"答案：\n（1）佛教创立于公元前6世纪，创始人是乔达摩·悉达多，后来被称为释迦牟尼。\n（2）因为婆罗门教宣传种姓制度，将人分为高低贵贱不同的等级，婆罗门享有特权，而其他等级尤其是低种姓的人深受压迫，社会矛盾尖锐。佛教反对婆罗门的特权，提出'众生平等'，适应了人民群众的需要。\n（3）佛教的基本教义包括：提出'众生平等'，反对婆罗门的特权；宣扬'忍耐顺从'，主张消灭欲望，刻苦修行；认为人生是苦的，只有信佛修行，才能脱离苦海，达到'涅槃'的境界。\n解析：佛教是在反对婆罗门教和种姓制度的背景下产生的。它的'众生平等'思想具有进步意义，但'忍耐顺从'的教义又有其局限性，容易被统治阶级利用。佛教后来发展成为世界三大宗教之一，对世界文化产生了深远影响。"},{"id":"g3_history_004_ex01","knowledge_id":"g3_history_004","question":"选择题：古希腊文明属于什么类型的文明？（  ）\nA. 大河文明\nB. 海洋文明\nC. 草原文明\nD. 山地文明","answer":"答案：B\n解析：古希腊文明是西方文明的源头，属于海洋文明。古希腊半岛是西方文明的发源地，地理环境呈现环海、多山、多岛屿的特点，这造就了古希腊人积极进取、善于求索的民族精神，也促进了古希腊海外贸易和殖民活动的发展。"},{"id":"g3_history_004_ex02","knowledge_id":"g3_history_004","question":"填空题：古希腊最重要的两个城邦是______和______。雅典经过______改革、______改革，奴隶制民主政治发展到高峰。","answer":"答案：雅典；斯巴达；梭伦；伯里克利\n解析：公元前8世纪，希腊出现了城邦，雅典和斯巴达是最重要的城邦。雅典经过梭伦改革、克利斯提尼改革，到伯里克利改革时期，奴隶制民主政治发展到高峰。伯里克利扩大了公民的权利，公职人员几乎都是从全体公民中抽签产生，使每一名公民都有参政的机会。"},{"id":"g3_history_004_ex03","knowledge_id":"g3_history_004","question":"选择题：雅典奴隶制民主政治发展到高峰是在谁统治时期？（  ）\nA. 梭伦\nB. 克利斯提尼\nC. 伯里克利\nD. 亚历山大","answer":"答案：C\n解析：公元前5世纪中后期伯里克利主政时期，雅典达到全盛，奴隶制民主政治发展到高峰。伯里克利扩大了公民的权利，公职人员几乎都是从全体公民中抽签产生，使每一名公民都有参政的机会。公民大会是最高权力机构，具有立法、司法等多种职能。"},{"id":"g3_history_004_ex04","knowledge_id":"g3_history_004","question":"简答题：如何评价雅典的奴隶制民主政治？","answer":"答案：\n进步性：\n1. 雅典的奴隶制民主政治是古代希腊城邦社会中先进的政治制度，它有利于调动城邦公民的积极性和创造性；\n2. 它有利于推动社会经济和文化的进步；\n3. 它为近现代西方政治制度奠定了最初的基础。\n局限性：\n1. 雅典的民主政治仅限于成年男性公民，妇女、外邦人和奴隶都被排除在外；\n2. 它是建立在奴隶制基础之上的，是少数人的民主；\n3. 直接民主容易导致权力的滥用和误用。\n解析：雅典的奴隶制民主政治是古代世界民主政治的典范，它对后世产生了深远影响。但我们也要认识到，雅典的民主政治有其时代局限性，它是建立在奴隶制基础之上的，享有民主权利的只是少数成年男性公民。"},{"id":"g3_history_004_ex05","knowledge_id":"g3_history_004","question":"材料分析题：阅读下列材料，回答问题。\n材料：'我们的制度之所以被称为民主政治，因为政权是在全体公民手中，而不是在少数人手中。解决私人争执的时候，每个人在法律上都是平等的；让一个人负担公职优先于他人的时候，所考虑的不是某一个特殊阶级的成员，而是他们有的真正才能。'\n——伯里克利《在阵亡将士葬礼上的演说》\n请回答：（1）材料中的'民主政治'指的是哪个城邦的民主政治？（2）其最高权力机构是什么？（3）你如何评价这种民主政治？","answer":"答案：\n（1）材料中的'民主政治'指的是雅典的奴隶制民主政治。\n（2）其最高权力机构是公民大会，具有立法、司法等多种职能。\n（3）评价：\n进步性：雅典的奴隶制民主政治是古代希腊城邦社会中先进的政治制度，它有利于调动城邦公民的积极性和创造性，有利于推动社会经济和文化的进步，为近现代西方政治制度奠定了最初的基础。\n局限性：雅典的民主政治仅限于成年男性公民，妇女、外邦人和奴隶都被排除在外；它是建立在奴隶制基础之上的，是少数人的民主；直接民主容易导致权力的滥用和误用。\n解析：伯里克利统治时期是雅典民主政治的'黄金时代'。这段演说词反映了雅典民主政治的特点——主权在民、法律面前人人平等、任人唯贤。但我们要全面客观地评价雅典民主政治，既要看到它的进步性，也要认识到它的阶级局限性和时代局限性。"},{"id":"g3_history_004_ex06","knowledge_id":"g3_history_004","question":"填空题：雅典民主政治中，______是最高权力机构，具有立法、司法等多种职能。为了保证贫穷公民参政议政，伯里克利还建立了______制度。","answer":"答案：公民大会；津贴\n解析：公民大会是雅典的最高权力机构，具有立法、司法等多种职能。为了保证贫穷公民参政议政，伯里克利建立了津贴制度，为担任公职和参与政治活动的公民发放工资和津贴，这一措施保障了公民的参政权利，促进了雅典民主政治的发展。"},{"id":"g3_history_004_ex07","knowledge_id":"g3_history_004","question":"选择题：下列关于雅典民主政治的说法，错误的是（  ）\nA. 公民大会是最高权力机构\nB. 所有雅典人都享有民主权利\nC. 伯里克利时期达到顶峰\nD. 公职人员几乎都是从全体公民中抽签产生","answer":"答案：B\n解析：B选项错误，因为雅典的民主政治仅限于成年男性公民，妇女、外邦人和奴隶都被排除在外，不是所有雅典人都享有民主权利。A、C、D选项的说法都是正确的，公民大会是最高权力机构，伯里克利时期雅典民主政治达到顶峰，公职人员几乎都是从全体公民中抽签产生。"},{"id":"g3_history_004_ex08","knowledge_id":"g3_history_004","question":"简答题：古希腊城邦的特点是什么？","answer":"答案：\n1. 小国寡民是古希腊城邦的突出特点，各城邦面积狭小，人口不多，一般以城市为中心，包括周边若干村落；\n2. 各城邦独立自治，城邦之间地位平等，互不统属；\n3. 城邦的政治制度多样，主要有民主制、贵族制、君主制等，其中雅典的民主制最为典型；\n4. 城邦的公民是城邦政治生活的主体，公民有较多的参政机会；\n5. 城邦的商品经济比较发达，海外贸易活跃。\n解析：公元前8世纪，希腊出现了城邦。小国寡民是古希腊城邦的突出特点，这一特点使得公民能够直接参与城邦政治生活，也促进了古希腊民主政治的发展。各城邦独立自治，但在文化上又保持着共同的文化传统。"},{"id":"g3_history_004_ex09","knowledge_id":"g3_history_004","question":"选择题：古希腊文明的发源地是（  ）\nA. 意大利半岛\nB. 希腊半岛\nC. 伊比利亚半岛\nD. 小亚细亚半岛","answer":"答案：B\n解析：古希腊半岛是西方文明的发源地，古希腊文明最早产生于爱琴海地区。希腊半岛地理环境呈现环海、多山、多岛屿的特点，这对古希腊文明的发展产生了深远影响，使古希腊形成了海洋文明的特征。"},{"id":"g3_history_004_ex10","knowledge_id":"g3_history_004","question":"材料分析题：阅读下列材料，回答问题。\n材料：雅典民主政治中，公职人员几乎都是从全体公民中抽签产生，使每一名公民都有参政的机会。代表各地的10个主席团轮流主持城邦日常事务，召集公民大会。这些主席团由各地抽签产生，主席团主席也经抽签产生。\n请回答：（1）材料反映了雅典民主政治的什么特点？（2）雅典民主政治的最高权力机构是什么？（3）谁执政时期雅典民主政治发展到高峰？","answer":"答案：\n（1）材料反映了雅典民主政治的特点是：主权在民、直接民主、轮番而治。公职人员由抽签产生，每一名公民都有参政的机会，体现了直接民主的特点。\n（2）雅典民主政治的最高权力机构是公民大会，具有立法、司法等多种职能。\n（3）公元前5世纪中后期，伯里克利执政时期，雅典达到全盛，奴隶制民主政治发展到高峰。\n解析：抽签选举是雅典直接民主的重要体现，它保证了公民参政的平等机会，但也存在一定的弊端，比如不同素养的人享有同等的国家管理权，可能会导致权力的滥用和误用。尽管如此，雅典民主政治在古代世界仍然是先进的政治制度，对后世产生了深远影响。"},{"id":"g3_history_005_ex01","knowledge_id":"g3_history_005","question":"选择题：罗马共和国建立于什么时间？（  ）\nA. 公元前509年\nB. 公元前27年\nC. 476年\nD. 1453年","answer":"答案：A\n解析：公元前509年，罗马建立了共和国。国家统治的决策权掌握在由300名贵族组成的元老院手里，两个权力相等的执政官主持日常政务，公民大会是形式上的最高权力机关。平民同贵族进行了长期斗争，争取了许多政治权利。"},{"id":"g3_history_005_ex02","knowledge_id":"g3_history_005","question":"填空题：罗马共和国时期颁布的《______》是罗马法制建设的第一步。公元前27年______建立罗马帝国，______世纪罗马帝国进入黄金时期，帝国版图横跨欧、亚、非三洲，______成为其内湖。","answer":"答案：十二铜表法；屋大维；2；地中海\n解析：公元前450年左右，罗马颁布了成文法，因刻在十二块青铜板上，所以被称为《十二铜表法》，它是罗马法制建设的第一步，是后世罗马法典乃至欧洲法学的渊源。公元前27年，屋大维建立罗马帝国。2世纪，罗马帝国进入黄金时期，帝国版图横跨欧、亚、非三洲，地中海成为其内湖。"},{"id":"g3_history_005_ex03","knowledge_id":"g3_history_005","question":"选择题：罗马帝国的建立者是谁？（  ）\nA. 凯撒\nB. 屋大维\nC. 伯里克利\nD. 亚历山大","answer":"答案：B\n解析：公元前27年，屋大维首创'元首制'这一政治形式，掌握了最高统治实权，罗马共和国演变为罗马帝国。屋大维采取许多措施解决矛盾，巩固自己的独尊地位，促进了罗马帝国的发展。"},{"id":"g3_history_005_ex04","knowledge_id":"g3_history_005","question":"简答题：《十二铜表法》有何历史意义？","answer":"答案：\n1. 《十二铜表法》是罗马法制建设的第一步，是后世罗马法典乃至欧洲法学的渊源；\n2. 它使量刑定罪有了文字依据，在一定程度上遏制了贵族对法律的曲解和滥用；\n3. 它是罗马法发展过程中的一个重要里程碑；\n4. 它的颁布也是平民与贵族斗争的结果，在一定程度上保护了平民的利益。\n解析：《十二铜表法》颁布于公元前450年左右，因刻在十二块青铜板上而得名。它涉及诉讼程序、所有权和债务权、宗教法等内容，使量刑定罪有了文字依据，在一定程度上遏制了贵族对法律的曲解和滥用。《十二铜表法》是罗马法制建设的第一步，对后世产生了深远影响。"},{"id":"g3_history_005_ex05","knowledge_id":"g3_history_005","question":"材料分析题：阅读下列材料，回答问题。\n材料：'罗马帝国在2世纪进入黄金时期，帝国版图横跨欧、亚、非三洲，地中海成为其内湖。当时帝国境内农业、手工业和商业发展起来，海路畅通无阻，陆路纵横交错，四通八达，促进了贸易发展，也有利于信息传递和军队调防。'\n请回答：（1）罗马帝国是何时由谁建立的？（2）罗马帝国何时进入黄金时期？（3）罗马帝国的版图有什么特点？","answer":"答案：\n（1）公元前27年，屋大维建立罗马帝国。\n（2）2世纪，罗马帝国进入黄金时期。\n（3）罗马帝国的版图横跨欧、亚、非三洲，地中海成为其内湖。罗马帝国是当时世界上强大的帝国之一，经济繁荣，交通发达，疆域辽阔。\n解析：屋大维在公元前27年建立罗马帝国，之后罗马帝国不断扩张，到2世纪达到最大规模，成为地跨欧、亚、非三洲的大帝国，地中海成为罗马帝国的内湖。罗马帝国的繁荣和扩张对世界历史产生了深远影响。"},{"id":"g3_history_005_ex06","knowledge_id":"g3_history_005","question":"填空题：4世纪末，罗马帝国分裂为东西两个帝国。______年，西罗马帝国在______人的打击下灭亡。西罗马帝国的灭亡标志着______的终结。","answer":"答案：476；日耳曼；西欧奴隶社会\n解析：4世纪末，罗马帝国分裂为东西两个帝国。476年，西罗马帝国在日耳曼人的打击下灭亡。西罗马帝国的灭亡标志着西欧奴隶社会的终结，西欧从此进入封建社会时期。"},{"id":"g3_history_005_ex07","knowledge_id":"g3_history_005","question":"选择题：下列关于罗马的表述，错误的是（  ）\nA. 公元前509年罗马建立共和国\nB. 《十二铜表法》是罗马法制建设的第一步\nC. 公元前27年凯撒建立罗马帝国\nD. 2世纪罗马帝国版图横跨欧、亚、非三洲","answer":"答案：C\n解析：C选项错误，公元前27年建立罗马帝国的是屋大维，不是凯撒。凯撒是罗马共和国时期的执政官，他虽然独揽大权，但并没有建立帝国，后来遇刺身亡。屋大维首创'元首制'，掌握了最高统治实权，罗马共和国演变为罗马帝国。A、B、D选项的表述都是正确的。"},{"id":"g3_history_005_ex08","knowledge_id":"g3_history_005","question":"简答题：简述罗马从共和国到帝国的发展历程。","answer":"答案：\n1. 公元前509年，罗马建立了共和国，国家统治的决策权掌握在元老院手里；\n2. 罗马共和国建立后，逐步征服了意大利半岛，随后又征服了地中海地区，成为地中海霸主；\n3. 公元前2世纪，罗马成为整个地中海地区的霸主，奴隶制迅速发展；\n4. 公元前1世纪，罗马发生了严重的社会危机，共和制再也无力统治，奴隶主企图建立独裁统治，以稳固政权；\n5. 公元前49年，凯撒控制了元老院，后来被谋杀；\n6. 公元前27年，屋大维首创'元首制'，掌握了最高统治实权，罗马共和国演变为罗马帝国；\n7. 2世纪，罗马帝国进入黄金时期，版图横跨欧、亚、非三洲；\n8. 4世纪末，罗马帝国分裂为东西两个帝国；\n9. 476年，西罗马帝国灭亡。\n解析：罗马从共和国发展到帝国，经历了几百年的时间。罗马共和国的扩张使它成为地中海霸主，但也带来了严重的社会危机，最终导致共和制的瓦解和帝国的建立。罗马帝国是古代世界强大的帝国之一，对后世产生了深远影响。"},{"id":"g3_history_005_ex09","knowledge_id":"g3_history_005","question":"选择题：标志着西欧奴隶社会终结的事件是（  ）\nA. 罗马帝国建立\nB. 西罗马帝国灭亡\nC. 东罗马帝国灭亡\nD. 罗马共和国建立","answer":"答案：B\n解析：476年，西罗马帝国在日耳曼人的打击下灭亡。西罗马帝国的灭亡标志着西欧奴隶社会的终结，西欧从此进入封建社会时期。东罗马帝国则继续存在了近千年，直到1453年才被奥斯曼帝国所灭。"},{"id":"g3_history_005_ex10","knowledge_id":"g3_history_005","question":"材料分析题：阅读下列材料，回答问题。\n材料：'《十二铜表法》是古罗马第一部成文法典，刻在十二块青铜板上。它包括民法、刑法和诉讼程序，基本上是习惯法的汇编。法律条文规定，债权人可将无力偿还的债务人，交付法庭判决，直到将其戴上足枷、手铐，甚至杀死或卖之为奴。'\n请回答：（1）《十二铜表法》颁布于何时？（2）根据材料，《十二铜表法》维护的是哪个阶级的利益？（3）《十二铜表法》有何历史地位？","answer":"答案：\n（1）《十二铜表法》颁布于公元前450年左右。\n（2）从材料中可以看出，《十二铜表法》维护的是奴隶主阶级的利益，它保护债权人的利益，债务人如果无力偿还债务，可能会被卖为奴隶甚至被杀死，这反映了奴隶制法律的残酷性。\n（3）历史地位：《十二铜表法》是罗马法制建设的第一步，是后世罗马法典乃至欧洲法学的渊源。它使量刑定罪有了文字依据，在一定程度上遏制了贵族对法律的曲解和滥用，是罗马法发展过程中的一个重要里程碑。\n解析：《十二铜表法》是古罗马第一部成文法典，它的颁布是平民与贵族斗争的结果。虽然它维护的是奴隶主阶级的利益，但它使量刑定罪有了文字依据，在一定程度上限制了贵族的特权，具有进步意义。《十二铜表法》对后世法律产生了深远影响。"},{"id":"g3_history_006_ex01","knowledge_id":"g3_history_006","question":"选择题：西欧封建制度的核心是什么？（  ）\nA. 郡县制\nB. 封君封臣制\nC. 行省制\nD. 科举制","answer":"答案：B\n解析：8世纪前期，法兰克王国对土地的分封形式进行了改革，不再像以前那样无偿地赏赐，而是要求得到封地的人必须提供兵役服务。这样，赐地的人成为封君，接受封地的人则成为封臣，封臣必须效忠于封君、封君则须保护封臣的观念日益流行开来。11世纪，这种以土地的封赐为纽带而形成的封建制度在西欧已经普遍存在。"},{"id":"g3_history_006_ex02","knowledge_id":"g3_history_006","question":"填空题：西欧中世纪乡村的典型组织形式是______，它是独立的自给自足的______和______单位。庄园的土地分为______和______两部分。","answer":"答案：庄园；经济；政治；领主自营地；佃户份地\n解析：从9世纪开始，一种新的农业经济组织形式逐渐流行开来，这就是庄园。大约到11世纪，庄园遍布欧洲各地。庄园是西欧中世纪乡村的典型组织形式，是独立的自给自足的经济和政治单位。庄园的土地分为两部分，一部分由领主自己保留，直接经营，称为'自营地'，剩下的耕地是佃户的'份地'，是佃户的生活来源。"},{"id":"g3_history_006_ex03","knowledge_id":"g3_history_006","question":"选择题：封君封臣制度的纽带是什么？（  ）\nA. 血缘关系\nB. 土地的封赐\nC. 宗教信仰\nD. 科举制度","answer":"答案：B\n解析：封君封臣制度是以土地的封赐为纽带而形成的封建制度。8世纪前期，法兰克王国对土地的分封形式进行了改革，不再像以前那样无偿地赏赐，而是要求得到封地的人必须提供兵役服务。这样，赐地的人成为封君，接受封地的人则成为封臣，封臣必须效忠于封君、封君则须保护封臣。"},{"id":"g3_history_006_ex04","knowledge_id":"g3_history_006","question":"简答题：西欧封君封臣制度有何特点？","answer":"答案：\n1. 以土地的封赐为纽带，封君与封臣的关系有着严格的等级性；\n2. 权利与义务交织在一起，封臣必须效忠于封君，为封君服兵役、提供金钱等，封君则须保护封臣的人身、财产安全；\n3. 层层分封，依次互为主从，'我的附庸的附庸，不是我的附庸'；\n4. 封君与封臣的关系是契约关系，双方都有相应的权利和义务。\n解析：封君封臣制度是西欧封建制度的核心，它是以土地的封赐为纽带而形成的。这一制度有着严格的等级性，权利与义务交织在一起，体现了契约精神。但这种契约关系只存在于直接建立分封受封关系的封君和封臣之间，因此有'我的附庸的附庸，不是我的附庸'的说法。"},{"id":"g3_history_006_ex05","knowledge_id":"g3_history_006","question":"材料分析题：阅读下列材料，回答问题。\n材料：'我的附庸的附庸，不是我的附庸。'——西欧谚语\n请回答：（1）这句谚语反映了西欧的什么制度？（2）这一制度的纽带是什么？（3）这句谚语说明了什么问题？","answer":"答案：\n（1）这句谚语反映了西欧的封君封臣制度（封建等级制度）。\n（2）这一制度的纽带是土地的封赐。\n（3）这句谚语说明了：\n① 西欧封建等级制度有着严格的等级性，层层分封，依次互为主从；\n② 封君与封臣的关系只存在于直接建立分封受封关系的领主和附庸之间；\n③ 不同等级的贵族之间，没有严格的上下级制约关系；\n④ 封臣只承认自己直接受封的人为封君，与自己封君的封君则没有臣属关系。\n解析：'我的附庸的附庸，不是我的附庸'是西欧封建社会的一句著名谚语，它形象地反映了西欧封建等级制度的特点。与中国古代封建社会的中央集权制度不同，西欧的封建制度是层层分封的，不同等级之间没有直接的统属关系。"},{"id":"g3_history_006_ex06","knowledge_id":"g3_history_006","question":"填空题：8世纪前期，______王国对土地的分封形式进行了改革，形成了封君封臣制度。______世纪，这种以土地的封赐为纽带而形成的封建制度在西欧已经普遍存在。","answer":"答案：法兰克；11\n解析：8世纪前期，法兰克王国对土地的分封形式进行了改革，不再像以前那样无偿地赏赐，而是要求得到封地的人必须提供兵役服务，从而形成了封君封臣制度。11世纪，这种以土地的封赐为纽带而形成的封建制度在西欧已经普遍存在。"},{"id":"g3_history_006_ex07","knowledge_id":"g3_history_006","question":"选择题：下列关于西欧庄园的说法，错误的是（  ）\nA. 庄园是独立的自给自足的经济和政治单位\nB. 庄园的居民均为领主的佃户\nC. 庄园的土地全部归领主所有\nD. 庄园具有司法权，设有庄园法庭","answer":"答案：C\n解析：C选项错误，庄园的土地分为两部分，一部分由领主自己保留，直接经营，称为'自营地'，剩下的耕地是佃户的'份地'，是佃户的生活来源，并不是全部归领主所有。A、B、D选项的说法都是正确的，庄园是独立的自给自足的经济和政治单位，庄园的居民均为领主的佃户，庄园具有司法权，设有庄园法庭。"},{"id":"g3_history_006_ex08","knowledge_id":"g3_history_006","question":"简答题：西欧庄园法庭有什么作用？","answer":"答案：\n1. 庄园法庭起着维护庄园公共秩序的作用，既维护了领主的利益，也在一定程度上限制了领主的特权；\n2. 庄园法庭审判依据习惯法或村法，领主可以凭借法庭奴役佃户，佃户也可以利用法庭维护自己的权益；\n3. 庄园法庭维护了庄园的正常生产和生活秩序；\n4. 庄园法庭的存在，在一定程度上保障了佃户的基本权利。\n解析：庄园具有司法权，设有庄园法庭，主持法庭的是领主或他的管家。庄园法庭没有专门的工作人员，也不像现代法院那样随时开庭，一般是每隔一段时间为解决一批问题而开庭一次。庄园法庭既维护了领主的利益，也在一定程度上限制了领主的特权。"},{"id":"g3_history_006_ex09","knowledge_id":"g3_history_006","question":"选择题：在西欧封建制度中，封臣对封君的义务不包括（  ）\nA. 服兵役\nB. 提供金钱\nC. 效忠于封君\nD. 管理封君的所有土地","answer":"答案：D\n解析：封臣对封君的义务包括：封臣必须效忠于封君，在封君需要的时候，要无偿地为封君服兵役、提供金钱等。管理封君的所有土地不是封臣的义务。封君与封臣的关系有着严格的等级性，权利与义务交织在一起。"},{"id":"g3_history_006_ex10","knowledge_id":"g3_history_006","question":"材料分析题：阅读下列材料，回答问题。\n材料：庄园的面积有大有小，大多以村庄为基础，有住房、作坊、耕地、草地、林地、荒地、池塘。庄园以农业为主，奶酪、火腿、蔬菜等食物均可自给，鞋帽、衣服也自己制作，很多庄园还有铁匠、金银匠、皮鞋匠、面包师等各色工匠。\n请回答：（1）材料反映了西欧庄园的什么特点？（2）庄园的居民有哪些？（3）庄园的土地分为哪几部分？","answer":"答案：\n（1）材料反映了西欧庄园是一个独立的自给自足的经济和政治单位。庄园内生产生活所需的物品基本上都能自己生产，不需要和外界进行过多的经济交流。\n（2）庄园的居民均为领主的佃户，包括自由的农民和缺少自由的农奴。\n（3）庄园的土地分为两部分：一部分由领主自己保留，直接经营，称为'自营地'，通常占庄园全部可耕地的1/3到1/2，收入全部归领主所有；剩下的耕地是佃户的'份地'，是佃户的生活来源。\n解析：西欧庄园是中世纪西欧封建社会的基本生产和生活单位，它的突出特点是自给自足。庄园经济的盛行，反映了当时西欧生产力水平较低，商品经济不发达的状况。随着生产力的发展和商品经济的繁荣，庄园制度逐渐走向衰落。"},{"id":"g3_history_007_ex01","knowledge_id":"g3_history_007","question":"选择题：西欧城市重新兴起于什么时候？（  ）\nA. 8世纪\nB. 10世纪\nC. 12世纪\nD. 14世纪","answer":"答案：B\n解析：从10世纪起，西欧开始恢复起来，农业技术提高，农业剩余产品增加，商业贸易发展，人口增长，旧的城市开始复苏，新的城市不断产生。那些以手工业和商业为中心的城市发展更快。意大利、法兰西、英格兰、德意志等，都出现了许多著名的城市。"},{"id":"g3_history_007_ex02","knowledge_id":"g3_history_007","question":"填空题：西欧城市居民通过______或______等方式争取城市的自由和自治。城市取得自由和自治权的形式，是从国王或领主手里取得______。","answer":"答案：金钱赎买；武力斗争；特许状\n解析：由于城市一般坐落在封建领主的领地上，因此，领主像控制庄园一样，对城市居民任意征税，甚至要求居民像佃户一样履行义务。城市居民采取各种方式反抗，争取城市的自由和自治，常用的手段包括金钱赎买和武力斗争。城市取得自由和自治权的形式，是从国王或领主手里取得'特许状'。"},{"id":"g3_history_007_ex03","knowledge_id":"g3_history_007","question":"选择题：被认为是欧洲中世纪教育'最美好的花朵'的是（  ）\nA. 城市的兴起\nB. 大学的兴起\nC. 庄园的出现\nD. 教会的发展","answer":"答案：B\n解析：12世纪，西欧的教育与学术出现了新的气象，大学的兴起被认为是欧洲中世纪教育'最美好的花朵'。12世纪，巴黎出现了许多教会学校和教师私人办的学校。13世纪，巴黎教师行会得到罗马教皇和国王的支持，自治权利得到保证。大学的自治地位主要体现在免赋税特权、司法特权、教育自主权。"},{"id":"g3_history_007_ex04","knowledge_id":"g3_history_007","question":"简答题：西欧城市重新兴起有何历史意义？","answer":"答案：\n1. 随着城市的发展和工商业的繁荣，市民阶级逐渐形成；\n2. 城市手工业者和商人不断分化，出现了富裕的大手工业作坊主、商人和银行家等，他们成为早期的资产阶级；\n3. 城市的兴起对封建制度起着瓦解作用；\n4. 城市的兴起促进了商品经济的发展，为资本主义的兴起准备了条件；\n5. 城市的发展推动了大学的兴起，促进了教育文化的发展。\n解析：从10世纪起，西欧城市重新兴起。城市的兴起和发展，对西欧社会产生了深远影响。市民阶级的形成和早期资产阶级的出现，为资本主义的兴起准备了条件。同时，城市的发展也推动了教育和文化的繁荣。"},{"id":"g3_history_007_ex05","knowledge_id":"g3_history_007","question":"材料分析题：阅读下列材料，回答问题。\n材料：'城市是中世纪的花朵。'——恩格斯\n请回答：（1）西欧城市重新兴起于何时？（2）城市居民通过哪些方式争取自治？（3）为什么说'城市是中世纪的花朵'？","answer":"答案：\n（1）西欧城市重新兴起于10世纪。\n（2）城市居民常用的手段包括金钱赎买和武力斗争。\n（3）'城市是中世纪的花朵'，因为：\n① 城市的兴起促进了商品经济的发展，对封建制度起着瓦解作用；\n② 随着城市的发展和工商业的繁荣，市民阶级逐渐形成，富裕商人和银行家发展成早期资产阶级，为资本主义的兴起准备了条件；\n③ 城市的发展推动了大学的兴起，促进了教育文化的发展；\n④ 城市的自由和自治，使市民获得了更多的权利和自由，有利于社会的进步。\n解析：城市的兴起是西欧中世纪社会的重要现象。城市的发展不仅促进了经济的繁荣，还推动了社会结构的变化和文化教育的发展，为西欧从封建社会向资本主义社会过渡准备了条件。因此，恩格斯说'城市是中世纪的花朵'。"},{"id":"g3_history_007_ex06","knowledge_id":"g3_history_007","question":"填空题：随着城市的发展和工商业的繁荣，______逐渐形成。城市手工业者和商人不断分化，出现了富裕的大手工业作坊主、商人和银行家等，他们成为______。","answer":"答案：市民阶级；早期资产阶级\n解析：随着城市的发展和工商业的繁荣，市民阶级逐渐形成。城市手工业者和商人不断分化，出现了富裕的大手工业作坊主、商人和银行家等，他们成为早期的资产阶级。早期资产阶级的出现，为资本主义的兴起准备了条件。"},{"id":"g3_history_007_ex07","knowledge_id":"g3_history_007","question":"选择题：下列关于中世纪西欧大学的说法，错误的是（  ）\nA. 大学的兴起被认为是欧洲中世纪教育'最美好的花朵'\nB. 12世纪大学开始兴起\nC. 大学的自治地位主要体现在免赋税特权、司法特权、教育自主权\nD. 大学课程完全不受教会影响","answer":"答案：D\n解析：D选项错误，中世纪大学的课程设置一方面仍受基督教会的影响，另一方面也反映了经济和社会发展的要求。当时大学的基础课程包括文法、修辞、逻辑、算术、几何、天文和音乐，专业课程有法学、医学和神学。A、B、C选项的说法都是正确的。"},{"id":"g3_history_007_ex08","knowledge_id":"g3_history_007","question":"简答题：中世纪西欧大学的自治地位主要体现在哪些方面？","answer":"答案：\n1. 免赋税特权：大学师生享有免赋税的特权，不必向国家缴纳各种赋税；\n2. 司法特权：大学师生免受地方世俗法官审判，而须按教会法规定由当地主教审理，或由大学法庭独立审理；\n3. 教育自主权：大学有权自行管理学校事务，自行设置课程，自行聘任教师，自行招生等。\n解析：12世纪，西欧的教育与学术出现了新的气象，大学的兴起被认为是欧洲中世纪教育'最美好的花朵'。大学的自治地位主要体现在免赋税特权、司法特权、教育自主权。这些特权的获得，有利于大学的独立发展，也有利于学术的自由探讨。"},{"id":"g3_history_007_ex09","knowledge_id":"g3_history_007","question":"选择题：西欧城市争取自治的常用手段不包括（  ）\nA. 金钱赎买\nB. 武力斗争\nC. 接受领主的完全控制\nD. 从国王或领主手里取得特许状","answer":"答案：C\n解析：西欧城市居民采取各种方式反抗领主的控制，争取城市的自由和自治，常用的手段包括金钱赎买和武力斗争。城市取得自由和自治权的形式，是从国王或领主手里取得'特许状'。接受领主的完全控制不是争取自治的手段，而是争取自治要反对的。"},{"id":"g3_history_007_ex10","knowledge_id":"g3_history_007","question":"材料分析题：阅读下列材料，回答问题。\n材料：12世纪，巴黎出现了许多教会学校和教师私人办的学校。教师私人办校也须从教会那里得到授课许可证。为了维护自身的权利和经济利益，巴黎的教师组成教师行会，选举会长管理学校。13世纪，巴黎教师行会得到罗马教皇和国王的支持，自治权利得到保证。\n请回答：（1）材料反映了中世纪西欧的什么现象？（2）这一现象被称为什么？（3）它的自治地位主要体现在哪些方面？","answer":"答案：\n（1）材料反映了中世纪西欧大学的兴起和发展。\n（2）大学的兴起被认为是欧洲中世纪教育'最美好的花朵'。\n（3）大学的自治地位主要体现在：\n① 免赋税特权：大学师生享有免赋税的特权；\n② 司法特权：大学师生免受地方世俗法官审判，而须按教会法规定由当地主教审理，或由大学法庭独立审理；\n③ 教育自主权：大学有权自行管理学校事务，自行设置课程等。\n解析：大学的兴起是中世纪西欧教育发展的重要标志。大学的出现，打破了教会对教育的垄断，促进了教育和学术的发展。虽然大学仍受到教会的影响，但它的自治地位为学术自由和知识的传播创造了条件，对后世产生了深远影响。"},{"id":"g3_history_008_ex01","knowledge_id":"g3_history_008","question":"选择题：拜占庭帝国的首都是哪里？（  ）\nA. 罗马\nB. 君士坦丁堡\nC. 雅典\nD. 巴格达","answer":"答案：B\n解析：东罗马帝国定都君士坦丁堡，君士坦丁堡原称拜占庭，因此东罗马帝国又称拜占庭帝国。拜占庭帝国是一个地跨欧、亚、非三洲的大帝国，它对基督教、希腊罗马的古典文化传统，以及西亚、北非等地的东方文化因素兼收并蓄，创造出独具特色的拜占庭文化。"},{"id":"g3_history_008_ex02","knowledge_id":"g3_history_008","question":"填空题：查士丁尼一世统治时期，组织编纂了《______》《______》《______》《______》，统称《罗马民法大全》，奠定了______的基础。","answer":"答案：查士丁尼法典；法学汇纂；法理概要；新法典；欧洲民法\n解析：527年，查士丁尼继任为东罗马帝国皇帝。为了稳固帝国的社会秩序、保证皇帝的专制权力，他组建了一个法典编纂委员会。529年，委员会把自2世纪初以来历任罗马皇帝颁布的法令收集在一起，剔除其中相互矛盾的条例，编成《查士丁尼法典》，同时把历代罗马法学家有关法律问题的论文和著作汇编为《法学汇纂》，又编成指导学习法律文献的《法理概要》。后来，查士丁尼又命人将自己执政时期的法令编辑为《新法典》。以上这4部法律文献统称为《罗马民法大全》，奠定了欧洲民法的基础。"},{"id":"g3_history_008_ex03","knowledge_id":"g3_history_008","question":"选择题：拜占庭帝国是被哪个国家所灭的？（  ）\nA. 阿拉伯帝国\nB. 奥斯曼帝国\nC. 亚历山大帝国\nD. 罗马帝国","answer":"答案：B\n解析：1453年，奥斯曼帝国攻破君士坦丁堡，拜占庭帝国最终灭亡。拜占庭帝国虽然灭亡了，但它创造了独具特色的拜占庭文化，在世界上产生过重大影响。它保存了大量的希腊、罗马古籍，为后来西欧的文艺复兴提供了丰富的精神营养。"},{"id":"g3_history_008_ex04","knowledge_id":"g3_history_008","question":"简答题：《罗马民法大全》有何历史地位和影响？","answer":"答案：\n1. 《罗马民法大全》是东罗马帝国皇帝查士丁尼一世下令编纂的一部汇编式法典，是罗马法的集大成者；\n2. 它仍然承认奴隶制，但在一定程度上改善了奴隶的地位，不再像以前那样把奴隶看作'会说话的工具'；\n3. 它还对财产、买卖、债务、契约关系等作出明确规定；\n4. 《罗马民法大全》奠定了欧洲民法的基础，对后世法律产生了深远影响。\n解析：《罗马民法大全》由《查士丁尼法典》《法学汇纂》《法理概要》《新法典》4部法律文献组成。它是罗马法的集大成者，总结了罗马法在法学方面的创造性成果，在世界法制史上占有十分重要的地位，对后世欧洲各国的法律产生了深远影响。"},{"id":"g3_history_008_ex05","knowledge_id":"g3_history_008","question":"材料分析题：阅读下列材料，回答问题。\n材料：'拜占庭帝国是一个地跨欧、亚、非三洲的大帝国。它对基督教、希腊罗马的古典文化传统，以及西亚、北非等地的东方文化因素兼收并蓄，创造出独具特色的拜占庭文化，在世界上产生过重大影响。'\n请回答：（1）拜占庭帝国就是历史上的什么帝国？它的首都在哪里？（2）拜占庭文化有什么特点？（3）拜占庭文化有何历史影响？","answer":"答案：\n（1）拜占庭帝国就是东罗马帝国，它的首都在君士坦丁堡（原称拜占庭）。\n（2）拜占庭文化的特点：对基督教、希腊罗马的古典文化传统，以及西亚、北非等地的东方文化因素兼收并蓄，创造出独具特色的拜占庭文化。\n（3）历史影响：\n① 拜占庭文化在世界上产生过重大影响；\n② 它保存了大量的希腊、罗马古籍，为后来西欧的文艺复兴提供了丰富的精神营养；\n③ 拜占庭文化对东欧各国的文化产生过巨大影响；\n④ 拜占庭帝国的建筑、艺术、法律等对后世都有深远影响。\n解析：拜占庭帝国是一个地跨欧、亚、非三洲的大帝国，它存在了一千多年。拜占庭文化融合了东西方文化，独具特色，在世界文化史上占有重要地位。拜占庭帝国虽然在1453年灭亡了，但它的文化遗产对后世产生了深远影响。"},{"id":"g3_history_008_ex06","knowledge_id":"g3_history_008","question":"填空题：______年，奥斯曼帝国攻破君士坦丁堡，拜占庭帝国最终灭亡。拜占庭帝国保存了大量的希腊、罗马古籍，为后来西欧的______提供了丰富的精神营养。","answer":"答案：1453；文艺复兴\n解析：1453年，奥斯曼帝国攻破君士坦丁堡，拜占庭帝国最终灭亡。拜占庭帝国虽然灭亡了，但它创造了独具特色的拜占庭文化，保存了大量的希腊、罗马古籍，为后来西欧的文艺复兴提供了丰富的精神营养。"},{"id":"g3_history_008_ex07","knowledge_id":"g3_history_008","question":"选择题：下列关于拜占庭帝国的说法，错误的是（  ）\nA. 拜占庭帝国就是东罗马帝国\nB. 查士丁尼一世统治时期编纂了《罗马民法大全》\nC. 拜占庭帝国1453年被阿拉伯帝国所灭\nD. 拜占庭文化对文艺复兴有重要影响","answer":"答案：C\n解析：C选项错误，拜占庭帝国是1453年被奥斯曼帝国所灭，不是阿拉伯帝国。A、B、D选项的说法都是正确的，拜占庭帝国就是东罗马帝国，查士丁尼一世统治时期编纂了《罗马民法大全》，拜占庭文化保存了大量的希腊、罗马古籍，为后来西欧的文艺复兴提供了丰富的精神营养。"},{"id":"g3_history_008_ex08","knowledge_id":"g3_history_008","question":"简答题：查士丁尼一世编纂法典的目的是什么？","answer":"答案：\n查士丁尼一世编纂法典的目的是为了稳固帝国的社会秩序、保证皇帝的专制权力。\n具体来说：\n1. 政治上：通过法典来规范人们的行为，维护社会秩序，巩固帝国的统治；\n2. 法律上：整理和汇编历代罗马皇帝颁布的法令，使法律更加系统和完善；\n3. 思想上：通过法律来宣扬君权神授，强化皇帝的专制权力。\n解析：527年，查士丁尼继任为东罗马帝国皇帝。为了稳固帝国的社会秩序、保证皇帝的专制权力，他组建了一个法典编纂委员会，历时数年编成了《查士丁尼法典》等4部法律文献，统称为《罗马民法大全》。这部法典的编纂，不仅对东罗马帝国的统治起到了巩固作用，也对后世法律产生了深远影响。"},{"id":"g3_history_008_ex09","knowledge_id":"g3_history_008","question":"选择题：奠定了欧洲民法基础的是（  ）\nA. 《十二铜表法》\nB. 《汉谟拉比法典》\nC. 《罗马民法大全》\nD. 《拿破仑法典》","answer":"答案：C\n解析：《罗马民法大全》是东罗马帝国皇帝查士丁尼一世下令编纂的，它由《查士丁尼法典》《法学汇纂》《法理概要》《新法典》4部法律文献组成。《罗马民法大全》仍然承认奴隶制，但在一定程度上改善了奴隶的地位，它还对财产、买卖、债务、契约关系等作出明确规定，奠定了欧洲民法的基础。"},{"id":"g3_history_008_ex10","knowledge_id":"g3_history_008","question":"材料分析题：阅读下列材料，回答问题。\n材料：查士丁尼在《查士丁尼法典》的序言中说：'皇帝的威严、光荣不但依靠兵器，而且须用法律来巩固。这样，无论在战时或平时，总是可以将国家治理得很好。'\n请回答：（1）查士丁尼是哪个国家的皇帝？（2）根据材料，查士丁尼认为治理国家应该依靠什么？（3）除了《查士丁尼法典》，查士丁尼时期还编纂了哪些法律文献？它们统称为什么？","answer":"答案：\n（1）查士丁尼是东罗马帝国（拜占庭帝国）的皇帝。\n（2）根据材料，查士丁尼认为治理国家不仅要依靠兵器（军事力量），而且须用法律来巩固，即要依靠法律来治理国家。\n（3）除了《查士丁尼法典》，查士丁尼时期还编纂了《法学汇纂》《法理概要》《新法典》，以上这4部法律文献统称为《罗马民法大全》。\n解析：查士丁尼是东罗马帝国历史上一位有作为的皇帝，他在位期间，不仅通过军事手段扩张领土，还十分重视法律的制定和编纂。他组织人力编纂的《罗马民法大全》，是罗马法的集大成者，奠定了欧洲民法的基础，对后世产生了深远影响。"},{"id":"g3_history_009_ex01","knowledge_id":"g3_history_009","question":"选择题：日本大化改新开始于哪一年？（  ）\nA. 646年\nB. 7世纪初\nC. 1868年\nD. 1453年","answer":"答案：A\n解析：646年，日本孝德天皇颁布改新诏书，仿效唐朝的典章制度，进行了一系列改革，史称'大化改新'。大化改新使日本发展成为一个中央集权制的封建国家，是日本从奴隶社会向封建社会过渡的标志。"},{"id":"g3_history_009_ex02","knowledge_id":"g3_history_009","question":"填空题：大化改新是日本仿效______的典章制度进行的改革。政治上建立以______为中心的中央集权制度；经济上土地收归国有，统一赋税。大化改新使日本发展成为一个中央集权制的______国家。","answer":"答案：唐朝；天皇；封建\n解析：646年，日本孝德天皇仿效唐朝的典章制度，进行了一系列改革，史称'大化改新'。大化改新的主要内容有：政治上，建立以天皇为中心的中央集权制度，地方设国、郡、里三级，由中央派官治理。经济上，废除一切私地、私民，将土地、部民收归国有，成为公地、公民；国家将土地颁给公民，六年一颁，不能终生使用，也不能买卖；统一赋税。大化改新使日本发展成为一个中央集权制的封建国家。"},{"id":"g3_history_009_ex03","knowledge_id":"g3_history_009","question":"选择题：大化改新在经济方面的内容不包括（  ）\nA. 废除一切私地、私民\nB. 将土地、部民收归国有\nC. 实行土地私有\nD. 统一赋税","answer":"答案：C\n解析：大化改新在经济方面的内容包括：废除一切私地、私民，将土地、部民收归国有，成为公地、公民；国家将土地颁给公民，六年一颁，不能终生使用，也不能买卖；统一赋税。实行土地私有不是大化改新的内容，大化改新是将土地收归国有。"},{"id":"g3_history_009_ex04","knowledge_id":"g3_history_009","question":"简答题：大化改新有何历史意义？","answer":"答案：\n1. 大化改新使日本发展成为一个中央集权制的封建国家；\n2. 大化改新是日本从奴隶社会向封建社会过渡的标志；\n3. 大化改新促进了日本社会经济的发展；\n4. 大化改新显示了日本民族善于学习、勇于创新的特点；\n5. 大化改新对日本历史的发展产生了深远影响。\n解析：大化改新是日本历史上一次重要的改革，它仿效唐朝的典章制度，在政治、经济等方面进行了一系列改革。大化改新使日本从奴隶社会过渡到封建社会，建立了中央集权的封建国家，促进了日本社会经济的发展，是日本历史上的一个重要转折点。"},{"id":"g3_history_009_ex05","knowledge_id":"g3_history_009","question":"材料分析题：阅读下列材料，回答问题。\n材料：'大化改新后，日本地方设国、郡、里三级，由中央派官治理。废除一切私地、私民，将土地、部民收归国有，成为公地、公民。国家将土地颁给公民，六年一颁，不能终生使用，也不能买卖。统一赋税。'\n请回答：（1）大化改新是仿效哪个国家的典章制度进行的？（2）根据材料，概括大化改新的主要内容。（3）大化改新有何历史意义？","answer":"答案：\n（1）大化改新是日本仿效中国唐朝的典章制度进行的改革。\n（2）主要内容：\n政治上：建立以天皇为中心的中央集权制度，地方设国、郡、里三级，由中央派官治理。\n经济上：废除一切私地、私民，将土地、部民收归国有，成为公地、公民；国家将土地颁给公民，六年一颁，不能终生使用，也不能买卖；统一赋税。\n（3）历史意义：大化改新使日本发展成为一个中央集权制的封建国家，是日本从奴隶社会向封建社会过渡的标志，促进了日本社会经济的发展。\n解析：大化改新是日本历史上的一次重要改革，它全面学习唐朝的政治经济制度，使日本从奴隶社会过渡到封建社会。这次改革充分体现了日本民族善于学习外来文化的特点，对日本历史的发展产生了深远影响。"},{"id":"g3_history_009_ex06","knowledge_id":"g3_history_009","question":"填空题：大化改新是日本从______社会向______社会过渡的标志。它仿效的是中国______朝的典章制度。","answer":"答案：奴隶；封建；唐\n解析：大化改新是日本历史上一次重要的改革，它仿效中国唐朝的典章制度，在政治、经济等方面进行了一系列改革。大化改新使日本从奴隶社会过渡到封建社会，建立了中央集权的封建国家，是日本历史上的一个重要转折点。"},{"id":"g3_history_009_ex07","knowledge_id":"g3_history_009","question":"选择题：下列关于大化改新的说法，正确的是（  ）\nA. 大化改新使日本变成了资本主义国家\nB. 大化改新仿效的是宋朝的制度\nC. 大化改新建立了中央集权制度\nD. 大化改新发生在7世纪初","answer":"答案：C\n解析：C选项正确，大化改新在政治上建立了以天皇为中心的中央集权制度。A选项错误，大化改新使日本发展成为一个封建国家，不是资本主义国家；B选项错误，大化改新仿效的是唐朝的典章制度，不是宋朝；D选项错误，大化改新开始于646年，是7世纪中期，不是7世纪初。"},{"id":"g3_history_009_ex08","knowledge_id":"g3_history_009","question":"简答题：大化改新的背景是什么？","answer":"答案：\n1. 国内背景：6—9世纪，日本积极吸收中国文化。中国文化直接影响着日本，推动日本进行改革。大和皇族中的改革派发动宫廷政变，孝德天皇即位，年号大化。\n2. 国际背景：中国隋唐时期的制度先进，经济文化繁荣，对日本产生了巨大的吸引力和影响力；朝鲜半岛上的国家也对日本产生了一定影响。\n3. 根本原因：日本的奴隶制度严重阻碍了社会的发展，社会矛盾尖锐，改革势在必行。\n解析：大化改新的发生不是偶然的，它既有深刻的国内背景，也有复杂的国际背景。国内社会矛盾的激化是改革的根本原因，而中国隋唐的先进制度和文化则为改革提供了范本。大化改新是日本历史上一次重要的改革，它使日本从奴隶社会过渡到封建社会。"},{"id":"g3_history_009_ex09","knowledge_id":"g3_history_009","question":"选择题：大化改新时，日本的天皇是（  ）\nA. 明治天皇\nB. 孝德天皇\nC. 裕仁天皇\nD. 明仁天皇","answer":"答案：B\n解析：646年，日本孝德天皇颁布改新诏书，仿效唐朝的典章制度，进行了一系列改革，史称'大化改新'。明治天皇是日本明治维新时期的天皇，裕仁天皇和明仁天皇是近现代的日本天皇。"},{"id":"g3_history_009_ex10","knowledge_id":"g3_history_009","question":"材料分析题：阅读下列材料，回答问题。\n材料：'日本本州中部兴起了一个叫做大和的政权，它大量吸收中国的先进技术与文化，凭借强大的军事力量不断扩张，到5世纪基本统一了日本。但是，到了6、7世纪，日本社会矛盾十分尖锐，大贵族奴隶主势力强大，政局混乱，改革势在必行。'\n请回答：（1）6、7世纪日本社会的状况如何？（2）日本是如何解决这一危机的？（3）这一事件对日本有何影响？","answer":"答案：\n（1）6、7世纪，日本社会矛盾十分尖锐，大贵族奴隶主势力强大，政局混乱，改革势在必行。\n（2）日本通过大化改新解决了这一危机。646年，日本孝德天皇颁布改新诏书，仿效唐朝的典章制度，进行了一系列改革，史称'大化改新'。\n（3）影响：大化改新使日本发展成为一个中央集权制的封建国家，是日本从奴隶社会向封建社会过渡的标志，促进了日本社会经济的发展，对日本历史的发展产生了深远影响。\n解析：6、7世纪，日本社会矛盾尖锐，政局混乱。为了摆脱危机，日本仿效中国唐朝的典章制度，进行了大化改新。这次改革是日本历史上的一次重要变革，它使日本从奴隶社会过渡到封建社会，建立了中央集权的封建国家，对日本历史的发展产生了深远影响。"},{"id":"g3_history_010_ex01","knowledge_id":"g3_history_010","question":"选择题：伊斯兰教的创始人是谁？（  ）\nA. 耶稣\nB. 乔达摩·悉达多\nC. 穆罕默德\nD. 老子","answer":"答案：C\n解析：7世纪初，穆罕默德在阿拉伯半岛创立了伊斯兰教。622年，穆罕默德率领一些信徒迁居麦地那，建立了一个以共同信仰为基础的宗教社团，即穆斯林公社，阿拉伯国家的雏形由此诞生。630年，穆罕默德率穆斯林占领麦加，此后，半岛各部落纷纷遣使麦地那，承认穆罕默德的统治地位，阿拉伯半岛基本统一。"},{"id":"g3_history_010_ex02","knowledge_id":"g3_history_010","question":"填空题：______世纪中期，阿拉伯帝国形成，版图横跨亚、欧、非三大洲，是当时世界上疆域最大的帝国。阿拉伯人担当了______的角色，为世界文化的发展作出了卓越贡献。","answer":"答案：8；沟通东西方文化\n解析：8世纪中期，阿拉伯帝国形成。它的版图横跨亚、欧、非三大洲，是当时世界上疆域最大的帝国。阿拉伯帝国繁荣时期，哈里发重视知识，认为'人最美的装饰是知识'。阿拉伯人担当了沟通东西方文化的角色，为世界文化的发展作出了卓越贡献。中国的造纸术、指南针、火药等重大发明和印度的棉花、食糖等都是由阿拉伯人传入欧洲的。"},{"id":"g3_history_010_ex03","knowledge_id":"g3_history_010","question":"选择题：阿拉伯国家的雏形诞生于哪一年？（  ）\nA. 610年\nB. 622年\nC. 630年\nD. 8世纪中期","answer":"答案：B\n解析：622年，穆罕默德率领一些信徒迁居麦地那，建立了一个以共同信仰为基础的宗教社团，即穆斯林公社。公社成员都以兄弟姐妹相待，禁止相互仇杀，公社内外事务都要听从穆罕默德的决定。阿拉伯国家的雏形由此诞生。"},{"id":"g3_history_010_ex04","knowledge_id":"g3_history_010","question":"简答题：阿拉伯人对世界文化作出了哪些贡献？","answer":"答案：\n1. 阿拉伯人担当了沟通东西方文化的角色，为世界文化的发展作出了卓越贡献；\n2. 阿拉伯人翻译了大量的希腊、波斯、印度的典籍，保存了大量的古代文化典籍；\n3. 中国的造纸术、指南针、火药等重大发明和印度的棉花、食糖等都是由阿拉伯人传入欧洲的；\n4. 阿拉伯人创造了灿烂的阿拉伯文化，在数学、医学、文学等方面都有杰出成就，如阿拉伯数字、《医学集成》《医典》《天方夜谭》等；\n5. 阿拉伯人把阿拉伯文化传播到了世界各地，对世界文化的发展产生了深远影响。\n解析：阿拉伯帝国繁荣时期，文化十分发达。阿拉伯人不仅创造了灿烂的阿拉伯文化，还担当了沟通东西方文化的角色，为世界文化的发展作出了卓越贡献。阿拉伯人在不同文明之间搭起了文化交流的桥梁，促进了这些地区文化和经济的发展。"},{"id":"g3_history_010_ex05","knowledge_id":"g3_history_010","question":"材料分析题：阅读下列材料，回答问题。\n材料：'阿拉伯学者翻译了大量的希腊、波斯、印度的典籍，还把中国的造纸术、指南针、火药等重大发明和印度的棉花、食糖等传入欧洲。阿拉伯人在数学、医学、文学等方面都有杰出成就。'\n请回答：（1）根据材料，概括阿拉伯人在东西方文化交流中的作用。（2）阿拉伯人在数学方面的突出贡献是什么？（3）阿拉伯文学的不朽之作是什么？","answer":"答案：\n（1）阿拉伯人担当了沟通东西方文化的角色，为世界文化的发展作出了卓越贡献。他们翻译了大量的东方典籍，保存了古代文化，同时把东方的文化和科技成果传入欧洲，促进了东西方文化的交流。\n（2）阿拉伯人在数学方面的突出贡献是改造了古印度人从0到9的计数法，形成了我们现在常用的'阿拉伯数字'，并创造了完整的代数学。\n（3）阿拉伯文学的不朽之作是《天方夜谭》（《一千零一夜》），它是阿拉伯民间故事集，描绘了阿拉伯帝国丰富的社会生活。\n解析：阿拉伯帝国繁荣时期，文化十分发达。阿拉伯人不仅创造了灿烂的阿拉伯文化，还担当了沟通东西方文化的角色，在不同文明之间搭起了文化交流的桥梁，对世界文化的发展产生了深远影响。"},{"id":"g3_history_010_ex06","knowledge_id":"g3_history_010","question":"填空题：伊斯兰教的经典是《______》，穆斯林公社建立于______年，阿拉伯帝国在______世纪中期成为地跨亚、欧、非三洲的大帝国。","answer":"答案：古兰经；622；8\n解析：伊斯兰教的经典是《古兰经》。622年，穆罕默德率领一些信徒迁居麦地那，建立了穆斯林公社，阿拉伯国家的雏形由此诞生。8世纪中期，阿拉伯帝国形成，版图横跨亚、欧、非三大洲，是当时世界上疆域最大的帝国。"},{"id":"g3_history_010_ex07","knowledge_id":"g3_history_010","question":"选择题：下列关于阿拉伯帝国的说法，错误的是（  ）\nA. 8世纪中期成为地跨亚、欧、非三洲的大帝国\nB. 阿拉伯人担当了沟通东西方文化的角色\nC. 《天方夜谭》是阿拉伯文学的瑰宝\nD. 阿拉伯帝国的首都是麦地那","answer":"答案：D\n解析：D选项错误，阿拉伯帝国的首都是巴格达，不是麦地那。麦地那是穆罕默德建立穆斯林公社的地方，是伊斯兰教的圣地之一。A、B、C选项的说法都是正确的，8世纪中期阿拉伯帝国成为地跨亚、欧、非三洲的大帝国，阿拉伯人担当了沟通东西方文化的角色，《天方夜谭》是阿拉伯文学的瑰宝。"},{"id":"g3_history_010_ex08","knowledge_id":"g3_history_010","question":"简答题：简述阿拉伯帝国的形成过程。","answer":"答案：\n1. 7世纪初，穆罕默德在阿拉伯半岛创立伊斯兰教；\n2. 622年，穆罕默德率领一些信徒迁居麦地那，建立穆斯林公社，阿拉伯国家的雏形诞生；\n3. 630年，穆罕默德率穆斯林占领麦加，此后，半岛各部落纷纷遣使麦地那，承认穆罕默德的统治地位，阿拉伯半岛基本统一；\n4. 穆罕默德逝世后，他的继承者继续扩张，至8世纪中期，阿拉伯帝国形成，版图横跨亚、欧、非三大洲，是当时世界上疆域最大的帝国；\n5. 阿拉伯帝国繁荣时期，文化十分发达，在数学、医学、文学等方面都有杰出成就。\n解析：阿拉伯帝国的形成与伊斯兰教的创立和传播密切相关。穆罕默德创立伊斯兰教后，建立了穆斯林公社，逐步统一了阿拉伯半岛。他的继承者继续扩张，最终建立了一个地跨亚、欧、非三洲的大帝国。阿拉伯帝国不仅疆域辽阔，文化也十分繁荣，对世界文化的发展作出了重要贡献。"},{"id":"g3_history_010_ex09","knowledge_id":"g3_history_010","question":"选择题：下列哪项是阿拉伯人的文化成就？（  ）\nA. 《荷马史诗》\nB. 《天方夜谭》\nC. 《哈姆雷特》\nD. 《神曲》","answer":"答案：B\n解析：《天方夜谭》（《一千零一夜》）是阿拉伯民间故事集，是阿拉伯文学的瑰宝，描绘了阿拉伯帝国丰富的社会生活。《荷马史诗》是古希腊的文学名著，《哈姆雷特》是英国莎士比亚的作品，《神曲》是意大利但丁的作品。"},{"id":"g3_history_010_ex10","knowledge_id":"g3_history_010","question":"材料分析题：阅读下列材料，回答问题。\n材料：7世纪初，阿拉伯半岛大部分地区尚未形成统一的国家。为了争夺水源和牧场，部落间相互仇杀。内部矛盾丛生、商路不畅，引起商业衰落、生产停滞和外部势力入侵。在这种形势下，阿拉伯人民渴望建立统一的国家。\n请回答：（1）材料反映了阿拉伯半岛当时怎样的状况？（2）是谁解决了这一问题？他是通过什么方式解决的？（3）这对阿拉伯历史有何影响？","answer":"答案：\n（1）材料反映了7世纪初阿拉伯半岛四分五裂、部落林立、相互仇杀、社会矛盾尖锐、经济衰落的状况，阿拉伯人民渴望建立统一的国家。\n（2）穆罕默德解决了这一问题。他通过创立伊斯兰教，建立穆斯林公社，以宗教为纽带，逐步统一了阿拉伯半岛。\n（3）影响：\n① 穆罕默德创立伊斯兰教，统一了阿拉伯半岛，建立了阿拉伯国家；\n② 他的继承者继续扩张，建立了地跨亚、欧、非三洲的阿拉伯帝国；\n③ 阿拉伯帝国创造了灿烂的阿拉伯文化，担当了沟通东西方文化的角色，为世界文化的发展作出了卓越贡献。\n解析：7世纪初，阿拉伯半岛处于四分五裂的状态，社会矛盾尖锐。穆罕默德创立伊斯兰教，以宗教为纽带，实现了阿拉伯半岛的统一，为阿拉伯帝国的建立奠定了基础。阿拉伯帝国不仅疆域辽阔，文化也十分繁荣，对世界文化的发展产生了深远影响。"},{"id":"g3_history_011_ex01","knowledge_id":"g3_history_011","question":"选择题：文艺复兴最早兴起于哪个国家？（  ）\nA. 英国\nB. 法国\nC. 意大利\nD. 德国","answer":"答案：C\n解析：14世纪中叶，文艺复兴在意大利兴起，15、16世纪，文艺复兴开始向其他国家和地区传播，英国和法国是文艺复兴后期的中心。文艺复兴之所以最早兴起于意大利，是因为意大利最早出现资本主义萌芽，而且保存了大量希腊罗马古典文化。"},{"id":"g3_history_011_ex02","knowledge_id":"g3_history_011","question":"填空题：文艺复兴的核心思想是______，要求建立以______为中心的生活哲学，提倡发扬人的个性。文艺复兴是一场反对教会______和提倡______的新文化运动。","answer":"答案：人文主义；人；神权至上；人文主义\n解析：文艺复兴的核心思想是人文主义，要求建立以人为中心而不是以神为中心的生活哲学，提倡发扬人的个性，追求享受现世生活。文艺复兴是一场反对教会神权至上和提倡人文主义的新文化运动，促进了人们思想的大解放，为欧洲资本主义社会的产生和发展奠定了思想文化基础。"},{"id":"g3_history_011_ex03","knowledge_id":"g3_history_011","question":"选择题：文艺复兴的实质是什么？（  ）\nA. 古希腊、古罗马文化的复兴\nB. 资产阶级思想文化运动\nC. 封建文化的复兴\nD. 宗教改革运动","answer":"答案：B\n解析：文艺复兴运动采取复兴古代希腊罗马文化的方式，但对古典文化并非是简单的'复兴'，这其中有继承，更有创新。文艺复兴的实质是资产阶级性质的思想文化运动，它为欧洲资本主义社会的产生和发展奠定了思想文化基础。"},{"id":"g3_history_011_ex04","knowledge_id":"g3_history_011","question":"简答题：文艺复兴有何历史意义？","answer":"答案：\n1. 文艺复兴是一场反对教会神权至上和提倡人文主义的新文化运动，促进了人们思想的大解放；\n2. 文艺复兴延续了近300年之久，涌现出了许多文学家、思想家和艺术家，他们推动了欧洲文化思想领域的繁荣；\n3. 文艺复兴为欧洲资本主义社会的产生和发展奠定了思想文化基础；\n4. 文艺复兴创造了灿烂的文化成就，在文学、艺术、思想等领域都取得了巨大成就；\n5. 文艺复兴解放了人们的思想，为后来的宗教改革、启蒙运动奠定了思想基础。\n解析：文艺复兴是14—16世纪在欧洲兴起的一场思想文化运动，它以人文主义为核心，反对教会的神权至上，提倡发扬人的个性。文艺复兴不仅创造了灿烂的文化成就，更重要的是它解放了人们的思想，为欧洲资本主义社会的产生和发展奠定了思想文化基础。"},{"id":"g3_history_011_ex05","knowledge_id":"g3_history_011","question":"材料分析题：阅读下列材料，回答问题。\n材料：'这是一个需要巨人而且产生了巨人——在思维能力、热情和性格方面，在多才多艺和学识渊博方面的巨人的时代。'\n——恩格斯\n请回答：（1）恩格斯所说的'时代'指的是什么时代？（2）这一时代的核心思想是什么？（3）这一时代有什么历史意义？","answer":"答案：\n（1）恩格斯所说的'时代'指的是文艺复兴时代。\n（2）这一时代的核心思想是人文主义，要求建立以人为中心而不是以神为中心的生活哲学，提倡发扬人的个性，追求享受现世生活。\n（3）历史意义：\n① 文艺复兴是一场反对教会神权至上和提倡人文主义的新文化运动，促进了人们思想的大解放；\n② 文艺复兴延续了近300年之久，涌现出了许多文学家、思想家和艺术家，他们推动了欧洲文化思想领域的繁荣；\n③ 文艺复兴为欧洲资本主义社会的产生和发展奠定了思想文化基础。\n解析：文艺复兴时期是一个人才辈出的时代，涌现出了但丁、达·芬奇、莎士比亚等许多文化巨人。恩格斯的这段话高度评价了文艺复兴时期人才辈出的盛况。文艺复兴不仅创造了灿烂的文化，更重要的是它解放了人们的思想，为欧洲资本主义的发展奠定了思想基础。"},{"id":"g3_history_011_ex06","knowledge_id":"g3_history_011","question":"填空题：文艺复兴的先驱是______，他的代表作是《______》。文艺复兴'美术三杰'是______、______、______。","answer":"答案：但丁；神曲；达·芬奇；拉斐尔；米开朗琪罗\n解析：但丁是文艺复兴的先驱，他的代表作是长篇诗作《神曲》。达·芬奇、拉斐尔、米开朗琪罗并称为文艺复兴'美术三杰'，达·芬奇的代表作有《蒙娜丽莎》《最后的晚餐》等，拉斐尔的代表作有《西斯廷圣母》等，米开朗琪罗的代表作有《大卫》等。"},{"id":"g3_history_011_ex07","knowledge_id":"g3_history_011","question":"选择题：下列人物中，不属于文艺复兴时期的是（  ）\nA. 但丁\nB. 达·芬奇\nC. 莎士比亚\nD. 伏尔泰","answer":"答案：D\n解析：伏尔泰是启蒙运动时期的代表人物，不是文艺复兴时期的。但丁是文艺复兴的先驱，达·芬奇是文艺复兴'美术三杰'之一，莎士比亚是文艺复兴时期英国最著名的文学家。A、B、C选项中的人物都是文艺复兴时期的代表人物。"},{"id":"g3_history_011_ex08","knowledge_id":"g3_history_011","question":"简答题：文艺复兴为什么最早兴起于意大利？","answer":"答案：\n1. 经济基础：14世纪中叶，意大利的佛罗伦萨、威尼斯等地，工商业已经有了一定的发展，一些城市出现了资本主义萌芽，这是文艺复兴兴起的根本原因；\n2. 阶级基础：形成中的资产阶级不满罗马教廷对精神世界的控制，要求建立一种以人为中心而不是以神为中心的生活哲学；\n3. 文化基础：意大利保存了大量希腊罗马古典文化，有丰富的文化遗产；\n4. 人才基础：意大利有众多的人才，他们对古典文化有着深厚的研究。\n解析：文艺复兴最早兴起于意大利，不是偶然的，而是有其深刻的经济、政治、文化等方面的原因。其中，资本主义萌芽的出现是根本原因，形成中的资产阶级是文艺复兴的阶级基础，意大利丰富的古典文化遗产则为文艺复兴提供了文化基础。"},{"id":"g3_history_011_ex09","knowledge_id":"g3_history_011","question":"选择题：文艺复兴时期文学巨匠莎士比亚的代表作是（  ）\nA. 《神曲》\nB. 《哈姆雷特》\nC. 《蒙娜丽莎》\nD. 《最后的晚餐》","answer":"答案：B\n解析：莎士比亚是文艺复兴时期英国最著名的文学家，他的代表作有《哈姆雷特》《罗密欧与朱丽叶》等。《神曲》是但丁的代表作，《蒙娜丽莎》《最后的晚餐》是达·芬奇的代表作。"},{"id":"g3_history_011_ex10","knowledge_id":"g3_history_011","question":"材料分析题：阅读下列材料，回答问题。\n材料：'人是一件多么了不起的杰作！多么高贵的理性！多么伟大的力量！多么优美的仪表！多么文雅的举动！在行为上多么像一个天使！在智慧上多么像一个天神！宇宙的精华！万物的灵长！'\n——莎士比亚《哈姆雷特》\n请回答：（1）材料反映了文艺复兴时期的什么思想？（2）这一思想的核心内容是什么？（3）文艺复兴有何历史意义？","answer":"答案：\n（1）材料反映了文艺复兴时期的人文主义思想。\n（2）人文主义思想的核心内容是：要求建立以人为中心而不是以神为中心的生活哲学，提倡发扬人的个性，追求享受现世生活，肯定人的价值和尊严。\n（3）历史意义：\n① 文艺复兴是一场反对教会神权至上和提倡人文主义的新文化运动，促进了人们思想的大解放；\n② 文艺复兴推动了欧洲文化思想领域的繁荣；\n③ 文艺复兴为欧洲资本主义社会的产生和发展奠定了思想文化基础。\n解析：这段材料出自莎士比亚的《哈姆雷特》，它热情讴歌了人的伟大和高贵，充分体现了人文主义思想。人文主义是文艺复兴的核心思想，它反对教会的神权至上，提倡以人为中心，肯定人的价值和尊严。文艺复兴运动解放了人们的思想，为欧洲资本主义社会的产生和发展奠定了思想文化基础。"},{"id":"g3_history_012_ex01","knowledge_id":"g3_history_012","question":"选择题：发现美洲新大陆的航海家是（  ）\nA. 迪亚士\nB. 哥伦布\nC. 达·伽马\nD. 麦哲伦","answer":"答案：B\n解析：1492年8月，受西班牙王室资助，哥伦布率领由87名船员和3艘船组成的船队从西班牙出发，开始横渡大西洋。10月，到达巴哈马群岛中的圣萨尔瓦多岛，后来又发现了古巴和海地。哥伦布认为他到达的是亚洲的印度，所以称当地居民为印第安人，实际上他发现的是美洲新大陆。"},{"id":"g3_history_012_ex02","knowledge_id":"g3_history_012","question":"填空题：1487年______到达好望角，1492年______发现美洲新大陆，1497年______到达印度，1519-1522年______船队完成环球航行。","answer":"答案：迪亚士；哥伦布；达·伽马；麦哲伦\n解析：新航路开辟过程中的重要航海家及其成就：1487年迪亚士到达非洲好望角；1492年哥伦布发现美洲新大陆；1497年达·伽马到达印度；1519-1522年麦哲伦船队完成环球航行，证明了地圆说的正确。"},{"id":"g3_history_012_ex03","knowledge_id":"g3_history_012","question":"选择题：首次完成环球航行，证明地圆说正确的船队是（  ）\nA. 迪亚士船队\nB. 哥伦布船队\nC. 达·伽马船队\nD. 麦哲伦船队","answer":"答案：D\n解析：1519年，麦哲伦奉西班牙国王之命，继续寻找盛产黄金和香料的亚洲。经过3年的航程，船队穿越大西洋、太平洋和印度洋，于1522年返回欧洲。这次航行是世界航海史上的一次创举，麦哲伦成为第一位横渡太平洋的欧洲人，他的船队第一次完成了环球航行，证明了地圆说的正确。"},{"id":"g3_history_012_ex04","knowledge_id":"g3_history_012","question":"简答题：新航路开辟有何历史意义？","answer":"答案：\n1. 新航路开辟以后，欧洲大西洋沿岸工商业经济繁荣起来，促进了资本主义的产生和发展；\n2. 欧洲与亚洲、非洲、美洲之间建立起了直接的商业联系，往来日益密切；\n3. 世界开始连为一个整体，世界的观念也从此逐步确立起来；\n4. 新航路的开辟，也引发了欧洲人殖民扩张的狂潮，给亚非拉人民带来了深重灾难；\n5. 新航路的开辟，证明了地圆说的正确，推动了科学的发展。\n解析：新航路的开辟，对世界历史产生了深远影响。它打破了世界各地相对孤立的状态，世界开始连为一个整体，世界的观念也从此逐步确立起来。同时，新航路的开辟也促进了欧洲资本主义的发展，引发了欧洲国家的殖民扩张。"},{"id":"g3_history_012_ex05","knowledge_id":"g3_history_012","question":"材料分析题：阅读下列材料，回答问题。\n材料：'黄金是一切商品中最宝贵的，黄金是财富，谁占有黄金，就能获得他在世上所需要的一切，同时也就取得把灵魂从炼狱中拯救出来，并使灵魂重享天堂之乐的手段。'\n——哥伦布\n请回答：（1）材料反映了哥伦布航海的直接动力是什么？（2）新航路开辟的根本原因是什么？（3）哥伦布的主要贡献是什么？","answer":"答案：\n（1）材料反映了哥伦布航海的直接动力是对黄金的狂热追求，获取财富。\n（2）新航路开辟的根本原因是欧洲商品经济的发展和资本主义萌芽的出现，要求扩大海外市场，获得更多的财富。\n（3）哥伦布的主要贡献是1492年率领船队横渡大西洋，发现了美洲新大陆，打破了美洲与其他地区相对隔绝的状态。\n解析：对黄金的狂热追求是新航路开辟的社会根源，而欧洲商品经济的发展和资本主义萌芽的出现则是新航路开辟的根本原因。哥伦布虽然没有到达他梦想中的东方，但他发现了美洲新大陆，这一发现对世界历史产生了深远影响。"},{"id":"g3_history_012_ex06","knowledge_id":"g3_history_012","question":"填空题：新航路开辟以后，欧洲______沿岸工商业经济繁荣起来，促进了资本主义的产生和发展。世界开始连为______，世界的观念也从此逐步确立起来。","answer":"答案：大西洋；一个整体\n解析：新航路开辟以后，欧洲大西洋沿岸工商业经济繁荣起来，促进了资本主义的产生和发展。同时，欧洲与亚洲、非洲、美洲之间建立起了直接的商业联系，往来日益密切。世界开始连为一个整体，世界的观念也从此逐步确立起来。"},{"id":"g3_history_012_ex07","knowledge_id":"g3_history_012","question":"选择题：下列关于新航路开辟的说法，错误的是（  ）\nA. 迪亚士到达了好望角\nB. 哥伦布到达了印度\nC. 达·伽马到达了印度\nD. 麦哲伦船队完成了环球航行","answer":"答案：B\n解析：B选项错误，哥伦布没有到达印度，他到达的是美洲，但他认为自己到达的是亚洲的印度，所以称当地居民为印第安人。A、C、D选项的说法都是正确的，迪亚士到达了好望角，达·伽马到达了印度，麦哲伦船队完成了环球航行。"},{"id":"g3_history_012_ex08","knowledge_id":"g3_history_012","question":"简答题：新航路开辟的原因有哪些？","answer":"答案：\n根本原因：\n1. 欧洲商品经济的发展和资本主义萌芽的出现，要求扩大海外市场，获得更多的财富，这是新航路开辟的根本原因。\n社会原因：\n2. 欧洲人对黄金的狂热追求，《马可·波罗行纪》激起了欧洲人对东方的向往。\n商业原因：\n3. 奥斯曼土耳其帝国控制了东西方之间的商路，使得东方运往欧洲的商品价格昂贵，欧洲人迫切需要寻找一条通往东方的新航路。\n客观条件：\n4. 地圆学说的流行、造船技术的进步、航海技术的提高、指南针的应用等，为新航路的开辟提供了客观条件。\n解析：新航路的开辟不是偶然的，而是有其深刻的经济根源、社会根源和商业危机，同时也具备了一定的客观条件。根本原因是欧洲商品经济的发展和资本主义萌芽的出现，而对黄金的狂热追求则是新航路开辟的社会动力。"},{"id":"g3_history_012_ex09","knowledge_id":"g3_history_012","question":"选择题：第一个找到从西欧直通东方国家新航路的航海家是（  ）\nA. 迪亚士\nB. 哥伦布\nC. 达·伽马\nD. 麦哲伦","answer":"答案：C\n解析：1497年，达·伽马从葡萄牙出发，绕过好望角，溯非洲东海岸北上，横渡印度洋，1498年到达印度西海岸。达·伽马第一个找到了从西欧直通东方国家的新航路，带回了大量香料、黄金，获得了高额利润。"},{"id":"g3_history_012_ex10","knowledge_id":"g3_history_012","question":"材料分析题：阅读下列材料，回答问题。\n材料：'新航路开辟以后，欧洲大西洋沿岸工商业经济繁荣起来，促进了资本主义的产生和发展。同时，欧洲与亚洲、非洲、美洲之间建立起了直接的商业联系，往来日益密切。世界开始连为一个整体，世界的观念也从此逐步确立起来。'\n请回答：（1）新航路开辟后，欧洲的商贸中心发生了什么变化？（2）为什么说'世界开始连为一个整体'？（3）新航路开辟对世界历史的发展有什么影响？","answer":"答案：\n（1）新航路开辟后，欧洲的商贸中心从地中海地区转移到大西洋沿岸。\n（2）因为新航路开辟以后，欧洲与亚洲、非洲、美洲之间建立起了直接的商业联系，往来日益密切，打破了世界各地相对孤立的状态，所以说'世界开始连为一个整体'。\n（3）影响：\n① 新航路开辟以后，欧洲大西洋沿岸工商业经济繁荣起来，促进了资本主义的产生和发展；\n② 欧洲与亚洲、非洲、美洲之间建立起了直接的商业联系，往来日益密切；\n③ 世界开始连为一个整体，世界的观念也从此逐步确立起来；\n④ 新航路的开辟也引发了欧洲人殖民扩张的狂潮，给亚非拉人民带来了深重灾难。\n解析：新航路的开辟是人类历史上的一个重要转折点，它打破了世界各地相对孤立的状态，世界开始连为一个整体。同时，新航路的开辟也促进了欧洲资本主义的发展，改变了世界格局。但我们也要看到，新航路的开辟也带来了殖民扩张和掠夺，给亚非拉人民带来了深重灾难。"},{"id":"g3_history_013_ex01","knowledge_id":"g3_history_013","question":"选择题：最早进行殖民的国家是（  ）\nA. 英国和法国\nB. 葡萄牙和西班牙\nC. 荷兰和英国\nD. 西班牙和英国","answer":"答案：B\n解析：新航路开辟后，最早进行殖民的国家是葡萄牙和西班牙。葡萄牙人在亚、非、拉美建立了一些殖民据点与商站，控制了从印度洋到太平洋的海上通道。西班牙凭借'无敌舰队'，在美洲建立起一个殖民大帝国。"},{"id":"g3_history_013_ex02","knowledge_id":"g3_history_013","question":"填空题：三角贸易的路线是：从______出发，乘船到______，掳获黑奴后运往______，卖给当地的种植园主，再把殖民地的金银和工业原料运回______。","answer":"答案：欧洲；非洲；美洲；欧洲\n解析：三角贸易的路线是：从欧洲出发，乘船到非洲，在非洲通过各种卑鄙的方式掳获黑奴后运往美洲，把黑奴卖给美洲的种植园主，然后，再把美洲的金银和工业原料运回欧洲。因为贸易路线呈三角形，因此称为'三角贸易'。"},{"id":"g3_history_013_ex03","knowledge_id":"g3_history_013","question":"选择题：有'海上马车夫'之称的是哪个国家？（  ）\nA. 葡萄牙\nB. 西班牙\nC. 荷兰\nD. 英国","answer":"答案：C\n解析：荷兰一度控制着波罗的海、印度及美洲的全部贸易，因而有'海上马车夫'之称。进入17世纪，荷兰加入殖民掠夺行列，入侵印度尼西亚的爪哇岛；从葡萄牙人手中夺取了马六甲和锡兰；一度强占了中国的台湾；在非洲的好望角建立了殖民地；在北美洲建立了新尼德兰殖民地。"},{"id":"g3_history_013_ex04","knowledge_id":"g3_history_013","question":"简答题：如何评价早期殖民掠夺？","answer":"答案：\n对殖民国家来说：\n1. 客观上有助于欧洲殖民国家的资本原始积累，有助于世界市场逐渐形成；\n2. 加速了欧洲资本主义的发展，为工业革命准备了条件。\n对殖民地人民来说：\n1. 给殖民地人民带来了深重灾难，造成了亚非拉地区的长期贫穷和落后；\n2. 殖民者掠夺了殖民地的大量财富，奴役和屠杀当地居民。\n客观进步性：\n1. 欧洲文化传到殖民地，对殖民地社会的发展产生了深远的影响；\n2. 世界各地区之间的经济联系日益密切，世界市场逐渐形成。\n解析：早期殖民掠夺具有双重性，既有罪恶的一面，也有客观进步的一面。我们要全面、客观地评价早期殖民掠夺，既要看到它给殖民地人民带来的深重灾难，也要看到它在客观上促进了世界市场的形成和欧洲资本主义的发展。"},{"id":"g3_history_013_ex05","knowledge_id":"g3_history_013","question":"材料分析题：阅读下列材料，回答问题。\n材料：'三角贸易'中，黑奴被当作商品一样贩卖。运奴船经常超载，一个舱里塞进几百个黑奴，挤在一起，空气污浊，水和食物都不够吃，传染病流行。黑奴死亡率很高，死去的黑奴就被扔进大海。\n请回答：（1）材料反映的是什么历史事件？（2）这一事件的路线是怎样的？（3）如何评价这一历史事件？","answer":"答案：\n（1）材料反映的是三角贸易（黑奴贸易）。\n（2）三角贸易的路线：从欧洲出发，乘船到非洲，在非洲通过各种卑鄙的方式掳获黑奴后运往美洲，把黑奴卖给美洲的种植园主，然后，再把美洲的金银和工业原料运回欧洲。\n（3）评价：\n① 罪恶性：三角贸易给非洲带来了深重灾难，使非洲丧失了近亿的精壮劳力，造成了非洲的长期贫穷和落后；黑奴贸易充满了血腥和暴力，是人类历史上黑暗的一页。\n② 客观作用：三角贸易为欧洲带来了巨额利润，加速了资本原始积累，促进了欧洲资本主义的发展；同时，黑奴贸易也在客观上促进了世界各地之间的经济联系。\n解析：三角贸易是早期殖民掠夺的重要表现之一，它充满了血腥和暴力，给非洲人民带来了深重灾难。但同时，三角贸易也为欧洲资本主义的发展积累了大量原始资本，在客观上促进了世界市场的形成。我们要全面、客观地评价这一历史事件。"},{"id":"g3_history_013_ex06","knowledge_id":"g3_history_013","question":"填空题：1588年，英国海军在英吉利海峡与______的'无敌舰队'进行了一场以少胜多的大海战。英国逐渐成为海上霸主，开始在海外扩张殖民地。到18世纪后半期，英国成为世界上最强大的殖民国家，号称'______'。","answer":"答案：西班牙；日不落帝国\n解析：1588年，英国海军在英吉利海峡与西班牙的'无敌舰队'进行了一场以少胜多的大海战，'无敌舰队'几乎全军覆灭。英国逐渐成为海上霸主，开始在海外扩张殖民地。到18世纪后半期，英国在世界各大洲建立了殖民地，号称'日不落帝国'。"},{"id":"g3_history_013_ex07","knowledge_id":"g3_history_013","question":"选择题：下列关于早期殖民掠夺的说法，错误的是（  ）\nA. 最早进行殖民的国家是葡萄牙和西班牙\nB. 荷兰有'海上马车夫'之称\nC. 英国最终打败荷兰和法国，成为'日不落帝国'\nD. 早期殖民掠夺只给殖民地带来了灾难，没有任何积极影响","answer":"答案：D\n解析：D选项错误，早期殖民掠夺虽然给殖民地人民带来了深重灾难，但在客观上也有一定的积极影响，比如欧洲文化传到殖民地，对殖民地社会的发展产生了深远的影响；同时，世界各地区之间的经济联系日益密切，世界市场逐渐形成。A、B、C选项的说法都是正确的。"},{"id":"g3_history_013_ex08","knowledge_id":"g3_history_013","question":"简答题：英国是如何成为'日不落帝国'的？","answer":"答案：\n1. 1588年，英国海军在英吉利海峡与西班牙的'无敌舰队'进行了一场以少胜多的大海战，'无敌舰队'几乎全军覆灭，英国逐渐成为海上霸主，开始在海外扩张殖民地；\n2. 17世纪，英国在北美建立了殖民地，建立了种植园，也开始从事贩卖非洲黑奴的活动；\n3. 从17世纪下半叶起，英国与荷兰、法国发生了一系列战争，英国凭借强大的实力最终战胜了荷兰和法国，在世界各地夺取了大片殖民地；\n4. 到18世纪后半期，英国成为世界上最强大的殖民国家，在世界各大洲建立了殖民地，号称'日不落帝国'。\n解析：英国成为'日不落帝国'经历了一个长期的过程。它首先打败了西班牙的'无敌舰队'，逐渐成为海上霸主，然后又通过英荷战争、英法战争，先后打败了荷兰和法国，最终确立了世界殖民霸权，号称'日不落帝国'。"},{"id":"g3_history_013_ex09","knowledge_id":"g3_history_013","question":"选择题：'三角贸易'的出发点和终点都是（  ）\nA. 非洲\nB. 美洲\nC. 欧洲\nD. 亚洲","answer":"答案：C\n解析：三角贸易的路线是：从欧洲出发，乘船到非洲，在非洲掳获黑奴后运往美洲，把黑奴卖给美洲的种植园主，然后，再把美洲的金银和工业原料运回欧洲。所以，三角贸易的出发点和终点都是欧洲。"},{"id":"g3_history_013_ex10","knowledge_id":"g3_history_013","question":"材料分析题：阅读下列材料，回答问题。\n材料：马克思说：'资本来到世间，从头到脚，每个毛孔都滴着血和肮脏的东西。'\n请回答：（1）结合所学知识，举例说明资本原始积累的血腥性。（2）如何正确认识殖民扩张的影响？","answer":"答案：\n（1）资本原始积累的血腥性表现在：\n① 三角贸易：欧洲殖民者从非洲掳获黑奴，运往美洲贩卖，黑奴贸易充满了血腥和暴力，使非洲丧失了近亿的精壮劳力；\n② 殖民掠夺：欧洲殖民者在殖民地掠夺了大量的黄金、白银，奴役和屠杀当地居民，给殖民地人民带来了深重灾难；\n③ 种族灭绝：欧洲殖民者在美洲对印第安人实行种族灭绝政策，导致印第安人人口锐减。\n（2）殖民扩张的影响：\n对殖民国家：客观上有助于欧洲殖民国家的资本原始积累，有助于世界市场逐渐形成，促进了欧洲资本主义的发展。\n对殖民地：给殖民地人民带来了深重灾难，造成了亚非拉地区的长期贫穷和落后；但同时，欧洲文化传到殖民地，对殖民地社会的发展也产生了深远的影响。\n对世界：加强了世界各地之间的联系，世界市场逐渐形成。\n解析：马克思的这句话深刻揭示了资本原始积累的血腥性。早期殖民掠夺是资本原始积累的重要方式之一，它充满了暴力和血腥，给殖民地人民带来了深重灾难。但同时，我们也要看到殖民扩张在客观上的进步作用，要全面、客观地评价历史事件。"},{"id":"g3_history_014_ex01","knowledge_id":"g3_history_014","question":"选择题：英国资产阶级革命开始的标志是（  ）\nA. 苏格兰人民起义\nB. 1640年议会重新召开\nC. 查理一世被推上断头台\nD. 光荣革命","answer":"答案：B\n解析：1640年，英国议会重新召开，议员们不断抨击国王专权，查理一世恼羞成怒，派军队闯入议会，企图逮捕反对他的议员，挑起了内战。因此，1640年议会重新召开标志着英国资产阶级革命的开始。"},{"id":"g3_history_014_ex02","knowledge_id":"g3_history_014","question":"填空题：英国资产阶级革命结束的标志是1688年的______。1689年，议会通过了《______》，限制了王权，逐渐形成了______制。","answer":"答案：光荣革命；权利法案；君主立宪\n解析：1688年，英国发生政变，议会作出决定：废黜詹姆士二世，迎请他的女儿玛丽和女婿威廉入主英国，这次政变史称'光荣革命'，标志着英国资产阶级革命的结束。1689年，议会通过了《权利法案》，对国王的权力进行了明确的制约，确立了议会在国家政治生活中的最高地位，逐渐形成了君主立宪制。"},{"id":"g3_history_014_ex03","knowledge_id":"g3_history_014","question":"选择题：《权利法案》的颁布标志着英国确立了什么政治制度？（  ）\nA. 君主专制\nB. 民主共和制\nC. 君主立宪制\nD. 联邦制","answer":"答案：C\n解析：1689年，英国议会通过了《权利法案》，对国王的权力进行了明确的制约，规定不经议会的批准，国王不能征税，也不能在和平时期维持常备军；同时，还规定国王既不能随意废除法律，也不能停止法律的执行。这样，君主立宪制的资产阶级统治开始确立起来。"},{"id":"g3_history_014_ex04","knowledge_id":"g3_history_014","question":"简答题：英国资产阶级革命有何历史意义？","answer":"答案：\n1. 英国资产阶级革命推翻了封建君主专制，为英国资本主义的迅速发展扫清了道路；\n2. 英国资产阶级革命确立了君主立宪制的资产阶级统治，是人类历史上资本主义制度对封建制度的一次重大胜利；\n3. 英国资产阶级革命揭开了欧洲和北美资产阶级革命运动的序幕，推动了世界历史的发展进程；\n4. 英国资产阶级革命是世界近代史的开端。\n解析：英国资产阶级革命是人类历史上资本主义制度对封建制度的一次重大胜利，它推翻了封建君主专制，确立了君主立宪制的资产阶级统治，为英国资本主义的迅速发展扫清了道路。同时，英国资产阶级革命也揭开了欧洲和北美资产阶级革命运动的序幕，推动了世界历史的发展进程。"},{"id":"g3_history_014_ex05","knowledge_id":"g3_history_014","question":"材料分析题：阅读下列材料，回答问题。\n材料：'凡未经议会同意，以国王权威停止法律或停止法律实施之僭越权力，为非法权力。''凡未经议会准许，借口国王特权，为国王而征收，或供国王使用而征收金钱，超出议会准许之时限或方式者，皆为非法。'\n请回答：（1）上述材料出自哪部法律文献？（2）这部法律文献颁布于何时？（3）这部法律文献的颁布有何意义？","answer":"答案：\n（1）上述材料出自《权利法案》。\n（2）这部法律文献颁布于1689年。\n（3）意义：\n① 《权利法案》对国王的权力进行了明确的制约，确立了议会在国家政治生活中的最高地位；\n② 君主立宪制的资产阶级统治开始在英国确立起来；\n③ 为英国资本主义的迅速发展扫清了道路；\n④ 对其他国家的政治制度产生了深远影响。\n解析：《权利法案》是英国资产阶级革命中的重要法律文件，它限制了国王的权力，确立了议会至上的原则，标志着君主立宪制的资产阶级统治在英国开始确立起来。《权利法案》的颁布，为英国资本主义的迅速发展扫清了道路，也对世界其他国家的政治制度产生了深远影响。"},{"id":"g3_history_014_ex06","knowledge_id":"g3_history_014","question":"填空题：英国资产阶级革命的领导人是______。1649年，______被推上断头台，英国成立了共和国。","answer":"答案：克伦威尔；查理一世\n解析：克伦威尔是英国资产阶级革命的领导人，他率领议会军打败了国王的军队，取得了内战的胜利。1649年，查理一世被推上断头台，英国成立了共和国。共和国时期，克伦威尔掌握了政权，担任'护国主'，实行有利于资产阶级和新贵族的政策。"},{"id":"g3_history_014_ex07","knowledge_id":"g3_history_014","question":"选择题：下列关于英国资产阶级革命的说法，错误的是（  ）\nA. 开始的标志是1640年议会重新召开\nB. 处死了国王查理一世\nC. 1688年光荣革命标志着革命结束\nD. 革命后确立了民主共和制","answer":"答案：D\n解析：D选项错误，英国资产阶级革命后确立的是君主立宪制，不是民主共和制。1689年，英国议会通过了《权利法案》，对国王的权力进行了明确的制约，君主立宪制的资产阶级统治开始确立起来。A、B、C选项的说法都是正确的。"},{"id":"g3_history_014_ex08","knowledge_id":"g3_history_014","question":"简答题：为什么说英国资产阶级革命具有曲折性和不彻底性？","answer":"答案：\n曲折性：\n1. 英国资产阶级革命经历了议会斗争、内战、共和国建立、克伦威尔独裁、斯图亚特王朝复辟、光荣革命等曲折的过程；\n2. 革命过程中出现了多次反复，比如斯图亚特王朝的复辟，说明革命不是一帆风顺的。\n不彻底性：\n1. 英国资产阶级革命确立了君主立宪制，保留了国王，虽然国王没有实权，但毕竟保留了君主制；\n2. 革命后，资产阶级和新贵族联合执政，土地贵族的势力仍然很大；\n3. 革命没有彻底废除封建土地所有制，农民的土地问题没有得到解决。\n原因：\n英国资本主义发展不充分，资产阶级力量相对较弱，而封建势力还比较强大，资产阶级和新贵族不得不与封建势力妥协，这就决定了英国资产阶级革命的曲折性和不彻底性。\n解析：英国资产阶级革命经历了近半个世纪的曲折斗争，最终确立了君主立宪制。革命之所以具有曲折性和不彻底性，是由英国当时的国情决定的，英国资本主义发展不充分，资产阶级力量相对较弱，不得不与封建势力妥协。但总的来说，英国资产阶级革命仍然是一次成功的革命，它为英国资本主义的发展扫清了道路。"},{"id":"g3_history_014_ex09","knowledge_id":"g3_history_014","question":"选择题：1688年宫廷政变被称为'光荣革命'，主要是因为（  ）\nA. 政变推翻了封建统治\nB. 政变是资产阶级和新贵族与封建势力的妥协\nC. 政变没有经过流血冲突而获得成功\nD. 政变使资产阶级和新贵族掌握了政权","answer":"答案：C\n解析：1688年，英国资产阶级和新贵族联合其他不满国王专制统治的人士发动宫廷政变，推翻了专制统治，另立新的国王。这次政变没有经过流血冲突而获得成功，因此被称为'光荣革命'。光荣革命标志着英国资产阶级革命的结束。"},{"id":"g3_history_014_ex10","knowledge_id":"g3_history_014","question":"材料分析题：阅读下列材料，回答问题。\n材料：'1640年的革命和1789年的革命，并不是英国的革命和法国的革命，这是欧洲范围的革命。它们不是社会中某一阶级对旧政治制度的胜利，它们宣告了欧洲新社会的政治制度。'\n——马克思《资产阶级和反革命》\n请回答：（1）材料中的'1640年的革命'指的是什么革命？（2）这次革命有什么历史意义？（3）为什么说'这是欧洲范围的革命'？","answer":"答案：\n（1）材料中的'1640年的革命'指的是英国资产阶级革命。\n（2）历史意义：\n① 英国资产阶级革命推翻了封建君主专制，为英国资本主义的迅速发展扫清了道路；\n② 确立了君主立宪制的资产阶级统治，是人类历史上资本主义制度对封建制度的一次重大胜利；\n③ 揭开了欧洲和北美资产阶级革命运动的序幕，推动了世界历史的发展进程。\n（3）因为英国资产阶级革命不仅对英国的历史发展产生了深远影响，而且揭开了欧洲和北美资产阶级革命运动的序幕，推动了世界历史的发展进程，标志着世界近代史的开端，所以说'这是欧洲范围的革命'。\n解析：马克思的这段话高度评价了英国资产阶级革命的历史意义。英国资产阶级革命不仅是英国的革命，也是欧洲范围的革命，它揭开了欧洲和北美资产阶级革命运动的序幕，推动了世界历史的发展进程。英国资产阶级革命的胜利，是人类历史上资本主义制度对封建制度的一次重大胜利。"},{"id":"g3_history_015_ex01","knowledge_id":"g3_history_015","question":"选择题：美国独立战争爆发的标志是（  ）\nA. 波士顿倾茶事件\nB. 来克星顿的枪声\nC. 萨拉托加大捷\nD. 《独立宣言》的发表","answer":"答案：B\n解析：1775年4月19日凌晨，800名开赴波士顿西北郊搜查军火的英军，在来克星顿与埋伏在那里的武装村民交火，美国独立战争爆发。来克星顿的枪声是美国独立战争爆发的标志。"},{"id":"g3_history_015_ex02","knowledge_id":"g3_history_015","question":"填空题：1776年7月4日，大陆会议发表《______》，宣告北美13个殖民地脱离英国而独立。1777年的______是美国独立战争的转折点。1787年美国宪法确立了______原则，是世界上第一部资产阶级成文宪法。","answer":"答案：独立宣言；萨拉托加大捷；三权分立\n解析：1776年7月4日，大陆会议通过了由杰斐逊起草的《独立宣言》，宣告北美13个殖民地脱离英国而独立。1777年，一支6000余人的英军在萨拉托加陷入大陆军的包围，被迫投降，萨拉托加大捷是美国独立战争的转折点。1787年，各州派出代表齐聚费城，由华盛顿主持召开了制宪会议，经过争论和妥协，最终制定出美国宪法，宪法依据分权制衡原则设计了一个联邦制共和国，确立了三权分立原则，是世界上第一部资产阶级成文宪法。"},{"id":"g3_history_015_ex03","knowledge_id":"g3_history_015","question":"选择题：美国独立战争的转折点是（  ）\nA. 来克星顿的枪声\nB. 萨拉托加大捷\nC. 约克镇战役\nD. 《独立宣言》的发表","answer":"答案：B\n解析：1777年，一支6000余人的英军在萨拉托加陷入大陆军的包围，被迫投降。萨拉托加大捷是美国独立战争的转折点，它不仅增强了美国人民争取胜利的信心，也为美国人民抗英斗争创造了有利的国际条件。"},{"id":"g3_history_015_ex04","knowledge_id":"g3_history_015","question":"简答题：如何评价美国独立战争？","answer":"答案：\n性质：美国独立战争既是一场民族解放战争，也是一场资产阶级革命。\n意义：\n1. 美国独立战争推翻了英国的殖民统治，实现了国家的独立；\n2. 确立了比较民主的资产阶级政治体制，有利于美国资本主义的发展；\n3. 对以后欧洲和拉丁美洲的革命也起了推动作用；\n4. 1787年美国宪法确立了三权分立原则，是世界上第一部资产阶级成文宪法，对后世产生了深远影响。\n局限性：\n1. 美国独立战争没有废除南方的奴隶制度；\n2. 印第安人没有得到平等权利；\n3. 妇女地位低下。\n解析：美国独立战争具有双重性质，它既是一场民族解放战争，也是一场资产阶级革命。美国独立战争推翻了英国的殖民统治，实现了国家的独立，确立了比较民主的资产阶级政治体制，有利于美国资本主义的发展。同时，美国独立战争也对以后欧洲和拉丁美洲的革命起了推动作用。"},{"id":"g3_history_015_ex05","knowledge_id":"g3_history_015","question":"材料分析题：阅读下列材料，回答问题。\n材料：'我们以这些殖民地的善良人民的名义和权力，谨庄严宣告：这些联合殖民地从此成为、而且名正言顺地应当成为自由独立的合众国，它们解除对于英王的一切隶属关系，而它们与大不列颠王国之间的一切政治联系也应从此完全废止。'\n请回答：（1）上述材料出自哪部文献？（2）这部文献发表于何时？（3）这部文献的发表有何意义？","answer":"答案：\n（1）上述材料出自《独立宣言》。\n（2）这部文献发表于1776年7月4日。\n（3）意义：\n① 《独立宣言》宣告北美13个殖民地脱离英国而独立，标志着美国的诞生；\n② 《独立宣言》是第一个以国家名义明确表述资产阶级政治要求的纲领性文献，被称为'第一个人权宣言'；\n③ 《独立宣言》鼓舞了北美人民的斗志，成为美国人民争取独立的旗帜。\n解析：《独立宣言》是美国独立战争中的重要文献，它宣告北美13个殖民地脱离英国而独立，标志着美国的诞生。《独立宣言》不仅是美国独立的标志，也是资产阶级革命的重要文献，它所宣扬的自由、平等的思想，对世界产生了深远影响。7月4日也成为美国的独立日。"},{"id":"g3_history_015_ex06","knowledge_id":"g3_history_015","question":"填空题：美国独立战争的领导人是______。1783年，______被迫承认美国独立。美国1787年宪法确立了______、______、______三权分立的原则。","answer":"答案：华盛顿；英国；行政；立法；司法\n解析：华盛顿是美国独立战争的领导人，他率领大陆军打败了英国军队，赢得了国家独立。1783年，英国被迫承认美国独立。美国1787年宪法确立了行政、立法、司法三权分立的原则，总统、国会与最高法院及其相关机构各司其职，相互制衡，是世界上第一部资产阶级成文宪法。"},{"id":"g3_history_015_ex07","knowledge_id":"g3_history_015","question":"选择题：下列关于美国独立战争的说法，错误的是（  ）\nA. 来克星顿的枪声标志着战争的开始\nB. 《独立宣言》的发表标志着美国的诞生\nC. 萨拉托加大捷是战争的转折点\nD. 战争结束后，美国确立了君主立宪制","answer":"答案：D\n解析：D选项错误，美国独立战争结束后，美国确立了联邦制共和政体，实行三权分立，不是君主立宪制。英国确立的是君主立宪制。A、B、C选项的说法都是正确的。"},{"id":"g3_history_015_ex08","knowledge_id":"g3_history_015","question":"简答题：为什么说美国独立战争既是一场民族解放战争，也是一场资产阶级革命？","answer":"答案：\n说它是民族解放战争，是因为：\n1. 美国独立战争推翻了英国的殖民统治，实现了国家的独立；\n2. 战争的目的是为了摆脱英国的殖民统治，争取民族独立；\n3. 美国人民为了民族独立进行了英勇的斗争。\n说它是资产阶级革命，是因为：\n1. 美国独立战争扫除了资本主义发展的障碍，有利于美国资本主义的发展；\n2. 战争的领导阶级是资产阶级和种植园主；\n3. 战争后确立了资产阶级的政治体制；\n4. 战争的胜利为美国资本主义的发展开辟了道路。\n解析：美国独立战争具有双重性质，它既是一场民族解放战争，也是一场资产阶级革命。从摆脱英国殖民统治、争取民族独立的角度来看，它是一场民族解放战争；从扫除资本主义发展障碍、确立资产阶级统治的角度来看，它又是一场资产阶级革命。这两重性质在革命过程中都得到了体现。"},{"id":"g3_history_015_ex09","knowledge_id":"g3_history_015","question":"选择题：世界上第一部资产阶级成文宪法是（  ）\nA. 《权利法案》\nB. 《独立宣言》\nC. 1787年美国宪法\nD. 《人权宣言》","answer":"答案：C\n解析：1787年美国宪法是世界上第一部资产阶级成文宪法，它依据分权制衡原则设计了一个联邦制共和国：行政、立法、司法三权分立，总统、国会与最高法院及其相关机构各司其职，相互制衡；联邦政府与地方政府分享权力；总统和议员由选举产生。1787年美国宪法对后来许多国家的政治变革产生了重要影响。"},{"id":"g3_history_015_ex10","knowledge_id":"g3_history_015","question":"材料分析题：阅读下列材料，回答问题。\n材料：美国1787年宪法规定：总统既是国家元首，又是政府首脑，享有行政权；国会和最高法院分别掌握国家的立法和司法大权。\n请回答：（1）材料反映了美国宪法的什么原则？（2）这一原则是谁最早提出的？（3）1787年美国宪法有何历史地位？","answer":"答案：\n（1）材料反映了美国宪法的三权分立（分权制衡）原则，行政、立法、司法三权分立，相互制衡。\n（2）三权分立原则最早是由法国启蒙思想家孟德斯鸠提出的。\n（3）历史地位：\n① 1787年美国宪法是世界上第一部资产阶级成文宪法；\n② 它对后来许多国家的政治变革产生了重要影响；\n③ 它确立了联邦制共和政体，促进了美国资本主义的发展。\n解析：三权分立是1787年美国宪法的重要原则，它把国家权力分为行政、立法、司法三部分，分别由总统、国会和最高法院行使，三者相互制衡，防止了专制独裁。1787年美国宪法是世界上第一部资产阶级成文宪法，对世界各国的政治制度产生了深远影响。"},{"id":"g3_history_016_ex01","knowledge_id":"g3_history_016","question":"选择题：法国大革命爆发的标志是（  ）\nA. 三级会议的召开\nB. 巴黎人民攻占巴士底狱\nC. 《人权宣言》的发表\nD. 雅各宾派专政","answer":"答案：B\n解析：1789年7月14日，巴黎人民攻占了象征国王统治的巴士底狱，法国大革命开始了。攻占巴士底狱是法国大革命爆发的标志，7月14日后来成为法国的国庆日。"},{"id":"g3_history_016_ex02","knowledge_id":"g3_history_016","question":"填空题：法国大革命中，制宪议会通过了《______》，宣告了人权、法治、自由、分权、平等和保护私有财产等基本原则。法国大革命摧毁了法国的______，传播了资产阶级自由民主思想，具有世界性影响。","answer":"答案：人权宣言；君主统治\n解析：1789年8月，制宪议会通过了《人权宣言》，宣告了人权、法治、自由、分权、平等和保护私有财产等基本原则。法国大革命摧毁了法国的君主统治，传播了资产阶级自由民主思想，具有世界性影响。"},{"id":"g3_history_016_ex03","knowledge_id":"g3_history_016","question":"选择题：将法国大革命推向高潮的是（  ）\nA. 攻占巴士底狱\nB. 《人权宣言》的发表\nC. 雅各宾派专政\nD. 拿破仑发动政变","answer":"答案：C\n解析：雅各宾派组成救国委员会，以罗伯斯庇尔为首的雅各宾派采取了一系列严厉措施，平息了国内叛乱，打退了反法联盟的进攻，把法国大革命推向高潮。但雅各宾派的一些政策也引起了一些人的不满，最终罗伯斯庇尔等人在政变中被送上断头台，法国大革命高潮结束。"},{"id":"g3_history_016_ex04","knowledge_id":"g3_history_016","question":"简答题：法国大革命有何历史意义？","answer":"答案：\n1. 法国大革命摧毁了法国的君主统治，传播了资产阶级自由民主思想，具有世界性影响；\n2. 法国大革命是世界近代史上规模最大、最彻底的资产阶级革命，它不仅结束了法国一千多年的封建统治，而且震撼了整个欧洲大陆的封建秩序；\n3. 法国大革命传播了自由、平等、民主的思想，对世界历史的发展产生了深远影响；\n4. 法国大革命为资本主义的发展开辟了道路，促进了法国资本主义的发展；\n5. 《人权宣言》成为资产阶级反封建斗争的旗帜，对后世产生了深远影响。\n解析：法国大革命是世界近代史上一次重要的资产阶级革命，它不仅结束了法国的封建统治，而且对世界历史的发展产生了深远影响。法国大革命传播了自由、平等、民主的思想，动摇了欧洲封建统治的基础，推动了世界历史的发展进程。"},{"id":"g3_history_016_ex05","knowledge_id":"g3_history_016","question":"材料分析题：阅读下列材料，回答问题。\n材料：'人生来而且始终是自由的，在权利上是平等的。' '在法律面前，所有的公民都是平等的。' '财产是神圣不可侵犯的权利。'\n请回答：（1）上述材料出自哪部文献？（2）这部文献是在哪次革命中颁布的？（3）如何评价这部文献？","answer":"答案：\n（1）上述材料出自《人权宣言》。\n（2）这部文献是在法国大革命中颁布的。\n（3）评价：\n① 《人权宣言》宣告了人权、法治、自由、分权、平等和保护私有财产等基本原则，是法国大革命的纲领性文件；\n② 它否定了封建等级制度，体现了摧毁封建君主专制的要求，具有进步的历史意义；\n③ 它宣扬的自由、平等的思想，对世界产生了深远影响；\n④ 但它保护私有财产，实质上是维护资产阶级的利益，具有一定的局限性。\n解析：《人权宣言》是法国大革命中的重要文献，它宣扬自由、平等、民主的思想，是资产阶级反封建斗争的旗帜。《人权宣言》具有重要的历史意义，它否定了封建等级制度，体现了摧毁封建君主专制的要求，对世界历史的发展产生了深远影响。但我们也要看到它的阶级局限性，它维护的是资产阶级的利益。"},{"id":"g3_history_016_ex06","knowledge_id":"g3_history_016","question":"填空题：法国大革命爆发于______年7月14日，以______为标志。将法国大革命推向高潮的是以______为首的雅各宾派。","answer":"答案：1789；巴黎人民攻占巴士底狱；罗伯斯庇尔\n解析：1789年7月14日，巴黎人民攻占了象征国王统治的巴士底狱，法国大革命开始了。以罗伯斯庇尔为首的雅各宾派采取了一系列严厉措施，平息了国内叛乱，打退了反法联盟的进攻，把法国大革命推向高潮。"},{"id":"g3_history_016_ex07","knowledge_id":"g3_history_016","question":"选择题：下列关于法国大革命的说法，错误的是（  ）\nA. 巴黎人民攻占巴士底狱标志着革命的开始\nB. 革命中颁布了《人权宣言》\nC. 雅各宾派专政把革命推向高潮\nD. 革命后确立了君主立宪制","answer":"答案：D\n解析：D选项错误，法国大革命后并没有确立君主立宪制，而是经历了从君主制到共和制的反复，最终确立了共和制。英国资产阶级革命后确立了君主立宪制。A、B、C选项的说法都是正确的。"},{"id":"g3_history_016_ex08","knowledge_id":"g3_history_016","question":"简答题：为什么说法国大革命是世界近代史上规模最大、最彻底的资产阶级革命？","answer":"答案：\n1. 规模最大：\n① 法国大革命是世界近代史上规模最大的资产阶级革命，它不仅是一场资产阶级革命，还广泛动员了人民群众，特别是巴黎人民多次发动武装起义，推动了革命的发展；\n② 革命不仅席卷了法国，而且震撼了整个欧洲大陆的封建秩序。\n2. 最彻底：\n① 法国大革命摧毁了法国的封建统治，结束了法国一千多年的封建制度；\n② 革命不仅推翻了封建君主专制，而且还扫荡了封建势力，比较彻底地摧毁了封建制度；\n③ 革命传播了自由、平等、民主的思想，对世界历史的发展产生了深远影响；\n④ 革命的成果得到了巩固，为法国资本主义的发展开辟了道路。\n解析：法国大革命是世界近代史上规模最大、最彻底的资产阶级革命。说它规模最大，是因为它广泛动员了人民群众，席卷了整个法国，震撼了整个欧洲。说它最彻底，是因为它比较彻底地摧毁了封建制度，结束了法国一千多年的封建统治，传播了资产阶级自由民主思想，对世界历史的发展产生了深远影响。"},{"id":"g3_history_016_ex09","knowledge_id":"g3_history_016","question":"选择题：《人权宣言》是在哪次革命中颁布的？（  ）\nA. 英国资产阶级革命\nB. 美国独立战争\nC. 法国大革命\nD. 俄国十月革命","answer":"答案：C\n解析：1789年8月，法国大革命中，制宪议会通过了《人权宣言》，宣告了人权、法治、自由、分权、平等和保护私有财产等基本原则。《人权宣言》是法国大革命的纲领性文件，它否定了封建等级制度，体现了摧毁封建君主专制的要求，具有进步的历史意义。"},{"id":"g3_history_016_ex10","knowledge_id":"g3_history_016","question":"材料分析题：阅读下列材料，回答问题。\n材料：'1789年的法国大革命是资产阶级的第三次起义，这是完全抛开宗教外衣的、在政治上进行的起义。这也是第一次真正把斗争进行到底，直到交战的一方即贵族被消灭，而另一方即资产阶级获得完全胜利的起义。'\n——恩格斯\n请回答：（1）法国大革命开始于哪一年？开始的标志是什么？（2）根据材料，法国大革命有什么特点？（3）法国大革命有何历史意义？","answer":"答案：\n（1）法国大革命开始于1789年，开始的标志是巴黎人民攻占巴士底狱。\n（2）特点：\n① 完全抛开宗教外衣，在政治上进行的起义；\n② 斗争进行到底，直到贵族被消灭，资产阶级获得完全胜利；\n③ 是资产阶级革命时代规模最大、最彻底的一次革命。\n（3）历史意义：\n① 法国大革命摧毁了法国的君主统治，传播了资产阶级自由民主思想，具有世界性影响；\n② 法国大革命震撼了整个欧洲大陆的封建秩序，推动了欧洲各国的反封建斗争；\n③ 法国大革命传播了自由、平等、民主的思想，对世界历史的发展产生了深远影响；\n④ 法国大革命为资本主义的发展开辟了道路，促进了法国资本主义的发展。\n解析：恩格斯的这段话高度评价了法国大革命的历史意义。法国大革命是资产阶级革命时代规模最大、最彻底的一次革命，它不仅结束了法国的封建统治，而且震撼了整个欧洲大陆的封建秩序，对世界历史的发展产生了深远影响。"},{"id":"g3_history_017_ex01","knowledge_id":"g3_history_017","question":"选择题：第一次工业革命最早开始于哪个国家的哪个行业？（  ）\nA. 英国  冶金业\nB. 英国  棉纺织业\nC. 法国  交通运输业\nD. 美国  采矿业","answer":"答案：B\n解析：第一次工业革命最早发生在英国的棉纺织业。1765年，哈格里夫斯发明了珍妮机，标志着工业革命的开始。工业革命之所以最早开始于英国的棉纺织业，是因为棉纺织业是一个新兴的工业部门，受旧传统的束缚比较少，容易采用新技术。"},{"id":"g3_history_017_ex02","knowledge_id":"g3_history_017","question":"填空题：______发明珍妮机标志着工业革命开始。______改良蒸汽机使人类进入______时代。1825年______设计的蒸汽机车试车成功，标志着铁路时代的开始。","answer":"答案：哈格里夫斯；瓦特；蒸汽；史蒂芬森\n解析：1765年，哈格里夫斯发明了珍妮机，标志着工业革命的开始。瓦特改良蒸汽机，使人类进入蒸汽时代。1825年，史蒂芬森设计的蒸汽机车试车成功，标志着铁路时代的开始。工业革命极大地提高了社会生产力水平，人类进入'蒸汽时代'。"},{"id":"g3_history_017_ex03","knowledge_id":"g3_history_017","question":"选择题：第一次工业革命使人类进入了什么时代？（  ）\nA. 信息时代\nB. 电气时代\nC. 蒸汽时代\nD. 石器时代","answer":"答案：C\n解析：瓦特改良蒸汽机，使机器生产突破了自然条件的限制，人们利用蒸汽机提供的动力带动机器，进行生产，极大地促进了大工厂生产的发展。从此，人类进入了'蒸汽时代'。"},{"id":"g3_history_017_ex04","knowledge_id":"g3_history_017","question":"简答题：第一次工业革命有何历史影响？","answer":"答案：\n1. 工业革命极大地提高了社会生产力水平，人类进入'蒸汽时代'；\n2. 工业革命使社会面貌发生了翻天覆地的变化，社会日益分裂为两大直接对立的阶级——工业资产阶级和工业无产阶级；\n3. 工业革命促进了城市的兴盛和城市化进程的加快；\n4. 工业革命改变了世界的面貌，形成了西方先进、东方落后的局面；\n5. 工业革命加速了资本主义的发展，使资本主义最终战胜了封建主义；\n6. 工业革命也带来了环境污染、贫富分化等社会问题。\n解析：第一次工业革命是人类历史上一次重要的变革，它极大地提高了社会生产力，使人类进入了蒸汽时代。工业革命不仅改变了人们的生产和生活方式，也改变了世界的面貌，形成了西方先进、东方落后的局面。同时，工业革命也带来了一些社会问题，如环境污染、贫富分化等。"},{"id":"g3_history_017_ex05","knowledge_id":"g3_history_017","question":"材料分析题：阅读下列材料，回答问题。\n材料：'资产阶级在它的不到一百年的阶级统治中所创造的生产力，比过去一切世代创造的全部生产力还要多，还要大。'\n——马克思、恩格斯《共产党宣言》\n请回答：（1）材料描述的是什么事件带来的变化？（2）这一事件最早开始于哪个国家？开始的标志是什么？（3）这一事件有何历史影响？","answer":"答案：\n（1）材料描述的是第一次工业革命带来的变化。\n（2）第一次工业革命最早开始于英国，1765年哈格里夫斯发明珍妮机标志着工业革命的开始。\n（3）历史影响：\n① 工业革命极大地提高了社会生产力水平，人类进入'蒸汽时代'；\n② 工业革命使社会面貌发生了翻天覆地的变化，社会日益分裂为两大直接对立的阶级——工业资产阶级和工业无产阶级；\n③ 工业革命促进了城市的兴盛和城市化进程的加快；\n④ 工业革命改变了世界的面貌，形成了西方先进、东方落后的局面；\n⑤ 工业革命加速了资本主义的发展，使资本主义最终战胜了封建主义。\n解析：马克思、恩格斯的这段话高度评价了工业革命在生产力发展方面的巨大作用。工业革命创造了巨大的生产力，使社会面貌发生了翻天覆地的变化，对人类历史的发展产生了深远影响。"},{"id":"g3_history_017_ex06","knowledge_id":"g3_history_017","question":"填空题：第一次工业革命的时间是从______世纪______年代到______世纪中期。工业革命最早发生在______国。","answer":"答案：18；60；19；英\n解析：第一次工业革命的时间是从18世纪60年代到19世纪中期，最早发生在英国，随后扩展到法国、美国等其他国家。工业革命极大地提高了社会生产力水平，人类进入'蒸汽时代'。"},{"id":"g3_history_017_ex07","knowledge_id":"g3_history_017","question":"选择题：下列关于第一次工业革命的说法，错误的是（  ）\nA. 最早开始于英国的棉纺织业\nB. 瓦特改良蒸汽机使人类进入蒸汽时代\nC. 史蒂芬森发明了珍妮机\nD. 工业革命促进了城市化进程","answer":"答案：C\n解析：C选项错误，发明珍妮机的是哈格里夫斯，史蒂芬森设计的是蒸汽机车。A、B、D选项的说法都是正确的，工业革命最早开始于英国的棉纺织业，瓦特改良蒸汽机使人类进入蒸汽时代，工业革命促进了城市化进程。"},{"id":"g3_history_017_ex08","knowledge_id":"g3_history_017","question":"简答题：工业革命为什么最早发生在英国？","answer":"答案：\n1. 政治前提：英国较早地完成了资产阶级革命，确立了资产阶级统治，为工业革命提供了政治前提；\n2. 资本条件：英国通过殖民掠夺、贩卖黑奴、海外贸易等方式，积累了大量的资本；\n3. 劳动力条件：圈地运动使大批农民失去土地，成为自由劳动力，为工业革命提供了充足的劳动力；\n4. 市场条件：英国拥有广阔的海外殖民地，海外市场不断扩大，手工工场的生产已经不能满足市场的需求，迫切需要改进生产技术；\n5. 技术条件：手工工场时期积累了丰富的生产技术知识，培养了大批技术工人。\n解析：工业革命最早发生在英国，不是偶然的，而是有其深刻的政治、经济、社会等方面的原因。资产阶级统治的确立是工业革命的政治前提，资本、劳动力、市场、技术等条件的具备，使工业革命最早在英国发生成为可能。"},{"id":"g3_history_017_ex09","knowledge_id":"g3_history_017","question":"选择题：铁路时代开始的标志是（  ）\nA. 珍妮机的发明\nB. 蒸汽机的改良\nC. 蒸汽机车的发明\nD. 轮船的发明","answer":"答案：C\n解析：1825年，史蒂芬森设计的蒸汽机车拖着车厢载着450名乘客正式试车，标志着铁路时代的开始。铁路时代的到来为社会提供了更为快捷、廉价、便利的交通，使生产和市场之间的联系变得更加密切。"},{"id":"g3_history_017_ex10","knowledge_id":"g3_history_017","question":"材料分析题：阅读下列材料，回答问题。\n材料：工业革命后，英国的工业生产能力极大提高，19世纪中期，英国已成为世界上第一个工业国家。许多工厂建在城市里，大量人口涌入城市，城市规模越来越大。但是，工业革命也带来了严重的环境污染，城市里到处是烟囱，浓烟滚滚，河水污浊。\n请回答：（1）工业革命最早开始于哪个国家？开始的标志是什么？（2）根据材料，工业革命带来了哪些影响？（3）你认为应该如何解决工业革命带来的问题？","answer":"答案：\n（1）工业革命最早开始于英国，1765年哈格里夫斯发明珍妮机标志着工业革命的开始。\n（2）影响：\n① 积极影响：工业革命极大地提高了社会生产力，使英国成为世界上第一个工业国家；促进了城市的兴盛和城市化进程的加快；改变了人们的生活方式。\n② 消极影响：工业革命带来了严重的环境污染问题，影响了人们的生活和健康。\n（3）解决办法：\n① 发展科技，提高资源利用效率，减少污染物排放；\n② 加强环境立法，加大环境监管力度；\n③ 走可持续发展道路，实现经济发展与环境保护的协调发展；\n④ 提高人们的环保意识，倡导绿色生活方式。\n解析：工业革命是一把双刃剑，它既极大地提高了社会生产力，促进了经济的发展和社会的进步，也带来了环境污染、贫富分化等社会问题。我们在发展经济的同时，也要注意保护环境，走可持续发展道路。"},{"id":"g3_history_018_ex01","knowledge_id":"g3_history_018","question":"选择题：马克思主义诞生的标志是（  ）\nA. 巴黎公社成立\nB. 《共产党宣言》的发表\nC. 第一国际成立\nD. 十月革命胜利","answer":"答案：B\n解析：1848年，马克思、恩格斯为共产主义者同盟起草的纲领《共产党宣言》在伦敦正式出版。《共产党宣言》的发表，标志着马克思主义的诞生。从此，无产阶级的斗争有了科学理论的指导，国际共产主义运动兴起并蓬勃发展。"},{"id":"g3_history_018_ex02","knowledge_id":"g3_history_018","question":"填空题：马克思主义主要包括______、______和______三个组成部分。1848年《______》的发表，标志着马克思主义的诞生。","answer":"答案：马克思主义哲学；政治经济学；科学社会主义；共产党宣言\n解析：马克思主义主要包括马克思主义哲学、政治经济学和科学社会主义三个组成部分。1848年，马克思、恩格斯为共产主义者同盟起草的纲领《共产党宣言》在伦敦正式出版，标志着马克思主义的诞生。"},{"id":"g3_history_018_ex03","knowledge_id":"g3_history_018","question":"选择题：《共产党宣言》的作者是（  ）\nA. 马克思和列宁\nB. 马克思和恩格斯\nC. 恩格斯和列宁\nD. 斯大林和列宁","answer":"答案：B\n解析：《共产党宣言》的作者是马克思和恩格斯。1848年，马克思、恩格斯为共产主义者同盟起草的纲领《共产党宣言》在伦敦正式出版，标志着马克思主义的诞生。"},{"id":"g3_history_018_ex04","knowledge_id":"g3_history_018","question":"简答题：马克思主义诞生有何历史意义？","answer":"答案：\n1. 马克思主义的诞生，标志着马克思主义的诞生，从此，无产阶级的斗争有了科学理论的指导；\n2. 马克思主义是科学的理论，创造性地揭示了人类社会发展规律；\n3. 马克思主义是人民的理论，第一次创立了人民实现自身解放的思想体系；\n4. 马克思主义是实践的理论，指引着人民改造世界的行动；\n5. 马克思主义是不断发展的开放的理论，始终站在时代前沿；\n6. 国际共产主义运动兴起并蓬勃发展，对人类社会的发展产生了深远影响。\n解析：马克思主义的诞生是人类思想史上的伟大革命，它第一次确立了科学的世界观和方法论，为无产阶级和人类的解放指明了正确的道路。从此，无产阶级的斗争有了科学理论的指导，国际共产主义运动蓬勃发展，对世界历史的发展产生了深远影响。"},{"id":"g3_history_018_ex05","knowledge_id":"g3_history_018","question":"材料分析题：阅读下列材料，回答问题。\n材料：'一个幽灵，共产主义的幽灵，在欧洲游荡。为了对这个幽灵进行神圣的围剿，旧欧洲的一切势力，教皇和沙皇、梅特涅和基佐、法国的激进派和德国的警察，都联合起来了。'\n请回答：（1）上述材料出自哪部文献？（2）这部文献发表于何时？作者是谁？（3）这部文献的发表有何意义？","answer":"答案：\n（1）上述材料出自《共产党宣言》。\n（2）这部文献发表于1848年，作者是马克思和恩格斯。\n（3）意义：\n① 《共产党宣言》的发表，标志着马克思主义的诞生；\n② 从此，无产阶级的斗争有了科学理论的指导；\n③ 国际共产主义运动兴起并蓬勃发展；\n④ 马克思主义是科学的理论，创造性地揭示了人类社会发展规律，对人类社会的发展产生了深远影响。\n解析：《共产党宣言》是马克思和恩格斯为共产主义者同盟起草的纲领，它的发表标志着马克思主义的诞生。《共产党宣言》分析了资本主义生产方式的内在矛盾与人类社会的发展规律，科学论证了资本主义必然灭亡和社会主义必然胜利的历史必然性。"},{"id":"g3_history_018_ex06","knowledge_id":"g3_history_018","question":"填空题：马克思主义诞生于______年。马克思主义的创始人是______和______。","answer":"答案：1848；马克思；恩格斯\n解析：1848年，马克思、恩格斯为共产主义者同盟起草的纲领《共产党宣言》在伦敦正式出版，标志着马克思主义的诞生。马克思主义的创始人是马克思和恩格斯，马克思主义主要包括马克思主义哲学、政治经济学和科学社会主义三个组成部分。"},{"id":"g3_history_018_ex07","knowledge_id":"g3_history_018","question":"选择题：下列关于马克思主义的说法，错误的是（  ）\nA. 马克思主义诞生的标志是《共产党宣言》的发表\nB. 马克思主义主要包括马克思主义哲学、政治经济学和科学社会主义\nC. 马克思主义诞生于1848年\nD. 马克思主义是马克思一个人创立的","answer":"答案：D\n解析：D选项错误，马克思主义是马克思和恩格斯共同创立的，不是马克思一个人创立的。A、B、C选项的说法都是正确的，马克思主义诞生的标志是《共产党宣言》的发表，马克思主义主要包括马克思主义哲学、政治经济学和科学社会主义，马克思主义诞生于1848年。"},{"id":"g3_history_018_ex08","knowledge_id":"g3_history_018","question":"简答题：马克思主义诞生的历史背景是什么？","answer":"答案：\n1. 经济基础：工业革命推动了资本主义的迅速发展，资本主义制度的各种弊端也日益暴露，经济危机周期性爆发，工人阶级生活悲惨；\n2. 阶级基础：工人运动的兴起，无产阶级作为独立的政治力量登上历史舞台，迫切需要科学理论的指导；\n3. 思想基础：德意志古典哲学、英国古典政治经济学和英法空想社会主义是马克思主义的三个思想来源；\n4. 实践基础：马克思和恩格斯深入工人运动，总结工人运动的经验，进行了大量的理论研究工作。\n解析：马克思主义的诞生不是偶然的，而是有其深刻的历史背景。工业革命推动了资本主义的发展，也使资本主义制度的弊端日益暴露。工人运动的兴起，使无产阶级作为独立的政治力量登上历史舞台，迫切需要科学理论的指导。马克思和恩格斯在吸收前人优秀文化成果的基础上，结合工人运动的实践，创立了马克思主义。"},{"id":"g3_history_018_ex09","knowledge_id":"g3_history_018","question":"选择题：下列哪一项不是马克思主义的组成部分？（  ）\nA. 马克思主义哲学\nB. 政治经济学\nC. 科学社会主义\nD. 空想社会主义","answer":"答案：D\n解析：空想社会主义不是马克思主义的组成部分，它是马克思主义的思想来源之一。马克思主义主要包括马克思主义哲学、政治经济学和科学社会主义三个组成部分。"},{"id":"g3_history_018_ex10","knowledge_id":"g3_history_018","question":"材料分析题：阅读下列材料，回答问题。\n材料：'资产阶级的灭亡和无产阶级的胜利是同样不可避免的。''无产阶级将利用自己的政治统治，一步一步地夺取资产阶级的全部资本，把一切生产工具集中在国家即组织成为统治阶级的无产阶级手里，并且尽可能快地增加生产力的总量。'\n请回答：（1）上述材料出自哪部文献？（2）这部文献的核心思想是什么？（3）这部文献的发表有何历史意义？","answer":"答案：\n（1）上述材料出自《共产党宣言》。\n（2）核心思想：\n① 资本主义必然灭亡，社会主义必然胜利；\n② 无产阶级是资本主义的掘墓人和新社会的创造者；\n③ 无产阶级必须通过暴力革命推翻资产阶级的统治，建立无产阶级专政；\n④ 无产阶级夺取政权后，要大力发展生产力，消灭阶级和阶级差别，最终实现共产主义。\n（3）历史意义：\n① 《共产党宣言》的发表，标志着马克思主义的诞生；\n② 从此，无产阶级的斗争有了科学理论的指导；\n③ 国际共产主义运动兴起并蓬勃发展，对人类社会的发展产生了深远影响。\n解析：《共产党宣言》是马克思主义的纲领性文献，它揭示了人类社会发展的客观规律，论证了资本主义必然灭亡和社会主义必然胜利的历史必然性，阐明了无产阶级的历史使命。《共产党宣言》的发表，标志着马克思主义的诞生，对世界历史的发展产生了深远影响。"},{"id":"g3_history_019_ex01","knowledge_id":"g3_history_019","question":"选择题：世界上第一个无产阶级政权是（  ）\nA. 第一国际\nB. 巴黎公社\nC. 苏维埃俄国\nD. 中华人民共和国","answer":"答案：B\n解析：1871年3月18日，巴黎的无产阶级和人民群众举行武装起义，推翻了资产阶级反动统治，3月28日，建立了世界上第一个无产阶级政权——巴黎公社。5月28日，公社失败。巴黎公社是无产阶级建立政权的第一次伟大尝试。"},{"id":"g3_history_019_ex02","knowledge_id":"g3_history_019","question":"填空题：巴黎公社建立于______年，是世界上第一个______政权。______年5月，巴黎公社失败。","answer":"答案：1871；无产阶级；1871\n解析：1871年3月18日，巴黎的无产阶级和人民群众举行武装起义，推翻了资产阶级反动统治，3月28日，建立了世界上第一个无产阶级政权——巴黎公社。1871年5月28日，公社失败。巴黎公社是无产阶级建立政权的第一次伟大尝试。"},{"id":"g3_history_019_ex03","knowledge_id":"g3_history_019","question":"选择题：巴黎公社失败的标志是（  ）\nA. 三月十八日起义\nB. 五月流血周\nC. 普法战争爆发\nD. 第一国际成立","answer":"答案：B\n解析：1871年5月21日至28日，资产阶级反动政府对巴黎公社发动了疯狂进攻，公社战士与敌人展开了浴血奋战，成千上万的公社战士英勇牺牲，这就是历史上著名的'五月流血周'。5月28日，公社失败。"},{"id":"g3_history_019_ex04","knowledge_id":"g3_history_019","question":"简答题：结合所学历史知识，你如何评价巴黎公社这一历史事件？请从性质、意义和失败教训等方面分析。","answer":"答案：\n1. 巴黎公社是世界上第一个无产阶级政权，是无产阶级建立政权的第一次伟大尝试；\n2. 巴黎公社的实践，丰富了马克思主义的学说，为国际社会主义运动提供了宝贵的经验和教训；\n3. 公社战士在强大敌人面前表现出的大无畏精神永远激励着后人；\n4. 巴黎公社虽然失败了，但它的原则是永存的，它的革命精神鼓舞着无产阶级继续进行斗争。\n解析：巴黎公社虽然只存在了短短两个多月，但它在国际共产主义运动史上具有重要的历史地位。它是无产阶级建立政权的第一次伟大尝试，丰富了马克思主义关于无产阶级革命和无产阶级专政的学说，为国际共产主义运动提供了宝贵的经验和教训。公社战士英勇不屈、不怕牺牲的革命精神永远激励着后人。"},{"id":"g3_history_019_ex05","knowledge_id":"g3_history_019","question":"材料分析题：阅读下列材料，回答问题。\n材料：'工人的巴黎及其公社将永远作为新社会的光辉先驱而为人所称颂。它的英烈们已永远铭记在工人阶级的伟大心坎里。'\n——马克思\n请回答：（1）材料中的'公社'指的是什么？（2）它建立于哪一年？（3）它有什么历史意义？","answer":"答案：\n（1）材料中的'公社'指的是巴黎公社。\n（2）它建立于1871年。\n（3）历史意义：\n① 巴黎公社是世界上第一个无产阶级政权，是无产阶级建立政权的第一次伟大尝试；\n② 巴黎公社的实践，丰富了马克思主义的学说，为国际社会主义运动提供了宝贵的经验和教训；\n③ 公社战士在强大敌人面前表现出的大无畏精神永远激励着后人。\n解析：马克思的这段话高度评价了巴黎公社的历史地位和意义。巴黎公社虽然失败了，但它是无产阶级建立政权的第一次伟大尝试，它的革命实践丰富了马克思主义的学说，为国际共产主义运动提供了宝贵的经验和教训。巴黎公社的英烈们永远值得后人怀念和敬仰。"},{"id":"g3_history_019_ex06","knowledge_id":"g3_history_019","question":"填空题：巴黎公社是无产阶级建立政权的______次伟大尝试。公社失败后，欧仁·鲍狄埃创作了《______》的歌词，后来由狄盖特谱曲，成为全世界无产阶级的战歌。","answer":"答案：第一；国际歌\n解析：巴黎公社是无产阶级建立政权的第一次伟大尝试。公社失败后不久，公社的领导人之一欧仁·鲍狄埃创作了《国际歌》的歌词，后来，经工人作曲家狄盖特谱曲后，《国际歌》在全世界广泛传唱开来，成为全世界无产阶级的战歌。"},{"id":"g3_history_019_ex07","knowledge_id":"g3_history_019","question":"选择题：下列关于巴黎公社的说法，错误的是（  ）\nA. 建立于1871年\nB. 是世界上第一个无产阶级政权\nC. 公社最终取得了胜
