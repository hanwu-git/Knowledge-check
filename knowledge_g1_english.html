    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"chapter":"上册 Unit 1","name":"问候与介绍","formula":"Hello! / Hi! / Nice to meet you!","explanation":"【基本问候语】\n1. Hello! / Hi! 你好！\n2. Good morning! 早上好！\n3. Good afternoon! 下午好！\n4. Good evening! 晚上好！\n\n【自我介绍】\n1. I'm... / My name is... 我是...\n2. I'm from... 我来自...\n3. I'm ... years old. 我...岁了\n\n【询问对方】\n1. What's your name? 你叫什么名字？\n2. Where are you from? 你来自哪里？\n3. How old are you? 你多大了？\n\n【告别语】\n1. Goodbye! / Bye! 再见！\n2. See you! 再见！\n3. See you tomorrow! 明天见！","id":"g1_english_u001","semester":"upper"},{"chapter":"上册 Unit 1","name":"人称代词主格","formula":"I, you, he, she, it, we, you, they","explanation":"【人称代词主格】\n作句子的主语，放在句首。\n\n【列表】\n- 第一人称单数：I（我）\n- 第二人称单数：you（你）\n- 第三人称单数：he（他）, she（她）, it（它）\n- 第一人称复数：we（我们）\n- 第二人称复数：you（你们）\n- 第三人称复数：they（他们/她们/它们）\n\n【用法】\n1. I am a student. 我是一名学生。\n2. He is from China. 他来自中国。\n3. They are my friends. 他们是我的朋友。\n\n【注意】\n- I（我）永远大写\n- you 既是\"你\"也是\"你们\"，谓语动词都用are\n- he/she/it 第三人称单数，谓语动词用is","id":"g1_english_u002","semester":"upper"},{"chapter":"上册 Unit 1","name":"be动词","formula":"I am, you/we/they are, he/she/it is","explanation":"【be动词的三种形式】\nam, is, are\n\n【搭配口诀】\n我用am，你用are，\nis连着他、她、它，\n单数is，复数are。\n\n【例句】\n1. I am a teacher. 我是一名老师。\n2. You are my student. 你是我的学生。\n3. She is my sister. 她是我姐姐。\n4. We are classmates. 我们是同学。\n5. They are happy. 他们很开心。\n\n【缩写形式】\nI'm = I am\nyou're = you are\nhe's = he is\nshe's = she is\nit's = it is\nwe're = we are\nthey're = they are","id":"g1_english_u003","semester":"upper"},{"chapter":"上册 Unit 2","name":"家庭成员词汇","formula":"father, mother, brother, sister, grandparent","explanation":"【核心词汇】\n1. family 家庭\n2. father (dad) 父亲（爸爸）\n3. mother (mom) 母亲（妈妈）\n4. parent 父亲或母亲\n5. parents 父母\n6. brother 哥哥/弟弟\n7. sister 姐姐/妹妹\n8. grandfather (grandpa) 祖父/外祖父\n9. grandmother (grandma) 祖母/外祖母\n10. grandparent 祖父/祖母/外祖父/外祖母\n11. grandparents 祖父母/外祖父母\n12. uncle 叔叔/舅舅/伯父\n13. aunt 阿姨/姑姑/婶婶\n14. cousin 堂（表）兄弟/姐妹\n\n【句型】\n1. This is my family. 这是我的家庭。\n2. These are my parents. 这是我的父母。\n3. I have a big family. 我有一个大家庭。","id":"g1_english_u004","semester":"upper"},{"chapter":"上册 Unit 2","name":"指示代词","formula":"this/that + 单数, these/those + 复数","explanation":"【指示代词】\n用来指示或标识人或事物的代词。\n\n【单数形式】\n- this（这，这个）：指近处的单数\n- that（那，那个）：指远处的单数\n\n【复数形式】\n- these（这些）：指近处的复数\n- those（那些）：指远处的复数\n\n【句型】\n1. This is my father. 这是我爸爸。\n2. That is my mother. 那是我妈妈。\n3. These are my parents. 这些是我的父母。\n4. Those are my friends. 那些是我的朋友。\n\n【一般疑问句】\n- Is this your sister? 这是你姐姐吗？\n  Yes, it is. / No, it isn't.\n- Are these your brothers? 这些是你哥哥吗？\n  Yes, they are. / No, they aren't.","id":"g1_english_u005","semester":"upper"},{"chapter":"上册 Unit 2","name":"名词复数","formula":"一般加s，以s/x/ch/sh结尾加es","explanation":"【名词复数变化规则】\n\n1. 一般情况：直接加s\n   - book → books\n   - pen → pens\n\n2. 以s, x, ch, sh结尾：加es\n   - bus → buses\n   - box → boxes\n   - watch → watches\n   - dish → dishes\n\n3. 以辅音字母+y结尾：变y为i，加es\n   - baby → babies\n   - family → families\n\n4. 以f或fe结尾：变f/fe为v，加es\n   - knife → knives\n   - leaf → leaves\n\n5. 不规则变化：\n   - man → men\n   - woman → women\n   - child → children\n   - sheep → sheep（单复数同形）\n   - deer → deer（单复数同形）\n\n【注意】\n有些名词只有复数形式：clothes, people, police等","id":"g1_english_u006","semester":"upper"},{"chapter":"上册 Unit 3","name":"物品与位置","formula":"in/on/under/behind/near","explanation":"【常见物品词汇】\n1. schoolbag 书包\n2. book 书\n3. pen 钢笔\n4. pencil 铅笔\n5. ruler 尺子\n6. eraser 橡皮\n7. desk 书桌\n8. chair 椅子\n9. bed 床\n10. table 桌子\n\n【方位介词】\n1. in 在...里面\n2. on 在...上面\n3. under 在...下面\n4. behind 在...后面\n5. near 在...旁边\n6. next to 紧挨着\n7. in front of 在...前面\n8. between 在...之间\n\n【句型】\n- Where is the book? 书在哪里？\n  It's on the desk. 它在书桌上。\n- Where are the pens? 钢笔在哪里？\n  They're in the pencil box. 它们在铅笔盒里。","id":"g1_english_u007","semester":"upper"},{"chapter":"上册 Unit 3","name":"where引导的特殊疑问句","formula":"Where + be + 主语?","explanation":"【where引导的特殊疑问句】\n用来询问地点和位置。\n\n【结构】\nWhere + be动词 + 主语？\n\n【单数形式】\n- Where is the book? 书在哪里？\n  It's on the desk. 它在书桌上。\n- Where is my schoolbag? 我的书包在哪里？\n  It's under the bed. 它在床下面。\n\n【复数形式】\n- Where are my keys? 我的钥匙在哪里？\n  They are on the table. 它们在桌子上。\n- Where are your books? 你的书在哪里？\n  They are in the schoolbag. 它们在书包里。\n\n【回答】\n- 单数用 It's... 回答\n- 复数用 They're... 回答","id":"g1_english_u008","semester":"upper"},{"chapter":"上册 Unit 3","name":"物主代词","formula":"my/your/his/her/its/our/your/their","explanation":"【形容词性物主代词】\n用在名词前面，起修饰作用，表示\"谁的\"。\n\n【列表】\n- 第一人称单数：my（我的）\n- 第二人称单数：your（你的）\n- 第三人称单数：his（他的）, her（她的）, its（它的）\n- 第一人称复数：our（我们的）\n- 第二人称复数：your（你们的）\n- 第三人称复数：their（他们的/她们的/它们的）\n\n【例句】\n1. This is my book. 这是我的书。\n2. That is your pen. 那是你的钢笔。\n3. His name is Tom. 他的名字是汤姆。\n4. Her sister is Lucy. 她姐姐是露西。\n5. Our classroom is big. 我们的教室很大。\n6. Their teacher is kind. 他们的老师很和蔼。","id":"g1_english_u009","semester":"upper"},{"chapter":"上册 Unit 4","name":"日常活动","formula":"get up, go to school, have class, do homework","explanation":"【常见日常活动】\n1. get up 起床\n2. eat breakfast 吃早饭\n3. go to school 去上学\n4. have class / have lessons 上课\n5. eat lunch 吃午饭\n6. play sports 做运动\n7. go home 回家\n8. do homework 做作业\n9. eat dinner 吃晚饭\n10. watch TV 看电视\n11. read a book 读书\n12. go to bed 睡觉\n\n【句型】\n- What time do you get up? 你几点起床？\n  I get up at 6:30. 我6:30起床。\n- When do you go to school? 你什么时候去上学？\n  I go to school at 7:30. 我7:30去上学。\n\n【一天的时间顺序】\n早上 → 上午 → 中午 → 下午 → 晚上","id":"g1_english_u010","semester":"upper"},{"chapter":"上册 Unit 4","name":"一般现在时","formula":"主语 + 动词原形 / 动词三单形式","explanation":"【一般现在时定义】\n表示经常性、习惯性的动作或存在的状态。\n\n【构成】\n1. 肯定句：\n   - 第一/二人称/复数：主语 + 动词原形\n   - 第三人称单数：主语 + 动词三单形式\n\n2. 否定句：\n   - 主语 + don't/doesn't + 动词原形\n\n3. 一般疑问句：\n   - Do/Does + 主语 + 动词原形？\n\n【动词第三人称单数变化】\n1. 一般加s：work → works\n2. 以s/x/ch/sh/o结尾加es：go → goes\n3. 以辅音字母+y结尾：变y为i加es，study → studies\n4. 特殊变化：have → has\n\n【时间标志词】\nalways, usually, often, sometimes, every day, every morning等","id":"g1_english_u011","semester":"upper"},{"chapter":"上册 Unit 4","name":"动词第三人称单数","formula":"一般加s，以s/x/ch/sh/o结尾加es","explanation":"【动词三单变化规则】\n\n1. 一般情况：直接加s\n   - work → works\n   - play → plays\n   - read → reads\n\n2. 以s, x, ch, sh, o结尾：加es\n   - pass → passes\n   - fix → fixes\n   - watch → watches\n   - wash → washes\n   - go → goes\n   - do → does\n\n3. 以辅音字母+y结尾：变y为i，加es\n   - study → studies\n   - fly → flies\n   - try → tries\n\n4. 不规则变化：\n   - have → has\n   - be → is\n\n【用法】\n当主语是he, she, it或单数名词时，动词用三单形式。\n例句：\n- He gets up early. 他起床很早。\n- She likes music. 她喜欢音乐。\n- It looks nice. 它看起来不错。","id":"g1_english_u012","semester":"upper"},{"chapter":"上册 Unit 5","name":"食物与饮料","formula":"food: rice, bread, meat; drink: water, milk, juice","explanation":"【食物词汇】\n1. rice 米饭\n2. bread 面包\n3. noodle 面条\n4. egg 鸡蛋\n5. meat 肉\n6. chicken 鸡肉\n7. fish 鱼肉\n8. vegetable 蔬菜\n9. fruit 水果\n10. apple 苹果\n11. banana 香蕉\n12. orange 橙子\n\n【饮料词汇】\n1. water 水\n2. milk 牛奶\n3. juice 果汁\n4. tea 茶\n5. coffee 咖啡\n6. coke/coca cola 可乐\n\n【三餐词汇】\n1. breakfast 早餐\n2. lunch 午餐\n3. dinner 晚餐\n4. meal 一餐\n\n【句型】\n- What would you like? 你想要什么？\n  I'd like some rice. 我想要些米饭。\n- Do you like fish? 你喜欢鱼吗？\n  Yes, I do. / No, I don't.","id":"g1_english_u013","semester":"upper"},{"chapter":"上册 Unit 5","name":"可数名词与不可数名词","formula":"可数：a/an + 单数; 不可数：不能用a/an，不能加s","explanation":"【可数名词】\n可以用数字计数的名词，有单数和复数形式。\n- a book → two books\n- an apple → three apples\n\n【不可数名词】\n不能直接用数字计数的名词，没有复数形式。\n常见不可数名词：\n- 液体：water, milk, juice, tea, coffee\n- 食物：rice, bread, meat, fish, fruit\n- 其他：paper, news, weather, advice, information\n\n【量词的使用】\n不可数名词要表示\"多少\"时，需要用量词。\n- a cup of tea 一杯茶\n- two glasses of water 两杯水\n- three pieces of bread 三片面包\n- a bottle of milk 一瓶牛奶\n\n【注意】\n- some/any 既可修饰可数名词，也可修饰不可数名词\n- many 修饰可数名词复数\n- much 修饰不可数名词","id":"g1_english_u014","semester":"upper"},{"chapter":"上册 Unit 5","name":"some与any","formula":"some用于肯定句，any用于否定句和疑问句","explanation":"【some的用法】\n意思：一些，若干\n\n1. 用于肯定句\n   - I have some books. 我有一些书。\n   - There is some water in the glass. 杯子里有一些水。\n\n2. 用于表示请求或建议的疑问句中（希望得到肯定回答）\n   - Would you like some tea? 你想要些茶吗？\n   - Can I have some milk? 我能喝点牛奶吗？\n\n【any的用法】\n意思：一些，任何\n\n1. 用于否定句\n   - I don't have any pens. 我没有钢笔。\n   - There isn't any bread on the plate. 盘子里没有面包。\n\n2. 用于疑问句\n   - Do you have any questions? 你有问题吗？\n   - Is there any milk in the fridge? 冰箱里有牛奶吗？\n\n3. 用于肯定句中，表示\"任何的\"\n   - You can take any book. 你可以拿任何一本书。\n\n【修饰可数/不可数】\nsome和any都可以修饰可数名词复数和不可数名词。","id":"g1_english_u015","semester":"upper"},{"chapter":"上册 Unit 6","name":"服装词汇","formula":"shirt, T-shirt, jacket, coat, pants, shoes","explanation":"【服装词汇】\n1. shirt 衬衫（男）\n2. T-shirt T恤衫\n3. sweater 毛衣\n4. jacket 夹克衫\n5. coat 外套，大衣\n6. dress 连衣裙\n7. skirt 短裙\n8. pants / trousers 裤子\n9. jeans 牛仔裤\n10. shorts 短裤\n11. shoes 鞋子\n12. socks 袜子\n13. hat 帽子\n14. cap 鸭舌帽\n15. scarf 围巾\n16. gloves 手套\n\n【描述服装】\n1. 颜色：red, blue, green, yellow, black, white, purple, pink, orange, brown, gray\n2. 大小：big, small, long, short\n3. 新旧：new, old\n\n【句型】\n- What do you want to wear? 你想穿什么？\n  I want to wear a blue T-shirt. 我想穿一件蓝色T恤。\n- How much is the dress? 这条裙子多少钱？\n  It's 100 yuan. 100元。","id":"g1_english_u016","semester":"upper"},{"chapter":"上册 Unit 6","name":"how much与how many","formula":"how much问不可数/价格，how many问可数数量","explanation":"【how many】\n意思：多少\n用法：对可数名词的数量提问，后面跟可数名词复数。\n\n例句：\n- How many books do you have? 你有多少本书？\n  I have five books. 我有五本书。\n- How many students are there in your class? 你们班有多少学生？\n  There are 40 students. 有40个学生。\n\n【how much】\n意思：多少；多少钱\n\n用法1：对不可数名词的数量提问\n- How much water is there in the bottle? 瓶子里有多少水？\n  There is some water. 有一些水。\n\n用法2：询问价格\n- How much is the pen? 这支钢笔多少钱？\n  It's five yuan. 五元。\n- How much are these shoes? 这双鞋多少钱？\n  They are 100 yuan. 100元。\n\n【总结】\n- how many + 可数名词复数\n- how much + 不可数名词 / 询问价格","id":"g1_english_u017","semester":"upper"},{"chapter":"上册 Unit 7","name":"时间与日期","formula":"What time is it? / What date is it today?","explanation":"【时间表达法】\n\n1. 直接表达：小时 + 分钟\n   - 6:30 → six thirty\n   - 7:15 → seven fifteen\n\n2. 逆读法：\n   - 分钟≤30：分钟 + past + 小时（几点过几分）\n     - 6:10 → ten past six\n   - 分钟>30：(60-分钟) + to + (小时+1)（差几分到几点）\n     - 6:50 → ten to seven\n   - 30分钟用half：6:30 → half past six\n   - 15分钟用a quarter：6:15 → a quarter past six\n\n【日期表达】\n1. What day is it today? 今天星期几？\n   It's Monday. 今天星期一。\n\n2. What's the date today? 今天几月几号？\n   It's June 1st. 今天6月1日。\n\n【星期】\nMonday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday\n\n【月份】\nJanuary, February, March, April, May, June, July, August, September, October, November, December","id":"g1_english_u018","semester":"upper"},{"chapter":"上册 Unit 7","name":"介词in/on/at表时间","formula":"in年/月/季节，on具体某天，at具体时刻","explanation":"【in的用法】\n用于较长的时间段\n1. 年：in 2024 在2024年\n2. 月：in June 在六月\n3. 季节：in spring 在春天\n4. 上午/下午/晚上：in the morning 在早上\n\n【on的用法】\n用于具体的某一天或某一天的上午、下午、晚上\n1. 具体日期：on June 1st 在6月1日\n2. 星期：on Monday 在星期一\n3. 具体某天的上午：on Monday morning 在星期一早上\n4. 节日：on Children's Day 在儿童节\n\n【at的用法】\n用于具体的时刻或较短的时间\n1. 具体时间：at 7:30 在7点半\n2. 中午/夜晚：at noon 在中午，at night 在晚上\n3. 节日：at Christmas 在圣诞节期间\n4. 年龄：at the age of 10 在10岁时\n\n【固定搭配】\nin the morning/afternoon/evening\nat noon/night\non weekdays/weekends","id":"g1_english_u019","semester":"upper"},{"chapter":"上册 Unit 8","name":"天气","formula":"sunny, rainy, cloudy, windy, snowy","explanation":"【天气词汇（形容词）】\n1. sunny 晴朗的\n2. rainy 下雨的\n3. cloudy 多云的，阴天的\n4. windy 有风的\n5. snowy 下雪的\n6. hot 热的\n7. cold 冷的\n8. warm 温暖的\n9. cool 凉爽的\n\n【名词形式】\n1. sun 太阳 / 阳光\n2. rain 雨 / 下雨\n3. cloud 云\n4. wind 风\n5. snow 雪 / 下雪\n\n【询问天气】\n1. What's the weather like today? 今天天气怎么样？\n   It's sunny. 今天是晴天。\n\n2. How is the weather? 天气怎么样？\n   It's raining. 正在下雨。\n\n【描述天气】\n- It's a nice day today. 今天是个好天气。\n- It is going to rain tomorrow. 明天会下雨。\n- The sun is shining. 阳光灿烂。\n\n【注意】\n- 描述天气常用 It 作主语\n- be + 形容词：It's sunny.\n- be + 动词ing：It's raining.","id":"g1_english_u020","semester":"upper"},{"chapter":"上册 Unit 8","name":"现在进行时","formula":"be + 动词ing，表示正在进行的动作","explanation":"【定义】\n表示现在正在进行或发生的动作。\n\n【构成】\n肯定句：主语 + am/is/are + 动词ing\n否定句：主语 + am/is/are + not + 动词ing\n一般疑问句：Am/Is/Are + 主语 + 动词ing？\n\n【动词ing变化规则】\n1. 一般直接加ing：play → playing\n2. 以不发音的e结尾：去e加ing，make → making\n3. 重读闭音节（辅元辅）：双写最后字母加ing，run → running\n4. 以ie结尾：变ie为y加ing，lie → lying\n\n【时间标志词】\nnow, look, listen, at the moment, these days等\n\n【例句】\n- I am reading a book now. 我现在正在看书。\n- Listen! The birds are singing. 听！鸟儿在唱歌。\n- Look! They are playing football. 看！他们在踢足球。\n\n【特殊变化】\nsit → sitting\nshop → shopping\nswim → swimming\nrun → running\nput → putting","id":"g1_english_u021","semester":"upper"},{"chapter":"上册 Unit 9","name":"学校生活","formula":"subjects: English, math, Chinese, PE, music, art","explanation":"【学校课程】\n1. English 英语\n2. math 数学\n3. Chinese 语文\n4. PE / physical education 体育\n5. music 音乐\n6. art 美术\n7. science 科学\n8. history 历史\n9. geography 地理\n10. biology 生物\n\n【学校场所】\n1. classroom 教室\n2. playground 操场\n3. library 图书馆\n4. lab / laboratory 实验室\n5. canteen / dining hall 食堂\n6. teachers' office 教师办公室\n7. gym 体育馆\n8. garden 花园\n\n【句型】\n- What subject do you like best? 你最喜欢什么科目？\n  I like English best. 我最喜欢英语。\n- What class do you have on Monday? 你星期一有什么课？\n  I have English, math and P.E. 我有英语、数学和体育。\n- How many classes do you have every day? 你每天有几节课？\n  I have six classes. 我有六节课。","id":"g1_english_u022","semester":"upper"},{"chapter":"上册 Unit 9","name":"形容词","formula":"形容词修饰名词，放在名词前或be动词后","explanation":"【形容词定义】\n用来修饰名词或代词，表示人或事物的性质、状态、特征等。\n\n【用法】\n1. 放在名词前面，作定语\n   - a big apple 一个大苹果\n   - a beautiful girl 一个漂亮的女孩\n\n2. 放在be动词/系动词后面，作表语\n   - The apple is big. 苹果很大。\n   - She looks happy. 她看起来很开心。\n\n【常见形容词】\n1. 大小：big, small, long, short, tall\n2. 颜色：red, blue, green, yellow, black, white\n3. 品质：good, bad, nice, kind, clever\n4. 感受：happy, sad, angry, tired, excited\n5. 天气：sunny, rainy, hot, cold, warm\n6. 年龄：old, young, new\n\n【形容词排序】\n多个形容词修饰名词时的顺序：\n限定词 → 描绘 → 大小 → 形状 → 年龄 → 颜色 → 国籍 → 材料 → 用途 + 名词","id":"g1_english_u023","semester":"upper"},{"chapter":"上册 语法","name":"定冠词the","formula":"the + 名词，表特指","explanation":"【定冠词the的用法】\n\n1. 特指某(些)人或某(些)物\n   - The book on the desk is mine. 书桌上那本书是我的。\n\n2. 指双方都知道的人或物\n   - Open the door, please. 请开门。\n\n3. 复述上文提到的人或物\n   - I have a cat. The cat is white. 我有一只猫，这只猫是白色的。\n\n4. 世界上独一无二的事物\n   - the sun 太阳，the moon 月亮，the earth 地球\n\n5. 用在序数词和形容词最高级前\n   - the first lesson 第一课，the tallest student 最高的学生\n\n6. 用在某些固定词组中\n   - in the morning 在早上\n   - at the same time 同时\n   - by the way 顺便说一下\n\n【不用冠词的情况】\n1. 泛指的复数名词前\n2. 专有名词前（人名、地名等）\n3. 星期、月份、节假日前\n4. 球类运动、棋类前\n5. 学科前","id":"g1_english_u024","semester":"upper"},{"chapter":"上册 语法","name":"不定冠词a/an","formula":"a + 辅音开头, an + 元音开头","explanation":"【不定冠词的用法】\na和an都是不定冠词，意思是\"一（个，只...）\"，用在单数可数名词前。\n\n【a和an的区别】\n1. a 用在辅音音素开头的单词前\n   - a book 一本书\n   - a pen 一支钢笔\n   - a student 一名学生\n   - a university 一所大学（u发/ju:/是辅音）\n\n2. an 用在元音音素开头的单词前\n   - an apple 一个苹果\n   - an egg 一个鸡蛋\n   - an hour 一小时（h不发音）\n   - an English book 一本英语书\n\n【用法】\n1. 泛指某一类人或物中的一个\n   - I am a student. 我是一名学生。\n\n2. 第一次提到某人或某物\n   - There is a book on the desk. 书桌上有一本书。\n\n3. 表示\"每一\"，相当于every\n   - We have six classes a day. 我们一天有六节课。\n\n4. 用在某些固定词组中\n   - a lot of 许多，a few 几个，a little 一点","id":"g1_english_u025","semester":"upper"},{"chapter":"上册 语法","name":"There be句型","formula":"There is + 单数, There are + 复数","explanation":"【There be句型】\n表示\"某地有某物/某人\"。\n\n【构成】\n肯定句：There + is/are + 名词 + 地点\n否定句：There + is/are + not + 名词 + 地点\n一般疑问句：Is/Are + there + 名词 + 地点？\n\n【主谓一致】\nThere be句型中，be动词要和后面的第一个名词保持一致（就近原则）。\n\n【例句】\n- There is a book on the desk. 书桌上有一本书。\n- There are some books on the desk. 书桌上有一些书。\n- There is a pen and two pencils in the pencil-box. 铅笔盒里有一支钢笔和两支铅笔。\n- There are two pencils and a pen in the pencil-box. 铅笔盒里有两支铅笔和一支钢笔。\n\n【一般疑问句及回答】\n- Is there a library in your school? 你们学校有图书馆吗？\n  Yes, there is. / No, there isn't.\n- Are there any students in the classroom? 教室里有学生吗？\n  Yes, there are. / No, there aren't.\n\n【特殊疑问句】\nHow many + 名词复数 + are there + 地点？","id":"g1_english_u026","semester":"upper"},{"chapter":"上册 语法","name":"特殊疑问句","formula":"特殊疑问词 + 一般疑问句语序","explanation":"【定义】\n以特殊疑问词开头的疑问句叫做特殊疑问句。回答时不用yes/no，要具体回答。\n\n【常见特殊疑问词】\n1. what（什么）：问事物、职业、名字等\n2. who（谁）：问人\n3. whose（谁的）：问所属\n4. where（在哪里）：问地点\n5. when / what time（什么时候）：问时间\n6. why（为什么）：问原因\n7. how（怎样）：问方式、状态\n8. how old（多大）：问年龄\n9. how many（多少）：问数量（可数）\n10. how much（多少/多少钱）：问数量（不可数）或价格\n11. which（哪一个）：问选择\n12. what color（什么颜色）：问颜色\n\n【例句】\n- What is your name? 你叫什么名字？\n  My name is Tom. 我叫汤姆。\n- Where do you live? 你住在哪里？\n  I live in Beijing. 我住在北京。\n- How old are you? 你多大了？\n  I am 12 years old. 我12岁。\n- Why are you late? 你为什么迟到？\n  Because I got up late. 因为我起晚了。","id":"g1_english_u027","semester":"upper"},{"chapter":"上册 语法","name":"名词所有格","formula":"单数加's，复数s结尾加'","explanation":"【名词所有格】\n表示有生命的东西的名词的所有关系。\n\n【构成方法】\n\n1. 单数名词加's\n   - Tom's book 汤姆的书\n   - the girl's bike 女孩的自行车\n   - my mother's bag 我妈妈的包\n\n2. 以s结尾的复数名词加'\n   - the students' classroom 学生们的教室\n   - Teachers' Day 教师节\n   - two hours' walk 两小时的步行路程\n\n3. 不以s结尾的复数名词加's\n   - Children's Day 儿童节\n   - men's room 男厕所\n   - women's clothes 女人的衣服\n\n4. 共同所有和分别所有\n   - Tom and Mike's room 汤姆和迈克的房间（共同拥有，一间房）\n   - Tom's and Mike's rooms 汤姆的房间和迈克的房间（分别拥有，两间房）\n\n【注意】\n1. 无生命的东西的所有关系一般用 of 短语\n   - the door of the room 房间的门\n2. 表示时间、距离、国家等的名词也可用's\n   - today's newspaper 今天的报纸","id":"g1_english_u028","semester":"upper"},{"chapter":"上册 语法","name":"基数词","formula":"one, two, three... 表示数量多少","explanation":"【基数词定义】\n表示数量多少的数词叫基数词。\n\n【1-100基数词】\n1-12: one, two, three, four, five, six, seven, eight, nine, ten, eleven, twelve\n\n13-19: 以-teen结尾\nthirteen, fourteen, fifteen, sixteen, seventeen, eighteen, nineteen\n\n20-90整十：以-ty结尾\ntwenty, thirty, forty, fifty, sixty, seventy, eighty, ninety\n\n几十几：几十 + \"-\" + 几\n21 → twenty-one\n35 → thirty-five\n99 → ninety-nine\n\n100 → one hundred\n\n【用法】\n1. 表示数量：three books 三本书\n2. 表示年龄：ten years old 十岁\n3. 表示时间：eight o'clock 八点钟\n4. 表示价格：five yuan 五元\n\n【注意】\n- hundred前有具体数字时，不加s\n- 模糊数量用 hundreds of（成百上千的）","id":"g1_english_u029","semester":"upper"},{"chapter":"上册 语法","name":"序数词","formula":"first, second, third... 表示顺序第几","explanation":"【序数词定义】\n表示顺序的数词叫序数词，意思是\"第几\"。\n\n【构成规则】\n1. 一般在基数词后加th\n   four → fourth 第四\n   six → sixth 第六\n\n2. 特殊变化（1、2、3）\n   one → first 第一\n   two → second 第二\n   three → third 第三\n\n3. 以ve结尾的，变ve为f加th\n   five → fifth 第五\n   twelve → twelfth 第十二\n\n4. 以ty结尾的整十数，变y为ie加th\n   twenty → twentieth 第二十\n   thirty → thirtieth 第三十\n\n5. 几十几的序数词，只变个位，十位不变\n   twenty-one → twenty-first 第二十一\n   thirty-five → thirty-fifth 第三十五\n\n【缩写形式】\n阿拉伯数字 + 序数词最后两个字母\n1st, 2nd, 3rd, 4th, 5th...\n\n【用法】\n1. 表示顺序：the first lesson 第一课\n2. 表示日期：June 1st 6月1日\n3. 表示楼层：on the second floor 在二楼\n\n【注意】\n序数词前面一般要加定冠词the","id":"g1_english_u030","semester":"upper"},{"chapter":"下册 Unit 1","name":"问路与交通","formula":"Go straight. Turn left. Turn right.","explanation":"【交通方式】\n1. by bus 乘公共汽车\n2. by car 乘小汽车\n3. by bike 骑自行车\n4. on foot 步行\n5. by train 乘火车\n6. by plane / by air 乘飞机\n7. by ship / by sea 乘船\n8. take the subway 乘地铁\n\n【问路常用语】\n1. Excuse me, where is...? 打扰一下，...在哪里？\n2. How can I get to...? 我怎么去...？\n3. Which is the way to...? 哪条路是去...的？\n4. Is there a ... near here? 这附近有...吗？\n\n【指路常用语】\n1. Go straight. 直走。\n2. Turn left. 向左转。\n3. Turn right. 向右转。\n4. Go along this street. 沿着这条街走。\n5. It's on your left/right. 在你的左/右边。\n6. You can't miss it. 你不会错过的。\n\n【句型】\n- How do you go to school? 你怎么去上学？\n  I go to school by bike. 我骑自行车去上学。","id":"g1_english_l001","semester":"lower"},{"chapter":"下册 Unit 1","name":"情态动词can","formula":"can + 动词原形，表示能、会、可以","explanation":"【定义】\ncan是情态动词，表示\"能够、可以、会\"。\n\n【用法】\n1. 表示能力（会，能够）\n   - I can swim. 我会游泳。\n   - Can you speak English? 你会说英语吗？\n\n2. 表示许可（可以）\n   - Can I use your pen? 我可以用你的钢笔吗？\n   - Yes, you can. / No, you can't.\n\n3. 表示推测（可能）\n   - That can't be true. 那不可能是真的。\n\n【结构】\n肯定句：主语 + can + 动词原形\n否定句：主语 + can't (cannot) + 动词原形\n一般疑问句：Can + 主语 + 动词原形？\n\n【回答】\n- Can you play football? 你会踢足球吗？\n  Yes, I can. / No, I can't.\n\n【注意】\n1. can没有人称和数的变化\n2. 后面跟动词原形\n3. 过去式是could","id":"g1_english_l002","semester":"lower"},{"chapter":"下册 Unit 1","name":"祈使句","formula":"动词原形开头，表示命令、请求、建议","explanation":"【定义】\n祈使句用来表示请求、命令、劝告、警告等。主语you通常省略。\n\n【肯定形式】\n1. 动词原形 + 其他\n   - Stand up, please. 请起立。\n   - Open the door. 开门。\n   - Be quiet. 安静。\n   - Let's go. 咱们走吧。\n\n2. Let型：Let + 宾语 + 动词原形\n   - Let me help you. 让我来帮你。\n   - Let's play football. 我们踢足球吧。\n\n【否定形式】\n1. Don't + 动词原形\n   - Don't be late. 不要迟到。\n   - Don't talk in class. 不要在课堂上讲话。\n\n2. Let型的否定：Don't let + 宾语 + 动词原形 / Let + 宾语 + not + 动词原形\n   - Don't let him go. / Let him not go. 别让他走。\n\n【表示礼貌】\n句首或句尾加please\n- Please sit down. / Sit down, please. 请坐。\n\n【注意】\n1. 祈使句的否定一律用Don't开头（Let型除外）\n2. 动词永远用原形","id":"g1_english_l003","semester":"lower"},{"chapter":"下册 Unit 2","name":"周末活动","formula":"watch TV, play sports, go shopping, visit friends","explanation":"【周末活动词汇】\n1. watch TV 看电视\n2. read books / do some reading 看书\n3. play sports 做运动\n4. play football / basketball 踢足球/打篮球\n5. go swimming 去游泳\n6. go shopping 去购物\n7. go to the park 去公园\n8. go to the cinema / see a movie 去看电影\n9. visit grandparents 看望祖父母\n10. visit friends 拜访朋友\n11. do homework 做作业\n12. clean the room 打扫房间\n13. wash clothes 洗衣服\n14. listen to music 听音乐\n15. draw pictures 画画\n\n【句型】\n- What do you usually do on weekends? 你周末通常做什么？\n  I usually play football with my friends. 我通常和朋友们踢足球。\n- What are you going to do this weekend? 这个周末你打算做什么？\n  I'm going to visit my grandma. 我打算去看望奶奶。\n- How was your weekend? 你周末过得怎么样？\n  It was great. 很棒。","id":"g1_english_l004","semester":"lower"},{"chapter":"下册 Unit 2","name":"一般将来时","formula":"will + 动词原形 / be going to + 动词原形","explanation":"【定义】\n表示将来某个时间要发生的动作或存在的状态。\n\n【构成方式一：will + 动词原形】\n肯定句：主语 + will + 动词原形\n否定句：主语 + will not (won't) + 动词原形\n一般疑问句：Will + 主语 + 动词原形？\n\n例句：\n- I will visit my grandma tomorrow. 我明天要去看望奶奶。\n- Will you go with us? 你和我们一起去吗？\n  Yes, I will. / No, I won't.\n\n【构成方式二：be going to + 动词原形】\n表示计划、打算做某事，或根据迹象判断将要发生。\n肯定句：主语 + am/is/are + going to + 动词原形\n\n例句：\n- I'm going to play football this afternoon. 我今天下午打算踢足球。\n- It's going to rain. 要下雨了。\n\n【时间标志词】\ntomorrow, next week, next month, soon, in the future, this weekend等\n\n【shall的用法】\nshall用于第一人称，表示建议或征求对方意见：\n- Shall we go? 我们走好吗？","id":"g1_english_l005","semester":"lower"},{"chapter":"下册 Unit 2","name":"一般过去时","formula":"主语 + 动词过去式","explanation":"【定义】\n表示过去某个时间发生的动作或存在的状态。\n\n【构成】\n肯定句：主语 + 动词过去式\n否定句：主语 + didn't + 动词原形\n一般疑问句：Did + 主语 + 动词原形？\n\n【动词过去式变化规则】\n\n1. 一般直接加ed\n   - work → worked\n   - play → played\n\n2. 以不发音的e结尾加d\n   - like → liked\n   - live → lived\n\n3. 以辅音字母+y结尾：变y为i加ed\n   - study → studied\n   - carry → carried\n\n4. 重读闭音节（辅元辅）：双写最后字母加ed\n   - stop → stopped\n   - plan → planned\n\n【不规则变化（常见）】\nam/is → was\nare → were\ngo → went\ncome → came\ndo → did\nhave → had\nsee → saw\nsay → said\nget → got\nmake → made\n\n【时间标志词】\nyesterday, last week, last month, last year, ago, just now等","id":"g1_english_l006","semester":"lower"},{"chapter":"下册 Unit 3","name":"动物","formula":"animals: panda, tiger, lion, elephant, monkey","explanation":"【常见动物】\n\n【哺乳动物】\n1. panda 熊猫\n2. tiger 老虎\n3. lion 狮子\n4. elephant 大象\n5. monkey 猴子\n6. bear 熊\n7. wolf 狼\n8. fox 狐狸\n9. rabbit 兔子\n10. deer 鹿\n11. horse 马\n12. cow 奶牛\n13. sheep 绵羊\n14. pig 猪\n15. dog 狗\n16. cat 猫\n\n【鸟类】\n1. bird 鸟\n2. eagle 鹰\n3. parrot 鹦鹉\n4. swan 天鹅\n5. chicken 鸡\n6. duck 鸭\n\n【其他】\n1. fish 鱼\n2. snake 蛇\n3. frog 青蛙\n4. turtle 乌龟\n5. butterfly 蝴蝶\n6. bee 蜜蜂\n\n【句型】\n- What's your favorite animal? 你最喜欢的动物是什么？\n  My favorite animal is the panda. 我最喜欢的动物是熊猫。\n- Where do pandas live? 熊猫住在哪里？\n  They live in China. 它们住在中国。","id":"g1_english_l007","semester":"lower"},{"chapter":"下册 Unit 3","name":"形容词比较级","formula":"A + be + 比较级 + than + B","explanation":"【定义】\n表示两者（人或事物）的比较，\"...比...更...\"。\n\n【构成规则】\n\n1. 一般单音节词加er\n   - tall → taller\n   - long → longer\n\n2. 以不发音的e结尾加r\n   - nice → nicer\n   - large → larger\n\n3. 以辅音字母+y结尾：变y为i加er\n   - happy → happier\n   - easy → easier\n\n4. 重读闭音节（辅元辅）：双写最后字母加er\n   - big → bigger\n   - hot → hotter\n   - thin → thinner\n\n5. 多音节词和部分双音节词：在前面加more\n   - beautiful → more beautiful\n   - interesting → more interesting\n\n【不规则变化】\ngood/well → better\nbad/ill → worse\nmany/much → more\nlittle → less\nfar → farther/further\n\n【基本句型】\nA + be + 形容词比较级 + than + B\n- Tom is taller than Mike. 汤姆比迈克高。\n- This book is more interesting than that one. 这本书比那本更有趣。","id":"g1_english_l008","semester":"lower"},{"chapter":"下册 Unit 3","name":"形容词最高级","formula":"A + be + the + 最高级 + of/in...","explanation":"【定义】\n表示三者或三者以上的人或事物的比较，\"...最...\"。\n\n【构成规则】\n\n1. 一般单音节词加est\n   - tall → tallest\n   - long → longest\n\n2. 以不发音的e结尾加st\n   - nice → nicest\n   - large → largest\n\n3. 以辅音字母+y结尾：变y为i加est\n   - happy → happiest\n   - easy → easiest\n\n4. 重读闭音节（辅元辅）：双写最后字母加est\n   - big → biggest\n   - hot → hottest\n\n5. 多音节词：在前面加most\n   - beautiful → most beautiful\n   - interesting → most interesting\n\n【不规则变化】\ngood/well → best\nbad/ill → worst\nmany/much → most\nlittle → least\nfar → farthest/furthest\n\n【基本句型】\nA + be + the + 形容词最高级 + of/in...\n- Tom is the tallest in our class. 汤姆是我们班最高的。\n- This is the most interesting book of the three. 这是三本书中最有趣的。\n\n【注意】\n形容词最高级前面一般要加定冠词the","id":"g1_english_l009","semester":"lower"},{"chapter":"下册 Unit 4","name":"职业","formula":"teacher, doctor, worker, farmer, driver","explanation":"【常见职业】\n1. teacher 老师\n2. doctor 医生\n3. nurse 护士\n4. worker 工人\n5. farmer 农民\n6. driver 司机\n7. cook 厨师\n8. policeman 警察\n9. soldier 士兵\n10. engineer 工程师\n11. singer 歌手\n12. dancer 舞蹈家\n13. writer 作家\n14. artist 艺术家\n15. scientist 科学家\n16. astronaut 宇航员\n17. businessman 商人\n18. reporter 记者\n19. lawyer 律师\n20. actor / actress 演员\n\n【句型】\n- What do you do? / What's your job? 你是做什么工作的？\n  I'm a teacher. 我是一名老师。\n- What does your father do? 你爸爸是做什么的？\n  He is a doctor. 他是一名医生。\n- Where does your mother work? 你妈妈在哪里工作？\n  She works in a hospital. 她在医院工作。\n- What do you want to be? 你想成为什么样的人？\n  I want to be a scientist. 我想成为一名科学家。","id":"g1_english_l010","semester":"lower"},{"chapter":"下册 Unit 4","name":"一般现在时第三人称单数","formula":"动词后加s/es","explanation":"【用法回顾】\n当主语是第三人称单数时，谓语动词要用第三人称单数形式。\n\n【第三人称单数主语】\n1. 人称代词：he, she, it\n2. 单个人名、地名：Tom, Beijing\n3. 单数名词：the book, my father\n4. 不定代词：everyone, someone, anyone, no one, something等\n\n【动词三单变化】\n1. 一般加s：works, plays, reads\n2. 以s, x, ch, sh, o结尾加es：goes, does, watches, washes, passes\n3. 以辅音字母+y结尾：变y为i加es：studies, flies, tries\n4. 不规则变化：have → has, be → is\n\n【句型转换】\n肯定句 → 否定句：主语 + doesn't + 动词原形\n- He likes apples. → He doesn't like apples.\n\n肯定句 → 一般疑问句：Does + 主语 + 动词原形？\n- She gets up early. → Does she get up early?\n  Yes, she does. / No, she doesn't.\n\n【记忆口诀】\n三单动词很重要，词尾常常加s/es；\n否定句中doesn't加，动词还原要记牢；\n疑问句中does当先，动词原形后边站。","id":"g1_english_l011","semester":"lower"},{"chapter":"下册 Unit 5","name":"生日与节日","formula":"birthday: When is your birthday? festival: Spring Festival","explanation":"【生日相关词汇】\n1. birthday 生日\n2. birthday cake 生日蛋糕\n3. birthday gift / present 生日礼物\n4. birthday party 生日派对\n5. birthday candle 生日蜡烛\n6. wish 愿望\n7. blow out 吹灭\n8. celebrate 庆祝\n\n【中国节日】\n1. Spring Festival 春节\n2. Lantern Festival 元宵节\n3. Dragon Boat Festival 端午节\n4. Mid-Autumn Festival 中秋节\n5. National Day 国庆节\n6. Children's Day 儿童节\n7. Teachers' Day 教师节\n\n【西方节日】\n1. New Year's Day 元旦\n2. Christmas 圣诞节\n3. Halloween 万圣节\n4. Thanksgiving Day 感恩节\n5. Easter 复活节\n6. Valentine's Day 情人节\n\n【句型】\n- When is your birthday? 你的生日是什么时候？\n  My birthday is on October 1st. 我的生日在10月1日。\n- How do you celebrate your birthday? 你怎么庆祝生日？\n  I usually have a birthday party. 我通常举办生日派对。","id":"g1_english_l012","semester":"lower"},{"chapter":"下册 Unit 5","name":"序数词","formula":"first, second, third... 表示顺序","explanation":"【序数词定义】\n表示顺序先后的数词叫序数词。\n\n【基数词变序数词口诀】\n基变序，有规律，词尾加上th。\n一、二、三，特殊记，词尾字母t, d, d。\n八减t，九减e，f来把ve替。\n单词ty作结尾，ty变成tie。\n若是碰到几十几，只变个位就可以。\n\n【常见序数词】\n1st: first\n2nd: second\n3rd: third\n4th: fourth\n5th: fifth\n6th: sixth\n7th: seventh\n8th: eighth\n9th: ninth\n10th: tenth\n11th: eleventh\n12th: twelfth\n13th: thirteenth\n20th: twentieth\n21st: twenty-first\n30th: thirtieth\n100th: one hundredth\n\n【用法】\n1. 表示顺序：the first lesson 第一课\n2. 表示日期：June 1st 6月1日\n3. 表示楼层：on the second floor 在二楼\n4. 表示次数：for the first time 第一次\n\n【注意】\n序数词前面一般要加定冠词the","id":"g1_english_l013","semester":"lower"},{"chapter":"下册 Unit 6","name":"描述人物","formula":"tall, short, fat, thin, young, old, beautiful","explanation":"【外貌描述】\n1. 身高：tall 高的，short 矮的，of medium height 中等身高\n2. 体型：fat 胖的，thin 瘦的，heavy 重的，slim 苗条的，strong 强壮的\n3. 头发：long hair 长头发，short hair 短头发，straight hair 直发，curly hair 卷发，black hair 黑发，blonde hair 金发\n4. 眼睛：big eyes 大眼睛，small eyes 小眼睛\n5. 面容：round face 圆脸，long face 长脸\n\n【性格描述】\n1. kind 和蔼的，善良的\n2. friendly 友好的\n3. shy 害羞的\n4. outgoing 外向的\n5. clever / smart 聪明的\n6. lazy 懒惰的\n7. hard-working 勤奋的\n8. brave 勇敢的\n9. quiet 安静的\n10. funny 有趣的，滑稽的\n\n【句型】\n- What does he look like? 他长什么样？\n  He is tall and thin. 他又高又瘦。\n- What is she like? 她是什么样的人？\n  She is very kind and friendly. 她既善良又友好。\n- She has long straight hair. 她留着长长的直发。","id":"g1_english_l014","semester":"lower"},{"chapter":"下册 Unit 6","name":"介词","formula":"in, on, at, for, to, with, by, about","explanation":"【常见介词及用法】\n\n1. in（在...里面；在一段时间内）\n   - in the box 在盒子里\n   - in the morning 在早上\n   - in China 在中国\n\n2. on（在...上面；在具体某天）\n   - on the desk 在书桌上\n   - on Monday 在星期一\n\n3. at（在...时刻；在小地点）\n   - at 7 o'clock 在7点\n   - at home 在家\n   - at the station 在车站\n\n4. for（为了；给；持续时间）\n   - a gift for you 给你的礼物\n   - for two hours 持续两小时\n\n5. to（到；向；给）\n   - go to school 去上学\n   - give sth. to sb. 把某物给某人\n\n6. with（和...一起；用；带有）\n   - play with friends 和朋友玩\n   - write with a pen 用钢笔写\n   - a girl with long hair 一个长发女孩\n\n7. by（乘；在...旁边；到...之前）\n   - by bus 乘公共汽车\n   - by the river 在河边\n   - by tomorrow 到明天为止\n\n8. about（关于；大约）\n   - a book about animals 一本关于动物的书\n   - about 100 people 大约100人","id":"g1_english_l015","semester":"lower"},{"chapter":"下册 Unit 7","name":"过去的事","formula":"一般过去时描述过去发生的事情","explanation":"【一般过去时回顾】\n表示过去某个时间发生的动作或存在的状态。\n\n【常见过去式不规则变化】\nbe → was/were\nbegin → began\nbring → brought\nbuy → bought\ncome → came\ndo → did\neat → ate\nfeel → felt\nfind → found\nfly → flew\nforget → forgot\nget → got\ngo → went\nhave → had\nkeep → kept\nknow → knew\nleave → left\nmake → made\nmeet → met\nread → read（读音不同）\nrun → ran\nsay → said\nsee → saw\nsing → sang\nsit → sat\nspeak → spoke\nspend → spent\nstand → stood\nswim → swam\ntake → took\nteach → taught\ntell → told\nthink → thought\nwrite → wrote\n\n【描述过去经历的句型】\n- Last summer, I went to Beijing with my parents. 去年夏天，我和父母去了北京。\n- We visited the Great Wall. 我们参观了长城。\n- I had a good time there. 我在那里玩得很开心。","id":"g1_english_l016","semester":"lower"},{"chapter":"下册 Unit 7","name":"动词过去式的规则变化","formula":"一般加ed，以e结尾加d，辅y结尾变i加ed","explanation":"【规则动词过去式变化】\n\n1. 一般情况：直接加ed\n   - work → worked\n   - play → played\n   - start → started\n   - need → needed\n\n2. 以不发音的字母e结尾：加d\n   - like → liked\n   - live → lived\n   - use → used\n   - dance → danced\n\n3. 以辅音字母加y结尾：变y为i，再加ed\n   - study → studied\n   - carry → carried\n   - try → tried\n   - worry → worried\n\n4. 重读闭音节（辅元辅结构）末尾只有一个辅音字母：双写这个辅音字母，再加ed\n   - stop → stopped\n   - plan → planned\n   - shop → shopped\n   - drop → dropped\n\n【ed的读音】\n1. 在清辅音后读/t/：helped, washed, watched\n2. 在浊辅音和元音后读/d/：played, lived, called\n3. 在t/d后读/ɪd/：wanted, needed, visited\n\n【不规则变化】\n需要单独记忆，约有200多个不规则动词。","id":"g1_english_l017","semester":"lower"},{"chapter":"下册 Unit 8","name":"计划与打算","formula":"be going to / will + 动词原形","explanation":"【表示计划与打算的方式】\n\n1. be going to + 动词原形\n   表示事先考虑好的计划、打算。\n   - I'm going to visit my grandma this weekend. 这个周末我打算去看望奶奶。\n   - What are you going to do tomorrow? 你明天打算做什么？\n\n2. will + 动词原形\n   表示将来要发生的事，常带意愿色彩。\n   - I will help you with your English. 我会帮你学英语的。\n   - I won't be late again. 我不会再迟到了。\n\n3. 现在进行时表将来\n   某些表示位置移动的动词（come, go, leave, arrive等），用现在进行时表示计划好的事情。\n   - We are leaving for Beijing tomorrow. 我们明天要去北京。\n   - He is coming this afternoon. 他今天下午要来。\n\n4. plan to do sth.\n   计划做某事\n   - I plan to go to the park this Sunday. 我计划这个周日去公园。\n\n5. want to do sth.\n   想要做某事\n   - I want to be a scientist when I grow up. 我长大了想当科学家。","id":"g1_english_l018","semester":"lower"},{"chapter":"下册 Unit 8","name":"want / would like","formula":"want to do / would like to do","explanation":"【want的用法】\n意思：想要\n\n1. want + 名词：想要某物\n   - I want a new book. 我想要一本新书。\n   - Do you want some tea? 你想要些茶吗？\n\n2. want to do sth.：想要做某事\n   - I want to play football. 我想去踢足球。\n   - She wants to be a doctor. 她想成为一名医生。\n\n3. want sb. to do sth.：想要某人做某事\n   - I want you to help me. 我想要你帮我。\n   - Mom wants me to study hard. 妈妈想要我努力学习。\n\n【would like的用法】\n意思：想要（比want更委婉）\n\n1. would like + 名词\n   - I would like some noodles. = I'd like some noodles. 我想要些面条。\n   - Would you like some tea? 你想要些茶吗？\n   Yes, please. / No, thanks.\n\n2. would like to do sth.\n   - I would like to go with you. 我想和你一起去。\n   - Would you like to go swimming with us? 你想和我们一起去游泳吗？\n\n【注意】\n1. would like没有人称和数的变化\n2. 疑问句中表示委婉请求，some不变any","id":"g1_english_l019","semester":"lower"},{"chapter":"下册 语法","name":"现在进行时表将来","formula":"come/go/leave/arrive的进行时表将来","explanation":"【用法】\n某些表示位置移动的动词，可以用现在进行时表示按计划或安排将要发生的动作。\n\n【常见动词】\n1. come 来\n2. go 去\n3. leave 离开\n4. arrive 到达\n5. start 开始\n6. fly 飞\n7. move 移动\n8. return 返回\n\n【例句】\n- The train is arriving soon. 火车马上就要到了。\n- We are leaving for Shanghai tomorrow. 我们明天要去上海。\n- He is coming to see you this afternoon. 他今天下午要来看你。\n- The plane is taking off in five minutes. 飞机五分钟后就要起飞了。\n\n【与be going to的区别】\n1. 现在进行时表将来：多指已经安排好的，位置移动类的动词\n2. be going to：多指计划、打算做的事，或根据迹象判断\n\n【注意】\n- 这种用法常用于口语中\n- 常配有表示将来的时间状语，如 tomorrow, next week, soon等","id":"g1_english_l020","semester":"lower"},{"chapter":"下册 语法","name":"介词短语","formula":"介词 + 名词/代词/动名词","explanation":"【定义】\n介词和它后面的宾语合起来构成介词短语。\n介词后面跟的词叫介词宾语，可以是名词、代词宾格或动名词。\n\n【常见介词短语的句法作用】\n\n1. 作状语：表示时间、地点、方式、原因等\n   - 时间状语：in the morning, on Sunday, at night\n   - 地点状语：at home, in the classroom, on the wall\n   - 方式状语：by bus, with a pen, in English\n   - 原因状语：because of the rain, for this reason\n\n2. 作定语：修饰名词（放在被修饰的名词后面）\n   - the book on the desk 书桌上的书\n   - the girl in red 穿红衣服的女孩\n   - a map of China 一张中国地图\n\n3. 作表语：放在be动词后面\n   - The book is on the desk. 书在书桌上。\n   - He is at home. 他在家。\n\n【常用介词搭配】\nlook at 看\nlisten to 听\nwait for 等待\narrive at/in 到达\nbe good at 擅长\nbe interested in 对...感兴趣\ndepend on 依靠\nbe afraid of 害怕","id":"g1_english_l021","semester":"lower"},{"chapter":"下册 语法","name":"反身代词","formula":"myself, yourself, himself, herself, itself","explanation":"【定义】\n表示\"我自己、你自己、他自己\"等的代词叫做反身代词。\n\n【列表】\n- 第一人称单数：myself 我自己\n- 第二人称单数：yourself 你自己\n- 第三人称单数：himself 他自己，herself 她自己，itself 它自己\n- 第一人称复数：ourselves 我们自己\n- 第二人称复数：yourselves 你们自己\n- 第三人称复数：themselves 他们/她们/它们自己\n\n【用法】\n1. 作宾语：指动作回到动作执行者本身\n   - I can look after myself. 我能照顾我自己。\n   - Please help yourself to some fruit. 请随便吃点水果。\n\n2. 作同位语：用来加强名词或代词的语气\n   - I myself did it. = I did it myself. 我亲自做的。\n   - The teacher himself will tell us. 老师会亲自告诉我们。\n\n【常见搭配】\n- enjoy oneself 玩得高兴\n- help oneself to 随便吃/用...\n- look after oneself 照顾自己\n- teach oneself 自学\n- by oneself 独自地\n- say to oneself 自言自语","id":"g1_english_l022","semester":"lower"},{"chapter":"下册 语法","name":"情态动词should","formula":"should + 动词原形，表应该","explanation":"【定义】\nshould是情态动词，表示\"应该、应当\"，表示建议、劝告、义务或责任。\n\n【用法】\n1. 表示劝告、建议（应该）\n   - You should study hard. 你应该努力学习。\n   - We should help each other. 我们应该互相帮助。\n\n2. 表示义务、责任（应当）\n   - You should finish your homework on time. 你应该按时完成作业。\n\n3. 表示推测（应该）\n   - They should be there by now. 他们现在应该到那里了。\n\n【结构】\n肯定句：主语 + should + 动词原形\n否定句：主语 + should not (shouldn't) + 动词原形\n一般疑问句：Should + 主语 + 动词原形？\n\n【例句】\n- Should I go there now? 我应该现在去那里吗？\n  Yes, you should. / No, you shouldn't.\n- You shouldn't watch TV too much. 你不应该看太多电视。\n\n【注意】\n1. should没有人称和数的变化\n2. 后面跟动词原形\n3. 是shall的过去式，但表示建议时不表过去","id":"g1_english_l023","semester":"lower"},{"chapter":"下册 语法","name":"宾语从句基础","formula":"主句 + 引导词 + 主语 + 谓语","explanation":"【定义】\n在句子中作宾语的从句叫做宾语从句。\n\n【三种类型】\n\n1. 由that引导（that在口语中常省略）\n   - I know (that) you are right. 我知道你是对的。\n   - He says (that) he will come tomorrow. 他说他明天会来。\n\n2. 由if/whether引导（是否）\n   - I don't know if/whether he will come. 我不知道他是否会来。\n   - Can you tell me if it will rain tomorrow? 你能告诉我明天是否会下雨吗？\n\n3. 由特殊疑问词引导\n   - Do you know where he lives? 你知道他住在哪里吗？\n   - Please tell me what your name is. 请告诉我你叫什么名字。\n\n【注意事项】\n1. 宾语从句用陈述语序（引导词 + 主语 + 谓语）\n2. 主句是现在时，从句时态根据实际情况而定\n3. 主句是过去时，从句要用相应的过去时态（客观真理除外）\n\n【例句】\n- I think that he is a good student. 我认为他是个好学生。\n- She asked if I liked English. 她问我是否喜欢英语。\n- We know that the earth goes around the sun. 我们知道地球绕着太阳转。（客观真理用一般现在时）","id":"g1_english_l024","semester":"lower"},{"chapter":"下册 语法","name":"不定式to do","formula":"want to do, like to do, decide to do","explanation":"【定义】\n\"to + 动词原形\"构成的结构叫做动词不定式（to do）。to是不定式符号，没有词义。\n\n【基本形式】\n肯定式：to do\n否定式：not to do\n\n【用法】\n1. 作宾语：某些动词后面要求用不定式作宾语\n   - want to do 想要做\n   - would like to do 想要做\n   - decide to do 决定做\n   - hope to do 希望做\n   - plan to do 计划做\n   - try to do 尽力做\n   - like to do 喜欢做\n   - learn to do 学习做\n\n2. 作宾语补足语\n   - ask sb. to do 叫某人做\n   - tell sb. to do 告诉某人做\n   - want sb. to do 想要某人做\n   - help sb. (to) do 帮助某人做\n\n3. 作目的状语\n   - I come here to see you. 我来这里看你。\n\n4. 作主语\n   - To learn English well is not easy. 学好英语不容易。\n   （常用it作形式主语：It is not easy to learn English well.）\n\n【注意】\n使役动词（make, let, have）和感官动词（see, hear, watch等）后面的不定式要省略to。","id":"g1_english_l025","semester":"lower"},{"chapter":"下册 语法","name":"副词","formula":"修饰动词、形容词、副词或全句","explanation":"【定义】\n副词是用来修饰动词、形容词、其他副词或全句的词。\n\n【用法】\n1. 修饰动词：run fast 跑得快\n2. 修饰形容词：very good 非常好\n3. 修饰副词：very fast 非常快\n4. 修饰整个句子：Luckily, I passed the exam. 幸运的是，我通过了考试。\n\n【构成】\n1. 形容词 + ly → 副词\n   - quick → quickly 快地\n   - slow → slowly 慢地\n   - careful → carefully 仔细地\n   - happy → happily 高兴地\n\n2. 形容词和副词同形\n   - fast adj. 快的 / adv. 快地\n   - early adj. 早的 / adv. 早地\n   - late adj. 晚的 / adv. 晚地\n   - hard adj. 困难的 / adv. 努力地\n\n3. 不规则变化\n   - good → well 好地\n   - bad → badly 坏地\n\n【分类】\n1. 时间副词：now, then, yesterday, tomorrow, soon\n2. 地点副词：here, there, home, upstairs\n3. 方式副词：quickly, carefully, happily\n4. 程度副词：very, quite, too, much, so\n5. 频率副词：always, usually, often, sometimes, never","id":"g1_english_l026","semester":"lower"},{"chapter":"下册 语法","name":"被动语态基础","formula":"be + 动词过去分词","explanation":"【被动语态】\n\n【定义】\n被动语态表示主语是动作的承受者（即动作的对象）。\n主动语态：主语发出动作 → 宾语承受动作\n被动语态：主语承受动作 → by + 动作发出者\n\n【基本结构】\nbe + 及物动词的过去分词\n\n【各时态的被动语态】\n\n1. 一般现在时的被动：am/is/are + 过去分词\n   - English is spoken in many countries. 许多国家说英语。\n   - The book is written by Lu Xun. 这本书是鲁迅写的。\n\n2. 一般过去时的被动：was/were + 过去分词\n   - The bridge was built in 1990. 这座桥建于1990年。\n   - The letter was written yesterday. 这封信是昨天写的。\n\n3. 一般将来时的被动：will be + 过去分词\n   - The work will be finished tomorrow. 这项工作明天将完成。\n\n【主动变被动的方法】\n1. 宾语变主语\n2. 谓语变被动（be + 过去分词，时态不变）\n3. 主语变by的宾语（可省略）\n\n例句：\n主动：We planted many trees. 我们种了许多树。\n被动：Many trees were planted (by us). 许多树被（我们）种了。","id":"g1_english_l027","semester":"lower"},{"chapter":"下册 语法","name":"并列句","formula":"用and, but, or等连词连接两个独立句子","explanation":"【并列句定义】\n由两个或两个以上的简单句并列连接起来的句子叫并列句。\n简单句之间用并列连词连接。\n\n【常见并列连词】\n\n1. 表示并列、递进关系\n   - and 和，并且\n   - both...and... 两者都\n   - not only...but also... 不但...而且...\n   - as well as 也，以及\n   例句：I like English and he likes math. 我喜欢英语，他喜欢数学。\n\n2. 表示转折关系\n   - but 但是\n   - however 然而\n   - yet 然而\n   - while 而，却\n   例句：He is young, but he knows a lot. 他很年轻，但知道很多。\n\n3. 表示选择关系\n   - or 或者，否则\n   - either...or... 要么...要么...\n   - neither...nor... 既不...也不...\n   例句：Hurry up, or you'll be late. 快点，否则你会迟到的。\n\n4. 表示因果关系\n   - so 所以\n   - for 因为\n   - therefore 因此\n   例句：It was late, so I went home. 天晚了，所以我回家了。","id":"g1_english_l028","semester":"lower"},{"chapter":"下册 语法","name":"感叹句","formula":"What + 名词! / How + 形容词/副词!","explanation":"【感叹句定义】\n用来表示喜、怒、哀、乐等强烈感情的句子叫感叹句。\n一般用what或how引导，句末用感叹号。\n\n【what引导的感叹句】\nwhat修饰名词或名词短语。\n\n1. What + a/an + 形容词 + 单数可数名词 + 主语 + 谓语！\n   What a beautiful girl (she is)! 她是个多漂亮的女孩啊！\n\n2. What + 形容词 + 复数可数名词 + 主语 + 谓语！\n   What interesting books (they are)! 多有趣的书啊！\n\n3. What + 形容词 + 不可数名词 + 主语 + 谓语！\n   What fine weather (it is)! 多好的天气啊！\n\n【how引导的感叹句】\nhow修饰形容词、副词或句子。\n\n1. How + 形容词/副词 + 主语 + 谓语！\n   How beautiful the girl is! 这女孩多漂亮啊！\n   How fast he runs! 他跑得多快啊！\n\n2. How + 主语 + 谓语！\n   How time flies! 时间过得真快！\n\n【判断用what还是how】\n看句末的主语和谓语之前最后一个词：\n- 是名词用what\n- 是形容词/副词用how","id":"g1_english_l029","semester":"lower"},{"chapter":"下册 语法","name":"反意疑问句","formula":"前肯后否，前否后肯","explanation":"【反意疑问句定义】\n附在陈述句后面，对陈述句所说的事实提出疑问的句子，叫反意疑问句。\n表示说话人对事物有一定看法，但需要对方证实。\n\n【结构】\n陈述句 + 简短问句\n前肯后否，前否后肯。\n\n【基本规则】\n1. 前肯后否：\n   He is a student, isn't he? 他是学生，对吗？\n   They like music, don't they? 他们喜欢音乐，不是吗？\n\n2. 前否后肯：\n   He isn't a student, is he? 他不是学生，对吗？\n   They don't like music, do they? 他们不喜欢音乐，是吗？\n\n【回答】\n根据事实回答，事实是肯定的用Yes，事实是否定的用No。\n- He is a student, isn't he? 他是学生，对吗？\n  Yes, he is. 是的，他是。/ No, he isn't. 不，他不是。\n\n【特殊情况】\n1. 陈述部分有never, few, little, hardly等否定词时，疑问部分用肯定式\n   He never smokes, does he? 他从不抽烟，对吗？\n\n2. There be句型的反意疑问句用be there\n   There is a book on the desk, isn't there? 书桌上有本书，对吗？","id":"g1_english_l030","semester":"lower"}];

        // 错题本管理器
        const WrongBookManager = {
            STORAGE_KEY_PREFIX: 'wrongbook_',
            getWrongBook(grade, subject) {
                const key = this.STORAGE_KEY_PREFIX + grade + '_' + subject;
                return JSON.parse(localStorage.getItem(key) || '[]');
            },
            addWrongBook(item) {
                const key = this.STORAGE_KEY_PREFIX + item.grade + '_' + item.subject;
                let wrongBook = this.getWrongBook(item.grade, item.subject);
                const exists = wrongBook.some(w => w.question === item.question);
                if (exists) return false;
                wrongBook.push({...item, id: item.knowledgeId + '_' + Date.now(), addedAt: new Date().toISOString()});
                localStorage.setItem(key, JSON.stringify(wrongBook));
                return true;
            }
        };

        // 学习进度管理器
        const ProgressManager = {
            STORAGE_KEY: 'study_progress',
            
            getProgress() {
                try {
                    return JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
                } catch(e) {
                    return {};
                }
            },
            
            saveProgress(progress) {
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(progress));
            },
            
            recordStudy(grade, subject, subjectName, semester, semesterName, knowledgeId, knowledgeName) {
                const progress = this.getProgress();
                const now = new Date().toISOString();
                const today = new Date().toISOString().split('T')[0];
                
                if (!progress.learnedKnowledge) progress.learnedKnowledge = {};
                if (!progress.dailyStats) progress.dailyStats = {};
                if (!progress.dailyStats[today]) {
                    progress.dailyStats[today] = { learnedCount: 0, subjects: [] };
                }
                
                const isNew = !progress.learnedKnowledge[knowledgeId];
                progress.learnedKnowledge[knowledgeId] = { learnedAt: now };
                
                if (isNew) {
                    progress.dailyStats[today].learnedCount++;
                    if (!progress.dailyStats[today].subjects.includes(subject)) {
                        progress.dailyStats[today].subjects.push(subject);
                    }
                }
                
                progress.lastStudy = {
                    grade, subject, subjectName, semester, semesterName,
                    knowledgeId, knowledgeName, timestamp: now
                };
                
                this.saveProgress(progress);
            },
            
            isLearned(knowledgeId) {
                const progress = this.getProgress();
                return !!(progress.learnedKnowledge && progress.learnedKnowledge[knowledgeId]);
            },
            
            getLastStudy() {
                const progress = this.getProgress();
                return progress.lastStudy || null;
            },
            
            getSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                if (!progress.learnedKnowledge) return { learned: 0, total: 0, percent: 0 };
                const prefix = grade + '_' + subject + '_';
                const learned = Object.keys(progress.learnedKnowledge).filter(k => k.startsWith(prefix)).length;
                const total = DATA_KNOWLEDGE.length;
                const percent = total > 0 ? Math.round((learned / total) * 100) : 0;
                return { learned, total, percent };
            },
            
            clearSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                const prefix = grade + '_' + subject + '_';
                
                if (progress.learnedKnowledge) {
                    Object.keys(progress.learnedKnowledge).forEach(k => {
                        if (k.startsWith(prefix)) {
                            delete progress.learnedKnowledge[k];
                        }
                    });
                }
                
                if (progress.lastStudy && progress.lastStudy.grade === grade && progress.lastStudy.subject === subject) {
                    delete progress.lastStudy;
                }
                
                this.saveProgress(progress);
                return true;
            }
        };

        function initPage() {
            const {grade, subject, semester} = currentParams;
            pageTitle.textContent = gradeNames[grade] + ' · ' + subjectNames[subject] + ' · ' + semesterNames[semester];
            loadKnowledge();
            updateProgressStat();
            
            const hash = window.location.hash.replace('#', '');
            if (hash && knowledgeList.some(k => k.id === hash)) {
                setTimeout(() => {
                    toggleExpand(hash);
                    const card = document.querySelector('[data-id="' + hash + '"]');
                    if (card) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
        }

        function updateProgressStat() {
            const {grade, subject} = currentParams;
            const learnedInSemester = knowledgeList.filter(k => ProgressManager.isLearned(k.id)).length;
            document.getElementById('progress-learned').textContent = learnedInSemester;
            document.getElementById('progress-total').textContent = knowledgeList.length;
        }

        function loadKnowledge() {
            const {grade, subject, semester} = currentParams;
            knowledgeList = DATA_KNOWLEDGE.filter(k => {
                return k.semester === semester;
            });
            renderKnowledgeList();
        }

        function renderKnowledgeList(items = knowledgeList) {
            if (items.length === 0) {
                knowledgeListEl.innerHTML = '';
                emptyStateEl.classList.remove('hidden');
                return;
            }
            emptyStateEl.classList.add('hidden');
            knowledgeListEl.innerHTML = items.map(item => {
                const isExpanded = expandedIds.has(item.id);
                const isLearned = ProgressManager.isLearned(item.id);
                return '<div class="card knowledge-card ' + (isLearned ? 'learned' : '') + '" data-id="' + item.id + '">' +
                    '<div class="knowledge-header p-4 flex items-center justify-between" onclick="toggleExpand(\'' + item.id + '\')">' +
                        '<div class="flex items-center gap-3 flex-1 min-w-0">' +
                            '<div class="expand-icon ' + (isExpanded ? 'expanded' : 'collapsed') + '">' + (isExpanded ? '−' : '+') + '</div>' +
                            '<div class="flex-1 min-w-0">' +
                                '<h3 class="text-lg font-semibold text-gray-800 flex items-center gap-2">' + escapeHtml(item.name) + (isLearned ? '<span class="text-green-500 text-sm">✓ 已学习</span>' : '') + '</h3>' +
                                '<p class="text-xs text-gray-500 mt-1">' + escapeHtml(item.chapter) + '</p>' +
                            '</div>' +
                        '</div>' +
                        (HAS_EXAMPLES ? '<button class="btn btn-secondary text-sm px-3 py-1" onclick="event.stopPropagation(); showExample(\'' + item.id + '\', \'' + escapeHtml(item.name) + '\')">例题</button>' : '') +
                    '</div>' +
                    '<div id="content-' + item.id + '" class="px-6 pb-4 ' + (isExpanded ? '' : 'hidden') + '">' +
                        (item.formula ? '<div class="mb-4"><h4 class="text-sm font-medium text-gray-500 mb-2">📐 公式</h4><p class="formula-box text-gray-800 text-lg bg-gray-50 p-3 rounded-lg">' + escapeHtml(item.formula) + '</p></div>' : '') +
                        (item.explanation ? '<div><h4 class="text-sm font-medium text-gray-500 mb-2">📝 解释</h4><p class="text-gray-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(item.explanation) + '</p></div>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function toggleExpand(id) {
            const isNewLearn = !expandedIds.has(id) && !ProgressManager.isLearned(id);
            if (expandedIds.has(id)) {
                expandedIds.delete(id);
            } else {
                expandedIds.add(id);
                const {grade, subject, semester} = currentParams;
                const item = knowledgeList.find(k => k.id === id);
                if (item) {
                    ProgressManager.recordStudy(
                        grade, subject, subjectNames[subject],
                        semester, semesterNames[semester],
                        id, item.name
                    );
                }
            }
            const card = document.querySelector('[data-id="' + id + '"]');
            const content = document.getElementById('content-' + id);
            const icon = card.querySelector('.expand-icon');
            const header = card.querySelector('.knowledge-header');
            const title = card.querySelector('h3');
            if (expandedIds.has(id)) {
                content.classList.remove('hidden');
                icon.classList.remove('collapsed');
                icon.classList.add('expanded');
                icon.textContent = '−';
                header.classList.add('expanded');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('expanded');
                icon.classList.add('collapsed');
                icon.textContent = '+';
                header.classList.remove('expanded');
            }
            if (isNewLearn) {
                card.classList.add('learned');
                if (!title.querySelector('.text-green-500')) {
                    title.innerHTML += '<span class="text-green-500 text-sm">✓ 已学习</span>';
                }
                updateProgressStat();
            }
        }

        function expandAll() {
            knowledgeList.forEach(item => expandedIds.add(item.id));
            renderKnowledgeList();
        }

        function collapseAll() {
            expandedIds.clear();
            renderKnowledgeList();
        }

        function searchKnowledge(keyword, list) {
            if (!keyword) return [];
            const lower = keyword.toLowerCase();
            return list.filter(k =>
                k.name.toLowerCase().includes(lower) ||
                k.chapter.toLowerCase().includes(lower)
            );
        }

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                searchResultsInfo.classList.add('hidden');
                renderKnowledgeList();
                return;
            }
            const results = searchKnowledge(keyword, knowledgeList);
            searchCountEl.textContent = results.length;
            searchResultsInfo.classList.remove('hidden');
            renderKnowledgeList(results);
        }

        function showExample(knowledgeId, knowledgeName) {
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === knowledgeId);
            if (examples.length === 0) {
                alert('暂无例题');
                return;
            }
            const example = examples[Math.floor(Math.random() * examples.length)];
            currentExample = {...example, knowledgeId, knowledgeName, ...currentParams};
            document.getElementById('example-knowledge-name').textContent = knowledgeName;
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
            document.getElementById('example-modal').classList.remove('hidden');
        }

        function nextExample() {
            if (!currentExample) return;
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === currentExample.knowledgeId);
            const otherExamples = examples.filter(e => e !== currentExample);
            if (otherExamples.length === 0) {
                alert('没有更多例题了');
                return;
            }
            const example = otherExamples[Math.floor(Math.random() * otherExamples.length)];
            currentExample = {...example, knowledgeId: currentExample.knowledgeId, knowledgeName: currentExample.knowledgeName, ...currentParams};
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
        }

        function addToWrongBook() {
            if (!currentExample) return;
            const item = {
                knowledgeId: currentExample.knowledgeId,
                knowledgeName: currentExample.knowledgeName,
                question: currentExample.question,
                answer: currentExample.answer,
                grade: currentParams.grade,
                subject: currentParams.subject
            };
            if (WrongBookManager.addWrongBook(item)) {
                alert('已加入错题本！');
            } else {
                alert('该题目已在错题本中');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearProgress() {
            const {grade, subject} = currentParams;
            const subjectName = subjectNames[subject];
            var msg = '确定要清除【' + subjectName + '】科目的所有学习进度吗？';
            msg += '\n\n';
            msg += '此操作将清除该科目所有已学习标记，且不可恢复。';
            if (!confirm(msg)) {
                return;
            }
            ProgressManager.clearSubjectProgress(grade, subject);
            updateProgressStat();
            renderKnowledgeList();
            alert('学习进度已清除');
        }

        document.getElementById('btn-expand-all').addEventListener('click', expandAll);
        document.getElementById('btn-collapse-all').addEventListener('click', collapseAll);
        document.getElementById('btn-clear-progress').addEventListener('click', clearProgress);
        searchInput.addEventListener('keyup', e => { if (e.key === 'Enter') performSearch(); });
        searchInput.addEventListener('input', () => { if (!searchInput.value) { searchResultsInfo.classList.add('hidden'); renderKnowledgeList(); }});
        document.getElementById('close-example').addEventListener('click', () => document.getElementById('example-modal').classList.add('hidden'));
        document.getElementById('btn-show-answer').addEventListener('click', () => {
            document.getElementById('example-answer-section').classList.remove('hidden');
            document.getElementById('btn-show-answer').classList.add('hidden');
        });
        document.getElementById('btn-next-example').addEventListener('click', nextExample);
        document.getElementById('btn-add-wrong').addEventListener('click', addToWrongBook);
        document.getElementById('example-modal').addEventListener('click', e => { if (e.target.id === 'example-modal') document.getElementById('example-modal').classList.add('hidden'); });

        initPage();
    </script>
</body>
</html>
