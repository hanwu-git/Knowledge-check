    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"chapter":"第一单元 中国开始沦为半殖民地半封建社会","name":"鸦片战争","formula":"1840-1842年，中国近代史的开端","explanation":"【时间】1840年-1842年\n\n【原因】英国为打开中国市场，倾销工业品，掠夺原料，以林则徐虎门销烟为借口发动战争。\n\n【结果】清政府战败，签订《南京条约》。\n\n【影响】\n1. 中国开始从封建社会变为半殖民地半封建社会\n2. 鸦片战争是中国近代史的开端\n3. 中国人民开始了反侵略反封建的民主革命","id":"g1_history_u001","semester":"upper"},{"chapter":"第一单元 中国开始沦为半殖民地半封建社会","name":"《南京条约》","formula":"1842年，中国近代第一个不平等条约","explanation":"【时间】1842年\n\n【性质】中国近代史上第一个不平等条约\n\n【主要内容】\n1. 割香港岛给英国\n2. 赔款2100万银元\n3. 开放广州、厦门、福州、宁波、上海五处为通商口岸\n4. 英商进出口货物应纳税款，必须经过双方协议\n\n【影响】\n严重破坏了中国的主权和领土完整，中国开始沦为半殖民地半封建社会。","id":"g1_history_u002","semester":"upper"},{"chapter":"第一单元 中国开始沦为半殖民地半封建社会","name":"第二次鸦片战争","formula":"1856-1860年，英法联军，火烧圆明园","explanation":"【时间】1856年-1860年\n\n【发动国】英国、法国\n\n【借口】\"亚罗号事件\"和\"马神甫事件\"\n\n【主要事件】\n1. 1860年，英法联军火烧圆明园\n2. 签订《天津条约》《北京条约》\n3. 沙俄趁火打劫，割占中国东北和西北150多万平方公里领土\n\n【影响】\n中国半殖民地化程度进一步加深。","id":"g1_history_u003","semester":"upper"},{"chapter":"第一单元 中国开始沦为半殖民地半封建社会","name":"太平天国运动","formula":"1851-1864年，洪秀全，农民起义的最高峰","explanation":"【时间】1851年-1864年\n\n【领导人】洪秀全\n\n【经过】\n1. 1851年，金田起义，建号太平天国\n2. 1853年，定都天京（南京）\n3. 颁布《天朝田亩制度》\n4. 1856年，天京事变，由盛转衰\n5. 1864年，天京陷落，运动失败\n\n【意义】\n太平天国运动是中国历史上规模最宏大的一次农民战争，沉重打击了清朝统治和外国侵略势力。","id":"g1_history_u004","semester":"upper"},{"chapter":"第一单元 中国开始沦为半殖民地半封建社会","name":"林则徐与虎门销烟","formula":"1839年，民族英雄，中国人民禁烟斗争的胜利","explanation":"【时间】1839年6月\n\n【人物】林则徐\n\n【背景】英国向中国走私鸦片，给中华民族带来深重灾难。\n\n【经过】1839年6月，林则徐在广州虎门海滩当众销毁收缴的鸦片。\n\n【意义】\n虎门销烟是中国人民禁烟斗争的伟大胜利，显示了中华民族反抗外来侵略的坚强意志。林则徐是当之无愧的民族英雄。","id":"g1_history_u005","semester":"upper"},{"chapter":"第二单元 近代化的早期探索与民族危机的加剧","name":"洋务运动","formula":"19世纪60-90年代，自强求富，地主阶级自救运动","explanation":"【时间】19世纪60年代-90年代\n\n【口号】自强、求富\n\n【目的】利用西方先进技术，强兵富国，维护清朝统治\n\n【代表人物】奕䜣、曾国藩、李鸿章、左宗棠、张之洞\n\n【主要内容】\n1. 创办近代军事工业（安庆内军械所、江南制造总局）\n2. 创办近代民用企业（轮船招商局、汉阳铁厂）\n3. 建立新式海陆军\n4. 兴办新式学校，派遣留学生\n\n【评价】洋务运动是中国历史上第一次近代化运动，客观上促进了中国民族资本主义的产生，但没有使中国走上富强的道路。","id":"g1_history_u006","semester":"upper"},{"chapter":"第二单元 近代化的早期探索与民族危机的加剧","name":"甲午中日战争","formula":"1894-1895年，黄海海战，威海卫战役","explanation":"【时间】1894年-1895年\n\n【主要战役】\n1. 黄海大战：邓世昌壮烈殉国\n2. 威海卫战役：北洋舰队全军覆没\n\n【结果】清政府战败，签订《马关条约》\n\n【影响】\n1. 使外国侵略势力进一步深入中国腹地\n2. 大大加深了中国的半殖民地化程度\n3. 刺激了列强瓜分中国的野心","id":"g1_history_u007","semester":"upper"},{"chapter":"第二单元 近代化的早期探索与民族危机的加剧","name":"《马关条约》","formula":"1895年，李鸿章与伊藤博文，割台湾，设工厂","explanation":"【时间】1895年\n\n【签订双方】李鸿章（清）、伊藤博文（日）\n\n【主要内容】\n1. 割辽东半岛、台湾全岛及所有附属各岛屿、澎湖列岛给日本\n2. 赔偿日本兵费白银2亿两\n3. 开放沙市、重庆、苏州、杭州为商埠\n4. 允许日本在通商口岸开设工厂\n\n【影响】\n《马关条约》使外国侵略势力进一步深入中国腹地，大大加深了中国的半殖民地化程度。允许日本开设工厂，标志着列强对中国的经济侵略由商品输出为主转向资本输出为主。","id":"g1_history_u008","semester":"upper"},{"chapter":"第二单元 近代化的早期探索与民族危机的加剧","name":"戊戌变法","formula":"1898年，康有为、梁启超，百日维新","explanation":"【时间】1898年（农历戊戌年）\n\n【代表人物】康有为、梁启超、谭嗣同等\n\n【背景】《马关条约》签订后，民族危机空前严重。\n\n【经过】\n1. 公车上书：拉开了变法维新运动的序幕\n2. 创办报刊，宣传变法思想\n3. 1898年，光绪帝颁布\"明定国是\"诏书，宣布变法\n4. 历时103天，又称\"百日维新\"\n5. 慈禧太后发动戊戌政变，变法失败\n\n【意义】\n戊戌变法在思想文化方面产生了广泛而持久的影响，起到了思想启蒙的作用。","id":"g1_history_u009","semester":"upper"},{"chapter":"第二单元 近代化的早期探索与民族危机的加剧","name":"八国联军侵华战争","formula":"1900-1901年，义和团运动，《辛丑条约》","explanation":"【时间】1900年-1901年\n\n【发动国】英、美、俄、日、法、德、意、奥八国\n\n【目的】镇压义和团运动，维护在华利益\n\n【结果】清政府战败，签订《辛丑条约》\n\n【义和团运动】\n一场反帝爱国运动，提出\"扶清灭洋\"口号，沉重打击了帝国主义瓜分中国的野心。","id":"g1_history_u010","semester":"upper"},{"chapter":"第二单元 近代化的早期探索与民族危机的加剧","name":"《辛丑条约》","formula":"1901年，赔款4.5亿两，中国完全沦为半殖民地半封建社会","explanation":"【时间】1901年\n\n【主要内容】\n1. 清政府赔款白银4.5亿两，分39年还清，本息共计9.8亿两\n2. 清政府保证严禁人民参加各种形式的反帝活动\n3. 清政府拆毁大沽炮台，允许外国军队驻扎在从北京到山海关的铁路沿线要地\n4. 划定北京东交民巷为使馆界，允许各国派兵驻守，不准中国人居住\n\n【影响】\n《辛丑条约》是中国近代史上赔款数目最庞大、主权丧失最严重的不平等条约。从此，清政府沦为帝国主义列强统治中国的工具，中国完全陷入半殖民地半封建社会的深渊。","id":"g1_history_u011","semester":"upper"},{"chapter":"第三单元 资产阶级民主革命与中华民国的建立","name":"辛亥革命","formula":"1911年，孙中山，推翻清朝统治，结束封建帝制","explanation":"【时间】1911年（农历辛亥年）\n\n【指导思想】三民主义（民族、民权、民生）\n\n【领导人】孙中山\n\n【经过】\n1. 1894年，孙中山成立兴中会\n2. 1905年，成立中国同盟会\n3. 1911年10月10日，武昌起义爆发\n4. 1912年1月1日，中华民国临时政府成立\n\n【意义】\n辛亥革命推翻了清王朝的反动统治，宣告了中国两千多年君主专制制度的终结。它开创了完全意义上的近代民族民主革命，极大推动了中华民族的思想解放，打开了中国进步潮流的闸门。","id":"g1_history_u012","semester":"upper"},{"chapter":"第三单元 资产阶级民主革命与中华民国的建立","name":"孙中山与三民主义","formula":"民族、民权、民生，辛亥革命的指导思想","explanation":"【人物】孙中山，中国民主革命的先行者\n\n【三民主义】\n1. 民族主义：\"驱除鞑虏，恢复中华\"，即推翻清王朝的统治，反对民族压迫\n2. 民权主义：\"创立民国\"，即推翻君主专制政体，建立资产阶级共和国\n3. 民生主义：\"平均地权\"，即解决土地问题\n\n【意义】\n三民主义是孙中山领导辛亥革命的指导思想，是比较完整的资产阶级民主革命纲领。","id":"g1_history_u013","semester":"upper"},{"chapter":"第三单元 资产阶级民主革命与中华民国的建立","name":"中华民国成立","formula":"1912年，南京，孙中山任临时大总统","explanation":"【时间】1912年1月1日\n\n【地点】南京\n\n【临时大总统】孙中山\n\n【重要文件】\n《中华民国临时约法》：中国历史上第一部具有资产阶级共和国宪法性质的重要文件，肯定了资产阶级民主共和制度和民主自由原则。\n\n【结果】\n袁世凯窃取了辛亥革命的胜利果实，建立起北洋军阀的统治。","id":"g1_history_u014","semester":"upper"},{"chapter":"第三单元 资产阶级民主革命与中华民国的建立","name":"北洋军阀的黑暗统治","formula":"袁世凯独裁，军阀割据混战","explanation":"【袁世凯独裁】\n1. 破坏责任内阁制，制造\"宋教仁案\"\n2. 镇压二次革命\n3. 强迫国会选举他为正式大总统\n4. 解散国会，废除《临时约法》\n5. 复辟帝制，改国号为\"中华帝国\"\n\n【军阀割据】\n袁世凯死后，北洋军阀分裂为直系、皖系、奉系等派系，中国陷入军阀割据混战的局面，给中国人民带来深重灾难。","id":"g1_history_u015","semester":"upper"},{"chapter":"第四单元 新民主主义革命的开始","name":"新文化运动","formula":"1915年开始，民主与科学，思想解放运动","explanation":"【开始标志】1915年，陈独秀在上海创办《青年杂志》（后改名为《新青年》）\n\n【口号】民主（德先生）、科学（赛先生）\n\n【代表人物】陈独秀、李大钊、胡适、鲁迅\n\n【主要内容】\n1. 抨击旧道德和旧文化\n2. 提倡民主与科学\n3. 进行文学革命，提倡新文学，反对旧文学\n\n【意义】\n新文化运动动摇了封建道德礼教的统治地位，使中国人民接受了一次民主与科学的洗礼，为随后爆发的五四运动起了思想宣传和铺垫的作用。它是一次伟大的思想解放运动。","id":"g1_history_u016","semester":"upper"},{"chapter":"第四单元 新民主主义革命的开始","name":"五四运动","formula":"1919年，反帝反封建，新民主主义革命的开端","explanation":"【时间】1919年5月4日\n\n【导火线】巴黎和会上中国外交的失败\n\n【口号】\"外争主权，内除国贼\"、\"誓死力争，还我青岛\"等\n\n【经过】\n1. 第一阶段：北京学生罢课游行\n2. 第二阶段：上海工人罢工，商人罢市，运动中心由北京转到上海，工人阶级成为主力\n\n【结果】北洋政府释放被捕学生，罢免曹汝霖等人的职务，拒绝在\"巴黎和约\"上签字，五四运动取得初步胜利。\n\n【意义】\n五四运动是一次彻底地反对帝国主义和封建主义的爱国运动，是中国新民主主义革命的开端。","id":"g1_history_u017","semester":"upper"},{"chapter":"第四单元 新民主主义革命的开始","name":"中国共产党的诞生","formula":"1921年，中共一大，开天辟地的大事变","explanation":"【时间】1921年7月\n\n【地点】上海（后转移到浙江嘉兴南湖的游船上）\n\n【标志】中国共产党第一次全国代表大会的召开\n\n【代表】毛泽东、董必武、李达等13人\n\n【思想基础】\n五四运动后，马克思主义在中国广泛传播。1919年，《新青年》出版\"马克思主义研究专号\"，刊载了李大钊的文章《我的马克思主义观》，对马克思主义作了较为系统的介绍。李大钊是在中国传播马克思主义的先驱。\n\n【中共一大内容】\n1. 通过了中国共产党历史上第一个党纲\n2. 确定党的名称为中国共产党\n3. 确定党的奋斗目标是推翻资产阶级政权，建立无产阶级专政，实现共产主义\n4. 确定党的中心工作是领导和组织工人运动\n5. 成立了党的中央领导机构中央局，陈独秀当选为中央局书记\n\n【意义】\n中国共产党的诞生，是中国历史上开天辟地的大事变。自从有了中国共产党，中国革命的面貌就焕然一新了。","id":"g1_history_u018","semester":"upper"},{"chapter":"第五单元 从国共合作到国共对峙","name":"国民革命运动","formula":"1924-1927年，国共第一次合作，北伐战争","explanation":"【时间】1924年-1927年\n\n【国共合作的实现】\n1924年，中国国民党第一次全国代表大会在广州召开，标志着国共两党合作的正式建立。\n\n【主要事件】\n1. 黄埔军校的建立：1924年，孙中山在广州黄埔创办，培养军事和政治人才\n2. 北伐战争：1926年开始，北伐军出师北伐，基本推翻了北洋军阀的统治\n3. 国民党右派叛变革命：1927年，蒋介石、汪精卫发动反革命政变，国民革命失败\n\n【教训】\n必须坚持无产阶级对革命的领导权，必须掌握革命武装，必须进行武装斗争。","id":"g1_history_u019","semester":"upper"},{"chapter":"第五单元 从国共合作到国共对峙","name":"南昌起义","formula":"1927年8月1日，武装反抗国民党反动派的第一枪","explanation":"【时间】1927年8月1日\n\n【地点】江西南昌\n\n【领导人】周恩来、贺龙、叶挺、朱德、刘伯承等\n\n【结果】南昌起义打响了武装反抗国民党反动派的第一枪。\n\n【意义】\n南昌起义是中国共产党独立领导武装斗争、创建人民军队和武装夺取政权的开端。8月1日后来被定为中国人民解放军建军节。","id":"g1_history_u020","semester":"upper"},{"chapter":"第五单元 从国共合作到国共对峙","name":"井冈山革命根据地","formula":"第一个农村革命根据地，农村包围城市的道路","explanation":"【建立时间】1927年10月\n\n【建立者】毛泽东\n\n【背景】\n1927年秋收起义后，毛泽东分析了敌强我弱的形势，决定放弃攻打中心城市，改向敌人统治力量薄弱的农村进军。\n\n【意义】\n井冈山革命根据地是中国第一个农村革命根据地，开辟了农村包围城市、武装夺取政权的道路。这是一条符合中国国情的正确的革命道路。\n\n【井冈山会师】\n1928年4月，朱德、陈毅率领南昌起义的部分军队和湘南的工农武装，与毛泽东率领的工农革命军在井冈山会师，合编为中国工农红军第四军。","id":"g1_history_u021","semester":"upper"},{"chapter":"第五单元 从国共合作到国共对峙","name":"红军长征","formula":"1934-1936年，战略转移，长征精神","explanation":"【时间】1934年10月-1936年10月\n\n【原因】\n由于博古、李德等人在军事指挥上\"左\"的错误，第五次反\"围剿\"失败，红军被迫进行战略转移。\n\n【重要事件】\n1. 遵义会议：1935年1月，确立了以毛泽东为主要代表的马克思主义正确路线在中共中央的领导地位，是党的历史上生死攸关的转折点\n2. 四渡赤水：打乱了敌人的追剿计划\n3. 巧渡金沙江：跳出了敌人的重重包围\n4. 强渡大渡河，飞夺泸定桥\n5. 翻雪山，过草地\n6. 1935年10月，中央红军到达陕北吴起镇\n7. 1936年10月，红军三大主力在甘肃会宁会师，长征胜利结束\n\n【意义】\n长征的胜利，粉碎了国民党反动派消灭红军的企图，保存了党和红军的基干力量，使中国革命转危为安。长征播下了革命种子，铸就了长征精神，打开了中国革命的新局面。","id":"g1_history_u022","semester":"upper"},{"chapter":"第五单元 从国共合作到国共对峙","name":"遵义会议","formula":"1935年，生死攸关的转折点","explanation":"【时间】1935年1月\n\n【地点】贵州遵义\n\n【主要内容】\n1. 集中全力纠正博古等人在军事上和组织上\"左\"的错误\n2. 肯定了毛泽东的正确军事主张\n3. 选举毛泽东为中央政治局常委\n4. 取消了博古、李德的军事最高指挥权\n\n【意义】\n遵义会议开始确立以毛泽东为主要代表的马克思主义正确路线在中共中央的领导地位，在极其危急的情况下，挽救了党，挽救了红军，挽救了中国革命，是中国共产党历史上一个生死攸关的转折点。这次会议是中国共产党从幼年走向成熟的标志。","id":"g1_history_u023","semester":"upper"},{"chapter":"第六单元 中华民族的抗日战争","name":"九一八事变","formula":"1931年9月18日，中国人民抗日战争的起点","explanation":"【时间】1931年9月18日\n\n【经过】\n日本关东军炸毁沈阳北郊柳条湖附近南满铁路的一段路轨，反诬中国军队破坏，以此为借口，突然袭击中国东北军驻地北大营，炮轰沈阳城。这就是震惊中外的\"九一八事变\"。\n\n【结果】\n东北三省全部沦陷。1932年，日本扶植溥仪在长春建立伪满洲国。\n\n【意义】\n九一八事变成为中国人民抗日战争的起点，揭开了世界反法西斯战争的序幕。从此，中国人民开始了艰苦卓绝的抗日战争。","id":"g1_history_u024","semester":"upper"},{"chapter":"第六单元 中华民族的抗日战争","name":"西安事变","formula":"1936年12月12日，张学良、杨虎城，抗日民族统一战线初步形成","explanation":"【时间】1936年12月12日\n\n【发动者】张学良、杨虎城\n\n【目的】逼蒋抗日\n\n【经过】\n1936年12月12日，张学良、杨虎城在西安扣押蒋介石，实行\"兵谏\"，并通电全国，要求停止内战，一致抗日。这就是震惊中外的\"西安事变\"。\n\n【结果】\n中国共产党从全民族利益出发，派周恩来等到西安参加谈判，蒋介石被迫接受停止内战、联共抗日等条件，西安事变和平解决。\n\n【意义】\n西安事变的和平解决，揭开了国共两党由内战到联合抗日的序幕，成为扭转时局的关键。从此，十年内战基本停止，抗日民族统一战线初步形成。","id":"g1_history_u025","semester":"upper"},{"chapter":"第六单元 中华民族的抗日战争","name":"七七事变（卢沟桥事变）","formula":"1937年7月7日，中国全民族抗战的开始","explanation":"【时间】1937年7月7日\n\n【地点】北平西南的卢沟桥\n\n【经过】\n1937年7月7日晚，日军以军事演习中一名士兵失踪为借口，要求进入宛平城搜查，遭到中国守军的严词拒绝。日军悍然向卢沟桥的中国守军发起进攻，并炮轰宛平城。这就是\"七七事变\"，又称\"卢沟桥事变\"。\n\n【意义】\n七七事变标志着中国全民族抗战的开始。\n\n【抗日英雄】\n佟麟阁、赵登禹等在保卫北平的战斗中壮烈殉国。","id":"g1_history_u026","semester":"upper"},{"chapter":"第六单元 中华民族的抗日战争","name":"南京大屠杀","formula":"1937年12月，30万同胞遇难，人类历史上的暴行","explanation":"【时间】1937年12月开始，持续六周\n\n【地点】南京\n\n【经过】\n1937年12月13日，日军攻陷南京。在六周之内，日军屠杀手无寸铁的中国居民和放下武器的士兵达30万人以上。\n\n【特点】\n手段残忍，包括集体枪杀、焚烧、活埋、砍头等，其残忍程度令人发指。\n\n【认识】\n南京大屠杀是人类历史上罕见的暴行，充分暴露了日本军国主义的凶恶本质。我们要铭记历史，勿忘国耻，珍爱和平。","id":"g1_history_u027","semester":"upper"},{"chapter":"第六单元 中华民族的抗日战争","name":"抗日战争的胜利","formula":"1945年8月15日，近代以来反抗外敌入侵第一次完全胜利","explanation":"【时间】1945年8月15日，日本宣布无条件投降\n\n【胜利原因】\n1. 中国共产党在全民族团结抗战中发挥了中流砥柱的作用\n2. 以国共合作为主体的抗日民族统一战线的建立\n3. 全民族的英勇抗战\n4. 世界反法西斯国家和人民的支持\n\n【意义】\n抗日战争的胜利，是中国近代以来反抗外敌入侵第一次取得完全胜利的民族解放战争。它促进了中华民族的觉醒，为中国共产党带领中国人民实现彻底的民族独立和人民解放奠定了重要基础。中国战场是世界反法西斯战争的东方主战场，对世界反法西斯战争的胜利、维护世界和平作出了巨大贡献。","id":"g1_history_u028","semester":"upper"},{"chapter":"第六单元 中华民族的抗日战争","name":"台儿庄战役与百团大战","formula":"正面战场与敌后战场的典型战役","explanation":"【台儿庄战役】\n- 时间：1938年\n- 指挥：李宗仁\n- 结果：歼敌一万余人\n- 意义：抗战以来中国正面战场取得的最大的一场胜仗，振奋了中国军民的精神，坚定了抗战意志和信念\n\n【百团大战】\n- 时间：1940年\n- 指挥：彭德怀\n- 目标：破袭日军交通线，摧毁日伪军据点\n- 意义：有力打击了日军的侵略气焰，提高了共产党和八路军的威望，振奋了全国军民争取抗战胜利的信心","id":"g1_history_u029","semester":"upper"},{"chapter":"第六单元 中华民族的抗日战争","name":"中共七大","formula":"1945年，确立毛泽东思想为党的指导思想","explanation":"【时间】1945年4月-6月\n\n【地点】延安\n\n【主要内容】\n1. 制定了党的政治路线：放手发动群众，壮大人民力量，在中国共产党的领导下，打败日本侵略者，解放全国人民，建立一个新民主主义的中国\n2. 选举产生了中央领导机关，毛泽东当选为中共中央主席\n3. 确立毛泽东思想为中国共产党的指导思想并写入党章\n\n【意义】\n中共七大为争取抗日战争的最后胜利准备了条件，并为中国共产党和中国人民指明了战后的奋斗方向。","id":"g1_history_u030","semester":"upper"},{"chapter":"第一单元 解放战争","name":"重庆谈判","formula":"1945年，毛泽东赴重庆谈判，争取和平民主","explanation":"【时间】1945年8月-10月\n\n【目的】\n蒋介石：为发动内战争取时间，在政治舆论上获得主动\n毛泽东：尽一切可能争取和平，戳穿蒋介石假和平的阴谋\n\n【结果】\n1945年10月10日，国共双方签署《政府与中共代表会谈纪要》，即\"双十协定\"。双方同意以和平、民主、团结、统一为基础，长期合作，坚决避免内战。\n\n【意义】\n重庆谈判与\"双十协定\"的签订，为中国实现民主统一、和平建国带来了一线曙光。","id":"g1_history_l001","semester":"lower"},{"chapter":"第一单元 解放战争","name":"全面内战爆发","formula":"1946年6月，国民党进攻中原解放区","explanation":"【时间】1946年6月\n\n【标志】\n蒋介石公然违背\"双十协定\"，撕毁政协决议，全力围攻中原解放区，发动了全面内战。\n\n【战争初期形势】\n国民党在军事和经济上占有明显优势，扬言要在三五个月内消灭共产党领导的人民军队。\n\n【战略战术】\n中共中央制定了以运动战为主要方式，以歼灭敌人有生力量为主要目标，集中优势兵力各个歼灭敌人的作战原则和方针。","id":"g1_history_l002","semester":"lower"},{"chapter":"第一单元 解放战争","name":"挺进大别山","formula":"1947年夏，刘邓大军，战略进攻的序幕","explanation":"【时间】1947年夏\n\n【指挥】刘伯承、邓小平\n\n【经过】\n刘伯承、邓小平率领晋冀鲁豫解放军主力，在山东西南强渡黄河，向国民党统治区发动大规模进攻，直插敌人兵力空虚的大别山地区。\n\n【意义】\n刘邓大军挺进大别山，直接威胁到南京、武汉，揭开了人民解放军战略进攻的序幕。人民解放战争由战略防御转入战略进攻。","id":"g1_history_l003","semester":"lower"},{"chapter":"第一单元 解放战争","name":"三大战役","formula":"辽沈、淮海、平津战役，国民党军队主力基本被消灭","explanation":"【辽沈战役】\n- 时间：1948年9月-11月\n- 指挥：林彪、罗荣桓\n- 意义：解放东北全境，人民解放军在数量上取得对国民党军队的优势\n\n【淮海战役】\n- 时间：1948年11月-1949年1月\n- 指挥：刘伯承、邓小平、陈毅、粟裕、谭震林\n- 意义：解放了长江中下游以北的广大地区，为解放长江以南各省奠定了基础\n\n【平津战役】\n- 时间：1948年11月-1949年1月\n- 意义：华北全境基本解放，北平和平解放，保护了古都的文化遗产\n\n【三大战役的意义】\n三大战役共歼灭和改编国民党军队150多万人，国民党军队的主力基本被消灭，大大加速了人民解放战争在全国的胜利。","id":"g1_history_l004","semester":"lower"},{"chapter":"第一单元 解放战争","name":"渡江战役与南京解放","formula":"1949年4月，结束国民党在大陆的统治","explanation":"【时间】1949年4月\n\n【经过】\n1949年4月，人民解放军百万雄师兵分三路，横渡长江。4月23日，南京解放。\n\n【意义】\n南京解放，标志着国民党在大陆的统治结束。国民党残余势力退往台湾。\n\n【人民解放战争胜利的原因】\n1. 中国共产党的正确领导\n2. 人民解放军的英勇作战\n3. 广大人民群众的支持\n4. 国民党统治腐朽，不得人心","id":"g1_history_l005","semester":"lower"},{"chapter":"第二单元 中华人民共和国的成立和巩固","name":"开国大典","formula":"1949年10月1日，新中国成立","explanation":"【时间】1949年10月1日\n\n【地点】北京天安门广场\n\n【经过】\n毛泽东向全世界庄严宣告：\"中华人民共和国中央人民政府今天成立了！\"他按动电钮，升起了新中国第一面五星红旗。接着，举行了盛大的阅兵式和群众游行。\n\n【新中国成立的意义】\n1. 中华人民共和国的成立，开辟了中国历史的新纪元\n2. 中国人民经过一百多年的英勇斗争，终于推翻了帝国主义、封建主义和官僚资本主义的统治\n3. 中国真正成为独立自主的国家，中国人从此站起来了\n4. 新中国的成立，壮大了世界和平民主和社会主义的力量","id":"g1_history_l006","semester":"lower"},{"chapter":"第二单元 中华人民共和国的成立和巩固","name":"抗美援朝","formula":"1950-1953年，保家卫国，最可爱的人","explanation":"【时间】1950年10月-1953年7月\n\n【目的】抗美援朝，保家卫国\n\n【军队】中国人民志愿军，彭德怀任司令员\n\n【英雄人物】\n黄继光：用胸膛堵住敌人的机枪射口，掩护战友夺回阵地，壮烈牺牲\n邱少云：为了保证战斗的胜利和潜伏部队的安全，严守潜伏纪律，直至被大火吞噬，壮烈牺牲\n\n【结果】1953年7月，美国被迫在停战协定上签字，中朝人民取得反侵略战争的胜利\n\n【意义】\n抗美援朝战争的胜利，为我国的经济建设赢得一个相对稳定的和平环境，大大提高了我国的国际地位。中国人民志愿军在抗美援朝战争中，发扬高度的爱国主义、革命英雄主义和国际主义精神，被誉为\"最可爱的人\"。","id":"g1_history_l007","semester":"lower"},{"chapter":"第二单元 中华人民共和国的成立和巩固","name":"土地改革","formula":"1950-1952年，废除封建土地制度，农民成为土地的主人","explanation":"【时间】1950年-1952年底\n\n【法律依据】《中华人民共和国土地改革法》\n\n【内容】\n废除地主阶级封建剥削的土地所有制，实行农民的土地所有制。\n\n【结果】\n到1952年底，除部分少数民族地区外，全国大陆基本上完成了土地改革。\n\n【意义】\n1. 彻底摧毁了我国存在2000多年的封建土地制度，消灭了地主阶级\n2. 农民翻了身，得到了土地，成为土地的主人\n3. 人民政权更加巩固，也大大解放了农村生产力\n4. 农业生产获得迅速恢复和发展，为国家的工业化建设准备了条件","id":"g1_history_l008","semester":"lower"},{"chapter":"第三单元 社会主义制度的建立与社会主义建设的探索","name":"第一个五年计划","formula":"1953-1957年，集中主要力量发展重工业","explanation":"【时间】1953年-1957年\n\n【基本任务】\n集中主要力量发展重工业，建立国家工业化和国防现代化的初步基础；相应地发展交通运输业、轻工业、农业和商业；相应地培养建设人才。\n\n【主要成就】\n1. 工业：鞍山钢铁公司无缝钢管厂等三大工程、长春第一汽车制造厂、沈阳第一机床厂和飞机制造厂等建成投产\n2. 交通运输业：新建宝成、鹰厦等铁路30余条；川藏、青藏、新藏公路相继通车；武汉长江大桥建成\n\n【意义】\n第一个五年计划的完成，使我国开始改变工业落后的面貌，向社会主义工业化迈进。","id":"g1_history_l009","semester":"lower"},{"chapter":"第三单元 社会主义制度的建立与社会主义建设的探索","name":"三大改造","formula":"1953-1956年，农业、手工业、资本主义工商业改造","explanation":"【时间】1953年-1956年\n\n【内容】\n1. 对农业的社会主义改造：建立农业生产合作社，走集体化和共同富裕的社会主义道路\n2. 对手工业的社会主义改造：建立手工业生产合作社\n3. 对资本主义工商业的社会主义改造：实行公私合营，采取赎买政策，这是中国社会主义改造的创举\n\n【结果】\n到1956年底，国家基本上完成了对农业、手工业和资本主义工商业的社会主义改造。\n\n【意义】\n三大改造的完成，实现了生产资料私有制向社会主义公有制的转变。社会主义基本制度在我国建立起来，这是中国历史上最深刻的社会变革，我国从此进入社会主义初级阶段。","id":"g1_history_l010","semester":"lower"},{"chapter":"第三单元 社会主义制度的建立与社会主义建设的探索","name":"中共八大","formula":"1956年，探索建设社会主义道路的良好开端","explanation":"【时间】1956年\n\n【地点】北京\n\n【主要内容】\n1. 分析了当时国内的主要矛盾：人民对于建立先进的工业国的要求，同落后的农业国的现实之间的矛盾；人民对于经济文化迅速发展的需要，同当前经济文化不能满足人民需要的状况之间的矛盾\n2. 指出党和人民的主要任务是：集中力量把我国尽快地从落后的农业国变为先进的工业国\n\n【意义】\n中共八大以后，中国开始全面的大规模的社会主义建设。中共八大是探索建设社会主义道路的良好开端。","id":"g1_history_l011","semester":"lower"},{"chapter":"第三单元 社会主义制度的建立与社会主义建设的探索","name":"探索中的失误","formula":"大跃进、人民公社化运动、文化大革命","explanation":"【\"大跃进\"和人民公社化运动】\n- 时间：1958年\n- 原因：急于求成，忽视了客观的经济规律\n- 标志：高指标、瞎指挥、浮夸风、\"共产\"风\n- 影响：加上当时自然灾害严重等因素，1959年至1961年，我国的国民经济发生严重困难\n\n【文化大革命】\n- 时间：1966年-1976年\n- 原因：毛泽东对当时阶级斗争形势的错误估计\n- 危害：给党、国家和各族人民带来新中国成立后最严重的挫折，造成了巨大的损失\n\n【教训】\n要正确认识国内主要矛盾，要遵循客观经济规律，要发扬社会主义民主，健全社会主义法制。","id":"g1_history_l012","semester":"lower"},{"chapter":"第三单元 社会主义制度的建立与社会主义建设的探索","name":"建设成就与模范人物","formula":"大庆油田、两弹一星，王进喜、焦裕禄、雷锋","explanation":"【建设成就】\n1. 工业：大庆油田、胜利油田、大港油田等；武汉、包头两大钢铁基地；电子、原子能、航天工业从无到有地发展起来\n2. 科技：1964年，第一颗原子弹爆炸成功；1967年，第一颗氢弹爆炸成功；1970年，第一颗人造地球卫星发射成功\n3. 交通：兰新、兰青、包兰等铁路\n4. 水利：三门峡水利枢纽等工程\n\n【模范人物】\n1. 王进喜：大庆石油工人，被誉为\"铁人\"\n2. 焦裕禄：河南兰考县委书记，被称为\"党的好干部\"\n3. 雷锋：解放军战士，助人为乐，全心全意为人民服务\n4. 邓稼先：\"两弹元勋\"，为中国核武器事业作出卓越贡献\n\n【精神】\n艰苦奋斗、无私奉献、全心全意为人民服务的精神。","id":"g1_history_l013","semester":"lower"},{"chapter":"第四单元 中国特色社会主义道路","name":"十一届三中全会","formula":"1978年，改革开放的开端，伟大的历史转折","explanation":"【时间】1978年12月\n\n【地点】北京\n\n【主要内容】\n1. 思想上：确立了解放思想、开动脑筋、实事求是、团结一致向前看的指导方针\n2. 政治上：果断结束\"以阶级斗争为纲\"，作出了把党和国家的工作中心转移到经济建设上来，实行改革开放的历史性决策\n3. 组织上：实际上形成了以邓小平为核心的党的第二代中央领导集体\n\n【意义】\n中共十一届三中全会是新中国成立以来党的历史上具有深远意义的伟大转折，开启了改革开放和社会主义现代化建设新时期。","id":"g1_history_l014","semester":"lower"},{"chapter":"第四单元 中国特色社会主义道路","name":"改革开放","formula":"对内改革，对外开放，中国特色社会主义道路","explanation":"【对内改革】\n1. 农村：实行家庭联产承包责任制，激发了农民的劳动热情，带来农村生产力的大解放\n2. 城市：从1985年起，城市改革全面展开，重点是国有企业的改革，中心环节是增强企业活力\n\n【对外开放】\n1. 经济特区：1980年，设立深圳、珠海、汕头、厦门4个经济特区\n2. 沿海开放城市：1984年，进一步开放大连、天津、青岛、上海、广州等14个沿海城市\n3. 沿海经济开放区：1985年，把长江三角洲、珠江三角洲和闽南三角地区开辟为沿海经济开放区\n4. 1988年，增设海南岛经济特区；1990年，上海浦东开发区建立\n5. 形成了\"经济特区-沿海开放城市-沿海经济开放区-内地\"的全方位、多层次、宽领域的对外开放格局\n\n【意义】\n改革开放是强国之路，使中国发生了翻天覆地的变化。","id":"g1_history_l015","semester":"lower"},{"chapter":"第四单元 中国特色社会主义道路","name":"邓小平理论","formula":"改革开放和社会主义现代化建设的指导思想","explanation":"【形成过程】\n1. 中共十一届三中全会前，邓小平提出要实行改革开放\n2. 改革开放后，邓小平提出必须坚持四项基本原则\n3. 1982年，中共十二大，邓小平提出\"建设有中国特色的社会主义\"\n4. 1987年，中共十三大，阐明了社会主义初级阶段理论，提出了党在社会主义初级阶段的基本路线\n5. 1992年，邓小平南方谈话，进一步解放了人们的思想\n6. 1992年，中共十四大，提出必须用邓小平建设有中国特色社会主义理论武装全党\n7. 1997年，中共十五大，把邓小平理论确立为党的指导思想\n\n【地位】\n邓小平理论是马克思主义在中国发展的新阶段，是改革开放和社会主义现代化建设的指导思想。邓小平是我国改革开放和社会主义现代化建设的总设计师。","id":"g1_history_l016","semester":"lower"},{"chapter":"第四单元 中国特色社会主义道路","name":"社会主义市场经济体制","formula":"使市场在国家宏观调控下对资源配置起基础性作用","explanation":"【提出】\n1992年，中共十四大明确提出要建立社会主义市场经济体制。\n\n【1993年】\n中共十四届三中全会通过《中共中央关于建立社会主义市场经济体制若干问题的决定》，指出：建立社会主义市场经济体制，就是要使市场在国家宏观调控下对资源配置起基础性作用。\n\n【意义】\n建立社会主义市场经济体制，有利于实现经济的协调发展和稳定高速增长，对现代化建设有巨大推动作用，使中国的经济实力明显增强。","id":"g1_history_l017","semester":"lower"},{"chapter":"第四单元 中国特色社会主义道路","name":"新时代中国特色社会主义","formula":"习近平新时代中国特色社会主义思想，中华民族伟大复兴","explanation":"【中共十八大】\n2012年，中共十八大提出了夺取中国特色社会主义新胜利的基本要求，确定了全面建成小康社会和全面深化改革开放的目标。\n\n【中共十九大】\n2017年，中共十九大召开，习近平新时代中国特色社会主义思想被确立为中国共产党必须长期坚持的指导思想。\n\n【中国梦】\n实现中华民族伟大复兴，就是中华民族近代以来最伟大的梦想。中国梦的基本内涵是国家富强、民族振兴、人民幸福。\n\n【\"两个一百年\"奋斗目标】\n到中国共产党成立100年时，全面建成小康社会；到中华人民共和国成立100年时，建成富强民主文明和谐美丽的社会主义现代化强国，实现中华民族伟大复兴。","id":"g1_history_l018","semester":"lower"},{"chapter":"第五单元 民族团结与祖国统一","name":"民族区域自治制度","formula":"基本政治制度，各民族共同繁荣发展","explanation":"【含义】\n民族区域自治是在国家统一领导下，在少数民族聚居的地方实行区域自治，按照民族聚居的人口多少和区域大小，设立不同级别的民族自治区域和自治机关。\n\n【五个省级自治区】\n内蒙古自治区、新疆维吾尔自治区、广西壮族自治区、宁夏回族自治区、西藏自治区\n\n【意义】\n1. 民族区域自治制度是我国的一项基本政治制度\n2. 体现了国家充分尊重和保障各少数民族管理本民族内部事务权利的精神\n3. 对维护民族团结、巩固祖国统一和促进少数民族地区发展具有重大意义\n4. 为实现各民族共同繁荣发展奠定了基础","id":"g1_history_l019","semester":"lower"},{"chapter":"第五单元 民族团结与祖国统一","name":"一国两制与港澳回归","formula":"一个国家，两种制度，1997年香港回归，1999年澳门回归","explanation":"【\"一国两制\"的构想】\n提出者：邓小平\n含义：在祖国统一的前提下，国家的主体坚持社会主义制度，同时在台湾、香港、澳门保持原有的资本主义制度和生活方式长期不变。\n\n【香港回归】\n时间：1997年7月1日\n意义：标志着中国人民洗雪了百年国耻，在完成祖国统一大业的道路上迈出了重要一步。\n\n【澳门回归】\n时间：1999年12月20日\n意义：标志着中国人民洗雪了百年国耻，在完成祖国统一大业的道路上迈出了重要一步。\n\n【港澳回归的原因】\n1. 中国综合国力的增强（根本原因）\n2. \"一国两制\"伟大构想的运用\n3. 全国人民的支持","id":"g1_history_l020","semester":"lower"},{"chapter":"第五单元 民族团结与祖国统一","name":"海峡两岸的交往","formula":"一个中国原则，和平统一，一国两制","explanation":"【对台基本方针】\n和平统一，一国两制\n\n【发展历程】\n1. 1979年，全国人大常委会发表《告台湾同胞书》，宣布采用和平方式统一祖国的方针\n2. 1987年，台湾当局开始被迫调整\"三不\"政策，海峡两岸同胞近40年的隔绝状态终于被打破\n3. 1990年，台湾成立海峡交流基金会（海基会）\n4. 1991年，祖国大陆成立海峡两岸关系协会（海协会）\n5. 1992年，两会达成\"海峡两岸均坚持一个中国原则\"的共识，即\"九二共识\"\n6. 1993年，\"汪辜会谈\"，海峡两岸关系的发展迈出了历史性的重要一步\n7. 2005年，中国国民党主席连战率\"和平之旅\"访问团访问中国大陆\n8. 2008年，两岸实现\"三通\"（通邮、通航、通商）\n\n【统一趋势】\n实现祖国统一是历史发展的必然趋势，是海峡两岸人民的共同心愿。","id":"g1_history_l021","semester":"lower"},{"chapter":"第六单元 国防建设与外交成就","name":"国防建设","formula":"海陆空军和导弹部队，强军兴军","explanation":"【人民海军】\n1. 新中国成立前夕，中国人民解放军的第一支海军部队——华东军区海军建立\n2. 新中国成立后，又建立了东海、南海和北海舰队\n3. 1971年，我国自行研制的导弹驱逐舰完成了多次科学试验和对外出访任务\n4. 2012年9月，我国第一艘航空母舰\"辽宁舰\"交接入列\n\n【人民空军】\n1. 人民空军是在陆军的基础上建立起来的\n2. 空军刚刚诞生，就面临抗美援朝战争的考验\n3. 改革开放以来，空军的现代化建设有了新的飞跃，成为保卫祖国领空的钢铁卫士\n\n【导弹部队】\n1. 1966年，中国组建第二炮兵部队，2015年更名为火箭军\n2. 是中国战略威慑的核心力量，主要担负遏制他国对中国使用核武器、遂行核反击和常规导弹精确打击任务\n\n【新时代强军之路】\n全面推进国防和军队现代化，把人民军队全面建成世界一流军队。","id":"g1_history_l022","semester":"lower"},{"chapter":"第六单元 国防建设与外交成就","name":"独立自主的和平外交政策","formula":"和平共处五项原则，求同存异","explanation":"【外交政策】\n新中国建立以后，奉行独立自主的和平外交政策。\n\n【和平共处五项原则】\n1. 提出：1953年底，周恩来在接见印度代表团时首次提出\n2. 内容：互相尊重主权和领土完整，互不侵犯，互不干涉内政，平等互利，和平共处\n3. 意义：成为处理国与国之间关系的基本准则\n\n【万隆会议】\n1. 时间：1955年\n2. 地点：印度尼西亚的万隆\n3. 性质：第一次没有西方殖民主义国家参加的亚非会议\n4. 方针：周恩来提出\"求同存异\"的方针，促进了会议的圆满成功，加强了同亚非各国的团结与合作","id":"g1_history_l023","semester":"lower"},{"chapter":"第六单元 国防建设与外交成就","name":"中国恢复在联合国的合法席位","formula":"1971年，第26届联合国大会，外交事业的重大胜利","explanation":"【时间】1971年10月\n\n【事件】\n第26届联合国大会通过决议，恢复中华人民共和国在联合国的一切合法权利，并立即把国民党集团的代表从联合国及其所属一切机构中驱逐出去。\n\n【原因】\n1. 中国综合国力的增强，国际地位的提高（根本原因）\n2. 第三世界国家的支持\n3. 中国长期坚持独立自主的和平外交政策\n\n【意义】\n这是中国外交的重大胜利。中国积极参与国际事务，作为联合国安理会常任理事国之一，发挥了重要作用。","id":"g1_history_l024","semester":"lower"},{"chapter":"第六单元 国防建设与外交成就","name":"中美、中日关系正常化","formula":"1972年尼克松访华，1979年中美建交","explanation":"【中美关系正常化】\n1. 1971年7月，基辛格秘密访问中国\n2. 1972年，尼克松访华，中美双方正式签署并发表了《联合公报》，两国关系开始走向正常化\n3. 1979年，中美正式建立外交关系。美国承认只有一个中国，台湾是中国领土的一部分，承认中华人民共和国政府是中国的唯一合法政府\n\n【中日关系正常化】\n1. 1972年，日本首相田中角荣访华，中日两国正式建立外交关系\n2. 接着，出现了与中国建交的热潮\n\n【影响】\n中国外交出现了新局面，许多国家纷纷与中国建立外交关系。","id":"g1_history_l025","semester":"lower"},{"chapter":"第七单元 科技文化与社会生活","name":"两弹一星","formula":"原子弹、氢弹、人造卫星，钱学森、邓稼先","explanation":"【内容】\n\"两弹一星\"指核弹（原子弹、氢弹）、导弹和人造地球卫星。\n\n【成就】\n1. 1964年10月16日，我国第一颗原子弹爆炸成功\n2. 1966年，我国第一颗装有核弹头的地地导弹飞行试验取得成功\n3. 1967年，我国第一颗氢弹爆炸成功\n4. 1970年，我国用长征号运载火箭，成功地发射了第一颗人造地球卫星——东方红一号，成为世界上第五个能独立发射人造地球卫星的国家\n\n【科学家】\n钱学森、邓稼先等科学家，被誉为\"两弹元勋\"。\n\n【意义】\n极大地鼓舞了中国人民的志气，振奋了中华民族的精神。它打破了当时有核大国的核垄断，增强了我国的国防实力，大大提高了我国的国际地位。","id":"g1_history_l026","semester":"lower"},{"chapter":"第七单元 科技文化与社会生活","name":"航天与农业科技成就","formula":"神舟系列飞船，袁隆平与杂交水稻，屠呦呦与青蒿素","explanation":"【航天技术】\n1. 1999年11月，神舟一号无人飞船成功完成载人航天工程的第一次飞行试验\n2. 2003年10月，航天员杨利伟乘坐神舟五号飞船升入太空，并成功返回地面。我国成为世界上第三个独立掌握载人航天技术的国家\n3. 2008年9月，神舟七号载人飞船升入太空，航天员翟志刚成功完成出舱任务，实现了太空行走\n4. 2022年，神舟十四号、十五号相继发射，中国空间站全面建成\n\n【农业科技】\n袁隆平是成功培育籼型杂交水稻的第一人，被誉为\"杂交水稻之父\"。\n\n【医药科技】\n屠呦呦领导科研团队，在20世纪70年代初发现了能够有效抵抗疟疾的青蒿素，获得2015年诺贝尔生理学或医学奖。","id":"g1_history_l027","semester":"lower"},{"chapter":"第七单元 科技文化与社会生活","name":"文化事业的发展","formula":"百花齐放、百家争鸣，文化自信","explanation":"【\"双百\"方针】\n1956年，毛泽东提出在科学文化工作中实行\"百花齐放\"\"百家争鸣\"的方针，即艺术问题上\"百花齐放\"，学术问题上\"百家争鸣\"。\n\n【主要成就】\n1. 文学：《红岩》《青春之歌》《茶馆》等优秀作品\n2. 艺术：《大决战》《开国大典》等优秀影片\n3. 2012年，中国作家莫言获得诺贝尔文学奖\n\n【文化自信】\n中华优秀传统文化是中华民族的精神命脉，是涵养社会主义核心价值观的重要源泉，也是我们在世界文化激荡中站稳脚跟的坚实根基。我们要坚定文化自信，推动社会主义文化繁荣兴盛。","id":"g1_history_l028","semester":"lower"},{"chapter":"第七单元 科技文化与社会生活","name":"社会生活的变迁","formula":"改革开放以来，衣食住行的巨大变化","explanation":"【衣】\n改革开放前：买衣服凭布票，色彩和样式单调\n改革开放后：衣着丰富多彩，服饰成为人们显示风度、展示个性的方式\n\n【食】\n改革开放前：食物匮乏、单调，饮食结构比较单一\n改革开放后：不但能\"吃饱\"，还要\"吃好\"，讲究营养均衡、粗细搭配，绿色食品等科学卫生的概念日益深入人心\n\n【住】\n改革开放前：住房比较拥挤，室内设施简单\n改革开放后：人均居住面积扩大，室内装修和居住环境明显改善\n\n【行】\n改革开放前：交通条件差，出行方式单一\n改革开放后：交通条件明显改善，铁路、公路、民用航空、水运和地下轨道交通飞速发展，人们出行更加方便快捷\n\n【总体变化】\n改革开放以来，城乡居民收入不断增长，消费总量不断增加，消费结构不断优化，人民生活水平大幅提高。","id":"g1_history_l029","semester":"lower"},{"chapter":"第七单元 科技文化与社会生活","name":"互联网与信息时代","formula":"信息技术改变生活，数字中国","explanation":"【发展概况】\n改革开放后，电信产业快速发展，我国电信网络规模和用户数均居全球第一。\n\n【互联网的影响】\n1. 信息传递更加快捷简便，改变了人们的生活方式和思想观念\n2. 促进了经济社会的发展，催生了许多新产业、新业态\n3. 深刻改变了人们的生产、生活、学习和娱乐方式\n4. 推动了科技创新和社会进步\n\n【数字中国】\n加快建设数字中国，推动互联网、大数据、人工智能和实体经济深度融合，发展数字经济、共享经济，培育新增长点、形成新动能。","id":"g1_history_l030","semester":"lower"}];

        const WrongBookManager = {
            STORAGE_KEY_PREFIX: 'wrongbook_',
            getWrongBook(grade, subject) {
                const key = this.STORAGE_KEY_PREFIX + grade + '_' + subject;
                return JSON.parse(localStorage.getItem(key) || '[]');
            },
            addWrongBook(item) {
                const key = this.STORAGE_KEY_PREFIX + item.grade + '_' + item.subject;

                const exists = wrongBook.some(w => w.question === item.question);

            }

        // 学习进度管理器
        const ProgressManager = {
            STORAGE_KEY: 'study_progress',
            
            getProgress() {
                try {
                    return JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
                } catch(e) {
                    return {};
                }
            },
            
            saveProgress(progress) {
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(progress));
            },
            
            recordStudy(grade, subject, subjectName, semester, semesterName, knowledgeId, knowledgeName) {
                const progress = this.getProgress();
                const now = new Date().toISOString();
                const today = new Date().toISOString().split('T')[0];
                
                if (!progress.learnedKnowledge) progress.learnedKnowledge = {};
                if (!progress.dailyStats) progress.dailyStats = {};
                if (!progress.dailyStats[today]) {
                    progress.dailyStats[today] = { learnedCount: 0, subjects: [] };
                }
                
                const isNew = !progress.learnedKnowledge[knowledgeId];
                progress.learnedKnowledge[knowledgeId] = { learnedAt: now };
                
                if (isNew) {
                    progress.dailyStats[today].learnedCount++;
                    if (!progress.dailyStats[today].subjects.includes(subject)) {
                        progress.dailyStats[today].subjects.push(subject);
                    }
                }

                    knowledgeId, knowledgeName, timestamp: now
                };

                const prefix = grade + '_' + subject + '_';
                const learned = Object.keys(progress.learnedKnowledge).filter(k => k.startsWith(prefix)).length;
                const total = DATA_KNOWLEDGE.length;
                const percent = total > 0 ? Math.round((learned / total) * 100) : 0;
                return { learned, total, percent };
            },
            
            clearSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                const prefix = grade + '_' + subject + '_';
                
                if (progress.learnedKnowledge) {
                    Object.keys(progress.learnedKnowledge).forEach(k => {
                        if (k.startsWith(prefix)) {
                            delete progress.learnedKnowledge[k];
                        }
                    });
                }
                
                if (progress.lastStudy && progress.lastStudy.grade === grade && progress.lastStudy.subject === subject) {
                    delete progress.lastStudy;
                }
                
                this.saveProgress(progress);
                return true;
            }
        };

        // URL参数解析
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                grade: 'g1',
                subject: 'history',
                semester: params.get('semester') || 'upper'
            };
        }

        const gradeNames = {'g1':'初一','g2':'初二','g3':'初三'};
        const subjectNames = {'history':'历史'};
        const semesterNames = {'upper':'上册','lower':'下册'};

        let currentParams = getUrlParams();
        let knowledgeList = [];
        let expandedIds = new Set();
        let currentExample = null;

        const pageTitle = document.getElementById('page-title');
        const pageSubtitle = document.getElementById('page-subtitle');
        const knowledgeListEl = document.getElementById('knowledge-list');
        const emptyStateEl = document.getElementById('empty-state');
        const searchResultsInfo = document.getElementById('search-results-info');
        const searchCountEl = document.getElementById('search-count');
        const searchInput = document.getElementById('search-input');

        function initPage() {
            const {grade, subject, semester} = currentParams;
            pageTitle.textContent = gradeNames[grade] + ' · ' + subjectNames[subject] + ' · ' + semesterNames[semester];
            loadKnowledge();
            updateProgressStat();
            
            const hash = window.location.hash.replace('#', '');
            if (hash && knowledgeList.some(k => k.id === hash)) {
                setTimeout(() => {
                    toggleExpand(hash);
                    const card = document.querySelector('[data-id="' + hash + '"]');
                    if (card) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
        }

        function updateProgressStat() {
            const {grade, subject} = currentParams;
            const learnedInSemester = knowledgeList.filter(k => ProgressManager.isLearned(k.id)).length;
            document.getElementById('progress-learned').textContent = learnedInSemester;
            document.getElementById('progress-total').textContent = knowledgeList.length;
        }

        function loadKnowledge() {
            const {grade, subject, semester} = currentParams;
            knowledgeList = DATA_KNOWLEDGE.filter(k => {
                return k.semester === semester;
            });
            renderKnowledgeList();
        }

        function renderKnowledgeList(items = knowledgeList) {
            if (items.length === 0) {
                knowledgeListEl.innerHTML = '';
                emptyStateEl.classList.remove('hidden');
                return;
            }
            emptyStateEl.classList.add('hidden');
            knowledgeListEl.innerHTML = items.map(item => {
                const isExpanded = expandedIds.has(item.id);
                const isLearned = ProgressManager.isLearned(item.id);
                return '<div class="card knowledge-card ' + (isLearned ? 'learned' : '') + '" data-id="' + item.id + '">' +
                    '<div class="knowledge-header p-4 flex items-center justify-between" onclick="toggleExpand(\'' + item.id + '\')">' +
                        '<div class="flex items-center gap-3 flex-1 min-w-0">' +
                            '<div class="expand-icon ' + (isExpanded ? 'expanded' : 'collapsed') + '">' + (isExpanded ? '−' : '+') + '</div>' +
                            '<div class="flex-1 min-w-0">' +
                                '<h3 class="text-lg font-semibold text-gray-800 flex items-center gap-2">' + escapeHtml(item.name) + (isLearned ? '<span class="text-green-500 text-sm">✓ 已学习</span>' : '') + '</h3>' +
                                '<p class="text-xs text-gray-500 mt-1">' + escapeHtml(item.chapter) + '</p>' +
                            '</div>' +
                        '</div>' +
                        (HAS_EXAMPLES ? '<button class="btn btn-secondary text-sm px-3 py-1" onclick="event.stopPropagation(); showExample(\'' + item.id + '\', \'' + escapeHtml(item.name) + '\')">例题</button>' : '') +
                    '</div>' +
                    '<div id="content-' + item.id + '" class="px-6 pb-4 ' + (isExpanded ? '' : 'hidden') + '">' +
                        (item.formula ? '<div class="mb-4"><h4 class="text-sm font-medium text-gray-500 mb-2">📐 公式</h4><p class="formula-box text-gray-800 text-lg bg-gray-50 p-3 rounded-lg">' + escapeHtml(item.formula) + '</p></div>' : '') +
                        (item.explanation ? '<div><h4 class="text-sm font-medium text-gray-500 mb-2">📝 解释</h4><p class="text-gray-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(item.explanation) + '</p></div>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function toggleExpand(id) {
            const isNewLearn = !expandedIds.has(id) && !ProgressManager.isLearned(id);
            if (expandedIds.has(id)) {
                expandedIds.delete(id);
            } else {
                expandedIds.add(id);
                const {grade, subject, semester} = currentParams;
                const item = knowledgeList.find(k => k.id === id);
                if (item) {
                    ProgressManager.recordStudy(
                        grade, subject, subjectNames[subject],
                        semester, semesterNames[semester],
                        id, item.name
                    );
                }
            }
            const card = document.querySelector('[data-id="' + id + '"]');
            const content = document.getElementById('content-' + id);
            const icon = card.querySelector('.expand-icon');
            const header = card.querySelector('.knowledge-header');
            const title = card.querySelector('h3');
            if (expandedIds.has(id)) {
                content.classList.remove('hidden');
                icon.classList.remove('collapsed');
                icon.classList.add('expanded');
                icon.textContent = '−';
                header.classList.add('expanded');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('expanded');
                icon.classList.add('collapsed');
                icon.textContent = '+';
                header.classList.remove('expanded');
            }
            if (isNewLearn) {
                card.classList.add('learned');
                if (!title.querySelector('.text-green-500')) {
                    title.innerHTML += '<span class="text-green-500 text-sm">✓ 已学习</span>';
                }
                updateProgressStat();
            }
        }

        function expandAll() {
            knowledgeList.forEach(item => expandedIds.add(item.id));
            renderKnowledgeList();
        }

        function collapseAll() {
            expandedIds.clear();
            renderKnowledgeList();
        }

        function searchKnowledge(keyword, list) {
            if (!keyword) return [];
            const lower = keyword.toLowerCase();
            return list.filter(k =>
                k.name.toLowerCase().includes(lower) ||
                k.chapter.toLowerCase().includes(lower)
            );
        }

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                searchResultsInfo.classList.add('hidden');
                renderKnowledgeList();
                return;
            }
            const results = searchKnowledge(keyword, knowledgeList);
            searchCountEl.textContent = results.length;
            searchResultsInfo.classList.remove('hidden');
            renderKnowledgeList(results);
        }

        function showExample(knowledgeId, knowledgeName) {
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === knowledgeId);
            if (examples.length === 0) {
                alert('暂无例题');
                return;
            }
            const example = examples[Math.floor(Math.random() * examples.length)];
            currentExample = {...example, knowledgeId, knowledgeName, ...currentParams};
            document.getElementById('example-knowledge-name').textContent = knowledgeName;
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
            document.getElementById('example-modal').classList.remove('hidden');
        }

        function nextExample() {
            if (!currentExample) return;
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === currentExample.knowledgeId);
            const otherExamples = examples.filter(e => e !== currentExample);
            if (otherExamples.length === 0) {
                alert('没有更多例题了');
                return;
            }
            const example = otherExamples[Math.floor(Math.random() * otherExamples.length)];
            currentExample = {...example, knowledgeId: currentExample.knowledgeId, knowledgeName: currentExample.knowledgeName, ...currentParams};
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
        }

        function addToWrongBook() {
            if (!currentExample) return;
            const item = {
                knowledgeId: currentExample.knowledgeId,
                knowledgeName: currentExample.knowledgeName,
                question: currentExample.question,
                answer: currentExample.answer,
                grade: currentParams.grade,
                subject: currentParams.subject
            };
            if (WrongBookManager.addWrongBook(item)) {
                alert('已加入错题本！');
            } else {
                alert('该题目已在错题本中');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearProgress() {
            const {grade, subject} = currentParams;
            const subjectName = subjectNames[subject];
            var msg = '确定要清除【' + subjectName + '】科目的所有学习进度吗？';
            msg += '\n\n';
            msg += '此操作将清除该科目所有已学习标记，且不可恢复。';
            if (!confirm(msg)) {
                return;
            }
            ProgressManager.clearSubjectProgress(grade, subject);
            updateProgressStat();
            renderKnowledgeList();
            alert('学习进度已清除');
        }

        document.getElementById('btn-expand-all').addEventListener('click', expandAll);
        document.getElementById('btn-collapse-all').addEventListener('click', collapseAll);
        document.getElementById('btn-clear-progress').addEventListener('click', clearProgress);
        searchInput.addEventListener('keyup', e => { if (e.key === 'Enter') performSearch(); });
        searchInput.addEventListener('input', () => { if (!searchInput.value) { searchResultsInfo.classList.add('hidden'); renderKnowledgeList(); }});
        document.getElementById('close-example').addEventListener('click', () => document.getElementById('example-modal').classList.add('hidden'));
        document.getElementById('btn-show-answer').addEventListener('click', () => {
            document.getElementById('example-answer-section').classList.remove('hidden');
            document.getElementById('btn-show-answer').classList.add('hidden');
        });
        document.getElementById('btn-next-example').addEventListener('click', nextExample);
        document.getElementById('btn-add-wrong').addEventListener('click', addToWrongBook);
        document.getElementById('example-modal').addEventListener('click', e => { if (e.target.id === 'example-modal') document.getElementById('example-modal').classList.add('hidden'); });

        initPage();
    </script>
</body>
</html>
