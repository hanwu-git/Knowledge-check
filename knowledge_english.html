"单项选择：— I have a fever. What _____ I do? — You _____ take some medicine. A. should, should  B. could, could  C. should, should  D. should, would","answer":"答案：C. should, should。解析：What should I do?是请求建议的句型。回答也用should提建议。"},{"id":"g2_english_u011_ex02","knowledge_id":"g2_english_u011","question":"句型转换：I don't know what to do. （同义句）","answer":"答案：I don't know what I should do. 解析：疑问词+to do结构等同于疑问词引导的宾语从句。"},{"id":"g2_english_u011_ex03","knowledge_id":"g2_english_u011","question":"单项选择：_____ I wear to the party tonight? A. How  B. What  C. Where  D. When","answer":"答案：B. What。解析：What should I wear?意为\"我该穿什么？\"what作wear的宾语。"},{"id":"g2_english_u011_ex04","knowledge_id":"g2_english_u011","question":"翻译句子：你能告诉我该怎么办吗？","answer":"答案：Could you tell me what I should do? 或 Could you tell me what to do? 解析：两种表达方式都对。"},{"id":"g2_english_u011_ex05","knowledge_id":"g2_english_u011","question":"用所给词的适当形式填空：— I failed the exam. What ______ (should) I do? — Don't worry. You ______ (should) try again.","answer":"答案：should, should。解析：第一句是请求建议，第二句是给出建议。"},{"id":"g2_english_u011_ex06","knowledge_id":"g2_english_u011","question":"单项选择：— What should we do to help him? — We _____ find someone to help us. A. should  B. could  C. would  D. must","answer":"答案：A. should。解析：should是直接建议。"},{"id":"g2_english_u011_ex07","knowledge_id":"g2_english_u011","question":"单项选择：I really don't know _____ I should do next. A. what  B. how  C. where  D. when","answer":"答案：A. what。解析：what to do是常见搭配，意为\"做什么\"。"},{"id":"g2_english_u011_ex08","knowledge_id":"g2_english_u011","question":"用所给词的适当形式填空：What ______ (should) I do if I lost my way?","answer":"答案：should。解析：What should I do if...是固定句型。"},{"id":"g2_english_u011_ex09","knowledge_id":"g2_english_u011","question":"单项选择：— What should I do? — You _____ ask the teacher for help. A. should  B. shouldn't  C. would  D. must","answer":"答案：A. should。解析：should是直接建议。"},{"id":"g2_english_u011_ex10","knowledge_id":"g2_english_u011","question":"翻译句子：如果你迷路了，你应该向警察求助。","answer":"答案：If you get lost, you should ask the police for help. 解析：ask sb. for help是固定搭配\"向某人求助\"。"},{"id":"g2_english_u012_ex01","knowledge_id":"g2_english_u012","question":"单项选择：You look tired. _____ a rest? A. Why don't you have  B. Why not have  C. How about having  D. All of the above","answer":"答案：D. All of the above。解析：三种提建议方式都对。"},{"id":"g2_english_u012_ex02","knowledge_id":"g2_english_u012","question":"用所给词的适当形式填空：______ (Why don't/Why not) go out for a walk after dinner?","answer":"答案：Why not。解析：Why not + 动词原形 = Why don't you + 动词原形。"},{"id":"g2_english_u012_ex03","knowledge_id":"g2_english_u012","question":"单项选择：How about _____ to the park this weekend? A. go  B. to go  C. going  D. went","answer":"答案：C. going。解析：How about + 动名词，about是介词，后接动名词。"},{"id":"g2_english_u012_ex04","knowledge_id":"g2_english_u012","question":"单项选择：What about _____ a cup of tea? A. drink  B. to drink  C. drinking  D. drinks","answer":"答案：C. drinking。解析：What about + 动名词。"},{"id":"g2_english_u012_ex05","knowledge_id":"g2_english_u012","question":"翻译句子：你为什么不早点睡觉？","answer":"答案：Why don't you go to bed earlier? 或 Why not go to bed earlier? 解析：go to bed是固定短语\"上床睡觉\"。"},{"id":"g2_english_u012_ex06","knowledge_id":"g2_english_u012","question":"单项选择：It's hot. How about _____ for a swim? A. go  B. going  C. to go  D. went","answer":"答案：B. going。解析：How about + 动名词。"},{"id":"g2_english_u012_ex07","knowledge_id":"g2_english_u012","question":"用所给词的适当形式填空：You look ill. Why ______ (not) see a doctor?","answer":"答案：not。解析：Why not + 动词原形，not后面直接跟原形see。"},{"id":"g2_english_u012_ex08","knowledge_id":"g2_english_u012","question":"单项选择：_____ play basketball after school? A. Why don't  B. Why not  C. How about  D. What about","answer":"答案：B. Why not。解析：Why not + 动词原形play。"},{"id":"g2_english_u012_ex09","knowledge_id":"g2_english_u012","question":"单项选择：Let's _____ to the movies tonight. A. go  B. going  C. to go  D. goes","answer":"答案：A. go。解析：Let's + 动词原形。"},{"id":"g2_english_u012_ex10","knowledge_id":"g2_english_u012","question":"翻译句子：周末去远足怎么样？","answer":"答案：How/What about going hiking on the weekend? 解析：how about = what about + 动名词。"},{"id":"g2_english_u013_ex01","knowledge_id":"g2_english_u013","question":"单项选择：I _____ get up early tomorrow because I have an important meeting. A. need  B. need to  C. needs  D. needed","answer":"答案：B. need to。解析：need to do意为\"需要做\"。"},{"id":"g2_english_u013_ex02","knowledge_id":"g2_english_u013","question":"单项选择：She _____ practice the piano every day. A. need  B. need to  C. needs to  D. need not","answer":"答案：C. needs to。解析：主语She是第三人称单数，need要用needs。"},{"id":"g2_english_u013_ex03","knowledge_id":"g2_english_u013","question":"用所给词的适当形式填空：You ______ (don't need) to worry about me. I'm fine.","answer":"答案：don't need。解析：don't need to意为\"不需要\"。"},{"id":"g2_english_u013_ex04","knowledge_id":"g2_english_u013","question":"单项选择：Do I _____ bring my umbrella today? A. need  B. needs  C. need to  D. needed","answer":"答案：C. need to。解析：need to do是固定搭配。"},{"id":"g2_english_u013_ex05","knowledge_id":"g2_english_u013","question":"句型转换：You don't need to hurry. （同义句）","answer":"答案：You needn't hurry. 解析：don't need to = needn't。"},{"id":"g2_english_u013_ex06","knowledge_id":"g2_english_u013","question":"单项选择：We _____ to be there before 8 o'clock. A. needs  B. need  C. needs to  D. need to","answer":"答案：D. need to。解析：主语we后用need to。"},{"id":"g2_english_u013_ex07","knowledge_id":"g2_english_u013","question":"单项选择：Does he _____ to wear a uniform at school? A. need  B. needs  C. need to  D. needed","answer":"答案：C. need to。解析：Does是一般疑问句助动词，need to do结构中need用原形。"},{"id":"g2_english_u013_ex08","knowledge_id":"g2_english_u013","question":"翻译句子：你需要做更多的练习来提高你的英语。","answer":"答案：You need to do more exercises to improve your English. 解析：need to do\"需要做\"。"},{"id":"g2_english_u013_ex09","knowledge_id":"g2_english_u013","question":"用所给词的适当形式填空：She ______ (need) to finish her homework before dinner.","answer":"答案：needs。解析：主语she是第三人称单数，need用needs。"},{"id":"g2_english_u013_ex10","knowledge_id":"g2_english_u013","question":"单项选择：You don't need _____ that again. A. do  B. to do  C. doing  D. done","answer":"答案：B. to do。解析：don't need to do是固定搭配。"},{"id":"g2_english_u014_ex01","knowledge_id":"g2_english_u014","question":"单项选择：Could you please _____ the door? A. open  B. opening  C. to open  D. opened","answer":"答案：A. open。解析：Could you please + 动词原形。"},{"id":"g2_english_u014_ex02","knowledge_id":"g2_english_u014","question":"用所给词的适当形式填空：Could you please ______ (pass) me the salt?","answer":"答案：pass。解析：Could you please + 动词原形。"},{"id":"g2_english_u014_ex03","knowledge_id":"g2_english_u014","question":"单项选择：— Could you please clean your room? — _____ A. Sure.  B. Sorry, I can't.  C. Of course.  D. All of the above","answer":"答案：D. All of the above。解析：Could you please...?的回答可以是肯定或否定。"},{"id":"g2_english_u014_ex04","knowledge_id":"g2_english_u014","question":"翻译句子：请你帮我搬这个箱子好吗？","answer":"答案：Could you please help me carry the box? 解析：help sb. do sth.\"帮某人做某事\"。carry\"搬\"。"},{"id":"g2_english_u014_ex05","knowledge_id":"g2_english_u014","question":"单项选择：Could you please _____ the dishes after dinner? A. wash  B. washing  C. to wash  D. washed","answer":"答案：A. wash。解析：Could you please + 动词原形wash。"},{"id":"g2_english_u014_ex06","knowledge_id":"g2_english_u014","question":"单项选择：Could you please _____ the window? It's cold. A. close  B. closing  C. to close  D. closed","answer":"答案：A. close。解析：Could you please + 动词原形。"},{"id":"g2_english_u014_ex07","knowledge_id":"g2_english_u014","question":"用所给词的适当形式填空：— Could you please ______ (turn) down the music? — Sure.","answer":"答案：turn。解析：Could you please + 动词原形turn。turn down\"调低\"。"},{"id":"g2_english_u014_ex08","knowledge_id":"g2_english_u014","question":"单项选择：— Could you please help me with my math? — _____. A. That's all right  B. Sure, no problem  C. You're welcome  D. Yes, I would","answer":"答案：B. Sure, no problem。解析：Could you please...?的肯定回答：Sure / Sure, no problem / Of course。"},{"id":"g2_english_u014_ex09","knowledge_id":"g2_english_u014","question":"句型转换：Please help me with my English. （同义句）","answer":"答案：Could you please help me with my English? 解析：Could you please...?是更委婉的请求方式。"},{"id":"g2_english_u014_ex10","knowledge_id":"g2_english_u014","question":"单项选择：Could you please _____ quiet in the library? A. keep  B. keeping  C. to keep  D. kept","answer":"答案：A. keep。解析：Could you please + 动词原形。keep quiet\"保持安静\"。"},{"id":"g2_english_u015_ex01","knowledge_id":"g2_english_u015","question":"单项选择：_____ I please use your pen? A. Can  B. Could  C. Will  D. Would","answer":"答案：B. Could。解析：Could I please + 动词原形是最委婉的请求许可。"},{"id":"g2_english_u015_ex02","knowledge_id":"g2_english_u015","question":"用所给词的适当形式填空：— ______ (Could) I please have some more tea? — Of course. Here you are.","answer":"答案：Could。解析：Could I please...?是请求许可的委婉句型。"},{"id":"g2_english_u015_ex03","knowledge_id":"g2_english_u015","question":"单项选择：— Could I please borrow your ruler? — _____ A. Sure, here you are  B. Yes, I could  C. No, you couldn't  D. Sure, I would","answer":"答案：A. Sure, here you are。解析：Could I please...?的肯定回答：Sure, here you are."},{"id":"g2_english_u015_ex04","knowledge_id":"g2_english_u015","question":"翻译句子：请问我可以借你的字典吗？","answer":"答案：Could I please borrow your dictionary? 解析：Could I please + 动词原形。"},{"id":"g2_english_u015_ex05","knowledge_id":"g2_english_u015","question":"单项选择：Could I please _____ to the teacher after class? A. speak  B. speaking  C. to speak  D. spoke","answer":"答案：A. speak。解析：Could I please + 动词原形。"},{"id":"g2_english_u015_ex06","knowledge_id":"g2_english_u015","question":"用所给词的适当形式填空：— ______ (Could) I please go home now? — Sure, you can.","answer":"答案：Could。解析：Could I please...?是委婉请求许可。"},{"id":"g2_english_u015_ex07","knowledge_id":"g2_english_u015","question":"单项选择：Could I please have _____ to drink? A. anything  B. something  C. nothing  D. everything","answer":"答案：B. something。解析：Could I please have something...?是请求得到某物的委婉方式。"},{"id":"g2_english_u015_ex08","knowledge_id":"g2_english_u015","question":"单项选择：Could I please _____ the window? It's hot. A. open  B. opening  C. to open  D. opened","answer":"答案：A. open。解析：Could I please + 动词原形。"},{"id":"g2_english_u015_ex09","knowledge_id":"g2_english_u015","question":"翻译句子：请问老师我可以交作业吗？","answer":"答案：Could I please hand in my homework, teacher? 解析：hand in\"上交\"。"},{"id":"g2_english_u015_ex10","knowledge_id":"g2_english_u015","question":"单项选择：— Could I please sit here? — _____ A. Yes, I would  B. Sure, please  C. No, thanks  D. Yes, you do","answer":"答案：B. Sure, please。解析：Could I please...?的肯定回答：Sure, please / Of course / Yes, please."},{"id":"g2_english_u016_ex01","knowledge_id":"g2_english_u016","question":"单项选择：You _____ be more careful with your spelling. A. should  B. would  C. can  D. may","answer":"答案：A. should。解析：should表示\"应该\"，是建议。"},{"id":"g2_english_u016_ex02","knowledge_id":"g2_english_u016","question":"单项选择：_____ I open the door for you? A. Will  B. Would  C. Could  D. May","answer":"答案：C. Could。解析：Could I...?是委婉请求许可。"},{"id":"g2_english_u016_ex03","knowledge_id":"g2_english_u016","question":"单项选择：_____ you help me with the heavy box? A. Can  B. Could  C. May  D. Might","answer":"答案：B. Could。解析：Could you...?是委婉请求，比Can you...?更客气。"},{"id":"g2_english_u016_ex04","knowledge_id":"g2_english_u016","question":"用所给词的适当形式填空：You ______ (should/may) finish your homework before watching TV.","answer":"答案：should。解析：should表示\"应该\"，强调这是应该做的事。"},{"id":"g2_english_u016_ex05","knowledge_id":"g2_english_u016","question":"单项选择：It _____ rain this afternoon. Take an umbrella. A. should  B. would  C. may  D. must","answer":"答案：C. may。解析：may表示可能性，\"可能\"。"},{"id":"g2_english_u016_ex06","knowledge_id":"g2_english_u016","question":"翻译句子：如果你有不明白的地方，可以问老师。","answer":"答案：You may/can/could ask the teacher if you don't understand. 解析：may/can/could都表示许可或委婉请求。"},{"id":"g2_english_u016_ex07","knowledge_id":"g2_english_u016","question":"单项选择：_____ I come in? — Yes, please. A. Should  B. May  C. Would  D. Need","answer":"答案：B. May。解析：May I...?用于请求许可。"},{"id":"g2_english_u016_ex08","knowledge_id":"g2_english_u016","question":"单项选择：— Would you like some tea? — _____ A. Yes, I would  B. Yes, please  C. No, thanks  D. B and C","answer":"答案：D. B and C。解析：Would you like...?的肯定回答Yes, please；否定回答No, thanks。"},{"id":"g2_english_u016_ex09","knowledge_id":"g2_english_u016","question":"用所给词的适当形式填空：You ______ (can/may) play games after you finish your homework.","answer":"答案：can/may。解析：can/may都表示许可。"},{"id":"g2_english_u016_ex10","knowledge_id":"g2_english_u016","question":"单项选择：You _____ talk loudly in the library. A. shouldn't  B. couldn't  C. would  D. mustn't","answer":"答案：A. shouldn't。解析：shouldn't表示\"不应该\"，图书馆是公共场所。"},{"id":"g2_english_u017_ex01","knowledge_id":"g2_english_u017","question":"单项选择：I want _____ a foreign language. A. learn  B. to learn  C. learning  D. learned","answer":"答案：B. to learn。解析：want to do是固定搭配，\"想要做\"。"},{"id":"g2_english_u017_ex02","knowledge_id":"g2_english_u017","question":"单项选择：She decided _____ abroad for further study. A. go  B. to go  C. going  D. gone","answer":"答案：B. to go。解析：decide to do是固定搭配，\"决定做\"。"},{"id":"g2_english_u017_ex03","knowledge_id":"g2_english_u017","question":"用所给词的适当形式填空：They plan ______ (visit) the Great Wall next week.","answer":"答案：to visit。解析：plan to do是固定搭配，\"计划做\"。"},{"id":"g2_english_u017_ex04","knowledge_id":"g2_english_u017","question":"单项选择：I hope _____ a good job after graduation. A. find  B. to find  C. finding  D. found","answer":"答案：B. to find。解析：hope to do是固定搭配，\"希望做\"。"},{"id":"g2_english_u017_ex05","knowledge_id":"g2_english_u017","question":"单项选择：He agreed _____ me with my homework. A. help  B. to help  C. helping  D. helped","answer":"答案：B. to help。解析：agree to do是固定搭配，\"同意做\"。"},{"id":"g2_english_u017_ex06","knowledge_id":"g2_english_u017","question":"翻译句子：我想学弹钢琴。","answer":"答案：I want to learn to play the piano. 解析：want to do\"想做\"。learn to do\"学着做\"。play the piano\"弹钢琴\"。"},{"id":"g2_english_u017_ex07","knowledge_id":"g2_english_u017","question":"单项选择：She tried _____ the heavy box, but she failed. A. lift  B. to lift  C. lifting  D. lifted","answer":"答案：B. to lift。解析：try to do是固定搭配，\"尝试做\"。"},{"id":"g2_english_u017_ex08","knowledge_id":"g2_english_u017","question":"用所给词的适当形式填空：I would like ______ (order) a hamburger and a glass of cola.","answer":"答案：to order。解析：would like to do是固定搭配，\"想要做\"。"},{"id":"g2_english_u017_ex09","knowledge_id":"g2_english_u017","question":"单项选择：We need _____ harder to pass the exam. A. study  B. to study  C. studying  D. studied","answer":"答案：B. to study。解析：need to do是固定搭配，\"需要做\"。"},{"id":"g2_english_u017_ex10","knowledge_id":"g2_english_u017","question":"单项选择：My parents encouraged me _____ my dream. A. follow  B. to follow  C. following  D. followed","answer":"答案：B. to follow。解析：encourage sb. to do是固定搭配，\"鼓励某人做\"。"},{"id":"g2_english_u018_ex01","knowledge_id":"g2_english_u018","question":"单项选择：You look sad. _____ talk to your friends about it? A. Why don't you  B. Why not  C. How about  D. A and B","answer":"答案：D. A and B。解析：Why don't you + 动词原形 = Why not + 动词原形。两种表达方式都对。"},{"id":"g2_english_u018_ex02","knowledge_id":"g2_english_u018","question":"翻译句子：你为什么不去问老师呢？","answer":"答案：Why don't you ask the teacher? 或 Why not ask the teacher? 解析：两种翻译都对。"},{"id":"g2_english_u018_ex03","knowledge_id":"g2_english_u018","question":"用所给词的适当形式填空：Why ______ (not) join us in the game?","answer":"答案：not。解析：Why not + 动词原形。"},{"id":"g2_english_u018_ex04","knowledge_id":"g2_english_u018","question":"单项选择：Why don't you _____ out for a walk? A. go  B. going  C. to go  D. went","answer":"答案：A. go。解析：Why don't you + 动词原形。"},{"id":"g2_english_u018_ex05","knowledge_id":"g2_english_u018","question":"单项选择：Why not _____ the teacher for help? A. ask  B. asking  C. to ask  D. asked","answer":"答案：A. ask。解析：Why not + 动词原形。"},{"id":"g2_english_u018_ex06","knowledge_id":"g2_english_u018","question":"句型转换：Let's go swimming. （同义句）","answer":"答案：Why don't we go swimming? 或 Why not go swimming? 解析：Let's...= Why don't we...? = Why not...?"},{"id":"g2_english_u018_ex07","knowledge_id":"g2_english_u018","question":"单项选择：_____ go to the park with us this Sunday? A. Why don't  B. Why not  C. How about  D. A and B","answer":"答案：D. A and B。解析：Why don't we... = Why not...?两种方式都对。"},{"id":"g2_english_u018_ex08","knowledge_id":"g2_english_u018","question":"用所给词的适当形式填空：— I'm tired. — Why ______ (not) have a rest?","answer":"答案：not。解析：Why not + 动词原形have。"},{"id":"g2_english_u018_ex09","knowledge_id":"g2_english_u018","question":"翻译句子：你为什么不早点起床呢？","answer":"答案：Why don't you get up earlier? 或 Why not get up earlier? 解析：get up earlier\"早点起床\"。"},{"id":"g2_english_u018_ex10","knowledge_id":"g2_english_u018","question":"单项选择：— Why don't you go to bed earlier? — _____ A. That's a good idea.  B. You're right.  C. Good idea.  D. All of the above","answer":"答案：D. All of the above。解析：对方提建议后，可以用多种赞同回答。"},{"id":"g2_english_u019_ex01","knowledge_id":"g2_english_u019","question":"单项选择：Let's _____ a picnic this weekend. A. have  B. having  C. to have  D. had","answer":"答案：A. have。解析：Let's + 动词原形。"},{"id":"g2_english_u019_ex02","knowledge_id":"g2_english_u019","question":"单项选择：You had better _____ a doctor. A. see  B. seeing  C. to see  D. saw","answer":"答案：A. see。解析：had better + 动词原形。"},{"id":"g2_english_u019_ex03","knowledge_id":"g2_english_u019","question":"用所给词的适当形式填空：What/How about ______ (go) shopping this afternoon?","answer":"答案：going。解析：What/How about + 动名词。"},{"id":"g2_english_u019_ex04","knowledge_id":"g2_english_u019","question":"翻译句子：你最好今天不要熬夜。","answer":"答案：You had better not stay up late tonight. 解析：had better not + 动词原形。stay up late\"熬夜\"。"},{"id":"g2_english_u019_ex05","knowledge_id":"g2_english_u019","question":"单项选择：Let's _____ for a walk after dinner. A. go  B. going  C. to go  D. went","answer":"答案：A. go。解析：Let's + 动词原形。"},{"id":"g2_english_u019_ex06","knowledge_id":"g2_english_u019","question":"单项选择：You'd better _____ here alone. A. don't go  B. not go  C. not to go  D. not going","answer":"答案：B. not go。解析：had better not + 动词原形。"},{"id":"g2_english_u019_ex07","knowledge_id":"g2_english_u019","question":"用所给词的适当形式填空：What about ______ (play) tennis this Sunday?","answer":"答案：playing。解析：What about + 动名词。"},{"id":"g2_english_u019_ex08","knowledge_id":"g2_english_u019","question":"单项选择：— What about going to the movies? — _____. A. That's a good idea  B. Good idea  C. Sure, I'd love to  D. All of the above","answer":"答案：D. All of the above。解析：对方提建议时，多种赞同回答都可以用。"},{"id":"g2_english_u019_ex09","knowledge_id":"g2_english_u019","question":"翻译句子：你应该每天锻炼。","answer":"答案：You should exercise every day. 解析：should + 动词原形exercise。"},{"id":"g2_english_u019_ex10","knowledge_id":"g2_english_u019","question":"单项选择：It's raining. You had better _____ a raincoat. A. wear  B. wearing  C. to wear  D. wore","answer":"答案：A. wear。解析：had better + 动词原形wear。"},{"id":"g2_english_u020_ex01","knowledge_id":"g2_english_u020","question":"单项选择：You _____ lie to your parents. It's not right. A. should  B. shouldn't  C. would  D. could","answer":"答案：B. shouldn't。解析：shouldn't表示\"不应该\"。撒谎是不对的。"},{"id":"g2_english_u020_ex02","knowledge_id":"g2_english_u020","question":"单项选择：Students _____ follow the school rules. A. should  B. shouldn't  C. would  D. could","answer":"答案：A. should。解析：should表示\"应该\"。学生应该遵守校规。"},{"id":"g2_english_u020_ex03","knowledge_id":"g2_english_u020","question":"翻译句子：你不应该熬夜。","answer":"答案：You shouldn't stay up late. 解析：shouldn't + 动词原形。stay up late\"熬夜\"。"},{"id":"g2_english_u020_ex04","knowledge_id":"g2_english_u020","question":"用所给词的适当形式填空：You ______ (should) tell the truth. It's always the best choice.","answer":"答案：should。解析：should表示\"应该\"。"},{"id":"g2_english_u020_ex05","knowledge_id":"g2_english_u020","question":"单项选择：— I have a toothache. — You _____ see a dentist. A. shouldn't  B. should  C. wouldn't  D. couldn't","answer":"答案：B. should。解析：should表示\"应该\"，是建议。"},{"id":"g2_english_u020_ex06","knowledge_id":"g2_english_u020","question":"单项选择：We _____ protect the environment. A. should  B. shouldn't  C. would  D. mustn't","answer":"答案：A. should。解析：should表示\"应该\"，环保是每个人的责任。"},{"id":"g2_english_u020_ex07","knowledge_id":"g2_english_u020","question":"用所给词的适当形式填空：Children ______ (should) not play with fire. It's dangerous.","answer":"答案：should。解析：should not = shouldn't。完整：Children should not play with fire."},{"id":"g2_english_u020_ex08","knowledge_id":"g2_english_u020","question":"单项选择：You _____ eat too much junk food. It's not healthy. A. shouldn't  B. should  C. would  D. must","answer":"答案：A. shouldn't。解析：shouldn't表示\"不应该\"。吃太多垃圾食品不健康。"},{"id":"g2_english_u020_ex09","knowledge_id":"g2_english_u020","question":"翻译句子：出门前你应该关灯。","answer":"答案：You should turn off the lights before going out. 解析：should + 动词原形。turn off\"关掉\"。"},{"id":"g2_english_u020_ex10","knowledge_id":"g2_english_u020","question":"单项选择：Drivers _____ wear seat belts for safety. A. should  B. shouldn't  C. would  D. needn't","answer":"答案：A. should。解析：should表示\"应该\"。为了安全司机应该系安全带。"},{"id":"g2_english_u021_ex01","knowledge_id":"g2_english_u021","question":"单项选择：I _____ get up early every day. A. has to  B. have to  C. had to  D. having to","answer":"答案：B. have to。解析：主语I后用have to。"},{"id":"g2_english_u021_ex02","knowledge_id":"g2_english_u021","question":"单项选择：She _____ work late last night. A. has to  B. have to  C. had to  D. having to","answer":"答案：C. had to。解析：last night是过去时，have to的过去式是had to。"},{"id":"g2_english_u021_ex03","knowledge_id":"g2_english_u021","question":"用所给词的适当形式填空：You ______ (don't have to) worry about that. It's not your problem.","answer":"答案：don't have to。解析：don't have to意为\"不必\"。"},{"id":"g2_english_u021_ex04","knowledge_id":"g2_english_u021","question":"单项选择：Does he _____ finish his homework before bed? A. has to  B. have to  C. had to  D. having to","answer":"答案：B. have to。解析：Does是一般疑问句助动词，have用原形。"},{"id":"g2_english_u021_ex05","knowledge_id":"g2_english_u021","question":"翻译句子：我不得不每天步行上学。","answer":"答案：I have to walk to school every day. 解析：have to\"不得不\"。walk to school\"步行上学\"。"},{"id":"g2_english_u021_ex06","knowledge_id":"g2_english_u021","question":"单项选择：We _____ wear a uniform at school. A. has to  B. have to  C. had to  D. having to","answer":"答案：B. have to。解析：主语we后用have to。"},{"id":"g2_english_u021_ex07","knowledge_id":"g2_english_u021","question":"句型转换：He has to get up early. （改为否定句）","answer":"答案：He doesn't have to get up early. 解析：主语He是第三人称单数，否定用doesn't。doesn't后have用原形。"},{"id":"g2_english_u021_ex08","knowledge_id":"g2_english_u021","question":"用所给词的适当形式填空：Yesterday I ______ (have to) take care of my little sister.","answer":"答案：had to。解析：yesterday是一般过去时。"},{"id":"g2_english_u021_ex09","knowledge_id":"g2_english_u021","question":"单项选择：— Do I have to finish it now? — No, you _____. A. don't  B. haven't  C. mustn't  D. aren't","answer":"答案：A. don't。解析：Do I have to...?的否定回答用No, you don't."},{"id":"g2_english_u021_ex10","knowledge_id":"g2_english_u021","question":"翻译句子：你不必担心他，他会照顾好自己的。","answer":"答案：You don't have to worry about him. He can take care of himself. 解析：don't have to\"不必\"。take care of\"照顾\"。"},{"id":"g2_english_u022_ex01","knowledge_id":"g2_english_u022","question":"单项选择：Please wait here _____ I come back. A. until  B. so that  C. because  D. when","answer":"答案：A. until。解析：until\"直到\"。"},{"id":"g2_english_u022_ex02","knowledge_id":"g2_english_u022","question":"用所给词的适当形式填空：He studies hard ______ (so that) he can pass the exam.","answer":"答案：so that。解析：so that\"为了\"，引导目的状语从句。"},{"id":"g2_english_u022_ex03","knowledge_id":"g2_english_u022","question":"单项选择：Don't leave _____ I tell you to. A. until  B. so that  C. because  D. when","answer":"答案：A. until。解析：not...until\"直到...才\"。"},{"id":"g2_english_u022_ex04","knowledge_id":"g2_english_u022","question":"翻译句子：直到雨停了我们才回家。","answer":"答案：We didn't go home until the rain stopped. 解析：not...until\"直到...才\"。the rain stopped是过去时从句。"},{"id":"g2_english_u022_ex05","knowledge_id":"g2_english_u022","question":"单项选择：She got up early _____ she could catch the first bus. A. until  B. so that  C. because  D. when","answer":"答案：B. so that。解析：so that引导目的状语从句，\"为了能...\"。"},{"id":"g2_english_u022_ex06","knowledge_id":"g2_english_u022","question":"用所给词的适当形式填空：Please speak slowly ______ (so that) I can understand you.","answer":"答案：so that。解析：so that\"为了\"。"},{"id":"g2_english_u022_ex07","knowledge_id":"g2_english_u022","question":"单项选择：I will wait for you _____ the rain stops. A. until  B. so that  C. because  D. when","answer":"答案：A. until。解析：wait until\"等到\"。"},{"id":"g2_english_u022_ex08","knowledge_id":"g2_english_u022","question":"翻译句子：他努力学习以便能考上一所好大学。","answer":"答案：He studies hard so that he can get into a good university. 解析：so that\"以便\"。"},{"id":"g2_english_u022_ex09","knowledge_id":"g2_english_u022","question":"单项选择：He kept reading _____ midnight. A. until  B. so that  C. because  D. when","answer":"答案：A. until。解析：until midnight\"直到午夜\"。"},{"id":"g2_english_u022_ex10","knowledge_id":"g2_english_u022","question":"用所给词的适当形式填空：She woke up ______ (so that/until) she could finish her homework.","answer":"答案：so that。解析：so that\"为了能\"，引导目的状语从句。"},{"id":"g2_english_u023_ex01","knowledge_id":"g2_english_u023","question":"单项选择：I _____ TV at 8 o'clock last night. A. watch  B. watched  C. was watching  D. am watching","answer":"答案：C. was watching。解析：at 8 o'clock last night是过去某一点时间，\"正在做\"用过去进行时。"},{"id":"g2_english_u023_ex02","knowledge_id":"g2_english_u023","question":"用所给词的适当形式填空：They ______ (play) basketball at that time yesterday.","answer":"答案：were playing。解析：at that time yesterday提示过去进行时。主语they用were。"},{"id":"g2_english_u023_ex03","knowledge_id":"g2_english_u023","question":"单项选择：She _____ when the phone rang. A. cooks  B. cooked  C. was cooking  D. is cooking","answer":"答案：C. was cooking。解析：when the phone rang是一般过去时，\"当...时正在做\"用过去进行时。"},{"id":"g2_english_u023_ex04","knowledge_id":"g2_english_u023","question":"单项选择：What _____ you _____ at 9 o'clock this morning? A. are, doing  B. were, doing  C. did, do  D. was, doing","answer":"答案：B. were, doing。解析：at 9 o'clock this morning是过去时间，特殊疑问句用were + 主语 + doing。"},{"id":"g2_english_u023_ex05","knowledge_id":"g2_english_u023","question":"翻译句子：昨天下午三点我在公园里玩。","answer":"答案：I was playing in the park at three yesterday afternoon. 解析：过去进行时：was/were + 动词-ing。"},{"id":"g2_english_u023_ex06","knowledge_id":"g2_english_u023","question":"用所给词的适当形式填空：The kids ______ (sleep) when I got home.","answer":"答案：were sleeping。解析：when引导的一般过去时，主句用过去进行时。"},{"id":"g2_english_u023_ex07","knowledge_id":"g2_english_u023","question":"单项选择：He _____ a book at 10 last night. A. read  B. is reading  C. was reading  D. reads","answer":"答案：C. was reading。解析：at 10 last night是过去时间点，\"正在做\"用过去进行时。"},{"id":"g2_english_u023_ex08","knowledge_id":"g2_english_u023","question":"单项选择：We _____ dinner when the lights went out. A. have  B. had  C. were having  D. are having","answer":"答案：C. were having。解析：when the lights went out是一般过去时，主句用过去进行时。"},{"id":"g2_english_u023_ex09","knowledge_id":"g2_english_u023","question":"用所给词的适当形式填空：She ______ (write) a letter when I called her.","answer":"答案：was writing。解析：when I called her是过去时，主句用过去进行时。"},{"id":"g2_english_u023_ex10","knowledge_id":"g2_english_u023","question":"单项选择：I _____ my homework all evening yesterday. A. do  B. did  C. was doing  D. am doing","answer":"答案：C. was doing。解析：all evening yesterday是过去一段时间，用过去进行时。"},{"id":"g2_english_u024_ex01","knowledge_id":"g2_english_u024","question":"单项选择：At 8 last night, I _____ my homework. A. do  B. did  C. was doing  D. am doing","answer":"答案：C. was doing。解析：At 8 last night是过去时间点，\"正在做\"用过去进行时。"},{"id":"g2_english_u024_ex02","knowledge_id":"g2_english_u024","question":"单项选择：This time yesterday, we _____ football. A. play  B. played  C. were playing  D. are playing","answer":"答案：C. were playing。解析：This time yesterday是过去某时，\"正在做\"用过去进行时。"},{"id":"g2_english_u024_ex03","knowledge_id":"g2_english_u024","question":"用所给词的适当形式填空：At that time, she ______ (read) in the library.","answer":"答案：was reading。解析：at that time是过去某时，主语she是第三人称单数。"},{"id":"g2_english_u024_ex04","knowledge_id":"g2_english_u024","question":"单项选择：What _____ you _____ this time last Sunday? A. are, doing  B. were, doing  C. did, do  D. was, doing","answer":"答案：B. were, doing。解析：this time last Sunday是过去时间，特殊疑问句用were + 主语 + doing。"},{"id":"g2_english_u024_ex05","knowledge_id":"g2_english_u024","question":"翻译句子：昨天晚上这个时候我正在读一本有趣的书。","answer":"答案：I was reading an interesting book at this time last night. 解析：at this time last night是过去某时。"},{"id":"g2_english_u024_ex06","knowledge_id":"g2_english_u024","question":"用所给词的适当形式填空：The whole afternoon yesterday, he ______ (work) in the garden.","answer":"答案：was working。解析：the whole afternoon yesterday是过去一段时间，表示持续的动作。"},{"id":"g2_english_u024_ex07","knowledge_id":"g2_english_u024","question":"单项选择：I called you at 8 last night, but you _____ in. A. aren't  B. weren't  C. didn't  D. was","answer":"答案：B. weren't。解析：过去时间点8 o'clock，\"你不在家\"用were not / weren't。"},{"id":"g2_english_u024_ex08","knowledge_id":"g2_english_u024","question":"单项选择：At noon yesterday, I _____ lunch with my family. A. have  B. had  C. was having  D. am having","answer":"答案：C. was having。解析：at noon yesterday是过去某时，\"正在吃\"用过去进行时。"},{"id":"g2_english_u024_ex09","knowledge_id":"g2_english_u024","question":"用所给词的适当形式填空：At 7 yesterday evening, we ______ (watch) TV.","answer":"答案：were watching。解析：at 7 yesterday evening是过去时间点，主语we用were。"},{"id":"g2_english_u024_ex10","knowledge_id":"g2_english_u024","question":"单项选择：She was cleaning the room _____ her mother came home. A. when  B. while  C. as  D. before","answer":"答案：A. when。解析：when引导一般过去时的句子，主句用过去进行时。"},{"id":"g2_english_u025_ex01","knowledge_id":"g2_english_u025","question":"单项选择：I was reading a book _____ my friend called me. A. when  B. while  C. as soon as  D. after","answer":"答案：A. when。解析：when引导一般过去时，\"正在做某事时另一事发生\"。"},{"id":"g2_english_u025_ex02","knowledge_id":"g2_english_u025","question":"单项选择：_____ I was walking in the park, I met an old friend. A. When  B. While  C. As  D. After","answer":"答案：B. While。解析：while + 延续性动作。I was walking是延续性动作。"},{"id":"g2_english_u025_ex03","knowledge_id":"g2_english_u025","question":"用所给词的适当形式填空：She was cooking ______ (when/while) the lights went out.","answer":"答案：when。解析：the lights went out是短暂性动作，when接短暂性动作。"},{"id":"g2_english_u025_ex04","knowledge_id":"g2_english_u025","question":"单项选择：_____ they were playing games, the teacher came in. A. When  B. While  C. As  D. Since","answer":"答案：B. While。解析：while接延续性动作。they were playing是延续性的。"},{"id":"g2_english_u025_ex05","knowledge_id":"g2_english_u025","question":"单项选择：I was having a shower _____ the doorbell rang. A. when  B. while  C. as  D. for","answer":"答案：A. when。解析：the doorbell rang是短暂性动作，用when。"},{"id":"g2_english_u025_ex06","knowledge_id":"g2_english_u025","question":"用所给词的适当形式填空：______ (When/While) I was waiting for the bus, it started to rain.","answer":"答案：While。解析：I was waiting是延续性动作，用while。"},{"id":"g2_english_u025_ex07","knowledge_id":"g2_english_u025","question":"翻译句子：当我走过学校时，我看见了一些学生正在打篮球。","answer":"答案：When I was walking past the school, I saw some students playing basketball. 解析：When + 从句(过去进行时)，主句(一般过去时)。"},{"id":"g2_english_u025_ex08","knowledge_id":"g2_english_u025","question":"单项选择：My mother was cooking _____ my father was watching TV. A. when  B. while  C. as  D. after","answer":"答案：B. while。解析：两个动作都是延续性的，用while。"},{"id":"g2_english_u025_ex09","knowledge_id":"g2_english_u025","question":"用所给词的适当形式填空：He was reading a newspaper ______ (when/while) the telephone rang.","answer":"答案：when。解析：the telephone rang是短暂性动作，用when。"},{"id":"g2_english_u025_ex10","knowledge_id":"g2_english_u025","question":"单项选择：— What were you doing at 8 last night? — I _____ dinner. A. have  B. had  C. was having  D. am having","answer":"答案：C. was having。解析：at 8 last night是过去某时，\"正在吃\"用过去进行时。"},{"id":"g2_english_u026_ex01","knowledge_id":"g2_english_u026","question":"单项选择：I _____ my homework when my mother came home. A. do  B. did  C. was doing  D. am doing","answer":"答案：C. was doing。解析：when my mother came home是一般过去时，主句用过去进行时表示\"正在做\"。"},{"id":"g2_english_u026_ex02","knowledge_id":"g2_english_u026","question":"单项选择：She _____ the dishes when I saw her. A. washes  B. washed  C. was washing  D. is washing","answer":"答案：C. was washing。解析：when I saw her是一般过去时，\"正在做\"用过去进行时。"},{"id":"g2_english_u026_ex03","knowledge_id":"g2_english_u026","question":"用所给词的适当形式填空：While I ______ (read), the lights went out.","answer":"答案：was reading。解析：while + 延续性动作，用过去进行时。"},{"id":"g2_english_u026_ex04","knowledge_id":"g2_english_u026","question":"单项选择：I _____ the Great Wall last year. A. visit  B. visited  C. was visiting  D. am visiting","answer":"答案：B. visited。解析：last year是一般过去时。visit是规则动词，过去式visited。"},{"id":"g2_english_u026_ex05","knowledge_id":"g2_english_u026","question":"单项选择：— What did you do yesterday? — I _____ a new book. A. read  B. was reading  C. am reading  D. reads","answer":"答案：A. read。解析：yesterday是一般过去时。read的过去式仍是read（发音为/red/）。"},{"id":"g2_english_u026_ex06","knowledge_id":"g2_english_u026","question":"用所给词的适当形式填空：I ______ (write) a letter to my friend last night.","answer":"答案：wrote。解析：last night是一般过去时。write是不规则动词，过去式是wrote。"},{"id":"g2_english_u026_ex07","knowledge_id":"g2_english_u026","question":"单项选择：He _____ a new car last week. A. buys  B. bought  C. was buying  D. is buying","answer":"答案：B. bought。解析：last week是一般过去时。buy是不规则动词，过去式是bought。"},{"id":"g2_english_u026_ex08","knowledge_id":"g2_english_u026","question":"用所给词的适当形式填空：At 8 last night, I ______ (watch) a movie.","answer":"答案：was watching。解析：at 8 last night是过去某时，用过去进行时。"},{"id":"g2_english_u026_ex09","knowledge_id":"g2_english_u026","question":"单项选择：— I called you at 9 last night, but you didn't answer. — Oh, sorry. I _____ a bath. A. take  B. took  C. was taking  D. am taking","answer":"答案：C. was taking。解析：at 9 last night是过去时间点，\"正在洗澡\"用过去进行时。"},{"id":"g2_english_u026_ex10","knowledge_id":"g2_english_u026","question":"翻译句子：我昨天读了那本有趣的书。","answer":"答案：I read that interesting book yesterday. 解析：yesterday是一般过去时。"},{"id":"g2_english_u027_ex01","knowledge_id":"g2_english_u027","question":"单项选择：I _____ TV at 9 last night. I was reading. A. watched  B. wasn't watching  C. don't watch  D. am not watching","answer":"答案：B. wasn't watching。解析：过去进行时否定：was/were not + 动词-ing。"},{"id":"g2_english_u027_ex02","knowledge_id":"g2_english_u027","question":"单项选择：_____ you _____ the piano at 8 last night? A. Were, playing  B. Did, play  C. Are, playing  D. Do, play","answer":"答案：A. Were, playing。解析：at 8 last night是过去时间，特殊疑问句用were + 主语 + playing。"},{"id":"g2_english_u027_ex03","knowledge_id":"g2_english_u027","question":"用所给词的适当形式填空：They ______ (not, play) football at 4 yesterday afternoon.","answer":"答案：weren't playing。解析：过去进行时否定。主语they用weren't。"},{"id":"g2_english_u027_ex04","knowledge_id":"g2_english_u027","question":"单项选择：— Was she studying at that time? — _____. A. Yes, she was  B. No, she was  C. Yes, she did  D. No, she didn't","answer":"答案：A. Yes, she was。解析：过去进行时一般疑问句的回答用Yes, 主语 + was/were。"},{"id":"g2_english_u027_ex05","knowledge_id":"g2_english_u027","question":"翻译句子：昨天这个时候我不在游泳。","answer":"答案：I wasn't swimming at this time yesterday. 解析：过去进行时否定：was not (wasn't) + 动词-ing。"},{"id":"g2_english_u027_ex06","knowledge_id":"g2_english_u027","question":"单项选择：— What were you doing at 10 last night? — I _____ a letter. A. write  B. wrote  C. was writing  D. am writing","answer":"答案：C. was writing。解析：at 10 last night是过去某时，\"正在写\"用过去进行时。"},{"id":"g2_english_u027_ex07","knowledge_id":"g2_english_u027","question":"用所给词的适当形式填空：______ (Be) they playing computer games when you called?","answer":"答案：Were。解析：when you called是一般过去时，问句用Were开头。"},{"id":"g2_english_u027_ex08","knowledge_id":"g2_english_u027","question":"单项选择：He _____ the room at 8 yesterday morning. A. wasn't cleaning  B. weren't cleaning  C. didn't cleaning  D. isn't cleaning","answer":"答案：A. wasn't cleaning。解析：主语he是第三人称单数，否定用wasn't。"},{"id":"g2_english_u027_ex09","knowledge_id":"g2_english_u027","question":"翻译句子：你昨天下午三点在做什么？","answer":"答案：What were you doing at three yesterday afternoon? 解析：特殊疑问句：What + were + 主语 + doing。"},{"id":"g2_english_u027_ex10","knowledge_id":"g2_english_u027","question":"单项选择：— Were you watching TV at 9 last night? — No, I _____. I was doing my homework. A. wasn't  B. weren't  C. didn't  D. don't","answer":"答案：A. wasn't。解析：过去进行时一般疑问句否定回答用No, 主语 + wasn't。"},{"id":"g2_english_u028_ex01","knowledge_id":"g2_english_u028","question":"单项选择：I think (that) he _____ a good student. A. am  B. is  C. are  D. be","answer":"答案：B. is。解析：that引导宾语从句，he是第三人称单数，用is。"},{"id":"g2_english_u028_ex02","knowledge_id":"g2_english_u028","question":"单项选择：She asked me if I _____ her. A. know  B. knows  C. knew  D. knowing","answer":"答案：C. knew。解析：asked是过去时，从句要用相应的过去时。knew是know的过去式。"},{"id":"g2_english_u028_ex03","knowledge_id":"g2_english_u028","question":"用所给词的适当形式填空：I wonder where he ______ (live).","answer":"答案：lives。解析：where引导宾语从句，从句用陈述语序。主语he用lives。"},{"id":"g2_english_u028_ex04","knowledge_id":"g2_english_u028","question":"单项选择：Do you know _____ tomorrow? A. what will the weather be like  B. what the weather will be like  C. what the weather is like  D. what is the weather like","answer":"答案：B. what the weather will be like。解析：宾语从句用陈述语序。tomorrow提示将来时。"},{"id":"g2_english_u028_ex05","knowledge_id":"g2_english_u028","question":"翻译句子：他说他明天会来。","answer":"答案：He said (that) he would come tomorrow. 解析：said是过去时，从句要用过去将来时would come。"},{"id":"g2_english_u028_ex06","knowledge_id":"g2_english_u028","question":"单项选择：I don't know _____ the book. A. where did he put  B. where he put  C. where he puts  D. where does he put","answer":"答案：B. where he put。解析：宾语从句用陈述语序。"},{"id":"g2_english_u028_ex07","knowledge_id":"g2_english_u028","question":"用所给词的适当形式填空：Can you tell me how ______ (get) to the hospital?","answer":"答案：to get。解析：疑问词+to do结构。how to get\"怎么去\"。"},{"id":"g2_english_u028_ex08","knowledge_id":"g2_english_u028","question":"单项选择：He told me (that) he _____ to New York next week. A. goes  B. will go  C. would go  D. went","answer":"答案：C. would go。解析：told是过去时，从句用过去将来时would go。"},{"id":"g2_english_u028_ex09","knowledge_id":"g2_english_u028","question":"单项选择：I want to know _____ or not. A. if he will come  B. whether will he come  C. will he come  D. if will he come","answer":"答案：A. if he will come。解析：if/whether引导宾语从句，从句用陈述语序。"},{"id":"g2_english_u028_ex10","knowledge_id":"g2_english_u028","question":"翻译句子：你能告诉我他在哪里吗？","answer":"答案：Can you tell me where he is? 解析：where引导宾语从句，从句用陈述语序。"},{"id":"g2_english_u029_ex01","knowledge_id":"g2_english_u029","question":"单项选择：I believe _____ he will succeed. A. that  B. if  C. what  D. when","answer":"答案：A. that。解析：that引导宾语从句，无词义，可省略。"},{"id":"g2_english_u029_ex02","knowledge_id":"g2_english_u029","question":"用所给词的适当形式填空：He said ______ (that) he was tired.","answer":"答案：that。解析：that引导宾语从句，可省略。"},{"id":"g2_english_u029_ex03","knowledge_id":"g2_english_u029","question":"单项选择：We all know _____ the earth goes around the sun. A. what  B. if  C. that  D. whether","answer":"答案：C. that。解析：that引导宾语从句，\"地球围绕太阳转\"是客观真理。"},{"id":"g2_english_u029_ex04","knowledge_id":"g2_english_u029","question":"单项选择：I hope _____ you will be better soon. A. that  B. if  C. what  D. when","answer":"答案：A. that。解析：hope that表示\"希望\"。"},{"id":"g2_english_u029_ex05","knowledge_id":"g2_english_u029","question":"翻译句子：她认为他是对的。","answer":"答案：She thinks (that) he is right. 解析：that引导宾语从句，可省略。"},{"id":"g2_english_u029_ex06","knowledge_id":"g2_english_u029","question":"单项选择：He said _____ he would come back soon. A. that  B. what  C. when  D. who","answer":"答案：A. that。解析：that引导宾语从句，无词义。"},{"id":"g2_english_u029_ex07","knowledge_id":"g2_english_u029","question":"用所给词的适当形式填空：I expect ______ (that) they will arrive on time.","answer":"答案：that。解析：that引导宾语从句。"},{"id":"g2_english_u029_ex08","knowledge_id":"g2_english_u029","question":"单项选择：I heard _____ he had left for Beijing. A. that  B. what  C. where  D. which","answer":"答案：A. that。解析：that引导宾语从句。"},{"id":"g2_english_u029_ex09","knowledge_id":"g2_english_u029","question":"翻译句子：我相信他是一个好学生。","answer":"答案：I believe (that) he is a good student. 解析：that引导宾语从句，可省略。"},{"id":"g2_english_u029_ex10","knowledge_id":"g2_english_u029","question":"用所给词的适当形式填空：She knows ______ (that) the earth is round.","answer":"答案：that。解析：that引导宾语从句，\"地球是圆的\"是客观真理。"},{"id":"g2_english_u030_ex01","knowledge_id":"g2_english_u030","question":"单项选择：I don't know _____ he will come or not. A. that  B. if  C. what  D. where","answer":"答案：B. if。解析：if/whether\"是否\"。"},{"id":"g2_english_u030_ex02","knowledge_id":"g2_english_u030","question":"用所给词的适当形式填空：She asked me ______ (if/whether) I could help her.","answer":"答案：if/whether。解析：if/whether\"是否\"。"},{"id":"g2_english_u030_ex03","knowledge_id":"g2_english_u030","question":"单项选择：Could you tell me _____ there is a bank nearby? A. that  B. if  C. what  D. where","answer":"答案：B. if。解析：if\"是否\"，问是否有银行。"},{"id":"g2_english_u030_ex04","knowledge_id":"g2_english_u030","question":"单项选择：I wonder _____ he is at home now. A. that  B. if  C. what  D. who","answer":"答案：B. if。解析：if\"是否\"。"},{"id":"g2_english_u030_ex05","knowledge_id":"g2_english_u030","question":"翻译句子：他问我是否想去看电影。","answer":"答案：He asked me if/whether I wanted to go to the movies. 解析：if/whether\"是否\"。"},{"id":"g2_english_u030_ex06","knowledge_id":"g2_english_u030","question":"用所给词的适当形式填空：I don't know ______ (whether) he will agree with us.","answer":"答案：whether。解析：whether/if都可表示\"是否\"。"},{"id":"g2_english_u030_ex07","knowledge_id":"g2_english_u030","question":"单项选择：_____ he will come is not clear. A. If  B. Whether  C. That  D. What","answer":"答案：B. Whether。解析：在句首只用whether。"},{"id":"g2_english_u030_ex08","knowledge_id":"g2_english_u030","question":"单项选择：It depends on _____ he will come. A. that  B. if  C. whether  D. what","answer":"答案：C. whether。解析：介词后只用whether。"},{"id":"g2_english_u030_ex09","knowledge_id":"g2_english_u030","question":"翻译句子：我想知道他是否会来。","answer":"答案：I wonder if/whether he will come. 解析：if/whether\"是否\"。wonder后接if/whether从句。"},{"id":"g2_english_u030_ex10","knowledge_id":"g2_english_u030","question":"用所给词的适当形式填空：I'm not sure ______ (if/whether) he is right.","answer":"答案：if/whether。解析：if/whether\"是否\"。"},{"id":"g2_english_u031_ex01","knowledge_id":"g2_english_u031","question":"单项选择：Can you tell me _____ you are from? A. where  B. what  C. who  D. which","answer":"答案：A. where。解析：where引导宾语从句，\"你来自哪里\"。"},{"id":"g2_english_u031_ex02","knowledge_id":"g2_english_u031","question":"用所给词的适当形式填空：I don't know ______ (what) he said.","answer":"答案：what。解析：what引导宾语从句，\"他说了什么\"。"},{"id":"g2_english_u031_ex03","knowledge_id":"g2_english_u031","question":"单项选择：Do you know _____ he is waiting for? A. who  B. what  C. where  D. when","answer":"答案：A. who。解析：who引导宾语从句作介词for的宾语，\"他在等谁\"。"},{"id":"g2_english_u031_ex04","knowledge_id":"g2_english_u031","question":"单项选择：Could you tell me _____ the train station is? A. where  B. what  C. which  D. who","answer":"答案：A. where。解析：where引导宾语从句，\"火车站在哪里\"。"},{"id":"g2_english_u031_ex05","knowledge_id":"g2_english_u031","question":"翻译句子：你能告诉我他为什么迟到吗？","answer":"答案：Can you tell me why he was late? 解析：why引导宾语从句，\"他为什么迟到\"。was是过去时，呼应主句的过去时。"},{"id":"g2_english_u031_ex06","knowledge_id":"g2_english_u031","question":"用所给词的适当形式填空：I want to know ______ (when) the meeting will start.","answer":"答案：when。解析：when引导宾语从句，\"会议什么时候开始\"。"},{"id":"g2_english_u031_ex07","knowledge_id":"g2_english_u031","question":"单项选择：Do you know _____ he is talking to? A. whom  B. what  C. where  D. how","answer":"答案：A. whom。解析：whom是who的宾格，\"他在和谁说话\"。"},{"id":"g2_english_u031_ex08","knowledge_id":"g2_english_u031","question":"单项选择：Could you explain _____ this happened? A. what  B. how  C. why  D. B and C","answer":"答案：D. B and C。解析：how和why都可引导宾语从句，\"这怎么发生/为什么发生\"。"},{"id":"g2_english_u031_ex09","knowledge_id":"g2_english_u031","question":"翻译句子：我想知道他住在哪。","answer":"答案：I want to know where he lives. 解析：where引导宾语从句，\"他住哪里\"。lives是第三人称单数现在时。"},{"id":"g2_english_u031_ex10","knowledge_id":"g2_english_u031","question":"用所给词的适当形式填空：She asked me ______ (how) I could get to the airport.","answer":"答案：how。解析：how引导宾语从句，\"我怎么去机场\"。"},{"id":"g2_english_u032_ex01","knowledge_id":"g2_english_u032","question":"单项选择：He said he _____ at home yesterday. A. is  B. was  C. were  D. are","answer":"答案：B. was。解析：said是过去时，从句要用相应的过去时。"},{"id":"g2_english_u032_ex02","knowledge_id":"g2_english_u032","question":"用所给词的适当形式填空：I thought she ______ (come) the next day.","answer":"答案：would come。解析：thought是过去时，从句要用过去将来时。"},{"id":"g2_english_u032_ex03","knowledge_id":"g2_english_u032","question":"单项选择：She told me that she _____ to Paris last year. A. has gone  B. had gone  C. went  D. goes","answer":"答案：B. had gone。解析：told是过去时，从句用过去完成时。"},{"id":"g2_english_u032_ex04","knowledge_id":"g2_english_u032","question":"单项选择：He said that light _____ faster than sound. A. travels  B. traveled  C. is traveling  D. was traveling","answer":"答案：A. travels。解析：主句是过去时，但\"光速比声速快\"是客观事实，从句用一般现在时。"},{"id":"g2_english_u032_ex05","knowledge_id":"g2_english_u032","question":"翻译句子：她告诉我她在写一封信。","answer":"答案：She told me (that) she was writing a letter. 解析：told是过去时，从句用过去进行时was writing。"},{"id":"g2_english_u032_ex06","knowledge_id":"g2_english_u032","question":"用所给词的适当形式填空：He said that the sun ______ (rise) in the east.","answer":"答案：rises。解析：\"太阳从东方升起\"是客观真理，时态不变。"},{"id":"g2_english_u032_ex07","knowledge_id":"g2_english_u032","question":"单项选择：I think he _____ in the library now. A. is  B. was  C. will be  D. has been","answer":"答案：A. is。解析：主句I think是现在时，从句用相应时态。"},{"id":"g2_english_u032_ex08","knowledge_id":"g2_english_u032","question":"单项选择：She said she _____ to the park tomorrow. A. goes  B. went  C. will go  D. would go","answer":"答案：D. would go。解析：said是过去时，从句用过去将来时would go。"},{"id":"g2_english_u032_ex09","knowledge_id":"g2_english_u032","question":"用所给词的适当形式填空：I heard that he ______ (read) an English book at that time.","answer":"答案：was reading。解析：at that time\"那时\"，从句用过去进行时。"},{"id":"g2_english_u032_ex10","knowledge_id":"g2_english_u032","question":"翻译句子：他告诉我他每天都锻炼。","answer":"答案：He told me (that) he exercises every day. 解析：每天锻炼是习惯性动作，从句用一般现在时。"},{"id":"g2_english_u033_ex01","knowledge_id":"g2_english_u033","question":"单项选择：Tom is _____ than Jack. A. tall  B. taller  C. tallest  D. the tallest","answer":"答案：B. taller。解析：than是比较级的标志。tall的比较级是taller（直接加-er）。"},{"id":"g2_english_u033_ex02","knowledge_id":"g2_english_u033","question":"用所给词的适当形式填空：This box is ______ (heavy) than that one.","answer":"答案：heavier。解析：than是比较级标志。heavy以辅音+y结尾，变y为i加-er。"},{"id":"g2_english_u033_ex03","knowledge_id":"g2_english_u033","question":"单项选择：It is _____ today than yesterday. A. cold  B. colder  C. coldest  D. the coldest","answer":"答案：B. colder。解析：than是比较级标志。cold的比较级是colder。"},{"id":"g2_english_u033_ex04","knowledge_id":"g2_english_u033","question":"单项选择：This book is _____ than that one. A. more interesting  B. interesting  C. interestinger  D. most interesting","answer":"答案：A. more interesting。解析：interesting是多音节形容词，比较级前加more。"},{"id":"g2_english_u033_ex05","knowledge_id":"g2_english_u033","question":"用所给词的适当形式填空：Mary is ______ (busy) than her sister.","answer":"答案：busier。解析：busy以辅音+y结尾，变y为i加-er。"},{"id":"g2_english_u033_ex06","knowledge_id":"g2_english_u033","question":"单项选择：A plane is _____ than a car. A. fast  B. faster  C. fastest  D. the fastest","answer":"答案：B. faster。解析：than是比较级标志。fast的比较级是faster。"},{"id":"g2_english_u033_ex07","knowledge_id":"g2_english_u033","question":"用所给词的适当形式填空：Today is ______ (hot) than yesterday.","answer":"答案：hotter。解析：hot是重读闭音节结尾，末尾只有一个辅音字母t，双写t加-er。"},{"id":"g2_english_u033_ex08","knowledge_id":"g2_english_u033","question":"单项选择：My bag is _____ than yours. A. big  B. bigger  C. biggest  D. the biggest","answer":"答案：B. bigger。解析：than是比较级标志。big是重读闭音节结尾，双写g加-er。"},{"id":"g2_english_u033_ex09","knowledge_id":"g2_english_u033","question":"翻译句子：他比他哥哥更外向。","answer":"答案：He is more outgoing than his brother. 解析：outgoing是多音节形容词，比较级前加more。"},{"id":"g2_english_u033_ex10","knowledge_id":"g2_english_u033","question":"用所给词的适当形式填空：My room is ______ (large) than my sister's.","answer":"答案：larger。解析：large以e结尾，加-r。"},{"id":"g2_english_u034_ex01","knowledge_id":"g2_english_u034","question":"单项选择：This book is _____ than that one. A. good  B. better  C. best  D. the best","answer":"答案：B. better。解析：good的比较级是better（不规则变化）。"},{"id":"g2_english_u034_ex02","knowledge_id":"g2_english_u034","question":"单项选择：His English is _____ than mine. A. bad  B. badder  C. worse  D. worst","answer":"答案：C. worse。解析：bad的比较级是worse（不规则变化）。"},{"id":"g2_english_u034_ex03","knowledge_id":"g2_english_u034","question":"用所给词的适当形式填空：I have ______ (many) books than you.","answer":"答案：more。解析：many的比较级是more。"},{"id":"g2_english_u034_ex04","knowledge_id":"g2_english_u034","question":"单项选择：This bag is _____ expensive than that one. A. more  B. less  C. much  D. very","answer":"答案：B. less。解析：little的比较级是less，\"更便宜\"。"},{"id":"g2_english_u034_ex05","knowledge_id":"g2_english_u034","question":"单项选择：My house is _____ from the school than yours. A. far  B. farther  C. farthest  D. farer","answer":"答案：B. farther。解析：far的比较级是farther或further。"},{"id":"g2_english_u034_ex06","knowledge_id":"g2_english_u034","question":"用所给词的适当形式填空：Tom runs ______ (fast) than Jack.","answer":"答案：faster。解析：fast是规则变化，加-er变faster。"},{"id":"g2_english_u034_ex07","knowledge_id":"g2_english_u034","question":"单项选择：She is _____ at math than me. A. good  B. well  C. better  D. best","answer":"答案：C. better。解析：good/well的比较级都是better。"},{"id":"g2_english_u034_ex08","knowledge_id":"g2_english_u034","question":"翻译句子：今天的天气比昨天差。","answer":"答案：The weather today is worse than yesterday. 解析：bad的比较级是worse。"},{"id":"g2_english_u034_ex09","knowledge_id":"g2_english_u034","question":"用所给词的适当形式填空：He has ______ (much) money than his brother.","answer":"答案：more。解析：much的比较级是more。"},{"id":"g2_english_u034_ex10","knowledge_id":"g2_english_u034","question":"单项选择：— How are you feeling? — _____. I feel _____ than before. A. Bad, worse  B. Worse, badly  C. Worse, worse  D. Badly, bad","answer":"答案：A. Bad, worse。解析：feel是系动词，后接形容词bad；than后用比较级worse。"},{"id":"g2_english_u035_ex01","knowledge_id":"g2_english_u035","question":"单项选择：Tom is the _____ student in our class. A. tall  B. taller  C. tallest  D. the tallest","answer":"答案：C. tallest。解析：最高级前加the。tall的最高级是tallest。"},{"id":"g2_english_u035_ex02","knowledge_id":"g2_english_u035","question":"用所给词的适当形式填空：This is ______ (interesting) book I have ever read.","answer":"答案：the most interesting。解析：interesting是多音节形容词，最高级前加the most。"},{"id":"g2_english_u035_ex03","knowledge_id":"g2_english_u035","question":"单项选择：Mount Qomolangma is _____ mountain in the world. A. high  B. higher  C. the highest  D. highest","answer":"答案：C. the highest。解析：最高级前要加the。"},{"id":"g2_english_u035_ex04","knowledge_id":"g2_english_u035","question":"用所给词的适当形式填空：She is ______ (happy) girl in her family.","answer":"答案：the happiest。解析：happy以辅音+y结尾，变y为i加-est。"},{"id":"g2_english_u035_ex05","knowledge_id":"g2_english_u035","question":"单项选择：Today is _____ day of the year. A. hot  B. hotter  C. hottest  D. the hottest","answer":"答案：D. the hottest。解析：最高级前加the。hot是重读闭音节结尾，双写t加-est。"},{"id":"g2_english_u035_ex06","knowledge_id":"g2_english_u035","question":"单项选择：He is _____ boy in his class. A. tall  B. taller  C. the tallest  D. tallest","answer":"答案：C. the tallest。解析：最高级前加the。"},{"id":"g2_english_u035_ex07","knowledge_id":"g2_english_u035","question":"用所给词的适当形式填空：This is one of ______ (nice) parks in the city.","answer":"答案：the nicest。解析：one of + 最高级 + 复数名词。nice以e结尾，加-st。"},{"id":"g2_english_u035_ex08","knowledge_id":"g2_english_u035","question":"翻译句子：他是我们班最聪明的学生。","answer":"答案：He is the smartest student in our class. 解析：smart以重读闭音节结尾，双写t加-est。the smartest是最高级形式。"},{"id":"g2_english_u035_ex09","knowledge_id":"g2_english_u035","question":"单项选择：Of all the subjects, math is _____ for me. A. difficult  B. more difficult  C. the most difficult  D. most difficult","answer":"答案：C. the most difficult。解析：多音节形容词最高级前加the most。"},{"id":"g2_english_u035_ex10","knowledge_id":"g2_english_u035","question":"用所给词的适当形式填空：The Yangtze River is ______ (long) river in China.","answer":"答案：the longest。解析：long的最高级是longest。"},{"id":"g2_english_u036_ex01","knowledge_id":"g2_english_u036","question":"单项选择：This is _____ movie I have ever seen. A. good  B. better  C. best  D. the best","answer":"答案：D. the best。解析：good的最高级是the best。"},{"id":"g2_english_u036_ex02","knowledge_id":"g2_english_u036","question":"单项选择：That was _____ day of my life. A. bad  B. worse  C. worst  D. the worst","answer":"答案：D. the worst。解析：bad的最高级是the worst。"},{"id":"g2_english_u036_ex03","knowledge_id":"g2_english_u036","question":"用所给词的适当形式填空：He has ______ (many) books in our class.","answer":"答案：the most。解析：many的最高级是the most。"},{"id":"g2_english_u036_ex04","knowledge_id":"g2_english_u036","question":"单项选择：This is _____ story in the book. A. little  B. less  C. least  D. the least","answer":"答案：D. the least。解析：little的最高级是the least。"},{"id":"g2_english_u036_ex05","knowledge_id":"g2_english_u036","question":"翻译句子：哪条路是去火车站最远的？","answer":"答案：Which is the farthest way to the train station? 解析：far的最高级是the farthest或the furthest。"},{"id":"g2_english_u036_ex06","knowledge_id":"g2_english_u036","question":"单项选择：She is _____ student in our school. A. good  B. better  C. best  D. the best","answer":"答案：D. the best。解析：good的最高级是the best。"},{"id":"g2_english_u036_ex07","knowledge_id":"g2_english_u036","question":"用所给词的适当形式填空：Of all the subjects, I like English ______ (well).","answer":"答案：the best。解析：well的最高级是the best。"},{"id":"g2_english_u036_ex08","knowledge_id":"g2_english_u036","question":"单项选择：Of all the students, Tom is _____. He always gets the lowest mark. A. bad  B. worse  C. worst  D. the worst","answer":"答案：D. the worst。解析：bad的最高级是the worst。"},{"id":"g2_english_u036_ex09","knowledge_id":"g2_english_u036","question":"翻译句子：这是我吃过的最好吃的食物。","answer":"答案：This is the most delicious food I have ever eaten. 解析：delicious是多音节形容词，最高级前加the most。"},{"id":"g2_english_u036_ex10","knowledge_id":"g2_english_u036","question":"用所给词的适当形式填空：This is ______ (much) interesting book of the three.","answer":"答案：the most。解析：much的最高级是the most。"},{"id":"g2_english_u037_ex01","knowledge_id":"g2_english_u037","question":"单项选择：Tom is _____ than Jack in our class. A. tall  B. taller  C. tallest  D. the tallest","answer":"答案：B. taller。解析：两人比较用比较级。"},{"id":"g2_english_u037_ex02","knowledge_id":"g2_english_u037","question":"单项选择：Tom is _____ student in our class. A. tall  B. taller  C. tallest  D. the tallest","answer":"答案：D. the tallest。解析：三者及以上用最高级，前加the。"},{"id":"g2_english_u037_ex03","knowledge_id":"g2_english_u037","question":"用所给词的适当形式填空：This river is ______ (long) than that one.","answer":"答案：longer。解析：than是比较级标志。"},{"id":"g2_english_u037_ex04","knowledge_id":"g2_english_u037","question":"单项选择：China has _____ population in the world. A. larger  B. largest  C. the largest  D. the most large","answer":"答案：C. the largest。解析：最高级前加the。largest是最高级。"},{"id":"g2_english_u037_ex05","knowledge_id":"g2_english_u037","question":"翻译句子：他是三兄弟中最高的。","answer":"答案：He is the tallest of the three brothers. 解析：三者比较用最高级，of the three brothers\"在三个兄弟中\"。"},{"id":"g2_english_u037_ex06","knowledge_id":"g2_english_u037","question":"用所给词的适当形式填空：Of the four seasons, summer is ______ (hot).","answer":"答案：the hottest。解析：四者比较用最高级。"},{"id":"g2_english_u037_ex07","knowledge_id":"g2_english_u037","question":"单项选择：This question is _____ than that one. A. easy  B. easier  C. easiest  D. the easiest","answer":"答案：B. easier。解析：两者比较用比较级。"},{"id":"g2_english_u037_ex08","knowledge_id":"g2_english_u037","question":"单项选择：He runs _____ of all the students. A. fast  B. faster  C. fastest  D. the fastest","answer":"答案：D. the fastest。解析：三者及以上用最高级。"},{"id":"g2_english_u037_ex09","knowledge_id":"g2_english_u037","question":"用所给词的适当形式填空：She is ______ (young) of the three sisters.","answer":"答案：the youngest。解析：三者比较用最高级。"},{"id":"g2_english_u037_ex10","knowledge_id":"g2_english_u037","question":"翻译句子：这个盒子比那个盒子重。","answer":"答案：This box is heavier than that one. 解析：两者比较用比较级。heavy以辅音+y结尾，变y为i加-er。"},{"id":"g2_english_u038_ex01","knowledge_id":"g2_english_u038","question":"单项选择：Tom is _____ tall _____ Jack. A. as, as  B. so, as  C. as, so  D. so, so","answer":"答案：A. as, as。解析：as...as表示\"和...一样\"。"},{"id":"g2_english_u038_ex02","knowledge_id":"g2_english_u038","question":"单项选择：This book is _____ interesting _____ that one. A. as, as  B. so, as  C. as, so  D. too, to","answer":"答案：A. as, as。解析：as...as同级比较。"},{"id":"g2_english_u038_ex03","knowledge_id":"g2_english_u038","question":"用所给词的适当形式填空：She runs ______ (fast) as her sister.","answer":"答案：as fast。解析：as...as中间用原级。"},{"id":"g2_english_u038_ex04","knowledge_id":"g2_english_u038","question":"单项选择：He is _____ old _____ me. A. as, as  B. so, as  C. as, like  D. so, like","answer":"答案：A. as, as。解析：as...as表示\"和...一样\"。"},{"id":"g2_english_u038_ex05","knowledge_id":"g2_english_u038","question":"翻译句子：这个房间和那个房间一样大。","answer":"答案：This room is as big as that one. 解析：as...as中间用原级。"},{"id":"g2_english_u038_ex06","knowledge_id":"g2_english_u038","question":"单项选择：This problem isn't _____ difficult _____ that one. A. as, as  B. so, as  C. as, like  D. not, as","answer":"答案：A. as, as。解析：not as...as\"不如...\"。"},{"id":"g2_english_u038_ex07","knowledge_id":"g2_english_u038","question":"用所给词的适当形式填空：Tom is ______ (tall) as his father.","answer":"答案：as tall。解析：as...as中间用原级。"},{"id":"g2_english_u038_ex08","knowledge_id":"g2_english_u038","question":"单项选择：My new dress is _____ beautiful _____ the one I saw yesterday. A. as, as  B. so, as  C. so, like  D. too, to","answer":"答案：A. as, as。解析：as...as同级比较。"},{"id":"g2_english_u038_ex09","knowledge_id":"g2_english_u038","question":"翻译句子：他说得和他朋友一样快。","answer":"答案：He speaks as fast as his friend. 解析：as...as中间用原级。speaks fast\"说得快\"。"},{"id":"g2_english_u038_ex10","knowledge_id":"g2_english_u038","question":"用所给词的适当形式填空：She is ______ (pretty) as her mother.","answer":"答案：as pretty。解析：as...as中间用原级。"},{"id":"g2_english_u039_ex01","knowledge_id":"g2_english_u039","question":"单项选择：I _____ already _____ my homework. A. has, finished  B. have, finished  C. am, finishing  D. will, finish","answer":"答案：B. have, finished。解析：现在完成时：have + 过去分词。already用于现在完成时。"},{"id":"g2_english_u039_ex02","knowledge_id":"g2_english_u039","question":"用所给词的适当形式填空：She ______ (go) to Shanghai. She will be back next week.","answer":"答案：has gone。解析：现在完成时表示\"去了还没回来\"。"},{"id":"g2_english_u039_ex03","knowledge_id":"g2_english_u039","question":"单项选择：They _____ this book many times. A. read  B. reads  C. have read  D. has read","answer":"答案：C. have read。解析：主语they用have。"},{"id":"g2_english_u039_ex04","knowledge_id":"g2_english_u039","question":"单项选择：He _____ in this school for three years. A. works  B. worked  C. has worked  D. will work","answer":"答案：C. has worked。解析：for three years是现在完成时的标志时间状语。"},{"id":"g2_english_u039_ex05","knowledge_id":"g2_english_u039","question":"翻译句子：我已经看过这部电影了。","answer":"答案：I have already seen this movie. 解析：现在完成时：have + 过去分词。"},{"id":"g2_english_u039_ex06","knowledge_id":"g2_english_u039","question":"用所给词的适当形式填空：We ______ (live) in Beijing since 2010.","answer":"答案：have lived。解析：since 2010\"自从2010年\"，是现在完成时标志。"},{"id":"g2_english_u039_ex07","knowledge_id":"g2_english_u039","question":"单项选择：My father _____ just _____ back from work. A. has, come  B. have, came  C. is, come  D. was, come","answer":"答案：A. has, come。解析：just\"刚刚\"，与现在完成时连用。My father是第三人称单数，用has。"},{"id":"g2_english_u039_ex08","knowledge_id":"g2_english_u039","question":"单项选择：She _____ the book yet? A. has finished  B. have finished  C. finished  D. finishes","answer":"答案：A. has finished。解析：yet用于现在完成时，主语she用has。"},{"id":"g2_english_u039_ex09","knowledge_id":"g2_english_u039","question":"翻译句子：他已经去过北京两次了。","answer":"答案：He has been to Beijing twice. 解析：have been to\"去过\"。twice\"两次\"。"},{"id":"g2_english_u039_ex10","knowledge_id":"g2_english_u039","question":"用所给词的适当形式填空：I ______ (know) him for five years.","answer":"答案：have known。解析：for five years是现在完成时标志。"},{"id":"g2_english_u040_ex01","knowledge_id":"g2_english_u040","question":"单项选择：I _____ in this city for ten years. A. live  B. lived  C. have lived  D. will live","answer":"答案：C. have lived。解析：for ten years是现在完成时标志，表示持续。"},{"id":"g2_english_u040_ex02","knowledge_id":"g2_english_u040","question":"用所给词的适当形式填空：She ______ (teach) English since 2015.","answer":"答案：has taught。解析：since 2015是现在完成时标志。teach的过去分词是taught。"},{"id":"g2_english_u040_ex03","knowledge_id":"g2_english_u040","question":"单项选择：_____ you _____ your lunch yet? A. Have, had  B. Did, have  C. Are, having  D. Will, have","answer":"答案：A. Have, had。解析：yet用于现在完成时一般疑问句。"},{"id":"g2_english_u040_ex04","knowledge_id":"g2_english_u040","question":"翻译句子：他在这家公司工作三年了。","answer":"答案：He has worked in this company for three years. 解析：for three years是现在完成时标志。"},{"id":"g2_english_u040_ex05","knowledge_id":"g2_english_u040","question":"单项选择：We _____ each other since we were children. A. know  B. knew  C. have known  D. will know","answer":"答案：C. have known。解析：since引导一般过去时，主句用现在完成时。"},{"id":"g2_english_u040_ex06","knowledge_id":"g2_english_u040","question":"用所给词的适当形式填空：He ______ (be) to Hong Kong twice.","answer":"答案：has been。解析：twice表示次数，have been to\"去过\"。"},{"id":"g2_english_u040_ex07","knowledge_id":"g2_english_u040","question":"单项选择：I _____ this movie three times. A. see  B. saw  C. have seen  D. will see","answer":"答案：C. have seen。解析：three times是现在完成时标志。"},{"id":"g2_english_u040_ex08","knowledge_id":"g2_english_u040","question":"用所给词的适当形式填空：They ______ (know) each other for ten years.","answer":"答案：have known。解析：for ten years是现在完成时标志。"},{"id":"g2_english_u040_ex09","knowledge_id":"g2_english_u040","question":"翻译句子：我祖父去世五年了。","answer":"答案：My grandfather has been dead for five years. 解析：die是瞬间动词，要转换为be dead。"},{"id":"g2_english_u040_ex10","knowledge_id":"g2_english_u040","question":"单项选择：_____ he _____ to Beijing before? A. Has, been  B. Have, been  C. Did, go  D. Was, going","answer":"答案：A. Has, been。解析：主语he是第三人称单数，用has。before\"以前\"，是现在完成时标志。"},{"id":"g2_english_u041_ex01","knowledge_id":"g2_english_u041","question":"单项选择：I _____ already _____ my homework. A. has, finished  B. have, finished  C. am, finishing  D. will, finish","answer":"答案：B. have, finished。解析：already用于现在完成时肯定句。"},{"id":"g2_english_u041_ex02","knowledge_id":"g2_english_u041","question":"用所给词的适当形式填空：She ______ (just, arrive) in Beijing.","answer":"答案：has just arrived。解析：just\"刚刚\"，用于现在完成时肯定句。"},{"id":"g2_english_u041_ex03","knowledge_id":"g2_english_u041","question":"单项选择：_____ you finished your work _____? A. Have, yet  B. Have, already  C. Are, yet  D. Are, already","answer":"答案：A. Have, yet。解析：yet用于现在完成时疑问句句末。"},{"id":"g2_english_u041_ex04","knowledge_id":"g2_english_u041","question":"单项选择：I haven't seen him _____. A. already  B. just  C. yet  D. ever","answer":"答案：C. yet。解析：yet用于现在完成时否定句句末。"},{"id":"g2_english_u041_ex05","knowledge_id":"g2_english_u041","question":"翻译句子：我刚刚吃完早饭。","answer":"答案：I have just finished my breakfast. 解析：just\"刚刚\"，用于现在完成时肯定句中have和过去分词之间。"},{"id":"g2_english_u041_ex06","knowledge_id":"g2_english_u041","question":"单项选择：He has _____ been to the Great Wall. A. yet  B. just  C. already  D. never","answer":"答案：C. already。解析：already用于现在完成时肯定句。"},{"id":"g2_english_u041_ex07","knowledge_id":"g2_english_u041","question":"用所给词的适当形式填空：Have they ______ (yet) arrived?","answer":"答案：yet。解析：yet用于现在完成时疑问句句末。"},{"id":"g2_english_u041_ex08","knowledge_id":"g2_english_u041","question":"单项选择：— Have you finished your homework? — Yes, I have _____ finished it. A. yet  B. already  C. ever  D. just","answer":"答案：B. already。解析：already用于现在完成时肯定句回答。"},{"id":"g2_english_u041_ex09","knowledge_id":"g2_english_u041","question":"翻译句子：我还没收到他的来信。","answer":"答案：I haven't received his letter yet. 解析：yet用于现在完成时否定句句末。"},{"id":"g2_english_u041_ex10","knowledge_id":"g2_english_u041","question":"用所给词的适当形式填空：The movie has ______ (already/just) begun.","answer":"答案：already/just。解析：already/just都可用于现在完成时肯定句。"},{"id":"g2_english_u042_ex01","knowledge_id":"g2_english_u042","question":"单项选择：— Where is Tom? — He _____ to the library. A. has been  B. has gone  C. went  D. goes","answer":"答案：B. has gone。解析：has gone to\"去了还没回来\"，问Tom在哪说明他不在这里。"},{"id":"g2_english_u042_ex02","knowledge_id":"g2_english_u042","question":"用所给词的适当形式填空：I ______ (be) to Beijing three times.","answer":"答案：have been。解析：have been to\"去过\"，强调经历。"},{"id":"g2_english_u042_ex03","knowledge_id":"g2_english_u042","question":"单项选择：She _____ to Shanghai. She'll be back next week. A. has been  B. has gone  C. went  D. goes","answer":"答案：B. has gone。解析：has gone to\"去了还没回来\"。"},{"id":"g2_english_u042_ex04","knowledge_id":"g2_english_u042","question":"翻译句子：我去过长城。","answer":"答案：I have been to the Great Wall. 解析：have been to\"去过\"，表示经历。"},{"id":"g2_english_u042_ex05","knowledge_id":"g2_english_u042","question":"单项选择：My parents _____ to Paris. They will come back next month. A. have been  B. have gone  C. went  D. go","answer":"答案：B. have gone。解析：have gone to\"去了还没回来\"。"},{"id":"g2_english_u042_ex06","knowledge_id":"g2_english_u042","question":"用所给词的适当形式填空：He ______ (be) in this city for five years.","answer":"答案：has been。解析：for five years\"五年\"，has been in\"在某地待了\"。"},{"id":"g2_english_u042_ex07","knowledge_id":"g2_english_u042","question":"单项选择：— Have you _____ to America? — Yes, I went there last year. A. gone  B. been  C. come  D. went","answer":"答案：B. been。解析：have been to\"去过\"。Yes回答，last year说明是经历。"},{"id":"g2_english_u042_ex08","knowledge_id":"g2_english_u042","question":"翻译句子：她已经离开三天了。","answer":"答案：She has been away for three days. 解析：leave是瞬间动词，要转换为be away。for three days\"三天了\"。"},{"id":"g2_english_u042_ex09","knowledge_id":"g2_english_u042","question":"用所给词的适当形式填空：My brother ______ (go) to London. He is studying there now.","answer":"答案：has gone。解析：has gone to\"去了还没回来\"。He is studying there now说明他现在在伦敦。"},{"id":"g2_english_u042_ex10","knowledge_id":"g2_english_u042","question":"单项选择：I have _____ this movie. It's boring. A. seen  B. saw  C. see  D. seeing","answer":"答案：A. seen。解析：现在完成时：have + 过去分词。see的过去分词是seen。"},{"id":"g2_english_u043_ex01","knowledge_id":"g2_english_u043","question":"单项选择：I _____ the book yesterday. A. read  B. have read  C. am reading  D. will read","answer":"答案：A. read。解析：yesterday是一般过去时，read的过去式是read（发音为/red/）。"},{"id":"g2_english_u043_ex02","knowledge_id":"g2_english_u043","question":"用所给词的适当形式填空：I ______ (read) this book already.","answer":"答案：have read。解析：already\"已经\"是现在完成时标志。"},{"id":"g2_english_u043_ex03","knowledge_id":"g2_english_u043","question":"单项选择：_____ you _____ the movie? — Yes, I saw it last night. A. Have, seen  B. Did, see  C. Do, see  D. Are, seeing","answer":"答案：A. Have, seen。解析：现在完成时询问经历。回答用一般过去时saw。"},{"id":"g2_english_u043_ex04","knowledge_id":"g2_english_u043","question":"单项选择：I _____ my keys just now. A. have lost  B. lost  C. lose  D. am losing","answer":"答案：B. lost。解析：just now（刚才）是一般过去时。"},{"id":"g2_english_u043_ex05","knowledge_id":"g2_english_u043","question":"翻译句子：我昨天看了一部很棒的电影。","answer":"答案：I watched a great movie yesterday. 解析：yesterday是一般过去时。"},{"id":"g2_english_u043_ex06","knowledge_id":"g2_english_u043","question":"用所给词的适当形式填空：He ______ (live) in Beijing for five years, but now he lives in Shanghai.","answer":"答案：lived。解析：for five years + but now提示一般过去时。"},{"id":"g2_english_u043_ex07","knowledge_id":"g2_english_u043","question":"单项选择：Have you ever _____ to Japan? A. went  B. gone  C. been  D. go","answer":"答案：C. been。解析：have been to\"去过\"。ever\"曾经\"是现在完成时标志。"},{"id":"g2_english_u043_ex08","knowledge_id":"g2_english_u043","question":"单项选择：She _____ her homework an hour ago. A. finished  B. has finished  C. finishes  D. is finishing","answer":"答案：A. finished。解析：an hour ago是一般过去时。"},{"id":"g2_english_u043_ex09","knowledge_id":"g2_english_u043","question":"翻译句子：我从来没看过这部电影。","answer":"答案：I have never seen this movie. 解析：never\"从未\"是现在完成时标志。seen是see的过去分词。"},{"id":"g2_english_u043_ex10","knowledge_id":"g2_english_u043","question":"用所给词的适当形式填空：I ______ (visit) my grandparents last weekend. I ______ (visit) them every month.","answer":"答案：visited, visit。解析：last weekend是一般过去时；every month是一般现在时。"},{"id":"g2_english_u044_ex01","knowledge_id":"g2_english_u044","question":"单项选择：I have _____ my homework. A. do  B. did  C. done  D. doing","answer":"答案：C. done。解析：do的过去分词是done。现在完成时：have + 过去分词。"},{"id":"g2_english_u044_ex02","knowledge_id":"g2_english_u044","question":"用所给词的适当形式填空：He has ______ (eat) three hamburgers.","answer":"答案：eaten。解析：eat的过去分词是eaten（不规则变化）。"},{"id":"g2_english_u044_ex03","knowledge_id":"g2_english_u044","question":"单项选择：She has _____ to Beijing twice. A. gone  B. went  C. go  D. goes","answer":"答案：A. gone。解析：go的过去分词是gone。现在完成时：has + gone。"},{"id":"g2_english_u044_ex04","knowledge_id":"g2_english_u044","question":"单项选择：I have _____ the book on the desk. A. put  B. putted  C. puts  D. putting","answer":"答案：A. put。解析：put的过去分词是put（三形相同）。现在完成时：have + put。"},{"id":"g2_english_u044_ex05","knowledge_id":"g2_english_u044","question":"用所给词的适当形式填空：He has ______ (buy) a new car.","answer":"答案：bought。解析：buy的过去分词是bought（不规则变化）。"},{"id":"g2_english_u044_ex06","knowledge_id":"g2_english_u044","question":"单项选择：They have _____ the work. A. finish  B. finished  C. finishing  D. finishes","answer":"答案：B. finished。解析：finish的过去分词是finished（规则变化，加-ed）。"},{"id":"g2_english_u044_ex07","knowledge_id":"g2_english_u044","question":"用所给词的适当形式填空：I have ______ (see) that movie before.","answer":"答案：seen。解析：see的过去分词是seen（不规则变化）。"},{"id":"g2_english_u044_ex08","knowledge_id":"g2_english_u044","question":"单项选择：She has _____ a letter to her friend. A. write  B. wrote  C. written  D. writing","answer":"答案：C. written。解析：write的过去分词是written（不规则变化）。现在完成时：has + written。"},{"id":"g2_english_u044_ex09","knowledge_id":"g2_english_u044","question":"用所给词的适当形式填空：He has ______ (take) the book away.","answer":"答案：taken。解析：take的过去分词是taken（不规则变化）。"},{"id":"g2_english_u044_ex10","knowledge_id":"g2_english_u044","question":"翻译句子：我已经把书读完了。","answer":"答案：I have finished reading the book. 解析：finish的过去分词是finished。"},{"id":"g2_english_u045_ex01","knowledge_id":"g2_english_u045","question":"单项选择：I _____ finished my homework yet. A. haven't  B. doesn't have  C. didn't  D. don't","answer":"答案：A. haven't。解析：现在完成时否定：主语 + haven't/hasn't + 过去分词。yet用于否定句。"},{"id":"g2_english_u045_ex02","knowledge_id":"g2_english_u045","question":"用所给词的适当形式填空：She ______ (hasn't) seen the movie.","answer":"答案：hasn't。解析：现在完成时否定，主语she是第三人称单数，用hasn't。"},{"id":"g2_english_u045_ex03","knowledge_id":"g2_english_u045","question":"单项选择：_____ you ever _____ to Beijing? A. Have, been  B. Did, be  C. Are, been  D. Were, be","answer":"答案：A. Have, been。解析：ever\"曾经\"是现在完成时标志。Have you ever been to...?\"你去过...吗？\""},{"id":"g2_english_u045_ex04","knowledge_id":"g2_english_u045","question":"单项选择：He _____ read this book. A. haven't  B. hasn't  C. didn't  D. don't","answer":"答案：B. hasn't。解析：主语he是第三人称单数，否定用hasn't。"},{"id":"g2_english_u045_ex05","knowledge_id":"g2_english_u045","question":"用所给词的适当形式填空：______ (Have) they arrived yet?","answer":"答案：Have。解析：yet用于现在完成时疑问句。主语they用Have。"},{"id":"g2_english_u045_ex06","knowledge_id":"g2_english_u045","question":"单项选择：— Have you read this book? — _____ A. Yes, I have  B. No, I have  C. Yes, I did  D. No, I don't","answer":"答案：A. Yes, I have。解析：现在完成时一般疑问句的肯定回答用Yes, 主语 + have/has。"},{"id":"g2_english_u045_ex07","knowledge_id":"g2_english_u045","question":"翻译句子：你曾经去过长城吗？","answer":"答案：Have you ever been to the Great Wall? 解析：ever\"曾经\"是现在完成时标志。"},{"id":"g2_english_u045_ex08","knowledge_id":"g2_english_u045","question":"用所给词的适当形式填空：We ______ (haven't) heard from him for a long time.","answer":"答案：haven't。解析：现在完成时否定，主语we用haven't。"},{"id":"g2_english_u045_ex09","knowledge_id":"g2_english_u045","question":"单项选择：— Has he finished his work? — _____. A. Yes, he has  B. No, he has  C. Yes, he did  D. No, he doesn't","answer":"答案：A. Yes, he has。解析：现在完成时一般疑问句的肯定回答用Yes, 主语 + has。"},{"id":"g2_english_u045_ex10","knowledge_id":"g2_english_u045","question":"翻译句子：他们还没有作出决定。","answer":"答案：They haven't made a decision yet. 解析：现在完成时否定：主语 + haven't + 过去分词。make的过去分词是made。"}];
