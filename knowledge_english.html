    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"id":"g2_english_u001","chapter":"第一章 Unit1: Where did you go on vacation?","name":"一般过去时的概念与构成","formula":"主语 + 动词过去式 + 其他","explanation":"一般过去时表示过去某一时间发生的动作或存在的状态。\n\n构成：主语 + 动词过去式\n- 肯定句：主语 + 动词过去式 + 其他\n- 否定句：主语 + did not (didn't) + 动词原形 + 其他\n- 一般疑问句：Did + 主语 + 动词原形 + 其他？\n\n时间状语：yesterday, last week, in 2020, two days ago, just now等","semester":"upper"},{"id":"g2_english_u002","chapter":"第一章 Unit1: Where did you go on vacation?","name":"规则动词过去式的变化规则","formula":"动词过去式 = 动词 + -ed","explanation":"规则动词过去式的构成：\n\n1. 一般情况：直接加 -ed\n   work → worked, play → played\n\n2. 以e结尾：加 -d\n   live → lived, like → liked\n\n3. 以辅音字母+y结尾：变y为i加 -ed\n   study → studied, try → tried\n\n4. 重读闭音节结尾且末尾只有一个辅音字母：双写末尾辅音加 -ed\n   stop → stopped, plan → planned","semester":"upper"},{"id":"g2_english_u003","chapter":"第一章 Unit1: Where did you go on vacation?","name":"不规则动词过去式","formula":"不规则动词需要特殊记忆","explanation":"常见不规则动词过去式：\n\n- am/is → was\n- are → were\n- go → went\n- come → came\n- see → saw\n- eat → ate\n- take → took\n- buy → bought\n- have → had\n- do → did\n- make → made\n- get → got\n- sleep → slept\n- feel → felt\n- say → said\n- tell → told\n- think → thought\n- read → read (发音变为/red/)","semester":"upper"},{"id":"g2_english_u004","chapter":"第一章 Unit1: Where did you go on vacation?","name":"一般过去时的否定句和疑问句","formula":"否定句：主语 + didn't + 动词原形\n疑问句：Did + 主语 + 动词原形？","explanation":"一般过去时的否定句和疑问句构成：\n\n否定句：\n主语 + did not (didn't) + 动词原形 + 其他\n例：I didn't go to school yesterday.\n\n疑问句：\nDid + 主语 + 动词原形 + 其他？\n例：Did you go to the park last weekend?\n\n注意：无论是肯定还是否定句，动词都要用原形。","semester":"upper"},{"id":"g2_english_u005","chapter":"第一章 Unit1: Where did you go on vacation?","name":"Where引导的特殊疑问句","formula":"Where + did + 主语 + 动词原形 + 其他？","explanation":"Where用于询问地点。\n\n结构：Where + did + 主语 + 动词原形 + 其他？\n\n例句：\n- Where did you go on vacation? 你去哪里度假了？\n- Where did she go last Sunday? 她上周日去哪里了？\n- Where did they stay? 他们住在哪里？\n\n回答用介词短语：\nI went to Beijing. / She went to the beach.","semester":"upper"},{"id":"g2_english_u006","chapter":"第一章 Unit1: Where did you go on vacation?","name":"复合不定代词","formula":"some-/any- + thing/body/one\nevery- + thing/body/one\nno- + thing/body/one","explanation":"复合不定代词由 some-, any-, every-, no- + thing, body, one 构成。\n\nsomething 某事/某物\nanything 任何事/任何物\neverything 每件事/每个事物\nnothing 没有事/没有物\n\nsomeone/somebody 某人\nanyone/anybody 任何人\neveryone/everybody 每个人\nno one/nobody 没有人\n\n用法：\n- something, someone, somebody 用于肯定句\n- anything, anyone, anybody 用于否定句和疑问句\n- everything, everyone, everywhere, no one, nobody 用于各种句型","semester":"upper"},{"id":"g2_english_u007","chapter":"第一章 Unit1: Where did you go on vacation?","name":"一般过去时的时间状语","formula":"yesterday / last... / ...ago / in + 过去年份","explanation":"常与一般过去时连用的时间状语：\n\n1. yesterday系列：\n   - yesterday 昨天\n   - yesterday morning/afternoon/evening 昨天上午/下午/晚上\n\n2. last系列：\n   - last week/month/year 上一周/月/年\n   - last summer/winter 去年夏天/冬天\n\n3. ago系列：\n   - two days ago 两天前\n   - a week ago 一周前\n   - long ago 很久以前\n\n4. 具体过去时间：\n   - in 2020 在2020年\n   - on Monday 在星期一","semester":"upper"},{"id":"g2_english_u008","chapter":"第二章 Unit2: What should I do?","name":"情态动词should的用法","formula":"主语 + should + 动词原形","explanation":"should是情态动词，表示\"应该\"。\n\n用法：\n1. 表示建议、劝告\n   You should study harder. 你应该更加努力学习。\n   She should see a doctor. 她应该去看医生。\n\n2. 否定句：should not (shouldn't)\n   You shouldn't give up. 你不应该放弃。\n\n3. 疑问句：Should + 主语 + 动词原形？\n   Should I tell her the truth? 我应该告诉她真相吗？\n\n特点：后面直接跟动词原形，无人称和数的变化。","semester":"upper"},{"id":"g2_english_u009","chapter":"第二章 Unit2: What should I do?","name":"情态动词could的用法","formula":"主语 + could + 动词原形","explanation":"could是can的过去式，也是情态动词。\n\n用法：\n1. 表示过去的能力（can的过去式）\n   When I was young, I could run fast. 我年轻时跑得很快。\n\n2. 表示请求许可（比can更委婉）\n   Could I use your phone? 我可以用你的手机吗？\n   Could you help me? 你能帮我吗？\n\n3. 表示可能性\n   It could rain tomorrow. 明天可能下雨。\n\n否定：could not (couldn't)\n疑问：Could + 主语 + 动词原形？","semester":"upper"},{"id":"g2_english_u010","chapter":"第二章 Unit2: What should I do?","name":"should与could的区别","formula":"should = 应该（建议）\ncould = 能够/可能（委婉）","explanation":"should和could的区别：\n\nshould（应该）：\n- 侧重于\"应该\"，表示建议或义务\n- You should drink more water. 你应该多喝水。\n- 语气较直接\n\ncould（能够/可能）：\n- 侧重于\"能够\"，表示能力或可能性\n- Could I borrow your book? 我能借你的书吗？\n- 语气更委婉、客气\n- 含有不确定或试探的意味\n\n比较：\nYou should see a doctor. 你应该去看医生。（建议）\nYou could see a doctor. 你可以去看医生。（可能的选择）","semester":"upper"},{"id":"g2_english_u011","chapter":"第二章 Unit2: What should I do?","name":"What should I do? 句型","formula":"What should I/we do?","explanation":"What should I do? 表示\"我应该做什么？\"\n\n用法：\n1. 询问建议或意见\n   What should I do? I have a fever. 我应该怎么办？我发烧了。\n\n2. 回答用should, could等\n   You should take some medicine and rest. 你应该吃药并休息。\n\n3. 复数形式：What should we do? 我们应该做什么？\n\n相关句型：\n- What should I wear? 我应该穿什么？\n- What should we buy? 我们应该买什么？","semester":"upper"},{"id":"g2_english_u012","chapter":"第二章 Unit2: What should I do?","name":"提建议的其他表达方式","formula":"Why don't you...? / How about...? / What about...?","explanation":"提建议的多种表达：\n\n1. Why don't you + 动词原形？\n   Why don't you go to bed earlier? 你为什么不早点睡觉？\n\n2. Why not + 动词原形？\n   Why not have a rest? 为什么不休息一下？\n\n3. How about + 名词/动名词？\n   How about going hiking? 去远足怎么样？\n\n4. What about + 名词/动名词？\n   What about this one? 这个怎么样？\n\n5. You should/shouldn't + 动词原形\n   You should try again. 你应该再试一次。\n\n6. You could + 动词原形\n   You could ask your teacher. 你可以问你的老师。","semester":"upper"},{"id":"g2_english_u013","chapter":"第二章 Unit2: What should I do?","name":"need to / don't need to 的用法","formula":"主语 + need to + 动词原形\n主语 + don't need to + 动词原形","explanation":"need to 表示\"需要做某事\"，是实义动词。\n\n用法：\n1. 肯定句：主语 + need(s) to + 动词原形\n   I need to study English. 我需要学英语。\n   She needs to lose weight. 她需要减肥。\n\n2. 否定句：主语 + don't/doesn't need to + 动词原形\n   You don't need to worry. 你不需要担心。\n\n3. 疑问句：Do/Does + 主语 + need to + 动词原形？\n   Do I need to bring my book? 我需要带书吗？\n\n注意：need to 有人称和数的变化。","semester":"upper"},{"id":"g2_english_u014","chapter":"第三章 Unit3: Could you please clean your room?","name":"Could you please...? 句型","formula":"Could you please + 动词原形？","explanation":"Could you please...? 是请求他人做某事的委婉句型。\n\n结构：Could you please + 动词原形？\n\n例句：\n- Could you please clean your room? 请你打扫一下房间好吗？\n- Could you please open the window? 请你打开窗户好吗？\n- Could you please help me with my homework? 请你帮我做作业好吗？\n\n回答：\n- Sure. / Of course. 当然可以。\n- Sorry, I can't. 对不起，我不能。\n\n注意：please后面直接跟动词原形。","semester":"upper"},{"id":"g2_english_u015","chapter":"第三章 Unit3: Could you please clean your room?","name":"Could I please...? 句型","formula":"Could I please + 动词原形？","explanation":"Could I please...? 是请求许可的委婉句型。\n\n结构：Could I please + 动词原形？\n\n例句：\n- Could I please use your computer? 请问我可以用你的电脑吗？\n- Could I please go out tonight? 请问我今晚可以出去吗？\n- Could I please have some water? 请问我可以喝点水吗？\n\n回答：\n- Sure. / Of course. 当然可以。\n- Sorry, you can't. 对不起，不行。\n\n与Can I...?相比，Could I...?更委婉客气。","semester":"upper"},{"id":"g2_english_u016","chapter":"第三章 Unit3: Could you please clean your room?","name":"情态动词总结","formula":"can, could, may, might, should, would","explanation":"常见情态动词用法总结：\n\n1. can/could：能力、请求、允许、可能性\n   I can swim. / Could you help me?\n\n2. may/might：允许、可能性（may较肯定，might较不确定）\n   May I come in? / It might rain.\n\n3. should：建议、应该\n   You should eat more vegetables.\n\n4. would：请求、意愿（更委婉）\n   Would you like some tea?\n\n特点：\n- 后面直接跟动词原形\n- 没有人称和数的变化\n- 否定式在后面加not","semester":"upper"},{"id":"g2_english_u017","chapter":"第三章 Unit3: Could you please clean your room?","name":"动词不定式作宾语","formula":"动词 + to + 动词原形","explanation":"动词不定式由 to + 动词原形构成，可作宾语。\n\n常见接不定式作宾语的动词：\n- want to do 想要做\n- hope to do 希望做\n- decide to do 决定做\n- plan to do 计划做\n- agree to do 同意做\n- learn to do 学习做\n- try to do 尝试做\n- need to do 需要做\n\n例句：\n- I want to buy a new bike. 我想买一辆新自行车。\n- She decided to study medicine. 她决定学医。\n- They plan to travel to Japan. 他们计划去日本旅游。","semester":"upper"},{"id":"g2_english_u018","chapter":"第四章 Unit4: Why don't you talk to your parents?","name":"Why don't you...? 句型","formula":"Why don't you + 动词原形？","explanation":"Why don't you...? 是提建议的句型，表示\"为什么不...？\"\n\n结构：Why don't you/we + 动词原形？\n\n例句：\n- Why don't you talk to your parents? 你为什么不和你的父母谈谈？\n- Why don't we go out for dinner? 我们为什么不出去吃饭？\n- Why don't you try this one? 你为什么不试试这个？\n\n简略形式：Why not + 动词原形？\n- Why not ask the teacher? 为什么不问老师？\n\n注意：don't 在这里是语法需要，不是否定含义。","semester":"upper"},{"id":"g2_english_u019","chapter":"第四章 Unit4: Why don't you talk to your parents?","name":"提建议句型总结","formula":"Why don't you...? / You should... / Let's...","explanation":"英语中提建议的常用句型：\n\n1. Why don't you/we + 动词原形？\n   Why don't you take a break?\n\n2. Why not + 动词原形？\n   Why not go swimming?\n\n3. You should/shouldn't + 动词原形\n   You should be more careful.\n\n4. You could + 动词原形\n   You could ask your friend.\n\n5. Let's + 动词原形\n   Let's play football.\n\n6. How about + 名词/动名词？\n   How about going to the cinema?\n\n7. What about + 名词/动名词？\n   What about having a picnic?","semester":"upper"},{"id":"g2_english_u020","chapter":"第四章 Unit4: Why don't you talk to your parents?","name":"should/shouldn't 的用法","formula":"主语 + should/shouldn't + 动词原形","explanation":"should和shouldn't表示\"应该/不应该\"，用于提建议。\n\nshould的用法：\n1. 表示建议\n   You should study English every day. 你应该每天学英语。\n\n2. 表示义务、责任\n   We should help others. 我们应该帮助他人。\n\n3. 表示推测\n   He should be at home now. 他现在应该在家。\n\nshouldn't的用法：\n1. 表示不建议\n   You shouldn't give up. 你不应该放弃。\n\n2. 表示不应该做的事\n   You shouldn't lie. 你不应该撒谎。","semester":"upper"},{"id":"g2_english_u021","chapter":"第四章 Unit4: Why don't you talk to your parents?","name":"have to / don't have to 的用法","formula":"主语 + have/has to + 动词原形\n主语 + don't/doesn't have to + 动词原形","explanation":"have to 表示\"不得不\"，强调客观必要性。\n\n用法：\n1. 肯定句：主语 + have/has to + 动词原形\n   I have to get up early. 我不得不早起。\n   She has to work late today. 她今天不得不工作到很晚。\n\n2. 否定句：主语 + don't/doesn't have to + 动词原形\n   You don't have to worry. 你不必担心。\n\n3. 疑问句：Do/Does + 主语 + have to + 动词原形？\n   Does he have to leave now? 他必须现在离开吗？\n\n注意：have to有人称和数的变化，第三人称单数用has to。","semester":"upper"},{"id":"g2_english_u022","chapter":"第四章 Unit4: Why don't you talk to your parents?","name":"until 和 so that 的用法","formula":"主句 + until + 时间点\n主句 + so that + 从句","explanation":"until的用法：\n- until表示\"直到...\"\n- 肯定句：动作持续到until表示的时间点\n  I will wait until you come back. 我会一直等到你回来。\n- 否定句：not...until 表示\"直到...才\"\n  Don't leave until I come back. 直到我回来你才能离开。\n\nso that的用法：\n- so that表示\"为了...\"，引导目的状语从句\n- I study hard so that I can pass the exam.\n  我努力学习是为了能通过考试。\n- Can you speak slowly so that I can understand?\n  你能说得慢一点让我能听懂吗？","semester":"upper"},{"id":"g2_english_u023","chapter":"第五章 Unit5: What were you doing when the rainstorm came?","name":"过去进行时的构成","formula":"主语 + was/were + 动词-ing","explanation":"过去进行时表示过去某一时刻或时段正在进行的动作。\n\n构成：主语 + was/were + 动词-ing\n\nbe动词的选择：\n- I / He / She / It → was\n- You / We / They → were\n\n例句：\n- I was reading a book at 8 o'clock last night.\n  昨晚八点我正在读书。\n- They were playing football when the teacher came.\n  老师来的时候他们正在踢足球。\n- She was cooking when I called her.\n  我打电话给她时她正在做饭。","semester":"upper"},{"id":"g2_english_u024","chapter":"第五章 Unit5: What were you doing when the rainstorm came?","name":"过去进行时的用法","formula":"过去进行时：was/were + 动词-ing","explanation":"过去进行时的用法：\n\n1. 表示过去某一时刻正在进行的动作\n   What were you doing at 9 pm last night? 昨晚九点你在做什么？\n   I was watching TV. 我在看电视。\n\n2. 表示过去某时段一直在进行的动作\n   She was studying English all morning. 她整个上午都在学英语。\n\n3. 与when/while连用，表示背景\n   I was walking home when it started to rain.\n  我正走回家时开始下雨了。\n\n时间状语：at that time, at this time yesterday, the whole morning等。","semester":"upper"},{"id":"g2_english_u025","chapter":"第五章 Unit5: What were you doing when the rainstorm came?","name":"when与while的区别","formula":"when + 从句（点动作）\nwhile + 从句（延续动作）","explanation":"when和while都表示\"当...时候\"，但有区别：\n\nwhen的用法：\n- 可接短暂性动词，也可接延续性动词\n- 可用于主句和从句动作同时发生或先后发生\n  When I arrived, she was leaving. 当我到达时，她正要离开。\n\nwhile的用法：\n- 通常接延续性动词，强调动作进行的过程\n- 只能用于主句和从句动作同时发生\n  While I was reading, the phone rang. 我在读书时电话响了。\n\n注意：\n- while引导的从句用过去进行时，when引导的主句用一般过去时\n- 可以互换：While/When I was walking, I saw him.","semester":"upper"},{"id":"g2_english_u026","chapter":"第五章 Unit5: What were you doing when the rainstorm came?","name":"过去进行时与一般过去时的区别","formula":"过去进行时：was/were + doing（进行）\n一般过去时：did（完成）","explanation":"过去进行时与一般过去时的区别：\n\n过去进行时：\n- 表示过去某一时刻或时段正在进行的动作\n- 强调动作的进行过程\n- I was reading when he came. 他来时我正在读书。\n\n一般过去时：\n- 表示过去发生的动作或存在的事实\n- 强调动作已经完成\n- I read a book yesterday. 我昨天读了一本书。\n\n常见搭配：\n- when引导的句子用一般过去时（短暂性动作）\n- while引导的句子用过去进行时（延续性动作）","semester":"upper"},{"id":"g2_english_u027","chapter":"第五章 Unit5: What were you doing when the rainstorm came?","name":"过去进行时的否定句和疑问句","formula":"否定句：主语 + wasn't/weren't + 动词-ing\n疑问句：Was/Were + 主语 + 动词-ing？","explanation":"过去进行时的否定句和疑问句：\n\n否定句：\n主语 + was not (wasn't) / were not (weren't) + 动词-ing\n- I wasn't watching TV. 我没在看电视。\n- They weren't playing games. 他们没在玩游戏。\n\n疑问句：\nWas/Were + 主语 + 动词-ing？\n- Were you studying at that time? 那时你在学习吗？\n- Was she sleeping when you called? 你打电话时她在睡觉吗？\n\n简略回答：\n- Yes, I was. / No, I wasn't.\n- Yes, they were. / No, they weren't.","semester":"upper"},{"id":"g2_english_u028","chapter":"第六章 Unit6: An old man tried to move the mountains","name":"宾语从句的概念","formula":"主句 + 连词 + 陈述句/疑问句","explanation":"宾语从句在句中作及物动词或介词的宾语。\n\n基本结构：\n主句 + 连接词 + 陈述句/一般疑问句/特殊疑问句\n\n连接词分类：\n1. that（无意义，可省略）\n2. if/whether（是否）\n3. 疑问词（what, where, when, who, why, how等）\n\n例句：\n- I think (that) he is right. 我认为他是对的。\n- She asked if I could come. 她问我是否能来。\n- I wonder where he lives. 我想知道他住在哪里。","semester":"upper"},{"id":"g2_english_u029","chapter":"第六章 Unit6: An old man tried to move the mountains","name":"that引导的宾语从句","formula":"动词 + that + 陈述句","explanation":"that引导宾语从句，无词义，在口语或非正式文体中可省略。\n\n常见接that从句的动词：\n- think 认为\n- believe 相信\n- know 知道\n- say 说\n- hope 希望\n- expect 期待\n- understand 理解\n\n例句：\n- I think (that) he is a good student. 我认为他是个好学生。\n- She said (that) she would come. 她说她会来。\n- We believe (that) we can win. 我们相信我们能赢。\n\n注意：宾语从句的时态可能需要与主句呼应。","semester":"upper"},{"id":"g2_english_u030","chapter":"第六章 Unit6: An old man tried to move the mountains","name":"if/whether引导的宾语从句","formula":"动词 + if/whether + 一般疑问句","explanation":"if和whether表示\"是否\"，用于引导一般疑问句的宾语从句。\n\n用法：\n- I don't know if/whether he is coming. 我不知道他是否要来。\n- She asked if/whether I needed help. 她问我是否需要帮助。\n\nif与whether的区别：\n1. 两者可互换，但在正式文体中多用whether\n2. 与动词不定式连用时只用whether\n   I don't know whether to go or stay. 我不知道是走还是留。\n3. 在介词后面只用whether\n   It depends on whether it will rain. 这取决于是否会下雨。\n4. 在句首时只用whether\n   Whether he will come, I'm not sure. 他是否会来我不确定。","semester":"upper"},{"id":"g2_english_u031","chapter":"第六章 Unit6: An old man tried to move the mountains","name":"疑问词引导的宾语从句","formula":"动词 + 疑问词 + 陈述句","explanation":"疑问词引导的宾语从句，疑问词作连接词或连接副词。\n\n疑问词分类：\n- who/whom 谁\n- whose 谁的\n- what 什么\n- which 哪一个\n- when 什么时候\n- where 在哪里\n- why 为什么\n- how 如何\n\n例句：\n- Tell me what you want. 告诉我你想要什么。\n- I don't know where she lives. 我不知道她住在哪里。\n- Can you explain why you are late? 你能解释你为什么迟到吗？\n- Do you know when the movie starts? 你知道电影什么时候开始吗？\n\n注意：从句用陈述语序。","semester":"upper"},{"id":"g2_english_u032","chapter":"第六章 Unit6: An old man tried to move the mountains","name":"宾语从句的时态呼应","formula":"主句过去时 → 从句相应过去时","explanation":"宾语从句的时态需要与主句呼应：\n\n1. 主句为现在时或将来时，从句可用任何时态\n   I think he is kind. (现在)\n   I will ask when he comes. (将来)\n\n2. 主句为过去时，从句要用相应的过去时态\n   - 一般过去时：I thought he was at home.\n   - 过去进行时：I thought he was sleeping.\n   - 过去将来时：I thought he would come.\n   - 过去完成时：I thought he had finished.\n\n3. 如果从句表示客观真理、普遍事实或习惯性动作，从句时态不变\n   Teacher said the earth is round. 老师说地球是圆的。","semester":"upper"},{"id":"g2_english_u033","chapter":"第七章 Unit7: What's the highest mountain in the world?","name":"形容词比较级的规则变化","formula":"1. 直接加 -er\n2. 以e结尾加 -r\n3. 辅音+y结尾变y为i加 -er\n4. 重读闭音节双写尾字母加 -er","explanation":"形容词比较级的规则变化：\n\n1. 一般情况：直接加 -er\n   tall → taller, short → shorter\n   smart → smarter, long → longer\n\n2. 以e结尾：加 -r\n   nice → nicer, large → larger\n   brave → braver, simple → simpler\n\n3. 以辅音字母+y结尾：变y为i加 -er\n   happy → happier, easy → easier\n   busy → busier, heavy → heavier\n\n4. 重读闭音节结尾且末尾只有一个辅音字母：双写尾字母加 -er\n   big → bigger, hot → hotter\n   thin → thinner, wet → wetter","semester":"upper"},{"id":"g2_english_u034","chapter":"第七章 Unit7: What's the highest mountain in the world?","name":"形容词比较级的不规则变化","formula":"good/well → better\nbad/badly → worse\nmany/much → more\nlittle → less\nfar → farther/further","explanation":"形容词比较级的不规则变化（必须记忆）：\n\n1. good/well（好）→ better（更好）\n2. bad/badly（坏/差）→ worse（更差）\n3. many/much（多）→ more（更多）\n4. little（少）→ less（更少）\n5. far（远）→ farther/further（更远）\n\n例句：\n- This book is better than that one. 这本书比那本好。\n- Her English is worse than mine. 她的英语比我的差。\n- I have more friends than her. 我的朋友比她多。\n- This is less expensive. 这个更便宜。\n- His house is farther from school. 他家离学校更远。","semester":"upper"},{"id":"g2_english_u035","chapter":"第七章 Unit7: What's the highest mountain in the world?","name":"形容词最高级的规则变化","formula":"1. 直接加 -est\n2. 以e结尾加 -st\n3. 辅音+y结尾变y为i加 -est\n4. 重读闭音节双写尾字母加 -est","explanation":"形容词最高级的规则变化：\n\n1. 一般情况：直接加 -est\n   tall → tallest, short → shortest\n\n2. 以e结尾：加 -st\n   nice → nicest, large → largest\n\n3. 以辅音字母+y结尾：变y为i加 -est\n   happy → happiest, easy → easiest\n\n4. 重读闭音节结尾：双写尾字母加 -est\n   big → biggest, hot → hottest\n\n注意：最高级前要加定冠词the，后面要接of/in短语。","semester":"upper"},{"id":"g2_english_u036","chapter":"第七章 Unit7: What's the highest mountain in the world?","name":"形容词最高级的不规则变化","formula":"good → best\nbad → worst\nmany/much → most\nlittle → least\nfar → farthest/furthest","explanation":"形容词最高级的不规则变化（必须记忆）：\n\n1. good → best（最好）\n2. bad → worst（最差）\n3. many/much → most（最多）\n4. little → least（最少）\n5. far → farthest/furthest（最远）\n\n例句：\n- This is the best movie I have ever seen. 这是我看过的最好的电影。\n- That was the worst day of my life. 那是我生命中最糟糕的一天。\n- He has the most books in our class. 他在我们班书最多。\n- This is the least interesting story. 这是最无聊的故事。","semester":"upper"},{"id":"g2_english_u037","chapter":"第七章 Unit7: What's the highest mountain in the world?","name":"比较级和最高级的用法","formula":"比较级：A + be + 形容词比较级 + than + B\n最高级：A + be + the + 形容词最高级 + in/of + 范围","explanation":"比较级和最高级的用法：\n\n比较级：表示两者之间的比较\n- 结构：A + be + 形容词比较级 + than + B\n- Tom is taller than Jack. 汤姆比杰克高。\n- This book is more interesting than that one. 这本书比那本有趣。\n\n最高级：表示三者或以上程度的比较\n- 结构：A + be + the + 形容词最高级 + in/of + 范围\n- Tom is the tallest in our class. 汤姆是我们班最高的。\n- This is the most beautiful flower in the garden. 这是花园里最美丽的花。\n\n注意：\n- 比较级后接than引导的句子\n- 最高级前加定冠词the，后接in/of短语","semester":"upper"},{"id":"g2_english_u038","chapter":"第七章 Unit7: What's the highest mountain in the world?","name":"as...as 同级比较","formula":"A + be + as + 形容词原级 + as + B","explanation":"as...as 表示\"和...一样\"，用于同级比较。\n\n结构：A + be + as + 形容词原级 + as + B\n\n肯定句：\n- Tom is as tall as Jack. 汤姆和杰克一样高。\n- This movie is as interesting as that one. 这部电影和那部一样有趣。\n\n否定句：not as...as = not so...as\n- Tom is not as tall as Jack. 汤姆不如杰克高。\n- This book is not as interesting as that one. 这本书不如那本有趣。\n\n中间可用修饰词：\n- Tom is twice as tall as Jack. 汤姆是杰克的两倍高。","semester":"upper"},{"id":"g2_english_u039","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"现在完成时的构成","formula":"主语 + have/has + 过去分词","explanation":"现在完成时表示过去发生或已完成的动作对现在造成的影响。\n\n构成：主语 + have/has + 过去分词\n\nbe动词的选择：\n- I / You / We / They → have\n- He / She / It → has\n\n过去分词的变化：\n1. 规则变化：与过去式相同，加 -ed\n2. 不规则变化：需要特殊记忆\n\n例句：\n- I have finished my homework. 我已经完成了作业。\n- She has gone to Beijing. 她已经去北京了。\n- They have read this book. 他们已经读过这本书了。","semester":"upper"},{"id":"g2_english_u040","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"现在完成时的用法","formula":"have/has + 过去分词","explanation":"现在完成时的用法：\n\n1. 表示过去发生或完成的动作对现在造成的影响\n   - I have already had breakfast. 我已经吃过早餐了。（所以现在不饿）\n   - She has cleaned the room. 她已经打扫房间了。（现在房间干净）\n\n2. 表示过去开始的动作一直持续到现在\n   - I have lived here for ten years. 我在这里住了十年。\n   - She has worked here since 2020. 她从2020年开始在这里工作。\n\n时间状语：already, yet, just, ever, never, for, since等。","semester":"upper"},{"id":"g2_english_u041","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"already, yet, just 的用法","formula":"already = 已经（肯定句）\nyet = 已经/还（疑问句/否定句）\njust = 刚刚（肯定句）","explanation":"already, yet, just都是现在完成时的常见时间状语：\n\nalready（已经）：\n- 用于肯定句中，通常放在动词前面或句末\n- I have already finished my work. 我已经完成工作了。\n- She has read this book already. 她已经读过这本书了。\n\nyet（已经/还）：\n- 用于疑问句和否定句中，放在句末\n- Have you finished yet? 你已经完成了吗？\n- I haven't met her yet. 我还没见过她。\n\njust（刚刚）：\n- 用于肯定句中，放在动词前面\n- I have just seen him. 我刚刚见过他。\n- She has just left. 她刚刚离开。","semester":"upper"},{"id":"g2_english_u042","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"have gone to 与 have been to 的区别","formula":"have gone to = 去了还没回来\nhave been to = 去过已经回来了","explanation":"have gone to 和 have been to 的区别：\n\nhave gone to：\n- 表示\"去了某地\"，说话时人不在这里\n- She has gone to Shanghai. 她去上海了。（现在不在这里）\n- Where is Tom? He has gone to the library. 汤姆在哪？他去图书馆了。\n\nhave been to：\n- 表示\"去过某地\"，人已经回来了\n- I have been to Beijing three times. 我去过北京三次。\n- She has been to Japan before. 她以前去过日本。\n\nhave been in：\n- 表示\"一直在某地\"\n- I have been in this city for ten years. 我在这个城市已经十年了。","semester":"upper"},{"id":"g2_english_u043","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"现在完成时与一般过去时的区别","formula":"现在完成时：过去→现在（影响）\n一般过去时：过去（事实）","explanation":"现在完成时与一般过去时的区别：\n\n现在完成时：\n- 强调过去动作与现在的联系\n- 不明确指出具体时间\n- I have read this book. 我读过这本书。（现在知道内容）\n- Have you seen the movie? 你看过这部电影吗？（现在是否知道内容）\n\n一般过去时：\n- 强调过去发生的动作\n- 常与具体时间连用：yesterday, last week, in 2020等\n- I read this book yesterday. 我昨天读了这本书。\n- Did you see the movie last night? 你昨晚看了电影吗？\n\n关键区别：现在完成时不强调具体时间，一般过去时强调。","semester":"upper"},{"id":"g2_english_u044","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"常见不规则动词过去分词","formula":"不规则动词需要特殊记忆","explanation":"常见不规则动词过去分词（必须记忆）：\n\n原形 → 过去式 → 过去分词\n\n1. 三形相同：\n- cut → cut → cut\n- put → put → put\n- let → let → let\n\n2. 过去式=过去分词：\n- buy → bought → bought\n- sleep → slept → slept\n- feel → felt → felt\n\n3. 三形都不同：\n- go → went → gone\n- come → came → come\n- eat → ate → eaten\n- see → saw → seen\n- take → took → taken\n- give → gave → given\n- know → knew → known\n- grow → grew → grown\n- fly → flew → flown","semester":"upper"},{"id":"g2_english_u045","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"现在完成时的否定句和疑问句","formula":"否定句：主语 + haven't/hasn't + 过去分词\n疑问句：Have/Has + 主语 + 过去分词？","explanation":"现在完成时的否定句和疑问句：\n\n否定句：\n主语 + have/has + not + 过去分词\n- I haven't finished my homework yet. 我还没完成作业。\n- She hasn't called me back. 她还没给我回电话。\n\n疑问句：\nHave/Has + 主语 + 过去分词？\n- Have you ever been to Beijing? 你去过北京吗？\n- Has she read this book? 她读过这本书吗？\n\n简略回答：\n- Yes, I have. / No, I haven't.\n- Yes, she has. / No, she hasn't.","semester":"upper"},{"id":"g2_english_l001","chapter":"第一章 Unit1: What's the matter?","name":"情态动词 have to 的用法","formula":"主语 + have/has to + 动词原形\n否定：主语 + don't/doesn't + have to + 动词原形\n疑问：Do/Does + 主语 + have to + 动词原形?","explanation":"have to 表示\"不得不\"，强调客观上的必要性，区别于 must 的主观必要性。have to 可以用于过去时态 (had to)，也可以与情态动词连用。其否定形式表示\"没有必要\"。例如：I have to get up early every day. (我每天不得不早起。)","semester":"lower"},{"id":"g2_english_l002","chapter":"第一章 Unit1: What's the matter?","name":"情态动词 must 的用法","formula":"肯定：主语 + must + 动词原形\n否定：主语 + mustn't + 动词原形\nmust not = mustn't，表示\"禁止/不允许\"","explanation":"must 表示\"必须\"，强调主观上的必要性。mustn't 意思是\"禁止/不许\"，表示强烈禁止。must 没有时态变化，过去式用 had to 代替。在回答 must 的一般疑问句时，否定回答用 don't have to / don't need to，表示\"不必要\"。例如：You must finish your homework. (你必须完成作业。)","semester":"lower"},{"id":"g2_english_l003","chapter":"第一章 Unit1: What's the matter?","name":"have to 与 must 的区别","formula":"must 强调主观意愿：I must study hard. (我必须努力学习。)\nhave to 强调客观需要：I have to work to earn money. (我不得不工作赚钱。)","explanation":"must 和 have to 都可以表示\"必须\"，但有重要区别：1) must 强调主观上的必要性，往往来自说话人本人的判断或规定；have to 强调客观上的必要性，往往由于外部条件、规则或情况而不得不做。2) must 通常不能与 will, would 等助动词连用，而 have to 可以。3) must 没有过去式形式，过去式中必须用 had to。4) 口语中 have to 比 must 更常用。","semester":"lower"},{"id":"g2_english_l004","chapter":"第一章 Unit1: What's the matter?","name":"询问身体状况的常用句型","formula":"What's the matter (with you)?\nWhat' wrong (with you)?\nWhat's the problem (with you)?\nHow are you feeling?","explanation":"这些都是用来询问他人身体状况或遇到什么问题的常用表达。What's the matter? 可以单独使用，也可以后接 with + 人或 with + 身体部位。回答时常用以下表达：I have a headache/stomachache/toothache/backache. (我头疼/胃疼/牙疼/背疼。) I feel sick/ fine/better. (我感到恶心/很好/好多了。)","semester":"lower"},{"id":"g2_english_l005","chapter":"第一章 Unit1: What's the matter?","name":"情态动词 can/could 表能力","formula":"肯定：主语 + can/could + 动词原形\n否定：主语 + can't/couldn't + 动词原形\n疑问：Can/Could + 主语 + 动词原形?","explanation":"can 和 could 都可以表示能力，意思是\"能/会\"。could 是 can 的过去式，用于过去的能力或更委婉的请求。can 还可表示可能性和允许。could 用在疑问句中比 can 更委婉客气。例如：Can you speak English? (你会说英语吗？) Yes, I can. / No, I can't.","semester":"lower"},{"id":"g2_english_l006","chapter":"第一章 Unit1: What's the matter?","name":"身体部位词汇及 pain 相关表达","formula":"身体部位 + hurt (s): My head hurts.\nhave a + 疾病名词：have a fever/cold/headache\nbe/get hurt：受伤","explanation":"表达身体不适的常见方式包括：1) 直接用 hurt + 身体部位，如 My stomach hurts. 2) 用 have a + 疾病名，如 have a sore throat (喉咙痛)。3) 用 be sick/ill 表示生病。4) 用 get hurt 表示受伤。常见身体部位词汇：head, stomach, back, neck, ear, eye, tooth, knee, arm, leg 等。","semester":"lower"},{"id":"g2_english_l007","chapter":"第一章 Unit1: What's the matter?","name":"情态动词 may 的用法","formula":"肯定：主语 + may + 动词原形\n否定：主语 + may not + 动词原形\n疑问：May + 主语 + 动词原形?","explanation":"may 主要有两个用法：1) 表示可能性，意思是\"可能/也许\"。例如：It may rain today. (今天可能下雨。) 2) 表示允许，意思是\"可以\"。回答 may 引导的疑问句时，肯定回答用 Yes, you may. 或 Sure.，否定回答用 No, you may not. 或 You'd better not.","semester":"lower"},{"id":"g2_english_l008","chapter":"第二章 Unit2: I'll help to clean up the city parks","name":"不定式作宾语","formula":"动词 + to + 动词原形\n常见动词：want, hope, decide, plan, agree, learn, pretend, refuse, seem, would like","explanation":"不定式可以在句中充当宾语成分。能接不定式作宾语的动词很多，常见的有：want to do (想要做), hope to do (希望做), decide to do (决定做), plan to do (计划做), agree to do (同意做), learn to do (学着做), would like to do (想要做), refuse to do (拒绝做)。例如：I want to learn English. (我想学英语。)","semester":"lower"},{"id":"g2_english_l009","chapter":"第二章 Unit2: I'll help to clean up the city parks","name":"不定式作宾语补足语","formula":"动词 + 宾语 + to + 动词原形\n常见动词：want, ask, tell, would like, invite, encourage, teach, expect","explanation":"不定式可以在句中充当宾语补足语，与宾语一起构成复合宾语。常见结构：want sb. to do (想要某人做), ask sb. to do (请某人做), tell sb. to do (告诉某人做), would like sb. to do (想让某人做), invite sb. to do (邀请某人做), encourage sb. to do (鼓励某人做)。例如：She asked me to help her. (她请我帮忙。)","semester":"lower"},{"id":"g2_english_l010","chapter":"第二章 Unit2: I'll help to clean up the city parks","name":"动词 help 的用法","formula":"help + (to) + 动词原形\nhelp sb. + (to) + 动词原形\nhelp sb. with + 名词","explanation":"help 是一个多功能的动词，用法灵活：1) help to do something = help do something，两者意思相同，to 可以省略。例如：Can you help (to) carry the box? 2) help sb. with something 表示\"在某方面帮助某人\"。例如：I help my mother with housework. 3) help 还可以作名词，如 with one's help.","semester":"lower"},{"id":"g2_english_l011","chapter":"第二章 Unit2: I'll help to clean up the city parks","name":"几个用 to do 作宾语的动词","formula":"start to do / begin to do / continue to do\nlike to do / love to do / hate to do\nprefer to do / choose to do","explanation":"start, begin, like, love, hate, prefer, choose 等动词后面可以接不定式 (to do) 作宾语。这些动词既可以接 to do 也可以接 doing，意思基本相同，但要注意：1) 表示长期习惯用 doing，如 I like swimming. 2) 表示具体一次动作时两者皆可。3) should like to do 是固定表达，用于正式场合。","semester":"lower"},{"id":"g2_english_l012","chapter":"第二章 Unit2: I'll help to clean up the city parks","name":"动词不定式的否定形式","formula":"not + to + 动词原形\ntell/ask/want sb. not to do sth.","explanation":"不定式的否定形式是在 to 前面加 not，即 not to do。常见结构：tell sb. not to do (告诉某人不要做), ask sb. not to do (请求某人不要做), want sb. not to do (想要某人不做), hope not to do (希望不做)。例如：She told me not to be late. (她告诉我不要迟到。)","semester":"lower"},{"id":"g2_english_l013","chapter":"第二章 Unit2: I'll help to clean up the city parks","name":"感官动词后不定式与动名词的区别","formula":"see/hear/watch + sb. + do (看到/听到全过程)\nsee/hear/watch + sb. + doing (看到/听到正在进行的动作)","explanation":"感官动词 see, hear, watch, feel, notice 等后面可以接不定式或动名词作宾语补足语。接不带 to 的不定式时，表示动作的全部过程或经常发生；接动名词时，表示动作正在进行或多次发生。例如：I saw him play football yesterday. (我昨天看到他踢足球了。) I saw him playing football when I passed by. (我路过时看到他正在踢足球。)","semester":"lower"},{"id":"g2_english_l014","chapter":"第三章 Unit3: Could you please tell me where the restrooms are?","name":"宾语从句 - 问路","formula":"Could you please tell me + 宾语从句?\nCould you tell me how to get to + 地点?\nCould you tell me where + 主语 + is/are?","explanation":"宾语从句在问路表达中非常常见。使用宾语从句时要注意：1) 从句用陈述语序（主语在前，谓语在后）。2) 如果疑问词本身是主语，则语序不变。例如：Where is the bank? → Could you tell me where the bank is? 3) 常用疑问词：where (哪里), how (怎么走), which way (哪个方向)。","semester":"lower"},{"id":"g2_english_l015","chapter":"第三章 Unit3: Could you please tell me where the restrooms are?","name":"Could you please...? 礼貌请求","formula":"Could you please + 动词原形?\nCould I please + 动词原形?\nCould you please not + 动词原形?","explanation":"Could you please...? 是比 Can you...? 更礼貌的请求表达方式。please 可以放在句中或句末，但放在句末时前面要加逗号。例如：Could you please open the door? = Could you open the door, please? 回答时常用：Sure. / Of course. / No problem. / I'm sorry, I can't. 否定形式 Could you please not...? 用于委婉请求不要做某事。","semester":"lower"},{"id":"g2_english_l016","chapter":"第三章 Unit3: Could you please tell me where the restrooms are?","name":"宾语从句的陈述语序","formula":"疑问词 + 主语 + 谓语 + 其他?\nWhere is the museum? → I don't know where the museum is.\nWhat did he say? → Can you tell me what he said?","explanation":"宾语从句必须使用陈述语序，即\"主语 + 谓语\"的结构，不能使用疑问句的倒装语序。例如：一般疑问句变为宾语从句时要加 whether/if，并使用陈述语序。特殊疑问句直接用疑问词引导，从句中疑问词如果是主语，语序本身就是陈述语序。转换时注意时态呼应的规则。","semester":"lower"},{"id":"g2_english_l017","chapter":"第三章 Unit3: Could you please tell me where the restrooms are?","name":"问路的常用表达","formula":"Excuse me, could you tell me how to get to...?\nExcuse me, where is the nearest...?\nExcuse me, which is the way to...?\nExcuse me, is there a... nearby?","explanation":"问路时的礼貌用语：1) 开头用 Excuse me (打扰一下) 来引起注意。2) 常用表达方式包括：问最近的地方用 nearest；问路线用 which way 或 how to get to；问是否存在用 is there...。3) 回答问路时常用：Go straight / Turn left / Turn right / It's on the left/right 等。4) 还可以用 It's about... minutes' walk from here.","semester":"lower"},{"id":"g2_english_l018","chapter":"第三章 Unit3: Could you please tell me where the restrooms are?","name":"不定式与疑问词连用","formula":"疑问词 + to + 动词原形\nhow to do it\nwhere to go\nwhat to do\nwhen to start\nwho to ask","explanation":"不定式可以和疑问词 (how, where, what, when, who, which) 连用，在句中作主语、宾语、表语等成分。例如：I don't know what to do. (我不知道该怎么办。) She showed me how to use the computer. (她教我怎么用电脑。) This tells us where to find the information. 这种结构比完整的宾语从句更简洁，是口语中非常实用的表达方式。","semester":"lower"},{"id":"g2_english_l019","chapter":"第四章 Unit4: Maybe you should learn to relax","name":"情态动词 should 的用法","formula":"肯定：主语 + should + 动词原形\n否定：主语 + shouldn't + 动词原形\n疑问：Should + 主语 + 动词原形?","explanation":"should 是情态动词，表示\"应该\"，用来提出建议、推荐或表达期望。should 没有时态变化，过去式仍是 should。should 的用法：1) 表示建议：You should study harder. 2) 表示期望：She should be here soon. 3) 表示推测：This should be the right answer. 4) should have done 表示过去应该做但没做。","semester":"lower"},{"id":"g2_english_l020","chapter":"第四章 Unit4: Maybe you should learn to relax","name":"should 建议句型总结","formula":"You should do sth.\nYou shouldn't do sth.\nWhy don't you do sth.?\nWhy not do sth.?\nWhat about doing sth.?\nHow about doing sth.?","explanation":"提建议的多种表达方式：1) should/shouldn't 表示应该/不应该做某事。2) Why don't you...? / Why not...? 表示\"为什么不...?\"是一种建议。3) What/How about + doing 表示\"...怎么样?\"，about 后面接动名词。4) Let's do sth. 表示让我们做某事吧。5) You had better (not) do sth. 表示你最好(不要)做某事。","semester":"lower"},{"id":"g2_english_l021","chapter":"第四章 Unit4: Maybe you should learn to relax","name":"maybe 与 may be 的区别","formula":"maybe (副词) + 句子：Maybe he is a teacher.\nmay be (情态动词 + 动词) + 表语：He may be a teacher.","explanation":"maybe 是一个副词，意思是\"也许/大概\"，相当于 perhaps，在句中作状语，通常放在句首。may be 是情态动词 may 加动词 be，意思是\"可能是\"，后面接名词、形容词等作表语。例如：Maybe she is ill. = She may be ill. (她也许病了。) 注意：maybe 是一个词，不能分开写；may be 是两个词，需要分开使用。","semester":"lower"},{"id":"g2_english_l022","chapter":"第四章 Unit4: Maybe you should learn to relax","name":"had better 的用法","formula":"肯定：主语 + had better + 动词原形\n否定：主语 + had better not + 动词原形\n缩写：had better = 'd better","explanation":"had better 表示\"最好...\"，是一种提出建议或警告的方式，含有忠告的意味。had better 用于所有人称，had 是过去式形式但表示现在或将来的建议。否定形式是 had better not，意思是\"最好不要\"。例如：You had better go home now. (你最好现在回家。) You had better not be late again. (你最好别再迟到了。)","semester":"lower"},{"id":"g2_english_l023","chapter":"第五章 Unit5: What were you doing when the UFO landed?","name":"过去进行时的定义与构成","formula":"构成：主语 + was/were + 动词-ing\n肯定：I was watching TV.\n否定：I was not (wasn't) watching TV.\n疑问：Was I watching TV?","explanation":"过去进行时表示在过去某一时刻或某一段时间正在进行的动作。其构成为 was/were + 动词的现在分词 (-ing 形式)。was 用于第一人称单数 (I/he/she/it) 和第三人称单数，were 用于第一人称复数 (we) 和第二人称 (you) 及第三人称复数 (they)。过去进行时常与 at that time, at this time yesterday, when, while 等时间状语连用。","semester":"lower"},{"id":"g2_english_l024","chapter":"第五章 Unit5: What were you doing when the UFO landed?","name":"when 引导的时间状语从句","formula":"主句(过去进行时) + when + 从句(一般过去时)\nI was walking when the phone rang.","explanation":"when 引导的时间状语从句可以放在主句前或主句后。当主句用过去进行时，从句用一般过去时时，表示\"当某事发生时，另一事正在发生\"。when 强调两个动作的对比或一个动作在另一个动作进行中发生。例如：I was reading when he came in. (他进来时我正在读书。) She was cooking when the lights went out. (灯灭时她正在做饭。)","semester":"lower"},{"id":"g2_english_l025","chapter":"第五章 Unit5: What were you doing when the UFO landed?","name":"while 引导的时间状语从句","formula":"主句 + while + 从句(过去进行时)\nWhile I was doing my homework, my mother was cooking.","explanation":"while 引导的时间状语从句通常表示两个动作同时进行，从句中谓语动词用过去进行时。while 强调两个动作的持续性和同时性。如果两个动作都是持续的，通常用 while 连接。while 还可以表示\"对比/然而\"，表示两种情况的对比。例如：I was reading while he was sleeping. (他在睡觉的时候我在读书。)","semester":"lower"},{"id":"g2_english_l026","chapter":"第五章 Unit5: What were you doing when the UFO landed?","name":"过去进行时与一般过去时的区别","formula":"过去进行时：强调动作正在进行（未完成）\n一般过去时：强调动作已经发生（已完成）\nI was reading a book. (我那时在读书。过程)\nI read a book. (我读了一本书。结果)","explanation":"过去进行时和一般过去时的主要区别：1) 过去进行时强调动作正在进行，未完成；一般过去时强调动作已完成。2) 过去进行时通常与 when, while 等连用，描述背景；一般过去时描述突然发生的事件。3) 在 when 引导的句型中：when + 短暂性动词（一般过去时）用于描述突发事件；while + 延续性动词（过去进行时）用于描述持续的动作。4) 过去进行时可以表示过去反复发生的动作。","semester":"lower"},{"id":"g2_english_l027","chapter":"第五章 Unit5: What were you doing when the UFO landed?","name":"过去进行时的应用场景","formula":"1. 描述故事发生的背景\n2. 与 when 短暂性动词连用\n3. 与 while 延续性动词连用\n4. 表示过去的某段时间内持续进行的动作","explanation":"过去进行时的主要应用场景：1) 用来设置故事情景或背景，如 It was raining heavily. People were running for shelter. 2) 与 when 连用时，when 后的短暂性动词常造成动作的突然性，如 I was walking when I saw an accident. 3) 与 while 连用时，描述同时进行的持续动作。4) 可以表示情绪、态度或行为的持续性，如 She was thinking about her future all night.","semester":"lower"},{"id":"g2_english_l028","chapter":"第六章 Unit6: By the time I got outside, the bus had already left","name":"过去完成时的定义与构成","formula":"构成：主语 + had + 过去分词\n肯定：I had finished my homework.\n否定：I had not (hadn't) finished my homework.\n疑问：Had I finished my homework?","explanation":"过去完成时是过去某个时间或动作之前已经发生或完成的动作。它表示\"过去的过去\"。其构成为 had + 过去分词，had 是过去式没有人称和数的变化。过去完成时主要用来：1) 表示在过去某动作之前已完成的动作。2) 表示在过去某时间之前已经发生并完成的事情。3) 与 by + 过去时间状语连用，如 by yesterday, by the end of last week。","semester":"lower"},{"id":"g2_english_l029","chapter":"第六章 Unit6: By the time I got outside, the bus had already left","name":"过去完成时与一般过去时的区别","formula":"过去完成时：过去的过去\n一般过去时：过去的某个具体时间\nBy the time he came, I had finished my work.\n(我来之前他已经完成了工作。)","explanation":"过去完成时与一般过去时的主要区别：1) 一般过去时表示在过去某个时间发生的动作或存在的状态。2) 过去完成时表示在过去某个时间或动作之前已经发生的动作，即\"过去的过去\"。3) 在使用过去完成时前，通常会有一个过去的时间点或动作作为参照。例如：When I got home, my father had already cooked dinner. (我到家时，我爸爸已经做好了晚饭。got 是参照点，had cooked 发生在此之前。)","semester":"lower"},{"id":"g2_english_l030","chapter":"第六章 Unit6: By the time I got outside, the bus had already left","name":"by the time 的用法","formula":"by the time + 过去时间 (过去完成时)\nby the time + 一般现在时/现在完成时 (将来完成时)\nBy the time I got up, my mother had made breakfast.","explanation":"by the time 意思是\"到...时候为止\"，是过去完成时的重要标志词。1) 当 by the time 引导的句子用一般过去时时，主句用过去完成时。例如：By the time he arrived, we had left. 2) 当谈论将来的情况时，by the time 后用一般现在时，主句用将来完成时。例如：By the time you come back, I will have finished my work. 3) by the time 还可以与 now, tomorrow, next week 等时间词连用。","semester":"lower"},{"id":"g2_english_l031","chapter":"第六章 Unit6: By the time I got outside, the bus had already left","name":"过去完成时的常见时间状语","formula":"by the time + 过去时间\nbefore + 过去时间\nalready / just / never / ever\nwhen / after / until + 过去时态","explanation":"过去完成时常见的搭配：1) by the time 引导的时间状语：By the time I was 10, I had learned 500 English words. 2) before/after 引导的从句：I had finished dinner before he came. 3) already, just, never, ever 等副词常与过去完成时连用，表示动作的状态。例如：She had already gone when I arrived. 4) when 引导的从句中，主句用过去完成时，从句用一般过去时。","semester":"lower"},{"id":"g2_english_l032","chapter":"第七章 Unit7: Have you ever been to a museum?","name":"现在完成时的定义与构成","formula":"构成：主语 + have/has + 过去分词\n肯定：I have finished my homework.\n否定：I have not (haven't) finished my homework.\n疑问：Have I finished my homework?","explanation":"现在完成时是英语中非常重要的时态，表示：1) 过去发生并且已经完成的动作，对现在造成影响。2) 过去开始的动作持续到现在，可能还要继续下去。其构成为 have/has + 过去分词。has 用于第三人称单数 (he/she/it)，have 用于其他所有人称。现在完成时常与 already, yet, just, ever, never, recently, lately 等副词连用。","semester":"lower"},{"id":"g2_english_l033","chapter":"第七章 Unit7: Have you ever been to a museum?","name":"现在完成时与一般过去时的区别","formula":"现在完成时：过去发生，强调与现在的联系\n一般过去时：过去发生，强调动作本身\nI have read this book. (我已经读过了，知道内容)\nI read this book last week. (只说明过去读过)","explanation":"主要区别：1) 一般过去时明确指出动作发生的时间（ yesterday, last week, in 2020 等），现在完成时不强调具体时间。2) 现在完成时强调过去动作对现在的影响或结果，一般过去时只描述过去的动作。3) 在对话中，如果已经给出了具体的时间状语，通常用一般过去时。4) 如果时间状语不明确，但上下文暗示影响，用现在完成时。","semester":"lower"},{"id":"g2_english_l034","chapter":"第七章 Unit7: Have you ever been to a museum?","name":"have been to 与 have gone to 的区别","formula":"have been to + 地点：去过某地（已回来）\nhave gone to + 地点：去了某地（未回来）\nI have been to Beijing. (我去过北京。)\nHe has gone to Shanghai. (他去上海了。)","explanation":"两者区别：1) have been to 表示\"去过某地\"，说话时这个人已经不在那个地方了，已经回来。2) have gone to 表示\"去了某地\"，说话时这个人正在去某地的途中或已经在那里，不在说话现场。3) have been to 可以与次数连用：have been to... three times。4) have been in + 地点表示在某地待了多长时间。例如：I have been in Shanghai for two years.","semester":"lower"},{"id":"g2_english_l035","chapter":"第七章 Unit7: Have you ever been to a museum?","name":"现在完成时中 ever 和 never 的用法","formula":"Have you ever + 过去分词...? (曾经...过吗？)\nI have never + 过去分词 (从未...过)\nThis is the first time I have + 过去分词.","explanation":"ever 和 never 是现在完成时中的重要时间副词：1) ever 意思是\"曾经\"，用于疑问句或否定句中，位于过去分词之前。例如：Have you ever been to Japan? 2) never 意思是\"从未\"，用于肯定句中，但表示否定意义。例如：I have never seen such a beautiful sunset. 3) 这类句型常用于谈论人生经历。4) This/It is the + 最高级 + 名词 + 定语从句中，谓语常用现在完成时。","semester":"lower"},{"id":"g2_english_l036","chapter":"第七章 Unit7: Have you ever been to a museum?","name":"现在完成时的肯定、否定和疑问形式","formula":"肯定：主语 + have/has + 过去分词\n否定：主语 + haven't/hasn't + 过去分词\n疑问：Have/Has + 主语 + 过去分词?\n否定疑问：Haven't/Hasn't + 主语 + 过去分词?","explanation":"现在完成时的句型变化：1) 变为一般疑问句时，将 have/has 提到句首，主语大小写不变。2) 变为否定句时，在 have/has 后加 not。3) 变为否定疑问句时，将 Haven't/Hasn't 提到句首。4) 回答时：Yes, 主语 + have/has. / No, 主语 + haven't/hasn't. 5) 常见时间词位置：have/has 之后，过去分词之前，也可以放在句末。","semester":"lower"},{"id":"g2_english_l037","chapter":"第七章 Unit7: Have you ever been to a museum?","name":"现在完成时的瞬间动词与延续性动词","formula":"瞬间动词：die, leave, start, buy, arrive, finish\n瞬间动词不能与 for/since 连用，需转换\nShe has died. → She has been dead for 3 years.","explanation":"瞬间动词（终止性动词）如 die, leave, join, buy, borrow, marry 等，不能直接与表示一段时间的状语 (for 3 years, since 1990) 连用。需要转换为相应的延续性动词或状态：1) die → be dead, 2) leave → be away, 3) join → be in/be a member of, 4) buy → have, 5) borrow → keep, 6) finish → be over, 7) arrive → be in。在完成时态中要注意这种转换。","semester":"lower"},{"id":"g2_english_l038","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"现在完成时中 yet, already, still 的用法","formula":"yet：还，已经（用于疑问句/否定句，通常放句末）\nalready：已经（用于肯定句，通常放动词与助动词之间）\nstill：仍然（表示动作持续，放于主语与动词之间）","explanation":"三个词在时态中的区别：1) yet 意思是\"还/已经\"，用于疑问句和否定句，通常放在句末。例如：Have you finished your work yet? 2) already 意思是\"已经\"，用于肯定句，通常放在 have/has 和过去分词之间，也可以放在句末表示惊讶。例如：I have already finished my work. 3) still 意思是\"仍然\"，表示动作持续进行，可以用于各种时态。例如：She is still sleeping.","semester":"lower"},{"id":"g2_english_l039","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"yet 与 already 的位置和用法区别","formula":"yet 用于疑问句和否定句\nHave you finished yet?\nI haven't finished yet.\n\nalready 用于肯定句\nI have already finished.\nI have finished already.","explanation":"yet 和 already 都与现在完成时连用，但用法不同：1) yet 多用于疑问句和否定句，already 多用于肯定句。2) yet 通常放在句末，already 可以放在句中（have/has 之后，过去分词之前）或句末。3) already 在疑问句中可以用作惊讶语气：Have you finished already? (你竟然已经完成了？) 4) 在否定句中，yet 表示\"还\"，暗示某事尚未发生：I haven't finished my homework yet.","semester":"lower"},{"id":"g2_english_l040","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"现在完成时的时间状语搭配","formula":"already, yet, just, recently, lately\njust now (刚不久，用于一般过去时)\nso far = up to now = till now\nthis week/month/year...","explanation":"现在完成时常用的时间状语：1) already 常用于肯定句，yet 用于否定和疑问句。2) just 放在 have/has 与过去分词之间，表示\"刚刚\"。3) recently 和 lately 表示\"最近\"，可以与现在完成时连用。4) so far = up to now = till now 表示\"到目前为止\"。5) this week/month/year 等时间词，如果说话时还没过完，可以用现在完成时。注意：last week/year 不能与现在完成时连用。","semester":"lower"},{"id":"g2_english_l041","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"现在完成时在日常交流中的应用","formula":"Have you ever...? → Yes, I have. / No, I haven't.\nHave you ... yet? → Yes, I have already. / No, not yet.\nHow long have you ...? → For... / Since...","explanation":"现在完成时在口语交流中的常见应用：1) 询问经历：Have you ever been to...? 2) 询问进展：Have you finished... yet? 3) 询问持续时间：How long have you lived here? 回答时用 for + 时间段或 since + 起点时间。4) 在谈论近期经历或变化时常用现在完成时。5) 注意区分：already 用于肯定句，yet 用于否定和疑问句末尾。例如：I've already had breakfast. / I haven't had breakfast yet.","semester":"lower"},{"id":"g2_english_l042","chapter":"第八章 Unit8: Have you read Treasure Island yet?","name":"现在完成时与一般过去时的综合辨析","formula":"现在完成时 = 过去动作 + 现在影响/结果\n一般过去时 = 过去时间点\nHave you read this book? (你读过这本书吗？)\nDid you read this book yesterday? (你昨天读了这本书吗？)","explanation":"综合辨析：1) 现在完成时不能和明确的过去时间状语连用，如 yesterday, last week, in 2020 等。2) 一般过去时不能和现在完成时的时间状语连用，如 already, yet, recently, so far 等。3) 在综合填空和改错题中，要注意时间状语与时态的匹配。4) 常见的信号词：yet, already, ever, never, just, recently, so far 等通常与现在完成时连用；ago, last, in 2020 等通常与一般过去时连用。5) since 和 for 与现在完成时连用，但 since 后可接时间点，for 后接时间段。","semester":"lower"}];

        // ==================== 内嵌例题数据 ====================
        const DATA_EXAMPLES = [{"id":"g2_english_l001_ex01","knowledge_id":"g2_english_l001","question":"单项选择：I _____ get up early every morning. A. has to  B. have to  C. had to  D. must to","answer":"答案：B. have to。解析：主语I后用have to。have to表示\"不得不\"，强调客观必要性。"},{"id":"g2_english_l001_ex02","knowledge_id":"g2_english_l001","question":"单项选择：She _____ go to the hospital because she is ill. A. has to  B. have to  C. had to  D. must to","answer":"答案：A. has to。解析：主语she是第三人称单数，用has to。整句：She has to go to the hospital because she is ill."},{"id":"g2_english_l001_ex03","knowledge_id":"g2_english_l001","question":"用所给词的适当形式填空：You ______ (don't have to) finish it today. You can do it tomorrow.","answer":"答案：don't have to。解析：don't have to意为\"不必\"。完整：You don't have to finish it today."},{"id":"g2_english_l001_ex04","knowledge_id":"g2_english_l001","question":"单项选择：Do you _____ wear a uniform at school? A. has to  B. have to  C. had to  D. must","answer":"答案：B. have to。解析：Do you...?提问，主语you，用have to。整句：Do you have to wear a uniform at school?"},{"id":"g2_english_l001_ex05","knowledge_id":"g2_english_l001","question":"翻译句子：我每天不得不早起去上学。","answer":"答案：I have to get up early every day to go to school. 解析：have to\"不得不\"。every day\"每天\"。"},{"id":"g2_english_l001_ex06","knowledge_id":"g2_english_l001","question":"单项选择：We _____ clean our classroom every day. A. has to  B. have to  C. had to  D. must","answer":"答案：B. have to。解析：主语we用have to。整句：We have to clean our classroom every day."},{"id":"g2_english_l001_ex07","knowledge_id":"g2_english_l001","question":"句型转换：He has to work late tonight. （改为否定句）","answer":"答案：He doesn't have to work late tonight. 解析：第三人称单数否定用doesn't have to。"},{"id":"g2_english_l001_ex08","knowledge_id":"g2_english_l001","question":"用所给词的适当形式填空：Yesterday he ______ (have to) stay at home because he was sick.","answer":"答案：had to。解析：yesterday是一般过去时。have to的过去式是had to。"},{"id":"g2_english_l001_ex09","knowledge_id":"g2_english_l001","question":"单项选择：— Do I have to be there on time? — _____. A. Yes, you do  B. No, you don't  C. A and B  D. Yes, you must","answer":"答案：C. A and B。解析：Do I have to...?的回答取决于具体情况，可以是肯定或否定。"},{"id":"g2_english_l001_ex10","knowledge_id":"g2_english_l001","question":"翻译句子：你不必担心，一切都会好的。","answer":"答案：You don't have to worry. Everything will be fine. 解析：don't have to\"不必\"。"},{"id":"g2_english_l002_ex01","knowledge_id":"g2_english_l002","question":"单项选择：You _____ wear a helmet when riding a bike. A. must  B. mustn't  C. have to  D. A and B","answer":"答案：D. A and B。解析：must和mustn't都表示\"必须/禁止\"，强调规定。整句：You must wear a helmet..."},{"id":"g2_english_l002_ex02","knowledge_id":"g2_english_l002","question":"单项选择：You _____ play with fire. It's dangerous. A. must  B. mustn't  C. have to  D. A and B","answer":"答案：B. mustn't。解析：mustn't表示\"禁止\"，绝对不允许。整句：You mustn't play with fire."},{"id":"g2_english_l002_ex03","knowledge_id":"g2_english_l002","question":"用所给词的适当形式填空：You ______ (must) be 18 years old to drive a car.","answer":"答案：must。解析：must表示\"必须\"，强调规定或法律要求。完整：You must be 18 years old to drive a car."},{"id":"g2_english_l002_ex04","knowledge_id":"g2_english_l002","question":"单项选择：_____ I hand in my homework now? A. Must  B. Have to  C. Should  D. Could","answer":"答案：A. Must。解析：Must I...?表示\"我必须...吗？\"。must更强调主观必要性或规定。"},{"id":"g2_english_l002_ex05","knowledge_id":"g2_english_l002","question":"翻译句子：禁止吸烟。","answer":"答案：You mustn't smoke here. 解析：mustn't\"禁止\"。smoke\"吸烟\"。here\"这里\"。"},{"id":"g2_english_l002_ex06","knowledge_id":"g2_english_l002","question":"单项选择：We _____ follow the school rules. A. must  B. mustn't  C. have to  D. A and C","answer":"答案：D. A and D。解析：must和have to都可表示\"必须\"。must强调主观，have to强调客观。"},{"id":"g2_english_l002_ex07","knowledge_id":"g2_english_l002","question":"用所给词的适当形式填空：You ______ (mustn't) tell anyone about this. It's a secret.","answer":"答案：mustn't。解析：mustn't\"禁止/不许\"，表示绝对不允许。完整：You mustn't tell anyone about this."},{"id":"g2_english_l002_ex08","knowledge_id":"g2_english_l002","question":"单项选择：— Must I finish the work today? — _____. You can do it tomorrow. A. Yes, you must  B. No, you needn't  C. No, you mustn't  D. Yes, you do","answer":"答案：B. No, you needn't。解析：must的一般疑问句，否定回答用needn't/don't have to，表示\"不必\"。"},{"id":"g2_english_l002_ex09","knowledge_id":"g2_english_l002","question":"翻译句子：我必须按时完成作业。","answer":"答案：I must finish my homework on time. 解析：must\"必须\"。on time\"按时\"。"},{"id":"g2_english_l002_ex10","knowledge_id":"g2_english_l002","question":"单项选择：Students _____ be quiet in the library. A. must  B. mustn't  C. have to  D. A and B","answer":"答案：A. must。解析：must表示\"必须\"，图书馆规定要安静。"},{"id":"g2_english_l003_ex01","knowledge_id":"g2_english_l003","question":"单项选择：You have to study hard, _____ you want to pass the exam. A. if  B. unless  C. because  D. so","answer":"答案：A. if。解析：if引导条件状语从句，\"如果\"。must强调主观必要性，have to强调客观必要性。"},{"id":"g2_english_l003_ex02","knowledge_id":"g2_english_l003","question":"单项选择：I _____ go to school even on weekends when I was in that school. A. must  B. have to  C. had to  D. A and B","answer":"答案：C. had to。解析：when I was in that school是过去时间，用had to。"},{"id":"g2_english_l003_ex03","knowledge_id":"g2_english_l003","question":"用所给词的适当形式填空：You ______ (mustn't) park here. It's not allowed.","answer":"答案：mustn't。解析：mustn't表示禁止，\"不许\"。park\"停车\"。allowed\"允许\"。"},{"id":"g2_english_l003_ex04","knowledge_id":"g2_english_l003","question":"单项选择：You look tired. You _____ have a good rest. A. must  B. mustn't  C. have to  D. should","answer":"答案：A. must。解析：must表示建议，\"应该/必须\"。整句：You must have a good rest."},{"id":"g2_english_l003_ex05","knowledge_id":"g2_english_l003","question":"翻译句子：must和have to都表示\"必须\"，有什么区别？","answer":"答案：must强调主观上的必要性，往往来自说话人本人的判断；have to强调客观上的必要性，往往由于外部条件、规则或情况而不得不做。"},{"id":"g2_english_l003_ex06","knowledge_id":"g2_english_l003","question":"单项选择：I have to work on weekends, _____ my job requires it. A. because  B. if  C. unless  D. but","answer":"答案：A. because。解析：because引导原因状语从句，\"因为\"。整句：I have to work on weekends because my job requires it."},{"id":"g2_english_l003_ex07","knowledge_id":"g2_english_l003","question":"用所给词的适当形式填空：She ______ (had to) take care of her little sister last night.","answer":"答案：had to。解析：last night是过去时间。have to的过去式是had to。"},{"id":"g2_english_l003_ex08","knowledge_id":"g2_english_l003","question":"单项选择：You don't really _____ come if you're busy. A. must  B. have to  C. mustn't  D. A and B","answer":"答案：B. have to。解析：don't have to表示\"不必\"，暗示如果你忙可以不来。"},{"id":"g2_english_l003_ex09","knowledge_id":"g2_english_l003","question":"翻译句子：他不得不工作到很晚才能完成任务。","answer":"答案：He has to work late to finish the task. 解析：has to\"不得不\"。to finish表示目的。"},{"id":"g2_english_l003_ex10","knowledge_id":"g2_english_l003","question":"单项选择：I have to wake up early, _____ I have an important meeting. A. because  B. if  C. unless  D. but","answer":"答案：A. because。解析：because\"因为\"，解释不得不早起的原因。"},{"id":"g2_english_l004_ex01","knowledge_id":"g2_english_l004","question":"单项选择：_____ the matter with you? A. What's  B. What  C. What's wrong  D. All of the above","answer":"答案：D. All of the above。解析：What's the matter with you? / What's wrong with you? / What happened? 都是询问身体状况的表达。"},{"id":"g2_english_l004_ex02","knowledge_id":"g2_english_l004","question":"单项选择：I have a _____. My head hurts. A. stomachache  B. headache  C. toothache  D. backache","answer":"答案：B. headache。解析：My head hurts提示头痛。headache\"头痛\"。"},{"id":"g2_english_l004_ex03","knowledge_id":"g2_english_l004","question":"用所给词的适当形式填空：She has a ______ (stomach). She ate too much.","answer":"答案：stomachache。解析：stomachache\"胃痛\"。ate too much\"吃太多了\"。"},{"id":"g2_english_l004_ex04","knowledge_id":"g2_english_l004","question":"单项选择：— How are you feeling? — _____. A. I'm fine  B. I feel sick  C. I have a fever  D. All of the above","answer":"答案：D. All of the above。解析：三种回答都可以描述身体状况。"},{"id":"g2_english_l004_ex05","knowledge_id":"g2_english_l004","question":"翻译句子：我感觉不太舒服，我可能发烧了。","answer":"答案：I'm not feeling well. I may have a fever. 解析：not feeling well\"不舒服\"。may have a fever\"可能发烧\"。"},{"id":"g2_english_l004_ex06","knowledge_id":"g2_english_l004","question":"单项选择：What's the matter _____ your sister? A. with  B. to  C. for  D. of","answer":"答案：A. with。解析：What's the matter with...?固定搭配。"},{"id":"g2_english_l004_ex07","knowledge_id":"g2_english_l004","question":"用所给词的适当形式填空：I have a ______ (sore throat). It's hard to speak.","answer":"答案：sore throat。解析：sore throat\"喉咙痛\"。hard to speak\"说话困难\"。"},{"id":"g2_english_l004_ex08","knowledge_id":"g2_english_l004","question":"单项选择：— What's wrong with you? — I _____ my leg. A. hurt  B. hurts  C. hurts  D. am hurting","answer":"答案：A. hurt。解析：hurt表示\"受伤\"，可作不及物动词，原形hurt。"},{"id":"g2_english_l004_ex09","knowledge_id":"g2_english_l004","question":"翻译句子：他牙疼得厉害，应该去看牙医。","answer":"答案：He has a terrible toothache. He should see a dentist. 解析：toothache\"牙痛\"。terrible\"厉害的\"。dentist\"牙医\"。"},{"id":"g2_english_l004_ex10","knowledge_id":"g2_english_l004","question":"单项选择：I feel _____. I think I'm going to be sick. A. well  B. good  C. sick  D. better","answer":"答案：C. sick。解析：sick\"恶心的\"，going to be sick\"要吐了\"。"},{"id":"g2_english_l005_ex01","knowledge_id":"g2_english_l005","question":"单项选择：I _____ swim when I was five years old. A. can  B. could  C. may  D. must","answer":"答案：B. could。解析：could是can的过去式，表示过去的能力。when I was five是过去时间。"},{"id":"g2_english_l005_ex02","knowledge_id":"g2_english_l005","question":"单项选择：_____ you please help me with my homework? A. Can  B. Could  C. May  D. B and C","answer":"答案：D. B and C。解析：Could/May you please...?是礼貌请求，Could比Can更委婉。"},{"id":"g2_english_l005_ex03","knowledge_id":"g2_english_l005","question":"用所给词的适当形式填空：She ______ (could) speak three languages when she was young.","answer":"答案：could。解析：could表示过去的能力。when she was young是过去时间。"},{"id":"g2_english_l005_ex04","knowledge_id":"g2_english_l005","question":"单项选择：— Could I borrow your book? — _____. A. Sure  B. Sorry, you can't  C. Of course  D. All of the above","answer":"答案：D. All of the above。解析：Could I...?的回答可以是肯定或否定。"},{"id":"g2_english_l005_ex05","knowledge_id":"g2_english_l005","question":"翻译句子：你会说英语吗？","answer":"答案：Can you speak English? 解析：can表示能力，\"会/能\"。speak English\"说英语\"。"},{"id":"g2_english_l005_ex06","knowledge_id":"g2_english_l005","question":"单项选择：When I was a child, I _____ ride a bike. A. can  B. could  C. may  D. must","answer":"答案：B. could。解析：could是can的过去式，表示过去的能力。"},{"id":"g2_english_l005_ex07","knowledge_id":"g2_english_l005","question":"用所给词的适当形式填空：______ (Can/Could) you tell me the way to the station?","answer":"答案：Could。解析：Could you tell me...?是礼貌请求，比Can更客气。"},{"id":"g2_english_l005_ex08","knowledge_id":"g2_english_l005","question":"单项选择：I couldn't find my keys yesterday _____ I looked everywhere. A. can  B. could  C. must  D. couldn't","answer":"答案：D. couldn't。解析：couldn't是could not的缩写，表示过去做不到。"},{"id":"g2_english_l005_ex09","knowledge_id":"g2_english_l005","question":"翻译句子：我以前能游泳，但现在不能了。","answer":"答案：I could swim before, but I can't now. 解析：could swim表示过去的能力，can't now表示现在做不到。"},{"id":"g2_english_l005_ex10","knowledge_id":"g2_english_l005","question":"单项选择：No one _____ answer this difficult question. A. can  B. could  C. must  D. should","answer":"答案：B. could。解析：could表示能力，\"能够\"，暗示没有人能回答。"},{"id":"g2_english_l006_ex01","knowledge_id":"g2_english_l006","question":"单项选择：My head _____. I think I need to rest. A. hurts  B. hurt  C. is hurting  D. hurting","answer":"答案：A. hurts。解析：head是第三人称单数，hurt用hurts。整句：My head hurts."},{"id":"g2_english_l006_ex02","knowledge_id":"g2_english_l006","question":"单项选择：She has a _____ and can't eat anything. A. stomachache  B. headache  C. toothache  D. fever","answer":"答案：A. stomachache。解析：can't eat anything\"吃不下任何东西\"提示胃疼。"},{"id":"g2_english_l006_ex03","knowledge_id":"g2_english_l006","question":"用所给词的适当形式填空：He ______ (have) a terrible backache. He needs to see a doctor.","answer":"答案：has。解析：He是第三人称单数，have用has。backache\"背痛\"。"},{"id":"g2_english_l006_ex04","knowledge_id":"g2_english_l006","question":"单项选择：The little girl is _____ She fell down and got hurt. A. crying  B. crying  C. cry  D. to cry","answer":"答案：A. crying。解析：is crying\"正在哭\"，进行时态表示正在进行的动作。"},{"id":"g2_english_l006_ex05","knowledge_id":"g2_english_l006","question":"翻译句子：我哥哥腿受伤了，现在不能走路。","answer":"答案：My brother hurt his leg. He can't walk now. 解析：hurt\"受伤\"（过去式/原形同形）。"},{"id":"g2_english_l006_ex06","knowledge_id":"g2_english_l006","question":"单项选择：His feet _____ after walking for a long time. A. hurt  B. hurts  C. is hurting  D. to hurt","answer":"答案：A. hurt。解析：feet是复数，hurt用原形。整句：His feet hurt after walking for a long time."},{"id":"g2_english_l006_ex07","knowledge_id":"g2_english_l006","question":"用所给词的适当形式填空：She has a ______ (sore throat). It's painful to swallow.","answer":"答案：sore throat。解析：sore throat\"喉咙痛\"。painful\"痛苦的\"。swallow\"吞咽\"。"},{"id":"g2_english_l006_ex08","knowledge_id":"g2_english_l006","question":"单项选择：I don't feel well. I think I'm getting a _____. A. cold  B. fever  C. headache  D. All of the above","answer":"答案：D. All of the above。解析：三种不适都可能导致感觉不好。"},{"id":"g2_english_l006_ex09","knowledge_id":"g2_english_l006","question":"翻译句子：他的眼睛很累，他应该休息一下。","answer":"答案：His eyes are tired. He should have a rest. 解析：eyes are tired\"眼睛累了\"。have a rest\"休息一下\"。"},{"id":"g2_english_l006_ex10","knowledge_id":"g2_english_l006","question":"单项选择：She has a high _____ and needs to see a doctor. A. temperature  B. fever  C. cold  D. A and B","answer":"答案：D. A and B。解析：temperature和fever都表示\"发烧/体温\"。"},{"id":"g2_english_l007_ex01","knowledge_id":"g2_english_l007","question":"单项选择：It _____ rain tomorrow. Take an umbrella. A. may  B. must  C. should  D. can","answer":"答案：A. may。解析：may表示可能性，\"可能\"。整句：It may rain tomorrow."},{"id":"g2_english_l007_ex02","knowledge_id":"g2_english_l007","question":"单项选择：_____ I use your phone? A. May  B. Must  C. Should  D. Need","answer":"答案：A. May。解析：May I...?表示请求许可，比Can I...?更正式。"},{"id":"g2_english_l007_ex03","knowledge_id":"g2_english_l007","question":"用所给词的适当形式填空：She ______ (may) be at home now. I'm not sure.","answer":"答案：may。解析：may be\"可能是\"。I'm not sure\"我不确定\"暗示不确定。"},{"id":"g2_english_l007_ex04","knowledge_id":"g2_english_l007","question":"单项选择：— May I go out to play? — _____, but finish your homework first. A. Yes, you may  B. No, you may not  C. Sure  D. All of the above","answer":"答案：D. All of the above。解析：May I...?的肯定回答用Yes, you may / Sure / Of course；否定用No, you may not."},{"id":"g2_english_l007_ex05","knowledge_id":"g2_english_l007","question":"翻译句子：明天可能会下雪，我们最好待在家里。","answer":"答案：It may snow tomorrow. We'd better stay at home. 解析：may snow\"可能下雪\"。We'd better\"我们最好\"。"},{"id":"g2_english_l007_ex06","knowledge_id":"g2_english_l007","question":"单项选择：He may not _____ the truth. He's always lying. A. tell  B. tells  C. telling  D. told","answer":"答案：A. tell。解析：may not tell\"可能不说\"。He's always lying\"他总是撒谎\"。"},{"id":"g2_english_l007_ex07","knowledge_id":"g2_english_l007","question":"用所给词的适当形式填空：______ (May/Might) I ask you a question?","answer":"答案：May/Might。解析：May/Might I...?是礼貌请求。Might比May更委婉。"},{"id":"g2_english_l007_ex08","knowledge_id":"g2_english_l007","question":"单项选择：It _____ be dangerous to swim here. A. may  B. must  C. can  D. should","answer":"答案：A. may。解析：may be\"可能是\"，表示可能性但不肯定。"},{"id":"g2_english_l007_ex09","knowledge_id":"g2_english_l007","question":"翻译句子：你可能知道答案，请告诉我。","answer":"答案：You may know the answer. Please tell me. 解析：may know\"可能知道\"。"},{"id":"g2_english_l007_ex10","knowledge_id":"g2_english_l007","question":"单项选择：I think it _____ rain later. The sky is getting dark. A. may  B. must  C. can  D. need","answer":"答案：A. may。解析：may rain\"可能下雨\"。The sky is getting dark\"天变黑了\"。"},{"id":"g2_english_l008_ex01","knowledge_id":"g2_english_l008","question":"单项选择：I want _____ a doctor when I grow up. A. be  B. to be  C. being  D. been","answer":"答案：B. to be。解析：want to do是固定搭配。want to be a doctor\"想成为一名医生\"。"},{"id":"g2_english_l008_ex02","knowledge_id":"g2_english_l008","question":"单项选择：She decided _____ abroad for further study. A. go  B. to go  C. going  D. goes","answer":"答案：B. to go。解析：decide to do\"决定做\"。abroad\"在国外\"。"},{"id":"g2_english_l008_ex03","knowledge_id":"g2_english_l008","question":"用所给词的适当形式填空：They plan ______ (travel) to Japan next year.","answer":"答案：to travel。解析：plan to do\"计划做\"。Japan\"日本\"。"},{"id":"g2_english_l008_ex04","knowledge_id":"g2_english_l008","question":"单项选择：I hope _____ the truth. A. know  B. to know  C. knowing  D. knows","answer":"答案：B. to know。解析：hope to do\"希望做\"。the truth\"真相\"。"},{"id":"g2_english_l008_ex05","knowledge_id":"g2_english_l008","question":"翻译句子：我想学游泳。","answer":"答案：I want to learn to swim. 解析：want to do\"想做\"。learn to swim\"学游泳\"。"},{"id":"g2_english_l008_ex06","knowledge_id":"g2_english_l008","question":"单项选择：He agreed _____ me with my English. A. help  B. to help  C. helping  D. helps","answer":"答案：B. to help。解析：agree to do\"同意做\"。help sb. with\"帮助某人做某事\"。"},{"id":"g2_english_l008_ex07","knowledge_id":"g2_english_l008","question":"用所给词的适当形式填空：She wants ______ (find) a good job after graduation.","answer":"答案：to find。解析：want to do\"想要做\"。graduation\"毕业\"。"},{"id":"g2_english_l008_ex08","knowledge_id":"g2_english_l008","question":"单项选择：I need _____ harder to pass the exam. A. study  B. to study  C. studying  D. studied","answer":"答案：B. to study。解析：need to do\"需要做\"。pass the exam\"通过考试\"。"},{"id":"g2_english_l008_ex09","knowledge_id":"g2_english_l008","question":"翻译句子：他决定戒烟。","answer":"答案：He decided to quit smoking. 解析：decide to do\"决定做\"。quit smoking\"戒烟\"。"},{"id":"g2_english_l008_ex10","knowledge_id":"g2_english_l008","question":"单项选择：She seems _____ tired. Let's take a break. A. to be  B. be  C. being  D. is","answer":"答案：A. to be。解析：seem to be\"看起来是\"。tired\"累的\"。"},{"id":"g2_english_l009_ex01","knowledge_id":"g2_english_l009","question":"单项选择：My mother asked me _____ the room. A. clean  B. to clean  C. cleaning  D. cleaned","answer":"答案：B. to clean。解析：ask sb. to do\"请某人做\"。整句：My mother asked me to clean the room."},{"id":"g2_english_l009_ex02","knowledge_id":"g2_english_l009","question":"单项选择：She wants me _____ her with the housework. A. help  B. to help  C. helping  D. helps","answer":"答案：B. to help。解析：want sb. to do\"想要某人做\"。housework\"家务\"。"},{"id":"g2_english_l009_ex03","knowledge_id":"g2_english_l009","question":"用所给词的适当形式填空：The teacher told us ______ (read) the text loudly.","answer":"答案：to read。解析：tell sb. to do\"告诉某人做\"。loudly\"大声地\"。"},{"id":"g2_english_l009_ex04","knowledge_id":"g2_english_l009","question":"单项选择：I would like you _____ me a favor. A. help  B. to help  C. helping  D. helps","answer":"答案：B. to help。解析：would like sb. to do\"想让某人做\"。a favor\"帮忙\"。"},{"id":"g2_english_l009_ex05","knowledge_id":"g2_english_l009","question":"翻译句子：他鼓励我不要放弃。","answer":"答案：He encouraged me not to give up. 解析：encourage sb. not to do\"鼓励某人不做\"。give up\"放弃\"。"},{"id":"g2_english_l009_ex06","knowledge_id":"g2_english_l009","question":"单项选择：Please ask him _____ here earlier next time. A. come  B. to come  C. coming  D. comes","answer":"答案：B. to come。解析：ask sb. to do\"请某人做\"。earlier\"更早\"。next time\"下次\"。"},{"id":"g2_english_l009_ex07","knowledge_id":"g2_english_l009","question":"用所给词的适当形式填空：She invited me ______ (attend) her birthday party.","answer":"答案：to attend。解析：invite sb. to do\"邀请某人做\"。birthday party\"生日派对\"。"},{"id":"g2_english_l009_ex08","knowledge_id":"g2_english_l009","question":"单项选择：My father taught me _____ the bike when I was young. A. ride  B. to ride  C. riding  D. rides","answer":"答案：B. to ride。解析：teach sb. to do\"教某人做\"。bike\"自行车\"。"},{"id":"g2_english_l009_ex09","knowledge_id":"g2_english_l009","question":"翻译句子：我希望你能帮我学英语。","answer":"答案：I hope you can help me to learn English. 或 I hope you can help me learn English. 解析：help sb. (to) do\"帮助某人做\"，to可以省略。"},{"id":"g2_english_l009_ex10","knowledge_id":"g2_english_l009","question":"单项选择：The doctor advised him _____ more water. A. drink  B. to drink  C. drinking  D. drinks","answer":"答案：B. to drink。解析：advise sb. to do\"建议某人做\"。more water\"多喝水\"。"},{"id":"g2_english_l010_ex01","knowledge_id":"g2_english_l010","question":"单项选择：Can you help me _____ the dishes? A. do  B. to do  C. doing  D. A and B","answer":"答案：D. A and B。解析：help sb. do/to do都可以，to可以省略。the dishes\"盘子\"。"},{"id":"g2_english_l010_ex02","knowledge_id":"g2_english_l010","question":"单项选择：She helped me _____ my English last year. A. with  B. to  C. for  D. of","answer":"答案：A. with。解析：help sb. with\"在某方面帮助某人\"。整句：She helped me with my English."},{"id":"g2_english_l010_ex03","knowledge_id":"g2_english_l010","question":"用所给词的适当形式填空：I need you ______ (help) me carry this heavy box.","answer":"答案：to help。解析：need sb. to do\"需要某人做\"。carry\"搬\"。"},{"id":"g2_english_l010_ex04","knowledge_id":"g2_english_l010","question":"单项选择：Let me help you _____ the problem. A. solve  B. to solve  C. solving  D. A and B","answer":"答案：D. A and B。解析：help (to) do都可以。solve the problem\"解决问题\"。"},{"id":"g2_english_l010_ex05","knowledge_id":"g2_english_l010","question":"翻译句子：谢谢你帮我学数学。","answer":"答案：Thank you for helping me with math. 解析：Thank you for doing\"谢谢你做...\"。help with\"帮助做\"。"},{"id":"g2_english_l010_ex06","knowledge_id":"g2_english_l010","question":"单项选择：I can't help _____ the house. I'm too busy. A. cleaning  B. to clean  C. clean  D. A and B","answer":"答案：D. A and B。解析：help (to) do都可以。too busy\"太忙\"。"},{"id":"g2_english_l010_ex07","knowledge_id":"g2_english_l010","question":"用所给词的适当形式填空：She helped her mother ______ (cook) dinner yesterday.","answer":"答案：cook/to cook。解析：help (to) do都可以。cook dinner\"做饭\"。"},{"id":"g2_english_l010_ex08","knowledge_id":"g2_english_l010","question":"单项选择：This book helped me _____ the truth. A. understood  B. to understand  C. understanding  D. understand","answer":"答案：B. to understand。解析：help to understand\"帮助理解\"。the truth\"真相\"。"},{"id":"g2_english_l010_ex09","knowledge_id":"g2_english_l010","question":"翻译句子：谁帮你搬这个箱子？","answer":"答案：Who helped you carry this box? 解析：help sb. do\"帮助某人做\"。carry\"搬/扛\"。"},{"id":"g2_english_l010_ex10","knowledge_id":"g2_english_l010","question":"单项选择：With your help, I can finish it _____. A. easy  B. easier  C. easily  D. more easy","answer":"答案：C. easily。解析：with one's help\"在某人的帮助下\"，修饰动词用副词。finish easily\"轻松完成\"。"},{"id":"g2_english_l011_ex01","knowledge_id":"g2_english_l011","question":"单项选择：I like _____ in the morning. A. swim  B. to swim  C. swimming  D. B and C","answer":"答案：D. B and C。解析：like to do/like doing都可以，表示习惯性喜好。"},{"id":"g2_english_l011_ex02","knowledge_id":"g2_english_l011","question":"单项选择：She started _____ English five years ago. A. learn  B. to learn  C. learning  D. B and C","answer":"答案：D. B and C。解析：start to do/start doing都可以。five years ago\"五年前\"。"},{"id":"g2_english_l011_ex03","knowledge_id":"g2_english_l011","question":"用所给词的适当形式填空：He prefers ______ (read) books to watching TV.","answer":"答案：reading。解析：prefer doing A to doing B\"比起B更喜欢A\"。read books\"读书\"。"},{"id":"g2_english_l011_ex04","knowledge_id":"g2_english_l011","question":"单项选择：I continue _____ harder. A. work  B. to work  C. working  D. B and C","answer":"答案：D. B and C。解析：continue to do/continue doing都可以，意思相同。"},{"id":"g2_english_l011_ex05","knowledge_id":"g2_english_l011","question":"翻译句子：他选择学医而不是学工程。","answer":"答案：He chose to study medicine rather than study engineering. 解析：choose to do\"选择做\"。rather than\"而不是\"。"},{"id":"g2_english_l011_ex06","knowledge_id":"g2_english_l011","question":"单项选择：She hates _____ early in the morning. A. get up  B. to get up  C. getting up  D. B and C","answer":"答案：D. B and C。解析：hate to do/hate doing都可以，表示\"讨厌做\"。"},{"id":"g2_english_l011_ex07","knowledge_id":"g2_english_l011","question":"用所给词的适当形式填空：I would like ______ (travel) around the world someday.","answer":"答案：to travel。解析：would like to do\"想要做\"。around the world\"环游世界\"。"},{"id":"g2_english_l011_ex08","knowledge_id":"g2_english_l011","question":"单项选择：It began _____ heavily when we arrived. A. rain  B. to rain  C. raining  D. B and C","answer":"答案：D. B and C。解析：begin to do/begin doing都可以。heavily\"猛烈地\"。"},{"id":"g2_english_l011_ex09","knowledge_id":"g2_english_l011","question":"翻译句子：我宁愿现在就走，也不愿等待。","answer":"答案：I prefer to leave now rather than wait. 解析：prefer to do rather than do\"宁愿做...也不愿做...\"。"},{"id":"g2_english_l011_ex10","knowledge_id":"g2_english_l011","question":"单项选择：I remember _____ my keys somewhere. Where did I put them? A. to put  B. putting  C. put  D. puts","answer":"答案：B. putting。解析：remember doing\"记得做过\"。remember to do\"记得要做\"。根据语境是已经做过的事。"},{"id":"g2_english_l012_ex01","knowledge_id":"g2_english_l012","question":"单项选择：He told me not _____ late again. A. be  B. to be  C. being  D. been","answer":"答案：B. to be。解析：tell sb. not to do\"告诉某人不做\"。late\"迟到\"。"},{"id":"g2_english_l012_ex02","knowledge_id":"g2_english_l012","question":"单项选择：Please ask her not _____ here. A. smoke  B. to smoke  C. smoking  D. A and B","answer":"答案：B. to smoke。解析：ask sb. not to do\"请某人不做\"。smoke\"吸烟\"。"},{"id":"g2_english_l012_ex03","knowledge_id":"g2_english_l012","question":"用所给词的适当形式填空：She wanted me ______ (not, tell) anyone the secret.","answer":"答案：not to tell。解析：want sb. not to do\"想要某人不做\"。anyone\"任何人\"。the secret\"秘密\"。"},{"id":"g2_english_l012_ex04","knowledge_id":"g2_english_l012","question":"单项选择：I hope not _____ the mistake again. A. make  B. to make  C. making  D. made","answer":"答案：B. to make。解析：hope not to do\"希望不做\"。the mistake\"错误\"。"},{"id":"g2_english_l012_ex05","knowledge_id":"g2_english_l012","question":"翻译句子：老师告诉学生不要在走廊里跑。","answer":"答案：The teacher told the students not to run in the hallway. 解析：tell sb. not to do\"告诉某人不做\"。"},{"id":"g2_english_l012_ex06","knowledge_id":"g2_english_l012","question":"单项选择：My mother asked me not _____ too much junk food. A. eat  B. to eat  C. eating  D. ate","answer":"答案：B. to eat。解析：ask sb. not to do\"请某人不做\"。junk food\"垃圾食品\"。"},{"id":"g2_english_l012_ex07","knowledge_id":"g2_english_l012","question":"用所给词的适当形式填空：He told me ______ (not, be) late for class.","answer":"答案：not to be。解析：tell sb. not to do\"告诉某人不做\"。late for class\"上课迟到\"。"},{"id":"g2_english_l012_ex08","knowledge_id":"g2_english_l012","question":"单项选择：Please remind me _____ the lights when I leave. A. turn off  B. to turn off  C. turning off  D. turned off","answer":"答案：B. to turn off。解析：remind sb. to do\"提醒某人做\"。the lights\"灯\"。"},{"id":"g2_english_l012_ex09","knowledge_id":"g2_english_l012","question":"翻译句子：我不希望他再犯同样的错误。","answer":"答案：I don't want him to make the same mistake again. 解析：don't want sb. to do\"不希望某人做\"。the same mistake\"同样的错误\"。"},{"id":"g2_english_l012_ex10","knowledge_id":"g2_english_l012","question":"单项选择：She told the children not _____ in the park. A. play  B. to play  C. playing  D. played","answer":"答案：B. to play。解析：tell sb. not to do\"告诉某人不做\"。in the park\"在公园里\"。"},{"id":"g2_english_l013_ex01","knowledge_id":"g2_english_l013","question":"单项选择：I saw him _____ football yesterday. A. play  B. to play  C. playing  D. plays","answer":"答案：A. play。解析：see sb. do\"看到...做了（全过程）\"。yesterday是过去时。"},{"id":"g2_english_l013_ex02","knowledge_id":"g2_english_l013","question":"单项选择：I saw him _____ football when I passed by. A. play  B. playing  C. to play  D. played","answer":"答案：B. playing。解析：see sb. doing\"看到...正在做\"。when I passed by\"我路过时\"。"},{"id":"g2_english_l013_ex03","knowledge_id":"g2_english_l013","question":"用所给词的适当形式填空：We heard her ______ (sing) in the next room just now.","answer":"答案：singing。解析：hear sb. doing\"听到...正在做\"。just now\"刚才\"。"},{"id":"g2_english_l013_ex04","knowledge_id":"g2_english_l013","question":"单项选择：I often hear him _____ English in the morning. A. read  B. reading  C. to read  D. reads","answer":"答案：A. read。解析：hear sb. do\"听到...做（经常）\"。in the morning\"早上\"。"},{"id":"g2_english_l013_ex05","knowledge_id":"g2_english_l013","question":"翻译句子：我看见她正在过马路。","answer":"答案：I saw her crossing the road. 解析：see sb. doing\"看到...正在做\"。cross the road\"过马路\"。"},{"id":"g2_english_l013_ex06","knowledge_id":"g2_english_l013","question":"单项选择：Did you notice anyone _____ the flowers? A. water  B. watering  C. to water  D. watered","answer":"答案：B. watering。解析：notice sb. doing\"注意到...正在做\"。the flowers\"花\"。"},{"id":"g2_english_l013_ex07","knowledge_id":"g2_english_l013","question":"用所给词的适当形式填空：He watched the children ______ (play) in the park.","answer":"答案：playing。解析：watch sb. doing\"观看...正在做\"。in the park\"在公园里\"。"},{"id":"g2_english_l013_ex08","knowledge_id":"g2_english_l013","question":"单项选择：I heard someone _____ at the door just now. A. knock  B. knocking  C. to knock  D. knocked","answer":"答案：B. knocking。解析：hear sb. doing\"听到...正在做\"。just now\"刚才\"。"},{"id":"g2_english_l013_ex09","knowledge_id":"g2_english_l013","question":"翻译句子：我感觉到有人在碰我的手。","answer":"答案：I felt someone touching my hand. 解析：feel sb. doing\"感觉到...正在做\"。touch\"碰/摸\"。"},{"id":"g2_english_l013_ex10","knowledge_id":"g2_english_l013","question":"单项选择：She noticed a man _____ something into his pocket. A. put  B. putting  C. to put  D. puts","answer":"答案：B. putting。解析：notice sb. doing\"注意到...正在做\"。into his pocket\"进口袋\"。"},{"id":"g2_english_l014_ex01","knowledge_id":"g2_english_l014","question":"单项选择：Could you tell me where the bank _____? A. is  B. was  C. are  D. were","answer":"答案：A. is。解析：宾语从句用陈述语序。the bank是单数，用is。"},{"id":"g2_english_l014_ex02","knowledge_id":"g2_english_l014","question":"单项选择：I don't know _____ the train station is. A. where  B. where is  C. where does  D. where do","answer":"答案：A. where。解析：where引导宾语从句，从句用陈述语序。"},{"id":"g2_english_l014_ex03","knowledge_id":"g2_english_l014","question":"用所给词的适当形式填空：Can you tell me where I ______ (can find) a good restaurant?","answer":"答案：can find。解析：宾语从句用陈述语序：where + 主语 + 谓语。"},{"id":"g2_english_l014_ex04","knowledge_id":"g2_english_l014","question":"单项选择：Could you please tell me _____ the post office is? A. where  B. where is  C. how  D. when","answer":"答案：A. where。解析：where引导宾语从句用陈述语序。the post office is是正确语序。"},{"id":"g2_english_l014_ex05","knowledge_id":"g2_english_l014","question":"翻译句子：你能告诉我怎么去图书馆吗？","answer":"答案：Could you tell me how to get to the library? 或 Could you tell me where the library is? 解析：how to get to/where is都是正确表达。"},{"id":"g2_english_l014_ex06","knowledge_id":"g2_english_l014","question":"单项选择：Do you know _____ I can buy a map? A. where  B. where can  C. how  D. A and C","answer":"答案：D. A and C。解析：where/how引导宾语从句用陈述语序。"},{"id":"g2_english_l014_ex07","knowledge_id":"g2_english_l014","question":"用所给词的适当形式填空：I wonder _____ the bus stop is.","answer":"答案：where。解析：wonder后接where引导的宾语从句，用陈述语序。"},{"id":"g2_english_l014_ex08","knowledge_id":"g2_english_l014","question":"单项选择：Could you tell me _____ I can get to the airport? A. where  B. how  C. when  D. A and B","answer":"答案：D. A and B。解析：where/how引导宾语从句用陈述语序。get to\"到达\"。"},{"id":"g2_english_l014_ex09","knowledge_id":"g2_english_l014","question":"翻译句子：请问，哪里有公共厕所？","answer":"答案：Excuse me, where is the nearest restroom? 解析：Excuse me\"打扰一下\"。nearest\"最近的\"。restroom\"厕所\"。"},{"id":"g2_english_l014_ex10","knowledge_id":"g2_english_l014","question":"单项选择：I want to know _____ the nearest supermarket is. A. where  B. where is  C. how  D. when","answer":"答案：A. where。解析：where引导宾语从句用陈述语序。the nearest supermarket is是正确的。"},{"id":"g2_english_l015_ex01","knowledge_id":"g2_english_l015","question":"单项选择：Could you please _____ the door? A. open  B. opening  C. to open  D. opened","answer":"答案：A. open。解析：Could you please + 动词原形。open the door\"开门\"。"},{"id":"g2_english_l015_ex02","knowledge_id":"g2_english_l015","question":"单项选择：Could you please _____ quiet in the library? A. be  B. being  C. to be  D. are","answer":"答案：A. be。解析：Could you please + 动词原形 + 其他。be quiet\"保持安静\"。"},{"id":"g2_english_l015_ex03","knowledge_id":"g2_english_l015","question":"用所给词的适当形式填空：Could you please ______ (not, make) so much noise?","answer":"答案：not make。解析：Could you please not + 动词原形，表示委婉请求不要做某事。"},{"id":"g2_english_l015_ex04","knowledge_id":"g2_english_l015","question":"单项选择：— Could you please pass me the salt? — _____. A. Sure  B. Sorry, I can't  C. Of course  D. All of the above","answer":"答案：D. All of the above。解析：Could you please...?的回答可以是肯定或否定。"},{"id":"g2_english_l015_ex05","knowledge_id":"g2_english_l015","question":"翻译句子：请不要在这里抽烟好吗？","answer":"答案：Could you please not smoke here? 解析：Could you please not + 动词原形，表示委婉请求不要做。"},{"id":"g2_english_l015_ex06","knowledge_id":"g2_english_l015","question":"单项选择：Could you please _____ me a hand? A. give  B. giving  C. to give  D. gave","answer":"答案：A. give。解析：give me a hand\"帮我一个忙\"。Could you please + 动词原形。"},{"id":"g2_english_l015_ex07","knowledge_id":"g2_english_l015","question":"用所给词的适当形式填空：______ (Could) you please speak more slowly?","answer":"答案：Could。解析：Could you please + 动词原形，表示委婉请求。more slowly\"更慢一点\"。"},{"id":"g2_english_l015_ex08","knowledge_id":"g2_english_l015","question":"单项选择：Could I please _____ the window? It's hot. A. open  B. opening  C. to open  D. opened","answer":"答案：A. open。解析：Could I please + 动词原形，请求许可。"},{"id":"g2_english_l015_ex09","knowledge_id":"g2_english_l015","question":"翻译句子：请你把音乐关小声一点好吗？","answer":"答案：Could you please turn down the music? 解析：turn down\"调低\"。the music\"音乐\"。"},{"id":"g2_english_l015_ex10","knowledge_id":"g2_english_l015","question":"单项选择：Could you please not _____ your phone during class? A. use  B. using  C. to use  D. used","answer":"答案：A. use。解析：Could you please not + 动词原形。during class\"上课期间\"。"},{"id":"g2_english_l016_ex01","knowledge_id":"g2_english_l016","question":"单项选择：Could you tell me where _____? A. is the bank  B. the bank is  C. the bank was  D. was the bank","answer":"答案：B. the bank is。解析：宾语从句用陈述语序：主语+谓语+其他。the bank is是正确语序。"},{"id":"g2_english_l016_ex02","knowledge_id":"g2_english_l016","question":"单项选择：I don't know _____ he is. A. where  B. where is  C. where does  D. where do","answer":"答案：A. where。解析：where引导宾语从句用陈述语序。he is是正确的。"},{"id":"g2_english_l016_ex03","knowledge_id":"g2_english_l016","question":"用所给词的适当形式填空：Do you know what time ______ (start)?","answer":"答案：it starts。解析：what time引导宾语从句用陈述语序。主语it用starts。"},{"id":"g2_english_l016_ex04","knowledge_id":"g2_english_l016","question":"单项选择：I wonder _____ the movie starts. A. when  B. when does  C. what time  D. A and C","answer":"答案：D. A and C。解析：when/what time引导宾语从句用陈述语序。"},{"id":"g2_english_l016_ex05","knowledge_id":"g2_english_l016","question":"翻译句子：你能告诉我他住哪里吗？","answer":"答案：Could you tell me where he lives? 解析：where引导宾语从句用陈述语序。he lives是正确语序。"},{"id":"g2_english_l016_ex06","knowledge_id":"g2_english_l016","question":"单项选择：He asked me _____ to the party. A. if I will go  B. if will I go  C. if I go  D. if do I go","answer":"答案：A. if I will go。解析：if引导宾语从句用陈述语序。主句asked是过去时，从句用will go（受主句过去时影响应改为would go，但选项A也符合基础语法）。"},{"id":"g2_english_l016_ex07","knowledge_id":"g2_english_l016","question":"用所给词的适当形式填空：I don't know what ______ (be) her name.","answer":"答案：is。解析：what引导宾语从句用陈述语序。主语her name用is。"},{"id":"g2_english_l016_ex08","knowledge_id":"g2_english_l016","question":"单项选择：Could you tell me _____ the post office is? A. where  B. where is  C. how  D. when","answer":"答案：A. where。解析：where引导宾语从句用陈述语序。the post office is是正确语序。"},{"id":"g2_english_l016_ex09","knowledge_id":"g2_english_l016","question":"翻译句子：她问我是哪本书。","answer":"答案：She asked me which book it was. 解析：which引导宾语从句用陈述语序。主句asked是过去时，从句用过去时was。"},{"id":"g2_english_l016_ex10","knowledge_id":"g2_english_l016","question":"单项选择：I don't know _____ or not. A. if he will come  B. whether he will come  C. whether will he come  D. A and B","answer":"答案：D. A and B。解析：if/whether引导宾语从句用陈述语序。"},{"id":"g2_english_l017_ex01","knowledge_id":"g2_english_l017","question":"单项选择：Excuse me, could you tell me how to get to the _____? A. library  B. bookshop  C. museum  D. A and B","answer":"答案：D. A and B。解析：how to get to + 地点，\"怎么去\"。library\"图书馆\"。bookshop\"书店\"。"},{"id":"g2_english_l017_ex02","knowledge_id":"g2_english_l017","question":"单项选择：Is there a hospital _____ here? A. near  B. nearby  C. around  D. A and B","answer":"答案：D. A and B。解析：near/around/nearby都可表示\"附近\"。ne
