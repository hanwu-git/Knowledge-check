ar here\"这附近\"。"},{"id":"g2_english_l017_ex03","knowledge_id":"g2_english_l017","question":"用所给词的适当形式填空：Could you tell me which ______ (way) is to the station?","answer":"答案：way。解析：which way\"哪条路\"。the station\"车站\"。"},{"id":"g2_english_l017_ex04","knowledge_id":"g2_english_l017","question":"单项选择：_____ is the nearest bookshop? A. What  B. Where  C. When  D. Who","answer":"答案：B. Where。解析：Where is...?问地点。"},{"id":"g2_english_l017_ex05","knowledge_id":"g2_english_l017","question":"翻译句子：请问最近的银行在哪里？","answer":"答案：Excuse me, where is the nearest bank? 解析：Excuse me\"打扰一下\"。the nearest bank\"最近的银行\"。"},{"id":"g2_english_l017_ex06","knowledge_id":"g2_english_l017","question":"单项选择：Go _____ and then turn left. A. straight  B. right  C. left  D. to","answer":"答案：A. straight。解析：Go straight\"直走\"。turn left\"左转\"。"},{"id":"g2_english_l017_ex07","knowledge_id":"g2_english_l017","question":"用所给词的适当形式填空：The post office is ______ (about) ten minutes' walk from here.","answer":"答案：about。解析：about ten minutes' walk\"大约走十分钟\"。from here\"从这里\"。"},{"id":"g2_english_l017_ex08","knowledge_id":"g2_english_l017","question":"单项选择：It's on your _____ side. A. right  B. left  C. either  D. A and B","answer":"答案：D. A and B。解析：on your right/left side\"在你右/左侧\"。"},{"id":"g2_english_l017_ex09","knowledge_id":"g2_english_l017","question":"翻译句子：你能告诉我去图书馆的路吗？","answer":"答案：Could you tell me the way to the library? 解析：the way to\"去...的路\"。the library\"图书馆\"。"},{"id":"g2_english_l017_ex10","knowledge_id":"g2_english_l017","question":"单项选择：Take the second _____ on the right. A. turn  B. turning  C. turn to  D. turns","answer":"答案：B. turning。解析：the second turning on the right\"右边第二个拐弯处\"。"},{"id":"g2_english_l018_ex01","knowledge_id":"g2_english_l018","question":"单项选择：I don't know _____ to do next. A. what  B. how  C. when  D. A and B","answer":"答案：D. A and B。解析：what/how + to do\"做什么/怎么做\"。next\"接下来\"。"},{"id":"g2_english_l018_ex02","knowledge_id":"g2_english_l018","question":"单项选择：She showed me how _____ the computer. A. use  B. to use  C. using  D. used","answer":"答案：B. to use。解析：how to use\"怎么使用\"。the computer\"电脑\"。"},{"id":"g2_english_l018_ex03","knowledge_id":"g2_english_l018","question":"用所给词的适当形式填空：I don't know where ______ (go) for help.","answer":"答案：to go。解析：where to go\"去哪里\"。for help\"寻求帮助\"。"},{"id":"g2_english_l018_ex04","knowledge_id":"g2_english_l018","question":"单项选择：Could you tell me when _____? A. to start  B. start  C. starting  D. starts","answer":"答案：A. to start。解析：when to start\"什么时候开始\"。疑问词+to do结构。"},{"id":"g2_english_l018_ex05","knowledge_id":"g2_english_l018","question":"翻译句子：你能教我怎么做蛋糕吗？","answer":"答案：Can you teach me how to make a cake? 解析：how to make a cake\"怎么做蛋糕\"。"},{"id":"g2_english_l018_ex06","knowledge_id":"g2_english_l018","question":"单项选择：She told me _____ to take. A. which bus  B. which bus to take  C. to take which bus  D. take which bus","answer":"答案：B. which bus to take。解析：which + 名词 + to do\"做哪一辆公交\"。"},{"id":"g2_english_l018_ex07","knowledge_id":"g2_english_l018","question":"用所给词的适当形式填空：This book will tell you what ______ (do) next.","answer":"答案：to do。解析：what to do\"做什么\"。next\"接下来\"。"},{"id":"g2_english_l018_ex08","knowledge_id":"g2_english_l018","question":"单项选择：I want to know who _____ for help. A. ask  B. to ask  C. asking  D. asks","answer":"答案：B. to ask。解析：who to ask\"问谁\"。for help\"求助\"。"},{"id":"g2_english_l018_ex09","knowledge_id":"g2_english_l018","question":"翻译句子：父母应该教孩子如何面对困难。","answer":"答案：Parents should teach their children how to face difficulties. 解析：how to face difficulties\"如何面对困难\"。"},{"id":"g2_english_l018_ex10","knowledge_id":"g2_english_l018","question":"单项选择：He knows where _____ in this city. A. to go  B. go  C. going  D. went","answer":"答案：A. to go。解析：where to go\"去哪里\"。in this city\"在这个城市里\"。"},{"id":"g2_english_l019_ex01","knowledge_id":"g2_english_l019","question":"单项选择：You _____ study harder to pass the exam. A. should  B. would  C. can  D. may","answer":"答案：A. should。解析：should表示\"应该\"，是建议。pass the exam\"通过考试\"。"},{"id":"g2_english_l019_ex02","knowledge_id":"g2_english_l019","question":"单项选择：He _____ be at home now. It's too late. A. should  B. shouldn't  C. must  D. would","answer":"答案：A. should。解析：should be\"应该在\"，表示推测。It's too late\"太晚了\"。"},{"id":"g2_english_l019_ex03","knowledge_id":"g2_english_l019","question":"用所给词的适当形式填空：You ______ (should) drink more water. It's good for your health.","answer":"答案：should。解析：should\"应该\"，表示建议。drink more water\"多喝水\"。"},{"id":"g2_english_l019_ex04","knowledge_id":"g2_english_l019","question":"单项选择：You _____ be so rude to your parents. A. shouldn't  B. should  C. wouldn't  D. couldn't","answer":"答案：A. shouldn't。解析：shouldn't表示\"不应该\"。so rude\"那么粗鲁\"。"},{"id":"g2_english_l019_ex05","knowledge_id":"g2_english_l019","question":"翻译句子：你应该每天锻炼身体。","answer":"答案：You should exercise every day. 解析：should + 动词原形exercise。every day\"每天\"。"},{"id":"g2_english_l019_ex06","knowledge_id":"g2_english_l019","question":"单项选择：Should I bring a gift to the party? A. Yes, you should  B. No, you shouldn't  C. Sure  D. A and C","answer":"答案：D. A and C。解析：Should I...?的回答是Yes, you should / No, you shouldn't。Sure也是肯定回答。"},{"id":"g2_english_l019_ex07","knowledge_id":"g2_english_l019","question":"用所给词的适当形式填空：Children ______ (should) eat more vegetables and less junk food.","answer":"答案：should。解析：should\"应该\"，表示建议。vegetables\"蔬菜\"。junk food\"垃圾食品\"。"},{"id":"g2_english_l019_ex08","knowledge_id":"g2_english_l019","question":"单项选择：I think he _____ be at the office now. A. should  B. shouldn't  C. would  D. could","answer":"答案：A. should。解析：should be\"应该在\"，表示推测。at the office\"在办公室\"。"},{"id":"g2_english_l019_ex09","knowledge_id":"g2_english_l019","question":"翻译句子：你不应该熬夜。","answer":"答案：You shouldn't stay up late. 解析：shouldn't\"不应该\"。stay up late\"熬夜\"。"},{"id":"g2_english_l019_ex10","knowledge_id":"g2_english_l019","question":"单项选择：The book _____ be on the shelf. Let me check. A. should  B. shouldn't  C. would  D. must","answer":"答案：A. should。解析：should be\"应该在\"，表示推测。on the shelf\"在书架上\"。"},{"id":"g2_english_l020_ex01","knowledge_id":"g2_english_l020","question":"单项选择：You look tired. You _____ have a rest. A. should  B. shouldn't  C. would  D. could","answer":"答案：A. should。解析：should提建议。have a rest\"休息一下\"。"},{"id":"g2_english_l020_ex02","knowledge_id":"g2_english_l020","question":"单项选择：You _____ eat too much candy. It's bad for your teeth. A. shouldn't  B. should  C. would  D. must","answer":"答案：A. shouldn't。解析：shouldn't表示\"不应该\"。too much candy\"太多糖\"。"},{"id":"g2_english_l020_ex03","knowledge_id":"g2_english_l020","question":"用所给词的适当形式填空：______ (Why don't) you go to bed earlier?","answer":"答案：Why don't。解析：Why don't you + 动词原形，\"你为什么不...\"。"},{"id":"g2_english_l020_ex04","knowledge_id":"g2_english_l020","question":"单项选择：Why not _____ out for a walk after dinner? A. go  B. to go  C. going  D. goes","answer":"答案：A. go。解析：Why not + 动词原形。go out for a walk\"出去散步\"。"},{"id":"g2_english_l020_ex05","knowledge_id":"g2_english_l020","question":"翻译句子：让我们明天去公园吧。","answer":"答案：Let's go to the park tomorrow. 解析：Let's + 动词原形。tomorrow\"明天\"。"},{"id":"g2_english_l020_ex06","knowledge_id":"g2_english_l020","question":"单项选择：How about _____ to the movies? A. go  B. to go  C. going  D. went","answer":"答案：C. going。解析：How about + 动名词。"},{"id":"g2_english_l020_ex07","knowledge_id":"g2_english_l020","question":"用所给词的适当形式填空：You had better ______ (not, stay) up too late.","answer":"答案：not stay。解析：had better not + 动词原形，\"最好不要\"。"},{"id":"g2_english_l020_ex08","knowledge_id":"g2_english_l020","question":"单项选择：— What about going swimming? — _____. A. That's a good idea  B. Good idea  C. Sure, I'd love to  D. All of the above","answer":"答案：D. All of the above。解析：多种赞同回答都可以用。"},{"id":"g2_english_l020_ex09","knowledge_id":"g2_english_l020","question":"翻译句子：你最好去看医生。","answer":"答案：You had better see a doctor. 解析：had better + 动词原形。see a doctor\"看医生\"。"},{"id":"g2_english_l020_ex10","knowledge_id":"g2_english_l020","question":"单项选择：You _____ try to do it again. A. should  B. shouldn't  C. would  D. must","answer":"答案：A. should。解析：should\"应该\"，是建议。try again\"再试一次\"。"},{"id":"g2_english_l021_ex01","knowledge_id":"g2_english_l021","question":"单项选择：_____ he will come is not sure. A. Maybe  B. May be  C. Perhaps  D. A and C","answer":"答案：D. A and C。解析：maybe和perhaps都是副词，意为\"也许\"。May be是情态动词may加动词be，后接表语。"},{"id":"g2_english_l021_ex02","knowledge_id":"g2_english_l021","question":"单项选择：He _____ be a teacher. A. maybe  B. may be  C. perhaps  D. probably","answer":"答案：B. may be。解析：may be\"可能是\"，后接表语。a teacher是表语。"},{"id":"g2_english_l021_ex03","knowledge_id":"g2_english_l021","question":"用所给词的适当形式填空：______ (Maybe) it will rain tomorrow.","answer":"答案：Maybe。解析：Maybe是副词，\"也许\"，后接完整句子。"},{"id":"g2_english_l021_ex04","knowledge_id":"g2_english_l021","question":"单项选择：Maybe she is at home. (同义句) A. She is at home  B. She may be at home  C. She is not at home  D. B and A","answer":"答案：B. She may be at home。解析：Maybe + 从句 = may be + 表语。"},{"id":"g2_english_l021_ex05","knowledge_id":"g2_english_l021","question":"翻译句子：他可能是个医生。","answer":"答案：Maybe he is a doctor. = He may be a doctor. 解析：两种翻译都对。"},{"id":"g2_english_l021_ex06","knowledge_id":"g2_english_l021","question":"单项选择：_____ you are right. A. Maybe  B. May be  C. Perhaps  D. A and C","answer":"答案：D. A and C。解析：maybe/perhaps\"也许\"，副词。may be\"可能是\"，后接表语。整句要表示\"也许你是对的\"用maybe/perhaps。"},{"id":"g2_english_l021_ex07","knowledge_id":"g2_english_l021","question":"用所给词的适当形式填空：He ______ (may be) in the classroom now.","answer":"答案：may be。解析：may be\"可能是\"。in the classroom\"在教室\"是表语。"},{"id":"g2_english_l021_ex08","knowledge_id":"g2_english_l021","question":"单项选择：Perhaps she _____ come tomorrow. A. will  B. may  C. can  D. should","answer":"答案：A. will。解析：Perhaps是副词，\"也许\"，修饰整个句子。整句是Perhaps she will come."},{"id":"g2_english_l021_ex09","knowledge_id":"g2_english_l021","question":"翻译句子：明天他可能不在家。","answer":"答案：Maybe he is not at home tomorrow. 或 He may not be at home tomorrow. 解析：两种翻译都对。"},{"id":"g2_english_l021_ex10","knowledge_id":"g2_english_l021","question":"单项选择：There _____ be a big party tonight. A. maybe  B. may be  C. perhaps  D. probably","answer":"答案：B. may be。解析：may be\"可能是\"，a big party是表语。"},{"id":"g2_english_l022_ex01","knowledge_id":"g2_english_l022","question":"单项选择：You had better _____ a doctor. A. see  B. seeing  C. to see  D. saw","answer":"答案：A. see。解析：had better + 动词原形。see a doctor\"看医生\"。"},{"id":"g2_english_l022_ex02","knowledge_id":"g2_english_l022","question":"单项选择：You'd better _____ late again. A. don't be  B. not be  C. not to be  D. be not","answer":"答案：B. not be。解析：had better not + 动词原形。late\"迟到\"。"},{"id":"g2_english_l022_ex03","knowledge_id":"g2_english_l022","question":"用所给词的适当形式填空：We had better ______ (leave) now, or we'll be late.","answer":"答案：leave。解析：had better + 动词原形。or we'll be late\"否则我们会迟到\"。"},{"id":"g2_english_l022_ex04","knowledge_id":"g2_english_l022","question":"单项选择：You had better not _____ in the classroom. A. run  B. running  C. to run  D. runs","answer":"答案：A. run。解析：had better not + 动词原形。run\"跑\"。"},{"id":"g2_english_l022_ex05","knowledge_id":"g2_english_l022","question":"翻译句子：你最好今天完成作业。","answer":"答案：You had better finish your homework today. 解析：had better + 动词原形finish。today\"今天\"。"},{"id":"g2_english_l022_ex06","knowledge_id":"g2_english_l022","question":"单项选择：You had better _____ more water. A. drink  B. drinking  C. to drink  D. drinks","answer":"答案：A. drink。解析：had better + 动词原形。drink more water\"多喝水\"。"},{"id":"g2_english_l022_ex07","knowledge_id":"g2_english_l022","question":"用所给词的适当形式填空：You'd better ______ (not, eat) too much candy.","answer":"答案：not eat。解析：had better not + 动词原形。too much candy\"太多糖\"。"},{"id":"g2_english_l022_ex08","knowledge_id":"g2_english_l022","question":"单项选择：We'd better _____ a taxi. It's getting late. A. take  B. taking  C. to take  D. takes","answer":"答案：A. take。解析：had better + 动词原形。take a taxi\"打车\"。It's getting late\"天晚了\"。"},{"id":"g2_english_l022_ex09","knowledge_id":"g2_english_l022","question":"翻译句子：天气不好，你最好待在家里。","answer":"答案：The weather is bad. You'd better stay at home. 解析：stay at home\"待在家里\"。"},{"id":"g2_english_l022_ex10","knowledge_id":"g2_english_l022","question":"单项选择：You had better not _____ that. It's dangerous. A. do  B. doing  C. to do  D. does","answer":"答案：A. do。解析：had better not + 动词原形。dangerous\"危险\"。"},{"id":"g2_english_l023_ex01","knowledge_id":"g2_english_l023","question":"单项选择：I _____ TV at 8 o'clock last night. A. watch  B. watched  C. was watching  D. am watching","answer":"答案：C. was watching。解析：at 8 o'clock last night是过去某一点时间，\"正在做\"用过去进行时。整句：I was watching TV at 8 o'clock last night."},{"id":"g2_english_l023_ex02","knowledge_id":"g2_english_l023","question":"单项选择：They _____ basketball at that time yesterday. A. play  B. played  C. were playing  D. are playing","answer":"答案：C. were playing。解析：at that time yesterday是过去某时，\"正在做\"用过去进行时。主语they用were。"},{"id":"g2_english_l023_ex03","knowledge_id":"g2_english_l023","question":"用所给词的适当形式填空：She ______ (read) a book when I called her last night.","answer":"答案：was reading。解析：when I called是过去时，主句用过去进行时。完整：She was reading a book when I called her last night."},{"id":"g2_english_l023_ex04","knowledge_id":"g2_english_l023","question":"单项选择：What _____ you _____ at this time yesterday? A. are, doing  B. were, doing  C. did, do  D. was, doing","answer":"答案：B. were, doing。解析：at this time yesterday是过去某时，特殊疑问句用were + 主语 + doing。"},{"id":"g2_english_l023_ex05","knowledge_id":"g2_english_l023","question":"翻译句子：昨天晚上这个时候我在做作业。","answer":"答案：I was doing my homework at this time last night. 解析：at this time last night是过去某时，was doing是过去进行时。"},{"id":"g2_english_l023_ex06","knowledge_id":"g2_english_l023","question":"单项选择：At 9 last night, I _____ dinner with my family. A. have  B. had  C. was having  D. am having","answer":"答案：C. was having。解析：at 9 last night是过去某时，\"正在吃\"用过去进行时。整句：At 9 last night, I was having dinner with my family."},{"id":"g2_english_l023_ex07","knowledge_id":"g2_english_l023","question":"用所给词的适当形式填空：They ______ (run) in the park at 5 yesterday afternoon.","answer":"答案：were running。解析：at 5 yesterday afternoon是过去某时。主语they用were。完整：They were running in the park at 5 yesterday afternoon."},{"id":"g2_english_l023_ex08","knowledge_id":"g2_english_l023","question":"单项选择：While I _____ the dishes, the doorbell rang. A. wash  B. washed  C. was washing  D. am washing","answer":"答案：C. was washing。解析：while + 延续性动作，用过去进行时。整句：While I was washing the dishes, the doorbell rang."},{"id":"g2_english_l023_ex09","knowledge_id":"g2_english_l023","question":"翻译句子：昨天下午三点他们在踢足球。","answer":"答案：They were playing football at three yesterday afternoon. 解析：at three yesterday afternoon是过去某时。"},{"id":"g2_english_l023_ex10","knowledge_id":"g2_english_l023","question":"单项选择：The children _____ in the garden when it began to rain. A. play  B. played  C. were playing  D. are playing","answer":"答案：C. were playing。解析：when it began to rain是一般过去时，主句用过去进行时。整句：The children were playing in the garden when it began to rain."},{"id":"g2_english_l024_ex01","knowledge_id":"g2_english_l024","question":"单项选择：I was walking to school _____ I met my teacher. A. when  B. while  C. as  D. before","answer":"答案：A. when。解析：when引导一般过去时，I was walking是延续性动作。整句：I was walking to school when I met my teacher."},{"id":"g2_english_l024_ex02","knowledge_id":"g2_english_l024","question":"单项选择：I was reading _____ the lights went out. A. when  B. while  C. as  D. for","answer":"答案：A. when。解析：the lights went out是短暂性动作，用when。"},{"id":"g2_english_l024_ex03","knowledge_id":"g2_english_l024","question":"用所给词的适当形式填空：I ______ (read) a book when the phone rang.","answer":"答案：was reading。解析：when the phone rang是一般过去时，主句用过去进行时。完整：I was reading a book when the phone rang."},{"id":"g2_english_l024_ex04","knowledge_id":"g2_english_l024","question":"单项选择：When I _____ the classroom, the teacher was writing on the blackboard. A. enter  B. entered  C. am entering  D. will enter","answer":"答案：B. entered。解析：主句I entered是一般过去时，the teacher was writing是过去进行时。整句：When I entered the classroom, the teacher was writing on the blackboard."},{"id":"g2_english_l024_ex05","knowledge_id":"g2_english_l024","question":"翻译句子：当我到家时，妈妈正在做饭。","answer":"答案：When I got home, my mother was cooking. 解析：got是一般过去时，was cooking是过去进行时。on the blackboard\"在黑板上\"。"},{"id":"g2_english_l024_ex06","knowledge_id":"g2_english_l024","question":"单项选择：He was playing computer games _____ his mother came back. A. when  B. while  C. as  D. for","answer":"答案：A. when。解析：his mother came back是短暂性动作，用when。"},{"id":"g2_english_l024_ex07","knowledge_id":"g2_english_l024","question":"用所给词的适当形式填空：She ______ (cook) dinner when the doorbell rang.","answer":"答案：was cooking。解析：when the doorbell rang是一般过去时，主句用过去进行时。完整：She was cooking dinner when the doorbell rang."},{"id":"g2_english_l024_ex08","knowledge_id":"g2_english_l024","question":"单项选择：When I _____ the library, I saw many students reading. A. enter  B. entered  C. am entering  D. will enter","answer":"答案：B. entered。解析：When I entered是一般过去时。I saw也是一般过去时（描述同时看到的背景）。"},{"id":"g2_english_l024_ex09","knowledge_id":"g2_english_l024","question":"翻译句子：我正走在路上，突然开始下雨了。","answer":"答案：I was walking on the road when it started to rain. 解析：was walking是过去进行时，when it started是一般过去时。"},{"id":"g2_english_l024_ex10","knowledge_id":"g2_english_l024","question":"单项选择：When she _____ the classroom, all the students were reading. A. enter  B. entered  C. is entering  D. has entered","answer":"答案：B. entered。解析：entered是一般过去时，were reading是过去进行时表示背景。"},{"id":"g2_english_l025_ex01","knowledge_id":"g2_english_l025","question":"单项选择：_____ I was sleeping, my brother was watching TV. A. When  B. While  C. As  D. After","answer":"答案：B. While。解析：while引导两个同时进行的过去进行时动作。"},{"id":"g2_english_l025_ex02","knowledge_id":"g2_english_l025","question":"单项选择：While I _____ my homework, my mother was cooking. A. do  B. did  C. was doing  D. am doing","answer":"答案：C. was doing。解析：while引导过去进行时，主句I was doing。"},{"id":"g2_english_l025_ex03","knowledge_id":"g2_english_l025","question":"用所给词的适当形式填空：______ (While/When) I was reading, my sister was drawing pictures.","answer":"答案：While。解析：两个延续性动作同时进行用while。"},{"id":"g2_english_l025_ex04","knowledge_id":"g2_english_l025","question":"单项选择：She was cooking _____ I was setting the table. A. when  B. while  C. as  D. for","answer":"答案：B. while。解析：两个延续性动作同时进行用while。set the table\"摆桌子\"。"},{"id":"g2_english_l025_ex05","knowledge_id":"g2_english_l025","question":"翻译句子：我在读书时他在做作业。","answer":"答案：While I was reading, he was doing his homework. 解析：两个过去进行时同时进行用while连接。"},{"id":"g2_english_l025_ex06","knowledge_id":"g2_english_l025","question":"单项选择：While we _____ in the park, it began to snow. A. walk  B. walked  C. were walking  D. are walking","answer":"答案：C. were walking。解析：while引导过去进行时。"},{"id":"g2_english_l025_ex07","knowledge_id":"g2_english_l025","question":"用所给词的适当形式填空：She ______ (read) while her brother ______ (play) computer games.","answer":"答案：was reading, was playing。解析：while连接两个过去进行时动作。"},{"id":"g2_english_l025_ex08","knowledge_id":"g2_english_l025","question":"单项选择：My mother was watching TV _____ I was doing my homework. A. when  B. while  C. as  D. for","answer":"答案：B. while。解析：两个同时进行的过去进行时动作用while连接。"},{"id":"g2_english_l025_ex09","knowledge_id":"g2_english_l025","question":"翻译句子：他在睡觉，我在看电视。","answer":"答案：He was sleeping while I was watching TV. 解析：两个过去进行时同时进行。"},{"id":"g2_english_l025_ex10","knowledge_id":"g2_english_l025","question":"单项选择：While I _____ the piano, my father was reading a newspaper. A. play  B. played  C. was playing  D. am playing","answer":"答案：C. was playing。解析：while + 过去进行时。"},{"id":"g2_english_l026_ex01","knowledge_id":"g2_english_l026","question":"单项选择：I _____ a book at 8 last night. A. read  B. was reading  C. am reading  D. will read","answer":"答案：B. was reading。解析：at 8 last night是过去某时，\"正在做\"用过去进行时。强调动作进行。"},{"id":"g2_english_l026_ex02","knowledge_id":"g2_english_l026","question":"单项选择：I _____ a book yesterday. A. read  B. was reading  C. am reading  D. will read","answer":"答案：A. read。解析：yesterday是一般过去时，强调动作完成。read的过去式仍是read（发音/red/）。"},{"id":"g2_english_l026_ex03","knowledge_id":"g2_english_l026","question":"用所给词的适当形式填空：At 9 last night, I ______ (watch) TV.","answer":"答案：was watching。解析：at 9 last night是过去某时，用过去进行时强调进行。完整：At 9 last night, I was watching TV."},{"id":"g2_english_l026_ex04","knowledge_id":"g2_english_l026","question":"单项选择：I _____ my keys yesterday. I still can't find them. A. lose  B. lost  C. was losing  D. am losing","answer":"答案：B. lost。解析：yesterday是一般过去时，强调动作完成。I still can't find them说明动作已完成（结果）。"},{"id":"g2_english_l026_ex05","knowledge_id":"g2_english_l026","question":"翻译句子：昨天晚上八点我在看电视。","answer":"答案：I was watching TV at 8 last night. 解析：at 8 last night是过去某时，用过去进行时强调正在进行。"},{"id":"g2_english_l026_ex06","knowledge_id":"g2_english_l026","question":"单项选择：I _____ my keys all morning yesterday. A. lose  B. lost  C. was losing  D. am losing","answer":"答案：C. was losing。解析：all morning yesterday是过去一段时间，用过去进行时强调持续进行。"},{"id":"g2_english_l026_ex07","knowledge_id":"g2_english_l026","question":"用所给词的适当形式填空：I ______ (read) the book yesterday. I've finished it.","answer":"答案：read。解析：yesterday是一般过去时，强调动作完成。I've finished说明结果。"},{"id":"g2_english_l026_ex08","knowledge_id":"g2_english_l026","question":"单项选择：I _____ when the phone rang. A. cook  B. cooked  C. was cooking  D. am cooking","answer":"答案：C. was cooking。解析：when the phone rang是一般过去时，主句用过去进行时强调正在做。"},{"id":"g2_english_l026_ex09","knowledge_id":"g2_english_l026","question":"翻译句子：昨天下午我在图书馆读书。","answer":"答案：I was reading in the library yesterday afternoon. 解析：yesterday afternoon是过去某时，可以用过去进行时强调进行。"},{"id":"g2_english_l026_ex10","knowledge_id":"g2_english_l026","question":"单项选择：I _____ to the cinema last night. I had a great time. A. go  B. went  C. was going  D. am going","answer":"答案：B. went。解析：last night是一般过去时，强调动作完成。I had a great time是过去完成时呼应。"},{"id":"g2_english_l027_ex01","knowledge_id":"g2_english_l027","question":"单项选择：I _____ my homework when my father came home. A. do  B. did  C. was doing  D. am doing","answer":"答案：C. was doing。解析：when my father came home是一般过去时，主句用过去进行时表示当时正在做。"},{"id":"g2_english_l027_ex02","knowledge_id":"g2_english_l027","question":"单项选择：It was snowing _____ I went to school. A. when  B. while  C. as  D. for","answer":"答案：A. when。解析：I went to school是一般过去时（短暂性），when引导时间状语从句。"},{"id":"g2_english_l027_ex03","knowledge_id":"g2_english_l027","question":"用所给词的适当形式填空：He ______ (watch) TV when I called him.","answer":"答案：was watching。解析：when I called是一般过去时，主句用过去进行时。完整：He was watching TV when I called him."},{"id":"g2_english_l027_ex04","knowledge_id":"g2_english_l027","question":"单项选择：I was walking to school _____ I saw a cat. A. when  B. while  C. as  D. before","answer":"答案：A. when。解析：when引导一般过去时，主句I was walking是过去进行时（延续性）。"},{"id":"g2_english_l027_ex05","knowledge_id":"g2_english_l027","question":"翻译句子：昨晚我做作业时，听见有人在唱歌。","answer":"答案：I was doing my homework when I heard someone singing last night. 解析：was doing过去进行时，when I heard一般过去时。"},{"id":"g2_english_l027_ex06","knowledge_id":"g2_english_l027","question":"单项选择：While my mother _____ dinner, I was setting the table. A. cook  B. cooked  C. was cooking  D. is cooking","answer":"答案：C. was cooking。解析：while引导过去进行时，强调主从句动作同时进行。"},{"id":"g2_english_l027_ex07","knowledge_id":"g2_english_l027","question":"用所给词的适当形式填空：It ______ (rain) when I left home this morning.","answer":"答案：was raining。解析：when I left是一般过去时，主句用过去进行时表示背景。完整：It was raining when I left home this morning."},{"id":"g2_english_l027_ex08","knowledge_id":"g2_english_l027","question":"单项选择：— What were you doing at 8 last night? — I _____ dinner. A. have  B. had  C. was having  D. am having","answer":"答案：C. was having。解析：at 8 last night是过去某时，回答用过去进行时was having。"},{"id":"g2_english_l027_ex09","knowledge_id":"g2_english_l027","question":"翻译句子：我在写作业时我弟弟在玩电脑游戏。","answer":"答案：While I was doing my homework, my brother was playing computer games. 解析：两个过去进行时同时进行用while连接。"},{"id":"g2_english_l027_ex10","knowledge_id":"g2_english_l027","question":"单项选择：The children were running in the park _____ it started to rain. A. when  B. while  C. as  D. for","answer":"答案：A. when。解析：it started to rain是一般过去时（短暂性），主句用过去进行时were running。"},{"id":"g2_english_l028_ex01","knowledge_id":"g2_english_l028","question":"单项选择：I _____ my homework before my mother came home. A. finish  B. finished  C. had finished  D. will finish","answer":"答案：C. had finished。解析：before my mother came home（过去时），主句用过去完成时，表示\"过去的过去\"。"},{"id":"g2_english_l028_ex02","knowledge_id":"g2_english_l028","question":"单项选择：By the time I got to the station, the train _____. A. leaves  B. left  C. has left  D. had left","answer":"答案：D. had left。解析：By the time + 过去时，主句用过去完成时。"},{"id":"g2_english_l028_ex03","knowledge_id":"g2_english_l028","question":"用所给词的适当形式填空：She ______ (read) the book before she watched the movie.","answer":"答案：had read。解析：before she watched是过去时，从句用过去完成时。完整：She had read the book before she watched the movie."},{"id":"g2_english_l028_ex04","knowledge_id":"g2_english_l028","question":"单项选择：I _____ the film before, so I didn't want to watch it again. A. see  B. saw  C. had seen  D. will see","answer":"答案：C. had seen。解析：I didn't want是一般过去时，从句用过去完成时表示\"过去的过去\"。"},{"id":"g2_english_l028_ex05","knowledge_id":"g2_english_l028","question":"翻译句子：到去年年底为止，我已经学了英语五年了。","answer":"答案：By the end of last year, I had learned English for five years. 解析：By the end of last year是过去时间，主句用过去完成时。"},{"id":"g2_english_l028_ex06","knowledge_id":"g2_english_l028","question":"单项选择：He told me that he _____ his work. A. finish  B. finished  C. has finished  D. had finished","answer":"答案：D. had finished。解析：told是过去时，从句用过去完成时。"},{"id":"g2_english_l028_ex07","knowledge_id":"g2_english_l028","question":"用所给词的适当形式填空：I ______ (have) lunch before I went shopping.","answer":"答案：had had。解析：before I went是过去时，从句用过去完成时。have的过去分词是had。完整：I had had lunch before I went shopping."},{"id":"g2_english_l028_ex08","knowledge_id":"g2_english_l028","question":"单项选择：By the time the teacher came, the students _____ the classroom. A. clean  B. cleaned  C. have cleaned  D. had cleaned","answer":"答案：D. had cleaned。解析：By the time + 过去时，主句用过去完成时。"},{"id":"g2_english_l028_ex09","knowledge_id":"g2_english_l028","question":"翻译句子：她说她已经完成了工作。","answer":"答案：She said that she had finished her work. 解析：said是过去时，从句用过去完成时。"},{"id":"g2_english_l028_ex10","knowledge_id":"g2_english_l028","question":"单项选择：When I arrived at the party, everyone _____. A. leaves  B. left  C. has left  D. had left","answer":"答案：D. had left。解析：When I arrived是一般过去时，主句用过去完成时（已经离开）"},{"id":"g2_english_l029_ex01","knowledge_id":"g2_english_l029","question":"单项选择：By the time I got up, my mother _____ breakfast. A. cook  B. cooked  C. has cooked  D. had cooked","answer":"答案：D. had cooked。解析：By the time I got up（过去时），主句用过去完成时，表示\"过去的过去\"。整句：By the time I got up, my mother had cooked breakfast."},{"id":"g2_english_l029_ex02","knowledge_id":"g2_english_l029","question":"单项选择：I _____ the film before, so I didn't want to see it again. A. see  B. saw  C. had seen  D. will see","answer":"答案：C. had seen。解析：I didn't want是一般过去时，从句用过去完成时。"},{"id":"g2_english_l029_ex03","knowledge_id":"g2_english_l029","question":"用所给词的适当形式填空：She ______ (leave) before I arrived.","answer":"答案：had left。解析：before I arrived是过去时，从句用过去完成时。完整：She had left before I arrived."},{"id":"g2_english_l029_ex04","knowledge_id":"g2_english_l029","question":"单项选择：When I _____ home, my father had already cooked dinner. A. get  B. got  C. have got  D. will get","answer":"答案：B. got。解析：When I got是一般过去时（参照点），主句用过去完成时had cooked（过去的过去）。"},{"id":"g2_english_l029_ex05","knowledge_id":"g2_english_l029","question":"翻译句子：我回到家时，我爸爸已经看完了报纸。","answer":"答案：When I got home, my father had already finished reading the newspaper. 解析：got是一般过去时，had finished是过去完成时。"},{"id":"g2_english_l029_ex06","knowledge_id":"g2_english_l029","question":"单项选择：He _____ English for ten years before he came to China. A. study  B. studied  C. has studied  D. had studied","answer":"答案：D. had studied。解析：before he came是过去时，从句用过去完成时。"},{"id":"g2_english_l029_ex07","knowledge_id":"g2_english_l029","question":"用所给词的适当形式填空：By the time he ______ (arrive), the train had already left.","answer":"答案：arrived。解析：By the time + 一般过去时，主句用过去完成时。完整：By the time he arrived, the train had already left."},{"id":"g2_english_l029_ex08","knowledge_id":"g2_english_l029","question":"单项选择：I didn't know she _____ to Beijing. A. go  B. went  C. has gone  D. had gone","answer":"答案：D. had gone。解析：didn't know是一般过去时，从句用过去完成时。"},{"id":"g2_english_l029_ex09","knowledge_id":"g2_english_l029","question":"翻译句子：他告诉我说他已经完成了工作。","answer":"答案：He told me that he had finished his work. 解析：told是过去时，从句用过去完成时。"},{"id":"g2_english_l029_ex10","knowledge_id":"g2_english_l029","question":"单项选择：The movie _____ already begun when we got to the cinema. A. start  B. started  C. has started  D. had started","answer":"答案：D. had started。解析：when we got是一般过去时，主句用过去完成时。"},{"id":"g2_english_l030_ex01","knowledge_id":"g2_english_l030","question":"单项选择：By the time I got outside, the bus _____. A. leaves  B. left  C. has left  D. had already left","answer":"答案：D. had already left。解析：By the time I got outside是一般过去时，主句用过去完成时（已经离开）。"},{"id":"g2_english_l030_ex02","knowledge_id":"g2_english_l030","question":"单项选择：By the time he _____ at the station, the train had left. A. arrive  B. arrives  C. arrived  D. is arriving","answer":"答案：C. arrived。解析：By the time + 一般过去时，主句用过去完成时。整句：By the time he arrived at the station, the train had left."},{"id":"g2_english_l030_ex03","knowledge_id":"g2_english_l030","question":"用所给词的适当形式填空：By the time I ______ (get) there, they had already gone.","answer":"答案：got。解析：By the time + 一般过去时got。完整：By the time I got there, they had already gone."},{"id":"g2_english_l030_ex04","knowledge_id":"g2_english_l030","question":"单项选择：By the time you come back, I _____ the work. A. finish  B. finished  C. will have finished  D. have finished","answer":"答案：C. will have finished。解析：By the time + 一般现在时（come），主句用将来完成时。"},{"id":"g2_english_l030_ex05","knowledge_id":"g2_english_l030","question":"翻译句子：到我回家时，妈妈已经做好了饭。","answer":"答案：By the time I got home, my mother had already cooked the meal. 解析：got是一般过去时，had cooked是过去完成时。"},{"id":"g2_english_l030_ex06","knowledge_id":"g2_english_l030","question":"单项选择：By the time the bell rang, all the students _____ their seats. A. take  B. took  C. have taken  D. had taken","answer":"答案：D. had taken。解析：By the time the bell rang是一般过去时，主句用过去完成时。"},{"id":"g2_english_l030_ex07","knowledge_id":"g2_english_l030","question":"用所给词的适当形式填空：By the time she ______ (reach) the cinema, the movie had begun.","answer":"答案：reached。解析：By the time + 一般过去时reached。完整：By the time she reached the cinema, the movie had begun."},{"id":"g2_english_l030_ex08","knowledge_id":"g2_english_l030","question":"单项选择：By the time tomorrow comes, I _____ the project. A. finish  B. finished  C. will have finished  D. have finished","answer":"答案：C. will have finished。解析：By the time + 一般现在时（comes），主句用将来完成时。"},{"id":"g2_english_l030_ex09","knowledge_id":"g2_english_l030","question":"翻译句子：到明年为止，我就学英语十年了。","answer":"答案：By next year, I will have learned English for ten years. 解析：By next year是将来时间，用将来完成时。"},{"id":"g2_english_l030_ex10","knowledge_id":"g2_english_l030","question":"单项选择：By the time you read this letter, I _____ Beijing. A. leave  B. left  C. will have left  D. have left","answer":"答案：C. will have left。解析：By the time + 一般现在时（read），主句用将来完成时。"},{"id":"g2_english_l031_ex01","knowledge_id":"g2_english_l031","question":"单项选择：By the time I was ten, I _____ 500 English words. A. learn  B. learned  C. have learned  D. had learned","answer":"答案：D. had learned。解析：By the time I was ten是过去时间，主句用过去完成时。"},{"id":"g2_english_l031_ex02","knowledge_id":"g2_english_l031","question":"单项选择：I had finished dinner _____ he came. A. before  B. after  C. when  D. while","answer":"答案：A. before。解析：before引导时间状语从句。I had finished是过去完成时（过去的过去）。"},{"id":"g2_english_l031_ex03","knowledge_id":"g2_english_l031","question":"用所给词的适当形式填空：She ______ (already, go) when I arrived.","answer":"答案：had already gone。解析：when I arrived是一般过去时，从句用过去完成时。完整：She had already gone when I arrived."},{"id":"g2_english_l031_ex04","knowledge_id":"g2_english_l031","question":"单项选择：After he _____ the book, he went to bed. A. read  B. reads  C. has read  D. had read","answer":"答案：D. had read。解析：After引导时间状语从句，主句用过去完成时（过去的过去）。"},{"id":"g2_english_l031_ex05","knowledge_id":"g2_english_l031","question":"翻译句子：到去年为止，我已经学英语五年了。","answer":"答案：By last year, I had learned English for five years. 解析：By last year是过去时间，用过去完成时。"},{"id":"g2_english_l031_ex06","knowledge_id":"g2_english_l031","question":"单项选择：He had never _____ a UFO before. A. see  B. saw  C. seen  D. sees","answer":"答案：C. seen。解析：过去完成时 + never，see的过去分词是seen。整句：He had never seen a UFO before."},{"id":"g2_english_l031_ex07","knowledge_id":"g2_english_l031","question":"用所给词的适当形式填空：I ______ (just, finish) my homework when the phone rang.","answer":"答案：had just finished。解析：when the phone rang是一般过去时，从句用过去完成时。完整：I had just finished my homework when the phone rang."},{"id":"g2_english_l031_ex08","knowledge_id":"g2_english_l031","question":"单项选择：By the end of last term, we _____ 1000 words. A. learn  B. learned  C. have learned  D. had learned","answer":"答案：D. had learned。解析：By the end of last term是过去时间，主句用过去完成时。"},{"id":"g2_english_l031_ex09","knowledge_id":"g2_english_l031","question":"翻译句子：他说他已经买了那本书。","answer":"答案：He said that he had already bought the book. 解析：said是过去时，从句用过去完成时。"},{"id":"g2_english_l031_ex10","knowledge_id":"g2_english_l031","question":"单项选择：Until she came, I _____ for two hours. A. wait  B. waited  C. have waited  D. had waited","answer":"答案：D. had waited。解析：Until she came是过去时，从句用过去完成时。for two hours\"两小时\"。"},{"id":"g2_english_l032_ex01","knowledge_id":"g2_english_l032","question":"单项选择：I _____ my homework. A. finish  B. finished  C. have finished  D. will finish","answer":"答案：C. have finished。解析：现在完成时：have + 过去分词。"},{"id":"g2_english_l032_ex02","knowledge_id":"g2_english_l032","question":"单项选择：She _____ to Beijing twice. A. has been  B. have been  C. went  D. goes","answer":"答案：A. has been。解析：主语she用has。have been to\"去过\"。twice\"两次\"。"},{"id":"g2_english_l032_ex03","knowledge_id":"g2_english_l032","question":"用所给词的适当形式填空：We ______ (live) in this city for ten years.","answer":"答案：have lived。解析：for ten years\"十年\"，是现在完成时标志。完整：We have lived in this city for ten years."},{"id":"g2_english_l032_ex04","knowledge_id":"g2_english_l032","question":"单项选择：I _____ this book three times. A. read  B. reads  C. have read  D. will read","answer":"答案：C. have read。解析：three times是现在完成时标志。"},{"id":"g2_english_l032_ex05","knowledge_id":"g2_english_l032","question":"翻译句子：我已经看过这部电影了。","answer":"答案：I have already seen this movie. 解析：have + 过去分词seen。already\"已经\"。"},{"id":"g2_english_l032_ex06","knowledge_id":"g2_english_l032","question":"单项选择：He _____ in this school since 2020. A. study  B. studies  C. has studied  D. will study","answer":"答案：C. has studied。解析：since 2020是现在完成时标志。主语he用has。"},{"id":"g2_english_l032_ex07","knowledge_id":"g2_english_l032","question":"用所给词的适当形式填空：She ______ (be) a teacher for 20 years.","answer":"答案：has been。解析：for 20 years是现在完成时标志。完整：She has been a teacher for 20 years."},{"id":"g2_english_l032_ex08","knowledge_id":"g2_english_l032","question":"单项选择：They _____ in China since last year. A. live  B. lived  C. have lived  D. are living","answer":"答案：C. have lived。解析：since last year是现在完成时标志。"},{"id":"g2_english_l032_ex09","knowledge_id":"g2_english_l032","question":"翻译句子：我从来没见过这么美的风景。","answer":"答案：I have never seen such beautiful scenery. 解析：never\"从未\"是现在完成时标志。seen是see的过去分词。"},{"id":"g2_english_l032_ex10","knowledge_id":"g2_english_l032","question":"单项选择：I _____ my keys. I can't find them. A. lose  B. lost  C. have lost  D. will lose","answer":"答案：C. have lost。解析：现在完成时，I can't find是结果。lose的过去分词是lost。"},{"id":"g2_english_l033_ex01","knowledge_id":"g2_english_l033","question":"单项选择：I _____ this book yesterday. A. read  B. have read  C. am reading  D. will read","answer":"答案：A. read。解析：yesterday是一般过去时，强调过去时间。read的过去式是read（发音/red/）。"},{"id":"g2_english_l033_ex02","knowledge_id":"g2_english_l033","question":"单项选择：I _____ this book. I know the story well. A. read  B. have read  C. am reading  D. will read","answer":"答案：B. have read。解析：现在完成时强调与现在的联系（I know the story well）。"},{"id":"g2_english_l033_ex03","knowledge_id":"g2_english_l033","question":"用所给词的适当形式填空：I ______ (visit) my grandparents last weekend.","answer":"答案：visited。解析：last weekend是一般过去时。完整：I visited my grandparents last weekend."},{"id":"g2_english_l033_ex04","knowledge_id":"g2_english_l033","question":"单项选择：— Have you read this book? — Yes, I _____ it last month. A. read  B. reads  C. have read  D. will read","answer":"答案：A. read。解析：last month是过去时间，回答用一般过去时。read的过去式是read（发音/red/）。"},{"id":"g2_english_l033_ex05","knowledge_id":"g2_english_l033","question":"翻译句子：昨天我看了那本有趣的书。","answer":"答案：I read that interesting book yesterday. 解析：yesterday是一般过去时。"},{"id":"g2_english_l033_ex06","knowledge_id":"g2_english_l033","question":"单项选择：I _____ my hometown three years ago. A. leave  B. left  C. have left  D. will leave","answer":"答案：B. left。解析：three years ago是一般过去时。"},{"id":"g2_english_l033_ex07","knowledge_id":"g2_english_l033","question":"用所给词的适当形式填空：She ______ (be) to Paris three times.","answer":"答案：has been。解析：three times强调经历，用现在完成时。完整：She has been to Paris three times."},{"id":"g2_english_l033_ex08","knowledge_id":"g2_english_l033","question":"单项选择：He _____ in London in 2010. A. lives  B. lived  C. has lived  D. is living","answer":"答案：B. lived。解析：in 2010是过去具体时间，用一般过去时。"},{"id":"g2_english_l033_ex09","knowledge_id":"g2_english_l033","question":"翻译句子：我从来没有去过日本。","answer":"答案：I have never been to Japan. 解析：never\"从未\"是现在完成时标志。"},{"id":"g2_english_l033_ex10","knowledge_id":"g2_english_l033","question":"单项选择：I _____ this book before. A. read  B. reads  C. have read  D. will read","answer":"答案：C. have read。解析：before\"以前\"是现在完成时标志。"},{"id":"g2_english_l034_ex01","knowledge_id":"g2_english_l034","question":"单项选择：— Where is your father? — He _____ to Shanghai. A. has been  B. has gone  C. went  D. goes","answer":"答案：B. has gone。解析：has gone to\"去了还没回来\"，问在哪里说明不在这里。"},{"id":"g2_english_l034_ex02","knowledge_id":"g2_english_l034","question":"单项选择：I _____ to Beijing twice. A. have been  B. have gone  C. went  D. go","answer":"答案：A. have been。解析：have been to\"去过\"，强调经历。twice\"两次\"。"},{"id":"g2_english_l034_ex03","knowledge_id":"g2_english_l034","question":"用所给词的适当形式填空：She ______ (be) to Hong Kong before.","answer":"答案：has been。解析：before\"以前\"，have been to\"去过\"。完整：She has been to Hong Kong before."},{"id":"g2_english_l034_ex04","knowledge_id":"g2_english_l034","question":"单项选择：My brother _____ to London. He will be back next month. A. has been  B. has gone  C. went  D. goes","answer":"答案：B. has gone。解析：has gone to\"去了还没回来\"。He will be back说明还没回来。"},{"id":"g2_english_l034_ex05","knowledge_id":"g2_english_l034","question":"翻译句子：汤姆去哪了？他去图书馆了。","answer":"答案：Where is Tom? He has gone to the library. 解析：has gone to\"去了还没回来\"。"},{"id":"g2_english_l034_ex06","knowledge_id":"g2_english_l034","question":"单项选择：I have _____ this city for five years. A. been to  B. gone to  C. been in  D. gone in","answer":"答案：C. been in。解析：have been in\"在某地待了\"。for five years\"五年了\"。"},{"id":"g2_english_l034_ex07","knowledge_id":"g2_english_l034","question":"用所给词的适当形式填空：They ______ (be) to Australia three times.","answer":"答案：have been。解析：three times强调经历。完整：They have been to Australia three times."},{"id":"g2_english_l034_ex08","knowledge_id":"g2_english_l034","question":"单项选择：— Where is Mary? — She _____ to the post office. A. has been  B. has gone  C. went  D. goes","answer":"答案：B. has gone。解析：has gone to\"去了还没回来\"，问在哪里说明不在这里。"},{"id":"g2_english_l034_ex09","knowledge_id":"g2_english_l034","question":"翻译句子：她去过长城三次。","answer":"答案：She has been to the Great Wall three times. 解析：have been to\"去过\"，强调经历。three times\"三次\"。"},{"id":"g2_english_l034_ex10","knowledge_id":"g2_english_l034","question":"单项选择：My parents have _____ to many countries. A. been  B. gone  C. went  D. go","answer":"答案：A. been。解析：have been to\"去过\"，强调经历。many countries\"很多国家\"。"},{"id":"g2_english_l035_ex01","knowledge_id":"g2_english_l035","question":"单项选择：Have you ever _____ to Japan? A. go  B. went  C. been  D. gone","answer":"答案：C. been。解析：ever\"曾经\"是现在完成时标志。Have you ever been to...?\"你去过...吗？\""},{"id":"g2_english_l035_ex02","knowledge_id":"g2_english_l035","question":"单项选择：I have never _____ such a beautiful sunset. A. see  B. saw  C. seen  D. seeing","answer":"答案：C. seen。解析：never\"从未\"是现在完成时标志。see的过去分词是seen。"},{"id":"g2_english_l035_ex03","knowledge_id":"g2_english_l035","question":"用所给词的适当形式填空：______ (Have) you ever ______ (be) to the Great Wall?","answer":"答案：Have, been。解析：ever\"曾经\"是现在完成时标志。Have you ever been to...?\"你去过...吗？\"完整：Have you ever been to the Great Wall?"},{"id":"g2_english_l035_ex04","knowledge_id":"g2_english_l035","question":"单项选择：This is the first time I _____ a film. A. see  B. saw  C. have seen  D. will see","answer":"答案：C. have seen。解析：This is the first time...后面用现在完成时。"},{"id":"g2_english_l035_ex05","knowledge_id":"g2_english_l035","question":"翻译句子：你曾经去过国外吗？","answer":"答案：Have you ever been abroad? 解析：ever\"曾经\"是现在完成时标志。abroad\"在国外\"。"},{"id":"g2_english_l035_ex06","knowledge_id":"g2_english_l035","question":"单项选择：I have never _____ a UFO. A. see  B. saw  C. seen  D. seeing","answer":"答案：C. seen。解析：never\"从未\"是现在完成时标志。see的过去分词是seen。"},{"id":"g2_english_l035_ex07","knowledge_id":"g2_english_l035","question":"用所给词的适当形式填空：He ______ (never, eat) Japanese food.","answer":"答案：has never eaten。解析：never\"从未\"是现在完成时标志。完整：He has never eaten Japanese food."},{"id":"g2_english_l035_ex08","knowledge_id":"g2_english_l035","question":"单项选择：Have you ever _____ to Paris? A. be  B. been  C. was  D. were","answer":"答案：B. been。解析：ever\"曾经\"是现在完成时标志。Have you ever been to...?\"你去过...吗？\""},{"id":"g2_english_l035_ex09","knowledge_id":"g2_english_l035","question":"翻译句子：我从来没看过这么精彩的比赛。","answer":"答案：I have never seen such an exciting match. 解析：never\"从未\"是现在完成时标志。"},{"id":"g2_english_l035_ex10","knowledge_id":"g2_english_l035","question":"单项选择：This is _____ I have come to Beijing. A. one time  B. two times  C. the second time  D. many times","answer":"答案：C. the second time。解析：This is the + 序数词 + time...后面用现在完成时。"},{"id":"g2_english_l036_ex01","knowledge_id":"g2_english_l036","question":"单项选择：I _____ my homework. A. finish  B. finished  C. have finished  D. finishing","answer":"答案：C. have finished。解析：现在完成时肯定句：主语 + have/has + 过去分词。"},{"id":"g2_english_l036_ex02","knowledge_id":"g2_english_l036","question":"单项选择：He _____ finished his work. A. haven't  B. hasn't  C. don't  D. doesn't","answer":"答案：B. hasn't。解析：主语he用has，否定用hasn't。"},{"id":"g2_english_l036_ex03","knowledge_id":"g2_english_l036","question":"用所给词的适当形式填空：They ______ (have not, finish) the work yet.","answer":"答案：haven't finished。解析：主语they用have，否定用haven't。完整：They haven't finished the work yet."},{"id":"g2_english_l036_ex04","knowledge_id":"g2_english_l036","question":"单项选择：Have you _____ been to Beijing? A. ever  B. never  C. often  D. always","answer":"答案：A. ever。解析：ever\"曾经\"用于现在完成时一般疑问句。"},{"id":"g2_english_l036_ex05","knowledge_id":"g2_english_l036","question":"翻译句子：你完成作业了吗？","answer":"答案：Have you finished your homework? 解析：现在完成时一般疑问句：Have + 主语 + 过去分词？"},{"id":"g2_english_l036_ex06","knowledge_id":"g2_english_l036","question":"单项选择：— Have you read the book? — _____. A. Yes, I have  B. No, I have  C. Yes, I did  D. No, I don't","answer":"答案：A. Yes, I have。解析：现在完成时一般疑问句的肯定回答用Yes, 主语 + have/has。"},{"id":"g2_english_l036_ex07","knowledge_id":"g2_english_l036","question":"用所给词的适当形式填空：______ (Have) she ______ (be) to Paris before?","answer":"答案：Has, been。解析：主语she用Has。完整：Has she been to Paris before?"},{"id":"g2_english_l036_ex08","knowledge_id":"g2_english_l036","question":"单项选择：— Has he finished his work? — _____, he hasn't. A. Yes  B. No  C. Maybe  D. Perhaps","answer":"答案：B. No。解析：No, he hasn't是否定回答。整句：— Has he finished his work? — No, he hasn't."},{"id":"g2_english_l036_ex09","knowledge_id":"g2_english_l036","question":"翻译句子：我已经吃过早饭了。","answer":"答案：I have already had breakfast. 解析：have + 过去分词。had是have的过去分词。"},{"id":"g2_english_l036_ex10","knowledge_id":"g2_english_l036","question":"单项选择：I have not _____ my homework yet. A. finish  B. finishes  C. finished  D. finishing","answer":"答案：C. finished。解析：现在完成时否定：have not + 过去分词。finish的过去分词是finished。"},{"id":"g2_english_l037_ex01","knowledge_id":"g2_english_l037","question":"单项选择：My grandfather _____ for three years. A. died  B. has died  C. has been dead  D. is dead","answer":"答案：C. has been dead。解析：die是瞬间动词，不能与for three years直接连用，要转换为be dead。整句：My grandfather has been dead for three years."},{"id":"g2_english_l037_ex02","knowledge_id":"g2_english_l037","question":"单项选择：He _____ the company for two years. A. left  B. has left  C. has been away from  D. A and C","answer":"答案：D. A and C。解析：left是瞬间动词，与for two years连用要转换为has been away from。"},{"id":"g2_english_l037_ex03","knowledge_id":"g2_english_l037","question":"用所给词的适当形式填空：I ______ (buy) this bike for three years.","answer":"答案：have had。解析：buy是瞬间动词，要转换为have（拥有）。完整：I have had this bike for three years."},{"id":"g2_english_l037_ex04","knowledge_id":"g2_english_l037","question":"单项选择：She _____ the club since 2010. A. joined  B. has joined  C. has been a member of  D. A and C","answer":"答案：C. has been a member of。解析：join是瞬间动词，要转换为be a member of。"},{"id":"g2_english_l037_ex05","knowledge_id":"g2_english_l037","question":"翻译句子：这本书我已经借了三天了。","answer":"答案：I have kept this book for three days. 解析：borrow是瞬间动词，要转换为keep（保留）。"},{"id":"g2_english_l037_ex06","knowledge_id":"g2_english_l037","question":"单项选择：The class _____ for ten minutes. A. started  B. has started  C. has been on  D. A and C","answer":"答案：C. has been on。解析：start是瞬间动词，要转换为be on（进行中）。"},{"id":"g2_english_l037_ex07","knowledge_id":"g2_english_l037","question":"用所给词的适当形式填空：He ______ (arrive) here for two weeks.","answer":"答案：has been in。解析：arrive是瞬间动词，要转换为be in。完整：He has been in here for two weeks."},{"id":"g2_english_l037_ex08","knowledge_id":"g2_english_l037","question":"单项选择：The meeting _____ for an hour. A. finished  B. has finished  C. has been over  D. A and C","answer":"答案：C. has been over。解析：finish是瞬间动词，要转换为be over（结束）。"},{"id":"g2_english_l037_ex09","knowledge_id":"g2_english_l037","question":"翻译句子：他离开这个城市已经五年了。","answer":"答案：He has been away from this city for five years. 解析：leave是瞬间动词，要转换为be away from。"},{"id":"g2_english_l037_ex10","knowledge_id":"g2_english_l037","question":"单项选择：She _____ the company for three years. A. married  B. has married  C. has been married to  D. A and C","answer":"答案：C. has been married to。解析：marry是瞬间动词，要转换为be married to（与...结婚的状态）。"},{"id":"g2_english_l038_ex01","knowledge_id":"g2_english_l038","question":"单项选择：I have _____ finished my homework. A. yet  B. already  C. still  D. ever","answer":"答案：B. already。解析：already用于现在完成时肯定句，放在have和过去分词之间。"},{"id":"g2_english_l038_ex02","knowledge_id":"g2_english_l038","question":"单项选择：Have you finished your work _____? A. yet  B. already  C. just  D. still","answer":"答案：A. yet。解析：yet用于现在完成时一般疑问句，放在句末。"},{"id":"g2_english_l038_ex03","knowledge_id":"g2_english_l038","question":"用所给词的适当形式填空：He hasn't arrived ______ (yet/already).","answer":"答案：yet。解析：yet用于现在完成时否定句句末。完整：He hasn't arrived yet."},{"id":"g2_english_l038_ex04","knowledge_id":"g2_english_l038","question":"单项选择：She is _____ sleeping. A. already  B. yet  C. just  D. still","answer":"答案：D. still。解析：still\"仍然\"，表示动作持续进行，可以用于各种时态。"},{"id":"g2_english_l038_ex05","knowledge_id":"g2_english_l038","question":"翻译句子：你已经完成作业了吗？","answer":"答案：Have you finished your homework yet? 解析：yet用于现在完成时一般疑问句句末。"},{"id":"g2_english_l038_ex06","knowledge_id":"g2_english_l038","question":"单项选择：I have _____ finished my work. A. just  B. already  C. ever  D. A and B","answer":"答案：D. A and B。解析：just/already都可用于现在完成时肯定句。"},{"id":"g2_english_l038_ex07","knowledge_id":"g2_english_l038","question":"用所给词的适当形式填空：______ (Still) no one has answered my question.","answer":"答案：Still。解析：still\"仍然\"，可以用于现在完成时。完整：Still no one has answered my question."},{"id":"g2_english_l038_ex08","knowledge_id":"g2_english_l038","question":"单项选择：He hasn't come back _____. A. already  B. yet  C. just  D. still","answer":"答案：B. yet。解析：yet用于现在完成时否定句句末。"},{"id":"g2_english_l038_ex09","knowledge_id":"g2_english_l038","question":"翻译句子：我刚刚看过这本书。","answer":"答案：I have just read this book. 解析：just\"刚刚\"用于现在完成时肯定句。read的过去分词是read。"},{"id":"g2_english_l038_ex10","knowledge_id":"g2_english_l038","question":"单项选择：She has _____ been to Paris. A. yet  B. already  C. still  D. ever","answer":"答案：B. already。解析：already用于现在完成时肯定句。"},{"id":"g2_english_l039_ex01","knowledge_id":"g2_english_l039","question":"单项选择：Have you finished your homework _____? A. yet  B. already  C. just  D. still","answer":"答案：A. yet。解析：yet用于现在完成时一般疑问句句末。"},{"id":"g2_english_l039_ex02","knowledge_id":"g2_english_l039","question":"单项选择：I have _____ finished my work. A. yet  B. already  C. ever  D. never","answer":"答案：B. already。解析：already用于现在完成时肯定句。already可以放在have之后或句末。"},{"id":"g2_english_l039_ex03","knowledge_id":"g2_english_l039","question":"用所给词的适当形式填空：I ______ (have not, hear) from him yet.","answer":"答案：haven't heard。解析：yet用于现在完成时否定句句末。完整：I haven't heard from him yet."},{"id":"g2_english_l039_ex04","knowledge_id":"g2_english_l039","question":"单项选择：— Have you finished it _____? — Yes, I have. A. yet  B. already  C. just  D. ever","answer":"答案：A. yet。解析：yet用于现在完成时一般疑问句。肯定回答Yes, I have后可以接already。"},{"id":"g2_english_l039_ex05","knowledge_id":"g2_english_l039","question":"翻译句子：你已经吃过早饭了吗？","answer":"答案：Have you had breakfast yet? 解析：yet用于现在完成时一般疑问句句末。"},{"id":"g2_english_l039_ex06","knowledge_id":"g2_english_l039","question":"单项选择：I haven't received the letter _____. A. already  B. yet  C. just  D. ever","answer":"答案：B. yet。解析：yet用于现在完成时否定句句末。"},{"id":"g2_english_l039_ex07","knowledge_id":"g2_english_l039","question":"用所给词的适当形式填空：She has ______ (already) left.","answer":"答案：already。解析：already用于现在完成时肯定句。完整：She has already left."},{"id":"g2_english_l039_ex08","knowledge_id":"g2_english_l039","question":"单项选择：— Have you _____ been to Beijing? — Yes, I have. A. yet  B. already  C. ever  D. just","answer":"答案：C. ever。解析：ever\"曾经\"用于现在完成时一般疑问句。"},{"id":"g2_english_l039_ex09","knowledge_id":"g2_english_l039","question":"翻译句子：他已经完成了他的工作。","answer":"答案：He has already finished his work. 解析：already用于现在完成时肯定句。"},{"id":"g2_english_l039_ex10","knowledge_id":"g2_english_l039","question":"单项选择：I have _____ finished my homework. Can I play now? A. already  B. yet  C. still  D. ever","answer":"答案：A. already。解析：already用于现在完成时肯定句，表示已经完成。"},{"id":"g2_english_l040_ex01","knowledge_id":"g2_english_l040","question":"单项选择：I have _____ finished my work. A. already  B. yet  C. just  D. A and C","answer":"答案：D. A and C。解析：already/just都可用于现在完成时肯定句。already\"已经\"，just\"刚刚\"。"},{"id":"g2_english_l040_ex02","knowledge_id":"g2_english_l040","question":"单项选择：Have you seen him _____? A. recently  B. lately  C. just now  D. A and B","answer":"答案：D. A and B。解析：recently/lately\"最近\"用于现在完成时。just now（刚才）用于一般过去时。"},{"id":"g2_english_l040_ex03","knowledge_id":"g2_english_l040","question":"用所给词的适当形式填空：I ______ (have not, see) him recently.","answer":"答案：haven't seen。解析：recently是现在完成时标志。完整：I haven't seen him recently."},{"id":"g2_english_l040_ex04","knowledge_id":"g2_english_l040","question":"单项选择：So far, I _____ three books this month. A. read  B. reads  C. have read  D. am reading","answer":"答案：C. have read。解析：so far\"到目前为止\"是现在完成时标志。"},{"id":"g2_english_l040_ex05","knowledge_id":"g2_english_l040","question":"翻译句子：到目前为止我已经学了十个单元。","answer":"答案：So far I have learned ten units. 解析：so far\"到目前为止\"是现在完成时标志。"},{"id":"g2_english_l040_ex06","knowledge_id":"g2_english_l040","question":"单项选择：I haven't seen him _____. A. already  B. yet  C. just  D. still","answer":"答案：B. yet。解析：yet用于现在完成时否定句句末。"},{"id":"g2_english_l040_ex07","knowledge_id":"g2_english_l040","question":"用所给词的适当形式填空：She ______ (have, just) come back from school.","answer":"答案：has just。解析：just\"刚刚\"用于现在完成时。完整：She has just come back from school."},{"id":"g2_english_l040_ex08","knowledge_id":"g2_english_l040","question":"单项选择：I have _____ visited many places this year. A. already  B. yet  C. ever  D. never","answer":"答案：A. already。解析：already用于现在完成时肯定句。"},{"id":"g2_english_l040_ex09","knowledge_id":"g2_english_l040","question":"翻译句子：最近我一直在学英语。","answer":"答案：I have been studying English recently. 解析：recently\"最近\"，现在完成进行时或现在完成时皆可。"},{"id":"g2_english_l040_ex10","knowledge_id":"g2_english_l040","question":"单项选择：Have you _____ been to the United States? A. ever  B. yet  C. just  D. already","answer":"答案：A. ever。解析：ever\"曾经\"用于现在完成时一般疑问句。"},{"id":"g2_english_l041_ex01","knowledge_id":"g2_english_l041","question":"单项选择：— Have you ever been to the Great Wall? — _____. A. Yes, I have  B. No, I haven't  C. Yes, I did  D. A and B","answer":"答案：D. A and B。解析：现在完成时一般疑问句的回答用Yes, I have / No, I haven't。"},{"id":"g2_english_l041_ex02","knowledge_id":"g2_english_l041","question":"单项选择：— Have you finished it yet? — _____. A. Yes, I have  B. No, not yet  C. Yes, I have already  D. All of the above","answer":"答案：D. All of the above。解析：多种回答方式都可以。"},{"id":"g2_english_l041_ex03","knowledge_id":"g2_english_l041","question":"用所给词的适当形式填空：— ______ (How long) have you lived here? — For ten years.","answer":"答案：How long。解析：How long\"多久\"询问持续时间，回答用for+时间段。完整：— How long have you lived here? — For ten years."},{"id":"g2_english_l041_ex04","knowledge_id":"g2_english_l041","question":"单项选择：I have lived in Beijing _____ five years. A. since  B. for  C. in  D. on","answer":"答案：B. for。解析：for+时间段，\"五年了\"。since+起点时间。整句：I have lived in Beijing for five years."},{"id":"g2_english_l041_ex05","knowledge_id":"g2_english_l041","question":"翻译句子：你在这里住了多久了？","answer":"答案：How long have you lived here? 解析：How long\"多久\"用于现在完成时。"},{"id":"g2_english_l041_ex06","knowledge_id":"g2_english_l041","question":"单项选择：I have studied English _____ 2020. A. since  B. for  C. in  D. on","answer":"答案：A. since。解析：since+起点时间，\"自从2020年以来\"。整句：I have studied English since 2020."},{"id":"g2_english_l041_ex07","knowledge_id":"g2_english_l041","question":"用所给词的适当形式填空：— Have you ______ (ever, be) to the US? — Yes, I have.","answer":"答案：ever been。解析：ever\"曾经\"用于现在完成时一般疑问句。完整：— Have you ever been to the US? — Yes, I have."},{"id":"g2_english_l041_ex08","knowledge_id":"g2_english_l041","question":"单项选择：— How long have you been a teacher? — _____ 2015. A. For  B. Since  C. In  D. On","answer":"答案：B. Since。解析：How long提问用Since+起点时间回答。整句：— How long have you been a teacher? — Since 2015."},{"id":"g2_english_l041_ex09","knowledge_id":"g2_english_l041","question":"翻译句子：我已经学了英语五年了。","answer":"答案：I have learned/studied English for five years. 解析：for+时间段是现在完成时标志。"},{"id":"g2_english_l041_ex10","knowledge_id":"g2_english_l041","question":"单项选择：I haven't seen him for _____ years. A. many  B. several  C. a few  D. All of the above","answer":"答案：D. All of the above。解析：many/several/a few都可以修饰复数可数名词years，都可与现在完成时连用。"},{"id":"g2_english_l042_ex01","knowledge_id":"g2_english_l042","question":"单项选择：I _____ this book yesterday. A. read  B. have read  C. am reading  D. will read","answer":"答案：A. read。解析：yesterday是过去具体时间，用一般过去时。"},{"id":"g2_english_l042_ex02","knowledge_id":"g2_english_l042","question":"单项选择：I _____ this book. I know the story well. A. read  B. have read  C. am reading  D. will read","answer":"答案：B. have read。解析：I know the story well说明对现在的影响，用现在完成时。"},{"id":"g2_english_l042_ex03","knowledge_id":"g2_english_l042","question":"用所给词的适当形式填空：She ______ (go) to Shanghai last year.","answer":"答案：went。解析：last year是过去具体时间，用一般过去时。go的过去式是went。完整：She went to Shanghai last year."},{"id":"g2_english_l042_ex04","knowledge_id":"g2_english_l042","question":"单项选择：She _____ to Shanghai three times. A. has been  B. went  C. has gone  D. goes","answer":"答案：A. has been。解析：three times强调经历，用现在完成时。have been to\"去过\"。"},{"id":"g2_english_l042_ex05","knowledge_id":"g2_english_l042","question":"翻译句子：我昨天去了公园。","answer":"答案：I went to the park yesterday. 解析：yesterday是过去具体时间，用一般过去时。go的过去式是went。"},{"id":"g2_english_l042_ex06","knowledge_id":"g2_english_l042","question":"单项选择：I have _____ been to the Great Wall. A. ever  B. never  C. already  D. just","answer":"答案：B. never。解析：never\"从未\"，强调过去的经历对现在的影响，用现在完成时。"},{"id":"g2_english_l042_ex07","knowledge_id":"g2_english_l042","question":"用所给词的适当形式填空：I ______ (just, finish) my homework.","answer":"答案：have just finished。解析：just\"刚刚\"是现在完成时标志。完整：I have just finished my homework."},{"id":"g2_english_l042_ex08","knowledge_id":"g2_english_l042","question":"单项选择：— Did you see him yesterday? — _____. A. Yes, I do  B. No, I didn't  C. Yes, I have  D. No, I haven't","answer":"答案：B. No, I didn't。解析：Did you see...?是一般过去时一般疑问句，否定回答用No, I didn't。"},{"id":"g2_english_l042_ex09","knowledge_id":"g2_english_l042","question":"翻译句子：到目前为止我已经学了十个单元。","answer":"答案：So far I have learned ten units. 解析：so far\"到目前为止\"是现在完成时标志。"},{"id":"g2_english_l042_ex10","knowledge_id":"g2_english_l042","question":"单项选择：I _____ him since 2020. A. know  B. knew  C. have known  D. will know","answer":"答案：C. have known。解析：since 2020是现在完成时标志。"},{"id":"g2_english_u001_ex01","knowledge_id":"g2_english_u001","question":"单项选择：I _____ to the park with my friends yesterday afternoon. A. go  B. went  C. will go  D. have gone","answer":"答案：B. went。解析：句末的yesterday afternoon是一般过去时的时间状语，谓语动词需用过去式went。go的过去式是went（不规则变化）。"},{"id":"g2_english_u001_ex02","knowledge_id":"g2_english_u001","question":"用所给词的适当形式填空：He ______ (visit) his grandparents last weekend.","answer":"答案：visited。解析：last weekend是一般过去时的标志时间状语，visit是规则动词，过去式直接加-ed，即visited。"},{"id":"g2_english_u001_ex03","knowledge_id":"g2_english_u001","question":"单项选择：_____ you _____ a good time at the party last night? A. Do, have  B. Did, have  C. Were, having  D. Have, had","answer":"答案：B. Did, have。解析：last night是一般过去时标志，主句用一般疑问句结构Did + 主语 + 动词原形。have的过去式是had，但用在助动词did之后要还原为原形have。"},{"id":"g2_english_u001_ex04","knowledge_id":"g2_english_u001","question":"句型转换：I went to Beijing last summer. （改为否定句）","answer":"答案：I didn't go to Beijing last summer. 解析：一般过去时否定句结构：主语 + didn't + 动词原形 + 其他。went是go的过去式，需还原为原形go。"},{"id":"g2_english_u001_ex05","knowledge_id":"g2_english_u001","question":"单项选择：There _____ a book and two pens on the desk just now. A. is  B. was  C. were  D. are","answer":"答案：B. was。解析：just now（刚才）是一般过去时标志。There be句型中，be动词的选择采用就近原则：a book是单数，所以用was。"},{"id":"g2_english_u001_ex06","knowledge_id":"g2_english_u001","question":"翻译句子：我昨天在图书馆里看了一本有趣的书。","answer":"答案：I read an interesting book in the library yesterday. 解析：read的过去式仍是read（发音为/red/），与原形同形。interesting是形容词修饰book，yesterday是过去时的时间状语。"},{"id":"g2_english_u001_ex07","knowledge_id":"g2_english_u001","question":"单项选择：Tom and Jerry _____ in the same class two years ago. A. are  B. were  C. was  D. is","answer":"答案：B. were。解析：two years ago（两年前）是一般过去时标志。主语Tom and Jerry是复数，be动词用were。"},{"id":"g2_english_u001_ex08","knowledge_id":"g2_english_u001","question":"用所给词的适当形式填空：She ______ (buy) a new dress for the party yesterday.","answer":"答案：bought。解析：yesterday提示一般过去时。buy是不规则动词，过去式是bought（不能写buyed）。"},{"id":"g2_english_u001_ex09","knowledge_id":"g2_english_u001","question":"单项选择：The weather _____ fine last Sunday. We _____ a good time. A. is, have  B. was, had  C. were, have  D. is, had","answer":"答案：B. was, had。解析：last Sunday是一般过去时标志。The weather是不可数名词，be动词用was；have的过去式是had。"},{"id":"g2_english_u001_ex10","knowledge_id":"g2_english_u001","question":"改写句子：Did you see the film? （作肯定回答）","answer":"答案：Yes, I did. 解析：一般过去时一般疑问句的简略回答用Yes, 主语 + did / No, 主语 + didn't。注意不能用saw，要用助动词did。"},{"id":"g2_english_u002_ex01","knowledge_id":"g2_english_u002","question":"单项选择：She _____ her homework an hour ago. A. finished  B. finish  C. finishes  D. finishing","answer":"答案：A. finished。解析：an hour ago是一般过去时时间状语。finish是规则动词，以sh结尾加-ed，变为finished。"},{"id":"g2_english_u002_ex02","knowledge_id":"g2_english_u002","question":"用所给词的适当形式填空：They ______ (play) football on the playground just now.","answer":"答案：played。解析：just now（刚才）是一般过去时。play以元音+y结尾，直接加-ed变played。"},{"id":"g2_english_u002_ex03","knowledge_id":"g2_english_u002","question":"单项选择：I _____ my keys under the table just now. A. look  B. looked  C. look for  D. looked for","answer":"答案：D. looked for。解析：just now是一般过去时标志。look for（寻找）是动词短语，规则变化加-ed变成looked for。"},{"id":"g2_english_u002_ex04","knowledge_id":"g2_english_u002","question":"用所给词的适当形式填空：The little girl ______ (cry) loudly last night.","answer":"答案：cried。解析：last night是一般过去时。cry以辅音+y结尾，变y为i加-ed，变成cried。"},{"id":"g2_english_u002_ex05","knowledge_id":"g2_english_u002","question":"单项选择：The teacher _____ us a story yesterday. A. tell  B. told  C. tells  D. telling","answer":"答案：B. told。解析：yesterday提示一般过去时。tell是不规则动词，过去式是told。"},{"id":"g2_english_u002_ex06","knowledge_id":"g2_english_u002","question":"用所给词的适当形式填空：Tom ______ (stop) the car and got off.","answer":"答案：stopped。解析：stop以重读闭音节结尾，末尾只有一个辅音字母p，需双写p再加-ed，变成stopped。"},{"id":"g2_english_u002_ex07","knowledge_id":"g2_english_u002","question":"单项选择：The movie _____ ten minutes ago. A. start  B. started  C. starts  D. starting","answer":"答案：B. started。解析：ten minutes ago是一般过去时。start是规则动词，末尾辅音字母前是元音组合ar，直接加-ed变started。"},{"id":"g2_english_u002_ex08","knowledge_id":"g2_english_u002","question":"用所给词的适当形式填空：The children ______ (study) English at school last year.","answer":"答案：studied。解析：last year是一般过去时。study以辅音+y结尾，变y为i加-ed，变成studied。"},{"id":"g2_english_u002_ex09","knowledge_id":"g2_english_u002","question":"单项选择：It _____ heavily when I left home this morning. A. rain  B. rained  C. rains  D. raining","answer":"答案：B. rained。解析：this morning是过去时时间。rain是规则动词，末尾辅音字母前是元音ai，直接加-ed变rained。"},{"id":"g2_english_u002_ex10","knowledge_id":"g2_english_u002","question":"用所给词的适当形式填空：My mother ______ (live) in Beijing for ten years, but now she lives in Shanghai.","answer":"答案：lived。解析：live以e结尾，加-d变成lived。for ten years表明过去持续的动作发生在过去。"},{"id":"g2_english_u003_ex01","knowledge_id":"g2_english_u003","question":"单项选择：I _____ my grandparents last Sunday. A. visited  B. visit  C. am visiting  D. visit","answer":"答案：A. visited。解析：visit是规则动词，过去式加-ed变visited，与last Sunday过去时搭配。"},{"id":"g2_english_u003_ex02","knowledge_id":"g2_english_u003","question":"用所给词的适当形式填空：He ______ (go) to the park yesterday morning.","answer":"答案：went。解析：yesterday morning是一般过去时。go是不规则动词，过去式是went，不能写goed。"},{"id":"g2_english_u003_ex03","knowledge_id":"g2_english_u003","question":"单项选择：I _____ a new bike from my father last birthday. A. receive  B. received  C. got  D. B and C","answer":"答案：D. B and C。解析：last birthday是一般过去时。receive（规则）过去式received，get（不规则）过去式got，两者都正确。"},{"id":"g2_english_u003_ex04","knowledge_id":"g2_english_u003","question":"用所给词的适当形式填空：She ______ (eat) three hamburgers just now.","answer":"答案：ate。解析：just now（刚才）是一般过去时。eat是不规则动词，过去式是ate，不能写eated。"},{"id":"g2_english_u003_ex05","knowledge_id":"g2_english_u003","question":"单项选择：We _____ a good time at Mary's party last night. A. had  B. have  C. has  D. having","answer":"答案：A. had。解析：last night是一般过去时。have是不规则动词，过去式是had。have a good time意思是\"玩得开心\"。"},{"id":"g2_english_u003_ex06","knowledge_id":"g2_english_u003","question":"用所给词的适当形式填空：I ______ (see) an interesting film last weekend.","answer":"答案：saw。解析：last weekend是一般过去时。see是不规则动词，过去式是saw，不能写seed或seeed。"},{"id":"g2_english_u003_ex07","knowledge_id":"g2_english_u003","question":"单项选择：My father _____ me a new computer as a birthday present. A. buy  B. buys  C. bought  D. buying","answer":"答案：C. bought。解析：句意暗示过去发生的事。buy是不规则动词，过去式是bought。"},{"id":"g2_english_u003_ex08","knowledge_id":"g2_english_u003","question":"用所给词的适当形式填空：They ______ (make) a cake for me yesterday.","answer":"答案：made。解析：yesterday是一般过去时。make是不规则动词，过去式是made，与原形拼写不同。"},{"id":"g2_english_u003_ex09","knowledge_id":"g2_english_u003","question":"单项选择：She _____ her keys in the classroom this morning. A. forget  B. forgot  C. forgotten  D. forgets","answer":"答案：B. forgot。解析：this morning是一般过去时。forget是不规则动词，过去式是forgot，过去分词是forgotten。"},{"id":"g2_english_u003_ex10","knowledge_id":"g2_english_u003","question":"用所给词的适当形式填空：I ______ (read) an English book last night.","answer":"答案：read。解析：last night是一般过去时。read是不规则动词，过去式与原形同形，但发音变为/red/。"},{"id":"g2_english_u004_ex01","knowledge_id":"g2_english_u004","question":"单项选择：_____ he _____ to the cinema yesterday? A. Does, go  B. Did, went  C. Did, go  D. Was, go","answer":"答案：C. Did, go。解析：yesterday是一般过去时。did是助动词，后面的动词必须用原形。"},{"id":"g2_english_u004_ex02","knowledge_id":"g2_english_u004","question":"句型转换：She watched TV last night. （改为一般疑问句）","answer":"答案：Did she watch TV last night? 解析：一般过去时一般疑问句的结构是Did + 主语 + 动词原形 + 其他？watched要还原为原形watch。"},{"id":"g2_english_u004_ex03","knowledge_id":"g2_english_u004","question":"单项选择：Tom _____ come to school yesterday because he was ill. A. doesn't  B. isn't  C. didn't  D. wasn't","answer":"答案：C. didn't。解析：yesterday是一般过去时。主语Tom是第三人称单数，但didn't是助动词did的否定形式，didn't后接动词原形come。"},{"id":"g2_english_u004_ex04","knowledge_id":"g2_english_u004","question":"句型转换：I played football yesterday. （改为否定句）","answer":"答案：I didn't play football yesterday. 解析：一般过去时否定句结构：主语 + didn't + 动词原形 + 其他。played还原为play。"},{"id":"g2_english_u004_ex05","knowledge_id":"g2_english_u004","question":"单项选择：_____ you _____ the book last week? A. Do, read  B. Did, read  C. Did, readed  D. Were, read","answer":"答案：B. Did, read。解析：last week是一般过去时。一般疑问句用Did + 主语 + 动词原形，read的过去式是read，但did之后必须用原形。"},{"id":"g2_english_u004_ex06","knowledge_id":"g2_english_u004","question":"用所给词的适当形式填空：They ______ (not, see) the movie last night.","answer":"答案：didn't see。解析：last night是一般过去时。否定句用didn't + 动词原形。see的过去式是saw，但在didn't后用原形see。"},{"id":"g2_english_u004_ex07","knowledge_id":"g2_english_u004","question":"单项选择：When _____ you _____ your homework this morning? A. did, finish  B. did, finished  C. do, finish  D. were, finish","answer":"答案：A. did, finish。解析：this morning是一般过去时。特殊疑问句用疑问词 + 助动词did + 主语 + 动词原形。"},{"id":"g2_english_u004_ex08","knowledge_id":"g2_english_u004","question":"句型转换：Did you go to the park? （作否定回答）","answer":"答案：No, I didn't. 解析：一般过去时一般疑问句的否定回答用No, 主语 + didn't。"},{"id":"g2_english_u004_ex09","knowledge_id":"g2_english_u004","question":"单项选择：He _____ buy any books yesterday. A. doesn't  B. didn't  C. don't  D. wasn't","answer":"答案：B. didn't。解析：yesterday是一般过去时。一般过去时否定句：主语 + didn't + 动词原形。"},{"id":"g2_english_u004_ex10","knowledge_id":"g2_english_u004","question":"句型转换：I saw the film yesterday. （改为一般疑问句并作肯定回答）","answer":"答案：Did you see the film yesterday? Yes, I did. 解析：一般过去时一般疑问句用Did开头；saw还原为see。肯定回答用Yes, I did。"},{"id":"g2_english_u005_ex01","knowledge_id":"g2_english_u005","question":"单项选择：_____ did you go on vacation last summer? A. What  B. Where  C. When  D. Who","answer":"答案：B. Where。解析：go on vacation搭配where询问地点。"},{"id":"g2_english_u005_ex02","knowledge_id":"g2_english_u005","question":"用所给词的适当形式填空：Excuse me, could you tell me where the post office ______ (be)?","answer":"答案：is。解析：Where引导的宾语从句，从句用陈述语序。post office是单数，用is。"},{"id":"g2_english_u005_ex03","knowledge_id":"g2_english_u005","question":"单项选择：— Where _____ you last weekend? — I _____ to the beach with my family. A. were, went  B. are, go  C. were, go  D. did, went","answer":"答案：A. were, went。解析：last weekend是一般过去时。第一句where后接be动词，were是过去式；第二句I后接动词过去式went。"},{"id":"g2_english_u005_ex04","knowledge_id":"g2_english_u005","question":"句型转换：I went to Mount Tai. （就划线部分提问）","answer":"答案：Where did you go? 解析：对地点Mount Tai提问用Where。特殊疑问句结构：Where + did + 主语 + 动词原形？went还原为go。"},{"id":"g2_english_u005_ex05","knowledge_id":"g2_english_u005","question":"单项选择：She asked me where _____ the next day. A. did I go  B. I went  C. I will go  D. I go","answer":"答案：B. I went。解析：where引导的宾语从句用陈述语序（主语+谓语），时态需与主句呼应。asked是过去时，从句也用过去时went。"},{"id":"g2_english_u005_ex06","knowledge_id":"g2_english_u005","question":"翻译句子：你能告诉我最近的医院在哪里吗？","answer":"答案：Could you tell me where the nearest hospital is? 解析：Where引导宾语从句，从句用陈述语序。the nearest hospital is是陈述语序。"},{"id":"g2_english_u005_ex07","knowledge_id":"g2_english_u005","question":"单项选择：I don't know _____ she went yesterday. A. where  B. what  C. when  D. who","answer":"答案：A. where。解析：宾语从句中where引导地点状语。yesterday提示主句和从句都涉及过去，但从句用where引导，go是过去式。"},{"id":"g2_english_u005_ex08","knowledge_id":"g2_english_u005","question":"用所给词的适当形式填空：Can you tell me where ______ (find) the bookshop?","answer":"答案：to find。解析：where to do结构，疑问词+不定式作宾语。"},{"id":"g2_english_u005_ex09","knowledge_id":"g2_english_u005","question":"单项选择：Do you know _____ she lives? A. where  B. where do  C. where does  D. which","answer":"答案：A. where。解析：宾语从句用陈述语序。lives是第三人称单数现在时，从句本身结构完整。"},{"id":"g2_english_u005_ex10","knowledge_id":"g2_english_u005","question":"句型转换：The library is on the second floor. （就划线部分提问）","answer":"答案：Where is the library? 解析：对地点on the second floor提问用where。注意：原文on the second floor是表语，不影响主语is的位置。"},{"id":"g2_english_u006_ex01","knowledge_id":"g2_english_u006","question":"单项选择：There is _____ in the box. It's empty. A. something  B. anything  C. nothing  D. everything","answer":"答案：C. nothing。解析：It's empty（它是空的）说明盒子里没有东西。nothing意为\"没有东西\"，符合语境。"},{"id":"g2_english_u006_ex02","knowledge_id":"g2_english_u006","question":"用所给词的适当形式填空：He has ______ (some) money in his pocket.","answer":"答案：some。解析：some可以修饰不可数名词money。注意：some常用在肯定句中，any用在否定和疑问句中。"},{"id":"g2_english_u006_ex03","knowledge_id":"g2_english_u006","question":"单项选择：I don't have _____ to do this evening. A. something  B. anything  C. nothing  D. everything","answer":"答案：B. anything。解析：don't是否定标志，复合不定代词用anything（任何事）。"},{"id":"g2_english_u006_ex04","knowledge_id":"g2_english_u006","question":"单项选择：Is there _____ in the classroom? A. something  B. anything  C. nothing  D. everyone","answer":"答案：B. anything。解析：一般疑问句中用anything。"},{"id":"g2_english_u006_ex05","knowledge_id":"g2_english_u006","question":"用所给词的适当形式填空：______ (Someone/Anyone) can answer this question.","answer":"答案：Anyone。解析：anyone意思是\"任何人\"，用于肯定句中表示\"无论谁\"。"},{"id":"g2_english_u006_ex06","knowledge_id":"g2_english_u006","question":"单项选择：_____ is ready for the party. A. Anything  B. Something  C. Everything  D. Nothing","answer":"答案：C. Everything。解析：is ready表示准备就绪，everything意为\"一切/所有事\"。"},{"id":"g2_english_u006_ex07","knowledge_id":"g2_english_u006","question":"单项选择：I saw _____ in the park yesterday. A. anyone  B. someone  C. everyone  D. nobody","answer":"答案：B. someone。解析：一般过去时，肯定句中用someone（某人）。saw是过去式。"},{"id":"g2_english_u006_ex08","knowledge_id":"g2_english_u006","question":"用所给词的适当形式填空：Don't tell ______ (anyone) about it. It's a secret.","answer":"答案：anyone。解析：Don't开头的祈使句是否定句，用anyone。"},{"id":"g2_english_u006_ex09","knowledge_id":"g2_english_u006","question":"单项选择：There is _____ wrong with my bike. It doesn't work. A. something  B. anything  C. nothing  D. everything","answer":"答案：A. something。解析：There is something wrong with...是固定句型，意为\"...出了毛病\"。"},{"id":"g2_english_u006_ex10","knowledge_id":"g2_english_u006","question":"单项选择：— Is there _____ in the box? — No, _____. A. something, nothing  B. anything, nothing  C. anything, there isn't  D. anything, none","answer":"答案：B. anything, nothing。解析：一般疑问句用anything；否定回答用nothing。"},{"id":"g2_english_u007_ex01","knowledge_id":"g2_english_u007","question":"单项选择：We had a party _____ last month. A. ago  B. last  C. yesterday  D. since","answer":"答案：B. last。解析：last + 时间单位（last month上月）是过去时常用时间状语。"},{"id":"g2_english_u007_ex02","knowledge_id":"g2_english_u007","question":"单项选择：I saw him _____ morning. A. tomorrow  B. yesterday  C. next  D. every","answer":"答案：B. yesterday。解析：yesterday morning（昨天上午）是一般过去时的时间状语。"},{"id":"g2_english_u007_ex03","knowledge_id":"g2_english_u007","question":"用所给词的适当形式填空：They ______ (go) to the cinema three days ______ (ago).","answer":"答案：went, ago。解析：three days ago（三天前）是一般过去时。go是不规则动词，过去式是went。"},{"id":"g2_english_u007_ex04","knowledge_id":"g2_english_u007","question":"单项选择：She visited her uncle _____ last summer. A. ago  B. the day before yesterday  C. last  D. just now","answer":"答案：C. last。解析：last summer（去年夏天）是一般过去时时间状语。"},{"id":"g2_english_u007_ex05","knowledge_id":"g2_english_u007","question":"单项选择：He was born _____ 2010. A. ago  B. last  C. in  D. since","answer":"答案：C. in。解析：in + 年份表示在某一年，出生在过去某一年用一般过去时。"},{"id":"g2_english_u007_ex06","knowledge_id":"g2_english_u007","question":"用所给词的适当形式填空：It ______ (snow) heavily last night.","answer":"答案：snowed。解析：last night（昨晚）是一般过去时。snow是规则动词，加-ed变snowed。"},{"id":"g2_english_u007_ex07","knowledge_id":"g2_english_u007","question":"单项选择：My family moved to Beijing _____. A. last year  B. tomorrow  C. next week  D. now","answer":"答案：A. last year。解析：last year（去年）是一般过去时。"},{"id":"g2_english_u007_ex08","knowledge_id":"g2_english_u007","question":"单项选择：I met your brother _____ the day before yesterday. A. last  B. the day  C. in  D. on","answer":"答案：B. the day。解析：the day before yesterday（前天）是一般过去时时间状语。"},{"id":"g2_english_u007_ex09","knowledge_id":"g2_english_u007","question":"用所给词的适当形式填空：She ______ (be) very busy last week.","answer":"答案：was。解析：last week是一般过去时。主语she是第三人称单数，be动词用was。"},{"id":"g2_english_u007_ex10","knowledge_id":"g2_english_u007","question":"单项选择：My grandfather _____ us a lot of stories when I was a child. A. tells  B. told  C. is telling  D. will tell","answer":"答案：B. told。解析：when I was a child是一般过去时。"},{"id":"g2_english_u008_ex01","knowledge_id":"g2_english_u008","question":"单项选择：You _____ wear a seat belt when you drive. A. should  B. can  C. may  D. would","answer":"答案：A. should。解析：should表示\"应该\"，是建议。开车系安全带是应该做的事。"},{"id":"g2_english_u008_ex02","knowledge_id":"g2_english_u008","question":"用所给词的适当形式填空：You ______ (should, not) eat too much candy. It's bad for your teeth.","answer":"答案：shouldn't。解析：should not = shouldn't，意为\"不应该\"。"},{"id":"g2_english_u008_ex03","knowledge_id":"g2_english_u008","question":"单项选择：_____ I open the window? It's hot in here. A. Should  B. Would  C. Must  D. Need","answer":"答案：A. Should。解析：Should I...?表示\"我应该...吗？\"，征询意见。"},{"id":"g2_english_u008_ex04","knowledge_id":"g2_english_u008","question":"单项选择：He is very young. He _____ drive a car. A. should  B. shouldn't  C. can  D. would","answer":"答案：B. shouldn't。解析：他很年轻所以不应该开车。"},{"id":"g2_english_u008_ex05","knowledge_id":"g2_english_u008","question":"句型转换：You should drink more water. （改为否定句）","answer":"答案：You shouldn't drink more water. 解析：should的否定形式是should not / shouldn't。"},{"id":"g2_english_u008_ex06","knowledge_id":"g2_english_u008","question":"单项选择：— I have a bad headache. — You _____ see a doctor. A. should  B. would  C. must  D. may","answer":"答案：A. should。解析：should表示建议，\"你应该去看医生\"。"},{"id":"g2_english_u008_ex07","knowledge_id":"g2_english_u008","question":"翻译句子：你应该每天锻炼身体。","answer":"答案：You should exercise every day. 解析：should是情态动词，后接动词原形exercise。every day是频率副词。"},{"id":"g2_english_u008_ex08","knowledge_id":"g2_english_u008","question":"单项选择：Students _____ listen to the teacher carefully in class. A. can  B. should  C. would  D. mustn't","answer":"答案：B. should。解析：should表示应该，\"学生们应该认真听老师讲课\"。"},{"id":"g2_english_u008_ex09","knowledge_id":"g2_english_u008","question":"用所给词的适当形式填空：It's late. You ______ (should) go home now.","answer":"答案：should。解析：should + 动词原形go。"},{"id":"g2_english_u008_ex10","knowledge_id":"g2_english_u008","question":"单项选择：We _____ be late for school. It's a rule. A. should  B. shouldn't  C. would  D. need","answer":"答案：B. shouldn't。解析：学校规定上学不应该迟到。"},{"id":"g2_english_u009_ex01","knowledge_id":"g2_english_u009","question":"单项选择：_____ you please pass me the salt? A. Can  B. Could  C. Will  D. Would","answer":"答案：B. Could。解析：Could you please...?是比Can you...?更委婉的请求。"},{"id":"g2_english_u009_ex02","knowledge_id":"g2_english_u009","question":"单项选择：When I was five, I _____ swim in the river. A. can  B. could  C. may  D. might","answer":"答案：B. could。解析：could是can的过去式，表示过去的能力。when I was five提示过去时间。"},{"id":"g2_english_u009_ex03","knowledge_id":"g2_english_u009","question":"用所给词的适当形式填空：______ (Could) I borrow your pen, please?","answer":"答案：Could。解析：Could I...?是请求许可的委婉句型，比Can I...?更客气。"},{"id":"g2_english_u009_ex04","knowledge_id":"g2_english_u009","question":"单项选择：She said she _____ come to the party. A. can  B. could  C. may  D. might","answer":"答案：B. could。解析：said是过去时，从句用相应的过去时。"},{"id":"g2_english_u009_ex05","knowledge_id":"g2_english_u009","question":"单项选择：_____ I use your computer for a while? A. Could  B. Must  C. Should  D. Would","answer":"答案：A. Could。解析：Could I...?表示委婉请求许可。"},{"id":"g2_english_u009_ex06","knowledge_id":"g2_english_u009","question":"用所给词的适当形式填空：He ______ (could, not) find his book anywhere.","answer":"答案：couldn't。解析：could not = couldn't。"},{"id":"g2_english_u009_ex07","knowledge_id":"g2_english_u009","question":"单项选择：I think it _____ rain tomorrow. A. may  B. could  C. would  D. must","answer":"答案：B. could。解析：could表示可能性，\"可能会\"。"},{"id":"g2_english_u009_ex08","knowledge_id":"g2_english_u009","question":"翻译句子：你能告诉我怎么去火车站吗？","answer":"答案：Could you tell me how to get to the train station? 解析：Could you...?是委婉请求。"},{"id":"g2_english_u009_ex09","knowledge_id":"g2_english_u009","question":"单项选择：He _____ speak three languages when he was young. A. can  B. could  C. may  D. must","answer":"答案：B. could。解析：when he was young是过去时间，用could表示过去的能力。"},{"id":"g2_english_u009_ex10","knowledge_id":"g2_english_u009","question":"用所给词的适当形式填空：She asked if she ______ (could) leave early.","answer":"答案：could。解析：asked是过去时，间接引语中用could。"},{"id":"g2_english_u010_ex01","knowledge_id":"g2_english_u010","question":"单项选择：You _____ see a doctor. You look so pale. A. should  B. could  C. may  D. would","answer":"答案：A. should。解析：should表示\"应该\"，是建议。看医生是建议。"},{"id":"g2_english_u010_ex02","knowledge_id":"g2_english_u010","question":"单项选择：— Could I use your phone? — _____ A. Sure, here you are.  B. You should.  C. You'd better not.  D. You must.","answer":"答案：A. Sure, here you are. 解析：Could I...?(委婉请求) 的肯定回答常用Sure, here you are."},{"id":"g2_english_u010_ex03","knowledge_id":"g2_english_u010","question":"翻译句子：你最好早点起床。","answer":"答案：You should get up early. 或 You had better get up early. 解析：should表示建议，had better也提建议。"},{"id":"g2_english_u010_ex04","knowledge_id":"g2_english_u010","question":"单项选择：You _____ tell him the truth, but you don't have to. A. should  B. shouldn't  C. would  D. may","answer":"答案：A. should。解析：should表示\"应该\"，后一句don't have to表示\"不必\"。"},{"id":"g2_english_u010_ex05","knowledge_id":"g2_english_u010","question":"单项选择：It _____ be very cold tomorrow. Take more clothes. A. should  B. could  C. must  D. would","answer":"答案：B. could。解析：could表示可能性，\"可能\"。"},{"id":"g2_english_u010_ex06","knowledge_id":"g2_english_u010","question":"用所给词的适当形式填空：You ______ (should/could) take a taxi if you are in a hurry.","answer":"答案：could。解析：could表示一种可能的选择，\"你可以坐出租车\"。"},{"id":"g2_english_u010_ex07","knowledge_id":"g2_english_u010","question":"单项选择：You _____ drive so fast. It's dangerous. A. shouldn't  B. couldn't  C. would  D. must","answer":"答案：A. shouldn't。解析：shouldn't表示\"不应该\"，开车太快是危险的。"},{"id":"g2_english_u010_ex08","knowledge_id":"g2_english_u010","question":"翻译句子：如果你累了，你可以休息一会儿。","answer":"答案：You could have a rest if you are tired. 解析：could委婉建议，have a rest是固定短语\"休息一会儿\"。"},{"id":"g2_english_u010_ex09","knowledge_id":"g2_english_u010","question":"单项选择：— I have a stomachache. — You _____ drink some hot water. A. should  B. could  C. would  D. B and A","answer":"答案：D. B and A。解析：should和could都可用。should是直接建议，could是委婉建议。"},{"id":"g2_english_u010_ex10","knowledge_id":"g2_english_u010","question":"单项选择：He asked me _____ he could use my dictionary. A. that  B. if  C. when  D. which","answer":"答案：B. if。解析：if引导宾语从句表示\"是否\"，could是过去时表示委婉。"},{"id":"g2_english_u011_ex01","knowledge_id":"g2_english_u011","question":
