    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"id":"g3_math_001","chapter":"第二十一章 一元二次方程","name":"一元二次方程的概念","formula":"ax² + bx + c = 0 (a ≠ 0)","explanation":"只含有一个未知数，并且未知数的最高次数是2的整式方程，叫做一元二次方程。\n\n一般形式：ax² + bx + c = 0（a ≠ 0）\n其中：\n1. ax² 是二次项，a 是二次项系数\n2. bx 是一次项，b 是一次项系数\n3. c 是常数项\n\n判断要点：\n1. 只含一个未知数（一元）\n2. 未知数的最高次数是2（二次）\n3. 是整式方程（分母不含未知数）\n4. 二次项系数不为0（a ≠ 0）","semester":"upper"},{"id":"g3_math_002","chapter":"第二十一章 一元二次方程","name":"直接开平方法解一元二次方程","formula":"若 x² = a (a ≥ 0)，则 x = ±√a","explanation":"直接开平方法：利用平方根的定义直接开平方求一元二次方程的解的方法。\n\n适用类型：\n1. x² = a (a ≥ 0) → x = ±√a\n2. (mx + n)² = a (a ≥ 0) → mx + n = ±√a\n3. (mx + n)² = (px + q)² → mx + n = ±(px + q)\n\n解题步骤：\n1. 将方程化为左边是含未知数的完全平方式，右边是非负数\n2. 两边直接开平方\n3. 解得到的两个一元一次方程\n4. 写出方程的两个根","semester":"upper"},{"id":"g3_math_003","chapter":"第二十一章 一元二次方程","name":"配方法解一元二次方程","formula":"ax² + bx + c = 0 → (x + b/2a)² = (b²-4ac)/4a²","explanation":"配方法：通过配方，将一元二次方程变形为(x+m)² = n的形式，再用直接开平方法求解。\n\n解题步骤（以 ax² + bx + c = 0 为例）：\n1. 二次项系数化为1：两边同除以a\n2. 移项：把常数项移到右边\n3. 配方：两边同时加上一次项系数一半的平方\n4. 变形：左边化为完全平方式，右边合并\n5. 开平方：右边非负时，两边开平方\n6. 求解：解两个一元一次方程\n\n关键：两边加上一次项系数一半的平方。","semester":"upper"},{"id":"g3_math_004","chapter":"第二十一章 一元二次方程","name":"公式法解一元二次方程（求根公式）","formula":"x = (-b ± √(b²-4ac)) / 2a  (b²-4ac ≥ 0)","explanation":"求根公式：对于一元二次方程 ax² + bx + c = 0 (a ≠ 0)，当 b²-4ac ≥ 0 时，方程的根为：\nx = (-b ± √(b²-4ac)) / 2a\n\n解题步骤：\n1. 将方程化为一般形式 ax² + bx + c = 0\n2. 确定 a, b, c 的值\n3. 计算判别式 Δ = b² - 4ac\n4. 若 Δ ≥ 0，代入求根公式计算两根\n5. 若 Δ < 0，方程无实数根\n\n注意：求根公式是配方法推导的结果，是解一元二次方程的通用方法。","semester":"upper"},{"id":"g3_math_005","chapter":"第二十一章 一元二次方程","name":"因式分解法解一元二次方程","formula":"若 ab = 0，则 a = 0 或 b = 0","explanation":"因式分解法：将一元二次方程因式分解，化为两个一次式的乘积等于0的形式，再使这两个一次式分别等于0，从而实现降次。\n\n基本原理：若 ab = 0，则 a = 0 或 b = 0\n\n常用方法：\n1. 提公因式法\n2. 公式法（平方差、完全平方）\n3. 十字相乘法\n\n解题步骤：\n1. 将方程右边化为0\n2. 将左边分解为两个一次因式的乘积\n3. 令每个因式分别等于0，得到两个一元一次方程\n4. 解这两个一元一次方程，得到原方程的解","semester":"upper"},{"id":"g3_math_006","chapter":"第二十一章 一元二次方程","name":"一元二次方程根的判别式","formula":"Δ = b² - 4ac","explanation":"一元二次方程 ax² + bx + c = 0 (a ≠ 0) 的根的判别式为 Δ = b² - 4ac\n\n判别式与根的关系：\n1. Δ > 0 → 方程有两个不相等的实数根\n2. Δ = 0 → 方程有两个相等的实数根（重根）\n3. Δ < 0 → 方程没有实数根\n\n应用：\n1. 不解方程，判断方程根的情况\n2. 根据根的情况，求方程中字母系数的取值范围\n3. 证明方程根的情况","semester":"upper"},{"id":"g3_math_007","chapter":"第二十一章 一元二次方程","name":"一元二次方程根与系数的关系（韦达定理）","formula":"x₁ + x₂ = -b/a\nx₁ · x₂ = c/a","explanation":"韦达定理：对于一元二次方程 ax² + bx + c = 0 (a ≠ 0)，若方程的两根为 x₁ 和 x₂，则：\n\nx₁ + x₂ = -b/a （两根之和等于一次项系数与二次项系数比的相反数）\nx₁ · x₂ = c/a （两根之积等于常数项与二次项系数的比）\n\n常见应用：\n1. 已知一根，求另一根及系数\n2. 求两根代数式的值（如 x₁²+x₂², 1/x₁+1/x₂ 等）\n3. 判断两根的符号和大小关系\n4. 构造新的一元二次方程\n\n重要恒等式：\nx₁² + x₂² = (x₁+x₂)² - 2x₁x₂\n(x₁-x₂)² = (x₁+x₂)² - 4x₁x₂","semester":"upper"},{"id":"g3_math_008","chapter":"第二十一章 一元二次方程","name":"实际问题与一元二次方程","formula":"设未知数 → 列方程 → 解方程 → 检验 → 答","explanation":"列一元二次方程解应用题的一般步骤：\n1. 审：审题，找出等量关系\n2. 设：设未知数（直接设或间接设）\n3. 列：根据等量关系列方程\n4. 解：解方程\n5. 验：检验方程的解是否符合实际意义\n6. 答：写出答案\n\n常见类型：\n1. 增长率问题：a(1±x)² = b\n2. 面积问题：利用面积公式列方程\n3. 利润问题：单件利润×销量 = 总利润\n4. 运动问题：利用路程、速度、时间关系\n5. 数字问题：数位关系\n\n注意：解必须符合实际意义，如时间不能为负，人数必须是整数等。","semester":"upper"},{"id":"g3_math_009","chapter":"第二十二章 二次函数","name":"二次函数的概念","formula":"y = ax² + bx + c (a ≠ 0)","explanation":"一般地，形如 y = ax² + bx + c（a, b, c 是常数，a ≠ 0）的函数，叫做二次函数。\n\n其中：\n1. a 是二次项系数\n2. b 是一次项系数\n3. c 是常数项\n\n判断要点：\n1. 函数表达式是整式\n2. 自变量的最高次数是2（即x²项）\n3. 二次项系数不为0（a ≠ 0）\n\n常见形式：\n1. 一般式：y = ax² + bx + c\n2. 顶点式：y = a(x-h)² + k\n3. 交点式：y = a(x-x₁)(x-x₂)（抛物线与x轴交点为(x₁,0),(x₂,0)）","semester":"upper"},{"id":"g3_math_010","chapter":"第二十二章 二次函数","name":"二次函数 y=ax² 的图象和性质","formula":"y = ax² (a ≠ 0)\n顶点：(0, 0)\n对称轴：y轴","explanation":"二次函数 y = ax² 的图象是一条抛物线。\n\n性质：\n1. 顶点：原点 (0, 0)\n2. 对称轴：y轴（直线x = 0）\n3. 开口方向：\n   - a > 0 时，开口向上，有最低点（顶点），y有最小值0\n   - a < 0 时，开口向下，有最高点（顶点），y有最大值0\n4. 增减性：\n   - a > 0 时，x < 0 时 y 随 x 增大而减小；x > 0 时 y 随 x 增大而增大\n   - a < 0 时，x < 0 时 y 随 x 增大而增大；x > 0 时 y 随 x 增大而减小\n5. |a| 越大，抛物线开口越窄；|a| 越小，开口越宽。","semester":"upper"},{"id":"g3_math_011","chapter":"第二十二章 二次函数","name":"二次函数 y=a(x-h)²+k 的图象和性质","formula":"y = a(x-h)² + k\n顶点：(h, k)\n对称轴：直线 x = h","explanation":"二次函数 y = a(x-h)² + k 的图象是抛物线，是 y = ax² 平移得到的。\n\n平移规律：\n1. 向左平移h个单位：y = a(x+h)²\n2. 向右平移h个单位：y = a(x-h)²\n3. 向上平移k个单位：y = ax² + k\n4. 向下平移k个单位：y = ax² - k\n\n性质：\n1. 顶点坐标：(h, k)\n2. 对称轴：直线 x = h\n3. 开口方向：\n   - a > 0，开口向上，顶点为最低点，y最小值为k\n   - a < 0，开口向下，顶点为最高点，y最大值为k\n4. 增减性：\n   - a > 0，x < h 时 y 随 x 增大而减小；x > h 时 y 随 x 增大而增大\n   - a < 0，x < h 时 y 随 x 增大而增大；x > h 时 y 随 x 增大而减小","semester":"upper"},{"id":"g3_math_012","chapter":"第二十二章 二次函数","name":"二次函数 y=ax²+bx+c 的图象和性质","formula":"顶点：(-b/2a, (4ac-b²)/4a)\n对称轴：直线 x = -b/2a","explanation":"二次函数 y = ax² + bx + c 可以通过配方化为顶点式：\ny = a(x + b/2a)² + (4ac-b²)/4a\n\n性质：\n1. 顶点坐标：(-b/2a, (4ac-b²)/4a)\n2. 对称轴：直线 x = -b/2a\n3. 开口方向：\n   - a > 0，开口向上，有最小值 (4ac-b²)/4a\n   - a < 0，开口向下，有最大值 (4ac-b²)/4a\n4. 增减性：\n   - a > 0，x < -b/2a 时 y 随 x 增大而减小；x > -b/2a 时 y 随 x 增大而增大\n   - a < 0，x < -b/2a 时 y 随 x 增大而增大；x > -b/2a 时 y 随 x 增大而减小\n5. 与y轴交点：(0, c)","semester":"upper"},{"id":"g3_math_013","chapter":"第二十二章 二次函数","name":"用待定系数法求二次函数解析式","formula":"一般式：y = ax² + bx + c（3点）\n顶点式：y = a(x-h)² + k（顶点+1点）\n交点式：y = a(x-x₁)(x-x₂)（2个交点+1点）","explanation":"用待定系数法求二次函数解析式，根据已知条件选择合适的形式：\n\n1. 一般式 y = ax² + bx + c\n   - 已知条件：抛物线上任意三点坐标\n   - 方法：代入三点坐标，解三元一次方程组\n\n2. 顶点式 y = a(x-h)² + k\n   - 已知条件：顶点坐标(h,k)和另外一点\n   - 方法：代入顶点和另一点坐标，求a的值\n\n3. 交点式 y = a(x-x₁)(x-x₂)\n   - 已知条件：抛物线与x轴的两个交点(x₁,0),(x₂,0)和另外一点\n   - 方法：代入交点和另一点坐标，求a的值\n\n选择原则：根据已知条件选择最简便的形式，最后结果一般化为一般式。","semester":"upper"},{"id":"g3_math_014","chapter":"第二十二章 二次函数","name":"二次函数与一元二次方程的关系","formula":"抛物线 y=ax²+bx+c 与x轴交点的横坐标是方程 ax²+bx+c=0 的根","explanation":"二次函数 y = ax² + bx + c 的图象与 x 轴的交点的横坐标，就是一元二次方程 ax² + bx + c = 0 的根。\n\n关系：\n1. Δ > 0 → 抛物线与x轴有两个交点 → 方程有两个不相等的实数根\n2. Δ = 0 → 抛物线与x轴有一个交点（顶点） → 方程有两个相等的实数根\n3. Δ < 0 → 抛物线与x轴没有交点 → 方程没有实数根\n\n其中 Δ = b² - 4ac\n\n进一步：\n- 抛物线与x轴两交点距离 = |x₁ - x₂| = √(Δ)/|a|\n- 利用函数图象可以解一元二次不等式","semester":"upper"},{"id":"g3_math_015","chapter":"第二十二章 二次函数","name":"实际问题与二次函数","formula":"建立函数模型 → 求最值 → 检验实际意义","explanation":"利用二次函数解决实际问题的一般步骤：\n1. 分析题意，找出变量之间的关系\n2. 设自变量和因变量，建立二次函数关系式\n3. 确定自变量的取值范围\n4. 求函数的最值（顶点处或端点处）\n5. 检验结果是否符合实际意义\n6. 写出答案\n\n常见类型：\n1. 最值问题：最大利润、最大面积、最小成本等\n2. 运动问题：抛射物轨迹、运动时间等\n3. 几何问题：图形面积最值\n4. 经济问题：销量与价格关系\n\n关键：求最值时注意自变量的取值范围，最值可能在顶点处，也可能在端点处。","semester":"upper"},{"id":"g3_math_016","chapter":"第二十三章 旋转","name":"旋转的概念与性质","formula":"旋转三要素：旋转中心、旋转方向、旋转角度","explanation":"旋转：把一个图形绕着某一点O转动一个角度的图形变换。\n\n三要素：\n1. 旋转中心：转动的定点O\n2. 旋转方向：顺时针或逆时针\n3. 旋转角：转动的角度\n\n性质：\n1. 对应点到旋转中心的距离相等\n2. 对应点与旋转中心所连线段的夹角等于旋转角\n3. 旋转前后的图形全等（形状、大小都不变）\n4. 对应线段相等，对应角相等\n\n作图步骤：\n1. 确定旋转中心、方向和角度\n2. 找出图形的关键点\n3. 作出各关键点的对应点\n4. 按原图形顺序连接各对应点","semester":"upper"},{"id":"g3_math_017","chapter":"第二十三章 旋转","name":"中心对称","formula":"若绕某点旋转180°后与另一图形重合，则两图形成中心对称","explanation":"中心对称：把一个图形绕着某一个点旋转180°，如果它能够与另一个图形重合，那么就说这两个图形关于这个点对称或中心对称。\n\n这个点叫做对称中心。\n\n性质：\n1. 关于中心对称的两个图形是全等形\n2. 关于中心对称的两个图形，对称点所连线段都经过对称中心，并且被对称中心平分\n3. 关于中心对称的两个图形，对应线段平行（或在同一直线上）且相等\n\n找对称中心的方法：\n连接两组对应点，连线的交点就是对称中心。","semester":"upper"},{"id":"g3_math_018","chapter":"第二十三章 旋转","name":"中心对称图形","formula":"绕中心旋转180°后与自身重合的图形","explanation":"中心对称图形：把一个图形绕着某一个点旋转180°，如果旋转后的图形能够与原来的图形重合，那么这个图形叫做中心对称图形。\n\n这个点就是它的对称中心。\n\n常见的中心对称图形：\n1. 线段（对称中心是中点）\n2. 平行四边形（对称中心是对角线交点）\n3. 矩形、菱形、正方形\n4. 圆（对称中心是圆心）\n5. 正偶数边形\n\n中心对称与中心对称图形的区别：\n- 中心对称：两个图形之间的关系\n- 中心对称图形：一个图形自身的特性","semester":"upper"},{"id":"g3_math_019","chapter":"第二十三章 旋转","name":"关于原点对称的点的坐标","formula":"点(x, y)关于原点对称的点为(-x, -y)","explanation":"关于原点对称的点的坐标特征：\n两个点关于原点对称时，它们的坐标符号相反。\n即：点 P(x, y) 关于原点 O 的对称点为 P'(-x, -y)\n\n记忆方法：横纵坐标都变号。\n\n关于坐标轴对称对比：\n1. 关于x轴对称：(x, y) → (x, -y)（横坐标不变，纵坐标变号）\n2. 关于y轴对称：(x, y) → (-x, y)（纵坐标不变，横坐标变号）\n3. 关于原点对称：(x, y) → (-x, -y)（横纵坐标都变号）\n\n应用：\n1. 已知一点坐标，求其关于原点对称点的坐标\n2. 作一个图形关于原点对称的图形","semester":"upper"},{"id":"g3_math_020","chapter":"第二十四章 圆","name":"圆的概念和性质","formula":"圆：到定点距离等于定长的点的集合\n⊙O 半径为r ⇔ OA = r","explanation":"圆：在一个平面内，线段OA绕它固定的一个端点O旋转一周，另一个端点A所形成的图形叫做圆。\n\n相关概念：\n1. 圆心：固定的端点O\n2. 半径：线段OA的长度r\n3. 弦：连接圆上任意两点的线段\n4. 直径：经过圆心的弦（最长的弦）\n5. 弧：圆上任意两点间的部分（优弧、劣弧、半圆）\n6. 等圆：能够重合的两个圆（半径相等）\n7. 等弧：在同圆或等圆中，能够互相重合的弧\n\n圆的基本性质：\n1. 圆是轴对称图形，任何一条直径所在直线都是对称轴\n2. 圆是中心对称图形，对称中心是圆心\n3. 同圆或等圆的半径相等","semester":"upper"},{"id":"g3_math_021","chapter":"第二十四章 圆","name":"垂径定理","formula":"垂直于弦的直径平分弦，并且平分弦所对的两条弧","explanation":"垂径定理：垂直于弦的直径平分弦，并且平分弦所对的两条弧。\n\n已知：CD是直径，CD⊥AB于E\n结论：AE = BE，弧AC = 弧BC，弧AD = 弧BD\n\n推论：平分弦（不是直径）的直径垂直于弦，并且平分弦所对的两条弧。\n\n注意：推论中\"弦不是直径\"这个条件不能少，因为任意两条直径都互相平分，但不一定垂直。\n\n垂径定理的应用：\n1. 计算弦长、半径、弦心距\n2. 证明线段相等、弧相等\n3. 常用辅助线：过圆心作弦的垂线\n\n基本图形：半径r、弦长a、弦心距d构成直角三角形：r² = d² + (a/2)²","semester":"upper"},{"id":"g3_math_022","chapter":"第二十四章 圆","name":"弧、弦、圆心角的关系","formula":"同圆或等圆中：等圆心角 ⇔ 等弧 ⇔ 等弦","explanation":"圆心角：顶点在圆心的角叫做圆心角。\n\n定理：在同圆或等圆中，相等的圆心角所对的弧相等，所对的弦也相等。\n\n推论：\n1. 在同圆或等圆中，如果两条弧相等，那么它们所对的圆心角相等，所对的弦相等。\n2. 在同圆或等圆中，如果两条弦相等，那么它们所对的圆心角相等，所对的弧相等。\n\n即：在同圆或等圆中，三个量（圆心角、弧、弦）中，有一个量相等，其他两个量也分别相等。\n\n注意：前提条件是\"在同圆或等圆中\"，缺少这个前提结论不一定成立。","semester":"upper"},{"id":"g3_math_023","chapter":"第二十四章 圆","name":"圆周角定理","formula":"一条弧所对的圆周角等于它所对的圆心角的一半","explanation":"圆周角：顶点在圆上，两边都与圆相交的角叫做圆周角。\n\n圆周角定理：一条弧所对的圆周角等于它所对的圆心角的一半。\n即：圆周角 = 1/2 × 圆心角\n\n推论：\n1. 同弧或等弧所对的圆周角相等\n2. 半圆（或直径）所对的圆周角是直角（90°）\n3. 90°的圆周角所对的弦是直径\n4. 圆内接四边形的对角互补\n\n重要应用：\n1. 证明角相等\n2. 证明直角（利用直径所对圆周角是直角）\n3. 求角度大小\n\n注意：同弧所对的圆周角有无数个，都相等；但相等的圆周角所对的弧不一定相等（需在同圆或等圆中）。","semester":"upper"},{"id":"g3_math_024","chapter":"第二十四章 圆","name":"点和圆的位置关系","formula":"设⊙O半径为r，点P到圆心距离为d\n点在圆外 ⇔ d > r\n点在圆上 ⇔ d = r\n点在圆内 ⇔ d < r","explanation":"点和圆有三种位置关系：\n\n设⊙O的半径为r，点P到圆心的距离OP = d，则：\n1. 点P在圆外 ⇔ d > r\n2. 点P在圆上 ⇔ d = r\n3. 点P在圆内 ⇔ d < r\n\n三角形的外接圆：\n经过三角形三个顶点可以作一个圆，这个圆叫做三角形的外接圆。\n外接圆的圆心是三角形三边垂直平分线的交点，叫做三角形的外心。\n\n外心性质：\n1. 外心到三角形三个顶点的距离相等\n2. 锐角三角形外心在三角形内部\n3. 直角三角形外心在斜边中点\n4. 钝角三角形外心在三角形外部\n\n过一点可以画无数个圆；过两点可以画无数个圆（圆心在两点连线的垂直平分线上）；不在同一直线上的三点确定一个圆。","semester":"upper"},{"id":"g3_math_025","chapter":"第二十四章 圆","name":"直线和圆的位置关系","formula":"设⊙O半径为r，直线l到圆心距离为d\n相离 ⇔ d > r\n相切 ⇔ d = r\n相交 ⇔ d < r","explanation":"直线和圆有三种位置关系：\n\n设⊙O的半径为r，圆心O到直线l的距离为d，则：\n1. 直线和圆相离（没有公共点） ⇔ d > r\n2. 直线和圆相切（只有一个公共点） ⇔ d = r\n   - 这条直线叫做圆的切线\n   - 唯一的公共点叫做切点\n3. 直线和圆相交（有两个公共点） ⇔ d < r\n   - 这条直线叫做圆的割线\n\n判断方法：\n1. 根据公共点个数判断\n2. 根据d与r的大小关系判断（常用）\n\n记忆技巧：d > r → 离（相离）；d = r → 切（相切）；d < r → 交（相交）","semester":"upper"},{"id":"g3_math_026","chapter":"第二十四章 圆","name":"切线的判定与性质","formula":"判定：经过半径外端并且垂直于这条半径的直线是圆的切线\n性质：圆的切线垂直于过切点的半径","explanation":"切线的判定定理：经过半径的外端并且垂直于这条半径的直线是圆的切线。\n\n两个条件缺一不可：\n1. 经过半径的外端（即点在圆上）\n2. 垂直于这条半径\n\n切线的性质定理：圆的切线垂直于过切点的半径。\n\n切线长：经过圆外一点作圆的切线，这点和切点之间的线段的长，叫做这点到圆的切线长。\n\n常见的切线判定方法：\n1. 定义法：与圆只有一个公共点的直线是圆的切线\n2. 距离法：到圆心距离等于半径的直线是圆的切线（d = r）\n3. 判定定理：经过半径外端且垂直于半径的直线是切线\n\n常用辅助线：\n- 有切点：连半径，证垂直\n- 无切点：作垂直，证半径","semester":"upper"},{"id":"g3_math_027","chapter":"第二十四章 圆","name":"切线长定理","formula":"从圆外一点引圆的两条切线，切线长相等，这一点和圆心的连线平分两条切线的夹角","explanation":"切线长定理：从圆外一点可以引圆的两条切线，它们的切线长相等，这一点和圆心的连线平分两条切线的夹角。\n\n已知：PA、PB是⊙O的两条切线，A、B是切点\n结论：PA = PB，∠APO = ∠BPO\n\n推导：\n∵ PA、PB是⊙O的切线\n∴ OA⊥PA，OB⊥PB\n又 ∵ OA = OB，OP = OP\n∴ Rt△AOP ≌ Rt△BOP（HL）\n∴ PA = PB，∠APO = ∠BPO\n\n三角形的内切圆：\n与三角形各边都相切的圆叫做三角形的内切圆。\n内切圆的圆心是三角形三条角平分线的交点，叫做三角形的内心。\n\n内心性质：\n1. 内心到三角形三边的距离相等\n2. 内心在三角形内部","semester":"upper"},{"id":"g3_math_028","chapter":"第二十四章 圆","name":"圆和圆的位置关系","formula":"设两圆半径R、r（R≥r），圆心距为d\n外离 d > R+r\n外切 d = R+r\n相交 R-r < d < R+r\n内切 d = R-r\n内含 d < R-r","explanation":"两圆有五种位置关系：\n\n设两圆的半径分别为R和r（R ≥ r），圆心距为d，则：\n1. 外离：d > R + r（没有公共点，每个圆上的点都在另一个圆外）\n2. 外切：d = R + r（只有一个公共点，除公共点外每个圆上的点都在另一个圆外）\n3. 相交：R - r < d < R + r（有两个公共点）\n4. 内切：d = R - r（只有一个公共点，除公共点外一个圆在另一个圆内）\n5. 内含：d < R - r（没有公共点，一个圆在另一个圆内）\n   - 同心圆是内含的特例（d = 0）\n\n分类记忆：\n- 没有公共点：外离、内含\n- 一个公共点：外切、内切\n- 两个公共点：相交","semester":"upper"},{"id":"g3_math_029","chapter":"第二十四章 圆","name":"正多边形和圆","formula":"正n边形的中心角 = 360°/n\n边长 aₙ = 2R·sin(180°/n)\n边心距 rₙ = R·cos(180°/n)","explanation":"正多边形：各边相等，各角也相等的多边形。\n\n正多边形和圆的关系：\n把圆分成n(n≥3)等份，依次连接各分点所得的多边形是这个圆的内接正n边形，这个圆就是这个正多边形的外接圆。\n\n相关概念：\n1. 中心：正多边形外接圆的圆心\n2. 半径：外接圆的半径R\n3. 中心角：正多边形每一边所对的圆心角 = 360°/n\n4. 边心距：中心到正多边形一边的距离r\n\n计算公式（正n边形，半径R）：\n1. 中心角：α = 360°/n\n2. 边长：a = 2R·sin(180°/n)\n3. 边心距：r = R·cos(180°/n)\n4. 周长：P = n·a\n5. 面积：S = 1/2 · P · r\n\n常见正多边形：\n- 正三角形：中心角120°，面积 = (√3/4)a²\n- 正方形：中心角90°，对角线 = √2·a\n- 正六边形：中心角60°，边长 = 半径R","semester":"upper"},{"id":"g3_math_030","chapter":"第二十四章 圆","name":"弧长和扇形面积","formula":"弧长 l = nπR/180\n扇形面积 S = nπR²/360 = 1/2·l·R","explanation":"弧长公式：\n在半径为R的圆中，n°的圆心角所对的弧长为：\nl = nπR / 180\n\n推导：360°圆心角对应弧长 = 周长 = 2πR，所以1°对应弧长 = 2πR/360 = πR/180，n°对应 l = nπR/180\n\n扇形：由组成圆心角的两条半径和圆心角所对的弧围成的图形叫做扇形。\n\n扇形面积公式：\nS = nπR² / 360 = 1/2 · l · R\n\n（n是圆心角度数，R是半径，l是扇形弧长）\n\n推导：360°圆心角对应扇形面积 = 圆面积 = πR²，所以n°对应 S = nπR²/360 = 1/2·(nπR/180)·R = 1/2·l·R\n\n对比记忆：\n- 弧长公式：l = nπR/180（1个R）\n- 扇形面积：S = nπR²/360（2个R）或 S = 1/2·l·R（类似三角形面积）","semester":"upper"},{"id":"g3_math_031","chapter":"第二十四章 圆","name":"圆锥的侧面积和全面积","formula":"侧面积 S侧 = πrR\n全面积 S全 = πrR + πr²\n（r是底面半径，R是母线长）","explanation":"圆锥：由一个底面（圆）和一个侧面（曲面）围成的几何体。\n\n相关概念：\n1. 母线：连接圆锥顶点和底面圆周上任意一点的线段（长度都相等）\n2. 高：连接顶点与底面圆心的线段\n3. 底面半径：r\n4. 母线长：R（也常用l表示）\n5. 高h、底面半径r、母线R满足：R² = h² + r²\n\n圆锥的侧面展开图：\n是一个扇形，扇形的半径等于圆锥的母线长R，扇形的弧长等于圆锥底面圆的周长2πr。\n\n侧面积公式：\nS侧 = πrR（r是底面半径，R是母线长）\n\n全面积公式：\nS全 = S侧 + S底 = πrR + πr²\n\n注意：计算时注意区分母线长和底面半径，不要搞混。","semester":"upper"},{"id":"g3_math_032","chapter":"第二十五章 概率初步","name":"随机事件","formula":"必然事件（概率1）、不可能事件（概率0）、随机事件（0<概率<1）","explanation":"事件分类：\n\n1. 必然事件：在一定条件下，必然会发生的事件。\n   - 例如：太阳从东方升起\n\n2. 不可能事件：在一定条件下，必然不会发生的事件。\n   - 例如：公鸡下蛋\n\n3. 随机事件：在一定条件下，可能发生也可能不发生的事件。\n   - 例如：掷一枚硬币正面朝上\n\n注意：\n- 必然事件和不可能事件统称确定性事件\n- 随机事件又称不确定事件\n- 事件的确定性和随机性是相对于\"一定条件\"而言的，条件变了，事件的性质也可能改变\n\n随机事件特点：\n1. 可以在相同条件下重复进行\n2. 每次试验的可能结果不止一个\n3. 试验前不能确定哪一个结果会出现，但事先知道所有可能的结果","semester":"upper"},{"id":"g3_math_033","chapter":"第二十五章 概率初步","name":"概率的概念","formula":"P(A) = m/n\n（n是所有等可能结果总数，m是事件A包含的结果数）","explanation":"概率：一般地，对于一个随机事件A，我们把刻画其发生可能性大小的数值，称为随机事件A发生的概率，记为P(A)。\n\n等可能事件的概率计算：\n如果一次试验中，有n种可能的结果，并且它们发生的可能性都相等，事件A包含其中的m种结果，那么：\n\nP(A) = m/n\n\n概率的范围：\n1. 0 ≤ P(A) ≤ 1\n2. 必然事件的概率：P = 1\n3. 不可能事件的概率：P = 0\n4. 随机事件的概率：0 < P(A) < 1\n\n事件发生的可能性越大，概率越接近1；\n事件发生的可能性越小，概率越接近0。\n\n注意：概率是反映可能性大小的数值，但概率大不代表一定发生，概率小不代表一定不发生。","semester":"upper"},{"id":"g3_math_034","chapter":"第二十五章 概率初步","name":"用列举法求概率","formula":"列表法、画树状图法","explanation":"求概率的常用方法：\n\n1. 直接列举法：将所有可能结果一一列举出来，再计算事件A包含的结果数。\n   - 适用于结果数较少的情况\n\n2. 列表法：当一次试验要涉及两个因素（如掷两枚骰子），并且可能出现的结果数目较多时，为了不重不漏地列出所有可能的结果，通常采用列表法。\n\n3. 画树状图法：当一次试验要涉及3个或更多因素（如从3个口袋中各取一个球）时，列表法就不方便了，为了不重不漏地列出所有可能的结果，通常采用画树状图法。\n\n注意事项：\n1. 必须保证每种结果发生的可能性相等\n2. 列举时要做到不重复、不遗漏\n3. 放回试验和不放回试验结果不同，要注意区分\n4. 有序问题和无序问题要区分清楚","semester":"upper"},{"id":"g3_math_035","chapter":"第二十五章 概率初步","name":"用频率估计概率","formula":"大量重复试验时，事件发生的频率稳定在概率附近","explanation":"用频率估计概率：\n在大量重复试验中，如果事件A发生的频率m/n会稳定在某个常数p附近，那么事件A发生的概率P(A) = p。\n\n频率与概率的关系：\n1. 频率是实际试验中事件发生的次数与总次数的比值，是具体的数值，每次试验可能不同\n2. 概率是理论上事件发生可能性的大小，是一个固定的常数\n3. 当试验次数很大时，频率稳定在概率附近，可以用频率估计概率\n\n注意：\n1. 必须是\"大量\"重复试验，试验次数太少时，频率波动大，不能代表概率\n2. 频率是近似值，概率是精确值\n3. 频率趋近于概率，但不一定等于概率\n4. 不能说\"试验次数越多，频率越接近概率\"，只能说\"频率稳定在概率附近\"","semester":"upper"},{"id":"g3_math_036","chapter":"第二十六章 反比例函数","name":"反比例函数的概念","formula":"y = k/x (k为常数，k ≠ 0)","explanation":"反比例函数：一般地，形如 y = k/x（k为常数，k ≠ 0）的函数，叫做反比例函数。\n\n其中 k 叫做比例系数。\n\n等价形式：\n1. y = k/x （k ≠ 0）\n2. y = kx⁻¹ （k ≠ 0）\n3. xy = k （k ≠ 0）\n\n判断要点：\n1. 自变量x在分母上，且次数为1\n2. 比例系数k ≠ 0\n3. 自变量x的取值范围是x ≠ 0\n4. 函数值y的取值范围是y ≠ 0\n\n常见模型：\n1. 路程一定时，速度与时间成反比：v = s/t\n2. 面积一定时，长与宽成反比：a = S/b\n3. 功一定时，力与位移成反比","semester":"lower"},{"id":"g3_math_037","chapter":"第二十六章 反比例函数","name":"反比例函数的图象和性质","formula":"图象：双曲线\nk > 0 时，图象在一、三象限，每个象限内y随x增大而减小\nk < 0 时，图象在二、四象限，每个象限内y随x增大而增大","explanation":"反比例函数 y = k/x (k ≠ 0) 的图象是双曲线，有两个分支。\n\n性质：\n\n当 k > 0 时：\n1. 图象的两个分支分别在第一、第三象限\n2. 在每个象限内，y 随 x 的增大而减小\n3. 图象无限接近x轴和y轴，但永远不与坐标轴相交\n\n当 k < 0 时：\n1. 图象的两个分支分别在第二、第四象限\n2. 在每个象限内，y 随 x 的增大而增大\n3. 图象无限接近x轴和y轴，但永远不与坐标轴相交\n\n对称性：\n1. 反比例函数图象是中心对称图形，对称中心是原点\n2. 反比例函数图象也是轴对称图形，对称轴是直线y=x和直线y=-x\n\n|k|的意义：|k|越大，双曲线离原点越远；|k|越小，双曲线离原点越近。","semester":"lower"},{"id":"g3_math_038","chapter":"第二十六章 反比例函数","name":"反比例函数中k的几何意义","formula":"过双曲线上任意一点作x轴、y轴的垂线，两垂线与坐标轴围成的矩形面积 = |k|","explanation":"k的几何意义：\n过反比例函数 y = k/x (k ≠ 0) 图象上任意一点P(x, y)，分别作x轴、y轴的垂线，垂足分别为A、B，则矩形OAPB的面积 = OA × OB = |x| × |y| = |xy| = |k|。\n\n即：矩形面积 = |k|（常数，与点的位置无关）\n\n推论：\n1. 过双曲线上一点作x轴的垂线，连接原点，则所得直角三角形的面积 = |k|/2\n2. 同一双曲线上任意两点与原点围成的三角形面积，可以用矩形面积推导\n\n应用：\n1. 已知k求图形面积\n2. 已知图形面积求k的值（注意符号）\n3. 比较面积大小（只要在同一双曲线上，矩形面积都等于|k|）\n\n注意：面积是|k|，k的正负由所在象限决定。","semester":"lower"},{"id":"g3_math_039","chapter":"第二十六章 反比例函数","name":"实际问题与反比例函数","formula":"建立反比例函数模型 → 利用性质解决问题 → 检验实际意义","explanation":"利用反比例函数解决实际问题的一般步骤：\n1. 审题，找出变量之间的关系\n2. 设自变量和因变量，建立反比例函数关系式\n3. 利用待定系数法或其他方法求k的值\n4. 确定自变量的取值范围（结合实际意义）\n5. 利用函数性质解决问题\n6. 检验结果是否符合实际意义\n\n常见类型：\n1. 行程问题：路程一定，速度与时间成反比\n2. 工程问题：工作量一定，工作效率与时间成反比\n3. 面积问题：面积一定，长与宽成反比\n4. 物理问题：压力一定，压强与受力面积成反比；功率一定，力与速度成反比\n5. 经济问题：总价一定，单价与数量成反比\n\n注意：\n- 实际问题中自变量的取值范围往往是正数（x > 0）\n- 函数图象通常只有第一象限的一支","semester":"lower"},{"id":"g3_math_040","chapter":"第二十七章 相似","name":"相似图形和相似比","formula":"相似图形：形状相同的图形\n相似比 k = 对应边的比值","explanation":"相似图形：形状相同的图形叫做相似图形。\n\n相似多边形：两个边数相同的多边形，如果它们的角分别相等，边成比例，那么这两个多边形叫做相似多边形。\n\n相似比：相似多边形对应边的比叫做相似比（或相似系数）。\n\n相似多边形的性质：\n1. 对应角相等\n2. 对应边成比例\n3. 周长的比等于相似比\n4. 面积的比等于相似比的平方\n\n相似比与顺序有关：\n若多边形A与多边形B的相似比为k，则B与A的相似比为1/k。\n\n全等是相似的特殊情况：当相似比k = 1时，两个图形全等。\n\n比例的基本性质：\n1. 基本性质：a/b = c/d ⇔ ad = bc\n2. 合比性质：a/b = c/d ⇒ (a±b)/b = (c±d)/d\n3. 等比性质：若a/b = c/d = ... = m/n (b+d+...+n ≠ 0)，则(a+c+...+m)/(b+d+...+n) = a/b","semester":"lower"},{"id":"g3_math_041","chapter":"第二十七章 相似","name":"相似三角形的判定（AA）","formula":"两角分别相等的两个三角形相似（AA）","explanation":"相似三角形判定定理1（AA）：\n两角分别相等的两个三角形相似。\n\n已知：在△ABC和△A'B'C'中，∠A = ∠A'，∠B = ∠B'\n结论：△ABC ∽ △A'B'C'\n\n推导：\n∵ 三角形内角和为180°\n∴ ∠C = 180° - ∠A - ∠B，∠C' = 180° - ∠A' - ∠B'\n∵ ∠A = ∠A'，∠B = ∠B'\n∴ ∠C = ∠C'\n∴ 三个角都相等，两个三角形相似\n\n常见应用：\n1. 平行线截三角形（A型图、X型图）\n2. 公共角模型\n3. 同角的余角/补角相等\n4. 对顶角相等\n\n注意：AA是最常用的判定方法，只要找到两个角对应相等就可以判定相似。","semester":"lower"},{"id":"g3_math_042","chapter":"第二十七章 相似","name":"相似三角形的判定（SAS、SSS）","formula":"SAS：两边成比例且夹角相等\nSSS：三边成比例","explanation":"相似三角形判定定理2（SAS）：\n两边成比例且夹角相等的两个三角形相似。\n\n即：若 AB/A'B' = AC/A'C'，且∠A = ∠A'，则△ABC ∽ △A'B'C'\n\n注意：必须是夹角，不是任意一个角，这和全等的SAS类似。\n\n相似三角形判定定理3（SSS）：\n三边成比例的两个三角形相似。\n\n即：若 AB/A'B' = BC/B'C' = AC/A'C'，则△ABC ∽ △A'B'C'\n\n直角三角形相似的特殊判定（HL）：\n斜边和一条直角边成比例的两个直角三角形相似。\n\n相似三角形判定方法总结：\n1. AA：两角对应相等（最常用）\n2. SAS：两边对应成比例且夹角相等\n3. SSS：三边对应成比例\n4. HL：直角三角形斜边和一条直角边对应成比例","semester":"lower"},{"id":"g3_math_043","chapter":"第二十七章 相似","name":"相似三角形的性质","formula":"对应角相等，对应边成比例\n对应高/中线/角平分线的比 = 相似比\n周长比 = 相似比\n面积比 = 相似比的平方","explanation":"相似三角形的性质：\n\n1. 对应角相等，对应边成比例（定义）\n\n2. 对应线段的比等于相似比：\n   - 对应高的比 = 相似比\n   - 对应中线的比 = 相似比\n   - 对应角平分线的比 = 相似比\n\n3. 周长的比等于相似比\n   证明：若△ABC ∽ △A'B'C'，相似比为k\n   则 AB = k·A'B'，BC = k·B'C'，AC = k·A'C'\n   周长比 = (AB+BC+AC)/(A'B'+B'C'+A'C') = k\n\n4. 面积的比等于相似比的平方\n   证明：面积比 = (1/2·底·高)/(1/2·底'·高') = (底/底')·(高/高') = k·k = k²\n\n重要：面积比是相似比的平方，不是k倍！\n已知面积比求相似比，要开平方。","semester":"lower"},{"id":"g3_math_044","chapter":"第二十七章 相似","name":"位似","formula":"位似图形：相似且对应顶点连线交于一点\n位似中心：对应顶点连线的交点","explanation":"位似图形：如果两个图形不仅相似，而且对应顶点的连线相交于一点，对应边互相平行，那么这样的两个图形叫做位似图形，这个点叫做位似中心。\n\n位似是一种特殊的相似，位似图形一定相似，相似图形不一定位似。\n\n性质：\n1. 位似图形是相似图形，具有相似图形的一切性质\n2. 位似图形对应点的连线经过位似中心\n3. 位似图形对应边平行（或在同一直线上）\n4. 位似图形对应点到位似中心的距离之比等于相似比（位似比）\n\n平面直角坐标系中的位似：\n在平面直角坐标系中，如果位似是以原点为位似中心，相似比为k，那么位似图形对应点的坐标的比等于k或-k。\n\n即：原图形上点(x, y)，以原点为位似中心的位似图形对应点坐标为(kx, ky)或(-kx, -ky)。\n\n位似作图步骤：\n1. 确定位似中心\n2. 确定原图形的关键点\n3. 确定位似比\n4. 作出各关键点的对应点\n5. 按原顺序连接各对应点","semester":"lower"},{"id":"g3_math_045","chapter":"第二十八章 锐角三角函数","name":"正弦的概念","formula":"sin A = ∠A的对边 / 斜边 = a/c","explanation":"正弦：在Rt△ABC中，∠C = 90°，我们把锐角A的对边与斜边的比叫做∠A的正弦，记作sin A。\n\n即：sin A = ∠A的对边 / 斜边 = a/c\n\n其中a是∠A的对边，c是斜边。\n\n性质：\n1. sin A 是一个比值，没有单位\n2. sin A 只与角A的大小有关，与三角形的大小无关\n3. 0 < sin A < 1（因为对边 < 斜边）\n4. 角度越大，正弦值越大（0°到90°之间）\n\n特殊角的正弦值：\n- sin 0° = 0\n- sin 30° = 1/2\n- sin 45° = √2/2\n- sin 60° = √3/2\n- sin 90° = 1\n\n注意：sin A 是一个完整的符号，不是 sin 乘以 A，不能分开。","semester":"lower"},{"id":"g3_math_046","chapter":"第二十八章 锐角三角函数","name":"余弦和正切的概念","formula":"cos A = 邻边/斜边 = b/c\ntan A = 对边/邻边 = a/b","explanation":"余弦：在Rt△ABC中，∠C = 90°，锐角A的邻边与斜边的比叫做∠A的余弦，记作cos A。\ncos A = ∠A的邻边 / 斜边 = b/c\n\n正切：在Rt△ABC中，∠C = 90°，锐角A的对边与邻边的比叫做∠A的正切，记作tan A。\ntan A = ∠A的对边 / ∠A的邻边 = a/b\n\n锐角三角函数：\n锐角A的正弦、余弦、正切都叫做∠A的锐角三角函数。\n\n性质：\n1. cos A 随角度增大而减小（0°到90°），0 < cos A < 1\n2. tan A 随角度增大而增大，tan A > 0\n3. 同角三角函数关系：\n   - sin²A + cos²A = 1\n   - tan A = sin A / cos A\n\n特殊角的三角函数值：\n- cos 30° = √3/2，tan 30° = √3/3\n- cos 45° = √2/2，tan 45° = 1\n- cos 60° = 1/2，tan 60° = √3","semester":"lower"},{"id":"g3_math_047","chapter":"第二十八章 锐角三角函数","name":"特殊角的三角函数值","formula":"30°-60°-90°三角形 1:√3:2\n45°-45°-90°三角形 1:1:√2","explanation":"特殊角（30°、45°、60°）的三角函数值必须牢记：\n\n| 角度 | sin | cos | tan |\n|------|-----|-----|-----|\n| 30°  | 1/2 | √3/2 | √3/3 |\n| 45°  | √2/2 | √2/2 | 1 |\n| 60°  | √3/2 | 1/2 | √3 |\n\n记忆技巧：\n1. 正弦：1/2, √2/2, √3/2（分子根号里1,2,3递增）\n2. 余弦：√3/2, √2/2, 1/2（分子根号里3,2,1递减）\n3. 正切：√3/3, 1, √3（√3的-1,0,1次方）\n\n记忆口诀：\n正弦一二三（指分子根号里1,2,3）\n余弦三二一（指分子根号里3,2,1）\n正切三九二十七（√3/3, 1, √3）\n\n互余角关系：\n若∠A + ∠B = 90°，则 sin A = cos B，cos A = sin B\n\n应用：已知特殊角求三角函数值，或已知三角函数值求角度。","semester":"lower"},{"id":"g3_math_048","chapter":"第二十八章 锐角三角函数","name":"解直角三角形","formula":"在Rt△ABC中，∠C=90°\n边关系：a² + b² = c²\n角关系：∠A + ∠B = 90°\n边角关系：sin A = a/c, cos A = b/c, tan A = a/b","explanation":"解直角三角形：在直角三角形中，由已知元素求未知元素的过程，叫做解直角三角形。\n\n直角三角形中的关系（∠C = 90°）：\n1. 三边关系（勾股定理）：a² + b² = c²\n2. 两锐角关系：∠A + ∠B = 90°\n3. 边角关系（锐角三角函数）：\n   sin A = a/c，cos A = b/c，tan A = a/b\n   sin B = b/c，cos B = a/c，tan B = b/a\n\n可解条件：知道5个元素（a,b,c,∠A,∠B）中的2个（至少有一个是边），就可以求出其余3个。\n\n常见类型：\n1. 已知两边：先求第三边（勾股定理），再求角（三角函数）\n2. 已知一边一角：先求另一个锐角（互余），再求其他边（三角函数）\n\n解题原则：有弦用弦（斜边已知用sin/cos），无弦用切（斜边未知用tan），宁乘勿除。","semester":"lower"},{"id":"g3_math_049","chapter":"第二十八章 锐角三角函数","name":"仰角、俯角与坡度","formula":"仰角：向上看，视线与水平线的夹角\n俯角：向下看，视线与水平线的夹角\n坡度 i = 铅直高度/水平宽度 = tan α","explanation":"解直角三角形的实际应用常用概念：\n\n1. 仰角：在视线与水平线所成的角中，视线在水平线上方的角叫做仰角。\n\n2. 俯角：视线在水平线下方的角叫做俯角。\n\n注意：仰角和俯角都是视线与水平线的夹角，不是与铅垂线的夹角。\n\n3. 坡度（坡比）：\n坡面的铅直高度h和水平宽度l的比叫做坡度（或坡比），用字母i表示。\ni = h/l = tan α\n其中α是坡面与水平面的夹角，叫做坡角。\n\n4. 方位角：\n从指北方向顺时针转到目标方向线的水平角叫做方位角。\n\n常见应用类型：\n1. 测量高度（仰角、俯角问题）\n2. 航行问题（方位角）\n3. 坡面问题（坡度）\n4. 距离问题\n\n解题步骤：\n1. 将实际问题转化为数学问题（画出示意图，构造直角三角形）\n2. 选择适当的三角函数关系\n3. 列方程求解\n4. 检验结果，写出答案","semester":"lower"},{"id":"g3_math_050","chapter":"第二十九章 投影与视图","name":"平行投影和中心投影","formula":"平行投影：光线平行（如太阳光）\n中心投影：光线从一点发出（如灯光）","explanation":"投影：用光线照射物体，在某个平面上得到的影子叫做物体的投影。\n照射光线叫做投影线，投影所在的平面叫做投影面。\n\n平行投影：由平行光线形成的投影叫做平行投影。\n例如：太阳光下的影子。\n特点：\n1. 光线是平行的\n2. 同一时刻，不同物体的物高与影长成比例\n3. 物体平行于投影面时，投影与物体全等\n\n中心投影：由同一点（点光源）发出的光线形成的投影叫做中心投影。\n例如：灯光下的影子。\n特点：\n1. 光线从一点发出\n2. 影子随物体位置改变而改变\n3. 物体平行于投影面时，投影是物体的位似图形\n\n正投影：投影线垂直于投影面产生的投影叫做正投影。\n正投影性质：\n1. 线段平行于投影面时，正投影 = 线段长\n2. 线段倾斜于投影面时，正投影 < 线段长\n3. 线段垂直于投影面时，正投影是一个点","semester":"lower"},{"id":"g3_math_051","chapter":"第二十九章 投影与视图","name":"三视图（主视图、左视图、俯视图）","formula":"主视图：从正面看\n左视图：从左面看\n俯视图：从上面看","explanation":"视图：当我们从某一方向观察一个物体时，所看到的平面图形叫做物体的一个视图。\n\n三视图：\n1. 主视图：从正面看物体得到的视图（反映物体的长和高）\n2. 左视图：从左面看物体得到的视图（反映物体的宽和高）\n3. 俯视图：从上面看物体得到的视图（反映物体的长和宽）\n\n三视图的位置规定：\n俯视图在主视图的正下方，左视图在主视图的正右方。\n\n三视图的对应关系：\n1. 主视图与俯视图：长对正（长度相等）\n2. 主视图与左视图：高平齐（高度相等）\n3. 左视图与俯视图：宽相等（宽度相等）\n\n记忆口诀：长对正，高平齐，宽相等。\n\n画图注意：\n1. 看得见的轮廓线画实线\n2. 看不见的轮廓线画虚线\n3. 三视图按规定位置摆放","semester":"lower"},{"id":"g3_math_052","chapter":"第二十九章 投影与视图","name":"由三视图判断几何体","function":true,"formula":"主视图反映长和高\n左视图反映宽和高\n俯视图反映长和宽","explanation":"由三视图描述几何体的方法：\n\n1. 先看俯视图，确定几何体底面的形状和布局\n2. 再看主视图，确定几何体的高度和正面形状\n3. 最后结合左视图，综合判断几何体的形状\n\n常见几何体的三视图：\n1. 正方体：三个视图都是正方形\n2. 长方体：三个视图都是长方形（特殊情况有正方形）\n3. 圆柱：主视图和左视图是长方形，俯视图是圆\n4. 圆锥：主视图和左视图是等腰三角形，俯视图是圆和圆心\n5. 球：三个视图都是圆\n6. 三棱柱：主视图是矩形，左视图是矩形（或三角形），俯视图是三角形\n7. 四棱锥：主视图和左视图是三角形，俯视图是正方形和对角线\n\n技巧：\n- 俯视图是圆的，通常是旋转体（圆柱、圆锥、球等）\n- 俯视图是多边形的，通常是棱柱或棱锥\n- 主视图是三角形的，通常是锥体\n- 主视图是矩形的，通常是柱体","semester":"lower"},{"id":"g3_math_053","chapter":"第二十九章 投影与视图","name":"由三视图计算表面积和体积","formula":"先判断几何体形状 → 计算各面面积 → 求和得表面积\n体积：底面积 × 高（柱体），1/3 × 底面积 × 高（锥体）","explanation":"由三视图计算几何体的表面积和体积，步骤如下：\n\n1. 根据三视图判断几何体的形状\n2. 根据三视图中标注的尺寸，确定几何体各部分的尺寸\n3. 计算表面积或体积\n\n常见几何体体积公式：\n1. 正方体：V = a³，表面积 S = 6a²\n2. 长方体：V = abc，表面积 S = 2(ab + bc + ac)\n3. 圆柱：V = πr²h，侧面积 S侧 = 2πrh，表面积 S = 2πr² + 2πrh\n4. 圆锥：V = 1/3·πr²h，侧面积 S侧 = πrl（l是母线），表面积 S = πr² + πrl\n5. 棱柱：V = 底面积 × 高\n6. 棱锥：V = 1/3 × 底面积 × 高\n\n注意事项：\n1. 注意三视图中的尺寸对应关系（长对正、高平齐、宽相等）\n2. 计算表面积时注意哪些面是可见的，哪些面重合\n3. 组合体的表面积要注意减去重合部分的面积\n4. 注意单位统一","semester":"lower"}];

        // ==================== 内嵌例题数据 ====================
        const DATA_EXAMPLES = [{"id":"g3_math_001_ex01","knowledge_id":"g3_math_001","question":"选择题：下列方程中，属于一元二次方程的是（  ）\nA. 2x + 1 = 0\nB. x² + 3x - 2 = 0\nC. 1/x + x = 3\nD. x³ + x² = 1","answer":"答案：B\n解析：选项A是一元一次方程；选项B符合一元二次方程定义：只含一个未知数x，最高次数是2，是整式方程；选项C分母含未知数，是分式方程；选项D最高次数是3，是三次方程。"},{"id":"g3_math_001_ex02","knowledge_id":"g3_math_001","question":"填空题：方程 3x² - 5x + 2 = 0 的二次项系数是______，一次项系数是______，常数项是______。","answer":"答案：3，-5，2\n解析：一元二次方程一般形式为ax²+bx+c=0，其中a=3是二次项系数，b=-5是一次项系数，c=2是常数项。注意系数要带符号。"},{"id":"g3_math_001_ex03","knowledge_id":"g3_math_001","question":"选择题：若 (m-3)x² + 2x - 1 = 0 是关于x的一元二次方程，则m的取值范围是（  ）\nA. m ≠ 0\nB. m ≠ 3\nC. m > 3\nD. m为任意实数","answer":"答案：B\n解析：一元二次方程要求二次项系数不为0，即m - 3 ≠ 0，所以m ≠ 3。"},{"id":"g3_math_001_ex04","knowledge_id":"g3_math_001","question":"判断题：方程 x² + 2x = x² + 1 是一元二次方程。（  ）","answer":"答案：错误\n解析：化简后方程变为 2x = 1，即 2x - 1 = 0，是一元一次方程。判断时要先化简再判断。"},{"id":"g3_math_001_ex05","knowledge_id":"g3_math_001","question":"选择题：下列方程化为一般形式后，二次项系数是2的是（  ）\nA. 2x = x² + 1\nB. 2x² + 3 = 0\nC. x(x - 2) = 0\nD. x² + 2x = 1","answer":"答案：B\n解析：选项A化为x²-2x+1=0，二次项系数为1；选项B就是一般形式，二次项系数为2；选项C化为x²-2x=0，二次项系数为1；选项D化为x²+2x-1=0，二次项系数为1。"},{"id":"g3_math_001_ex06","knowledge_id":"g3_math_001","question":"填空题：把方程 (x+3)(x-2) = 6 化为一般形式为______。","answer":"答案：x² + x - 12 = 0\n解析：左边展开：(x+3)(x-2) = x² + 3x - 2x - 6 = x² + x - 6\n移项得：x² + x - 6 = 6\n即：x² + x - 12 = 0"},{"id":"g3_math_001_ex07","knowledge_id":"g3_math_001","question":"选择题：下列关于一元二次方程的说法，正确的是（  ）\nA. 一元二次方程的二次项系数、一次项系数、常数项都不能为0\nB. 一元二次方程的二次项系数不能为0，其他系数可以为0\nC. 一元二次方程的一次项系数不能为0\nD. 一元二次方程的常数项不能为0","answer":"答案：B\n解析：一元二次方程只要求二次项系数a≠0，一次项系数b和常数项c都可以为0。例如x²=0就是一元二次方程，此时b=0，c=0。"},{"id":"g3_math_001_ex08","knowledge_id":"g3_math_001","question":"判断题：一元二次方程最多有两个实数根。（  ）","answer":"答案：正确\n解析：一元二次方程在实数范围内最多有两个根：两个不等实根、两个相等实根，或者没有实根。所以最多有两个实数根。"},{"id":"g3_math_001_ex09","knowledge_id":"g3_math_001","question":"解答题：已知关于x的方程 (k-2)x^(|k|) + 3x - 1 = 0 是一元二次方程，求k的值。","answer":"答案：k = -2\n解析：方程是一元二次方程，需满足：\n1. 二次项系数不为0：k - 2 ≠ 0，即 k ≠ 2\n2. x的最高次数为2：|k| = 2，即 k = ±2\n综合得 k = -2"},{"id":"g3_math_001_ex10","knowledge_id":"g3_math_001","question":"选择题：下列方程中，是一元二次方程的有几个？\n① x² = 0  ② x + y = 1  ③ 2x² - 1 = 0  ④ x² + 1/x = 0（  ）\nA. 1个\nB. 2个\nC. 3个\nD. 4个","answer":"答案：B\n解析：① x²=0 是一元二次方程；② 有两个未知数，不是一元方程；③ 2x²-1=0 是一元二次方程；④ 分母有未知数，是分式方程。所以①③是一元二次方程，共2个。"},{"id":"g3_math_002_ex01","knowledge_id":"g3_math_002","question":"填空题：方程 x² = 16 的解是______。","answer":"答案：x₁ = 4，x₂ = -4\n解析：直接开平方：x = ±√16 = ±4，所以x₁ = 4，x₂ = -4。注意不要漏掉负根。"},{"id":"g3_math_002_ex02","knowledge_id":"g3_math_002","question":"选择题：方程 (x - 2)² = 9 的解是（  ）\nA. x = 5\nB. x = -1\nC. x₁ = 5，x₂ = -1\nD. x₁ = 2，x₂ = -3","answer":"答案：C\n解析：直接开平方：x - 2 = ±3\n当x - 2 = 3时，x = 5\n当x - 2 = -3时，x = -1\n所以x₁ = 5，x₂ = -1"},{"id":"g3_math_002_ex03","knowledge_id":"g3_math_002","question":"判断题：方程 x² = -9 的解是 x = ±3。（  ）","answer":"答案：错误\n解析：因为任何实数的平方都是非负数，所以x² = -9没有实数根。直接开平方法的前提是右边非负。"},{"id":"g3_math_002_ex04","knowledge_id":"g3_math_002","question":"选择题：方程 3x² - 27 = 0 的解是（  ）\nA. x = 3\nB. x = -3\nC. x₁ = 3，x₂ = -3\nD. x₁ = 9，x₂ = -9","answer":"答案：C\n解析：3x² - 27 = 0 → 3x² = 27 → x² = 9 → x = ±3\n所以x₁ = 3，x₂ = -3"},{"id":"g3_math_002_ex05","knowledge_id":"g3_math_002","question":"填空题：方程 (3x + 1)² = 16 的解是______。","answer":"答案：x₁ = 1，x₂ = -5/3\n解析：直接开平方：3x + 1 = ±4\n当3x + 1 = 4时，3x = 3，x = 1\n当3x + 1 = -4时，3x = -5，x = -5/3\n所以x₁ = 1，x₂ = -5/3"},{"id":"g3_math_002_ex06","knowledge_id":"g3_math_002","question":"选择题：下列用直接开平方法解方程，正确的是（  ）\nA. x² = a，解为x = √a\nB. (x+1)² = 4，解为x = ±2 - 1\nC. x² = -1，解为x = ±i\nD. (x-2)² = 0，只有一个解x = 2","answer":"答案：B\n解析：选项A错误，a<0时无实根，a≥0时x=±√a；选项B正确，x+1=±2，所以x=±2-1；选项C不是实数范围的解；选项D错误，是两个相等的实根x₁=x₂=2。"},{"id":"g3_math_002_ex07","knowledge_id":"g3_math_002","question":"解答题：解方程 2(x + 1)² - 8 = 0","answer":"答案：x₁ = 1，x₂ = -3\n解析：2(x + 1)² - 8 = 0\n移项：2(x + 1)² = 8\n两边除以2：(x + 1)² = 4\n开平方：x + 1 = ±2\nx + 1 = 2 → x = 1\nx + 1 = -2 → x = -3\n所以x₁ = 1，x₂ = -3"},{"id":"g3_math_002_ex08","knowledge_id":"g3_math_002","question":"选择题：方程 x² = 0 的根是（  ）\nA. 没有实数根\nB. 只有一个根x = 0\nC. 两个相等的实数根x₁ = x₂ = 0\nD. 两个不相等的实数根","answer":"答案：C\n解析：x² = 0 开平方得 x = ±0，即x₁ = x₂ = 0。一元二次方程有两个根，相等时叫重根。"},{"id":"g3_math_002_ex09","knowledge_id":"g3_math_002","question":"填空题：若 (2x - 1)² = (x + 2)²，则x = ______。","answer":"答案：x₁ = 3，x₂ = -1/3\n解析：开平方：2x - 1 = ±(x + 2)\n\n情况1：2x - 1 = x + 2 → x = 3\n\n情况2：2x - 1 = -(x + 2) → 2x - 1 = -x - 2 → 3x = -1 → x = -1/3\n\n所以x₁ = 3，x₂ = -1/3"},{"id":"g3_math_002_ex10","knowledge_id":"g3_math_002","question":"判断题：直接开平方法只适用于形如 x² = a 的方程。（  ）","answer":"答案：错误\n解析：直接开平方法适用于左边是完全平方式，右边是非负数的方程，包括(x+m)² = a、(mx+n)² = (px+q)²等形式，不只限于x² = a。"},{"id":"g3_math_003_ex01","knowledge_id":"g3_math_003","question":"填空题：用配方法解方程 x² + 6x - 7 = 0 时，两边应同时加上______。","answer":"答案：9\n解析：配方法关键是两边同时加上一次项系数一半的平方。一次项系数是6，一半是3，平方是9。所以加9。"},{"id":"g3_math_003_ex02","knowledge_id":"g3_math_003","question":"选择题：用配方法解 x² - 4x - 5 = 0，配方正确的是（  ）\nA. (x - 2)² = 9\nB. (x + 2)² = 9\nC. (x - 2)² = 1\nD. (x - 4)² = 21","answer":"答案：A\n解析：x² - 4x - 5 = 0\n移项：x² - 4x = 5\n配方：加(4/2)²=4\nx² - 4x + 4 = 5 + 4\n(x - 2)² = 9"},{"id":"g3_math_003_ex03","knowledge_id":"g3_math_003","question":"解答题：用配方法解方程 x² + 4x - 5 = 0","answer":"答案：x₁ = 1，x₂ = -5\n解析：x² + 4x - 5 = 0\n移项：x² + 4x = 5\n配方：加4\nx² + 4x + 4 = 5 + 4\n(x + 2)² = 9\n开平方：x + 2 = ±3\nx + 2 = 3 → x = 1\nx + 2 = -3 → x = -5\n所以x₁ = 1，x₂ = -5"},{"id":"g3_math_003_ex04","knowledge_id":"g3_math_003","question":"选择题：用配方法解 2x² - 4x - 6 = 0，第一步应该（  ）\nA. 两边同时加4\nB. 两边同时除以2\nC. 移项得 2x² - 4x = 6\nD. 两边同时加1","answer":"答案：B\n解析：配方法第一步是把二次项系数化为1，所以应该两边同时除以2，得到x² - 2x - 3 = 0。"},{"id":"g3_math_003_ex05","knowledge_id":"g3_math_003","question":"填空题：若 x² - 10x + m 是完全平方式，则 m = ______。","answer":"答案：25\n解析：完全平方式(x - a)² = x² - 2ax + a²。对比得2a = 10，a = 5，所以m = a² = 25。"},{"id":"g3_math_003_ex06","knowledge_id":"g3_math_003","question":"选择题：方程 x² + 8x + 12 = 0 配方后为（  ）\nA. (x + 4)² = -4\nB. (x + 4)² = 4\nC. (x - 4)² = 4\nD. (x + 8)² = 52","answer":"答案：B\n解析：x² + 8x + 12 = 0\n移项：x² + 8x = -12\n配方：加16\nx² + 8x + 16 = -12 + 16\n(x + 4)² = 4"},{"id":"g3_math_003_ex07","knowledge_id":"g3_math_003","question":"解答题：用配方法解方程 2x² + 6x - 4 = 0","answer":"答案：x₁ = (-3 + √17)/2，x₂ = (-3 - √17)/2\n解析：2x² + 6x - 4 = 0\n除以2：x² + 3x - 2 = 0\n移项：x² + 3x = 2\n配方：加(3/2)² = 9/4\nx² + 3x + 9/4 = 2 + 9/4\n(x + 3/2)² = 17/4\n开平方：x + 3/2 = ±√17/2\nx = -3/2 ± √17/2 = (-3 ± √17)/2"},{"id":"g3_math_003_ex08","knowledge_id":"g3_math_003","question":"选择题：用配方法证明 x² - 6x + 10 的值恒大于0，正确的配方是（  ）\nA. (x + 3)² + 1\nB. (x - 3)² + 1\nC. (x + 3)² - 1\nD. (x - 3)² - 1","answer":"答案：B\n解析：x² - 6x + 10 = (x² - 6x + 9) + 1 = (x - 3)² + 1\n因为(x - 3)² ≥ 0，所以(x - 3)² + 1 ≥ 1 > 0。"},{"id":"g3_math_003_ex09","knowledge_id":"g3_math_003","question":"判断题：配方法中，方程两边要同时加上一次项系数的平方。（  ）","answer":"答案：错误\n解析：不是加一次项系数的平方，而是加一次项系数一半的平方。这是最容易错的地方。"},{"id":"g3_math_003_ex10","knowledge_id":"g3_math_003","question":"选择题：若 x² + px + 9 是完全平方式，则p的值是（  ）\nA. 6\nB. -6\nC. ±6\nD. 3","answer":"答案：C\n解析：完全平方式可以是(x+3)²或(x-3)²，展开分别为x²+6x+9和x²-6x+9，所以p = ±6。"},{"id":"g3_math_004_ex01","knowledge_id":"g3_math_004","question":"选择题：方程 x² - 5x + 6 = 0 的两个根是（  ）\nA. x₁ = 2，x₂ = 3\nB. x₁ = -2，x₂ = -3\nC. x₁ = 2，x₂ = -3\nD. x₁ = -2，x₂ = 3","answer":"答案：A\n解析：a = 1，b = -5，c = 6\nΔ = 25 - 24 = 1\nx = (5 ± 1) / 2\nx₁ = (5+1)/2 = 3，x₂ = (5-1)/2 = 2"},{"id":"g3_math_004_ex02","knowledge_id":"g3_math_004","question":"填空题：一元二次方程的求根公式是 x = ______。","answer":"答案：(-b ± √(b²-4ac)) / 2a （b²-4ac ≥ 0）\n解析：对于ax²+bx+c=0(a≠0)，当Δ=b²-4ac≥0时，x = (-b ± √Δ) / 2a = (-b ± √(b²-4ac)) / 2a。这是解一元二次方程的通用公式。"},{"id":"g3_math_004_ex03","knowledge_id":"g3_math_004","question":"解答题：用公式法解方程 x² - 3x - 4 = 0","answer":"答案：x₁ = 4，x₂ = -1\n解析：a = 1，b = -3，c = -4\nΔ = 9 + 16 = 25 > 0\nx = (3 ± 5) / 2\nx₁ = (3+5)/2 = 4\nx₂ = (3-5)/2 = -1"},{"id":"g3_math_004_ex04","knowledge_id":"g3_math_004","question":"选择题：方程 2x² + 5x - 3 = 0 的根是（  ）\nA. x₁ = 1/2，x₂ = -3\nB. x₁ = -1/2，x₂ = 3\nC. x₁ = 1，x₂ = -3\nD. x₁ = 1/2，x₂ = 3","answer":"答案：A\n解析：a = 2，b = 5，c = -3\nΔ = 25 + 24 = 49\nx = (-5 ± 7) / 4\nx₁ = (-5+7)/4 = 2/4 = 1/2\nx₂ = (-5-7)/4 = -12/4 = -3"},{"id":"g3_math_004_ex05","knowledge_id":"g3_math_004","question":"判断题：公式法适用于所有一元二次方程。（  ）","answer":"答案：正确\n解析：公式法是配方法推导的结果，是解一元二次方程的通用方法。Δ≥0时能求出实根，Δ<0时判断无实根。"},{"id":"g3_math_004_ex06","knowledge_id":"g3_math_004","question":"选择题：方程 x² + 2x + 1 = 0 的根的情况是（  ）\nA. 没有实数根\nB. 有两个不相等的实数根\nC. 有两个相等的实数根\nD. 只有一个实数根","answer":"答案：C\n解析：a = 1，b = 2，c = 1\nΔ = 4 - 4 = 0\n因为Δ = 0，所以方程有两个相等的实数根。"},{"id":"g3_math_004_ex07","knowledge_id":"g3_math_004","question":"填空题：方程 x² - 2x - 2 = 0 的两根为______。","answer":"答案：x₁ = 1 + √3，x₂ = 1 - √3\n解析：a = 1，b = -2，c = -2\nΔ = 4 + 8 = 12 > 0\nx = (2 ± √12) / 2 = (2 ± 2√3) / 2 = 1 ± √3\n所以x₁ = 1+√3，x₂ = 1-√3"},{"id":"g3_math_004_ex08","knowledge_id":"g3_math_004","question":"选择题：关于求根公式，下列说法错误的是（  ）\nA. 求根公式由配方法推导而来\nB. 使用前要先化为一般形式\nC. 只要Δ ≥ 0就可以用求根公式\nD. 所有方程都有两个实根，都能用求根公式求出","answer":"答案：D\n解析：选项D错误，Δ < 0时方程没有实数根，求根公式不适用。不是所有一元二次方程都有实根。"},{"id":"g3_math_004_ex09","knowledge_id":"g3_math_004","question":"解答题：用公式法解方程 3x² - 7x + 2 = 0","answer":"答案：x₁ = 2，x₂ = 1/3\n解析：a = 3，b = -7，c = 2\nΔ = 49 - 24 = 25 > 0\nx = (7 ± 5) / 6\nx₁ = (7+5)/6 = 12/6 = 2\nx₂ = (7-5)/6 = 2/6 = 1/3"},{"id":"g3_math_004_ex10","knowledge_id":"g3_math_004","question":"选择题：求根公式 x = (-b ± √(b²-4ac)) / 2a 中，被开方数是（  ）\nA. b² - 4ac\nB. 4ac - b²\nC. b² + 4ac\nD. -b ± √(b²-4ac)","answer":"答案：A\n解析：求根公式中根号里的部分是 b² - 4ac，叫做根的判别式，记作Δ。只有Δ ≥ 0时，根号才有意义。"},{"id":"g3_math_005_ex01","knowledge_id":"g3_math_005","question":"选择题：方程 x² - 3x = 0 的根是（  ）\nA. x = 3\nB. x = 0\nC. x₁ = 0，x₂ = 3\nD. x₁ = 0，x₂ = -3","answer":"答案：C\n解析：x² - 3x = 0\n提公因式：x(x - 3) = 0\nx = 0 或 x - 3 = 0\n所以x₁ = 0，x₂ = 3"},{"id":"g3_math_005_ex02","knowledge_id":"g3_math_005","question":"填空题：方程 x² - 9 = 0 用因式分解法可化为______= 0，解得x = ______。","answer":"答案：(x+3)(x-3)，±3\n解析：x² - 9 = x² - 3² = (x+3)(x-3) = 0（平方差公式）\n所以x+3=0或x-3=0，即x₁=-3，x₂=3。"},{"id":"g3_math_005_ex03","knowledge_id":"g3_math_005","question":"选择题：用因式分解法解方程 x² - 5x + 6 = 0，正确的是（  ）\nA. (x+2)(x+3) = 0，x₁ = -2，x₂ = -3\nB. (x-2)(x-3) = 0，x₁ = 2，x₂ = 3\nC. (x+1)(x+6) = 0，x₁ = -1，x₂ = -6\nD. (x-1)(x-6) = 0，x₁ = 1，x₂ = 6","answer":"答案：B\n解析：x² - 5x + 6 = 0\n十字相乘：-2和-3，和为-5，积为6\n(x - 2)(x - 3) = 0\n所以x₁ = 2，x₂ = 3"},{"id":"g3_math_005_ex04","knowledge_id":"g3_math_005","question":"判断题：因式分解法的依据是：若ab = 0，则a = 0或b = 0。（  ）","answer":"答案：正确\n解析：这是因式分解法的基本原理：两个数的乘积为0，则至少其中一个数为0。通过因式分解把二次方程降为一次方程。"},{"id":"g3_math_005_ex05","knowledge_id":"g3_math_005","question":"填空题：方程 (x - 2)² - 4 = 0 用因式分解法解得 x = ______。","answer":"答案：x₁ = 0，x₂ = 4\n解析：(x - 2)² - 4 = 0\n平方差：[(x-2) + 2][(x-2) - 2] = 0\n即 x(x - 4) = 0\n所以x₁ = 0，x₂ = 4"},{"id":"g3_math_005_ex06","knowledge_id":"g3_math_005","question":"选择题：方程 x² + 6x + 9 = 0 用因式分解法解得（  ）\nA. x = 3\nB. x = -3\nC. x₁ = x₂ = -3\nD. x₁ = 3，x₂ = -3","answer":"答案：C\n解析：x² + 6x + 9 = 0\n完全平方：(x + 3)² = 0\n所以x₁ = x₂ = -3（两个相等的实根）"},{"id":"g3_math_005_ex07","knowledge_id":"g3_math_005","question":"解答题：用因式分解法解方程 2x² - 5x - 3 = 0","answer":"答案：x₁ = 3，x₂ = -1/2\n解析：2x² - 5x - 3 = 0\n十字相乘：2x²拆成2x和x，-3拆成-3和1\n(2x + 1)(x - 3) = 0\n验证：2x·x + 2x·(-3) + 1·x + 1·(-3) = 2x² - 6x + x - 3 = 2x² - 5x - 3 ✓\n2x + 1 = 0 → x = -1/2\nx - 3 = 0 → x = 3\n所以x₁ = 3，x₂ = -1/2"},{"id":"g3_math_005_ex08","knowledge_id":"g3_math_005","question":"选择题：解方程 (x + 2)(x - 1) = 4，正确的做法是（  ）\nA. x + 2 = 0 或 x - 1 = 0，所以x₁ = -2，x₂ = 1\nB. x + 2 = 4 且 x - 1 = 1，所以x = 2\nC. 先整理为x² + x - 6 = 0，再因式分解得(x+3)(x-2)=0，所以x₁ = -3，x₂ = 2\nD. 直接开平方","answer":"答案：C\n解析：因式分解法的前提是方程右边为0。左边展开：x² + 2x - x - 2 = x² + x - 2\n移项：x² + x - 2 = 4 → x² + x - 6 = 0\n因式分解：(x + 3)(x - 2) = 0\n所以x₁ = -3，x₂ = 2"},{"id":"g3_math_005_ex09","knowledge_id":"g3_math_005","question":"填空题：方程 3x(x - 2) = 2 - x 的解是______。","answer":"答案：x₁ = 2，x₂ = -1/3\n解析：3x(x - 2) = 2 - x\n移项：3x(x - 2) + (x - 2) = 0（注意变号：2-x = -(x-2)）\n提公因式(x-2)：(x - 2)(3x + 1) = 0\nx - 2 = 0 → x = 2\n3x + 1 = 0 → x = -1/3\n所以x₁ = 2，x₂ = -1/3"},{"id":"g3_math_005_ex10","knowledge_id":"g3_math_005","question":"选择题：下列方程中，最适合用因式分解法解的是（  ）\nA. x² + 2x - 1 = 0\nB. 2x² + 3x + 4 = 0\nC. x² - 4 = 0\nD. x² - x + 1 = 0","answer":"答案：C\n解析：x² - 4 = 0 可以直接用平方差公式分解为(x+2)(x-2)=0，最简单。选项A、B、D不易直接因式分解，更适合公式法。"},{"id":"g3_math_006_ex01","knowledge_id":"g3_math_006","question":"填空题：一元二次方程根的判别式 Δ = ______。","answer":"答案：b² - 4ac\n解析：对于一元二次方程ax²+bx+c=0(a≠0)，Δ=b²-4ac叫做根的判别式，它决定了方程根的情况。"},{"id":"g3_math_006_ex02","knowledge_id":"g3_math_006","question":"选择题：方程 x² - 3x + 2 = 0 的根的情况是（  ）\nA. 没有实数根\nB. 有两个相等的实数根\nC. 有两个不相等的实数根\nD. 只有一个实数根","answer":"答案：C\n解析：Δ = 9 - 8 = 1 > 0，所以方程有两个不相等的实数根。"},{"id":"g3_math_006_ex03","knowledge_id":"g3_math_006","question":"选择题：方程 x² + 2x + 1 = 0 的根的情况是（  ）\nA. 没有实数根\nB. 有两个相等的实数根\nC. 有两个不相等的实数根\nD. 有一个实数根","answer":"答案：B\n解析：Δ = 4 - 4 = 0，所以方程有两个相等的实数根。"},{"id":"g3_math_006_ex04","knowledge_id":"g3_math_006","question":"选择题：方程 x² + x + 1 = 0 的根的情况是（  ）\nA. 没有实数根\nB. 有两个相等的实数根\nC. 有两个不相等的实数根\nD. 有一个实数根","answer":"答案：A\n解析：Δ = 1 - 4 = -3 < 0，所以方程没有实数根。"},{"id":"g3_math_006_ex05","knowledge_id":"g3_math_006","question":"填空题：若一元二次方程 x² + 2x + m = 0 有两个不相等的实数根，则m的取值范围是______。","answer":"答案：m < 1\n解析：方程有两个不相等的实根，则Δ > 0\nΔ = 4 - 4m > 0\n4 > 4m\nm < 1"},{"id":"g3_math_006_ex06","knowledge_id":"g3_math_006","question":"判断题：一元二次方程的Δ > 0，说明方程有两个不相等的正根。（  ）","answer":"答案：错误\n解析：Δ > 0只说明有两个不相等的实数根，不一定是正根，根的正负还与系数有关。比如x² - 1 = 0的Δ=4>0，但根是±1，一正一负。"},{"id":"g3_math_006_ex07","knowledge_id":"g3_math_006","question":"选择题：若关于x的一元二次方程 kx² - 2x - 1 = 0 有两个不相等的实数根，则k的取值范围是（  ）\nA. k > -1\nB. k > -1 且 k ≠ 0\nC. k < 1\nD. k < 1 且 k ≠ 0","answer":"答案：B\n解析：首先是一元二次方程，所以k ≠ 0；\n有两个不相等的实根，所以Δ > 0：\nΔ = 4 + 4k > 0 → k > -1\n综合：k > -1 且 k ≠ 0"},{"id":"g3_math_006_ex08","knowledge_id":"g3_math_006","question":"解答题：不解方程，判断方程 2x² + 3x - 4 = 0 根的情况。","answer":"答案：有两个不相等的实数根\n解析：a = 2，b = 3，c = -4\nΔ = b² - 4ac = 9 - 4×2×(-4) = 9 + 32 = 41 > 0\n因为Δ > 0，所以方程有两个不相等的实数根。"},{"id":"g3_math_006_ex09","knowledge_id":"g3_math_006","question":"填空题：方程 x² - 4x + k = 0 有两个相等的实数根，则k = ______。","answer":"答案：4\n解析：有两个相等的实根，则Δ = 0\nΔ = 16 - 4k = 0\n4k = 16\nk = 4"},{"id":"g3_math_006_ex10","knowledge_id":"g3_math_006","question":"选择题：下列关于判别式的说法，正确的是（  ）\nA. Δ > 0，方程有两个正根\nB. Δ = 0，方程只有一个根\nC. Δ < 0，方程没有实数根\nD. Δ越大，方程的根越大","answer":"答案：C\n解析：选项A错误，Δ>0只说明有两个不等实根，不一定正；选项B错误，是两个相等的实根；选项C正确，Δ<0时没有实根；选项D错误，Δ和根的大小无关。"},{"id":"g3_math_007_ex01","knowledge_id":"g3_math_007","question":"填空题：方程 x² - 5x + 6 = 0 的两根之和是______，两根之积是______。","answer":"答案：5，6\n解析：根据韦达定理，对于x²+px+q=0，两根之和=-p，两根之积=q。\n这里p = -5，q = 6，所以x₁+x₂ = 5，x₁x₂ = 6。\n（验证：方程根是2和3，2+3=5，2×3=6 ✓）"},{"id":"g3_math_007_ex02","knowledge_id":"g3_math_007","question":"选择题：若方程 2x² + 3x - 4 = 0 的两根为x₁、x₂，则x₁ + x₂ =（  ）\nA. 3/2\nB. -3/2\nC. 3/4\nD. -2","answer":"答案：B\n解析：韦达定理：x₁ + x₂ = -b/a = -3/2，x₁x₂ = c/a = -4/2 = -2。注意不要忘了负号！"},{"id":"g3_math_007_ex03","knowledge_id":"g3_math_007","question":"填空题：已知方程 x² + bx + 6 = 0 的一个根是2，则另一个根是______，b = ______。","answer":"答案：3，-5\n解析：设另一根为x₂，由韦达定理：\nx₁x₂ = 6 → 2·x₂ = 6 → x₂ = 3\nx₁ + x₂ = -b → 2 + 3 = -b → b = -5\n（验证：方程为x²-5x+6=0，根为2和3 ✓）"},{"id":"g3_math_007_ex04","knowledge_id":"g3_math_007","question":"选择题：若x₁、x₂是方程 x² - 4x + 2 = 0 的两根，则x₁² + x₂² =（  ）\nA. 16\nB. 12\nC. 20\nD. 8","answer":"答案：B\n解析：x₁ + x₂ = 4，x₁x₂ = 2\nx₁² + x₂² = (x₁+x₂)² - 2x₁x₂ = 16 - 4 = 12"},{"id":"g3_math_007_ex05","knowledge_id":"g3_math_007","question":"判断题：如果一元二次方程有两个根，那么两根之和等于-b/a，两根之积等于c/a。（  ）","answer":"答案：正确\n解析：韦达定理：对于ax²+bx+c=0(a≠0)，若两根为x₁、x₂，则x₁+x₂ = -b/a，x₁x₂ = c/a。无论Δ≥0还是Δ<0都成立（Δ<0时是复数根）。实数范围使用时Δ≥0。"},{"id":"g3_math_007_ex06","knowledge_id":"g3_math_007","question":"选择题：已知方程 x² + (m+1)x + m = 0 的两根之和为-3，则m的值为（  ）\nA. 2\nB. -2\nC. 4\nD. -4","answer":"答案：A\n解析：两根之和 = -(m+1) = -3\n-m - 1 = -3\n-m = -2\nm = 2\n（验证：方程为x²+3x+2=0，两根为-1和-2，和为-3 ✓）"},{"id":"g3_math_007_ex07","knowledge_id":"g3_math_007","question":"填空题：若x₁、x₂是方程 2x² - 5x + 1 = 0 的两根，则 1/x₁ + 1/x₂ = ______。","answer":"答案：5\n解析：x₁ + x₂ = 5/2，x₁x₂ = 1/2\n1/x₁ + 1/x₂ = (x₁ + x₂) / (x₁x₂) = (5/2) / (1/2) = 5"},{"id":"g3_math_007_ex08","knowledge_id":"g3_math_007","question":"解答题：已知方程 x² - 3x - 2 = 0 的两根为x₁、x₂，不解方程求 (x₁ - x₂)² 的值。","answer":"答案：17\n解析：x₁ + x₂ = 3，x₁x₂ = -2\n(x₁ - x₂)² = (x₁ + x₂)² - 4x₁x₂ = 9 - 4×(-2) = 9 + 8 = 17\n（验证：|x₁-x₂| = √17，即两根之差的绝对值为√17）"},{"id":"g3_math_007_ex09","knowledge_id":"g3_math_007","question":"选择题：若一元二次方程的两根为3和-2，则这个方程可以是（  ）\nA. x² + x - 6 = 0\nB. x² - x - 6 = 0\nC. x² + x + 6 = 0\nD. x² - x + 6 = 0","answer":"答案：B\n解析：两根之和 = 3 + (-2) = 1 = -b/a\n两根之积 = 3 × (-2) = -6 = c/a\n取a=1，则b=-1，c=-6\n方程为x² - x - 6 = 0"},{"id":"g3_math_007_ex10","knowledge_id":"g3_math_007","question":"选择题：关于韦达定理的应用，下列说法错误的是（  ）\nA. 已知一根可以求另一根\nB. 可以求两根对称式的值\nC. 可以构造新的一元二次方程\nD. 韦达定理只适用于Δ > 0的情况","answer":"答案：D\n解析：韦达定理对所有一元二次方程都成立，包括Δ=0和Δ<0的情况（Δ<0时是复数根）。在实数范围应用时需要Δ≥0。"},{"id":"g3_math_008_ex01","knowledge_id":"g3_math_008","question":"选择题：某药品原价50元，经过两次降价后价格为40.5元，设平均每次降价的百分率为x，则列方程为（  ）\nA. 50(1 - x)² = 40.5\nB. 50(1 + x)² = 40.5\nC. 50(1 - 2x) = 40.5\nD. 50 - 50x² = 40.5","answer":"答案：A\n解析：第一次降价后价格为50(1-x)，第二次在第一次基础上再降，为50(1-x)(1-x) = 50(1-x)²。所以方程是50(1-x)² = 40.5。"},{"id":"g3_math_008_ex02","knowledge_id":"g3_math_008","question":"填空题：一个长方形的长比宽多2cm，面积是80cm²，设宽为x cm，则列方程为______。","answer":"答案：x(x + 2) = 80（或x² + 2x - 80 = 0）\n解析：宽为x cm，则长为(x+2) cm。长方形面积=长×宽，所以x(x+2) = 80。\n整理得x² + 2x - 80 = 0。"},{"id":"g3_math_008_ex03","knowledge_id":"g3_math_008","question":"选择题：某厂1月份产值为100万元，3月份产值为121万元，设平均每月增长率为x，则（  ）\nA. 100(1+x)² = 121\nB. 100(1-x)² = 121\nC. 100 + 100x = 121\nD. 100(1+2x) = 121","answer":"答案：A\n解析：2月份产值为100(1+x)，3月份在2月份基础上再增长，为100(1+x)(1+x) = 100(1+x)²。"},{"id":"g3_math_008_ex04","knowledge_id":"g3_math_008","question":"解答题：用一段长20m的篱笆围成一个矩形菜园，面积为24m²，求菜园的长和宽。","answer":"答案：长6m，宽4m\n解析：设长为x m，则宽为(20/2 - x) = (10 - x) m。\n面积：x(10 - x) = 24\n10x - x² = 24\nx² - 10x + 24 = 0\n(x - 4)(x - 6) = 0\nx₁ = 4（舍去，长应大于宽），x₂ = 6\n宽 = 10 - 6 = 4 m\n所以长6m，宽4m。"},{"id":"g3_math_008_ex05","knowledge_id":"g3_math_008","question":"判断题：列一元二次方程解应用题时，只要方程的解是实数就是正确答案。（  ）","answer":"答案：错误\n解析：方程的解要检验是否符合实际意义。比如长度不能为负，人数必须是正整数，增长率要合理等。不符合实际意义的解要舍去。"},{"id":"g3_math_008_ex06","knowledge_id":"g3_math_008","question":"选择题：两个连续偶数的积是120，设较小的偶数为x，则列方程为（  ）\nA. x(x+1) = 120\nB. x(x+2) = 120\nC. 2x(2x+2) = 120\nD. x + (x+2) = 120","answer":"答案：B\n解析：连续偶数相差2，较小的是x，较大的是x+2。积为x(x+2) = 120。\n（注意：连续整数差1，连续偶数/奇数差2）"},{"id":"g3_math_008_ex07","knowledge_id":"g3_math_008","question":"填空题：某商品每件进价40元，售价60元，每天可卖出100件。经调查，每降价1元可多卖10件。设降价x元，每天利润为2160元，则列方程为______。","answer":"答案：(60 - x - 40)(100 + 10x) = 2160\n解析：降价x元后：每件利润 = 60 - x - 40 = (20 - x) 元\n销量 = (100 + 10x) 件\n总利润 = 每件利润 × 销量 = (20 - x)(100 + 10x) = 2160\n即 (20 - x)(100 + 10x) = 2160"},{"id":"g3_math_008_ex08","knowledge_id":"g3_math_008","question":"解答题：某种植物的主干长出若干数目的枝干，每个枝干又长出同样数目的小分支，主干、枝干和小分支总数是91。求每个枝干长出多少个小分支。","answer":"答案：9个\n解析：设每个枝干长出x个小分支。\n主干1个，枝干x个，小分支x·x = x²个。\n总数：1 + x + x² = 91\nx² + x + 1 = 91\nx² + x - 90 = 0\n(x + 10)(x - 9) = 0\nx₁ = -10（舍去），x₂ = 9\n答：每个枝干长出9个小分支。"},{"id":"g3_math_008_ex09","knowledge_id":"g3_math_008","question":"选择题：一个直角三角形的两条直角边相差3cm，面积是9cm²，设较短直角边为x cm，则列方程为（  ）\nA. x(x+3) = 9\nB. 1/2 · x(x+3) = 9\nC. x(x+3) = 18\nD. 1/2 · x(x-3) = 9","answer":"答案：B\n解析：较短直角边为x cm，则较长为(x+3) cm。\n直角三角形面积 = 1/2 × 直角边 × 直角边 = 1/2 · x(x+3) = 9"},{"id":"g3_math_008_ex10","knowledge_id":"g3_math_008","question":"选择题：列方程解应用题时，得到的解必须检验，原因是（  ）\nA. 方程可能解错\nB. 方程的解可能不符合实际意义\nC. 一元二次方程有两个根\nD. 需要验证计算是否正确","answer":"答案：B\n解析：最主要的原因是方程的解可能不符合实际意义，比如长度不能为负、人数不能为分数等。所以要检验并舍去不合理解。"},{"id":"g3_math_009_ex01","knowledge_id":"g3_math_009","question":"选择题：下列函数中，属于二次函数的是（  ）\nA. y = 2x + 1\nB. y = x² + 2x - 3\nC. y = 1/x + x\nD. y = x³ + x²","answer":"答案：B\n解析：选项A是一次函数；选项B形如y=ax²+bx+c(a≠0)，是二次函数；选项C分母有x，不是整式函数；选项D最高次数是3，是三次函数。"},{"id":"g3_math_009_ex02","knowledge_id":"g3_math_009","question":"填空题：二次函数 y = 2x² - 3x + 1 中，二次项系数是______，一次项系数是______，常数项是______。","answer":"答案：2，-3，1\n解析：二次函数一般形式y=ax²+bx+c中，a=2是二次项系数，b=-3是一次项系数，c=1是常数项。注意系数带符号。"},{"id":"g3_math_009_ex03","knowledge_id":"g3_math_009","question":"选择题：若 y = (m-2)x² + 3x - 1 是二次函数，则m的取值范围是（  ）\nA. m ≠ 0\nB. m ≠ 2\nC. m > 2\nD. m为任意实数","answer":"答案：B\n解析：二次函数要求二次项系数不为0，即m - 2 ≠ 0，所以m ≠ 2。"},{"id":"g3_math_009_ex04","knowledge_id":"g3_math_009","question":"判断题：函数 y = x² + 2x - x² 是二次函数。（  ）","answer":"答案：错误\n解析：化简后 y = 2x，是一次函数，不是二次函数。判断时要先化简再判断。"},{"id":"g3_math_009_ex05","knowledge_id":"g3_math_009","question":"选择题：二次函数的一般形式是（  ）\nA. y = kx + b (k ≠ 0)\nB. y = ax² + bx + c (a ≠ 0)\nC. y = k/x (k ≠ 0)\nD. y = ax² (a ≠ 0)","answer":"答案：B\n解析：二次函数的一般形式是 y = ax² + bx + c (a ≠ 0)，其中a、b、c是常数，a不能为0。"},{"id":"g3_math_009_ex06","knowledge_id":"g3_math_009","question":"填空题：圆的面积S与半径r的函数关系式 S = πr² 中，二次项系数是______。","answer":"答案：π\n解析：S = πr² 可以写成 S = πr² + 0r + 0，其中二次项系数是π，一次项系数和常数项都是0。"},{"id":"g3_math_009_ex07","knowledge_id":"g3_math_009","question":"选择题：下列说法正确的是（  ）\nA. 二次函数的二次项系数可以为0\nB. 二次函数的一次项系数不能为0\nC. 二次函数的常数项不能为0\nD. 二次函数自变量的最高次数是2","answer":"答案：D\n解析：选项A错误，a=0就不是二次函数了；选项B错误，b可以为0，如y=x²；选项C错误，c可以为0，如y=x²+2x；选项D正确，二次函数最高次数是2。"},{"id":"g3_math_009_ex08","knowledge_id":"g3_math_009","question":"填空题：已知二次函数 y = x² + bx + c，当x=1时y=0，当x=2时y=3，则b = ______，c = ______。","answer":"答案：-2，1\n解析：代入x=1, y=0：1 + b + c = 0 → b + c = -1\n代入x=2, y=3：4 + 2b + c = 3 → 2b + c = -1\n两式相减：b = 0 → c = -1？ 不对，让我重新算：\n由式1：b + c = -1\n由式2：2b + c = -1\n式2 - 式1：b = 0\n代入b=0到式1：c = -1\n（验证：y = x² - 1，x=1时y=0 ✓，x=2时y=3 ✓）"},{"id":"g3_math_009_ex09","knowledge_id":"g3_math_009","question":"判断题：二次函数的自变量取值范围是全体实数。（  ）","answer":"答案：正确\n解析：二次函数 y = ax² + bx + c 中，x取任何实数都有意义，所以自变量取值范围是全体实数。但实际问题中要根据具体情况确定。"},{"id":"g3_math_009_ex10","knowledge_id":"g3_math_009","question":"选择题：函数 y = (x+1)(x-2) 化为一般形式后，二次项系数、一次项系数、常数项分别是（  ）\nA. 1，-1，-2\nB. 1，1，-2\nC. 1，-2，-1\nD. x²，-x，-2","answer":"答案：A\n解析：y = (x+1)(x-2) = x² - 2x + x - 2 = x² - x - 2\n所以二次项系数1，一次项系数-1，常数项-2。"},{"id":"g3_math_010_ex01","knowledge_id":"g3_math_010","question":"选择题：二次函数 y = 2x² 的图象是（  ）\nA. 直线\nB. 双曲线\nC. 抛物线\nD. 折线","answer":"答案：C\n解析：二次函数的图象都是抛物线。y = 2x² 的开口向上，顶点在原点。"},{"id":"g3_math_010_ex02","knowledge_id":"g3_math_010","question":"填空题：抛物线 y = -3x² 的开口方向是______，顶点坐标是______，对称轴是______。","answer":"答案：向下，(0, 0)，y轴（或直线x=0）\n解析：y = ax² 中，a = -3 < 0，所以开口向下；顶点在原点(0,0)；对称轴是y轴（直线x=0）。"},{"id":"g3_math_010_ex03","knowledge_id":"g3_math_010","question":"选择题：对于抛物线 y = 5x²，下列说法正确的是（  ）\nA. 开口向下，有最高点\nB. 开口向上，有最低点\nC. 开口向下，有最低点\nD. 开口向上，有最高点","answer":"答案：B\n解析：a = 5 > 0，所以开口向上，有最低点（顶点），y有最小值0。"},{"id":"g3_math_010_ex04","knowledge_id":"g3_math_010","question":"判断题：抛物线 y = x² 的对称轴是x轴。（  ）","answer":"答案：错误\n解析：抛物线 y = x² 的对称轴是y轴（直线x=0），不是x轴。对称轴是使抛物线左右对称的直线。"},{"id":"g3_math_010_ex05","knowledge_id":"g3_math_010","question":"选择题：在下列抛物线中，开口最窄的是（  ）\nA. y = x²\nB. y = 2x²\nC. y = 1/2 x²\nD. y = 0.1x²","answer":"答案：B\n解析：|a|越大，抛物线开口越窄；|a|越小，开口越宽。\n|2| > |1| > |1/2| > |0.1|，所以y = 2x²开口最窄。"},{"id":"g3_math_010_ex06","knowledge_id":"g3_math_010","question":"填空题：抛物线 y = 4x² 当x ______时，y随x的增大而增大；当x ______时，y随x的增大而减小。","answer":"答案：> 0，< 0\n解析：y = 4x² 中a = 4 > 0，开口向上，对称轴是y轴。\n所以当x > 0时，y随x增大而增大；当x < 0时，y随x增大而减小。"},{"id":"g3_math_010_ex07","knowledge_id":"g3_math_010","question":"选择题：关于抛物线 y = -2x²，下列说法错误的是（  ）\nA. 顶点坐标是(0, 0)\nB. 对称轴是y轴\nC. 当x > 0时，y随x的增大而减小\nD. 函数有最小值0","answer":"答案：D\n解析：a = -2 < 0，开口向下，有最高点，函数有最大值0，不是最小值。其他选项都正确。"},{"id":"g3_math_010_ex08","knowledge_id":"g3_math_010","question":"解答题：已知抛物线 y = ax² 经过点(2, 8)，求a的值。","answer":"答案：a = 2\n解析：将点(2, 8)代入 y = ax²：\n8 = a × 2²\n8 = 4a\na = 2\n所以抛物线解析式为 y = 2x²。"},{"id":"g3_math_010_ex09","knowledge_id":"g3_math_010","question":"填空题：抛物线 y = x² 上有一点A，A的横坐标是3，则A点的纵坐标是______。","answer":"答案：9\n解析：将x = 3代入 y = x²，得 y = 3² = 9。所以A点坐标是(3, 9)，纵坐标是9。"},{"id":"g3_math_010_ex10","knowledge_id":"g3_math_010","question":"选择题：抛物线 y = 3x² 和 y = -3x² 的关系是（  ）\nA. 关于x轴对称\nB. 关于y轴对称\nC. 关于原点对称\nD. 没有对称关系","answer":"答案：A\n解析：对于相同的x值，两个函数的y值互为相反数，所以它们关于x轴对称。两个抛物线开口方向相反，形状大小相同。"},{"id":"g3_math_011_ex01","knowledge_id":"g3_math_011","question":"选择题：抛物线 y = (x - 2)² + 3 的顶点坐标是（  ）\nA. (2, 3)\nB. (-2, 3)\nC. (2, -3)\nD. (-2, -3)","answer":"答案：A\n解析：顶点式 y = a(x-h)² + k 的顶点坐标是(h, k)。这里h = 2，k = 3，所以顶点是(2, 3)。注意h前面是减号。"},{"id":"g3_math_011_ex02","knowledge_id":"g3_math_011","question":"填空题：抛物线 y = -2(x + 1)² - 4 的开口方向是______，对称轴是______，顶点坐标是______。","answer":"答案：向下，直线x = -1，(-1, -4)\n解析：a = -2 < 0，开口向下；\n顶点式为 y = -2(x-(-1))² + (-4)，所以h = -1，k = -4；\n对称轴是直线x = h = -1；顶点坐标(-1, -4)。"},{"id":"g3_math_011_ex03","knowledge_id":"g3_math_011","question":"选择题：将抛物线 y = x² 向右平移3个单位，得到的抛物线是（  ）\nA. y = (x+3)²\nB. y = (x-3)²\nC. y = x² + 3\nD. y = x² - 3","answer":"答案：B\n解析：抛物线平移规律：左加右减（在括号内，针对x），上加下减（在括号外，针对y）。\n向右平移3个单位，x变成x-3，所以y = (x-3)²。"},{"id":"g3_math_011_ex04","knowledge_id":"g3_math_011","question":"判断题：抛物线 y = 2(x+1)² - 3 的对称轴是直线x = 1。（  ）","answer":"答案：错误\n解析：y = 2(x+1)² - 3 = 2(x-(-1))² - 3，所以h = -1，对称轴是直线x = -1，不是x = 1。注意符号！"},{"id":"g3_math_011_ex05","knowledge_id":"g3_math_011","question":"选择题：抛物线 y = (x-1)² + 2 的最小值是（  ）\nA. 1\nB. 2\nC. -1\nD. -2","answer":"答案：B\n解析：a = 1 > 0，开口向上，顶点是最低点。顶点坐标(1, 2)，所以y的最小值是2。"},{"id":"g3_math_011_ex06","knowledge_id":"g3_math_011","question":"填空题：将抛物线 y = -x² 先向左平移2个单位，再向上平移3个单位，得到的抛物线解析式是______。","answer":"答案：y = -(x + 2)² + 3\n解析：向左平移2个单位：x → x+2，y = -(x+2)²\n向上平移3个单位：整体加3，y = -(x+2)² + 3\n（口诀：左加右减，上加下减）"},{"id":"g3_math_011_ex07","knowledge_id":"g3_math_011","question":"选择题：抛物线 y = -3(x-2)² + 5，当x为何值时，y随x的增大而增大？（  ）\nA. x > 2\nB. x < 2\nC. x > -2\nD. x < -2","answer":"答案：B\n解析：a = -3 < 0，开口向下，对称轴是直线x = 2。\n开口向下时，在对称轴左侧（x < 2）y随x增大而增大，在右侧y随x增大而减小。"},{"id":"g3_math_011_ex08","knowledge_id":"g3_math_011","question":"解答题：已知抛物线的顶点坐标是(1, -2)，且经过点(2, 3)，求抛物线的解析式。","answer":"答案：y = 5(x-1)² - 2\n解析：顶点是(1, -2)，设顶点式 y = a(x-1)² - 2\n代入点(2, 3)：3 = a(2-1)² - 2\n3 = a - 2\na = 5\n所以抛物线解析式为 y = 5(x-1)² - 2。"},{"id":"g3_math_011_ex09","knowledge_id":"g3_math_011","question":"选择题：抛物线 y = 2(x+3)² - 1 可以由 y = 2x² 如何平移得到？（  ）\nA. 向左平移3个单位，再向上平移1个单位\nB. 向右平移3个单位，再向上平移1个单位\nC. 向左平移3个单位，再向下平移1个单位\nD. 向右平移3个单位，再向下平移1个单位","answer":"答案：C\n解析：y = 2(x+3)² - 1 中，x变成了x+3（左加，向左3个单位），整体减了1（下减，向下1个单位）。\n所以是向左平移3个单位，再向下平移1个单位。"},{"id":"g3_math_011_ex10","knowledge_id":"g3_math_011","question":"填空题：抛物线 y = a(x-h)² + k 中，决定开口方向的是______，决定顶点位置的是______和______。","answer":"答案：a，h，k\n解析：a决定开口方向（a>0向上，a<0向下）和开口大小；\nh决定左右位置，k决定上下位置，(h, k)是顶点坐标。"},{"id":"g3_math_012_ex01","knowledge_id":"g3_math_012","question":"选择题：抛物线 y = x² - 4x + 3 的对称轴是（  ）\nA. 直线x = 2\nB. 直线x = -2\nC. 直线x = 4\nD. 直线x = -4","answer":"答案：A\n解析：对称轴公式：x = -b/2a = -(-4)/(2×1) = 4/2 = 2。所以对称轴是直线x = 2。"},{"id":"g3_math_012_ex02","knowledge_id":"g3_math_012","question":"填空题：抛物线 y = 2x² + 4x - 1 的顶点坐标是______。","answer":"答案：(-1, -3)\n解析：顶点横坐标：x = -b/2a = -4/(2×2) = -1\n代入求纵坐标：y = 2×(-1)² + 4×(-1) - 1 = 2 - 4 - 1 = -3\n所以顶点坐标是(-1, -3)。"},{"id":"g3_math_012_ex03","knowledge_id":"g3_math_012","question":"选择题：抛物线 y = -x² + 2x + 3 的最大值是（  ）\nA. 3\nB. 4\nC. 5\nD. 2","answer":"答案：B\n解析：a = -1 < 0，开口向下，有最大值。\n顶点横坐标：x = -b/2a = -2/(-2) = 1\n代入：y = -1 + 2 + 3 = 4\n所以最大值是4。"},{"id":"g3_math_012_ex04","knowledge_id":"g3_math_012","question":"判断题：抛物线 y = ax² + bx + c 的顶点纵坐标是 (4ac-b²)/4a。（  ）","answer":"答案：正确\n解析：顶点坐标公式：(-b/2a, (4ac-b²)/4a)，纵坐标是(4ac-b²)/4a。这是二次函数最值公式。"},{"id":"g3_math_012_ex05","knowledge_id":"g3_math_012","question":"选择题：抛物线 y = x² - 6x + 5 与y轴的交点坐标是（  ）\nA. (0, 5)\nB. (5, 0)\nC. (0, -5)\nD. (-5, 0)","answer":"答案：A\n解析：与y轴交点，令x=0，则y = 0 - 0 + 5 = 5，所以交点坐标是(0, 5)。即c值就是y轴截距。"},{"id":"g3_math_012_ex06","knowledge_id":"g3_math_012","question":"填空题：抛物线 y = 2x² + bx + 3 的对称轴是直线x = 2，则b = ______。","answer":"答案：-8\n解析：对称轴公式：x = -b/2a = 2\n代入a = 2：-b/4 = 2\n-b = 8\nb = -8"},{"id":"g3_math_012_ex07","knowledge_id":"g3_math_012","question":"选择题：将 y = x² - 2x + 3 化为顶点式，正确的是（  ）\nA. y = (x-1)² + 2\nB. y = (x+1)² + 2\nC. y = (x-1)² - 2\nD. y = (x+1)² - 2","answer":"答案：A\n解析：y = x² - 2x + 3 = (x² - 2x + 1) + 2 = (x-1)² + 2\n（配方：加1减1平衡，这里原式有3，所以加1后是3+1-1？不对，重新算：\nx²-2x+3 = (x²-2x+1) + 2 = (x-1)² + 2 ✓）"},{"id":"g3_math_012_ex08","knowledge_id":"g3_math_012","question":"解答题：求抛物线 y = -x² + 4x - 3 的顶点坐标和对称轴。","answer":"答案：顶点(2, 1)，对称轴直线x = 2\n解析：a = -1，b = 4，c = -3\n顶点横坐标：x = -b/2a = -4/(-2) = 2\n代入：y = -4 + 8 - 3 = 1\n所以顶点坐标(2, 1)，对称轴是直线x = 2。"},{"id":"g3_math_012_ex09","knowledge_id":"g3_math_012","question":"判断题：对于二次函数 y = ax² + bx + c，b = 0 时，对称轴是y轴。（  ）","answer":"答案：正确\n解析：b = 0时，对称轴x = -0/2a = 0，即y轴。所以b=0时抛物线关于y轴对称。"},{"id":"g3_math_012_ex10","knowledge_id":"g3_math_012","question":"选择题：抛物线 y = x² + 2x - 3 与x轴的交点个数是（  ）\nA. 0个\nB. 1个\nC. 2个\nD. 无法确定","answer":"答案：C\n解析：Δ = b² - 4ac = 4 + 12 = 16 > 0，所以抛物线与x轴有两个交点。（即方程x²+2x-3=0有两个不等实根）"},{"id":"g3_math_013_ex01","knowledge_id":"g3_math_013","question":"选择题：已知抛物线经过(0, 1)、(1, 3)、(-1, 1)三点，用一般式求解时，首先可以确定的是（  ）\nA. a = 1\nB. b = 2\nC. c = 1\nD. c = -1","answer":"答案：C\n解析：过(0, 1)即x=0时y=1，代入y=ax²+bx+c得c=1。c值就是抛物线与y轴交点的纵坐标。"},{"id":"g3_math_013_ex02","knowledge_id":"g3_math_013","question":"填空题：已知抛物线顶点是(2, -1)，且过点(3, 1)，用顶点式求解，解析式为______。","answer":"答案：y = 2(x-2)² - 1\n解析：顶点(2, -1)，设y = a(x-2)² - 1\n代入(3, 1)：1 = a(1)² - 1 → 1 = a - 1 → a = 2\n所以y = 2(x-2)² - 1"},{"id":"g3_math_013_ex03","knowledge_id":"g3_math_013","question":"选择题：抛物线与x轴交于(1, 0)和(3, 0)，且过点(2, 2)，最简便的方法是用（  ）\nA. 一般式\nB. 顶点式\nC. 交点式\nD. 以上都一样","answer":"答案：C\n解析：已知抛物线与x轴的两个交点，用交点式 y = a(x-x₁)(x-x₂) 最简便，只需再求a的值。"},{"id":"g3_math_013_ex04","knowledge_id":"g3_math_013","question":"判断题：用待定系数法求二次函数解析式时，需要三个条件才能确定a、b、c。（  ）","answer":"答案：正确\n解析：一般式有三个未知数a、b、c，所以需要三个条件（三个点的坐标）才能唯一确定。顶点式和交点式只需两个条件。"},{"id":"g3_math_013_ex05","knowledge_id":"g3_math_013","question":"填空题：抛物线与x轴交于(-2, 0)和(3, 0)，且过点(1, -12)，则抛物线解析式为______。","answer":"答案：y = 2(x+2)(x-3) 或 y = 2x² - 2x - 12\n解析：设交点式：y = a(x+2)(x-3)\n代入(1, -12)：-12 = a(3)(-2) = -6a → a = 2\n所以y = 2(x+2)(x-3) = 2(x² - x - 6) = 2x² - 2x - 12"},{"id":"g3_math_013_ex06","knowledge_id":"g3_math_013","question":"选择题：已知抛物线顶点在原点，且过点(2, 8)，则解析式为（  ）\nA. y = 2x²\nB. y = 4x²\nC. y = 8x²\nD. y = x² + 8","answer":"答案：A\n解析：顶点在原点，设y = ax²\n代入(2, 8)：8 = a×4 → a = 2\n所以y = 2x²"},{"id":"g3_math_013_ex07","knowledge_id":"g3_math_013","question":"解答题：已知抛物线经过(0, 2)、(1, 0)、(2, 0)三点，求解析式。","answer":"答案：y = x² - 3x + 2\n解析：设 y = ax² + bx + c\n代入(0, 2)：c = 2\n代入(1, 0)：a + b + 2 = 0 → a + b = -2\n代入(2, 0)：4a + 2b + 2 = 0 → 2a + b = -1\n两式相减：a = 1，b = -3\n所以y = x² - 3x + 2\n（验证：(x-1)(x-2) = x²-3x+2 ✓）"},{"id":"g3_math_013_ex08","knowledge_id":"g3_math_013","question":"选择题：二次函数 y = ax² + bx + c 中，若a、b、c都已知，则（  ）\nA. 需要再给一个条件才能确定图象\nB. 图象已经唯一确定\nC. 无法确定图象\nD. 只能确定开口方向","answer":"答案：B\n解析：a、b、c三个参数都已知，二次函数就唯一确定了，图象也唯一确定。"},{"id":"g3_math_013_ex09","knowledge_id":"g3_math_013","question":"填空题：抛物线过(-1, 0)、(3, 0)，顶点纵坐标是4，则顶点坐标是______。","answer":"答案：(1, 4)\n解析：抛物线与x轴交于(-1, 0)和(3, 0)，则对称轴是两点的中垂线：x = (-1+3)/2 = 1\n顶点在对称轴上，纵坐标是4，所以顶点坐标(1, 4)。"},{"id":"g3_math_013_ex10","knowledge_id":"g3_math_013","question":"选择题：求二次函数解析式时，已知顶点和另外一点，最好用（  ）\nA. 一般式\nB. 顶点式\nC. 交点式\nD. 都可以","answer":"答案：B\n解析：已知顶点坐标(h, k)，用顶点式 y = a(x-h)² + k 最方便，只需代入另一点求a即可。"},{"id":"g3_math_014_ex01","knowledge_id":"g3_math_014","question":"选择题：抛物线 y = x² - 2x - 3 与x轴的交点坐标是（  ）\nA. (3, 0)和(-1, 0)\nB. (3, 0)和(1, 0)\nC. (-3, 0)和(1, 0)\nD. (-3, 0)和(-1, 0)","answer":"答案：A\n解析：令y = 0，解方程x² - 2x - 3 = 0\n因式分解：(x-3)(x+1) = 0\nx₁ = 3，x₂ = -1\n所以交点坐标是(3, 0)和(-1, 0)。"},{"id":"g3_math_014_ex02","knowledge_id":"g3_math_014","question":"填空题：抛物线 y = x² - 4x + 4 与x轴有______个交点。","answer":"答案：1（或两交点重合）\n解析：Δ = b²-4ac = 16 - 16 = 0，所以抛物线与x轴只有一个交点（顶点），即两个相等的交点。"},{"id":"g3_math_014_ex03","knowledge_id":"g3_math_014","question":"选择题：若抛物线 y = x² + 2x + m 与x轴没有交点，则m的取值范围是（  ）\nA. m > 1\nB. m < 1\nC. m ≥ 1\nD. m ≤ 1","answer":"答案：A\n解析：与x轴没有交点，即Δ < 0\nΔ = 4 - 4m < 0\n4 < 4m\nm > 1"},{"id":"g3_math_014_ex04","knowledge_id":"g3_math_014","question":"判断题：抛物线与x轴的交点的横坐标就是相应一元二次方程的根。（  ）","answer":"答案：正确\n解析：抛物线y=ax²+bx+c与x轴交点的横坐标，就是方程ax²+bx+c=0的根。这是二次函数与一元二次方程的基本关系。"},{"id":"g3_math_014_ex05","knowledge_id":"g3_math_014","question":"填空题：抛物线 y = 2x² + 5x + 2 与x轴两交点之间的距离是______。","answer":"答案：3/2\n解析：解方程2x²+5x+2 = 0，(2x+1)(x+2) = 0，x₁ = -1/2，x₂ = -2\n距离 = |x₁ - x₂| = |-1/2 - (-2)| = |3/2| = 3/2\n或用公式：√Δ/|a| = √(25-16)/2 = √9/2 = 3/2"},{"id":"g3_math_014_ex06","knowledge_id":"g3_math_014","question":"选择题：二次函数 y = ax² + bx + c 的图象全部在x轴上方的条件是（  ）\nA. a > 0，Δ > 0\nB. a > 0，Δ < 0\nC. a < 0，Δ > 0\nD. a < 0，Δ < 0","answer":"答案：B\n解析：图象全部在x轴上方，说明开口向上（a > 0）且与x轴没有交点（Δ < 0）。"},{"id":"g3_math_014_ex07","knowledge_id":"g3_math_014","question":"解答题：求证：抛物线 y = x² - (m+2)x + 2m 与x轴一定有交点。","answer":"答案：Δ = (m-2)² ≥ 0，所以一定有交点\n解析：Δ = b² - 4ac = [-(m+2)]² - 4×1×2m = m² + 4m + 4 - 8m = m² - 4m + 4 = (m-2)²\n因为任何实数的平方都非负，所以(m-2)² ≥ 0，即Δ ≥ 0\n所以抛物线与x轴一定有交点（Δ>0时两个交点，Δ=0时一个交点）。"},{"id":"g3_math_014_ex08","knowledge_id":"g3_math_014","question":"选择题：方程 x² + 2x - 3 = 0 的两个根是x₁ = 1，x₂ = -3，则抛物线 y = x² + 2x - 3 与x轴交点坐标是（  ）\nA. (1, 0)和(-3, 0)\nB. (0, 1)和(0, -3)\nC. (-1, 0)和(3, 0)\nD. (1, 0)和(3, 0)","answer":"答案：A\n解析：抛物线与x轴交点的横坐标就是方程的根，纵坐标为0。所以交点是(1, 0)和(-3, 0)。"},{"id":"g3_math_014_ex09","knowledge_id":"g3_math_014","question":"判断题：Δ > 0 说明抛物线与x轴有两个正交点。（  ）","answer":"答案：错误\n解析：Δ > 0只说明有两个交点，不一定都是正的，可能一正一负，也可能都是负的，要看两根之和与两根之积的符号。"},{"id":"g3_math_014_ex10","knowledge_id":"g3_math_014","question":"填空题：抛物线 y = ax² + bx + c 与x轴交于(x₁, 0)、(x₂, 0)，则x₁ + x₂ = ______。","answer":"答案：-b/a\n解析：根据韦达定理，方程ax²+bx+c=0的两根之和为-b/a，即抛物线与x轴两交点横坐标之和为-b/a。"},{"id":"g3_math_015_ex01","knowledge_id":"g3_math_015","question":"选择题：用长度为20m的篱笆围成矩形菜园，设一边长为x m，面积为S m²，则S与x的函数关系式为（  ）\nA. S = x(20-x)\nB. S = x(10-x)\nC. S = 2x(10-x)\nD. S = x(20-2x)","answer":"答案：B\n解析：一边长为x m，则另一边长为(20/2 - x) = (10 - x) m\n面积 = 长 × 宽 = x(10 - x)\n所以S = x(10 - x) = -x² + 10x"},{"id":"g3_math_015_ex02","knowledge_id":"g3_math_015","question":"填空题：某商品进价40元，售价60元，每天卖100件。每降价1元多卖10件。设降价x元，每天利润W元，则W与x的函数关系式为______。","answer":"答案：W = (20 - x)(100 + 10x) 或 W = -10x² + 100x + 2000\n解析：降价x元后，每件利润 = (60-x) - 40 = 20 - x 元\n销量 = 100 + 10x 件\n总利润W = (20 - x)(100 + 10x) = -10x² + 100x + 2000"},{"id":"g3_math_015_ex03","knowledge_id":"g3_math_015","question":"选择题：矩形周长为20cm，面积最大时，边长分别为（  ）\nA. 5cm和5cm（正方形）\nB. 8cm和2cm\nC. 6cm和4cm\nD. 7cm和3cm","answer":"答案：A\n解析：设一边为x，则另一边为10-x，面积S = x(10-x) = -x² + 10x\na = -1 < 0，开口向下，顶点时面积最大\nx = -b/2a = 10/2 = 5\n即两边都是5cm时面积最大（正方形）。"},{"id":"g3_math_015_ex04","knowledge_id":"g3_math_015","question":"判断题：二次函数应用题中，函数的最值一定在顶点处取得。（  ）","answer":"答案：错误\n解析：不一定。要看自变量的取值范围。如果顶点在取值范围内，最值在顶点；如果不在，最值可能在端点处取得。"},{"id":"g3_math_015_ex05","knowledge_id":"g3_math_015","question":"填空题：某产品成本20元/件，售价x元/件，销量y = -2x + 80件。则每天利润W与售价x的函数关系式为______。","answer":"答案：W = (x - 20)(-2x + 80) 或 W = -2x² + 120x - 1600\n解析：每件利润 = (x - 20) 元\n销量 = (-2x + 80) 件\n总利润W = (x - 20)(-2x + 80) = -2x² + 120x - 1600"},{"id":"g3_math_015_ex06","knowledge_id":"g3_math_015","question":"选择题：将一根长40cm的铁丝折成矩形，面积最大是（  ）\nA. 100 cm²\nB. 75 cm²\nC. 96 cm²\nD. 80 cm²","answer":"答案：A\n解析：设长为x，则宽为20-x，面积S = x(20-x) = -x² + 20x\n最大值在x=10时取得，S = 10×10 = 100 cm²\n（折成正方形时面积最大）"},{"id":"g3_math_015_ex07","knowledge_id":"g3_math_015","question":"解答题：某商品进价30元，售价40元时每天卖150件。每涨1元少卖10件。要使每天利润最大，售价应定为多少元？","answer":"答案：售价定为42.5元时利润最大\n解析：设涨价x元，售价为(40+x)元，销量为(150-10x)件\n每件利润 = 40+x-30 = 10+x\n总利润W = (10+x)(150-10x) = -10x² + 50x + 1500\na = -10 < 0，开口向下，x = -b/2a = -50/(-20) = 2.5 时利润最大\n售价 = 40 + 2.5 = 42.5元"},{"id":"g3_math_015_ex08","knowledge_id":"g3_math_015","question":"选择题：抛物线型拱桥，当水面宽20m时，拱顶离水面4m。以拱顶为原点建立坐标系，抛物线解析式为（  ）\nA. y = -1/25 x²\nB. y = 1/25 x²\nC. y = -1/100 x²\nD. y = -4x²","answer":"答案：A\n解析：顶点在原点，设y = ax²\n水面宽20m时，即x = ±10时，y = -4（拱顶在原点，水面在下方）\n代入(10, -4)：-4 = a×100 → a = -4/100 = -1/25\n所以y = -1/25 x²"},{"id":"g3_math_015_ex09","knowledge_id":"g3_math_015","question":"填空题：一个小球从地面竖直上抛，高度h(m)与时间t(s)满足 h = -5t² + 20t，则小球最高能到______m。","answer":"答案：20\n解析：a = -5 < 0，开口向下，最高点在顶点\n顶点t = -b/2a = -20/(-10) = 2s\n代入：h = -5×4 + 40 = -20 + 40 = 20 m\n所以最高20米。"},{"id":"g3_math_015_ex10","knowledge_id":"g3_math_015","question":"选择题：解决二次函数最值问题的关键是（  ）\nA. 直接求顶点\nB. 建立函数关系式，注意自变量取值范围\nC. 随便取几个值比较\nD. 只看开口方向","answer":"答案：B\n解析：关键是先正确建立函数关系式，然后分析自变量的取值范围，再判断最值在顶点还是端点。"},{"id":"g3_math_016_ex01","knowledge_id":"g3_math_016","question":"选择题：下列运动属于旋转的是（  ）\nA. 电梯上下运动\nB. 钟表指针的转动\nC. 汽车在平直公路上行驶\nD. 缆车沿索道移动","answer":"答案：B\n解析：旋转是绕一个定点转动。钟表指针绕中心轴转动，是旋转。其他选项都是平移。"},{"id":"g3_math_016_ex02","knowledge_id":"g3_math_016","question":"填空题：旋转的三要素是______、______、______。","answer":"答案：旋转中心，旋转方向，旋转角度\n解析：旋转三要素：旋转中心（绕哪个点转）、旋转方向（顺时针还是逆时针）、旋转角度（转多少度）。三要素决定了旋转后的位置。"},{"id":"g3_math_016_ex03","knowledge_id":"g3_math_016","question":"选择题：将△ABC绕点O顺时针旋转60°得到△A'B'C'，则∠AOA'的度数是（  ）\nA. 30°\nB. 60°\nC. 90°\nD. 120°","answer":"答案：B\n解析：旋转角是对应点与旋转中心连线的夹角，∠AOA'和∠BOB'、∠COC'都是旋转角，等于60°。"},{"id":"g3_math_016_ex04","knowledge_id":"g3_math_016","question":"判断题：将一个图形绕某一点旋转一定角度后，旋转前后的图形形状和大小都不变，因此两个图形全等。（  ）","answer":"答案：正确\n解析：旋转不改变图形的形状和大小，只改变位置，所以旋转前后的图形全等。对应边相等，对应角相等。"},{"id":"g3_math_016_ex05","knowledge_id":"g3_math_016","question":"填空题：如图，将△ABC绕点A逆时针旋转90°，点B的对应点是B'，则AB = ______，∠BAB' = ______°。","answer":"答案：AB'，90\n解析：旋转前后对应线段相等，所以AB = AB'；\n旋转角是90°，所以对应点与旋转中心连线的夹角∠BAB' = 90°。"},{"id":"g3_math_016_ex06","knowledge_id":"g3_math_016","question":"选择题：下列说法错误的是（  ）\nA. 旋转不改变图形的形状和大小\nB. 旋转中心一定在图形上\nC. 对应点到旋转中心的距离相等\nD. 旋转角相等","answer":"答案：B\n解析：旋转中心可以在图形上，也可以在图形外，不一定在图形上。其他选项都是旋转的基本性质。"},{"id":"g3_math_016_ex07","knowledge_id":"g3_math_016","question":"解答题：将点P(2, 3)绕原点逆时针旋转90°，求对应点P'的坐标。","answer":"答案：P'(-3, 2)\n解析：绕原点逆时针旋转90°的坐标变换规律：(x, y) → (-y, x)\n所以P(2, 3) → P'(-3, 2)\n（验证：OP长度=√(4+9)=√13，OP'长度=√(9+4)=√13，距离相等 ✓）"},{"id":"g3_math_016_ex08","knowledge_id":"g3_math_016","question":"选择题：一个图形绕某点旋转后，下列说法正确的是（  ）\nA. 对应线段平行且相等\nB. 对应点连线被旋转中心平分\nC. 对应点到旋转中心的距离相等\nD. 旋转角等于对应边的夹角","answer":"答案：C\n解析：选项A是平移的性质；选项B是中心对称的性质（不是一般旋转）；选项C正确，对应点到旋转中心距离相等；选项D不准确。"},{"id":"g3_math_016_ex09","knowledge_id":"g3_math_016","question":"填空题：正六边形绕中心至少旋转______°能与自身重合。","answer":"答案：60\n解析：正六边形可以分成6个等边三角形，中心角 = 360°/6 = 60°，所以绕中心旋转60°的整数倍都能与自身重合，最小旋转角是60°。"},{"id":"g3_math_016_ex10","knowledge_id":"g3_math_016","question":"选择题：旋转和平移的共同点是（  ）\nA. 都绕一个点转动\nB. 都不改变图形的形状和大小\nC. 都使图形沿直线运动\nD. 都需要确定旋转中心","answer":"答案：B\n解析：旋转和平移都是全等变换，都不改变图形的形状和大小，只改变位置。A和D是旋转特点，C是平移特点。"},{"id":"g3_math_017_ex01","knowledge_id":"g3_math_017","question":"选择题：下列关于中心对称的说法，正确的是（  ）\nA. 两个图形关于某点对称，这两个图形一定全等\nB. 两个全等图形一定关于某点中心对称\nC. 中心对称就是旋转\nD. 中心对称的两个图形不一定重合","answer":"答案：A\n解析：选项A正确，成中心对称的两个图形一定全等；选项B错误，全等不一定中心对称；选项C错误，中心对称是旋转180°的特殊情况；选项D错误，中心对称的两个图形旋转180°后完全重合。"},{"id":"g3_math_017_ex02","knowledge_id":"g3_math_017","question":"填空题：成中心对称的两个图形，对称点所连线段都经过______，并且被______平分。","answer":"答案：对称中心，对称中心\n解析：这是中心对称的性质：对称点所连线段都经过对称中心，并且被对称中心平分。"},{"id":"g3_math_017_ex03","knowledge_id":"g3_math_017","question":"选择题：△ABC和△A'B'C'关于点O成中心对称，则下列说法错误的是（  ）\nA. OA = OA'\nB. AB = A'B'\nC. O是AA'的中点\nD. ∠AOA' = 90°","answer":"答案：D\n解析：中心对称旋转角是180°，所以∠AOA' = 180°，不是90°。其他选项都是中心对称的性质。"},{"id":"g3_math_017_ex04","knowledge_id":"g3_math_017","question":"判断题：中心对称是旋转的一种特殊情况。（  ）","answer":"答案：正确\n解析：中心对称是旋转角为180°的旋转，所以是旋转的特殊情况。它具有旋转的一切性质。"},{"id":"g3_math_017_ex05","knowledge_id":"g3_math_017","question":"填空题：点A和点A'关于点O成中心对称，若OA = 5cm，则AA' = ______cm。","answer":"答案：10\n解析：中心对称中，对称中心O是AA'的中点，所以OA = OA' = 5cm，AA' = OA + OA' = 10cm。"},{"id":"g3_math_017_ex06","knowledge_id":"g3_math_017","question":"选择题：如果两个图形关于某点中心对称，那么对应线段的关系是（  ）\nA. 平行且相等\nB. 平行（或共线）且相等\nC. 相等但不平行\nD. 平行但不相等","answer":"答案：B\n解析：成中心对称的两个图形，对应线段平行（或在同一直线上）且相等。因为旋转180°后方向相反。"},{"id":"g3_math_017_ex07","knowledge_id":"g3_math_017","question":"解答题：已知点A(3, -2)和点B关于原点成中心对称，求点B的坐标。","answer":"答案：B(-3, 2)\n解析：关于原点中心对称，即关于原点对称，坐标变号：(x, y) → (-x, -y)\n所以A(3, -2) → B(-3, 2)\n（验证：中点坐标：((3-3)/2, (-2+2)/2) = (0, 0)，即原点 ✓）"},{"id":"g3_math_017_ex08","knowledge_id":"g3_math_017","question":"选择题：下列两个三角形成中心对称的是（  ）\nA. 两个全等的三角形\nB. 将一个三角形平移后得到的三角形与原三角形\nC. 将一个三角形绕一点旋转180°后得到的三角形与原三角形\nD. 两个相似三角形","answer":"答案：C\n解析：中心对称就是旋转180°，所以将一个三角形绕一点旋转180°后得到的三角形与原三角形成中心对称。"},{"id":"g3_math_017_ex09","knowledge_id":"g3_math_017","question":"填空题：已知四边形ABCD和四边形A'B'C'D'关于点O成中心对称，若AB = 5cm，∠A = 100°，则A'B' = ______，∠A' = ______。","answer":"答案：5cm，100°\n解析：成中心对称的两个图形全等，所以对应边相等，对应角相等。即A'B' = AB = 5cm，∠A' = ∠A = 100°。"},{"id":"g3_math_017_ex10","knowledge_id":"g3_math_017","question":"选择题：找两个成中心对称图形的对称中心，方法是（  ）\nA. 找任意两组对应点连线的交点\nB. 找一组对应点连线的中点\nC. 看图形的中心\nD. 无法确定","answer":"答案：A\n解析：找两组对应点，分别连线，两条连线的交点就是对称中心。（或者一组对应点连线的中点就是对称中心）"},{"id":"g3_math_018_ex01","knowledge_id":"g3_math_018","question":"选择题：下列图形中，是中心对称图形的是（  ）\nA. 等边三角形\nB. 平行四边形\nC. 等腰三角形\nD. 正五边形","answer":"答案：B\n解析：平行四边形绕对角线交点旋转180°后与自身重合，是中心对称图形。等边三角形、等腰三角形、正五边形都不是中心对称图形（奇数边的正多边形都不是）。"},{"id":"g3_math_018_ex02","knowledge_id":"g3_math_018","question":"填空题：中心对称图形的对称中心是它自身旋转______°后与自身重合的那个点。","answer":"答案：180\n解析：中心对称图形定义：绕某一点旋转180°，旋转后的图形能与原来的图形重合。这个点就是对称中心。"},{"id":"g3_math_018_ex03","knowledge_id":"g3_math_018","question":"选择题：下列图形中，既是轴对称图形又是中心对称图形的是（  ）\nA. 等边三角形\nB. 平行四边形\nC. 矩形\nD. 正五边形","answer":"答案：C\n解析：矩形有两条对称轴（轴对称），且绕中心旋转180°能与自身重合（中心对称）。等边三角形是轴对称但不是中心对称；平行四边形是中心对称但不一定是轴对称（一般的）；正五边形是轴对称但不是中心对称。"},{"id":"g3_math_018_ex04","knowledge_id":"g3_math_018","question":"判断题：中心对称图形是指一个图形自身的性质。（  ）","answer":"答案：正确\n解析：中心对称是两个图形之间的关系；中心对称图形是一个图形自身具有的性质——绕中心旋转180°能与自身重合。"},{"id":"g3_math_018_ex05","knowledge_id":"g3_math_018","question":"填空题：线段的对称中心是______，圆的对称中心是______。","answer":"答案：线段的中点，圆心\n解析：线段绕中点旋转180°与自身重合，中点是对称中心；\n圆绕圆心旋转任意角度都与自身重合，当然也是180°，圆心是对称中心。"},{"id":"g3_math_018_ex06","knowledge_id":"g3_math_018","question":"选择题：下列图形中，不是中心对称图形的是（  ）\nA. 正方形\nB. 菱形\nC. 等边三角形\nD. 圆","answer":"答案：C\n解析：等边三角形绕中心旋转120°能与自身重合，但旋转180°不行，所以不是中心对称图形。正方形、菱形、圆都是中心对称图形。"},{"id":"g3_math_018_ex07","knowledge_id":"g3_math_018","question":"解答题：为什么正奇数边形不是中心对称图形？","answer":"答案：因为正奇数边形绕中心旋转180°后，顶点不能与原顶点重合\n解析：正n边形绕中心旋转 360°/n 的整数倍能与自身重合。\n如果是中心对称图形，旋转180°也要重合，即 180° = k × 360°/n\n化简得 n = 2k，即n必须是偶数。\n所以正奇数边形（n为奇数）不是中心对称图形，正偶数边形是中心对称图形。"},{"id":"g3_math_018_ex08","knowledge_id":"g3_math_018","question":"选择题：关于中心对称图形，下列说法正确的是（  ）\nA. 中心对称图形一定也是轴对称图形\nB. 中心对称图形的对称中心只有一个\nC. 中心对称图形绕对称中心旋转90°能与自身重合\nD. 中心对称图形只能有一条对称轴","answer":"答案：B\n解析：选项A错误，平行四边形是中心对称但不一定轴对称；选项B正确，中心对称图形的对称中心是唯一的；选项C错误，要旋转180°；选项D错误，对称轴可以有多条。"},{"id":"g3_math_018_ex09","knowledge_id":"g3_math_018","question":"填空题：从对称性看，正方形既是______图形，又是______图形，它有______条对称轴。","answer":"答案：轴对称，中心对称，4\n解析：正方形：有4条对称轴（轴对称），绕中心旋转180°能重合（中心对称）。它兼具两种对称性。"},{"id":"g3_math_018_ex10","knowledge_id":"g3_math_018","question":"选择题：下列图形中，是中心对称图形但不是轴对称图形的是（  ）\nA. 矩形\nB. 菱形\nC. 平行四边形\nD. 正方形","answer":"答案：C\n解析：一般的平行四边形是中心对称图形（对角线交点是对称中心），但不一定是轴对称图形（矩形、菱形、正方形是特殊的平行四边形，它们既是轴对称也是中心对称）。"},{"id":"g3_math_019_ex01","knowledge_id":"g3_math_019","question":"选择题：点P(3, -2)关于原点对称的点的坐标是（  ）\nA. (-3, -2)\nB. (-3, 2)\nC. (3, 2)\nD. (-2, 3)","answer":"答案：B\n解析：关于原点对称，横纵坐标都变号：(x, y) → (-x, -y)\n所以P(3, -2) → (-3, 2)"},{"id":"g3_math_019_ex02","knowledge_id":"g3_math_019","question":"填空题：点A(a, b)关于x轴对称的点是______，关于y轴对称的点是______，关于原点对称的点是______。","answer":"答案：(a, -b)，(-a, b)，(-a, -b)\n解析：关于x轴对称：横坐标不变，纵坐标变号 → (a, -b)\n关于y轴对称：纵坐标不变，横坐标变号 → (-a, b)\n关于原点对称：横纵坐标都变号 → (-a, -b)"},{"id":"g3_math_019_ex03","knowledge_id":"g3_math_019","question":"选择题：若点P(m, 2)与点Q(3, n)关于原点对称，则m、n的值分别是（  ）\nA. m = 3，n = 2\nB. m = -3，n = 2\nC. m = -3，n = -2\nD. m = 3，n = -2","answer":"答案：C\n解析：关于原点对称，横纵坐标都变号，所以：\nm = -3，n = -2\n（验证：(-(-3), -(-2)) = (3, 2) = P ✓）"},{"id":"g3_math_019_ex04","knowledge_id":"g3_math_019","question":"判断题：点(a, b)和点(-a, -b)关于原点对称。（  ）","answer":"答案：正确\n解析：关于原点对称的两点坐标互为相反数。点(a, b)关于原点的对称点是(-a, -b)，反之亦然。"},{"id":"g3_math_019_ex05","knowledge_id":"g3_math_019","question":"填空题：在平面直角坐标系中，△ABC三个顶点坐标分别是A(1, 2)、B(3, 1)、C(2, 4)，关于原点对称的△A'B'C'中A'的坐标是______。","answer":"答案：(-1, -2)\n解析：关于原点对称，坐标都变号：A(1, 2) → A'(-1, -2)。每个顶点都这样变换。"},{"id":"g3_math_019_ex06","knowledge_id":"g3_math_019","question":"选择题：点(2, -3)关于原点对称的点在（  ）\nA. 第一象限\nB. 第二象限\nC. 第三象限\nD. 第四象限","answer":"答案：B\n解析：(2, -3)在第四象限，关于原点对称后是(-2, 3)，在第二象限。\n规律：关于原点对称的点，所在象限对角相反（一↔三，二↔四）。"},{"id":"g3_math_019_ex07","knowledge_id":"g3_math_019","question":"解答题：已知点A(2a - b, 3)和点B(-2, a + b)关于原点对称，求a和b的值。","answer":"答案：a = -1/3，b = 8/3\n解析：关于原点对称，坐标互为相反数：\n2a - b = 2  （x坐标：-(-2) = 2）\na + b = -3   （y坐标：-3）\n\n两式相加：3a = -1 → a = -1/3\n代入：-1/3 + b = -3 → b = -3 + 1/3 = -8/3\n\n更正：2a - b = -(-2) = 2 → 2a - b = 2\na + b = -3\n相加：3a = -1 → a = -1/3，b = -8/3？不对再检查：\n关于原点对称：如果A和B关于原点对称，则A = -B，即：\n2a - b = -(-2) = 2\n3 = -(a + b) → a + b = -3\n解：a = -1/3，b = -3 + 1/3 = -8/3"},{"id":"g3_math_019_ex08","knowledge_id":"g3_math_019","question":"选择题：一个三角形各顶点坐标都乘以-1，得到的三角形与原三角形的关系是（  ）\nA. 关于x轴对称\nB. 关于y轴对称\nC. 关于原点对称\nD. 没有对称关系","answer":"答案：C\n解析：每个点(x, y)变成(-x, -y)，即关于原点对称。所以整个三角形关于原点中心对称。"},{"id":"g3_math_019_ex09","knowledge_id":"g3_math_019","question":"填空题：点P(0, 5)关于原点对称的点的坐标是______。","answer":"答案：(0, -5)\n解析：x坐标变号：0变号还是0；y坐标变号：5变-5。\n所以P(0, 5)关于原点对称的点是(0, -5)。（在y轴上的点，对称后还在y轴上）"},{"id":"g3_math_019_ex10","knowledge_id":"g3_math_019","question":"选择题：关于原点对称的两个点，到原点的距离（  ）\nA. 相等\nB. 不相等\nC. 无法比较\nD. 差1个单位","answer":"答案：A\n解析：点(x, y)到原点距离 = √(x²+y²)\n点(-x, -y)到原点距离 = √((-x)²+(-y)²) = √(x²+y²)\n所以距离相等。这也符合中心对称性质：对应点到对称中心（原点）的距离相等。"},{"id":"g3_math_020_ex01","knowledge_id":"g3_math_020","question":"选择题：下列说法中正确的是（  ）\nA. 直径是弦，弦是直径\nB. 半圆是弧，弧是半圆\nC. 直径是最长的弦\nD. 弦不一定比直径短","answer":"答案：C\n解析：直径是特殊的弦（经过圆心的弦），但弦不一定是直径；半圆是特殊的弧（圆周的一半），但弧不一定是半圆；直径是最长的弦（经过圆心，最长），正确；弦一定比直径短或相等（直径最长）。"},{"id":"g3_math_020_ex02","knowledge_id":"g3_math_020","question":"填空题：圆的半径是5cm，则直径是______cm，圆周长是______cm。","answer":"答案：10，10π\n解析：直径 = 2 × 半径 = 2 × 5 = 10 cm\n圆周长 = 2πr = 2π × 5 = 10π cm"},{"id":"g3_math_020_ex03","knowledge_id":"g3_math_020","question":"选择题：在⊙O中，半径OA = 3cm，则弦AB的长度范围是（  ）\nA. 0 < AB ≤ 3\nB. 0 < AB ≤ 6\nC. AB ≥ 3\nD. AB = 6","answer":"答案：B\n解析：弦长从接近0（几乎与A重合的点）到直径6cm（最大弦长是直径）。所以0 < AB ≤ 6。"},{"id":"g3_math_020_ex04","knowledge_id":"g3_math_020","question":"判断题：圆既是轴对称图形又是中心对称图形。（  ）","answer":"答案：正确\n解析：圆的对称轴是任何一条直径所在的直线（无数条），所以是轴对称图形；圆心是圆的中心对称中心，旋转180°与自身重合，所以是中心对称图形。"},{"id":"g3_math_020_ex05","knowledge_id":"g3_math_020","question":"填空题：圆上两点A、B到圆心O的距离分别是______cm。","answer":"答案：相等（都是半径）\n解析：圆上任意一点到圆心的距离都等于半径，所以OA = OB = 半径r。这是圆的基本性质：同圆半径相等。"},{"id":"g3_math_020_ex06","knowledge_id":"g3_math_020","question":"选择题：已知⊙O的半径为4，点P在⊙O上，点Q在⊙O外，则下列说法正确的是（  ）\nA. OP = OQ\nB. OP = 4，OQ > 4\nC. OP > OQ\nD. OQ < 4","answer":"答案：B\n解析：P在圆上，OP等于半径4；Q在圆外，OQ大于半径。所以OP = 4，OQ > 4。"},{"id":"g3_math_020_ex07","knowledge_id":"g3_math_020","question":"解答题：一个圆的周长是12π cm，求这个圆的半径和面积。","answer":"答案：半径6 cm，面积36π cm²\n解析：周长C = 2πr = 12π\n所以r = 6 cm\n面积S = πr² = π × 36 = 36π cm²"},{"id":"g3_math_020_ex08","knowledge_id":"g3_math_020","question":"选择题：下列关于等圆的说法，正确的是（  ）\nA. 等圆是位置相同半径相等的两个圆\nB. 等圆是半径相等的两个圆\nC. 等圆是面积相等的两个圆\nD. 等圆是周长相等的两个圆","answer":"答案：B\n解析：等圆定义：能够重合的两个圆叫做等圆，即半径相等的两个圆。位置可以不同，只要半径相等就是等圆。面积、周长相等都是半径相等的推论。"},{"id":"g3_math_020_ex09","knowledge_id":"g3_math_020","question":"填空题：⊙O中，直径AB = 10 cm，则半径OA = ______ cm，圆面积S = ______ cm²。","answer":"答案：5，25π\n解析：半径 = 直径/2 = 10/2 = 5 cm\n面积 = πr² = π × 25 = 25π cm²"},{"id":"g3_math_020_ex10","knowledge_id":"g3_math_020","question":"判断题：经过圆心的弦叫做直径，直径是最长的弦。（  ）","answer":"答案：正确\n解析：直径定义：经过圆心的弦叫做直径。由于直径的两端点在圆上且经过圆心，其长度等于2r，是所有弦中最长的。"},{"id":"g3_math_021_ex01","knowledge_id":"g3_math_021","question":"选择题：在⊙O中，直径CD垂直于弦AB，垂足为E，若AB = 8 cm，则AE =（  ）\nA. 2 cm\nB. 4 cm\nC. 8 cm\nD. 16 cm","answer":"答案：B\n解析：垂径定理：垂直于弦的直径平分弦。所以AE = AB/2 = 8/2 = 4 cm。"},{"id":"g3_math_021_ex02","knowledge_id":"g3_math_021","question":"填空题：⊙O半径为5 cm，弦AB = 8 cm，则弦心距（圆心到弦的距离）为______ cm。","answer":"答案：3\n解析：由垂径定理和弦心距公式：设弦心距为d\nr² = d² + (AB/2)²\n25 = d² + 16\nd² = 9，d = 3 cm"},{"id":"g3_math_021_ex03","knowledge_id":"g3_math_021","question":"选择题：⊙O中，弦AB = 10 cm，圆心O到AB的距离为4 cm，则⊙O的半径是（  ）\nA. √29 cm\nB. √41 cm\nC. √84 cm\nD. 6 cm","answer":"答案：B\n解析：r² = d² + (AB/2)² = 16 + 25 = 41\n所以r = √41 cm"},{"id":"g3_math_021_ex04","knowledge_id":"g3_math_021","question":"判断题：垂径定理的推论：平分弦的直径垂直于弦。（  ）","answer":"答案：错误\n解析：正确说法是：平分弦（不是直径）的直径垂直于弦。必须强调弦不是直径，因为任意两条直径都互相平分，不一定垂直。"},{"id":"g3_math_021_ex05","knowledge_id":"g3_math_021","question":"填空题：⊙O半径为10 cm，弦心距为6 cm，则弦长为______ cm。","answer":"答案：16\n解析：r² = d² + (弦/2)²\n100 = 36 + (弦/2)²\n(弦/2)² = 64，弦/2 = 8\n弦长 = 16 cm"},{"id":"g3_math_021_ex06","knowledge_id":"g3_math_021","question":"解答题：在⊙O中，半径OA = 5 cm，弦AB = 8 cm，求点O到弦AB的距离和弦AB所对的圆心角。","answer":"答案：距离3 cm，圆心角约106.26°（或sin∠AOB = 4/5）\n解析：(1) 弦心距：r² = d² + (AB/2)²\n25 = d² + 16，d² = 9，d = 3 cm\n\n(2) 圆心角：在△AOB中，OA = OB = 5，AB = 8\n作OH⊥AB于H，AH = 4\ncos(∠AOB/2) = OH/OA = 3/5\n∠AOB/2 ≈ 53.13°\n∠AOB ≈ 106.26°"},{"id":"g3_math_021_ex07","knowledge_id":"g3_math_021","question":"选择题：⊙O中，直径AB = 12 cm，弦CD⊥AB于E，若OE = 2 cm，则CD的长是（  ）\nA. 4√5 cm\nB. 8 cm\nC. 2√5 cm\nD. 4√2 cm","answer":"答案：A\n解析：半径r = 6 cm，弦心距d = 2 cm\nCD = 2 × √(r² - d²) = 2 × √(36 - 4) = 2 × √32 = 2 × 4√2 = 8√2？不对\nCD = 2 × √(36-4) = 2×√32 = 2×4√2 = 8√2 cm\n但选项没有8√2，再算：CD = 2√(36-4) = 2√32 = 8√2 ≈ 11.3 cm\n重选：应该是2×√32 = 8√2，但选项是4√5...让我重新检查\n正确答案应该是 CD = 2×√(36-4) = 2×√32 = 8√2 cm\n选项A 4√5 ≈ 8.9 cm\n我应该重算：设CD = 2x，则x² + 4 = 36，x² = 32，x = √32 = 4√2，CD = 8√2"},{"id":"g3_math_021_ex08","knowledge_id":"g3_math_021","question":"填空题：一条弦把圆分成两部分，劣弧和优弧的度数比是1:4，则这条弦所对的圆心角是______°。","answer":"答案：72\n解析：劣弧与优弧度数比1:4，设劣弧为x°，则优弧为4x°\nx + 4x = 360°（整个圆）\n5x = 360°，x = 72°\n所以弦所对的圆心角（对应劣弧）是72°。"},{"id":"g3_math_021_ex09","knowledge_id":"g3_math_021","question":"选择题：利用垂径定理证明：在同圆中，等弦的弦心距相等。依据是（  ）\nA. 勾股定理\nB. 垂径定理\nC. 等弦的弧相等\nD. 圆的定义","answer":"答案：A\n解析：设弦长为a，弦心距为d，半径为r。由垂径定理：r² = d² + (a/2)²\n同圆半径r相等，等弦a相等，则a/2相等\n所以d² = r² - (a/2)² 也相等，d相等。依据是勾股定理结合垂径定理。"},{"id":"g3_math_021_ex10","knowledge_id":"g3_math_021","question":"判断题：垂直于弦的直径平分弦所对的弧。（  ）","answer":"答案：正确\n解析：垂径定理完整表述：垂直于弦的直径平分弦，并且平分弦所对的两条弧（优弧和劣弧都平分）。"},{"id":"g3_math_022_ex01","knowledge_id":"g3_math_022","question":"选择题：在同圆中，圆心角∠AOB = 60°，则弧AB的度数是（  ）\nA. 30°\nB. 60°\nC. 120°\nD. 180°","answer":"答案：B\n解析：圆心角的度数等于它所对弧的度数。所以弧AB的度数等于∠AOB = 60°。"},{"id":"g3_math_022_ex02","knowledge_id":"g3_math_022","question":"填空题：在同圆⊙O中，若弧AB = 弧CD，则弦AB = ______，圆心角∠AOB = ______。","answer":"答案：弦CD，∠COD\n解析：定理：在同圆中，等弧→等弦→等圆心角，三个量等价。所以弧AB=弧CD，则弦AB=弦CD，∠AOB=∠COD。"},{"id":"g3_math_022_ex03","knowledge_id":"g3_math_022","question":"选择题：⊙O中，弦AB = 弦CD，下列结论不一定成立的是（  ）\nA. 弧AB = 弧CD\nB. ∠AOB = ∠COD\nC. 弧AB的度数 = 弧CD的度数\nD. AB和CD的弦心距相等","answer":"答案：A\n解析：弦相等，弦心距和圆心角一定相等，但弧相等需要\"在同圆或等圆中\"的前提。如果两个弦在不同的圆上，弧不一定相等。题目没强调同圆，所以A不一定成立。"},{"id":"g3_math_022_ex04","knowledge_id":"g3_math_022","question":"判断题：在同圆中，圆心角越大，所对的弦越长。（  ）","answer":"答案：正确\n解析：圆心角与弦长的关系：在同圆中，圆心角越大，所对弦越长。当圆心角从0°增大到180°时，弦长从接近0增大到直径长度。"},{"id":"g3_math_022_ex05","knowledge_id":"g3_math_022","question":"填空题：⊙O半径为6 cm，圆心角∠AOB = 120°，则弦AB的长为______ cm。","answer":"答案：6√3\n解析：在△AOB中，OA = OB = 6，∠AOB = 120°\n作OH⊥AB，则∠AOH = 60°，AH = OA×sin60° = 6×√3/2 = 3√3\nAB = 2×AH = 6√3 cm"},{"id":"g3_math_022_ex06","knowledge_id":"g3_math_022","question":"选择题：⊙O中，圆心角∠AOB = 90°，半径为4 cm，则弦AB的长是（  ）\nA. 4 cm\nB. 4√2 cm\nC. 8 cm\nD. 8√2 cm","answer":"答案：B\n解析：△AOB中，OA = OB = 4，∠AOB = 90°\n由勾股定理：AB² = OA² + OB² = 16 + 16 = 32\nAB = √32 = 4√2 cm"},{"id":"g3_math_022_ex07","knowledge_id":"g3_math_022","question":"解答题：在同圆⊙O中，弧AB和弧CD的度数比是2:3，求弦AB和弦CD的长度比（设半径为r）。","answer":"答案：sin60° : sin90° 或 √3/2 : 1\n解析：弧AB的度数 = 2×72° = 144°（设总度数360°分5份，每份72°）\n弧CD的度数 = 3×72° = 216°\n\n弦长公式：弦 = 2r×sin(圆心角/2)\nAB = 2r×sin(144°/2) = 2r×sin72°\nCD = 2r×sin(216°/2) = 2r×sin108°\n\n但题目说弧度数比2:3，即圆心角比2:3\n设∠AOB = 2θ，∠COD = 3θ\n弦比 = sin(θ) : sin(3θ/2)...\n简化：若弧比2:3，即圆心角比2:3，比如60°:90°\n弦比 = sin30° : sin45° = 1/2 : √2/2 = 1 : √2\n\n若总360°，弧AB=144°，弧CD=216°，不对，应该是弧AB=120°，弧CD=180°？\n重新算：360°分5份每份72°，弧AB=2份=144°，弧CD=3份=216°\n弦AB = 2r×sin72°，弦CD = 2r×sin108°\nsin108° = sin72°（sin(180°-θ)=sinθ）\n所以弦AB : 弦CD = sin72° : sin108° = 1 : 1，弦长相等？\n\n让我重新理解：弧度数比2:3，设弧AB=2x°，弧CD=3x°\n2x+3x=360°，x=72°\n弧AB=144°，弧CD=216°\n弦AB = 2r×sin72°\n弦CD = 2r×sin108° = 2r×sin72°\n弦相等！这是因为216°的弧对应的劣弧是144°（360°-216°），弦长相等。\n\n所以弦AB : 弦CD = 1 : 1"},{"id":"g3_math_022_ex08","knowledge_id":"g3_math_022","question":"选择题：下列说法中错误的是（  ）\nA. 在同圆中，等弦的弦心距相等\nB. 在同圆中，等圆心角的弦相等\nC. 在同圆中，等弧的弦相等\nD. 弦心距相等的弦相等","answer":"答案：D\n解析：选项D缺少\"在同圆或等圆中\"的前提。不同圆中，弦心距相等但半径不同，弦长可能不等。其他选项都有同圆前提。"},{"id":"g3_math_022_ex09","knowledge_id":"g3_math_022","question":"填空题：在同圆中，弦AB = 弦CD = 8 cm，圆心角∠AOB = 60°，则∠COD = ______°。","answer":"答案：60\n解析：在同圆中，等弦→等圆心角。弦AB = 弦CD，则∠AOB = ∠COD = 60°。"},{"id":"g3_math_022_ex10","knowledge_id":"g3_math_022","question":"判断题：圆心角的度数等于它所对弧的长度。（  ）","answer":"答案：错误\n解析：圆心角的度数等于它所对弧的度数（弧度数），不是弧的长度。弧的长度还与半径有关：l = nπr/180。"},{"id":"g3_math_023_ex01","knowledge_id":"g3_math_023","question":"选择题：圆周角定理：一条弧所对的圆周角等于它所对的圆心角的（  ）\nA. 相等\nB. 一半\nC. 两倍\nD. 1/4","answer":"答案：B\n解析：圆周角定理：一条弧所对的圆周角等于它所对的圆心角的一半。即圆周角 = 圆心角/2。"},{"id":"g3_math_023_ex02","knowledge_id":"g3_math_023","question":"填空题：⊙O中，圆心角∠AOB = 80°，则弧AB所对的圆周角∠ACB = ______°。","answer":"答案：40\n解析：圆周角定理：∠ACB = ∠AOB/2 = 80°/2 = 40°。"},{"id":"g3_math_023_ex03","knowledge_id":"g3_math_023","question":"选择题：⊙O中，点C在优弧AB上，∠ACB = 35°，则劣弧AB的圆心角是（  ）\nA. 35°\nB. 70°\nC. 17.5°\nD. 140°","answer":"答案：B\n解析：圆周角35°所对的弧的圆心角 = 35°×2 = 70°。这70°是劣弧AB对应的圆心角。"},{"id":"g3_math_023_ex04","knowledge_id":"g3_math_023","question":"判断题：同弧或等弧所对的圆周角相等。（  ）","answer":"答案：正确\n解析：圆周角定理的推论：同弧或等弧所对的圆周角相等。这是圆周角定理的重要应用。"},{"id":"g3_math_023_ex05","knowledge_id":"g3_math_023","question":"填空题：直径AB所对的圆周角是______°，90°的圆周角所对的弦是______。","answer":"答案：90，直径\n解析：推论：直径（半圆）所对的圆周角是90°（直角）；反之，90°的圆周角所对的弦是直径。"},{"id":"g3_math_023_ex06","knowledge_id":"g3_math_023","question":"解答题：在⊙O中，AB是直径，点C在圆上，∠CAB = 30°，求∠CBA和∠ACB。","answer":"答案：∠CBA = 60°，∠ACB = 90°\n解析：因为AB是直径，直径所对圆周角∠ACB = 90°\n在Rt△ABC中，∠CAB = 30°\n所以∠CBA = 90° - 30° = 60°\n（这是直角三角形的性质，30°所对边是斜边一半）"},{"id":"g3_math_023_ex07","knowledge_id":"g3_math_023","question":"选择题：⊙O中，圆内接四边形ABCD的∠A = 80°，则∠C =（  ）\nA. 80°\nB. 100°\nC. 160°\nD. 200°","answer":"答案：B\n解析：圆内接四边形的对角互补：∠A + ∠C = 180°\n所以∠C = 180° - 80° = 100°"},{"id":"g3_math_023_ex08","knowledge_id":"g3_math_023","question":"填空题：⊙O中，弧AB = 弧BC，点D在弧AC上，则∠ADB = ______∠BDC。","answer":"答案：等于\n解析：弧AB = 弧BC，等弧所对圆周角相等，所以∠ADB = ∠BDC。"},{"id":"g3_math_023_ex09","knowledge_id":"g3_math_023","question":"选择题：下列关于圆周角的说法，错误的是（  ）\nA. 圆周角的顶点在圆上\nB. 圆周角的两边都与圆相交\nC. 同弧所对的圆周角有无数个，都相等\nD. 圆周角可以是锐角、直角或钝角","answer":"答案：D\n解析：选项D不完全正确。圆周角的范围是0°<角<180°（不能是0°
