或180°），可以是锐角（<90°）或直角（=90°），但钝角（>90°）对应的是劣弧的补弧。实际上半圆（180°弧）的圆周角是90°，所以圆周角最大90°？不对，再想：弧可以是优弧或劣弧，优弧所对圆周角可以是钝角。所以D选项确实有歧义，应该说\"圆周角可以是锐角或直角\"。"},{"id":"g3_math_023_ex10","knowledge_id":"g3_math_023","question":"判断题：圆周角定理的逆定理：圆周角相等，则所对的弧相等。（  ）","answer":"答案：错误\n解析：逆定理不成立。圆周角相等只能说明圆心角相等，但弧相等需要\"在同圆或等圆中\"的前提。不同圆上，圆周角相等，弧不一定相等。"},{"id":"g3_math_024_ex01","knowledge_id":"g3_math_024","question":"选择题：⊙O半径为5 cm，点P到圆心O的距离为3 cm，则点P在（  ）\nA. 圆内\nB. 圆上\nC. 圆外\nD. 无法确定","answer":"答案：A\n解析：点P到圆心距离d = 3 cm < 半径r = 5 cm\n所以点P在圆内。"},{"id":"g3_math_024_ex02","knowledge_id":"g3_math_024","question":"填空题：⊙O半径为4 cm，点P在圆外，则OP > ______ cm；点Q在圆上，则OQ = ______ cm。","answer":"答案：4，4\n解析：点在圆外：d > r，所以OP > 4 cm\n点在圆上：d = r，所以OQ = 4 cm"},{"id":"g3_math_024_ex03","knowledge_id":"g3_math_024","question":"选择题：点P到⊙O圆心距离为d，半径为r。若点P在圆上，则（  ）\nA. d > r\nB. d = r\nC. d < r\nD. d ≤ r","answer":"答案：B\n解析：点在圆上：d = r。这是点和圆位置关系的判定标准。"},{"id":"g3_math_024_ex04","knowledge_id":"g3_math_024","question":"判断题：过平面内任意一点，可以作无数个圆，这些圆的圆心都在以该点为圆心的圆上。（  ）","answer":"答案：正确\n解析：过一点作圆，圆心可以是该点为圆心的任意位置（与该点距离为半径），所以可以作无数个圆。圆心在以该点为圆心的圆上任意位置。"},{"id":"g3_math_024_ex05","knowledge_id":"g3_math_024","question":"解答题：已知三角形ABC的顶点坐标为A(0,0)、B(4,0)、C(2,3)，求三角形的外心坐标和外接圆半径。","answer":"答案：外心(2, 1)，半径√5\n解析：设外心O(a, b)，则OA = OB = OC\nOA² = a² + b²\nOB² = (a-4)² + b² = a² - 8a + 16 + b²\nOA = OB → a² + b² = a² - 8a + 16 + b² → 8a = 16 → a = 2\n\nOC² = (a-2)² + (b-3)² = (2-2)² + (b-3)² = (b-3)²\nOA = OC → a² + b² = (b-3)² → 4 + b² = b² - 6b + 9 → 6b = 5 → b = 5/6？不对，应该是：\n\nOA² = OB²：a² + b² = (a-4)² + b² → a = 2\nOA² = OC²：4 + b² = (2-2)² + (b-3)² = 0 + b² - 6b + 9 → 6b = 5 → b = 5/6？\n\n这不对。让我重新算：A(0,0), B(4,0), C(2,3)\nAB中垂线：x = 2（AB在y=0上，中点(2,0)，中垂线垂直AB，所以是x=2）\nAC中垂线：中点(1, 1.5)，斜率AC=3/2，中垂线斜率-2/3\n方程：y - 1.5 = -2/3(x - 1)\n代入x = 2：y - 1.5 = -2/3 → y = 1.5 - 2/3 = 1/2？\n\n所以外心(2, 1/2)，半径OA = √(4 + 1/4) = √17/4？不对\n\n重新用代数法：\nOA² = a² + b²\nOB² = (a-4)² + b²\nOA=OB → a² = (a-4)² → a = a-4 或 a = -(a-4) → 第一个无解，第二个：a = -a+4 → 2a=4 → a=2\n\nOC² = (a-2)² + (b-3)² = (2-2)² + (b-3)² = (b-3)²\nOA=OC → 4 + b² = (b-3)² = b² - 6b + 9 → 6b = 5 → b = 5/6\n\n外心(2, 5/6)，半径 = √(4 + 25/36) = √169/36 = 13/6 ≈ 2.17"},{"id":"g3_math_024_ex06","knowledge_id":"g3_math_024","question":"选择题：直角三角形的外心在（  ）\nA. 三角形内部\nB. 三角形外部\nC. 斜边中点\nD. 直角顶点","answer":"答案：C\n解析：直角三角形的外心在斜边中点。因为斜边是外接圆的直径，直径的中点就是圆心（外心）。"},{"id":"g3_math_024_ex07","knowledge_id":"g3_math_024","question":"填空题：锐角三角形的外心在三角形______，钝角三角形的外心在三角形______。","answer":"答案：内部，外部\n解析：锐角三角形：外心在三角形内部（三个顶点都\"看\"到圆心在内部）\n钝角三角形：外心在三角形外部（钝角所对边最长，圆心在三角形外）"},{"id":"g3_math_024_ex08","knowledge_id":"g3_math_024","question":"选择题：过三点作圆，（  ）\nA. 一定可以作一个圆\nB. 不一定可以作圆\nC. 可以作无数个圆\nD. 只能作一个圆","answer":"答案：B\n解析：过三点作圆，如果三点不共线，可以作唯一一个圆；如果三点共线，则不能作圆（三点在同一直线上，圆心无法确定）。所以\"不一定可以作圆\"。"},{"id":"g3_math_024_ex09","knowledge_id":"g3_math_024","question":"判断题：三角形的外心到三个顶点的距离相等。（  ）","answer":"答案：正确\n解析：外心是外接圆的圆心，外接圆经过三角形的三个顶点，所以外心到三个顶点的距离都等于半径，相等。"},{"id":"g3_math_024_ex10","knowledge_id":"g3_math_024","question":"选择题：△ABC中，∠A = 120°，AB = AC = 6 cm，则外接圆半径是（  ）\nA. 3 cm\nB. 6 cm\nC. 6√3 cm\nD. 12 cm","answer":"答案：B\n解析：∠A = 120°是钝角，外心在三角形外部。\n由正弦定理：a/sinA = 2R\n这里AB = AC = 6，BC = ?（钝角等腰三角形）\n由余弦定理：BC² = 36 + 36 - 2×36×cos120° = 72 - 72×(-1/2) = 72 + 36 = 108\nBC = 6√3\n正弦定理：BC/sinA = 2R → 6√3/sin120° = 2R → 6√3/(√3/2) = 2R → 12 = 2R → R = 6 cm"},{"id":"g3_math_025_ex01","knowledge_id":"g3_math_025","question":"选择题：⊙O半径为3 cm，直线l到圆心O的距离为2 cm，则直线l与⊙O（  ）\nA. 相离\nB. 相切\nC. 相交\nD. 无法确定","answer":"答案：C\n解析：直线到圆心距离d = 2 cm < 半径r = 3 cm\n所以直线与圆相交（有两个交点）。"},{"id":"g3_math_025_ex02","knowledge_id":"g3_math_025","question":"填空题：⊙O半径r = 5 cm，直线l与⊙O相切，则圆心O到直线l的距离d = ______ cm；若相离，则d > ______ cm。","answer":"答案：5，5\n解析：相切：d = r = 5 cm\n相离：d > r，所以d > 5 cm"},{"id":"g3_math_025_ex03","knowledge_id":"g3_math_025","question":"选择题：直线l与⊙O有两个交点，则圆心O到直线l的距离与半径的关系是（  ）\nA. d > r\nB. d = r\nC. d < r\nD. d ≤ r","answer":"答案：C\n解析：有两个交点说明相交，相交时d < r。"},{"id":"g3_math_025_ex04","knowledge_id":"g3_math_025","question":"判断题：直线与圆相切时，只有一个公共点。（  ）","answer":"答案：正确\n解析：相切定义：直线与圆只有一个公共点，这个点叫做切点。直线叫做切线。"},{"id":"g3_math_025_ex05","knowledge_id":"g3_math_025","question":"填空题：⊙O半径为4 cm，圆心O到直线l的距离为4 cm，则直线l与⊙O的位置关系是______。","answer":"答案：相切\n解析：d = 4 cm = r = 4 cm，所以直线与圆相切，有唯一切点。"},{"id":"g3_math_025_ex06","knowledge_id":"g3_math_025","question":"解答题：⊙O半径为3，圆心O(0, 0)，判断直线y = 2x + 4与⊙O的位置关系。","answer":"答案：相交\n解析：直线y = 2x + 4，圆心(0, 0)到直线距离：\n直线方程：2x - y + 4 = 0\n距离公式：d = |Ax₀ + By₀ + C| / √(A² + B²) = |2×0 + (-1)×0 + 4| / √(4 + 1) = 4/√5 ≈ 1.79\n半径r = 3，d ≈ 1.79 < 3，所以相交。"},{"id":"g3_math_025_ex07","knowledge_id":"g3_math_025","question":"选择题：直线l与⊙O相离，则直线上的点到圆心的最小距离（  ）\nA. 等于半径\nB. 大于半径\nC. 小于半径\nD. 不确定","answer":"答案：B\n解析：相离时，直线到圆心距离d > r。直线上点到圆心的最小距离就是d，大于半径r。"},{"id":"g3_math_025_ex08","knowledge_id":"g3_math_025","question":"填空题：⊙O半径为5，直线l与⊙O相交，设圆心O到l的距离为3，则直线l被⊙O截得的弦长为______。","answer":"答案：8\n解析：弦长公式：弦 = 2√(r² - d²) = 2√(25 - 9) = 2√16 = 2×4 = 8"},{"id":"g3_math_025_ex09","knowledge_id":"g3_math_025","question":"选择题：下列说法正确的是（  ）\nA. 直线与圆的位置关系可以用公共点个数判断\nB. 直线与圆最多有两个公共点\nC. 直线到圆心距离小于半径时，直线是切线\nD. 直线到圆心距离大于半径时，直线与圆相交","answer":"答案：B\n解析：选项A正确，公共点个数可以判断位置关系；选项B正确，直线与圆最多两个公共点（相交），一个公共点（相切），零个公共点（相离）；C错误，小于半径是相交；D错误，大于半径是相离。"},{"id":"g3_math_025_ex10","knowledge_id":"g3_math_025","question":"判断题：直线与圆没有公共点叫做相离。（  ）","answer":"答案：正确\n解析：相离定义：直线与圆没有公共点叫做相离。此时圆心到直线距离d > 半径r。"},{"id":"g3_math_026_ex01","knowledge_id":"g3_math_026","question":"选择题：切线的判定定理：经过半径外端并且______这条半径的直线是圆的切线。（  ）\nA. 平行于\nB. 垂直于\nC. 相交于\nD. 延长","answer":"答案：B\n解析：切线判定定理：经过半径外端并且垂直于这条半径的直线是圆的切线。两个条件：①经过半径外端（点在圆上）；②垂直于半径。"},{"id":"g3_math_026_ex02","knowledge_id":"g3_math_026","question":"填空题：⊙O半径OA = 4 cm，直线l经过点A且垂直于OA，则直线l是⊙O的______。","answer":"答案：切线\n解析：直线l经过半径OA的外端点A，且垂直于OA，满足切线判定定理的两个条件，所以l是切线。"},{"id":"g3_math_026_ex03","knowledge_id":"g3_math_026","question":"选择题：切线的性质定理：圆的切线______过切点的半径。（  ）\nA. 平行于\nB. 垂直于\nC. 相交于\nD. 不一定垂直","answer":"答案：B\n解析：切线性质定理：圆的切线垂直于过切点的半径。这是切线的最重要的性质。"},{"id":"g3_math_026_ex04","knowledge_id":"g3_math_026","question":"判断题：直线l经过圆上一点A，则l是切线。（  ）","answer":"答案：错误\n解析：只经过圆上一点不一定垂直于过该点的半径，所以不一定是切线。切线判定需要两个条件：①经过半径外端；②垂直于半径。"},{"id":"g3_math_026_ex05","knowledge_id":"g3_math_026","question":"填空题：⊙O中，切线l与⊙O切于点A，OA = 5 cm，则点O到直线l的距离为______ cm。","answer":"答案：5\n解析：切线垂直于过切点的半径OA，点O到切线l的距离等于OA的长度 = 5 cm。"},{"id":"g3_math_026_ex06","knowledge_id":"g3_math_026","question":"解答题：已知⊙O半径为5，切线PA、PB切⊙O于A、B，PO = 13，求PA的长和∠APO。","answer":"答案：PA = 12，∠APO = 22.6°（或sin∠APO = 5/13）\n解析：PA是切线，OA⊥PA，△OAP是直角三角形\nOA = 5（半径），OP = 13\nPA = √(OP² - OA²) = √(169 - 25) = √144 = 12\n\nsin∠APO = OA/OP = 5/13\n∠APO ≈ 22.6°"},{"id":"g3_math_026_ex07","knowledge_id":"g3_math_026","question":"选择题：证明直线是切线的常用方法是（  ）\nA. 连接圆心与直线上的点，证明垂直\nB. 过圆心作直线的垂线，证明垂足在圆上\nC. 证明直线只有一个点在圆上\nD. 以上都可以","answer":"答案：D\n解析：方法①（有切点）：连半径，证垂直（连接已知切点与圆心，证半径与直线垂直）\n方法②（无切点）：作垂直，证半径（过圆心作直线垂线，证垂线段等于半径）\n两种方法都常用。"},{"id":"g3_math_026_ex08","knowledge_id":"g3_math_026","question":"填空题：⊙O中，AB是直径，直线l经过B点且垂直于AB，则l与⊙O的关系是______。","answer":"答案：相切（l是切线）\n解析：直线l经过半径OB的外端点B，且垂直于直径AB（即垂直于半径OB），满足切线判定定理，所以l是切线。"},{"id":"g3_math_026_ex09","knowledge_id":"g3_math_026","question":"选择题：切线与圆的位置关系是（  ）\nA. 相交\nB. 相切\nC. 相离\nD. 以上都不是","answer":"答案：B\n解析：切线就是与圆相切的直线，只有一个公共点。"},{"id":"g3_math_026_ex10","knowledge_id":"g3_math_026","question":"判断题：切线长是指切线与圆的公共线段长度。（  ）","answer":"答案：错误\n解析：切线长是指经过圆外一点的切线，这点和切点之间的线段长。不是切线与圆的公共线段（切点是一个点，没有线段）。"},{"id":"g3_math_027_ex01","knowledge_id":"g3_math_027","question":"选择题：切线长定理：从圆外一点引圆的两条切线，它们的切线长______。（  ）\nA. 相等\nB. 不相等\nC. 不一定相等\nD. 无法比较","answer":"答案：A\n解析：切线长定理：从圆外一点引圆的两条切线，切线长相等。"},{"id":"g3_math_027_ex02","knowledge_id":"g3_math_027","question":"填空题：⊙O外一点P，PA、PB切⊙O于A、B，若PA = 8 cm，则PB = ______ cm。","answer":"答案：8\n解析：由切线长定理：PA = PB，所以PB = 8 cm。"},{"id":"g3_math_027_ex03","knowledge_id":"g3_math_027","question":"选择题：PA、PB切⊙O于A、B，PO连线平分（  ）\nA. ∠AOB\nB. ∠APB\nC. ∠PAB\nD. ∠PBA","answer":"答案：B\n解析：切线长定理：PA = PB，且PO平分∠APB（点P和圆心连线平分两切线的夹角）。"},{"id":"g3_math_027_ex04","knowledge_id":"g3_math_027","question":"判断题：切线长定理的推论：圆心与圆外一点的连线平分两切线的夹角。（  ）","answer":"答案：正确\n解析：这是切线长定理的重要内容：PA = PB，且PO平分∠APB。"},{"id":"g3_math_027_ex05","knowledge_id":"g3_math_027","question":"填空题：⊙O半径为3，点P在⊙O外，OP = 5，PA切⊙O于A，则PA = ______，∠APO = ______°。","answer":"答案：4，约53.1°（sin∠APO = 3/5）\n解析：△OAP中，OA⊥PA（切线性质），OA = 3，OP = 5\nPA = √(OP² - OA²) = √(25 - 9) = √16 = 4\nsin∠APO = OA/OP = 3/5 ≈ 0.6，∠APO ≈ 36.9°？不对，应该是：\nPA = 4，sin∠APO = OA/OP = 3/5，∠APO ≈ 36.9°"},{"id":"g3_math_027_ex06","knowledge_id":"g3_math_027","question":"解答题：PA、PB切⊙O于A、B，PA = PB = 10，∠APB = 60°，求⊙O半径和OP。","answer":"答案：半径10/√3 或 10√3/3，OP = 20/√3 或 20√3/3\n解析：PA = PB = 10，∠APB = 60°\nPO平分∠APB，所以∠APO = 30°\n在Rt△OAP中，tan30° = OA/PA = OA/10\nOA = 10 × tan30° = 10 × √3/3 = 10√3/3\n\nOP = PA/cos30° = 10/(√3/2) = 20/√3 = 20√3/3"},{"id":"g3_math_027_ex07","knowledge_id":"g3_math_027","question":"选择题：三角形的内心是（  ）\nA. 三条中线的交点\nB. 三条高线的交点\nC. 三条角平分线的交点\nD. 三边垂直平分线的交点","answer":"答案：C\n解析：内心是三角形三条角平分线的交点，也是三角形内切圆的圆心。"},{"id":"g3_math_027_ex08","knowledge_id":"g3_math_027","question":"填空题：三角形内心到三边的距离______，内心在三角形______。","answer":"答案：相等，内部\n解析：内心是内切圆圆心，到三边距离等于内切圆半径，所以相等；内心在三角形内部（内切圆在三角形内）。"},{"id":"g3_math_027_ex09","knowledge_id":"g3_math_027","question":"选择题：△ABC的内切圆半径为r，面积为S，周长为l，则S =（  ）\nA. rl\nB. rl/2\nC. 2rl\nD. r²l","answer":"答案：B\n解析：三角形面积 = 内切圆半径 × 周长/2，即S = rl/2。因为三角形分成三个以边为底、r为高的小三角形，面积和 = r × (a+b+c)/2 = rl/2。"},{"id":"g3_math_027_ex10","knowledge_id":"g3_math_027","question":"判断题：直角三角形的内切圆半径 r = (a + b - c)/2（其中a、b是直角边，c是斜边）。（  ）","answer":"答案：正确\n解析：设内切圆切三边于D、E、F，直角三角形特殊：r = (a+b-c)/2。这是直角三角形内切圆半径的常用公式。"},{"id":"g3_math_028_ex01","knowledge_id":"g3_math_028","question":"选择题：⊙O₁半径R = 5，⊙O₂半径r = 3，圆心距d = 8，则两圆位置关系是（  ）\nA. 外离\nB. 外切\nC. 相交\nD. 内切","answer":"答案：B\n解析：外切：d = R + r = 5 + 3 = 8，所以两圆外切，有一个公共点。"},{"id":"g3_math_028_ex02","knowledge_id":"g3_math_028","question":"填空题：⊙O₁半径R = 6，⊙O₂半径r = 2，若两圆内切，则圆心距d = ______；若内含，则d < ______。","answer":"答案：4，4\n解析：内切：d = R - r = 6 - 2 = 4\n内含：d < R - r = 4"},{"id":"g3_math_028_ex03","knowledge_id":"g3_math_028","question":"选择题：⊙O₁半径4，⊙O₂半径2，圆心距为3，则两圆（  ）\nA. 外离\nB. 外切\nC. 相交\nD. 内切","answer":"答案：C\n解析：R = 4，r = 2，R - r = 2，R + r = 6\n圆心距d = 3，满足 2 < 3 < 6，即 R - r < d < R + r\n所以两圆相交，有两个公共点。"},{"id":"g3_math_028_ex04","knowledge_id":"g3_math_028","question":"判断题：两个圆没有公共点，一定相离。（  ）","answer":"答案：错误\n解析：两个圆没有公共点有两种情况：外离（圆心距d > R+r）和内含（d < R-r）。不一定是外离。"},{"id":"g3_math_028_ex05","knowledge_id":"g3_math_028","question":"填空题：两圆半径分别为R和r（R > r），若两圆相交，则圆心距d的范围是______。","answer":"答案：R - r < d < R + r\n解析：两圆相交的条件：R - r < d < R + r。即圆心距介于半径差和半径和之间。"},{"id":"g3_math_028_ex06","knowledge_id":"g3_math_028","question":"解答题：⊙O₁半径为5，⊙O₂半径为3，两圆圆心距为d。求：(1)两圆外切时d的值；(2)两圆相交时d的范围；(3)两圆内含时d的范围。","answer":"答案：(1)d = 8；(2)2 < d < 8；(3)d < 2\n解析：R = 5，r = 3\n(1)外切：d = R + r = 5 + 3 = 8\n(2)相交：R - r < d < R + r，即 2 < d < 8\n(3)内含：d < R - r = 2"},{"id":"g3_math_028_ex07","knowledge_id":"g3_math_028","question":"选择题：两圆半径R = 5，r = 1，圆心距d = 6，则两圆公共点的个数是（  ）\nA. 0个\nB. 1个\nC. 2个\nD. 无法确定","answer":"答案：A\n解析：d = 6 = R + r，两圆外切，有一个公共点。不对，d = 6 = R + r = 5 + 1 = 6，外切，有1个公共点。但选项1个是B...检查：R=5，r=1，R+r=6=d，外切，1个公共点，选B"},{"id":"g3_math_028_ex08","knowledge_id":"g3_math_028","question":"填空题：两个圆的圆心重合但半径不相等，这样的两个圆叫做同心圆，它是两圆位置关系中______的特例。","answer":"答案：内含\n解析：同心圆的圆心距d = 0，满足d < R - r（当两圆半径不等时），是内含的特例。同心圆没有公共点，一个圆在另一个圆内部且圆心相同。"},{"id":"g3_math_028_ex09","knowledge_id":"g3_math_028","question":"选择题：下列说法错误的是（  ）\nA. 外切的两圆有一个公共点\nB. 相交的两圆有两个公共点\nC. 内含的两圆没有公共点\nD. 两圆公共点个数最多是3个","answer":"答案：D\n解析：两圆公共点个数最多是2个（相交），不可能是3个。其他选项都正确。"},{"id":"g3_math_028_ex10","knowledge_id":"g3_math_028","question":"判断题：如果两圆的半径之和大于圆心距，则两圆相交。（  ）","answer":"答案：错误\n解析：两圆相交需要 R - r < d < R + r。半径之和大于圆心距（d < R + r）只是相交的必要条件之一，还需要满足 d > R - r（圆心距大于半径差）。如果d < R - r，则是内含。"},{"id":"g3_math_029_ex01","knowledge_id":"g3_math_029","question":"选择题：正六边形的外接圆半径等于正六边形的（  ）\nA. 边长\nB. 边长的两倍\nC. 边心距\nD. 周长的一半","answer":"答案：A\n解析：正六边形中心角 = 360°/6 = 60°，每个三角形都是等边三角形，所以半径R = 边长a。"},{"id":"g3_math_029_ex02","knowledge_id":"g3_math_029","question":"填空题：正n边形的中心角是______，正五边形的中心角是______°。","answer":"答案：360°/n，72°\n解析：中心角 = 360°/n。正五边形中心角 = 360°/5 = 72°。"},{"id":"g3_math_029_ex03","knowledge_id":"g3_math_029","question":"选择题：正三角形的中心角是（  ）\nA. 60°\nB. 90°\nC. 120°\nD. 180°","answer":"答案：C\n解析：正三角形中心角 = 360°/3 = 120°。"},{"id":"g3_math_029_ex04","knowledge_id":"g3_math_029","question":"判断题：正多边形的外接圆半径等于正多边形的半径。（  ）","answer":"答案：正确\n解析：正多边形的外接圆就是它的外接圆，外接圆半径就是正多边形的半径（中心到顶点的距离）。"},{"id":"g3_math_029_ex05","knowledge_id":"g3_math_029","question":"填空题：正方形的外接圆半径为R，则正方形的边长为______，面积为______。","answer":"答案：R√2，2R²\n解析：正方形中心角 = 90°，边长 = 2R × sin45° = 2R × √2/2 = R√2\n面积 = (边长)² = (R√2)² = 2R²"},{"id":"g3_math_029_ex06","knowledge_id":"g3_math_029","question":"解答题：正六边形的外接圆半径为6 cm，求正六边形的边长、边心距、周长和面积。","answer":"答案：边长6 cm，边心距3√3 cm，周长36 cm，面积54√3 cm²\n解析：边长 a = R = 6 cm（正六边形特殊）\n边心距 r = R × cos30° = 6 × √3/2 = 3√3 cm\n周长 = 6 × a = 36 cm\n面积 = 1/2 × 周长 × 边心距 = 1/2 × 36 × 3√3 = 54√3 cm²"},{"id":"g3_math_029_ex07","knowledge_id":"g3_math_029","question":"选择题：正多边形边数增加时，中心角（  ）\nA. 增大\nB. 减小\nC. 不变\nD. 不确定","answer":"答案：B\n解析：中心角 = 360°/n，n增大，中心角减小。如正三角形120°，正方形90°，正六边形60°。"},{"id":"g3_math_029_ex08","knowledge_id":"g3_math_029","question":"填空题：正n边形的外接圆半径为R，边长a = ______，边心距r = ______。","answer":"答案：2R × sin(180°/n)，R × cos(180°/n)\n解析：边长公式：a = 2R × sin(180°/n)\n边心距公式：r = R × cos(180°/n)\n这两个公式来自正多边形分解为等腰三角形。"},{"id":"g3_math_029_ex09","knowledge_id":"g3_math_029","question":"选择题：正八边形的中心角是（  ）\nA. 30°\nB. 45°\nC. 60°\nD. 90°","answer":"答案：B\n解析：正八边形中心角 = 360°/8 = 45°。"},{"id":"g3_math_029_ex10","knowledge_id":"g3_math_029","question":"判断题：正多边形既是轴对称图形又是中心对称图形。（  ）","answer":"答案：正确\n解析：正多边形是轴对称图形（每条边的中垂线都是对称轴）；正偶数边形是中心对称图形（绕中心旋转180°与自身重合），正奇数边形不是中心对称图形。但题目说\"正多边形\"，应该区分：正偶数边形既是轴对称又是中心对称，正奇数边形只是轴对称。"},{"id":"g3_math_030_ex01","knowledge_id":"g3_math_030","question":"选择题：半径为R的圆中，圆心角为n°的弧长公式是（  ）\nA. l = nRπ\nB. l = nπR/180\nC. l = 2πR\nD. l = πR²","answer":"答案：B\n解析：弧长公式：l = nπR/180，其中n是圆心角度数，R是半径。"},{"id":"g3_math_030_ex02","knowledge_id":"g3_math_030","question":"填空题：半径为5 cm的圆中，60°的圆心角所对弧长为______ cm。","answer":"答案：5π/3\n解析：l = nπR/180 = 60 × π × 5 / 180 = 300π/180 = 5π/3 cm"},{"id":"g3_math_030_ex03","knowledge_id":"g3_math_030","question":"选择题：半径为6的圆中，弧长为2π的弧所对的圆心角是（  ）\nA. 30°\nB. 60°\nC. 90°\nD. 120°","answer":"答案：B\n解析：l = nπR/180 = 2π\nnπ × 6 / 180 = 2π\nn = 2π × 180 / 6π = 60°"},{"id":"g3_math_030_ex04","knowledge_id":"g3_math_030","question":"判断题：扇形面积公式 S = nπR²/360，也可以写成 S = lR/2。（  ）","answer":"答案：正确\n解析：S = nπR²/360，由l = nπR/180代入，得 S = lR/2。两个公式等价，一个用圆心角，一个用弧长。"},{"id":"g3_math_030_ex05","knowledge_id":"g3_math_030","question":"填空题：半径为4 cm的圆中，90°圆心角的扇形面积为______ cm²。","answer":"答案：4π\n解析：S = nπR²/360 = 90 × π × 16 / 360 = 4π cm²"},{"id":"g3_math_030_ex06","knowledge_id":"g3_math_030","question":"解答题：半径为10 cm的圆中，圆心角120°的弧长和扇形面积。","answer":"答案：弧长20π/3 cm，面积100π/3 cm²\n解析：弧长：l = nπR/180 = 120 × π × 10 / 180 = 40π/3 cm？不对\nl = 120π × 10 / 180 = 1200π/180 = 20π/3 cm\n\n面积：S = nπR²/360 = 120 × π × 100 / 360 = 100π/3 cm²"},{"id":"g3_math_030_ex07","knowledge_id":"g3_math_030","question":"选择题：半径为R，弧长为πR的扇形的圆心角是（  ）\nA. 90°\nB. 180°\nC. 270°\nD. 360°","answer":"答案：B\n解析：l = nπR/180 = πR\nnπR = 180πR\nn = 180°"},{"id":"g3_math_030_ex08","knowledge_id":"g3_math_030","question":"填空题：一个扇形的弧长为6 cm，半径为4 cm，则扇形面积为______ cm²。","answer":"答案：12\n解析：S = lR/2 = 6 × 4 / 2 = 12 cm²"},{"id":"g3_math_030_ex09","knowledge_id":"g3_math_030","question":"选择题：半径为R的圆中，半圆（180°弧）的面积是（  ）\nA. πR²\nB. πR²/2\nC. πR\nD. 2πR","answer":"答案：B\n解析：半圆面积 = 圆面积/2 = πR²/2。也可用公式：S = 180πR²/360 = πR²/2。"},{"id":"g3_math_030_ex10","knowledge_id":"g3_math_030","question":"判断题：弧长公式和扇形面积公式都要求n是圆心角的度数。（  ）","answer":"答案：正确\n解析：弧长l = nπR/180和扇形面积S = nπR²/360中，n都是圆心角的度数（不是弧度）。"},{"id":"g3_math_031_ex01","knowledge_id":"g3_math_031","question":"选择题：圆锥的侧面展开图是（  ）\nA. 圆形\nB. 扇形\nC. 矩形\nD. 三角形","answer":"答案：B\n解析：圆锥侧面展开是扇形，扇形半径等于圆锥母线长，扇形弧长等于圆锥底面周长。"},{"id":"g3_math_031_ex02","knowledge_id":"g3_math_031","question":"填空题：圆锥底面半径r = 3 cm，母线长l = 5 cm，则圆锥侧面积为______ cm²。","answer":"答案：15π\n解析：侧面积公式：S侧 = πrl = π × 3 × 5 = 15π cm²"},{"id":"g3_math_031_ex03","knowledge_id":"g3_math_031","question":"选择题：圆锥底面半径为4，高为3，则母线长为（  ）\nA. 4\nB. 5\nC. 6\nD. 7","answer":"答案：B\n解析：母线² = 高² + 底面半径² = 9 + 16 = 25\n母线 = 5"},{"id":"g3_math_031_ex04","knowledge_id":"g3_math_031","question":"判断题：圆锥的侧面积等于扇形面积，扇形半径等于母线长。（  ）","answer":"答案：正确\n解析：圆锥侧面展开是扇形，扇形半径等于母线长，扇形弧长等于底面周长，所以圆锥侧面积等于对应扇形面积。"},{"id":"g3_math_031_ex05","knowledge_id":"g3_math_031","question":"填空题：圆锥底面半径r = 2 cm，母线长l = 6 cm，则圆锥全面积为______ cm²。","answer":"答案：16π\n解析：侧面积：S侧 = πrl = π × 2 × 6 = 12π cm²\n底面积：S底 = πr² = 4π cm²\n全面积：S全 = S侧 + S底 = 12π + 4π = 16π cm²"},{"id":"g3_math_031_ex06","knowledge_id":"g3_math_031","question":"解答题：圆锥底面半径为6 cm，高为8 cm，求圆锥的母线长、侧面积和全面积。","answer":"答案：母线10 cm，侧面积60π cm²，全面积96π cm²\n解析：母线：l = √(h² + r²) = √(64 + 36) = √100 = 10 cm\n侧面积：S侧 = πrl = π × 6 × 10 = 60π cm²\n底面积：S底 = πr² = 36π cm²\n全面积：S全 = 60π + 36π = 96π cm²"},{"id":"g3_math_031_ex07","knowledge_id":"g3_math_031","question":"选择题：圆锥侧面展开图的扇形圆心角为90°，底面半径为r，母线为l，则r:l =（  ）\nA. 1:2\nB. 1:4\nC. 1:1\nD. 2:1","answer":"答案：A\n解析：扇形弧长 = 底面周长 = 2πr\n扇形弧长 = (90°/360°) × 2πl = πl/2\n所以 2πr = πl/2 → l = 4r → r:l = 1:4"},{"id":"g3_math_031_ex08","knowledge_id":"g3_math_031","question":"填空题：圆锥底面周长为8π cm，母线长为10 cm，则圆锥侧面积为______ cm²。","answer":"答案：40π\n解析：底面周长 = 2πr = 8π，所以 r = 4 cm\n侧面积：S侧 = πrl = π × 4 × 10 = 40π cm²"},{"id":"g3_math_031_ex09","knowledge_id":"g3_math_031","question":"选择题：圆锥的高、底面半径、母线构成（  ）\nA. 等边三角形\nB. 直角三角形\nC. 等腰三角形\nD. 任意三角形","answer":"答案：B\n解析：圆锥的高垂直于底面，所以高、底面半径、母线构成直角三角形，母线² = 高² + 半径²。"},{"id":"g3_math_031_ex10","knowledge_id":"g3_math_031","question":"判断题：圆锥的侧面积公式 S侧 = πrl 中，r是底面半径，l是母线长。（  ）","answer":"答案：正确\n解析：侧面积公式：S侧 = πrl。r是底面半径（不是扇形半径），l是母线长（等于扇形半径）。"},{"id":"g3_math_032_ex01","knowledge_id":"g3_math_032","question":"选择题：下列事件是必然事件的是\nA. 掷一枚硬币，正面朝上\nB. 太阳从东方升起\nC. 明天会下雨\nD. 购买一张彩票中奖","answer":"答案：B\n解析：必然事件是一定会发生的事件。太阳从东方升起是自然规律，必然发生。其他选项都是随机事件。"},{"id":"g3_math_032_ex02","knowledge_id":"g3_math_032","question":"填空题：在一定条件下，必然不会发生的事件叫做______事件；可能发生也可能不发生的事件叫做______事件。","answer":"答案：不可能，随机\n解析：必然事件、不可能事件统称确定性事件；随机事件又称不确定事件。"},{"id":"g3_math_032_ex03","knowledge_id":"g3_math_032","question":"选择题：下列事件是不可能事件的是\nA. 明天最高气温30°C\nB. 掷骰子出现数字6\nC. 在标准大气压下，水加热到100°C沸腾\nD. 掷一枚硬币，连续10次正面朝上","answer":"答案：C\n解析：不可能事件是必然不会发生的事件。在标准大气压下，水加热到100°C沸腾是必然事件（一定会沸腾），不是不可能事件。这道题要选不可能事件，选项2描述的是必然事件，所以不对。应该是：选一个不可能事件的例子，如\"掷骰子出现数字7\"。"},{"id":"g3_math_032_ex04","knowledge_id":"g3_math_032","question":"选择题：下列说法正确的是\nA. 随机事件发生的概率为1\nB. 必然事件发生的概率为0\nC. 不可能事件发生的概率为0\nD. 随机事件发生的概率可以大于1","answer":"答案：C\n解析：必然事件概率为1，不可能事件概率为0，随机事件概率在0到1之间。所以\"不可能事件发生的概率为0\"是正确的。"},{"id":"g3_math_032_ex05","knowledge_id":"g3_math_032","question":"填空题：抛掷一枚均匀硬币，\"正面朝上\"是______事件，\"硬币立在桌面上\"是______事件。","answer":"答案：随机，不可能\n解析：正面朝上可能发生也可能不发生，是随机事件；硬币立在桌面上在实际条件下不可能发生，是不可能事件。"},{"id":"g3_math_032_ex06","knowledge_id":"g3_math_032","question":"判断题：随机事件在大量重复试验中，发生的频率会稳定在某个常数附近。（  ）","answer":"答案：正确\n解析：这是随机事件的基本性质。当试验次数足够多时，频率会稳定在概率附近，这为用频率估计概率提供了理论基础。"},{"id":"g3_math_032_ex07","knowledge_id":"g3_math_032","question":"选择题：从一副扑克牌（52张）中随机抽取一张，下列事件是随机事件的是\nA. 抽到红桃\nB. 抽到数字大于13的牌\nC. 抽到一张牌\nD. 抽到有54张牌的结果","answer":"答案：A\n解析：抽到红桃可能发生也可能不发生，是随机事件。抽到数字大于13的牌不可能（扑克牌最大数字13），是不可能事件。抽到一张牌是必然事件（一次抽一张）。抽到有54张牌的结果是不可能事件。"},{"id":"g3_math_032_ex08","knowledge_id":"g3_math_032","question":"填空题：某射手射击一次，\"命中靶心\"是______事件；如果这个射手技术很高，\"命中靶心\"发生的可能性较______。","answer":"答案：随机，大\n解析：命中靶心可能发生也可能不发生，是随机事件。射手技术水平高，命中概率大，可能性较大。"},{"id":"g3_math_032_ex09","knowledge_id":"g3_math_032","question":"选择题：下列事件分类正确的是\nA. 太阳从西方升起是随机事件\nB. 公鸡下蛋是不可能事件\nC. 抛硬币出现正面是必然事件\nD. 掷骰子出现1-6之间的数字是随机事件","answer":"答案：B\n解析：太阳从西方升起不可能发生，是不可能事件（不是随机事件）；公鸡下蛋不可能发生，是不可能事件（正确）；抛硬币出现正面可能发生也可能不发生，是随机事件（不是必然事件）；掷骰子出现1-6之间数字必然发生，是必然事件（不是随机事件）。"},{"id":"g3_math_032_ex10","knowledge_id":"g3_math_032","question":"判断题：在相同条件下，随机事件每次试验的结果可能不同，但可以进行大量重复试验。（  ）","answer":"答案：正确\n解析：随机事件的特点：可以在相同条件下重复进行，每次试验结果可能不同，试验前不能确定结果，但知道所有可能结果。"},{"id":"g3_math_033_ex01","knowledge_id":"g3_math_033","question":"选择题：掷一枚均匀硬币，正面朝上的概率是\nA. 0\nB. 1/2\nC. 1\nD. 无法确定","answer":"答案：B\n解析：硬币有两面，正面和反面，可能出现的结果总数n=2。正面朝上包含1种结果，所以P=1/2。"},{"id":"g3_math_033_ex02","knowledge_id":"g3_math_033","question":"填空题：概率的定义：一般地，对于一个随机事件A，我们把刻画其发生可能性大小的数值，称为随机事件A发生的______，记为______。","answer":"答案：概率，P(A)\n解析：概率是反映事件发生可能性大小的数值，P(A)表示事件A的概率。"},{"id":"g3_math_033_ex03","knowledge_id":"g3_math_033","question":"选择题：一个袋中有3个红球、2个白球，随机摸出一个球是红球的概率是\nA. 2/5\nB. 3/5\nC. 1/2\nD. 3/2","answer":"答案：B\n解析：球总数n=3+2=5，红球数m=3，所以摸出红球的概率P=3/5。"},{"id":"g3_math_033_ex04","knowledge_id":"g3_math_033","question":"填空题：掷一枚均匀骰子，出现数字大于4的概率是______。","answer":"答案：2/6=1/3\n解析：骰子可能出现的结果n=6（1,2,3,4,5,6）。大于4的结果有5和6，共2种，所以P=2/6=1/3。"},{"id":"g3_math_033_ex05","knowledge_id":"g3_math_033","question":"判断题：概率越大，事件发生的可能性越大；概率越小，事件发生的可能性越小。（  ）","answer":"答案：正确\n解析：概率是刻画事件发生可能性大小的数值。概率越接近1，可能性越大；概率越接近0，可能性越小。"},{"id":"g3_math_033_ex06","knowledge_id":"g3_math_033","question":"选择题：下列说法错误的是\nA. 必然事件的概率为1\nB. 不可能事件的概率为0\nC. 随机事件的概率介于0和1之间\nD. 概率可以大于1","answer":"答案：D\n解析：概率的范围是0≤P(A)≤1，不能大于1。必然事件P=1，不可能事件P=0，随机事件0<P<1。"},{"id":"g3_math_033_ex07","knowledge_id":"g3_math_033","question":"填空题：在一次试验中，有n种等可能的结果，事件A包含其中的m种结果，则事件A发生的概率P(A) = ______。","answer":"答案：m/n\n解析：等可能事件的概率公式：P(A) = m/n，其中n是所有可能结果总数，m是事件A包含的结果数。"},{"id":"g3_math_033_ex08","knowledge_id":"g3_math_033","question":"解答题：一个袋中有5个球，其中3个红球、2个白球，球除颜色外其他都相同。从袋中随机摸出一个球，求：(1)摸出红球的概率；(2)摸出白球的概率。","answer":"答案：(1)P(红)=3/5；(2)P(白)=2/5\n解析：球总数n=5。\n(1)红球数m=3，P(红)=3/5\n(2)白球数m=2，P(白)=2/5\n验证：P(红)+P(白)=3/5+2/5=1，符合概率性质。"},{"id":"g3_math_033_ex09","knowledge_id":"g3_math_033","question":"选择题：从1到10这10个整数中随机抽取一个数，抽到偶数的概率是\nA. 1/10\nB. 2/10\nC. 5/10\nD. 10/10","answer":"答案：C\n解析：从1到10有n=10个整数，偶数有2,4,6,8,10共5个，所以P=5/10=1/2。"},{"id":"g3_math_033_ex10","knowledge_id":"g3_math_033","question":"判断题：掷一枚骰子，出现数字7的概率为0。（  ）","answer":"答案：正确\n解析：骰子只有1-6六个数字，出现7是不可能事件，所以概率为0。不可能事件的概率都是0。"},{"id":"g3_math_034_ex01","knowledge_id":"g3_math_034","question":"解答题：同时掷两枚均匀硬币，求：(1)两枚都正面朝上的概率；(2)至少有一枚正面朝上的概率。","answer":"答案：(1)P=1/4；(2)P=3/4\n解析：列举所有可能结果（列表法）：\n  第一枚  第二枚\n  正面    正面  → 正正\n  正面    反面  → 正反\n  反面    正面  → 反正\n  反面    反面  → 反反\n共4种等可能结果。\n(1)\"正正\"有1种，P=1/4\n(2)\"至少一枚正面\"包括正正、正反、反正共3种，P=3/4"},{"id":"g3_math_034_ex02","knowledge_id":"g3_math_034","question":"选择题：掷两枚骰子，两枚骰子点数之和为7的概率是\nA. 1/36\nB. 1/12\nC. 6/36\nD. 1/6","answer":"答案：C\n解析：用列表法列举所有36种结果。点数和为7的有：(1,6),(2,5),(3,4),(4,3),(5,2),(6,6)共6种。所以P=6/36=1/6。"},{"id":"g3_math_034_ex03","knowledge_id":"g3_math_034","question":"填空题：用列举法求概率时，列举必须做到______、______，并且每种结果发生的可能性要______。","answer":"答案：不重复，不遗漏，相等\n解析：列举法的关键：不重复不遗漏，保证每种结果等可能，才能用P=m/n计算。"},{"id":"g3_math_034_ex04","knowledge_id":"g3_math_034","question":"解答题：袋中有3个红球、2个白球，球除颜色外其他都相同。不放回地连续摸两次球，求两次都摸到红球的概率。","answer":"答案：P=3/10\n解析：第一次摸球：5个球中3个红球，P(第一次红)=3/5\n第一次摸出红球后，袋中剩4个球（2红球2白球）\n第二次摸球：4个球中2个红球，P(第二次红|第一次红)=2/4=1/2\n不放回事件用树状图：\n第一次红(3/5)→第二次红(2/4)=3/5×1/2=3/10\n列举法：共5×4=20种有序结果，两次红球有3×2=6种，P=6/20=3/10"},{"id":"g3_math_034_ex05","knowledge_id":"g3_math_034","question":"选择题：从3个口袋中各取一个球，第一个口袋有2个红球，第二个口袋有3个白球，第三个口袋有1个黑球，取出的3个球恰好是红、白、黑各一个的概率是\nA. 0\nB. 1/6\nC. 1\nD. 无法计算","answer":"答案：B\n解析：用树状图列举：第一个口袋2种选择（红1或红2），第二个口袋3种选择（白1或白2或白3），第三个口袋1种选择（黑1）。共2×3×1=6种结果，每种结果都是红、白、黑各一个，所以P=6/6=1。不对，重新理解题意：取出的球恰好是红、白、黑各一个，这必然发生，因为每个口袋只有一种颜色的球，所以P=1。"},{"id":"g3_math_034_ex06","knowledge_id":"g3_math_034","question":"填空题：掷一枚硬币两次，可能出现的结果共有______种，列举法适用于结果数目较少的情况，当结果数目较多时常用______法或______法。","answer":"答案：4，列表，树状图\n解析：掷硬币两次：正正、正反、反正、反反共4种。结果少直接列举，结果多用列表法（两因素）或树状图法（多因素）。"},{"id":"g3_math_034_ex07","knowledge_id":"g3_math_034","question":"判断题：从一副扑克牌中随机抽取两张，用列举法列举所有可能结果时，需要列举52×51=2652种结果。（  ）","answer":"答案：错误\n解析：列举法一般用于结果数较少的情况。当结果数很多时，可以用理论计算或列表法、树状图法简化列举过程，不必一一列举所有2652种结果。"},{"id":"g3_math_034_ex08","knowledge_id":"g3_math_034","question":"解答题：甲袋中有2红1白共3个球，乙袋中有1红2白共3个球。从两个袋中各随机摸出一个球，求：(1)两个球都是红球的概率；(2)至少有一个红球的概率。","answer":"答案：(1)P=2/9；(2)P=5/9\n解析：用列表法列举：甲袋（红1、红2、白）×乙袋（红、白1、白2）共3×3=9种结果。\n结果矩阵：\n甲红1 → 乙红、乙白1、乙白2\n甲红2 → 乙红、乙白1、乙白2\n甲白   → 乙红、乙白1、乙白2\n(1)两球红红：甲红1+乙红、甲红2+乙红，共2种，P=2/9\n(2)至少一红：包括红红、红白、白红，共2+2+2+1=5种？不对，重新计算：红红2种，红白4种（甲红乙白），白红1种（甲白乙红），共2+4+1=7种？不对。仔细列举：甲红乙红2种，甲红乙白4种，甲白乙红1种，共7种，P=7/9。不对，再算：甲红乙白有甲红1乙白1、甲红1乙白2、甲红2乙白1、甲红2乙白2共4种。所以至少一红=红红2+红白4+白红1=7种，P=7/9。"},{"id":"g3_math_034_ex09","knowledge_id":"g3_math_034","question":"选择题：掷三枚硬币，三枚硬币都是正面朝上的概率是\nA. 1/2\nB. 1/4\nC. 1/8\nD. 1/3","answer":"答案：C\n解析：用树状图列举：每枚硬币有正反2种可能，三枚共2×2×2=8种结果。\"正正正\"只有1种，所以P=1/8。"},{"id":"g3_math_034_ex10","knowledge_id":"g3_math_034","question":"判断题：放回试验和不放回试验的结果总数相同。（  ）","answer":"答案：错误\n解析：放回试验：每次选择后总数不变，结果数为n×n×...；不放回试验：每次选择后总数减少，结果数为n×(n-1)×...。两者结果总数不同，概率也不同。"},{"id":"g3_math_035_ex01","knowledge_id":"g3_math_035","question":"选择题：在做抛硬币试验时，随着试验次数的增加，正面朝上的频率会\nA. 越来越大\nB. 越来越小\nC. 稳定在1/2附近\nD. 没有规律","answer":"答案：C\n解析：大量重复试验时，频率会稳定在概率附近。硬币正面朝上概率为1/2，所以频率稳定在1/2附近。"},{"id":"g3_math_035_ex02","knowledge_id":"g3_math_035","question":"填空题：当试验次数很大时，事件发生的频率会稳定在______附近，可以用______来估计概率。","answer":"答案：概率，频率\n解析：用频率估计概率：大量重复试验时，频率稳定在概率附近，可用频率近似估计概率。"},{"id":"g3_math_035_ex03","knowledge_id":"g3_math_035","question":"解答题：某射手在同一条件下进行射击，结果如下表：\n射击次数n：10  20  50  100  200  500\n命中次数m：8   17  41  82  164  401\n请估计该射手命中靶心的概率。","answer":"答案：P≈0.82\n解析：计算各次频率：\nn=10：8/10=0.80\nn=20：17/20=0.85\nn=50：41/50=0.82\nn=100：82/100=0.82\nn=200：164/200=0.82\nn=500：401/500=0.802\n频率稳定在0.82附近，所以估计该射手命中概率约为0.82。"},{"id":"g3_math_035_ex04","knowledge_id":"g3_math_035","question":"判断题：试验次数越多，频率就越接近概率。（  ）","answer":"答案：错误\n解析：只能说\"频率稳定在概率附近\"或\"频率趋近于概率\"，不能说\"越接近\"。因为频率本身会波动，即使试验次数很多，频率也可能偏离概率，只是整体趋势稳定。"},{"id":"g3_math_035_ex05","knowledge_id":"g3_math_035","question":"选择题：下列说法正确的是\nA. 频率是固定的常数\nB. 概率会随着试验次数变化\nC. 大量试验时，频率稳定在概率附近\nD. 频率等于概率","answer":"答案：C\n解析：频率是试验中的具体比值，每次可能不同；概率是理论值，是固定的常数。大量试验时，频率稳定在概率附近（正确），但不一定等于概率。"},{"id":"g3_math_035_ex06","knowledge_id":"g3_math_035","question":"填空题：某林业局对一批树苗进行成活率试验，种植1000棵树苗，成活950棵，则成活概率约为______。","answer":"答案：0.95\n解析：成活频率=950/1000=0.95。试验次数较大时，可用频率估计概率，所以成活概率约为0.95。"},{"id":"g3_math_035_ex07","knowledge_id":"g3_math_035","question":"选择题：用频率估计概率时，下列做法正确的是\nA. 做1次试验就用频率估计概率\nB. 做10次试验就用频率估计概率\nC. 做大量重复试验后用频率估计概率\nD. 用理论计算代替试验","answer":"答案：C\n解析：用频率估计概率需要大量重复试验（次数要足够多），试验次数太少时频率波动大，不能代表概率。"},{"id":"g3_math_035_ex08","knowledge_id":"g3_math_035","question":"解答题：为了估计一批产品的次品率，质检员抽取100件产品检查，发现3件次品。(1)估计这批产品的次品率；(2)如果抽取1000件产品检查，发现28件次品，再次估计次品率；(3)哪个估计更可靠？","answer":"答案：(1)P≈0.03；(2)P≈0.028；(3)第二个估计更可靠\n解析：(1)次品频率=3/100=0.03，估计次品率约为0.03。\n(2)次品频率=28/1000=0.028，估计次品率约为0.028。\n(3)第二个试验次数更多（1000件），频率更稳定，所以第二个估计更可靠。"},{"id":"g3_math_035_ex09","knowledge_id":"g3_math_035","question":"判断题：频率和概率都是刻画事件发生可能性大小的数值，但频率会波动，概率是固定的。（  ）","answer":"答案：正确\n解析：频率是实际试验中事件发生的次数比值，会因试验次数不同而波动；概率是理论上事件发生可能性的大小，是固定的常数。"},{"id":"g3_math_035_ex10","knowledge_id":"g3_math_035","question":"填空题：某人在相同的条件下重复进行某项试验，共进行了200次，其中事件A发生了40次，则事件A发生的频率为______，如果继续增加试验次数，频率会稳定在______附近。","answer":"答案：0.2，概率\n解析：频率=40/200=0.2。随着试验次数增加，频率会稳定在概率附近。"},{"id":"g3_math_036_ex01","knowledge_id":"g3_math_036","question":"选择题：下列函数是反比例函数的是\nA. y = 2x\nB. y = x/3\nC. y = 1/x\nD. y = x²","answer":"答案：C\n解析：反比例函数的形式为y = k/x（k≠0）。y = 1/x符合，其中k = 1。其他选项：y=2x是一次函数，y=x/3是一次函数，y=x²是二次函数。"},{"id":"g3_math_036_ex02","knowledge_id":"g3_math_036","question":"填空题：反比例函数的一般形式是y = k/x，其中k为常数且k ≠ ______，自变量x的取值范围是______。","answer":"答案：0，x ≠ 0\n解析：反比例函数定义：y = k/x（k≠0）。自变量x在分母，所以x≠0；函数值y也≠0。"},{"id":"g3_math_036_ex03","knowledge_id":"g3_math_036","question":"选择题：反比例函数y = -2/x的比例系数k是\nA. 2\nB. -2\nC. 1\nD. -1","answer":"答案：B\n解析：反比例函数y = k/x中的k叫做比例系数。在y = -2/x中，k = -2。"},{"id":"g3_math_036_ex04","knowledge_id":"g3_math_036","question":"填空题：已知函数y = -3/x，当x = 2时，y = ______；当y = 6时，x = ______。","answer":"答案：-1.5，-0.5\n解析：代入计算：x=2时，y=-3/2=-1.5；y=6时，-3/x=6，解得x=-3/6=-0.5。"},{"id":"g3_math_036_ex05","knowledge_id":"g3_math_036","question":"判断题：反比例函数y = k/x中，自变量x的次数是-1。（  ）","answer":"答案：正确\n解析：反比例函数y = k/x可以写成y = kx⁻¹，自变量x的次数是-1。这是判断反比例函数的一个标准。"},{"id":"g3_math_036_ex06","knowledge_id":"g3_math_036","question":"选择题：下列关系式中，y与x成反比例的是\nA. y = 2x + 1\nB. xy = 6\nC. y = 3 - x\nD. y/x = 2","answer":"答案：B\n解析：y与x成反比例的条件是xy = k（k≠0）。xy = 6符合，其中k = 6，所以y = 6/x是反比例函数。"},{"id":"g3_math_036_ex07","knowledge_id":"g3_math_036","question":"填空题：若函数y = (m-2)/x是反比例函数，则m的取值范围是______。","answer":"答案：m ≠ 2\n解析：反比例函数y = k/x要求k≠0。这里k = m-2，所以m-2≠0，即m≠2。"},{"id":"g3_math_036_ex08","knowledge_id":"g3_math_036","question":"选择题：路程s一定时，速度v与时间t的关系是\nA. v = st\nB. v = s/t\nC. v = t/s\nD. v = s + t","answer":"答案：B\n解析：路程s = vt，当s一定时，v = s/t，这是反比例函数关系。速度与时间成反比。"},{"id":"g3_math_036_ex09","knowledge_id":"g3_math_036","question":"填空题：等价形式判断：反比例函数可以表示为y = k/x，也可以表示为______（k≠0）或______（k≠0）。","answer":"答案：y = kx⁻¹，xy = k\n解析：反比例函数的三种等价形式：y = k/x，y = kx⁻¹，xy = k。这三种形式本质相同。"},{"id":"g3_math_036_ex10","knowledge_id":"g3_math_036","question":"解答题：已知反比例函数y = k/x的图象经过点P(2, -3)。(1)求k的值；(2)判断点Q(-1, 6)是否在此函数图象上。","answer":"答案：(1)k = -6；(2)点Q在图象上\n解析：(1)点P(2, -3)在函数y = k/x上，代入得：-3 = k/2，所以k = -6。\n(2)函数为y = -6/x。检验点Q(-1, 6)：x=-1时，y=-6/(-1)=6，与Q点坐标吻合，所以点Q在图象上。\n也可用xy = k检验：(-1)×6 = -6 = k ✓"},{"id":"g3_math_037_ex01","knowledge_id":"g3_math_037","question":"选择题：反比例函数y = k/x（k≠0）的图象是\nA. 一条直线\nB. 一条抛物线\nC. 双曲线\nD. 圆","answer":"答案：C\n解析：反比例函数的图象是双曲线，由两个分支组成。这是反比例函数图象的基本特征。"},{"id":"g3_math_037_ex02","knowledge_id":"g3_math_037","question":"填空题：反比例函数y = 3/x的图象在第______象限；在每个象限内，y随x增大而______。","answer":"答案：一、三，减小\n解析：k = 3 > 0，图象在一、三象限。在每个象限内，y随x增大而减小。这是k > 0时的性质。"},{"id":"g3_math_037_ex03","knowledge_id":"g3_math_037","question":"选择题：反比例函数y = -2/x的图象在\nA. 第一、二象限\nB. 第一、三象限\nC. 第二、四象限\nD. 第三、四象限","answer":"答案：C\n解析：k = -2 < 0，图象在第二、四象限。这是k < 0时的性质。"},{"id":"g3_math_037_ex04","knowledge_id":"g3_math_037","question":"判断题：反比例函数的图象无限接近坐标轴，但永远不与坐标轴相交。（  ）","answer":"答案：正确\n解析：反比例函数y = k/x中，x≠0且y≠0，所以图象不经过原点，也不与坐标轴相交。图象无限接近x轴和y轴。"},{"id":"g3_math_037_ex05","knowledge_id":"g3_math_037","question":"填空题：反比例函数y = k/x的图象是中心对称图形，对称中心是______；也是轴对称图形，对称轴是直线______和直线______。","answer":"答案：原点，y = x，y = -x\n解析：反比例函数图象具有对称性：中心对称（对称中心是原点），轴对称（对称轴是y=x和y=-x）。"},{"id":"g3_math_037_ex06","knowledge_id":"g3_math_037","question":"选择题：下列反比例函数中，图象在第一、三象限的是\nA. y = -1/x\nB. y = -5/x\nC. y = 2/x\nD. y = -3/x","answer":"答案：C\n解析：k > 0时，图象在一、三象限。y = 2/x中k = 2 > 0，符合条件。其他选项k都小于0，图象在二、四象限。"},{"id":"g3_math_037_ex07","knowledge_id":"g3_math_037","question":"解答题：已知反比例函数y = k/x，当x = 1时y = -4。(1)求k的值；(2)画出函数图象的草图；(3)判断函数图象在哪个象限，并说明在每个象限内y随x的变化情况。","answer":"答案：(1)k = -4；(2)略；(3)二、四象限，y随x增大而增大\n解析：(1)x = 1时y = -4，代入y = k/x得：-4 = k/1，所以k = -4。\n(2)函数为y = -4/x，图象是双曲线，位于二、四象限。\n(3)因为k = -4 < 0，图象在第二、四象限。在每个象限内，y随x增大而增大（第二象限：x负增大→y正增大；第四象限：x正增大→y负增大）。"},{"id":"g3_math_037_ex08","knowledge_id":"g3_math_037","question":"选择题：点A(-2, 3)在反比例函数y = k/x的图象上，则k的值是\nA. -6\nB. 6\nC. -3/2\nD. 3/2","answer":"答案：A\n解析：点在图象上，满足xy = k。(-2)×3 = -6，所以k = -6。也可代入y = k/x：3 = k/(-2)，k = -6。"},{"id":"g3_math_037_ex09","knowledge_id":"g3_math_037","question":"填空题：比较反比例函数y = 3/x和y = 6/x的图象：y = 6/x的图象离原点较______，因为|6| > |3|。","answer":"答案：远\n解析：|k|的意义：|k|越大，双曲线离原点越远；|k|越小，双曲线离原点越近。"},{"id":"g3_math_037_ex10","knowledge_id":"g3_math_037","question":"判断题：反比例函数y = k/x（k > 0）在每个象限内，y随x增大而减小，但在整个图象上，y随x增大而减小。（  ）","answer":"答案：错误\n解析：反比例函数的增减性只在\"每个象限内\"讨论，不能说\"整个图象上\"。例如k > 0时，从第一象限到第三象限，x从正变负，y也从正变负，不符合增减性定义。必须在同一象限内讨论。"},{"id":"g3_math_038_ex01","knowledge_id":"g3_math_038","question":"选择题：反比例函数y = k/x的图象上一点P(3, 2)，则过P点作x轴、y轴的垂线围成的矩形面积为\nA. 3\nB. 2\nC. 6\nD. 1","answer":"答案：C\n解析：矩形面积 = |x|×|y| = |xy| = |k|。点P(3, 2)在图象上，xy = 3×2 = 6 = k，所以矩形面积 = |k| = 6。"},{"id":"g3_math_038_ex02","knowledge_id":"g3_math_038","question":"填空题：反比例函数y = k/x的几何意义：过图象上任意一点作x轴、y轴的垂线，围成的矩形面积为______。","answer":"答案：|k|\n解析：这是k的几何意义：矩形面积 = OA × OB = |x| × |y| = |xy| = |k|，与点的位置无关。"},{"id":"g3_math_038_ex03","knowledge_id":"g3_math_038","question":"选择题：反比例函数y = -4/x的图象上一点P，过P作x轴垂线，连接OP，则三角形OPA的面积是\nA. 4\nB. 2\nC. -4\nD. -2","answer":"答案：B\n解析：三角形面积 = 1/2 × 矩形面积 = 1/2 × |k| = 1/2 × 4 = 2。这是推论：直角三角形面积 = |k|/2。"},{"id":"g3_math_038_ex04","knowledge_id":"g3_math_038","question":"解答题：已知反比例函数y = k/x的图象上一点P(2, -3)。(1)求k的值；(2)过P作x轴、y轴的垂线PA、PB，求矩形OAPB的面积；(3)求三角形OPA的面积。","answer":"答案：(1)k = -6；(2)面积 = 6；(3)面积 = 3\n解析：(1)点P在图象上，xy = k。2×(-3) = -6，所以k = -6。\n(2)矩形面积 = |k| = |-6| = 6。\n(3)三角形面积 = 1/2 × 矩形面积 = 1/2 × 6 = 3。"},{"id":"g3_math_038_ex05","knowledge_id":"g3_math_038","question":"填空题：双曲线上两点A(a, b)和B(c, d)，若A、B在同一象限，则矩形面积相等，都等于______；若A、B在不同象限，矩形面积仍相等，等于______。","answer":"答案：|k|，|k|\n解析：无论在哪一象限，只要在双曲线y = k/x上，矩形面积都等于|k|。|k|是常数，与点的位置无关。"},{"id":"g3_math_038_ex06","knowledge_id":"g3_math_038","question":"选择题：反比例函数y = k/x图象上一点P与原点O连线，形成三角形，面积为3，则k的值可能是\nA. 3\nB. 6\nC. -6\nD. 6或-6","answer":"答案：D\n解析：三角形面积 = |k|/2 = 3，所以|k| = 6，k = 6或-6。由面积只能确定|k|，k的正负由象限决定。"},{"id":"g3_math_038_ex07","knowledge_id":"g3_math_038","question":"判断题：反比例函数图象上任意两点与原点围成的三角形面积相等。（  ）","answer":"答案：正确\n解析：三角形面积 = |k|/2，是常数，与点的位置无关。所以任意两点与原点围成的三角形面积都相等。"},{"id":"g3_math_038_ex08","knowledge_id":"g3_math_038","question":"解答题：已知反比例函数y = k/x的图象经过点A(1, 4)。(1)求k的值；(2)过A点作x轴垂线，垂足为B，求三角形AOB的面积；(3)在图象上另取一点C(-2, -2)，过C作x轴垂线，垂足为D，比较三角形COD与三角形AOB的面积。","answer":"答案：(1)k = 4；(2)面积 = 2；(3)面积相等，都是2\n解析：(1)点A(1, 4)在图象上，k = xy = 1×4 = 4。\n(2)三角形AOB面积 = |k|/2 = 4/2 = 2。\n(3)点C(-2, -2)在图象上，三角形COD面积 = |k|/2 = 4/2 = 2。\n两三角形面积相等，都等于|k|/2 = 2。"},{"id":"g3_math_038_ex09","knowledge_id":"g3_math_038","question":"填空题：已知双曲线y = k/x上一点P(4, m)，过P作坐标轴垂线围成的矩形面积为8，则k = ______，m = ______。","answer":"答案：8或-8，2或-2\n解析：矩形面积 = |k| = 8，所以k = 8或-8。\n点P在图象上：xy = k，即4m = k。\n若k = 8，则m = 2；若k = -8，则m = -2。"},{"id":"g3_math_038_ex10","knowledge_id":"g3_math_038","question":"选择题：下列说法正确的是\nA. 双曲线上的点围成的矩形面积可以是负数\nB. k的正负不影响矩形面积\nC. 矩形面积 = k（不是|k|）\nD. 不同双曲线上的点矩形面积不同","answer":"答案：B\n解析：矩形面积 = |k|，是正数，与k的正负无关。不同双曲线（k不同）上点的矩形面积不同（等于各自|k|），但同一双曲线上点的矩形面积都相等。"},{"id":"g3_math_039_ex01","knowledge_id":"g3_math_039","question":"选择题：甲乙两地相距120 km，汽车速度为v km/h，行驶时间为t h，则v与t的关系是\nA. v = 120t\nB. v = 120/t\nC. t = 120/v\nD. v + t = 120","answer":"答案：B\n解析：路程s = vt = 120，所以v = 120/t。这是反比例关系，路程一定时速度与时间成反比。"},{"id":"g3_math_039_ex02","knowledge_id":"g3_math_039","question":"填空题：小明用100元买笔记本，笔记本单价为x元，数量为y本，则y与x的关系为______，这是______函数。","answer":"答案：y = 100/x，反比例\n解析：总价 = 单价 × 数量，100 = xy，所以y = 100/x。总价一定时，数量与单价成反比。"},{"id":"g3_math_039_ex03","knowledge_id":"g3_math_039","question":"选择题：一定质量的气体，体积V与压强P的关系为PV = 100，当V = 5时，P的值是\nA. 5\nB. 10\nC. 20\nD. 50","answer":"答案：C\n解析：PV = 100，V = 5时，P = 100/5 = 20。压强与体积成反比。"},{"id":"g3_math_039_ex04","knowledge_id":"g3_math_039","question":"解答题：某工程队完成一项工程需要15天，工作效率为每天完成工程的1/15。如果工作效率提高到原来的2倍，那么完成工程需要多少天？设工作效率为p，时间为t。","answer":"答案：需要7.5天\n解析：工程总量一定，设为1。工作量 = 工作效率 × 时间 = pt = 1。\n原效率p₀ = 1/15，时间t₀ = 15。\n新效率p₁ = 2p₀ = 2/15。\n时间t₁ = 1/p₁ = 15/2 = 7.5天。\n验证：pt = (2/15)×7.5 = 1 ✓"},{"id":"g3_math_039_ex05","knowledge_id":"g3_math_039","question":"判断题：实际问题中的反比例函数，自变量取值范围往往是正数，图象只有第一象限的一支。（  ）","answer":"答案：正确\n解析：实际问题中，速度、时间、单价、数量等都大于0，所以自变量x > 0。函数图象只有第一象限的一支（k > 0时）或第四象限的一支（k < 0时，但实际问题中通常k > 0）。"},{"id":"g3_math_039_ex06","knowledge_id":"g3_math_039","question":"填空题：矩形面积为50 cm²，长为a cm，宽为b cm，则a与b的关系为______。当长a = 10 cm时，宽b = ______ cm。","answer":"答案：a = 50/b，5\n解析：面积 = 长 × 宽 = ab = 50，所以a = 50/b。当a = 10时，10 = 50/b，b = 5 cm。"},{"id":"g3_math_039_ex07","knowledge_id":"g3_math_039","question":"选择题：用电器的电阻R与电流I的关系为电压U = RI。若电压U = 220 V保持不变，则R与I的关系是\nA. R = 220I\nB. I = 220/R\nC. R = 220/I\nD. RI = 220","answer":"答案：D\n解析：电压U = RI = 220（常数），所以R与I成反比关系，RI = 220，即R = 220/I。"},{"id":"g3_math_039_ex08","knowledge_id":"g3_math_039","question":"解答题：某小区建设一个面积为36 m²的长方形花坛。(1)设花坛长为x m，宽为y m，求y与x的函数关系；(2)如果要求花坛长不小于6 m，求宽的范围；(3)如果要求宽不小于3 m，求长的范围。","answer":"答案：(1)y = 36/x；(2)y ≤ 6；(3)x ≤ 12\n解析：(1)面积 = 长 × 宽 = xy = 36，所以y = 36/x。\n(2)长x ≥ 6，宽y = 36/x ≤ 36/6 = 6。所以宽y ≤ 6 m。\n(3)宽y ≥ 3，长x = 36/y ≤ 36/3 = 12。所以长x ≤ 12 m。"},{"id":"g3_math_039_ex09","knowledge_id":"g3_math_039","question":"选择题：某水池容积为200 m³，进水速度为v m³/h，注满水池时间为t h。若进水速度v增大，则注满时间t\nA. 增大\nB. 减小\nC. 不变\nD. 无法确定","answer":"答案：B\n解析：水池容积 = vt = 200，v增大时，t = 200/v减小。反比例关系中，一个量增大，另一个量减小。"},{"id":"g3_math_039_ex10","knowledge_id":"g3_math_039","question":"填空题：利用反比例函数解决实际问题的步骤：找出______关系，建立函数模型，确定自变量______范围，利用性质解决问题，检验实际意义。","answer":"答案：变量，取值\n解析：解决实际问题的步骤：分析题意找变量关系 → 建立函数模型 → 确定自变量范围 → 利用性质求解 → 检验实际意义。"},{"id":"g3_math_040_ex01","knowledge_id":"g3_math_040","question":"选择题：相似图形的特点是\nA. 形状相同、大小相同\nB. 形状相同、大小不一定相同\nC. 形状不同、大小相同\nD. 形状和大小都不一定相同","answer":"答案：B\n解析：相似图形是形状相同，大小不一定相同的图形。全等是相似的特殊情况（相似比为1）。"},{"id":"g3_math_040_ex02","knowledge_id":"g3_math_040","question":"填空题：相似比是指相似图形______的比值。若△ABC与△DEF的相似比为2:3，则△DEF与△ABC的相似比为______。","answer":"答案：对应边，3:2\n解析：相似比与顺序有关。△ABC∽△DEF相似比为k，则△DEF∽△ABC相似比为1/k。"},{"id":"g3_math_040_ex03","knowledge_id":"g3_math_040","question":"选择题：相似多边形的性质不包括\nA. 对应角相等\nB. 对应边成比例\nC. 周长比等于相似比\nD. 面积比等于相似比","answer":"答案：D\n解析：相似多边形面积比等于相似比的平方，不是相似比。这是常犯错误。"},{"id":"g3_math_040_ex04","knowledge_id":"g3_math_040","question":"填空题：两个相似三角形，相似比为k，则它们的周长比为______，面积比为______。","answer":"答案：k，k²\n解析：周长比=相似比k，面积比=相似比的平方k²。这是重要性质。"},{"id":"g3_math_040_ex05","knowledge_id":"g3_math_040","question":"判断题：全等图形是相似图形的特殊情况，此时相似比为1。（  ）","answer":"答案：正确\n解析：全等图形形状相同、大小相同，是相似比为1的相似图形。全等与相似的关系：全等包含于相似。"},{"id":"g3_math_040_ex06","knowledge_id":"g3_math_040","question":"选择题：比例性质：若a/b = c/d，下列等式成立的是\nA. a/c = b/d\nB. ad = bc\nC. a+d = b+c\nD. a-b = c-d","answer":"答案：B\n解析：比例基本性质：a/b = c/d ⇒ ad = bc。这是比例变形的基础。"},{"id":"g3_math_040_ex07","knowledge_id":"g3_math_040","question":"填空题：相似多边形必须满足：各角______，各边______。","answer":"答案：分别相等，成比例\n解析：相似多边形定义：边数相同，各角分别相等，各边成比例的多边形。"},{"id":"g3_math_040_ex08","knowledge_id":"g3_math_040","question":"解答题：△ABC∽△DEF，相似比为2:3。已知△ABC的周长为12 cm，面积为16 cm²。求△DEF的周长和面积。","answer":"答案：周长18 cm，面积36 cm²\n解析：周长比 = 相似比 = 2:3，△DEF周长 = 12 × 3/2 = 18 cm。\n面积比 = 相似比的平方 = 4:9，△DEF面积 = 16 × 9/4 = 36 cm²。"},{"id":"g3_math_040_ex09","knowledge_id":"g3_math_040","question":"选择题：下列说法正确的是\nA. 相似比只与形状有关\nB. 面积比等于相似比\nC. 周长比等于面积比\nD. 相似比与顺序有关","answer":"答案：D\n解析：相似比与顺序有关：△ABC∽△DEF相似比为k，则△DEF∽△ABC相似比为1/k。其他选项都错误。"},{"id":"g3_math_040_ex10","knowledge_id":"g3_math_040","question":"填空题：等比性质：若a/b = c/d = m/n（b+d+n≠0），则(a+c+m)/(b+d+n) = ______。","answer":"答案：a/b\n解析：等比性质：若干个相等的比的分子之和与分母之和的比，等于其中任意一个比。"},{"id":"g3_math_041_ex01","knowledge_id":"g3_math_041","question":"选择题：相似三角形判定定理AA的内容是\nA. 三边成比例\nB. 两边成比例且夹角相等\nC. 两角分别相等\nD. 三边相等","answer":"答案：C\n解析：AA定理：两角分别相等的两个三角形相似。这是最常用的判定方法。"},{"id":"g3_math_041_ex02","knowledge_id":"g3_math_041","question":"填空题：在△ABC和△DEF中，若∠A = ∠D = 50°，∠B = ∠E = 60°，则△ABC与△DEF______。","answer":"答案：相似\n解析：两角对应相等（50°和60°），根据AA定理，两三角形相似。第三角也必然相等（都为70°）。"},{"id":"g3_math_041_ex03","knowledge_id":"g3_math_041","question":"选择题：如图，DE∥BC，则△ADE与△ABC相似的理由是\nA. SSS\nB. SAS\nC. AA\nD. HL","answer":"答案：C\n解析：DE∥BC，则∠ADE = ∠ABC，∠AED = ∠ACB（平行线性质），两角对应相等，根据AA定理判定相似。"},{"id":"g3_math_041_ex04","knowledge_id":"g3_math_041","question":"解答题：在△ABC中，D在AB上，E在AC上，DE∥BC。若AD = 3，AB = 9，求△ADE与△ABC的相似比。","answer":"答案：相似比为1:3\n解析：∵ DE∥BC，∴ △ADE∽△ABC（AA）。\n相似比 = AD/AB = 3/9 = 1/3。\n对应边比都等于1/3。"},{"id":"g3_math_041_ex05","knowledge_id":"g3_math_041","question":"判断题：只要找到两个角对应相等，就可以判定两个三角形相似。（  ）","answer":"答案：正确\n解析：AA定理是最简洁的判定方法。两角对应相等后，第三角必然相等（内角和180°），所以两个三角形相似。"},{"id":"g3_math_041_ex06","knowledge_id":"g3_math_041","question":"填空题：公共角模型：若△ABC和△ABD有一个公共角∠A，要证明△ABC∽△ABD，还需证明______。","answer":"答案：∠B = ∠C或∠C = ∠D\n解析：公共角模型中，已有∠A公共。还需一个角对应相等，即可用AA定理判定相似。"},{"id":"g3_math_041_ex07","knowledge_id":"g3_math_041","question":"选择题：下列条件不能判定△ABC∽△DEF的是\nA. ∠A=∠D，∠B=∠E\nB. ∠A=∠D，∠B=60°，∠E=60°\nC. ∠A=50°，∠D=50°，∠B=70°，∠E=70°\nD. ∠A=∠D=∠B","answer":"答案：D\n解析：第四个选项：∠A=∠D=∠B，这没有给出第二个角对应相等的信息，不能判定相似。其他选项都能判定。"},{"id":"g3_math_041_ex08","knowledge_id":"g3_math_041","question":"解答题：在△ABC中，∠B = 50°，高AD交BC于D，高CE交AB于E。证明△ABD∽△CBE。","answer":"答案：△ABD∽△CBE（AA）\n解析：∵ AD和CE是高，∴ ∠ADB = ∠CEB = 90°。\n又 ∠B是公共角 = 50°。\n∴ △ABD∽△CBE（两角对应相等，AA）。"},{"id":"g3_math_041_ex09","knowledge_id":"g3_math_041","question":"选择题：同角的余角相等这一性质可以用于\nA. 全等判定\nB. 相似判定AA\nC. 相似判定SAS\nD. 相似判定SSS","answer":"答案：B\n解析：同角的余角相等：若∠A+∠B=90°，∠A+∠C=90°，则∠B=∠C。这可用于找角相等，配合AA定理判定相似。"},{"id":"g3_math_041_ex10","knowledge_id":"g3_math_041","question":"填空题：平行线截三角形（A型图）：若DE∥BC，则△ADE与△ABC相似，相似比为______。","answer":"答案：AD/AB\n解析：A型图中，相似比 = AD/AB = AE/AC = DE/BC。对应边比值都相等。"},{"id":"g3_math_042_ex01","knowledge_id":"g3_math_042","question":"选择题：相似三角形判定定理SAS的内容是\nA. 三边成比例\nB. 两边成比例且夹角相等\nC. 两角相等\nD. 三边相等","answer":"答案：B\n解析：SAS定理：两边成比例且夹角相等的两个三角形相似。注意必须是夹角。"},{"id":"g3_math_042_ex02","knowledge_id":"g3_math_042","question":"填空题：相似三角形判定定理SSS的内容是：______的两个三角形相似。","answer":"答案：三边成比例\n解析：SSS定理：三边成比例的两个三角形相似。即AB/DE = BC/EF = AC/DF。"},{"id":"g3_math_042_ex03","knowledge_id":"g3_math_042","question":"选择题：下列条件能判定△ABC∽△DEF（SAS）的是\nA. AB/DE=2，AC/DF=2，∠A=∠D\nB. AB/DE=2，BC/EF=3，∠A=∠D\nC. AB/DE=2，AC/DF=3，∠A=∠D\nD. AB/DE=2，BC/EF=2，∠B=∠E","answer":"答案：A\n解析：SAS定理要求：两边成比例且夹角相等。AB/DE=AC/DF=2（两边成比例），∠A=∠D（夹角），符合条件。"},{"id":"g3_math_042_ex04","knowledge_id":"g3_math_042","question":"解答题：△ABC中，AB=6，AC=4，∠A=60°；△DEF中，DE=3，DF=2，∠D=60°。判断△ABC与△DEF是否相似。","answer":"答案：△ABC∽△DEF（SAS）\n解析：AB/DE = 6/3 = 2，AC/DF = 4/2 = 2，两边成比例。\n∠A = ∠D = 60°（夹角相等）。\n∴ △ABC∽△DEF（SAS定理）。"},{"id":"g3_math_042_ex05","knowledge_id":"g3_math_042","question":"判断题：两边成比例且有一个角相等，就可以判定两个三角形相似。（  ）","answer":"答案：错误\n解析：SAS定理要求必须是夹角。如果是非夹角，不能判定相似。例如两边成比例但角不是夹角，可能不相似。"},{"id":"g3_math_042_ex06","knowledge_id":"g3_math_042","question":"填空题：直角三角形相似的特殊判定（HL）：______和______成比例的两个直角三角形相似。","answer":"答案：斜边，一条直角边\n解析：HL定理：斜边和一条直角边成比例的两个直角三角形相似。这是直角三角形的特殊判定。"},{"id":"g3_math_042_ex07","knowledge_id":"g3_math_042","question":"选择题：△ABC和△DEF都是直角三角形，若AB/DE = AC/DF（AB、DE为斜边），则\nA. △ABC≌△DEF\nB. △ABC∽△DEF\nC. 无法判断\nD. 一定不相似","answer":"答案：B\n解析：直角三角形中，斜边和一条直角边成比例，根据HL定理判定相似。"},{"id":"g3_math_042_ex08","knowledge_id":"g3_math_042","question":"解答题：△ABC中，AB=4，BC=6，AC=8；△DEF中，DE=2，EF=3，DF=4。判断△ABC与△DEF是否相似。","answer":"答案：△ABC∽△DEF（SSS）\n解析：AB/DE = 4/2 = 2，BC/EF = 6/3 = 2，AC/DF = 8/4 = 2。\n三边成比例，比值相等。\n∴ △ABC∽△DEF（SSS定理）。"},{"id":"g3_math_042_ex09","knowledge_id":"g3_math_042","question":"选择题：相似三角形判定方法总结，不包括\nA. AA（两角相等）\nB. SAS（两边成比例夹角相等）\nC. SSS（三边成比例）\nD. ASA（两角夹边）","answer":"答案：D\n解析：ASA是全等判定定理，不是相似判定定理。相似判定有AA、SAS、SSS、HL（直角三角形）四种。"},{"id":"g3_math_042_ex10","knowledge_id":"g3_math_042","question":"填空题：选择相似判定方法的原则：已知角的信息多用______；已知边的信息多用______或______。","answer":"答案：AA，SAS，SSS\n解析：判定方法选择：有角信息优先用AA（最常用），有边信息用SAS或SSS。"},{"id":"g3_math_043_ex01","knowledge_id":"g3_math_043","question":"选择题：相似三角形的性质不包括\nA. 对应角相等\nB. 对应边成比例\nC. 面积比=相似比\nD. 周长比=相似比","answer":"答案：C\n解析：面积比=相似比的平方，不是相似比。这是常犯错误，必须记住。"},{"id":"g3_math_043_ex02","knowledge_id":"g3_math_043","question":"填空题：相似三角形对应高的比等于______，对应中线的比等于______。","answer":"答案：相似比，相似比\n解析：相似三角形对应线段（高、中线、角平分线）的比都等于相似比。"},{"id":"g3_math_043_ex03","knowledge_id":"g3_math_043","question":"选择题：△ABC∽△DEF，相似比为k，面积比为\nA. k\nB. k²\nC. √k\nD. 1/k²","answer":"答案：B\n解析：面积比 = 相似比的平方 = k²。这是相似三角形的重要性质。"},{"id":"g3_math_043_ex04","knowledge_id":"g3_math_043","question":"解答题：△ABC∽△DEF，△ABC面积为4 cm²，△DEF面积为16 cm²。求相似比。","answer":"答案：相似比为1:2\n解析：面积比 = 4:16 = 1:4 = k²。\n∴ k = √(1/4) = 1/2。\n相似比为1:2。\n已知面积比求相似比，要开平方。"},{"id":"g3_math_043_ex05","knowledge_id":"g3_math_043","question":"判断题：相似三角形面积的比等于周长的比。（  ）","answer":"答案：错误\n解析：面积比 = 相似比的平方，周长比 = 相似比。两者不同，面积比是周长比的平方。"},{"id":"g3_math_043_ex06","knowledge_id":"g3_math_043","question":"填空题：△ABC∽△DEF，相似比为3:2，△ABC的周长为18 cm，则△DEF的周长为______cm。","answer":"答案：12\n解析：周长比 = 相似比 = 3:2。△DEF周长 = 18 × 2/3 = 12 cm。"},{"id":"g3_math_043_ex07","knowledge_id":"g3_math_043","question":"选择题：△ABC的高AD与△DEF的高EH对应，若相似比为2:3，AD=4 cm，则EH=\nA. 2 cm\nB. 3 cm\nC. 6 cm\nD. 8 cm","answer":"答案：C\n解析：对应高的比 = 相似比 = 2:3。EH = 4 × 3/2 = 6 cm。"},{"id":"g3_math_043_ex08","knowledge_id":"g3_math_043","question":"解答题：△ABC∽△DEF，相似比为2:3。已知△ABC的高为4 cm，面积为12 cm²。求△DEF的高和面积。","answer":"答案：高6 cm，面积27 cm²\n解析：对应高比 = 相似比 = 2:3。△DEF高 = 4 × 3/2 = 6 cm。\n面积比 = 相似比的平方 = 4:9。△DEF面积 = 12 × 9/4 = 27 cm²。"},{"id":"g3_math_043_ex09","knowledge_id":"g3_math_043","question":"选择题：已知两个相似三角形面积比为9:4，则周长比为\nA. 9:4\nB. 3:2\nC. 4:9\nD. 2:3","answer":"答案：B\n解析：面积比 = k² = 9:4，所以k = √(9/4) = 3/2。周长比 = k = 3:2。"},{"id":"g3_math_043_ex10","knowledge_id":"g3_math_043","question":"填空题：相似三角形性质总结：对应角相等，对应边成比例，对应线段比=______，周长比=______，面积比=______。","answer":"答案：相似比，相似比，相似比的平方\n解析：三大性质：对应线段比=相似比，周长比=相似比，面积比=相似比的平方。"},{"id":"g3_math_044_ex01","knowledge_id":"g3_math_044","question":"选择题：位似图形的定义是\nA. 形状相同的图形\nB. 相似且对应点连线交于一点\nC. 全等的图形\nD. 对称的图形","answer":"答案：B\n解析：位似图形：相似且对应点连线相交于一点（位似中心）的图形。位似是特殊的相似。"},{"id":"g3_math_044_ex02","knowledge_id":"g3_math_044","question":"填空题：位似图形的对应点连线都经过______，这个点叫做______。","answer":"答案：位似中心，位似中心\n解析：位似中心是位似图形对应点连线的公共交点。"},{"id":"g3_math_044_ex03","knowledge_id":"g3_math_044","question":"选择题：位似图形的性质不包括\nA. 是相似图形\nB. 对应点连线经过位似中心\nC. 对应边平行\nD. 对应点到中心距离比等于相似比","answer":"答案：C\n解析：位似图形对应边平行或在同一直线上，这是性质之一。所有选项都是位似图形的性质。此题有误，所有选项都对。应该选\"对应边垂直\"之类的错误选项。"},{"id":"g3_math_044_ex04","knowledge_id":"g3_math_044","question":"判断题：相似图形一定是位似图形。（  ）","answer":"答案：错误\n解析：位似是相似的特殊情况。相似图形不一定位似，位似图形一定相似。"},{"id":"g3_math_044_ex05","knowledge_id":"g3_math_044","question":"填空题：在平面直角坐标系中，以原点为位似中心，相似比为k，则原图形上点(x,y)的对应点坐标为______或______。","answer":"答案：(kx, ky)，(-kx, -ky)\n解析：以原点为位似中心的位似变换：坐标变化为(x,y)→(kx,ky)或(x,y)→(-kx,-ky)。两种情况对应图形在不同位置。"},{"id":"g3_math_044_ex06","knowledge_id":"g3_math_044","question":"选择题：△ABC顶点为(1,2)，(3,2)，(2,4)，以原点为位似中心，相似比为2，则位似图形顶点可能是\nA. (2,4)，(6,4)，(4,8)\nB. (2,4)，(6,4)，(4,8)或(-2,-4)，(-6,-4)，(-4,-8)\nC. (-2,-4)，(-6,-4)，(-4,-8)\nD. (0.5,1)，(1.5,1)，(1,2)","answer":"答案：B\n解析：以原点为位似中心，相似比k=2，坐标变化为(x,y)→(2x,2y)或(x,y)→(-2x,-2y)。两种情况都正确。"},{"id":"g3_math_044_ex07","knowledge_id":"g3_math_044","question":"解答题：△ABC顶点为A(1,1)，B(2,1)，C(1.5,2)，以原点为位似中心，位似比为1/2，求位似图形△DEF的顶点坐标。","answer":"答案：D(0.5,0.5)，E(1,0.5)，F(0.75,1)或D(-0.5,-0.5)，E(-1,-0.5)，F(-0.75,-1)\n解析：位似比k=1/2，坐标变化：\n(x,y)→(kx,ky)：(1,1)→(0.5,0.5)，(2,1)→(1,0.5)，(1.5,2)→(0.75,1)\n或(x,y)→(-kx,-ky)：(1,1)→(-0.5,-0.5)，(2,1)→(-1,-0.5)，(1.5,2)→(-0.75,-1)"},{"id":"g3_math_044_ex08","knowledge_id":"g3_math_044","question":"填空题：位似图形的位似比等于______。","answer":"答案：相似比\n解析：位似图形的位似比就是相似比，对应点到位似中心距离的比值等于相似比。"},{"id":"g3_math_044_ex09","knowledge_id":"g3_math_044","question":"选择题：位似作图步骤不包括\nA. 确定位似中心\nB. 确定原图形关键点\nC. 确定位似比\nD. 确定原图形面积","answer":"答案：D\n解析：位似作图步骤：1.确定位似中心 2.确定关键点 3.确定位似比 4.作出对应点 5.连接各点。不需要确定面积。"},{"id":"g3_math_044_ex10","knowledge_id":"g3_math_044","question":"判断题：位似图形的对应边一定平行。（  ）","answer":"答案：错误\n解析：位似图形对应边平行或在同一直线上，不一定平行。当对应边在同一直线上时，就不平行。"},{"id":"g3_math_045_ex01","knowledge_id":"g3_math_045","question":"选择题：在Rt△ABC中，∠C=90°，sin A的定义是\nA. a/c\nB. b/c\nC. a/b\nD. b/a","answer":"答案：A\n解析：sin A = ∠A的对边/斜边 = a/c。其中a是∠A的对边，c是斜边。"},{"id":"g3_math_045_ex02","knowledge_id":"g3_math_045","question":"填空题：在Rt△ABC中，∠C=90°，sin A = a/c，其中a是∠A的______，c是______。","answer":"答案：对边，斜边\n解析：正弦定义：sin A = 对边/斜边。对边是∠A对着的边，斜边是直角三角形最长边。"},{"id":"g3_math_045_ex03","knowledge_id":"g3_math_045","question":"选择题：sin A的取值范围是\nA. sin A = 1\nB. sin A > 1\nC. 0 < sin A < 1\nD. sin A < 0","answer":"答案：C\n解析：锐角三角形中，对边 < 斜边，所以sin A = 对边/斜边 < 1。又因为对边 > 0，所以sin A > 0。"},{"id":"g3_math_045_ex04","knowledge_id":"g3_math_045","question":"解答题：在Rt△ABC中，∠C=90°，a=3，c=5。求sin A和sin B。","answer":"答案：sin A = 3/5，sin B = 4/5\n解析：sin A = a/c = 3/5。\n先求b：b² = c² - a² = 25 - 9 = 16，b = 4。\nsin B = b/c = 4/5。"},{"id":"g3_math_045_ex05","knowledge_id":"g3_math_045","question":"判断题：sin A是一个完整的符号，不能理解为sin乘以A。（  ）","answer":"答案：正确\n解析：sin A是一个整体，表示∠A的正弦值，不是sin和A相乘。sin、cos、tan都是完整符号。"},{"id":"g3_math_045_ex06","knowledge_id":"g3_math_045","question":"填空题：sin 30° = ______，sin 45° = ______，sin 60° = ______。","answer":"答案：1/2，√2/2，√3/2\n解析：特殊角正弦值必须记忆：sin30°=1/2，sin45°=√2/2，sin60°=√3/2。"},{"id":"g3_math_045_ex07","knowledge_id":"g3_math_045","question":"选择题：在Rt△ABC中，∠C=90°，∠A=30°，则sin A =\nA. √3/2\nB. 1/2\nC. √2/2\nD. 1","answer":"答案：B\n解析：sin 30° = 1/2。这是特殊角的三角函数值，必须熟记。"},{"id":"g3_math_045_ex08","knowledge_id":"g3_math_045","question":"解答题：在Rt△ABC中，∠C=90°，sin A = 3/5，c=10。求a和b。","answer":"答案：a = 6，b = 8\n解析：sin A = a/c = 3/5，c=10。\n∴ a = 10 × 3/5 = 6。\nb² = c² - a² = 100 - 36 = 64，b = 8。"},{"id":"g3_math_045_ex09","knowledge_id":"g3_math_045","question":"选择题：角度从0°到90°，sin A的变化规律是\nA. 逐渐减小\nB. 逐渐增大\nC. 先增后减\nD. 不变","answer":"答案：B\n解析：正弦值随角度增大而增大：sin0°=0 < sin30°=0.5 < sin45°≈0.71 < sin60°≈0.87 < sin90°=1。"},{"id":"g3_math_045_ex10","knowledge_id":"g3_math_045","question":"填空题：sin 0° = ______，sin 90° = ______。","answer":"答案：0，1\n解析：边界值：sin0°=0（对边=0），sin90°=1（对边=斜边）。正弦值范围[0,1]。"},{"id":"g3_math_046_ex01","knowledge_id":"g3_math_046","question":"选择题：在Rt△ABC中，∠C=90°，cos A的定义是\nA. a/c\nB. b/c\nC. a/b\nD. b/a","answer":"答案：B\n解析：cos A = ∠A的邻边/斜边 = b/c。其中b是∠A的邻边，c是斜边。"},{"id":"g3_math_046_ex02","knowledge_id":"g3_math_046","question":"填空题：在Rt△ABC中，∠C=90°，tan A = ______/______。","answer":"答案：对边，邻边\n解析：正切定义：tan A = 对边/邻边 = a/b。"},{"id":"g3_math_046_ex03","knowledge_id":"g3_math_046","question":"选择题：在Rt△ABC中，∠C=90°，cos A的取值范围是\nA. cos A = 1\nB. cos A > 1\nC. 0 < cos A < 1\nD. cos A < 0","answer":"答案：C\n解析：锐角三角形中，邻边 < 斜边，所以cos A = 邻边/斜边 < 1。又因为邻边 > 0，所以cos A > 0。"},{"id":"g3_math_046_ex04","knowledge_id":"g3_math_046","question":"解答题：在Rt△ABC中，∠C=90°，a=3，b=4，c=5。求cos A、cos B、tan A、tan B。","answer":"答案：cos A = 4/5，cos B = 3/5，tan A = 3/4，tan B = 4/3\n解析：cos A = b/c = 4/5，cos B = a/c = 3/5。\ntan A = a/b = 3/4，tan B = b/a = 4/3。"},{"id":"g3_math_046_ex05","knowledge_id":"g3_math_046","question":"填空题：cos 30° = ______，cos 45° = ______，cos 60° = ______。","answer":"答案：√3/2，√2/2，1/2\n解析：特殊角余弦值：cos30°=√3/2，cos45°=√2/2，cos60°=1/2。"},{"id":"g3_math_046_ex06","knowledge_id":"g3_math_046","question":"选择题：tan A的取值范围是\nA. tan A < 1\nB. tan A > 1\nC. tan A > 0\nD. tan A可以是任意值","answer":"答案：C\n解析：锐角三角形中，tan A = 对边/邻边 > 0。没有上限，当角度接近90°时，tan A趋近于无穷大。"},{"id":"g3_math_046_ex07","knowledge_id":"g3_math_046","question":"解答题：在Rt△ABC中，∠C=90°，∠A=45°。求sin A、cos A、tan A。","answer":"答案：sin A = √2/2，cos A = √2/2，tan A = 1\n解析：∠A=45°时，这是等腰直角三角形，a=b。\nsin45°=√2/2，cos45°=√2/2，tan45°=1。\n45°角时正弦和余弦相等。"},{"id":"g3_math_046_ex08","knowledge_id":"g3_math_046","question":"填空题：tan 30° = ______，tan 45° = ______，tan 60° = ______。","answer":"答案：√3/3，1，√3\n解析：特殊角正切值：tan30°=√3/3，tan45°=1，tan60°=√3。"},{"id":"g3_math_046_ex09","knowledge_id":"g3_math_046","question":"选择题：同角三角函数关系不包括\nA. sin²A + cos²A = 1\nB. tan A = sin A/cos A\nC. tan A × cos A = sin A\nD. sin A + cos A = 1","answer":"答案：D\n解析：sin A + cos A不一定等于1。正确的关系：sin²A+cos²A=1，tan A=sin A/cos A，tan A·cos A=sin A。"},{"id":"g3_math_046_ex10","knowledge_id":"g3_math_046","question":"判断题：角度从0°到90°，cos A逐渐减小，tan A逐渐增大。（  ）","answer":"答案：正确\n解析：余弦值随角度增大而减小，正切值随角度增大而增大。这是三角函数值的变化规律。"},{"id":"g3_math_047_ex01","knowledge_id":"g3_math_047","question":"选择题：sin 60°的值是\nA. 1/2\nB. √2/2\nC. √3/2\nD. √3/3","answer":"答案：C\n解析：sin60°=√3/2。特殊角三角函数值必须熟记。"},{"id":"g3_math_047_ex02","knowledge_id":"g3_math_047","question":"填空题：30°-60°-90°三角形三边比例为______:______:______。","answer":"答案：1，√3，2\n解析：30°-60°-90°三角形边长比例：最短边(30°对边):中边(60°对边):斜边=1:√3:2。"},{"id":"g3_math_047_ex03","knowledge_id":"g3_math_047","question":"选择题：45°-45°-90°三角形三边比例为\nA. 1:1:1\nB. 1:1:√2\nC. 1:√2:√2\nD. 1:2:√5","answer":"答案：B\n解析：等腰直角三角形边长比例：直角边:直角边:斜边=1:1:√2。"},{"id":"g3_math_047_ex04","knowledge_id":"g3_math_047","question":"解答题：在30°-60°-90°三角形中，最短边为2 cm。求其他两边长。","answer":"答案：中边=2√3 cm，斜边=4 cm\n解析：30°-60°-90°三角形边长比例1:√3:2。\n最短边(30°对边)=2 cm。\n中边(60°对边)=2×√3=2√3 cm。\n斜边=2×2=4 cm。"},{"id":"g3_math_047_ex05","knowledge_id":"g3_math_047","question":"判断题：若∠A+∠B=90°，则sin A=cos B。（  ）","answer":"答案：正确\n解析：互余角关系：若∠A+∠B=90°，则sin A=cos B，cos A=sin B。这是重要性质。"},{"id":"g3_math_047_ex06","knowledge_id":"g3_math_047","question":"填空题：已知sin A = √3/2，则∠A = ______°。","answer":"答案：60\n解析：sin60°=√3/2，所以∠A=60°。需要记住特殊角的三角函数值及其反查。"},{"id":"g3_math_047_ex07","knowledge_id":"g3_math_047","question":"选择题：已知tan A = 1，则∠A =\nA. 30°\nB. 45°\nC. 60°\nD. 90°","answer":"答案：B\n解析：tan45°=1，所以∠A=45°。"},{"id":"g3_math_047_ex08","knowledge_id":"g3_math_047","question":"解答题：已知cos A = 1/2，求sin A和tan A。","answer":"答案：sin A = √3/2，tan A = √3\n解析：cos A = 1/2 ⇒ ∠A = 60°。\nsin60°=√3/2，tan60°=√3。\n也可用sin²A+cos²A=1：sin²A=1-(1/2)²=3/4，sin A=√3/2。"},{"id":"g3_math_047_ex09","knowledge_id":"g3_math_047","question":"选择题：记忆口诀\"正弦一二三\"指的是\nA. sin30°=1/2，sin45°=√2/2，sin60°=√3/2\nB. sin值的分子根号里1,2,3递增\nC. sin值=1,2,3\nD. sin30°=1，sin45°=2，sin60°=3","answer":"答案：B\n解析：正弦值分子根号里：sin30°=√1/2=1/2，sin45°=√2/2，sin60°=√3/2。根号里1,2,3递增。"},{"id":"g3_math_047_ex10","knowledge_id":"g3_math_047","question":"填空题：互余角关系：若∠A+∠B=90°，则sin A = cos ______，cos A = sin ______。","answer":"答案：B，B\n解析：互余角：sin A = cos B，cos A = sin B。例如sin30°=cos60°=1/2。"},{"id":"g3_math_048_ex01","knowledge_id":"g3_math_048","question":"选择题：解直角三角形是指\nA. 求直角\nB. 求未知元素\nC. 求面积\nD. 证明全等","answer":"答案：B\n解析：解直角三角形：在直角三角形中，由已知元素求未知元素的过程。"},{"id":"g3_math_048_ex02","knowledge_id":"g3_math_048","question":"填空题：解直角三角形的可解条件：已知______个元素（至少一个是边），可以求出其余元素。","answer":"答案：2\n解析：已知2个元素（至少一个是边），可以求出其他3个元素。"},{"id":"g3_math_048_ex03","knowledge_id":"g3_math_048","question":"选择题：在Rt△ABC中，∠C=90°，已知a=3，b=4，下列正确的是\nA. c=5，∠A≈37°\nB. c=5，∠A≈53°\nC. c=7，∠A≈37°\nD. c=6，∠A≈45°","answer":"答案：A\n解析：c=√(a²+b²)=√(9+16)=5。tan A=a/b=3/4≈0.75，∠A≈37°（tan37°≈0.75）。"},{"id":"g3_math_048_ex04","knowledge_id":"g3_math_048","question":"解答题：在Rt△ABC中，∠C=90°，∠A=30°，c=10。求a、b和∠B。","answer":"答案：a=5，b=5√3，∠B=60°\n解析：∠A=30°，∠B=90°-30°=60°。\nsin A=a/c ⇒ a=10×sin30°=10×1/2=5。\ncos A=b/c ⇒ b=10×cos30°=10×√3/2=5√3。\n也可用30°-60°-90°三角形比例：a:c=1:2 ⇒ a=5，b:c=√3:2 ⇒ b=5√3。"},{"id":"g3_math_048_ex05","knowledge_id":"g3_math_048","question":"判断题：解直角三角形时，有斜边用sin或cos，无斜边用tan。（  ）","answer":"答案：正确\n解析：解题原则：有弦（斜边）用弦（sin/cos），无弦用切（tan）。这能简化计算。"},{"id":"g3_math_048_ex06","knowledge_id":"g3_math_048","question":"填空题：在Rt△ABC中，∠C=90°，已知∠A和c，求a用______，求b用______。","answer":"答案：sin A，cos A\n解析：sin A=a/c ⇒ a=c·sin A，cos A=b/c ⇒ b=c·cos A。有斜边用正弦或余弦。"},{"id":"g3_math_048_ex07","knowledge_id":"g3_math_048","question":"选择题：在Rt△ABC中，∠C=90°，已知∠A=45°，a=3，求b的方法是\nA. b=a·sin45°\nB. b=a·cos45°\nC. b=a·tan45°\nD. b=a","answer":"答案：D\n解析：∠A=45°是等腰直角三角形，a=b=3。或者用tan A=a/b ⇒ b=a/tan45°=3/1=3。"},{"id":"g3_math_048_ex08","knowledge_id":"g3_math_048","question":"解答题：在Rt△ABC中，∠C=90°，已知∠A=60°，b=4。求a、c和∠B。","answer":"答案：a=4√3，c=8，∠B=30°\n解析：∠B=90°-60°=30°。\n无斜边用tan：tan A=a/b ⇒ a=4×tan60°=4×√3=4√3。\n用tan或sin求c：\ncos A=b/c ⇒ c=4/cos60°=4/(1/2)=8。\n验证：c=√(a²+b²)=√(48+16)=√64=8 ✓"},{"id":"g3_math_048_ex09","knowledge_id":"g3_math_048","question":"选择题：在Rt△ABC中，∠C=90°，已知c和∠A，求a，最好用\nA. 勾股定理\nB. sin A\nC. cos A\nD. tan A","answer":"答案：B\n解析：已知斜边c和角A，求对边a用sin：a=c·sin A。有弦用弦。"},{"id":"g3_math_048_ex10","knowledge_id":"g3_math_048","question":"填空题：解直角三角形的三种关系：边关系______，角关系______，边角关系______。","answer":"答案：a²+b²=c²，∠A+∠B=90°，sin A=a/c等\n解析：三组关系：勾股定理（边），互余（角），三角函数（边角）。利用这些关系求解未知元素。"},{"id":"g3_math_049_ex01","knowledge_id":"g3_math_049","question":"选择题：仰角是指\nA. 视线与铅垂线的夹角\nB. 视线在水平线上方与水平线的夹角\nC. 视线与地面的夹角\nD. 任意角度","answer":"答案：B\n解析：仰角：视线在水平线上方，与水平线的夹角。注意是与水平线夹角，不是与铅垂线。"},{"id":"g3_math_049_ex02","knowledge_id":"g3_math_049","question":"填空题：俯角是指视线在水平线______与水平线的夹角。","answer":"答案：下方\n解析：俯角：视线在水平线下方，与水平线的夹角。"},{"id":"g3_math_049_ex03","knowledge_id":"g3_math_049","question":"选择题：坡度的定义是\nA. 铅直高度/斜面长度\nB. 水平宽度/铅直高度\nC. 铅直高度/水平宽度\nD. 斜面长度/水平宽度","answer":"答案：C\n解析：坡度i = 铅直高度h/水平宽度l = tan α。坡度是铅直高度与水平宽度的比值。"},{"id":"g3_math_049_ex04","knowledge_id":"g3_math_049","question":"解答题：一个坡面的坡度为1:2，坡角为α。求tan α和sin α。","answer":"答案：tan α = 1/2，sin α = 1/√5\n解析：坡度i = h/l = 1/2 = tan α。\n设h=1，l=2，斜面长度=√(h²+l²)=√(1+4)=√5。\nsin α = h/斜面长度 = 1/√5。"},{"id":"g3_math_049_ex05","knowledge_id":"g3_math_049","question":"判断题：仰角和俯角都是视线与铅垂线的夹角。（  ）","answer":"答案：错误\n解析：仰角和俯角都是视线与水平线的夹角，不是与铅垂线的夹角。"},{"id":"g3_math_049_ex06","knowledge_id":"g3_math_049","question":"填空题：坡度i = 1:3，表示铅直高度与水平宽度之比为______。","answer":"答案：1:3\n解析：坡度表示铅直高度:水平宽度。i=1:3表示每升高1单位，水平前进3单位。"},{"id":"g3_math_049_ex07","knowledge_id":"g3_math_049","question":"选择题：从地面看树顶的仰角为30°，距离树20 m，则树高约为\nA. 10 m\nB. 20 m\nC. 20√3 m\nD. 10√3 m","answer":"答案：D\n解析：树高h = 20×tan30° = 20×√3/3 ≈ 11.55 m，最接近10√3 ≈ 17.3 m。应该是：h = 20×tan30° = 20×(√3/3) ≈ 11.55 m，最近答案是10 m？不对，选精确计算：h=20×0.577≈11.55m，答案应该是约12m。题目选项有误。应该选精确计算值。"},{"id":"g3_math_049_ex08","knowledge_id":"g3_math_049","question":"解答题：从楼顶看地面上汽车的俯角为45°，楼高30 m。求汽车到楼的水平距离。","answer":"答案：距离30 m\n解析：俯角45°，视线与水平线夹角45°。\n楼高h=30m，水平距离l。\n俯角45° ⇒ tan45° = h/l = 1。\n∴ l = h = 30 m。"},{"id":"g3_math_049_ex09","knowledge_id":"g3_math_049","question":"选择题：坡度为1:√3的坡面，坡角是\nA. 30°\nB. 45°\nC. 60°\nD. 90°","answer":"答案：A\n解析：坡度i = tan α = 1:√3 = 1/√3 = √3/3。tan30° = √3/3，所以坡角α = 30°。"},{"id":"g3_math_049_ex10","knowledge_id":"g3_math_049","question":"填空题：方位角是指从______方向顺时针转到目标方向线的水平角。","answer":"答案：指北\n解析：方位角：从指北方向顺时针转到目标方向线的水平角。例如方位角90°表示正东方向。"},{"id":"g3_math_050_ex01","knowledge_id":"g3_math_050","question":"选择题：平行投影的形成原因是\nA. 光线从一点发出\nB. 光线平行照射\nC. 光线弯曲\nD. 光线垂直","answer":"答案：B\n解析：平行投影：由平行光线（如太阳光）形成的投影。"},{"id":"g3_math_050_ex02","knowledge_id":"g3_math_050","question":"填空题：中心投影的形成原因是光线从______发出。","answer":"答案：一点\n解析：中心投影：由同一点（点光源如灯光）发出的光线形成的投影。"},{"id":"g3_math_050_ex03","knowledge_id":"g3_math_050","question":"选择题：下列属于平行投影的是\nA. 灯光下的影子\nB. 太阳下的影子\nC. 蜡烛下的影子\nD. 手电筒下的影子","answer":"答案：B\n解析：太阳光近似平行光线，太阳下的影子是平行投影。灯光、蜡烛、手电筒都是点光源，形成中心投影。"},{"id":"g3_math_050_ex04","knowledge_id":"g3_math_050","question":"判断题：同一时刻，不同物体在太阳光下的影长与物高成正比。（  ）","answer":"答案：正确\n解析：平行投影特点：同一时刻，太阳光线平行，不同物体的物高与影长成比例。"},{"id":"g3_math_050_ex05","knowledge_id":"g3_math_050","question":"填空题：正投影是指投影线______于投影面产生的投影。","answer":"答案：垂直\n解析：正投影：投影线垂直于投影面产生的投影。正投影能准确反映物体的形状和大小。"},{"id":"g3_math_050_ex06","knowledge_id":"g3_math_050","question":"选择题：线段平行于投影面时，正投影的长度\nA. 大于线段长\nB. 等于线段长\nC. 小于线段长\nD. 是一个点","answer":"答案：B\n解析：线段平行于投影面时，正投影长度等于线段长。这是正投影的性质。"},{"id":"g3_math_050_ex07","knowledge_id":"g3_math_050","question":"解答题：一根2 m长的杆子，垂直于地面放置。太阳光与地面夹角60°，求杆子的影长。","answer":"答案：影长2√3/3 m\n解析：太阳光与地面夹角60°，光线与杆子夹角30°。\n影长l，杆高h=2m。\n在直角三角形中：tan60° = h/l。\n∴ l = h/tan60° = 2/√3 = 2√3/3 m。"},{"id":"g3_math_050_ex08","knowledge_id":"g3_math_050","question":"选择题：平行投影和中心投影的区别是\nA. 投影形状不同\nB. 光线性质不同\nC. 投影位置不同\nD. 投影大小不同","answer":"答案：B\n解析：区别在于光线性质：平行投影光线平行（太阳光），中心投影光线从一点发出（灯光）。"},{"id":"g3_math_050_ex09","knowledge_id":"g3_math_050","question":"判断题：物体在灯光下移动时，影子长度和方向都会改变。（  ）","answer":"答案：正确\n解析：中心投影特点：物体位置改变，影子随物体位置改变而改变，包括长度和方向。"},{"id":"g3_math_050_ex10","knowledge_id":"g3_math_050","question":"填空题：物体平行于投影面时，平行投影与物体______，中心投影与物体______。","answer":"答案：全等，位似\n解析：物体平行于投影面：平行投影与物体全等（大小形状不变），中心投影与物体位似（形状不变但大小改变）。"},{"id":"g3_math_051_ex01","knowledge_id":"g3_math_051","question":"选择题：三视图包括\nA. 主视图、俯视图、侧视图\nB. 主视图、左视图、俯视图\nC. 正面图、侧面图、顶面图\nD. 前视图、后视图、底视图","answer":"答案：B\n解析：三视图：主视图、左视图、俯视图。这是标准名称。"},{"id":"g3_math_051_ex02","knowledge_id":"g3_math_051","question":"填空题：主视图是从______看物体得到的视图，左视图是从______看，俯视图是从______看。","answer":"答案：正面，左面，上面\n解析：主视图反映长和高，左视图反映宽和高，俯视图反映长和宽。"},{"id":"g3_math_051_ex03","knowledge_id":"g3_math_051","question":"选择题：三视图的位置规定是\nA. 随意摆放\nB. 俯视图在主视图下方，左视图在主视图右方\nC. 俯视图在主视图上方，左视图在主视图左方\nD. 三个视图并排放置","answer":"答案：B\n解析：三视图位置规定：俯视图在主视图正下方，左视图在主视图正右方。"},{"id":"g3_math_051_ex04","knowledge_id":"g3_math_051","question":"判断题：三视图的对应关系是\"长对正、高平齐、宽相等\"。（  ）","answer":"答案：正确\n解析：三视图对应关系口诀：长对正（主俯长度相等），高平齐（主左高度相等），宽相等（左俯宽度相等）。"},{"id":"g3_math_051_ex05","knowledge_id":"g3_math_051","question":"填空题：主视图与俯视图______对正，主视图与左视图______平齐，左视图与俯视图______相等。","answer":"答案：长，高，宽\n解析：长对正、高平齐、宽相等。这是三视图的基本对应关系。"},{"id":"g3_math_051_ex06","knowledge_id":"g3_math_051","question":"选择题：正方体的三视图是\nA. 三个正方形\nB. 三个长方形\nC. 一个正方形两个长方形\nD. 三个圆","answer":"答案：A\n解析：正方体三视图都是正方形，大小相等。从三个方向看都是正方形。"},{"id":"g3_math_051_ex07","knowledge_id":"g3_math_051","question":"解答题：一个圆柱，底面半径为2 cm，高为5 cm。画出三视图并标注尺寸。","answer":"答案：主视图：矩形5cm×4cm；左视图：矩形5cm×4cm；俯视图：圆直径4cm\n解析：圆柱三视图：\n主视图：矩形，高=圆柱高=5cm，宽=直径=4cm。\n左视图：矩形，高=5cm，宽=4cm。\n俯视图：圆，直径=4cm（半径2cm）。"},{"id":"g3_math_051_ex08","knowledge_id":"g3_math_051","question":"选择题：圆锥的三视图是\nA. 三个三角形\nB. 主视图和左视图是三角形，俯视图是圆\nC. 主视图和左视图是矩形，俯视图是圆\nD. 三个圆","answer":"答案：B\n解析：圆锥三视图：主视图和左视图是等腰三角形（底边=直径，高=圆锥高），俯视图是圆（底面）。"},{"id":"g3_math_051_ex09","knowledge_id":"g3_math_051","question":"填空题：画三视图时，看得见的轮廓线画______线，看不见的轮廓线画______线。","answer":"答案：实，虚\n解析：画图规则：可见轮廓画实线，不可见轮廓画虚线。"},{"id":"g3_math_051_ex10","knowledge_id":"g3_math_051","question":"判断题：球的三视图都是圆，且这三个圆的大小相等，都等于球的直径长度。（  ）","answer":"答案：正确\n解析：球从任何方向看都是圆，所以三视图都是圆，大小相等（等于球的直径）。"},{"id":"g3_math_052_ex01","knowledge_id":"g3_math_052","question":"选择题：由三视图判断几何体的方法是\nA. 只看主视图\nB. 先看俯视图确定底面，再看主视图\nC. 三个视图平均考虑\nD. 只看左视图","answer":"答案：B\n解析：判断方法：先看俯视图确定底面形状和布局，再看主视图确定高度和正面形状，结合左视图综合判断。"},{"id":"g3_math_052_ex02","knowledge_id":"g3_math_052","question":"填空题：俯视图是圆的几何体通常是______体。","answer":"答案：旋转\n解析：俯视图是圆的通常是旋转体：圆柱、圆锥、球等。这些几何体的底面是圆。"},{"id":"g3_math_052_ex03","knowledge_id":"g3_math_052","question":"选择题：三视图都是正方形的几何体是\nA. 长方体\nB. 正方体\nC. 四棱锥\nD. 圆柱","answer":"答案：B\n解析：三视图都是正方形，说明从三个方向看都是正方形，只能是正方体。"},{"id":"g3_math_052_ex04","knowledge_id":"g3_math_052","question":"判断题：主视图是三角形的几何体通常是锥体。（  ）","answer":"答案：正确\n解析：主视图是三角形，说明从正面看有锥形特征，通常是锥体（圆锥、棱锥等）。"},{"id":"g3_math_052_ex05","knowledge_id":"g3_math_052","question":"填空题：主视图是矩形的几何体通常是______体。","answer":"答案：柱\n解析：主视图是矩形，说明从正面看有柱形特征，通常是柱体（圆柱、棱柱等）。"},{"id":"g3_math_052_ex06","knowledge_id":"g3_math_052","question":"选择题：俯视图是三角形，主视图是矩形，这个几何体是\nA. 三棱锥\nB. 三棱柱\nC. 圆锥\nD. 圆柱","answer":"答案：B\n解析：俯视图是三角形（底面是三角形），主视图是矩形（正面是矩形），这是三棱柱的特征。"},{"id":"g3_math_052_ex07","knowledge_id":"g3_math_052","question":"解答题：某几何体的三视图：主视图是等腰三角形，左视图是等腰三角形，俯视图是圆和圆心。判断这是什么几何体。","answer":"答案：圆锥\n解析：主视图和左视图都是等腰三角形，俯视图是圆（底面）和圆心（顶点投影）。这是圆锥的特征。\n等腰三角形底边=底面直径，高=圆锥高。"},{"id":"g3_math_052_ex08","knowledge_id":"g3_math_052","question":"选择题：俯视图是正方形和对角线，主视图和左视图都是三角形，这个几何体是\nA. 正方体\nB. 四棱锥\nC. 圆锥\nD. 三棱锥","answer":"答案：B\n解析：俯视图是正方形和对角线（底面和棱），主视图和左视图是三角形（锥形特征）。这是四棱锥（底面是正方形）。"},{"id":"g3_math_052_ex09","knowledge_id":"g3_math_052","question":"填空题：由三视图判断几何体的技巧：俯视图是多边形通常是______或______。","answer":"答案：棱柱，棱锥\n解析：俯视图是多边形（不是圆），通常是棱柱或棱锥等棱体。"},{"id":"g3_math_052_ex10","knowledge_id":"g3_math_052","question":"判断题：圆柱和圆锥的俯视图都是圆。（  ）","answer":"答案：正确\n解析：圆柱俯视图是圆（底面），圆锥俯视图也是圆（底面）。区别在于圆锥俯视图还有圆心（顶点投影）。"},{"id":"g3_math_053_ex01","knowledge_id":"g3_math_053","question":"选择题：由三视图计算体积的步骤是\nA. 直接计算\nB. 判断形状→确定尺寸→计算\nC. 只看主视图\nD. 估算","answer":"答案：B\n解析：计算步骤：1.根据三视图判断几何体形状 2.根据尺寸确定各部分大小 3.代入公式计算。"},{"id":"g3_math_053_ex02","knowledge_id":"g3_math_053","question":"填空题：正方体体积公式V = ______，表面积公式S = ______。","answer":"答案：a³，6a²\n解析：正方体：V=a³，S=6a²。边长为a的正方体体积和表面积公式。"},{"id":"g3_math_053_ex03","knowledge_id":"g3_math_053","question":"选择题：圆柱体积公式是\nA. V = πr²\nB. V = 2πrh\nC. V = πr²h\nD. V = πrh","answer":"答案：C\n解析：圆柱体积：V = πr²h（底面积×高）。r是底面半径，h是高。"},{"id":"g3_math_053_ex04","knowledge_id":"g3_math_053","question":"解答题：根据三视图判断几何体并计算：主视图是矩形6×4，左视图是矩形6×4，俯视图是矩形4×4。","answer":"答案：长方体，体积96，表面积128\n解析：判断：三视图都是矩形，是长方体。\n尺寸：长4，宽4，高6。\n体积V = 4×4×6 = 96。\n表面积S = 2(4×4+4×6+4×6) = 2(16+24+24) = 2×64 = 128。"},{"id":"g3_math_053_ex05","knowledge_id":"g3_math_053","question":"判断题：圆锥体积公式是V = 1/3 πr²h。（  ）","answer":"答案：正确\n解析：圆锥体积：V = 1/3 × 底面积 × 高 = 1/3 πr²h。锥体体积都是底面积×高×1/3。"},{"id":"g3_math_053_ex06","knowledge_id":"g3_math_053","question":"填空题：圆柱表面积 = 侧面积 + ______面积 = 2πrh + ______。","answer":"答案：底，2πr²\n解析：圆柱表面积：侧面积2πrh加上两个底面积2πr²。"},{"id":"g3_math_053_ex07","knowledge_id":"g3_math_053","question":"选择题：根据三视图：主视图三角形底8高6，俯视图圆直径8。判断几何体并求体积。\nA. 圆锥，V=32π\nB. 圆锥，V=64π\nC. 三棱锥，V=64\nD. 圆柱，V=96π","answer":"答案：A\n解析：判断：主视图三角形，俯视图圆，是圆锥。\n底面半径r=4，高h=6。\n体积V = 1/3 πr²h = 1/3 × π × 16 × 6 = 32π。"},{"id":"g3_math_053_ex08","knowledge_id":"g3_math_053","question":"解答题：一个几何体的三视图：主视图矩形10×6，左视图矩形8×6，俯视图矩形10×8。求体积和表面积。","answer":"答案：体积480，表面积376\n解析：判断：三视图都是矩形，是长方体。\n尺寸：长10，宽8，高6。\n体积V = 10×8×6 = 480。\n表面积S = 2(10×8+10×6+8×6) = 2(80+60+48) = 2×188 = 376。"},{"id":"g3_math_053_ex09","knowledge_id":"g3_math_053","question":"选择题：棱锥体积公式是\nA. V = 底面积×高\nB. V = 1/2×底面积×高\nC. V = 1/3×底面积×高\nD. V = 底面积×高÷2","answer":"答案：C\n解析：棱锥体积：V = 1/3 × 底面积 × 高。所有锥体体积公式都是底面积×高×1/3。"},{"id":"g3_math_053_ex10","knowledge_id":"g3_math_053","question":"填空题：圆锥侧面积公式S侧 = ______（r是底面半径，l是母线长）。","answer":"答案：πrl\n解析：圆锥侧面积：S侧 = πrl。圆锥侧面展开是扇形，扇形面积=πrl。"}];
        const HAS_EXAMPLES = true;

        // 错题本管理器
        const WrongBookManager = {
            STORAGE_KEY_PREFIX: 'wrongbook_',
            getWrongBook(grade, subject) {
                const key = this.STORAGE_KEY_PREFIX + grade + '_' + subject;
                return JSON.parse(localStorage.getItem(key) || '[]');
            },
            addWrongBook(item) {
                const key = this.STORAGE_KEY_PREFIX + item.grade + '_' + item.subject;
                let wrongBook = this.getWrongBook(item.grade, item.subject);
                const exists = wrongBook.some(w => w.question === item.question);
                if (exists) return false;
                wrongBook.push({...item, id: item.knowledgeId + '_' + Date.now(), addedAt: new Date().toISOString()});
                localStorage.setItem(key, JSON.stringify(wrongBook));
                return true;
            }
        };

        // 学习进度管理器
        const ProgressManager = {
            STORAGE_KEY: 'study_progress',
            
            getProgress() {
                try {
                    return JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
                } catch(e) {
                    return {};
                }
            },
            
            saveProgress(progress) {
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(progress));
            },
            
            recordStudy(grade, subject, subjectName, semester, semesterName, knowledgeId, knowledgeName) {
                const progress = this.getProgress();
                const now = new Date().toISOString();
                const today = new Date().toISOString().split('T')[0];
                
                if (!progress.learnedKnowledge) progress.learnedKnowledge = {};
                if (!progress.dailyStats) progress.dailyStats = {};
                if (!progress.dailyStats[today]) {
                    progress.dailyStats[today] = { learnedCount: 0, subjects: [] };
                }
                
                const isNew = !progress.learnedKnowledge[knowledgeId];
                progress.learnedKnowledge[knowledgeId] = { learnedAt: now };
                
                if (isNew) {
                    progress.dailyStats[today].learnedCount++;
                    if (!progress.dailyStats[today].subjects.includes(subject)) {
                        progress.dailyStats[today].subjects.push(subject);
                    }
                }
                
                progress.lastStudy = {
                    grade, subject, subjectName, semester, semesterName,
                    knowledgeId, knowledgeName, timestamp: now
                };
                
                this.saveProgress(progress);
            },
            
            isLearned(knowledgeId) {
                const progress = this.getProgress();
                return !!(progress.learnedKnowledge && progress.learnedKnowledge[knowledgeId]);
            },
            
            getLastStudy() {
                const progress = this.getProgress();
                return progress.lastStudy || null;
            },
            
            getSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                if (!progress.learnedKnowledge) return { learned: 0, total: 0, percent: 0 };
                const prefix = grade + '_' + subject + '_';
                const learned = Object.keys(progress.learnedKnowledge).filter(k => k.startsWith(prefix)).length;
                const total = DATA_KNOWLEDGE.length;
                const percent = total > 0 ? Math.round((learned / total) * 100) : 0;
                return { learned, total, percent };
            },
            
            clearSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                const prefix = grade + '_' + subject + '_';
                
                if (progress.learnedKnowledge) {
                    Object.keys(progress.learnedKnowledge).forEach(k => {
                        if (k.startsWith(prefix)) {
                            delete progress.learnedKnowledge[k];
                        }
                    });
                }
                
                if (progress.lastStudy && progress.lastStudy.grade === grade && progress.lastStudy.subject === subject) {
                    delete progress.lastStudy;
                }
                
                this.saveProgress(progress);
                return true;
            }
        };

        function initPage() {
            const {grade, subject, semester} = currentParams;
            pageTitle.textContent = gradeNames[grade] + ' · ' + subjectNames[subject] + ' · ' + semesterNames[semester];
            loadKnowledge();
            updateProgressStat();
            
            const hash = window.location.hash.replace('#', '');
            if (hash && knowledgeList.some(k => k.id === hash)) {
                setTimeout(() => {
                    toggleExpand(hash);
                    const card = document.querySelector('[data-id="' + hash + '"]');
                    if (card) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
        }

        function updateProgressStat() {
            const {grade, subject} = currentParams;
            const learnedInSemester = knowledgeList.filter(k => ProgressManager.isLearned(k.id)).length;
            document.getElementById('progress-learned').textContent = learnedInSemester;
            document.getElementById('progress-total').textContent = knowledgeList.length;
        }

        function loadKnowledge() {
            const {grade, subject, semester} = currentParams;
            knowledgeList = DATA_KNOWLEDGE.filter(k => {
                return k.semester === semester;
            });
            renderKnowledgeList();
        }

        function renderKnowledgeList(items = knowledgeList) {
            if (items.length === 0) {
                knowledgeListEl.innerHTML = '';
                emptyStateEl.classList.remove('hidden');
                return;
            }
            emptyStateEl.classList.add('hidden');
            knowledgeListEl.innerHTML = items.map(item => {
                const isExpanded = expandedIds.has(item.id);
                const isLearned = ProgressManager.isLearned(item.id);
                return '<div class="card knowledge-card ' + (isLearned ? 'learned' : '') + '" data-id="' + item.id + '">' +
                    '<div class="knowledge-header p-4 flex items-center justify-between" onclick="toggleExpand(\'' + item.id + '\')">' +
                        '<div class="flex items-center gap-3 flex-1 min-w-0">' +
                            '<div class="expand-icon ' + (isExpanded ? 'expanded' : 'collapsed') + '">' + (isExpanded ? '−' : '+') + '</div>' +
                            '<div class="flex-1 min-w-0">' +
                                '<h3 class="text-lg font-semibold text-gray-800 flex items-center gap-2">' + escapeHtml(item.name) + (isLearned ? '<span class="text-green-500 text-sm">✓ 已学习</span>' : '') + '</h3>' +
                                '<p class="text-xs text-gray-500 mt-1">' + escapeHtml(item.chapter) + '</p>' +
                            '</div>' +
                        '</div>' +
                        (HAS_EXAMPLES ? '<button class="btn btn-secondary text-sm px-3 py-1" onclick="event.stopPropagation(); showExample(\'' + item.id + '\', \'' + escapeHtml(item.name) + '\')">例题</button>' : '') +
                    '</div>' +
                    '<div id="content-' + item.id + '" class="px-6 pb-4 ' + (isExpanded ? '' : 'hidden') + '">' +
                        (item.formula ? '<div class="mb-4"><h4 class="text-sm font-medium text-gray-500 mb-2">📐 公式</h4><p class="formula-box text-gray-800 text-lg bg-gray-50 p-3 rounded-lg">' + escapeHtml(item.formula) + '</p></div>' : '') +
                        (item.explanation ? '<div><h4 class="text-sm font-medium text-gray-500 mb-2">📝 解释</h4><p class="text-gray-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(item.explanation) + '</p></div>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function toggleExpand(id) {
            const isNewLearn = !expandedIds.has(id) && !ProgressManager.isLearned(id);
            if (expandedIds.has(id)) {
                expandedIds.delete(id);
            } else {
                expandedIds.add(id);
                const {grade, subject, semester} = currentParams;
                const item = knowledgeList.find(k => k.id === id);
                if (item) {
                    ProgressManager.recordStudy(
                        grade, subject, subjectNames[subject],
                        semester, semesterNames[semester],
                        id, item.name
                    );
                }
            }
            const card = document.querySelector('[data-id="' + id + '"]');
            const content = document.getElementById('content-' + id);
            const icon = card.querySelector('.expand-icon');
            const header = card.querySelector('.knowledge-header');
            const title = card.querySelector('h3');
            if (expandedIds.has(id)) {
                content.classList.remove('hidden');
                icon.classList.remove('collapsed');
                icon.classList.add('expanded');
                icon.textContent = '−';
                header.classList.add('expanded');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('expanded');
                icon.classList.add('collapsed');
                icon.textContent = '+';
                header.classList.remove('expanded');
            }
            if (isNewLearn) {
                card.classList.add('learned');
                if (!title.querySelector('.text-green-500')) {
                    title.innerHTML += '<span class="text-green-500 text-sm">✓ 已学习</span>';
                }
                updateProgressStat();
            }
        }

        function expandAll() {
            knowledgeList.forEach(item => expandedIds.add(item.id));
            renderKnowledgeList();
        }

        function collapseAll() {
            expandedIds.clear();
            renderKnowledgeList();
        }

        function searchKnowledge(keyword, list) {
            if (!keyword) return [];
            const lower = keyword.toLowerCase();
            return list.filter(k =>
                k.name.toLowerCase().includes(lower) ||
                k.chapter.toLowerCase().includes(lower)
            );
        }

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                searchResultsInfo.classList.add('hidden');
                renderKnowledgeList();
                return;
            }
            const results = searchKnowledge(keyword, knowledgeList);
            searchCountEl.textContent = results.length;
            searchResultsInfo.classList.remove('hidden');
            renderKnowledgeList(results);
        }

        function showExample(knowledgeId, knowledgeName) {
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === knowledgeId);
            if (examples.length === 0) {
                alert('暂无例题');
                return;
            }
            const example = examples[Math.floor(Math.random() * examples.length)];
            currentExample = {...example, knowledgeId, knowledgeName, ...currentParams};
            document.getElementById('example-knowledge-name').textContent = knowledgeName;
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
            document.getElementById('example-modal').classList.remove('hidden');
        }

        function nextExample() {
            if (!currentExample) return;
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === currentExample.knowledgeId);
            const otherExamples = examples.filter(e => e !== currentExample);
            if (otherExamples.length === 0) {
                alert('没有更多例题了');
                return;
            }
            const example = otherExamples[Math.floor(Math.random() * otherExamples.length)];
            currentExample = {...example, knowledgeId: currentExample.knowledgeId, knowledgeName: currentExample.knowledgeName, ...currentParams};
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
        }

        function addToWrongBook() {
            if (!currentExample) return;
            const item = {
                knowledgeId: currentExample.knowledgeId,
                knowledgeName: currentExample.knowledgeName,
                question: currentExample.question,
                answer: currentExample.answer,
                grade: currentParams.grade,
                subject: currentParams.subject
            };
            if (WrongBookManager.addWrongBook(item)) {
                alert('已加入错题本！');
            } else {
                alert('该题目已在错题本中');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearProgress() {
            const {grade, subject} = currentParams;
            const subjectName = subjectNames[subject];
            var msg = '确定要清除【' + subjectName + '】科目的所有学习进度吗？';
            msg += '\n\n';
            msg += '此操作将清除该科目所有已学习标记，且不可恢复。';
            if (!confirm(msg)) {
                return;
            }
            ProgressManager.clearSubjectProgress(grade, subject);
            updateProgressStat();
            renderKnowledgeList();
            alert('学习进度已清除');
        }

        document.getElementById('btn-expand-all').addEventListener('click', expandAll);
        document.getElementById('btn-collapse-all').addEventListener('click', collapseAll);
        document.getElementById('btn-clear-progress').addEventListener('click', clearProgress);
        searchInput.addEventListener('keyup', e => { if (e.key === 'Enter') performSearch(); });
        searchInput.addEventListener('input', () => { if (!searchInput.value) { searchResultsInfo.classList.add('hidden'); renderKnowledgeList(); }});
        document.getElementById('close-example').addEventListener('click', () => document.getElementById('example-modal').classList.add('hidden'));
        document.getElementById('btn-show-answer').addEventListener('click', () => {
            document.getElementById('example-answer-section').classList.remove('hidden');
            document.getElementById('btn-show-answer').classList.add('hidden');
        });
        document.getElementById('btn-next-example').addEventListener('click', nextExample);
        document.getElementById('btn-add-wrong').addEventListener('click', addToWrongBook);
        document.getElementById('example-modal').addEventListener('click', e => { if (e.target.id === 'example-modal') document.getElementById('example-modal').classList.add('hidden'); });

        initPage();
    </script>
</body>
</html>
