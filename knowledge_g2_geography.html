    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"id":"g2_geography_u001","chapter":"第一章 从世界看中国","name":"中国的纬度位置","formula":"北纬4°-53°","explanation":"中国领土南北跨纬度约50度，大部分位于北温带，小部分位于热带，没有寒带。这一纬度位置使得中国具备了多种气候类型，为农业发展提供了多样化的自然条件。","semester":"upper"},{"id":"g2_geography_u002","chapter":"第一章 从世界看中国","name":"中国的海陆位置","formula":"亚洲东部、太平洋西岸","explanation":"中国位于亚洲东部，太平洋西岸，是一个海陆兼备的国家。这种位置使得中国既可以发展陆上外交，又便于海上交往，对外开放程度高。","semester":"upper"},{"id":"g2_geography_u003","chapter":"第一章 从世界看中国","name":"中国领土面积","formula":"约960万平方千米","explanation":"中国领土面积约960万平方千米，仅次于俄罗斯和加拿大，居世界第三位。广阔的领土为中国提供了丰富的自然资源和多样的自然环境。","semester":"upper"},{"id":"g2_geography_u004","chapter":"第一章 从世界看中国","name":"中国疆界","formula":"陆界2.2万千米，海岸线1.8万千米","explanation":"中国陆上疆界长达2.2万多千米，与14个国家接壤；大陆海岸线长达1.8万多千米，与6个国家隔海相望。漫长的疆界和海岸线为中国的国防和对外交流提供了重要条件。","semester":"upper"},{"id":"g2_geography_u005","chapter":"第一章 从世界看中国","name":"中国领海与岛屿","formula":"内海和边海470万平方千米，岛屿6500多个","explanation":"中国的内海和边海面积约470万平方千米，主要包括渤海、黄海、东海、南海。沿海分布着6500多个岛屿，其中最大的是台湾岛，其次是海南岛。","semester":"upper"},{"id":"g2_geography_u006","chapter":"第一章 从世界看中国","name":"中国行政区划","formula":"23个省、5个自治区、4个直辖市、2个特别行政区","explanation":"中国共有34个省级行政区，包括23个省、5个自治区（内蒙古、广西、西藏、宁夏、新疆）、4个直辖市（北京、天津、上海、重庆）和2个特别行政区（香港、澳门）。","semester":"upper"},{"id":"g2_geography_u007","chapter":"第一章 从世界看中国","name":"中国人口数量","formula":"约14.4亿（2023年）","explanation":"中国是世界上人口最多的国家，约有14.4亿人。人口众多为中国提供了丰富的劳动力资源和消费市场，但同时也给资源、环境、就业等带来压力。","semester":"upper"},{"id":"g2_geography_u008","chapter":"第一章 从世界看中国","name":"中国人口分布特点","formula":"东多西少，东南沿海人口密集","explanation":"中国人口分布不均，总体特点是东多西少。东部沿海地区人口密集，特别是东南沿海地区；西部内陆地区人口稀少。人口分布与自然条件、经济发展水平密切相关。","semester":"upper"},{"id":"g2_geography_u009","chapter":"第一章 从世界看中国","name":"中国民族构成","formula":"56个民族，汉族占91.1%","explanation":"中国是一个统一的多民族国家，共有56个民族。其中汉族人口最多，约占全国人口的91.1%；其他55个民族统称为少数民族，约占8.9%。","semester":"upper"},{"id":"g2_geography_u010","chapter":"第一章 从世界看中国","name":"中国民族分布特点","formula":"大散居、小聚居、交错杂居","explanation":"中国各民族的分布特点是：大散居、小聚居、交错杂居。少数民族主要分布在西南、西北、东北等边疆地区。汉族主要分布在东部和中部地区。","semester":"upper"},{"id":"g2_geography_u011","chapter":"第一章 从世界看中国","name":"中国民族政策","formula":"民族平等、民族团结、各民族共同繁荣","explanation":"中国实行民族平等、民族团结、各民族共同繁荣的基本政策。在少数民族聚居地区实行民族区域自治制度，保障少数民族的合法权益。","semester":"upper"},{"id":"g2_geography_u012","chapter":"第二章 中国的自然环境","name":"中国地形特点","formula":"地形复杂多样，山区面积广","explanation":"中国地形复杂多样，主要包括山地、高原、平原、盆地、丘陵五种类型。山地、高原、丘陵占全国陆地面积的67%，山区面积广大是中国地形的重要特点。","semester":"upper"},{"id":"g2_geography_u013","chapter":"第二章 中国的自然环境","name":"中国地势特点","formula":"西高东低，呈三级阶梯分布","explanation":"中国地势特点是西高东低，自西向东分为三级阶梯：第一级阶梯是青藏高原，平均海拔4000米以上；第二级阶梯以高原、盆地为主；第三级阶梯主要是平原和丘陵。","semester":"upper"},{"id":"g2_geography_u014","chapter":"第二章 中国的自然环境","name":"四大高原","formula":"青藏高原、内蒙古高原、黄土高原、云贵高原","explanation":"中国有四大高原：青藏高原是世界最高的高原，有'世界屋脊'之称；内蒙古高原是坦荡的高原；黄土高原是世界上黄土覆盖最深厚的地区；云贵高原地面崎岖，石灰岩分布广泛。","semester":"upper"},{"id":"g2_geography_u015","chapter":"第二章 中国的自然环境","name":"四大盆地","formula":"塔里木盆地、准噶尔盆地、柴达木盆地、四川盆地","explanation":"中国有四大盆地：塔里木盆地是中国最大的内陆盆地，沙漠广布；准噶尔盆地纬度较高，多风蚀地貌；柴达木盆地是海拔最高的内陆高原盆地；四川盆地有'紫色盆地'之称，农业发达。","semester":"upper"},{"id":"g2_geography_u016","chapter":"第二章 中国的自然环境","name":"三大平原","formula":"东北平原、华北平原、长江中下游平原","explanation":"中国有三大平原：东北平原是中国最大的平原，以黑土著称；华北平原是由黄河、淮河、海河冲积而成；长江中下游平原有'鱼米之乡'的美誉。","semester":"upper"},{"id":"g2_geography_u017","chapter":"第二章 中国的自然环境","name":"中国气候特点","formula":"气候复杂多样，季风气候显著","explanation":"中国气候复杂多样，主要包括热带季风气候、亚热带季风气候、温带季风气候、温带大陆性气候和高山高原气候。东部地区季风气候显著，具有雨热同期的特点。","semester":"upper"},{"id":"g2_geography_u018","chapter":"第二章 中国的自然环境","name":"温度带划分","formula":"热带、亚热带、暖温带、中温带、寒温带","explanation":"中国根据积温情况划分为五个温度带：热带（北纬23.5°以南）、亚热带（秦岭-淮河以南）、暖温带（华北地区）、中温带（东北和内蒙古大部）、寒温带（黑龙江北部）。","semester":"upper"},{"id":"g2_geography_u019","chapter":"第二章 中国的自然环境","name":"干湿地区划分","formula":"湿润区、半湿润区、半干旱区、干旱区","explanation":"中国根据降水量和蒸发量的关系划分为四个干湿地区：湿润区（年降水量>800mm）、半湿润区（年降水量400-800mm）、半干旱区（年降水量200-400mm）、干旱区（年降水量<200mm）。","semester":"upper"},{"id":"g2_geography_u020","chapter":"第二章 中国的自然环境","name":"中国主要河流","formula":"长江、黄河、珠江、淮河、松花江","explanation":"中国主要的河流包括：长江是中国第一大河，全长6300多千米；黄河是中国第二长河，全长5464千米；珠江是华南地区最大的河流；淮河是重要的地理分界线；松花江是东北地区最大的河流。","semester":"upper"},{"id":"g2_geography_u021","chapter":"第二章 中国的自然环境","name":"中国主要湖泊","formula":"淡水湖：鄱阳湖、洞庭湖、太湖；咸水湖：青海湖、纳木错","explanation":"中国湖泊众多，主要淡水湖有鄱阳湖（中国最大淡水湖）、洞庭湖、太湖等；主要咸水湖有青海湖（中国最大咸水湖）、纳木错等。湖泊是重要的水资源，对生态环境有重要影响。","semester":"upper"},{"id":"g2_geography_u022","chapter":"第二章 中国的自然环境","name":"长江概况","formula":"全长6300余千米，流域面积180万平方千米","explanation":"长江发源于唐古拉山脉各拉丹冬峰，全长6300余千米，是世界第三长河。流域面积180多万平方千米，流经青、藏、川、滇、渝、鄂、湘、赣、皖、苏、沪11个省市区。","semester":"upper"},{"id":"g2_geography_u023","chapter":"第二章 中国的自然环境","name":"长江的开发","formula":"水能宝库、黄金水道","explanation":"长江水能资源丰富，被誉为'水能宝库'，水能蕴藏量占全国的1/3。长江航运价值高，宜昌以下可四季通航，被誉为'黄金水道'，货运量占全国内河航运的70%以上。","semester":"upper"},{"id":"g2_geography_u024","chapter":"第二章 中国的自然环境","name":"长江的治理","formula":"加固堤防、修建水库、治理荆江","explanation":"长江治理的主要措施包括：加固堤防，修建分洪、蓄洪工程；修建水库，如三峡工程；重点治理荆江段，裁弯取直，疏浚河道；同时加强上游地区的水土保持工作。","semester":"upper"},{"id":"g2_geography_u025","chapter":"第二章 中国的自然环境","name":"黄河概况","formula":"全长5464千米，流域面积75万平方千米","explanation":"黄河发源于青藏高原巴颜喀拉山北麓，全长5464千米，是中国第二长河。流域面积约75万平方千米，流经青、川、甘、宁、内蒙古、晋、陕、豫、鲁9个省区。","semester":"upper"},{"id":"g2_geography_u026","chapter":"第二章 中国的自然环境","name":"黄河的贡献","formula":"塑造平原、灌溉平原、丰富水能","explanation":"黄河为中华民族的发展做出了重要贡献：黄河下游冲积形成华北平原；黄河水是北方地区重要的灌溉水源；黄河上游水能资源丰富，建有多座水电站，如龙羊峡、刘家峡等。","semester":"upper"},{"id":"g2_geography_u027","chapter":"第二章 中国的自然环境","name":"黄河的忧患","formula":"地上河、断流、凌汛","explanation":"黄河存在的问题包括：下游形成'地上河'，易决堤改道；中游流经黄土高原，含沙量大；部分河段冬季结冰形成凌汛；近年来出现断流现象，影响下游地区用水。","semester":"upper"},{"id":"g2_geography_u028","chapter":"第二章 中国的自然环境","name":"黄河的治理","formula":"治沙、治水、保持水土","explanation":"黄河治理的关键是治沙和保持水土。主要措施包括：在中游地区退耕还林还草、修建水平梯田；在黄土高原地区开展小流域综合治理；下游加固黄河堤防，疏浚河道，修建分洪工程。","semester":"upper"},{"id":"g2_geography_u029","chapter":"第三章 中国的自然资源","name":"自然资源概念","formula":"在一定的技术条件下，自然界中对人类有用的物质和能量","explanation":"自然资源是指在一定的技术条件下，自然界中对人类有用的物质和能量。按能否再生分类，可分为可再生资源（如土地、水、森林、草原）和非可再生资源（如矿产资源）。","semester":"upper"},{"id":"g2_geography_u030","chapter":"第三章 中国的自然资源","name":"中国自然资源特点","formula":"总量丰富，人均不足","explanation":"中国自然资源总量丰富，许多种自然资源位居世界前列。但由于人口众多，人均资源占有量远低于世界平均水平，人均耕地、淡水、森林面积等均不到世界平均的1/3。","semester":"upper"},{"id":"g2_geography_u031","chapter":"第三章 中国的自然资源","name":"土地资源类型","formula":"耕地、林地、草地、建筑用地","explanation":"中国土地资源按利用方式可分为：耕地（种植农作物）、林地（生长林木）、草地（生长草本植物）、建筑用地（城镇村庄、道路等）以及难以利用的土地（如沙漠、戈壁、冰川等）。","semester":"upper"},{"id":"g2_geography_u032","chapter":"第三章 中国的自然资源","name":"土地资源分布","formula":"耕地：东部季风区；草地：西部内陆；林地：东北、西南","explanation":"中国土地资源分布不均：耕地主要分布在东部季风区的平原和低缓丘陵地区；林地主要分布在东北、西南的天然林区；草地主要分布在西部内陆的高原、山地等干旱半干旱地区。","semester":"upper"},{"id":"g2_geography_u033","chapter":"第三章 中国的自然资源","name":"水资源概念与分布","formula":"多年平均水资源总量2.8万亿立方米，南多北少","explanation":"水资源包括河流水、湖泊水、浅层地下水等。中国多年平均水资源总量约2.8万亿立方米，居世界第六位。但水资源地区分布不均，呈现南多北少的特点，南方水资源占全国的80%以上。","semester":"upper"},{"id":"g2_geography_u034","chapter":"第三章 中国的自然资源","name":"水资源时间分布","formula":"夏秋多、冬春少，年际变化大","explanation":"中国水资源时间分布不均。受季风气候影响，水资源夏秋多、冬春少，且年际变化大。这种时间分布特点容易造成洪涝和干旱灾害，需要修建水库等水利工程进行调节。","semester":"upper"},{"id":"g2_geography_u035","chapter":"第三章 中国的自然资源","name":"解决水资源不足的措施","formula":"跨流域调水、修建水库、节约用水","explanation":"解决中国水资源不足的主要措施包括：建设跨流域调水工程（如南水北调）；修建水库调节水资源时间分配；节约用水，发展节水农业和工业；提高水资源利用效率；保护水资源，防治水污染。","semester":"upper"},{"id":"g2_geography_u036","chapter":"第四章 中国的经济发展","name":"交通运输的重要性","formula":"经济发展的'先行官'","explanation":"交通运输是经济发展的'先行官'，对经济发展起着重要的支撑作用。便利的交通可以促进资源开发、商品流通、地区交流，推动经济发展，提高人民生活水平。","semester":"upper"},{"id":"g2_geography_u037","chapter":"第四章 中国的经济发展","name":"主要铁路干线","formula":"五纵：京哈、京沪、京九、京广、焦柳；三横：京包-包兰、陇海-兰新、沪杭-浙赣-湘黔-贵昆","explanation":"中国铁路网稠密，主要铁路干线包括南北向的'五纵'（京哈、京沪、京九、京广、焦柳）和东西向的'三横'（京包-包兰、陇海-兰新、沪杭-浙赣-湘黔-贵昆）。","semester":"upper"},{"id":"g2_geography_u038","chapter":"第四章 中国的经济发展","name":"南北向铁路干线","formula":"京沪线、京九线、京广线、焦柳线、宝成-成昆线","explanation":"中国主要的南北向铁路干线包括：京沪线（北京-上海）、京九线（北京-九龙）、京广线（北京-广州）、焦柳线（焦作-柳州）、宝成-成昆线（宝鸡-成都-昆明）等。","semester":"upper"},{"id":"g2_geography_u039","chapter":"第四章 中国的经济发展","name":"东西向铁路干线","formula":"京包-包兰线、陇海-兰新线、沪杭-浙赣-湘黔-贵昆线","explanation":"中国主要的东西向铁路干线包括：京包-包兰线（北京-包头-兰州）、陇海-兰新线（连云港-兰州-乌鲁木齐）、沪杭-浙赣-湘黔-贵昆线（上海-杭州-南昌-贵阳-昆明）等。","semester":"upper"},{"id":"g2_geography_u040","chapter":"第四章 中国的经济发展","name":"交通运输方式选择","formula":"公路：短途；铁路：长途大宗货物；水运：大批笨重货物；航空：急需、贵重物品","explanation":"不同交通运输方式有各自特点：公路适宜短途运输和灵活性要求高的货物；铁路适宜长途和大宗货物运输；水运适宜大批笨重货物运输，成本低；航空适宜急需、贵重物品的运输。","semester":"upper"},{"id":"g2_geography_u041","chapter":"第四章 中国的经济发展","name":"中国农业分布","formula":"种植业：东部季风区；畜牧业：西部内陆；林业：东北、西南","explanation":"中国农业分布受自然条件影响明显：种植业主要分布在东部季风区的平原和低缓丘陵；畜牧业主要分布在西部内陆的干旱半干旱高原山地；林业主要分布在东北、西南的天然林区。","semester":"upper"},{"id":"g2_geography_u042","chapter":"第四章 中国的经济发展","name":"主要农作物分布","formula":"水稻：南方；小麦：北方；棉花：长江中下游、黄河流域；油菜：长江流域","explanation":"中国主要农作物的地区分布：水稻主要分布在秦岭-淮河以南地区；小麦主要分布在秦岭-淮河以北地区；棉花主要分布在长江中下游平原和黄河中下游地区；油菜主要分布在长江流域。","semester":"upper"},{"id":"g2_geography_u043","chapter":"第四章 中国的经济发展","name":"农业发展成就与问题","formula":"成就：粮食、肉类产量居世界前列；问题：人均耕地少，水资源短缺","explanation":"中国农业发展取得了巨大成就，粮食、肉类产量居世界前列。但也存在一些问题：人均耕地少，仅为世界平均的1/3；水资源短缺，北方地区农业用水紧张；农业基础相对薄弱。","semester":"upper"},{"id":"g2_geography_u044","chapter":"第四章 中国的经济发展","name":"中国工业分布","formula":"沿海地区工业发达，内陆地区相对薄弱","explanation":"中国工业分布不均，总体上沿海地区工业发达，内陆地区相对薄弱。工业主要集中在东北地区、京津唐地区、长江三角洲地区、珠江三角洲地区等四大地区。","semester":"upper"},{"id":"g2_geography_u045","chapter":"第四章 中国的经济发展","name":"辽中南工业基地","formula":"重工业基地，煤、铁、石油资源丰富","explanation":"辽中南工业基地位于辽宁省中南部，是中国著名的重工业基地。主要工业部门有钢铁、石油、化工、机械等。区内煤炭、铁矿、石油资源丰富，工业发展历史悠久，工业基础雄厚。","semester":"upper"},{"id":"g2_geography_u046","chapter":"第四章 中国的经济发展","name":"京津唐工业基地","formula":"北方最大的综合性工业基地","explanation":"京津唐工业基地位于华北平原东北部，包括北京、天津、唐山等城市。是北方地区最大的综合性工业基地，主要部门有钢铁、化工、电子、机械、食品等，科技力量雄厚。","semester":"upper"},{"id":"g2_geography_u047","chapter":"第四章 中国的经济发展","name":"沪宁杭工业基地","formula":"全国最大的综合性工业基地","explanation":"沪宁杭工业基地位于长江三角洲地区，包括上海、南京、杭州等城市。是全国最大的综合性工业基地，工业结构完整，技术水平高，主要部门有钢铁、汽车、电子、石化等。","semester":"upper"},{"id":"g2_geography_u048","chapter":"第四章 中国的经济发展","name":"珠江三角洲工业基地","formula":"以轻工业为主，外向型经济","explanation":"珠江三角洲工业基地位于广东省中南部，是改革开放后发展最快的工业基地之一。以轻工业为主，主要部门有家电、电子、食品、服装等，是典型的外向型经济，外贸出口占有很大比重。","semester":"upper"},{"id":"g2_geography_u049","chapter":"第四章 中国的经济发展","name":"高新技术产业发展","formula":"北京中关村、武汉东湖、深圳高新区","explanation":"中国高新技术产业发展迅速，主要集中在智力密集和开放程度高的地区。主要的高新技术产业基地有北京中关村、武汉东湖、深圳高新区、上海张江等。高新技术产业已成为推动中国经济发展的重要力量。","semester":"upper"},{"id":"g2_geography_u050","chapter":"第四章 中国的经济发展","name":"中国经济发展成就","formula":"GDP世界第二，工业产值世界第一","explanation":"改革开放以来，中国经济快速发展，取得了举世瞩目的成就。GDP居世界第二位，工业产值居世界第一位，成为世界制造业大国。基础设施建设取得巨大进展，人民生活水平显著提高。","semester":"upper"},{"id":"g2_geography_l001","chapter":"第一章 中国的地理差异","name":"四大地理区域的划分","formula":"北方地区、南方地区、西北地区、青藏地区","explanation":"根据各地的地理位置、自然和人文地理特点的不同，可以将我国划分为四大地理区域：北方地区、南方地区、西北地区和青藏地区。\n\n划分依据：\n1. 北方地区和南方地区以秦岭-淮河一线为分界线\n2. 北方地区和西北地区以大兴安岭-阴山-贺兰山为分界线\n3. 青藏地区与其他地区的分界线是青藏高原边缘线（昆仑山-阿尔金山-祁连山-横断山脉）","semester":"lower"},{"id":"g2_geography_l002","chapter":"第一章 中国的地理差异","name":"秦岭-淮河一线的地理意义","formula":"北纬32°-34°附近","explanation":"秦岭-淮河一线是我国重要的地理分界线，具有多重意义：\n\n1. 气候分界线：\n   - 一月0°C等温线通过的地方\n   - 800毫米年等降水量线通过的地方\n\n2. 干湿地区分界线：\n   - 湿润区与半湿润区的分界线\n\n3. 温度带分界线：\n   - 亚热带与暖温带的分界线\n\n4. 水资源分界线：\n   - 水田与旱地农业的分界线\n\n5. 自然植被分界线：\n   - 亚热带常绿阔叶林与温带落叶阔叶林的分界线","semester":"lower"},{"id":"g2_geography_l003","chapter":"第一章 中国的地理差异","name":"北方地区的范围和特征","formula":"大兴安岭、青藏高原以东，内蒙古高原以南","explanation":"北方地区指我国秦岭-淮河以北、大兴安岭以东、青藏高原以东的地区。\n\n主要特征：\n1. 地形以平原和高原为主（东北平原、华北平原、黄土高原）\n2. 气候以温带季风气候为主\n3. 降水集中在夏季，年降水量400-800毫米\n4. 河流较少，水量不足\n5. 主要粮食作物：小麦、玉米\n6. 耕地以旱地为主","semester":"lower"},{"id":"g2_geography_l004","chapter":"第一章 中国的地理差异","name":"南方地区的范围和特征","formula":"秦岭-淮河以南，青藏高原以东","explanation":"南方地区指我国秦岭-淮河以南、青藏高原以东的地区。\n\n主要特征：\n1. 地形复杂多样（长江中下游平原、东南丘陵、四川盆地、云贵高原）\n2. 气候以亚热带季风气候和热带季风气候为主\n3. 降水丰富，年降水量800毫米以上\n4. 河湖众多，水资源丰富\n5. 主要粮食作物：水稻\n6. 耕地以水田为主\n7. 植被为亚热带常绿阔叶林","semester":"lower"},{"id":"g2_geography_l005","chapter":"第一章 中国的地理差异","name":"西北地区的范围和特征","formula":"大兴安岭以西，昆仑山-阿尔金山-祁连山以北","explanation":"西北地区指我国大兴安岭以西、昆仑山-阿尔金山-祁连山以北的地区。\n\n主要特征：\n1. 地形以高原、盆地为主（内蒙古高原、塔里木盆地、准噶尔盆地）\n2. 气候以温带大陆性气候为主\n3. 降水稀少，气候干旱\n4. 河流稀少，多为内流河\n5. 自然景观以草原、荒漠为主\n6. 农业以畜牧业和灌溉农业为主","semester":"lower"},{"id":"g2_geography_l006","chapter":"第一章 中国的地理差异","name":"青藏地区的范围和特征","formula":"横断山脉以西，昆仑山-阿尔金山-祁连山以南","explanation":"青藏地区指我国横断山脉以西、昆仑山-阿尔金山-祁连山以南的地区。\n\n主要特征：\n1. 地形以高原、山地为主，平均海拔4000米以上\n2. 气候以高原山地气候为主\n3. 气温低，日照充足，昼夜温差大\n4. 冰川广布，是众多江河的发源地\n5. 自然景观以高寒草原、草甸为主\n6. 农业以畜牧业为主，种植业分布在河谷地带","semester":"lower"},{"id":"g2_geography_l007","chapter":"第二章 北方地区","name":"北方地区的自然环境","formula":"温带季风气候，年降水量400-800毫米","explanation":"北方地区的自然环境概况：\n\n1. 地形：\n   - 东北平原（中国最大平原）\n   - 华北平原（黄淮海平原）\n   - 黄土高原\n\n2. 气候：\n   - 温带季风气候为主\n   - 夏季高温多雨，冬季寒冷干燥\n   - 年降水量400-800毫米，集中在夏季\n\n3. 河流：\n   - 黄河、海河、辽河等\n   - 河流含沙量较大\n\n4. 植被：\n   - 温带落叶阔叶林和温带针阔叶混交林","semester":"lower"},{"id":"g2_geography_l008","chapter":"第二章 北方地区","name":"北方地区的农业","formula":"旱地农业，主要种植小麦、玉米","explanation":"北方地区的农业特点：\n\n1. 耕地类型：以旱地为主\n\n2. 主要粮食作物：\n   - 小麦（冬小麦、春小麦）\n   - 玉米\n   - 谷子\n   - 高粱\n\n3. 主要经济作物：\n   - 棉花（华北平原）\n   - 花生（山东、河南）\n   - 大豆（东北平原）\n   - 甜菜（东北）\n\n4. 农业分布：\n   - 东北平原：商品粮基地\n   - 华北平原：棉麦主产区\n\n5. 面临的挑战：\n   - 水资源短缺\n   - 春旱、盐碱化问题","semester":"lower"},{"id":"g2_geography_l009","chapter":"第二章 北方地区","name":"东北三省的位置范围","formula":"黑龙江省、吉林省、辽宁省","explanation":"东北三省包括黑龙江省、吉林省和辽宁省，位于我国东北部。\n\n地理位置特点：\n1. 纬度位置：\n   - 大部分地区位于北纬40°-53°之间\n   - 是我国纬度最高的地区\n   - 气候寒冷，无霜期短\n\n2. 海陆位置：\n   - 东邻朝鲜，北接俄罗斯，西接内蒙古\n   - 南临渤海和黄海\n   - 海岸线较长，有大连等港口\n\n3. 相对位置：\n   - 东北亚地区核心位置\n   - 与日本、韩国、朝鲜、俄罗斯相邻","semester":"lower"},{"id":"g2_geography_l010","chapter":"第二章 北方地区","name":"东北三省的自然环境","formula":"山环水绕，沃野千里","explanation":"东北三省的自然环境特征：\n\n1. 地形特征：山环水绕，沃野千里\n   - 东部长白山脉\n   - 西部大兴安岭\n   - 北部小兴安岭\n   - 中部东北平原\n\n2. 气候特征：\n   - 温带季风气候\n   - 气候冷湿，无霜期短（100-200天）\n   - 冬季漫长而寒冷\n   - 夏季短促温和\n\n3. 河流：\n   - 黑龙江、松花江、辽河等\n   - 冬季有结冰期\n\n4. 植被：\n   - 温带针阔叶混交林和落叶阔叶林","semester":"lower"},{"id":"g2_geography_l011","chapter":"第二章 北方地区","name":"东北三省的农业","formula":"商品粮基地，玉米、大豆、春小麦","explanation":"东北三省的农业特点：\n\n1. 农业地位：\n   - 重要的商品粮基地\n   - 粮食商品率高\n   - 有\"北大仓\"之称\n\n2. 主要农作物：\n   - 玉米：种植面积最大\n   - 大豆：重要产区\n   - 春小麦：主要粮食作物\n   - 甜菜：重要经济作物\n   - 水稻：近年来发展迅速\n\n3. 农业发展条件：\n   - 有利：土地广阔，土壤肥沃（黑土），雨热同期\n   - 不利：热量不足，无霜期短，气温低","semester":"lower"},{"id":"g2_geography_l012","chapter":"第二章 北方地区","name":"东北三省的工业","formula":"重工业基地，辽中南工业基地","explanation":"东北三省的工业特点：\n\n1. 工业地位：\n   - 我国重要的重工业基地\n   - 被称为\"新中国工业的摇篮\"\n\n2. 主要工业部门：\n   - 钢铁工业（鞍山、本溪）\n   - 石油工业（大庆、辽河）\n   - 机械制造（沈阳、大连）\n   - 煤炭工业（抚顺、阜新）\n   - 化工工业\n\n3. 辽中南工业基地：\n   - 我国著名的重工业基地\n   - 丰富的煤、铁资源\n   - 铁路交通便利\n\n4. 工业发展问题：\n   - 资源枯竭\n   - 设备老化\n   - 产业结构单一","semester":"lower"},{"id":"g2_geography_l013","chapter":"第三章 南方地区","name":"南方地区的自然环境","formula":"亚热带季风气候，年降水量800毫米以上","explanation":"南方地区的自然环境概况：\n\n1. 地形：\n   - 长江中下游平原\n   - 东南丘陵（江南丘陵、两广丘陵）\n   - 四川盆地\n   - 云贵高原\n   - 地形复杂多样\n\n2. 气候：\n   - 亚热带季风气候为主\n   - 热带季风气候（南部）\n   - 夏季高温多雨，冬季温和少雨\n   - 年降水量800毫米以上\n\n3. 河流湖泊：\n   - 长江、珠江、闽江等\n   - 湖泊众多（鄱阳湖、洞庭湖、太湖）\n   - 水量丰富，无结冰期\n\n4. 植被：亚热带常绿阔叶林","semester":"lower"},{"id":"g2_geography_l014","chapter":"第三章 南方地区","name":"南方地区的农业","formula":"水田农业，主要种植水稻","explanation":"南方地区的农业特点：\n\n1. 耕地类型：以水田为主\n\n2. 主要粮食作物：\n   - 水稻（最主要）\n   - 小麦（冬小麦）\n\n3. 主要经济作物：\n   - 棉花（长江中下游）\n   - 油菜籽（长江流域）\n   - 甘蔗（华南地区）\n   - 茶叶\n   - 蚕丝\n\n4. 农业分布：\n   - 长江中下游平原：鱼米之乡\n   - 四川盆地：紫色盆地，农业发达\n   - 东南丘陵：立体农业\n   - 珠江三角洲：基塘农业\n\n5. 发展条件：\n   - 雨热同期，水热充足\n   - 地势低平，水田广布","semester":"lower"},{"id":"g2_geography_l015","chapter":"第三章 南方地区","name":"长江三角洲的位置和范围","formula":"长江入海口，上海、南京、杭州为核心","explanation":"长江三角洲的概况：\n\n1. 位置范围：\n   - 长江入海口地区\n   - 包括上海市、江苏省南部、浙江省北部\n   - 面积约5万平方公里\n\n2. 核心城市：\n   - 上海：全国经济中心\n   - 南京：江苏省省会\n   - 杭州：浙江省省会\n   - 苏州、无锡等\n\n3. 地理位置：\n   - 濒临东海和黄海\n   - 长江黄金水道出海口\n   - 铁路、公路、航空发达\n\n4. 发展战略：\n   - 长三角一体化\n   - 中国经济最发达的地区之一","semester":"lower"},{"id":"g2_geography_l016","chapter":"第三章 南方地区","name":"长江三角洲的经济发展","formula":"中国最大的综合性工业基地","explanation":"长江三角洲的经济发展特点：\n\n1. 工业特点：\n   - 中国最大的综合性工业基地\n   - 门类齐全，轻重工业发达\n   - 电子、汽车、石化、钢铁等产业\n\n2. 农业特色：\n   - 鱼米之乡\n   - 水稻、油菜籽、棉花等\n   - 设施农业发达\n\n3. 第三产业：\n   - 金融、贸易、航运中心\n   - 上海自贸区\n\n4. 发展优势：\n   - 交通便利\n   - 科技教育发达\n   - 对外开放程度高\n   - 人才资源丰富","semester":"lower"},{"id":"g2_geography_l017","chapter":"第三章 南方地区","name":"香港的地理位置和行政区划","formula":"珠江口东侧，亚洲太平洋地区中心","explanation":"香港特别行政区概况：\n\n1. 地理位置：\n   - 位于珠江口东岸，毗邻深圳市\n   - 北接广东省\n   - 面临南海\n   - 处于亚洲太平洋地区的中心位置\n\n2. 组成：\n   - 香港岛\n   - 九龙半岛\n   - 新界（含262个离岛）\n   - 总面积约1106平方公里\n\n3. 行政区划：\n   - 实行\"一国两制\"\n   - 特别行政区\n\n4. 城市特点：\n   - 国际金融中心\n   - 国际贸易中心\n   - 人口密度高","semester":"lower"},{"id":"g2_geography_l018","chapter":"第三章 南方地区","name":"香港的经济发展","formula":"国际贸易中心，国际金融中心","explanation":"香港的经济发展特点：\n\n1. 经济特征：\n   - 自由贸易港\n   - 国际金融中心\n   - 重要的国际航运中心\n\n2. 主要产业：\n   - 第三产业极为发达（占比90%以上）\n   - 金融服务、贸易物流、旅游业\n\n3. 与内地的联系：\n   - 改革开放后，大量港资进入内地\n   - CEPA协议\n   - 粤港澳大湾区建设\n\n4. 城市地位：\n   - 亚洲\"四小龙\"之一\n   - 全球最具竞争力的地区之一","semester":"lower"},{"id":"g2_geography_l019","chapter":"第三章 南方地区","name":"澳门的地理位置和行政区划","formula":"珠江口西侧，毗邻珠海市","explanation":"澳门特别行政区概况：\n\n1. 地理位置：\n   - 位于珠江口西岸，毗邻珠海市\n   - 北与广东珠海相邻\n   - 面临南海\n   - 由澳门半岛、氹仔岛、路环岛组成\n\n2. 组成：\n   - 澳门半岛\n   - 氹仔岛\n   - 路环岛\n   - 总面积约33平方公里（近年填海造陆）\n\n3. 历史：\n   - 400多年殖民历史\n   - 1999年回归祖国\n   - 实行\"一国两制\"\n\n4. 特点：\n   - 世界人口密度最高地区之一\n   - 中西文化交融","semester":"lower"},{"id":"g2_geography_l020","chapter":"第三章 南方地区","name":"澳门的经济发展","formula":"博彩旅游业为支柱","explanation":"澳门的经济发展特点：\n\n1. 经济特征：\n   - 典型的微型经济体\n   - 博彩业为支柱产业\n\n2. 主要产业：\n   - 博彩旅游业：最重要产业\n   - 建筑业：房地产和基础设施建设\n   - 出口加工业：玩具、电子产品等\n\n3. 经济地位：\n   - 世界著名赌城\n   - 亚洲人均GDP最高地区之一\n\n4. 与内地联系：\n   - 2003年实施\"个人游\"政策\n   - 泛珠三角区域合作\n   - 粤港澳大湾区建设","semester":"lower"},{"id":"g2_geography_l021","chapter":"第四章 西北地区","name":"西北地区的自然环境","formula":"温带大陆性气候，干旱少雨","explanation":"西北地区的自然环境概况：\n\n1. 地形：\n   - 以高原、盆地为主\n   - 内蒙古高原\n   - 塔里木盆地（中国最大盆地）\n   - 准噶尔盆地\n   - 柴达木盆地\n\n2. 气候：\n   - 温带大陆性气候\n   - 干旱少雨，蒸发旺盛\n   - 年降水量多在400毫米以下\n   - 气温年较差、日较差大\n\n3. 河流：\n   - 多为内流河（塔里木河、黑河等）\n   - 河流稀少，水量小\n   - 部分为外流河（黄河）\n\n4. 植被：\n   - 自东向西：草原→荒漠草原→荒漠","semester":"lower"},{"id":"g2_geography_l022","chapter":"第四章 西北地区","name":"西北地区的农业","formula":"畜牧业为主，灌溉农业","explanation":"西北地区的农业特点：\n\n1. 农业类型：\n   - 以畜牧业为主\n   - 灌溉农业（绿洲农业）\n\n2. 畜牧业：\n   - 草原牧区：内蒙古草原、新疆山地\n   - 主要牲畜：牛、羊、马、骆驼\n   - 重要牧区：呼伦贝尔草原、锡林郭勒草原\n\n3. 灌溉农业：\n   - 分布在有水源的绿洲地区\n   - 主要作物：小麦、棉花、瓜果、甜菜\n   - 著名绿洲：河西走廊、天山山麓、昆仑山北麓\n\n4. 农业发展条件：\n   - 有利：光照充足，昼夜温差大\n   - 不利：水资源不足","semester":"lower"},{"id":"g2_geography_l023","chapter":"第四章 西北地区","name":"坎儿井","formula":"地下输水工程，新疆吐鲁番盆地","explanation":"坎儿井是新疆吐鲁番盆地特有的地下输水工程，是古代劳动人民的伟大创造。\n\n1. 原理：\n   - 利用地势坡度，通过地下渠道引用地下水\n   - 竖井：用于挖掘和通风\n   - 明渠：地面输水\n   - 暗渠：地下输水，减少蒸发\n\n2. 分布：\n   - 主要分布在新疆吐鲁番、哈密盆地\n   - 现有1000多条，总长约5000公里\n\n3. 作用：\n   - 适应干旱少雨的自然环境\n   - 减少水分蒸发\n   - 保障农业和生活用水\n\n4. 价值：\n   - 被列入世界遗产名录\n   - 是人与自然和谐共处的典范","semester":"lower"},{"id":"g2_geography_l024","chapter":"第四章 西北地区","name":"西北地区的气候特点","formula":"温带大陆性气候，降水稀少，气温年较差大","explanation":"西北地区气候特点：\n\n1. 气候类型：温带大陆性气候\n\n2. 主要特征：\n   - 干旱少雨：年降水量多在400毫米以下，部分地区不足50毫米\n   - 日照充足：年日照时数2500-3500小时\n   - 蒸发旺盛：年蒸发量远大于降水量\n   - 气温年较差大：可达40°C以上\n   - 气温日较差大：可达15-20°C\n\n3. 形成原因：\n   - 深居内陆，距海遥远\n   - 山地阻隔，海洋湿润气流难以到达\n\n4. 气候影响：\n   - 植被以草原、荒漠为主\n   - 农业以灌溉农业为主\n   - 生态环境脆弱","semester":"lower"},{"id":"g2_geography_l025","chapter":"第四章 西北地区","name":"西北地区的资源开发","formula":"煤、石油、天然气、风能、太阳能","explanation":"西北地区的资源开发：\n\n1. 矿产资源：\n   - 煤炭：新疆、内蒙古\n   - 石油：新疆塔里木、准噶尔盆地\n   - 天然气：新疆塔里木盆地（西气东输）\n   - 有色金属：镍、铜、铅、锌\n\n2. 能源开发：\n   - 风力发电：甘肃、新疆（酒泉风电基地）\n   - 太阳能发电：青海、甘肃（光照充足）\n\n3. 西气东输工程：\n   - 起于新疆塔里木盆地\n   - 终点上海、广州\n   - 缓解东部能源紧张\n\n4. 开发意义：\n   - 促进资源优势转化为经济优势\n   - 带动相关产业发展\n   - 改善能源消费结构","semester":"lower"},{"id":"g2_geography_l026","chapter":"第五章 青藏地区","name":"青藏地区的自然环境","formula":"高原山地气候，平均海拔4000米以上","explanation":"青藏地区的自然环境概况：\n\n1. 地形：\n   - 世界最高的高原，平均海拔4000米以上\n   - 有\"世界屋脊\"之称\n   - 主要地形：高原、山地\n   - 边缘山脉：喜马拉雅山、昆仑山、阿尔金山、祁连山\n\n2. 气候：\n   - 高原山地气候\n   - 气温低：年平均气温低\n   - 日照充足，辐射强烈\n   - 昼夜温差大\n   - 降水集中在夏季\n\n3. 河流湖泊：\n   - 长江、黄河、澜沧江发源地\n   - 青海湖（中国最大湖泊）\n   - 冰川广布\n\n4. 植被：高寒草原、高寒草甸","semester":"lower"},{"id":"g2_geography_l027","chapter":"第五章 青藏地区","name":"青藏地区的自然环境特征","formula":"高、寒、旱","explanation":"青藏地区自然环境的三大特征：高、寒、旱\n\n1. 高：\n   - 平均海拔4000米以上\n   - 许多山峰海拔超过7000米\n   - 空气稀薄，气压低\n\n2. 寒：\n   - 气温低，年平均气温多在0°C以下\n   - 冬寒夏凉，无霜期短\n   - 冻土层分布广\n\n3. 旱：\n   - 降水较少，年降水量200-500毫米\n   - 蒸发量大于降水量\n   - 气候干旱\n\n4. 环境影响：\n   - 生态环境脆弱\n   - 冰川、冻土对气候变化敏感","semester":"lower"},{"id":"g2_geography_l028","chapter":"第五章 青藏地区","name":"青藏地区的农业","formula":"高寒畜牧业，河谷农业","explanation":"青藏地区的农业特点：\n\n1. 农业类型：\n   - 以畜牧业为主\n   - 河谷农业（种植业）\n\n2. 畜牧业：\n   - 高寒牧区：草原牧场\n   - 主要牲畜：牦牛、藏绵羊、藏山羊\n   - 牦牛是青藏地区的代表性牲畜\n\n3. 河谷农业：\n   - 分布在雅鲁藏布江谷地、湟水谷地\n   - 主要作物：青稞（最主要）、小麦、豌豆\n   - 条件：海拔较低，热量相对充足\n\n4. 农业发展条件：\n   - 有利：日照充足，昼夜温差大\n   - 不利：热量不足，气温低","semester":"lower"},{"id":"g2_geography_l029","chapter":"第五章 青藏地区","name":"三江源地区的位置和意义","formula":"长江、黄河、澜沧江发源地","explanation":"三江源地区概况：\n\n1. 位置范围：\n   - 位于青海省南部\n   - 长江、黄河、澜沧江（湄公河）的发源地\n   - 总面积约36万平方公里\n\n2. 三江含义：\n   - 长江：世界第三长河\n   - 黄河：中华民族的母亲河\n   - 澜沧江：国际河流，流经多国\n\n3. 生态意义：\n   - 被称为\"中华水塔\"\n   - 是亚洲重要的水源涵养区\n   - 影响着下游地区的用水安全\n\n4. 保护价值：\n   - 2000年设立国家级自然保护区\n   - 2015年成为国家公园","semester":"lower"},{"id":"g2_geography_l030","chapter":"第五章 青藏地区","name":"三江源地区的生态问题与保护","formula":"冰川退化、水土流失、草场退化","explanation":"三江源地区的生态问题与保护：\n\n1. 主要生态问题：\n   - 冰川退化：全球变暖导致冰川萎缩\n   - 水土流失：草场退化，涵养水源能力下降\n   - 草场退化：过度放牧导致草场沙化\n   - 湿地萎缩：湖泊、沼泽面积减少\n\n2. 保护措施：\n   - 实施退牧还草、还林还草\n   - 生态移民，减少人类活动干扰\n   - 设立国家公园，统一管理\n   - 加强监测和研究\n\n3. 保护意义：\n   - 保障三江中下游地区的水资源安全\n   - 维护高原生态系统的平衡\n   - 保护生物多样性","semester":"lower"},{"id":"g2_geography_l031","chapter":"第五章 青藏地区","name":"青藏铁路","formula":"世界上海拔最高的铁路","explanation":"青藏铁路概况：\n\n1. 基本信息：\n   - 2006年全线通车\n   - 从青海西宁至西藏拉萨\n   - 全长1956公里\n   - 是世界上海拔最高、线路最长的高原铁路\n\n2. 建设难点：\n   - 冻土问题：解决高原冻土施工难题\n   - 高寒缺氧：克服高原反应\n   - 生态保护：穿越可可西里等自然保护区\n\n3. 重要意义：\n   - 结束了西藏不通铁路的历史\n   - 促进西藏经济社会发展\n   - 加强民族团结\n   - 推动旅游业发展","semester":"lower"},{"id":"g2_geography_l032","chapter":"第五章 青藏地区","name":"雅鲁藏布江谷地","formula":"重要的河谷农业区","explanation":"雅鲁藏布江谷地概况：\n\n1. 位置：\n   - 位于西藏自治区南部\n   - 雅鲁藏布江流经的地区\n   - 东西走向，全长约1000公里\n\n2. 农业特点：\n   - 重要的河谷农业区\n   - 海拔相对较低（3000-4000米）\n   - 热量条件较好\n\n3. 主要作物：\n   - 青稞：最主要作物\n   - 小麦、豌豆、油菜\n\n4. 自然条件：\n   - 灌溉便利\n   - 日照充足\n   - 昼夜温差大\n   - 有利于作物生长和养分积累","semester":"lower"},{"id":"g2_geography_l033","chapter":"第二章 北方地区","name":"黄土高原","formula":"世界最大的黄土堆积区","explanation":"黄土高原概况：\n\n1. 位置范围：\n   - 北起长城，南至秦岭\n   - 西起日月山，东至太行山\n   - 主要包括山西、陕西、甘肃、宁夏等省区\n\n2. 地貌特征：\n   - 世界最大的黄土堆积区\n   - 黄土覆盖厚度大（50-200米）\n   - 地表破碎，千沟万壑\n\n3. 形成原因：\n   - 风力堆积作用\n   - 长期水流侵蚀\n\n4. 主要问题：\n   - 水土流失严重\n   - 生态环境保护刻不容缓\n\n5. 治理措施：\n   - 退耕还林还草\n   - 修建梯田\n   - 打坝淤地","semester":"lower"},{"id":"g2_geography_l034","chapter":"第三章 南方地区","name":"四川盆地","formula":"紫色盆地，天府之国","explanation":"四川盆地概况：\n\n1. 位置：\n   - 位于四川省和重庆市境内\n   - 青藏高原以东，大巴山以南\n\n2. 地形特征：\n   - 中国四大盆地之一\n   - 四周被高原和山脉环绕\n   - 内部以平原、丘陵为主\n   - 紫色砂岩广布，故称\"紫色盆地\"\n\n3. 气候：\n   - 亚热带季风气候\n   - 温暖湿润，雨量充沛\n   - 年降水量1000毫米以上\n\n4. 农业：\n   - 农业发达，物产丰富\n   - 有\"天府之国\"的美誉\n   - 主要作物：水稻、小麦、油菜籽、甘蔗","semester":"lower"},{"id":"g2_geography_l035","chapter":"第二章 北方地区","name":"华北平原","formula":"黄淮海平原，中国第二大平原","explanation":"华北平原概况：\n\n1. 位置范围：\n   - 北抵燕山南麓\n   - 南至大别山北侧\n   - 西起太行山、伏牛山\n   - 东临渤海和黄海\n   - 由黄河、淮河、海河冲积而成\n\n2. 地形特征：\n   - 中国第二大平原\n   - 地势低平，海拔多在50米以下\n   - 土壤肥沃（冲积土）\n\n3. 气候：\n   - 温带季风气候\n   - 季风特征明显\n   - 降水集中在夏季\n\n4. 农业：\n   - 重要的粮食产区\n   - 小麦、玉米、棉花主产区\n   - 面临问题：春旱、盐碱化","semester":"lower"}];

        // ==================== 内嵌例题数据 ====================
        const DATA_EXAMPLES = [{"id":"g2_geography_l001_ex01","knowledge_id":"g2_geography_l001","question":"选择题：中国四大地理区域是（  ）。A.东部地区、西部地区、南部地区、北部地区  B.北方地区、南方地区、西北地区、青藏地区  C.东北地区、华北地区、西北地区、西南地区  D.沿海地区、内陆地区、平原地区、山区","answer":"答案：B. 北方地区、南方地区、西北地区、青藏地区。解析：根据各地的地理位置、自然和人文地理特点的不同，可以将中国划分为四大地理区域：北方地区、南方地区、西北地区和青藏地区。"},{"id":"g2_geography_l001_ex02","knowledge_id":"g2_geography_l001","question":"填空题：中国四大地理区域的分界线包括：北方地区与南方地区以______为界；北方地区与西北地区以______为界；青藏地区与其他地区以______为界。","answer":"答案：秦岭-淮河；大兴安岭-阴山-贺兰山；青藏高原边缘线（昆仑山-阿尔金山-祁连山-横断山脉）。解析：这是中国四大地理区域的三条分界线。"},{"id":"g2_geography_l001_ex03","knowledge_id":"g2_geography_l001","question":"简答题：简述中国四大地理区域及其划分依据。","answer":"答案：中国四大地理区域：①北方地区：包括东北平原、华北平原、黄土高原等；②南方地区：包括长江中下游平原、东南丘陵、四川盆地、云贵高原等；③西北地区：包括内蒙古高原、塔里木盆地、准噶尔盆地等；④青藏地区：包括青藏高原和周围山地。划分依据：综合考虑各地的地理位置、自然条件（气候、地形、水文等）和人文地理特点（农业生产、生活习惯、文化等）。"},{"id":"g2_geography_l001_ex04","knowledge_id":"g2_geography_l001","question":"判断题：四大地理区域是根据地理位置、自然和人文地理特点划分的。（  ）","answer":"答案：√。解析：四大地理区域的划分依据是各地的地理位置、自然和人文地理特点。"},{"id":"g2_geography_l001_ex05","knowledge_id":"g2_geography_l001","question":"选择题：北方地区与西北地区的分界线是（  ）。A.秦岭-淮河  B.大兴安岭-阴山-贺兰山  C.昆仑山-祁连山  D.长城","answer":"答案：B. 大兴安岭-阴山-贺兰山。解析：北方地区与西北地区以大兴安岭-阴山-贺兰山一线为分界线。"},{"id":"g2_geography_l001_ex06","knowledge_id":"g2_geography_l001","question":"填空题：青藏地区与南方地区的分界线是______，青藏地区与西北地区的分界线是______。","answer":"答案：横断山脉；昆仑山-阿尔金山-祁连山。解析：青藏地区与南方地区以横断山脉为界；青藏地区与西北地区以昆仑山-阿尔金山-祁连山为界。"},{"id":"g2_geography_l001_ex07","knowledge_id":"g2_geography_l001","question":"选择题：四大地理区域中，全部位于地势第一级阶梯的是（  ）。A.北方地区  B.南方地区  C.西北地区  D.青藏地区","answer":"答案：D. 青藏地区。解析：青藏地区位于中国地势第一级阶梯，平均海拔4000米以上。"},{"id":"g2_geography_l001_ex08","knowledge_id":"g2_geography_l001","question":"简答题：划分四大地理区域有什么意义？","answer":"答案：意义：①便于因地制宜：根据各地区不同的自然条件、经济发展水平和文化特点，制定有针对性的发展战略；②便于区域管理：实行区域化管理，提高行政效率；③便于发挥地区优势：充分发挥各地区的优势，实现优势互补；④便于区域协调发展：统筹安排，缩小地区间发展差距；⑤便于研究各地理区域的特征：深入了解各区域自然和人文地理特点。"},{"id":"g2_geography_l001_ex09","knowledge_id":"g2_geography_l001","question":"读图题：读中国四大地理区域分布图，指出各区域的范围。","answer":"答案：①北方地区：位于秦岭-淮河以北，大兴安岭以东，青藏高原以东；②南方地区：位于秦岭-淮河以南，青藏高原以东；③西北地区：位于大兴安岭以西，昆仑山-阿尔金山-祁连山以北；④青藏地区：位于横断山脉以西，昆仑山-阿尔金山-祁连山以南。"},{"id":"g2_geography_l001_ex10","knowledge_id":"g2_geography_l001","question":"综合题：分析四大地理区域划分的主要依据及区域差异。","answer":"答案：划分依据：①地理位置：纬度位置和海陆位置不同；②自然条件：气候、地形、水文等自然要素的差异；③人文地理特点：农业生产、生活习惯、文化传统等差异。区域差异：①北方地区：以温带季风气候为主，以旱地农业为主，作物以小麦、玉米为主；②南方地区：以亚热带和热带季风气候为主，以水田农业为主，作物以水稻为主；③西北地区：以温带大陆性气候为主，以畜牧业和灌溉农业为主；④青藏地区：以高原山地气候为主，以高寒畜牧业和河谷农业为主。"},{"id":"g2_geography_l002_ex01","knowledge_id":"g2_geography_l002","question":"选择题：秦岭-淮河一线是（  ）的分界线。A.暖温带与亚热带  B.热带与亚热带  C.中温带与暖温带  D.寒温带与中温带","answer":"答案：A. 暖温带与亚热带。解析：秦岭-淮河一线是中国重要的地理分界线，是暖温带与亚热带的分界线。"},{"id":"g2_geography_l002_ex02","knowledge_id":"g2_geography_l002","question":"填空题：秦岭-淮河一线是中国1月平均气温______℃等温线和年降水量______mm等值线经过的地方。","answer":"答案：0；800。解析：秦岭-淮河一线大致与中国1月平均气温0℃等温线和年降水量800mm等值线一致。"},{"id":"g2_geography_l002_ex03","knowledge_id":"g2_geography_l002","question":"简答题：简述秦岭-淮河一线的地理意义。","answer":"答案：秦岭-淮河一线的地理意义：①气温：1月平均气温0℃等温线；②降水：年降水量800mm等值线；③干湿地区：湿润区与半湿润区的分界线；④温度带：亚热带与暖温带的分界线；⑤植被：亚热带常绿阔叶林与温带落叶阔叶林的分界线；⑥农业：水田与旱地农业的分界线，水稻与小麦的分界线；⑦河流：无结冰期与有结冰期河流的分界线；⑧地区：南方地区与北方地区的分界线。"},{"id":"g2_geography_l002_ex04","knowledge_id":"g2_geography_l002","question":"判断题：秦岭-淮河一线是水田与旱地农业的分界线。（  ）","answer":"答案：√。解析：秦岭-淮河以北以旱地为主（种植小麦），以南以水田为主（种植水稻）。"},{"id":"g2_geography_l002_ex05","knowledge_id":"g2_geography_l002","question":"选择题：秦岭-淮河一线南北两侧的差异不包括（  ）。A.气候类型不同  B.主要粮食作物不同  C.海拔不同  D.河流有无结冰期不同","answer":"答案：C. 海拔不同。解析：秦岭-淮河一线两侧的差异主要表现在气候、降水、植被、农业等方面，海拔不是其划分依据（虽然秦岭本身海拔较高，但作为分界线并不是按海拔划分的）。"},{"id":"g2_geography_l002_ex06","knowledge_id":"g2_geography_l002","question":"填空题：秦岭-淮河以北的耕地以______为主，以南的耕地以______为主。","answer":"答案：旱地；水田。解析：秦岭-淮河以北以旱地为主（种植小麦、玉米等），以南以水田为主（种植水稻）。"},{"id":"g2_geography_l002_ex07","knowledge_id":"g2_geography_l002","question":"选择题：秦岭-淮河以北的主要粮食作物是（  ）。A.水稻  B.小麦  C.甘蔗  D.橡胶","answer":"答案：B. 小麦。解析：秦岭-淮河以北以旱地为主，主要粮食作物是小麦（冬小麦为主）。"},{"id":"g2_geography_l002_ex08","knowledge_id":"g2_geography_l002","question":"简答题：分析秦岭-淮河一线的形成原因。","answer":"答案：形成原因：①纬度位置：位于北纬32°-34°附近，处于暖温带和亚热带的过渡带；②地形阻挡：秦岭东西走向，山体高大，对冬季风南下和夏季风北上都有阻挡作用，使南北两侧气温、降水等产生明显差异；③海陆位置：秦岭-淮河一线大致与1月平均气温0℃等温线、800mm年等降水量线一致，形成南北方分界。"},{"id":"g2_geography_l002_ex09","knowledge_id":"g2_geography_l002","question":"读图题：读中国南北方分界示意图，说出秦岭-淮河一线的地理意义。","answer":"答案：秦岭-淮河一线的地理意义：1月平均气温0℃等温线；年降水量800mm等值线；湿润区与半湿润区的分界线；亚热带与暖温带的分界线；亚热带常绿阔叶林与温带落叶阔叶林的分界线；水田与旱地农业的分界线；南方地区与北方地区的分界线。"},{"id":"g2_geography_l002_ex10","knowledge_id":"g2_geography_l002","question":"综合题：分析秦岭-淮河一线的地理意义在生产生活中的应用。","answer":"答案：应用：①农业：根据秦岭-淮河一线确定农作物种类和种植制度（北方旱作，一年一熟或两年三熟；南方水田，一年两熟或三熟）；②建筑：北方房屋注重保暖，南方房屋注重防潮；③饮食：北方以面食为主，南方以米饭为主；④交通：北方铁路、公路运输更发达，南方水运便利；⑤植被：北方种植温带落叶阔叶林，南方种植亚热带常绿阔叶林；⑥能源：北方以煤炭为主，南方水电丰富；⑦生活习惯：北方口味偏咸，南方偏甜等。"},{"id":"g2_geography_l003_ex01","knowledge_id":"g2_geography_l003","question":"选择题：北方地区主要位于（  ）。A.秦岭-淮河以南  B.秦岭-淮河以北、大兴安岭以东  C.青藏高原  D.西北内陆","answer":"答案：B. 秦岭-淮河以北、大兴安岭以东。解析：北方地区指中国秦岭-淮河以北、大兴安岭以东、青藏高原以东的地区。"},{"id":"g2_geography_l003_ex02","knowledge_id":"g2_geography_l003","question":"填空题：北方地区的主要地形包括______平原、______平原和黄土高原。","answer":"答案：东北；华北。解析：北方地区的主要地形是东北平原、华北平原和黄土高原。"},{"id":"g2_geography_l003_ex03","knowledge_id":"g2_geography_l003","question":"简答题：简述北方地区的主要特征。","answer":"答案：北方地区主要特征：①位置：秦岭-淮河以北、大兴安岭以东、青藏高原以东；②地形：以平原（东北平原、华北平原）和高原（黄土高原）为主；③气候：以温带季风气候为主，夏季高温多雨，冬季寒冷干燥，年降水量400-800mm；④河流：黄河、海河、辽河、松花江等，含沙量较大，冬季有结冰期；⑤农业：旱地农业为主，作物以小麦、玉米为主；⑥植被：温带落叶阔叶林和温带针阔叶混交林。"},{"id":"g2_geography_l003_ex04","knowledge_id":"g2_geography_l003","question":"判断题：北方地区以温带季风气候为主。（  ）","answer":"答案：√。解析：北方地区以温带季风气候为主，夏季高温多雨，冬季寒冷干燥。"},{"id":"g2_geography_l003_ex05","knowledge_id":"g2_geography_l003","question":"选择题：北方地区主要粮食作物是（  ）。A.水稻  B.小麦、玉米  C.甘蔗  D.橡胶","answer":"答案：B. 小麦、玉米。解析：北方地区以旱地农业为主，主要粮食作物是小麦和玉米。"},{"id":"g2_geography_l003_ex06","knowledge_id":"g2_geography_l003","question":"填空题：北方地区以______农业为主，耕地类型以______为主。","answer":"答案：旱地；旱地。解析：北方地区以旱地农业为主，耕地类型以旱地为主。"},{"id":"g2_geography_l003_ex07","knowledge_id":"g2_geography_l003","question":"选择题：北方地区主要的油料作物是（  ）。A.油菜  B.花生  C.大豆  D.甘蔗","answer":"答案：B. 花生。解析：北方地区（特别是华北平原）是中国重要的花生产区。"},{"id":"g2_geography_l003_ex08","knowledge_id":"g2_geography_l003","question":"简答题：分析北方地区农业发展面临的主要问题及措施。","answer":"答案：问题：①水资源短缺：北方地区水资源不足，特别是华北地区春旱严重；②盐碱化：华北平原土壤盐碱化问题突出；③水土流失：黄土高原水土流失严重；④低温冻害：东北地区热量不足，无霜期短。措施：①节约用水：发展节水农业；②跨流域调水：南水北调工程；③治理水土流失：植树造林，修建梯田；④改良盐碱地：科学灌溉，秸秆还田；⑤发展设施农业：温室大棚等。"},{"id":"g2_geography_l003_ex09","knowledge_id":"g2_geography_l003","question":"读图题：读北方地区图，说出北方地区的主要地形区。","answer":"答案：北方地区主要地形区：①东北平原（中国最大平原，以黑土著称）；②华北平原（黄淮海平原，主要由黄河、淮河、海河冲积而成）；③黄土高原（世界最大的黄土堆积区）；④辽东丘陵、山东丘陵。"},{"id":"g2_geography_l003_ex10","knowledge_id":"g2_geography_l003","question":"综合题：分析北方地区的气候特点及其对农业的影响。","answer":"答案：气候特点：①类型：温带季风气候；②气温：夏季高温，冬季寒冷，年较差大；③降水：年降水量400-800mm，集中于夏季，雨热同期；④灾害：春旱、寒潮、沙尘暴等。对农业的影响：①有利：夏季高温多雨，雨热同期，适宜小麦、玉米等温带作物生长；②不利：春旱严重，影响春播和冬小麦返青；冬季寒冷，部分地区有冻害；降水集中且变率大，旱涝灾害频繁。"},{"id":"g2_geography_l004_ex01","knowledge_id":"g2_geography_l004","question":"选择题：南方地区主要位于（  ）。A.秦岭-淮河以北  B.秦岭-淮河以南、青藏高原以东  C.大兴安岭以西  D.西北内陆","answer":"答案：B. 秦岭-淮河以南、青藏高原以东。解析：南方地区指中国秦岭-淮河以南、青藏高原以东的地区。"},{"id":"g2_geography_l004_ex02","knowledge_id":"g2_geography_l004","question":"填空题：南方地区主要的地形包括长江中下游平原、______丘陵、四川盆地和______高原。","answer":"答案：东南；云贵。解析：南方地区主要地形：长江中下游平原、东南丘陵、四川盆地、云贵高原。"},{"id":"g2_geography_l004_ex03","knowledge_id":"g2_geography_l004","question":"简答题：简述南方地区的主要特征。","answer":"答案：南方地区主要特征：①位置：秦岭-淮河以南、青藏高原以东；②地形：复杂多样，以山地、丘陵为主，平原狭小分散；③气候：以亚热带季风气候为主，南部为热带季风气候，温暖湿润，降水丰富，年降水量800mm以上；④河流：长江、珠江、闽江等，水量丰富，无结冰期，航运价值大；⑤农业：水田农业为主，主要种植水稻；⑥植被：亚热带常绿阔叶林和热带季雨林；⑦经济：经济发达，城镇密集。"},{"id":"g2_geography_l004_ex04","knowledge_id":"g2_geography_l004","question":"判断题：南方地区以亚热带季风气候为主，年降水量在800毫米以上。（  ）","answer":"答案：√。解析：南方地区以亚热带季风气候为主，年降水量丰富，多在800mm以上。"},{"id":"g2_geography_l004_ex05","knowledge_id":"g2_geography_l004","question":"选择题：南方地区主要粮食作物是（  ）。A.小麦  B.玉米  C.水稻  D.大豆","answer":"答案：C. 水稻。解析：南方地区以水田农业为主，主要粮食作物是水稻。"},{"id":"g2_geography_l004_ex06","knowledge_id":"g2_geography_l004","question":"填空题：南方地区的主要油料作物是______，主要糖料作物是______。","answer":"答案：油菜；甘蔗。解析：南方地区主要油料作物是油菜（长江流域），主要糖料作物是甘蔗（华南地区）。"},{"id":"g2_geography_l004_ex07","knowledge_id":"g2_geography_l004","question":"选择题：南方地区被称为'鱼米之乡'的地区是（  ）。A.长江三角洲  B.珠江三角洲  C.四川盆地  D.云贵高原","answer":"答案：A. 长江三角洲。解析：长江中下游平原（包括长江三角洲）被称为'鱼米之乡'，是中国重要的水稻种植区和淡水渔业区。"},{"id":"g2_geography_l004_ex08","knowledge_id":"g2_geography_l004","question":"简答题：分析南方地区发展农业的有利条件。","answer":"答案：有利条件：①气候：亚热带和热带季风气候，水热条件优越，雨热同期；②地形：平原、丘陵、山地等多种地形，适宜多种农业经营；③土壤：红壤经改良后肥力提高，水稻土肥沃；④水源：河湖众多，水资源丰富，灌溉便利；⑤劳动力：人口稠密，劳动力充足，精耕细作；⑥市场：经济发达，市场需求大；⑦交通：水陆交通便利，农产品运输方便。"},{"id":"g2_geography_l004_ex09","knowledge_id":"g2_geography_l004","question":"读图题：读南方地区图，说出南方地区的主要地形区。","answer":"答案：南方地区主要地形区：①长江中下游平原（包括长江三角洲、洞庭湖平原、鄱阳湖平原等）；②东南丘陵（江南丘陵、两广丘陵、浙闽丘陵）；③四川盆地（紫色盆地）；④云贵高原（喀斯特地貌发育）；⑤横断山区；⑥珠江三角洲平原。"},{"id":"g2_geography_l004_ex10","knowledge_id":"g2_geography_l004","question":"综合题：分析南方地区气候特点对农业的影响。","answer":"答案：气候特点：亚热带季风气候和热带季风气候，温暖湿润，降水丰富，雨热同期。对农业的影响：①有利：水热充足，适宜种植水稻等喜温喜湿作物，作物一年两熟到三熟，是中国重要的农业区；②不利：梅雨季节易发生洪涝，伏旱（7-8月长江中下游受副热带高压控制）影响农业生产；台风带来暴雨和风暴潮，威胁农业生产；冬季寒潮可能造成冻害。"},{"id":"g2_geography_l005_ex01","knowledge_id":"g2_geography_l005","question":"选择题：西北地区主要位于（  ）。A.秦岭-淮河以北  B.大兴安岭以西、昆仑山-阿尔金山-祁连山以北  C.青藏高原  D.南方","answer":"答案：B. 大兴安岭以西、昆仑山-阿尔金山-祁连山以北。解析：西北地区指中国大兴安岭以西、昆仑山-阿尔金山-祁连山以北的地区。"},{"id":"g2_geography_l005_ex02","knowledge_id":"g2_geography_l005","question":"填空题：西北地区的主要地形包括______高原、塔里木盆地、______盆地等。","answer":"答案：内蒙古；准噶尔。解析：西北地区主要地形：内蒙古高原、塔里木盆地、准噶尔盆地、柴达木盆地等。"},{"id":"g2_geography_l005_ex03","knowledge_id":"g2_geography_l005","question":"简答题：简述西北地区的主要特征。","answer":"答案：西北地区主要特征：①位置：大兴安岭以西、昆仑山-阿尔金山-祁连山以北；②地形：以高原、盆地为主（内蒙古高原、塔里木盆地、准噶尔盆地、柴达木盆地）；③气候：温带大陆性气候，干旱少雨，蒸发旺盛，年降水量多在400mm以下；④河流：多为内流河（塔里木河、黑河等），河流稀少；⑤植被：自东向西由草原→荒漠草原→荒漠过渡；⑥农业：以畜牧业为主，种植业为灌溉农业；⑦生态：生态环境脆弱。"},{"id":"g2_geography_l005_ex04","knowledge_id":"g2_geography_l005","question":"判断题：西北地区以温带大陆性气候为主，降水稀少。（  ）","answer":"答案：√。解析：西北地区深居内陆，远离海洋，海洋湿润气流难以到达，形成温带大陆性气候，降水稀少。"},{"id":"g2_geography_l005_ex05","knowledge_id":"g2_geography_l005","question":"选择题：西北地区主要的农业类型是（  ）。A.水田农业  B.旱地农业  C.畜牧业和灌溉农业  D.渔业","answer":"答案：C. 畜牧业和灌溉农业。解析：西北地区降水稀少，以畜牧业为主，种植业主要为灌溉农业（绿洲农业）。"},{"id":"g2_geography_l005_ex06","knowledge_id":"g2_geography_l005","question":"填空题：西北地区自然景观自东向西由______→______→______过渡。","answer":"答案：草原；荒漠草原；荒漠。解析：西北地区自东向西距海越来越远，降水量逐渐减少，自然景观由草原→荒漠草原→荒漠过渡。"},{"id":"g2_geography_l005_ex07","knowledge_id":"g2_geography_l005","question":"选择题：塔里木盆地位于（  ）。A.甘肃  B.新疆  C.青海  D.内蒙古","answer":"答案：B. 新疆。解析：塔里木盆地位于新疆南部，是中国面积最大的盆地。"},{"id":"g2_geography_l005_ex08","knowledge_id":"g2_geography_l005","question":"简答题：分析西北地区干旱的原因。","answer":"答案：原因：①海陆位置：深居内陆，距海遥远，太平洋、印度洋、大西洋的水汽都难以到达；②地形：周围有高大山脉阻挡（如天山、昆仑山等），海洋湿润气流被阻隔；③大气环流：终年受大陆气团控制，降水稀少。综合作用使西北地区成为全球同纬度最干旱的地区之一。"},{"id":"g2_geography_l005_ex09","knowledge_id":"g2_geography_l005","question":"读图题：读西北地区图，说出西北地区的主要地形区。","answer":"答案：西北地区主要地形区：①内蒙古高原（位于内蒙古，是中国第二大高原）；②塔里木盆地（中国最大盆地，深居内陆）；③准噶尔盆地（位于新疆北部）；④柴达木盆地（位于青海，是海拔最高的盆地）；⑤天山山脉；⑥阿尔泰山脉；⑦河西走廊。"},{"id":"g2_geography_l005_ex10","knowledge_id":"g2_geography_l005","question":"综合题：分析西北地区自然环境对人类活动的影响。","answer":"答案：影响：①人口分布：降水稀少导致人口稀少，人口主要集中在有水源的绿洲和河谷地带；②农业生产：以畜牧业为主，种植业仅限于有水源的绿洲和河谷地区，主要种植小麦、棉花、瓜果等；③民居：适应干旱环境，平顶房、窑洞等；④交通：交通不便，主要依靠公路、铁路和航空；⑤经济发展：资源丰富（煤、石油、天然气、有色金属等），是西气东输、西电东送的重要基地；⑥生态：生态环境脆弱，易发生土地荒漠化、盐碱化等问题。"},{"id":"g2_geography_l006_ex01","knowledge_id":"g2_geography_l006","question":"选择题：青藏地区最显著的自然特征是（  ）。A.干旱  B.高寒  C.湿润  D.炎热","answer":"答案：B. 高寒。解析：青藏地区最显著的自然特征是'高寒'，是中国乃至世界海拔最高的高原地区。"},{"id":"g2_geography_l006_ex02","knowledge_id":"g2_geography_l006","question":"填空题：青藏地区位于中国地势第______级阶梯，平均海拔在______米以上。","answer":"答案：一；4000。解析：青藏地区位于中国地势第一级阶梯，平均海拔4000米以上，是世界海拔最高的高原。"},{"id":"g2_geography_l006_ex03","knowledge_id":"g2_geography_l006","question":"简答题：简述青藏地区的主要特征。","answer":"答案：青藏地区主要特征：①位置：中国西南部，包括青海、西藏、四川西部、甘肃南部和云南西北部；②地形：以高原为主（青藏高原），是世界上最高的高原；③气候：高原山地气候，高寒是其显著特征，冬季严寒，夏季凉爽，年温差小，日温差大；④河流：是长江、黄河、澜沧江、雅鲁藏布江等亚洲大河的发源地；⑤农业：以高寒畜牧业为主，河谷地区发展农业（青稞、小麦等）；⑥宗教：藏族信仰藏传佛教。"},{"id":"g2_geography_l006_ex04","knowledge_id":"g2_geography_l006","question":"判断题：青藏地区是世界上最高的高原，被称为'世界屋脊'。（  ）","answer":"答案：√。解析：青藏高原平均海拔4000米以上，是世界海拔最高的高原，被誉为'世界屋脊'。"},{"id":"g2_geography_l006_ex05","knowledge_id":"g2_geography_l006","question":"选择题：青藏地区主要的农作物是（  ）。A.小麦  B.水稻  C.青稞  D.棉花","answer":"答案：C. 青稞。解析：青藏地区海拔高，热量不足，主要农作物是耐寒的青稞，是藏民的主要口粮。"},{"id":"g2_geography_l006_ex06","knowledge_id":"g2_geography_l006","question":"填空题：青藏地区是亚洲许多大河的发源地，长江、黄河、______江等都发源于此。","answer":"答案：澜沧。解析：长江、黄河、澜沧江、雅鲁藏布江等亚洲大河都发源于青藏地区。"},{"id":"g2_geography_l006_ex07","knowledge_id":"g2_geography_l006","question":"选择题：青藏地区主要的牲畜是（  ）。A.绵羊  B.牦牛  C.马  D.骆驼","answer":"答案：B. 牦牛。解析：牦牛是青藏地区主要的牲畜，被称为'高原之舟'，适应高寒环境。"},{"id":"g2_geography_l006_ex08","knowledge_id":"g2_geography_l006","question":"简答题：分析青藏地区'高寒'气候对人类活动的影响。","answer":"答案：影响：①农业：高寒气候只适宜种植青稞、小麦等耐寒作物，河谷地区热量条件相对较好；②畜牧业：以高寒畜牧业为主，主要畜种是牦牛、藏绵羊等；③民居：藏族民居多为碉房、石砌房屋，厚重保暖；④服装：藏族同胞穿藏袍，昼夜着装不同；⑤交通：高寒地区冻土广布，交通不便，公路、铁路和航空是主要交通方式（青藏铁路、川藏公路、新藏公路等）；⑥人口：人口稀少，主要集中在地势较低的河谷地带（如雅鲁藏布江谷地、湟水谷地）。"},{"id":"g2_geography_l006_ex09","knowledge_id":"g2_geography_l006","question":"读图题：读青藏地区图，说出青藏地区的主要地形区。","answer":"答案：青藏地区主要地形区：①青藏高原（世界海拔最高的高原）；②柴达木盆地（位于青海，是海拔最高的盆地）；③喜马拉雅山脉（世界海拔最高的山脉）；④昆仑山脉；⑤祁连山脉；⑥横断山脉；⑦雅鲁藏布江谷地。"},{"id":"g2_geography_l006_ex10","knowledge_id":"g2_geography_l006","question":"综合题：分析青藏地区丰富的能源资源及其开发。","answer":"答案：青藏地区能源资源：①太阳能：海拔高，空气稀薄，太阳辐射强，是中国太阳能资源最丰富的地区之一；②地热能：位于亚欧板块与印度洋板块交界处，地热资源丰富，羊八井是中国著名的地热电站；③水能：河流众多，落差大，水能资源丰富，已建和在建多座水电站；④风能：高原地区风力大，风能资源丰富。开发：充分利用清洁能源，发展太阳能、水能、地热能等，兼顾经济发展和生态保护。"},{"id":"g2_geography_l007_ex01","knowledge_id":"g2_geography_l007","question":"选择题：青藏地区是亚洲许多大河的发源地，主要原因是（  ）。A.降水多  B.海拔高，有大量冰川和积雪融水  C.气温高  D.地形平坦","answer":"答案：B. 海拔高，有大量冰川和积雪融水。解析：青藏高原海拔高，分布有大量冰川和积雪，是众多亚洲大河的发源地。"},{"id":"g2_geography_l007_ex02","knowledge_id":"g2_geography_l007","question":"填空题：青藏地区的三江源自然保护区是中国最大的自然保护区，被誉为'______'。","answer":"答案：中华水塔。解析：三江源（长江、黄河、澜沧江源头地区）是中国最大的自然保护区，被誉为'中华水塔'。"},{"id":"g2_geography_l007_ex03","knowledge_id":"g2_geography_l007","question":"简答题：简述青藏地区的自然环境特征。","answer":"答案：青藏地区自然环境特征：①地形：青藏高原是中国地势最高的高原，平均海拔4000米以上，是世界海拔最高的高原；②气候：高寒气候，气温低，空气稀薄，日照充足，降水较少；③河流：众多大江大河发源地，水资源丰富；④湖泊：多高原湖泊（如青海湖、纳木错）；⑤植被：以高寒草原、草甸为主；⑥动物：藏羚羊、野牦牛等高原动物众多；⑦土壤：土壤发育差，土层薄。"},{"id":"g2_geography_l007_ex04","knowledge_id":"g2_geography_l007","question":"判断题：青藏地区光照充足，但热量不足。（  ）","answer":"答案：√。解析：青藏地区海拔高，空气稀薄，光照充足（太阳辐射强），但由于海拔高，气温低，热量不足。"},{"id":"g2_geography_l007_ex05","knowledge_id":"g2_geography_l007","question":"选择题：青藏地区主要的农业类型是（  ）。A.种植业  B.畜牧业  C.渔业  D.林业","answer":"答案：B. 畜牧业。解析：青藏地区高寒气候不利于种植业，主要以高寒畜牧业为主，仅在河谷地区发展种植业。"},{"id":"g2_geography_l007_ex06","knowledge_id":"g2_geography_l007","question":"填空题：青藏地区主要农作物是______和小麦，主要分布在雅鲁藏布江谷地和______谷地等河谷地区。","answer":"答案：青稞；湟水。解析：青藏地区主要农作物是青稞和小麦，主要分布在雅鲁藏布江谷地和湟水谷地等河谷地区，这些地区海拔较低，热量条件相对较好。"},{"id":"g2_geography_l007_ex07","knowledge_id":"g2_geography_l007","question":"选择题：青藏地区被称为'高原之舟'的牲畜是（  ）。A.骆驼  B.牦牛  C.马  D.羊","answer":"答案：B. 牦牛。解析：牦牛是青藏地区主要的牲畜，毛长皮厚，耐寒耐饥，是高寒地区特有的畜种，被称为'高原之舟'。"},{"id":"g2_geography_l007_ex08","knowledge_id":"g2_geography_l007","question":"简答题：分析青藏地区的自然环境对发展经济的优势和劣势。","answer":"答案：优势：①能源资源丰富：太阳能、水能、地热能资源丰富；②矿产资源丰富：柴达木盆地有'聚宝盆'之称，富含钾、镁、锂等多种矿产；③旅游资源丰富：青藏高原、雪山、冰川、湖泊等自然景观独特，藏族文化神秘丰富；④生物资源独特：藏羚羊、雪莲、冬虫夏草等高原生物资源。劣势：①热量不足：影响农业发展；②地形复杂：交通不便；③生态环境脆弱：易受到人类活动破坏；④缺氧：限制人类活动。"},{"id":"g2_geography_l007_ex09","knowledge_id":"g2_geography_l007","question":"读图题：读青藏地区图，说出青藏地区主要自然保护区。","answer":"答案：青藏地区主要自然保护区：①三江源自然保护区（位于青海省，是长江、黄河、澜沧江源头）；②可可西里自然保护区（位于青海省，保护藏羚羊等高原动物）；③纳木错自然保护区（位于西藏，保护纳木错湖及其周围生态系统）；④卧龙自然保护区（位于四川省，保护大熊猫等珍稀动物）。"},{"id":"g2_geography_l007_ex10","knowledge_id":"g2_geography_l007","question":"综合题：分析青藏地区生态环境保护的重要性。","answer":"答案：重要性：①'中华水塔'地位：青藏地区是长江、黄河、澜沧江等亚洲大河的发源地，关系着亚洲的水资源安全；②生物多样性宝库：青藏地区有独特的生态系统，是藏羚羊、雪豹等多种珍稀物种的栖息地；③气候调节作用：青藏高原对中国和亚洲气候有重要影响，是'亚洲水塔'；④生态脆弱性：青藏地区海拔高、气温低、生态环境脆弱，一旦破坏难以恢复；⑤对中华民族生存发展：青藏地区的生态状况直接影响中国乃至亚洲的生态安全，必须加强保护。"},{"id":"g2_geography_l008_ex01","knowledge_id":"g2_geography_l008","question":"选择题：青藏铁路连接的两个主要城市是（  ）。A.西宁-拉萨  B.成都-拉萨  C.格尔木-拉萨  D.昆明-拉萨","answer":"答案：A. 西宁-拉萨。解析：青藏铁路北起青海西宁，南至西藏拉萨，全长1956千米，是世界上海拔最高、线路最长的高原铁路。"},{"id":"g2_geography_l008_ex02","knowledge_id":"g2_geography_l008","question":"填空题：青藏铁路是世界上海拔最高、线路最长的______铁路，于2006年______月______日全线通车。","answer":"答案：高原；7；1。解析：青藏铁路是世界上海拔最高、线路最长的高原铁路，于2006年7月1日全线通车。"},{"id":"g2_geography_l008_ex03","knowledge_id":"g2_geography_l008","question":"简答题：简述青藏铁路建设面临的困难。","answer":"答案：青藏铁路建设面临的困难：①多年冻土：青藏高原分布有大面积多年冻土，冻土的冻融变化对路基稳定性构成威胁；②高寒缺氧：海拔高，气温低，氧气稀薄，影响施工人员健康和施工效率；③生态脆弱：青藏高原生态环境脆弱，破坏后难以恢复，需保护沿线生态；④地形复杂：地形复杂，山高谷深，桥隧比重大；⑤地震、滑坡、泥石流等地质灾害多发。"},{"id":"g2_geography_l008_ex04","knowledge_id":"g2_geography_l008","question":"判断题：青藏铁路建设在冻土、高寒、生态保护等技术上取得重大突破。（  ）","answer":"答案：√。解析：青藏铁路建设克服了多年冻土、高寒缺氧、生态脆弱等难题，工程技术达到世界先进水平。"},{"id":"g2_geography_l008_ex05","knowledge_id":"g2_geography_l008","question":"选择题：青藏铁路穿越的著名自然保护区是（  ）。A.三江源  B.可可西里  C.纳木错  D.以上都是","answer":"答案：D. 以上都是。解析：青藏铁路穿越三江源、可可西里、纳木错等多个自然保护区，需要特别重视生态保护。"},{"id":"g2_geography_l008_ex06","knowledge_id":"g2_geography_l008","question":"填空题：青藏铁路建设时，为保护环境，专门设置了______通道，方便藏羚羊等野生动物迁徙。","answer":"答案：野生动物。解析：青藏铁路建设专门设置了野生动物通道，方便藏羚羊等野生动物迁徙，体现了对生态环境保护的重视。"},{"id":"g2_geography_l008_ex07","knowledge_id":"g2_geography_l008","question":"选择题：青藏铁路建成后，对西藏发展的主要意义是（  ）。A.促进西藏旅游业发展  B.促进西藏经济发展  C.加强西藏与内地的联系  D.以上都是","answer":"答案：D. 以上都是。解析：青藏铁路的建成对西藏发展具有多方面意义：方便了西藏人民出行，促进西藏旅游业和经济发展，加强西藏与内地的联系，巩固国防。"},{"id":"g2_geography_l008_ex08","knowledge_id":"g2_geography_l008","question":"简答题：青藏铁路建设对生态环境保护采取了哪些措施？","answer":"答案：保护措施：①野生动物保护：设置专门的野生动物通道，方便藏羚羊等野生动物迁徙；②植被保护：施工中尽量保护地表植被，恢复施工破坏的草场；③水源保护：保护沿线河流、湖泊水源地；④垃圾处理：妥善处理施工和生活垃圾；⑤冻土保护：采用先进技术，保护多年冻土；⑥自然保护区：尽量绕避自然保护区，无法绕避的采取保护措施；⑦加强管理：制定严格的环保规章制度。"},{"id":"g2_geography_l008_ex09","knowledge_id":"g2_geography_l008","question":"读图题：读青藏铁路示意图，说出青藏铁路经过的主要地形区。","answer":"答案：青藏铁路经过的主要地形区：①柴达木盆地（青海省西北部）；②昆仑山；③可可西里地区；④长江源（沱沱河）；⑤唐古拉山；⑥藏北高原；⑦当雄草原；⑧拉萨河谷地。"},{"id":"g2_geography_l008_ex10","knowledge_id":"g2_geography_l008","question":"综合题：分析青藏铁路建设对西藏可持续发展的意义。","answer":"答案：意义：①经济：促进西藏资源开发和经济发展，加快西藏现代化进程；②社会：密切西藏与内地的联系，方便西藏人民出行，促进民族团结；③文化：促进西藏文化与内地文化交流，传播藏族文化；④生态：促进西藏生态旅游业发展，带动当地人民脱贫致富；⑤国防：增强西藏国防力量，巩固国家统一；⑥科技：解决多年冻土、高寒缺氧等世界性难题，体现中国工程技术水平；⑦可持续发展：带动西藏经济、社会、文化全面可持续发展。"},{"id":"g2_geography_l009_ex01","knowledge_id":"g2_geography_l009","question":"选择题：黑龙江省北部主要农作物是（  ）。A.冬小麦  B.春小麦  C.水稻  D.玉米","answer":"答案：B. 春小麦。解析：东北地区纬度高，热量不足，主要种植春小麦、春玉米、春大豆等，作物一年一熟。"},{"id":"g2_geography_l009_ex02","knowledge_id":"g2_geography_l009","question":"填空题：东北地区包括黑龙江、______、辽宁三省，是中国重要的______基地。","answer":"答案：吉林；重工业。解析：东北地区包括黑龙江、吉林、辽宁三省，是新中国重要的重工业基地。"},{"id":"g2_geography_l009_ex03","knowledge_id":"g2_geography_l009","question":"简答题：简述东北地区的主要特征。","answer":"答案：东北地区主要特征：①位置：东北部，包括黑、吉、辽三省；②地形：以平原（东北平原）、山地（大兴安岭、小兴安岭、长白山）为主；③气候：温带季风气候，冬季寒冷漫长，夏季温暖短促；④农业：以商品粮基地著称，作物一年一熟，主要种植春小麦、春玉米、大豆、甜菜等；⑤工业：以重工业为主，是新中国重要的重工业基地；⑥交通：铁路网密集，公路、航空、管道运输发达；⑦林区：东北林区是中国最大的天然林区。"},{"id":"g2_geography_l009_ex04","knowledge_id":"g2_geography_l009","question":"判断题：东北平原是中国最大的平原，以黑土著称。（  ）","answer":"答案：√。解析：东北平原面积约35万平方千米，是中国最大的平原，土壤以肥沃的黑土著称，是中国重要的商品粮基地。"},{"id":"g2_geography_l009_ex05","knowledge_id":"g2_geography_l009","question":"选择题：东北地区最大的工业城市是（  ）。A.哈尔滨  B.长春  C.沈阳  D.大连","answer":"答案：C. 沈阳。解析：沈阳是东北地区最大的工业城市，机械工业发达，是辽中南工业基地的核心城市之一。"},{"id":"g2_geography_l009_ex06","knowledge_id":"g2_geography_l009","question":"填空题：东北地区的辽中南工业基地以______工业为主，是中国著名的______工业基地。","answer":"答案：重；重。解析：辽中南工业基地以重工业为主，是中国著名的重工业基地。"},{"id":"g2_geography_l009_ex07","knowledge_id":"g2_geography_l009","question":"选择题：东北地区最大的港口是（  ）。A.哈尔滨  B.长春  C.大连  D.沈阳","answer":"答案：C. 大连。解析：大连是东北地区最大的港口，是东北地区对外开放的窗口。"},{"id":"g2_geography_l009_ex08","knowledge_id":"g2_geography_l009","question":"简答题：分析东北地区成为商品粮基地的有利条件。","answer":"答案：有利条件：①地形平坦：东北平原面积广大，地势平坦；②土壤肥沃：黑土广布，土壤肥沃；③气候适宜：温带季风气候，夏季温暖，降水集中，雨热同期；④水源充足：松花江、嫩江、辽河等河流众多，灌溉便利；⑤地广人稀：人均耕地多，粮食商品率高；⑥机械化水平高：耕地集中连片，利于机械化耕作；⑦国家政策支持。"},{"id":"g2_geography_l009_ex09","knowledge_id":"g2_geography_l009","question":"读图题：读东北地区图，说出东北地区的主要粮食作物和经济作物。","answer":"答案：主要粮食作物：①春小麦：主要分布在北部；②春玉米：分布广泛，是东北的主要粮食作物之一；③春大豆：主要分布在东北平原，是东北著名的大豆产区；④水稻：主要分布在东部山区河谷和辽河下游；⑤高粱：分布较广。主要经济作物：甜菜（最大产区之一）、亚麻（主要产区）。"},{"id":"g2_geography_l009_ex10","knowledge_id":"g2_geography_l009","question":"综合题：分析东北老工业基地面临的挑战及振兴措施。","answer":"答案：挑战：①资源枯竭：长期开采导致煤、铁等资源减少；②设备老化：部分工业设备陈旧，技术落后；③产业结构单一：以重工业为主，经济结构不合理；④环境污染严重：工业排放造成严重污染；⑤就业压力大：产业转型带来就业问题。振兴措施：①调整产业结构：发展新兴产业和现代服务业；②技术改造：引进先进技术，改造传统产业；③发展高新技术产业：培育新的经济增长点；④治理环境：加强污染治理，改善生态环境；⑤发展现代农业：发挥粮食基地优势，发展农产品加工业；⑥扩大开放：引进外资和先进技术；⑦政策支持：实施东北老工业基地振兴战略。"},{"id":"g2_geography_l010_ex01","knowledge_id":"g2_geography_l010","question":"选择题：黄土高原最严重的环境问题是（  ）。A.水土流失  B.土地荒漠化  C.沙尘暴  D.酸雨","answer":"答案：A. 水土流失。解析：黄土高原是世界上水土流失最严重的地区之一，年平均每平方千米流失土壤5000-15000吨。"},{"id":"g2_geography_l010_ex02","knowledge_id":"g2_geography_l010","question":"填空题：黄土高原是世界最大的______堆积区，主要分布在______、陕西、甘肃、宁夏等地。","answer":"答案：黄土；山西。解析：黄土高原是世界上最大的黄土堆积区，主要分布在山西、陕西、甘肃、宁夏等地。"},{"id":"g2_geography_l010_ex03","knowledge_id":"g2_geography_l010","question":"简答题：简述黄土高原水土流失严重的原因。","answer":"答案：自然原因：①黄土特性：黄土土质疏松，多孔隙，垂直节理发育，易被流水侵蚀；②植被稀少：植被覆盖率低，对地表的保护作用弱；③降水集中：夏季多暴雨，降水强度大，对地表冲刷强烈；④地形破碎：千沟万壑，坡度大，水流速度快，侵蚀力强。人为原因：①过度开垦：人口增长过快，过度开垦陡坡地；②过度放牧：草场超载，破坏草场；③过度樵采：植被破坏严重；④不合理的工程建设：开矿、修路等破坏地表。"},{"id":"g2_geography_l010_ex04","knowledge_id":"g2_geography_l010","question":"判断题：黄土高原的水土流失是自然原因造成的，与人类活动无关。（  ）","answer":"答案：×。解析：黄土高原水土流失既有自然原因（黄土特性、气候、地形等），也有人为原因（植被破坏、不合理人类活动等），后者加剧了水土流失。"},{"id":"g2_geography_l010_ex05","knowledge_id":"g2_geography_l010","question":"选择题：治理黄土高原水土流失的生物措施是（  ）。A.修筑梯田  B.打坝淤地  C.植树种草  D.修建水库","answer":"答案：C. 植树种草。解析：植树种草是治理水土流失的生物措施，可以增加植被覆盖率，减少地表径流。"},{"id":"g2_geography_l010_ex06","knowledge_id":"g2_geography_l010","question":"填空题：治理黄土高原水土流失的措施中，工程措施包括修筑______和打坝______等。","answer":"答案：水平梯田；淤地。解析：治理黄土高原水土流失的工程措施包括修筑水平梯田、打坝淤地、修建小型水库和塘坝等。"},{"id":"g2_geography_l010_ex07","knowledge_id":"g2_geography_l010","question":"选择题：下列属于治理黄土高原水土流失的农业技术措施是（  ）。A.修筑梯田  B.植树种草  C.深耕改土  D.打坝淤地","answer":"答案：C. 深耕改土。解析：深耕改土是治理黄土高原水土流失的农业技术措施，可以改善土壤结构，提高土壤保水能力。修筑梯田、打坝淤地是工程措施，植树种草是生物措施。"},{"id":"g2_geography_l010_ex08","knowledge_id":"g2_geography_l010","question":"简答题：小流域综合治理包括哪些措施？有什么意义？","answer":"答案：小流域综合治理措施：①工程措施：在缓坡上修筑水平梯田，在沟道里打坝淤地，修建小型水库、塘坝等；②生物措施：植树种草，恢复植被，营造水土保持林；③农业技术措施：深耕改土，轮作套种，秸秆还田，地膜覆盖等。意义：①有效控制水土流失，减少入黄泥沙；②提高土地生产力，发展农村经济；③改善生态环境，促进可持续发展；④是中国治理黄土高原水土流失的成功经验。"},{"id":"g2_geography_l010_ex09","knowledge_id":"g2_geography_l010","question":"读图题：读黄土高原水土保持工程示意图，说出主要的水土保持措施。","answer":"答案：黄土高原主要的水土保持措施：①工程措施：在缓坡修筑水平梯田，在沟道打坝淤地、修建小型水库和塘坝；②生物措施：植树造林、种草，恢复植被，营造水土保持林；③农业技术措施：深耕改土、轮作套种、秸秆还田、地膜覆盖等；④调整农业结构：陡坡地退耕还林还草，过度放牧地区减少牲畜数量。"},{"id":"g2_geography_l010_ex10","knowledge_id":"g2_geography_l010","question":"综合题：分析黄土高原水土保持对黄河治理的重要意义。","answer":"答案：意义：①减少入黄泥沙：黄土高原是黄河泥沙的主要来源，水土保持直接减少入黄泥沙量；②降低黄河含沙量：水土保持降低了黄河含沙量，减缓了下游河床淤积；③减少下游洪涝灾害：减少泥沙淤积可以提高下游河道泄洪能力，减少洪涝灾害；④改善生态环境：水土保持改善了黄土高原的生态环境，减少水土流失对生态系统的破坏；⑤促进区域可持续发展：水土保持兼顾生态、经济、社会效益，促进黄土高原可持续发展；⑥是治黄的根本：治黄的关键是治沙，治沙的根本是保持水土。"},{"id":"g2_geography_l011_ex01","knowledge_id":"g2_geography_l011","question":"选择题：北京的地理坐标大致是（  ）。A.北纬40°、东经116°  B.北纬30°、东经120°  C.北纬35°、东经110°  D.北纬45°、东经115°","answer":"答案：A. 北纬40°、东经116°。解析：北京市的地理坐标大致是北纬40°、东经116°。"},{"id":"g2_geography_l011_ex02","knowledge_id":"g2_geography_l011","question":"填空题：北京位于华北平原的______端，与______、天津相邻。","answer":"答案：西北；河北。解析：北京位于华北平原的西北端，与河北省、天津市相邻。"},{"id":"g2_geography_l011_ex03","knowledge_id":"g2_geography_l011","question":"简答题：简述北京的地理位置。","answer":"答案：北京的地理位置：①经纬度位置：北纬39°56'，东经116°20'，位于北半球、东半球；②海陆位置：距渤海约150千米，属内陆城市；③地形位置：位于华北平原的西北端，太行山、燕山交汇处；④相邻省区：与河北省、天津市相邻；⑤战略位置：地势险要，古代是军事重镇；⑥经济位置：邻近渤海湾经济区，是连接东北、华北、西北的重要枢纽。"},{"id":"g2_geography_l011_ex04","knowledge_id":"g2_geography_l011","question":"判断题：北京是全国的政治、文化、国际交往、科技创新中心。（  ）","answer":"答案：√。解析：北京是中华人民共和国的首都，是全国的政治中心、文化中心、国际交往中心和科技创新中心。"},{"id":"g2_geography_l011_ex05","knowledge_id":"g2_geography_l011","question":"选择题：北京的气候类型是（  ）。A.温带季风气候  B.亚热带季风气候  C.温带大陆性气候  D.地中海气候","answer":"答案：A. 温带季风气候。解析：北京属于温带季风气候，夏季高温多雨，冬季寒冷干燥。"},{"id":"g2_geography_l011_ex06","knowledge_id":"g2_geography_l011","question":"填空题：北京主要的名胜古迹有故宫、______、天坛、______等。","answer":"答案：长城；颐和园。解析：北京主要的名胜古迹：故宫、长城、天坛、颐和园、明十三陵、周口店北京猿人遗址等。"},{"id":"g2_geography_l011_ex07","knowledge_id":"g2_geography_l011","question":"选择题：被称为'中国硅谷'的是（  ）。A.北京大学  B.北京中关村  C.清华大学  D.北京图书馆","answer":"答案：B. 北京中关村。解析：北京中关村科技园区被称为'中国硅谷'，是中国最早、最大的高新技术产业开发区。"},{"id":"g2_geography_l011_ex08","knowledge_id":"g2_geography_l011","question":"简答题：分析北京作为首都的优势条件。","answer":"答案：优势条件：①地理位置：位于华北平原西北端，邻近渤海湾，距海适中，地理位置优越；②地形：地势西北高东南低，依山傍水，地形险要；③气候：温带季风气候，四季分明；④交通：是中国重要的铁路、航空枢纽，多条高速公路、铁路在此交汇；⑤历史：历史悠久，有3000多年的建城史，800多年的建都史；⑥文化：是中国文化中心，高校、科研院所集中；⑦经济：是环渤海经济圈的核心城市，经济发展水平高。"},{"id":"g2_geography_l011_ex09","knowledge_id":"g2_geography_l011","question":"读图题：读北京地形图，说出北京周边的山地名称。","answer":"答案：北京周边的山地：①燕山山脉：位于北京北部，是北京的重要屏障；②太行山余脉：位于北京西部，是北京的重要屏障；③西山：北京西部山地，属太行山余脉；④军都山：北京北部山地，属燕山山脉。北京地形以山地和平原为主，山区约占62%，平原约占38%。"},{"id":"g2_geography_l011_ex10","knowledge_id":"g2_geography_l011","question":"综合题：分析北京城市建设中应注意的问题。","answer":"答案：问题：①人口压力：作为首都，人口大量涌入，人口密度过大；②交通拥堵：人口和车辆众多，交通拥堵严重；③水资源短缺：北京是严重缺水城市，水资源不足；④环境污染：大气、水、噪声污染等问题突出；⑤古都保护：在城市建设中要注意保护历史文化遗存；⑥房价过高：城市发展导致房价过高。措施：①疏解非首都功能：控制人口规模；②发展公共交通：建设地铁、轻轨等；③节约用水：实施南水北调等工程；④治理污染：加强环境治理；⑤保护古都风貌：保护历史文化遗存。"},{"id":"g2_geography_l012_ex01","knowledge_id":"g2_geography_l012","question":"选择题：长江三角洲的核心城市是（  ）。A.上海  B.南京  C.杭州  D.苏州","answer":"答案：A. 上海。解析：长江三角洲城市群的核心城市是上海，是全国最大的经济中心城市。"},{"id":"g2_geography_l012_ex02","knowledge_id":"g2_geography_l012","question":"填空题：长江三角洲主要包括上海、______、杭州、苏州、______等城市。","answer":"答案：南京；无锡。解析：长江三角洲主要包括上海、南京、杭州、苏州、无锡、宁波等城市，是中国经济最发达地区之一。"},{"id":"g2_geography_l012_ex03","knowledge_id":"g2_geography_l012","question":"简答题：简述长江三角洲的地理特征。","answer":"答案：长江三角洲的地理特征：①位置：位于长江入海口，地处中国东部沿海；②地形：以平原为主，地势低平，河网密布；③气候：亚热带季风气候，温暖湿润；④河流：长江、钱塘江等，水资源丰富；⑤农业：'鱼米之乡'，是中国重要的粮食和水产品产区；⑥经济：中国经济最发达地区之一，城镇化水平高；⑦交通：水陆空交通便利，上海港、宁波港是重要港口；⑧工业：沪宁杭工业基地的核心，是中国最大的综合性工业基地。"},{"id":"g2_geography_l012_ex04","knowledge_id":"g2_geography_l012","question":"判断题：长江三角洲是中国经济最发达的地区之一。（  ）","answer":"答案：√。解析：长江三角洲是中国经济最发达的地区之一，是中国最重要的经济中心和制造业基地。"},{"id":"g2_geography_l012_ex05","knowledge_id":"g2_geography_l012","question":"选择题：上海浦东新区开发始于（  ）年。A.1980  B.1990  C.2000  D.2010","answer":"答案：B. 1990。解析：1990年4月，国务院决定开发开放上海浦东新区，标志着中国改革开放进入新阶段。"},{"id":"g2_geography_l012_ex06","knowledge_id":"g2_geography_l012","question":"填空题：上海是中国最大的城市，是中国的经济、______、贸易、______中心。","answer":"答案：金融；航运。解析：上海是中国最大的城市，是中国的经济中心、金融中心、贸易中心、航运中心。"},{"id":"g2_geography_l012_ex07","knowledge_id":"g2_geography_l012","question":"选择题：中国最大的港口是（  ）。A.天津港  B.广州港  C.上海港  D.宁波港","answer":"答案：C. 上海港。解析：上海港是中国最大的港口，也是世界最大的港口之一，货物吞吐量居世界前列。"},{"id":"g2_geography_l012_ex08","knowledge_id":"g2_geography_l012","question":"简答题：分析长江三角洲经济发展的区位优势。","answer":"答案：区位优势：①地理位置：位于中国东部沿海，扼长江入海口，地理位置优越；②交通：海运、河运、铁路、公路、航空综合交通发达；③工业基础：工业基础雄厚，技术水平高；④农业基础：鱼米之乡，农副产品丰富；⑤市场：人口稠密，经济发达，市场广阔；⑥科技：高校和科研院所集中，科技力量雄厚；⑦劳动力：劳动力素质高；⑧对外开放：是中国对外开放的重要窗口，浦东开发、长三角一体化等带来新机遇；⑨政策：国家政策大力支持。"},{"id":"g2_geography_l012_ex09","knowledge_id":"g2_geography_l012","question":"读图题：读长江三角洲示意图，说出长江三角洲的主要城市及其定位。","answer":"答案：主要城市及其定位：①上海：核心城市，国际经济、金融、贸易、航运中心；②南京：江苏省省会，重要工业和交通中心；③杭州：浙江省省会，著名旅游城市和高新技术产业基地；④苏州：重要工业城市，制造业发达；⑤无锡：重要工业城市；⑥宁波：重要港口城市，制造业发达；⑦南通：江苏重要工业城市；⑧常州：江苏重要工业城市。"},{"id":"g2_geography_l012_ex10","knowledge_id":"g2_geography_l012","question":"综合题：分析上海建设国际经济、金融、贸易、航运中心的优势。","answer":"答案：优势：①地理位置：位于中国海岸线中点，长江入海口，地理位置优越；②交通：海运、河运、铁路、公路、航空综合交通发达，是全国性交通枢纽；③经济基础：中国最大的经济中心城市，工业、商业发达；④金融基础：是中国金融中心，有上海证券交易所等众多金融机构；⑤贸易基础：是中国贸易中心，外贸港口城市；⑥科技：高校和科研院所集中，科技力量雄厚；⑦政策：浦东开发、自贸试验区建设等政策支持；⑧国际合作：与世界各地联系密切，国际化程度高。"},{"id":"g2_geography_l013_ex01","knowledge_id":"g2_geography_l013","question":"选择题：珠江三角洲被誉为（  ）。A.祖国的南大门  B.祖国的北大门  C.鱼米之乡  D.塞上江南","answer":"答案：A. 祖国的南大门。解析：珠江三角洲毗邻港澳，对外开放最早，被誉为'祖国的南大门'。"},{"id":"g2_geography_l013_ex02","knowledge_id":"g2_geography_l013","question":"填空题：珠江三角洲位于______省中南部，主要城市有广州、______、珠海等。","answer":"答案：广东；深圳。解析：珠江三角洲位于广东省中南部，主要城市有广州、深圳、珠海、佛山、东莞等。"},{"id":"g2_geography_l013_ex03","knowledge_id":"g2_geography_l013","question":"简答题：简述珠江三角洲的地理特征。","answer":"答案：珠江三角洲的地理特征：①位置：位于广东省中南部，珠江入海口，毗邻港澳；②地形：以平原为主，河网密布；③气候：亚热带季风气候，温暖湿润；④河流：珠江水系，水量丰富；⑤农业：基塘农业独具特色，是重要的农业区；⑥经济：中国经济发达地区之一，外向型经济发达；⑦工业：珠江三角洲工业基地，是中国重要的轻工业基地；⑧交通：海运、河运、铁路、公路、航空综合交通发达。"},{"id":"g2_geography_l013_ex04","knowledge_id":"g2_geography_l013","question":"判断题：珠江三角洲是中国改革开放的前沿。（  ）","answer":"答案：√。解析：珠江三角洲是中国改革开放的前沿，深圳、珠海是中国最早的经济特区。"},{"id":"g2_geography_l013_ex05","knowledge_id":"g2_geography_l013","question":"选择题：珠江三角洲最具特色的农业是（  ）。A.绿洲农业  B.基塘农业  C.梯田农业  D.河谷农业","answer":"答案：B. 基塘农业。解析：珠江三角洲地势低洼，当地农民挖地成塘，堆泥成基，发展基塘农业，是该地区独特的农业景观。"},{"id":"g2_geography_l013_ex06","knowledge_id":"g2_geography_l013","question":"填空题：珠江三角洲与香港、澳门形成的合作模式是'______'，其中珠江三角洲是'______'。","answer":"答案：前店后厂；后厂。解析：珠江三角洲与香港、澳门形成'前店后厂'的合作模式，珠江三角洲是'后厂'（生产基地），香港、澳门是'前店'（销售市场）。"},{"id":"g2_geography_l013_ex07","knowledge_id":"g2_geography_l013","question":"选择题：珠江三角洲位于（  ）省。A.广东  B.广西  C.福建  D.海南","answer":"答案：A. 广东。解析：珠江三角洲位于广东省中南部，珠江入海口。"},{"id":"g2_geography_l013_ex08","knowledge_id":"g2_geography_l013","question":"简答题：分析珠江三角洲成为中国改革开放前沿的优势条件。","answer":"答案：优势条件：①地理位置：位于广东省中南部，珠江入海口，毗邻港澳，邻近东南亚；②交通：海运、河运、铁路、公路、航空综合交通发达；③侨乡：广东是中国著名侨乡，海外华侨众多，便于吸引海外投资；④政策：改革开放的前沿，深圳、珠海是中国最早的经济特区；⑤劳动力：人口稠密，劳动力丰富且相对廉价；⑥市场：邻近港澳和国际市场，便于发展外向型经济；⑦海外关系：与港澳、东南亚等地联系密切，便于引进资金、技术和管理经验。"},{"id":"g2_geography_l013_ex09","knowledge_id":"g2_geography_l013","question":"读图题：读珠江三角洲示意图，说出珠江三角洲的主要城市。","answer":"答案：珠江三角洲主要城市：①广州：广东省省会，华南地区经济、文化中心；②深圳：经济特区，高新技术产业发达；③珠海：经济特区，毗邻澳门；④佛山：重要工业城市，制造业发达；⑤东莞：制造业基地，电子、家具等产业发达；⑥中山：重要工业城市；⑦惠州：重要工业城市；⑧江门：重要工业城市。"},{"id":"g2_geography_l013_ex10","knowledge_id":"g2_geography_l013","question":"综合题：分析珠江三角洲基塘农业的特色。","answer":"答案：基塘农业特色：①起源：珠江三角洲地势低洼，水患频繁，当地农民创造性地开发了基塘农业；②结构：在低洼地挖地成塘，堆泥成基，塘里养鱼，基上种桑（或蔗、果等），形成'桑基鱼塘'等多种形式；③生态：基塘之间形成良性的生态循环：桑叶养蚕，蚕沙喂鱼，塘泥肥基；④效益：实现了经济效益和生态效益的统一，是中国生态农业的典范；⑤意义：充分利用土地资源，提高农业综合效益，保护生态环境。"},{"id":"g2_geography_l014_ex01","knowledge_id":"g2_geography_l014","question":"选择题：新疆维吾尔自治区的地形特征是（  ）。A.三山夹两盆  B.三盆夹两山  C.以平原为主  D.以高原为主","answer":"答案：A. 三山夹两盆。解析：新疆地形特征是'三山夹两盆'，三山是阿尔泰山、天山、昆仑山，两盆是准噶尔盆地、塔里木盆地。"},{"id":"g2_geography_l014_ex02","knowledge_id":"g2_geography_l014","question":"填空题：新疆地形特征是'______'，三山分别是阿尔泰山、______和昆仑山。","answer":"答案：三山夹两盆；天山。解析：新疆地形特征是'三山夹两盆'，三山是阿尔泰山、天山、昆仑山，两盆是准噶尔盆地和塔里木盆地。"},{"id":"g2_geography_l014_ex03","knowledge_id":"g2_geography_l014","question":"简答题：简述新疆自然地理特征。","answer":"答案：新疆自然地理特征：①位置：中国西北部，是面积最大的省区（160多万平方千米）；②地形：'三山夹两盆'，阿尔泰山、天山、昆仑山夹着准噶尔盆地、塔里木盆地；③气候：温带大陆性气候，干旱少雨，蒸发旺盛，夏季高温，冬季寒冷，气温年较差和日较差大；④河流：多为内流河（塔里木河是中国最长内流河），额尔齐斯河是中国唯一注入北冰洋的河流；⑤植被：以荒漠、草原为主；⑥资源：石油、天然气、煤炭等矿产丰富，是西气东输重要源头。"},{"id":"g2_geography_l014_ex04","knowledge_id":"g2_geography_l014","question":"判断题：新疆是中国面积最大的省区。（  ）","answer":"答案：√。解析：新疆维吾尔自治区面积约166万平方千米，是中国面积最大的省区。"},{"id":"g2_geography_l014_ex05","knowledge_id":"g2_geography_l014","question":"选择题：塔里木盆地中部的塔克拉玛干沙漠是中国（  ）。A.最大的沙漠  B.最高的沙漠  C.最绿的沙漠  D.最长的沙漠","answer":"答案：A. 最大的沙漠。解析：塔克拉玛干沙漠面积约33.76万平方千米，是中国最大的沙漠，也是世界第二大流动沙漠。"},{"id":"g2_geography_l014_ex06","knowledge_id":"g2_geography_l014","question":"填空题：新疆发展农业的优势是______充足，______资源丰富，昼夜温差大，有利于农作物的生长和养分积累。","answer":"答案：光照；热量。解析：新疆气候干旱，降水稀少，但光照充足，热量资源丰富，昼夜温差大，有利于农作物的生长和糖分积累，是优质瓜果产地。"},{"id":"g2_geography_l014_ex07","knowledge_id":"g2_geography_l014","question":"选择题：'西气东输'工程的气源主要来自（  ）。A.准噶尔盆地  B.塔里木盆地  C.吐鲁番盆地  D.柴达木盆地","answer":"答案：B. 塔里木盆地。解析：塔里木盆地蕴藏丰富的天然气资源，是'西气东输'工程的主要气源地。"},{"id":"g2_geography_l014_ex08","knowledge_id":"g2_geography_l014","question":"简答题：分析新疆发展绿洲农业的条件。","answer":"答案：绿洲农业条件：①不利条件：深居内陆，气候干旱，降水稀少，水资源不足；②有利条件：①光照充足，太阳辐射强；②热量资源丰富，夏季气温高；③昼夜温差大，有利于糖分积累，瓜果特别甜；④水源来自冰川融水、地下水；⑤地形平坦，土壤较肥沃（灌淤土）。分布：主要分布在水源充足的绿洲地区（如塔里木盆地边缘、准噶尔盆地边缘、天山山麓等）。特色农作物：长绒棉、哈密瓜、葡萄、甜瓜等。"},{"id":"g2_geography_l014_ex09","knowledge_id":"g2_geography_l014","question":"读图题：读新疆地形图，说出新疆主要的地形区。","answer":"答案：新疆主要地形区：①阿尔泰山脉：位于新疆北部；②准噶尔盆地：位于新疆北部，夹在阿尔泰山和天山之间；③天山山脉：横亘新疆中部；④塔里木盆地：位于新疆南部，夹在天山和昆仑山之间；⑤昆仑山脉：位于新疆南部；⑥吐鲁番盆地：天山东部的山间盆地，是中国陆地最低处（艾丁湖低于海平面154米）。"},{"id":"g2_geography_l014_ex10","knowledge_id":"g2_geography_l014","question":"综合题：分析新疆瓜果特别甜的原因。","answer":"答案：原因：①气候干旱：深居内陆，远离海洋，降水稀少，晴天多，光照充足；②光照强：太阳辐射强，光合作用强，农作物制造有机质多；③热量充足：夏季气温高，积温充足；④昼夜温差大：白天气温高，光合作用旺盛，制造有机质多；夜晚气温低，呼吸作用弱，消耗有机质少，使糖分大量积累。所以新疆瓜果特别甜，是著名的瓜果之乡。"},{"id":"g2_geography_l015_ex01","knowledge_id":"g2_geography_l015","question":"选择题：内蒙古高原主要的牲畜是（  ）。A.三河牛、三河马  B.牦牛、藏绵羊  C.细毛羊  D.奶牛","answer":"答案：A. 三河牛、三河马。解析：内蒙古高原呼伦贝尔草原的优良畜种是三河牛、三河马，是中国著名的优良畜种。"},{"id":"g2_geography_l015_ex02","knowledge_id":"g2_geography_l015","question":"填空题：内蒙古高原是中国第______大高原，地势坦荡，草原广布，是中国重要的______基地。","answer":"答案：二；畜牧业。解析：内蒙古高原是中国第二大高原，地势坦荡，草原广布，是中国重要的畜牧业基地。"},{"id":"g2_geography_l015_ex03","knowledge_id":"g2_geography_l015","question":"简答题：简述内蒙古高原的自然和人文地理特征。","answer":"答案：内蒙古高原地理特征：①位置：中国北部，包括内蒙古自治区大部分；②地形：高原地形，地势坦荡开阔，是中国第二大高原；③气候：温带大陆性气候，降水较少，从东向西降水递减；④植被：自东向西由温带草原→荒漠草原→荒漠过渡；⑤河流：多为内流河，河流稀少；⑥农业：以畜牧业为主，是中国重要畜牧业基地（呼伦贝尔草原、锡林郭勒草原等）；⑦民族：蒙古族聚居区，蒙古族风情浓郁；⑧矿产：煤、铁、稀土等矿产资源丰富（白云鄂博稀土矿）。"},{"id":"g2_geography_l015_ex04","knowledge_id":"g2_geography_l015","question":"判断题：内蒙古高原是中国重要的畜牧业基地。（  ）","answer":"答案：√。解析：内蒙古高原草原广布，是中国重要的畜牧业基地，主要畜种有三河牛、三河马、内蒙古细毛羊等。"},{"id":"g2_geography_l015_ex05","knowledge_id":"g2_geography_l015","question":"选择题：内蒙古高原最东部的草原类型是（  ）。A.荒漠  B.荒漠草原  C.温带草原  D.森林","answer":"答案：C. 温带草原。解析：内蒙古高原自东向西降水量递减，依次出现温带草原→荒漠草原→荒漠，呼伦贝尔草原是中国保存最完好的温带草原。"},{"id":"g2_geography_l015_ex06","knowledge_id":"g2_geography_l015","question":"填空题：内蒙古高原主要的优良畜种有'______'和'______'。","answer":"答案：三河牛；三河马。解析：内蒙古呼伦贝尔草原的优良畜种有三河牛、三河马，是著名的家畜品种。"},{"id":"g2_geography_l015_ex07","knowledge_id":"g2_geography_l015","question":"选择题：内蒙古白云鄂博的（  ）矿储量居世界前列。A.煤  B.铁  C.稀土  D.石油","answer":"答案：C. 稀土。解析：白云鄂博是中国重要的稀土矿产地，稀土储量居世界前列。"},{"id":"g2_geography_l015_ex08","knowledge_id":"g2_geography_l015","question":"简答题：分析内蒙古高原从东向西自然景观的变化及原因。","answer":"答案：变化：从东向西依次为温带草原→荒漠草原→荒漠。原因：内蒙古高原东西跨度大，距海远近不同，降水量自东向西递减：①东部距海较近，受夏季风影响大，降水较多（约400mm以上），形成温带草原（呼伦贝尔草原、锡林郭勒草原等）；②中部降水中等（约200-400mm），形成荒漠草原；③西部深居内陆，距海遥远，降水稀少（200mm以下），形成荒漠。这种变化体现了从沿海到内陆的地域分异规律。"},{"id":"g2_geography_l015_ex09","knowledge_id":"g2_geography_l015","question":"读图题：读内蒙古高原地形图，说出内蒙古高原主要的地形区。","answer":"答案：内蒙古高原主要地形区：①呼伦贝尔高原（东部，保存最完好的温带草原）；②锡林郭勒高原（中部）；③乌兰察布高原（西部，荒漠草原）；④巴彦淖尔高原（西部，荒漠）；⑤阴山山脉（中部，南北地理分界）；⑥河套平原（南部，黄河冲积，'塞上江南'）；⑦鄂尔多斯高原（南部）。"},{"id":"g2_geography_l015_ex10","knowledge_id":"g2_geography_l015","question":"综合题：分析内蒙古高原发展畜牧业的优势和劣势。","answer":"答案：优势：①草原广布：地势坦荡，草原广阔，牧草资源丰富；②优良畜种：三河牛、三河马、内蒙古细毛羊等；③经验丰富：蒙古族等少数民族长期从事畜牧业，经验丰富；④市场广阔：邻近京津等大城市，市场需求大。劣势：①气候干旱：降水少，牧草产量不稳定；②生态脆弱：过度放牧易造成草场退化和土地荒漠化；③自然灾害：白灾（雪灾）、黑灾（旱灾）等影响牧业；④交通不便：地广人稀，交通不便。"},{"id":"g2_geography_l016_ex01","knowledge_id":"g2_geography_l016","question":"选择题：青藏地区最丰富的能源是（  ）。A.煤炭  B.石油  C.太阳能  D.天然气","answer":"答案：C. 太阳能。解析：青藏高原海拔高，空气稀薄，太阳辐射强，是中国太阳能资源最丰富的地区之一。"},{"id":"g2_geography_l016_ex02","knowledge_id":"g2_geography_l016","question":"填空题：青藏地区主要的能源有太阳能、______能、______能等。","answer":"答案：水；地热。解析：青藏地区能源资源丰富，主要有太阳能、水能、地热能等清洁能源。"},{"id":"g2_geography_l016_ex03","knowledge_id":"g2_geography_l016","question":"简答题：简述青藏地区丰富的能源资源。","answer":"答案：青藏地区能源资源：①太阳能：海拔高，空气稀薄，太阳辐射强，是中国太阳能资源最丰富的地区之一；②地热能：位于亚欧板块与印度洋板块交界处，地热资源丰富，羊八井是中国著名的地热电站；③水能：河流众多，落差大，水能资源丰富；④风能：高原地区风力大，风能资源丰富；⑤清洁能源占比大，是理想的清洁能源宝库。"},{"id":"g2_geography_l016_ex04","knowledge_id":"g2_geography_l016","question":"判断题：青藏地区能源资源丰富，主要以煤炭为主。（  ）","answer":"答案：×。解析：青藏地区能源资源丰富，但主要以太阳能、水能、地热能等清洁能源为主，煤炭资源相对较少。"},{"id":"g2_geography_l016_ex05","knowledge_id":"g2_geography_l016","question":"选择题：青藏地区著名的地热电站是（  ）。A.羊八井  B.龙羊峡  C.葛洲坝  D.三峡","answer":"答案：A. 羊八井。解析：羊八井地热电站位于西藏自治区，是中国最早建成的地热发电站，也是世界最大的地热发电站之一。"},{"id":"g2_geography_l016_ex06","knowledge_id":"g2_geography_l016","question":"填空题：青藏地区是亚洲许多大江大河的发源地，被誉为'______'，是中国面积最大、海拔最高的______区。","answer":"答案：亚洲水塔；自然保护。解析：青藏地区是亚洲众多大江大河的发源地，被誉为'亚洲水塔'，也是中国面积最大、海拔最高的自然保护区域。"},{"id":"g2_geography_l016_ex07","knowledge_id":"g2_geography_l016","question":"选择题：青藏地区主要的农业类型是（  ）。A.水田农业  B.旱地农业  C.高寒畜牧业和河谷农业  D.渔业","answer":"答案：C. 高寒畜牧业和河谷农业。解析：青藏地区高寒气候不利于种植业，主要以高寒畜牧业为主，在海拔较低的河谷地区发展种植业（青稞、小麦等）。"},{"id":"g2_geography_l016_ex08","knowledge_id":"g2_geography_l016","question":"简答题：分析青藏铁路建设的意义。","answer":"答案：青藏铁路建设的意义：①结束西藏不通铁路的历史，方便了西藏人民出行；②促进西藏经济发展，加快西藏现代化进程；③加强西藏与内地的联系，促进民族团结；④巩固国防，增强西藏国防力量；⑤带动西藏旅游业发展；⑥促进西藏资源开发；⑦解决多年冻土、高寒缺氧等世界性难题，体现中国工程技术水平。"},{"id":"g2_geography_l016_ex09","knowledge_id":"g2_geography_l016","question":"读图题：读青藏地区能源分布图，说出青藏地区主要能源分布。","answer":"答案：青藏地区主要能源分布：①太阳能：分布广泛，藏北高原、柴达木盆地等最为丰富；②水能：集中分布在雅鲁藏布江大拐弯处、长江上游、澜沧江、怒江等河流；③地热能：集中分布在雅鲁藏布江谷地（羊八井等）；④风能：集中分布在藏北高原。"},{"id":"g2_geography_l016_ex10","knowledge_id":"g2_geography_l016","question":"综合题：分析青藏地区发展清洁能源的条件。","answer":"答案：发展条件：①能源资源丰富：太阳能、水能、地热能等清洁能源资源储量大；②开发难度大：地形复杂，生态环境脆弱，开发难度大；③市场需求：周边地区能源需求大，'西电东送'项目带动清洁能源开发；④政策支持：国家高度重视清洁能源开发；⑤生态保护：清洁能源开发有利于保护青藏地区脆弱的生态环境；⑥技术进步：清洁能源开发技术不断进步，开发成本降低。"},{"id":"g2_geography_l017_ex01","knowledge_id":"g2_geography_l017","question":"选择题：台湾省包括（  ）。A.台湾岛、澎湖列岛、钓鱼岛  B.台湾岛、澎湖列岛、金门、马祖  C.台湾岛、澎湖列岛、舟山群岛  D.台湾岛、钓鱼岛、崇明岛","answer":"答案：A、B。解析：台湾省包括台湾岛、澎湖列岛、钓鱼岛等众多岛屿，金门、马祖是台湾当局控制的部分。"},{"id":"g2_geography_l017_ex02","knowledge_id":"g2_geography_l017","question":"填空题：台湾岛是中国第______大岛，东临______洋，西隔台湾海峡与福建省相望。","answer":"答案：一；太平。解析：台湾岛是中国第一大岛，东临太平洋，西隔台湾海峡与福建省相望。"},{"id":"g2_geography_l017_ex03","knowledge_id":"g2_geography_l017","question":"简答题：简述台湾省的地理特征。","answer":"答案：台湾省地理特征：①位置：位于中国东南海域，东临太平洋，西隔台湾海峡与福建省相望；②组成：由台湾岛、澎湖列岛、钓鱼岛等200多个岛屿组成；③地形：以山地为主，中央山脉纵贯南北，平原分布在西部沿海；④气候：亚热带和热带季风气候，温暖湿润；⑤河流：河流短小，水流湍急，水能丰富；⑥农业：水稻种植普遍，森林资源丰富（樟脑产量居世界首位）；⑦经济：经济发达，号称'亚洲四小龙'之一；⑧矿产：金、铜、煤、石油等矿产丰富。"},{"id":"g2_geography_l017_ex04","knowledge_id":"g2_geography_l017","question":"判断题：台湾岛是中国面积最大的岛屿。（  ）","answer":"答案：√。解析：台湾岛面积约3.6万平方千米，是中国面积最大的岛屿。"},{"id":"g2_geography_l017_ex05","knowledge_id":"g2_geography_l017","question":"选择题：台湾岛的主要城市是（  ）。A.台北  B.高雄  C.台中  D.以上都是","answer":"答案：D. 以上都是。解析：台湾岛的主要城市有台北、高雄、台中、台南、基隆等。"},{"id":"g2_geography_l017_ex06","knowledge_id":"g2_geography_l017","question":"填空题：台湾岛森林资源丰富，盛产______，产量居世界首位。","answer":"答案：樟脑。解析：台湾岛樟树众多，是世界上著名的樟脑产地，产量居世界首位。"},{"id":"g2_geography_l017_ex07","knowledge_id":"g2_geography_l017","question":"选择题：台湾岛物产丰富，素有（  ）之称。A.水果之乡  B.鱼米之乡  C.海上粮仓  D.以上都是","answer":"答案：D. 以上都是。解析：台湾岛物产丰富，盛产水稻、甘蔗、热带水果，有'水果之乡'、'鱼米之乡'、'海上粮仓'等美称。"},{"id":"g2_geography_l017_ex08","knowledge_id":"g2_geography_l017","question":"简答题：分析台湾省经济发展的特点。","answer":"答案：经济发展特点：①经济发达：是中国经济最发达的省份之一，号称'亚洲四小龙'；②以加工贸易为主：发展加工出口工业，进出口贸易在经济中占重要地位；③工业部门齐全：电子信息、精密制造、石化、纺织、食品等工业发达；④高新技术产业发达：尤其是电子信息产业在世界占有重要地位；⑤农业特色鲜明：水稻、甘蔗、热带水果、茶叶等农产品丰富；⑥旅游业发达：日月潭、阿里山、玉山等景点吸引了大量游客；⑦服务业占主导：第三产业在经济中占重要地位。"},{"id":"g2_geography_l017_ex09","knowledge_id":"g2_geography_l017","question":"读图题：读台湾省地图，说出台湾省的主要城市。","answer":"答案：台湾省主要城市：①台北：台湾省最大城市，政治、经济、文化中心；②高雄：台湾省第二大城市，南部最大的工业中心和港口；③台中：台湾省第三大城市，中部经济、文化中心；④台南：台湾省最早开发的城市，著名历史古城；⑤基隆：重要港口城市；⑥新竹：高新技术产业园区所在地。"},{"id":"g2_geography_l017_ex10","knowledge_id":"g2_geography_l017","question":"综合题：分析台湾省自然条件对其经济发展的影响。","answer":"答案：自然条件：①气候：亚热带和热带季风气候，温暖湿润，雨热同期，适宜农业发展；②地形：山地多，平原少，但西部平原是主要农业区；③河流：河流短小流急，水能资源丰富；④森林：森林资源丰富，特别是樟树等；⑤矿产：金、铜、煤等矿产资源较丰富；⑥海洋：四面环海，渔业资源丰富，海运便利；⑦地震：位于板块交界处，地震等地质灾害多发。影响：①有利：丰富的物产为经济发展提供物质基础，优良港口有利于发展对外贸易；②不利：地震频发影响经济建设和人民生活。"},{"id":"g2_geography_l018_ex01","knowledge_id":"g2_geography_l018","question":"选择题：新疆瓜果特别甜的主要原因是（  ）。A.夏季高温多雨  B.光照充足，昼夜温差大  C.土壤肥沃  D.水源充足","answer":"答案：B. 光照充足，昼夜温差大。解析：新疆深居内陆，气候干旱，光照充足，昼夜温差大，有利于糖分积累，所以瓜果特别甜。"},{"id":"g2_geography_l018_ex02","knowledge_id":"g2_geography_l018","question":"填空题：西气东输工程把______盆地的天然气输送到上海等东部地区。","answer":"答案：塔里木。解析：西气东输工程以新疆塔里木盆地为主气源，将天然气输送到上海等长江三角洲地区。"},{"id":"g2_geography_l018_ex03","knowledge_id":"g2_geography_l018","question":"简答题：简述西气东输工程的意义。","answer":"答案：西气东输工程的意义：①缓解东部能源紧张：将西部丰富的天然气资源输送到能源短缺的东部地区，缓解东部能源紧张状况；②优化能源结构：增加清洁能源比重，减少煤炭使用，改善东部地区大气环境；③带动西部经济发展：促进西部资源的开发利用，带动西部地区经济发展；④增加就业：工程建设、运营带动相关产业，提供就业机会；⑤加强东西部联系：促进东西部经济合作和共同发展；⑥改善生态环境：减少二氧化碳和污染物排放，保护环境。"},{"id":"g2_geography_l018_ex04","knowledge_id":"g2_geography_l018","question":"判断题：西气东输工程的实施有利于东西部地区协调发展。（  ）","answer":"答案：√。解析：西气东输工程将西部资源优势转化为经济优势，同时缓解东部能源紧张，促进了东西部协调发展。"},{"id":"g2_geography_l018_ex05","knowledge_id":"g2_geography_l018","question":"选择题：西气东输一线工程的起点是（  ）。A.塔里木盆地  B.准噶尔盆地  C.吐鲁番盆地  D.柴达木盆地","answer":"答案：A. 塔里木盆地。解析：西气东输一线工程以新疆塔里木盆地的轮南为起点。"},{"id":"g2_geography_l018_ex06","knowledge_id":"g2_geography_l018","question":"填空题：西气东输工程经过的主要地形区有塔里木盆地、______高原、黄土高原、______平原等。","answer":"答案：内蒙古；长江中下游。解析：西气东输工程沿线经过塔里木盆地、内蒙古高原、黄土高原、华北平原、长江中下游平原等。"},{"id":"g2_geography_l018_ex07","knowledge_id":"g2_geography_l018","question":"选择题：西气东输工程终点是（  ）。A.上海  B.广州  C.南京  D.杭州","answer":"答案：A. 上海。解析：西气东输一线工程终点是上海，二线、三线工程扩展到广州等城市。"},{"id":"g2_geography_l018_ex08","knowledge_id":"g2_geography_l018","question":"简答题：分析西气东输工程沿线地理环境差异。","answer":"答案：沿线地理环境差异：①塔里木盆地：干旱气候，沙漠广布；②河西走廊：气候干旱，绿洲农业；③内蒙古高原：温带草原，过渡地形；④黄土高原：水土流失严重，地形破碎；⑤太行山：地势起伏大；⑥华北平原：地势低平，农业发达；⑦长江中下游平原：水网密布，城镇密集；跨越了多种地形和气候区，工程难度大。"},{"id":"g2_geography_l018_ex09","knowledge_id":"g2_geography_l018","question":"读图题：读西气东输工程线路图，说出工程经过的主要省级行政区。","answer":"答案：西气东输一线工程经过的主要省级行政区：新疆→甘肃→宁夏→陕西→山西→河南→安徽→江苏→上海；二线工程扩展到广东等地。沿线地形复杂，跨越多种自然区域。"},{"id":"g2_geography_l018_ex10","knowledge_id":"g2_geography_l018","question":"综合题：分析西气东输工程对东西部地区的不同影响。","answer":"答案：对西部的影响：①资源优势转化为经济优势，促进西部地区经济发展；②带动相关产业（管道制造、基础设施建设等）发展；③增加就业机会；④推动城镇化进程；⑤对环境可能造成一定影响。对东部的影响：①缓解能源紧张，满足经济和生活需要；②优化能源结构，增加清洁能源比重；③改善大气环境（减少煤炭使用）；④带动相关产业发展；⑤促进基础设施建设；⑥带动产业升级和经济发展。"},{"id":"g2_geography_l019_ex01","knowledge_id":"g2_geography_l019","question":"选择题：长株潭城市群中的'长株潭'指的是（  ）三个城市。A.长沙、株洲、湘潭  B.长江、株州、湘潭  C.长沙、株州、湘潭  D.长沙、珠江、湘潭","answer":"答案：C. 长沙、株洲、湘潭。解析：长株潭城市群是湖南省的三个中心城市，以长沙、株洲、湘潭为核心。"},{"id":"g2_geography_l019_ex02","knowledge_id":"g2_geography_l019","question":"填空题：长株潭城市群是以长沙、______、湘潭为核心的城市群，位于______省。","answer":"答案：株洲；湖南。解析：长株潭城市群位于湖南省，以长沙、株洲、湘潭为核心，是中国重要的城市群之一。"},{"id":"g2_geography_l019_ex03","knowledge_id":"g2_geography_l019","question":"简答题：简述长株潭城市群的特征。","answer":"答案：长株潭城市群特征：①位置：湖南省中东部，湘江沿岸；②组成：以长沙（省会）、株洲、湘潭三市为核心；③面积：约2.8万平方千米；④人口：约1500万；⑤经济：是中国重要的装备制造业基地、原材料基地、高新技术产业基地；⑥地位：是长江中游城市群的重要组成部分，是湖南经济、文化、政治中心；⑦文化：历史文化名城，岳麓山、橘子洲等著名景点。"},{"id":"g2_geography_l019_ex04","knowledge_id":"g2_geography_l019","question":"判断题：长株潭城市群是中国重要的城市群之一。（  ）","answer":"答案：√。解析：长株潭城市群是中国重要的城市群之一，是长江中游城市群的重要组成部分。"},{"id":"g2_geography_l019_ex05","knowledge_id":"g2_geography_l019","question":"选择题：长株潭城市群所在省是（  ）。A.湖南  B.湖北  C.江西  D.安徽","answer":"答案：A. 湖南。解析：长株潭城市群位于湖南省。"},{"id":"g2_geography_l019_ex06","knowledge_id":"g2_geography_l019","question":"填空题：长株潭城市群中，______是湖南省的省会，______是中国重要的铁路枢纽。","answer":"答案：长沙；株洲。解析：长沙是湖南省省会，株洲是中国重要的铁路枢纽（京广线、浙赣线、湘黔线交汇）。"},{"id":"g2_geography_l019_ex07","knowledge_id":"g2_geography_l019","question":"选择题：长株潭城市群的核心产业是（  ）。A.农业  B.旅游业  C.装备制造业  D.渔业","answer":"答案：C. 装备制造业。解析：长株潭城市群是中国重要的装备制造业基地，特别是轨道交通、工程机械、汽车等装备制造业发达。"},{"id":"g2_geography_l019_ex08","knowledge_id":"g2_geography_l019","question":"简答题：长株潭城市群发展一体化有什么意义？","answer":"答案：意义：①优化资源配置：实现城市间优势互补，优化资源配置；②提高经济效率：避免重复建设，提高经济效率；③增强竞争实力：形成城市集群，增强对外竞争实力；④促进产业升级：促进产业结构调整和升级；⑤改善基础设施：促进基础设施共建共享；⑥保护生态环境：协同治理环境问题；⑦推动区域协调发展：带动湖南乃至长江中游地区发展；⑧方便人民生活：交通、通讯等基础设施改善，方便人民生活。"},{"id":"g2_geography_l019_ex09","knowledge_id":"g2_geography_l019","question":"读图题：读长株潭城市群示意图，说出三个核心城市的相对位置。","answer":"答案：长株潭城市群三市相对位置：长沙位于北部，株洲位于南部，湘潭位于西部，三市沿湘江呈'品'字形分布，相距很近（约50千米内），有'长株潭一体化'之称。"},{"id":"g2_geography_l019_ex10","knowledge_id":"g2_geography_l019","question":"综合题：分析长株潭城市群发展的区位条件。","answer":"答案：区位条件：①地理位置：位于长江中游南岸，湘江下游，地理位置适中；②交通：京广线、浙赣线、湘黔线等铁路在此交汇，京珠高速等公路发达，湘江航运便利；③资源：湖南是有色金属之乡，矿产资源丰富；④工业基础：是中国重要的老工业基地，工业基础雄厚；⑤农业基础：洞庭湖平原农业发达，是'鱼米之乡'；⑥科技：高校和科研院所集中，科技力量较强；⑦政策：国家支持中部崛起，长株潭城市群是两型社会建设综合配套改革试验区。"},{"id":"g2_geography_l020_ex01","knowledge_id":"g2_geography_l020","question":"选择题：晋陕内蒙古煤炭基地包括的省区是（  ）。A.山西、陕西、内蒙古  B.河北、山东、河南  C.江苏、安徽、浙江  D.广东、广西、福建","answer":"答案：A. 山西、陕西、内蒙古。解析：晋陕内蒙古煤炭基地是中国重要的能源基地，包括山西、陕西、内蒙古三省区。"},{"id":"g2_geography_l020_ex02","knowledge_id":"g2_geography_l020","question":"填空题：晋陕内蒙古煤炭基地是中国最大的______基地，煤炭储量占全国的______。","answer":"答案：煤炭；约2/3。解析：晋陕内蒙古煤炭基地是中国最大的煤炭能源基地，煤炭储量约占全国的2/3。"},{"id":"g2_geography_l020_ex03","knowledge_id":"g2_geography_l020","question":"简答题：简述晋陕内蒙古煤炭基地的概况。","answer":"答案：晋陕内蒙古煤炭基地概况：①位置：包括山西、陕西、内蒙古三省区；②资源：是中国煤炭资源最丰富的地区，探明储量占全国近2/3；③主要煤田：山西的大同、阳泉、西山，陕西的神府，内蒙古的东胜、准格尔等；④地位：是中国最大的煤炭能源基地，是西煤东运、北煤南运的重要源头；⑤外运通道：通过大秦线、神黄线、焦兖日线等铁路将煤炭运到东部沿海港口，再转运到南方。"},{"id":"g2_geography_l020_ex04","knowledge_id":"g2_geography_l020","question":"判断题：山西是中国煤炭资源最丰富的省份。（  ）","answer":"答案：√。解析：山西省是中国煤炭资源最丰富的省份，被誉为'煤海'，是中国重要的能源基地。"},{"id":"g2_geography_l020_ex05","knowledge_id":"g2_geography_l020","question":"选择题：晋陕内蒙古煤炭基地外运的主要通道是（  ）。A.铁路  B.公路  C.水路  D.管道","answer":"答案：A. 铁路。解析：晋陕内蒙古煤炭基地外运主要依靠铁路（大秦线、神黄线等），将煤炭运到秦皇岛、黄骅等港口。"},{"id":"g2_geography_l020_ex06","knowledge_id":"g2_geography_l020","question":"填空题：晋陕内蒙古煤炭基地建设西电东送的电源主要利用______发电，将电力输送到______地区。","answer":"答案：煤炭；华北。解析：晋陕内蒙古煤炭基地建设坑口电站，将煤炭转化为电力，通过高压输电线路输送到华北等地区。"},{"id":"g2_geography_l020_ex07","knowledge_id":"g2_geography_l020","question":"选择题：西煤东运的重要出海港口是（  ）。A.大连港  B.秦皇岛港  C.天津港  D.连云港","answer":"答案：B. 秦皇岛港。解析：秦皇岛港是西煤东运的重要出海港口，主要承担晋陕内蒙古煤炭的外运任务。"},{"id":"g2_geography_l020_ex08","knowledge_id":"g2_geography_l020","question":"简答题：分析晋陕内蒙古煤炭基地建设的条件。","answer":"答案：建设条件：①资源优势：煤炭资源储量丰富，品质优良，开采条件好；②地理位置：靠近东部消费市场，距离适中；③交通基础：铁路、公路、港口等交通条件较好；④市场条件：东部地区经济发达，能源需求大；⑤技术条件：煤炭开采和加工技术成熟；⑥政策支持：国家能源安全战略支持；⑦水资源：相对较紧张，制约基地发展。"},{"id":"g2_geography_l020_ex09","knowledge_id":"g2_geography_l020","question":"读图题：读晋陕内蒙古煤炭基地分布图，说出主要煤田。","answer":"答案：晋陕内蒙古煤炭基地主要煤田：①山西：大同煤田、阳泉煤田、西山煤田、古交煤田、霍州煤田等；②陕西：神府煤田（神木、府谷）；③内蒙古：东胜煤田、准格尔煤田、霍林河煤田等。这些煤田是中国煤炭资源最集中的地区。"},{"id":"g2_geography_l020_ex10","knowledge_id":"g2_geography_l020","question":"综合题：分析晋陕内蒙古煤炭基地开发对当地经济的影响。","answer":"答案：对当地经济的影响：①积极影响：①促进资源优势转化为经济优势，带动地方经济发展；②带动相关产业（运输、电力、化工、建材等）发展；③增加就业机会，提高居民收入；④推动基础设施建设；⑤加快城镇化进程；⑥增加财政收入。②消极影响：①加重水资源紧张；②加剧生态环境破坏（土地塌陷、水土流失等）；③产业结构单一，对煤炭产业依赖度过大；④环境污染较重。"},{"id":"g2_geography_l021_ex01","knowledge_id":"g2_geography_l021","question":"选择题：中国南北方分界线的依据不包括（  ）。A.1月平均气温0℃等温线  B.年降水量800mm等值线  C.亚热带与暖温带的分界  D.长江","answer":"答案：D. 长江。解析：秦岭-淮河线是中国南北方分界线，其依据包括1月0℃等温线、800mm年等降水量线、亚热带与暖温带分界等，与长江无关。"},{"id":"g2_geography_l021_ex02","knowledge_id":"g2_geography_l021","question":"填空题：秦岭-淮河一线南北的差异显著：北方的耕地以______为主，南方的耕地以______为主。","answer":"答案：旱地；水田。解析：秦岭-淮河以北以旱地为主（种植小麦），以南以水田为主（种植水稻）。"},{"id":"g2_geography_l021_ex03","knowledge_id":"g2_geography_l021","question":"简答题：简述中国四大地理区域的主要农业类型。","answer":"答案：四大地理区域的主要农业类型：①北方地区：以旱地农业为主，主要种植小麦、玉米、大豆、棉花、花生等，一年一熟或两年三熟；②南方地区：以水田农业为主，主要种植水稻、油菜、甘蔗等，一年两熟到三熟；③西北地区：以畜牧业为主（草原放牧业），种植业为灌溉农业（绿洲农业），主要种植小麦、棉花、瓜果等；④青藏地区：以高寒畜牧业为主（牦牛、藏绵羊等），种植业为河谷农业（青稞、小麦等）。"},{"id":"g2_geography_l021_ex04","knowledge_id":"g2_geography_l021","question":"判断题：秦岭-淮河是中国南北方分界线。（  ）","answer":"答案：√。解析：秦岭-淮河是中国重要的地理分界线，是中国南北方分界线。"},{"id":"g2_geography_l021_ex05","knowledge_id":"g2_geography_l021","question":"选择题：秦岭-淮河以南的气候类型主要是（  ）。A.温带季风气候  B.亚热带季风气候  C.温带大陆性气候  D.高原山地气候","answer":"答案：B. 亚热带季风气候。解析：秦岭-淮河以南属于亚热带季风气候，温暖湿润，雨热同期。"},{"id":"g2_geography_l021_ex06","knowledge_id":"g2_geography_l021","question":"填空题：北方地区的主要粮食作物是______，南方地区的主要粮食作物是______。","answer":"答案：小麦；水稻。解析：北方以旱地为主，主要粮食作物是小麦（冬小麦为主）；南方以水田为主，主要粮食作物是水稻。"},{"id":"g2_geography_l021_ex07","knowledge_id":"g2_geography_l021","question":"选择题：四大地理区域中，跨地势三级阶梯的是（  ）。A.北方地区  B.南方地区  C.西北地区  D.青藏地区","answer":"答案：B. 南方地区。解析：南方地区跨地势三级阶梯（青藏高原部分为第一级，四川盆地为第二级，长江中下游平原为第三级）。"},{"id":"g2_geography_l021_ex08","knowledge_id":"g2_geography_l021","question":"简答题：分析中国四大地理区域农业发展的差异。","answer":"答案：农业发展差异：①北方地区：以旱地农业为主，作物以小麦、玉米为主，一年一熟或两年三熟，主要面临春旱、水资源不足问题；②南方地区：以水田农业为主，作物以水稻为主，一年两熟到三熟，主要面临洪涝、台风等灾害；③西北地区：以畜牧业为主，种植业为绿洲农业，主要面临干旱缺水、风沙等问题；④青藏地区：以高寒畜牧业为主，河谷有种植业，主要面临热量不足、生态脆弱问题。这种差异主要是由各地区不同的自然条件决定的，体现了因地制宜的原则。"},{"id":"g2_geography_l021_ex09","knowledge_id":"g2_geography_l021","question":"读图题：读中国四大地理区域分布图，指出四大地理区域的分界线。","answer":"答案：四大地理区域分界线：①北方地区与南方地区：秦岭-淮河；②北方地区与西北地区：大兴安岭-阴山-贺兰山；③青藏地区与其他地区：昆仑山-阿尔金山-祁连山-横断山脉。"},{"id":"g2_geography_l021_ex10","knowledge_id":"g2_geography_l021","question":"综合题：分析中国四大地理区域气候差异及其对农业的影响。","answer":"答案：气候差异：①北方地区：温带季风气候，夏季高温多雨，冬季寒冷干燥，年降水量400-800mm；②南方地区：亚热带和热带季风气候，温暖湿润，降水丰富，年降水量800mm以上；③西北地区：温带大陆性气候，干旱少雨，蒸发旺盛，年降水量多在400mm以下；④青藏地区：高原山地气候，高寒缺氧，降水较少。对农业的影响：①北方：适宜种植小麦、玉米等温带作物；②南方：适宜种植水稻等喜温喜湿作物；③西北：以畜牧业为主，绿洲发展灌溉农业；④青藏：以高寒畜牧业为主，河谷发展种植业。"},{"id":"g2_geography_l022_ex01","knowledge_id":"g2_geography_l022","question":"选择题：北方地区主要的工业部门是（  ）。A.钢铁、机械、化工  B.电子信息、生物医药  C.造船、海洋化工  D.金融、贸易","answer":"答案：A. 钢铁、机械、化工。解析：北方地区是中国重要的重工业基地，钢铁、机械、化工等重工业发达。"},{"id":"g2_geography_l022_ex02","knowledge_id":"g2_geography_l022","question":"填空题：北方地区最大的工业基地是______工业基地，位于______市。","answer":"答案：辽中南；沈阳。解析：辽中南工业基地是北方地区最大的工业基地，以沈阳为中心。"},{"id":"g2_geography_l022_ex03","knowledge_id":"g2_geography_l022","question":"简答题：简述北方地区工业发展的特征。","answer":"答案：北方地区工业发展特征：①地位：是中国重要的工业基地，特别是重工业发达；②主要工业基地：辽中南工业基地、京津唐工业基地；③主要工业部门：钢铁（鞍山、宝钢）、机械（沈阳、北京）、化工（大庆、吉林）、煤炭（山西、内蒙古）、石油（辽河、华北油田）、汽车（北京、长春）等；④优势：矿产资源丰富（煤、铁、石油），工业基础雄厚，交通便利；⑤劣势：水资源紧张，环境污染较重，产业结构有待升级。"},{"id":"g2_geography_l022_ex04","knowledge_id":"g2_geography_l022","question":"判断题：北方地区是中国重要的重工业基地。（  ）","answer":"答案：√。解析：北方地区特别是东北、华北地区，是中国重要的重工业基地。"},{"id":"g2_geography_l022_ex05","knowledge_id":"g2_geography_l022","question":"选择题：北方地区主要的矿产资源是（  ）。A.煤、铁、石油  B.有色金属  C.稀土  D.盐湖","answer":"答案：A. 煤、铁、石油。解析：北方地区煤（山西）、铁（鞍山）、石油（大庆、辽河、华北、胜利）资源丰富，是中国的能源和原材料基地。"},{"id":"g2_geography_l022_ex06","knowledge_id":"g2_geography_l022","question":"填空题：北方地区最大油田是______油田，位于黑龙江省。","answer":"答案：大庆。解析：大庆油田位于黑龙江省，是中国最大的油田，也是世界上为数不多的特大型砂岩油田之一。"},{"id":"g2_geography_l022_ex07","knowledge_id":"g2_geography_l022","question":"选择题：京津唐工业基地以（  ）为核心。A.北京  B.天津  C.唐山  D.秦皇岛","answer":"答案：A. 北京。解析：京津唐工业基地以北京为核心，是北方最大的综合性工业基地。"},{"id":"g2_geography_l022_ex08","knowledge_id":"g2_geography_l022","question":"简答题：分析北方地区发展工业的有利条件。","answer":"答案：有利条件：①矿产资源丰富：煤（山西、内蒙古）、铁（鞍山、迁安）、石油（大庆、辽河、华北、胜利）资源丰富；②交通便利：铁路、公路、海运（天津、大连、青岛等港口）发达；③工业基础：是中国老工业基地，工业基础雄厚；④市场：人口稠密，经济发达，市场广阔；⑤劳动力：劳动力资源丰富，素质较高；⑥农业基础：华北平原、东北平原是中国重要的农业区，农产品丰富；⑦科技：北京、天津等城市高校和科研院所集中，科技力量雄厚。"},{"id":"g2_geography_l022_ex09","knowledge_id":"g2_geography_l022","question":"读图题：读北方地区工业分布图，说出北方地区主要工业基地。","answer":"答案：北方地区主要工业基地：①辽中南工业基地（沈阳、大连、鞍山、本溪等）：重工业基地；②京津唐工业基地（北京、天津、唐山等）：北方最大综合性工业基地；③胶济工业带（济南、青岛、淄博等）：以电子、家电、化工为主；④豫中工业带（郑州、洛阳等）：以机械、纺织为主；⑤哈大齐工业带（哈尔滨、大庆、齐齐哈尔等）：以石化、装备制造为主。"},{"id":"g2_geography_l022_ex10","knowledge_id":"g2_geography_l022","question":"综合题：分析北方地区工业发展中面临的问题及振兴措施。","answer":"答案：问题：①资源枯竭：长期开采导致煤、铁、石油等资源减少；②设备老化：部分工业设备陈旧，技术落后；③产业结构单一：以重工业为主，经济结构不合理；④水资源紧张：北方地区水资源不足；⑤环境污染：工业排放造成严重污染；⑥就业压力大：产业转型带来就业问题。振兴措施：①调整产业结构：发展新兴产业和现代服务业；②技术改造：引进先进技术，改造传统产业；③发展高新技术产业：培育新的经济增长点；④治理环境：加强污染治理，改善生态环境；⑤发展现代农业：发挥粮食基地优势；⑥扩大开放：引进外资和先进技术；⑦实施东北老工业基地振兴、京津冀协同发展等区域战略。"},{"id":"g2_geography_l023_ex01","knowledge_id":"g2_geography_l023","question":"选择题：南方地区是中国重要的（  ）产区。A.水稻  B.小麦  C.玉米  D.大豆","answer":"答案：A. 水稻。解析：南方地区以水田农业为主，水稻是最主要的粮食作物。"},{"id":"g2_geography_l023_ex02","knowledge_id":"g2_geography_l023","question":"填空题：南方地区的主要粮食作物是______，主要的经济作物有油菜、______、甘蔗等。","answer":"答案：水稻；棉花。解析：南方地区主要粮食作物是水稻，主要经济作物有油菜、棉花、甘蔗、蚕桑、茶叶等。"},{"id":"g2_geography_l023_ex03","knowledge_id":"g2_geography_l023","question":"简答题：简述南方地区农业发展的条件。","answer":"答案：南方地区农业发展条件：①气候：亚热带和热带季风气候，水热条件优越，雨热同期；②地形：平原、丘陵、山地等多种地形，适宜多种农业经营；③土壤：红壤经改良后肥力提高，水稻土肥沃；④水源：河湖众多，水资源丰富，灌溉便利；⑤劳动力：人口稠密，劳动力充足，精耕细作；⑥市场：经济发达，市场需求大；⑦交通：水陆交通便利，农产品运输方便。农业特色：水稻种植普遍，一年两熟到三熟，是'鱼米之乡'。"},{"id":"g2_geography_l023_ex04","knowledge_id":"g2_geography_l023","question":"判断题：南方地区以水田农业为主。（  ）","answer":"答案：√。解析：南方地区以水田农业为主，主要种植水稻、油菜、甘蔗等。"},{"id":"g2_geography_l023_ex05","knowledge_id":"g2_geography_l023","question":"选择题：南方地区被称为'鱼米之乡'的平原是（  ）。A.长江中下游平原  B.成都平原  C.珠江三角洲  D.江汉平原","answer":"答案：A. 长江中下游平原。解析：长江中下游平原水热条件好，水网密布，盛产水稻和淡水鱼，被誉为'鱼米之乡'。"},{"id":"g2_geography_l023_ex06","knowledge_id":"g2_geography_l023","question":"填空题：南方地区主要的经济作物是______（长江流域）、甘蔗（华南）、______（云南）三大热带作物。","answer":"答案：油菜；橡胶。解析：南方地区主要经济作物：油菜（长江流域）、甘蔗（华南）、橡胶等热带作物（云南、海南等）。"},{"id":"g2_geography_l023_ex07","knowledge_id":"g2_geography_l023","question":"选择题：中国热带作物主要分布在（  ）。A.广东、海南、云南  B.湖南、湖北、江西  C.北京、天津、河北  D.上海、江苏、浙江","answer":"答案：A. 广东、海南、云南。解析：中国热带作物（橡胶、咖啡、椰子等）主要分布在广东、海南、云南等地。"},{"id":"g2_geography_l023_ex08","knowledge_id":"g2_geography_l023","question":"简答题：分析长江中下游平原成为'鱼米之乡'的条件。","answer":"答案：条件：①气候：亚热带季风气候，温暖湿润，雨热同期；②地形：地势低平，土壤肥沃（水稻土）；③水源：长江及其支流众多，灌溉便利；④湖泊：鄱阳湖、洞庭湖等湖泊密布，是天然鱼仓；⑤劳动力：人口稠密，精耕细作历史悠久；⑥市场：周边城市密集，市场需求大；⑦交通：长江黄金水道，便于农产品运输。"},{"id":"g2_geography_l023_ex09","knowledge_id":"g2_geography_l023","question":"读图题：读南方地区农业分布图，说出主要农业区。","answer":"答案：南方地区主要农业区：①长江中下游平原：水稻种植和淡水渔业区，'鱼米之乡'；②四川盆地：紫色盆地，'天府之国'；③珠江三角洲：水稻、甘蔗、桑基鱼塘区；④东南丘陵：茶叶、水果、林业区；⑤云贵高原：立体农业（不同海拔发展不同农业）；⑥海南岛和云南南部：热带作物区。"},{"id":"g2_geography_l023_ex10","knowledge_id":"g2_geography_l023","question":"综合题：分析南方地区农业发展中面临的问题及措施。","answer":"答案：问题：①洪涝灾害：长江中下游地区梅雨季节易发生洪涝；②伏旱：长江中下游7-8月受副热带高压控制，易发生伏旱；③台风：东南沿海夏秋季节常受台风影响；④水土流失：南方山地丘陵地区水土流失较严重；⑤土壤酸化：红壤分布区土壤偏酸，肥力较低。措施：①修建水利工程：防洪、灌溉、发电；②植树造林：保持水土，治理水土流失；③改良红壤：施用石灰、有机肥等；④调整农业结构：因地制宜发展立体农业、生态农业；⑤加强监测预报：减少台风等灾害损失。"},{"id":"g2_geography_l024_ex01","knowledge_id":"g2_geography_l024","question":"选择题：西北地区自然景观自东向西的变化是（  ）。A.荒漠→荒漠草原→草原  B.草原→荒漠草原→荒漠  C.草原→荒漠→荒漠草原  D.荒漠→草原→荒漠草原","answer":"答案：B. 草原→荒漠草原→荒漠。解析：西北地区自东向西距海越来越远，降水量递减，自然景观由草原→荒漠草原→荒漠过渡。"},{"id":"g2_geography_l024_ex02","knowledge_id":"g2_geography_l024","question":"填空题：西北地区最深处的盆地是______盆地，最北部的盆地是______盆地。","answer":"答案：塔里木；准噶尔。解析：塔里木盆地是中国面积最大的盆地，是中国最深处的盆地；准噶尔盆地是西北地区最北部的盆地。"},{"id":"g2_geography_l024_ex03","knowledge_id":"g2_geography_l024","question":"简答题：简述西北地区干旱的原因。","answer":"答案：西北地区干旱原因：①海陆位置：深居内陆，距海遥远，海洋湿润气流难以到达；②地形：周围有高大山脉阻挡，如天山、昆仑山等，使海洋水汽无法深入；③大气环流：终年受大陆气团控制，盛行下沉气流，降水稀少。综合作用使西北地区成为全球同纬度最干旱的地区之一，年降水量多在400mm以下，部分地区不足50mm。"},{"id":"g2_geography_l024_ex04","knowledge_id":"g2_geography_l024","question":"判断题：西北地区气候干旱，生态系统脆弱。（  ）","answer":"答案：√。解析：西北地区气候干旱，降水稀少，植被稀少，生态系统十分脆弱，易发生土地荒漠化。"},{"id":"g2_geography_l024_ex05","knowledge_id":"g2_geography_l024","question":"选择题：西北地区主要的农业类型是（  ）。A.水田农业  B.旱地农业  C.畜牧业和灌溉农业  D.渔业","answer":"答案：C. 畜牧业和灌溉农业。解析：西北地区降水稀少，以畜牧业为主，种植业仅限于有水源的绿洲地区，发展灌溉农业。"},{"id":"g2_geography_l024_ex06","knowledge_id":"g2_geography_l024","question":"填空题：西北地区著名的灌溉农业区有宁夏平原、______平原和新疆的绿洲。","answer":"答案：河套。解析：宁夏平原、河套平原是西北地区著名的引黄灌溉农业区，有'塞上江南'之称。"},{"id":"g2_geography_l024_ex07","knowledge_id":"g2_geography_l024","question":"选择题：'西气东输'工程的气源来自（  ）。A.准噶尔盆地  B.塔里木盆地  C.吐鲁番盆地  D.河西走廊","answer":"答案：B. 塔里木盆地。解析：'西气东输'工程以塔里木盆地的天然气为主气源，输送到上海等东部地区。"},{"id":"g2_geography_l024_ex08","knowledge_id":"g2_geography_l024","question":"简答题：分析西北地区土地荒漠化的原因及防治措施。","answer":"答案：荒漠化原因：①自然原因：气候干旱，降水稀少，植被稀疏，生态脆弱；②人为原因：过度开垦、过度放牧、过度樵采，不合理利用水资源等。防治措施：①生物措施：植树种草，恢复植被，营造防护林；②工程措施：设置沙障，固定流沙；③农业措施：退耕还林还草，合理轮牧，控制载畜量；④水资源管理：合理利用水资源，发展节水农业；⑤政策法律：制定相关法律法规，加强管理；⑥控制人口增长：减少人口对生态环境的压力。"},{"id":"g2_geography_l024_ex09","knowledge_id":"g2_geography_l024","question":"读图题：读西北地区地形图，说出主要的地形区。","answer":"答案：西北地区主要地形区：①内蒙古高原（中国第二大高原）；②塔里木盆地（中国最大盆地）；③准噶尔盆地；④柴达木盆地；⑤天山山脉；⑥阿尔泰山脉；⑦昆仑山脉；⑧河西走廊；⑨吐鲁番盆地（中国陆地最低处）。"},{"id":"g2_geography_l024_ex10","knowledge_id":"g2_geography_l024","question":"综合题：分析西北地区开发对当地经济和生态的影响。","answer":"答案：经济影响：①积极：资源开发（石油、天然气、煤炭、有色金属）促进经济发展；西气东输、西电东送带动基础设施建设；②特色农业（哈密瓜、葡萄、棉花、长绒棉等）增加农民收入；③发展旅游业（敦煌莫高窟、吐鲁番、喀纳斯等）促进第三产业。生态影响：①积极：经济发展为生态保护提供资金；②消极：资源开发可能加剧生态破坏；过度开垦、放牧导致土地荒漠化；植被破坏，加剧水土流失；水资源的过度利用造成河流断流、湖泊萎缩。"},{"id":"g2_geography_l025_ex01","knowledge_id":"g2_geography_l025","question":"选择题：青藏地区主要的农作物是（  ）。A.小麦、水稻  B.青稞、小麦  C.玉米、大豆  D.棉花、油菜","answer":"答案：B. 青稞、小麦。解析：青藏地区海拔高，热量不足，主要种植耐寒的青稞和小麦。"},{"id":"g2_geography_l025_ex02","knowledge_id":"g2_geography_l025","question":"填空题：青藏地区主要牲畜是______，被称为'______之舟'。","answer":"答案：牦牛；高原。解析：牦牛是青藏地区主要牲畜，被称为'高原之舟'。"},{"id":"g2_geography_l025_ex03","knowledge_id":"g2_geography_l025","question":"简答题：简述青藏地区的河谷农业。","answer":"答案：青藏地区河谷农业特点：①分布：主要分布在雅鲁藏布江谷地、湟水谷地等海拔相对较低的河谷地区；②原因：河谷地区海拔较低，气温相对较高，热量条件相对较好；③主要作物：青稞、小麦、豌豆、马铃薯等；④地位：是青藏地区主要的种植业区，为当地居民提供粮食；⑤特点：分布范围小，但单位面积产量较高；是青藏地区农业生产的重要组成部分。"},{"id":"g2_geography_l025_ex04","knowledge_id":"g2_geography_l025","question":"判断题：青藏地区是中国重要的牧区，以高寒畜牧业为主。（  ）","answer":"答案：√。解析：青藏地区海拔高，热量不足，种植业受限，是中国重要的高寒牧区，牦牛、藏绵羊是主要畜种。"},{"id":"g2_geography_l025_ex05","knowledge_id":"g2_geography_l025","question":"选择题：青藏地区主要的农业区是（  ）。A.藏北高原  B.柴达木盆地  C.雅鲁藏布江谷地  D.可可西里","answer":"答案：C. 雅鲁藏布江谷地。解析：雅鲁藏布江谷地海拔相对较低，热量条件相对较好，是青藏地区主要的农业区之一。"},{"id":"g2_geography_l025_ex06","knowledge_id":"g2_geography_l025","question":"填空题：青藏地区主要的牲畜有牦牛、藏绵羊、藏山羊等，其中______是青藏地区特有的畜种。","answer":"答案：牦牛。解析：牦牛是青藏地区特有的畜种，毛长皮厚，耐寒耐饥，适应高寒环境。"},{"id":"g2_geography_l025_ex07","knowledge_id":"g2_geography_l025","question":"选择题：青藏地区海拔高，空气稀薄，太阳辐射（  ）。A.弱  B.强  C.与海拔无关  D.与纬度有关","answer":"答案：B. 强。解析：青藏地区海拔高，空气稀薄，太阳辐射强，是中国太阳能资源最丰富的地区之一。"},{"id":"g2_geography_l025_ex08","knowledge_id":"g2_geography_l025","question":"简答题：分析青藏地区发展高寒畜牧业的有利条件。","answer":"答案：有利条件：①草原广布：青藏高原有大面积高山草甸和高山草原，是天然的优良牧场；②牲畜适应：牦牛、藏绵羊等畜种
