水半碗沙'之说，含沙量大是黄河最大的忧患。"},{"id":"g2_geography_u027_ex02","knowledge_id":"g2_geography_u027","question":"填空题：黄河下游形成______河，凌汛发生在______季和冬末春初。","answer":"答案：地上；初冬。解析：黄河下游因泥沙淤积形成'地上河'；凌汛发生在初冬结冰时和冬末春初解冻时。"},{"id":"g2_geography_u027_ex03","knowledge_id":"g2_geography_u027","question":"简答题：简述黄河的主要忧患。","answer":"答案：黄河的主要忧患：①含沙量大：黄河中游流经黄土高原，水土流失严重，河水含沙量极大，年输沙量达16亿吨，是世界上含沙量最大的河流；②地上河：下游因泥沙淤积形成'地上河'，全靠堤防约束，易决堤改道；③凌汛：在初冬结冰和初春解冻时，部分河段（特别是山东境内）易形成冰坝，堵塞河道，造成洪水；④断流：近年来黄河下游出现断流现象，影响沿岸用水；⑤水污染：沿岸工业、生活污水排放造成水污染。"},{"id":"g2_geography_u027_ex04","knowledge_id":"g2_geography_u027","question":"判断题：黄河含沙量居世界大河之首，被称为'地上河'。（  ）","answer":"答案：√。解析：黄河平均含沙量约35千克/立方米，年输沙量达16亿吨，是世界上含沙量最大的河流；下游因泥沙淤积形成'地上河'。"},{"id":"g2_geography_u027_ex05","knowledge_id":"g2_geography_u027","question":"选择题：黄河凌汛主要发生在（  ）。A.上游  B.中游  C.下游  D.上游和下游","answer":"答案：D. 上游和下游。解析：黄河凌汛主要发生在上游宁夏、内蒙古部分河段和下游山东部分河段，因为这些河段由低纬流向高纬，结冰或解冻时间不一致。"},{"id":"g2_geography_u027_ex06","knowledge_id":"g2_geography_u027","question":"填空题：'一碗水半碗沙'形容的是______河的高含沙量，其含沙量最大的河段是______。","answer":"答案：黄；中游。解析：'一碗水半碗沙'形容黄河的高含沙量，黄河含沙量最大的河段是中游（流经黄土高原段）。"},{"id":"g2_geography_u027_ex07","knowledge_id":"g2_geography_u027","question":"选择题：'地上河'是指（  ）。A.地上流动的河  B.河床高于地面的河  C.干涸的河  D.分叉的河","answer":"答案：B. 河床高于地面的河。解析：'地上河'是指河床高于两岸地面的河流，黄河下游因泥沙淤积，河床高出两岸地面数米，形成'地上河'。"},{"id":"g2_geography_u027_ex08","knowledge_id":"g2_geography_u027","question":"简答题：为什么黄河中游含沙量特别大？","answer":"答案：黄河中游含沙量特别大的原因：①流经黄土高原：黄河中游主要流经黄土高原，黄土土质疏松，多孔隙，垂直节理发育，易被流水侵蚀；②植被破坏：黄土高原历史上植被破坏严重，地表裸露，水土保持能力差；③降水集中：黄土高原夏季多暴雨，降水强度大，对地表冲刷强烈；④地形破碎：黄土高原千沟万壑，坡度大，水流速度快，侵蚀力强；⑤不合理的人类活动：过度开垦、过度放牧等加剧了水土流失。多种因素共同作用，使黄河中游含沙量极大。"},{"id":"g2_geography_u027_ex09","knowledge_id":"g2_geography_u027","question":"读图题：读黄河下游'地上河'示意图，分析'地上河'形成的原因。","answer":"答案：'地上河'形成原因：①黄河中游流经黄土高原，携带大量泥沙；②下游进入华北平原，地势低平，水流减缓，泥沙大量沉积；③泥沙不断淤积，河床逐渐抬高；④为防止洪水泛滥，人们不断加高两岸堤防；⑤河床与堤防不断加高，形成'地上河'（河床高出两岸地面数米）。"},{"id":"g2_geography_u027_ex10","knowledge_id":"g2_geography_u027","question":"综合题：分析黄河忧患产生的原因及防治措施。","answer":"答案：原因：①自然原因：流经黄土高原，含沙量大；下游地势低平，泥沙淤积；冬季寒冷，有结冰期。②人为原因：植被破坏，水土流失加剧；不合理灌溉，浪费水资源；工业、生活污染；过度用水。防治措施：①中游：保持水土，退耕还林还草，修建梯田和淤地坝，开展小流域综合治理；②下游：加固黄河大堤，修建分洪工程（如小浪底），疏浚河道；③全流域：加强水资源管理，节约用水，防治水污染；④加强生态保护和修复。"},{"id":"g2_geography_u028_ex01","knowledge_id":"g2_geography_u028","question":"选择题：治理黄河的关键是（  ）。A.治沙  B.治水  C.保持水土  D.治沙和保持水土","answer":"答案：D. 治沙和保持水土。解析：黄河泥沙主要来自中游黄土高原的水土流失，治沙和保持水土是治理黄河的关键。"},{"id":"g2_geography_u028_ex02","knowledge_id":"g2_geography_u028","question":"填空题：黄河中游的治理措施是______，如退耕还林还草、修建______、打坝______等。","answer":"答案：保持水土；水平梯田；淤地。解析：黄河中游治理措施主要是保持水土，具体做法包括退耕还林还草、修建水平梯田、打坝淤地等。"},{"id":"g2_geography_u028_ex03","knowledge_id":"g2_geography_u028","question":"简答题：简述黄河治理的主要措施。","answer":"答案：黄河治理的主要措施：①中游：治沙和保持水土是关键，包括植树种草、修建水平梯田、打坝淤地、退耕还林还草、开展小流域综合治理等；②下游：加固黄河大堤，疏浚河道，修建分洪、蓄洪工程（如小浪底水利枢纽），治理'地上河'；③全流域：加强水资源统一管理，节约用水，防治水污染；④建立自然保护区，保护黄河源头生态；⑤立法保护：《中华人民共和国黄河保护法》等法律法规。"},{"id":"g2_geography_u028_ex04","knowledge_id":"g2_geography_u028","question":"判断题：治理黄河的关键是治沙和保持水土。（  ）","answer":"答案：√。解析：黄河泥沙主要来自中游黄土高原，治沙和保持水土是治理黄河的关键，治沙才能减少下游泥沙淤积。"},{"id":"g2_geography_u028_ex05","knowledge_id":"g2_geography_u028","question":"选择题：黄河小浪底水利枢纽工程的主要功能是（  ）。A.防洪  B.发电  C.减淤  D.以上都是","answer":"答案：D. 以上都是。解析：小浪底水利枢纽是黄河中下游最大的水利工程，具有防洪、防凌、减淤、发电、灌溉、供水等综合效益，特别是其减淤作用对治理黄河有重要意义。"},{"id":"g2_geography_u028_ex06","knowledge_id":"g2_geography_u028","question":"填空题：黄河治理的根本措施是______，关键措施是______。","answer":"答案：保持水土；治沙。解析：黄河治理的根本措施是保持水土，关键措施是治沙，二者本质相同，因为沙来源于水土流失。"},{"id":"g2_geography_u028_ex07","knowledge_id":"g2_geography_u028","question":"选择题：下列措施中，不属于黄河中游治理的是（  ）。A.植树种草  B.修建梯田  C.加固大堤  D.打坝淤地","answer":"答案：C. 加固大堤。解析：加固大堤是黄河下游的治理措施，植树种草、修建梯田、打坝淤地都是中游黄土高原的水土保持措施。"},{"id":"g2_geography_u028_ex08","knowledge_id":"g2_geography_u028","question":"简答题：什么是小流域综合治理？有什么意义？","answer":"答案：小流域综合治理是指以小流域为单元，合理安排农、林、牧各业用地，配套实施工程措施、生物措施和农业技术措施，治理水土流失的方法。措施：①工程措施：修建水平梯田、淤地坝、塘坝等；②生物措施：植树种草，恢复植被；③农业技术措施：深耕改土、轮作套种、地膜覆盖等。意义：①有效控制水土流失，减少入黄泥沙；②提高土地生产力，发展农村经济；③改善生态环境，促进可持续发展；④是中国治理黄土高原水土流失的成功经验。"},{"id":"g2_geography_u028_ex09","knowledge_id":"g2_geography_u028","question":"读图题：读黄土高原水土保持工程示意图，说出主要的水土保持措施。","answer":"答案：黄土高原主要的水土保持措施：①工程措施：在缓坡修筑水平梯田，在沟道打坝淤地、修建小型水库和塘坝；②生物措施：植树造林、种草，恢复植被，营造水土保持林；③农业技术措施：深耕改土、轮作套种、秸秆还田、地膜覆盖等；④调整农业结构：陡坡地退耕还林还草，过度放牧地区减少牲畜数量。"},{"id":"g2_geography_u028_ex10","knowledge_id":"g2_geography_u028","question":"综合题：分析黄河治理对中华民族可持续发展的意义。","answer":"答案：意义：①防洪减灾：保障黄河下游地区人民生命财产安全和社会稳定；②水资源利用：合理调配水资源，满足沿岸生产生活用水需求；③生态保护：减少水土流失，保护黄河流域生态环境；④农业发展：改善灌溉条件，促进农业增产；⑤能源供应：水电站提供清洁能源，优化能源结构；⑥经济发展：促进黄河流域经济带的可持续发展；⑦文化传承：保护黄河文化，传承中华文明。"},{"id":"g2_geography_u029_ex01","knowledge_id":"g2_geography_u029","question":"选择题：自然资源是指（  ）。A.自然界中所有的物质  B.人类从自然界直接获得的生活资料  C.在一定技术条件下，自然界中对人类有用的物质和能量  D.非可再生的资源","answer":"答案：C. 在一定技术条件下，自然界中对人类有用的物质和能量。解析：自然资源是指在一定的技术条件下，自然界中对人类有用的物质和能量。"},{"id":"g2_geography_u029_ex02","knowledge_id":"g2_geography_u029","question":"填空题：自然资源按能否再生可分为______资源和______资源。","answer":"答案：可再生；非可再生。解析：自然资源按能否再生分为可再生资源（如土地、水、森林、草原等）和非可再生资源（如各种矿产资源）。"},{"id":"g2_geography_u029_ex03","knowledge_id":"g2_geography_u029","question":"简答题：什么是可再生资源和非可再生资源？各举三例。","answer":"答案：①可再生资源：在较短时间内可以再生、更新或循环使用的自然资源。可再生资源如果合理利用并加以保护，可以持续利用；如果利用不合理，也会变成非可再生资源。例：土地资源、水资源、森林资源、草原资源、太阳能、风能等。②非可再生资源：形成过程极其缓慢，相对于人类历史而言，用一些就少一些的资源。例：煤炭、石油、天然气、各种金属矿产等。"},{"id":"g2_geography_u029_ex04","knowledge_id":"g2_geography_u029","question":"判断题：阳光、风能、水能等能源属于可再生资源。（  ）","answer":"答案：√。解析：阳光、风能、水能等能源在使用后可以恢复和再生，属于可再生资源。"},{"id":"g2_geography_u029_ex05","knowledge_id":"g2_geography_u029","question":"选择题：下列属于非可再生资源的是（  ）。A.森林  B.石油  C.水能  D.太阳能","answer":"答案：B. 石油。解析：石油是古代生物化石经过漫长地质年代形成的，形成过程极其缓慢，属于非可再生资源。"},{"id":"g2_geography_u029_ex06","knowledge_id":"g2_geography_u029","question":"填空题：自然资源主要包括______资源、______资源、气候资源、生物资源和海洋资源等。","answer":"答案：土地；矿产。解析：自然资源主要包括土地资源、水资源、矿产资源、气候资源、生物资源和海洋资源等。"},{"id":"g2_geography_u029_ex07","knowledge_id":"g2_geography_u029","question":"选择题：可再生资源如果不合理利用，也会变成（  ）。A.可再生资源  B.非可再生资源  C.无限资源  D.能源","answer":"答案：B. 非可再生资源。解析：可再生资源如果不合理利用（如过度采伐森林、过度捕捞鱼类等），其再生能力受到破坏，会变成非可再生资源。"},{"id":"g2_geography_u029_ex08","knowledge_id":"g2_geography_u029","question":"简答题：合理利用自然资源的意义是什么？","answer":"答案：合理利用自然资源的意义：①保证资源持续利用：自然资源是人类生存和发展的物质基础，合理利用可以使资源持续为人类服务；②保护生态环境：合理利用资源可以减少对环境的破坏，保护生态系统；③促进可持续发展：合理利用资源是实现经济社会可持续发展的重要保障；④避免资源枯竭：合理利用可以避免某些资源过早枯竭，延长资源使用时间；⑤提高资源利用效率：合理利用可以充分发挥资源的价值，提高经济效益。"},{"id":"g2_geography_u029_ex09","knowledge_id":"g2_geography_u029","question":"读图题：读中国主要自然资源分布图，说出中国主要自然资源的分布特点。","answer":"答案：中国主要自然资源的分布特点：①土地资源：耕地集中于东部季风区，草地集中于西部内陆，林地集中于东北、西南；②水资源：南多北少，东多西少；③矿产资源：分布广泛，相对集中，如煤炭集中于华北、西北，石油集中于东北、华北、西北，有色金属集中于南方；④森林资源：东北、西南林区是中国最大的天然林区；⑤草地资源：集中于西北内陆和青藏高原。"},{"id":"g2_geography_u029_ex10","knowledge_id":"g2_geography_u029","question":"综合题：分析中国自然资源的优势和劣势。","answer":"答案：优势：①自然资源总量丰富：许多自然资源总量位居世界前列，如耕地面积、森林面积、矿产储量等；②自然资源种类齐全：各类自然资源都有分布，为经济发展提供多样化条件。劣势：①人均资源占有量少：因人口众多，许多资源的人均占有量低于世界平均水平；②资源分布不均：各类资源地区分布不均衡，如水土资源分布不匹配；③资源利用效率低：粗放型利用方式导致资源浪费；④资源约束趋紧：随着经济发展，资源需求增加，资源约束日益明显。"},{"id":"g2_geography_u030_ex01","knowledge_id":"g2_geography_u030","question":"选择题：中国自然资源的基本特征是（  ）。A.总量丰富，人均不足  B.总量不足，人均丰富  C.总量贫乏，人均不足  D.总量丰富，人均丰富","answer":"答案：A. 总量丰富，人均不足。解析：中国自然资源总量丰富，但由于人口众多，人均资源占有量不足，这是中国自然资源的基本特征。"},{"id":"g2_geography_u030_ex02","knowledge_id":"g2_geography_u030","question":"填空题：中国自然资源的基本特征是______丰富，______不足。","answer":"答案：总量；人均。解析：中国自然资源总量丰富，但由于人口众多，人均占有量不足。"},{"id":"g2_geography_u030_ex03","knowledge_id":"g2_geography_u030","question":"简答题：简述中国自然资源的基本特征。","answer":"答案：中国自然资源的基本特征：①总量丰富：中国自然资源总量大，许多资源位居世界前列，如耕地面积、森林面积、矿产储量、水能蕴藏量等；②人均不足：因中国人口众多，许多资源的人均占有量低于世界平均水平，如人均耕地约为世界平均的1/3，人均水资源约为世界平均的1/4；③分布不均：资源地区分布不均衡，如水土资源分布不匹配；④种类齐全：各类自然资源都有分布，为经济发展提供多样化条件。"},{"id":"g2_geography_u030_ex04","knowledge_id":"g2_geography_u030","question":"判断题：中国自然资源人均占有量居世界前列。（  ）","answer":"答案：×。解析：虽然中国自然资源总量丰富，但由于人口众多，人均资源占有量低于世界平均水平。"},{"id":"g2_geography_u030_ex05","knowledge_id":"g2_geography_u030","question":"选择题：中国人均耕地面积约为世界平均水平的（  ）。A.1/2  B.1/3  C.1/4  D.1/5","answer":"答案：B. 1/3。解析：中国人均耕地面积约为世界平均水平的1/3。"},{"id":"g2_geography_u030_ex06","knowledge_id":"g2_geography_u030","question":"填空题：中国人均淡水资源约为世界平均水平的______，人均森林面积约为世界平均水平的______。","answer":"答案：1/4；1/5。解析：中国人均淡水资源约为世界平均水平的1/4，人均森林面积约为世界平均水平的1/5。"},{"id":"g2_geography_u030_ex07","knowledge_id":"g2_geography_u030","question":"选择题：中国水能资源蕴藏量居世界（  ）。A.第一位  B.第二位  C.第三位  D.第四位","answer":"答案：A. 第一位。解析：中国水能资源蕴藏量约6.76亿千瓦，居世界第一位。"},{"id":"g2_geography_u030_ex08","knowledge_id":"g2_geography_u030","question":"简答题：中国人均资源占有量不足的原因是什么？","answer":"答案：中国人均资源占有量不足的原因：①人口基数大：中国是世界上人口最多的国家，约14.4亿人口（2023年）；②资源总量虽大但被众多人口分母稀释，使人均占有量低于世界平均水平；③资源消耗大：经济快速发展，资源消耗强度大；④资源利用效率低：粗放型增长方式导致资源浪费；⑤资源分布不均：部分资源集中在少数地区，加剧了人均不足的矛盾。"},{"id":"g2_geography_u030_ex09","knowledge_id":"g2_geography_u030","question":"读图题：读中国主要自然资源在世界上的位次表，说出中国居世界前列的自然资源。","answer":"答案：中国居世界前列的自然资源：①土地资源：耕地面积居世界第4位；②森林资源：森林面积居世界第5位；③矿产资源：煤炭储量居世界第3位；④水能资源：水能蕴藏量居世界第1位；⑤稀土资源：储量居世界第1位；⑥钨、锑、钛、钒、菱镁矿等储量居世界前列。"},{"id":"g2_geography_u030_ex10","knowledge_id":"g2_geography_u030","question":"综合题：面对中国人均资源不足的现状，应该采取哪些对策？","answer":"答案：对策：①坚持节约资源的基本国策：建设资源节约型社会，提倡节约风尚；②提高资源利用效率：依靠科技进步，转变经济发展方式，发展循环经济和低碳经济；③加强资源保护：保护土地、森林、草原、水等资源；④合理开发利用：科学规划，有序开发，避免浪费；⑤开源与节流并举：开发利用新能源和可再生能源；⑥加强国际合作：合理利用国外资源和市场；⑦控制人口增长：减轻人口对资源的压力；⑧完善法律法规：加强资源管理的法制建设。"},{"id":"g2_geography_u031_ex01","knowledge_id":"g2_geography_u031","question":"选择题：中国土地资源按利用方式可分为（  ）。A.耕地、林地、草地、建筑用地  B.耕地、林地、沙漠  C.平原、山地、丘陵、高原  D.水田、旱地","answer":"答案：A. 耕地、林地、草地、建筑用地。解析：中国土地资源按利用方式可分为耕地、林地、草地、建筑用地及难利用土地（如沙漠、戈壁、冰川等）。"},{"id":"g2_geography_u031_ex02","knowledge_id":"g2_geography_u031","question":"填空题：中国土地资源按利用方式可分为______、______、草地和建筑用地等。","answer":"答案：耕地；林地。解析：中国土地资源按利用方式可分为耕地、林地、草地、建筑用地及难利用土地。"},{"id":"g2_geography_u031_ex03","knowledge_id":"g2_geography_u031","question":"简答题：简述中国土地资源的基本特点。","answer":"答案：中国土地资源的基本特点：①总量丰富：中国土地资源总量大，类型多样；②人均不足：人均土地资源少，特别是人均耕地少；③类型多样：从用途看有耕地、林地、草地、建筑用地等；从地形看有平原、丘陵、山地、高原、盆地；④分布不均：耕地集中于东部季风区，草地集中于西部内陆，林地集中于东北、西南；⑤难利用土地比重较大：沙漠、戈壁、石山、高寒荒漠等难利用土地面积较大；⑥耕地质量不高：优质耕地少，中低产田比重大。"},{"id":"g2_geography_u031_ex04","knowledge_id":"g2_geography_u031","question":"判断题：中国土地资源丰富，人均耕地多。（  ）","answer":"答案：×。解析：中国土地资源总量丰富，但人均耕地少，仅为世界平均水平的1/3。"},{"id":"g2_geography_u031_ex05","knowledge_id":"g2_geography_u031","question":"选择题：中国人均耕地最少的地区是（  ）。A.西北地区  B.东北地区  C.华南地区  D.青藏地区","answer":"答案：C. 华南地区。解析：华南地区人口稠密，耕地少，人均耕地最少。"},{"id":"g2_geography_u031_ex06","knowledge_id":"g2_geography_u031","question":"填空题：中国难利用土地主要包括沙漠、______、石山、______等。","answer":"答案：戈壁；高寒荒漠。解析：中国难利用土地主要包括沙漠、戈壁、石山、高寒荒漠、冰川等，这些土地难以开发利用。"},{"id":"g2_geography_u031_ex07","knowledge_id":"g2_geography_u031","question":"选择题：中国草地资源主要分布在（  ）。A.东部季风区  B.西北内陆和青藏高原  C.东北平原  D.长江中下游","answer":"答案：B. 西北内陆和青藏高原。解析：中国草地资源主要分布在西北内陆和青藏高原等干旱半干旱地区。"},{"id":"g2_geography_u031_ex08","knowledge_id":"g2_geography_u031","question":"简答题：保护中国土地资源的措施有哪些？","answer":"答案：保护中国土地资源的措施：①依法管理：贯彻执行《土地管理法》等法律法规；②节约用地：实行最严格的耕地保护制度，控制建设用地规模；③提高土地利用率：改造中低产田，开发复垦土地，集约利用土地；④防治土地退化：治理水土流失、土地荒漠化、盐碱化等；⑤保护基本农田：划定基本农田保护区，确保粮食安全；⑥植树造林：提高森林覆盖率，防治水土流失；⑦合理规划：科学规划土地利用结构，提高土地利用效率；⑧加强宣传教育：提高全民保护土地资源的意识。"},{"id":"g2_geography_u031_ex09","knowledge_id":"g2_geography_u031","question":"读图题：读中国土地资源利用类型分布图，指出耕地、林地、草地的分布特点。","answer":"答案：①耕地：主要分布在东部季风区的平原和低缓丘陵地区，如东北平原、华北平原、长江中下游平原、四川盆地等；②林地：主要分布在东北（大兴安岭、小兴安岭、长白山）、西南（横断山区）和东南丘陵地区；③草地：主要分布在西北内陆的内蒙古高原、新疆、青海和青藏高原等干旱半干旱地区；④难利用土地：主要分布在西北干旱区和青藏高原区。"},{"id":"g2_geography_u031_ex10","knowledge_id":"g2_geography_u031","question":"综合题：分析中国土地资源分布对经济发展的影响。","answer":"答案：影响：①有利影响：东部季风区耕地集中，光热水条件好，是中国重要的农业区，支撑了人口稠密地区的经济发展；东北、西南林区提供木材和林产品；西部草地资源为畜牧业发展提供基础。②不利影响：水土资源配置不匹配，耕地集中区水资源不足（如华北平原），水资源丰富区耕地少（如南方山地）；土地退化严重：水土流失面积大、土地荒漠化、盐碱化等威胁农业生产；难利用土地比重大，土地利用率低；人口稠密区人均耕地少，影响农民收入和农业现代化。"},{"id":"g2_geography_u032_ex01","knowledge_id":"g2_geography_u032","question":"选择题：中国耕地主要分布在（  ）。A.西部内陆区  B.东部季风区  C.青藏高原  D.西北干旱区","answer":"答案：B. 东部季风区。解析：中国耕地主要分布在东部季风区的平原和低缓丘陵地区，因为这些地区水热条件好，地形平坦，土壤肥沃。"},{"id":"g2_geography_u032_ex02","knowledge_id":"g2_geography_u032","question":"填空题：中国林地主要分布在______和______，天然林区集中分布在东北的大小兴安岭、长白山地和西南的______山区。","answer":"答案：东北；西南；横断。解析：中国林地主要分布在东北和西南地区，天然林集中在大兴安岭、小兴安岭、长白山地和西南横断山区。"},{"id":"g2_geography_u032_ex03","knowledge_id":"g2_geography_u032","question":"简答题：简述中国土地资源分布的特点。","answer":"答案：中国土地资源分布的特点：①耕地：主要分布在东部季风区的平原和低缓丘陵地区，特别是东北平原、华北平原、长江中下游平原、四川盆地、东南丘陵等；②林地：主要分布在东北（大兴安岭、小兴安岭、长白山地）、西南（横断山区、雅鲁藏布江大拐弯地区）、东南丘陵等；③草地：主要分布在西北内陆的内蒙古高原、新疆、青海和青藏高原等干旱半干旱地区；④建筑用地和交通用地：主要分布在东部和南部经济发达地区；⑤难利用土地：主要分布在沙漠、戈壁、高寒荒漠地区。"},{"id":"g2_geography_u032_ex04","knowledge_id":"g2_geography_u032","question":"判断题：中国草地资源主要分布在西北内陆和青藏高原。（  ）","answer":"答案：√。解析：中国草地资源主要分布在西北内陆和青藏高原等干旱半干旱地区，是重要的畜牧业基地。"},{"id":"g2_geography_u032_ex05","knowledge_id":"g2_geography_u032","question":"选择题：中国水土资源搭配最差的地区是（  ）。A.东北地区  B.华北地区  C.长江中下游  D.东南丘陵","answer":"答案：B. 华北地区。解析：华北地区耕地多，但水资源不足，是水土资源搭配最差的地区。"},{"id":"g2_geography_u032_ex06","knowledge_id":"g2_geography_u032","question":"填空题：中国的天然林区主要分布在______、______和西南林区。","answer":"答案：东北林区；东南林区（南方林区）。解析：中国三大林区：东北林区（最大）、西南林区、东南林区（南方林区）。"},{"id":"g2_geography_u032_ex07","knowledge_id":"g2_geography_u032","question":"选择题：'北大荒'是指（  ）。A.东北平原  B.华北平原  C.长江中下游平原  D.河西走廊","answer":"答案：A. 东北平原。解析：'北大荒'是指东北平原北部未开垦的荒地，现已开垦为'北大仓'，是中国重要的商品粮基地。"},{"id":"g2_geography_u032_ex08","knowledge_id":"g2_geography_u032","question":"简答题：分析中国土地资源分布不均的原因。","answer":"答案：中国土地资源分布不均的原因：①自然条件差异：东部季风区水热条件好，地形以平原、丘陵为主，适宜发展种植业和林业；西部内陆干旱半干旱区水热条件差，地形以高原、山地、盆地为主，适宜发展畜牧业；②气候差异：东部受夏季风影响，降水丰富，植被以森林为主；西部降水少，植被以草原、荒漠为主；③地形影响：东北、西南有大面积山地，林地集中；东部平原广阔，耕地集中；④开发历史：东部开发历史悠久，土地利用程度高；西部开发较晚，土地利用粗放。"},{"id":"g2_geography_u032_ex09","knowledge_id":"g2_geography_u032","question":"读图题：读中国土地资源利用类型分布图，分析中国水土资源配置特点。","answer":"答案：中国水土资源配置特点：①北方耕地多，水资源少：北方（特别是华北地区）耕地比重大，但水资源不足；②南方耕地少，水资源多：南方（特别是长江中下游及其以南地区）水资源丰富，但耕地少；③东西部差异：东部季风区水资源丰富，西部内陆水资源短缺；④水土资源不匹配：水土资源空间配置不协调，制约了农业发展；⑤解决途径：跨流域调水（如南水北调）、节约用水、修建水利工程等。"},{"id":"g2_geography_u032_ex10","knowledge_id":"g2_geography_u032","question":"综合题：分析中国土地资源利用中存在的主要问题及对策。","answer":"答案：问题：①人均耕地少，后备耕地资源不足；②水土流失严重：黄土高原、南方丘陵地区水土流失加剧；③土地荒漠化：西北、华北部分地区荒漠化扩展；④土壤污染：工业污染、农药化肥过量使用造成土壤污染；⑤土地浪费：建设用地盲目扩张，乱占耕地；⑥土地利用不合理：重用轻养，土壤肥力下降。对策：①实行最严格的耕地保护制度；②植树造林，保持水土；③治理荒漠化；④防治污染；⑤合理规划建设用地；⑥加大科技投入，提高土地利用率；⑦完善法律法规，加强土地管理。"},{"id":"g2_geography_u033_ex01","knowledge_id":"g2_geography_u033","question":"选择题：中国水资源的时间分布特点是（  ）。A.夏秋多，冬春少  B.夏秋少，冬春多  C.四季均匀  D.夏季少","answer":"答案：A. 夏秋多，冬春少。解析：中国水资源时间分布特点：夏秋多、冬春少，年际变化大。"},{"id":"g2_geography_u033_ex02","knowledge_id":"g2_geography_u033","question":"填空题：中国水资源时间分布特点是______多、______少，年际变化大。","answer":"答案：夏秋；冬春。解析：中国水资源时间分布特点是夏秋多、冬春少，且年际变化大。"},{"id":"g2_geography_u033_ex03","knowledge_id":"g2_geography_u033","question":"简答题：简述中国水资源的时间和空间分布特点。","answer":"答案：中国水资源的分布特点：①空间分布：南多北少，东多西少，南方水资源占全国的80%以上，北方不足20%；②时间分布：夏秋多、冬春少，年际变化大；③水土资源搭配：北方耕地多但水资源少，南方耕地少但水资源多，水土资源配置不协调；④人均资源少：人均水资源量约为世界平均水平的1/4；⑤总量丰富：多年平均水资源总量约2.8万亿立方米，居世界第六位。"},{"id":"g2_geography_u033_ex04","knowledge_id":"g2_geography_u033","question":"判断题：中国水资源空间分布特点是南多北少。（  ）","answer":"答案：√。解析：中国水资源空间分布不均，南方水资源占全国80%以上，北方不足20%，呈现南多北少的特点。"},{"id":"g2_geography_u033_ex05","knowledge_id":"g2_geography_u033","question":"选择题：中国人均水资源最少的地区是（  ）。A.长江中下游  B.珠江流域  C.华北地区  D.东南沿海","answer":"答案：C. 华北地区。解析：华北地区人口稠密，工农业发达，需水量大，但水资源不足，人均水资源量最少。"},{"id":"g2_geography_u033_ex06","knowledge_id":"g2_geography_u033","question":"填空题：中国水资源空间分布特点是______多______少，东多西少。","answer":"答案：南；北。解析：中国水资源空间分布特点是南多北少、东多西少，这与降水的空间分布密切相关。"},{"id":"g2_geography_u033_ex07","knowledge_id":"g2_geography_u033","question":"选择题：中国水资源时间分配不均容易造成（  ）。A.春旱  B.洪涝和干旱  C.台风  D.寒潮","answer":"答案：B. 洪涝和干旱。解析：中国水资源时间分配不均（夏秋多、冬春少，年际变化大）容易造成洪涝和干旱灾害。"},{"id":"g2_geography_u033_ex08","knowledge_id":"g2_geography_u033","question":"简答题：分析中国水资源空间分布不均的原因。","answer":"答案：中国水资源空间分布不均的原因：①降水分布不均：受夏季风影响，东南部降水丰富，西北部降水稀少；②距海远近：东南部距海近，受海洋影响大，水汽充足；西北部深居内陆，水汽难以到达；③地形影响：迎风坡降水多，背风坡降水少；④植被分布：东部植被覆盖率高，涵养水源能力强；西部植被稀少，水源涵养能力差。综合作用导致中国水资源南多北少、东多西少。"},{"id":"g2_geography_u033_ex09","knowledge_id":"g2_geography_u033","question":"读图题：读中国水资源分布图，说出中国水资源分布的特点。","answer":"答案：中国水资源分布特点：①空间分布不均：南多北少，东多西少；南方（长江、珠江等流域）水资源丰富，北方（特别是华北地区）水资源短缺；②人均水资源地区差异大：华北、东北等地人均水资源量少，南方相对较多；③水土资源不匹配：北方耕地多但水资源少，南方耕地少但水资源多；④时空分布不均：夏秋多、冬春少，年际变化大；⑤总量丰富：多年平均水资源总量2.8万亿立方米，居世界第六位。"},{"id":"g2_geography_u033_ex10","knowledge_id":"g2_geography_u033","question":"综合题：分析中国水资源问题对经济社会发展的影响。","answer":"答案：影响：①影响农业：华北、西北等水资源不足地区，农业灌溉受限，制约农业发展；②影响工业：水资源不足限制了工业生产规模和发展；③影响生活：部分地区居民生活用水紧张，水质性缺水严重；④影响生态：水资源不足导致河流断流、湖泊萎缩、湿地减少，加剧生态退化；⑤制约经济发展：水资源短缺成为中国北方地区经济发展的重要瓶颈；⑥引发水事纠纷：上下游、左右岸之间因水资源分配产生矛盾；⑦过量开采：导致地下水超采、地面沉降、海水入侵等问题。"},{"id":"g2_geography_u034_ex01","knowledge_id":"g2_geography_u034","question":"选择题：中国水资源时间分配不均主要表现在（  ）。A.南多北少  B.东多西少  C.夏秋多冬春少  D.春夏多秋冬少","answer":"答案：C. 夏秋多冬春少。解析：中国水资源时间分配特点是夏秋多、冬春少，且年际变化大。"},{"id":"g2_geography_u034_ex02","knowledge_id":"g2_geography_u034","question":"填空题：中国水资源时间分配的特点是______多、______少，季节变化和年际变化大。","answer":"答案：夏秋；冬春。解析：中国大部分地区受季风影响，降水集中在夏季和秋季，因此水资源也集中在夏秋季节，冬春季节水资源相对较少。"},{"id":"g2_geography_u034_ex03","knowledge_id":"g2_geography_u034","question":"简答题：简述中国水资源时间分布不均的原因和影响。","answer":"答案：原因：受季风气候影响，中国大部分地区降水集中在夏季（6-8月），冬季降水少，春季蒸发旺盛。影响：①洪涝灾害：夏秋季降水集中，多暴雨，易引发洪涝灾害；②干旱灾害：冬春季节降水少，蒸发旺盛，河流进入枯水期，工农业用水紧张，易发生春旱；③径流年际变化大：降水年际变化大，导致河流径流年际变化大，丰水年与枯水年水量相差悬殊；④制约经济发展：水资源时间分配不均限制了农业灌溉和工业用水，影响经济发展。"},{"id":"g2_geography_u034_ex04","knowledge_id":"g2_geography_u034","question":"判断题：修建水库是调节水资源时间分配不均的重要措施。（  ）","answer":"答案：√。解析：修建水库可以在丰水期蓄水，在枯水期放水，调节水资源的时间分配，是解决水资源时间分布不均的重要措施。"},{"id":"g2_geography_u034_ex05","knowledge_id":"g2_geography_u034","question":"选择题：解决中国水资源时间分配不均的主要工程措施是（  ）。A.跨流域调水  B.修建水库  C.海水淡化  D.节约用水","answer":"答案：B. 修建水库。解析：修建水库是解决水资源时间分配不均的主要工程措施；跨流域调水主要解决空间分布不均。"},{"id":"g2_geography_u034_ex06","knowledge_id":"g2_geography_u034","question":"填空题：修建水库可以在______期蓄水，______期放水，调节水资源的时间分配。","answer":"答案：丰水；枯水。解析：修建水库可以在丰水期（夏秋多雨时）蓄水，在枯水期（冬春干旱时）放水，调节水资源的时间分配。"},{"id":"g2_geography_u034_ex07","knowledge_id":"g2_geography_u034","question":"选择题：中国北方春旱严重的主要原因是（  ）。A.夏季风弱  B.春季降水少，蒸发旺盛  C.夏季风强  D.冬季多雨","answer":"答案：B. 春季降水少，蒸发旺盛。解析：华北地区春季气温回升快，蒸发旺盛，但夏季风尚未到达，降水稀少，形成春旱。"},{"id":"g2_geography_u034_ex08","knowledge_id":"g2_geography_u034","question":"简答题：分析中国水资源年际变化大的原因及应对措施。","answer":"答案：原因：受夏季风强弱的影响，中国降水量年际变化大，导致河流径流年际变化也大。夏季风强的年份（南方易涝北方易旱），夏季风弱的年份（南方易旱北方易涝）。应对措施：①修建水库：调节径流的季节变化和年际变化；②植树造林：涵养水源，减少水土流失，调节径流；③加强水资源管理：制定水资源调度方案，合理利用水资源；④发展节水农业和工业：减少用水量，提高水资源利用效率；⑤修建跨流域调水工程：解决空间分布不均问题。"},{"id":"g2_geography_u034_ex09","knowledge_id":"g2_geography_u034","question":"读图题：读中国某河流径流量年变化曲线图，分析其特点及原因。","answer":"答案：特点：河流径流量年际变化大；夏秋季流量大，冬春季流量小。原因：①该河流位于季风气候区，降水集中在夏季（6-8月），夏秋季节流量大；②冬春季节降水少，且气温低，部分河流有结冰期，流量小；③降水年际变化大，导致径流年际变化也大。措施：修建水库调节径流季节变化，跨流域调水调节空间分布不均。"},{"id":"g2_geography_u034_ex10","knowledge_id":"g2_geography_u034","question":"综合题：分析中国水资源时间分布不均对北方地区农业的影响。","answer":"答案：影响：①春旱严重：北方春季降水少，气温回升快，蒸发旺盛，春旱严重影响冬小麦返青和春播作物播种；②夏涝：夏季降水集中，多暴雨，易发生洪涝灾害，淹没农田；③秋季：秋季降水减少，但农作物需水量大，水资源紧张；④冬季：河流结冰期长，水资源利用受限；⑤年际变化大：丰水年与枯水年水资源量差异大，灌溉用水难以保证；⑥应对措施：修建水库（如三峡、葛洲坝等）、跨流域调水（南水北调）、发展节水农业、推广节水灌溉技术等。"},{"id":"g2_geography_u035_ex01","knowledge_id":"g2_geography_u035","question":"选择题：解决中国水资源空间分布不均的主要工程是（  ）。A.三峡工程  B.南水北调  C.小浪底  D.葛洲坝","answer":"答案：B. 南水北调。解析：南水北调工程是解决中国水资源空间分布不均（南多北少）的重要工程，分东线、中线、西线三条线路。"},{"id":"g2_geography_u035_ex02","knowledge_id":"g2_geography_u035","question":"填空题：解决中国水资源不足的主要措施包括跨流域调水、修建______、节约______、防治水污染等。","answer":"答案：水库；用水。解析：解决中国水资源不足的主要措施：跨流域调水（如南水北调）、修建水库、节约用水、发展节水农业和工业、防治水污染、加强水资源管理等。"},{"id":"g2_geography_u035_ex03","knowledge_id":"g2_geography_u035","question":"简答题：简述解决中国水资源不足的主要措施。","answer":"答案：解决中国水资源不足的主要措施：①跨流域调水：南水北调工程将南方丰富的水资源调到北方缺水地区；②修建水库：调节水资源的时间分配不均；③节约用水：发展节水农业（如喷灌、滴灌）和节水工业，提高水资源利用效率；④防治水污染：加强污水处理，减少水体污染，保护水资源；⑤加强水资源管理：制定水资源规划，实行有偿使用制度；⑥海水淡化：在沿海地区发展海水淡化技术；⑦开发利用地下水（合理开发，避免过度开采）；⑧植树造林：保护水源地，涵养水源；⑨加强宣传教育：提高全民节水意识。"},{"id":"g2_geography_u035_ex04","knowledge_id":"g2_geography_u035","question":"判断题：南水北调工程是解决中国水资源空间分布不均的重要工程。（  ）","answer":"答案：√。解析：南水北调工程是解决中国水资源空间分布南多北少问题的重要工程，分东线、中线、西线三条调水线路。"},{"id":"g2_geography_u035_ex05","knowledge_id":"g2_geography_u035","question":"选择题：南水北调工程东线主要利用的水道是（  ）。A.京杭大运河  B.长江  C.黄河  D.珠江","answer":"答案：A. 京杭大运河。解析：南水北调东线工程主要利用京杭大运河及沿线湖泊调水，从江苏扬州江都水利枢纽提水北送。"},{"id":"g2_geography_u035_ex06","knowledge_id":"g2_geography_u035","question":"填空题：南水北调工程分______线、______线和西线三条调水线路。","answer":"答案：东；中。解析：南水北调工程分东线、中线、西线三条调水线路，将长江水调到华北、西北地区。"},{"id":"g2_geography_u035_ex07","knowledge_id":"g2_geography_u035","question":"选择题：节水灌溉技术中，节水效果最好的是（  ）。A.大水漫灌  B.喷灌  C.滴灌  D.浇灌","answer":"答案：C. 滴灌。解析：滴灌是最节水的灌溉技术，水分通过管道直接输送到作物根部，蒸发损失最小，节水效果最好。"},{"id":"g2_geography_u035_ex08","knowledge_id":"g2_geography_u035","question":"简答题：分析南水北调工程的意义。","answer":"答案：南水北调工程的意义：①缓解北方水资源短缺：缓解华北、西北地区水资源紧张状况；②改善生态环境：增加北方河湖水量，补给地下水，改善生态环境；③促进经济发展：保障北方地区生产生活用水，促进经济发展；④优化水资源配置：实现水资源的空间优化配置，提高水资源利用效率；⑤改善人民生活：解决北方居民生活用水困难，提高生活质量；⑥带动相关产业：促进沿线地区经济发展，带动相关产业；⑦促进南北方协调发展：缩小南北经济差距，促进区域协调发展。"},{"id":"g2_geography_u035_ex09","knowledge_id":"g2_geography_u035","question":"读图题：读南水北调工程线路图，说出东线、中线、西线工程的起止点。","answer":"答案：南水北调东线：从长江下游扬州江都抽引长江水，利用京杭大运河及平行河道逐级提水北送至天津；中线：从长江中游湖北丹江口水库引水，沿唐白河流域北上至北京、天津；西线：从长江上游通天河、雅砻江、大渡河引水至黄河上游，解决西北地区缺水问题。"},{"id":"g2_geography_u035_ex10","knowledge_id":"g2_geography_u035","question":"综合题：分析中国解决水资源不足的途径。","answer":"答案：途径：①开源：跨流域调水（如南水北调）、修建水库、合理开发利用地下水、海水淡化、收集利用雨水等；②节流：发展节水农业（喷灌、滴灌）、节水工业，提高水资源利用率；③保护：防治水污染，保护水源地，植树造林涵养水源；④管理：加强水资源统一管理，制定水资源规划，实行有偿使用制度；⑤法律：完善水资源保护的法律法规，加强执法监督；⑥宣传：提高全民节水意识，倡导节约用水。"},{"id":"g2_geography_u036_ex01","knowledge_id":"g2_geography_u036","question":"选择题：交通运输业被称为经济发展的（  ）。A.先行官  B.基础  C.支柱  D.命脉","answer":"答案：A. 先行官。解析：交通运输是经济发展的'先行官'，对经济发展起着重要的支撑和引领作用。"},{"id":"g2_geography_u036_ex02","knowledge_id":"g2_geography_u036","question":"填空题：交通运输是经济发展的______官，对经济发展起着重要的支撑作用。","answer":"答案：先行。解析：交通运输是经济发展的先行官，其发展水平直接影响经济发展的速度和质量。"},{"id":"g2_geography_u036_ex03","knowledge_id":"g2_geography_u036","question":"简答题：简述交通运输的重要性。","answer":"答案：交通运输的重要性：①对经济发展的作用：是经济发展的'先行官'，对经济发展起着重要的支撑作用；②促进资源开发：便利的交通有利于资源的开发利用；③促进商品流通：促进商品流通和市场繁荣；④促进地区交流：加强地区间的经济、文化交流与合作；⑤带动相关产业：交通运输业的发展能带动旅游业、物流业等相关产业；⑥提高人民生活水平：方便人民出行，提高生活质量；⑦巩固国防：现代交通是国防建设的重要支撑。"},{"id":"g2_geography_u036_ex04","knowledge_id":"g2_geography_u036","question":"判断题：交通运输业对经济发展具有重要的支撑作用。（  ）","answer":"答案：√。解析：交通运输业是国民经济的基础性产业，对经济发展具有重要的支撑和引领作用。"},{"id":"g2_geography_u036_ex05","knowledge_id":"g2_geography_u036","question":"选择题：下列运输方式中，速度最快的是（  ）。A.铁路  B.公路  C.航空  D.水路","answer":"答案：C. 航空。解析：航空运输速度最快，但运量小、成本高，适合急需、贵重物品的运输。"},{"id":"g2_geography_u036_ex06","knowledge_id":"g2_geography_u036","question":"填空题：现代交通运输方式主要包括铁路、______、水路、______和管道运输。","answer":"答案：公路；航空。解析：现代交通运输的五大方式是铁路、公路、水路、航空和管道运输。"},{"id":"g2_geography_u036_ex07","knowledge_id":"g2_geography_u036","question":"选择题：适宜短途运输的交通运输方式是（  ）。A.铁路  B.公路  C.航空  D.水路","answer":"答案：B. 公路。解析：公路运输机动灵活，速度较快，适宜短途运输和'门到门'服务。"},{"id":"g2_geography_u036_ex08","knowledge_id":"g2_geography_u036","question":"简答题：分析中国发展交通运输业的意义。","answer":"答案：意义：①促进经济发展：交通运输是经济发展的'先行官'，可带动沿线地区经济发展；②加强区域联系：缩短地区间时空距离，加强区域经济文化交流；③促进资源开发：便利的交通有利于把资源优势转化为经济优势；④改善人民生活：方便人民出行，促进旅游业发展；⑤巩固国防：现代交通是维护国家统一和国防安全的重要保障；⑥带动相关产业：促进汽车制造、钢铁、建材、物流等相关产业发展；⑦促进对外开放：港口、航空的发展促进对外经济贸易和文化交流。"},{"id":"g2_geography_u036_ex09","knowledge_id":"g2_geography_u036","question":"读图题：读中国主要交通运输方式分布图，说出中国主要的交通运输方式。","answer":"答案：中国主要交通运输方式：①铁路：四通八达，已形成完整的铁路网；②公路：高速公路网不断完善，国道、省道、县道、乡道相互连接；③水路：内河航运以长江、珠江、京杭运河为主，海运以沿海港口为主；④航空：以北京、上海、广州等为中心，形成全国航空运输网；⑤管道：主要输送石油、天然气等。"},{"id":"g2_geography_u036_ex10","knowledge_id":"g2_geography_u036","question":"综合题：分析中国交通运输业的发展成就。","answer":"答案：成就：①铁路：运营里程达15.5万千米以上，其中高速铁路运营里程居世界第一位；②公路：总里程达535万千米以上，其中高速公路里程居世界前列；③水路：港口货物吞吐量、远洋运输量居世界前列；④航空：定期航班航线里程、客运量等大幅增长；⑤管道：油气管道网络不断完善；⑥综合交通：基本形成铁路、公路、水路、航空、管道五大运输方式协调发展的综合交通运输体系。"},{"id":"g2_geography_u037_ex01","knowledge_id":"g2_geography_u037","question":"选择题：中国铁路网的骨架是（  ）。A.五纵三横  B.三纵五横  C.四纵四横  D.四纵三横","answer":"答案：A. 五纵三横。解析：中国铁路网骨架是'五纵三横'，包括京哈、京沪、京九、京广、焦柳等南北干线，京包-包兰、陇海-兰新、沪杭-浙赣-湘黔-贵昆等东西干线。"},{"id":"g2_geography_u037_ex02","knowledge_id":"g2_geography_u037","question":"填空题：中国铁路网的'五纵'是指京哈线、京______线、京九线、京广线、焦______线。","answer":"答案：沪；柳。解析：五纵：京哈线、京沪线、京九线、京广线、焦柳线。"},{"id":"g2_geography_u037_ex03","knowledge_id":"g2_geography_u037","question":"简答题：简述中国铁路网'五纵三横'的组成。","answer":"答案：五纵（南北向）：①京哈线（北京-哈尔滨）；②京沪线（北京-上海）；③京九线（北京-九龙）；④京广线（北京-广州）；⑤焦柳线（焦作-柳州）。三横（东西向）：①京包-包兰线（北京-包头-兰州）；②陇海-兰新线（连云港-兰州-乌鲁木齐）；③沪杭-浙赣-湘黔-贵昆线（上海-杭州-南昌-贵阳-昆明）。这些铁路干线构成了中国铁路网的骨架。"},{"id":"g2_geography_u037_ex04","knowledge_id":"g2_geography_u037","question":"判断题：京广铁路是中国最长的南北向铁路干线。（  ）","answer":"答案：√。解析：京广铁路（北京-广州）全长2302千米，是中国最长的南北向铁路干线，跨越华北平原、长江中下游平原、珠江三角洲等地区。"},{"id":"g2_geography_u037_ex05","knowledge_id":"g2_geography_u037","question":"选择题：陇海铁路的起止点是（  ）。A.连云港-兰州  B.兰州-乌鲁木齐  C.北京-包头  D.上海-杭州","answer":"答案：A. 连云港-兰州。解析：陇海铁路东起江苏连云港，西至甘肃兰州，是中国东西向的铁路干线。"},{"id":"g2_geography_u037_ex06","knowledge_id":"g2_geography_u037","question":"填空题：京广线与陇海线相交于______，京沪线与陇海线相交于______。","answer":"答案：郑州；徐州。解析：京广线与陇海线相交于郑州，京沪线与陇海线相交于徐州。"},{"id":"g2_geography_u037_ex07","knowledge_id":"g2_geography_u037","question":"选择题：中国铁路网中，最长的一条东西向铁路干线是（  ）。A.京包-包兰线  B.陇海-兰新线  C.沪杭-浙赣-湘黔-贵昆线  D.京哈线","answer":"答案：B. 陇海-兰新线。解析：陇海-兰新线东起连云港，西至乌鲁木齐，全长约4100千米，是中国最长的东西向铁路干线，也是亚欧大陆桥的重要组成部分。"},{"id":"g2_geography_u037_ex08","knowledge_id":"g2_geography_u037","question":"简答题：中国铁路运输发展迅速，主要原因是什么？","answer":"答案：中国铁路运输发展迅速的原因：①国家重视：国家把铁路建设作为基础设施建设的重点，加大投入；②科技进步：高铁技术快速发展，跻身世界先进行列；③经济发展的需要：经济的快速发展对铁路运输提出了更高的要求；④国土面积大、人口众多：客货运输需求量大；⑤铁路运输的优势：运量大、速度快、安全可靠、连续性强；⑥对外贸易：丝绸之路经济带建设带动了铁路发展。"},{"id":"g2_geography_u037_ex09","knowledge_id":"g2_geography_u037","question":"读图题：读中国铁路干线分布图，找出京广线、陇海线的起止点及交汇城市。","answer":"答案：京广线：北京-广州，纵贯中国南北，途经石家庄、郑州、武汉、长沙等城市；陇海线：连云港-兰州，途经徐州、郑州、西安、宝鸡等城市。京广线与陇海线在郑州交汇，形成中国重要的铁路枢纽。"},{"id":"g2_geography_u037_ex10","knowledge_id":"g2_geography_u037","question":"综合题：分析中国铁路网分布特点及原因。","answer":"答案：分布特点：①东部铁路网密集：东部地区铁路网密度大，运输能力强；②西部铁路网稀疏：西部地区铁路网密度小，运输能力相对薄弱；③南北干线多于东西干线：以北京为中心的辐射状铁路网；④铁路网分布与人口分布、经济分布密切相关。原因：①自然条件：东部地形以平原、丘陵为主，便于铁路建设；西部地形复杂，多高原、山地、沙漠，铁路建设难度大；②经济因素：东部经济发达，客货运输需求大；西部经济相对落后，运输需求小；③人口分布：东部人口稠密，对铁路运输需求大；④政策因素：国家加大对中西部铁路建设投入，逐步改善西部铁路网。"},{"id":"g2_geography_u038_ex01","knowledge_id":"g2_geography_u038","question":"选择题：京沪线的起止点是（  ）。A.北京-上海  B.北京-广州  C.北京-九龙  D.南京-杭州","answer":"答案：A. 北京-上海。解析：京沪线（北京-上海）是中国重要的南北向铁路干线，连接华北和华东两大经济区。"},{"id":"g2_geography_u038_ex02","knowledge_id":"g2_geography_u038","question":"填空题：京九线的起止点是北京到______，京广线的起止点是北京到______。","answer":"答案：九龙；广州。解析：京九线北起北京，南到香港九龙；京广线北起北京，南到广州。"},{"id":"g2_geography_u038_ex03","knowledge_id":"g2_geography_u038","question":"简答题：简述中国主要南北向铁路干线。","answer":"答案：中国主要南北向铁路干线：①京哈线：北京-哈尔滨；②京沪线：北京-上海；③京九线：北京-九龙；④京广线：北京-广州；⑤焦柳线：焦作-柳州；⑥宝成-成昆线：宝鸡-成都-昆明；⑦南昆线：南宁-昆明。这些南北向铁路干线纵贯中国南北，连接东北、华北、华东、华南、西南等地区，加强了南北经济联系。"},{"id":"g2_geography_u038_ex04","knowledge_id":"g2_geography_u038","question":"判断题：京九线是香港回归后修建的铁路。（  ）","answer":"答案：×。解析：京九线1996年9月1日建成通车，北起北京，南至香港九龙，是缓解京广线运输压力、加快沿线革命老区经济发展的重要铁路。"},{"id":"g2_geography_u038_ex05","knowledge_id":"g2_geography_u038","question":"选择题：贯穿中国南北的第二大铁路干线是（  ）。A.京广线  B.京九线  C.京沪线  D.焦柳线","answer":"答案：C. 京沪线。解析：京沪线全长约1463千米，是贯穿中国南北的第二大铁路干线，连接京津唐和沪宁杭两大工业基地。"},{"id":"g2_geography_u038_ex06","knowledge_id":"g2_geography_u038","question":"填空题：焦柳线北起______，南至______，是中国重要的南北向铁路干线。","answer":"答案：焦作；柳州。解析：焦柳线北起河南焦作，南至广西柳州，纵贯河南、湖北、湖南、广西四省区。"},{"id":"g2_geography_u038_ex07","knowledge_id":"g2_geography_u038","question":"选择题：宝成-成昆线连接的两个城市是（  ）。A.宝鸡-成都-昆明  B.宝鸡-重庆-昆明  C.宝鸡-成都-贵阳  D.宝鸡-西宁-拉萨","answer":"答案：A. 宝鸡-成都-昆明。解析：宝成线（宝鸡-成都）和成昆线（成都-昆明）共同构成宝成-成昆线，是中国西南地区重要的铁路干线。"},{"id":"g2_geography_u038_ex08","knowledge_id":"g2_geography_u038","question":"简答题：京九铁路建设的意义是什么？","answer":"答案：京九铁路建设的意义：①完善铁路网：缓解京广线运输压力，完善中国南北铁路网；②促进沿线经济发展：带动沿线（特别是大别山、井冈山等革命老区）的经济发展；③加强港澳联系：方便内地与香港、澳门之间的联系，促进香港繁荣稳定；④促进沿线资源开发：带动沿线矿产、旅游等资源开发；⑤加快革命老区脱贫：促进大别山、井冈山等革命老区脱贫致富；⑥加强国防：增强国防运输能力。"},{"id":"g2_geography_u038_ex09","knowledge_id":"g2_geography_u038","question":"读图题：读中国主要南北向铁路干线分布图，找出京广线、京九线、京沪线经过的主要城市。","answer":"答案：京广线：北京-石家庄-郑州-武汉-长沙-广州；京九线：北京-商丘-九江-南昌-深圳-九龙；京沪线：北京-天津-济南-徐州-南京-上海。这些铁路干线连接了中国主要城市和经济区。"},{"id":"g2_geography_u038_ex10","knowledge_id":"g2_geography_u038","question":"综合题：分析中国铁路网密度分布不均的原因及改进措施。","answer":"答案：原因：①自然条件：东部以平原、丘陵为主，地势低平，铁路建设难度小、成本低；西部多高原、山地、盆地、沙漠，铁路建设难度大、成本高；②经济水平：东部经济发达，人口稠密，运输需求大；西部经济相对落后，运输需求小；③历史发展：东部铁路建设起步早，发展时间长；西部起步晚，发展较慢。改进措施：①加大西部铁路建设投入；②继续推进高铁建设；③完善西部铁路网；④建设青藏铁路、川藏铁路等连接边疆的铁路；⑤推进'一带一路'建设，发展国际铁路联运。"},{"id":"g2_geography_u039_ex01","knowledge_id":"g2_geography_u039","question":"选择题：陇海-兰新线东起（  ）。A.连云港  B.上海  C.广州  D.天津","answer":"答案：A. 连云港。解析：陇海-兰新线东起江苏连云港，西至新疆乌鲁木齐，是中国东西向最长铁路干线，是新亚欧大陆桥的重要组成部分。"},{"id":"g2_geography_u039_ex02","knowledge_id":"g2_geography_u039","question":"填空题：京包-包兰线东起北京，经______到兰州，是中国东西向的铁路干线。","answer":"答案：包头。解析：京包-包兰线由京包线（北京-包头）和包兰线（包头-兰州）组成，是华北通往西北地区的重要铁路。"},{"id":"g2_geography_u039_ex03","knowledge_id":"g2_geography_u039","question":"简答题：简述中国主要东西向铁路干线。","answer":"答案：中国主要东西向铁路干线：①京包-包兰线：北京-包头-兰州；②陇海-兰新线：连云港-兰州-乌鲁木齐（亚欧大陆桥中国段）；③沪杭-浙赣-湘黔-贵昆线：上海-杭州-南昌-株洲-贵阳-昆明（沪昆线）；④南昆线：南宁-昆明；⑤青藏铁路：西宁-拉萨。这些东西向铁路干线横贯中国东西，加强了东西部经济联系。"},{"id":"g2_geography_u039_ex04","knowledge_id":"g2_geography_u039","question":"判断题：陇海-兰新线是新亚欧大陆桥的重要组成部分。（  ）","answer":"答案：√。解析：陇海-兰新线（连云港-兰州-乌鲁木齐）是中国境内的'新亚欧大陆桥'，东起连云港，西至阿拉山口，与哈萨克斯坦铁路相连，直达欧洲鹿特丹。"},{"id":"g2_geography_u039_ex05","knowledge_id":"g2_geography_u039","question":"选择题：沪昆线的起止点是（  ）。A.上海-昆明  B.上海-广州  C.上海-成都  D.上海-拉萨","answer":"答案：A. 上海-昆明。解析：沪昆线（沪杭-浙赣-湘黔-贵昆线）东起上海，西至昆明，是中国重要的东西向铁路干线。"},{"id":"g2_geography_u039_ex06","knowledge_id":"g2_geography_u039","question":"填空题：青藏铁路北起______，南至______，是世界上海拔最高、线路最长的高原铁路。","answer":"答案：西宁；拉萨。解析：青藏铁路北起青海西宁，南至西藏拉萨，全长1956千米，2006年7月1日全线通车。"},{"id":"g2_geography_u039_ex07","knowledge_id":"g2_geography_u039","question":"选择题：京包-包兰线连接的省级行政中心有（  ）。A.北京、包头、兰州  B.北京、呼和浩特、银川  C.北京、太原、银川  D.北京、西安、兰州","answer":"答案：A. 北京、包头、兰州。解析：京包-包兰线由京包线（北京-包头）和包兰线（包头-兰州）组成，途经北京、包头、兰州等城市。"},{"id":"g2_geography_u039_ex08","knowledge_id":"g2_geography_u039","question":"简答题：分析陇海-兰新线的经济意义。","answer":"答案：陇海-兰新线的经济意义：①促进东西部经济交流：连接东部沿海和西部边疆，促进东西部经济文化交流；②带动沿线经济发展：带动沿线（特别是西北地区）经济发展；③促进对外开放：是'一带一路'的重要组成部分，是中国对外开放的西部国际通道；④促进资源开发：方便沿线地区煤炭、石油、有色金属等资源开发；⑤亚欧大陆桥：是中国境内的新亚欧大陆桥，连接太平洋和大西洋两大经济圈；⑥国防战略：具有重要的国防战略意义，巩固西北边防；⑦缩小东西差距：促进西部地区发展，缩小东西部经济差距。"},{"id":"g2_geography_u039_ex09","knowledge_id":"g2_geography_u039","question":"读图题：读中国东西向铁路干线分布图，找出陇海线与哪些南北向铁路相交。","answer":"答案：陇海线（连云港-兰州）自东向西与京沪线（徐州）、京九线（商丘）、京广线（郑州）、焦柳线（洛阳附近）、宝成线（宝鸡）等南北向铁路相交。"},{"id":"g2_geography_u039_ex10","knowledge_id":"g2_geography_u039","question":"综合题：分析青藏铁路建设的意义。","answer":"答案：青藏铁路建设的意义：①结束西藏不通铁路的历史：使西藏有了第一条铁路，方便了西藏人民出行；②促进西藏经济发展：带动西藏经济发展，促进资源开发；③加强民族团结：密切西藏与内地的联系，加强民族团结；④巩固国防：增强西藏国防力量，维护国家统一；⑤保护生态：带动西藏旅游业发展，促进环境保护；⑥技术突破：解决了多年冻土、高寒缺氧、生态保护等世界性难题，体现中国工程技术水平；⑦推动'一带一路'：为'一带一路'建设中的南亚通道打下基础；⑧文化交流：促进西藏与内地的文化交流。"},{"id":"g2_geography_u040_ex01","knowledge_id":"g2_geography_u040","question":"选择题：适宜长途大宗货物运输的交通运输方式是（  ）。A.公路  B.铁路  C.水路  D.航空","answer":"答案：B. 铁路。解析：铁路运输运量大、速度较快、连续性强，适宜长途大宗货物的运输。"},{"id":"g2_geography_u040_ex02","knowledge_id":"g2_geography_u040","question":"填空题：选择交通运输方式需要考虑运输货物的性质、______、______和运输距离等因素。","answer":"答案：数量；重量。解析：选择交通运输方式需要综合考虑货物的性质、数量、重量、运输距离、运输成本、运输时间等多方面因素。"},{"id":"g2_geography_u040_ex03","knowledge_id":"g2_geography_u040","question":"简答题：简述不同交通运输方式的特点。","answer":"答案：不同交通运输方式的特点：①铁路：运量大、速度较快、连续性强、运费较低，适宜长途大宗货物；②公路：机动灵活、速度较快、'门到门'服务，适宜短途运输和鲜活易腐货物；③水路：运量大、成本最低、速度最慢，适宜大宗笨重货物和远洋运输；④航空：速度最快、运量最小、运费最高，适宜急需、贵重物品和人员运输；⑤管道：连续性强、安全可靠、运费低，适宜石油、天然气等流体货物运输。"},{"id":"g2_geography_u040_ex04","knowledge_id":"g2_geography_u040","question":"判断题：选择运输方式时，主要考虑运输货物的特点和运输距离。（  ）","answer":"答案：√。解析：选择运输方式需要综合考虑货物的性质、数量、运输距离、运输成本、运输时间等多种因素。"},{"id":"g2_geography_u040_ex05","knowledge_id":"g2_geography_u040","question":"选择题：运送1000吨煤炭从山西大同到上海，最经济的运输方式是（  ）。A.铁路  B.公路  C.水路  D.航空","answer":"答案：A、C。解析：1000吨大宗货物长途运输，最经济的方式是铁路和水路联运（先铁路到港口，再海运到上海），运费低、运量大。"},{"id":"g2_geography_u040_ex06","knowledge_id":"g2_geography_u040","question":"填空题：航空运输最适宜运送______、______的物品。","answer":"答案：急需；贵重。解析：航空运输速度最快但运费最高，适宜运送急需、贵重的物品或人员。"},{"id":"g2_geography_u040_ex07","knowledge_id":"g2_geography_u040","question":"选择题：管道运输适宜运送的货物是（  ）。A.煤炭  B.石油  C.粮食  D.水果","answer":"答案：B. 石油。解析：管道运输连续性强、安全可靠、运费低，适宜石油、天然气等流体货物。"},{"id":"g2_geography_u040_ex08","knowledge_id":"g2_geography_u040","question":"简答题：从北京运送1000千克活鱼到上海，最适宜的运输方式是什么？为什么？","answer":"答案：最适宜的运输方式是公路运输。原因：①活鱼需要保持鲜活，运输时间不能太长；②1000千克数量不大，公路运输比较合适；③公路运输机动灵活，可以实现'门到门'服务；④铁路、航空、水路运输在时间、灵活性方面不如公路运输；⑤活鱼属于易腐货物，公路运输可以保证质量，损失较小。"},{"id":"g2_geography_u040_ex09","knowledge_id":"g2_geography_u040","question":"读图题：读中国主要运输方式图，分析各种运输方式的优势和劣势。","answer":"答案：①铁路：优势是运量大、连续性强、运费较低；劣势是机动性差，需要配合公路运输；②公路：优势是机动灵活、'门到门'服务；劣势是运量较小、能耗大、运费较高；③水路：优势是运量大、成本最低；劣势是速度慢、受自然条件影响大；④航空：优势是速度快；劣势是运量小、运费高、受天气影响大；⑤管道：优势是连续性强、运费低、安全可靠；劣势是只适宜流体货物，固定性强。"},{"id":"g2_geography_u040_ex10","knowledge_id":"g2_geography_u040","question":"综合题：分析中国交通运输网的特点和发展方向。","answer":"答案：特点：①铁路、公路、水路、航空、管道五大运输方式全面发展；②铁路、公路运输占主导地位；③东部运输网密集，西部相对稀疏；④综合运输能力不断提升，特别是高速铁路和高速公路发展迅速。发展方向：①继续完善综合交通运输网络；②加快中西部地区交通建设；③发展高速铁路和高速公路；④发展国际运输通道（'一带一路'）；⑤发展智能交通、绿色交通；⑥建设交通强国。"},{"id":"g2_geography_u041_ex01","knowledge_id":"g2_geography_u041","question":"选择题：中国种植业主要分布在（  ）。A.西部内陆区  B.东部季风区  C.青藏高原  D.西北干旱区","answer":"答案：B. 东部季风区。解析：中国种植业主要分布在东部季风区的平原和低缓丘陵地区，这些地区水热条件好，地形平坦，土壤肥沃。"},{"id":"g2_geography_u041_ex02","knowledge_id":"g2_geography_u041","question":"填空题：中国农业分布因自然条件不同而具有明显的地区差异，'______农业、______农业、林业'是大致分布格局。","answer":"答案：种植；畜牧。解析：中国农业分布大致以400mm年等降水量线为界，东部以种植业为主，西部以畜牧业为主，林业主要分布在东北和西南。"},{"id":"g2_geography_u041_ex03","knowledge_id":"g2_geography_u041","question":"简答题：简述中国农业的分布特点。","answer":"答案：中国农业分布特点：①种植业：主要分布在东部季风区的平原和低缓丘陵地区，特别是东北平原、华北平原、长江中下游平原、四川盆地等；②畜牧业：主要分布在西部内陆的干旱半干旱高原、山地地区，如内蒙古高原、青藏高原、新疆山地等；③林业：主要分布在东北（大兴安岭、小兴安岭、长白山）、西南（横断山区）和东南丘陵地区；④渔业：主要分布在东南沿海和长江中下游水域；⑤农业分布与自然条件密切相关，呈现明显的地区差异。"},{"id":"g2_geography_u041_ex04","knowledge_id":"g2_geography_u041","question":"判断题：中国种植业、畜牧业、林业的分布大致以400毫米年等降水量线为界。（  ）","answer":"答案：√。解析：400mm年等降水量线是中国种植业与畜牧业的重要分界线，东南部以种植业为主，西北部以畜牧业为主。"},{"id":"g2_geography_u041_ex05","knowledge_id":"g2_geography_u041","question":"选择题：中国四大牧区是（  ）。A.内蒙古、新疆、青海、西藏  B.内蒙古、新疆、青海、宁夏  C.内蒙古、新疆、青海、甘肃  D.内蒙古、宁夏、青海、西藏","answer":"答案：A. 内蒙古、新疆、青海、西藏。解析：中国四大牧区是内蒙古牧区、新疆牧区、青海牧区、西藏牧区。"},{"id":"g2_geography_u041_ex06","knowledge_id":"g2_geography_u041","question":"填空题：中国种植业以______为分界，南方以______田为主，北方以______田为主。","answer":"答案：秦岭-淮河；水；旱。解析：秦岭-淮河是中国南北方分界线，南方以水田为主（种植水稻），北方以旱地为主（种植小麦）。"},{"id":"g2_geography_u041_ex07","knowledge_id":"g2_geography_u041","question":"选择题：中国种植业以（  ）为分界，分为南方和北方两大区。A.长城  B.秦岭-淮河  C.黄河  D.长江","answer":"答案：B. 秦岭-淮河。解析：秦岭-淮河是中国南北方分界线，也是中国种植业南方水田与北方旱地的分界线。"},{"id":"g2_geography_u041_ex08","knowledge_id":"g2_geography_u041","question":"简答题：分析中国种植业集中分布在东部季风区的原因。","answer":"答案：东部季风区发展种植业的有利条件：①气候：受夏季风影响，温暖湿润，雨热同期，适宜农作物生长；②地形：东部以平原、丘陵为主，地势低平，耕地集中连片；③土壤：肥沃的冲积土、黑土等，土壤肥沃；④水源：河湖众多，灌溉水源充足；⑤劳动力：人口稠密，劳动力充足，精耕细作；⑥历史：开发历史悠久，农业基础好；⑦交通：交通便利，农产品运输方便。多种有利条件使东部季风区成为中国种植业最集中的地区。"},{"id":"g2_geography_u041_ex09","knowledge_id":"g2_geography_u041","question":"读图题：读中国农业分布图，指出四大牧区的主要牲畜。","answer":"答案：中国四大牧区主要牲畜：①内蒙古牧区：绵羊、山羊、马、牛（呼伦贝尔草原的三河马、三河牛）；②新疆牧区：细毛羊、伊犁马、阿勒泰大尾羊等；③青海牧区：牦牛、藏绵羊、河曲马等；④西藏牧区：牦牛、藏绵羊、藏山羊等。"},{"id":"g2_geography_u041_ex10","knowledge_id":"g2_geography_u041","question":"综合题：分析中国农业分布与自然条件的关系。","answer":"答案：关系：①东部季风区：水热条件好，地形以平原为主，土壤肥沃——以种植业为主；②西北内陆区：气候干旱，草原广阔——以畜牧业为主；③青藏高原区：高寒气候，草甸广布——以高寒畜牧业为主；④东北、西南山地：森林资源丰富——以林业为主；⑤东南沿海、长江流域：水域广阔——以渔业为主。农业分布深受自然条件（气候、地形、土壤、水源等）的影响，体现了因地制宜的原则。"},{"id":"g2_geography_u042_ex01","knowledge_id":"g2_geography_u042","question":"选择题：中国南方主要的粮食作物是（  ）。A.小麦  B.玉米  C.水稻  D.大豆","answer":"答案：C. 水稻。解析：南方水热条件好，以水田为主，主要粮食作物是水稻。"},{"id":"g2_geography_u042_ex02","knowledge_id":"g2_geography_u042","question":"填空题：中国北方主要的粮食作物是______和玉米；南方主要的粮食作物是______。","answer":"答案：小麦；水稻。解析：北方以旱地为主，主要粮食作物是小麦（冬小麦、春小麦）；南方以水田为主，主要粮食作物是水稻。"},{"id":"g2_geography_u042_ex03","knowledge_id":"g2_geography_u042","question":"简答题：简述中国主要农作物的地区分布。","answer":"答案：中国主要农作物的地区分布：①水稻：主要分布在秦岭-淮河以南的南方地区，包括长江中下游平原、四川盆地、珠江三角洲等地；②小麦：分为冬小麦（华北平原为主）和春小麦（东北平原为主），主要分布在秦岭-淮河以北；③玉米：分布广泛，主要在东北、华北、西南；④大豆：主要分布在东北平原和华北平原；⑤棉花：主要分布在长江中下游平原、黄河流域（华北平原）和新疆；⑥油菜籽：主要分布在长江流域；⑦甘蔗：主要分布在华南（广东、广西、海南、台湾、福建）；⑧甜菜：主要分布在东北和新疆。"},{"id":"g2_geography_u042_ex04","knowledge_id":"g2_geography_u042","question":"判断题：油菜是中国播种面积最大的油料作物，主要分布在长江流域。（  ）","answer":"答案：√。解析：油菜是中国播种面积最大的油料作物，主要分布在长江流域，是世界最大的油菜生产国。"},{"id":"g2_geography_u042_ex05","knowledge_id":"g2_geography_u042","question":"选择题：棉花主要分布在（  ）。A.东北平原  B.长江中下游平原和黄河流域  C.青藏高原  D.内蒙古高原","answer":"答案：B. 长江中下游平原和黄河流域。解析：中国棉花主要分布在长江中下游平原、黄河流域（华北平原）、新疆等地。"},{"id":"g2_geography_u042_ex06","knowledge_id":"g2_geography_u042","question":"填空题：糖料作物中，______主要分布在南方，______主要分布在北方。","answer":"答案：甘蔗；甜菜。解析：南方的糖料作物是甘蔗（华南地区为主），北方的糖料作物是甜菜（东北和新疆为主）。"},{"id":"g2_geography_u042_ex07","knowledge_id":"g2_geography_u042","question":"选择题：花生主要分布在（  ）。A.东北平原  B.华北平原  C.长江中下游  D.四川盆地","answer":"答案：B. 华北平原。解析：花生主要分布在华北平原的山东、河南等地，是华北平原重要的经济作物。"},{"id":"g2_geography_u042_ex08","knowledge_id":"g2_geography_u042","question":"简答题：分析中国南北方农作物差异的原因。","answer":"答案：南北方农作物差异的原因：①气候差异：南方纬度低，热量充足，降水丰富，雨热同期；北方纬度高，热量较少，降水较少；②地形差异：南方多山地丘陵，北方多平原；③土壤差异：南方多红壤，北方多黑土、黄土等；④水源差异：南方河湖众多，灌溉水源充足；北方水资源相对不足；⑤种植制度：南方一年两熟到三熟，北方一年一熟、两年三熟或一年两熟。多种因素导致南北方农作物种类、种植制度存在显著差异。"},{"id":"g2_geography_u042_ex09","knowledge_id":"g2_geography_u042","question":"读图题：读中国主要农作物分布图，指出水稻和小麦的分布范围。","answer":"答案：①水稻：主要分布在秦岭-淮河以南的南方地区，包括长江中下游平原、四川盆地、东南丘陵、珠江三角洲等；②小麦：分冬小麦（华北平原为主，主要在长城以南、六盘山以东、秦岭-淮河以北）和春小麦（东北平原、内蒙古东部、宁夏、甘肃、青海、新疆等地）两类。"},{"id":"g2_geography_u042_ex10","knowledge_id":"g2_geography_u042","question":"综合题：分析中国主要农作物分布的规律性。","answer":"答案：规律性：①粮食作物：水稻主要分布在南方（秦岭-淮河以南），小麦主要分布在北方（秦岭-淮河以北）；②经济作物：棉花主要分布在黄河流域和长江中下游；油菜主要分布在长江流域；花生主要分布在华北；甘蔗主要分布在华南；甜菜主要分布在东北和新疆；③糖料作物：南甘蔗北甜菜（南方甘蔗、北方甜菜）；④油料作物：南油菜北花生（南方油菜、北方花生）；⑤农作物分布与自然条件（气候、土壤、水源、地形）密切相关，体现因地制宜原则。"},{"id":"g2_geography_u043_ex01","knowledge_id":"g2_geography_u043","question":"选择题：中国农业发展面临的主要问题是（  ）。A.耕地面积广大  B.水资源丰富  C.人均耕地少，水资源短缺  D.气候条件好","answer":"答案：C. 人均耕地少，水资源短缺。解析：中国农业发展面临的主要问题是人均耕地少（仅为世界平均的1/3）和北方水资源短缺。"},{"id":"g2_geography_u043_ex02","knowledge_id":"g2_geography_u043","question":"填空题：改革开放以来，中国农业发展取得了巨大成就，粮食、肉类等主要农产品产量居世界______位。","answer":"答案：前。解析：中国粮食、肉类、水产品等主要农产品产量均居世界前列。"},{"id":"g2_geography_u043_ex03","knowledge_id":"g2_geography_u043","question":"简答题：简述中国农业发展的成就。","answer":"答案：中国农业发展成就：①粮食产量大幅增长：中国粮食总产量连续多年稳定在6.5亿吨以上，居世界第一位；②肉类产量居世界前列：中国是世界上最大的肉类生产国；③水产品产量居世界第一：中国是世界上最大的水产品生产国；④农业结构不断优化：种植业、林业、畜牧业、渔业全面发展；⑤农业现代化水平提高：机械化、科技化水平不断提升；⑥农产品品种丰富：主要农产品供给充足，告别了农产品短缺时代；⑦农民生活水平提高：农民收入持续增长。"},{"id":"g2_geography_u043_ex04","knowledge_id":"g2_geography_u043","question":"判断题：中国粮食产量居世界第一位。（  ）","answer":"答案：√。解析：中国粮食总产量连续多年稳定在6.5亿吨以上，居世界第一位。"},{"id":"g2_geography_u043_ex05","knowledge_id":"g2_geography_u043","question":"选择题：中国农业发展面临的主要挑战是（  ）。A.机械化水平高  B.人均耕地少  C.气候条件好  D.水资源丰富","answer":"答案：B. 人均耕地少。解析：中国农业发展面临的主要挑战：人均耕地少，仅为世界平均的1/3；北方水资源短缺；农业基础相对薄弱等。"},{"id":"g2_geography_u043_ex06","knowledge_id":"g2_geography_u043","question":"填空题：中国农业发展面临的主要问题有耕地资源______、北方______资源短缺、农业基础相对薄弱等。","answer":"答案：不足；水。解析：中国农业发展面临的主要问题：人均耕地少（耕地资源不足）、北方水资源短缺、农业基础相对薄弱、农业科技水平有待提高等。"},{"id":"g2_geography_u043_ex07","knowledge_id":"g2_geography_u043","question":"选择题：解决中国北方农业缺水问题的有效途径是（  ）。A.扩大耕地面积  B.发展节水农业  C.增加农药使用  D.大量抽取地下水","answer":"答案：B. 发展节水农业。解析：发展节水农业（如喷灌、滴灌）是解决北方农业缺水问题的有效途径。"},{"id":"g2_geography_u043_ex08","knowledge_id":"g2_geography_u043","question":"简答题：分析中国农业发展面临的主要问题及解决措施。","answer":"答案：问题：①人均耕地少：仅为世界平均的1/3，耕地资源不足；②水资源短缺：北方地区水资源紧张，影响农业灌溉；③农业基础薄弱：农业基础设施和科技水平相对落后；④农业污染：农药、化肥过量使用造成农业污染；⑤农民收入偏低：与城市居民收入差距较大。措施：①保护耕地：实行最严格的耕地保护制度；②节约用水：发展节水农业，推广节水灌溉技术；③科技兴农：依靠科技进步，提高农业现代化水平；④调整结构：发展多种经营，提高农业效益；⑤保护环境：减少农业污染，发展生态农业；⑥政策支持：加大对农业的扶持力度，提高农民积极性。"},{"id":"g2_geography_u043_ex09","knowledge_id":"g2_geography_u043","question":"读图题：读中国人均耕地变化趋势图，分析中国耕地资源面临的形势。","answer":"答案：形势：①人均耕地少：中国人均耕地仅为世界平均的1/3；②耕地面积减少：随着工业化、城镇化的发展，耕地面积不断减少；③耕地质量下降：土壤污染、酸化、盐碱化等问题导致耕地质量下降；④后备耕地资源不足：可开垦的后备耕地资源有限；⑤区域分布不均：南方耕地少，北方耕地多，但北方水资源不足；⑥保护任务艰巨：保护耕地的任务十分艰巨。"},{"id":"g2_geography_u043_ex10","knowledge_id":"g2_geography_u043","question":"综合题：分析中国发展现代化农业的方向。","answer":"答案：方向：①科技化：依靠科技进步，推广现代农业技术，提高农业科技含量；②机械化：推进农业机械化，提高农业生产效率；③产业化：发展农业产业化经营，延长农业产业链；④集约化：推广规模化、专业化经营，提高农业劳动生产率；⑤生态化：发展生态农业、循环农业，减少农业污染；⑥信息化：发展智慧农业，利用信息技术提升农业管理水平；⑦国际化：发展外向型农业，提升中国农产品国际竞争力；⑧品牌化：打造农产品品牌，提高农产品附加值。"},{"id":"g2_geography_u044_ex01","knowledge_id":"g2_geography_u044","question":"选择题：中国四大工业基地是（  ）。A.辽中南、京津唐、沪宁杭、珠江三角洲  B.东北、华北、华东、华南  C.京津唐、沪宁杭、辽中南、武汉  D.京津唐、沪宁杭、辽中南、成渝","answer":"答案：A. 辽中南、京津唐、沪宁杭、珠江三角洲。解析：中国四大工业基地是辽中南工业基地、京津唐工业基地、沪宁杭工业基地、珠江三角洲工业基地。"},{"id":"g2_geography_u044_ex02","knowledge_id":"g2_geography_u044","question":"填空题：中国工业分布不均，总体上______地区工业发达，______地区工业相对薄弱。","answer":"答案：沿海；内陆。解析：中国工业分布不均，总体上沿海地区工业发达，内陆地区工业相对薄弱。"},{"id":"g2_geography_u044_ex03","knowledge_id":"g2_geography_u044","question":"简答题：简述中国工业分布的特点。","answer":"答案：中国工业分布的特点：①沿海地区工业发达：特别是辽中南、京津唐、沪宁杭、珠江三角洲四大工业基地集中了主要的工业产值；②内陆地区工业相对薄弱：西部地区工业基础较薄弱；③资源指向性：钢铁工业多分布在铁矿、煤矿附近；④市场指向性：消费品工业多分布在人口稠密、市场广阔地区；⑤交通指向性：沿江、沿海、沿铁路线工业发达；⑥高新技术产业：以智力密集区为中心，如北京中关村、深圳高新区等。"},{"id":"g2_geography_u044_ex04","knowledge_id":"g2_geography_u044","question":"判断题：中国工业分布不均，沿海地区比内陆地区工业发达。（  ）","answer":"答案：√。解析：中国工业分布不均，沿海地区凭借优越的地理位置、便利的交通、发达的经济、广阔的市场等，工业比内陆地区发达。"},{"id":"g2_geography_u044_ex05","knowledge_id":"g2_geography_u044","question":"选择题：中国最大的综合性工业基地是（  ）。A.辽中南  B.京津唐  C.沪宁杭  D.珠江三角洲","answer":"答案：C. 沪宁杭。解析：沪宁杭工业基地（长江三角洲）是中国最大的综合性工业基地，部门齐全，技术水平高。"},{"id":"g2_geography_u044_ex06","knowledge_id":"g2_geography_u044","question":"填空题：中国四大工业基地中，以重工业为主的是______，以轻工业为主的是______。","answer":"答案：辽中南；珠江三角洲。解析：辽中南是中国著名的重工业基地，珠江三角洲以轻工业为主，京津唐是北方最大的综合性工业基地，沪宁杭是全国最大的综合性工业基地。"},{"id":"g2_geography_u044_ex07","knowledge_id":"g2_geography_u044","question":"选择题：中国最早建立的经济特区位于（  ）。A.辽中南  B.京津唐  C.沪宁杭  D.珠江三角洲","answer":"答案：D. 珠江三角洲。解析：珠江三角洲是中国改革开放的窗口，深圳、珠海是中国最早的经济特区，珠江三角洲是中国最早对外开放地区之一。"},{"id":"g2_geography_u044_ex08","knowledge_id":"g2_geography_u044","question":"简答题：分析中国工业分布不均的原因。","answer":"答案：原因：①自然条件：东部沿海地形以平原、丘陵为主，气候温暖湿润，水源充足，矿产资源丰富；②交通条件：东部沿海交通便利，海运、河运、铁路、公路、航空综合发展；③经济基础：东部开发历史悠久，经济基础雄厚，资金、技术、人才集中；④市场条件：东部人口稠密，市场广阔，消费能力强；⑤政策因素：改革开放以来，国家优先发展东部沿海地区；⑥国际合作：东部沿海便于引进外资、先进技术和管理经验。"},{"id":"g2_geography_u044_ex09","knowledge_id":"g2_geography_u044","question":"读图题：读中国四大工业基地分布图，指出四大工业基地的地理位置。","answer":"答案：①辽中南工业基地：位于辽宁省中南部，沈阳、大连、鞍山、本溪等城市；②京津唐工业基地：位于华北平原东北部，北京、天津、唐山等城市；③沪宁杭工业基地：位于长江三角洲，上海、南京、杭州、苏州、无锡等城市；④珠江三角洲工业基地：位于广东省中南部，广州、深圳、珠海、佛山、东莞等城市。"},{"id":"g2_geography_u044_ex10","knowledge_id":"g2_geography_u044","question":"综合题：分析中国工业发展面临的问题及应对措施。","answer":"答案：问题：①资源消耗大：高耗能、高耗资源工业比重大；②环境污染严重：工业排放造成大气、水、土壤污染；③产业结构不合理：传统产业比重过大，高新技术产业比重小；④区域发展不均衡：东部与中西部工业差距大；⑤国际竞争加剧：面临发达国家和发展中国家的双重竞争。措施：①调整产业结构：发展高新技术产业和现代服务业；②转变发展方式：从粗放型向集约型转变；③加强环境保护：发展低碳经济、循环经济；④推进区域协调：实施西部大开发、东北振兴等战略；⑤提高自主创新能力：增强企业核心竞争力；⑥'走出去'战略：提高中国工业的国际竞争力。"},{"id":"g2_geography_u045_ex01","knowledge_id":"g2_geography_u045","question":"选择题：辽中南工业基地以（  ）为主。A.轻工业  B.重工业  C.高新技术产业  D.纺织业","answer":"答案：B. 重工业。解析：辽中南工业基地是中国著名的重工业基地，以钢铁、机械、化工、石油等重工业为主。"},{"id":"g2_geography_u045_ex02","knowledge_id":"g2_geography_u045","question":"填空题：辽中南工业基地位于辽宁省中南部，是中国著名的______工业基地。","answer":"答案：重。解析：辽中南工业基地以重工业为主，是中国著名的重工业基地，被称为'共和国工业长子'。"},{"id":"g2_geography_u045_ex03","knowledge_id":"g2_geography_u045","question":"简答题：简述辽中南工业基地的特点。","answer":"答案：辽中南工业基地的特点：①地位：中国著名的重工业基地；②位置：位于辽宁省中南部，包括沈阳、大连、鞍山、本溪、抚顺、阜新等城市；③主要工业部门：钢铁（鞍山、本溪）、机械制造（沈阳）、石油化工（大连、辽河油田）、煤炭（抚顺、阜新）、化学工业等；④发展条件：丰富的煤、铁、石油资源，便利的铁路交通，雄厚工业基础；⑤问题：资源枯竭、设备老化、产业结构单一、环境污染严重；⑥振兴举措：实施东北老工业基地振兴战略，加快产业结构调整和升级。"},{"id":"g2_geography_u045_ex04","knowledge_id":"g2_geography_u045","question":"判断题：辽中南工业基地是中国著名的重工业基地。（  ）","answer":"答案：√。解析：辽中南工业基地以重工业为主，是中国著名的重工业基地，有'共和国工业长子'之称。"},{"id":"g2_geography_u045_ex05","knowledge_id":"g2_geography_u045","question":"选择题：鞍山市的主要工业是（  ）。A.煤炭工业  B.钢铁工业  C.石油工业  D.纺织工业","answer":"答案：B. 钢铁工业。解析：鞍山市是中国重要的钢铁工业基地，有'钢都'之称，主要工业是钢铁工业。"},{"id":"g2_geography_u045_ex06","knowledge_id":"g2_geography_u045","question":"填空题：辽中南工业基地被誉为'______长子'，是中国重要的重工业基地。","answer":"答案：共和国。解析：辽中南工业基地被誉为'共和国工业长子'，是中国工业化的摇篮。"},{"id":"g2_geography_u045_ex07","knowledge_id":"g2_geography_u045","question":"选择题：辽中南工业基地发展的主要优势是（  ）。A.轻工业基础好  B.煤铁资源丰富  C.水能资源丰富  D.海运便利","answer":"答案：B. 煤铁资源丰富。解析：辽中南工业基地发展重工业的主要优势是煤、铁资源丰富，如鞍山、本溪的铁矿，抚顺、阜新的煤矿。"},{"id":"g2_geography_u045_ex08","knowledge_id":"g2_geography_u045","question":"简答题：分析辽中南工业基地面临的问题及振兴措施。","answer":"答案：问题：①资源枯竭：长期开采导致煤、铁等资源减少；②设备老化：部分工业设备陈旧，技术落后；③产业结构单一：以重工业为主，经济结构不合理；④环境污染严重：工业排放造成严重污染；⑤就业压力大：产业转型带来就业问题。振兴措施：①调整产业结构：发展新兴产业和现代服务业；②技术改造：引进先进技术，改造传统产业；③发展高新技术产业：培育新的经济增长点；④治理环境：加强污染治理，改善生态环境；⑤政策支持：实施东北老工业基地振兴战略；⑥扩大开放：引进外资和先进技术。"},{"id":"g2_geography_u045_ex09","knowledge_id":"g2_geography_u045","question":"读图题：读辽中南工业基地示意图，说出主要工业城市及其主导工业部门。","answer":"答案：主要工业城市及其主导工业：①沈阳：机械制造；②鞍山：钢铁工业；③本溪：钢铁工业；④抚顺：煤炭工业；⑤阜新：煤炭工业；⑥大连：造船、石油化工；⑦盘锦：石油工业（辽河油田）；⑧辽阳：化学工业。"},{"id":"g2_geography_u045_ex10","knowledge_id":"g2_geography_u045","question":"综合题：分析辽中南工业基地发展的区位条件。","answer":"答案：区位条件：①自然条件：地形以平原为主，土地资源丰富；②资源条件：煤（抚顺、阜新）、铁（鞍山、本溪）、石油（辽河油田）、森林（东北林区）等资源丰富；③交通条件：铁路网密集（京哈线、哈大线等），大连港是重要海港，交通便利；④经济基础：是中国最早发展工业的地区之一，工业基础雄厚；⑤劳动力：人口较多，劳动力资源丰富；⑥市场：邻近东北和华北市场，市场广阔。"},{"id":"g2_geography_u046_ex01","knowledge_id":"g2_geography_u046","question":"选择题：京津唐工业基地是（  ）最大的综合性工业基地。A.中国  B.北方地区  C.华东地区  D.华南地区","answer":"答案：B. 北方地区。解析：京津唐工业基地是北方地区最大的综合性工业基地，以北京、天津、唐山为核心。"},{"id":"g2_geography_u046_ex02","knowledge_id":"g2_geography_u046","question":"填空题：京津唐工业基地包括______、______、唐山等城市，是北方最大的综合性工业基地。","answer":"答案：北京；天津。解析：京津唐工业基地以北京、天津、唐山为核心，包括北京、天津、唐山、秦皇岛、保定等城市。"},{"id":"g2_geography_u046_ex03","knowledge_id":"g2_geography_u046","question":"简答题：简述京津唐工业基地的特点。","answer":"答案：京津唐工业基地特点：①地位：北方地区最大的综合性工业基地；②位置：位于华北平原东北部，包括北京、天津、唐山等城市；③主要工业部门：钢铁、化工、机械、电子、食品、纺织、汽车等综合性工业；④发展条件：丰富的煤（开滦）、铁（迁安）、石油（华北油田、渤海油田）资源，便利的海陆交通（北京是全国铁路、航空枢纽，天津是北方重要港口），雄厚的科技力量（北京高校、科研院所集中）；⑤优势：科技力量雄厚，是全国重要的科技、文化中心。"},{"id":"g2_geography_u046_ex04","knowledge_id":"g2_geography_u046","question":"判断题：京津唐工业基地是中国最大的综合性工业基地。（  ）","answer":"答案：×。解析：京津唐工业基地是北方最大的综合性工业基地，但不是中国最大的综合性工业基地；中国最大的综合性工业基地是沪宁杭工业基地。"},{"id":"g2_geography_u046_ex05","knowledge_id":"g2_geography_u046","question":"选择题：京津唐工业基地以（  ）为核心。A.北京  B.天津  C.唐山  D.秦皇岛","answer":"答案：A. 北京。解析：京津唐工业基地以北京为核心，北京是全国的政治、文化、科技中心，也是重要的工业城市。"},{"id":"g2_geography_u046_ex06","knowledge_id":"g2_geography_u046","question":"填空题：京津唐工业基地发展的主要优势是______力量雄厚，______资源丰富。","answer":"答案：科技；矿产。解析：京津唐工业基地发展的主要优势是科技力量雄厚（北京高校、科研院所集中），矿产资源（煤、铁、石油）丰富。"},{"id":"g2_geography_u046_ex07","knowledge_id":"g2_geography_u046","question":"选择题：天津港是中国北方重要的（  ）。A.航空港  B.海港  C.内河港  D.陆港","answer":"答案：B. 海港。解析：天津港是中国北方重要的海港，是京津唐工业基地重要的出海口。"},{"id":"g2_geography_u046_ex08","knowledge_id":"g2_geography_u046","question":"简答题：分析京津唐工业基地发展的区位条件。","answer":"答案：区位条件：①资源：煤（开滦煤矿）、铁（迁安铁矿）、石油（华北油田、渤海油田）、海盐（长芦盐场）等资源丰富；②交通：铁路（京哈线、京广线、京沪线、京九线等）、航空（北京是全国航空枢纽）、海运（天津港、秦皇岛港）等综合交通发达；③科技：北京是全国科技、文化中心，高校和科研院所集中，科技力量雄厚；④市场：人口稠密，市场广阔，邻近华北和东北市场；⑤农业基础：华北平原是中国重要的农业区，为工业发展提供食品和原料；⑥政策：首都北京所在地，得到国家政策支持。"},{"id":"g2_geography_u046_ex09","knowledge_id":"g2_geography_u046","question":"读图题：读京津唐工业基地示意图，说出主要工业城市及其主要工业部门。","answer":"答案：主要工业城市及其主要工业部门：①北京：高新技术产业、电子、汽车、机械、纺织等；②天津：化工、机械、电子、纺织、石油化工、海洋化工等；③唐山：钢铁、煤炭、陶瓷、建材等；④秦皇岛：港口、玻璃工业；⑤保定：化纤、汽车、纺织等。"},{"id":"g2_geography_u046_ex10","knowledge_id":"g2_geography_u046","question":"综合题：分析京津唐工业基地发展中应注意的问题。","answer":"答案：问题：①水资源紧张：北京、天津是严重缺水城市；②环境污染：工业和人口集中造成大气、水、噪声污染；③交通拥堵；④产业结构需要升级：传统产业比重较大；⑤能源结构调整：需要减少煤炭使用，增加清洁能源比重。措施：①节约用水：实施南水北调等工程；②治理污染：加强环境治理，发展清洁生产；③发展高新技术产业：调整产业结构；④发展循环经济：提高资源利用效率；⑤加强区域合作：与河北等周边地区协同发展；⑥推进京津冀协同发展战略。"},{"id":"g2_geography_u047_ex01","knowledge_id":"g2_geography_u047","question":"选择题：沪宁杭工业基地的核心城市是（  ）。A.上海  B.南京  C.杭州  D.苏州","answer":"答案：A. 上海。解析：沪宁杭工业基地以上海为核心城市，上海是全国最大的经济中心、贸易中心、金融中心。"},{"id":"g2_geography_u047_ex02","knowledge_id":"g2_geography_u047","question":"填空题：沪宁杭工业基地位于______三角洲，是中国最大的综合性工业基地。","answer":"答案：长江。解析：沪宁杭工业基地位于长江三角洲，是中国最大的综合性工业基地。"},{"id":"g2_geography_u047_ex03","knowledge_id":"g2_geography_u047","question":"简答题：简述沪宁杭工业基地的特点。","answer":"答案：沪宁杭工业基地特点：①地位：中国最大的综合性工业基地；②位置：位于长江三角洲，包括上海、南京、杭州、苏州、无锡、常州、宁波等城市；③主要工业部门：钢铁（上海宝钢）、汽车（上海大众、上海通用）、电子、石化、机械、轻纺、食品等综合性工业；④发展条件：便利的水陆交通（长江黄金水道、上海港、南京港、宁波港）、雄厚的技术力量、广阔的市场、发达的农业（鱼米之乡）；⑤优势：地理位置优越，经济基础雄厚，科技水平高，是中国经济最发达地区之一。"},{"id":"g2_geography_u047_ex04","knowledge_id":"g2_geography_u047","question":"判断题：沪宁杭工业基地是中国最大的综合性工业基地。（  ）","answer":"答案：√。解析：沪宁杭工业基地是中国最大的综合性工业基地，工业结构完整，技术水平高。"},{"id":"g2_geography_u047_ex05","knowledge_id":"g2_geography_u047","question":"选择题：上海宝山钢铁公司的主要区位优势是（  ）。A.接近原料产地  B.接近燃料产地  C.接近消费市场和便利的海运  D.接近大学和科研机构","answer":"答案：C. 接近消费市场和便利的海运。解析：上海宝钢靠近上海这个巨大的消费市场，且海运便利便于进口铁矿石，地理位置优越。"},{"id":"g2_geography_u047_ex06","knowledge_id":"g2_geography_u047","question":"填空题：沪宁杭工业基地的'沪'指______，'宁'指______，'杭'指______。","answer":"答案：上海；南京；杭州。解析：'沪'指上海，'宁'指南京，'杭'指杭州，三大城市是该工业基地的核心。"},{"id":"g2_geography_u047_ex07","knowledge_id":"g2_geography_u047","question":"选择题：沪宁杭工业基地的明显优势是（  ）。A.矿产资源丰富  B.水陆交通便利  C.重工业为主  D.人口稀少","answer":"答案：B. 水陆交通便利。解析：沪宁杭工业基地位于长江入海口，水陆交通便利，海运、河运、铁路、公路、航空等综合交通发达。"},{"id":"g2_geography_u047_ex08","knowledge_id":"g2_geography_u047","question":"简答题：分析沪宁杭工业基地发展的区位条件。","answer":"答案：区位条件：①地理位置：位于长江入海口，濒临东海和黄海，处于中国海岸线的中点，地理位置优越；②交通：水陆交通便利，长江黄金水道沟通内地，上海港、宁波港是重要海港，铁路、公路、航空发达；③资源：本地资源不足，但海运便利便于进口原料（特别是铁矿石、石油）；④市场：人口稠密，经济发达，市场广阔；⑤科技：高校和科研院所集中，科技力量雄厚；⑥农业：鱼米之乡，农副产品丰富；⑦历史：开发历史悠久，是中国民族工业发源地之一；⑧政策：浦东开发、长江三角洲一体化等政策支持。"},{"id":"g2_geography_u047_ex09","knowledge_id":"g2_geography_u047","question":"读图题：读沪宁杭工业基地示意图，说出主要工业城市及其主导工业部门。","answer":"答案：主要工业城市及其主导工业：①上海：钢铁（宝钢）、汽车、电子、石化、机械、造船、金融、贸易等；②南京：电子、汽车、化工、机械等；③杭州：电子、纺织、机械、家电等；④苏州：电子、纺织、机械、丝绸等；⑤无锡：轻纺、电子、机械等；⑥宁波：石化、钢铁、造船等。"},{"id":"g2_geography_u047_ex10","knowledge_id":"g2_geography_u047","question":"综合题：分析沪宁杭工业基地的主要优势及发展方向。","answer":"答案：主要优势：①地理位置优越：长江入海口，沿海沿江；②交通便利：水陆空综合交通发达；③经济基础雄厚：中国经济最发达地区之一；④科技水平高：高校和科研院所集中；⑤市场广阔：人口稠密，经济发达；⑥对外开放程度高：是中国对外开放的重要窗口。发展方向：①发展高新技术产业：重点发展电子信息、生物医药、新能源、新材料等；②发展现代服务业：金融、贸易、航运、信息服务等；③建设国际经济、金融、贸易、航运中心；④推进长三角一体化；⑤加强环境保护，治理污染；⑥提高自主创新能力；⑦打造世界级城市群。"},{"id":"g2_geography_u048_ex01","knowledge_id":"g2_geography_u048","question":"选择题：珠江三角洲工业基地以（  ）为主。A.重工业  B.轻工业  C.煤炭工业  D.钢铁工业","answer":"答案：B. 轻工业。解析：珠江三角洲工业基地以轻工业为主，主要部门有家电、电子、食品、服装、玩具等。"},{"id":"g2_geography_u048_ex02","knowledge_id":"g2_geography_u048","question":"填空题：珠江三角洲工业基地位于______省中南部，是改革开放后发展最快的工业基地之一。","answer":"答案：广东。解析：珠江三角洲工业基地位于广东省中南部，是中国改革开放的前沿。"},{"id":"g2_geography_u048_ex03","knowledge_id":"g2_geography_u048","question":"简答题：简述珠江三角洲工业基地的特点。","answer":"答案：珠江三角洲工业基地特点：①地位：改革开放后发展最快的工业基地之一；②位置：位于广东省中南部，包括广州、深圳、珠海、佛山、东莞、中山等城市；③主要工业部门：家电、电子、食品、服装、玩具、家具、建材等轻工业；④经济特点：以外向型经济为主，外贸出口占有很大比重，是典型的'前店后厂'模式；⑤发展条件：邻近港澳，便于引进资金、技术和管理经验；劳动力丰富；海运便利（广州港、深圳港、珠海港）；政策优惠（经济特区）。"},{"id":"g2_geography_u048_ex04","knowledge_id":"g2_geography_u048","question":"判断题：珠江三角洲工业基地是以外向型经济为主的工业基地。（  ）","answer":"答案：√。解析：珠江三角洲工业基地以轻工业为主，是典型的外向型经济，外贸出口占有很大比重。"},{"id":"g2_geography_u048_ex05","knowledge_id":"g2_geography_u048","question":"选择题：珠江三角洲工业基地的核心城市是（  ）。A.广州  B.深圳  C.珠海  D.佛山","answer":"答案：A、B。解析：珠江三角洲工业基地的核心城市是广州和深圳。广州是广东省省会，是华南地区的经济、文化中心；深圳是中国最早的经济特区之一，高新技术产业发达。"},{"id":"g2_geography_u048_ex06","knowledge_id":"g2_geography_u048","question":"填空题：珠江三角洲工业基地以______型和______型经济为主，是改革开放的'______'。","answer":"答案：外向；轻；窗口。解析：珠江三角洲以外向型经济和轻型经济为主，是中国改革开放的'窗口'。"},{"id":"g2_geography_u048_ex07","knowledge_id":"g2_geography_u048","question":"选择题：珠江三角洲工业基地发展最突出的优势是（  ）。A.资源丰富  B.邻近港澳  C.重工业基础好  D.气候寒冷","answer":"答案：B. 邻近港澳。解析：珠江三角洲邻近香港、澳门，便于引进资金、技术和管理经验，是其发展最突出的优势。"},{"id":"g2_geography_u048_ex08","knowledge_id":"g2_geography_u048","question":"简答题：什么是'前店后厂'模式？","answer":"答案：'前店后厂'是珠江三角洲与香港、澳门之间的一种经济合作模式。'前店'指香港、澳门，主要负责产品的设计、销售、市场推广等；'后厂'指珠江三角洲地区，主要负责产品的加工、制造等。这种模式充分发挥了香港、澳门在国际市场、销售网络等方面的优势，以及珠江三角洲在土地、劳动力等方面的优势，实现了优势互补、互利共赢。"},{"id":"g2_geography_u048_ex09","knowledge_id":"g2_geography_u048","question":"读图题：读珠江三角洲工业基地示意图，说出主要工业城市及其主导工业部门。","answer":"答案：主要工业城市及其主导工业：①广州：汽车、电子、石化、机械、纺织等；②深圳：电子、家电、通信设备、金融、贸易等；③珠海：电子、家电、海洋化工等；④佛山：陶瓷、家电、纺织、机械等；⑤东莞：电子、家具、玩具、服装等；⑥中山：家电、家具、灯饰等；⑦惠州：电子、石化等；⑧江门：纺织、家电、造纸等。"},{"id":"g2_geography_u048_ex10","knowledge_id":"g2_geography_u048","question":"综合题：分析珠江三角洲工业基地发展的区位条件。","answer":"答案：区位条件：①地理位置：位于广东省中南部，珠江入海口，濒临南海，邻近港澳；②交通：海运便利（广州港、深圳港、珠海港等），铁路（京广线、京九线、广深线等）、公路、航空发达；③侨乡：广东是著名侨乡，便于吸引海外投资；④政策：改革开放的前沿，深圳、珠海是中国最早的经济特区；⑤劳动力：人口稠密，劳动力丰富且廉价；⑥市场：邻近港澳和国际市场，便于发展外向型经济；⑦土地：地势平坦，土地资源相对丰富；⑧海外资源：海运便利便于进口原料。"},{"id":"g2_geography_u049_ex01","knowledge_id":"g2_geography_u049","question":"选择题：中国最早的高新技术产业开发试验区是（  ）。A.北京中关村  B.武汉东湖  C.深圳高新区  D.上海张江","answer":"答案：A. 北京中关村。解析：北京中关村科技园区是中国最早建立的高新技术产业开发试验区，成立于1988年。"},{"id":"g2_geography_u049_ex02","knowledge_id":"g2_geography_u049","question":"填空题：中国高新技术产业发展迅速，主要集中在______密集和______程度高的地区。","answer":"答案：智力；开放。解析：中国高新技术产业发展迅速，主要集中在智力密集（如高校、科研院所集中区）和对外开放程度高的地区。"},{"id":"g2_geography_u049_ex03","knowledge_id":"g2_geography_u049","question":"简答题：简述中国高新技术产业的主要分布地区。","answer":"答案：中国高新技术产业主要分布地区：①北京中关村：以北京海淀区为中心，是中国最早、最大的高新技术产业基地；②武汉东湖：以武汉东湖新技术开发区为中心；③深圳高新区：依托深圳经济特区发展起来；④上海张江：上海张江高科技园区；⑤西安高新区：以西安交通大学等高校为依托；⑥成都高新区；⑦天津滨海新区等。这些地区多分布在智力密集和对外开放程度高的大城市和沿海地区。"},{"id":"g2_geography_u049_ex04","knowledge_id":"g2_geography_u049","question":"判断题：高新技术产业已成为推动中国经济发展的重要力量。（  ）","answer":"答案：√。解析：高新技术产业是中国经济发展的重要引擎，对推动中国产业结构升级和经济转型具有重要作用。"},{"id":"g2_geography_u049_ex05","knowledge_id":"g2_geography_u049","question":"选择题：中国高新技术产业开发区分布的特点是（  ）。A.主要分布在西部内陆  B.主要分布在智力密集的大城市  C.主要分布在农村  D.主要分布在高原地区","answer":"答案：B. 主要分布在智力密集的大城市。解析：中国高新技术产业开发区主要分布在大城市，特别是高校和科研院所集中、智力资源密集的沿海大城市。"},{"id":"g2_geography_u049_ex06","knowledge_id":"g2_geography_u049","question":"填空题：中国高新技术产业以电子信息和______产业为先导，正在快速发展。","answer":"答案：生物医药。解析：中国高新技术产业以电子信息和生物医药为先导，航空航天、新材料、新能源等领域也在快速发展。"},{"id":"g2_geography_u049_ex07","knowledge_id":"g2_geography_u049","question":"选择题：影响高新技术产业的最主要因素是（  ）。A.劳动力数量  B.原料  C.科技和人才  D.土地","answer":"答案：C. 科技和人才。解析：高新技术产业以高新技术为基础，科技和人才是影响其发展的最主要因素。"},{"id":"g2_geography_u049_ex08","knowledge_id":"g2_geography_u049","question":"简答题：分析中国发展高新技术产业的有利条件。","answer":"答案：有利条件：①科技基础：高校和科研院所集中，科技力量雄厚，科研投入不断增加；②人才优势：人才资源丰富，每年培养大量科技人才；③政策支持：国家高度重视，出台一系列扶持政策；④市场广阔：中国经济发展迅速，对高新技术产品需求旺盛；⑤对外开放：便于引进国外先进技术和管理经验；⑥产业基础：中国制造业基础雄厚，为高新技术产业发展提供支撑；⑦资金支持：资本市场发展，为高新技术产业提供融资渠道；⑧基础设施：交通、通信等基础设施完善。"},{"id":"g2_geography_u049_ex09","knowledge_id":"g2_geography_u049","question":"读图题：读中国高新技术产业开发区分布图，指出中国主要的高新技术产业基地。","answer":"答案：中国主要的高新技术产业基地：①北京中关村科技园区；②上海张江高科技园区；③深圳高新技术产业园区；④武汉东湖新技术开发区；⑤西安高新技术产业开发区；⑥成都高新技术产业开发区；⑦天津滨海新区；⑧南京、苏州、杭州等地的高新技术产业园区。这些基地多分布在大城市，特别是沿海大城市和高校集中地区。"},{"id":"g2_geography_u049_ex10","knowledge_id":"g2_geography_u049","question":"综合题：分析发展高新技术产业对中国经济发展的意义。","answer":"答案：意义：①推动产业升级：促进传统产业改造升级，提高中国工业整体水平；②优化产业结构：提高第三产业和高新技术产业在国民经济中的比重；③提高经济效益：高新技术产业附加值高，经济效益好；④增强国际竞争力：缩小与发达国家在高科技领域的差距；⑤促进就业：创造大量高技术、高收入就业机会；⑥改善人民生活：提供更丰富、更优质的高新技术产品和服务；⑦推动可持续发展：发展低能耗、低污染的高新技术产业，促进可持续发展；⑧保障国家安全：在关键技术上实现自主可控，保障国家信息安全和经济安全。"},{"id":"g2_geography_u050_ex01","knowledge_id":"g2_geography_u050","question":"选择题：中国的GDP总量居世界（  ）位。A.第一位  B.第二位  C.第三位  D.第四位","answer":"答案：B. 第二位。解析：中国GDP总量自2010年超过日本后一直居世界第二位，仅次于美国。"},{"id":"g2_geography_u050_ex02","knowledge_id":"g2_geography_u050","question":"填空题：中国工业产值居世界第______位，制造业规模居世界第______位。","answer":"答案：一；一。解析：中国工业产值和制造业规模均居世界第一位，是世界制造业大国。"},{"id":"g2_geography_u050_ex03","knowledge_id":"g2_geography_u050","question":"简答题：简述中国经济发展取得的主要成就。","answer":"答案：中国经济发展取得的主要成就：①经济总量跃升：GDP总量居世界第二位（仅次于美国）；②工业实力增强：工业产值和制造业规模居世界第一位，是世界制造业大国；③基础设施完善：高速铁路、高速公路、机场、港口等建设取得巨大进展；④对外开放扩大：成为世界第一大货物贸易国；⑤人民生活水平提高：居民收入持续增长，脱贫攻坚取得全面胜利；⑥科技创新能力增强：研发投入持续增加，科技创新能力不断增强；⑦综合国力提升：经济、科技、国防等综合国力显著增强。"},{"id":"g2_geography_u050_ex04","knowledge_id":"g2_geography_u050","question":"判断题：中国是世界第二大经济体和世界第一大制造业大国。（  ）","answer":"答案：√。解析：中国GDP总量居世界第二位，制造业规模居世界第一位，是世界第二大经济体和世界第一大制造业大国。"},{"id":"g2_geography_u050_ex05","knowledge_id":"g2_geography_u050","question":"选择题：中国改革开放始于（  ）年。A.1976  B.1978  C.1980  D.1990","answer":"答案：B. 1978。解析：1978年12月，中国共产党十一届三中全会召开，开启了改革开放的新时期。"},{"id":"g2_geography_u050_ex06","knowledge_id":"g2_geography_u050","question":"填空题：改革开放以来，中国经济持续快速发展，GDP从1978年的世界第______位上升到现在的第______位。","answer":"答案：十；二。解析：改革开放以来，中国GDP从1978年的世界第十位上升到现在的第二位，是世界上发展最快的国家之一。"},{"id":"g2_geography_u050_ex07","knowledge_id":"g2_geography_u050","question":"选择题：中国经济发展的基本经验是（  ）。A.坚持改革开放  B.坚持计划经济  C.闭关锁国  D.重工业优先","answer":"答案：A. 坚持改革开放。解析：坚持改革开放是中国经济发展的基本经验，是决定当代中国命运的关键一招。"},{"id":"g2_geography_u050_ex08","knowledge_id":"g2_geography_u050","question":"简答题：中国经济发展面临的主要问题有哪些？","answer":"答案：中国经济发展面临的主要问题：①发展不平衡：东部与中西部、城乡之间发展差距较大；②产业结构不合理：传统产业比重较大，高新技术产业和现代服务业比重有待提高；③资源约束趋紧：资源消耗大，人均资源不足；④环境污染严重：大气、水、土壤污染问题突出；⑤创新能力不足：关键核心技术受制于人，自主创新能力有待加强；⑥人口老龄化：劳动力成本上升，老龄化压力加大；⑦国际竞争加剧：面临发达国家和发展中国家的双重竞争。"},{"id":"g2_geography_u050_ex09","knowledge_id":"g2_geography_u050","question":"读图题：读中国GDP增长曲线图，说出中国经济发展的特点。","answer":"答案：特点：①经济持续高速增长：1978年改革开放以来，中国GDP保持高速增长；②经济总量跃升：2010年GDP超过日本，跃居世界第二位；③增长稳定：经济波动相对较小，保持稳定增长；④增速放缓但平稳：近年来增速有所放缓，但仍保持中高速增长；⑤经济发展进入新常态：从高速增长转向高质量发展。"},{"id":"g2_geography_u050_ex10","knowledge_id":"g2_geography_u050","question":"综合题：分析中国经济发展的成功经验及未来发展方向。","answer":"答案：成功经验：①坚持中国共产党的领导；②坚持改革开放；③坚持中国特色社会主义道路；④重视农业基础地位；⑤实施科教兴国战略；⑥实施区域协调发展战略；⑦坚持可持续发展；⑧融入经济全球化。发展方向：①贯彻新发展理念：创新、协调、绿色、开放、共享；②建设现代化经济体系；③推动高质量发展；④实施创新驱动发展战略；⑤实施乡村振兴战略；⑥推进区域协调发展；⑦扩大对外开放，推动'一带一路'建设；⑧建设美丽中国，实现可持续发展。"}];
        const HAS_EXAMPLES = true;

        // 错题本管理器
        const WrongBookManager = {
            STORAGE_KEY_PREFIX: 'wrongbook_',
            getWrongBook(grade, subject) {
                const key = this.STORAGE_KEY_PREFIX + grade + '_' + subject;
                return JSON.parse(localStorage.getItem(key) || '[]');
            },
            addWrongBook(item) {
                const key = this.STORAGE_KEY_PREFIX + item.grade + '_' + item.subject;
                let wrongBook = this.getWrongBook(item.grade, item.subject);
                const exists = wrongBook.some(w => w.question === item.question);
                if (exists) return false;
                wrongBook.push({...item, id: item.knowledgeId + '_' + Date.now(), addedAt: new Date().toISOString()});
                localStorage.setItem(key, JSON.stringify(wrongBook));
                return true;
            }
        };

        // 学习进度管理器
        const ProgressManager = {
            STORAGE_KEY: 'study_progress',
            
            getProgress() {
                try {
                    return JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
                } catch(e) {
                    return {};
                }
            },
            
            saveProgress(progress) {
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(progress));
            },
            
            recordStudy(grade, subject, subjectName, semester, semesterName, knowledgeId, knowledgeName) {
                const progress = this.getProgress();
                const now = new Date().toISOString();
                const today = new Date().toISOString().split('T')[0];
                
                if (!progress.learnedKnowledge) progress.learnedKnowledge = {};
                if (!progress.dailyStats) progress.dailyStats = {};
                if (!progress.dailyStats[today]) {
                    progress.dailyStats[today] = { learnedCount: 0, subjects: [] };
                }
                
                const isNew = !progress.learnedKnowledge[knowledgeId];
                progress.learnedKnowledge[knowledgeId] = { learnedAt: now };
                
                if (isNew) {
                    progress.dailyStats[today].learnedCount++;
                    if (!progress.dailyStats[today].subjects.includes(subject)) {
                        progress.dailyStats[today].subjects.push(subject);
                    }
                }
                
                progress.lastStudy = {
                    grade, subject, subjectName, semester, semesterName,
                    knowledgeId, knowledgeName, timestamp: now
                };
                
                this.saveProgress(progress);
            },
            
            isLearned(knowledgeId) {
                const progress = this.getProgress();
                return !!(progress.learnedKnowledge && progress.learnedKnowledge[knowledgeId]);
            },
            
            getLastStudy() {
                const progress = this.getProgress();
                return progress.lastStudy || null;
            },
            
            getSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                if (!progress.learnedKnowledge) return { learned: 0, total: 0, percent: 0 };
                const prefix = grade + '_' + subject + '_';
                const learned = Object.keys(progress.learnedKnowledge).filter(k => k.startsWith(prefix)).length;
                const total = DATA_KNOWLEDGE.length;
                const percent = total > 0 ? Math.round((learned / total) * 100) : 0;
                return { learned, total, percent };
            },
            
            clearSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                const prefix = grade + '_' + subject + '_';
                
                if (progress.learnedKnowledge) {
                    Object.keys(progress.learnedKnowledge).forEach(k => {
                        if (k.startsWith(prefix)) {
                            delete progress.learnedKnowledge[k];
                        }
                    });
                }
                
                if (progress.lastStudy && progress.lastStudy.grade === grade && progress.lastStudy.subject === subject) {
                    delete progress.lastStudy;
                }
                
                this.saveProgress(progress);
                return true;
            }
        };

        // URL参数解析
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                grade: 'g2',
                subject: 'geography',
                semester: params.get('semester') || 'upper'
            };
        }

        const gradeNames = {'g1':'初一','g2':'初二','g3':'初三'};
        const subjectNames = {'geography':'地理'};
        const semesterNames = {'upper':'上册','lower':'下册'};

        let currentParams = getUrlParams();
        let knowledgeList = [];
        let expandedIds = new Set();
        let currentExample = null;

        const pageTitle = document.getElementById('page-title');
        const pageSubtitle = document.getElementById('page-subtitle');
        const knowledgeListEl = document.getElementById('knowledge-list');
        const emptyStateEl = document.getElementById('empty-state');
        const searchResultsInfo = document.getElementById('search-results-info');
        const searchCountEl = document.getElementById('search-count');
        const searchInput = document.getElementById('search-input');

        function initPage() {
            const {grade, subject, semester} = currentParams;
            pageTitle.textContent = gradeNames[grade] + ' · ' + subjectNames[subject] + ' · ' + semesterNames[semester];
            loadKnowledge();
            updateProgressStat();
            
            const hash = window.location.hash.replace('#', '');
            if (hash && knowledgeList.some(k => k.id === hash)) {
                setTimeout(() => {
                    toggleExpand(hash);
                    const card = document.querySelector('[data-id="' + hash + '"]');
                    if (card) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
        }

        function updateProgressStat() {
            const {grade, subject} = currentParams;
            const learnedInSemester = knowledgeList.filter(k => ProgressManager.isLearned(k.id)).length;
            document.getElementById('progress-learned').textContent = learnedInSemester;
            document.getElementById('progress-total').textContent = knowledgeList.length;
        }

        function loadKnowledge() {
            const {grade, subject, semester} = currentParams;
            knowledgeList = DATA_KNOWLEDGE.filter(k => {
                return k.semester === semester;
            });
            renderKnowledgeList();
        }

        function renderKnowledgeList(items = knowledgeList) {
            if (items.length === 0) {
                knowledgeListEl.innerHTML = '';
                emptyStateEl.classList.remove('hidden');
                return;
            }
            emptyStateEl.classList.add('hidden');
            knowledgeListEl.innerHTML = items.map(item => {
                const isExpanded = expandedIds.has(item.id);
                const isLearned = ProgressManager.isLearned(item.id);
                return '<div class="card knowledge-card ' + (isLearned ? 'learned' : '') + '" data-id="' + item.id + '">' +
                    '<div class="knowledge-header p-4 flex items-center justify-between" onclick="toggleExpand(\'' + item.id + '\')">' +
                        '<div class="flex items-center gap-3 flex-1 min-w-0">' +
                            '<div class="expand-icon ' + (isExpanded ? 'expanded' : 'collapsed') + '">' + (isExpanded ? '−' : '+') + '</div>' +
                            '<div class="flex-1 min-w-0">' +
                                '<h3 class="text-lg font-semibold text-gray-800 flex items-center gap-2">' + escapeHtml(item.name) + (isLearned ? '<span class="text-green-500 text-sm">✓ 已学习</span>' : '') + '</h3>' +
                                '<p class="text-xs text-gray-500 mt-1">' + escapeHtml(item.chapter) + '</p>' +
                            '</div>' +
                        '</div>' +
                        (HAS_EXAMPLES ? '<button class="btn btn-secondary text-sm px-3 py-1" onclick="event.stopPropagation(); showExample(\'' + item.id + '\', \'' + escapeHtml(item.name) + '\')">例题</button>' : '') +
                    '</div>' +
                    '<div id="content-' + item.id + '" class="px-6 pb-4 ' + (isExpanded ? '' : 'hidden') + '">' +
                        (item.formula ? '<div class="mb-4"><h4 class="text-sm font-medium text-gray-500 mb-2">📐 公式</h4><p class="formula-box text-gray-800 text-lg bg-gray-50 p-3 rounded-lg">' + escapeHtml(item.formula) + '</p></div>' : '') +
                        (item.explanation ? '<div><h4 class="text-sm font-medium text-gray-500 mb-2">📝 解释</h4><p class="text-gray-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(item.explanation) + '</p></div>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function toggleExpand(id) {
            const isNewLearn = !expandedIds.has(id) && !ProgressManager.isLearned(id);
            if (expandedIds.has(id)) {
                expandedIds.delete(id);
            } else {
                expandedIds.add(id);
                const {grade, subject, semester} = currentParams;
                const item = knowledgeList.find(k => k.id === id);
                if (item) {
                    ProgressManager.recordStudy(
                        grade, subject, subjectNames[subject],
                        semester, semesterNames[semester],
                        id, item.name
                    );
                }
            }
            const card = document.querySelector('[data-id="' + id + '"]');
            const content = document.getElementById('content-' + id);
            const icon = card.querySelector('.expand-icon');
            const header = card.querySelector('.knowledge-header');
            const title = card.querySelector('h3');
            if (expandedIds.has(id)) {
                content.classList.remove('hidden');
                icon.classList.remove('collapsed');
                icon.classList.add('expanded');
                icon.textContent = '−';
                header.classList.add('expanded');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('expanded');
                icon.classList.add('collapsed');
                icon.textContent = '+';
                header.classList.remove('expanded');
            }
            if (isNewLearn) {
                card.classList.add('learned');
                if (!title.querySelector('.text-green-500')) {
                    title.innerHTML += '<span class="text-green-500 text-sm">✓ 已学习</span>';
                }
                updateProgressStat();
            }
        }

        function expandAll() {
            knowledgeList.forEach(item => expandedIds.add(item.id));
            renderKnowledgeList();
        }

        function collapseAll() {
            expandedIds.clear();
            renderKnowledgeList();
        }

        function searchKnowledge(keyword, list) {
            if (!keyword) return [];
            const lower = keyword.toLowerCase();
            return list.filter(k =>
                k.name.toLowerCase().includes(lower) ||
                k.chapter.toLowerCase().includes(lower)
            );
        }

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                searchResultsInfo.classList.add('hidden');
                renderKnowledgeList();
                return;
            }
            const results = searchKnowledge(keyword, knowledgeList);
            searchCountEl.textContent = results.length;
            searchResultsInfo.classList.remove('hidden');
            renderKnowledgeList(results);
        }

        function showExample(knowledgeId, knowledgeName) {
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === knowledgeId);
            if (examples.length === 0) {
                alert('暂无例题');
                return;
            }
            const example = examples[Math.floor(Math.random() * examples.length)];
            currentExample = {...example, knowledgeId, knowledgeName, ...currentParams};
            document.getElementById('example-knowledge-name').textContent = knowledgeName;
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
            document.getElementById('example-modal').classList.remove('hidden');
        }

        function nextExample() {
            if (!currentExample) return;
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === currentExample.knowledgeId);
            const otherExamples = examples.filter(e => e !== currentExample);
            if (otherExamples.length === 0) {
                alert('没有更多例题了');
                return;
            }
            const example = otherExamples[Math.floor(Math.random() * otherExamples.length)];
            currentExample = {...example, knowledgeId: currentExample.knowledgeId, knowledgeName: currentExample.knowledgeName, ...currentParams};
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
        }

        function addToWrongBook() {
            if (!currentExample) return;
            const item = {
                knowledgeId: currentExample.knowledgeId,
                knowledgeName: currentExample.knowledgeName,
                question: currentExample.question,
                answer: currentExample.answer,
                grade: currentParams.grade,
                subject: currentParams.subject
            };
            if (WrongBookManager.addWrongBook(item)) {
                alert('已加入错题本！');
            } else {
                alert('该题目已在错题本中');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearProgress() {
            const {grade, subject} = currentParams;
            const subjectName = subjectNames[subject];
            var msg = '确定要清除【' + subjectName + '】科目的所有学习进度吗？';
            msg += '\n\n';
            msg += '此操作将清除该科目所有已学习标记，且不可恢复。';
            if (!confirm(msg)) {
                return;
            }
            ProgressManager.clearSubjectProgress(grade, subject);
            updateProgressStat();
            renderKnowledgeList();
            alert('学习进度已清除');
        }

        document.getElementById('btn-expand-all').addEventListener('click', expandAll);
        document.getElementById('btn-collapse-all').addEventListener('click', collapseAll);
        document.getElementById('btn-clear-progress').addEventListener('click', clearProgress);
        searchInput.addEventListener('keyup', e => { if (e.key === 'Enter') performSearch(); });
        searchInput.addEventListener('input', () => { if (!searchInput.value) { searchResultsInfo.classList.add('hidden'); renderKnowledgeList(); }});
        document.getElementById('close-example').addEventListener('click', () => document.getElementById('example-modal').classList.add('hidden'));
        document.getElementById('btn-show-answer').addEventListener('click', () => {
            document.getElementById('example-answer-section').classList.remove('hidden');
            document.getElementById('btn-show-answer').classList.add('hidden');
        });
        document.getElementById('btn-next-example').addEventListener('click', nextExample);
        document.getElementById('btn-add-wrong').addEventListener('click', addToWrongBook);
        document.getElementById('example-modal').addEventListener('click', e => { if (e.target.id === 'example-modal') document.getElementById('example-modal').classList.add('hidden'); });

        initPage();
    </script>
</body>
</html>
