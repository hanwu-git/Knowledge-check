    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"id":"g2_math_027","chapter":"第十一章 三角形","name":"三角形的概念与分类","formula":"三角形内角和 = 180°","explanation":"由不在同一直线上的三条线段首尾顺次相接所组成的图形叫做三角形。\n\n分类：\n1. 按角分：\n   - 锐角三角形：三个角都是锐角\n   - 直角三角形：有一个角是直角\n   - 钝角三角形：有一个角是钝角\n\n2. 按边分：\n   - 不等边三角形：三边都不相等\n   - 等腰三角形：有两条边相等\n   - 等边三角形：三边都相等（特殊的等腰三角形）","semester":"upper"},{"id":"g2_math_028","chapter":"第十一章 三角形","name":"三角形的三边关系","formula":"a + b > c\n|b - a| < c < a + b","explanation":"三角形任意两边之和大于第三边，任意两边之差小于第三边。\n\n应用：\n1. 判断三条线段能否组成三角形\n2. 求三角形某边的取值范围\n\n例如：三边长为 3, 4, 5 的三角形，因为 3+4>5, 3+5>4, 4+5>3，所以能组成三角形。","semester":"upper"},{"id":"g2_math_029","chapter":"第十一章 三角形","name":"三角形的内角和","formula":"∠A + ∠B + ∠C = 180°","explanation":"三角形的内角和等于 180°。\n\n推论：\n1. 直角三角形的两个锐角互余（和为90°）\n2. 三角形的一个外角等于与它不相邻的两个内角之和\n3. 三角形的一个外角大于任何一个与它不相邻的内角","semester":"upper"},{"id":"g2_math_030","chapter":"第十一章 三角形","name":"三角形的外角","formula":"外角 = 不相邻两内角之和","explanation":"三角形的一边与另一边的延长线组成的角，叫做三角形的外角。\n\n性质：\n1. 三角形的一个外角等于与它不相邻的两个内角之和\n2. 三角形的一个外角大于任何一个与它不相邻的内角\n3. 三角形的外角和等于 360°","semester":"upper"},{"id":"g2_math_031","chapter":"第十一章 三角形","name":"多边形内角和","formula":"(n-2) × 180°","explanation":"n 边形的内角和等于 (n-2) × 180°。\n\n常用：\n- 四边形内角和 = 360°\n- 五边形内角和 = 540°\n- 六边形内角和 = 720°\n\nn 边形的外角和等于 360°。","semester":"upper"},{"id":"g2_math_032","chapter":"第十二章 全等三角形","name":"全等三角形的概念与性质","formula":"△ABC ≌ △A'B'C'","explanation":"能够完全重合的两个三角形叫做全等三角形。\n\n性质：\n1. 全等三角形的对应边相等\n2. 全等三角形的对应角相等\n3. 全等三角形的对应高、对应中线、对应角平分线相等\n4. 全等三角形的周长相等、面积相等","semester":"upper"},{"id":"g2_math_033","chapter":"第十二章 全等三角形","name":"三角形全等的判定-SSS","formula":"三边对应相等的两个三角形全等","explanation":"边边边（SSS）：\n如果两个三角形的三条边分别相等，那么这两个三角形全等。\n\n写作：\n在 △ABC 和 △A'B'C' 中，\nAB = A'B', BC = B'C', CA = C'A'\n∴ △ABC ≌ △A'B'C'（SSS）","semester":"upper"},{"id":"g2_math_034","chapter":"第十二章 全等三角形","name":"三角形全等的判定-SAS","formula":"两边和它们的夹角对应相等的两个三角形全等","explanation":"边角边（SAS）：\n如果两个三角形的两边和它们的夹角分别相等，那么这两个三角形全等。\n\n注意：必须是夹角，而不是任意一个角。","semester":"upper"},{"id":"g2_math_035","chapter":"第十二章 全等三角形","name":"三角形全等的判定-ASA","formula":"两角和它们的夹边对应相等的两个三角形全等","explanation":"角边角（ASA）：\n如果两个三角形的两角和它们的夹边分别相等，那么这两个三角形全等。","semester":"upper"},{"id":"g2_math_036","chapter":"第十二章 全等三角形","name":"三角形全等的判定-AAS","formula":"两角和其中一角的对边对应相等的两个三角形全等","explanation":"角角边（AAS）：\n如果两个三角形的两角和其中一角的对边分别相等，那么这两个三角形全等。","semester":"upper"},{"id":"g2_math_037","chapter":"第十二章 全等三角形","name":"直角三角形全等的判定-HL","formula":"斜边和一直角边对应相等的两个直角三角形全等","explanation":"HL 定理：\n斜边和一条直角边分别相等的两个直角三角形全等。\n\n这是直角三角形特有的判定方法，HL 代表 Hypotenuse-Leg（斜边-直角边）。","semester":"upper"},{"id":"g2_math_038","chapter":"第十三章 轴对称","name":"轴对称图形","formula":"对称轴","explanation":"如果一个平面图形沿一条直线折叠，直线两旁的部分能够完全重合，那么这个图形叫做轴对称图形，这条直线就是它的对称轴。\n\n常见的轴对称图形：\n- 等腰三角形（1条对称轴）\n- 等边三角形（3条对称轴）\n- 长方形（2条对称轴）\n- 正方形（4条对称轴）\n- 圆（无数条对称轴）","semester":"upper"},{"id":"g2_math_039","chapter":"第十三章 轴对称","name":"线段垂直平分线的性质","formula":"到线段两端距离相等的点在这条线段的垂直平分线上","explanation":"垂直平分线：经过线段中点并且垂直于这条线段的直线叫做这条线段的垂直平分线。\n\n性质：\n1. 线段垂直平分线上的点到这条线段两端点的距离相等\n2. 到一条线段两端点距离相等的点，在这条线段的垂直平分线上","semester":"upper"},{"id":"g2_math_040","chapter":"第十三章 轴对称","name":"等腰三角形的性质","formula":"等腰三角形两底角相等\n三线合一：顶角平分线、底边上的中线、底边上的高互相重合","explanation":"等腰三角形：有两条边相等的三角形。\n\n性质：\n1. 等腰三角形的两底角相等（等边对等角）\n2. 等腰三角形顶角的平分线、底边上的中线、底边上的高互相重合（三线合一）\n3. 等腰三角形是轴对称图形，对称轴是顶角平分线所在的直线","semester":"upper"},{"id":"g2_math_041","chapter":"第十三章 轴对称","name":"等边三角形的性质","formula":"三边相等，三个角都等于 60°","explanation":"等边三角形：三条边都相等的三角形。\n\n性质：\n1. 三边相等\n2. 三个内角都等于 60°\n3. 是轴对称图形，有 3 条对称轴\n4. 每条边上都存在\"三线合一\"","semester":"upper"},{"id":"g2_math_042","chapter":"第十四章 整式的乘除与因式分解","name":"同底数幂的乘法","formula":"aᵐ · aⁿ = aᵐ⁺ⁿ (m, n 是正整数)","explanation":"同底数幂相乘，底数不变，指数相加。\n\n推广：\naᵐ · aⁿ · aᵖ = aᵐ⁺ⁿ⁺ᵖ","semester":"upper"},{"id":"g2_math_043","chapter":"第十四章 整式的乘除与因式分解","name":"幂的乘方与积的乘方","formula":"(aᵐ)ⁿ = aᵐⁿ\n(ab)ⁿ = aⁿbⁿ","explanation":"幂的乘方：底数不变，指数相乘。(aᵐ)ⁿ = aᵐⁿ\n\n积的乘方：把积的每一个因式分别乘方，再把所得的幂相乘。(ab)ⁿ = aⁿbⁿ","semester":"upper"},{"id":"g2_math_044","chapter":"第十四章 整式的乘除与因式分解","name":"同底数幂的除法","formula":"aᵐ / aⁿ = aᵐ⁻ⁿ (a ≠ 0, m > n)","explanation":"同底数幂相除，底数不变，指数相减。\n\n零指数幂：a⁰ = 1 (a ≠ 0)\n\n负指数幂：a⁻ⁿ = 1/aⁿ (a ≠ 0)","semester":"upper"},{"id":"g2_math_045","chapter":"第十四章 整式的乘除与因式分解","name":"整式的乘法","formula":"(a + b)(c + d) = ac + ad + bc + bd\n单项式 × 多项式 = 各项相乘再相加","explanation":"单项式乘单项式：系数相乘，同底数幂相乘。\n\n单项式乘多项式：m(a+b+c) = ma + mb + mc\n\n多项式乘多项式：(a+b)(c+d) = ac + ad + bc + bd","semester":"upper"},{"id":"g2_math_046","chapter":"第十四章 整式的乘除与因式分解","name":"乘法公式-平方差公式","formula":"(a + b)(a - b) = a² - b²","explanation":"两个数的和与这两个数的差的积，等于这两个数的平方差。\n\n应用：\n- 简便计算：(x+3)(x-3) = x² - 9\n- 简化多项式乘法","semester":"upper"},{"id":"g2_math_047","chapter":"第十四章 整式的乘除与因式分解","name":"乘法公式-完全平方公式","formula":"(a + b)² = a² + 2ab + b²\n(a - b)² = a² - 2ab + b²","explanation":"两数和（或差）的平方，等于它们的平方和，加上（或减去）它们的积的 2 倍。\n\n应用：\n- 简便计算：(x+5)² = x² + 10x + 25\n- 完全平方式：a² ± 2ab + b²","semester":"upper"},{"id":"g2_math_048","chapter":"第十四章 整式的乘除与因式分解","name":"因式分解","formula":"提公因式法、公式法","explanation":"因式分解：把一个多项式化为几个整式的积的形式。\n\n常用方法：\n1. 提公因式法：ma + mb = m(a + b)\n2. 公式法：\n   - 平方差公式：a² - b² = (a+b)(a-b)\n   - 完全平方公式：a² ± 2ab + b² = (a ± b)²\n3. 十字相乘法（拓展）","semester":"upper"},{"id":"g2_math_049","chapter":"第十五章 分式","name":"分式的概念","formula":"A/B (B 中含有字母，B ≠ 0)","explanation":"一般地，如果 A、B 表示两个整式，并且 B 中含有字母，那么式子 A/B 叫做分式。\n\n注意：\n1. 分式中分母 B ≠ 0（分母为零时无意义）\n2. 当 A = 0 时，分式 A/B = 0（前提是 B ≠ 0）","semester":"upper"},{"id":"g2_math_050","chapter":"第十五章 分式","name":"分式的基本性质","formula":"A/B = A·C / B·C = A÷C / B÷C (B ≠ 0, C ≠ 0)","explanation":"分式的分子与分母同乘（或除以）一个不为 0 的整式，分式的值不变。\n\n应用：\n1. 约分：将分子分母同除以公因式\n2. 通分：将异分母分式化为同分母分式","semester":"upper"},{"id":"g2_math_051","chapter":"第十五章 分式","name":"分式的乘除法","formula":"a/b · c/d = ac/bd\na/b ÷ c/d = ad/bc","explanation":"分式乘分式：用分子的积作为积的分子，分母的积作为积的分母。\n\n分式除以分式：把除式的分子分母颠倒位置后，与被除式相乘。","semester":"upper"},{"id":"g2_math_052","chapter":"第十五章 分式","name":"分式的加减法","formula":"同分母：a/c ± b/c = (a ± b)/c\n异分母：先通分再相加减","explanation":"同分母分式相加减：分母不变，分子相加减。\n\n异分母分式相加减：先通分，化为同分母分式，然后再加减。","semester":"upper"},{"id":"g2_math_053","chapter":"第十五章 分式","name":"分式方程","formula":"解分式方程：去分母 → 解整式方程 → 验根","explanation":"分式方程：分母中含有未知数的方程。\n\n解法步骤：\n1. 在方程两边同乘最简公分母，去分母\n2. 解所得的整式方程\n3. 检验：将整式方程的根代入最简公分母，使分母不为 0 的根是原方程的根，否则是增根","semester":"upper"},{"id":"g2_math_001","chapter":"第十六章 二次根式","name":"二次根式的概念","formula":"√a (a ≥ 0)","explanation":"形如√a的代数式叫做二次根式，其中a必须是非负数。\n关键点：\n1. 二次根式必须有根号\n2. 被开方数a必须大于或等于0\n3. 二次根式是非负数，即√a ≥ 0\n\n注意：负数没有平方根，所以二次根式中被开方数必须非负。","semester":"lower"},{"id":"g2_math_002","chapter":"第十六章 二次根式","name":"二次根式的基本性质","formula":"(√a)² = a (a ≥ 0)\n√(a²) = |a|","explanation":"1. (√a)² = a（a ≥ 0）：一个非负数的算术平方根的平方等于它本身\n2. √(a²) = |a|：一个数的平方的算术平方根等于这个数的绝对值\n\n重要应用：\n√(a²) 不等于 a，要看 a 的正负性","semester":"lower"},{"id":"g2_math_003","chapter":"第十六章 二次根式","name":"二次根式的乘除法","formula":"√a · √b = √(ab) (a ≥ 0, b ≥ 0)\n√a / √b = √(a/b) (a ≥ 0, b > 0)","explanation":"二次根式乘除法法则：\n1. √a · √b = √(ab)\n2. √a / √b = √(a/b)\n\n前提条件：a ≥ 0, b ≥ 0","semester":"lower"},{"id":"g2_math_004","chapter":"第十六章 二次根式","name":"最简二次根式","formula":"√a (a为正整数且不含能开尽方的因数)","explanation":"最简二次根式必须满足两个条件：\n1. 被开方数不含分母\n2. 被开方数中不含能开得尽方的因数或因式","semester":"lower"},{"id":"g2_math_005","chapter":"第十六章 二次根式","name":"二次根式的加减法","formula":"a√m ± b√m = (a ± b)√m","explanation":"二次根式加减法法则：\n先把各个二次根式化成最简二次根式，再把被开方数相同的二次根式进行合并。","semester":"lower"},{"id":"g2_math_006","chapter":"第十六章 二次根式","name":"二次根式的混合运算","formula":"(a + b)(a - b) = a² - b²","explanation":"二次根式混合运算顺序：\n1. 先算乘方，再算乘除，最后算加减\n2. 有括号的先算括号内的\n3. 能利用乘法公式的要先用公式简化","semester":"lower"},{"id":"g2_math_007","chapter":"第十六章 二次根式","name":"分母有理化","formula":"1/√a = √a/a (a > 0)\n1/(√a ± √b) = (√a ∓ √b)/(a - b)","explanation":"分母有理化：把分母中的根号化去，使分母变为有理数。\n\n方法：\n1. 分子分母同乘以分母的有理化因式\n2. 如 1/√3，分子分母同乘以√3，得到 √3/3","semester":"lower"},{"id":"g2_math_008","chapter":"第十七章 勾股定理","name":"勾股定理","formula":"a² + b² = c²","explanation":"勾股定理：直角三角形两条直角边的平方和等于斜边的平方。\n\n其中：\n- a, b 是直角边\n- c 是斜边（最长边）","semester":"lower"},{"id":"g2_math_009","chapter":"第十七章 勾股定理","name":"勾股定理的逆定理","formula":"若 a² + b² = c²，则△ABC是直角三角形","explanation":"勾股定理的逆定理：\n如果三角形的三边长 a, b, c 满足 a² + b² = c²，那么这个三角形是直角三角形。","semester":"lower"},{"id":"g2_math_010","chapter":"第十七章 勾股定理","name":"勾股定理的应用","formula":"a² + b² = c²","explanation":"勾股定理在实际问题中的应用：\n\n1. 测量问题\n2. 最短路径问题\n3. 立体图形中的距离计算\n4. 等腰三角形、梯形等几何图形中的边长计算","semester":"lower"},{"id":"g2_math_011","chapter":"第十八章 平行四边形","name":"平行四边形的定义与性质","formula":"对边平行且相等；对角相等；对角线互相平分","explanation":"平行四边形定义：两组对边分别平行的四边形叫做平行四边形。\n\n性质：\n1. 对边平行且相等\n2. 对角相等\n3. 相邻内角互补\n4. 对角线互相平分","semester":"lower"},{"id":"g2_math_012","chapter":"第十八章 平行四边形","name":"矩形的性质与判定","formula":"对角线相等且互相平分；四个角都是直角","explanation":"矩形：有一个角是直角的平行四边形叫做矩形。\n\n性质：\n1. 具有平行四边形的所有性质\n2. 四个角都是直角\n3. 对角线相等且互相平分","semester":"lower"},{"id":"g2_math_013","chapter":"第十八章 平行四边形","name":"菱形的性质与判定","formula":"对角线互相垂直平分；四条边都相等","explanation":"菱形：有一组邻边相等的平行四边形叫做菱形。\n\n性质：\n1. 具有平行四边形的所有性质\n2. 四条边都相等\n3. 对角线互相垂直平分","semester":"lower"},{"id":"g2_math_014","chapter":"第十八章 平行四边形","name":"正方形的性质与判定","formula":"对角线相等且互相垂直平分；四条边都相等；四个角都是直角","explanation":"正方形：有一组邻边相等并且有一个角是直角的平行四边形叫做正方形。\n\n性质：\n1. 具有矩形和菱形的所有性质\n2. 四条边都相等\n3. 四个角都是直角","semester":"lower"},{"id":"g2_math_015","chapter":"第十八章 平行四边形","name":"三角形中位线","formula":"三角形的中位线平行于第三边，且等于第三边的一半","explanation":"三角形中位线：连接三角形两边中点的线段叫做三角形的中位线。\n\n性质：\n1. 中位线平行于第三边\n2. 中位线等于第三边的一半","semester":"lower"},{"id":"g2_math_016","chapter":"第十九章 一次函数","name":"变量与函数","formula":"y = f(x)","explanation":"变量：在一个变化过程中，数值发生变化的量称为变量。\n\n常量：数值始终不变的量称为常量。\n\n函数：在一个变化过程中，如果有两个变量 x 和 y，并且对于 x 的每一个确定的值，y 都有唯一确定的值与其对应，那么我们就说 x 是自变量，y 是 x 的函数。","semester":"lower"},{"id":"g2_math_017","chapter":"第十九章 一次函数","name":"正比例函数","formula":"y = kx (k ≠ 0)","explanation":"正比例函数：形如 y = kx（k 是常数，k ≠ 0）的函数叫做正比例函数。\n\n图象：经过原点的一条直线。\n\n性质：\n1. 当 k > 0 时，y 随 x 的增大而增大\n2. 当 k < 0 时，y 随 x 的增大而减小","semester":"lower"},{"id":"g2_math_018","chapter":"第十九章 一次函数","name":"一次函数","formula":"y = kx + b (k ≠ 0)","explanation":"一次函数：形如 y = kx + b（k, b 是常数，k ≠ 0）的函数叫做一次函数。\n\n图象：一条直线。\n\n性质：\n1. k 决定直线的倾斜方向\n2. b 决定直线与 y 轴的交点位置","semester":"lower"},{"id":"g2_math_019","chapter":"第十九章 一次函数","name":"一次函数的图象与性质","formula":"k > 0 时，y 随 x 的增大而增大\nk < 0 时，y 随 x 的增大而减小","explanation":"一次函数 y = kx + b 的图象与性质：\n\n1. k > 0：y 随 x 的增大而增大\n2. k < 0：y 随 x 的增大而减小\n3. 直线与 x 轴交点：(-b/k, 0)\n4. 直线与 y 轴交点：(0, b)","semester":"lower"},{"id":"g2_math_020","chapter":"第十九章 一次函数","name":"一次函数与二元一次方程","formula":"y = kx + b 对应 kx - y + b = 0","explanation":"一次函数与二元一次方程的关系：\n\n1. 一次函数 y = kx + b 的图象上的每一个点的坐标(x, y)都是二元一次方程 kx - y + b = 0 的解\n2. 以二元一次方程的解为坐标的点都在对应的一次函数的图象上","semester":"lower"},{"id":"g2_math_021","chapter":"第十九章 一次函数","name":"用函数观点看方程(组)与不等式","formula":"kx + b = 0 → x = -b/k","explanation":"用函数观点看方程与不等式：\n\n1. 解方程 kx + b = 0：求直线 y = kx + b 与 x 轴的交点的横坐标\n2. 解不等式 kx + b > 0：求直线 y = kx + b 在 x 轴上方时 x 的取值范围","semester":"lower"},{"id":"g2_math_022","chapter":"第二十章 数据的分析整理","name":"数据的描述","formula":"平均数、中位数、众数","explanation":"数据的描述：\n\n1. 平均数：所有数据的总和除以数据的个数\n2. 中位数：把数据按从小到大排列后，位于中间位置的数\n3. 众数：出现次数最多的数据","semester":"lower"},{"id":"g2_math_023","chapter":"第二十章 数据的分析整理","name":"加权平均数","formula":"x̄ = (w1x1 + w2x2 + ... + wn xn) / (w1 + w2 + ... + wn)","explanation":"加权平均数：如果 n 个数据 x₁, x₂, ..., xₙ 的权分别是 w₁, w₂, ..., wₙ，那么加权平均数为：\n\nx̄ = (w₁x₁ + w₂x₂ + ... + wₙxₙ) / (w₁ + w₂ + ... + wₙ)","semester":"lower"},{"id":"g2_math_024","chapter":"第二十章 数据的分析整理","name":"中位数和众数","formula":"中位数：中间位置的数\n众数：出现次数最多的数","explanation":"中位数：\n将一组数据按照从小到大（或从大到小）的顺序排列，如果数据的个数是奇数，则处于中间位置的数就是这组数据的中位数；如果数据的个数是偶数，则中间两个数据的平均数就是这组数据的中位数。\n\n众数：\n一组数据中出现次数最多的数据就是这组数据的众数。","semester":"lower"},{"id":"g2_math_025","chapter":"第二十章 数据的分析整理","name":"极差与方差","formula":"极差 = 最大值 - 最小值\n方差 s² = (1/n) Σ(xᵢ - x̄)²","explanation":"极差：\n一组数据中的最大值与最小值的差叫做极差。\n极差反映了一组数据的变动范围。\n\n方差：\n对于 n 个数据 x₁, x₂, ..., xₙ，各数据与它们的平均数 x̄ 的差的平方的平均数，叫做这组数据的方差。","semester":"lower"},{"id":"g2_math_026","chapter":"第二十章 数据的分析整理","name":"数据的分析整理","formula":"频数、频率、统计图","explanation":"数据的分析整理：\n\n1. 频数：每个对象出现的次数\n2. 频率：每个对象出现的次数与总次数的比值\n3. 各频率之和等于 1\n\n常用统计图：\n- 条形统计图\n- 折线统计图\n- 扇形统计图\n- 频数分布直方图\n\n作用：直观、清晰地表示数据，便于分析。","semester":"lower"}];

 4, 5, 10  C. 3, 4, 5  D. 1, 2, 3","answer":"答案：C. 3, 4, 5。解析：根据三角形三边关系：3+4>5，3+5>4，4+5>3，满足条件。而1+2=3，2+2<5，4+5<10，都不能组成三角形。"},{"id":"g2_math_028_ex03","knowledge_id":"g2_math_028","question":"填空题：三角形任意两边之差______第三边。","answer":"答案：小于。解析：三角形任意两边之差小于第三边，这是三边关系的另一种表述，可由两边之和大于第三边推导得出。"},{"id":"g2_math_028_ex04","knowledge_id":"g2_math_028","question":"判断题：长度为5、6、12的三条线段可以组成三角形。（  ）","answer":"答案：错误。解析：因为5+6=11<12，不满足两边之和大于第三边，所以不能组成三角形。"},{"id":"g2_math_028_ex05","knowledge_id":"g2_math_028","question":"选择题：三角形的两边长分别是3和7，则第三边的取值范围是？ A. 3 < x < 10  B. 4 ≤ x ≤ 10  C. 4 < x < 10  D. 3 < x < 7","answer":"答案：C. 4 < x < 10。解析：根据三边关系：7-3 < 第三边 < 7+3，即4 < x < 10。注意是开区间，不能等于4或10。"},{"id":"g2_math_028_ex06","knowledge_id":"g2_math_028","question":"填空题：等腰三角形的两边长分别为4和9，则它的周长为______。","answer":"答案：22。解析：分两种情况讨论：①4为腰，4+4=8<9，不成立；②9为腰，9+9>4，成立。周长=9+9+4=22。注意要先判断能否组成三角形。"},{"id":"g2_math_028_ex07","knowledge_id":"g2_math_028","question":"判断题：三角形中至少有一边大于周长的三分之一。（  ）","answer":"答案：正确。解析：如果三边都小于等于周长的1/3，那么三边之和就小于等于周长，这与三角形周长定义矛盾。所以至少有一边大于周长的1/3。"},{"id":"g2_math_028_ex08","knowledge_id":"g2_math_028","question":"选择题：下列说法正确的是？ A. 直角三角形不满足三边关系  B. 三角形两边之和可以等于第三边  C. 三角形任意两边之和大于第三边  D. 三角形任意两边之差大于第三边","answer":"答案：C. 三角形任意两边之和大于第三边。解析：三角形任意两边之和大于第三边，任意两边之差小于第三边。这是三角形的基本性质，所有三角形（包括直角三角形）都满足。"},{"id":"g2_math_028_ex09","knowledge_id":"g2_math_028","question":"简答题：如何判断三条线段能否组成三角形？最简单的方法是什么？","answer":"答案：判断依据是三角形三边关系：任意两边之和大于第三边。最简单的方法：只需检验较短两条线段之和是否大于最长的那条线段。如果大于，就能组成三角形；如果小于或等于，就不能组成。因为如果较短的两条之和都大于最长的，那其他组合必然满足。"},{"id":"g2_math_028_ex10","knowledge_id":"g2_math_028","question":"选择题：一个三角形的两边长为5和8，第三边为整数，则第三边可能的值有几个？ A. 7个  B. 9个  C. 8个  D. 10个","answer":"答案：B. 9个。解析：第三边的取值范围是8-5 < x < 8+5，即3 < x < 13。x为整数，所以x可以是4,5,6,7,8,9,10,11,12，共9个值。"},{"id":"g2_math_029_ex01","knowledge_id":"g2_math_029","question":"选择题：三角形的内角和等于多少度？ A. 270°  B. 360°  C. 90°  D. 180°","answer":"答案：D. 180°。解析：三角形的内角和等于180°，这是三角形的基本性质之一。可以通过剪拼或平行线的方法证明。"},{"id":"g2_math_029_ex02","knowledge_id":"g2_math_029","question":"选择题：一个三角形的两个内角分别是60°和80°，第三个角是多少度？ A. 50°  B. 40°  C. 30°  D. 60°","answer":"答案：B. 40°。解析：根据三角形内角和等于180°，第三个角 = 180° - 60° - 80° = 40°。"},{"id":"g2_math_029_ex03","knowledge_id":"g2_math_029","question":"填空题：三角形的内角和等于______度。","answer":"答案：180。解析：三角形三个内角的和等于180°，这是三角形的重要性质。"},{"id":"g2_math_029_ex04","knowledge_id":"g2_math_029","question":"判断题：任意一个三角形中，至少有两个角是锐角。（  ）","answer":"答案：正确。解析：三角形内角和为180°，如果只有一个锐角，那么另外两个角的和就会大于等于180°，这是不可能的，所以至少有两个锐角。"},{"id":"g2_math_029_ex05","knowledge_id":"g2_math_029","question":"选择题：直角三角形的两个锐角之和等于多少度？ A. 60°  B. 120°  C. 90°  D. 45°","answer":"答案：C. 90°。解析：直角三角形有一个角是90°，根据三角形内角和180°，另外两个锐角之和 = 180° - 90° = 90°，即两锐角互余。"},{"id":"g2_math_029_ex06","knowledge_id":"g2_math_029","question":"填空题：在△ABC中，∠A=50°，∠B=60°，则∠C=______°。","answer":"答案：70。解析：根据三角形内角和定理，∠C = 180° - ∠A - ∠B = 180° - 50° - 60° = 70°。"},{"id":"g2_math_029_ex07","knowledge_id":"g2_math_029","question":"判断题：钝角三角形的两个锐角之和大于90°。（  ）","answer":"答案：错误。解析：钝角三角形有一个钝角（大于90°），根据三角形内角和180°，另外两个锐角之和一定小于90°。"},{"id":"g2_math_029_ex08","knowledge_id":"g2_math_029","question":"选择题：一个三角形的三个内角度数比为2:3:4，这是一个什么三角形？ A. 锐角三角形  B. 直角三角形  C. 等边三角形  D. 钝角三角形","answer":"答案：A. 锐角三角形。解析：设三个角分别为2x, 3x, 4x，则2x+3x+4x=180°，x=20°，三个角分别为40°、60°、80°，都是锐角，所以是锐角三角形。"},{"id":"g2_math_029_ex09","knowledge_id":"g2_math_029","question":"简答题：请简述三角形内角和定理及其证明思路。","answer":"答案：三角形内角和定理：三角形三个内角的和等于180°。证明思路：过三角形的一个顶点作一边的平行线，利用平行线的性质（内错角相等），将三个内角转化为一个平角，从而证明内角和为180°。"},{"id":"g2_math_029_ex10","knowledge_id":"g2_math_029","question":"选择题：等边三角形的每个内角是多少度？ A. 120°  B. 60°  C. 90°  D. 45°","answer":"答案：B. 60°。解析：等边三角形三边相等，三个角也相等。根据三角形内角和180°，每个角 = 180° ÷ 3 = 60°。"},{"id":"g2_math_030_ex01","knowledge_id":"g2_math_030","question":"选择题：关于\"三角形的外角\"的概念，下列说法正确的是？ A. 完全相反的错误说法  B. 与该知识点无关的错误说法  C. 这是三角形的外角的正确描述  D. 混淆概念的错误说法","answer":"答案：C. 这是三角形的外角的正确描述。解析：本题考察对\"三角形的外角\"概念的理解。学习数学概念时要准确把握其定义和本质特征，注意与相似概念的区别。"},{"id":"g2_math_030_ex02","knowledge_id":"g2_math_030","question":"选择题：下列哪一项最准确地描述了三角形的外角？ A. 与实际无关  B. 只是表面现象  C. 外角 = 不相邻两内角之和...  D. 可以随意改变","answer":"答案：C. 外角 = 不相邻两内角之和...。解析：三角形的外角的核心公式/性质是：外角 = 不相邻两内角之和。理解这个公式是掌握该知识点的关键。"},{"id":"g2_math_030_ex03","knowledge_id":"g2_math_030","question":"填空题：三角形的外角的核心公式/重要结论是：______。","answer":"答案：外角 = 不相邻两内角之和。解析：这是三角形的外角的重要内容，是解决相关问题的基础。三角形的一边与另一边的延长线组成的角，叫做三角形的外角。\n\n性质：\n1. 三角形的一个外角等于与它不相邻的两个内角之和\n2. 三角形的一个外角大于任何一个与它不相邻的内角\n3. 三角形的外角和等于 3..."},{"id":"g2_math_030_ex04","knowledge_id":"g2_math_030","question":"判断题：三角形的外角只需要记住结论，不需要理解原理。（  ）","answer":"答案：错误。解析：学习三角形的外角不仅要记住结论，更要理解其推导过程和原理。只有理解了原理，才能灵活运用，解决各种变式问题。"},{"id":"g2_math_030_ex05","knowledge_id":"g2_math_030","question":"选择题：学习三角形的外角时，最重要的是？ A. 只做难题就行  B. 只看不用练  C. 只需要死记硬背  D. 理解概念并掌握应用方法","answer":"答案：D. 理解概念并掌握应用方法。解析：数学学习重在理解和应用。学习三角形的外角时，要理解概念的本质，掌握公式的推导和应用方法，通过适量的练习巩固提高。"},{"id":"g2_math_030_ex06","knowledge_id":"g2_math_030","question":"填空题：三角形的外角所在的章节是______。","answer":"答案：第十一章 三角形。解析：三角形的外角是第十一章 三角形中的重要知识点，掌握它对后续学习有重要意义。"},{"id":"g2_math_030_ex07","knowledge_id":"g2_math_030","question":"判断题：三角形的外角与其他知识点没有联系。（  ）","answer":"答案：错误。解析：数学知识是相互联系的。三角形的外角与前后知识都有密切联系，学习时要注意知识的前后联系，形成知识网络。"},{"id":"g2_math_030_ex08","knowledge_id":"g2_math_030","question":"选择题：下列关于三角形的外角的应用，说法正确的是？ A. 可以解决相关的数学问题  B. 只在考试中有用  C. 完全没有实际用处  D. 只能用于一种题型","answer":"答案：A. 可以解决相关的数学问题。解析：三角形的外角是重要的数学工具，可以用来解决多种相关的数学问题。学习时要注重应用能力的培养。"},{"id":"g2_math_030_ex09","knowledge_id":"g2_math_030","question":"简答题：请简述三角形的外角的主要内容。","answer":"答案：三角形的外角的主要内容包括：外角 = 不相邻两内角之和。三角形的一边与另一边的延长线组成的角，叫做三角形的外角。\n\n性质：\n1. 三角形的一个外角等于与它不相邻的两个内角之和\n2. 三角形的一个外角大于任何一个与它不相邻的内角\n3. 三角形的外角和等于 360°... 这是本章的重要知识点，需要在理解的基础上熟练掌握。"},{"id":"g2_math_030_ex10","knowledge_id":"g2_math_030","question":"选择题：关于三角形的外角，下列说法错误的是？ A. 不需要掌握，考试不考  B. 与后续学习有关  C. 需要理解并会应用  D. 是重要的基础知识","answer":"答案：A. 不需要掌握，考试不考。解析：三角形的外角是重要的数学基础知识，必须认真掌握。它不仅在当前学习中重要，也为后续学习打下基础。"},{"id":"g2_math_031_ex01","knowledge_id":"g2_math_031","question":"选择题：n边形的内角和公式是？ A. (n-1) × 180°  B. (n-2) × 180°  C. n × 360°  D. n × 180°","answer":"答案：B. (n-2) × 180°。解析：n边形的内角和等于(n-2) × 180°。推导方法：从n边形的一个顶点出发作对角线，可将n边形分成(n-2)个三角形，每个三角形内角和180°。"},{"id":"g2_math_031_ex02","knowledge_id":"g2_math_031","question":"选择题：四边形的内角和等于多少度？ A. 720°  B. 180°  C. 540°  D. 360°","answer":"答案：D. 360°。解析：根据公式(n-2)×180°，四边形内角和 = (4-2)×180° = 2×180° = 360°。"},{"id":"g2_math_031_ex03","knowledge_id":"g2_math_031","question":"填空题：六边形的内角和是______度。","answer":"答案：720。解析：根据公式(n-2)×180°，六边形内角和 = (6-2)×180° = 4×180° = 720°。"},{"id":"g2_math_031_ex04","knowledge_id":"g2_math_031","question":"判断题：多边形的边数增加1，内角和增加180°。（  ）","answer":"答案：正确。解析：n边形内角和=(n-2)×180°，(n+1)边形内角和=(n-1)×180°，相差180°。所以边数每增加1，内角和增加180°。"},{"id":"g2_math_031_ex05","knowledge_id":"g2_math_031","question":"选择题：一个多边形的内角和是540°，它是几边形？ A. 七边形  B. 五边形  C. 六边形  D. 四边形","answer":"答案：B. 五边形。解析：根据公式：(n-2)×180° = 540°，解得n-2 = 3，n = 5。所以是五边形。"},{"id":"g2_math_031_ex06","knowledge_id":"g2_math_031","question":"填空题：多边形的外角和等于______度。","answer":"答案：360。解析：任意多边形的外角和都等于360°，与边数无关。这是多边形的重要性质。"},{"id":"g2_math_031_ex07","knowledge_id":"g2_math_031","question":"判断题：正五边形的每个内角是108°。（  ）","answer":"答案：正确。解析：正五边形内角和=(5-2)×180°=540°，每个内角=540°÷5=108°。也可以用外角计算：每个外角=360°÷5=72°，每个内角=180°-72°=108°。"},{"id":"g2_math_031_ex08","knowledge_id":"g2_math_031","question":"选择题：下列角度中，不能成为多边形内角和的是？ A. 360°  B. 720°  C. 540°  D. 500°","answer":"答案：D. 500°。解析：多边形内角和公式是(n-2)×180°，所以内角和一定是180°的倍数。500°不是180°的倍数（500÷180≈2.78），所以不能成为多边形的内角和。"},{"id":"g2_math_031_ex09","knowledge_id":"g2_math_031","question":"简答题：如何推导n边形的内角和公式？","answer":"答案：n边形内角和公式：(n-2)×180°。推导方法：从n边形的一个顶点出发，向不相邻的顶点作对角线，可以作出(n-3)条对角线，这些对角线把n边形分成了(n-2)个三角形。每个三角形的内角和是180°，所以n边形的内角和就是(n-2)×180°。"},{"id":"g2_math_031_ex10","knowledge_id":"g2_math_031","question":"选择题：一个多边形的每个内角都是144°，它是几边形？ A. 九边形  B. 十二边形  C. 十一边形  D. 十边形","answer":"答案：D. 十边形。解析：方法一：每个内角144°，则每个外角=180°-144°=36°。外角和360°，边数=360°÷36°=10。方法二：设n边形，则(n-2)×180°=144°×n，解得n=10。"},{"id":"g2_math_032_ex01","knowledge_id":"g2_math_032","question":"选择题：全等三角形的对应边有什么关系？ A. 相等  B. 不相等  C. 成比例  D. 无法确定","answer":"答案：A. 相等。解析：全等三角形的对应边相等，对应角相等。这是全等三角形的基本性质。"},{"id":"g2_math_032_ex02","knowledge_id":"g2_math_032","question":"选择题：下列说法正确的是？ A. 全等三角形的周长相等  B. 面积相等的三角形全等  C. 周长相等的三角形全等  D. 形状相同的三角形全等","answer":"答案：A. 全等三角形的周长相等。解析：全等三角形的对应边相等，所以周长一定相等。但周长相等、面积相等或形状相同都不能保证三角形全等。"},{"id":"g2_math_032_ex03","knowledge_id":"g2_math_032","question":"填空题：能够完全重合的两个三角形叫做______。","answer":"答案：全等三角形。解析：全等三角形的定义就是能够完全重合的两个三角形，重合的顶点叫对应顶点，重合的边叫对应边，重合的角叫对应角。"},{"id":"g2_math_032_ex04","knowledge_id":"g2_math_032","question":"判断题：全等三角形的面积一定相等。（  ）","answer":"答案：正确。解析：全等三角形能够完全重合，所以它们的形状和大小都完全相同，面积自然相等。"},{"id":"g2_math_032_ex05","knowledge_id":"g2_math_032","question":"选择题：若△ABC≌△DEF，且AB=5，则DE等于？ A. 6  B. 5  C. 4  D. 3","answer":"答案：B. 5。解析：全等三角形的对应边相等。△ABC≌△DEF，AB与DE是对应边，所以DE=AB=5。"},{"id":"g2_math_032_ex06","knowledge_id":"g2_math_032","question":"填空题：全等三角形的对应角______，对应边______。","answer":"答案：相等；相等。解析：这是全等三角形的基本性质，是证明线段相等和角相等的重要依据。"},{"id":"g2_math_032_ex07","knowledge_id":"g2_math_032","question":"判断题：两个等边三角形一定全等。（  ）","answer":"答案：错误。解析：等边三角形的三个角都是60°，但边长不一定相等。两个等边三角形形状相同但大小可能不同，它们是相似的，但不一定全等。"},{"id":"g2_math_032_ex08","knowledge_id":"g2_math_032","question":"选择题：下列关于全等三角形的说法，错误的是？ A. 全等三角形的对应高相等  B. 全等三角形的对应中线相等  C. 全等三角形的对应角平分线相等  D. 面积相等的两个三角形全等","answer":"答案：D. 面积相等的两个三角形全等。解析：面积相等只能说明底和高的乘积相等，不能保证三角形全等。而全等三角形的所有对应线段（高、中线、角平分线）都相等。"},{"id":"g2_math_032_ex09","knowledge_id":"g2_math_032","question":"简答题：什么是全等三角形？它有哪些性质？","answer":"答案：能够完全重合的两个三角形叫做全等三角形。性质包括：①对应边相等；②对应角相等；③对应高相等；④对应中线相等；⑤对应角平分线相等；⑥周长相等；⑦面积相等。简单说：全等三角形的形状和大小都完全相同。"},{"id":"g2_math_032_ex10","knowledge_id":"g2_math_032","question":"选择题：△ABC≌△A'B'C'，若∠A=50°，∠B=60°，则∠C'等于？ A. 60°  B. 50°  C. 70°  D. 80°","answer":"答案：C. 70°。解析：根据三角形内角和，∠C = 180° - 50° - 60° = 70°。全等三角形对应角相等，∠C'与∠C是对应角，所以∠C' = ∠C = 70°。"},{"id":"g2_math_033_ex01","knowledge_id":"g2_math_033","question":"选择题：SSS判定定理的内容是什么？ A. 三边对应相等的两个三角形全等  B. 两边和夹角对应相等  C. 两角和对边对应相等  D. 两角和夹边对应相等","answer":"答案：A. 三边对应相等的两个三角形全等。解析：SSS（边边边）判定定理：如果两个三角形的三条边分别对应相等，那么这两个三角形全等。这是最基本的全等判定方法之一。"},{"id":"g2_math_033_ex02","knowledge_id":"g2_math_033","question":"选择题：已知△ABC的三边长为3、4、5，下列哪个三角形与它全等？ A. 三边长为3、4、5的三角形  B. 三边长为2、4、5的三角形  C. 三边长为3、5、6的三角形  D. 三边长为3、4、6的三角形","answer":"答案：A. 三边长为3、4、5的三角形。解析：根据SSS判定定理，三边对应相等的两个三角形全等。选项中只有三边长都是3、4、5的三角形才与△ABC全等。"},{"id":"g2_math_033_ex03","knowledge_id":"g2_math_033","question":"填空题：边边边判定定理可以简写成______。","answer":"答案：SSS。解析：SSS是英文Side-Side-Side的缩写，表示三条边对应相等的两个三角形全等。"},{"id":"g2_math_033_ex04","knowledge_id":"g2_math_033","question":"判断题：三条边对应相等的两个三角形全等。（  ）","answer":"答案：正确。解析：这就是SSS（边边边）全等判定定理。三边确定了，三角形的形状和大小就完全确定了。"},{"id":"g2_math_033_ex05","knowledge_id":"g2_math_033","question":"选择题：用刻度尺画一个与已知三角形全等的三角形，最直接的方法是用？ A. ASA  B. AAS  C. SSS  D. SAS","answer":"答案：C. SSS。解析：用刻度尺可以直接测量三条边的长度，然后根据SSS判定定理画出三边对应相等的三角形，就能保证全等。"},{"id":"g2_math_033_ex06","knowledge_id":"g2_math_033","question":"填空题：三角形具有______性，根据是SSS判定定理。","answer":"答案：稳定。解析：三角形三边长度确定后，三角形的形状和大小就唯一确定了，这就是三角形的稳定性。其数学依据就是SSS全等判定定理。"},{"id":"g2_math_033_ex07","knowledge_id":"g2_math_033","question":"判断题：两个等腰三角形，如果腰对应相等，那么它们全等。（  ）","answer":"答案：错误。解析：只有两条边对应相等（腰相等），不能判定两个三角形全等。SSS需要三条边都对应相等，还需要底边也对应相等才行。"},{"id":"g2_math_033_ex08","knowledge_id":"g2_math_033","question":"选择题：下列条件中，能判定△ABC≌△DEF的是？ A. ∠A=∠D, ∠B=∠E, ∠C=∠F  B. AB=DE, BC=EF, AC=DF  C. AB=DE, ∠A=∠D, ∠C=∠F  D. AB=DE, BC=EF, ∠A=∠D","answer":"答案：B. AB=DE, BC=EF, AC=DF。解析：选项A是三边对应相等（SSS），可以判定全等。选项B是两边和其中一边的对角（SSA），不能判定。选项C是三个角对应相等（AAA），只能判定相似。选项D是两角和其中一角的对边（AAS），虽然也能判定全等，但题目问的是SSS相关。"},{"id":"g2_math_033_ex09","knowledge_id":"g2_math_033","question":"简答题：工人师傅在安装门框时，为什么常常在门框上斜着钉一根木条？请用数学知识解释。","answer":"答案：这是利用了三角形的稳定性。门框是四边形，容易变形。斜着钉一根木条后，就把四边形分成了两个三角形。三角形具有稳定性（SSS），三边确定后形状就不会改变，这样门框就更加牢固了。"},{"id":"g2_math_033_ex10","knowledge_id":"g2_math_033","question":"选择题：△ABC和△DEF中，AB=DE，BC=EF，要使△ABC≌△DEF，还需要添加的条件是？ A. ∠A=∠D  B. AC=DF  C. 以上都可以  D. ∠B=∠E","answer":"答案：B. AC=DF。解析：如果添加AC=DF，就满足了SSS（三边对应相等），可以判定全等。添加∠B=∠E的话是SAS，虽然也能判定全等，但本题考察SSS，所以选AC=DF。"},{"id":"g2_math_034_ex01","knowledge_id":"g2_math_034","question":"选择题：关于\" 全等的判定-HL是第十二章 全等三角形中的重要知识点，掌握它对后续学习有重要意义。"},{"id":"g2_math_037_ex07","knowledge_id":"g2_math_037","question":"判断题：直角三角形全等的判定-HL与其他知识点没有联系。（  ）","answer":"答案：错误。解析：数学知识是相互联系的。直角三角形全等的判定-HL与前后知识都有密切联系，学习时要注意知识的前后联系，形成知识网络。"},{"id":"g2_math_037_ex08","knowledge_id":"g2_math_037","question":"选择题：下列关于直角三角形全等的判定-HL的应用，说法正确的是？ A. 只在考试中有用  B. 只能用于一种题型  C. 完全没有实际用处  D. 可以解决相关的数学问题","answer":"答案：D. 可以解决相关的数学问题。解析：直角三角形全等的判定-HL是重要的数学工具，可以用来解决多种相关的数学问题。学习时要注重应用能力的培养。"},{"id":"g2_math_037_ex09","knowledge_id":"g2_math_037","question":"简答题：请简述直角三角形全等的判定-HL的主要内容。","answer":"答案：直角三角形全等的判定-HL的主要内容包括：斜边和一直角边对应相等的两个直角三角形全等。HL 定理：\n斜边和一条直角边分别相等的两个直角三角形全等。\n\n这是直角三角形特有的判定方法，HL 代表 Hypotenuse-Leg（斜边-直角边）。... 这是本章的重要知识点，需要在理解的基础上熟练掌握。"},{"id":"g2_math_037_ex10","knowledge_id":"g2_math_037","question":"选择题：关于直角三角形全等的判定-HL，下列说法错误的是？ A. 需要理解并会应用  B. 与后续学习有关  C. 是重要的基础知识  D. 不需要掌握，考试不考","answer":"答案：D. 不需要掌握，考试不考。解析：直角三角形全等的判定-HL是重要的数学基础知识，必须认真掌握。它不仅在当前学习中重要，也为后续学习打下基础。"},{"id":"g2_math_038_ex01","knowledge_id":"g2_math_038","question":"选择题：下列图形中，是轴对称图形的是？ A. 平行四边形  B. 不等边三角形  C. 等腰三角形  D. 直角梯形","answer":"答案：C. 等腰三角形。解析：等腰三角形沿底边的高对折，两边能够完全重合，是轴对称图形。平行四边形（除特殊的）、不等边三角形、直角梯形都不是轴对称图形。"},{"id":"g2_math_038_ex02","knowledge_id":"g2_math_038","question":"选择题：等边三角形有几条对称轴？ A. 2条  B. 3条  C. 1条  D. 无数条","answer":"答案：B. 3条。解析：等边三角形的三条高（或三条中线、三条角平分线）所在的直线都是它的对称轴，所以共有3条对称轴。"},{"id":"g2_math_038_ex03","knowledge_id":"g2_math_038","question":"填空题：如果一个图形沿一条直线折叠，直线两旁的部分能够完全重合，这个图形叫做______。","answer":"答案：轴对称图形。解析：这是轴对称图形的定义，这条直线叫做它的对称轴。"},{"id":"g2_math_038_ex04","knowledge_id":"g2_math_038","question":"判断题：圆有无数条对称轴。（  ）","answer":"答案：正确。解析：圆的任意一条直径所在的直线都是它的对称轴，因为直径有无数条，所以圆有无数条对称轴。"},{"id":"g2_math_038_ex05","knowledge_id":"g2_math_038","question":"选择题：下列图形中，对称轴最多的是？ A. 等腰三角形  B. 等边三角形  C. 正方形  D. 长方形","answer":"答案：C. 正方形。解析：正方形有4条对称轴，长方形有2条，等边三角形有3条，等腰三角形有1条。所以正方形的对称轴最多。"},{"id":"g2_math_038_ex06","knowledge_id":"g2_math_038","question":"填空题：线段有______条对称轴。","answer":"答案：2。解析：线段的对称轴有两条：一条是线段本身所在的直线，另一条是线段的垂直平分线。"},{"id":"g2_math_038_ex07","knowledge_id":"g2_math_038","question":"判断题：两个能重合的图形一定关于某条直线对称。（  ）","answer":"答案：错误。解析：两个能重合的图形只是全等，但不一定关于某条直线对称。关于直线对称需要沿直线对折后重合，位置上有特殊要求。"},{"id":"g2_math_038_ex08","knowledge_id":"g2_math_038","question":"选择题：下列说法正确的是？ A. 角不是轴对称图形  B. 三角形都是轴对称图形  C. 轴对称图形的对称轴是直线  D. 轴对称图形的对称轴是线段","answer":"答案：C. 轴对称图形的对称轴是直线。解析：轴对称图形的对称轴是直线，不是线段或射线。角是轴对称图形（角平分线所在直线是对称轴）。只有等腰三角形、等边三角形等特殊三角形才是轴对称图形。"},{"id":"g2_math_038_ex09","knowledge_id":"g2_math_038","question":"简答题：什么是轴对称图形？请举出5个常见的轴对称图形。","answer":"答案：如果一个平面图形沿一条直线折叠，直线两旁的部分能够完全重合，这个图形就叫做轴对称图形，这条直线就是它的对称轴。常见的轴对称图形有：等腰三角形、等边三角形、长方形、正方形、圆、线段、角、等腰梯形等。"},{"id":"g2_math_038_ex10","knowledge_id":"g2_math_038","question":"选择题：正五边形有几条对称轴？ A. 5条  B. 3条  C. 4条  D. 6条","answer":"答案：A. 5条。解析：正n边形有n条对称轴。正五边形有5条对称轴，每条对称轴都经过一个顶点和对边中点。"},{"id":"g2_math_039_ex01","knowledge_id":"g2_math_039","question":"选择题：关于\"线段垂直平分线的性质\"的概念，下列说法正确的是？ A. 这是线段垂直平分线的性质的正确描述  B. 完全相反的错误说法  C. 与该知识点无关的错误说法  D. 混淆概念的错误说法","answer":"答案：A. 这是线段垂直平分线的性质的正确描述。解析：本题考察对\"线段垂直平分线的性质\"概念的理解。学习数学概念时要准确把握其定义和本质特征，注意与相似概念的区别。"},{"id":"g2_math_039_ex02","knowledge_id":"g2_math_039","question":"选择题：下列哪一项最准确地描述了线段垂直平分线的性质？ A. 只是表面现象  B. 与实际无关  C. 可以随意改变  D. 到线段两端距离相等的点在这条线段的垂直平分线上...","answer":"答案：D. 到线段两端距离相等的点在这条线段的垂直平分线上...。解析：线段垂直平分线的性质的核心公式/性质是：到线段两端距离相等的点在这条线段的垂直平分线上。理解这个公式是掌握该知识点的关键。"},{"id":"g2_math_039_ex03","knowledge_id":"g2_math_039","question":"填空题：线段垂直平分线的性质的核心公式/重要结论是：______。","answer":"答案：到线段两端距离相等的点在这条线段的垂直平分线上。解析：这是线段垂直平分线的性质的重要内容，是解决相关问题的基础。垂直平分线：经过线段中点并且垂直于这条线段的直线叫做这条线段的垂直平分线。\n\n性质：\n1. 线段垂直平分线上的点到这条线段两端点的距离相等\n2. 到一条线段两端点距离相等的点，在这条线段的垂直平分线上..."},{"id":"g2_math_039_ex04","knowledge_id":"g2_math_039","question":"判断题：线段垂直平分线的性质只需要记住结论，不需要理解原理。（  ）","answer":"答案：错误。解析：学习线段垂直平分线的性质不仅要记住结论，更要理解其推导过程和原理。只有理解了原理，才能灵活运用，解决各种变式问题。"},{"id":"g2_math_039_ex05","knowledge_id":"g2_math_039","question":"选择题：学习线段垂直平分线的性质时，最重要的是？ A. 理解概念并掌握应用方法  B. 只做难题就行  C. 只需要死记硬背  D. 只看不用练","answer":"答案：A. 理解概念并掌握应用方法。解析：数学学习重在理解和应用。学习线段垂直平分线的性质时，要理解概念的本质，掌握公式的推导和应用方法，通过适量的练习巩固提高。"},{"id":"g2_math_039_ex06","knowledge_id":"g2_math_039","question":"填空题：线段垂直平分线的性质所在的章节是______。","answer":"答案：第十三章 轴对称。解析：线段垂直平分线的性质是第十三章 轴对称中的重要知识点，掌握它对后续学习有重要意义。"},{"id":"g2_math_039_ex07","knowledge_id":"g2_math_039","question":"判断题：线段垂直平分线的性质与其他知识点没有联系。（  ）","answer":"答案：错误。解析：数学知识是相互联系的。线段垂直平分线的性质与前后知识都有密切联系，学习时要注意知识的前后联系，形成知识网络。"},{"id":"g2_math_039_ex08","knowledge_id":"g2_math_039","question":"选择题：下列关于线段垂直平分线的性质的应用，说法正确的是？ A. 只能用于一种题型  B. 可以解决相关的数学问题  C. 完全没有实际用处  D. 只在考试中有用","answer":"答案：B. 可以解决相关的数学问题。解析：线段垂直平分线的性质是重要的数学工具，可以用来解决多种相关的数学问题。学习时要注重应用能力的培养。"},{"id":"g2_math_039_ex09","knowledge_id":"g2_math_039","question":"简答题：请简述线段垂直平分线的性质的主要内容。","answer":"答案：线段垂直平分线的性质的主要内容包括：到线段两端距离相等的点在这条线段的垂直平分线上。垂直平分线：经过线段中点并且垂直于这条线段的直线叫做这条线段的垂直平分线。\n\n性质：\n1. 线段垂直平分线上的点到这条线段两端点的距离相等\n2. 到一条线段两端点距离相等的点，在这条线段的垂直平分线上... 这是本章的重要知识点，需要在理解的基础上熟练掌握。"},{"id":"g2_math_039_ex10","knowledge_id":"g2_math_039","question":"选择题：关于线段垂直平分线的性质，下列说法错误的是？ A. 是重要的基础知识  B. 需要理解并会应用  C. 不需要掌握，考试不考  D. 与后续学习有关","answer":"答案：C. 不需要掌握，考试不考。解析：线段垂直平分线的性质是重要的数学基础知识，必须认真掌握。它不仅在当前学习中重要，也为后续学习打下基础。"},{"id":"g2_math_040_ex01","knowledge_id":"g2_math_040","question":"选择题：等腰三角形的两个底角有什么关系？ A. 互补  B. 相等  C. 互余  D. 不相等","answer":"答案：B. 相等。解析：等腰三角形的两个底角相等（等边对等角），这是等腰三角形的重要性质之一。"},{"id":"g2_math_040_ex02","knowledge_id":"g2_math_040","question":"选择题：等腰三角形的顶角是80°，则它的底角是多少度？ A. 100°  B. 40°  C. 50°  D. 60°","answer":"答案：C. 50°。解析：等腰三角形两底角相等。设底角为x，则2x + 80° = 180°，解得x = 50°。"},{"id":"g2_math_040_ex03","knowledge_id":"g2_math_040","question":"填空题：等腰三角形的顶角平分线、底边上的中线、底边上的高相互重合，简称______。","answer":"答案：三线合一。解析：等腰三角形的顶角平分线、底边上的中线、底边上的高互相重合，这是等腰三角形的重要性质，简称\"三线合一\"。"},{"id":"g2_math_040_ex04","knowledge_id":"g2_math_040","question":"判断题：等腰三角形一定是锐角三角形。（  ）","answer":"答案：错误。解析：等腰三角形按角分类，可以是锐角三角形、直角三角形（等腰直角三角形）或钝角三角形。顶角决定了它是什么三角形。"},{"id":"g2_math_040_ex05","knowledge_id":"g2_math_040","question":"选择题：等腰直角三角形的底角等于多少度？ A. 60°  B. 30°  C. 45°  D. 90°","answer":"答案：C. 45°。解析：等腰直角三角形的顶角是90°，两底角相等且互余，所以底角 = (180°-90°)/2 = 45°。"},{"id":"g2_math_040_ex06","knowledge_id":"g2_math_040","question":"填空题：等腰三角形的一个内角是40°，则它的顶角是______°。","answer":"答案：40°或100°。解析：分两种情况：①40°角是顶角，则顶角就是40°；②40°角是底角，则顶角 = 180° - 40°×2 = 100°。所以答案是40°或100°。"},{"id":"g2_math_040_ex07","knowledge_id":"g2_math_040","question":"判断题：等腰三角形的高、中线、角平分线都重合。（  ）","answer":"答案：错误。解析：等腰三角形只有顶角的角平分线、底边上的中线、底边上的高才互相重合（三线合一），不是所有的高、中线、角平分线都重合。"},{"id":"g2_math_040_ex08","knowledge_id":"g2_math_040","question":"选择题：一个等腰三角形的两边长分别是3和7，则它的周长是？ A. 13或17  B. 17  C. 15  D. 13","answer":"答案：B. 17。解析：分两种情况：①3为腰，3+3=6<7，不成立；②7为腰，7+7>3，成立。周长=7+7+3=17。注意要先用三边关系判断能否组成三角形。"},{"id":"g2_math_040_ex09","knowledge_id":"g2_math_040","question":"简答题：等腰三角形有哪些主要性质？","answer":"答案：等腰三角形的主要性质有：①两底角相等（等边对等角）；②顶角的平分线、底边上的中线、底边上的高互相重合（三线合一）；③是轴对称图形，有一条对称轴（顶角平分线所在直线）；④两腰上的高相等、两腰上的中线相等、两底角的平分线相等。"},{"id":"g2_math_040_ex10","knowledge_id":"g2_math_040","question":"选择题：在△ABC中，AB=AC，∠B=50°，则∠A等于？ A. 50°  B. 65°  C. 80°  D. 100°","answer":"答案：C. 80°。解析：因为AB=AC，所以△ABC是等腰三角形，∠B=∠C=50°。根据三角形内角和，∠A = 180° - 50° - 50° = 80°。"},{"id":"g2_math_041_ex01","knowledge_id":"g2_math_041","question":"选择题：关于\"等边三角形的性质\"的概念，下列说法正确的是？ A. 与该知识点无关的错误说法  B. 混淆概念的错误说法  C. 这是等边三角形的性质的正确描述  D. 完全相反的错误说法","answer":"答案：C. 这是等边三角形的性质的正确描述。解析：本题考察对\"等边三角形的性质\"概念的理解。学习数学概念时要准确把握其定义和本质特征，注意与相似概念的区别。"},{"id":"g2_math_041_ex02","knowledge_id":"g2_math_041","question":"选择题：下列哪一项最准确地描述了等边三角形的性质？ A. 三边相等，三个角都等于 60°...  B. 与实际无关  C. 可以随意改变  D. 只是表面现象","answer":"答案：A. 三边相等，三个角都等于 60°...。解析：等边三角形的性质的核心公式/性质是：三边相等，三个角都等于 60°。理解这个公式是掌握该知识点的关键。"},{"id":"g2_math_041_ex03","knowledge_id":"g2_math_041","question":"填空题：等边三角形的性质的核心公式/重要结论是：______。","answer":"答案：三边相等，三个角都等于 60°。解析：这是等边三角形的性质的重要内容，是解决相关问题的基础。等边三角形：三条边都相等的三角形。\n\n性质：\n1. 三边相等\n2. 三个内角都等于 60°\n3. 是轴对称图形，有 3 条对称轴\n4. 每条边上都存在\"三线合一\"..."},{"id":"g2_math_041_ex04","knowledge_id":"g2_math_041","question":"判断题：等边三角形的性质只需要记住结论，不需要理解原理。（  ）","answer":"答案：错误。解析：学习等边三角形的性质不仅要记住结论，更要理解其推导过程和原理。只有理解了原理，才能灵活运用，解决各种变式问题。"},{"id":"g2_math_041_ex05","knowledge_id":"g2_math_041","question":"选择题：学习等边三角形的性质时，最重要的是？ A. 只需要死记硬背  B. 理解概念并掌握应用方法  C. 只做难题就行  D. 只看不用练","answer":"答案：B. 理解概念并掌握应用方法。解析：数学学习重在理解和应用。学习等边三角形的性质时，要理解概念的本质，掌握公式的推导和应用方法，通过适量的练习巩固提高。"},{"id":"g2_math_041_ex06","knowledge_id":"g2_math_041","question":"填空题：等边三角形的性质所在的章节是______。","answer":"答案：第十三章 轴对称。解析：等边三角形的性质是第十三章 轴对称中的重要知识点，掌握它对后续学习有重要意义。"},{"id":"g2_math_041_ex07","knowledge_id":"g2_math_041","question":"判断题：等边三角形的性质与其他知识点没有联系。（  ）","answer":"答案：错误。解析：数学知识是相互联系的。等边三角形的性质与前后知识都有密切联系，学习时要注意知识的前后联系，形成知识网络。"},{"id":"g2_math_041_ex08","knowledge_id":"g2_math_041","question":"选择题：下列关于等边三角形的性质的应用，说法正确的是？ A. 只能用于一种题型  B. 可以解决相关的数学问题  C. 只在考试中有用  D. 完全没有实际用处","answer":"答案：B. 可以解决相关的数学问题。解析：等边三角形的性质是重要的数学工具，可以用来解决多种相关的数学问题。学习时要注重应用能力的培养。"},{"id":"g2_math_041_ex09","knowledge_id":"g2_math_041","question":"简答题：请简述等边三角形的性质的主要内容。","answer":"答案：等边三角形的性质的主要内容包括：三边相等，三个角都等于 60°。等边三角形：三条边都相等的三角形。\n\n性质：\n1. 三边相等\n2. 三个内角都等于 60°\n3. 是轴对称图形，有 3 条对称轴\n4. 每条边上都存在\"三线合一\"... 这是本章的重要知识点，需要在理解的基础上熟练掌握。"},{"id":"g2_math_041_ex10","knowledge_id":"g2_math_041","question":"选择题：关于等边三角形的性质，下列说法错误的是？ A. 是重要的基础知识  B. 不需要掌握，考试不考  C. 与后续学习有关  D. 需要理解并会应用","answer":"答案：B. 不需要掌握，考试不考。解析：等边三角形的性质是重要的数学基础知识，必须认真掌握。它不仅在当前学习中重要，也为后续学习打下基础。"},{"id":"g2_math_042_ex01","knowledge_id":"g2_math_042","question":"选择题：同底数幂相乘的法则是？ A. 指数不变，底数相乘  B. 指数不变，底数相加  C. 底数不变，指数相乘  D. 底数不变，指数相加","answer":"答案：D. 底数不变，指数相加。解析：同底数幂的乘法法则：同底数幂相乘，底数不变，指数相加。即 aᵐ · aⁿ = aᵐ⁺ⁿ（m、n都是正整数）。"},{"id":"g2_math_042_ex02","knowledge_id":"g2_math_042","question":"选择题：a³ · a⁴ 的结果是？ A. a¹²  B. a⁷⁺  C. a⁷  D. 2a⁷","answer":"答案：C. a⁷。解析：根据同底数幂乘法法则：a³ · a⁴ = a³⁺⁴ = a⁷。注意是指数相加，不是相乘。"},{"id":"g2_math_042_ex03","knowledge_id":"g2_math_042","question":"填空题：x² · x³ = ______。","answer":"答案：x⁵。解析：根据同底数幂乘法法则，底数x不变，指数2+3=5，所以结果是x⁵。"},{"id":"g2_math_042_ex04","knowledge_id":"g2_math_042","question":"判断题：a² · a³ = a⁶。（  ）","answer":"答案：错误。解析：同底数幂相乘，底数不变，指数相加（不是相乘）。a² · a³ = a²⁺³ = a⁵，不等于a⁶。"},{"id":"g2_math_042_ex05","knowledge_id":"g2_math_042","question":"选择题：x · x² · x³ 的结果是？ A. 6x  B. x⁷  C. x⁶  D. x⁵","answer":"答案：C. x⁶。解析：同底数幂乘法推广：aᵐ · aⁿ · aᵖ = aᵐ⁺ⁿ⁺ᵖ。所以x · x² · x³ = x¹⁺²⁺³ = x⁶。注意x的指数是1。"},{"id":"g2_math_042_ex06","knowledge_id":"g2_math_042","question":"填空题：(a+b)² · (a+b)³ = ______。","answer":"答案：(a+b)⁵。解析：同底数幂乘法法则同样适用于底数是多项式的情况。底数(a+b)不变，指数2+3=5，所以结果是(a+b)⁵。"},{"id":"g2_math_042_ex07","knowledge_id":"g2_math_042","question":"判断题：aᵐ + aⁿ = aᵐ⁺ⁿ。（  ）","answer":"答案：错误。解析：这是加法，不是乘法。同底数幂的运算法则是针对乘法的。aᵐ + aⁿ 不能直接合并，除非m=n（同类项）。"},{"id":"g2_math_042_ex08","knowledge_id":"g2_math_042","question":"选择题：若 aˣ = 3，aʸ = 4，则 aˣ⁺ʸ 等于？ A. 64  B. 81  C. 12  D. 7","answer":"答案：C. 12。解析：aˣ⁺ʸ = aˣ · aʸ = 3 × 4 = 12。这是同底数幂乘法法则的逆用。"},{"id":"g2_math_042_ex09","knowledge_id":"g2_math_042","question":"简答题：同底数幂的乘法法则是什么？它可以推广到多个同底数幂相乘吗？请举例说明。","answer":"答案：同底数幂的乘法法则：同底数幂相乘，底数不变，指数相加。公式：aᵐ · aⁿ = aᵐ⁺ⁿ（m、n都是正整数）。可以推广到多个同底数幂相乘：aᵐ · aⁿ · aᵖ = aᵐ⁺ⁿ⁺ᵖ。例如：x² · x³ · x⁴ = x²⁺³⁺⁴ = x⁹。注意：①必须是同底数幂；②是乘法运算，不是加法；③指数相加，不是相乘。"},{"id":"g2_math_042_ex10","knowledge_id":"g2_math_042","question":"选择题：下列计算正确的是？ A. a² · a³ = a⁶  B. a² · a³ = a⁵  C. a · a³ = a³  D. a² + a³ = a⁵","answer":"答案：B. a² · a³ = a⁵。解析：选项A正确：a² · a³ = a²⁺³ = a⁵。选项B错误：加法不能直接合并指数。选项C错误：指数应相加而非相乘。选项D错误：a的指数是1，a · a³ = a⁴。"},{"id":"g2_math_043_ex01","knowledge_id":"g2_math_043","question":"选择题：幂的乘方的法则是？ A. 底数和指数都相乘  B. 底数不变，指数相乘  C. 底数不变，指数相加  D. 指数不变，底数相乘","answer":"答案：B. 底数不变，指数相乘。解析：幂的乘方法则：幂的乘方，底数不变，指数相乘。即 (aᵐ)ⁿ = aᵐⁿ（m、n都是正整数）。注意与同底数幂乘法（指数相加）的区别。"},{"id":"g2_math_043_ex02","knowledge_id":"g2_math_043","question":"选择题：(a²)³ 的结果是？ A. a⁶  B. a⁸  C. a⁵  D. a⁹","answer":"答案：A. a⁶。解析：根据幂的乘方法则：(a²)³ = a²ˣ³ = a⁶。注意指数是相乘，不是相加。"},{"id":"g2_math_043_ex03","knowledge_id":"g2_math_043","question":"填空题：(x³)⁴ = ______。","answer":"答案：x¹²。解析：根据幂的乘方法则，底数x不变，指数3×4=12，所以结果是x¹²。"},{"id":"g2_math_043_ex04","knowledge_id":"g2_math_043","question":"判断题：(a³)² = a⁹。（  ）","answer":"答案：错误。解析：幂的乘方，指数相乘，不是指数乘方。(a³)² = a³ˣ² = a⁶，不等于a⁹。注意区分(aᵐ)ⁿ = aᵐⁿ 和 aᵐⁿ 的含义。"},{"id":"g2_math_043_ex05","knowledge_id":"g2_math_043","question":"选择题：下列计算正确的是？ A. (a³)² = a⁵  B. (a²)³ = a⁶  C. a² + a³ = a⁵  D. a² · a³ = a⁶","answer":"答案：B. (a²)³ = a⁶。解析：选项A正确：(a²)³ = a²ˣ³ = a⁶。选项B错误：a²·a³=a⁵（指数相加）。选项C错误：(a³)²=a⁶（指数相乘）。选项D错误：加法不能这样合并。"},{"id":"g2_math_043_ex06","knowledge_id":"g2_math_043","question":"填空题：(ab)ⁿ = ______。","answer":"答案：aⁿbⁿ。解析：积的乘方等于把积的每一个因式分别乘方，再把所得的幂相乘。即(ab)ⁿ = aⁿbⁿ。"},{"id":"g2_math_043_ex07","knowledge_id":"g2_math_043","question":"判断题：(ab)² = a²b²。（  ）","answer":"答案：正确。解析：积的乘方法则：(ab)ⁿ = aⁿbⁿ。所以(ab)² = a²b²。"},{"id":"g2_math_043_ex08","knowledge_id":"g2_math_043","question":"选择题：(-2x²y³)² 的结果是？ A. 4x⁴y⁶  B. 2x⁴y⁶  C. 4x⁴y⁵  D. -4x⁴y⁶","answer":"答案：A. 4x⁴y⁶。解析：(-2x²y³)² = (-2)² · (x²)² · (y³)² = 4 · x⁴ · y⁶ = 4x⁴y⁶。注意负数的偶次幂是正数，每个因式都要乘方。"},{"id":"g2_math_043_ex09","knowledge_id":"g2_math_043","question":"简答题：同底数幂的乘法和幂的乘方有什么区别？请举例说明。","answer":"答案：两者区别在于指数的运算不同：①同底数幂的乘法：底数不变，指数相加。aᵐ · aⁿ = aᵐ⁺ⁿ，例如a² · a³ = a⁵。②幂的乘方：底数不变，指数相乘。(aᵐ)ⁿ = aᵐⁿ，例如(a²)³ = a⁶。简单记忆：乘法→加指数，乘方→乘指数。"},{"id":"g2_math_043_ex10","knowledge_id":"g2_math_043","question":"选择题：若 aᵐ = 2，则 a³ᵐ 等于？ A. 9  B. 12  C. 8  D. 6","answer":"答案：C. 8。解析：a³ᵐ = (aᵐ)³ = 2³ = 8。这是幂的乘方法则的逆用，将a³ᵐ变形为(aᵐ)³，然后代入求值。"},{"id":"g2_math_044_ex01","knowledge_id":"g2_math_044","question":"选择题：关于\"同底数幂的除法\"的概念，下列说法正确的是？ A. 混淆概念的错误说法  B. 与该知识点无关的错误说法  C. 完全相反的错误说法  D. 这是同底数幂的除法的正确描述","answer":"答案：D. 这是同底数幂的除法的正确描述。解析：本题考察对\"同底数幂的除法\"概念的理解。学习数学概念时要准确把握其定义和本质特征，注意与相似概念的区别。"},{"id":"g2_math_044_ex02","knowledge_id":"g2_math_044","question":"选择题：下列哪一项最准确地描述了同底数幂的除法？ A. 可以随意改变  B. aᵐ / aⁿ = aᵐ⁻ⁿ (a ≠ 0, m > n)...  C. 与实际无关  D. 只是表面现象","answer":"答案：B. aᵐ / aⁿ = aᵐ⁻ⁿ (a ≠ 0, m > n)...。解析：同底数幂的除法的核心公式/性质是：aᵐ / aⁿ = aᵐ⁻ⁿ (a ≠ 0, m > n)。理解这个公式是掌握该知识点的关键。"},{"id":"g2_math_044_ex03","knowledge_id":"g2_math_044","question":"填空题：同底数幂的除法的核心公式/重要结论是：______。","answer":"答案：aᵐ / aⁿ = aᵐ⁻ⁿ (a ≠ 0, m > n)。解析：这是同底数幂的除法的重要内容，是解决相关问题的基础。同底数幂相除，底数不变，指数相减。\n\n零指数幂：a⁰ = 1 (a ≠ 0)\n\n负指数幂：a⁻ⁿ = 1/aⁿ (a ≠ 0)..."},{"id":"g2_math_044_ex04","knowledge_id":"g2_math_044","question":"判断题：同底数幂的除法只需要记住结论，不需要理解原理。（  ）","answer":"答案：错误。解析：学习同底数幂的除法不仅要记住结论，更要理解其推导过程和原理。只有理解了原理，才能灵活运用，解决各种变式问题。"},{"id":"g2_math_044_ex05","knowledge_id":"g2_math_044","question":"选择题：学习同底数幂的除法时，最重要的是？ A. 只看不用练  B. 只做难题就行  C. 只需要死记硬背  D. 理解概念并掌握应用方法","answer":"答案：D. 理解概念并掌握应用方法。解析：数学学习重在理解和应用。学习同底数幂的除法时，要理解概念的本质，掌握公式的推导和应用方法，通过适量的练习巩固提高。"},{"id":"g2_math_044_ex06","knowledge_id":"g2_math_044","question":"填空题：同底数幂的除法所在的章节是______。","answer":"答案：第十四章 整式的乘除与因式分解。解析：同底数幂的除法是第十四章 整式的乘除与因式分解中的重要知识点，掌握它对后续学习有重要意义。"},{"id":"g2_math_044_ex07","knowledge_id":"g2_math_044","question":"判断题：同底数幂的除法与其他知识点没有联系。（  ）","answer":"答案：错误。解析：数学知识是相互联系的。同底数幂的除法与前后知识都有密切联系，学习时要注意知识的前后联系，形成知识网络。"},{"id":"g2_math_044_ex08","knowledge_id":"g2_math_044","question":"选择题：下列关于同底数幂的除法的应用，说法正确的是？ A. 只能用于一种题型  B. 可以解决相关的数学问题  C. 完全没有实际用处  D. 只在考试中有用","answer":"答案：B. 可以解决相关的数学问题。解析：同底数幂的除法是重要的数学工具，可以用来解决多种相关的数学问题。学习时要注重应用能力的培养。"},{"id":"g2_math_044_ex09","knowledge_id":"g2_math_044","question":"简答题：请简述同底数幂的除法的主要内容。","answer":"答案：同底数幂的除法的主要内容包括：aᵐ / aⁿ = aᵐ⁻ⁿ (a ≠ 0, m > n)。同底数幂相除，底数不变，指数相减。\n\n零指数幂：a⁰ = 1 (a ≠ 0)\n\n负指数幂：a⁻ⁿ = 1/aⁿ (a ≠ 0)... 这是本章的重要知识点，需要在理解的基础上熟练掌握。"},{"id":"g2_math_044_ex10","knowledge_id":"g2_math_044","question":"选择题：关于同底数幂的除法，下列说法错误的是？ A. 是重要的基础知识  B. 与后续学习有关  C. 不需要掌握，考试不考  D. 需要理解并会应用","answer":"答案：C. 不需要掌握，考试不考。解析：同底数幂的除法是重要的数学基础知识，必须认真掌握。它不仅在当前学习中重要，也为后续学习打下基础。"},{"id":"g2_math_045_ex01","knowledge_id":"g2_math_045","question":"选择题：关于\"整式的乘法\"的概念，下列说法正确的是？ A. 与该知识点无关的错误说法  B. 完全相反的错误说法  C. 这是整式的乘法的正确描述  D. 混淆概念的错误说法","answer":"答案：C. 这是整式的乘法的正确描述。解析：本题考察对\"整式的乘法\"概念的理解。学习数学概念时要准确把握其定义和本质特征，注意与相似概念的区别。"},{"id":"g2_math_045_ex02","knowledge_id":"g2_math_045","question":"选择题：下列哪一项最准确地描述了整式的乘法？ A. (a + b)(c + d) = ac + ad + bc ...  B. 只是表面现象  C. 与实际无关  D. 可以随意改变","answer":"答案：A. (a + b)(c + d) = ac + ad + bc ...。解析：整式的乘法的核心公式/性质是：(a + b)(c + d) = ac + ad + bc + bd。理解这个公式是掌握该知识点的关键。"},{"id":"g2_math_045_ex03","knowledge_id":"g2_math_045","question":"填空题：整式的乘法的核心公式/重要结论是：______。","answer":"答案：(a + b)(c + d) = ac + ad + bc + bd。解析：这是整式的乘法的重要内容，是解决相关问题的基础。单项式乘单项式：系数相乘，同底数幂相乘。\n\n单项式乘多项式：m(a+b+c) = ma + mb + mc\n\n多项式乘多项式：(a+b)(c+d) = ac + ad + bc + bd..."},{"id":"g2_math_045_ex04","knowledge_id":"g2_math_045","question":"判断题：整式的乘法只需要记住结论，不需要理解原理。（  ）","answer":"答案：错误。解析：学习整式的乘法不仅要记住结论，更要理解其推导过程和原理。只有理解了原理，才能灵活运用，解决各种变式问题。"},{"id":"g2_math_045_ex05","knowledge_id":"g2_math_045","question":"选择题：学习整式的乘法时，最重要的是？ A. 理解概念并掌握应用方法  B. 只需要死记硬背  C. 只看不用练  D. 只做难题就行","answer":"答案：A. 理解概念并掌握应用方法。解析：数学学习重在理解和应用。学习整式的乘法时，要理解概念的本质，掌握公式的推导和应用方法，通过适量的练习巩固提高。"},{"id":"g2_math_045_ex06","knowledge_id":"g2_math_045","question":"填空题：整式的乘法所在的章节是______。","answer":"答案：第十四章 整式的乘除与因式分解。解析：整式的乘法是第十四章 整式的乘除与因式分解中的重要知识点，掌握它对后续学习有重要意义。"},{"id":"g2_math_045_ex07","knowledge_id":"g2_math_045","question":"判断题：整式的乘法与其他知识点没有联系。（  ）","answer":"答案：错误。解析：数学知识是相互联系的。整式的乘法与前后知识都有密切联系，学习时要注意知识的前后联系，形成知识网络。"},{"id":"g2_math_045_ex08","knowledge_id":"g2_math_045","question":"选择题：下列关于整式的乘法的应用，说法正确的是？ A. 完全没有实际用处  B. 只能用于一种题型  C. 可以解决相关的数学问题  D. 只在考试中有用","answer":"答案：C. 可以解决相关的数学问题。解析：整式的乘法是重要的数学工具，可以用来解决多种相关的数学问题。学习时要注重应用能力的培养。"},{"id":"g2_math_045_ex09","knowledge_id":"g2_math_045","question":"简答题：请简述整式的乘法的主要内容。","answer":"答案：整式的乘法的主要内容包括：(a + b)(c + d) = ac + ad + bc + bd\n单项式 × 多项式 = 各项相乘再相加。单项式乘单项式：系数相乘，同底数幂相乘。\n\n单项式乘多项式：m(a+b+c) = ma + mb + mc\n\n多项式乘多项式：(a+b)(c+d) = ac + ad + bc + bd... 这是本章的重要知识点，需要在理解的基础上熟练掌握。"},{"id":"g2_math_045_ex10","knowledge_id":"g2_math_045","question":"选择题：关于整式的乘法，下列说法错误的是？ A. 需要理解并会应用  B. 是重要的基础知识  C. 不需要掌握，考试不考  D. 与后续学习有关","answer":"答案：C. 不需要掌握，考试不考。解析：整式的乘法是重要的数学基础知识，必须认真掌握。它不仅在当前学习中重要，也为后续学习打下基础。"},{"id":"g2_math_046_ex01","knowledge_id":"g2_math_046","question":"选择题：平方差公式是？ A. (a+b)(a+b) = a² + b²  B. (a+b)(a-b) = a² - b²  C. (a+b)² = a² + 2ab + b²  D. (a-b)² = a² - 2ab + b²","answer":"答案：B. (a+b)(a-b) = a² - b²。解析：平方差公式：两个数的和与这两个数的差的积，等于这两个数的平方差。即(a+b)(a-b) = a² - b²。"},{"id":"g2_math_046_ex02","knowledge_id":"g2_math_046","question":"选择题：(x+3)(x-3) 的结果是？ A. x² - 9  B. x² + 9  C. x² - 6  D. x² - 3","answer":"答案：A. x² - 9。解析：根据平方差公式：(x+3)(x-3) = x² - 3² = x² - 9。注意3也要平方。"},{"id":"g2_math_046_ex03","knowledge_id":"g2_math_046","question":"填空题：(a+2b)(a-2b) = ______。","answer":"答案：a² - 4b²。解析：根据平方差公式：(a+2b)(a-2b) = a² - (2b)² = a² - 4b²。注意2b整体平方，不能漏掉系数。"},{"id":"g2_math_046_ex04","knowledge_id":"g2_math_046","question":"判断题：(a+b)(a-b) = a² - b² 对所有a、b都成立。（  ）","answer":"答案：正确。解析：平方差公式是一个乘法公式，对于任意的a和b都成立，可以通过多项式乘法直接验证。"},{"id":"g2_math_046_ex05","knowledge_id":"g2_math_046","question":"选择题：102 × 98 的简便计算结果是？ A. 10000  B. 9998  C. 9996  D. 996","answer":"答案：C. 9996。解析：利用平方差公式：102×98 = (100+2)(100-2) = 100² - 2² = 10000 - 4 = 9996。"},{"id":"g2_math_046_ex06","knowledge_id":"g2_math_046","question":"填空题：x² - 25 = (x+5)(______)。","answer":"答案：x-5。解析：这是平方差公式的逆用。x² - 25 = x² - 5² = (x+5)(x-5)。"},{"id":"g2_math_046_ex07","knowledge_id":"g2_math_046","question":"判断题：(a+b)² = a² + b²。（  ）","answer":"答案：错误。解析：这是完全平方公式，不是平方差。(a+b)² = a² + 2ab + b²，中间有交叉项2ab，不能漏掉。"},{"id":"g2_math_046_ex08","knowledge_id":"g2_math_046","question":"选择题：下列各式中，不能用平方差公式计算的是？ A. (a+b)(-a-b)  B. (a-b)(-a-b)  C. (a+b)(a-b)  D. (-a+b)(-a-b)","answer":"答案：A. (a+b)(-a-b)。解析：平方差公式的特点是：有一项完全相同，另一项互为相反数。选项A中两项都是相反数（a+b和-a-b），不符合条件。其他选项都有一项相同、一项相反。"},{"id":"g2_math_046_ex09","knowledge_id":"g2_math_046","question":"简答题：什么是平方差公式？它有什么特点？请举例说明如何应用。","answer":"答案：平方差公式：(a+b)(a-b) = a² - b²。特点：①左边是两个二项式相乘；②有一项完全相同，另一项互为相反数；③右边是相同项的平方减去相反项的平方。应用举例：①计算：(2x+3)(2x-3) = (2x)² - 3² = 4x² - 9；②简便计算：51×49 = (50+1)(50-1) = 2500 - 1 = 2499；③因式分解：x² - 16 = (x+4)(x-4)。"},{"id":"g2_math_046_ex10","knowledge_id":"g2_math_046","question":"选择题：(2x+3y)(2x-3y) 的结果是？ A. 4x² - 6y²  B. 4x² - 9y²  C. 4x² + 9y²  D. 2x² - 3y²","answer":"答案：B. 4x² - 9y²。解析：根据平方差公式：(2x+3y)(2x-3y) = (2x)² - (3y)² = 4x² - 9y²。注意系数也要平方。"},{"id":"g2_math_047_ex01","knowledge_id":"g2_math_047","question":"选择题：(a+b)² 等于？ A. a² - 2ab + b²  B. a² + 2ab + b²  C. a² + b²  D. a² + ab + b²","answer":"答案：B. a² + 2ab + b²。解析：完全平方和公式：(a+b)² = a² + 2ab + b²。即两数和的平方，等于它们的平方和加上它们乘积的2倍。注意不要漏掉中间的2ab项。"},{"id":"g2_math_047_ex02","knowledge_id":"g2_math_047","question":"选择题：(x+2)² 的结果是？ A. x² + 4x + 4  B. x² + 4x + 2  C. x² + 4  D. x² + 2x + 4","answer":"答案：A. x² + 4x + 4。解析：根据完全平方公式：(x+2)² = x² + 2·x·2 + 2² = x² + 4x + 4。注意中间项是2ab，不能漏掉。"},{"id":"g2_math_047_ex03","knowledge_id":"g2_math_047","question":"填空题：(a-b)² = ______。","answer":"答案：a² - 2ab + b²。解析：完全平方差公式：(a-b)² = a² - 2ab + b²。两数差的平方，等于它们的平方和减去它们乘积的2倍。"},{"id":"g2_math_047_ex04","knowledge_id":"g2_math_047","question":"判断题：(a-b)² = a² - b²。（  ）","answer":"答案：错误。解析：(a-b)² = a² - 2ab + b²，这是完全平方公式，不是平方差。a² - b²是平方差，等于(a+b)(a-b)。注意不要混淆两个公式。"},{"id":"g2_math_047_ex05","knowledge_id":"g2_math_047","question":"选择题：99² 的简便计算结果是？ A. 9801  B. 9901  C. 9800  D. 9900","answer":"答案：A. 9801。解析：利用完全平方公式：99² = (100-1)² = 100² - 2×100×1 + 1² = 10000 - 200 + 1 = 9801。"},{"id":"g2_math_047_ex06","knowledge_id":"g2_math_047","question":"填空题：x² + 6x + ______ = (x+3)²。","answer":"答案：9。解析：根据完全平方公式，(x+3)² = x² + 6x + 9。这里的常数项是一次项系数一半的平方：(6/2)² = 9。"},{"id":"g2_math_047_ex07","knowledge_id":"g2_math_047","question":"判断题：(-a-b)² = a² + 2ab + b²。（  ）","answer":"答案：正确。解析：(-a-b)² = [-(a+b)]² = (a+b)² = a² + 2ab + b²。负数的平方是正数，或者直接看成(-a)² + 2·(-a)·(-b) + (-b)² = a² + 2ab + b²。"},{"id":"g2_math_047_ex08","knowledge_id":"g2_math_047","question":"选择题：如果 a + b = 5，ab = 6，则 a² + b² 等于？ A. 19  B. 11  C. 13  D. 25","answer":"答案：C. 13。解析：利用完全平方公式变形：a² + b² = (a+b)² - 2ab = 5² - 2×6 = 25 - 12 = 13。这是完全平方公式的常用变形。"},{"id":"g2_math_047_ex09","knowledge_id":"g2_math_047","question":"简答题：完全平方公式有哪两个？它们有什么联系和区别？","answer":"答案：完全平方公式有两个：①和的平方：(a+b)² = a² + 2ab + b²；②差的平方：(a-b)² = a² - 2ab + b²。联系：①都有a² + b²（平方和）；②都是三项式；③都可以用多项式乘法推导。区别：①中间项的符号不同：和的平方是+2ab，差的平方是-2ab；②记忆口诀：首平方，尾平方，积的2倍在中央，符号看前方。注意：完全平方公式展开后是三项，千万不要漏掉中间的2ab项！"},{"id":"g2_math_047_ex10","knowledge_id":"g2_math_047","question":"选择题：(2x - 3y)² 的结果是？ A. 4x² - 12xy + 9y²  B. 2x² - 6xy + 3y²  C. 4x² - 9y²  D. 4x² - 6xy + 9y²","answer":"答案：A. 4x² - 12xy + 9y²。解析：根据完全平方公式：(2x-3y)² = (2x)² - 2·(2x)·(3y) + (3y)² = 4x² - 12xy + 9y²。注意系数也要平方，中间项是2ab。"},{"id":"g2_math_048_ex01","knowledge_id":"g2_math_048","question":"选择题：因式分解是把一个多项式化为几个整式的什么形式？ A. 积的形式  B. 差的形式  C. 商的形式  D. 和的形式","answer":"答案：A. 积的形式。解析：因式分解的定义：把一个多项式化为几个整式的积的形式，叫做把这个多项式因式分解，也叫分解因式。因式分解与整式乘法是互逆变形。"},{"id":"g2_math_048_ex02","knowledge_id":"g2_math_048","question":"选择题：下列从左到右的变形，是因式分解的是？ A. x² - 4 + 3x = (x+2)(x-2) + 3x  B. x² - 4 = (x+2)(x-2)  C. x² - 2x + 1 = x(x-2) + 1  D. m(a+b) = ma + mb","answer":"答案：B. x² - 4 = (x+2)(x-2)。解析：因式分解的结果必须是几个整式的积的形式。选项A是整式的积，是因式分解。选项C是整式乘法（从积到和）。选项B和D右边都不是积的形式，而是和的形式。"},{"id":"g2_math_048_ex03","knowledge_id":"g2_math_048","question":"填空题：提取公因式法：ma + mb + mc = ______。","answer":"答案：m(a+b+c)。解析：提取公因式法是最基本的因式分解方法。多项式ma+mb+mc各项都有公因式m，把m提出来，得到m(a+b+c)。"},{"id":"g2_math_048_ex04","knowledge_id":"g2_math_048","question":"判断题：因式分解和整式乘法是互逆的变形。（  ）","answer":"答案：正确。解析：整式乘法是把几个整式相乘，化成一个多项式；因式分解是把一个多项式化成几个整式的积。它们是互逆的变形过程。"},{"id":"g2_math_048_ex05","knowledge_id":"g2_math_048","question":"选择题：x² - 9 因式分解的结果是？ A. (x-3)²  B. (x+3)(x-3)  C. (x+3)²  D. x(x-9)","answer":"答案：B. (x+3)(x-3)。解析：x² - 9 = x² - 3²，这是平方差的形式，利用平方差公式分解：a² - b² = (a+b)(a-b)，所以x² - 9 = (x+3)(x-3)。"},{"id":"g2_math_048_ex06","knowledge_id":"g2_math_048","question":"填空题：x² + 4x + 4 因式分解 = ______。","answer":"答案：(x+2)²。解析：x² + 4x + 4 = x² + 2·x·2 + 2²，符合完全平方公式a² + 2ab + b² = (a+b)²，所以分解为(x+2)²。"},{"id":"g2_math_048_ex07","knowledge_id":"g2_math_048","question":"判断题：x² + y² 可以用公式法因式分解。（  ）","answer":"答案：错误。解析：x² + y² 是平方和，没有平方和公式，不能用公式法分解。注意：我们有平方差公式a² - b² = (a+b)(a-b)，但没有平方和公式。"},{"id":"g2_math_048_ex08","knowledge_id":"g2_math_048","question":"选择题：把多项式 ax + ay + bx + by 分解因式，最恰当的方法是？ A. 十字相乘法  B. 提取公因式法  C. 公式法  D. 分组分解法","answer":"答案：D. 分组分解法。解析：这个多项式有四项，可以把前两项一组、后两项一组：ax+ay+bx+by = a(x+y) + b(x+y) = (x+y)(a+b)。这就是分组分解法。"},{"id":"g2_math_048_ex09","knowledge_id":"g2_math_048","question":"简答题：因式分解的常用方法有哪些？因式分解的一般步骤是什么？","answer":"答案：常用方法：①提取公因式法；②公式法（平方差公式、完全平方公式）；③十字相乘法（拓展）；④分组分解法（拓展）。一般步骤：\"一提二套三检查\"。一提：先看各项有没有公因式，有公因式先提取公因式；二套：提取公因式后，再看能否用公式法（平方差、完全平方）；三检查：检查每个因式是否还能继续分解，要分解到不能再分解为止。"},{"id":"g2_math_048_ex10","knowledge_id":"g2_math_048","question":"选择题：多项式 2x² - 8 因式分解的正确结果是？ A. (2x+4)(x-2)  B. 2(x²-4)  C. 2(x-2)²  D. 2(x+2)(x-2)","answer":"答案：D. 2(x+2)(x-2)。解析：先提取公因式：2x² - 8 = 2(x² - 4)，然后x² - 4还能继续用平方差公式分解：= 2(x+2)(x-2)。选项A没有分解彻底。因式分解要分解到不能再分解为止。"},{"id":"g2_math_049_ex01","knowledge_id":"g2_math_049","question":"选择题：关于\"分式的概念\"的概念，下列说法正确的是？ A. 这是分式的概念的正确描述  B. 完全相反的错误说法  C. 混淆概念的错误说法  D. 与该知识点无关的错误说法","answer":"答案：A. 这是分式的概念的正确描述。解析：本题考察对\"分式的概念\"概念的理解。学习数学概念时要准确把握其定义和本质特征，注意与相似概念的区别。"},{"id":"g2_math_049_ex02","knowledge_id":"g2_math_049","question":"选择题：下列哪一项最准确地描述了分式的概念？ A. 与实际无关  B. 可以随意改变  C. 只是表面现象  D. A/B (B 中含有字母，B ≠ 0)...","answer":"答案：D. A/B (B 中含有字母，B ≠ 0)...。解析：分式的概念的核心公式/性质是：A/B (B 中含有字母，B ≠ 0)。理解这个公式是掌握该知识点的关键。"},{"id":"g2_math_049_ex03","knowledge_id":"g2_math_049","question":"填空题：分式的概念的核心公式/重要结论是：______。","answer":"答案：A/B (B 中含有字母，B ≠ 0)。解析：这是分式的概念的重要内容，是解决相关问题的基础。一般地，如果 A、B 表示两个整式，并且 B 中含有字母，那么式子 A/B 叫做分式。\n\n注意：\n1. 分式中分母 B ≠ 0（分母为零时无意义）\n2. 当 A = 0 时，分式 A/B = 0（前提..."},{"id":"g2_math_049_ex04","knowledge_id":"g2_math_049","question":"判断题：分式的概念只需要记住结论，不需要理解原理。（  ）","answer":"答案：错误。解析：学习分式的概念不仅要记住结论，更要理解其推导过程和原理。只有理解了原理，才能灵活运用，解决各种变式问题。"},{"id":"g2_math_049_ex05","knowledge_id":"g2_math_049","question":"选择题：学习分式的概念时，最重要的是？ A. 只需要死记硬背  B. 只做难题就行  C. 只看不用练  D. 理解概念并掌握应用方法","answer":"答案：D. 理解概念并掌握应用方法。解析：数学学习重在理解和应用。学习分式的概念时，要理解概念的本质，掌握公式的推导和应用方法，通过适量的练习巩固提高。"},{"id":"g2_math_049_ex06","knowledge_id":"g2_math_049","question":"填空题：分式的概念所在的章节是______。","answer":"答案：第十五章 分式。解析：分式的概念是第十五章 分式中的重要知识点，掌握它对后续学习有重要意义。"},{"id":"g2_math_049_ex07","knowledge_id":"g2_math_049","question":"判断题：分式的概念与其他知识点没有联系。（  ）","answer":"答案：错误。解析：数学知识是相互联系的。分式的概念与前后知识都有密切联系，学习时要注意知识的前后联系，形成知识网络。"},{"id":"g2_math_049_ex08","knowledge_id":"g2_math_049","question":" uestion":"选择题：学习分式的加减法时，最重要的是？ A. 理解概念并掌握应用方法  B. 只需要死记硬背  C. 只做难题就行  D. 只看不用练","answer":"答案：A. 理解概念并掌握应用方法。解析：数学学习重在理解和应用。学习分式的加减法时，要理解概念的本质，掌握公式的推导和应用方法，通过适量的练习巩固提高。"},{"id":"g2_math_052_ex06","knowledge_id":"g2_math_052","question":"填空题：分式的加减法所在的章节是______。","answer":"答案：第十五章 分式。解析：分式的加减法是第十五章 分式中的重要知识点，掌握它对后续学习有重要意义。"},{"id":"g2_math_052_ex07","knowledge_id":"g2_math_052","question":"判断题：分式的加减法与其他知识点没有联系。（  ）","answer":"答案：错误。解析：数学知识是相互联系的。分式的加减法与前后知识都有密切联系，学习时要注意知识的前后联系，形成知识网络。"},{"id":"g2_math_052_ex08","knowledge_id":"g2_math_052","question":"选择题：下列关于分式的加减法的应用，说法正确的是？ A. 可以解决相关的数学问题  B. 完全没有实际用处  C. 只在考试中有用  D. 只能用于一种题型","answer":"答案：A. 可以解决相关的数学问题。解析：分式的加减法是重要的数学工具，可以用来解决多种相关的数学问题。学习时要注重应用能力的培养。"},{"id":"g2_math_052_ex09","knowledge_id":"g2_math_052","question":"简答题：请简述分式的加减法的主要内容。","answer":"答案：分式的加减法的主要内容包括：同分母：a/c ± b/c = (a ± b)/c\n异分母：先通分再相加减。同分母分式相加减：分母不变，分子相加减。\n\n异分母分式相加减：先通分，化为同分母分式，然后再加减。... 这是本章的重要知识点，需要在理解的基础上熟练掌握。"},{"id":"g2_math_052_ex10","knowledge_id":"g2_math_052","question":"选择题：关于分式的加减法，下列说法错误的是？ A. 不需要掌握，考试不考  B. 需要理解并会应用  C. 是重要的基础知识  D. 与后续学习有关","answer":"答案：A. 不需要掌握，考试不考。解析：分式的加减法是重要的数学基础知识，必须认真掌握。它不仅在当前学习中重要，也为后续学习打下基础。"},{"id":"g2_math_053_ex01","knowledge_id":"g2_math_053","question":"选择题：分式方程的解必须检验的原因是？ A. 计算容易出错  B. 解有多个  C. 可能产生增根  D. 需要化简","answer":"答案：C. 可能产生增根。解析：解分式方程时，去分母（两边同乘最简公分母）可能产生增根，即使最简公分母为0的根。增根不是原方程的根，所以必须检验。"},{"id":"g2_math_053_ex02","knowledge_id":"g2_math_053","question":"选择题：解方程 2/x = 3/(x+1)，x等于？ A. 1  B. 3  C. 2  D. -2","answer":"答案：C. 2。解析：两边同乘x(x+1)得：2(x+1) = 3x，即2x+2 = 3x，解得x=2。检验：x=2时，x(x+1)=6≠0，所以x=2是原方程的根。"},{"id":"g2_math_053_ex03","knowledge_id":"g2_math_053","question":"填空题：解分式方程的步骤是：去分母 → 解整式方程 → ______。","answer":"答案：验根。解析：解分式方程的一般步骤：①在方程两边同乘最简公分母，去分母，化为整式方程；②解这个整式方程；③检验：将整式方程的根代入最简公分母，使最简公分母不为0的根才是原方程的根，否则是增根。"},{"id":"g2_math_053_ex04","knowledge_id":"g2_math_053","question":"判断题：分式方程的解一定都是原方程的根。（  ）","answer":"答案：错误。解析：分式方程去分母后得到的整式方程的解，可能使原分式方程的分母为0，这样的根叫增根，不是原方程的根。所以分式方程一定要检验。"},{"id":"g2_math_053_ex05","knowledge_id":"g2_math_053","question":"选择题：如果分式方程产生增根，那么增根一定使什么为0？ A. 最简公分母  B. 分子  C. 分母  D. 方程左边","answer":"答案：A. 最简公分母。解析：增根是去分母后整式方程的根，但它使原分式方程的分母（也就是最简公分母）为0，所以它不是原方程的根。增根的特征就是使最简公分母等于0。"},{"id":"g2_math_053_ex06","knowledge_id":"g2_math_053","question":"填空题：方程 1/(x-2) = 0 的解是______。","answer":"答案：无解。解析：分式的值为0的条件是分子为0且分母不为0。这里分子是1，不可能为0，所以方程无解。或者：任何数的倒数都不等于0。"},{"id":"g2_math_053_ex07","knowledge_id":"g2_math_053","question":"判断题：解分式方程时，只要解是正数，就一定是原方程的根。（  ）","answer":"答案：错误。解析：分式方程的根是否是增根，要看它是否使分母为0，与正负无关。即使是正数，如果使最简公分母为0，也是增根。"},{"id":"g2_math_053_ex08","knowledge_id":"g2_math_053","question":"选择题：若关于x的方程 1/(x-1) + k/(x+2) = 0 有增根x=1，则k的值可能是？ A. k=1  B. 使最简公分母为0的k值  C. k=-1  D. k=0","answer":"答案：B. 使最简公分母为0的k值。解析：增根是x=1，说明x=1使最简公分母为0。将x=1代入去分母后的整式方程，可以求出对应的k值。增根是分式方程的难点，关键是理解增根产生的原因。"},{"id":"g2_math_053_ex09","knowledge_id":"g2_math_053","question":"简答题：什么是分式方程？解分式方程为什么要验根？如何验根？","answer":"答案：分式方程：分母中含有未知数的方程叫做分式方程。为什么要验根：因为解分式方程时，两边同乘最简公分母，这一步可能产生增根（使最简公分母为0的根）。增根不是原方程的根，必须舍去。验根方法：将整式方程的根代入最简公分母：①如果最简公分母不等于0，这个根就是原方程的根；②如果最简公分母等于0，这个根就是增根，不是原方程的根，必须舍去。"},{"id":"g2_math_053_ex10","knowledge_id":"g2_math_053","question":"选择题：解方程 (x-1)/(x-2) = 1/(x-2) + 2，下列说法正确的是？ A. x=2是增根，方程无解  B. x=2是方程的解  C. 方程有无数解  D. 方程的解是x=0","answer":"答案：A. x=2是增根，方程无解。解析：两边同乘(x-2)得：x-1 = 1 + 2(x-2)，即x-1 = 1 + 2x - 4，解得x=2。检验：x=2时，最简公分母x-2=0，所以x=2是增根，原方程无解。"}];
        const HAS_EXAMPLES = true;

        // 错题本管理器
        const WrongBookManager = {
            STORAGE_KEY_PREFIX: 'wrongbook_',
            getWrongBook(grade, subject) {
                const key = this.STORAGE_KEY_PREFIX + grade + '_' + subject;
                return JSON.parse(localStorage.getItem(key) || '[]');
            },
            addWrongBook(item) {
                const key = this.STORAGE_KEY_PREFIX + item.grade + '_' + item.subject;
                let wrongBook = this.getWrongBook(item.grade, item.subject);
                const exists = wrongBook.some(w => w.question === item.question);
                if (exists) return false;
                wrongBook.push({...item, id: item.knowledgeId + '_' + Date.now(), addedAt: new Date().toISOString()});
                localStorage.setItem(key, JSON.stringify(wrongBook));
                return true;
            }
        };

        // 学习进度管理器
        const ProgressManager = {
            STORAGE_KEY: 'study_progress',
            
            getProgress() {
                try {
                    return JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
                } catch(e) {
                    return {};
                }
            },
            
            saveProgress(progress) {
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(progress));
            },
            
            recordStudy(grade, subject, subjectName, semester, semesterName, knowledgeId, knowledgeName) {
                const progress = this.getProgress();
                const now = new Date().toISOString();
                const today = new Date().toISOString().split('T')[0];
                
                if (!progress.learnedKnowledge) progress.learnedKnowledge = {};
                if (!progress.dailyStats) progress.dailyStats = {};
                if (!progress.dailyStats[today]) {
                    progress.dailyStats[today] = { learnedCount: 0, subjects: [] };
                }
                
                const isNew = !progress.learnedKnowledge[knowledgeId];
                progress.learnedKnowledge[knowledgeId] = { learnedAt: now };
                
                if (isNew) {
                    progress.dailyStats[today].learnedCount++;
                    if (!progress.dailyStats[today].subjects.includes(subject)) {
                        progress.dailyStats[today].subjects.push(subject);
                    }
                }
                
                progress.lastStudy = {
                    grade, subject, subjectName, semester, semesterName,
                    knowledgeId, knowledgeName, timestamp: now
                };
                
                this.saveProgress(progress);
            },
            
            isLearned(knowledgeId) {
                const progress = this.getProgress();
                return !!(progress.learnedKnowledge && progress.learnedKnowledge[knowledgeId]);
            },
            
            getLastStudy() {
                const progress = this.getProgress();
                return progress.lastStudy || null;
            },
            
            getSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                if (!progress.learnedKnowledge) return { learned: 0, total: 0, percent: 0 };
                const prefix = grade + '_' + subject + '_';
                const learned = Object.keys(progress.learnedKnowledge).filter(k => k.startsWith(prefix)).length;
                const total = DATA_KNOWLEDGE.length;
                const percent = total > 0 ? Math.round((learned / total) * 100) : 0;
                return { learned, total, percent };
            },
            
            clearSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                const prefix = grade + '_' + subject + '_';
                
                if (progress.learnedKnowledge) {
                    Object.keys(progress.learnedKnowledge).forEach(k => {
                        if (k.startsWith(prefix)) {
                            delete progress.learnedKnowledge[k];
                        }
                    });
                }
                
                if (progress.lastStudy && progress.lastStudy.grade === grade && progress.lastStudy.subject === subject) {
                    delete progress.lastStudy;
                }
                
                this.saveProgress(progress);
                return true;
            }
        };

        function renderKnowledgeList(items = knowledgeList) {

                return;
            }
            emptyStateEl.classList.add('hidden');
            knowledgeListEl.innerHTML = items.map(item => {
                const isExpanded = expandedIds.has(item.id);
                const isLearned = ProgressManager.isLearned(item.id);
                return '<div class="card knowledge-card ' + (isLearned ? 'learned' : '') + '" data-id="' + item.id + '">' +
                    '<div class="knowledge-header p-4 flex items-center justify-between" onclick="toggleExpand(\'' + item.id + '\')">' +
                        '<div class="flex items-center gap-3 flex-1 min-w-0">' +
                            '<div class="expand-icon ' + (isExpanded ? 'expanded' : 'collapsed') + '">' + (isExpanded ? '−' : '+') + '</div>' +
                            '<div class="flex-1 min-w-0">' +
                                '<h3 class="text-lg font-semibold text-gray-800 flex items-center gap-2">' + escapeHtml(item.name) + (isLearned ? '<span class="text-green-500 text-sm">✓ 已学习</span>' : '') + '</h3>' +
                                '<p class="text-xs text-gray-500 mt-1">' + escapeHtml(item.chapter) + '</p>' +
                            '</div>' +
                        '</div>' +
                        (HAS_EXAMPLES ? '<button class="btn btn-secondary text-sm px-3 py-1" onclick="event.stopPropagation(); showExample(\'' + item.id + '\', \'' + escapeHtml(item.name) + '\')">例题</button>' : '') +
                    '</div>' +
                    '<div id="content-' + item.id + '" class="px-6 pb-4 ' + (isExpanded ? '' : 'hidden') + '">' +
                        (item.formula ? '<div class="mb-4"><h4 class="text-sm font-medium text-gray-500 mb-2">📐 公式</h4><p class="formula-box text-gray-800 text-lg bg-gray-50 p-3 rounded-lg">' + escapeHtml(item.formula) + '</p></div>' : '') +
                        (item.explanation ? '<div><h4 class="text-sm font-medium text-gray-500 mb-2">📝 解释</h4><p class="text-gray-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(item.explanation) + '</p></div>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function toggleExpand(id) {
            const isNewLearn = !expandedIds.has(id) && !ProgressManager.isLearned(id);
            if (expandedIds.has(id)) {
                expandedIds.delete(id);
            } else {
                expandedIds.add(id);
                const {grade, subject, semester} = currentParams;
                const item = knowledgeList.find(k => k.id === id);
                if (item) {
                    ProgressManager.recordStudy(
                        grade, subject, subjectNames[subject],
                        semester, semesterNames[semester],
                        id, item.name
                    );
                }
            }
            const card = document.querySelector('[data-id="' + id + '"]');
            const content = document.getElementById('content-' + id);
            const icon = card.querySelector('.expand-icon');
            const header = card.querySelector('.knowledge-header');
            const title = card.querySelector('h3');
            if (expandedIds.has(id)) {
                content.classList.remove('hidden');
                icon.classList.remove('collapsed');
                icon.classList.add('expanded');
                icon.textContent = '−';
                header.classList.add('expanded');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('expanded');
                icon.classList.add('collapsed');
                icon.textContent = '+';
                header.classList.remove('expanded');
            }
            if (isNewLearn) {
                card.classList.add('learned');
                if (!title.querySelector('.text-green-500')) {
                    title.innerHTML += '<span class="text-green-500 text-sm">✓ 已学习</span>';
                }
                updateProgressStat();
            }
        }

        function expandAll() {
            knowledgeList.forEach(item => expandedIds.add(item.id));
            renderKnowledgeList();
        }

        function collapseAll() {
            expandedIds.clear();
            renderKnowledgeList();
        }

        function searchKnowledge(keyword, list) {
            if (!keyword) return [];
            const lower = keyword.toLowerCase();
            return list.filter(k =>
                k.name.toLowerCase().includes(lower) ||
                k.chapter.toLowerCase().includes(lower)
            );
        }

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                searchResultsInfo.classList.add('hidden');
                renderKnowledgeList();
                return;
            }
            const results = searchKnowledge(keyword, knowledgeList);
            searchCountEl.textContent = results.length;
            searchResultsInfo.classList.remove('hidden');
            renderKnowledgeList(results);
        }

        function showExample(knowledgeId, knowledgeName) {
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === knowledgeId);
            if (examples.length === 0) {
                alert('暂无例题');
                return;
            }
            const example = examples[Math.floor(Math.random() * examples.length)];
            currentExample = {...example, knowledgeId, knowledgeName, ...currentParams};
            document.getElementById('example-knowledge-name').textContent = knowledgeName;
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
            document.getElementById('example-modal').classList.remove('hidden');
        }

        function nextExample() {
            if (!currentExample) return;
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === currentExample.knowledgeId);
            const otherExamples = examples.filter(e => e !== currentExample);
            if (otherExamples.length === 0) {
                alert('没有更多例题了');
                return;
            }
            const example = otherExamples[Math.floor(Math.random() * otherExamples.length)];
            currentExample = {...example, knowledgeId: currentExample.knowledgeId, knowledgeName: currentExample.knowledgeName, ...currentParams};
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
        }

        function addToWrongBook() {
            if (!currentExample) return;
            const item = {
                knowledgeId: currentExample.knowledgeId,
                knowledgeName: currentExample.knowledgeName,
                question: currentExample.question,
                answer: currentExample.answer,
                grade: currentParams.grade,
                subject: currentParams.subject
            };
            if (WrongBookManager.addWrongBook(item)) {
                alert('已加入错题本！');
            } else {
                alert('该题目已在错题本中');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearProgress() {
            const {grade, subject} = currentParams;
            const subjectName = subjectNames[subject];
            var msg = '确定要清除【' + subjectName + '】科目的所有学习进度吗？';
            msg += '\n\n';
            msg += '此操作将清除该科目所有已学习标记，且不可恢复。';
            if (!confirm(msg)) {
                return;
            }
            ProgressManager.clearSubjectProgress(grade, subject);
            updateProgressStat();
            renderKnowledgeList();
            alert('学习进度已清除');
        }

        document.getElementById('btn-expand-all').addEventListener('click', expandAll);
        document.getElementById('btn-collapse-all').addEventListener('click', collapseAll);
        document.getElementById('btn-clear-progress').addEventListener('click', clearProgress);
        searchInput.addEventListener('keyup', e => { if (e.key === 'Enter') performSearch(); });
        searchInput.addEventListener('input', () => { if (!searchInput.value) { searchResultsInfo.classList.add('hidden'); renderKnowledgeList(); }});
        document.getElementById('close-example').addEventListener('click', () => document.getElementById('example-modal').classList.add('hidden'));
        document.getElementById('btn-show-answer').addEventListener('click', () => {
            document.getElementById('example-answer-section').classList.remove('hidden');
            document.getElementById('btn-show-answer').classList.add('hidden');
        });
        document.getElementById('btn-next-example').addEventListener('click', nextExample);
        document.getElementById('btn-add-wrong').addEventListener('click', addToWrongBook);
        document.getElementById('example-modal').addEventListener('click', e => { if (e.target.id === 'example-modal') document.getElementById('example-modal').classList.add('hidden'); });

        initPage();
    </script>
</body>
</html>
