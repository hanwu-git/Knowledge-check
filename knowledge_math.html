    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"id":"g2_math_027","chapter":"第十一章 三角形","name":"三角形的概念与分类","formula":"三角形内角和 = 180°","explanation":"由不在同一直线上的三条线段首尾顺次相接所组成的图形叫做三角形。\n\n分类：\n1. 按角分：\n   - 锐角三角形：三个角都是锐角\n   - 直角三角形：有一个角是直角\n   - 钝角三角形：有一个角是钝角\n\n2. 按边分：\n   - 不等边三角形：三边都不相等\n   - 等腰三角形：有两条边相等\n   - 等边三角形：三边都相等（特殊的等腰三角形）","semester":"upper"},{"id":"g2_math_028","chapter":"第十一章 三角形","name":"三角形的三边关系","formula":"a + b > c\n|b - a| < c < a + b","explanation":"三角形任意两边之和大于第三边，任意两边之差小于第三边。\n\n应用：\n1. 判断三条线段能否组成三角形\n2. 求三角形某边的取值范围\n\n例如：三边长为 3, 4, 5 的三角形，因为 3+4>5, 3+5>4, 4+5>3，所以能组成三角形。","semester":"upper"},{"id":"g2_math_029","chapter":"第十一章 三角形","name":"三角形的内角和","formula":"∠A + ∠B + ∠C = 180°","explanation":"三角形的内角和等于 180°。\n\n推论：\n1. 直角三角形的两个锐角互余（和为90°）\n2. 三角形的一个外角等于与它不相邻的两个内角之和\n3. 三角形的一个外角大于任何一个与它不相邻的内角","semester":"upper"},{"id":"g2_math_030","chapter":"第十一章 三角形","name":"三角形的外角","formula":"外角 = 不相邻两内角之和","explanation":"三角形的一边与另一边的延长线组成的角，叫做三角形的外角。\n\n性质：\n1. 三角形的一个外角等于与它不相邻的两个内角之和\n2. 三角形的一个外角大于任何一个与它不相邻的内角\n3. 三角形的外角和等于 360°","semester":"upper"},{"id":"g2_math_031","chapter":"第十一章 三角形","name":"多边形内角和","formula":"(n-2) × 180°","explanation":"n 边形的内角和等于 (n-2) × 180°。\n\n常用：\n- 四边形内角和 = 360°\n- 五边形内角和 = 540°\n- 六边形内角和 = 720°\n\nn 边形的外角和等于 360°。","semester":"upper"},{"id":"g2_math_032","chapter":"第十二章 全等三角形","name":"全等三角形的概念与性质","formula":"△ABC ≌ △A'B'C'","explanation":"能够完全重合的两个三角形叫做全等三角形。\n\n性质：\n1. 全等三角形的对应边相等\n2. 全等三角形的对应角相等\n3. 全等三角形的对应高、对应中线、对应角平分线相等\n4. 全等三角形的周长相等、面积相等","semester":"upper"},{"id":"g2_math_033","chapter":"第十二章 全等三角形","name":"三角形全等的判定-SSS","formula":"三边对应相等的两个三角形全等","explanation":"边边边（SSS）：\n如果两个三角形的三条边分别相等，那么这两个三角形全等。\n\n写作：\n在 △ABC 和 △A'B'C' 中，\nAB = A'B', BC = B'C', CA = C'A'\n∴ △ABC ≌ △A'B'C'（SSS）","semester":"upper"},{"id":"g2_math_034","chapter":"第十二章 全等三角形","name":"三角形全等的判定-SAS","formula":"两边和它们的夹角对应相等的两个三角形全等","explanation":"边角边（SAS）：\n如果两个三角形的两边和它们的夹角分别相等，那么这两个三角形全等。\n\n注意：必须是夹角，而不是任意一个角。","semester":"upper"},{"id":"g2_math_035","chapter":"第十二章 全等三角形","name":"三角形全等的判定-ASA","formula":"两角和它们的夹边对应相等的两个三角形全等","explanation":"角边角（ASA）：\n如果两个三角形的两角和它们的夹边分别相等，那么这两个三角形全等。","semester":"upper"},{"id":"g2_math_036","chapter":"第十二章 全等三角形","name":"三角形全等的判定-AAS","formula":"两角和其中一角的对边对应相等的两个三角形全等","explanation":"角角边（AAS）：\n如果两个三角形的两角和其中一角的对边分别相等，那么这两个三角形全等。","semester":"upper"},{"id":"g2_math_037","chapter":"第十二章 全等三角形","name":"直角三角形全等的判定-HL","formula":"斜边和一直角边对应相等的两个直角三角形全等","explanation":"HL 定理：\n斜边和一条直角边分别相等的两个直角三角形全等。\n\n这是直角三角形特有的判定方法，HL 代表 Hypotenuse-Leg（斜边-直角边）。","semester":"upper"},{"id":"g2_math_038","chapter":"第十三章 轴对称","name":"轴对称图形","formula":"对称轴","explanation":"如果一个平面图形沿一条直线折叠，直线两旁的部分能够完全重合，那么这个图形叫做轴对称图形，这条直线就是它的对称轴。\n\n常见的轴对称图形：\n- 等腰三角形（1条对称轴）\n- 等边三角形（3条对称轴）\n- 长方形（2条对称轴）\n- 正方形（4条对称轴）\n- 圆（无数条对称轴）","semester":"upper"},{"id":"g2_math_039","chapter":"第十三章 轴对称","name":"线段垂直平分线的性质","formula":"到线段两端距离相等的点在这条线段的垂直平分线上","explanation":"垂直平分线：经过线段中点并且垂直于这条线段的直线叫做这条线段的垂直平分线。\n\n性质：\n1. 线段垂直平分线上的点到这条线段两端点的距离相等\n2. 到一条线段两端点距离相等的点，在这条线段的垂直平分线上","semester":"upper"},{"id":"g2_math_040","chapter":"第十三章 轴对称","name":"等腰三角形的性质","formula":"等腰三角形两底角相等\n三线合一：顶角平分线、底边上的中线、底边上的高互相重合","explanation":"等腰三角形：有两条边相等的三角形。\n\n性质：\n1. 等腰三角形的两底角相等（等边对等角）\n2. 等腰三角形顶角的平分线、底边上的中线、底边上的高互相重合（三线合一）\n3. 等腰三角形是轴对称图形，对称轴是顶角平分线所在的直线","semester":"upper"},{"id":"g2_math_041","chapter":"第十三章 轴对称","name":"等边三角形的性质","formula":"三边相等，三个角都等于 60°","explanation":"等边三角形：三条边都相等的三角形。\n\n性质：\n1. 三边相等\n2. 三个内角都等于 60°\n3. 是轴对称图形，有 3 条对称轴\n4. 每条边上都存在\"三线合一\"","semester":"upper"},{"id":"g2_math_042","chapter":"第十四章 整式的乘除与因式分解","name":"同底数幂的乘法","formula":"aᵐ · aⁿ = aᵐ⁺ⁿ (m, n 是正整数)","explanation":"同底数幂相乘，底数不变，指数相加。\n\n推广：\naᵐ · aⁿ · aᵖ = aᵐ⁺ⁿ⁺ᵖ","semester":"upper"},{"id":"g2_math_043","chapter":"第十四章 整式的乘除与因式分解","name":"幂的乘方与积的乘方","formula":"(aᵐ)ⁿ = aᵐⁿ\n(ab)ⁿ = aⁿbⁿ","explanation":"幂的乘方：底数不变，指数相乘。(aᵐ)ⁿ = aᵐⁿ\n\n积的乘方：把积的每一个因式分别乘方，再把所得的幂相乘。(ab)ⁿ = aⁿbⁿ","semester":"upper"},{"id":"g2_math_044","chapter":"第十四章 整式的乘除与因式分解","name":"同底数幂的除法","formula":"aᵐ / aⁿ = aᵐ⁻ⁿ (a ≠ 0, m > n)","explanation":"同底数幂相除，底数不变，指数相减。\n\n零指数幂：a⁰ = 1 (a ≠ 0)\n\n负指数幂：a⁻ⁿ = 1/aⁿ (a ≠ 0)","semester":"upper"},{"id":"g2_math_045","chapter":"第十四章 整式的乘除与因式分解","name":"整式的乘法","formula":"(a + b)(c + d) = ac + ad + bc + bd\n单项式 × 多项式 = 各项相乘再相加","explanation":"单项式乘单项式：系数相乘，同底数幂相乘。\n\n单项式乘多项式：m(a+b+c) = ma + mb + mc\n\n多项式乘多项式：(a+b)(c+d) = ac + ad + bc + bd","semester":"upper"},{"id":"g2_math_046","chapter":"第十四章 整式的乘除与因式分解","name":"乘法公式-平方差公式","formula":"(a + b)(a - b) = a² - b²","explanation":"两个数的和与这两个数的差的积，等于这两个数的平方差。\n\n应用：\n- 简便计算：(x+3)(x-3) = x² - 9\n- 简化多项式乘法","semester":"upper"},{"id":"g2_math_047","chapter":"第十四章 整式的乘除与因式分解","name":"乘法公式-完全平方公式","formula":"(a + b)² = a² + 2ab + b²\n(a - b)² = a² - 2ab + b²","explanation":"两数和（或差）的平方，等于它们的平方和，加上（或减去）它们的积的 2 倍。\n\n应用：\n- 简便计算：(x+5)² = x² + 10x + 25\n- 完全平方式：a² ± 2ab + b²","semester":"upper"},{"id":"g2_math_048","chapter":"第十四章 整式的乘除与因式分解","name":"因式分解","formula":"提公因式法、公式法","explanation":"因式分解：把一个多项式化为几个整式的积的形式。\n\n常用方法：\n1. 提公因式法：ma + mb = m(a + b)\n2. 公式法：\n   - 平方差公式：a² - b² = (a+b)(a-b)\n   - 完全平方公式：a² ± 2ab + b² = (a ± b)²\n3. 十字相乘法（拓展）","semester":"upper"},{"id":"g2_math_049","chapter":"第十五章 分式","name":"分式的概念","formula":"A/B (B 中含有字母，B ≠ 0)","explanation":"一般地，如果 A、B 表示两个整式，并且 B 中含有字母，那么式子 A/B 叫做分式。\n\n注意：\n1. 分式中分母 B ≠ 0（分母为零时无意义）\n2. 当 A = 0 时，分式 A/B = 0（前提是 B ≠ 0）","semester":"upper"},{"id":"g2_math_050","chapter":"第十五章 分式","name":"分式的基本性质","formula":"A/B = A·C / B·C = A÷C / B÷C (B ≠ 0, C ≠ 0)","explanation":"分式的分子与分母同乘（或除以）一个不为 0 的整式，分式的值不变。\n\n应用：\n1. 约分：将分子分母同除以公因式\n2. 通分：将异分母分式化为同分母分式","semester":"upper"},{"id":"g2_math_051","chapter":"第十五章 分式","name":"分式的乘除法","formula":"a/b · c/d = ac/bd\na/b ÷ c/d = ad/bc","explanation":"分式乘分式：用分子的积作为积的分子，分母的积作为积的分母。\n\n分式除以分式：把除式的分子分母颠倒位置后，与被除式相乘。","semester":"upper"},{"id":"g2_math_052","chapter":"第十五章 分式","name":"分式的加减法","formula":"同分母：a/c ± b/c = (a ± b)/c\n异分母：先通分再相加减","explanation":"同分母分式相加减：分母不变，分子相加减。\n\n异分母分式相加减：先通分，化为同分母分式，然后再加减。","semester":"upper"},{"id":"g2_math_053","chapter":"第十五章 分式","name":"分式方程","formula":"解分式方程：去分母 → 解整式方程 → 验根","explanation":"分式方程：分母中含有未知数的方程。\n\n解法步骤：\n1. 在方程两边同乘最简公分母，去分母\n2. 解所得的整式方程\n3. 检验：将整式方程的根代入最简公分母，使分母不为 0 的根是原方程的根，否则是增根","semester":"upper"},{"id":"g2_math_001","chapter":"第十六章 二次根式","name":"二次根式的概念","formula":"√a (a ≥ 0)","explanation":"形如√a的代数式叫做二次根式，其中a必须是非负数。\n关键点：\n1. 二次根式必须有根号\n2. 被开方数a必须大于或等于0\n3. 二次根式是非负数，即√a ≥ 0\n\n注意：负数没有平方根，所以二次根式中被开方数必须非负。","semester":"lower"},{"id":"g2_math_002","chapter":"第十六章 二次根式","name":"二次根式的基本性质","formula":"(√a)² = a (a ≥ 0)\n√(a²) = |a|","explanation":"1. (√a)² = a（a ≥ 0）：一个非负数的算术平方根的平方等于它本身\n2. √(a²) = |a|：一个数的平方的算术平方根等于这个数的绝对值\n\n重要应用：\n√(a²) 不等于 a，要看 a 的正负性","semester":"lower"},{"id":"g2_math_003","chapter":"第十六章 二次根式","name":"二次根式的乘除法","formula":"√a · √b = √(ab) (a ≥ 0, b ≥ 0)\n√a / √b = √(a/b) (a ≥ 0, b > 0)","explanation":"二次根式乘除法法则：\n1. √a · √b = √(ab)\n2. √a / √b = √(a/b)\n\n前提条件：a ≥ 0, b ≥ 0","semester":"lower"},{"id":"g2_math_004","chapter":"第十六章 二次根式","name":"最简二次根式","formula":"√a (a为正整数且不含能开尽方的因数)","explanation":"最简二次根式必须满足两个条件：\n1. 被开方数不含分母\n2. 被开方数中不含能开得尽方的因数或因式","semester":"lower"},{"id":"g2_math_005","chapter":"第十六章 二次根式","name":"二次根式的加减法","formula":"a√m ± b√m = (a ± b)√m","explanation":"二次根式加减法法则：\n先把各个二次根式化成最简二次根式，再把被开方数相同的二次根式进行合并。","semester":"lower"},{"id":"g2_math_006","chapter":"第十六章 二次根式","name":"二次根式的混合运算","formula":"(a + b)(a - b) = a² - b²","explanation":"二次根式混合运算顺序：\n1. 先算乘方，再算乘除，最后算加减\n2. 有括号的先算括号内的\n3. 能利用乘法公式的要先用公式简化","semester":"lower"},{"id":"g2_math_007","chapter":"第十六章 二次根式","name":"分母有理化","formula":"1/√a = √a/a (a > 0)\n1/(√a ± √b) = (√a ∓ √b)/(a - b)","explanation":"分母有理化：把分母中的根号化去，使分母变为有理数。\n\n方法：\n1. 分子分母同乘以分母的有理化因式\n2. 如 1/√3，分子分母同乘以√3，得到 √3/3","semester":"lower"},{"id":"g2_math_008","chapter":"第十七章 勾股定理","name":"勾股定理","formula":"a² + b² = c²","explanation":"勾股定理：直角三角形两条直角边的平方和等于斜边的平方。\n\n其中：\n- a, b 是直角边\n- c 是斜边（最长边）","semester":"lower"},{"id":"g2_math_009","chapter":"第十七章 勾股定理","name":"勾股定理的逆定理","formula":"若 a² + b² = c²，则△ABC是直角三角形","explanation":"勾股定理的逆定理：\n如果三角形的三边长 a, b, c 满足 a² + b² = c²，那么这个三角形是直角三角形。","semester":"lower"},{"id":"g2_math_010","chapter":"第十七章 勾股定理","name":"勾股定理的应用","formula":"a² + b² = c²","explanation":"勾股定理在实际问题中的应用：\n\n1. 测量问题\n2. 最短路径问题\n3. 立体图形中的距离计算\n4. 等腰三角形、梯形等几何图形中的边长计算","semester":"lower"},{"id":"g2_math_011","chapter":"第十八章 平行四边形","name":"平行四边形的定义与性质","formula":"对边平行且相等；对角相等；对角线互相平分","explanation":"平行四边形定义：两组对边分别平行的四边形叫做平行四边形。\n\n性质：\n1. 对边平行且相等\n2. 对角相等\n3. 相邻内角互补\n4. 对角线互相平分","semester":"lower"},{"id":"g2_math_012","chapter":"第十八章 平行四边形","name":"矩形的性质与判定","formula":"对角线相等且互相平分；四个角都是直角","explanation":"矩形：有一个角是直角的平行四边形叫做矩形。\n\n性质：\n1. 具有平行四边形的所有性质\n2. 四个角都是直角\n3. 对角线相等且互相平分","semester":"lower"},{"id":"g2_math_013","chapter":"第十八章 平行四边形","name":"菱形的性质与判定","formula":"对角线互相垂直平分；四条边都相等","explanation":"菱形：有一组邻边相等的平行四边形叫做菱形。\n\n性质：\n1. 具有平行四边形的所有性质\n2. 四条边都相等\n3. 对角线互相垂直平分","semester":"lower"},{"id":"g2_math_014","chapter":"第十八章 平行四边形","name":"正方形的性质与判定","formula":"对角线相等且互相垂直平分；四条边都相等；四个角都是直角","explanation":"正方形：有一组邻边相等并且有一个角是直角的平行四边形叫做正方形。\n\n性质：\n1. 具有矩形和菱形的所有性质\n2. 四条边都相等\n3. 四个角都是直角","semester":"lower"},{"id":"g2_math_015","chapter":"第十八章 平行四边形","name":"三角形中位线","formula":"三角形的中位线平行于第三边，且等于第三边的一半","explanation":"三角形中位线：连接三角形两边中点的线段叫做三角形的中位线。\n\n性质：\n1. 中位线平行于第三边\n2. 中位线等于第三边的一半","semester":"lower"},{"id":"g2_math_016","chapter":"第十九章 一次函数","name":"变量与函数","formula":"y = f(x)","explanation":"变量：在一个变化过程中，数值发生变化的量称为变量。\n\n常量：数值始终不变的量称为常量。\n\n函数：在一个变化过程中，如果有两个变量 x 和 y，并且对于 x 的每一个确定的值，y 都有唯一确定的值与其对应，那么我们就说 x 是自变量，y 是 x 的函数。","semester":"lower"},{"id":"g2_math_017","chapter":"第十九章 一次函数","name":"正比例函数","formula":"y = kx (k ≠ 0)","explanation":"正比例函数：形如 y = kx（k 是常数，k ≠ 0）的函数叫做正比例函数。\n\n图象：经过原点的一条直线。\n\n性质：\n1. 当 k > 0 时，y 随 x 的增大而增大\n2. 当 k < 0 时，y 随 x 的增大而减小","semester":"lower"},{"id":"g2_math_018","chapter":"第十九章 一次函数","name":"一次函数","formula":"y = kx + b (k ≠ 0)","explanation":"一次函数：形如 y = kx + b（k, b 是常数，k ≠ 0）的函数叫做一次函数。\n\n图象：一条直线。\n\n性质：\n1. k 决定直线的倾斜方向\n2. b 决定直线与 y 轴的交点位置","semester":"lower"},{"id":"g2_math_019","chapter":"第十九章 一次函数","name":"一次函数的图象与性质","formula":"k > 0 时，y 随 x 的增大而增大\nk < 0 时，y 随 x 的增大而减小","explanation":"一次函数 y = kx + b 的图象与性质：\n\n1. k > 0：y 随 x 的增大而增大\n2. k < 0：y 随 x 的增大而减小\n3. 直线与 x 轴交点：(-b/k, 0)\n4. 直线与 y 轴交点：(0, b)","semester":"lower"},{"id":"g2_math_020","chapter":"第十九章 一次函数","name":"一次函数与二元一次方程","formula":"y = kx + b 对应 kx - y + b = 0","explanation":"一次函数与二元一次方程的关系：\n\n1. 一次函数 y = kx + b 的图象上的每一个点的坐标(x, y)都是二元一次方程 kx - y + b = 0 的解\n2. 以二元一次方程的解为坐标的点都在对应的一次函数的图象上","semester":"lower"},{"id":"g2_math_021","chapter":"第十九章 一次函数","name":"用函数观点看方程(组)与不等式","formula":"kx + b = 0 → x = -b/k","explanation":"用函数观点看方程与不等式：\n\n1. 解方程 kx + b = 0：求直线 y = kx + b 与 x 轴的交点的横坐标\n2. 解不等式 kx + b > 0：求直线 y = kx + b 在 x 轴上方时 x 的取值范围","semester":"lower"},{"id":"g2_math_022","chapter":"第二十章 数据的分析整理","name":"数据的描述","formula":"平均数、中位数、众数","explanation":"数据的描述：\n\n1. 平均数：所有数据的总和除以数据的个数\n2. 中位数：把数据按从小到大排列后，位于中间位置的数\n3. 众数：出现次数最多的数据","semester":"lower"},{"id":"g2_math_023","chapter":"第二十章 数据的分析整理","name":"加权平均数","formula":"x̄ = (w1x1 + w2x2 + ... + wn xn) / (w1 + w2 + ... + wn)","explanation":"加权平均数：如果 n 个数据 x₁, x₂, ..., xₙ 的权分别是 w₁, w₂, ..., wₙ，那么加权平均数为：\n\nx̄ = (w₁x₁ + w₂x₂ + ... + wₙxₙ) / (w₁ + w₂ + ... + wₙ)","semester":"lower"},{"id":"g2_math_024","chapter":"第二十章 数据的分析整理","name":"中位数和众数","formula":"中位数：中间位置的数\n众数：出现次数最多的数","explanation":"中位数：\n将一组数据按照从小到大（或从大到小）的顺序排列，如果数据的个数是奇数，则处于中间位置的数就是这组数据的中位数；如果数据的个数是偶数，则中间两个数据的平均数就是这组数据的中位数。\n\n众数：\n一组数据中出现次数最多的数据就是这组数据的众数。","semester":"lower"},{"id":"g2_math_025","chapter":"第二十章 数据的分析整理","name":"极差与方差","formula":"极差 = 最大值 - 最小值\n方差 s² = (1/n) Σ(xᵢ - x̄)²","explanation":"极差：\n一组数据中的最大值与最小值的差叫做极差。\n极差反映了一组数据的变动范围。\n\n方差：\n对于 n 个数据 x₁, x₂, ..., xₙ，各数据与它们的平均数 x̄ 的差的平方的平均数，叫做这组数据的方差。","semester":"lower"},{"id":"g2_math_026","chapter":"第二十章 数据的分析整理","name":"数据的分析整理","formula":"频数、频率、统计图","explanation":"数据的分析整理：\n\n1. 频数：每个对象出现的次数\n2. 频率：每个对象出现的次数与总次数的比值\n3. 各频率之和等于 1\n\n常用统计图：\n- 条形统计图\n- 折线统计图\n- 扇形统计图\n- 频数分布直方图\n\n作用：直观、清晰地表示数据，便于分析。","semester":"lower"}];

        // ==================== 内嵌例题数据 ====================
        const DATA_EXAMPLES = [{"id":"g2_math_032_ex01","knowledge_id":"g2_math_032","question":"选择题：下列说法正确的是（  ）\nA. 全等三角形的对应边不一定相等\nB. 全等三角形的对应角不一定相等\nC. 全等三角形的周长一定相等\nD. 面积相等的两个三角形一定全等","answer":"答案：C\n解析：\nA. 错误，全等三角形对应边相等\nB. 错误，全等三角形对应角相等\nC. 正确，全等三角形对应边相等，周长=三边之和也相等\nD. 错误，面积相等的三角形不一定全等"},{"id":"g2_math_032_ex02","knowledge_id":"g2_math_032","question":"填空题：若△ABC ≌ △DEF，则∠A=______，BC=______。","answer":"答案：∠D，EF\n解析：全等三角形对应角相等，对应边相等。∠A对应∠D，BC对应EF。"},{"id":"g2_math_032_ex03","knowledge_id":"g2_math_032","question":"选择题：全等三角形的对应高、对应中线、对应角平分线的关系是（  ）\nA. 都不相等\nB. 都相等\nC. 只有对应高相等\nD. 只有对应中线相等","answer":"答案：B\n解析：全等三角形的对应高、对应中线、对应角平分线都相等，这是全等三角形的重要性质。"},{"id":"g2_math_032_ex04","knowledge_id":"g2_math_032","question":"判断题：全等三角形的面积一定相等，但面积相等的三角形不一定全等。","answer":"答案：正确\n解析：全等三角形对应边相等，高也相等，所以面积相等。但面积相等只说明底×高相等，形状可以不同。"},{"id":"g2_math_032_ex05","knowledge_id":"g2_math_032","question":"解答题：已知△ABC ≌ △A'B'C'，AB=5cm，BC=6cm，∠A=40°，求A'B'、B'C'和∠A'的度数。","answer":"答案：A'B'=5cm，B'C'=6cm，∠A'=40°\n解析：全等三角形对应边相等，对应角相等。AB对应A'B'，BC对应B'C'，∠A对应∠A'。"},{"id":"g2_math_032_ex06","knowledge_id":"g2_math_032","question":"选择题：若△ABC ≌ △DEF，且△ABC的周长为20cm，则△DEF的周长为（  ）\nA. 10cm\nB. 20cm\nC. 40cm\nD. 无法确定","answer":"答案：B\n解析：全等三角形周长相等，所以△DEF的周长也是20cm。"},{"id":"g2_math_032_ex07","knowledge_id":"g2_math_032","question":"填空题：全等三角形的对应边和对应角都______。","answer":"答案：相等\n解析：这是全等三角形最基本的性质。"},{"id":"g2_math_032_ex08","knowledge_id":"g2_math_032","question":"判断题：只有完全重合的两个三角形才是全等三角形。","answer":"答案：正确\n解析：全等三角形的定义就是能够完全重合的两个三角形。"},{"id":"g2_math_032_ex09","knowledge_id":"g2_math_032","question":"解答题：如图，△ABC ≌ △ADC，指出对应顶点、对应边和对应角。","answer":"答案：对应顶点：A-A, B-D, C-C\n对应边：AB-AD, BC-DC, AC-AC\n对应角：∠B-∠D, ∠BAC-∠DAC, ∠BCA-∠DCA\n解析：根据全等符号的顺序确定对应关系。"},{"id":"g2_math_032_ex10","knowledge_id":"g2_math_032","question":"选择题：下列条件中，不能判定两个三角形全等的是（  ）\nA. 三边对应相等\nB. 两边和夹角对应相等\nC. 两角和夹边对应相等\nD. 三个角对应相等","answer":"答案：D\n解析：AAA只能证明相似，不能证明全等。"},{"id":"g2_math_033_ex01","knowledge_id":"g2_math_033","question":"选择题：下列各组条件中，能判定△ABC ≌ △DEF的是（  ）\nA. AB=DE, BC=EF, ∠A=∠D\nB. AB=DE, BC=EF, AC=DF\nC. AB=DE, ∠A=∠D, ∠B=∠E\nD. ∠A=∠D, ∠B=∠E, ∠C=∠F","answer":"答案：B\n解析：B选项是三边对应相等（SSS），可以判定全等。"},{"id":"g2_math_033_ex02","knowledge_id":"g2_math_033","question":"填空题：如果两个三角形的三条边分别对应______，那么这两个三角形全等（SSS）。","answer":"答案：相等\n解析：SSS判定定理：三边对应相等的两个三角形全等。"},{"id":"g2_math_033_ex03","knowledge_id":"g2_math_033","question":"选择题：在△ABC和△DEF中，AB=DE=3cm，BC=EF=4cm，AC=DF=5cm，则△ABC与△DEF（  ）\nA. 不全等\nB. 全等\nC. 面积相等但不全等\nD. 无法确定","answer":"答案：B\n解析：三边分别相等，符合SSS判定定理，所以全等。"},{"id":"g2_math_033_ex04","knowledge_id":"g2_math_033","question":"判断题：SSS是三角形全等的判定方法之一。","answer":"答案：正确\n解析：SSS（边边边）是五种全等判定方法之一。"},{"id":"g2_math_033_ex05","knowledge_id":"g2_math_033","question":"解答题：如图，已知AB=AD，BC=DC，求证：△ABC ≌ △ADC。","answer":"答案：证明：在△ABC和△ADC中\nAB=AD（已知）\nBC=DC（已知）\nAC=AC（公共边）\n∴ △ABC ≌ △ADC（SSS）\n解析：利用SSS判定定理，三条边都对应相等。"},{"id":"g2_math_033_ex06","knowledge_id":"g2_math_033","question":"选择题：用SSS判定两个三角形全等，需要知道（  ）\nA. 三个角对应相等\nB. 三条边对应相等\nC. 两条边和一个角对应相等\nD. 两个角和一条边对应相等","answer":"答案：B\n解析：SSS即边边边，需要三条边对应相等。"},{"id":"g2_math_033_ex07","knowledge_id":"g2_math_033","question":"填空题：SSS的全称是______。","answer":"答案：边边边\n解析：SSS是Side-Side-Side的缩写，即三边对应相等。"},{"id":"g2_math_033_ex08","knowledge_id":"g2_math_033","question":"判断题：只要三条边对应相等，两个三角形就一定全等。","answer":"答案：正确\n解析：这是SSS判定定理的内容。"},{"id":"g2_math_033_ex09","knowledge_id":"g2_math_033","question":"解答题：已知△ABC中，AB=6cm，BC=8cm，AC=10cm，△DEF中，DE=6cm，EF=8cm，DF=10cm，求证△ABC ≌ △DEF。","answer":"答案：证明：在△ABC和△DEF中\nAB=DE=6cm（已知）\nBC=EF=8cm（已知）\nAC=DF=10cm（已知）\n∴ △ABC ≌ △DEF（SSS）\n解析：三边对应相等，满足SSS条件。"},{"id":"g2_math_033_ex10","knowledge_id":"g2_math_033","question":"选择题：下列说法错误的是（  ）\nA. SSS可以判定三角形全等\nB. SSS需要三条边对应相等\nC. 只有SSS一种方法判定全等\nD. SSS是常用的全等判定方法","answer":"答案：C\n解析：除了SSS，还有SAS、ASA、AAS、HL等方法。"},{"id":"g2_math_034_ex01","knowledge_id":"g2_math_034","question":"选择题：下列各组条件中，能判定△ABC ≌ △DEF的是（  ）\nA. AB=DE, BC=EF, ∠B=∠E\nB. AB=DE, BC=EF, ∠A=∠D\nC. AB=DE, ∠A=∠D, ∠B=∠E\nD. ∠A=∠D, ∠B=∠E, ∠C=∠F","answer":"答案：A\n解析：A选项是两边和它们的夹角对应相等（SAS），可以判定全等。"},{"id":"g2_math_034_ex02","knowledge_id":"g2_math_034","question":"填空题：如果两个三角形的两边和它们的______分别对应相等，那么这两个三角形全等（SAS）。","answer":"答案：夹角\n解析：SAS判定定理：两边和它们的夹角对应相等的两个三角形全等。"},{"id":"g2_math_034_ex03","knowledge_id":"g2_math_034","question":"选择题：在△ABC和△DEF中，AB=DE=5cm，BC=EF=6cm，∠B=∠E=60°，则△ABC与△DEF（  ）\nA. 不全等\nB. 全等\nC. 面积相等但不全等\nD. 无法确定","answer":"答案：B\n解析：两边和夹角对应相等，符合SAS判定定理。"},{"id":"g2_math_034_ex04","knowledge_id":"g2_math_034","question":"判断题：SAS中的角必须是两边的夹角。","answer":"答案：正确\n解析：如果不是夹角而是对角，则不能判定全等（SSA不能判定全等）。"},{"id":"g2_math_034_ex05","knowledge_id":"g2_math_034","question":"解答题：如图，已知AB=AD，∠BAC=∠DAC，求证：△ABC ≌ △ADC。","answer":"答案：证明：在△ABC和△ADC中\nAB=AD（已知）\n∠BAC=∠DAC（已知）\nAC=AC（公共边）\n∴ △ABC ≌ △ADC（SAS）\n解析：AB和AC的夹角是∠BAC，AD和AC的夹角是∠DAC，符合SAS。"},{"id":"g2_math_034_ex06","knowledge_id":"g2_math_034","question":"选择题：用SAS判定两个三角形全等，需要知道（  ）\nA. 三条边对应相等\nB. 两条边和它们的夹角对应相等\nC. 两条边和其中一边的对角对应相等\nD. 三个角对应相等","answer":"答案：B\n解析：SAS即边角边，需要两条边和它们的夹角对应相等。"},{"id":"g2_math_034_ex07","knowledge_id":"g2_math_034","question":"填空题：SAS的全称是______。","answer":"答案：边角边\n解析：SAS是Side-Angle-Side的缩写，即两边和夹角对应相等。"},{"id":"g2_math_034_ex08","knowledge_id":"g2_math_034","question":"判断题：两边和其中一边的对角对应相等，可以判定两个三角形全等。","answer":"答案：错误\n解析：这是SSA，不能判定全等。必须是两边的夹角才行。"},{"id":"g2_math_034_ex09","knowledge_id":"g2_math_034","question":"解答题：已知△ABC中，AB=8cm，AC=10cm，∠A=45°，△DEF中，DE=8cm，DF=10cm，∠D=45°，求证△ABC ≌ △DEF。","answer":"答案：证明：在△ABC和△DEF中\nAB=DE=8cm（已知）\n∠A=∠D=45°（已知）\nAC=DF=10cm（已知）\n∴ △ABC ≌ △DEF（SAS）\n解析：AB和AC的夹角是∠A，DE和DF的夹角是∠D，符合SAS。"},{"id":"g2_math_034_ex10","knowledge_id":"g2_math_034","question":"选择题：下列说法正确的是（  ）\nA. SAS和SSA都能判定全等\nB. SAS中的角可以是任意角\nC. SAS需要两边和夹角对应相等\nD. SAS只适用于直角三角形","answer":"答案：C\n解析：SAS需要两条边和它们之间的夹角对应相等。"},{"id":"g2_math_035_ex01","knowledge_id":"g2_math_035","question":"选择题：下列各组条件中，能判定△ABC ≌ △DEF的是（  ）\nA. ∠A=∠D, ∠B=∠E, AB=DE\nB. ∠A=∠D, ∠B=∠E, BC=EF\nC. AB=DE, BC=EF, ∠A=∠D\nD. ∠A=∠D, ∠B=∠E, ∠C=∠F","answer":"答案：A\n解析：A选项是两角和它们的夹边对应相等（ASA），可以判定全等。"},{"id":"g2_math_035_ex02","knowledge_id":"g2_math_035","question":"填空题：如果两个三角形的两角和它们的______分别对应相等，那么这两个三角形全等（ASA）。","answer":"答案：夹边\n解析：ASA判定定理：两角和它们的夹边对应相等的两个三角形全等。"},{"id":"g2_math_035_ex03","knowledge_id":"g2_math_035","question":"选择题：在△ABC和△DEF中，∠A=∠D=50°，∠B=∠E=60°，AB=DE=7cm，则△ABC与△DEF（  ）\nA. 不全等\nB. 全等\nC. 面积相等但不全等\nD. 无法确定","answer":"答案：B\n解析：两角和夹边对应相等，符合ASA判定定理。"},{"id":"g2_math_035_ex04","knowledge_id":"g2_math_035","question":"判断题：ASA中的边必须是两角的夹边。","answer":"答案：正确\n解析：ASA即角边角，边必须在两个角之间。"},{"id":"g2_math_035_ex05","knowledge_id":"g2_math_035","question":"解答题：如图，已知∠B=∠C，∠BAD=∠CAD，求证：△ABD ≌ △ACD。","answer":"答案：证明：在△ABD和△ACD中\n∠BAD=∠CAD（已知）\nAD=AD（公共边）\n∠B=∠C（已知）\n∴ △ABD ≌ △ACD（ASA）\n解析：∠BAD和∠B的夹边是AB，∠CAD和∠C的夹边是AC...不对，应该是∠BAD和∠ADB的夹边是AD？\n重新：在△ABD和△ACD中\n∠BAD=∠CAD（已知）\nAD=AD（公共边）\n∠ADB=∠ADC（等角的补角相等）\n∴ △ABD ≌ △ACD（ASA）"},{"id":"g2_math_035_ex06","knowledge_id":"g2_math_035","question":"选择题：用ASA判定两个三角形全等，需要知道（  ）\nA. 三条边对应相等\nB. 两个角和它们的夹边对应相等\nC. 两个角和其中一角的对边对应相等\nD. 三条边对应相等","answer":"答案：B\n解析：ASA即角边角，需要两个角和它们的夹边对应相等。"},{"id":"g2_math_035_ex07","knowledge_id":"g2_math_035","question":"填空题：ASA的全称是______。","answer":"答案：角边角\n解析：ASA是Angle-Side-Angle的缩写，即两角和夹边对应相等。"},{"id":"g2_math_035_ex08","knowledge_id":"g2_math_035","question":"判断题：ASA和AAS是两种不同的全等判定方法。","answer":"答案：正确\n解析：ASA是两角和夹边，AAS是两角和其中一角的对边。"},{"id":"g2_math_035_ex09","knowledge_id":"g2_math_035","question":"解答题：已知△ABC中，∠A=70°，∠B=50°，AB=9cm，△DEF中，∠D=70°，∠E=50°，DE=9cm，求证△ABC ≌ △DEF。","answer":"答案：证明：在△ABC和△DEF中\n∠A=∠D=70°（已知）\nAB=DE=9cm（已知）\n∠B=∠E=50°（已知）\n∴ △ABC ≌ △DEF（ASA）\n解析：∠A和∠B的夹边是AB，∠D和∠E的夹边是DE，符合ASA。"},{"id":"g2_math_035_ex10","knowledge_id":"g2_math_035","question":"选择题：下列说法错误的是（  ）\nA. ASA可以判定三角形全等\nB. ASA需要两个角和夹边对应相等\nC. ASA中的边在两个角之间\nD. ASA只适用于等腰三角形","answer":"答案：D\n解析：ASA适用于所有三角形，不是只适用于等腰三角形。"},{"id":"g2_math_036_ex01","knowledge_id":"g2_math_036","question":"选择题：下列各组条件中，能判定△ABC ≌ △DEF的是（  ）\nA. ∠A=∠D, ∠B=∠E, AB=DE\nB. ∠A=∠D, ∠B=∠E, BC=EF\nC. AB=DE, BC=EF, ∠A=∠D\nD. ∠A=∠D, ∠B=∠E, ∠C=∠F","answer":"答案：B\n解析：B选项是两角和其中一角的对边对应相等（AAS），可以判定全等。"},{"id":"g2_math_036_ex02","knowledge_id":"g2_math_036","question":"填空题：如果两个三角形的两角和其中一角的______分别对应相等，那么这两个三角形全等（AAS）。","answer":"答案：对边\n解析：AAS判定定理：两角和其中一角的对边对应相等的两个三角形全等。"},{"id":"g2_math_036_ex03","knowledge_id":"g2_math_036","question":"选择题：在△ABC和△DEF中，∠A=∠D=50°，∠B=∠E=60°，BC=EF=8cm，则△ABC与△DEF（  ）\nA. 不全等\nB. 全等\nC. 面积相等但不全等\nD. 无法确定","answer":"答案：B\n解析：∠A和∠B对应∠D和∠E，BC是∠A的对边，EF是∠D的对边，符合AAS判定定理。"},{"id":"g2_math_036_ex04","knowledge_id":"g2_math_036","question":"判断题：AAS可以看作是ASA的推论。","answer":"答案：正确\n解析：因为三角形内角和是180°，已知两个角相等，第三个角也相等，所以AAS可以转化为ASA。"},{"id":"g2_math_036_ex05","knowledge_id":"g2_math_036","question":"解答题：如图，已知∠B=∠C，BD=CD，求证：△ABD ≌ △ACD。","answer":"答案：证明：在△ABD和△ACD中\n∠B=∠C（已知）\n∠ADB=∠ADC（等角的补角相等）\nBD=CD（已知）\n∴ △ABD ≌ △ACD（AAS）\n解析：∠B和∠ADB的对边是AD，∠C和∠ADC的对边是AD，加上BD=CD，符合AAS。"},{"id":"g2_math_036_ex06","knowledge_id":"g2_math_036","question":"选择题：用AAS判定两个三角形全等，需要知道（  ）\nA. 三条边对应相等\nB. 两个角和它们的夹边对应相等\nC. 两个角和其中一角的对边对应相等\nD. 三个角对应相等","answer":"答案：C\n解析：AAS即角角边，需要两个角和其中一角的对边对应相等。"},{"id":"g2_math_036_ex07","knowledge_id":"g2_math_036","question":"填空题：AAS的全称是______。","answer":"答案：角角边\n解析：AAS是Angle-Angle-Side的缩写，即两角和其中一角的对边对应相等。"},{"id":"g2_math_036_ex08","knowledge_id":"g2_math_036","question":"判断题：AAS和ASA都能判定三角形全等。","answer":"答案：正确\n解析：两者都是常用的全等判定方法。"},{"id":"g2_math_036_ex09","knowledge_id":"g2_math_036","question":"解答题：已知△ABC中，∠A=70°，∠B=50°，BC=10cm，△DEF中，∠D=70°，∠E=50°，EF=10cm，求证△ABC ≌ △DEF。","answer":"答案：证明：在△ABC和△DEF中\n∠A=∠D=70°（已知）\n∠B=∠E=50°（已知）\nBC=EF=10cm（已知）\n∴ △ABC ≌ △DEF（AAS）\n解析：BC是∠A的对边，EF是∠D的对边，符合AAS。"},{"id":"g2_math_036_ex10","knowledge_id":"g2_math_036","question":"选择题：下列说法正确的是（  ）\nA. AAS和ASA是完全相同的方法\nB. AAS中的边是两个角的夹边\nC. AAS中的边是其中一个角的对边\nD. AAS不能判定全等","answer":"答案：C\n解析：AAS中的边是其中一个角的对边，而不是夹边。"},{"id":"g2_math_037_ex01","knowledge_id":"g2_math_037","question":"选择题：下列各组条件中，能判定两个直角三角形全等的是（  ）\nA. 两个锐角对应相等\nB. 一条直角边对应相等\nC. 斜边和一条直角边对应相等\nD. 两条直角边对应相等","answer":"答案：C\n解析：C选项是HL（斜边-直角边），可以判定直角三角形全等。D选项也可以（SAS），但题目问的是HL方法。"},{"id":"g2_math_037_ex02","knowledge_id":"g2_math_037","question":"填空题：如果两个直角三角形的______和______分别对应相等，那么这两个直角三角形全等（HL）。","answer":"答案：斜边，一条直角边\n解析：HL判定定理：斜边和一条直角边对应相等的两个直角三角形全等。"},{"id":"g2_math_037_ex03","knowledge_id":"g2_math_037","question":"选择题：在Rt△ABC和Rt△DEF中，∠C=∠F=90°，AB=DE=13cm，AC=DF=5cm，则△ABC与△DEF（  ）\nA. 不全等\nB. 全等\nC. 面积相等但不全等\nD. 无法确定","answer":"答案：B\n解析：斜边AB=DE，直角边AC=DF，符合HL判定定理。"},{"id":"g2_math_037_ex04","knowledge_id":"g2_math_037","question":"判断题：HL只适用于直角三角形。","answer":"答案：正确\n解析：HL是直角三角形特有的全等判定方法。"},{"id":"g2_math_037_ex05","knowledge_id":"g2_math_037","question":"解答题：如图，已知∠C=∠D=90°，AC=BD，求证：Rt△ABC ≌ Rt△BAD。","answer":"答案：证明：在Rt△ABC和Rt△BAD中\n∠C=∠D=90°（已知）\nAB=BA（公共边，斜边）\nAC=BD（已知，直角边）\n∴ Rt△ABC ≌ Rt△BAD（HL）\n解析：斜边AB=BA，直角边AC=BD，符合HL。"},{"id":"g2_math_037_ex06","knowledge_id":"g2_math_037","question":"选择题：用HL判定两个直角三角形全等，需要知道（  ）\nA. 三个角对应相等\nB. 斜边和一条直角边对应相等\nC. 两条直角边对应相等\nD. 三个边对应相等","answer":"答案：B\n解析：HL即斜边-直角边，需要斜边和一条直角边对应相等。"},{"id":"g2_math_037_ex07","knowledge_id":"g2_math_037","question":"填空题：HL的全称是______。","answer":"答案：斜边-直角边\n解析：HL是Hypotenuse-Leg的缩写。"},{"id":"g2_math_037_ex08","knowledge_id":"g2_math_037","question":"判断题：两个直角三角形，如果斜边相等，就一定全等。","answer":"答案：错误\n解析：还需要一条直角边对应相等（HL），只有斜边相等不能判定全等。"},{"id":"g2_math_037_ex09","knowledge_id":"g2_math_037","question":"解答题：已知Rt△ABC中，∠C=90°，AB=10cm，BC=6cm，Rt△DEF中，∠F=90°，DE=10cm，EF=6cm，求证Rt△ABC ≌ Rt△DEF。","answer":"答案：证明：在Rt△ABC和Rt△DEF中\n∠C=∠F=90°（已知）\nAB=DE=10cm（斜边相等）\nBC=EF=6cm（直角边相等）\n∴ Rt△ABC ≌ Rt△DEF（HL）\n解析：斜边和直角边对应相等，符合HL。"},{"id":"g2_math_037_ex10","knowledge_id":"g2_math_037","question":"选择题：下列说法正确的是（  ）\nA. HL可以用于任意三角形\nB. HL需要斜边和两条直角边对应相等\nC. HL是直角三角形特有的判定方法\nD. HL和SSS是完全相同的","answer":"答案：C\n解析：HL是直角三角形特有的全等判定方法。"},{"id":"g2_math_038_ex01","knowledge_id":"g2_math_038","question":"选择题：下列关于\"轴对称图形\"的说法，正确的是（  ）\nA. 错误说法A\nB. 错误说法B\nC. 正确说法C\nD. 错误说法D","answer":"答案：C\n解析：根据轴对称图形的定义和性质分析各选项。"},{"id":"g2_math_038_ex02","knowledge_id":"g2_math_038","question":"选择题：下列情形中，能应用\"轴对称图形\"知识解决的是（  ）\nA. 场景A\nB. 场景B\nC. 场景C\nD. 场景D","answer":"答案：C\n解析：轴对称图形适用于描述的场景。"},{"id":"g2_math_038_ex03","knowledge_id":"g2_math_038","question":"填空题：轴对称图形的计算公式是______。","answer":"答案：对称轴\n解析：这是轴对称图形的核心公式。"},{"id":"g2_math_038_ex04","knowledge_id":"g2_math_038","question":"判断题：轴对称图形的某个重要性质描述。","answer":"答案：正确\n解析：根据知识点的定义和性质判断。"},{"id":"g2_math_038_ex05","knowledge_id":"g2_math_038","question":"判断题：轴对称图形的某个常见错误描述。","answer":"答案：错误\n解析：正确的理解应该是。"},{"id":"g2_math_038_ex06","knowledge_id":"g2_math_038","question":"解答题：请简述轴对称图形的定义和主要内容。","answer":"答案：如果一个平面图形沿一条直线折叠，直线两旁的部分能够完全重合，那么这个图形叫做轴对称图形，这条直线就是它的对称轴。\n\n常见的轴对称图形：\n- 等腰三角形（1条对称轴）\n- 等边三角形（3条对称轴）\n- ...\n解析：本题考察对轴对称图形的理解。"},{"id":"g2_math_038_ex07","knowledge_id":"g2_math_038","question":"解答题：举例说明轴对称图形在实际问题中的应用。","answer":"答案：根据知识点举例说明\n解析：轴对称图形的实际应用场景。"},{"id":"g2_math_038_ex08","knowledge_id":"g2_math_038","question":"计算题：已知相关条件，利用轴对称图形的公式进行计算。","answer":"答案：根据公式计算得出结果\n解析：代入公式逐步计算。"},{"id":"g2_math_038_ex09","knowledge_id":"g2_math_038","question":"综合题：结合轴对称图形和其他相关知识解决问题。","answer":"答案：综合运用知识解答\n解析：本题考察知识的综合应用能力。"},{"id":"g2_math_038_ex10","knowledge_id":"g2_math_038","question":"综合题：分析轴对称图形与前后知识点的联系。","answer":"答案：分析知识点之间的联系\n解析：建立知识体系，理解知识点之间的逻辑关系。"},{"id":"g2_math_039_ex01","knowledge_id":"g2_math_039","question":"选择题：下列关于\"线段垂直平分线的性质\"的说法，正确的是（  ）\nA. 错误说法A\nB. 错误说法B\nC. 正确说法C\nD. 错误说法D","answer":"答案：C\n解析：根据线段垂直平分线的性质的定义和性质分析各选项。"},{"id":"g2_math_039_ex02","knowledge_id":"g2_math_039","question":"选择题：下列情形中，能应用\"线段垂直平分线的性质\"知识解决的是（  ）\nA. 场景A\nB. 场景B\nC. 场景C\nD. 场景D","answer":"答案：C\n解析：线段垂直平分线的性质适用于描述的场景。"},{"id":"g2_math_039_ex03","knowledge_id":"g2_math_039","question":"填空题：线段垂直平分线的性质的计算公式是______。","answer":"答案：到线段两端距离相等的点在这条线段的垂直平分线上\n解析：这是线段垂直平分线的性质的核心公式。"},{"id":"g2_math_039_ex04","knowledge_id":"g2_math_039","question":"判断题：线段垂直平分线的性质的某个重要性质描述。","answer":"答案：正确\n解析：根据知识点的定义和性质判断。"},{"id":"g2_math_039_ex05","knowledge_id":"g2_math_039","question":"判断题：线段垂直平分线的性质的某个常见错误描述。","answer":"答案：错误\n解析：正确的理解应该是。"},{"id":"g2_math_039_ex06","knowledge_id":"g2_math_039","question":"解答题：请简述线段垂直平分线的性质的定义和主要内容。","answer":"答案：垂直平分线：经过线段中点并且垂直于这条线段的直线叫做这条线段的垂直平分线。\n\n性质：\n1. 线段垂直平分线上的点到这条线段两端点的距离相等\n2. 到一条线段两端点距离相等的点，在这条线段的垂直平分线上...\n解析：本题考察对线段垂直平分线的性质的理解。"},{"id":"g2_math_039_ex07","knowledge_id":"g2_math_039","question":"解答题：举例说明线段垂直平分线的性质在实际问题中的应用。","answer":"答案：根据知识点举例说明\n解析：线段垂直平分线的性质的实际应用场景。"},{"id":"g2_math_039_ex08","knowledge_id":"g2_math_039","question":"计算题：已知相关条件，利用线段垂直平分线的性质的公式进行计算。","answer":"答案：根据公式计算得出结果\n解析：代入公式逐步计算。"},{"id":"g2_math_039_ex09","knowledge_id":"g2_math_039","question":"综合题：结合线段垂直平分线的性质和其他相关知识解决问题。","answer":"答案：综合运用知识解答\n解析：本题考察知识的综合应用能力。"},{"id":"g2_math_039_ex10","knowledge_id":"g2_math_039","question":"综合题：分析线段垂直平分线的性质与前后知识点的联系。","answer":"答案：分析知识点之间的联系\n解析：建立知识体系，理解知识点之间的逻辑关系。"},{"id":"g2_math_040_ex01","knowledge_id":"g2_math_040","question":"选择题：下列关于\"等腰三角形的性质\"的说法，正确的是（  ）\nA. 错误说法A\nB. 错误说法B\nC. 正确说法C\nD. 错误说法D","answer":"答案：C\n解析：根据等腰三角形的性质的定义和性质分析各选项。"},{"id":"g2_math_040_ex02","knowledge_id":"g2_math_040","question":"选择题：下列情形中，能应用\"等腰三角形的性质\"知识解决的是（  ）\nA. 场景A\nB. 场景B\nC. 场景C\nD. 场景D","answer":"答案：C\n解析：等腰三角形的性质适用于描述的场景。"},{"id":"g2_math_040_ex03","knowledge_id":"g2_math_040","question":"填空题：等腰三角形的性质的计算公式是______。","answer":"答案：等腰三角形两底角相等\n三线合一：顶角平分线、底边上的中线、底边上的高互相重合\n解析：这是等腰三角形的性质的核心公式。"},{"id":"g2_math_040_ex04","knowledge_id":"g2_math_040","question":"判断题：等腰三角形的性质的某个重要性质描述。","answer":"答案：正确\n解析：根据知识点的定义和性质判断。"},{"id":"g2_math_040_ex05","knowledge_id":"g2_math_040","question":"判断题：等腰三角形的性质的某个常见错误描述。","answer":"答案：错误\n解析：正确的理解应该是。"},{"id":"g2_math_040_ex06","knowledge_id":"g2_math_040","question":"解答题：请简述等腰三角形的性质的定义和主要内容。","answer":"答案：等腰三角形：有两条边相等的三角形。\n\n性质：\n1. 等腰三角形的两底角相等（等边对等角）\n2. 等腰三角形顶角的平分线、底边上的中线、底边上的高互相重合（三线合一）\n3. 等腰三角形是轴对称图形，对称...\n解析：本题考察对等腰三角形的性质的理解。"},{"id":"g2_math_040_ex07","knowledge_id":"g2_math_040","question":"解答题：举例说明等腰三角形的性质在实际问题中的应用。","answer":"答案：根据知识点举例说明\n解析：等腰三角形的性质的实际应用场景。"},{"id":"g2_math_040_ex08","knowledge_id":"g2_m wledge_id":"g2_math_025","question":"解答题：请简述极差与方差的定义和主要内容。","answer":"答案：极差：\n一组数据中的最大值与最小值的差叫做极差。\n极差反映了一组数据的变动范围。\n\n方差：\n对于 n 个数据 x₁, x₂, ..., xₙ，各数据与它们的平均数 x̄ 的差的平方的平均数，叫做这组数...\n解析：本题考察对极差与方差的理解。"},{"id":"g2_math_025_ex07","knowledge_id":"g2_math_025","question":"解答题：举例说明极差与方差在实际问题中的应用。","answer":"答案：根据知识点举例说明\n解析：极差与方差的实际应用场景。"},{"id":"g2_math_025_ex08","knowledge_id":"g2_math_025","question":"计算题：已知相关条件，利用极差与方差的公式进行计算。","answer":"答案：根据公式计算得出结果\n解析：代入公式逐步计算。"},{"id":"g2_math_025_ex09","knowledge_id":"g2_math_025","question":"综合题：结合极差与方差和其他相关知识解决问题。","answer":"答案：综合运用知识解答\n解析：本题考察知识的综合应用能力。"},{"id":"g2_math_025_ex10","knowledge_id":"g2_math_025","question":"综合题：分析极差与方差与前后知识点的联系。","answer":"答案：分析知识点之间的联系\n解析：建立知识体系，理解知识点之间的逻辑关系。"},{"id":"g2_math_026_ex01","knowledge_id":"g2_math_026","question":"选择题：下列关于\"数据的分析整理\"的说法，正确的是（  ）\nA. 错误说法A\nB. 错误说法B\nC. 正确说法C\nD. 错误说法D","answer":"答案：C\n解析：根据数据的分析整理的定义和性质分析各选项。"},{"id":"g2_math_026_ex02","knowledge_id":"g2_math_026","question":"选择题：下列情形中，能应用\"数据的分析整理\"知识解决的是（  ）\nA. 场景A\nB. 场景B\nC. 场景C\nD. 场景D","answer":"答案：C\n解析：数据的分析整理适用于描述的场景。"},{"id":"g2_math_026_ex03","knowledge_id":"g2_math_026","question":"填空题：数据的分析整理的计算公式是______。","answer":"答案：频数、频率、统计图\n解析：这是数据的分析整理的核心公式。"},{"id":"g2_math_026_ex04","knowledge_id":"g2_math_026","question":"判断题：数据的分析整理的某个重要性质描述。","answer":"答案：正确\n解析：根据知识点的定义和性质判断。"},{"id":"g2_math_026_ex05","knowledge_id":"g2_math_026","question":"判断题：数据的分析整理的某个常见错误描述。","answer":"答案：错误\n解析：正确的理解应该是。"},{"id":"g2_math_026_ex06","knowledge_id":"g2_math_026","question":"解答题：请简述数据的分析整理的定义和主要内容。","answer":"答案：数据的分析整理：\n\n1. 频数：每个对象出现的次数\n2. 频率：每个对象出现的次数与总次数的比值\n3. 各频率之和等于 1\n\n常用统计图：\n- 条形统计图\n- 折线统计图\n- 扇形统计图\n- 频数分布...\n解析：本题考察对数据的分析整理的理解。"},{"id":"g2_math_026_ex07","knowledge_id":"g2_math_026","question":"解答题：举例说明数据的分析整理在实际问题中的应用。","answer":"答案：根据知识点举例说明\n解析：数据的分析整理的实际应用场景。"},{"id":"g2_math_026_ex08","knowledge_id":"g2_math_026","question":"计算题：已知相关条件，利用数据的分析整理的公式进行计算。","answer":"答案：根据公式计算得出结果\n解析：代入公式逐步计算。"},{"id":"g2_math_026_ex09","knowledge_id":"g2_math_026","question":"综合题：结合数据的分析整理和其他相关知识解决问题。","answer":"答案：综合运用知识解答\n解析：本题考察知识的综合应用能力。"},{"id":"g2_math_026_ex10","knowledge_id":"g2_math_026","question":"综合题：分析数据的分析整理与前后知识点的联系。","answer":"答案：分析知识点之间的联系\n解析：建立知识体系，理解知识点之间的逻辑关系。"}];
        const HAS_EXAMPLES = true;

        // 错题本管理器
        const WrongBookManager = {
            STORAGE_KEY_PREFIX: 'wrongbook_',
            getWrongBook(grade, subject) {
                const key = this.STORAGE_KEY_PREFIX + grade + '_' + subject;
                return JSON.parse(localStorage.getItem(key) || '[]');
            },
            addWrongBook(item) {
                const key = this.STORAGE_KEY_PREFIX + item.grade + '_' + item.subject;
                let wrongBook = this.getWrongBook(item.grade, item.subject);
                const exists = wrongBook.some(w => w.question === item.question);
                if (exists) return false;
                wrongBook.push({...item, id: item.knowledgeId + '_' + Date.now(), addedAt: new Date().toISOString()});
                localStorage.setItem(key, JSON.stringify(wrongBook));
                return true;
            }
        };

        // 学习进度管理器
        const ProgressManager = {
            STORAGE_KEY: 'study_progress',
            
            getProgress() {
                try {
                    return JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
                } catch(e) {
                    return {};
                }
            },
            
            saveProgress(progress) {
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(progress));
            },
            
            recordStudy(grade, subject, subjectName, semester, semesterName, knowledgeId, knowledgeName) {
                const progress = this.getProgress();
                const now = new Date().toISOString();
                const today = new Date().toISOString().split('T')[0];
                
                if (!progress.learnedKnowledge) progress.learnedKnowledge = {};
                if (!progress.dailyStats) progress.dailyStats = {};
                if (!progress.dailyStats[today]) {
                    progress.dailyStats[today] = { learnedCount: 0, subjects: [] };
                }
                
                const isNew = !progress.learnedKnowledge[knowledgeId];
                progress.learnedKnowledge[knowledgeId] = { learnedAt: now };
                
                if (isNew) {
                    progress.dailyStats[today].learnedCount++;
                    if (!progress.dailyStats[today].subjects.includes(subject)) {
                        progress.dailyStats[today].subjects.push(subject);
                    }
                }
                
                progress.lastStudy = {
                    grade, subject, subjectName, semester, semesterName,
                    knowledgeId, knowledgeName, timestamp: now
                };
                
                this.saveProgress(progress);
            },
            
            isLearned(knowledgeId) {
                const progress = this.getProgress();
                return !!(progress.learnedKnowledge && progress.learnedKnowledge[knowledgeId]);
            },
            
            getLastStudy() {
                const progress = this.getProgress();
                return progress.lastStudy || null;
            },
            
            getSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                if (!progress.learnedKnowledge) return { learned: 0, total: 0, percent: 0 };
                const prefix = grade + '_' + subject + '_';
                const learned = Object.keys(progress.learnedKnowledge).filter(k => k.startsWith(prefix)).length;
                const total = DATA_KNOWLEDGE.length;
                const percent = total > 0 ? Math.round((learned / total) * 100) : 0;
                return { learned, total, percent };
            },
            
            clearSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                const prefix = grade + '_' + subject + '_';
                
                if (progress.learnedKnowledge) {
                    Object.keys(progress.learnedKnowledge).forEach(k => {
                        if (k.startsWith(prefix)) {
                            delete progress.learnedKnowledge[k];
                        }
                    });
                }
                
                if (progress.lastStudy && progress.lastStudy.grade === grade && progress.lastStudy.subject === subject) {
                    delete progress.lastStudy;
                }
                
                this.saveProgress(progress);
                return true;
            }
        };

        // URL参数解析
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                grade: 'g2',
                subject: 'math',
                semester: params.get('semester') || 'upper'
            };
        }

        const gradeNames = {'g1':'初一','g2':'初二','g3':'初三'};
        const subjectNames = {'math':'数学'};
        const semesterNames = {'upper':'上册','lower':'下册'};

        let currentParams = getUrlParams();
        let knowledgeList = [];
        let expandedIds = new Set();
        let currentExample = null;

        const pageTitle = document.getElementById('page-title');
        const pageSubtitle = document.getElementById('page-subtitle');
        const knowledgeListEl = document.getElementById('knowledge-list');
        const emptyStateEl = document.getElementById('empty-state');
        const searchResultsInfo = document.getElementById('search-results-info');
        const searchCountEl = document.getElementById('search-count');
        const searchInput = document.getElementById('search-input');

        function initPage() {
            const {grade, subject, semester} = currentParams;
            pageTitle.textContent = gradeNames[grade] + ' · ' + subjectNames[subject] + ' · ' + semesterNames[semester];
            loadKnowledge();
            updateProgressStat();
            
            const hash = window.location.hash.replace('#', '');
            if (hash && knowledgeList.some(k => k.id === hash)) {
                setTimeout(() => {
                    toggleExpand(hash);
                    const card = document.querySelector('[data-id="' + hash + '"]');
                    if (card) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
        }

        function updateProgressStat() {
            const {grade, subject} = currentParams;
            const learnedInSemester = knowledgeList.filter(k => ProgressManager.isLearned(k.id)).length;
            document.getElementById('progress-learned').textContent = learnedInSemester;
            document.getElementById('progress-total').textContent = knowledgeList.length;
        }

        function loadKnowledge() {
            const {grade, subject, semester} = currentParams;
            knowledgeList = DATA_KNOWLEDGE.filter(k => {
                return k.semester === semester;
            });
            renderKnowledgeList();
        }

        function renderKnowledgeList(items = knowledgeList) {
            if (items.length === 0) {
                knowledgeListEl.innerHTML = '';
                emptyStateEl.classList.remove('hidden');
                return;
            }
            emptyStateEl.classList.add('hidden');
            knowledgeListEl.innerHTML = items.map(item => {
                const isExpanded = expandedIds.has(item.id);
                const isLearned = ProgressManager.isLearned(item.id);
                return '<div class="card knowledge-card ' + (isLearned ? 'learned' : '') + '" data-id="' + item.id + '">' +
                    '<div class="knowledge-header p-4 flex items-center justify-between" onclick="toggleExpand(\'' + item.id + '\')">' +
                        '<div class="flex items-center gap-3 flex-1 min-w-0">' +
                            '<div class="expand-icon ' + (isExpanded ? 'expanded' : 'collapsed') + '">' + (isExpanded ? '−' : '+') + '</div>' +
                            '<div class="flex-1 min-w-0">' +
                                '<h3 class="text-lg font-semibold text-gray-800 flex items-center gap-2">' + escapeHtml(item.name) + (isLearned ? '<span class="text-green-500 text-sm">✓ 已学习</span>' : '') + '</h3>' +
                                '<p class="text-xs text-gray-500 mt-1">' + escapeHtml(item.chapter) + '</p>' +
                            '</div>' +
                        '</div>' +
                        (HAS_EXAMPLES ? '<button class="btn btn-secondary text-sm px-3 py-1" onclick="event.stopPropagation(); showExample(\'' + item.id + '\', \'' + escapeHtml(item.name) + '\')">例题</button>' : '') +
                    '</div>' +
                    '<div id="content-' + item.id + '" class="px-6 pb-4 ' + (isExpanded ? '' : 'hidden') + '">' +
                        (item.formula ? '<div class="mb-4"><h4 class="text-sm font-medium text-gray-500 mb-2">📐 公式</h4><p class="formula-box text-gray-800 text-lg bg-gray-50 p-3 rounded-lg">' + escapeHtml(item.formula) + '</p></div>' : '') +
                        (item.explanation ? '<div><h4 class="text-sm font-medium text-gray-500 mb-2">📝 解释</h4><p class="text-gray-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(item.explanation) + '</p></div>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function toggleExpand(id) {
            const isNewLearn = !expandedIds.has(id) && !ProgressManager.isLearned(id);
            if (expandedIds.has(id)) {
                expandedIds.delete(id);
            } else {
                expandedIds.add(id);
                const {grade, subject, semester} = currentParams;
                const item = knowledgeList.find(k => k.id === id);
                if (item) {
                    ProgressManager.recordStudy(
                        grade, subject, subjectNames[subject],
                        semester, semesterNames[semester],
                        id, item.name
                    );
                }
            }
            const card = document.querySelector('[data-id="' + id + '"]');
            const content = document.getElementById('content-' + id);
            const icon = card.querySelector('.expand-icon');
            const header = card.querySelector('.knowledge-header');
            const title = card.querySelector('h3');
            if (expandedIds.has(id)) {
                content.classList.remove('hidden');
                icon.classList.remove('collapsed');
                icon.classList.add('expanded');
                icon.textContent = '−';
                header.classList.add('expanded');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('expanded');
                icon.classList.add('collapsed');
                icon.textContent = '+';
                header.classList.remove('expanded');
            }
            if (isNewLearn) {
                card.classList.add('learned');
                if (!title.querySelector('.text-green-500')) {
                    title.innerHTML += '<span class="text-green-500 text-sm">✓ 已学习</span>';
                }
                updateProgressStat();
            }
        }

        function expandAll() {
            knowledgeList.forEach(item => expandedIds.add(item.id));
            renderKnowledgeList();
        }

        function collapseAll() {
            expandedIds.clear();
            renderKnowledgeList();
        }

        function searchKnowledge(keyword, list) {
            if (!keyword) return [];
            const lower = keyword.toLowerCase();
            return list.filter(k =>
                k.name.toLowerCase().includes(lower) ||
                k.chapter.toLowerCase().includes(lower)
            );
        }

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                searchResultsInfo.classList.add('hidden');
                renderKnowledgeList();
                return;
            }
            const results = searchKnowledge(keyword, knowledgeList);
            searchCountEl.textContent = results.length;
            searchResultsInfo.classList.remove('hidden');
            renderKnowledgeList(results);
        }

        function showExample(knowledgeId, knowledgeName) {
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === knowledgeId);
            if (examples.length === 0) {
                alert('暂无例题');
                return;
            }
            const example = examples[Math.floor(Math.random() * examples.length)];
            currentExample = {...example, knowledgeId, knowledgeName, ...currentParams};
            document.getElementById('example-knowledge-name').textContent = knowledgeName;
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
            document.getElementById('example-modal').classList.remove('hidden');
        }

        function nextExample() {
            if (!currentExample) return;
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === currentExample.knowledgeId);
            const otherExamples = examples.filter(e => e !== currentExample);
            if (otherExamples.length === 0) {
                alert('没有更多例题了');
                return;
            }
            const example = otherExamples[Math.floor(Math.random() * otherExamples.length)];
            currentExample = {...example, knowledgeId: currentExample.knowledgeId, knowledgeName: currentExample.knowledgeName, ...currentParams};
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
        }

        function addToWrongBook() {
            if (!currentExample) return;
            const item = {
                knowledgeId: currentExample.knowledgeId,
                knowledgeName: currentExample.knowledgeName,
                question: currentExample.question,
                answer: currentExample.answer,
                grade: currentParams.grade,
                subject: currentParams.subject
            };
            if (WrongBookManager.addWrongBook(item)) {
                alert('已加入错题本！');
            } else {
                alert('该题目已在错题本中');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearProgress() {
            const {grade, subject} = currentParams;
            const subjectName = subjectNames[subject];
            var msg = '确定要清除【' + subjectName + '】科目的所有学习进度吗？';
            msg += '\n\n';
            msg += '此操作将清除该科目所有已学习标记，且不可恢复。';
            if (!confirm(msg)) {
                return;
            }
            ProgressManager.clearSubjectProgress(grade, subject);
            updateProgressStat();
            renderKnowledgeList();
            alert('学习进度已清除');
        }

        document.getElementById('btn-expand-all').addEventListener('click', expandAll);
        document.getElementById('btn-collapse-all').addEventListener('click', collapseAll);
        document.getElementById('btn-clear-progress').addEventListener('click', clearProgress);
        searchInput.addEventListener('keyup', e => { if (e.key === 'Enter') performSearch(); });
        searchInput.addEventListener('input', () => { if (!searchInput.value) { searchResultsInfo.classList.add('hidden'); renderKnowledgeList(); }});
        document.getElementById('close-example').addEventListener('click', () => document.getElementById('example-modal').classList.add('hidden'));
        document.getElementById('btn-show-answer').addEventListener('click', () => {
            document.getElementById('example-answer-section').classList.remove('hidden');
            document.getElementById('btn-show-answer').classList.add('hidden');
        });
        document.getElementById('btn-next-example').addEventListener('click', nextExample);
        document.getElementById('btn-add-wrong').addEventListener('click', addToWrongBook);
        document.getElementById('example-modal').addEventListener('click', e => { if (e.target.id === 'example-modal') document.getElementById('example-modal').classList.add('hidden'); });

        initPage();
    </script>
</body>
</html>
