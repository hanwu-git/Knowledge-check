    <script>
        // ==================== 内嵌知识点数据 ====================
        const DATA_KNOWLEDGE = [{"id":"g3_physics_001","chapter":"第十三章 内能","name":"分子热运动","formula":"扩散现象：不同物质相互接触时彼此进入对方的现象\n分子动理论：物质由分子、原子组成，分子在不停地做无规则运动，分子间有相互作用的引力和斥力","explanation":"分子热运动：\n1. 物质是由分子、原子构成的\n2. 一切物质的分子都在不停地做无规则运动（热运动）\n3. 分子间存在相互作用的引力和斥力\n\n扩散现象：\n- 定义：不同物质在相互接触时彼此进入对方的现象\n- 说明：分子在不停地运动，分子间有间隙\n- 影响因素：温度越高，扩散越快\n\n分子间作用力：\n- 分子距离小时，斥力 > 引力，表现为斥力\n- 分子距离大时，引力 > 斥力，表现为引力\n- 分子距离很大时，作用力可以忽略","semester":"upper"},{"id":"g3_physics_002","chapter":"第十三章 内能","name":"内能的概念","formula":"内能 = 分子动能 + 分子势能\n单位：焦耳（J）","explanation":"内能：构成物体的所有分子，其热运动的动能与分子势能的总和。\n\n单位：焦耳（J）\n\n内能的特点：\n- 一切物体都具有内能\n- 同一物体，温度越高，内能越大\n- 内能还与质量、状态、体积有关\n\n改变内能的两种方式：\n1. 热传递：能量从高温物体传到低温物体\n2. 做功：对物体做功，内能增加；物体对外做功，内能减少","semester":"upper"},{"id":"g3_physics_003","chapter":"第十三章 内能","name":"物体内能的改变","formula":"热传递：热量Q，单位J\n做功：W = Fs","explanation":"热传递改变内能：\n- 条件：温度差\n- 方向：高温→低温\n- 实质：内能的转移\n- 热量：热传递过程中传递内能的多少\n\n做功改变内能：\n- 对物体做功，内能增加（如压缩气体）\n- 物体对外做功，内能减少（如气体膨胀）\n- 实质：内能与其他形式能的转化\n\n热传递和做功在改变内能上是等效的。","semester":"upper"},{"id":"g3_physics_004","chapter":"第十三章 内能","name":"比热容的概念","formula":"c = Q / (mΔt)\n单位：J/(kg·°C)","explanation":"比热容：单位质量的某种物质，温度升高（或降低）1°C所吸收（或放出）的热量。\n\n符号：c\n单位：J/(kg·°C)，读作焦每千克摄氏度\n\n特点：\n- 比热容是物质的一种特性\n- 与物体质量、温度变化、吸热多少无关\n- 与物质种类和状态有关\n\n水的比热容：\n- c水 = 4.2×10³ J/(kg·°C)\n- 意义：1 kg水温度升高1°C吸收4.2×10³ J热量\n- 应用：取暖、冷却、调节气温","semester":"upper"},{"id":"g3_physics_005","chapter":"第十三章 内能","name":"热量的计算","formula":"Q吸 = cm(t - t₀)\nQ放 = cm(t₀ - t)\nQ = cmΔt","explanation":"吸热公式：\nQ吸 = cm(t - t₀)\n其中：c-比热容，m-质量，t-末温，t₀-初温\n\n放热公式：\nQ放 = cm(t₀ - t)\n\n通用公式：\nQ = cmΔt（Δt = |t - t₀|）\n\n注意：\n- 计算时注意温度是\"升高\"还是\"升高到\"\n- 热平衡：Q吸 = Q放（无热量损失时）","semester":"upper"},{"id":"g3_physics_006","chapter":"第十三章 内能","name":"热传递与温度的关系","formula":"热传递条件：温度不同\n热传递方向：高温→低温\n热传递结果：温度相同（热平衡）","explanation":"热传递：\n- 定义：热量从高温物体传到低温物体的过程\n- 条件：物体间存在温度差\n- 方向：高温物体→低温物体\n- 结果：温度相同（达到热平衡）\n\n温度、热量、内能的区别：\n- 温度：状态量，表示物体冷热程度\n- 热量：过程量，热传递中内能变化的量度\n- 内能：状态量，物体内所有分子动能和势能的总和","semester":"upper"},{"id":"g3_physics_007","chapter":"第十三章 内能","name":"能量守恒定律","formula":"能量守恒：能量既不会凭空消灭，也不会凭空产生，只会从一种形式转化为其他形式，或者从一个物体转移到其他物体，而在转化和转移过程中，能量的总量保持不变","explanation":"能量守恒定律：\n- 能量不会凭空消灭，也不会凭空产生\n- 只会从一种形式转化为其他形式\n- 或者从一个物体转移到其他物体\n- 转化和转移过程中，能量总量保持不变\n\n能量转化：\n- 机械能→内能：摩擦生热\n- 内能→机械能：热机\n- 电能→内能：电热器\n- 机械能→电能：发电机\n\n永动机不可能实现，因为违背能量守恒定律。","semester":"upper"},{"id":"g3_physics_008","chapter":"第十三章 内能","name":"比热容实验探究","formula":"实验方法：控制变量法\nQ = cmΔt","explanation":"探究不同物质吸热能力的实验：\n\n实验器材：\n- 相同的加热器（保证相同时间放出相同热量）\n- 质量相同的不同液体\n- 温度计、秒表\n\n实验方法：\n- 控制变量法：控制质量、初温相同\n- 比较方法：\n  1. 相同加热时间，比较升高的温度（升温少的吸热能力强）\n  2. 升高相同温度，比较加热时间（加热时间长的吸热能力强）\n\n实验结论：\n- 不同物质吸热能力不同\n- 吸热能力强的物质，温度变化小，比热容大","semester":"upper"},{"id":"g3_physics_009","chapter":"第十四章 内能的利用","name":"热机","formula":"热机：把内能转化为机械能的机器\n四冲程：吸气、压缩、做功、排气","explanation":"热机：利用内能来做功的机器，把内能转化为机械能。\n\n种类：蒸汽机、内燃机、汽轮机、喷气发动机等\n\n内燃机：燃料在气缸内燃烧的热机\n- 汽油机：汽油为燃料\n- 柴油机：柴油为燃料\n\n四冲程汽油机工作循环：\n1. 吸气冲程：进气门开，排气门关，活塞向下，吸入汽油和空气混合物\n2. 压缩冲程：两门关，活塞向上，机械能→内能\n3. 做功冲程：两门关，火花塞点火，活塞向下，内能→机械能\n4. 排气冲程：排气门开，进气门关，活塞向上，排出废气\n\n一个工作循环：4个冲程，活塞往复2次，曲轴转2圈，做功1次","semester":"upper"},{"id":"g3_physics_010","chapter":"第十四章 内能的利用","name":"热值","formula":"q = Q放 / m\n单位：J/kg（固体液体）或J/m³（气体）","explanation":"热值：某种燃料完全燃烧放出的热量与其质量之比。\n\n符号：q\n单位：J/kg（固体、液体燃料），J/m³（气体燃料）\n\n公式：\n- Q放 = mq（固体、液体）\n- Q放 = qV（气体）\n\n特点：\n- 热值是燃料的一种特性\n- 只与燃料种类有关，与质量、燃烧是否充分无关\n\n常见热值：\n- 干木柴：约1.2×10⁷ J/kg\n- 烟煤：约2.9×10⁷ J/kg\n- 汽油：约4.6×10⁷ J/kg\n- 氢气：约1.4×10⁸ J/kg","semester":"upper"},{"id":"g3_physics_011","chapter":"第十四章 内能的利用","name":"热机效率","formula":"η = W有用 / Q放 × 100%\nη = W有用 / (qm) × 100%","explanation":"热机效率：用来做有用功的那部分能量，与燃料完全燃烧放出的能量之比。\n\n公式：\nη = W有用 / Q放 × 100% = W有用 / (qm) × 100%\n\n能量损失：\n- 燃料不完全燃烧损失\n- 废气带走大部分能量\n- 机械散热损失\n- 克服摩擦损失\n\n提高热机效率的方法：\n1. 让燃料尽可能充分燃烧\n2. 减少热量损失\n3. 减少机械摩擦\n4. 利用废气能量（如热电站）\n\n热机效率总是小于1。","semester":"upper"},{"id":"g3_physics_012","chapter":"第十四章 内能的利用","name":"能量的转化和转移","formula":"能量转化：一种形式 → 另一种形式\n能量转移：一个物体 → 另一个物体","explanation":"能量的转化：\n- 不同形式能量之间的转变\n- 例：机械能→内能（摩擦）、电能→光能（电灯）\n\n能量的转移：\n- 同种形式能量从一个物体转移到另一个物体\n- 例：热传递（内能转移）\n\n能量转化和转移的方向性：\n- 能量的转化和转移具有方向性\n- 有些能量可以利用，有些不能\n- 能源的利用是有条件的，也是有代价的","semester":"upper"},{"id":"g3_physics_013","chapter":"第十四章 内能的利用","name":"热机的工作原理","formula":"内能 → 机械能\n压缩冲程：机械能→内能\n做功冲程：内能→机械能","explanation":"热机工作原理：利用内能做功，将内能转化为机械能。\n\n汽油机与柴油机比较：\n- 相同点：四冲程工作循环，内能→机械能\n- 不同点：\n  汽油机：火花塞点火，吸入汽油和空气混合物，效率较低\n  柴油机：压燃式，吸入空气，效率较高\n\n能量转化：\n- 压缩冲程：活塞压缩气体做功，机械能→内能\n- 做功冲程：燃气推动活塞做功，内能→机械能\n\n注意：只有做功冲程对外做功，其他三个冲程靠飞轮惯性完成。","semester":"upper"},{"id":"g3_physics_014","chapter":"第十四章 内能的利用","name":"热量和效率的计算","formula":"Q放 = mq\nη = Q有用 / Q放 × 100%","explanation":"热机效率相关计算：\n\n1. 燃料完全燃烧放热：\nQ放 = mq 或 Q放 = qV\n\n2. 有用能量（有用功）：\nW有用 = η × Q放\n\n3. 热机效率：\nη = W有用 / Q放 × 100%\n\n4. 综合计算：\nQ吸 = η × Q放 = η × mq\ncmΔt = ηmq\n\n注意：\n- 效率总是小于1\n- 计算时注意单位统一\n- 区分\"完全燃烧\"和\"不完全燃烧\"","semester":"upper"},{"id":"g3_physics_015","chapter":"第十五章 电流和电路","name":"两种电荷","formula":"正电荷：丝绸摩擦过的玻璃棒\n负电荷：毛皮摩擦过的橡胶棒\n同种电荷相互排斥，异种电荷相互吸引","explanation":"电荷：\n- 正电荷：丝绸摩擦过的玻璃棒所带的电荷\n- 负电荷：毛皮摩擦过的橡胶棒所带的电荷\n\n电荷间相互作用：\n- 同种电荷相互排斥\n- 异种电荷相互吸引\n\n验电器：\n- 作用：检验物体是否带电\n- 原理：同种电荷相互排斥\n\n原子结构：\n- 原子由原子核和核外电子组成\n- 原子核带正电，电子带负电\n- 通常原子呈电中性（正、负电荷数量相等）\n\n摩擦起电：\n- 实质：电子的转移\n- 得到电子带负电，失去电子带正电","semester":"upper"},{"id":"g3_physics_016","chapter":"第十五章 电流和电路","name":"电流","formula":"I = Q / t\n单位：安培（A）\n1 A = 1 C/s","explanation":"电流：电荷的定向移动形成电流。\n\n电流方向：\n- 正电荷定向移动的方向\n- 与负电荷（电子）移动方向相反\n- 电路中：电源正极→用电器→负极\n\n形成电流的条件：\n1. 要有电源（有电压）\n2. 电路是通路\n\n电流单位：\n- 安培（A），简称安\n- 1 A = 1000 mA\n- 1 mA = 1000 μA\n\n电流的大小：\n- 等于单位时间内通过导体横截面的电荷量\n- I = Q/t，Q的单位是库仑（C）","semester":"upper"},{"id":"g3_physics_017","chapter":"第十五章 电流和电路","name":"电路的组成","formula":"电路 = 电源 + 用电器 + 开关 + 导线","explanation":"电路的组成：\n1. 电源：提供电能（如电池、发电机）\n2. 用电器：消耗电能（如灯泡、电铃）\n3. 开关：控制电路通断\n4. 导线：连接电路，输送电能\n\n电路的三种状态：\n1. 通路：处处连通的电路（用电器工作）\n2. 断路：某处断开的电路（用电器不工作）\n3. 短路：\n   - 电源短路：直接用导线连电源两极（危险，烧坏电源）\n   - 用电器短路：用导线连用电器两端（该用电器不工作）\n\n电路图：用元件符号表示电路连接的图。","semester":"upper"},{"id":"g3_physics_018","chapter":"第十五章 电流和电路","name":"串联和并联","formula":"串联：用电器依次相连\n并联：用电器两端分别相连","explanation":"串联电路：\n- 用电器依次连接，电流只有一条路径\n- 特点：\n  1. 电流只有一条路径\n  2. 各用电器互相影响\n  3. 一个开关控制整个电路\n\n并联电路：\n- 用电器两端分别连接，电流有多条路径\n- 特点：\n  1. 电流有两条或多条路径\n  2. 各支路用电器互不影响\n  3. 干路开关控制整个电路，支路开关控制本支路\n\n判断方法：\n- 电流法：看电流是否有分支\n- 断路法：拆除一个用电器，看其他是否工作","semester":"upper"},{"id":"g3_physics_019","chapter":"第十五章 电流和电路","name":"电流的测量","formula":"电流表：\n符号：A\n使用：串联在电路中","explanation":"电流表：测量电流大小的仪表。\n\n使用规则：\n1. 串联在被测电路中\n2. 电流从正接线柱进，负接线柱出\n3. 选择合适量程\n4. 不能直接接在电源两极（相当于短路）\n\n量程和分度值：\n- 0-0.6 A：分度值0.02 A\n- 0-3 A：分度值0.1 A\n\n读数方法：\n1. 看量程\n2. 看分度值\n3. 看指针位置（正对、靠近原则）","semester":"upper"},{"id":"g3_physics_020","chapter":"第十五章 电流和电路","name":"串联电路的电流规律","formula":"I = I₁ = I₂ = ... = In","explanation":"串联电路电流规律：\n串联电路中各处电流相等。\n\nI = I₁ = I₂ = ... = In\n\n实验验证：\n1. 将电流表分别接在串联电路不同位置\n2. 比较各点电流大小\n3. 换用不同灯泡重复实验，避免偶然性\n\n结论：串联电路中电流处处相等。\n\n注意：串联电路中，虽然电流相等，但各用电器两端电压不一定相等。","semester":"upper"},{"id":"g3_physics_021","chapter":"第十五章 电流和电路","name":"并联电路的电流规律","formula":"I = I₁ + I₂ + ... + In","explanation":"并联电路电流规律：\n并联电路中干路电流等于各支路电流之和。\n\nI = I₁ + I₂ + ... + In\n\n实验验证：\n1. 分别测干路和各支路电流\n2. 验证干路电流等于各支路电流之和\n3. 换用不同灯泡重复实验\n\n特点：\n- 干路电流 > 任一支路电流\n- 各支路电流可能相等，也可能不等\n  （取决于各支路用电器电阻）","semester":"upper"},{"id":"g3_physics_022","chapter":"第十五章 电流和电路","name":"导体和绝缘体","formula":"导体：容易导电的物体\n绝缘体：不容易导电的物体\n导电原因：自由电荷","explanation":"导体：容易导电的物体。\n- 常见：金属、人体、大地、石墨、酸碱盐溶液\n- 导电原因：有大量自由电荷（金属中是自由电子）\n\n绝缘体：不容易导电的物体。\n- 常见：橡胶、玻璃、陶瓷、塑料、油、空气\n- 绝缘原因：电荷几乎都被束缚，不能自由移动\n\n注意：\n- 导体和绝缘体没有绝对界限\n- 在一定条件下可以转化（如玻璃高温下导电）\n- 半导体：导电能力介于导体和绝缘体之间","semester":"upper"},{"id":"g3_physics_023","chapter":"第十六章 电压 电阻","name":"电压","formula":"U：电压，单位伏特（V）\n1 kV = 1000 V\n1 V = 1000 mV","explanation":"电压：使电路中形成电流的原因。\n\n电源的作用：给用电器两端提供电压。\n\n单位：\n- 伏特（V），简称伏\n- 千伏（kV）、毫伏（mV）\n- 1 kV = 1000 V，1 V = 1000 mV\n\n常见电压值：\n- 一节干电池：1.5 V\n- 一节铅蓄电池：2 V\n- 家庭电路：220 V\n- 人体安全电压：不高于36 V","semester":"upper"},{"id":"g3_physics_024","chapter":"第十六章 电压 电阻","name":"电压的测量","formula":"电压表：\n符号：V\n使用：并联在被测电路两端","explanation":"电压表：测量电压大小的仪表。\n\n使用规则：\n1. 并联在被测电路两端\n2. 电流从正接线柱进，负接线柱出\n3. 选择合适量程\n4. 可以直接接在电源两端（测电源电压）\n\n量程和分度值：\n- 0-3 V：分度值0.1 V\n- 0-15 V：分度值0.5 V\n\n电流表和电压表比较：\n- 电流表：串联，不能直接接电源\n- 电压表：并联，可以直接接电源","semester":"upper"},{"id":"g3_physics_025","chapter":"第十六章 电压 电阻","name":"串并联电路电压规律","formula":"串联：U = U₁ + U₂ + ... + Un\n并联：U = U₁ = U₂ = ... = Un","explanation":"串联电路电压规律：\n串联电路总电压等于各部分电路电压之和。\nU = U₁ + U₂ + ... + Un\n\n并联电路电压规律：\n并联电路各支路两端电压相等，且等于电源电压。\nU = U₁ = U₂ = ... = Un\n\n对比记忆：\n- 串联：电流相等，电压相加\n- 并联：电压相等，电流相加\n\n注意：串联电路中，电压与电阻成正比（U₁/U₂ = R₁/R₂）。","semester":"upper"},{"id":"g3_physics_026","chapter":"第十六章 电压 电阻","name":"电阻","formula":"R = U / I\n单位：欧姆（Ω）\n1 kΩ = 1000 Ω\n1 MΩ = 10⁶ Ω","explanation":"电阻：表示导体对电流阻碍作用的大小。\n\n符号：R\n单位：欧姆（Ω），简称欧\n- 千欧（kΩ）、兆欧（MΩ）\n- 1 kΩ = 1000 Ω，1 MΩ = 10⁶ Ω\n\n电阻是导体本身的一种性质：\n- 与电压、电流无关\n- 决定因素：材料、长度、横截面积、温度\n\n电阻定律（定性）：\n- 材料相同，长度越长，电阻越大\n- 材料相同，横截面积越小，电阻越大\n- 大多数金属，温度越高，电阻越大","semester":"upper"},{"id":"g3_physics_027","chapter":"第十六章 电压 电阻","name":"影响电阻大小的因素","formula":"决定因素：材料、长度、横截面积、温度\nR = ρL/S（电阻定律）","explanation":"影响电阻大小的因素：\n\n1. 材料：不同材料导电能力不同\n2. 长度：材料、横截面积相同时，长度越长，电阻越大\n3. 横截面积：材料、长度相同时，横截面积越小，电阻越大\n4. 温度：\n   - 金属导体：温度升高，电阻增大\n   - 半导体：温度升高，电阻减小\n   - 超导体：温度降到足够低，电阻为0\n\n实验方法：控制变量法\n- 探究电阻与长度关系：控制材料、横截面积相同\n- 探究电阻与横截面积关系：控制材料、长度相同\n- 探究电阻与材料关系：控制长度、横截面积相同","semester":"upper"},{"id":"g3_physics_028","chapter":"第十六章 电压 电阻","name":"变阻器","formula":"滑动变阻器：通过改变电阻线长度改变电阻\n接法：一上一下","explanation":"滑动变阻器：\n- 原理：通过改变接入电路中电阻线的长度来改变电阻\n- 作用：改变电流、调节电压、保护电路\n- 接法：\"一上一下\"\n- 标有\"50 Ω 2 A\"：最大阻值50 Ω，允许通过最大电流2 A\n\n使用注意：\n1. 串联在电路中\n2. 闭合开关前，滑片移到最大阻值处\n3. 不能超过允许通过的最大电流\n\n电阻箱：\n- 可以读出具体阻值的变阻器\n- 读数：各旋盘示数×倍数相加","semester":"upper"},{"id":"g3_physics_029","chapter":"第十六章 电压 电阻","name":"半导体和超导体","formula":"半导体：导电能力介于导体和绝缘体之间\n超导体：温度降到足够低时电阻为0","explanation":"半导体：\n- 导电能力介于导体和绝缘体之间\n- 常见材料：硅、锗\n- 特性：\n  1. 压敏性：压力变化，电阻变化\n  2. 热敏性：温度变化，电阻变化\n  3. 光敏性：光照变化，电阻变化\n- 应用：二极管、三极管、集成电路\n\n超导体：\n- 某些物质在很低温度时，电阻变为0\n- 超导现象：电阻为零的现象\n- 应用：\n  1. 远距离输电（减少电能损失）\n  2. 制造磁悬浮列车\n  3. 制造电子元件","semester":"upper"},{"id":"g3_physics_030","chapter":"第十六章 电压 电阻","name":"电路故障分析","formula":"断路：电路断开，电流为0\n短路：电流不经过用电器","explanation":"常见电路故障：\n\n1. 断路（开路）：\n- 原因：导线断了、用电器坏了、接触不良\n- 现象：用电器不工作，电流表示数为0\n- 检测：电压表逐段检测，有示数处可能断路\n\n2. 短路：\n- 电源短路：直接连电源两极，电流过大，危险\n- 用电器短路：用电器两端被导线连接，该用电器不工作\n- 现象：被短路的用电器不工作，电路中电流变大\n\n故障分析方法：\n- 电流表无示数→可能断路\n- 电压表有示数且接近电源电压→可能与电压表并联的部分断路\n- 电压表示数为0→可能与电压表并联的部分短路","semester":"upper"},{"id":"g3_physics_031","chapter":"第十七章 欧姆定律","name":"电流与电压和电阻的关系","formula":"电阻一定时，电流与电压成正比\n电压一定时，电流与电阻成反比","explanation":"探究电流与电压的关系：\n- 方法：控制变量法（控制电阻不变）\n- 器材：电源、开关、电流表、电压表、滑动变阻器、定值电阻\n- 结论：电阻一定时，导体中的电流与导体两端电压成正比\n\n探究电流与电阻的关系：\n- 方法：控制变量法（控制电压不变）\n- 器材：同上，换不同阻值电阻\n- 结论：电压一定时，导体中的电流与导体的电阻成反比\n\n注意：\n- 滑动变阻器的作用：\n  实验1：改变电阻两端电压，多次测量找规律\n  实验2：保持电阻两端电压不变","semester":"lower"},{"id":"g3_physics_032","chapter":"第十七章 欧姆定律","name":"欧姆定律及其应用","formula":"I = U / R\n变形公式：U = IR，R = U/I","explanation":"欧姆定律：导体中的电流，跟导体两端的电压成正比，跟导体的电阻成反比。\n\n公式：I = U / R\n\n单位：\n- I：安培（A）\n- U：伏特（V）\n- R：欧姆（Ω）\n\n变形公式：\n- U = IR（求电压）\n- R = U/I（求电阻）\n\n注意事项：\n1. I、U、R必须对应同一段电路、同一时刻\n2. R = U/I 是计算式，不是决定式（电阻由材料、长度等决定）\n3. 单位要统一为国际单位","semester":"lower"},{"id":"g3_physics_033","chapter":"第十七章 欧姆定律","name":"伏安法测电阻","formula":"R = U / I\n实验原理：欧姆定律","explanation":"伏安法测电阻：\n\n原理：R = U/I（欧姆定律变形）\n\n器材：电源、开关、电流表、电压表、滑动变阻器、待测电阻、导线\n\n电路图：待测电阻与滑动变阻器串联，电压表测待测电阻电压，电流表测电流\n\n步骤：\n1. 按电路图连接电路\n2. 闭合开关，移动滑片，记录几组U、I值\n3. 分别计算各组电阻值，求平均值\n\n滑动变阻器的作用：\n1. 保护电路\n2. 改变待测电阻两端电压和电流，多次测量减小误差\n\n注意：连接电路时开关断开，滑片在最大阻值处。","semester":"lower"},{"id":"g3_physics_034","chapter":"第十七章 欧姆定律","name":"串并联电路电阻规律","formula":"串联：R = R₁ + R₂ + ... + Rn\n并联：1/R = 1/R₁ + 1/R₂ + ... + 1/Rn","explanation":"串联电路电阻规律：\n串联电路总电阻等于各串联电阻之和。\nR = R₁ + R₂ + ... + Rn\n- n个相同电阻R₀串联：R = nR₀\n- 串联后总电阻比任何一个分电阻都大（相当于增加长度）\n\n并联电路电阻规律：\n并联电路总电阻的倒数等于各并联电阻倒数之和。\n1/R = 1/R₁ + 1/R₂ + ... + 1/Rn\n- 两个电阻并联：R = R₁R₂/(R₁+R₂)\n- n个相同电阻R₀并联：R = R₀/n\n- 并联后总电阻比任何一个分电阻都小（相当于增加横截面积）","semester":"lower"},{"id":"g3_physics_035","chapter":"第十七章 欧姆定律","name":"串联分压","formula":"U₁/U₂ = R₁/R₂（串联分压与电阻成正比）","explanation":"串联电路分压特点：\n\n串联电路中电压与电阻成正比。\nU₁/U₂ = R₁/R₂\n\n推导：\n∵ I = U₁/R₁ = U₂/R₂（串联电流相等）\n∴ U₁/U₂ = R₁/R₂\n\n应用：\n- 电阻大的用电器分得电压多\n- 串联电阻可以分压（如限流、降压）\n- 滑动变阻器就是利用串联分压原理调节电压的","semester":"lower"},{"id":"g3_physics_036","chapter":"第十七章 欧姆定律","name":"并联分流","formula":"I₁/I₂ = R₂/R₁（并联分流与电阻成反比）","explanation":"并联电路分流特点：\n\n并联电路中电流与电阻成反比。\nI₁/I₂ = R₂/R₁\n\n推导：\n∵ U = I₁R₁ = I₂R₂（并联电压相等）\n∴ I₁/I₂ = R₂/R₁\n\n应用：\n- 电阻大的支路电流小\n- 电阻小的支路电流大\n- 并联电阻可以分流\n\n对比记忆：\n- 串联：电压与电阻成正比（分压）\n- 并联：电流与电阻成反比（分流）","semester":"lower"},{"id":"g3_physics_037","chapter":"第十七章 欧姆定律","name":"动态电路分析","formula":"分析步骤：\n1. 确定电路连接方式\n2. 判断滑片移动方向\n3. 分析电阻变化\n4. 用欧姆定律分析电流电压变化","explanation":"动态电路分析步骤：\n\n1. 分析电路：判断串联还是并联，明确各电表测谁\n2. 分析电阻变化：滑片移动→电阻变化\n3. 分析总电流变化：由I=U/R总判断\n4. 分析各部分电压电流变化\n\n常见类型：\n1. 串联电路+滑动变阻器\n   - 滑片移动→R变→I变→各用电器U变\n2. 并联电路+滑动变阻器\n   - 各支路独立，支路电压不变\n   - 支路电阻变→支路电流变→干路电流变\n\n解题技巧：\n- 先总后分：先看总电阻、总电流变化\n- 抓住不变量：电源电压不变，定值电阻阻值不变","semester":"lower"},{"id":"g3_physics_038","chapter":"第十七章 欧姆定律","name":"欧姆定律综合计算","formula":"I = U/R\n串联：I同，U相加，R相加\n并联：U同，I相加，1/R相加","explanation":"欧姆定律综合计算步骤：\n\n1. 审清题意，画出电路图\n2. 分析电路连接方式（串联/并联）\n3. 明确已知量和未知量\n4. 选择合适的公式列方程\n5. 求解并检验\n\n常用公式：\n- 欧姆定律：I = U/R，U = IR，R = U/I\n- 串联：I=I₁=I₂，U=U₁+U₂，R=R₁+R₂\n- 并联：U=U₁=U₂，I=I₁+I₂，1/R=1/R₁+1/R₂\n\n注意：\n- 统一单位\n- 各物理量对应同一导体、同一时刻\n- 多个状态分别分析","semester":"lower"},{"id":"g3_physics_039","chapter":"第十八章 电功率","name":"电功","formula":"W = UIt = Pt\n单位：焦耳（J）、千瓦时（kW·h）\n1 kW·h = 3.6×10⁶ J","explanation":"电功：电流所做的功。\n\n电流做功的实质：电能转化为其他形式的能。\n\n单位：\n- 焦耳（J），简称焦\n- 千瓦时（kW·h），俗称度\n- 1 kW·h = 3.6×10⁶ J\n\n公式：\n- W = UIt（普遍适用）\n- W = Pt（普遍适用）\n- W = I²Rt（纯电阻）\n- W = U²t/R（纯电阻）\n\n测量：电能表（电度表）\n- 计量用电器消耗电能多少的仪表","semester":"lower"},{"id":"g3_physics_040","chapter":"第十八章 电功率","name":"电功率","formula":"P = W/t = UI\n单位：瓦特（W）\n1 kW = 1000 W","explanation":"电功率：表示电流做功快慢的物理量。\n\n定义：单位时间内电流所做的功。\n\n公式：\n- P = W/t（定义式，普遍适用）\n- P = UI（普遍适用）\n- P = I²R（纯电阻）\n- P = U²/R（纯电阻）\n\n单位：\n- 瓦特（W），简称瓦\n- 千瓦（kW），1 kW = 1000 W\n\n额定电压和额定功率：\n- 额定电压：用电器正常工作时的电压\n- 额定功率：用电器在额定电压下的功率\n- 灯泡的亮度取决于实际功率","semester":"lower"},{"id":"g3_physics_041","chapter":"第十八章 电功率","name":"测量小灯泡的电功率","formula":"P = UI\n实验原理：P = UI","explanation":"测量小灯泡的电功率：\n\n实验原理：P = UI\n\n实验器材：电源、开关、电流表、电压表、滑动变阻器、小灯泡、导线\n\n实验步骤：\n1. 设计电路图，连接电路\n2. 调节滑动变阻器，使灯泡电压等于额定电压，记录电流\n3. 调节滑片，使电压约为额定电压的1.2倍，记录\n4. 调节滑片，使电压低于额定电压，记录\n5. 分别计算各次电功率\n\n滑动变阻器的作用：\n1. 保护电路\n2. 改变小灯泡两端电压，测量不同电压下的功率\n\n注意：\n- 不同电压下，小灯泡功率不同\n- 不能求平均功率（因为功率随电压变化）","semester":"lower"},{"id":"g3_physics_042","chapter":"第十八章 电功率","name":"额定功率和实际功率","formula":"U实 = U额 → P实 = P额（正常工作）\nU实 < U额 → P实 < P额\nU实 > U额 → P实 > P额","explanation":"额定功率：用电器在额定电压下的功率。\n\n实际功率：用电器在实际电压下的功率。\n\n关系：\n- U实 = U额 → P实 = P额（正常发光）\n- U实 < U额 → P实 < P额（发光较暗）\n- U实 > U额 → P实 > P额（发光较亮，可能烧坏）\n\n对于同一用电器：\nP实/P额 = (U实/U额)²\n（电阻不变时，功率与电压平方成正比）\n\n注意：\n- 用电器的额定电压和额定功率只有一个\n- 实际功率可以有很多个，取决于实际电压","semester":"lower"},{"id":"g3_physics_043","chapter":"第十八章 电功率","name":"焦耳定律","formula":"Q = I²Rt\n单位：焦耳（J）","explanation":"焦耳定律：电流通过导体产生的热量，跟电流的二次方成正比，跟导体的电阻成正比，跟通电时间成正比。\n\n公式：Q = I²Rt\n\n单位：焦耳（J）\n\n推导（纯电阻电路）：\nQ = W = UIt = I²Rt = U²t/R\n\n电热的利用和防止：\n- 利用：电热水器、电饭锅、电熨斗、电烙铁\n- 防止：散热窗、散热片、风扇\n\n注意：\n- Q = I²Rt 是普遍适用公式\n- Q = W = UIt 只适用于纯电阻电路（电能全部转化为内能）","semester":"lower"},{"id":"g3_physics_044","chapter":"第十八章 电功率","name":"电功率计算综合","formula":"P = UI = I²R = U²/R\nW = Pt = UIt\nQ = I²Rt（纯电阻Q=W）","explanation":"电功率综合计算：\n\n1. 串联电路：\n- 电流相等：I = I₁ = I₂\n- 电压分配：U₁/U₂ = R₁/R₂\n- 功率分配：P₁/P₂ = R₁/R₂（功率与电阻成正比）\n\n2. 并联电路：\n- 电压相等：U = U₁ = U₂\n- 电流分配：I₁/I₂ = R₂/R₁\n- 功率分配：P₁/P₂ = R₂/R₁（功率与电阻成反比）\n\n3. 电功和电热：\n- 纯电阻：W = Q，全部转化为内能\n- 非纯电阻：W > Q，如电动机（电能→机械能+内能）\n\n解题技巧：\n- 选对公式（已知量多的）\n- 抓住不变量（电源电压、定值电阻）","semester":"lower"},{"id":"g3_physics_045","chapter":"第十八章 电功率","name":"家庭电路与安全用电","formula":"家庭电路电压：220 V\n火线和零线\n保险丝作用：电流过大时自动熔断","explanation":"家庭电路组成：\n- 进户线：火线和零线（220 V）\n- 电能表：计量消耗电能\n- 总开关：控制整个电路\n- 保险丝：电流过大时熔断，保护电路\n- 用电器和插座：并联连接\n\n火线和零线：\n- 火线：带电（220 V）\n- 零线：不带电（与大地相连）\n- 测电笔：辨别火线和零线\n\n安全用电：\n- 不接触低压带电体，不靠近高压带电体\n- 有金属外壳的用电器要接地\n- 保险丝不能用铜丝代替\n- 触电急救：先切断电源，再施救\n\n注意：家庭电路中电流过大的原因：\n1. 发生短路\n2. 用电器总功率过大","semester":"lower"},{"id":"g3_physics_046","chapter":"第十九章 生活用电","name":"家庭电路的组成","formula":"火线（220 V）+ 零线（0 V）\n用电器并联\n开关接火线","explanation":"家庭电路的组成：\n\n1. 进户线：\n- 火线：220 V，带电\n- 零线：0 V，不带电\n- 地线：保护接地\n\n2. 电能表：测消耗电能，接在干路最前端\n\n3. 总开关：控制整个家庭电路\n\n4. 保险丝（空气开关）：\n- 串联在火线上\n- 电流过大时自动熔断\n- 原理：电流热效应\n\n5. 插座和用电器：并联连接\n- 两孔插座：左零右火\n- 三孔插座：左零右火上接地\n\n6. 灯泡和开关：\n- 开关接在火线上\n- 灯泡顶端接火线，侧面接零线","semester":"lower"},{"id":"g3_physics_047","chapter":"第十九章 生活用电","name":"家庭电路电流过大的原因","formula":"原因一：短路\n原因二：用电器总功率过大\nI = P总 / U","explanation":"家庭电路电流过大的原因：\n\n1. 短路：\n- 火线和零线直接相连\n- 电流不经过用电器，电阻很小\n- 电流很大，可能引起火灾\n\n2. 用电器总功率过大：\n- 同时使用多个大功率用电器\n- I = P总 / U\n- 总功率越大，电流越大\n\n保险丝的选择：\n- 额定电流等于或稍大于正常工作电流\n- 不能用铜丝、铁丝代替（熔点高，起不到保护作用）\n\n空气开关：利用电流磁效应，电流过大时自动跳闸。","semester":"lower"},{"id":"g3_physics_048","chapter":"第十九章 生活用电","name":"安全用电","formula":"安全电压：不高于36 V\n触电：一定强度的电流通过人体","explanation":"安全用电原则：\n\n1. 不接触低压带电体，不靠近高压带电体\n2. 更换灯泡、搬动电器前应断开电源开关\n3. 不弄湿用电器，不损坏绝缘层\n4. 保险装置、插座、导线等达到使用寿命及时更换\n\n触电类型：\n- 单线触电：站在地上接触火线\n- 双线触电：同时接触火线和零线\n\n触电急救：\n- 立即切断电源\n- 用干燥的木棒等绝缘体将电线挑开\n- 必要时进行人工呼吸和胸外按压\n\n注意：\n- 打雷时不要在树下避雨\n- 不用湿手触摸电器\n- 有金属外壳的用电器要用三脚插头","semester":"lower"},{"id":"g3_physics_049","chapter":"第二十章 电与磁","name":"磁现象 磁场","formula":"磁极：N极、S极\n同名磁极相斥，异名磁极相吸\n磁场：磁体周围存在的一种物质","explanation":"磁体：具有磁性的物体。\n\n磁极：磁体上磁性最强的部分。\n- N极（北极）：自由转动时指北\n- S极（南极）：自由转动时指南\n\n磁极间相互作用：\n- 同名磁极相互排斥\n- 异名磁极相互吸引\n\n磁化：一些物体在磁体或电流作用下获得磁性的现象。\n\n磁场：\n- 磁体周围存在的一种看不见、摸不着的物质\n- 基本性质：对放入其中的磁体产生磁力作用\n- 方向：小磁针N极所指的方向\n\n磁感线：\n- 描述磁场的假想曲线\n- 在磁体外部，磁感线从N极出发回到S极\n- 磁感线越密，磁场越强\n\n地磁场：地球周围存在磁场，地磁N极在地理南极附近。","semester":"lower"},{"id":"g3_physics_050","chapter":"第二十章 电与磁","name":"电生磁（电流的磁效应）","formula":"奥斯特实验：电流周围存在磁场\n安培定则：右手螺旋定则","explanation":"电流的磁效应：\n- 奥斯特实验：通电导线周围有磁场（电生磁）\n- 电流的磁场方向与电流方向有关\n\n安培定则（右手螺旋定则）：\n- 对于直导线：右手握住导线，大拇指指向电流方向，四指环绕方向就是磁场方向\n- 对于螺线管：右手握住螺线管，四指指向电流方向，大拇指所指的那端就是N极\n\n通电螺线管：\n- 外部磁场与条形磁体相似\n- 两端相当于两个磁极\n- 极性与电流方向有关（用安培定则判断）\n\n电磁铁：\n- 构成：螺线管+铁芯\n- 特点：磁性有无可以由通断电控制\n- 磁性强弱与电流大小、线圈匝数有关","semester":"lower"},{"id":"g3_physics_051","chapter":"第二十章 电与磁","name":"电磁铁 电磁继电器","formula":"电磁铁磁性强弱：与电流大小、线圈匝数有关\n电磁继电器：利用电磁铁控制工作电路","explanation":"电磁铁：\n- 定义：内部插入铁芯的螺线管\n- 原理：电流的磁效应\n- 磁性强弱影响因素：\n  1. 电流越大，磁性越强\n  2. 线圈匝数越多，磁性越强\n  3. 有铁芯比无铁芯磁性强\n- 优点：\n  1. 磁性有无可由通断电控制\n  2. 磁性强弱可由电流大小控制\n  3. 磁极方向可由电流方向控制\n\n电磁继电器：\n- 利用电磁铁控制工作电路的开关\n- 组成：电磁铁、衔铁、弹簧、触点\n- 作用：用低电压弱电流控制高电压强电流\n- 应用：自动控制、远距离操纵、安全报警","semester":"lower"},{"id":"g3_physics_052","chapter":"第二十章 电与磁","name":"电动机","formula":"原理：通电线圈在磁场中受力转动\n能量转化：电能→机械能","explanation":"电动机：\n\n工作原理：通电线圈在磁场中受力转动。\n\n能量转化：电能 → 机械能\n\n受力方向：\n- 与电流方向有关\n- 与磁场方向有关\n- 只改变一个方向，受力方向改变\n- 同时改变两个方向，受力方向不变\n\n直流电动机的组成：\n- 定子（磁体）\n- 转子（线圈）\n- 换向器：\n  - 作用：每当线圈转过平衡位置时自动改变线圈中的电流方向\n  - 使线圈能持续转动\n\n应用：电风扇、洗衣机、电动车等。","semester":"lower"},{"id":"g3_physics_053","chapter":"第二十章 电与磁","name":"磁生电（电磁感应）","formula":"电磁感应：闭合电路的一部分导体在磁场中做切割磁感线运动时，导体中产生感应电流\n发电机原理：电磁感应","explanation":"电磁感应现象：\n- 法拉第发现\n- 闭合电路的一部分导体在磁场中做切割磁感线运动时，导体中产生感应电流\n\n感应电流方向：\n- 与导体运动方向有关\n- 与磁场方向有关\n\n感应电流产生条件：\n1. 电路闭合\n2. 一部分导体在磁场中\n3. 做切割磁感线运动\n\n发电机：\n- 原理：电磁感应现象\n- 能量转化：机械能 → 电能\n- 结构：定子和转子\n- 交流电：大小和方向周期性变化的电流\n- 我国交流电：频率50 Hz，周期0.02 s\n\n电动机 vs 发电机：\n- 电动机：通电→转动（电能→机械能）\n- 发电机：运动→发电（机械能→电能）","semester":"lower"},{"id":"g3_physics_054","chapter":"第二十章 电与磁","name":"磁场对电流的作用","formula":"通电导体在磁场中受到力的作用\n受力方向与电流方向、磁场方向都有关","explanation":"磁场对通电导线的作用：\n\n通电导线在磁场中受到力的作用。\n\n受力方向：\n- 与电流方向有关\n- 与磁场方向有关\n- 只改变其中一个，受力方向改变\n- 同时改变两个，受力方向不变\n\n受力大小：\n- 电流越大，受力越大\n- 磁场越强，受力越大\n\n能量转化：电能 → 机械能\n\n应用：\n- 电动机：通电线圈在磁场中受力转动\n- 电流表（磁电式）：利用通电线圈在磁场中受力偏转\n\n注意：\n- 导线平行于磁场方向放置时，不受力\n- 导线垂直于磁场方向放置时，受力最大","semester":"lower"}];

        // ==================== 内嵌例题数据 ====================
        const DATA_EXAMPLES = [{"id":"g3_physics_001_ex01","knowledge_id":"g3_physics_001","question":"选择题：下列现象中，能说明分子在不停地做无规则运动的是\nA. 雪花飞舞\nB. 尘土飞扬\nC. 桂花飘香\nD. 树叶飘落","answer":"答案：C\n解析：桂花飘香是扩散现象，花香分子在空气中做无规则运动进入人的鼻子。雪花、尘土、树叶都是宏观物体的运动，不是分子运动。"},{"id":"g3_physics_001_ex02","knowledge_id":"g3_physics_001","question":"填空题：分子动理论的基本内容：物质是由______构成的；一切物质的分子都在不停地做______运动；分子间存在相互作用的______和______。","answer":"答案：分子、原子，无规则，引力，斥力\n解析：分子动理论三点：物质由分子原子构成；分子永不停息做无规则运动；分子间有引力和斥力。"},{"id":"g3_physics_001_ex03","knowledge_id":"g3_physics_001","question":"选择题：关于扩散现象，下列说法正确的是\nA. 只有气体之间才能发生扩散\nB. 只有液体之间才能发生扩散\nC. 只有固体之间才能发生扩散\nD. 气体、液体、固体之间都能发生扩散","answer":"答案：D\n解析：扩散现象发生在一切物体之间，气体、液体、固体都能发生扩散。气体扩散最快，液体次之，固体最慢。"},{"id":"g3_physics_001_ex04","knowledge_id":"g3_physics_001","question":"判断题：温度越高，分子热运动越剧烈，扩散越快。（  ）","answer":"答案：正确\n解析：温度是分子热运动剧烈程度的标志。温度越高，分子无规则运动越剧烈，扩散速度越快。"},{"id":"g3_physics_001_ex05","knowledge_id":"g3_physics_001","question":"填空题：不同的物质在相互接触时彼此进入对方的现象，叫做______现象。","answer":"答案：扩散\n解析：扩散现象是分子无规则运动的宏观表现，说明分子在不停地运动，也说明分子间有间隙。"},{"id":"g3_physics_001_ex06","knowledge_id":"g3_physics_001","question":"选择题：下列事例中，不能说明分子间有间隙的是\nA. 酒精和水混合后总体积变小\nB. 气体容易被压缩\nC. 海绵能吸水\nD. 物体受热后体积膨胀","answer":"答案：C\n解析：海绵能吸水是因为海绵结构中有空隙（宏观的），不是分子间隙。酒精水混合体积变小、气体可压缩、热胀冷缩都能说明分子间有间隙。"},{"id":"g3_physics_001_ex07","knowledge_id":"g3_physics_001","question":"解答题：把磨得很光滑的铅片和金片压在一起，在室温下放置几年后，会发现铅中有金、金中有铅。这是什么现象？说明了什么？","answer":"答案：扩散现象，说明分子在不停地做无规则运动，分子间有间隙\n解析：这是扩散现象。\n铅和金的分子都在不停地做无规则运动，彼此进入对方，所以几年后铅中有金、金中有铅。\n\n扩散现象说明：\n1. 一切物质的分子都在不停地做无规则运动\n2. 分子之间有间隙"},{"id":"g3_physics_001_ex08","knowledge_id":"g3_physics_001","question":"选择题：分子间作用力的特点是\nA. 只有引力\nB. 只有斥力\nC. 既有引力又有斥力\nD. 没有作用力","answer":"答案：C\n解析：分子间同时存在引力和斥力，它们都随分子距离增大而减小，但斥力减小得更快。距离很小时斥力大于引力，距离较大时引力大于斥力。"},{"id":"g3_physics_001_ex09","knowledge_id":"g3_physics_001","question":"填空题：两滴水银靠近时能自动结合成一滴较大的水银，这说明分子间存在______；固体和液体很难被压缩，说明分子间存在______。","answer":"答案：引力，斥力\n解析：水银自动结合是因为分子间有引力。固体液体难压缩是因为分子间有斥力，分子距离减小时斥力大于引力。"},{"id":"g3_physics_001_ex10","knowledge_id":"g3_physics_001","question":"判断题：扩散现象只能发生在同种物质之间。（  ）","answer":"答案：错误\n解析：扩散现象是不同物质相互接触时彼此进入对方的现象，发生在不同物质之间。同种物质之间不叫扩散。"},{"id":"g3_physics_002_ex01","knowledge_id":"g3_physics_002","question":"选择题：关于内能，下列说法正确的是\nA. 0°C的冰没有内能\nB. 只有高温物体才有内能\nC. 一切物体都具有内能\nD. 内能就是机械能","answer":"答案：C\n解析：一切物体的分子都在不停地做无规则运动，所以一切物体都具有内能。0°C的冰分子也在运动，也有内能。内能和机械能是不同形式的能。"},{"id":"g3_physics_002_ex02","knowledge_id":"g3_physics_002","question":"填空题：物体的内能是物体内部所有分子做无规则运动的______和______的总和。","answer":"答案：动能，分子势能\n解析：内能 = 分子动能 + 分子势能。分子动能与温度有关，分子势能与分子间距离有关。"},{"id":"g3_physics_002_ex03","knowledge_id":"g3_physics_002","question":"选择题：同一物体，内能增大的原因是\nA. 一定是吸收了热量\nB. 一定是外界对物体做了功\nC. 可能是吸收热量，也可能是外界做功\nD. 既不吸热也不做功","answer":"答案：C\n解析：改变内能有两种方式：做功和热传递。两种方式在改变内能上是等效的。内能增大可能是吸热，也可能是外界对物体做功。"},{"id":"g3_physics_002_ex04","knowledge_id":"g3_physics_002","question":"判断题：温度高的物体内能一定比温度低的物体内能大。（  ）","answer":"答案：错误\n解析：内能不仅与温度有关，还与质量、体积、状态等因素有关。温度高的小物体内能可能比温度低的大物体内能小。必须考虑质量等因素。"},{"id":"g3_physics_002_ex05","knowledge_id":"g3_physics_002","question":"填空题：改变物体内能的两种方式是______和______，这两种方式在改变物体内能上是______的。","answer":"答案：做功，热传递，等效\n解析：做功和热传递都能改变物体内能，效果相同，是等效的。做功是内能与其他形式能的转化，热传递是内能的转移。"},{"id":"g3_physics_002_ex06","knowledge_id":"g3_physics_002","question":"选择题：下列现象中，通过做功改变物体内能的是\nA. 晒太阳取暖\nB. 用热水袋取暖\nC. 搓手取暖\nD. 哈气取暖","answer":"答案：C\n解析：搓手取暖是克服摩擦力做功，机械能转化为内能，使手的内能增加。其他都是通过热传递改变内能。"},{"id":"g3_physics_002_ex07","knowledge_id":"g3_physics_002","question":"解答题：为什么说\"一切物体都具有内能\"？请从分子动理论的角度解释。","answer":"答案：因为一切物体的分子都在永不停息地做无规则运动，分子间有相互作用力，所以一切物体都有内能\n解析：内能是物体内部所有分子动能和分子势能的总和。\n从分子动理论来看：\n1. 一切物质的分子都在不停地做无规则运动，所以分子具有动能\n2. 分子间有相互作用的引力和斥力，所以分子具有势能\n因此，一切物体不论温度高低、是否运动，都具有内能。"},{"id":"g3_physics_002_ex08","knowledge_id":"g3_physics_002","question":"选择题：关于内能和机械能，下列说法正确的是\nA. 内能就是机械能\nB. 物体速度越大，内能越大\nC. 内能与物体内部分子运动有关，机械能与整体运动有关\nD. 温度高的物体机械能一定大","answer":"答案：C\n解析：内能是物体内部分子无规则运动的动能和分子势能的总和，与微观运动有关。机械能是物体整体运动的动能和势能，与宏观运动有关。两者是不同形式的能。"},{"id":"g3_physics_002_ex09","knowledge_id":"g3_physics_002","question":"填空题：0°C的冰______内能（选填\"有\"或\"没有\"），因为构成冰的水分子仍在做______运动。","answer":"答案：有，无规则\n解析：一切物体都具有内能，0°C的冰也不例外。虽然温度低，但水分子仍然在做无规则运动，只是运动剧烈程度较低。"},{"id":"g3_physics_002_ex10","knowledge_id":"g3_physics_002","question":"判断题：物体温度升高，内能一定增加。（  ）","answer":"答案：正确\n解析：对于同一物体，温度升高意味着分子运动更剧烈，分子动能增大，所以内能增加。注意前提是\"同一物体\"，质量不变。"},{"id":"g3_physics_003_ex01","knowledge_id":"g3_physics_003","question":"选择题：下列事例中，属于热传递改变内能的是\nA. 钻木取火\nB. 搓手取暖\nC. 晒太阳变暖\nD. 压缩气体温度升高","answer":"答案：C\n解析：晒太阳是通过热传递（热辐射）的方式使人体内能增加。钻木、搓手、压缩气体都是通过做功改变内能。"},{"id":"g3_physics_003_ex02","knowledge_id":"g3_physics_003","question":"填空题：热传递发生的条件是物体间存在______，热传递的方向是从______物体传到______物体。","answer":"答案：温度差，高温，低温\n解析：热传递的条件：温度差。方向：高温→低温。结果：温度相同（热平衡）。"},{"id":"g3_physics_003_ex03","knowledge_id":"g3_physics_003","question":"选择题：对物体做功，物体内能的变化是\nA. 一定增大\nB. 一定减小\nC. 一定不变\nD. 通常增大","answer":"答案：D\n解析：对物体做功，其他形式的能转化为内能，物体内能通常增大。如压缩气体、克服摩擦做功等都使内能增大。"},{"id":"g3_physics_003_ex04","knowledge_id":"g3_physics_003","question":"判断题：热传递过程中，高温物体把温度传给低温物体。（  ）","answer":"答案：错误\n解析：热传递传递的是内能（热量），不是温度。温度是状态量，不能传递。高温物体内能减少，低温物体内能增加。"},{"id":"g3_physics_003_ex05","knowledge_id":"g3_physics_003","question":"填空题：在热传递过程中，传递内能的多少叫做______，单位是______。","answer":"答案：热量，焦耳（J）\n解析：热量是热传递过程中内能变化的量度，是过程量。单位是焦耳（J）。只能说\"吸收或放出多少热量\"，不能说\"含有多少热量\"。"},{"id":"g3_physics_003_ex06","knowledge_id":"g3_physics_003","question":"选择题：气体膨胀对外做功时，气体内能的变化是\nA. 增大\nB. 减小\nC. 不变\nD. 无法确定","answer":"答案：B\n解析：气体膨胀对外做功，内能转化为机械能，气体自身内能减少，温度降低。如汽油机做功冲程，气体对外做功，内能减小。"},{"id":"g3_physics_003_ex07","knowledge_id":"g3_physics_003","question":"解答题：冬天，人们常用搓手的方法取暖，也常用热水袋取暖。这两种方法各是通过什么方式改变内能的？","answer":"答案：搓手是做功方式，热水袋是热传递方式\n解析：搓手取暖：通过克服摩擦力做功，将机械能转化为内能，使手的内能增加、温度升高，属于做功改变内能。\n\n热水袋取暖：通过热传导的方式，将热水袋的内能转移到手上，使手的内能增加、温度升高，属于热传递改变内能。\n\n两种方式在改变内能上是等效的。"},{"id":"g3_physics_003_ex08","knowledge_id":"g3_physics_003","question":"选择题：关于热量，下列说法正确的是\nA. 热量是物体所含内能的多少\nB. 温度越高的物体含有的热量越多\nC. 热量是热传递过程中内能的变化量\nD. 质量越大的物体含有的热量越多","answer":"答案：C\n解析：热量是过程量，是热传递过程中内能变化的量度。不能说物体\"含有\"多少热量。"},{"id":"g3_physics_003_ex09","knowledge_id":"g3_physics_003","question":"填空题：做功改变内能的实质是内能与其他形式能的______，热传递改变内能的实质是内能的______。","answer":"答案：转化，转移\n解析：做功：能量形式发生变化（如机械能→内能），是转化。\n热传递：能量形式不变，只是从一个物体转移到另一个物体，是转移。"},{"id":"g3_physics_003_ex10","knowledge_id":"g3_physics_003","question":"判断题：做功和热传递在改变物体内能上是等效的。（  ）","answer":"答案：正确\n解析：做功和热传递都能改变物体的内能，效果相同。比如一根铁丝温度升高，可能是摩擦做功，也可能是加热，结果一样。两者在改变内能上是等效的。"},{"id":"g3_physics_004_ex01","knowledge_id":"g3_physics_004","question":"选择题：关于比热容，下列说法正确的是\nA. 质量越大的物体，比热容越大\nB. 温度越高的物体，比热容越大\nC. 比热容是物质的一种特性，与质量、温度无关\nD. 吸热越多的物体，比热容越大","answer":"答案：C\n解析：比热容是物质的特性，只与物质的种类和状态有关，与质量、温度、吸放热多少都无关。"},{"id":"g3_physics_004_ex02","knowledge_id":"g3_physics_004","question":"填空题：比热容的定义：单位质量的某种物质，温度升高______所吸收的热量，叫做这种物质的比热容。符号是______，单位是______。","answer":"答案：1°C，c，J/(kg·°C)\n解析：比热容定义：单位质量、温度升高1°C吸收的热量。符号c，单位焦每千克摄氏度，符号J/(kg·°C)。"},{"id":"g3_physics_004_ex03","knowledge_id":"g3_physics_004","question":"选择题：水的比热容是4.2×10³ J/(kg·°C)，它的物理意义是\nA. 1 kg水温度升高1°C吸收的热量是4.2×10³ J\nB. 4.2×10³ kg水温度升高1°C吸收1 J热量\nC. 1 kg水吸收4.2×10³ J热量后温度一定升高\nD. 水每升高1°C吸收的热量是4.2×10³ J","answer":"答案：A\n解析：水的比热容的物理意义：质量为1 kg的水，温度升高1°C时吸收的热量是4.2×10³ J。注意单位质量（1 kg）和单位温度变化（1°C）。"},{"id":"g3_physics_004_ex04","knowledge_id":"g3_physics_004","question":"判断题：不同物质的比热容一定不同。（  ）","answer":"答案：错误\n解析：比热容是物质的特性，不同物质比热容一般不同，但也有例外，如煤油和冰的比热容相同。所以不能说\"一定不同\"。"},{"id":"g3_physics_004_ex05","knowledge_id":"g3_physics_004","question":"填空题：水的比热容在常见物质中是比较______的，所以常用作______剂和______剂。","answer":"答案：大，冷却，取暖\n解析：水的比热容大，相同质量的水和其他物质相比，升高或降低相同温度时吸收或放出的热量多，所以常用于冷却和取暖。"},{"id":"g3_physics_004_ex06","knowledge_id":"g3_physics_004","question":"选择题：沿海地区昼夜温差比内陆地区小，这是因为\nA. 水的比热容比砂石大\nB. 水的比热容比砂石小\nC. 水吸收热量多\nD. 水吸收热量少","answer":"答案：A\n解析：水的比热容比砂石、泥土大。白天同样吸热，水温度升高少；夜晚同样放热，水温度降低少。所以沿海地区昼夜温差小。"},{"id":"g3_physics_004_ex07","knowledge_id":"g3_physics_004","question":"解答题：为什么用水作为汽车发动机的冷却剂？请从比热容的角度解释。","answer":"答案：因为水的比热容大，相同质量的水和其他物质相比，升高相同温度能吸收更多热量\n解析：汽车发动机工作时温度很高，需要冷却。\n水的比热容大（4.2×10³ J/(kg·°C)），相同质量的水和其他液体相比，升高相同的温度时，水吸收的热量更多，冷却效果更好。\n因此用水作为冷却剂可以有效地带走发动机产生的热量，保持发动机正常工作温度。"},{"id":"g3_physics_004_ex08","knowledge_id":"g3_physics_004","question":"选择题：质量相等的水和煤油，吸收相同的热量后\nA. 水的温度升高得多\nB. 煤油的温度升高得多\nC. 两者温度升高一样多\nD. 无法判断","answer":"答案：B\n解析：由Q吸 = cmΔt得：Δt = Q吸/cm。Q和m相同，c越小，Δt越大。煤油比热容比水小，所以温度升高得多。"},{"id":"g3_physics_004_ex09","knowledge_id":"g3_physics_004","question":"填空题：一杯水倒出一半后，剩余水的比热容______（选填\"变大\"\"变小\"或\"不变\"），因为比热容是物质的______。","answer":"答案：不变，特性\n解析：比热容是物质的一种特性，与质量无关。水倒出一半后，物质种类没变，所以比热容不变。"},{"id":"g3_physics_004_ex10","knowledge_id":"g3_physics_004","question":"判断题：比热容大的物质，吸热一定多。（  ）","answer":"答案：错误\n解析：由Q吸 = cmΔt可知，吸收热量的多少与比热容、质量、温度变化量三个因素有关。只有比热容大一个条件，不能确定吸热多少。"},{"id":"g3_physics_005_ex01","knowledge_id":"g3_physics_005","question":"选择题：质量为2 kg的水，温度从20°C升高到70°C，吸收的热量是\nA. 8.4×10⁴ J\nB. 4.2×10⁵ J\nC. 4.2×10⁴ J\nD. 8.4×10⁵ J","answer":"答案：B\n解析：Q吸 = cmΔt = 4.2×10³ × 2 × (70-20) = 4.2×10³ × 2 × 50 = 4.2×10⁵ J。注意Δt是温度变化量70-20=50°C。"},{"id":"g3_physics_005_ex02","knowledge_id":"g3_physics_005","question":"填空题：物体吸热的计算公式是Q吸 = ______；物体放热的计算公式是Q放 = ______。","answer":"答案：cm(t-t₀)，cm(t₀-t)\n解析：吸热公式：Q吸 = cm(t-t₀)，t是末温，t₀是初温。\n放热公式：Q放 = cm(t₀-t)。\n统一写成：Q = cmΔt。"},{"id":"g3_physics_005_ex03","knowledge_id":"g3_physics_005","question":"选择题：质量为500 g的铜块，温度从100°C降低到20°C，放出的热量是（铜的比热容0.39×10³ J/(kg·°C)）\nA. 1.56×10⁴ J\nB. 1.56×10⁵ J\nC. 3.9×10⁴ J\nD. 3.9×10⁵ J","answer":"答案：A\n解析：m = 500 g = 0.5 kg，Δt = 100-20 = 80°C\nQ放 = cmΔt = 0.39×10³ × 0.5 × 80 = 0.39×10³ × 40 = 1.56×10⁴ J"},{"id":"g3_physics_005_ex04","knowledge_id":"g3_physics_005","question":"判断题：温度升高越多的物体，吸收的热量一定越多。（  ）","answer":"答案：错误\n解析：由Q吸 = cmΔt可知，吸收热量与比热容、质量、温度变化三个因素有关。只有Δt大，c和m不确定，不能判断吸热多少。"},{"id":"g3_physics_005_ex05","knowledge_id":"g3_physics_005","question":"填空题：热平衡方程：在不计热量损失的情况下，高温物体放出的热量______低温物体吸收的热量，即Q放______Q吸。","answer":"答案：等于，=\n解析：热平衡：不计热量损失时，Q放 = Q吸。这是热量计算题的重要依据。"},{"id":"g3_physics_005_ex06","knowledge_id":"g3_physics_005","question":"选择题：质量和初温都相同的铁块和铝块，吸收相同热量后相互接触（c铁 < c铝），则\nA. 热量从铁传给铝\nB. 热量从铝传给铁\nC. 不发生热传递\nD. 无法判断","answer":"答案：A\n解析：由Δt = Q/cm，Q和m相同，c越小Δt越大。c铁 < c铝，所以Δt铁 > Δt铝，初温相同则铁的末温更高。热量从高温物体传向低温物体，所以从铁传给铝。"},{"id":"g3_physics_005_ex07","knowledge_id":"g3_physics_005","question":"解答题：将质量为200 g、温度为95°C的金属块放入质量为100 g、初温为15°C的水中，充分混合后温度为40°C。不计热量损失，求金属块的比热容。","answer":"答案：c金属 = 0.84×10³ J/(kg·°C)\n解析：不计热量损失，Q放 = Q吸。\n水吸收热量：\nQ吸 = c水m水Δt水 = 4.2×10³ × 0.1 × (40-15) = 4.2×10³ × 0.1 × 25 = 10 500 J\n\n金属放出热量：\nQ放 = c金m金Δt金 = c金 × 0.2 × (95-40) = c金 × 0.2 × 55 = 11c金\n\nQ放 = Q吸：11c金 = 10 500\nc金 = 10 500 ÷ 11 ≈ 0.95×10³ J/(kg·°C)？不对，重新计算：\n200g=0.2kg，Δt=95-40=55°C\nQ放 = c × 0.2 × 55 = 11c\nQ吸 = 4.2×10³ × 0.1 × 25 = 10500\nc = 10500/11 ≈ 954.5 J/(kg·°C) ≈ 0.95×10³ J/(kg·°C)"},{"id":"g3_physics_005_ex08","knowledge_id":"g3_physics_005","question":"选择题：由Q = cmΔt可得c = Q/(mΔt)，关于同一种物质的比热容c，下列说法正确的是\nA. 与Q成正比\nB. 与m成反比\nC. 与Δt成反比\nD. 与Q、m、Δt都无关","answer":"答案：D\n解析：c = Q/(mΔt)是比热容的计算式，不是决定式。比热容是物质的特性，与吸放热多少、质量、温度变化都无关。"},{"id":"g3_physics_005_ex09","knowledge_id":"g3_physics_005","question":"填空题：1 kg水温度升高10°C，需要吸收的热量是______ J；温度降低10°C，放出的热量是______ J。","answer":"答案：4.2×10⁴，4.2×10⁴\n解析：Q = cmΔt = 4.2×10³ × 1 × 10 = 4.2×10⁴ J。\n升高10°C和降低10°C，温度变化量相同，所以吸放热相等。"},{"id":"g3_physics_005_ex10","knowledge_id":"g3_physics_005","question":"判断题：物体吸热，温度一定升高。（  ）","answer":"答案：错误\n解析：物体吸热，内能增加，但温度不一定升高。例如晶体熔化过程中，吸收热量但温度保持不变。此时吸热用于改变物态。"},{"id":"g3_physics_006_ex01","knowledge_id":"g3_physics_006","question":"选择题：热传递的条件是\nA. 物体内能不同\nB. 物体温度不同\nC. 物体质量不同\nD. 物体比热容不同","answer":"答案：B\n解析：热传递的条件是物体间存在温度差。只要温度不同，就会发生热传递，直到温度相同为止。与内能、质量、比热容等无关。"},{"id":"g3_physics_006_ex02","knowledge_id":"g3_physics_006","question":"填空题：热传递的方向是从______物体传到______物体，热传递的结果是两者______相同。","answer":"答案：高温，低温，温度\n解析：热传递方向：高温→低温。结果：温度相同（达到热平衡）。注意传递的是内能（热量），不是温度。"},{"id":"g3_physics_006_ex03","knowledge_id":"g3_physics_006","question":"选择题：关于温度、热量、内能的关系，下列说法正确的是\nA. 物体温度升高，一定吸收了热量\nB. 物体吸收热量，温度一定升高\nC. 物体温度升高，内能一定增加（同一物体）\nD. 物体内能增加，温度一定升高","answer":"答案：C\n解析：温度升高可能是吸热也可能是做功（A错）。吸热温度不一定升高（如晶体熔化，B错）。同一物体温度升高分子运动加剧，内能增加（C对）。内能增加温度不一定升高（如晶体熔化，D错）。"},{"id":"g3_physics_006_ex04","knowledge_id":"g3_physics_006","question":"判断题：温度高的物体内能一定大。（  ）","answer":"答案：错误\n解析：内能不仅与温度有关，还与质量、体积、物态等因素有关。一小杯热水的内能可能比一大缸温水的内能小，因为质量小很多。"},{"id":"g3_physics_006_ex05","knowledge_id":"g3_physics_006","question":"填空题：温度是表示物体______的物理量，从分子动理论看，温度是物体内部分子______的标志。","answer":"答案：冷热程度，热运动剧烈程度\n解析：温度的宏观意义：物体的冷热程度。微观意义：分子热运动剧烈程度的标志。温度越高，分子无规则运动越剧烈。"},{"id":"g3_physics_006_ex06","knowledge_id":"g3_physics_006","question":"选择题：两个物体接触后不发生热传递，是因为它们具有相同的\nA. 内能\nB. 温度\nC. 比热容\nD. 质量","answer":"答案：B\n解析：热传递的条件是温度差。两个物体接触不发生热传递，说明温度相同，达到了热平衡。"},{"id":"g3_physics_006_ex07","knowledge_id":"g3_physics_006","question":"解答题：\"温度高的物体含有的热量多\"这句话是否正确？为什么？","answer":"答案：不正确。热量是过程量，不是状态量，不能说物体\"含有\"热量\n解析：这句话不正确。\n原因：\n1. 热量是过程量，只有在热传递过程中才有意义，是内能变化的量度。\n2. 不能说物体\"含有\"或\"具有\"多少热量，这种说法是错误的。\n3. 可以说物体\"吸收\"或\"放出\"多少热量，表示热传递过程中内能变化了多少。\n4. 物体含有的是内能，不是热量。温度高的物体内能不一定大，还与质量等因素有关。"},{"id":"g3_physics_006_ex08","knowledge_id":"g3_physics_006","question":"选择题：下列关于热量的说法中正确的是\nA. 热量是物体内能的多少\nB. 温度越高的物体含有的热量越多\nC. 热量是热传递中内能变化的量度\nD. 质量越大的物体含有的热量越多","answer":"答案：C\n解析：热量是过程量，是热传递过程中内能变化的量度。不能说物体\"含有\"多少热量。"},{"id":"g3_physics_006_ex09","knowledge_id":"g3_physics_006","question":"填空题：冬天手冷时，用嘴向手上\"哈气\"，手会感到暖和，这是通过______方式改变内能；若用力搓手也会感到暖和，这是通过______方式改变内能。","answer":"答案：热传递，做功\n解析：哈气：口中热气的内能通过热传导转移到手上，是热传递。\n搓手：克服摩擦力做功，机械能转化为内能，是做功。"},{"id":"g3_physics_006_ex10","knowledge_id":"g3_physics_006","question":"判断题：内能总是从内能大的物体传向内能小的物体。（  ）","answer":"答案：错误\n解析：内能（热量）总是从温度高的物体传向温度低的物体，与内能大小无关。内能大的物体温度不一定高，所以不一定是从内能大的传向内能小的。"},{"id":"g3_physics_007_ex01","knowledge_id":"g3_physics_007","question":"选择题：能量守恒定律的内容是\nA. 能量可以凭空产生\nB. 能量可以凭空消失\nC. 能量只能转化，不能转移\nD. 能量既不会消灭也不会创生，只会转化或转移，总量保持不变","answer":"答案：D\n解析：能量守恒定律：能量既不会凭空消灭，也不会凭空产生，它只会从一种形式转化为其他形式，或者从一个物体转移到其他物体，而在转化和转移过程中，能量的总量保持不变。"},{"id":"g3_physics_007_ex02","knowledge_id":"g3_physics_007","question":"填空题：能量守恒定律是自然界最______、最______的基本定律之一。","answer":"答案：普遍，重要\n解析：能量守恒定律是自然界最普遍、最重要的基本定律之一，所有能量转化和转移过程都遵循这个定律。"},{"id":"g3_physics_007_ex03","knowledge_id":"g3_physics_007","question":"选择题：下列现象中，属于能量转化的是\nA. 热传递\nB. 热水袋取暖\nC. 太阳能电池发电\nD. 温度不同的物体接触后温度趋于相同","answer":"答案：C\n解析：能量转化是能量形式发生变化。太阳能电池将光能转化为电能，是能量转化。热传递、热水袋取暖、温度趋同都是内能的转移，形式不变。"},{"id":"g3_physics_007_ex04","knowledge_id":"g3_physics_007","question":"判断题：永动机是可以制造出来的，因为技术在不断进步。（  ）","answer":"答案：错误\n解析：永动机违背了能量守恒定律，是不可能制造出来的。能量不能凭空产生，机器不消耗能量就不可能持续对外做功。任何技术进步都不能违背能量守恒定律。"},{"id":"g3_physics_007_ex05","knowledge_id":"g3_physics_007","question":"填空题：摩擦生热是______能转化为______能；水力发电是______能转化为______能。","answer":"答案：机械，内，机械，电\n解析：摩擦生热：克服摩擦力做功，机械能→内能。\n水力发电：水流推动发电机，机械能→电能。"},{"id":"g3_physics_007_ex06","knowledge_id":"g3_physics_007","question":"选择题：关于能量守恒，下列说法正确的是\nA. 发电机可以创造电能\nB. 电动机消灭了电能\nC. 能量转化和转移过程中总量不变\nD. 热水器产生了热能","answer":"答案：C\n解析：能量守恒定律：能量不能创造也不能消灭，只能转化或转移，总量保持不变。发电机是机械能转化为电能，电动机是电能转化为机械能，热水器是电能转化为内能，都不是创造或消灭。"},{"id":"g3_physics_007_ex07","knowledge_id":"g3_physics_007","question":"解答题：既然能量守恒，为什么还要节约能源？请解释原因。","answer":"答案：能量总量守恒，但能量的转化和转移具有方向性，有些能量不能再被利用，所以可利用的能源是有限的\n解析：能量守恒定律告诉我们能量的总量保持不变，但我们仍然需要节约能源，原因是：\n\n1. 能量的转化和转移具有方向性：\n   - 如电能可以转化为内能（电热器），但内能不能自动地全部转化为电能\n   - 机械能可以通过摩擦全部转化为内能，但内能不能自动变回机械能\n\n2. 我们所说的\"能源\"是指能被人类利用的能量：\n   - 煤、石油等化石能源是可利用的高品质能源\n   - 它们燃烧后变成内能散失到环境中，无法再被收集利用\n\n3. 所以虽然总能量守恒，但可利用的能源是有限的，因此要节约能源。"},{"id":"g3_physics_007_ex08","knowledge_id":"g3_physics_007","question":"选择题：下列过程中，内能转化为机械能的是\nA. 钻木取火\nB. 热机的做功冲程\nC. 用太阳灶烧水\nD. 从滑梯滑下臀部发热","answer":"答案：B\n解析：热机做功冲程中，燃气推动活塞做功，内能转化为机械能。钻木取火和滑滑梯是机械能→内能，太阳灶是内能的转移。"},{"id":"g3_physics_007_ex09","knowledge_id":"g3_physics_007","question":"填空题：植物进行光合作用，是______能转化为______能，储存在植物体内。","answer":"答案：太阳（光），化学\n解析：光合作用：植物吸收太阳光，将二氧化碳和水合成有机物，释放氧气。能量转化：太阳能（光能）→化学能，储存在有机物中。"},{"id":"g3_physics_007_ex10","knowledge_id":"g3_physics_007","question":"判断题：能量守恒定律只适用于物理变化，不适用于化学变化。（  ）","answer":"答案：错误\n解析：能量守恒定律是自然界最普遍的定律之一，适用于所有能量转化和转移过程，包括物理变化、化学变化、生物变化等。化学变化中化学键的能量变化同样遵循能量守恒。"},{"id":"g3_physics_008_ex01","knowledge_id":"g3_physics_008","question":"选择题：探究不同物质吸热能力的实验中，使用相同加热器的目的是\nA. 美观\nB. 保证相同时间放出相同热量\nC. 加热快\nD. 方便操作","answer":"答案：B\n解析：使用相同的加热器，保证相同时间内放出的热量相同，这样被加热物质在相同时间内吸收的热量相等，便于通过加热时间长短来比较吸热多少。"},{"id":"g3_physics_008_ex02","knowledge_id":"g3_physics_008","question":"填空题：探究比热容实验中，常用的实验方法是______法，需要控制______和______相同，只改变物质种类。","answer":"答案：控制变量，质量，初温\n解析：控制变量法：控制质量和初温相同，只改变物质种类（比热容不同），比较吸热能力。"},{"id":"g3_physics_008_ex03","knowledge_id":"g3_physics_008","question":"选择题：在比较水和煤油吸热能力的实验中，下列方法可以比较吸热能力的是\nA. 比较加热相同时间后升高的温度，升温多的吸热能力强\nB. 比较加热相同时间后升高的温度，升温少的吸热能力强\nC. 比较升高相同温度所需的时间，时间短的吸热能力强\nD. 无法比较","answer":"答案：B\n解析：相同加热时间吸收相同热量。升温少说明升高单位温度需要的热量多（因为Q相同，Δt小，c=Q/mΔt就大），吸热能力强。升高相同温度，加热时间长的吸热多，吸热能力强。"},{"id":"g3_physics_008_ex04","knowledge_id":"g3_physics_008","question":"判断题：在探究比热容实验中，可以用温度计测量物质吸收的热量。（  ）","answer":"答案：错误\n解析：温度计只能测量温度，不能直接测量热量。实验中通过加热时间的长短来间接反映吸收热量的多少（转换法），相同加热器相同时间放出热量相同。"},{"id":"g3_physics_008_ex05","knowledge_id":"g3_physics_008","question":"填空题：在比较不同物质吸热能力的实验中，\"加热时间的长短\"反映了物质______的多少，这种研究方法叫做______法。","answer":"答案：吸收热量，转换\n解析：实验中通过加热时间长短来间接反映吸收热量多少，加热时间长说明吸热多。将不易测量的量转换为易测量的量，这是转换法。"},{"id":"g3_physics_008_ex06","knowledge_id":"g3_physics_008","question":"选择题：质量相同的水和食用油，用相同加热器加热相同时间后，食用油温度升高得多，这说明\nA. 食用油吸热能力强\nB. 水吸热能力强\nC. 两者吸热能力相同\nD. 无法判断","answer":"答案：B\n解析：相同时间吸收相同热量，食用油升温多。由c = Q/(mΔt)，Q和m相同，Δt大的c小。所以食用油比热容小，吸热能力弱，水比热容大，吸热能力强。"},{"id":"g3_physics_008_ex07","knowledge_id":"g3_physics_008","question":"解答题：在探究\"比较不同物质吸热的情况\"实验中，为什么要使水和食用油的质量相同、初温相同？为什么要用相同的加热器？","answer":"答案：用控制变量法，确保只有物质种类一个变量；相同加热器保证相同时间吸热相同\n解析：这是控制变量法的要求：\n\n1. 质量相同：如果质量不同，温度变化可能是由于质量不同造成的，就不能确定是吸热能力不同导致的。\n\n2. 初温相同：初温不同的话，温度变化的起始点不同，不方便比较温度变化量。也减小散热的影响。\n\n3. 相同加热器：保证相同时间内放出的热量相同，这样水和食用油在相同时间内吸收的热量相等。就可以通过加热时间长短来比较吸收热量的多少（加热时间长，吸热多）。\n\n通过控制这些变量，只有物质种类不同，就能比较不同物质的吸热能力（比热容）。"},{"id":"g3_physics_008_ex08","knowledge_id":"g3_physics_008","question":"选择题：下列做法中，为了比较水和煤油的比热容大小，可行的是\nA. 比较质量相同的水和煤油升高相同温度所需的加热时间\nB. 比较质量不同的水和煤油加热相同时间后的温度\nC. 比较质量相同的水和煤油加热不同时间后的温度\nD. 随便怎么比都可以","answer":"答案：A\n解析：比较比热容大小的方法有两种：\n1. 质量相同，升高相同温度，比较加热时间（吸热多少），时间长的比热容大\n2. 质量相同，加热相同时间（吸热相同），比较升高的温度，升温少的比热容大\nA属于第一种方法，正确。"},{"id":"g3_physics_008_ex09","knowledge_id":"g3_physics_008","question":"填空题：在探究实验中，如果要得出\"质量相同的不同物质，吸收相同的热量，升高的温度不同\"的结论，可以观察记录______来比较。","answer":"答案：相同加热时间后温度计的示数变化\n解析：吸收相同热量→用相同加热器加热相同时间。\n升高温度不同→观察温度计示数变化。\n所以记录加热相同时间后温度计的示数变化即可。"},{"id":"g3_physics_008_ex10","knowledge_id":"g3_physics_008","question":"判断题：实验中搅拌器的作用是使物质受热均匀。（  ）","answer":"答案：正确\n解析：实验中使用搅拌器不断搅拌，是为了使被加热物质受热均匀，各部分温度一致，确保温度测量准确。"},{"id":"g3_physics_009_ex01","knowledge_id":"g3_physics_009","question":"选择题：下列关于热机的说法，正确的是\nA. 热机是把机械能转化为内能的机器\nB. 热机是把内能转化为机械能的机器\nC. 热机是把电能转化为机械能的机器\nD. 热机是把太阳能转化为内能的机器","answer":"答案：B\n解析：热机是利用内能来做功的机器，工作时将内能转化为机械能。常见的热机有蒸汽机、内燃机、汽轮机、喷气发动机等。"},{"id":"g3_physics_009_ex02","knowledge_id":"g3_physics_009","question":"填空题：热机的种类很多，例如______、______、汽轮机、喷气发动机等。","answer":"答案：蒸汽机，内燃机\n解析：热机是利用内能做功的机械，常见的有蒸汽机、内燃机、汽轮机、喷气发动机等。其中内燃机又分为汽油机和柴油机。"},{"id":"g3_physics_009_ex03","knowledge_id":"g3_physics_009","question":"选择题：下列机器中，不属于热机的是\nA. 蒸汽机\nB. 内燃机\nC. 电动机\nD. 喷气发动机","answer":"答案：C\n解析：电动机是把电能转化为机械能的机器，不是利用内能来做功，所以不属于热机。蒸汽机、内燃机、喷气发动机都是利用内能做功，都属于热机。"},{"id":"g3_physics_009_ex04","knowledge_id":"g3_physics_009","question":"判断题：热机工作时，将内能转化为机械能。（  ）","answer":"答案：正确\n解析：热机的工作原理是利用燃料燃烧释放的内能来推动活塞做功，将内能转化为机械能。这是热机最基本的能量转化特点。"},{"id":"g3_physics_009_ex05","knowledge_id":"g3_physics_009","question":"填空题：内燃机分为______和______两大类，它们分别用汽油和柴油作为燃料。","answer":"答案：汽油机，柴油机\n解析：内燃机是燃料在汽缸内燃烧的热机，分为汽油机和柴油机两大类。汽油机以汽油为燃料，柴油机以柴油为燃料。"},{"id":"g3_physics_009_ex06","knowledge_id":"g3_physics_009","question":"选择题：汽车发动机常用的是内燃机，它工作时能量转化的主要过程是\nA. 内能→化学能→机械能\nB. 化学能→内能→机械能\nC. 化学能→机械能→内能\nD. 机械能→内能→化学能","answer":"答案：B\n解析：内燃机工作时，首先燃料燃烧将化学能转化为内能，然后利用内能推动活塞做功，将内能转化为机械能。所以能量转化过程是：化学能→内能→机械能。"},{"id":"g3_physics_009_ex07","knowledge_id":"g3_physics_009","question":"解答题：简述热机的工作原理，并说明热机工作时的能量转化过程。","answer":"答案：热机利用内能做功，将内能转化为机械能；能量转化：化学能→内能→机械能\n解析：热机的工作原理：\n\n热机是利用内能来做功的机械。它利用燃料燃烧释放出的内能，通过工作物质（水蒸气、燃气等）膨胀做功，将内能转化为机械能。\n\n能量转化过程：\n1. 燃料燃烧：化学能转化为内能（燃料的化学能释放出来，变成燃气或水蒸气的内能）\n2. 做功过程：内能转化为机械能（高温高压的燃气或水蒸气推动活塞或叶轮转动）\n\n例如汽车的汽油机：汽油在汽缸内燃烧，化学能转化为燃气的内能，高温高压的燃气推动活塞做功，内能又转化为机械能，使汽车运动。"},{"id":"g3_physics_009_ex08","knowledge_id":"g3_physics_009","question":"选择题：下列关于热机和环境保护的说法，正确的是\nA. 热机的大量使用会造成环境污染\nB. 所有热机都是用汽油作燃料\nC. 热机产生的噪声可以被完全消除\nD. 热机不会对环境造成任何影响","answer":"答案：A\n解析：热机工作时会排放废气（一氧化碳、二氧化硫、氮氧化物等），产生噪声，对环境造成污染。热机的燃料有汽油、柴油、煤、氢等多种。热机噪声可以减弱但不能完全消除。"},{"id":"g3_physics_009_ex09","knowledge_id":"g3_physics_009","question":"填空题：火箭使用的是______发动机，它也是一种热机，工作时将燃料的______能最终转化为火箭的______能。","answer":"答案：喷气，化学，机械\n解析：火箭使用喷气发动机，属于热机的一种。燃料燃烧时化学能转化为内能，高温高压燃气从尾部喷出，利用反冲力推动火箭运动，内能最终转化为火箭的机械能。"},{"id":"g3_physics_009_ex10","knowledge_id":"g3_physics_009","question":"判断题：蒸汽机是最早的热机，它的效率比内燃机高。（  ）","answer":"答案：错误\n解析：蒸汽机是最早的热机，但蒸汽机的效率很低，一般只有6%~15%，而内燃机的效率比蒸汽机高得多，汽油机效率约20%~30%，柴油机效率约30%~45%。"},{"id":"g3_physics_010_ex01","knowledge_id":"g3_physics_010","question":"选择题：关于燃料的热值，下列说法正确的是\nA. 燃料的热值越大，燃烧时放出的热量越多\nB. 燃料的热值越大，燃烧时温度越高\nC. 燃料的热值与燃料的质量无关\nD. 燃料燃烧越充分，热值越大","answer":"答案：C\n解析：热值是燃料本身的一种特性，只与燃料的种类有关，与燃料的质量、体积、燃烧是否充分等都无关。燃料燃烧放出的热量与热值和质量都有关（Q放=mq），所以热值大的放出热量不一定多。"},{"id":"g3_physics_010_ex02","knowledge_id":"g3_physics_010","question":"填空题：酒精的热值是3.0×10⁷J/kg，它的物理意义是：1kg的酒精______放出的热量是______J。","answer":"答案：完全燃烧，3.0×10⁷\n解析：热值的定义是：1kg某种燃料完全燃烧放出的热量，叫做这种燃料的热值。酒精的热值是3.0×10⁷J/kg，表示1kg酒精完全燃烧放出的热量是3.0×10⁷J。"},{"id":"g3_physics_010_ex03","knowledge_id":"g3_physics_010","question":"选择题：下列关于热值的说法，正确的是\nA. 1kg煤燃烧比1kg木柴燃烧放出的热量多，说明煤的热值比木柴大\nB. 2kg汽油完全燃烧比1kg汽油完全燃烧放出的热量多，说明2kg汽油的热值大\nC. 热值大的燃料，燃烧时放出的热量一定多\nD. 相同质量的不同燃料完全燃烧，热值大的放出的热量多","answer":"答案：D\n解析：A选项没有说明是否完全燃烧，不能比较热值。B选项热值与质量无关，同种燃料热值相同。C选项放出热量还与质量有关。D选项由Q放=mq可知，质量m相同，q大的Q放多，正确。"},{"id":"g3_physics_010_ex04","knowledge_id":"g3_physics_010","question":"判断题：燃料的热值与燃料的质量成正比。（  ）","answer":"答案：错误\n解析：热值是燃料的一种特性，只与燃料的种类有关，与燃料的质量、体积等均无关。无论燃料质量是多少，只要是同一种燃料，热值就是相同的。"},{"id":"g3_physics_010_ex05","knowledge_id":"g3_physics_010","question":"填空题：木炭的热值是3.4×10⁷J/kg，完全燃烧500g木炭，能放出______J的热量。","answer":"答案：1.7×10⁷\n解析：m = 500g = 0.5kg\nQ放 = mq = 0.5kg × 3.4×10⁷J/kg = 1.7×10⁷J"},{"id":"g3_physics_010_ex06","knowledge_id":"g3_physics_010","question":"选择题：现代火箭用液态氢作燃料，是因为液态氢具有\nA. 较大的比热容\nB. 较低的沸点\nC. 较大的热值\nD. 较高的凝固点","answer":"答案：C\n解析：火箭需要携带尽量少的燃料获得尽量多的能量，液态氢的热值很大，相同质量的液态氢完全燃烧放出的热量比其他燃料多得多，所以火箭用液态氢作燃料。"},{"id":"g3_physics_010_ex07","knowledge_id":"g3_physics_010","question":"解答题：完全燃烧0.2kg汽油放出的热量是多少？这些热量能使多少千克的水温度从20℃升高到70℃？（汽油的热值为4.6×10⁷J/kg，水的比热容为4.2×10³J/(kg·℃)，假设热量全部被水吸收）","answer":"答案：放出热量9.2×10⁶J；能使约43.8kg的水升温\n解析：（1）汽油完全燃烧放出的热量：\nQ放 = m汽油 × q = 0.2kg × 4.6×10⁷J/kg = 9.2×10⁶J\n\n（2）热量全部被水吸收，Q吸 = Q放 = 9.2×10⁶J\n由Q吸 = cmΔt得：\nm水 = Q吸 / (cΔt) = 9.2×10⁶J / [4.2×10³J/(kg·℃) × (70℃ - 20℃)]\n    = 9.2×10⁶ / (4.2×10³ × 50)\n    = 9.2×10⁶ / 2.1×10⁵\n    ≈ 43.8kg"},{"id":"g3_physics_010_ex08","knowledge_id":"g3_physics_010","question":"选择题：关于燃料的热值，下列说法中正确的是\nA. 容易燃烧的燃料，热值一定大\nB. 燃料的热值与燃料的燃烧情况无关\nC. 煤的热值大于干木柴的热值，燃烧煤放出的热量一定比燃烧木柴放出的多\nD. 为了提高锅炉的效率，一定要用热值高的燃料","answer":"答案：B\n解析：热值是燃料的特性，只与燃料种类有关，与是否容易燃烧、燃烧情况无关，所以B正确，A错误。放出热量还与质量有关，C错误。锅炉效率与热值高低没有必然联系，D错误。"},{"id":"g3_physics_010_ex09","knowledge_id":"g3_physics_010","question":"填空题：天然气的热值约为4×10⁷J/m³，它表示的物理意义是______。完全燃烧0.5m³的天然气可以放出______J的热量。","answer":"答案：1m³的天然气完全燃烧放出的热量是4×10⁷J，2×10⁷\n解析：气体燃料的热值单位是J/m³，表示1立方米的某种燃料完全燃烧放出的热量。\nQ放 = Vq = 0.5m³ × 4×10⁷J/m³ = 2×10⁷J"},{"id":"g3_physics_010_ex10","knowledge_id":"g3_physics_010","question":"判断题：一杯酒精倒出一半后，剩下酒精的热值变为原来的一半。（  ）","answer":"答案：错误\n解析：热值是燃料的特性，只与燃料的种类有关，与质量、体积无关。一杯酒精倒出一半，虽然质量和体积都变为原来的一半，但酒精的种类没变，所以热值不变。"},{"id":"g3_physics_011_ex01","knowledge_id":"g3_physics_011","question":"选择题：热机的效率是指\nA. 燃料完全燃烧放出的能量与做的有用功之比\nB. 做的有用功与燃料完全燃烧放出的能量之比\nC. 做的有用功与燃料的质量之比\nD. 燃料完全燃烧放出的能量与燃料的质量之比","answer":"答案：B\n解析：热机效率的定义是：用来做有用功的那部分能量，与燃料完全燃烧放出的能量之比，叫做热机的效率。公式为η = W有用 / Q放 × 100%。"},{"id":"g3_physics_011_ex02","knowledge_id":"g3_physics_011","question":"填空题：热机效率的计算公式是η = ______，热机效率总是______1（选填\"大于\"、\"等于\"或\"小于\"）。","answer":"答案：W有用/Q放×100%，小于\n解析：热机效率η = 有用功/燃料完全燃烧放出的热量 × 100%。由于热机工作时总有能量损失（废气带走能量、机械散热、克服摩擦等），所以有用功总是小于总能量，热机效率总是小于1。"},{"id":"g3_physics_011_ex03","knowledge_id":"g3_physics_011","question":"选择题：下列措施中，不能提高热机效率的是\nA. 尽量使燃料充分燃烧\nB. 尽量减少热机的工作时间\nC. 尽量减少各种热损失\nD. 尽量减少因克服摩擦而额外消耗的能量","answer":"答案：B\n解析：提高热机效率的方法有：使燃料充分燃烧、减少各种热损失（散热、废气带走的能量）、减少摩擦等。减少热机工作时间只是减少总能量消耗，但效率不变，所以不能提高效率。"},{"id":"g3_physics_011_ex04","knowledge_id":"g3_physics_011","question":"判断题：热机效率越高，消耗的燃料越少。（  ）","answer":"答案：错误\n解析：热机效率是有用功与总能量的比值。消耗燃料的多少不仅与效率有关，还与做的有用功多少有关。如果做的有用功不同，效率高的消耗燃料不一定少。只有在做相同有用功的前提下，效率高的消耗燃料才少。"},{"id":"g3_physics_011_ex05","knowledge_id":"g3_physics_011","question":"填空题：某汽油机的效率是25%，它的意思是：汽油机工作时，用来做______的能量占燃料______放出能量的25%。","answer":"答案：有用功，完全燃烧\n解析：热机效率的含义是：用来做有用功的那部分能量，与燃料完全燃烧放出的能量之比。效率25%表示有用功的能量占燃料完全燃烧放出总能量的25%，其余75%的能量都损失掉了。"},{"id":"g3_physics_011_ex06","knowledge_id":"g3_physics_011","question":"选择题：甲汽油机的效率比乙汽油机的效率高，这说明\nA. 甲的功率比乙大\nB. 甲用的燃料比乙少\nC. 甲做的有用功比乙多\nD. 甲做的有用功与燃料完全燃烧放出能量的比值比乙大","answer":"答案：D\n解析：热机效率是有用功与燃料完全燃烧放出能量的比值，效率高说明这个比值大。效率与功率无关（A错）。效率高不一定用燃料少，还要看做多少有用功（B错）。效率高也不一定做功多，还要看燃料多少（C错）。只有D正确。"},{"id":"g3_physics_011_ex07","knowledge_id":"g3_physics_011","question":"解答题：某型号汽车发动机的额定功率为6×10⁴W，在水平路面上匀速行驶时受到的阻力是1800N。在额定功率下，当汽车匀速行驶时，求：（1）发动机所提供的牵引力大小；（2）行驶速度的大小；（3）行驶5min牵引力所做的功；（4）若行驶5min消耗汽油1.5kg，求该发动机的效率。（汽油的热值q=4.6×10⁷J/kg）","answer":"答案：（1）牵引力1800N；（2）速度约33.3m/s；（3）做功1.8×10⁷J；（4）效率约26.1%\n解析：（1）汽车匀速行驶，牵引力与阻力平衡：\nF牵 = f = 1800N\n\n（2）由P = Fv得：\nv = P / F = 6×10⁴W / 1800N ≈ 33.3m/s\n\n（3）行驶5min牵引力做的功：\nW = Pt = 6×10⁴W × 5×60s = 6×10⁴ × 300 = 1.8×10⁷J\n\n（4）1.5kg汽油完全燃烧放出的热量：\nQ放 = mq = 1.5kg × 4.6×10⁷J/kg = 6.9×10⁷J\n发动机的效率：\nη = W / Q放 × 100% = 1.8×10⁷ / 6.9×10⁷ × 100% ≈ 26.1%"},{"id":"g3_physics_011_ex08","knowledge_id":"g3_physics_011","question":"选择题：热机工作时能量损失的途径有很多，其中能量损失最多的是\nA. 克服摩擦消耗的能量\nB. 散热损失的能量\nC. 废气带走的能量\nD. 机械本身吸热损失的能量","answer":"答案：C\n解析：热机工作时，燃料燃烧释放的能量中，废气带走的能量最多，约占40%以上。其次是散热损失、克服摩擦等。所以提高热机效率的一个重要方向就是设法利用废气的能量（如热电站）。"},{"id":"g3_physics_011_ex09","knowledge_id":"g3_physics_011","question":"填空题：某柴油机的效率为35%，表示的意思是：柴油机工作时，______的能量占______能量的35%；其余65%的能量中，损失最多的是______带走的能量。","answer":"答案：用来做有用功，燃料完全燃烧放出的，废气\n解析：热机效率是有用功与燃料完全燃烧放出的总能量之比。热机能量损失途径有：废气带走大部分能量、散热损失、克服机械摩擦等，其中废气带走的能量最多。"},{"id":"g3_physics_011_ex10","knowledge_id":"g3_physics_011","question":"判断题：热机效率可以达到100%。（  ）","answer":"答案：错误\n解析：热机工作时，燃料不可能完全燃烧，且废气会带走大量能量，机件散热也会损失能量，还要克服摩擦消耗能量，所以用来做有用功的能量总是小于燃料完全燃烧放出的能量，热机效率总是小于1，不可能达到100%。"},{"id":"g3_physics_012_ex01","knowledge_id":"g3_physics_012","question":"选择题：下列能量转化过程中，属于内能转化为机械能的是\nA. 用热水袋取暖\nB. 两手相互摩擦取暖\nC. 汽油机的做功冲程\nD. 电流通过电热丝发热","answer":"答案：C\n解析：A选项是热传递，内能的转移，不是转化。B选项是机械能转化为内能（摩擦生热）。C选项汽油机做功冲程中，燃气膨胀推动活塞做功，内能转化为机械能。D选项是电能转化为内能。"},{"id":"g3_physics_012_ex02","knowledge_id":"g3_physics_012","question":"填空题：能量既不会凭空______，也不会凭空______，它只会从一种形式______为其他形式，或者从一个物体______到另一个物体，而在转化和转移的过程中，能量的总量______。这就是能量守恒定律。","answer":"答案：消灭，产生，转化，转移，保持不变\n解析：能量守恒定律的内容：能量既不会凭空消灭，也不会凭空产生，它只会从一种形式转化为其他形式，或者从一个物体转移到另一个物体，而在转化和转移的过程中，能量的总量保持不变。"},{"id":"g3_physics_012_ex03","knowledge_id":"g3_physics_012","question":"选择题：下列事例中，属于能量转移的是\nA. 水力发电\nB. 用电饭锅煮饭\nC. 用热水袋取暖\nD. 用打气筒打气，筒壁发热","answer":"答案：C\n解析：能量的转移是指能量从一个物体转移到另一个物体，能量的形式不变。能量的转化是指能量从一种形式变成另一种形式。A是机械能转化为电能，B是电能转化为内能，C是内能的转移（热水袋的内能转移到人身上），D是机械能转化为内能。"},{"id":"g3_physics_012_ex04","knowledge_id":"g3_physics_012","question":"判断题：能量在转化和转移过程中，能量的总量会逐渐减少。（  ）","answer":"答案：错误\n解析：根据能量守恒定律，能量在转化和转移的过程中，能量的总量保持不变，不会减少。能量只会从一种形式转化为另一种形式，或从一个物体转移到另一个物体，总能量守恒。"},{"id":"g3_physics_012_ex05","knowledge_id":"g3_physics_012","question":"填空题：水电站发电时，能量的转化过程是：水的______能转化为水轮机的______能，再转化为发电机的______能。","answer":"答案：机械（或重力势），机械，电\n解析：水电站高处的水流下来，重力势能转化为动能（都是机械能），冲击水轮机转动，水轮机带动发电机发电，将机械能转化为电能。整个过程：水的机械能→水轮机的机械能→电能。"},{"id":"g3_physics_012_ex06","knowledge_id":"g3_physics_012","question":"选择题：关于能量的转化和转移，下列说法正确的是\nA. 能量只能从一种形式转化为另一种形式\nB. 能量只能从一个物体转移到另一个物体\nC. 能量的转化和转移是有方向性的\nD. 能量在转化和转移过程中，总量会不断减少","answer":"答案：C\n解析：能量既可以转化，也可以转移（A、B都不对）。能量的转化和转移是有方向性的，例如：内能只能自发地从高温物体转移到低温物体，不能反向进行；汽车制动时，动能转化为内能，这些内能不能自动地用来再次开动汽车。根据能量守恒定律，总量保持不变（D错）。"},{"id":"g3_physics_012_ex07","knowledge_id":"g3_physics_012","question":"解答题：请分析下列过程中能量的转化或转移情况：（1）植物的光合作用；（2）电灯发光；（3）冬天对手哈气取暖；（4）蓄电池放电；（5）陨石坠入大气层变成流星。","answer":"答案：（1）光能→化学能；（2）电能→光能和内能；（3）内能的转移；（4）化学能→电能；（5）机械能→内能和光能\n解析：（1）光合作用：植物吸收太阳光，将光能转化为化学能储存在体内。\n（2）电灯发光：电流通过灯丝，电能转化为光能（发光）和内能（发热）。\n（3）对手哈气取暖：口中热气的内能转移到手上，属于能量的转移，能量形式不变（都是内能）。\n（4）蓄电池放电：蓄电池内部发生化学反应，化学能转化为电能对外供电。\n（5）陨石坠入大气层：陨石与空气摩擦，机械能转化为内能（温度升高）和光能（发光变成流星）。"},{"id":"g3_physics_012_ex08","knowledge_id":"g3_physics_012","question":"选择题：下列关于能量守恒定律的说法，错误的是\nA. 能量守恒定律是自然界最普遍、最重要的基本定律之一\nB. 所有能量转化的过程，都服从能量守恒定律\nC. 永动机是不可能制成的，因为它违背了能量守恒定律\nD. 能量在转化过程中，总量会不断减少","answer":"答案：D\n解析：能量守恒定律是自然界最普遍、最重要的基本定律之一，所有能量转化和转移过程都服从能量守恒定律（A、B正确）。永动机违背能量守恒定律，不可能制成（C正确）。能量在转化和转移过程中总量保持不变，不会减少（D错误）。"},{"id":"g3_physics_012_ex09","knowledge_id":"g3_physics_012","question":"填空题：从能量转化的角度看，热机是把______能转化为______能的机器；电动机是把______能转化为______能的机器；发电机是把______能转化为______能的机器。","answer":"答案：内，机械，电，机械，机械，电\n解析：热机（汽油机、柴油机等）利用内能做功，内能→机械能。\n电动机消耗电能，获得机械能，电能→机械能。\n发电机利用电磁感应，消耗机械能，获得电能，机械能→电能。"},{"id":"g3_physics_012_ex10","knowledge_id":"g3_physics_012","question":"判断题：能量的转化和转移都是有方向性的，我们是在能量的转化和转移过程中利用能量的。（  ）","answer":"答案：正确\n解析：能量的转化和转移都是有方向性的。例如：热量只能自发地从高温物体传到低温物体；摩擦生热是机械能转化为内能，但内能不能自发地全部转化为机械能。我们是在能量的转化或转移的过程中利用能量的，不是什么能量都可以利用。"},{"id":"g3_physics_013_ex01","knowledge_id":"g3_physics_013","question":"选择题：四冲程汽油机的一个工作循环中，活塞往复运动的次数和曲轴转动的圈数分别是\nA. 2次，2圈\nB. 2次，1圈\nC. 4次，2圈\nD. 4次，4圈","answer":"答案：A\n解析：四冲程汽油机一个工作循环包括吸气、压缩、做功、排气四个冲程，活塞往复运动2次（从上端到下端再到上端算一次往复，四个冲程活塞上下各2次，即往复2次），曲轴转动2圈，对外做功1次。"},{"id":"g3_physics_013_ex02","knowledge_id":"g3_physics_013","question":"填空题：四冲程内燃机的一个工作循环由______、______、______、______四个冲程组成，其中只有______冲程是燃气对外做功，将内能转化为机械能。","answer":"答案：吸气冲程，压缩冲程，做功冲程，排气冲程，做功\n解析：四冲程内燃机的一个工作循环包括吸气、压缩、做功、排气四个冲程。做功冲程中，高温高压的燃气推动活塞向下运动，对外做功，内能转化为机械能。其他三个冲程是辅助冲程，靠飞轮的惯性来完成。"},{"id":"g3_physics_013_ex03","knowledge_id":"g3_physics_013","question":"选择题：在四冲程汽油机的工作过程中，内能转化为机械能的冲程是\nA. 吸气冲程\nB. 压缩冲程\nC. 做功冲程\nD. 排气冲程","answer":"答案：C\n解析：吸气冲程和排气冲程中没有能量转化。压缩冲程中，活塞压缩气体做功，机械能转化为内能。做功冲程中，燃气膨胀推动活塞做功，内能转化为机械能。"},{"id":"g3_physics_013_ex04","knowledge_id":"g3_physics_013","question":"判断题：四冲程汽油机的压缩冲程中，是内能转化为机械能。（  ）","answer":"答案：错误\n解析：压缩冲程中，活塞向上运动，压缩汽缸内的气体，对气体做功，活塞的机械能转化为气体的内能，使气体的内能增加、温度升高。做功冲程才是内能转化为机械能。"},{"id":"g3_physics_013_ex05","knowledge_id":"g3_physics_013","question":"填空题：四冲程汽油机在压缩冲程中，能量转化是______能转化为______能；在做功冲程中，能量转化是______能转化为______能。","answer":"答案：机械，内，内，机械\n解析：压缩冲程：活塞向上运动，压缩汽缸内的混合气体，对气体做功，机械能转化为内能，气体温度升高、压强增大。\n做功冲程：火花塞点火，混合气体剧烈燃烧，产生高温高压的燃气，推动活塞向下运动，内能转化为机械能。"},{"id":"g3_physics_013_ex06","knowledge_id":"g3_physics_013","question":"选择题：关于四冲程汽油机，下列说法正确的是\nA. 汽油机顶部有喷油嘴\nB. 吸气冲程吸入的只有空气\nC. 做功冲程中燃气推动活塞做功\nD. 压缩冲程结束时温度比做功冲程结束时温度高","answer":"答案：C\n解析：A错误，汽油机顶部有火花塞，柴油机顶部有喷油嘴。B错误，汽油机吸气冲程吸入的是汽油和空气的混合物，柴油机吸气冲程吸入的只有空气。C正确，做功冲程中燃气膨胀推动活塞做功。D错误，做功冲程中燃气燃烧放热，温度比压缩冲程结束时高得多。"},{"id":"g3_physics_013_ex07","knowledge_id":"g3_physics_013","question":"解答题：简述四冲程汽油机的四个冲程的工作过程，并说明每个冲程中气门的开闭情况、活塞运动方向和能量转化情况。","answer":"答案：吸气、压缩、做功、排气四个冲程，只有做功冲程对外做功\n解析：四冲程汽油机一个工作循环由四个冲程组成：\n\n1. 吸气冲程：\n   - 进气门打开，排气门关闭\n   - 活塞由上端向下运动\n   - 汽油和空气的混合物被吸入汽缸\n   - 能量转化：无\n\n2. 压缩冲程：\n   - 进气门和排气门都关闭\n   - 活塞由下端向上运动\n   - 混合气体被压缩，温度升高、压强增大\n   - 能量转化：机械能→内能\n\n3. 做功冲程：\n   - 进气门和排气门都关闭\n   - 火花塞点火，混合气体剧烈燃烧\n   - 高温高压燃气推动活塞向下运动\n   - 内能通过连杆带动曲轴转动，对外做功\n   - 能量转化：内能→机械能\n\n4. 排气冲程：\n   - 排气门打开，进气门关闭\n   - 活塞由下端向上运动\n   - 废气被排出汽缸\n   - 能量转化：无\n\n四个冲程中，只有做功冲程是燃气对外做功，其他三个冲程是辅助冲程，靠飞轮的惯性完成。"},{"id":"g3_physics_013_ex08","knowledge_id":"g3_physics_013","question":"选择题：一台四冲程汽油机的飞轮转速是1800r/min，则它每秒钟内\nA. 完成30个工作循环，做功30次\nB. 完成30个工作循环，做功15次\nC. 完成15个工作循环，做功15次\nD. 完成15个工作循环，做功30次","answer":"答案：C\n解析：飞轮转速1800r/min = 1800/60 r/s = 30r/s，即每秒飞轮转30圈。\n一个工作循环飞轮转2圈，完成4个冲程，对外做功1次。\n所以每秒完成的工作循环数 = 30/2 = 15个，每秒做功15次。"},{"id":"g3_physics_013_ex09","knowledge_id":"g3_physics_013","question":"填空题：柴油机和汽油机在构造上的主要区别是：汽油机顶部有______，柴油机顶部有______；在吸气冲程中，汽油机吸入的是______，柴油机吸入的是______。","answer":"答案：火花塞，喷油嘴，汽油和空气的混合物，空气\n解析：汽油机和柴油机的区别：\n1. 构造：汽油机顶部有火花塞，柴油机顶部有喷油嘴。\n2. 吸气冲程：汽油机吸入汽油和空气的混合物，柴油机只吸入空气。\n3. 点火方式：汽油机是点燃式（火花塞点火），柴油机是压燃式（喷油嘴喷油，遇到高温空气自动燃烧）。"},{"id":"g3_physics_013_ex10","knowledge_id":"g3_physics_013","question":"判断题：四冲程内燃机的一个工作循环中，曲轴转2圈，活塞往复运动2次，对外做功1次。（  ）","answer":"答案：正确\n解析：四冲程内燃机一个工作循环包括吸气、压缩、做功、排气四个冲程。每个冲程活塞从一端运动到另一端（半个往复），四个冲程活塞上下共4次半程，即往复运动2次。曲轴（飞轮）转2圈。只有做功冲程对外做功，所以一个工作循环对外做功1次。"},{"id":"g3_physics_014_ex01","knowledge_id":"g3_physics_014","question":"选择题：完全燃烧2kg的木炭，放出的热量是6.8×10⁷J，则木炭的热值是\nA. 3.4×10⁷J/kg\nB. 13.6×10⁷J/kg\nC. 3.4×10⁷J\nD. 6.8×10⁷J/kg","answer":"答案：A\n解析：由Q放 = mq得，热值q = Q放 / m = 6.8×10⁷J / 2kg = 3.4×10⁷J/kg。热值的单位是J/kg，所以C、D单位不对。"},{"id":"g3_physics_014_ex02","knowledge_id":"g3_physics_014","question":"填空题：质量为500g的酒精完全燃烧放出的热量是______J，若这些热量有40%被质量为20kg、初温为20℃的水吸收，则水温可升高到______℃。（酒精的热值q=3.0×10⁷J/kg，水的比热容c=4.2×10³J/(kg·℃)，结果保留整数）","answer":"答案：1.5×10⁷，91\n解析：（1）m酒精 = 500g = 0.5kg\nQ放 = m酒精 × q = 0.5kg × 3.0×10⁷J/kg = 1.5×10⁷J\n\n（2）水吸收的热量：\nQ吸 = Q放 × 40% = 1.5×10⁷J × 0.4 = 6×10⁶J\n\n由Q吸 = cmΔt得：\nΔt = Q吸 / (cm) = 6×10⁶J / [4.2×10³J/(kg·℃) × 20kg]\n   = 6×10⁶ / 8.4×10⁴\n   ≈ 71.4℃\n\n末温t = t₀ + Δt = 20℃ + 71.4℃ ≈ 91℃"},{"id":"g3_physics_014_ex03","knowledge_id":"g3_physics_014","question":"选择题：某汽车发动机的效率是20%，行驶一段路程消耗汽油2kg，则该汽车发动机做的有用功是（汽油的热值为4.6×10⁷J/kg）\nA. 9.2×10⁷J\nB. 1.84×10⁷J\nC. 4.6×10⁷J\nD. 2.3×10⁷J","answer":"答案：B\n解析：汽油完全燃烧放出的总热量：\nQ放 = mq = 2kg × 4.6×10⁷J/kg = 9.2×10⁷J\n\n有用功W有用 = Q放 × η = 9.2×10⁷J × 20% = 1.84×10⁷J"},{"id":"g3_physics_014_ex04","knowledge_id":"g3_physics_014","question":"判断题：某柴油机的效率是35%，表示完全燃烧1kg柴油时，能得到3.5×10⁷J的有用功。（柴油的热值为4.3×10⁷J/kg）（  ）","answer":"答案：错误\n解析：完全燃烧1kg柴油放出的热量：\nQ放 = mq = 1kg × 4.3×10⁷J/kg = 4.3×10⁷J\n\n有用功W有用 = Q放 × η = 4.3×10⁷J × 35% = 1.505×10⁷J，不是3.5×10⁷J。所以说法错误。"},{"id":"g3_physics_014_ex05","knowledge_id":"g3_physics_014","question":"填空题：某太阳能热水器中装有质量为50kg的水，在阳光的照射下，该热水器中水的温度从25℃升高到45℃。这些水吸收的热量是______J。若改用燃烧天然气来加热这些水，天然气完全燃烧放出热量的60%被水吸收，则需要完全燃烧______m³的天然气。（水的比热容c=4.2×10³J/(kg·℃)，天然气的热值q=4.0×10⁷J/m³）","answer":"答案：4.2×10⁶，0.175\n解析：（1）水吸收的热量：\nQ吸 = cm(t - t₀) = 4.2×10³J/(kg·℃) × 50kg × (45℃ - 25℃)\n     = 4.2×10³ × 50 × 20\n     = 4.2×10⁶J\n\n（2）天然气完全燃烧放出的热量：\nQ放 = Q吸 / 60% = 4.2×10⁶J / 0.6 = 7×10⁶J\n\n由Q放 = Vq得需要天然气的体积：\nV = Q放 / q = 7×10⁶J / 4.0×10⁷J/m³ = 0.175m³"},{"id":"g3_physics_014_ex06","knowledge_id":"g3_physics_014","question":"选择题：有两台柴油机，甲的效率是40%，乙的效率是30%，它们分别做相同的有用功，则\nA. 甲消耗的柴油多\nB. 乙消耗的柴油多\nC. 甲、乙消耗的柴油一样多\nD. 无法比较","answer":"答案：B\n解析：由η = W有用 / Q放 = W有用 / (mq)，得m = W有用 / (qη)。\n做相同的有用功W有用，柴油热值q相同，效率η越小，消耗的质量m越大。\n因为乙的效率30% < 甲的效率40%，所以乙消耗的柴油多。"},{"id":"g3_physics_014_ex07","knowledge_id":"g3_physics_014","question":"解答题：某家庭用的燃气热水器，将20kg的水从10℃加热到60℃，完全燃烧了0.21m³的煤气。已知水的比热容为4.2×10³J/(kg·℃)，煤气的热值为4×10⁷J/m³。试求：（1）水吸收的热量是多少？（2）煤气完全燃烧放出的热量是多少？（3）该热水器烧水的效率是多少？","answer":"答案：（1）水吸收热量4.2×10⁶J；（2）煤气放出热量8.4×10⁶J；（3）效率50%\n解析：（1）水吸收的热量：\nQ吸 = cm(t - t₀) = 4.2×10³J/(kg·℃) × 20kg × (60℃ - 10℃)\n     = 4.2×10³ × 20 × 50\n     = 4.2×10⁶J\n\n（2）煤气完全燃烧放出的热量：\nQ放 = Vq = 0.21m³ × 4×10⁷J/m³ = 8.4×10⁶J\n\n（3）热水器烧水的效率：\nη = Q吸 / Q放 × 100% = 4.2×10⁶J / 8.4×10⁶J × 100% = 50%"},{"id":"g3_physics_014_ex08","knowledge_id":"g3_physics_014","question":"选择题：用两个相同的电热器分别给质量相同的水和某种液体加热，每隔1min记录一次温度，如下表所示。已知水的比热容为4.2×10³J/(kg·℃)，则该液体的比热容为\n\n加热时间/min | 0 | 1 | 2\n---|---|---|---\n水的温度/℃ | 20 | 26 | 32\n液体的温度/℃ | 20 | 28 | 36\n\nA. 0.9×10³J/(kg·℃)\nB. 1.8×10³J/(kg·℃)\nC. 3.15×10³J/(kg·℃)\nD. 4.2×10³J/(kg·℃)","answer":"答案：C\n解析：相同电热器相同时间放出相同热量，水和液体质量相同、吸收相同热量（加热1分钟）。\nQ水吸 = Q液吸，即c水mΔt水 = c液mΔt液\nΔt水 = 26℃ - 20℃ = 6℃\nΔt液 = 28℃ - 20℃ = 8℃\n\nc液 = c水 × Δt水 / Δt液 = 4.2×10³J/(kg·℃) × 6℃ / 8℃\n    = 4.2×10³ × 6 / 8\n    = 3.15×10³J/(kg·℃)"},{"id":"g3_physics_014_ex09","knowledge_id":"g3_physics_014","question":"填空题：某辆小汽车行驶100km消耗汽油5kg，这些汽油完全燃烧放出的热量是______J；若该汽车发动机的效率为25%，则行驶100km做的有用功是______J，汽车受到的平均阻力是______N。（汽油的热值q=4.6×10⁷J/kg）","answer":"答案：2.3×10⁸，5.75×10⁷，575\n解析：（1）5kg汽油完全燃烧放出的热量：\nQ放 = mq = 5kg × 4.6×10⁷J/kg = 2.3×10⁸J\n\n（2）有用功：\nW有用 = Q放 × η = 2.3×10⁸J × 25% = 5.75×10⁷J\n\n（3）汽车行驶距离s = 100km = 1×10⁵m\n由W = Fs得牵引力：\nF = W / s = 5.75×10⁷J / 1×10⁵m = 575N\n汽车匀速行驶，阻力f = F = 575N"},{"id":"g3_physics_014_ex10","knowledge_id":"g3_physics_014","question":"解答题：某锅炉用天然气作燃料，已知天然气的热值是4×10⁷J/m³。该锅炉将500kg、20℃的水加热到100℃，消耗了8m³的天然气。求：（1）水吸收的热量；（2）8m³天然气完全燃烧放出的热量；（3）该锅炉的效率；（4）若用效率为60%的煤炉来加热同样的水，需要燃烧多少千克的煤？（煤的热值为3×10⁷J/kg，水的比热容c=4.2×10³J/(kg·℃)）","answer":"答案：（1）水吸热1.68×10⁸J；（2）天然气放热3.2×10⁸J；（3）锅炉效率52.5%；（4）需煤约9.33kg\n解析：（1）水吸收的热量：\nQ吸 = cm(t - t₀) = 4.2×10³J/(kg·℃) × 500kg × (100℃ - 20℃)\n     = 4.2×10³ × 500 × 80\n     = 1.68×10⁸J\n\n（2）8m³天然气完全燃烧放出的热量：\nQ放 = Vq = 8m³ × 4×10⁷J/m³ = 3.2×10⁸J\n\n（3）锅炉的效率：\nη = Q吸 / Q放 × 100% = 1.68×10⁸J / 3.2×10⁸J × 100% = 52.5%\n\n（4）用煤炉加热，水吸收的热量相同，煤完全燃烧放出的热量：\nQ放' = Q吸 / η' = 1.68×10⁸J / 60% = 2.8×10⁸J\n\n需要煤的质量：\nm = Q放' / q煤 = 2.8×10⁸J / 3×10⁷J/kg ≈ 9.33kg"},{"id":"g3_physics_015_ex01","knowledge_id":"g3_physics_015","question":"选择题：用丝绸摩擦过的玻璃棒靠近一个轻质小球，小球被吸引，则小球\nA. 一定带正电\nB. 一定带负电\nC. 一定不带电\nD. 可能带负电，也可能不带电","answer":"答案：D\n解析：丝绸摩擦过的玻璃棒带正电。当带正电的玻璃棒靠近轻质小球时，有两种情况：\n(1) 小球带负电：异种电荷相互吸引，小球被吸引。\n(2) 小球不带电：带电体具有吸引轻小物体的性质，小球也会被吸引。\n所以小球可能带负电，也可能不带电。"},{"id":"g3_physics_015_ex02","knowledge_id":"g3_physics_015","question":"填空题：用毛皮摩擦过的橡胶棒带______电，这是因为橡胶棒在摩擦过程中______（选填\"得到\"或\"失去\"）电子。","answer":"答案：负，得到\n解析：摩擦起电的实质是电子的转移。\n毛皮与橡胶棒摩擦时，毛皮的原子核束缚电子的本领弱，橡胶棒的原子核束缚电子的本领强，所以电子从毛皮转移到橡胶棒上。\n橡胶棒得到电子，电子数多于质子数，所以带负电；毛皮失去电子，带正电。"},{"id":"g3_physics_015_ex03","knowledge_id":"g3_physics_015","question":"选择题：甲、乙、丙三个带电小球，已知甲带正电，甲吸引乙，乙排斥丙，则乙和丙的带电情况是\nA. 乙带正电，丙带负电\nB. 乙带负电，丙带负电\nC. 乙带正电，丙带正电\nD. 乙带负电，丙带正电","answer":"答案：B\n解析：已知甲带正电，甲吸引乙。根据异种电荷相互吸引，乙应该带负电（因为三个小球都带电，所以不用考虑不带电的情况）。\n又因为乙排斥丙，根据同种电荷相互排斥，丙和乙带同种电荷，所以丙也带负电。\n答案：乙带负电，丙带负电。"},{"id":"g3_physics_015_ex04","knowledge_id":"g3_physics_015","question":"判断题：验电器可以检验物体是否带电，还可以直接读出物体所带电荷的多少。（  ）","answer":"答案：错误\n解析：验电器的作用是检验物体是否带电，其工作原理是同种电荷相互排斥。\n当带电体接触验电器的金属球时，就有一部分电荷转移到验电器的金属箔片上，这两片金属箔由于带同种电荷互相排斥而张开。\n验电器只能粗略判断物体是否带电以及带电的多少（通过箔片张开角度大小），但不能直接读出具体的电荷量。"},{"id":"g3_physics_015_ex05","knowledge_id":"g3_physics_015","question":"填空题：原子由位于中心的______和核外的______组成，原子核带______电，电子带______电。通常情况下，原子整体呈______性。","answer":"答案：原子核，电子，正，负，电中\n解析：原子的结构：\n- 原子由位于中心的原子核和核外电子组成。\n- 原子核由质子和中子组成，质子带正电，中子不带电，所以原子核整体带正电。\n- 核外电子带负电，绕原子核高速运动。\n- 通常情况下，原子核所带的正电荷数与核外电子所带的负电荷数相等，所以原子整体呈电中性。"},{"id":"g3_physics_015_ex06","knowledge_id":"g3_physics_015","question":"选择题：下列现象中，不属于摩擦起电的是\nA. 在干燥的天气里脱毛衣时，会听到\"噼啪\"声\nB. 用塑料梳子梳干燥的头发，头发会随梳子飘起来\nC. 用干燥的毛刷刷毛料衣服时，毛刷上吸附着许多脏物\nD. 磁铁吸引铁钉","answer":"答案：D\n解析：摩擦起电是两种不同的物体相互摩擦后，一种物体带正电，另一种物体带负电的现象，本质是电子的转移。\nA选项：干燥天气脱毛衣时的\"噼啪\"声，是毛衣与皮肤摩擦起电后的放电现象，属于摩擦起电。\nB选项：塑料梳子梳干燥的头发，梳子与头发摩擦起电，异种电荷相互吸引，头发随梳子飘起，属于摩擦起电。\nC选项：干燥的毛刷刷毛料衣服，毛刷与衣服摩擦起电，带电的毛刷吸引轻小的脏物，属于摩擦起电。\nD选项：磁铁吸引铁钉是磁现象，是磁体的性质，与摩擦起电无关。"},{"id":"g3_physics_015_ex07","knowledge_id":"g3_physics_015","question":"解答题：将一束扯成线状的塑料捆扎绳，用干净干燥的手自上而下捋几下，会看到什么现象？为什么？","answer":"答案：会看到塑料绳的下端散开，而且捋的次数越多，散开得越大。\n原因：用手自上而下捋塑料绳时，手与塑料绳摩擦，使塑料绳带上了同种电荷。根据同种电荷相互排斥，塑料绳的下端因带同种电荷互相排斥而散开。捋的次数越多，塑料绳带的电荷越多，排斥力越大，散开得就越大。\n解析：这是摩擦起电和电荷间相互作用的典型现象。\n(1) 摩擦起电：手与塑料绳是不同物质，相互摩擦时发生电子转移，使塑料绳带电。\n(2) 同种电荷相互排斥：塑料绳各条线带同种电荷，互相排斥而散开。\n(3) 电荷量越多，排斥力越大：捋的次数越多，转移的电子越多，带电量越大，排斥力越大，散开越明显。"},{"id":"g3_physics_015_ex08","knowledge_id":"g3_physics_015","question":"选择题：一个带正电的物体接触验电器的金属球后，验电器的金属箔片张开，这是因为\nA. 物体上的质子转移到验电器上\nB. 物体上的电子转移到验电器上\nC. 验电器上的电子转移到物体上\nD. 验电器上的质子转移到物体上","answer":"答案：C\n解析：带正电的物体是因为失去了电子，缺少电子。\n当带正电的物体接触验电器的金属球时，验电器上的电子会被吸引到带正电的物体上（因为异种电荷相互吸引）。\n验电器失去电子后，金属箔片带上了正电，由于同种电荷相互排斥，金属箔片张开。\n注意：在金属导体中，能够自由移动的是电子（负电荷），质子（正电荷）在原子核内，不能自由移动。所以是电子从验电器转移到物体上。"},{"id":"g3_physics_015_ex09","knowledge_id":"g3_physics_015","question":"填空题：电荷间的相互作用规律是：同种电荷相互______，异种电荷相互______。验电器是利用______的原理制成的。","answer":"答案：排斥，吸引，同种电荷相互排斥\n解析：\n(1) 同种电荷相互排斥：两个带正电的物体靠近时会互相推开，两个带负电的物体靠近时也会互相推开。\n(2) 异种电荷相互吸引：带正电的物体和带负电的物体靠近时会互相吸引。\n(3) 验电器的工作原理：当带电体接触验电器的金属球时，电荷转移到金属箔片上，两片金属箔带同种电荷，由于同种电荷相互排斥而张开。箔片张开角度越大，说明带电量越多。"},{"id":"g3_physics_015_ex10","knowledge_id":"g3_physics_015","question":"判断题：摩擦起电创造了电荷，使原来不带电的物体带上了电。（  ）","answer":"答案：错误\n解析：摩擦起电并不是创造了电荷，而是电荷（电子）从一个物体转移到另一个物体上。\n两个不同的物体相互摩擦时，原子核束缚电子本领强的物体得到电子，因多余电子而带负电；原子核束缚电子本领弱的物体失去电子，因缺少电子而带正电。\n摩擦起电的实质是电子的转移，电荷的总量保持不变。得到的电子数等于失去的电子数，所以两个相互摩擦的物体总是带等量的异种电荷。"},{"id":"g3_physics_016_ex01","knowledge_id":"g3_physics_016","question":"选择题：关于电流的形成，下列说法正确的是\nA. 电荷的移动就能形成电流\nB. 只有正电荷的定向移动才能形成电流\nC. 只有自由电子的定向移动才能形成电流\nD. 正、负电荷的定向移动都能形成电流","answer":"答案：D\n解析：电流是电荷的定向移动形成的。\n(1) 电荷必须是\"定向移动\"才能形成电流，无规则的热运动不能形成电流，所以A错误。\n(2) 形成电流的电荷可以是正电荷，也可以是负电荷，还可以是正负电荷同时向相反方向定向移动。\n  - 金属导体中，是自由电子（负电荷）定向移动形成电流。\n  - 电解质溶液中，正负离子同时向相反方向定向移动形成电流。\n所以B和C错误，D正确。"},{"id":"g3_physics_016_ex02","knowledge_id":"g3_physics_016","question":"填空题：电流的物理量符号是______，国际单位是______，简称______，符号是______。1 A = ______ mA = ______ μA。","answer":"答案：I，安培，安，A，10³，10⁶\n解析：\n(1) 电流的物理量符号是 I，来自英文单词 Current（电流）的首字母。\n(2) 电流的国际单位是安培，简称安，符号是A，为了纪念法国物理学家安培。\n(3) 常用的电流单位还有毫安(mA)、微安(μA)等。\n换算关系：\n  1 A = 1000 mA = 10³ mA\n  1 mA = 1000 μA = 10³ μA\n  1 A = 10⁶ μA"},{"id":"g3_physics_016_ex03","knowledge_id":"g3_physics_016","question":"选择题：某家用电器正常工作时的电流约为0.2 A，则它可能是\nA. 家用空调\nB. 家用冰箱\nC. 日光灯\nD. 家用电磁炉","answer":"答案：C\n解析：常见家用电器的工作电流（家庭电路电压220 V）：\nA. 家用空调：约5 A~10 A（功率约1000 W~2000 W）\nB. 家用冰箱：约1 A左右（功率约200 W）\nC. 日光灯（40 W）：约0.18 A，约0.2 A（P=UI，I=P/U=40W/220V≈0.18A）\nD. 家用电磁炉：约5 A~10 A（功率约1000 W~2000 W）\n所以工作电流约为0.2 A的是日光灯。"},{"id":"g3_physics_016_ex04","knowledge_id":"g3_physics_016","question":"判断题：电路中只要有电源，就一定有电流。（  ）","answer":"答案：错误\n解析：电路中形成持续电流的条件有两个，缺一不可：\n(1) 要有电源（提供电压，使电荷能够定向移动）；\n(2) 电路必须是通路（电路处处连通，电荷才能持续移动）。\n只有电源但电路是断路（断开的），电荷不能持续定向移动，就不会有持续电流。\n所以\"有电源就一定有电流\"的说法是错误的。"},{"id":"g3_physics_016_ex05","knowledge_id":"g3_physics_016","question":"填空题：电流等于______内通过导体横截面的______。计算公式是______，其中Q的单位是______，t的单位是______，I的单位是______。","answer":"答案：单位时间，电荷量，I = Q/t，库仑(C)，秒(s)，安培(A)\n解析：\n电流的定义：单位时间内通过导体横截面的电荷量叫做电流。\n公式：I = Q/t\n其中：\n- I表示电流，单位是安培(A)\n- Q表示电荷量，单位是库仑(C)\n- t表示时间，单位是秒(s)\n物理意义：1 A = 1 C/s，即1秒内通过导体横截面的电荷量是1库仑时，电流就是1安培。"},{"id":"g3_physics_016_ex06","knowledge_id":"g3_physics_016","question":"选择题：在1分钟内通过某导体横截面的电荷量是18 C，则通过该导体的电流是\nA. 18 A\nB. 0.3 A\nC. 0.18 A\nD. 3 A","answer":"答案：B\n解析：已知：Q = 18 C，t = 1 min = 60 s\n根据电流的定义式 I = Q/t\n代入数据：I = 18 C / 60 s = 0.3 A\n所以通过该导体的电流是0.3 A。\n注意：计算时时间单位要换算成秒，电荷量单位是库仑，这样得到的电流单位才是安培。"},{"id":"g3_physics_016_ex07","knowledge_id":"g3_physics_016","question":"解答题：一个灯泡正常工作时的电流是0.5 A，那么10分钟内通过灯丝横截面的电荷量是多少库仑？相当于多少个电子所带的电荷量？（已知一个电子的电荷量为1.6×10⁻¹⁹ C）","answer":"答案：10分钟内通过灯丝横截面的电荷量是300 C，相当于1.875×10²¹个电子所带的电荷量。\n解析：\n(1) 计算电荷量：\n已知：I = 0.5 A，t = 10 min = 10×60 s = 600 s\n由 I = Q/t 得：\nQ = It = 0.5 A × 600 s = 300 C\n\n(2) 计算电子个数：\n已知一个电子的电荷量 e = 1.6×10⁻¹⁹ C\n电子个数 n = Q/e = 300 C / (1.6×10⁻¹⁹ C) = 1.875×10²¹（个）\n\n答：10分钟内通过灯丝横截面的电荷量是300 C，相当于1.875×10²¹个电子所带的电荷量。"},{"id":"g3_physics_016_ex08","knowledge_id":"g3_physics_016","question":"选择题：关于电流的方向，下列说法正确的是\nA. 正电荷移动的方向就是电流方向\nB. 自由电子定向移动的方向与电流方向相反\nC. 金属导体中电流方向与自由电子定向移动方向相同\nD. 只有正电荷定向移动才能形成电流，所以电流方向就是正电荷移动方向","answer":"答案：B\n解析：\n物理学规定：正电荷定向移动的方向为电流的方向。\nA选项：必须是\"定向移动\"的方向，无规则移动不能算电流方向，A错误。\nB选项：自由电子带负电，负电荷定向移动的方向与电流方向相反，所以自由电子定向移动的方向与电流方向相反，B正确。\nC选项：金属导体中是自由电子（负电荷）定向移动形成电流，电流方向与自由电子定向移动方向相反，C错误。\nD选项：正、负电荷的定向移动都能形成电流，只是电流方向规定为正电荷定向移动的方向，D错误。"},{"id":"g3_physics_016_ex09","knowledge_id":"g3_physics_016","question":"填空题：在电源外部，电流的方向是从电源______经过用电器流向电源______；在电源内部，电流的方向是从电源______流向电源______。","answer":"答案：正极，负极，负极，正极\n解析：\n在电路中，电流的方向：\n(1) 电源外部（外电路）：电流从电源的正极流出，经过开关、用电器、导线等，流回电源的负极。\n(2) 电源内部（内电路）：电流从电源的负极流向正极，形成闭合回路。\n整个电路中，电流的方向是：正极→用电器→负极（外电路），负极→正极（内电路），这样形成一个完整的闭合回路。\n注意：金属导体中实际是自由电子（负电荷）在移动，方向与电流方向相反，即外电路中电子从负极流向正极。"},{"id":"g3_physics_016_ex10","knowledge_id":"g3_physics_016","question":"判断题：电流越大，说明通过导体横截面的电荷量越多。（  ）","answer":"答案：错误\n解析：电流的大小等于单位时间内通过导体横截面的电荷量，即 I = Q/t。\n电流的大小由两个因素决定：通过的电荷量Q和所用的时间t。\n如果电流大但时间很短，通过的电荷量不一定多；反之，电流小但时间很长，通过的电荷量也可能很多。\n正确的说法应该是：在相同时间内，电流越大，通过导体横截面的电荷量越多。\n或者说：通过导体横截面的电荷量越多，且时间越短，电流才越大。\n所以只说电流大就电荷量多是不严谨的，忽略了时间因素。"},{"id":"g3_physics_017_ex01","knowledge_id":"g3_physics_017","question":"选择题：下列器件中，全部属于用电器的是\nA. 电池、电铃、白炽灯\nB. 电熨斗、电风扇、电视机\nC. 发电机、电动机、收音机\nD. 干电池、电烤箱、节能灯","answer":"答案：B\n解析：电路由电源、用电器、开关、导线四部分组成。\n用电器是消耗电能的装置，将电能转化为其他形式的能。\n电源是提供电能的装置，将其他形式的能转化为电能。\nA选项：电池是电源，不是用电器，错误。\nB选项：电熨斗、电风扇、电视机都是消耗电能的用电器，正确。\nC选项：发电机是电源（将机械能转化为电能），不是用电器，错误。\nD选项：干电池是电源，不是用电器，错误。"},{"id":"g3_physics_017_ex02","knowledge_id":"g3_physics_017","question":"填空题：一个完整的电路由______、______、______和______四部分组成。其中，提供电能的是______，消耗电能的是______，控制电路通断的是______，输送电能的是______。","answer":"答案：电源，用电器，开关，导线，电源，用电器，开关，导线\n解析：\n一个完整的电路由四部分组成：\n(1) 电源：提供电能的装置，将其他形式的能转化为电能。如干电池（化学能→电能）、发电机（机械能→电能）、太阳能电池（太阳能→电能）等。\n(2) 用电器：消耗电能的装置，将电能转化为其他形式的能。如电灯（电能→光能和内能）、电铃（电能→机械能）、电动机（电能→机械能）等。\n(3) 开关：控制电路的通断。\n(4) 导线：连接电路各部分，输送电能。\n这四部分缺一不可，缺少任何一部分都不能构成完整的电路。"},{"id":"g3_physics_017_ex03","knowledge_id":"g3_physics_017","question":"选择题：关于短路，下列说法正确的是\nA. 短路就是电路中没有连接用电器\nB. 电源短路是危险的，会烧坏电源\nC. 用电器短路是危险的，会烧坏用电器\nD. 短路时电流很小，不会有危险","answer":"答案：B\n解析：短路分为电源短路和用电器短路两种：\n(1) 电源短路：直接用导线将电源的正、负极连接起来。\n  - 特点：电流不经过用电器，直接从电源正极回到负极。\n  - 危害：电路中电流很大，会烧坏电源，甚至引起火灾，非常危险。\n  - 绝对不允许电源短路。\n\n(2) 用电器短路（局部短路）：用导线直接连接某个用电器的两端。\n  - 特点：电流不经过被短路的用电器，而是从导线通过。\n  - 后果：被短路的用电器不工作，但不会烧坏（因为没有电流通过）。\n  - 如果电路中还有其他用电器，其他用电器可能会因为电流过大而烧坏。\n\nA选项：短路不是没有用电器，而是电流不经过用电器，错误。\nB选项：电源短路电流很大，会烧坏电源，正确。\nC选项：用电器短路时该用电器不工作，但不会被烧坏（没有电流通过），错误。\nD选项：短路时电流很大，有危险，错误。"},{"id":"g3_physics_017_ex04","knowledge_id":"g3_physics_017","question":"判断题：电路处于通路状态时，用电器一定在工作。（  ）","answer":"答案：正确\n解析：电路的三种状态：通路、断路、短路。\n通路是指处处连通的电路。\n当电路处于通路状态时，电路中有持续电流，电流经过用电器，用电器就会工作（消耗电能，将电能转化为其他形式的能）。\n如果电路是断路，电路中没有电流，用电器不工作。\n如果是电源短路，虽然有电流，但电流不经过用电器，用电器也不工作，而且非常危险。\n所以通路时用电器一定在工作的说法是正确的。"},{"id":"g3_physics_017_ex05","knowledge_id":"g3_physics_017","question":"填空题：电路的三种状态是______、______和______。其中，处处连通的电路叫做______，某处断开的电路叫做______，直接用导线把电源两极连接起来的电路叫做______。","answer":"答案：通路，断路，短路，通路，断路，电源短路\n解析：\n电路的三种状态：\n(1) 通路（闭合电路）：处处连通的电路。电路中有电流，用电器工作。\n(2) 断路（开路）：某处断开的电路。电路中没有电流，用电器不工作。\n  - 造成断路的原因：开关断开、导线断了、用电器坏了、接触不良等。\n(3) 短路：电流不经过用电器而直接构成回路。\n  - 电源短路：直接用导线连电源两极，电流很大，会烧坏电源，绝对不允许。\n  - 用电器短路（局部短路）：用导线连用电器两端，该用电器不工作。\n\n注意：短路不是没有电流，而是电流没有经过应该经过的用电器。"},{"id":"g3_physics_017_ex06","knowledge_id":"g3_physics_017","question":"选择题：在如图所示的电路中，开关S闭合后，灯泡L能发光的是\nA. 只有电池、开关、灯泡串联的完整电路\nB. 电池正极直接连灯泡，灯泡另一端通过开关连电池负极\nC. 电池两端直接用导线连接，灯泡并联在导线上\nD. 电池正极连开关，开关另一端直接连电池负极，灯泡并联在开关两端","answer":"答案：B\n解析：要使灯泡发光，必须有持续电流通过灯泡，即电路必须是通路，且电流经过灯泡。\nA选项：表述太模糊，而且说\"只有...\"不太准确。\nB选项：电池正极→灯泡→开关→电池负极，构成完整通路，电流经过灯泡，灯泡发光，正确。\nC选项：电池两端直接用导线连接，这是电源短路，同时灯泡被短路，电流不经过灯泡，灯泡不发光，而且电源短路很危险，错误。\nD选项：灯泡并联在开关两端，当开关闭合后，开关相当于导线，灯泡被短路，电流不经过灯泡，灯泡不发光，错误。\n\n所以正确答案是B。"},{"id":"g3_physics_017_ex07","knowledge_id":"g3_physics_017","question":"解答题：小明连接了一个由两节干电池、一个小灯泡、一个开关和若干导线组成的电路。当他闭合开关后，小灯泡不亮。请分析可能的原因有哪些？（至少写出5种）","answer":"答案：小灯泡不亮的原因可能有以下几种：\n(1) 小灯泡的灯丝断了（灯泡坏了），电路断路，没有电流。\n(2) 电池没电了（或电池装反了，或电池接触不良），电路中没有电源提供电压。\n(3) 开关接触不良，电路断路，没有电流。\n(4) 导线断了，或者导线连接处接触不良，电路断路。\n(5) 小灯泡的灯座接触不良，电路断路。\n(6) 电池的正负极接反虽然不会导致不亮（直流电灯泡不分正负极），但如果是多节电池，部分装反会导致总电压降低，可能不亮。\n(7) 如果电路中出现了小灯泡被短路的情况（比如导线直接连在灯泡两端），电流不经过灯泡，灯泡也不亮。\n\n解析：灯泡不亮说明没有电流通过灯泡，原因主要从两方面考虑：\n一是电路断路（某处断开），没有电流；\n二是灯泡被短路，电流不经过灯泡。\n另外，电源本身有问题（没电、电压太低）也会导致灯泡不亮。\n分析故障时可以从电源→开关→用电器→导线依次排查。"},{"id":"g3_physics_017_ex08","knowledge_id":"g3_physics_017","question":"选择题：下列关于电源的说法中，正确的是\nA. 电源是创造电能的装置\nB. 电源是消耗电能的装置\nC. 电源是将其他形式的能转化为电能的装置\nD. 电源是将电能转化为其他形式的能的装置","answer":"答案：C\n解析：电源的作用是提供电能，但电源不是创造电能。根据能量守恒定律，能量既不会凭空产生，也不会凭空消失，只能从一种形式转化为另一种形式，或者从一个物体转移到另一个物体。\n电源是将其他形式的能转化为电能的装置：\n- 干电池、蓄电池：化学能→电能\n- 发电机：机械能→电能\n- 太阳能电池：太阳能（光能）→电能\n- 燃料电池：化学能→电能\n\nA选项：电源不能创造电能，只是能量转化，错误。\nB选项：消耗电能的是用电器，不是电源，错误。\nC选项：电源是将其他形式的能转化为电能的装置，正确。\nD选项：将电能转化为其他形式能的是用电器，错误。"},{"id":"g3_physics_017_ex09","knowledge_id":"g3_physics_017","question":"判断题：在电路中，开关必须接在电源正极和用电器之间才能控制用电器。（  ）","answer":"答案：错误\n解析：开关的作用是控制电路的通断。\n在串联电路中，开关接在电路中的任何位置，都能控制整个电路的通断。因为串联电路只有一条电流路径，只要在任何一处断开，整个电路就没有电流了。\n开关接在电源正极和用电器之间（靠近正极），或者接在用电器和电源负极之间（靠近负极），效果是一样的，都能控制用电器的工作。\n\n但是在家庭电路中，开关要接在火线上，这是出于安全考虑（断开开关后，用电器不带电），不是因为接在别处不能控制。\n\n所以\"必须接在电源正极和用电器之间\"的说法是错误的。"},{"id":"g3_physics_017_ex10","knowledge_id":"g3_physics_017","question":"选择题：某同学将一个完好的小灯泡接在一节新干电池两端，发现灯泡不亮，用电压表测量灯泡两端电压，示数接近1.5 V。则故障原因可能是\nA. 灯泡短路\nB. 灯泡断路\nC. 电源没电了\nD. 开关接触不良","answer":"答案：B\n解析：\n已知：一节新干电池电压约1.5 V，灯泡不亮，但灯泡两端有电压，接近电源电压1.5 V。\n\n分析各选项：\nA. 灯泡短路：如果灯泡短路，灯泡相当于导线，两端电压应该为0，而不是1.5 V，错误。\nB. 灯泡断路：如果灯泡灯丝断了（断路），电路中没有电流，灯泡不亮。但电压表通过其他完好的部分连接到电源两极，测的是电源电压，所以示数接近1.5 V，正确。\nC. 电源没电了：如果电源没电，电压会远低于1.5 V，错误。\nD. 开关接触不良：如果开关接触不良（断路），灯泡两端不会有电压（因为电压表的一个接线柱无法通过开关连接到电源），错误。\n\n所以故障原因是灯泡断路。"},{"id":"g3_physics_018_ex01","knowledge_id":"g3_physics_018","question":"选择题：下列关于串联电路的说法中，错误的是\nA. 各用电器是逐个顺次连接起来的\nB. 电流只有一条路径\nC. 一个开关可以控制所有用电器\nD. 各用电器可以独立工作，互不影响","answer":"答案：D\n解析：串联电路的特点：\n(1) 连接方式：各用电器逐个顺次连接，首尾相连。\n(2) 电流路径：电流只有一条路径，从电源正极出发，依次经过每个用电器，最后回到电源负极。\n(3) 用电器关系：各用电器互相影响，一个用电器坏了（断路），其他用电器都不能工作。\n(4) 开关作用：一个开关可以控制整个电路，开关在任何位置作用都一样。\n\nA、B、C都是串联电路的特点，正确。\nD选项：各用电器可以独立工作、互不影响，这是并联电路的特点，不是串联电路的特点，所以D错误。"},{"id":"g3_physics_018_ex02","knowledge_id":"g3_physics_018","question":"填空题：串联电路中，电流有______条路径，各用电器互相______；并联电路中，电流有______条路径，各支路用电器互相______。","answer":"答案：一，影响，多，不影响\n解析：\n串联电路：\n- 电流只有一条路径，从电源正极经所有用电器回到负极。\n- 各用电器互相影响：一个用电器断路，整个电路断路，其他用电器也不工作。\n- 一个开关控制整个电路。\n\n并联电路：\n- 电流有两条或多条路径，分为干路和支路。\n- 各支路用电器互不影响：一条支路断路，其他支路仍正常工作。\n- 干路开关控制整个电路，支路开关只控制本支路。\n\n判断串并联的常用方法：\n(1) 电流法：看电流有几条路径，一条是串联，多条是并联。\n(2) 断路法：拆除一个用电器，看其他是否还工作，不工作是串联，仍工作是并联。"},{"id":"g3_physics_018_ex03","knowledge_id":"g3_physics_018","question":"选择题：教室里的日光灯之间的连接方式是\nA. 一定是串联\nB. 一定是并联\nC. 可能是串联，也可能是并联\nD. 无法判断","answer":"答案：B\n解析：教室里的日光灯之间是并联的。\n原因：\n(1) 并联电路各支路用电器互不影响。如果其中一盏日光灯坏了，其他日光灯仍能正常工作。如果是串联，一盏坏了，全部都不亮，显然不符合实际情况。\n(2) 家庭电路的电压是220 V，日光灯的额定电压也是220 V。并联电路各支路两端电压相等，都等于电源电压，这样每盏灯都能在额定电压下正常工作。如果是串联，每盏灯分得的电压低于220 V，不能正常发光。\n\n补充：家庭电路中的用电器（电灯、电视机、电冰箱、洗衣机等）都是并联的。\n开关与它控制的用电器之间是串联的。"},{"id":"g3_physics_018_ex04","knowledge_id":"g3_physics_018","question":"判断题：在并联电路中，干路的开关只控制干路，对各支路没有影响。（  ）","answer":"答案：错误\n解析：在并联电路中，开关分为干路开关和支路开关：\n(1) 干路开关：在干路上，控制整个电路（所有支路）。干路开关断开，整个电路断路，所有支路的用电器都不工作。\n(2) 支路开关：在支路上，只控制本支路。支路开关断开，只有本支路的用电器不工作，其他支路的用电器仍正常工作。\n\n题目说\"干路的开关只控制干路，对各支路没有影响\"，这是错误的。干路开关控制整个电路，对所有支路都有控制作用。\n正确的说法应该是：干路开关控制整个电路（所有支路），支路开关只控制本支路。"},{"id":"g3_physics_018_ex05","knowledge_id":"g3_physics_018","question":"填空题：街道上的路灯同时亮同时灭，它们的连接方式是______，因为______。","answer":"答案：并联，其中一盏灯坏了，其他灯仍能正常工作（或各灯互不影响）\n解析：街道上的路灯是并联的。\n虽然路灯同时亮同时灭，但这是因为开关在干路上（总开关），控制所有路灯。\n判断并联的依据：其中一盏灯坏了（灯丝断了），其他路灯仍能正常发光，说明各路灯之间互不影响，这是并联电路的特点。\n\n如果是串联，一盏灯坏了，全部都不亮，那就不符合实际需求了——不能因为一盏路灯坏了整条街都黑了。\n\n类似的例子：\n- 家庭电路中的用电器都是并联的。\n- 节日里装饰用的小彩灯，有些是串联的（因为额定电压小，需要串联分压）。\n注意区分实际情况。"},{"id":"g3_physics_018_ex06","knowledge_id":"g3_physics_018","question":"选择题：有三盏灯，若取下任意一盏，另外两盏都不发光，则这三盏灯的连接方式是\nA. 一定是串联\nB. 一定是并联\nC. 可能是串联，也可能是混联\nD. 可能是并联，也可能是混联","answer":"答案：A\n解析：\n分析题意：取下任意一盏灯，另外两盏都不发光，说明任意一盏灯都影响其他两盏灯，各用电器互相影响。\n\n串联电路的特点：各用电器互相影响，一个用电器断路，其他都不工作。符合题意。\n\n并联电路的特点：各支路互不影响，取下一条支路的用电器，其他支路仍正常工作。不符合题意。\n\n混联（既有串联又有并联）：如果是两盏并联再与第三盏串联，那么取下并联部分的一盏，另一盏和第三盏仍能工作，不符合\"取下任意一盏，另外两盏都不发光\"的条件。\n\n所以只有串联才能满足\"取下任意一盏，另外两盏都不发光\"的条件。答案选A。"},{"id":"g3_physics_018_ex07","knowledge_id":"g3_physics_018","question":"解答题：一个开关同时控制两盏灯，这两盏灯的连接方式是怎样的？请画出可能的电路图，并说明判断方法。","answer":"答案：这两盏灯可能是串联，也可能是并联。\n\n情况一：两盏灯串联，开关在电路中任何位置都能同时控制两盏灯。\n电路图：电源正极→开关→灯L1→灯L2→电源负极。\n特点：电流只有一条路径，取下一盏灯，另一盏也不亮。\n\n情况二：两盏灯并联，开关在干路上，也能同时控制两盏灯。\n电路图：电源正极→开关→分支点→灯L1→汇合点→电源负极，同时分支点→灯L2→汇合点。\n特点：电流有两条路径，取下一盏灯，另一盏仍正常发光。\n\n判断方法（验证是串联还是并联）：\n取下其中一盏灯，看另一盏灯是否还发光。\n- 如果另一盏灯不发光，说明两灯互相影响，是串联。\n- 如果另一盏灯仍发光，说明两灯互不影响，是并联。\n\n解析：一个开关控制两盏灯有两种可能：\n(1) 串联：开关在任何位置都控制整个电路。\n(2) 并联：开关在干路上，控制所有支路。\n不能仅凭\"一个开关控制两盏灯\"就判断是串联还是并联，需要根据用电器是否互相影响来判断。"},{"id":"g3_physics_018_ex08","knowledge_id":"g3_physics_018","question":"选择题：关于并联电路，下列说法正确的是\nA. 并联电路中，各用电器两端的电压不一定相等\nB. 并联电路中，干路的电流等于各支路电流之和\nC. 并联电路中，各支路的电阻一定相等\nD. 并联电路中，各支路的电流一定相等","answer":"答案：B\n解析：并联电路的特点：\n(1) 电流路径：有两条或多条路径，分为干路和支路。\n(2) 电压特点：各支路两端的电压相等，都等于电源电压。所以A错误。\n(3) 电流特点：干路电流等于各支路电流之和（I干 = I1 + I2 + ... + In）。所以B正确。\n(4) 用电器关系：各支路互不影响。\n(5) 电阻特点：并联总电阻比任何一个分电阻都小。\n\nC选项：各支路的电阻不一定相等，可以相同（相同规格的用电器），也可以不同，错误。\nD选项：各支路电流不一定相等。只有当各支路用电器规格相同时，电流才相等；规格不同，电流不同。根据I=U/R，电压相同，电阻不同，电流不同。错误。\n\n所以正确答案是B。"},{"id":"g3_physics_018_ex09","knowledge_id":"g3_physics_018","question":"填空题：在并联电路中，干路中的开关控制______，支路中的开关控制______。串联电路中，开关的位置改变，它的控制作用______。","answer":"答案：整个电路（所有用电器），本支路的用电器，不变\n解析：\n串联电路：\n- 电流只有一条路径，开关在任何位置都能控制整个电路。\n- 开关的位置改变，控制作用不变（都是控制所有用电器）。\n\n并联电路：\n- 干路开关：控制整个电路（所有支路的用电器）。\n- 支路开关：只控制本支路的用电器，对其他支路没有影响。\n\n举例：\n家里的总开关（在干路上）控制所有用电器；\n各个房间的灯的开关（在支路上）只控制本房间的灯。"},{"id":"g3_physics_018_ex10","knowledge_id":"g3_physics_018","question":"判断题：节日里装饰用的小彩灯，一个坏了其他都不亮，它们是并联的。（  ）","answer":"答案：错误\n解析：一个彩灯坏了其他都不亮，说明各用电器互相影响，这是串联电路的特点。\n\n节日小彩灯通常是串联的，原因：\n(1) 每个小彩灯的额定电压很小（一般只有几伏），而家庭电路电压是220 V，需要将很多个小彩灯串联起来，利用串联分压的原理，使每个彩灯分得的电压等于它的额定电压，才能正常工作。\n(2) 串联电路各用电器互相影响，一个坏了，全部都不亮。\n\n并联的特点是各支路互不影响，一个坏了，其他的仍正常工作。\n\n题目说\"一个坏了其他都不亮，它们是并联的\"，这是错误的，应该是串联的。"},{"id":"g3_physics_019_ex01","knowledge_id":"g3_physics_019","question":"选择题：关于电流表的使用，下列说法正确的是\nA. 电流表要并联在被测电路中\nB. 电流要从电流表的负接线柱流入，正接线柱流出\nC. 电流表可以直接接在电源的两极上\nD. 测量前要先估计被测电流的大小，选择合适的量程","answer":"答案：D\n解析：电流表的使用规则：\n(1) 电流表必须串联在被测电路中。因为电流表内阻很小，并联的话相当于短路，会烧坏电流表。所以A错误。\n(2) 电流要从正接线柱流入，从负接线柱流出（\"正进负出\"）。如果接反了，指针会反向偏转，可能损坏电流表。所以B错误。\n(3) 绝对不允许不经过用电器而把电流表直接接在电源的两极上。因为电流表内阻很小，直接接在电源两极相当于短路，电流很大，会烧坏电流表和电源。所以C错误。\n(4) 测量前要先估计被测电流的大小，选择合适的量程。如果无法估计，要先用大量程试触。所以D正确。"},{"id":"g3_physics_019_ex02","knowledge_id":"g3_physics_019","question":"填空题：实验室常用的电流表有______个接线柱，______个量程。当使用\"-\"和\"0.6\"两个接线柱时，量程是______，分度值是______；当使用\"-\"和\"3\"两个接线柱时，量程是______，分度值是______。","answer":"答案：三，两，0～0.6 A，0.02 A，0～3 A，0.1 A\n解析：\n实验室常用的电流表（学生用电流表）有三个接线柱：\n- 一个负接线柱（\"-\"）\n- 两个正接线柱（\"0.6\"和\"3\"）\n\n电流表有两个量程：\n(1) 0～0.6 A量程：使用\"-\"和\"0.6\"接线柱。\n  - 每大格0.2 A，每大格分10小格\n  - 分度值 = 0.2 A / 10 = 0.02 A\n\n(2) 0～3 A量程：使用\"-\"和\"3\"接线柱。\n  - 每大格1 A，每大格分10小格\n  - 分度值 = 1 A / 10 = 0.1 A\n\n注意：两个量程的分度值是5倍关系（0.1 A是0.02 A的5倍），读数时要先确认量程。"},{"id":"g3_physics_019_ex03","knowledge_id":"g3_physics_019","question":"选择题：某同学用电流表测电流时，发现指针反向偏转，这是因为\nA. 电流表量程选小了\nB. 电流表量程选大了\nC. 电流表的正、负接线柱接反了\nD. 电流表串联在电路中了","answer":"答案：C\n解析：电流表使用时常见的问题：\n\n(1) 指针反向偏转（向左偏）：原因是电流表的正、负接线柱接反了，电流从负接线柱流入、正接线柱流出。此时应立即断开开关，调换接线柱。对应选项C正确。\n\n(2) 指针偏转角度太小（超过0但很小）：原因是量程选大了，测量值较小，应该换用小量程提高精确度。\n\n(3) 指针偏转超过最大刻度（打表现象）：原因是量程选小了，被测电流超过了电流表的量程，应该换用大量程，或者检查电路是否有短路。\n\n(4) 指针不偏转（示数为0）：原因可能是电路断路，或者电流表被短路。\n\nD选项：电流表本来就应该串联在电路中，这不是指针反向偏转的原因。\n\n所以答案是C。"},{"id":"g3_physics_019_ex04","knowledge_id":"g3_physics_019","question":"判断题：电流表可以直接接在电源两极上测量电源的电流。（  ）","answer":"答案：错误\n解析：绝对不允许不经过用电器而把电流表直接接在电源的两极上。\n原因：电流表的内阻非常小（几乎相当于一根导线），如果直接接在电源两极上，根据欧姆定律I=U/R，电源电压U不变，电阻R极小，那么电路中的电流I会非常大，造成电源短路，会烧坏电流表和电源，甚至引起火灾，非常危险。\n\n类比：电流表相当于一根导线，直接接电源两极就是电源短路。\n\n对比：电压表可以直接接在电源两极上，因为电压表内阻很大，电流很小，不会短路。\n\n所以电流表不能直接接在电源两极上，题目说法错误。"},{"id":"g3_physics_019_ex05","knowledge_id":"g3_physics_019","question":"填空题：用电流表测量某电路中的电流时，如果事先不能估计电流的大小，应该先选用______量程进行______，如果指针的偏转在小量程范围内，再改用______量程，这样可以提高测量的______。","answer":"答案：大，试触，小，准确度（或精确程度）\n解析：\n电流表使用前要选择合适的量程：\n(1) 如果能估计被测电流的大小，选择略大于被测电流的量程，这样测量更准确。\n(2) 如果不能估计被测电流的大小，要先用大量程进行试触：\n  - 试触方法：将电流表的一个接线柱接好，用另一个接线柱快速碰一下电流表的大量程接线柱，观察指针偏转情况。\n  - 如果指针偏转很小（在小量程范围内），说明电流小，应该换用小量程，这样分度值更小，测量更准确。\n  - 如果指针偏转超过小量程但在大量程范围内，就用大量程。\n  - 如果指针偏转超过最大刻度，说明电流过大，需要换用更大量程的电流表，或者检查电路。\n\n试触的目的：选择合适的量程，保护电流表，提高测量准确度。"},{"id":"g3_physics_019_ex06","knowledge_id":"g3_physics_019","question":"选择题：某同学用0～3 A量程测量电流，读数时却按0～0.6 A量程读成了0.24 A，则实际电流是\nA. 0.24 A\nB. 1.2 A\nC. 0.48 A\nD. 2.4 A","answer":"答案：B\n解析：电流表的两个量程（0～0.6 A和0～3 A）使用同一个表盘，只是量程和分度值不同。\n两个量程的关系：\n- 0～3 A量程的分度值是0.1 A\n- 0～0.6 A量程的分度值是0.02 A\n- 3 A是0.6 A的5倍，所以大量程的读数是小量程读数的5倍。\n\n题目中：实际使用的是0～3 A量程，但按0～0.6 A量程读成了0.24 A。\n实际电流 = 小量程读数 × 5 = 0.24 A × 5 = 1.2 A\n\n验证：指针位置对应0.24 A（小量程），对应的格数 = 0.24 A / 0.02 A = 12格。\n用大量程读数：12格 × 0.1 A/格 = 1.2 A。\n\n所以答案是B。"},{"id":"g3_physics_019_ex07","knowledge_id":"g3_physics_019","question":"解答题：小红在做\"用电流表测电流\"的实验中，闭合开关后发现电流表指针如图所示（指针超出最大刻度向右偏）。请分析：\n(1) 出现这种现象的原因是什么？\n(2) 应该采取什么措施？\n(3) 如果指针反向偏转，原因又是什么？应怎样改正？","answer":"答案：\n(1) 指针超出最大刻度向右偏的原因：被测电流超过了电流表所选的量程（量程选小了）。\n\n(2) 采取的措施：断开开关，换用量程更大的电流表（或改用电流表的大量程）。如果是双量程电流表，把接线柱从\"0.6\"换到\"3\"。\n\n(3) 如果指针反向偏转（向左偏），原因是电流表的正、负接线柱接反了，电流从负接线柱流入、正接线柱流出。\n改正方法：断开开关，将电流表的两个接线柱的导线对调（交换位置），使电流从正接线柱流入，负接线柱流出。\n\n解析：电流表使用时常见问题总结：\n- 指针右偏超过量程：量程选小了 → 换大量程\n- 指针偏转角度太小：量程选大了 → 换小量程（提高精度）\n- 指针反向偏转：正负接线柱接反 → 调换接线柱\n- 指针不动（示数为0）：电路断路或电流表被短路 → 检查电路"},{"id":"g3_physics_019_ex08","knowledge_id":"g3_physics_019","question":"选择题：用电流表测灯泡L中的电流，下列接法正确的是\nA. 电流表与L串联，电流从\"+\"进\"-\"出\nB. 电流表与L并联，电流从\"+\"进\"-\"出\nC. 电流表与L串联，电流从\"-\"进\"+\"出\nD. 电流表与L并联，电流从\"-\"进\"+\"出","answer":"答案：A\n解析：电流表的正确使用方法：\n(1) 电流表必须与被测用电器串联。要测灯泡L的电流，电流表就要与L串联。如果并联，会把灯泡短路，同时电流表直接接在电路中，电流过大，烧坏电流表。所以B、D错误。\n(2) 电流要从正接线柱流入，从负接线柱流出（\"正进负出\"）。如果接反了，指针会反向偏转，可能损坏电流表。所以C错误，A正确。\n\n总结电流表使用\"四要四不\"：\n要串联、要正进负出、要选合适量程、要试触；\n不能并联、不能反接、不能超量程、不能直接接电源两极。"},{"id":"g3_physics_019_ex09","knowledge_id":"g3_physics_019","question":"填空题：电流表的使用规则：(1) 电流表要______在电路中；(2) 电流要从电流表的______流入，______流出；(3) 被测电流不能超过电流表的______；(4) 绝对不允许不经过______而把电流表直接接在______两极上。","answer":"答案：串联，正接线柱，负接线柱，量程，用电器，电源\n解析：电流表的使用规则（四条）：\n(1) 串联：电流表必须串联在被测电路中。因为电流表内阻很小，并联会造成短路。\n(2) 正进负出：电流从正接线柱流入，从负接线柱流出。接反了指针反向偏转，可能损坏电流表。\n(3) 不超量程：被测电流不能超过电流表的量程，否则会烧坏电流表。测量前要估测或试触。\n(4) 不直接接电源：绝对不允许不经过用电器而把电流表直接接在电源两极上，否则会造成电源短路，电流过大，烧坏电流表和电源。\n\n记忆口诀：\n电流表，测电流，使用规则要记清；\n必须串联在电路，正进负出不能反；\n量程选对不超量，直接接电不可行。"},{"id":"g3_physics_019_ex10","knowledge_id":"g3_physics_019","question":"判断题：有两个灯泡串联，用电流表测其中一个灯泡的电流时，电流表也可以放在另一个灯泡旁边，因为串联电路电流处处相等。（  ）","answer":"答案：正确\n解析：串联电路的特点是电流只有一条路径，各处电流相等（I = I₁ = I₂）。\n所以在串联电路中，电流表接在电路中的任何位置，测得的电流都是一样的。\n\n也就是说，要测其中一个灯泡的电流，电流表可以：\n- 接在这个灯泡的旁边（与它串联）\n- 接在另一个灯泡的旁边\n- 接在电源正极旁边\n- 接在电源负极旁边\n- 接在电路中任何位置\n测量结果都是一样的，因为串联电路电流处处相等。\n\n所以题目说法是正确的。\n（注意：如果是并联电路，电流表就必须与被测用电器串联在同一条支路上，不能随便放位置。）"},{"id":"g3_physics_020_ex01","knowledge_id":"g3_physics_020","question":"选择题：两个灯泡串联在电路中，通过第一个灯泡的电流是0.3 A，则通过第二个灯泡的电流是\nA. 大于0.3 A\nB. 小于0.3 A\nC. 等于0.3 A\nD. 无法确定","answer":"答案：C\n解析：串联电路的电流规律：串联电路中各处电流相等，即 I = I₁ = I₂ = ... = In。\n因为两个灯泡串联在电路中，电流只有一条路径，所以通过每个灯泡的电流都相等。\n已知通过第一个灯泡的电流是0.3 A，那么通过第二个灯泡的电流也等于0.3 A。\n\n注意：串联电路中电流处处相等，与用电器的规格（电阻大小）无关。即使两个灯泡规格不同（亮度不同），通过它们的电流也是相等的。亮度不同是因为它们两端的电压不同、实际功率不同。"},{"id":"g3_physics_020_ex02","knowledge_id":"g3_physics_020","question":"填空题：串联电路中各处电流______，用公式表示为______；并联电路中干路电流等于______，用公式表示为______。","answer":"答案：相等，I = I₁ = I₂ = ... = In，各支路电流之和，I = I₁ + I₂ + ... + In\n解析：\n串联电路电流规律：\n- 电流只有一条路径，各处电流相等。\n- 公式：I = I₁ = I₂ = ... = In\n- 理解：电荷不会在电路中堆积，单位时间内通过串联电路各处的电荷量相等，所以电流相等。\n\n并联电路电流规律：\n- 电流有多条路径，干路电流分成几股，分别流过各支路，然后汇合流回负极。\n- 干路电流等于各支路电流之和。\n- 公式：I = I₁ + I₂ + ... + In\n- 理解：干路是所有支路电流的总和，干路电流大于任何一条支路的电流。"},{"id":"g3_physics_020_ex03","knowledge_id":"g3_physics_020","question":"选择题：在并联电路中，干路电流为I，两条支路的电流分别为I₁和I₂，则下列关系正确的是\nA. I > I₁ + I₂\nB. I = I₁ = I₂\nC. I = I₁ + I₂\nD. I < I₁ + I₂","answer":"答案：C\n解析：并联电路的电流规律：干路电流等于各支路电流之和。\n公式：I = I₁ + I₂ + ... + In\n\n对于两条支路的并联电路：I = I₁ + I₂\n\nA选项：I > I₁ + I₂，错误，应该是等于。\nB选项：I = I₁ = I₂，错误，这是串联电路的规律（只有当两条支路用电器规格相同时，I₁才等于I₂，但这是特殊情况，不是普遍规律）。\nC选项：I = I₁ + I₂，正确。\nD选项：I < I₁ + I₂，错误。\n\n补充：并联电路中，干路电流大于任一支路电流（I > I₁，I > I₂），因为干路电流是各支路电流的总和。"},{"id":"g3_physics_020_ex04","knowledge_id":"g3_physics_020","question":"判断题：两个规格不同的灯泡串联，较亮的灯泡通过的电流较大。（  ）","answer":"答案：错误\n解析：串联电路中各处电流相等，与灯泡的规格（亮度）无关。\n两个灯泡串联，通过它们的电流是相等的。\n\n灯泡的亮度不同，是因为它们的实际功率不同（P=UI，P=I²R）。虽然电流相同，但两个灯泡的电阻不同，两端的电压不同，所以实际功率不同，亮度不同。\n\n也就是说：串联电路中，电阻大的灯泡，分得的电压大，实际功率大，灯更亮。\n\n不能根据亮度判断电流大小，串联电路电流一定相等。"},{"id":"g3_physics_020_ex05","knowledge_id":"g3_physics_020","question":"填空题：两个灯泡并联，已知干路电流为1.2 A，通过L₁的电流为0.5 A，则通过L₂的电流为______ A。如果再并联一个灯泡L₃，干路电流将______（选填\"变大\"、\"变小\"或\"不变\"）。","answer":"答案：0.7，变大\n解析：\n(1) 并联电路中，干路电流等于各支路电流之和，即 I = I₁ + I₂。\n已知：I = 1.2 A，I₁ = 0.5 A\n所以 I₂ = I - I₁ = 1.2 A - 0.5 A = 0.7 A\n\n(2) 如果再并联一个灯泡L₃，相当于增加了一条支路，干路电流等于三条支路电流之和（I = I₁ + I₂ + I₃），所以干路电流会变大。\n\n补充：并联的用电器越多，干路电流越大。这也是为什么家庭电路中同时工作的用电器太多时，干路电流过大，可能引起跳闸或火灾的原因。"},{"id":"g3_physics_020_ex06","knowledge_id":"g3_physics_020","question":"选择题：有三个相同规格的灯泡，把它们串联后接在电源上，电路中的电流为I串；把它们并联后接在同一电源上，干路电流为I并。则I串与I并的关系是（设每个灯泡电阻为R，电源电压为U）\nA. I串 = I并\nB. I串 = 3I并\nC. I并 = 3I串\nD. I并 = 9I串","answer":"答案：D\n解析：设每个灯泡的电阻为R，电源电压为U。\n\n(1) 三个灯泡串联：\n总电阻 R串 = R + R + R = 3R\n串联电流 I串 = U / R串 = U / (3R)\n\n(2) 三个灯泡并联：\n并联电路各支路电压相等，都等于电源电压U。\n每条支路的电流 I支 = U / R\n干路电流 I并 = I支 + I支 + I支 = 3 × (U/R) = 3U/R\n\n(3) 比较：\nI并 / I串 = (3U/R) / (U/3R) = (3U/R) × (3R/U) = 9\n所以 I并 = 9I串\n\n答案选D。\n\n补充：并联的用电器越多，总电阻越小，干路电流越大。"},{"id":"g3_physics_020_ex07","knowledge_id":
