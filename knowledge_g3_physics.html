"g3_physics_020","question":"解答题：某同学在探究串联电路电流规律的实验中，测出A、B、C三点的电流分别为IA=0.2 A、IB=0.2 A、IC=0.2 A，于是他得出结论：串联电路中各处电流相等。你认为这个结论可靠吗？为什么？应该怎样做才能使实验结论更可靠？","answer":"答案：这个结论不完全可靠，存在偶然性。\n\n原因：该同学只用了一组规格相同的灯泡进行实验，测出一组数据就得出结论，实验次数太少，结论具有偶然性，不具有普遍性。万一两个灯泡规格相同，电流相等可能是巧合，不能说明所有串联电路的电流都相等。\n\n使结论更可靠的方法：\n(1) 换用不同规格的灯泡，多次测量，比较每次测量的电流是否都相等。\n(2) 改变电源电压（如增加或减少电池节数），多次测量，寻找普遍规律。\n(3) 进行多次实验，收集多组数据，通过大量数据归纳得出结论，避免偶然性。\n\n解析：探究实验得出普遍规律，需要进行多次实验。\n只做一次实验、用一组器材得出的结论可能具有偶然性，不一定具有普遍性。\n多次实验的目的：寻找普遍规律，避免偶然性。\n（在测量类实验中，多次实验的目的是减小误差，注意区分。）"},{"id":"g3_physics_020_ex08","knowledge_id":"g3_physics_020","question":"选择题：在一个并联电路中，通过L₁的电流是0.3 A，通过L₂的电流是0.5 A，那么干路电流和通过L₁、L₂的电流关系是\nA. 干路电流0.8 A，I = I₁ + I₂\nB. 干路电流0.2 A，I = I₂ - I₁\nC. 干路电流0.3 A，I = I₁ = I₂\nD. 干路电流0.5 A，I = max(I₁, I₂)","answer":"答案：A\n解析：并联电路的电流规律：干路电流等于各支路电流之和，即 I = I₁ + I₂。\n\n已知：I₁ = 0.3 A，I₂ = 0.5 A\n干路电流 I = I₁ + I₂ = 0.3 A + 0.5 A = 0.8 A\n\n验证：\n- 干路电流大于任一支路电流：0.8 A > 0.3 A，0.8 A > 0.5 A ✓\n- 干路电流等于各支路电流之和 ✓\n\n所以答案选A。"},{"id":"g3_physics_020_ex09","knowledge_id":"g3_physics_020","question":"填空题：某同学家中有电视机、电冰箱、电灯、电风扇各一个，它们工作时的电流分别是200 mA、1.2 A、0.25 A、300 mA。如果这些用电器同时工作，干路中的电流是______ A。","answer":"答案：1.95\n解析：家庭电路中的用电器都是并联的，干路电流等于各支路电流之和。\n\n先统一单位：\n- 电视机：200 mA = 0.2 A\n- 电冰箱：1.2 A\n- 电灯：0.25 A\n- 电风扇：300 mA = 0.3 A\n\n干路电流 I = I₁ + I₂ + I₃ + I₄\n= 0.2 A + 1.2 A + 0.25 A + 0.3 A\n= 1.95 A\n\n所以这些用电器同时工作时，干路中的电流是1.95 A。\n\n补充：家庭电路中用电器都是并联的，同时工作的用电器越多，干路电流越大。"},{"id":"g3_physics_020_ex10","knowledge_id":"g3_physics_020","question":"判断题：并联电路中，各支路的电流一定相等。（  ）","answer":"答案：错误\n解析：并联电路中，干路电流等于各支路电流之和（I = I₁ + I₂ + ... + In）。\n但是各支路的电流不一定相等。\n\n各支路电流是否相等，取决于各支路用电器的电阻（规格）：\n- 如果各支路用电器规格相同（电阻相同），因为并联电压相等，根据I=U/R，各支路电流相等。\n- 如果各支路用电器规格不同（电阻不同），那么各支路电流不相等，电阻大的支路电流小，电阻小的支路电流大。\n\n例如：家里的电灯和电冰箱并联，它们的电流显然不相等（电灯约0.2 A，冰箱约1 A）。\n\n正确的说法是：并联电路中，各支路两端电压相等，干路电流等于各支路电流之和。"},{"id":"g3_physics_021_ex01","knowledge_id":"g3_physics_021","question":"选择题：下列各组物质中，全部是导体的是\nA. 铜、玻璃、人体\nB. 大地、石墨、橡胶\nC. 盐水、稀硫酸、人体\nD. 塑料、陶瓷、油","answer":"答案：C\n解析：导体是容易导电的物体，绝缘体是不容易导电的物体。\n常见的导体：金属（铜、铁、铝等）、人体、大地、石墨、酸碱盐的水溶液（盐水、稀硫酸等）。\n常见的绝缘体：橡胶、玻璃、陶瓷、塑料、油、空气、纯水。\n\nA选项：玻璃是绝缘体，错误。\nB选项：橡胶是绝缘体，错误。\nC选项：盐水（盐的水溶液）、稀硫酸（酸的水溶液）、人体都是导体，正确。\nD选项：塑料、陶瓷、油都是绝缘体，错误。"},{"id":"g3_physics_021_ex02","knowledge_id":"g3_physics_021","question":"填空题：容易导电的物体叫做______，不容易导电的物体叫做______。金属导电靠的是______，酸、碱、盐的水溶液导电靠的是______。","answer":"答案：导体，绝缘体，自由电子，自由离子（正负离子）\n解析：\n(1) 导体：容易导电的物体。\n  - 金属导体：导电靠的是自由电子（带负电）。金属内部有大量可以自由移动的电子，叫自由电子。\n  - 酸、碱、盐的水溶液：导电靠的是自由离子（正离子和负离子）。溶液中存在大量可以自由移动的正负离子。\n  - 人体、大地：也是导体。\n\n(2) 绝缘体：不容易导电的物体。\n  - 原因：绝缘体中，电荷几乎都被束缚在原子或分子的范围内，不能自由移动，也就是缺少自由电荷。\n  - 常见绝缘体：橡胶、玻璃、陶瓷、塑料、油、空气、纯水等。\n\n注意：导体和绝缘体之间没有绝对的界限，在一定条件下可以相互转化。"},{"id":"g3_physics_021_ex03","knowledge_id":"g3_physics_021","question":"选择题：绝缘体不容易导电，这是因为\nA. 绝缘体中没有电子\nB. 绝缘体中几乎没有自由电荷\nC. 绝缘体中没有正电荷\nD. 绝缘体中的电荷不能移动","answer":"答案：B\n解析：绝缘体不容易导电的原因：绝缘体中的电荷几乎都被束缚在原子或分子的范围内，不能自由移动，也就是几乎没有可以自由移动的电荷（自由电荷）。\n\nA选项：绝缘体中有电子（每个原子都有电子），只是电子不能自由移动，错误。\nB选项：绝缘体中几乎没有自由电荷，正确。\nC选项：绝缘体中有正电荷（原子核带正电），只是正电荷不能自由移动，错误。\nD选项：绝缘体中的电荷不是不能移动，而是不能自由移动（被束缚住了）。如果条件改变（如高温、高压），绝缘体也可能变成导体，错误。\n\n补充：导体容易导电是因为导体中有大量自由电荷。"},{"id":"g3_physics_021_ex04","knowledge_id":"g3_physics_021","question":"判断题：导体能够导电，绝缘体不能导电，它们之间有绝对的界限。（  ）","answer":"答案：错误\n解析：导体容易导电，绝缘体不容易导电（不是完全不能导电，只是导电能力很差）。\n\n导体和绝缘体之间没有绝对的界限，在一定条件下可以相互转化。\n例如：\n(1) 常温下玻璃是很好的绝缘体，但加热到红炽状态（高温）时，玻璃就变成了导体。\n(2) 干燥的木头是绝缘体，潮湿的木头就变成了导体。\n(3) 空气是绝缘体，但在高电压下（如闪电时），空气也会被击穿而导电。\n\n导电能力介于导体和绝缘体之间的叫半导体，如硅、锗等，广泛应用于电子工业。\n\n所以\"有绝对的界限\"说法错误。"},{"id":"g3_physics_021_ex05","knowledge_id":"g3_physics_021","question":"填空题：输电线的芯线用金属制成，这是因为金属是______，能够______；芯线外面包一层橡胶或塑料，这是因为它们是______，能够防止______和______。","answer":"答案：导体，导电，绝缘体，漏电，触电\n解析：\n(1) 输电线的芯线用金属（铜或铝）制成，因为金属是导体，导电能力强，能够很好地传输电能。\n(2) 芯线外面包一层橡胶或塑料，因为橡胶和塑料是绝缘体，不容易导电。\n  作用：\n  - 防止漏电：避免电流从芯线泄漏出去，减少电能损失。\n  - 防止触电：人不小心碰到电线时，因为有绝缘层保护，不会触电，保障安全。\n\n注意：绝缘层损坏或老化时，要及时更换，否则可能发生漏电或触电事故。\n\n拓展：高压输电线（外面没有绝缘层的裸线）架在高空，利用空气绝缘，因为空气也是绝缘体。"},{"id":"g3_physics_021_ex06","knowledge_id":"g3_physics_021","question":"选择题：下列说法正确的是\nA. 绝缘体在任何情况下都不能导电\nB. 导体中有能够自由移动的电荷，绝缘体中没有电荷\nC. 导体和绝缘体没有绝对的界限\nD. 空气是绝缘体，在任何情况下都不会导电","answer":"答案：C\n解析：\nA选项：绝缘体不是绝对不能导电，在一定条件下（如高温、高压、潮湿）可以转化为导体，如玻璃红炽状态下导电，潮湿的木头导电，错误。\nB选项：绝缘体中也有电荷（质子和电子），只是电荷几乎都被束缚着，不能自由移动，即缺少自由电荷，不是没有电荷，错误。\nC选项：导体和绝缘体没有绝对的界限，在一定条件下可以相互转化，正确。\nD选项：空气通常是绝缘体，但在高电压下会被击穿而导电，如雷电就是云层之间或云层与大地之间的空气被击穿后放电的现象，错误。\n\n所以正确答案是C。"},{"id":"g3_physics_021_ex07","knowledge_id":"g3_physics_021","question":"解答题：为什么用湿手触摸电器设备容易发生触电事故？请用导体和绝缘体的知识解释。","answer":"答案：\n(1) 干燥的皮肤（手）是绝缘体，不容易导电，所以正常情况下用干燥的手触摸电器外壳不容易触电。\n(2) 但湿手时，皮肤表面有水分，而且水中通常含有杂质（矿物质、盐等），变成了导体，导电能力大大增强。\n(3) 同时，潮湿也会使电器设备的绝缘能力下降，漏电的可能性增大。\n(4) 因此，用湿手触摸电器设备时，如果设备漏电，电流就会通过湿手流入人体，造成触电事故。\n\n解析：\n- 纯净的水（蒸馏水）是绝缘体，但日常生活中的水（自来水、雨水、汗水等）因为含有杂质（溶解了盐类物质，有自由离子），所以是导体。\n- 皮肤干燥时电阻大（绝缘体），潮湿时电阻大大减小（变成导体），所以容易触电。\n- 安全用电原则：不要用湿手触摸电器，不要在电线上晾衣服等。"},{"id":"g3_physics_021_ex08","knowledge_id":"g3_physics_021","question":"选择题：下列关于半导体的说法，正确的是\nA. 半导体就是导电能力介于导体和绝缘体之间的物体\nB. 半导体不能导电\nC. 半导体就是超导体\nD. 以上说法都不对","answer":"答案：A\n解析：\n半导体：导电能力介于导体和绝缘体之间的物体。\n- 常见材料：硅、锗、砷化镓等。\n- 特性：\n  1. 压敏性：压力变化，电阻变化（压敏电阻）\n  2. 热敏性：温度变化，电阻变化（热敏电阻）\n  3. 光敏性：光照变化，电阻变化（光敏电阻）\n- 应用：二极管、三极管、集成电路（芯片）、太阳能电池、LED等。\n\nA选项：半导体就是导电能力介于导体和绝缘体之间的物体，正确。\nB选项：半导体能导电，只是导电能力介于导体和绝缘体之间，错误。\nC选项：超导体是在很低温度下电阻变为零的物体，和半导体是不同的概念，错误。\nD选项：A正确，所以D错误。"},{"id":"g3_physics_021_ex09","knowledge_id":"g3_physics_021","question":"填空题：在①铜、②陶瓷、③大地、④橡胶、⑤石墨、⑥油、⑦人体、⑧盐水、⑨玻璃、⑩塑料这些物质中，属于导体的是______，属于绝缘体的是______。（填序号）","answer":"答案：①③⑤⑦⑧，②④⑥⑨⑩\n解析：\n导体（容易导电的物体）：\n①铜（金属）、③大地、⑤石墨（碳的一种单质）、⑦人体、⑧盐水（盐的水溶液）\n这些物质中都有大量可以自由移动的电荷，所以容易导电。\n\n绝缘体（不容易导电的物体）：\n②陶瓷、④橡胶、⑥油、⑨玻璃、⑩塑料\n这些物质中电荷几乎都被束缚，自由电荷很少，所以不容易导电。\n\n记忆方法：\n- 导体：金属、人体、大地、石墨、酸碱盐水溶液\n- 绝缘体：橡胶、玻璃、陶瓷、塑料、油、空气、纯水"},{"id":"g3_physics_021_ex10","knowledge_id":"g3_physics_021","question":"判断题：金属导体中的电流方向与自由电子定向移动的方向相同。（  ）","answer":"答案：错误\n解析：\n物理学规定：正电荷定向移动的方向为电流的方向。\n\n金属导体中，能够自由移动的是自由电子（带负电），所以金属导体中的电流是自由电子的定向移动形成的。\n\n因为自由电子带负电，所以自由电子定向移动的方向与电流的方向相反。\n\n例如：在电路中，电流从电源正极流向负极（外电路），而自由电子实际是从电源负极流向正极（外电路），二者方向相反。\n\n所以题目说\"金属导体中的电流方向与自由电子定向移动的方向相同\"是错误的，应该是相反。"},{"id":"g3_physics_022_ex01","knowledge_id":"g3_physics_022","question":"选择题：关于电路图，下列说法正确的是\nA. 电路图是用实物图表示电路连接的图\nB. 电路图中元件符号可以随意画，没有统一规定\nC. 电路图中要用规定的电路元件符号来表示电路连接\nD. 实物图和电路图是完全一样的","answer":"答案：C\n解析：\n电路图：用规定的符号表示电路连接的图，叫做电路图。\n\nA选项：电路图用的是符号，不是实物图，错误。\nB选项：电路元件符号有统一规定（国家标准），不能随意画，错误。\nC选项：电路图中要用规定的电路元件符号来表示电路连接，正确。\nD选项：实物图画的是实物外形，电路图画的是符号，二者不一样，错误。\n\n常见电路元件符号：\n- 电源：长线段是正极，短线段是负极\n- 开关：断开的闸刀（可以闭合）\n- 灯泡：圆圈里面一个叉\n- 电流表：圆圈里面一个A\n- 电压表：圆圈里面一个V\n- 电阻：长方形\n- 滑动变阻器：长方形加箭头\n- 电动机：圆圈里面一个M"},{"id":"g3_physics_022_ex02","knowledge_id":"g3_physics_022","question":"填空题：画电路图时，要用______的元件符号；导线要画成______和______，横平竖直，呈______形；元件符号不能画在______处；电路元件要分布______，不要画在角落。","answer":"答案：统一规定，直线，折线，矩，拐角（或转角），均匀\n解析：画电路图的注意事项：\n(1) 要用统一规定的元件符号，不能自己发明符号。\n(2) 导线要画成直线和折线，一般横平竖直，呈矩形（长方形），不要画成曲线或斜线。\n(3) 元件符号不能画在拐角处，要画在导线的中间位置（横线上或竖线上）。\n(4) 电路元件要分布均匀，不要都挤在一起，也不要只画在角落。\n(5) 整个电路图一般画成长方形或正方形，美观整齐。\n(6) 导线交叉连接处要画实心圆点，表示连通；不连接的交叉处不画点。"},{"id":"g3_physics_022_ex03","knowledge_id":"g3_physics_022","question":"选择题：下列电路元件符号表示电动机的是\nA. 圆圈里面一个A\nB. 圆圈里面一个V\nC. 圆圈里面一个M\nD. 圆圈里面一个叉","answer":"答案：C\n解析：常见电路元件符号：\nA. 圆圈里面一个A → 电流表\nB. 圆圈里面一个V → 电压表\nC. 圆圈里面一个M → 电动机（Motor的首字母）\nD. 圆圈里面一个叉 → 灯泡（电灯）\n\n补充常见元件符号：\n- 电源：两条竖线，长正短负\n- 开关：断开的闸刀\n- 电阻：长方形（或锯齿形）\n- 滑动变阻器：长方形加箭头\n- 电铃：铃铛形状\n- 交叉相连导线：十字交叉加黑点\n- 交叉不相连导线：十字交叉无黑点"},{"id":"g3_physics_022_ex04","knowledge_id":"g3_physics_022","question":"判断题：根据实物图画电路图时，开关的状态必须和实物图一致，实物图中开关是断开的，电路图中也要画成断开的。（  ）","answer":"答案：错误\n解析：电路图是表示电路连接关系的图，开关一般画成断开状态（或闭合状态都可以，但通常画断开），重点是表示清楚各元件的连接方式，而不是开关的状态。\n\n实物图中开关的状态（闭合还是断开）只是当时的状态，电路图要表示的是电路的连接方式，不需要和实物图的开关状态一致。\n\n画电路图的关键：\n(1) 元件的连接顺序要正确（串联还是并联）。\n(2) 元件符号要规范。\n(3) 导线横平竖直，分布均匀。\n(4) 开关位置对应即可，状态不要求完全一致。"},{"id":"g3_physics_022_ex05","knowledge_id":"g3_physics_022","question":"填空题：从电源的______极开始，沿着电流的方向，依次画出各个元件的符号，最后回到电源的______极，这样就画出了串联电路的电路图。画并联电路时，可以先画______路，再画______路。","answer":"答案：正，负，干，支\n解析：画电路图的方法和步骤：\n\n(1) 串联电路图：\n  - 从电源正极开始出发。\n  - 沿着电流的方向，依次画出经过的各个元件（开关、灯泡、电流表等）。\n  - 最后回到电源的负极。\n  - 注意导线横平竖直，元件分布均匀。\n\n(2) 并联电路图：\n  - 方法一：先画干路，找到分流点和汇合点，再画各支路。\n  - 方法二：先画一条支路，再把另一条支路并联上去。\n  - 方法三：从电源正极出发，画到分流点分支，画各支路，然后汇合回到负极。\n\n一般步骤：看清实物连接→确定串并联→从正极开始→按顺序画→回到负极→检查核对。"},{"id":"g3_physics_022_ex06","knowledge_id":"g3_physics_022","question":"选择题：某同学画的电路图中有两个灯泡，电流从电源正极流出后，经过开关，分成两条路，分别经过两个灯泡，然后汇合流回电源负极。这个电路是\nA. 串联电路\nB. 并联电路\nC. 可能是串联也可能是并联\nD. 无法判断","answer":"答案：B\n解析：\n判断串联还是并联，看电流有几条路径：\n- 串联：电流只有一条路径，依次经过所有用电器。\n- 并联：电流有两条或多条路径，干路电流分成几股，分别经过各支路用电器，然后汇合流回负极。\n\n题目中说\"电流从电源正极流出后，经过开关，分成两条路，分别经过两个灯泡，然后汇合流回电源负极\"，说明电流有两条路径，所以是并联电路。\n\n用电流法判断串并联：\n- 一条路径 → 串联\n- 多条路径 → 并联\n\n所以答案选B。"},{"id":"g3_physics_022_ex07","knowledge_id":"g3_physics_022","question":"解答题：请根据以下描述，画出对应的电路图：由两节干电池串联作为电源，一个开关控制两盏灯，两盏灯并联，开关在干路上。要求说明画图步骤。","answer":"答案：\n画图步骤：\n(1) 画电源符号：画一长一短两条竖线表示一节电池，两组这样的符号串联起来（正极接负极）表示两节干电池串联，长线段是正极，短线段是负极。\n(2) 从电源正极出发，画一条水平导线，画上开关符号（干路开关）。\n(3) 从开关另一端画导线到一个点（分流点），从这个点分成两条支路。\n(4) 第一条支路：画一个灯泡符号，导线连到另一个点（汇合点）。\n(5) 第二条支路：在第一条支路的旁边（上下或左右），再画一个灯泡符号，两端分别接在分流点和汇合点。\n(6) 从汇合点画导线回到电源负极。\n(7) 整理：导线横平竖直，两个灯泡并联，开关在干路上，整体呈长方形，元件分布均匀。\n\n验证：\n- 电流从正极出发，经过开关后分成两路，分别经过两个灯泡，然后汇合回到负极，是并联电路。\n- 开关在干路上，控制整个电路（两盏灯），符合要求。\n- 电源是两节干电池串联，总电压3 V。"},{"id":"g3_physics_022_ex08","knowledge_id":"g3_physics_022","question":"选择题：在电路图中，\"十\"字交叉的导线上画有一个实心黑点，表示\nA. 两根导线交叉但不相连\nB. 两根导线交叉且相连（连通）\nC. 只是画得清楚一些，没有特殊意义\nD. 表示这里有一个电路元件","answer":"答案：B\n解析：电路图中导线交叉的两种情况：\n(1) 交叉相连（连通）：十字交叉处画一个实心黑点，表示两根导线在这里是连接在一起的（连通的），电流可以从一根导线流到另一根导线。\n(2) 交叉不相连（跨过）：十字交叉处不画黑点，表示两根导线只是交叉跨过，没有连接，电流不能互通。\n\n所以实心黑点表示导线交叉且相连（连通），答案选B。\n\n记忆：有点就连，没点就断（跨过去）。"},{"id":"g3_physics_022_ex09","knowledge_id":"g3_physics_022","question":"填空题：在电路图中，电源的符号是______，其中长线段表示______极，短线段表示______极；灯泡的符号是______；电流表的符号是______；电压表的符号是______；电动机的符号是______。","answer":"答案：一长一短两条竖线（电池符号），正，负，圆圈里一个叉（⊙里面×），圆圈里一个A，圆圈里一个V，圆圈里一个M\n解析：常见电路元件符号总结：\n(1) 电源（电池）：两条竖线，长正短负。多节电池串联就画多组，正极接负极。\n(2) 开关：一条横线，中间一个可转动的闸刀（断开状态）。\n(3) 灯泡（电灯）：圆圈里面画一个叉（×）。\n(4) 电流表：圆圈里面写一个A。\n(5) 电压表：圆圈里面写一个V。\n(6) 电动机：圆圈里面写一个M（Motor）。\n(7) 电阻：长方形（或锯齿形符号）。\n(8) 滑动变阻器：长方形上面画一个箭头，表示滑片。\n(9) 电铃：铃铛形状。\n(10) 交叉相连导线：十字加黑点。\n(11) 交叉不相连导线：十字无点。"},{"id":"g3_physics_022_ex10","knowledge_id":"g3_physics_022","question":"判断题：电路图中的导线必须画成横平竖直，不能用斜线或曲线。（  ）","answer":"答案：正确\n解析：画电路图的规范要求：导线要用直线和折线（横平竖直）来画，不能画成斜线或曲线，这样电路图才整齐美观，便于查看和分析。\n\n具体要求：\n(1) 导线画成横平竖直，一般呈矩形（长方形）布局。\n(2) 导线转弯处是直角（90度）。\n(3) 元件画在导线的中间（横线上或竖线上），不要画在拐角处。\n(4) 整体布局均匀、美观、整齐。\n\n虽然实际电路中导线是任意形状的，但电路图是为了清楚表示连接关系，所以要用规范化的画法，导线横平竖直。"},{"id":"g3_physics_023_ex01","knowledge_id":"g3_physics_023","question":"选择题：关于电流的方向，下列说法正确的是\nA. 电子定向移动的方向是电流方向\nB. 正电荷定向移动的方向是电流方向\nC. 自由电荷定向移动的方向是电流方向\nD. 负离子定向移动的方向是电流方向","answer":"答案：B\n解析：物理学中规定：正电荷定向移动的方向为电流的方向。\n\nA选项：电子带负电，电子定向移动的方向与电流方向相反，错误。\nB选项：正电荷定向移动的方向是电流方向，这是物理学的规定，正确。\nC选项：自由电荷包括正电荷和负电荷，负电荷定向移动的方向与电流方向相反，错误。\nD选项：负离子带负电，负离子定向移动的方向与电流方向相反，错误。\n\n补充：\n- 金属导体中，是自由电子（负电荷）定向移动形成电流，所以电流方向与自由电子定向移动方向相反。\n- 酸、碱、盐的水溶液中，正离子和负离子同时向相反方向定向移动形成电流，电流方向与正离子定向移动方向相同，与负离子定向移动方向相反。"},{"id":"g3_physics_023_ex02","knowledge_id":"g3_physics_023","question":"填空题：在电路中，电源外部的电流方向是从电源______极经过用电器流向______极；电源内部的电流方向是从电源______极流向______极。","answer":"答案：正，负，负，正\n解析：\n完整电路中电流的方向：\n(1) 电源外部（外电路）：电流从电源正极流出，经过开关、导线、用电器等，流回电源负极。\n  即：正极 → 用电器 → 负极\n\n(2) 电源内部（内电路）：电流从电源负极流向正极。\n  即：负极 → 正极\n\n整个电路形成一个闭合的回路：\n正极 → 外电路 → 负极 → 内电路 → 正极\n\n注意：金属导体中实际定向移动的是自由电子（带负电），电子移动的方向与电流方向相反。外电路中，电子从负极流向正极。"},{"id":"g3_physics_023_ex03","knowledge_id":"g3_physics_023","question":"选择题：金属导体中的电流是由自由电子的定向移动形成的，自由电子带负电。则金属导体中的电流方向与自由电子定向移动的方向\nA. 相同\nB. 相反\nC. 可能相同也可能相反\nD. 无法判断","answer":"答案：B\n解析：\n物理学规定：正电荷定向移动的方向为电流的方向。\n\n金属导体中，能够自由移动的是自由电子，自由电子带负电。\n所以：\n- 自由电子定向移动的方向是负电荷移动的方向。\n- 电流方向是正电荷定向移动的方向。\n- 负电荷移动方向与正电荷移动方向相反。\n\n因此，金属导体中的电流方向与自由电子定向移动的方向相反。\n\n举例：在电路中，电流从正极流向负极（外电路），而自由电子实际是从负极流向正极（外电路），二者方向相反。"},{"id":"g3_physics_023_ex04","knowledge_id":"g3_physics_023","question":"判断题：电流的方向是从电源负极流向正极。（  ）","answer":"答案：错误\n解析：电流的方向分电源内部和电源外部，情况不同。\n\n(1) 电源外部（外电路）：电流从电源正极流向负极。\n(2) 电源内部（内电路）：电流从电源负极流向正极。\n\n通常我们说电路中的电流方向，如果没有特别说明，一般指的是外电路的电流方向，即从正极流向负极。\n\n题目说\"电流的方向是从电源负极流向正极\"，没有说明是电源内部还是外部，而通常指外部，所以是错误的。\n\n完整的说法应该是：在电源外部，电流从正极流向负极；在电源内部，电流从负极流向正极。"},{"id":"g3_physics_023_ex05","knowledge_id":"g3_physics_023","question":"填空题：在硫酸铜溶液中，正离子（铜离子）向负极方向移动，负离子（硫酸根离子）向正极方向移动，则电流方向是从______极流向______极，与______离子定向移动的方向相同。","answer":"答案：正，负，正（铜）\n解析：\n物理学规定：正电荷定向移动的方向为电流的方向。\n\n在硫酸铜溶液中：\n- 正离子（铜离子，带正电）向负极方向移动 → 正电荷移动方向是从正极到负极 → 这就是电流方向。\n- 负离子（硫酸根离子，带负电）向正极方向移动 → 负电荷移动方向是从负极到正极 → 与电流方向相反。\n\n所以电流方向是从正极流向负极，与正离子（铜离子）定向移动的方向相同，与负离子定向移动的方向相反。\n\n总结：\n- 电流方向 = 正电荷定向移动方向\n- 电流方向 与 负电荷定向移动方向 相反"},{"id":"g3_physics_023_ex06","knowledge_id":"g3_physics_023","question":"选择题：在一个由电池、开关、小灯泡组成的简单串联电路中，关于电流方向，下列说法正确的是\nA. 电流方向总是从电池正极流向负极\nB. 经过灯泡时，电流方向是从灯泡的一端流向另一端，与电池正负极连接有关\nC. 电流方向在导线中是双向的\nD. 自由电子移动方向是从正极流向负极","answer":"答案：B\n解析：\nA选项：\"总是从电池正极流向负极\"不准确。在电源外部电流从正极流向负极，但在电源内部是从负极流向正极。如果是指整个电路，说法不完整。但更重要的是，B选项更准确。\n\nB选项：经过灯泡时，电流方向取决于电池的连接方式。电流从电池正极流出，经过灯泡的一端流入，从另一端流出，流向电池负极。所以电流方向与电池正负极连接有关，正确。\n\nC选项：电流方向是单向的，正电荷定向移动的方向为电流方向，不是双向的，错误。\n\nD选项：自由电子带负电，移动方向与电流方向相反。外电路中自由电子从负极流向正极，不是从正极流向负极，错误。\n\n综合比较，B选项最准确。"},{"id":"g3_physics_023_ex07","knowledge_id":"g3_physics_023","question":"解答题：为什么电流表的正接线柱要靠近电源正极，负接线柱要靠近电源负极？如果接反了会怎样？","answer":"答案：\n(1) 原因：\n电流表的使用规则要求电流从正接线柱流入，从负接线柱流出（\"正进负出\"）。\n因为在电源外部，电流的方向是从电源正极流向负极，所以电流表的正接线柱要接在靠近电源正极的一端，负接线柱接在靠近电源负极的一端，这样才能保证电流从正接线柱流入、负接线柱流出。\n\n(2) 如果接反了（正负接线柱接反）：\n电流表的指针会反向偏转（向左偏，偏向0刻度的左边），这样不仅无法读数，还可能损坏电流表（把指针打弯）。\n\n(3) 改正方法：\n立即断开开关，将电流表两个接线柱上的导线对调位置，使电流从正接线柱流入，负接线柱流出。\n\n解析：\n电流方向规定：正电荷定向移动的方向为电流方向。\n外电路中：电流从正极 → 用电器 → 负极。\n电流表使用：正进负出，指针向右偏转，正常读数。\n接反了：指针反向偏转，可能损坏电表。"},{"id":"g3_physics_023_ex08","knowledge_id":"g3_physics_023","question":"选择题：关于电流的形成和方向，下列说法正确的是\nA. 只有正电荷定向移动才能形成电流\nB. 电流方向就是电荷定向移动的方向\nC. 金属导体中的电流方向与自由电子定向移动方向相反\nD. 电路中有电源就一定有电流","answer":"答案：C\n解析：\nA选项：正、负电荷的定向移动都能形成电流。金属中是自由电子（负电）定向移动，溶液中是正负离子同时向相反方向移动。所以不是只有正电荷才行，错误。\n\nB选项：电流方向是正电荷定向移动的方向，不是所有电荷移动的方向。负电荷定向移动方向与电流方向相反，错误。\n\nC选项：金属导体中是自由电子（负电荷）定向移动形成电流，自由电子带负电，所以电流方向与自由电子定向移动方向相反，正确。\n\nD选项：电路中有电源，还要电路是通路，才有持续电流。只有电源但断路就没有电流，错误。\n\n所以正确答案是C。"},{"id":"g3_physics_023_ex09","knowledge_id":"g3_physics_023","question":"填空题：人们规定______电荷定向移动的方向为电流的方向。在电源外部，电流从电源的______极流出，经过用电器，流向电源的______极。在金属导体中，电流的方向与______定向移动的方向相反。","answer":"答案：正，正，负，自由电子\n解析：\n(1) 电流方向的规定：正电荷定向移动的方向为电流的方向。（这是人为规定的，历史原因）\n\n(2) 电源外部电流方向：从正极流出，经过用电器，流向负极。\n  即：正极 → 用电器 → 负极\n\n(3) 金属导体中的电流：\n  - 金属中是自由电子（带负电）定向移动形成电流。\n  - 因为电子带负电，所以自由电子定向移动的方向与电流方向相反。\n  - 例如：外电路中电流从左到右，自由电子实际是从右到左移动。\n\n记忆口诀：\n电流方向正规定，外正内负回路成；\n金属导电靠电子，方向相反要记清。"},{"id":"g3_physics_023_ex10","knowledge_id":"g3_physics_023","question":"判断题：正电荷移动的方向就是电流方向。（  ）","answer":"答案：错误\n解析：正确的说法是：正电荷定向移动的方向为电流的方向。\n\n注意关键词\"定向移动\"，不能少。\n- 如果正电荷是无规则的热运动（杂乱无章地向各个方向运动），就不能形成电流，也就不能说电流方向。\n- 只有正电荷定向移动（向某个方向移动）时，才有电流，电流方向才是正电荷定向移动的方向。\n\n题目中说\"正电荷移动的方向就是电流方向\"，少了\"定向\"两个字，所以是错误的。\n\n类似的常见错误：\n- \"电荷移动形成电流\"（错误，应为\"电荷定向移动形成电流\"）\n- \"正电荷移动方向是电流方向\"（错误，应为\"正电荷定向移动方向\"）"},{"id":"g3_physics_024_ex01","knowledge_id":"g3_physics_024","question":"选择题：我国家庭电路的电压是\nA. 36 V\nB. 110 V\nC. 220 V\nD. 380 V","answer":"答案：C\n解析：常见电压值：\n- 一节干电池：1.5 V\n- 一节铅蓄电池：2 V\n- 人体安全电压：不高于36 V（≤36 V）\n- 我国家庭电路（照明电路）电压：220 V\n- 工业动力电路电压：380 V\n- 手机电池电压：约3.7 V\n\n所以我国家庭电路的电压是220 V，答案选C。\n补充：一些国家（如美国、日本）家庭电路电压是110 V，但我国是220 V。"},{"id":"g3_physics_024_ex02","knowledge_id":"g3_physics_024","question":"填空题：家庭电路的两根进户线分别叫______线和______线，它们之间的电压是______ V。可用______来辨别火线和零线。","answer":"答案：火，零，220，试电笔（测电笔）\n解析：\n家庭电路的两根进户线：\n(1) 火线（端线）：与大地之间有220 V电压，危险。\n(2) 零线：在发电厂或变压器处与大地相连，与大地之间电压为0 V。\n\n火线与零线之间的电压是220 V。\n\n辨别火线和零线的工具：试电笔（也叫测电笔、验电笔）。\n- 使用方法：手接触笔尾金属体，笔尖接触被测导线。\n- 判断：氖管发光的是火线，氖管不发光的是零线。\n- 注意：使用时手一定要接触笔尾金属体，否则即使接触火线，氖管也不会发光。"},{"id":"g3_physics_024_ex03","knowledge_id":"g3_physics_024","question":"选择题：在家庭电路中，各用电器之间的连接方式是\nA. 全部串联\nB. 全部并联\nC. 重要的用电器串联，其他并联\nD. 电灯与插座串联，其他并联","answer":"答案：B\n解析：家庭电路中各用电器之间是并联的。\n\n原因：\n(1) 并联电路各支路用电器互不影响。一个用电器坏了（断路），其他用电器仍能正常工作。如果是串联，一个坏了全部都不能用，显然不符合实际需要。\n\n(2) 并联电路各支路两端电压相等，都等于电源电压（220 V）。家庭电路中各用电器的额定电压都是220 V，并联时每个用电器都能在额定电压下正常工作。如果串联，各用电器分得的电压低于220 V，不能正常工作。\n\n补充：\n- 开关与它控制的用电器之间是串联的，这样开关才能控制用电器的通断。\n- 插座与用电器之间也是并联的。\n- 电灯与插座是并联的。\n\n所以家庭电路中所有用电器都是并联的，答案选B。"},{"id":"g3_physics_024_ex04","knowledge_id":"g3_physics_024","question":"判断题：家庭电路中，开关应该接在零线上。（  ）","answer":"答案：错误\n解析：在家庭电路中，开关应该接在火线上，而不是零线上。\n\n原因：\n如果开关接在火线上，断开开关后，用电器就与火线断开连接，不带电了，人接触用电器（如更换灯泡）就不会触电，更安全。\n\n如果开关接在零线上，断开开关后，用电器仍然与火线相连，仍然带电，人不小心碰到就可能触电，很危险。\n\n所以开关要接在火线上，这样断开开关后，用电器不带电，保障安全。\n\n补充：螺丝口灯泡的螺旋套也要接零线，因为螺旋套容易被人碰到，如果接火线，容易触电。灯泡顶端的金属点接火线（通过开关）。"},{"id":"g3_physics_024_ex05","knowledge_id":"g3_physics_024","question":"填空题：三孔插座的三个孔，左孔接______线，右孔接______线，上孔接______线。对应的三脚插头，上面的脚接用电器的______。","answer":"答案：零，火，地，金属外壳\n解析：\n三孔插座的接法：左零右火上接地（左孔接零线，右孔接火线，上孔接地线）。\n\n对应的三脚插头：\n- 上面的脚（较长的那个脚）接用电器的金属外壳。\n- 插入插座时，金属外壳先与大地相连；拔出时，金属外壳后断开，更安全。\n\n为什么要接地？\n如果用电器（如电冰箱、洗衣机、电热水器等）的金属外壳漏电（内部火线绝缘皮破损，与外壳接触），外壳就会带电，人接触外壳就会触电。\n有了接地线后，电流会通过接地线流入大地，外壳就不带电了，人接触就不会触电，保障安全。\n\n所以有金属外壳的家用电器，一定要用三脚插头和三孔插座，使金属外壳接地。"},{"id":"g3_physics_024_ex06","knowledge_id":"g3_physics_024","question":"选择题：关于家庭电路和安全用电，下列说法正确的是\nA. 人体安全电压是220 V\nB. 可以用湿手拔插头\nC. 发现有人触电，应立即用手把他拉开\nD. 保险装置、插座、家用电器等达到使用寿命应及时更换","answer":"答案：D\n解析：\nA选项：人体安全电压是不高于36 V（≤36 V），220 V是家庭电路电压，远高于安全电压，非常危险，错误。\n\nB选项：湿手时皮肤潮湿，电阻变小，导电能力增强，用湿手拔插头容易触电；同时水是导体（含杂质的水），也容易造成短路，非常危险，错误。\n\nC选项：发现有人触电，不能用手直接拉，因为人是导体，直接拉会使救人的人也触电。正确做法是：先切断电源（拉开开关、拔下插头），或者用干燥的木棒等绝缘体将电线挑开，再救人，错误。\n\nD选项：保险装置、插座、家用电器等达到使用寿命后，绝缘层可能老化，容易发生漏电、短路等事故，应及时更换，正确。\n\n所以答案选D。"},{"id":"g3_physics_024_ex07","knowledge_id":"g3_physics_024","question":"解答题：家庭电路中电流过大的原因有哪些？请分别举例说明。","answer":"答案：家庭电路中电流过大的原因有两个：\n\n(1) 总功率过大（用电器总功率过大）：\n根据公式 P = UI，家庭电路电压U = 220 V是固定的，所以总功率P越大，干路电流I就越大。\n例子：家里同时工作的用电器太多，如同时开着空调、电热水器、电磁炉、微波炉等大功率用电器，总功率过大，干路电流过大，可能导致保险丝熔断或空气开关跳闸。\n\n(2) 短路：\n火线和零线直接连通（不经过用电器），造成短路。根据欧姆定律 I = U/R，因为导线的电阻R很小，电压U不变，所以电流I会非常大。\n例子：电线绝缘皮破损，火线和零线碰到一起；或者插座内部短路；或者用电器内部短路等。短路时电流极大，会产生大量热量，容易引起火灾，非常危险。\n\n解析：\n家庭电路中电流过大的原因：\n① 总功率过大 → P总太大 → I = P/U 太大\n② 短路 → R太小 → I = U/R 太大\n\n为了防止电流过大引起事故，家庭电路中要安装保险丝（或空气开关），电流过大时自动切断电路，起到保护作用。"},{"id":"g3_physics_024_ex08","knowledge_id":"g3_physics_024","question":"选择题：关于试电笔的使用，下列说法正确的是\nA. 使用试电笔时，手不能接触任何金属部分\nB. 使用试电笔时，手要接触笔尾金属体\nC. 试电笔能够区分电压的大小\nD. 试电笔氖管发光，说明接触的是零线","answer":"答案：B\n解析：试电笔（测电笔）的正确使用方法：\n(1) 手要接触笔尾金属体（或笔卡），这样人体、试电笔、大地才能形成回路，氖管才能发光。如果手不接触笔尾金属体，即使笔尖接触火线，氖管也不会发光。所以A错误，B正确。\n\n(2) 笔尖接触被测的导线（或用电器、插座等）。\n\n(3) 判断方法：\n- 氖管发光 → 接触的是火线（与火线连通）\n- 氖管不发光 → 接触的是零线（或不带电）\n所以D错误。\n\n(4) 试电笔只能辨别火线和零线，不能测量电压的具体大小，所以C错误。\n\n注意：使用试电笔时，手一定要接触笔尾金属体，但千万不能接触笔尖金属体，否则会触电。"},{"id":"g3_physics_024_ex09","knowledge_id":"g3_physics_024","question":"填空题：家庭电路中，保险丝是用电阻率______、熔点______的铅锑合金制成的。它的作用是当电路中电流过大时，自动______，起到保护作用。现在新建的楼房中，通常用______代替保险丝。","answer":"答案：大，低，熔断（切断电路），空气开关（断路器）\n解析：\n保险丝：\n(1) 材料：电阻率大、熔点低的铅锑合金。\n  - 电阻率大：根据焦耳定律Q = I²Rt，电流通过时产生的热量多，温度升高快。\n  - 熔点低：温度升高到保险丝的熔点时，保险丝熔断，自动切断电路。\n\n(2) 作用：当电路中电流过大时，保险丝因温度升高而熔断，自动切断电路，起到保护作用（防止火灾、保护用电器）。\n\n(3) 选择：保险丝的额定电流要等于或稍大于电路中最大正常工作电流。\n  不能用铜丝、铁丝代替保险丝，因为铜丝铁丝熔点高，电流过大时不能及时熔断，起不到保护作用，很危险。\n\n(4) 空气开关（断路器）：\n现在新建的楼房中，通常用空气开关代替保险丝。空气开关也是电流过大时自动断开（跳闸），原理是电磁原理，可重复使用，更方便、更安全。"},{"id":"g3_physics_024_ex10","knowledge_id":"g3_physics_024","question":"判断题：发现有人触电时，应尽快用手将触电的人拉开。（  ）","answer":"答案：错误\n解析：发现有人触电，绝对不能用手直接拉触电的人。\n\n原因：人体是导体，如果用手直接拉触电的人，救人的人也会接触电流，造成触电事故，这样不仅救不了人，连救人的人也会触电。\n\n正确的做法：\n(1) 立即切断电源：拉开总开关、拔下插头等，使触电者脱离电源。\n(2) 如果找不到电源开关，用干燥的木棒、竹竿、塑料棒等绝缘体将电线挑开，使触电者脱离电源。\n(3) 必要时进行人工呼吸和胸外心脏按压，同时拨打120急救电话。\n\n原则：救人先断电，用绝缘体，注意自身安全。\n\n所以\"用手将触电的人拉开\"是错误的，很危险。"},{"id":"g3_physics_025_ex01","knowledge_id":"g3_physics_025","question":"选择题：下列关于电压的说法中，正确的是（  ）\nA. 电压是使自由电荷发生定向移动形成电流的原因\nB. 电路两端只要有电压，电路中就一定有电流\nC. 对人体的安全电压是36V\nD. 一节干电池的电压是2V","answer":"答案：A\n解析：A选项正确，电压是形成电流的原因，它使自由电荷发生定向移动；B选项错误，电路两端有电压，还必须是通路，电路中才有电流；C选项错误，对人体的安全电压是不高于36V，不是等于36V；D选项错误，一节干电池的电压是1.5V，一节铅蓄电池的电压才是2V。"},{"id":"g3_physics_025_ex02","knowledge_id":"g3_physics_025","question":"选择题：小明家的电视机正常工作时的电压是220V，这个电压和家庭电路的电压相比（  ）\nA. 高于家庭电路电压\nB. 低于家庭电路电压\nC. 等于家庭电路电压\nD. 无法判断","answer":"答案：C\n解析：在我国，家庭电路的电压是220V，家用电器的额定电压一般都是220V，这样它们才能正常工作。电视机作为家用电器，正常工作电压就是220V，与家庭电路电压相等。"},{"id":"g3_physics_025_ex03","knowledge_id":"g3_physics_025","question":"填空题：电压用字母______表示，国际单位是______，简称______，符号是______。比伏大的单位有______，比伏小的单位有______。","answer":"答案：U；伏特；伏；V；千伏（kV）；毫伏（mV）\n解析：电压是使电路中形成电流的原因，用字母U表示。电压的国际单位是伏特，简称伏，符号V。常用单位还有千伏（kV）、毫伏（mV）等，换算关系是：1kV=1000V，1V=1000mV。"},{"id":"g3_physics_025_ex04","knowledge_id":"g3_physics_025","question":"填空题：请填写下列常见的电压值：\n（1）一节干电池的电压是______V；\n（2）家庭电路的电压是______V；\n（3）对人体的安全电压是______V；\n（4）手机锂电池的电压约为______V。","answer":"答案：（1）1.5；（2）220；（3）不高于36；（4）3.7\n解析：常见电压值需要牢记：一节干电池1.5V，家庭电路220V，对人体安全电压不高于36V，手机锂电池约3.7V，一节铅蓄电池2V，工业用电380V。这些都是生活中常见的电压值。"},{"id":"g3_physics_025_ex05","knowledge_id":"g3_physics_025","question":"选择题：关于电源和电压，下列说法正确的是（  ）\nA. 电源是提供电压的装置，电源将电能转化为其他形式的能\nB. 有电源就一定有电流\nC. 电压的作用是使电路中的自由电荷定向移动形成电流\nD. 电路中有电流不一定有电压","answer":"答案：C\n解析：A选项错误，电源是提供电压的装置，但电源是将其他形式的能转化为电能，而不是将电能转化为其他形式的能；B选项错误，有电源还必须电路是通路才有电流；C选项正确，电压的作用就是使自由电荷定向移动形成电流；D选项错误，电压是形成电流的原因，电路中有电流就一定有电压。"},{"id":"g3_physics_025_ex06","knowledge_id":"g3_physics_025","question":"判断题：电路两端有电压，电路中就一定有电流。（  ）","answer":"答案：错误\n解析：电路中形成持续电流的条件有两个：一是电路两端有电压（即有电源），二是电路是通路（闭合电路）。两个条件缺一不可。如果电路两端有电压，但电路是断开的，电路中就没有电流。所以有电压不一定有电流，但有电流一定有电压。"},{"id":"g3_physics_025_ex07","knowledge_id":"g3_physics_025","question":"判断题：对人体的安全电压是36V。（  ）","answer":"答案：错误\n解析：对人体的安全电压是不高于36V，也就是说36V及以下的电压对人体才是安全的。注意是\"不高于\"而不是\"等于\"，这是一个容易出错的地方。如果电压高于36V，就可能对人体造成伤害。"},{"id":"g3_physics_025_ex08","knowledge_id":"g3_physics_025","question":"解答题：小明用一个有6节干电池串联组成的电池组给一个小灯泡供电，已知每节干电池的电压是1.5V，请问这个电池组的总电压是多少伏？合多少毫伏？","answer":"答案：电池组的总电压是9V，合9000mV。\n解析：因为干电池是串联使用的，串联电池组的总电压等于各节电池电压之和。\n每节干电池电压U₀=1.5V，共有6节，\n所以总电压U=6×U₀=6×1.5V=9V。\n又因为1V=1000mV，\n所以9V=9×1000mV=9000mV。\n解析：串联电池组的电压等于各电池电压之和，这是电压的基本规律之一。电压单位换算时，大单位换小单位乘以进率，小单位换大单位除以进率。"},{"id":"g3_physics_025_ex09","knowledge_id":"g3_physics_025","question":"选择题：下列关于电压单位的换算中，正确的是（  ）\nA. 220V=2.2kV\nB. 3.7V=370mV\nC. 0.5kV=500V\nD. 100mV=1V","answer":"答案：C\n解析：电压单位换算关系：1kV=1000V，1V=1000mV。\nA选项：220V=220÷1000kV=0.22kV，A错误；\nB选项：3.7V=3.7×1000mV=3700mV，B错误；\nC选项：0.5kV=0.5×1000V=500V，C正确；\nD选项：100mV=100÷1000V=0.1V，D错误。"},{"id":"g3_physics_025_ex10","knowledge_id":"g3_physics_025","question":"解答题：请举例说明电压在生活中的应用，并解释为什么不同的用电器需要不同的电压。（至少举3个例子）","answer":"答案：生活中电压的应用举例：\n1. 手电筒：使用干电池，每节1.5V，一般用2-3节串联，提供3V或4.5V电压，使小灯泡发光。\n2. 家庭照明：家庭电路电压220V，电灯、电视、冰箱等家用电器都在这个电压下工作。\n3. 手机：手机锂电池电压约3.7V，给手机供电，使手机正常工作。\n4. 电动自行车：一般使用48V或60V的蓄电池组，提供动力。\n\n不同用电器需要不同电压的原因：\n不同的用电器是根据不同的工作需求设计的，它们的内部结构和所用的电子元件不同，因此额定电压（正常工作时的电压）也不同。电压过高会烧坏用电器，电压过低则用电器不能正常工作。例如，手电筒的小灯泡只需要几伏电压就能发光，如果接到220V的家庭电路中，会立即烧坏；而电冰箱需要220V电压才能正常工作，如果用几伏电压供电，压缩机根本无法启动。\n\n解析：电压是用电器正常工作的必要条件，每种用电器都有自己的额定电压，使用时必须在额定电压下工作，才能保证安全和正常工作。"},{"id":"g3_physics_026_ex01","knowledge_id":"g3_physics_026","question":"选择题：下列关于电阻的说法中，正确的是（  ）\nA. 导体的电阻与导体两端的电压成正比\nB. 导体的电阻与通过导体的电流成反比\nC. 电阻是导体本身的一种性质，与电压和电流无关\nD. 导体两端电压为零时，导体的电阻也为零","answer":"答案：C\n解析：电阻是导体本身的一种性质，它的大小取决于导体的材料、长度、横截面积和温度，与导体两端的电压和通过导体的电流无关。欧姆定律的变形公式R=U/I只是电阻的计算式，而不是决定式。即使导体两端电压为零或没有电流通过，导体的电阻依然存在。"},{"id":"g3_physics_026_ex02","knowledge_id":"g3_physics_026","question":"选择题：在国际单位制中，电阻的单位是（  ）\nA. 安培（A）\nB. 伏特（V）\nC. 欧姆（Ω）\nD. 瓦特（W）","answer":"答案：C\n解析：电阻的国际单位是欧姆，简称欧，符号是Ω。比欧姆大的单位有千欧（kΩ）、兆欧（MΩ）。安培（A）是电流的单位，伏特（V）是电压的单位，瓦特（W）是电功率的单位。"},{"id":"g3_physics_026_ex03","knowledge_id":"g3_physics_026","question":"填空题：电阻用字母______表示，国际单位是______，符号是______。常用单位还有______和______，它们的换算关系是1MΩ=______kΩ=______Ω。","answer":"答案：R；欧姆；Ω；千欧（kΩ）；兆欧（MΩ）；1000；10⁶（或1000000）\n解析：电阻用字母R表示，国际单位是欧姆，符号Ω。常用单位有千欧（kΩ）和兆欧（MΩ）。换算关系：1MΩ=1000kΩ，1kΩ=1000Ω，所以1MΩ=10⁶Ω。电阻是导体对电流的阻碍作用，是导体本身的一种性质。"},{"id":"g3_physics_026_ex04","knowledge_id":"g3_physics_026","question":"填空题：某定值电阻两端的电压是3V时，通过它的电流是0.5A，该电阻的阻值是______Ω；当它两端的电压变为6V时，该电阻的阻值是______Ω；当它两端的电压变为0V时，该电阻的阻值是______Ω。","answer":"答案：6；6；6\n解析：根据欧姆定律R=U/I=3V/0.5A=6Ω。因为电阻是导体本身的一种性质，与导体两端的电压和通过的电流无关，所以当电压变为6V或0V时，电阻的阻值不变，仍然是6Ω。注意：电阻是导体本身的属性，不随电压和电流的改变而改变。"},{"id":"g3_physics_026_ex05","knowledge_id":"g3_physics_026","question":"选择题：下列单位换算正确的是（  ）\nA. 2.5kΩ=250Ω\nB. 3.6MΩ=3.6×10⁶Ω\nC. 500Ω=0.05kΩ\nD. 8000Ω=8MΩ","answer":"答案：B\n解析：电阻单位换算关系：1MΩ=1000kΩ=10⁶Ω，1kΩ=1000Ω。\nA选项：2.5kΩ=2.5×1000Ω=2500Ω，A错误；\nB选项：3.6MΩ=3.6×10⁶Ω，B正确；\nC选项：500Ω=500÷1000kΩ=0.5kΩ，C错误；\nD选项：8000Ω=8000÷10⁶MΩ=0.008MΩ，D错误。"},{"id":"g3_physics_026_ex06","knowledge_id":"g3_physics_026","question":"判断题：导体的电阻越大，对电流的阻碍作用就越大。（  ）","answer":"答案：正确\n解析：电阻是表示导体对电流阻碍作用大小的物理量。导体的电阻越大，表示导体对电流的阻碍作用越大；电阻越小，表示对电流的阻碍作用越小。这是电阻的物理意义。"},{"id":"g3_physics_026_ex07","knowledge_id":"g3_physics_026","question":"判断题：通过导体的电流越小，导体的电阻就越大。（  ）","answer":"答案：错误\n解析：电阻是导体本身的一种性质，它的大小由导体的材料、长度、横截面积和温度决定，与通过导体的电流大小和导体两端的电压大小无关。电流小可能是因为电压小，不一定是电阻大。不能说电流越小电阻越大，这是典型的错误认识。"},{"id":"g3_physics_026_ex08","knowledge_id":"g3_physics_026","question":"解答题：一个定值电阻，当它两端加5V电压时，通过它的电流是0.2A。求：（1）该电阻的阻值是多少？（2）如果它两端加12.5V电压时，通过它的电流是多少？（3）如果通过它的电流是0.5A时，它两端的电压是多少？","answer":"答案：（1）该电阻的阻值是25Ω；（2）通过它的电流是0.5A；（3）它两端的电压是12.5V。\n解析：（1）根据欧姆定律I=U/R，可得R=U₁/I₁=5V/0.2A=25Ω。\n（2）电阻是导体本身的性质，电压改变时电阻不变，仍为25Ω。\n当电压U₂=12.5V时，电流I₂=U₂/R=12.5V/25Ω=0.5A。\n（3）当电流I₃=0.5A时，电压U₃=I₃R=0.5A×25Ω=12.5V。\n解析：在电阻一定时，通过导体的电流与导体两端的电压成正比，这是欧姆定律的内容。解题时要注意，对于定值电阻，R是不变的，可以先求出R，再利用R不变来计算其他电压或电流下的对应值。"},{"id":"g3_physics_026_ex09","knowledge_id":"g3_physics_026","question":"选择题：关于导体的电阻，下列说法中正确的是（  ）\nA. 长导线的电阻一定比短导线的电阻大\nB. 粗导线的电阻一定比细导线的电阻小\nC. 铜导线的电阻一定比铁导线的电阻小\nD. 以上说法都不对","answer":"答案：D\n解析：电阻的大小由导体的材料、长度、横截面积和温度共同决定，只知道其中一个因素无法比较电阻的大小。A选项只说了长度，没说材料和横截面积，无法比较；B选项只说了横截面积，没说材料和长度，无法比较；C选项只说了材料，没说长度和横截面积，无法比较。所以以上说法都不对，选D。"},{"id":"g3_physics_026_ex10","knowledge_id":"g3_physics_026","question":"解答题：请列举生活中利用电阻和防止电阻的例子各3个，并说明原理。","answer":"答案：利用电阻的例子：\n1. 电热水壶：利用电阻丝的电阻，电流通过时产生热量，将水加热。利用了电流的热效应。\n2. 白炽灯：利用灯丝（钨丝）的电阻，电流通过时发热发光，将电能转化为内能和光能。\n3. 电阻箱：通过改变接入电路的电阻来改变电流，在电路中起到调节电流、分压的作用。\n\n防止电阻（减小电阻）的例子：\n1. 高压输电：使用高压输电，可以减小输电电流，从而减小输电线上的电阻产生的热量损耗，提高输电效率。\n2. 导线用铜或铝制作：铜和铝的电阻率小，电阻小，可以减小电流通过时的电能损耗。\n3. 电脑CPU的散热片：CPU工作时会产生热量，散热片可以帮助散热，防止温度过高导致电阻增大，影响CPU正常工作。\n\n解析：电阻在生活中既有有利的一面，也有不利的一面。我们需要根据实际需求，合理利用或减小电阻。利用电阻主要是利用电流的热效应，将电能转化为内能；减小电阻主要是为了减少电能损耗，提高效率。"},{"id":"g3_physics_027_ex01","knowledge_id":"g3_physics_027","question":"选择题：滑动变阻器的工作原理是（  ）\nA. 改变电阻丝的材料来改变电阻\nB. 改变电阻丝的横截面积来改变电阻\nC. 改变接入电路中电阻丝的长度来改变电阻\nD. 改变电阻丝的温度来改变电阻","answer":"答案：C\n解析：滑动变阻器的工作原理是通过改变接入电路中电阻丝的长度来改变电阻，从而改变电路中的电流。滑动变阻器的电阻丝是固定在瓷筒上的，通过移动滑片来改变接入电路的电阻丝长度，长度越长，电阻越大；长度越短，电阻越小。"},{"id":"g3_physics_027_ex02","knowledge_id":"g3_physics_027","question":"选择题：一个滑动变阻器铭牌上标有\"50Ω 2A\"的字样，它的含义是（  ）\nA. 电阻的最小值是50Ω，允许通过的最大电流是2A\nB. 电阻的最大值是50Ω，允许通过的最大电流是2A\nC. 电阻的最小值是50Ω，允许通过的最小电流是2A\nD. 电阻的最大值是50Ω，允许通过的最小电流是2A","answer":"答案：B\n解析：滑动变阻器铭牌上的\"50Ω\"表示滑动变阻器的最大阻值是50Ω，也就是变阻范围是0~50Ω；\"2A\"表示滑动变阻器允许通过的最大电流是2A，超过这个电流，滑动变阻器可能会被烧坏。使用时要注意，通过的电流不能超过允许的最大值。"},{"id":"g3_physics_027_ex03","knowledge_id":"g3_physics_027","question":"填空题：滑动变阻器由______、______、______、______和______等部分组成。它的工作原理是通过改变接入电路中______来改变电阻。","answer":"答案：电阻丝；瓷筒；滑片；金属杆；接线柱；电阻丝的长度\n解析：滑动变阻器主要由电阻丝（通常是镍铬合金丝，电阻率大）、瓷筒（绝缘，耐高温）、滑片（可移动）、金属杆（导体）和接线柱（一般有四个）组成。工作原理是通过改变接入电路中电阻丝的长度来改变电阻。"},{"id":"g3_physics_027_ex04","knowledge_id":"g3_physics_027","question":"填空题：滑动变阻器正确的接法是______（选填\"一上一下\"或\"同上同下\"）。如果接上面两个接线柱，滑动变阻器相当于______；如果接下面两个接线柱，滑动变阻器相当于______。","answer":"答案：一上一下；导线（或电阻为零）；定值电阻（或阻值最大）\n解析：滑动变阻器有四个接线柱，正确的接法是\"一上一下\"，这样移动滑片时才能改变接入电路的电阻。如果接上面两个接线柱，相当于接入了一根金属杆，电阻几乎为零；如果接下面两个接线柱，相当于接入了全部电阻丝，电阻最大且不变，相当于一个定值电阻。"},{"id":"g3_physics_027_ex05","knowledge_id":"g3_physics_027","question":"选择题：将滑动变阻器接入电路中，要求滑片向右移动时，电路中的电流变大。下列接法正确的是（  ）\nA. 接左上和左下两个接线柱\nB. 接左上和右下两个接线柱\nC. 接右上和右下两个接线柱\nD. 接左下和右下两个接线柱","answer":"答案：B\n解析：滑片向右移动时电流变大，说明电阻变小，接入电路的电阻丝长度变短。\nA选项：接左上和左下，滑片右移时，接入的电阻丝变长，电阻变大，电流变小，不符合题意；\nB选项：接左上和右下，滑片右移时，接入的电阻丝（右半段）变短，电阻变小，电流变大，符合题意；\nC选项：接右上和右下，相当于接上面两个接线柱，电阻为零且不变，不符合题意；\nD选项：接左下和右下，相当于接下面两个接线柱，电阻最大且不变，不符合题意。"},{"id":"g3_physics_027_ex06","knowledge_id":"g3_physics_027","question":"判断题：滑动变阻器可以改变电路中的电阻，从而改变电流和电压。（  ）","answer":"答案：正确\n解析：滑动变阻器通过改变接入电路的电阻丝长度来改变电阻，根据欧姆定律I=U/R，在电源电压不变时，电阻改变会引起电路中电流的改变；同时，根据U=IR，电阻改变也会引起部分电路两端电压的改变。所以滑动变阻器可以改变电路中的电流和部分电路两端的电压。"},{"id":"g3_physics_027_ex07","knowledge_id":"g3_physics_027","question":"判断题：滑动变阻器在接入电路前，应将滑片调到电阻最大的位置。（  ）","answer":"答案：正确\n解析：滑动变阻器在接入电路前，应将滑片调到电阻最大的位置。这样做的目的是使电路中的电流最小，起到保护电路的作用，防止电流过大烧坏用电器。这是滑动变阻器使用的重要注意事项。"},{"id":"g3_physics_027_ex08","knowledge_id":"g3_physics_027","question":"解答题：一个滑动变阻器铭牌上标有\"20Ω 1.5A\"的字样，电源电压为12V保持不变。将滑动变阻器与一个10Ω的定值电阻串联后接在电源两端。求：（1）滑动变阻器接入电路的电阻最大时，电路中的电流是多少？（2）电路中的电流最大不能超过多少？此时滑动变阻器接入的电阻是多少？","answer":"答案：（1）电路中的电流是0.4A；（2）电路中的电流最大不能超过1.5A，此时滑动变阻器接入的电阻是-2Ω（说明：电流不能达到1.5A，受电源电压限制）。\n解析：（1）滑动变阻器最大阻值R滑大=20Ω，定值电阻R=10Ω，\n串联总电阻R总大=R滑大+R=20Ω+10Ω=30Ω，\n电路中的电流I小=U/R总大=12V/30Ω=0.4A。\n（2）滑动变阻器允许通过的最大电流是1.5A，\n但电路中的最大电流受电源电压和定值电阻限制：\n当滑动变阻器接入电阻为0时，电流最大，I大=U/R=12V/10Ω=1.2A。\n因为1.2A<1.5A，所以电路中的电流最大不能超过1.2A，\n此时滑动变阻器接入的电阻是0Ω。\n\n解析：这道题容易出现的错误是直接认为最大电流是1.5A，而忽略了电源电压和定值电阻的限制。实际上，电路中的最大电流是由多个因素共同决定的，需要综合考虑。"},{"id":"g3_physics_027_ex09","knowledge_id":"g3_physics_027","question":"选择题：下列关于滑动变阻器的说法中，错误的是（  ）\nA. 滑动变阻器可以连续改变接入电路的电阻\nB. 滑动变阻器可以读出具体的电阻值\nC. 滑动变阻器可以改变电路中的电流\nD. 滑动变阻器可以保护电路","answer":"答案：B\n解析：A选项正确，滑动变阻器可以连续改变接入电路的电阻；B选项错误，滑动变阻器不能读出具体的电阻值，只能大致知道电阻的变化范围，能读出具体电阻值的是电阻箱；C选项正确，滑动变阻器通过改变电阻可以改变电路中的电流；D选项正确，滑动变阻器在开关闭合前调到最大阻值，可以起到保护电路的作用。"},{"id":"g3_physics_027_ex10","knowledge_id":"g3_physics_027","question":"解答题：请举例说明滑动变阻器在生活中的应用（至少3个例子），并说明它们分别是如何利用滑动变阻器工作的。","answer":"答案：滑动变阻器在生活中的应用：\n1. 收音机的音量调节旋钮：通过调节滑动变阻器的电阻来改变电路中的电流，从而改变扬声器的音量大小。电阻越小，电流越大，音量越大；反之音量越小。\n2. 可调亮度的台灯：通过调节滑动变阻器的电阻来改变灯泡中的电流，从而改变灯泡的亮度。电阻越小，电流越大，灯泡越亮；反之越暗。\n3. 可调速的电风扇：通过调节滑动变阻器的电阻来改变电动机中的电流，从而改变风扇的转速。电阻越小，电流越大，转速越快；反之越慢。\n4. 调音台的推子：通过推动推子（滑动变阻器的滑片）来改变电阻，从而调节各声道的音量大小。\n\n解析：滑动变阻器在生活中应用广泛，凡是需要调节电流大小从而改变用电器工作状态的地方，都可能用到滑动变阻器。它们的工作原理都是利用改变接入电路的电阻丝长度来改变电阻，从而改变电流。"},{"id":"g3_physics_028_ex01","knowledge_id":"g3_physics_028","question":"选择题：关于串联电路的电压规律，下列说法正确的是（  ）\nA. 串联电路中各处的电压都相等\nB. 串联电路两端的总电压等于各部分电路两端的电压之和\nC. 串联电路中各用电器两端的电压一定相等\nD. 串联电路中电压处处相等","answer":"答案：B\n解析：串联电路的电压规律是：串联电路两端的总电压等于各部分电路两端的电压之和，即U总=U₁+U₂+...。A选项错误，串联电路中各处的电流相等，而不是电压相等；C选项错误，只有当各用电器的电阻相等时，它们两端的电压才相等，否则不相等；D选项错误，串联电路中电流处处相等，电压不是处处相等。"},{"id":"g3_physics_028_ex02","knowledge_id":"g3_physics_028","question":"选择题：关于并联电路的电压规律，下列说法正确的是（  ）\nA. 并联电路中干路的电压等于各支路电压之和\nB. 并联电路中各支路两端的电压都相等，且等于电源电压\nC. 并联电路中各支路的电压一定不相等\nD. 并联电路中电阻大的支路电压大","answer":"答案：B\n解析：并联电路的电压规律是：并联电路中各支路两端的电压都相等，且等于电源电压，即U总=U₁=U₂=...。A选项错误，这是串联电路的电压规律；C选项错误，并联各支路电压相等；D选项错误，并联各支路电压相等，与电阻大小无关。"},{"id":"g3_physics_028_ex03","knowledge_id":"g3_physics_028","question":"填空题：串联电路中，总电压等于______，数学表达式为______；并联电路中，各支路两端的电压______，且等于______，数学表达式为______。","answer":"答案：各部分电路两端的电压之和；U=U₁+U₂+...；都相等；电源电压；U=U₁=U₂=...\n解析：这是串并联电路的基本电压规律，需要牢记。串联电路分压，总电压等于各部分电压之和；并联电路各支路电压相等，都等于电源电压。这两条规律是电学计算的基础，必须熟练掌握。"},{"id":"g3_physics_028_ex04","knowledge_id":"g3_physics_028","question":"填空题：两个电阻R₁=10Ω和R₂=20Ω串联后接在6V的电源上，则R₁两端的电压是______V，R₂两端的电压是______V。","answer":"答案：2；4\n解析：串联电路总电阻R总=R₁+R₂=10Ω+20Ω=30Ω，\n电路中的电流I=U总/R总=6V/30Ω=0.2A，\n串联电路电流处处相等，\n所以R₁两端的电压U₁=IR₁=0.2A×10Ω=2V，\nR₂两端的电压U₂=IR₂=0.2A×20Ω=4V。\n验证：U₁+U₂=2V+4V=6V=U总，符合串联电压规律。\n也可以用分压公式：U₁/U₂=R₁/R₂，即U₁/U₂=10/20=1/2，\n又U₁+U₂=6V，解得U₁=2V，U₂=4V。"},{"id":"g3_physics_028_ex05","knowledge_id":"g3_physics_028","question":"选择题：两个电阻并联后接在电源两端，下列说法中正确的是（  ）\nA. 电阻大的支路电流大，电压也大\nB. 电阻小的支路电流大，电压也大\nC. 两个支路的电流相等，电压也相等\nD. 两个支路的电压相等，电阻小的支路电流大","answer":"答案：D\n解析：并联电路各支路两端的电压相等，所以A、B选项错误。根据欧姆定律I=U/R，电压相等时，电阻越小，电流越大，所以C选项错误，D选项正确。并联电路的特点是：电压相等，电流与电阻成反比（即电阻小的支路电流大）。"},{"id":"g3_physics_028_ex06","knowledge_id":"g3_physics_028","question":"判断题：在串联电路中，电阻越大的用电器两端的电压越大。（  ）","answer":"答案：正确\n解析：在串联电路中，电流处处相等，根据U=IR，电流I相同，电阻R越大，电压U就越大。也就是说，在串联电路中，电压的分配与电阻成正比，电阻越大，分得的电压越大。这就是串联电路的分压原理。"},{"id":"g3_physics_028_ex07","knowledge_id":"g3_physics_028","question":"判断题：在并联电路中，电阻越大的支路，电流越大。（  ）","answer":"答案：错误\n解析：在并联电路中，各支路两端的电压相等，根据I=U/R，电压U相同，电阻R越大，电流I就越小。也就是说，在并联电路中，电流的分配与电阻成反比，电阻越大，支路电流越小。所以题目中的说法是错误的。"},{"id":"g3_physics_028_ex08","knowledge_id":"g3_physics_028","question":"解答题：如图所示，电源电压为12V保持不变，R₁=10Ω，R₂=20Ω，R₃=30Ω。求：（1）当S₁闭合、S₂断开时，电压表的示数是多少？（2）当S₁断开、S₂闭合时，电压表的示数是多少？（3）当S₁、S₂都闭合时，电压表的示数是多少？","answer":"答案：（1）电压表的示数是4V；（2）电压表的示数是12V；（3）电压表的示数是0V。\n解析：（1）当S₁闭合、S₂断开时，R₁与R₂串联，电压表测R₁两端的电压。\n总电阻R总=R₁+R₂=10Ω+20Ω=30Ω，\n电路中的电流I=U总/R总=12V/30Ω=0.4A，\nR₁两端的电压U₁=IR₁=0.4A×10Ω=4V，即电压表示数为4V。\n（2）当S₁断开、S₂闭合时，R₂与R₃串联，电压表测电源电压（或测R₂和R₃的总电压），所以电压表示数为12V。\n（3）当S₁、S₂都闭合时，R₂被短路，电压表也被短路，所以电压表示数为0V。\n\n解析：这道题考查了开关切换时电路的变化，需要先分析电路的连接方式，再根据串并联电路的电压规律进行计算。关键是要正确判断电压表测量的是哪部分电路的电压。"},{"id":"g3_physics_028_ex09","knowledge_id":"g3_physics_028","question":"选择题：将R₁、R₂、R₃三个电阻串联后接在电源两端，已知U₁:U₂:U₃=1:2:3，则R₁:R₂:R₃等于（  ）\nA. 1:2:3\nB. 3:2:1\nC. 6:3:2\nD. 无法确定","answer":"答案：A\n解析：在串联电路中，电流处处相等，根据U=IR，\nU₁=IR₁，U₂=IR₂，U₃=IR₃，\n所以U₁:U₂:U₃=IR₁:IR₂:IR₃=R₁:R₂:R₃=1:2:3。\n即在串联电路中，电压之比等于电阻之比（电压与电阻成正比）。所以选A。"},{"id":"g3_physics_028_ex10","knowledge_id":"g3_physics_028","question":"解答题：家里的电灯、电视、电冰箱等家用电器都是并联在家庭电路中的。请你从电压和使用两个角度分析，为什么家庭电路中的用电器要采用并联方式而不是串联方式？","answer":"答案：家庭电路中的用电器采用并联方式的原因：\n\n一、从电压角度分析：\n1. 并联电路各支路两端的电压相等，都等于电源电压（220V）。各家用电器的额定电压都是220V，并联时每个用电器都能在额定电压下正常工作。\n2. 如果采用串联方式，根据串联分压原理，各用电器两端的电压之和才等于电源电压，每个用电器两端的电压都会低于220V，无法正常工作。例如，两个相同的灯泡串联，每个灯泡两端的电压只有110V，灯泡会很暗甚至不发光。\n\n二、从使用角度分析：\n1. 并联电路中各用电器可以独立工作，互不影响。关闭一个用电器，其他用电器仍然可以正常工作。例如，关掉电视机，电灯仍然可以亮。\n2. 如果采用串联方式，电路中只要有一个用电器断开（如烧坏），整个电路就会断路，所有用电器都不能工作。\n3. 并联电路中可以单独控制每个用电器的开关，使用方便。\n\n解析：并联电路的特点是各支路电压相等、各支路独立工作互不影响，这正好符合家庭电路的使用需求。而串联电路的特点是电流只有一条路径、各用电器相互影响、分压供电，不适合家庭使用。"},{"id":"g3_physics_029_ex01","knowledge_id":"g3_physics_029","question":"选择题：伏安法测电阻的实验原理是（  ）\nA. I=U/R\nB. U=IR\nC. R=U/I\nD. P=UI","answer":"答案：C\n解析：伏安法测电阻的实验原理是R=U/I，即通过测量待测电阻两端的电压U和通过待测电阻的电流I，然后利用公式R=U/I计算出电阻的阻值。这是欧姆定律的变形公式。虽然实验原理是R=U/I，但电阻是导体本身的一种性质，与电压和电流无关。"},{"id":"g3_physics_029_ex02","knowledge_id":"g3_physics_029","question":"选择题：在伏安法测电阻的实验中，滑动变阻器不能起到的作用是（  ）\nA. 改变电路中的电流\nB. 改变待测电阻两端的电压\nC. 改变待测电阻的阻值\nD. 保护电路","answer":"答案：C\n解析：在伏安法测电阻实验中，滑动变阻器的作用有：（1）保护电路，闭合开关前将滑片调到最大阻值处，使电路中电流最小；（2）改变电路中的电流；（3）改变待测电阻两端的电压，从而可以多次测量求平均值减小误差。但滑动变阻器不能改变待测电阻的阻值，因为电阻是导体本身的性质，与电压和电流无关。"},{"id":"g3_physics_029_ex03","knowledge_id":"g3_physics_029","question":"填空题：伏安法测电阻的实验中，需要测量的物理量是______和______，需要的测量工具是______和______。实验原理是______。","answer":"答案：待测电阻两端的电压；通过待测电阻的电流；电压表；电流表；R=U/I\n解析：伏安法测电阻的原理是R=U/I，所以需要测量的物理量是电压和电流，测量电压用电压表，测量电流用电流表。电压表并联在待测电阻两端，电流表串联在电路中。通过多组测量求平均值可以减小误差。"},{"id":"g3_physics_029_ex04","knowledge_id":"g3_physics_029","question":"填空题：在伏安法测电阻的实验中，连接电路时开关应______，滑动变阻器的滑片应调到______的位置。多次测量的目的是______。","answer":"答案：断开；电阻最大；求平均值减小误差\n解析：连接电路时开关应断开，防止连接过程中电路短路，保护电路元件。滑动变阻器的滑片应调到电阻最大的位置，这样闭合开关时电路中电流最小，同样起到保护电路的作用。多次测量求平均值是为了减小误差，使测量结果更准确。"},{"id":"g3_physics_029_ex05","knowledge_id":"g3_physics_029","question":"选择题：在伏安法测电阻实验中，某同学测得了三组数据，分别是：U₁=2V，I₁=0.2A；U₂=4V，I₂=0.4A；U₃=6V，I₃=0.58A。则该电阻的阻值约为（  ）\nA. 10Ω\nB. 10.1Ω\nC. 10.3Ω\nD. 10.5Ω","answer":"答案：B\n解析：分别计算三次测量的电阻值：\nR₁=U₁/I₁=2V/0.2A=10Ω\nR₂=U₂/I₂=4V/0.4A=10Ω\nR₃=U₃/I₃=6V/0.58A≈10.3Ω\n然后求平均值：\nR=(R₁+R₂+R₃)/3=(10Ω+10Ω+10.3Ω)/3≈10.1Ω\n所以该电阻的阻值约为10.1Ω，选B。\n注意：多次测量求平均值可以减小误差，但要注意单位和有效数字。"},{"id":"g3_physics_029_ex06","knowledge_id":"g3_physics_029","question":"判断题：在伏安法测电阻实验中，滑动变阻器的作用只是为了改变电流，进行多次测量。（  ）","answer":"答案：错误\n解析：滑动变阻器在实验中有两个重要作用：一是保护电路，闭合开关前将滑片调到最大阻值处，使电流最小，防止电流过大烧坏元件；二是改变电路中的电流和待测电阻两端的电压，以便多次测量求平均值减小误差。题目中只说了一个作用，忽略了保护电路的作用，所以是错误的。"},{"id":"g3_physics_029_ex07","knowledge_id":"g3_physics_029","question":"判断题：伏安法测电阻时，测量的电压越大，测得的电阻值也越大。（  ）","answer":"答案：错误\n解析：电阻是导体本身的一种性质，它的大小取决于导体的材料、长度、横截面积和温度，与导体两端的电压和通过的电流无关。虽然我们用R=U/I来计算电阻，但电压和电流的改变不会引起电阻的改变（不考虑温度影响）。所以电压越大，电流也越大，但电阻不变。"},{"id":"g3_physics_029_ex08","knowledge_id":"g3_physics_029","question":"解答题：小明在做伏安法测电阻的实验时，电源电压为6V，待测电阻约为10Ω。实验室有如下器材：电流表（0~0.6A、0~3A）、电压表（0~3V、0~15V）、滑动变阻器（10Ω 1A）、开关、导线若干。请回答：（1）电流表应选哪个量程？电压表应选哪个量程？（2）滑动变阻器的作用是什么？（3）如果实验中电流表的示数为0.3A，电压表的示数为3V，那么待测电阻的阻值是多少？","answer":"答案：（1）电流表选0~0.6A量程，电压表选0~15V量程；（2）滑动变阻器的作用是保护电路和改变电路中的电流（多次测量求平均值减小误差）；（3）待测电阻的阻值是10Ω。\n解析：（1）电源电压为6V，所以电压表应选0~15V量程（因为电源电压超过3V）。\n电路中的最大电流约为I=U/R=6V/10Ω=0.6A，所以电流表选0~0.6A量程（这样测量更精确）。\n（2）滑动变阻器的作用：①保护电路，闭合开关前调到最大阻值处；②改变电路中的电流和待测电阻两端的电压，进行多次测量，求平均值以减小误差。\n（3）根据欧姆定律R=U/I=3V/0.3A=10Ω。\n\n解析：量程的选择原则是在不超过量程的前提下，尽量选用小量程，这样测量更精确。伏安法测电阻是初中物理的重要实验，要掌握实验原理、器材选择、电路连接、实验步骤和数据处理。"},{"id":"g3_physics_029_ex09","knowledge_id":"g3_physics_029","question":"选择题：在伏安法测电阻的实验中，下列操作有问题的是（  ）\nA. 连接电路时，开关应断开\nB. 电流表应串联在被测电路中\nC. 电压表应并联在被测电阻两端\nD. 开关闭合前，滑动变阻器的滑片应调到阻值最小的位置","answer":"答案：D\n解析：A选项正确，连接电路时开关断开，防止短路；B选项正确，电流表应串联在电路中；C选项正确，电压表应并联在被测电阻两端；D选项错误，开关闭合前，滑动变阻器的滑片应调到阻值最大的位置，这样电路中电流最小，起到保护电路的作用。如果调到阻值最小的位置，闭合开关时电流可能过大，烧坏元件。"},{"id":"g3_physics_029_ex10","knowledge_id":"g3_physics_029","question":"解答题：在伏安法测电阻的实验中，小红同学按正确的方法连接好电路后，闭合开关，发现：（1）电流表有示数，电压表无示数，故障可能是什么？（2）电流表无示数，电压表有示数且接近电源电压，故障可能是什么？（3）电流表和电压表都无示数，故障可能是什么？请分别分析原因。","answer":"答案：（1）电流表有示数，电压表无示数，故障可能是：待测电阻短路（或电压表接触不良、电压表断路）。\n（2）电流表无示数，电压表有示数且接近电源电压，故障可能是：待测电阻断路。\n（3）电流表和电压表都无示数，故障可能是：滑动变阻器断路（或开关接触不良、电源断路等，即干路断路）。\n\n解析：\n（1）电流表有示数，说明电路是通路；电压表无示数，说明与电压表并联的部分短路（电阻为零，电压为零），或者电压表本身接触不良或断路。最常见的是待测电阻短路。\n（2）电流表无示数，说明电路断路；电压表有示数且接近电源电压，说明电压表的两个接线柱到电源两极是通的，因此断路位置在与电压表并联的部分，即待测电阻断路。此时电压表串联在电路中，由于电压表内阻很大，电路中电流几乎为零，电压表测的是电源电压。\n（3）电流表和电压表都无示数，说明整个电路是断路的，且断路位置在干路（电压表也无法接到电源上），如滑动变阻器断路、开关接触不良、电源断路等。\n\n解析：电路故障分析是电学实验的重点和难点，关键是要根据电流表和电压表的示数情况，结合串并联电路的特点来判断故障位置。"},{"id":"g3_physics_030_ex01","knowledge_id":"g3_physics_030","question":"选择题：两个电阻串联后，总电阻与其中任何一个电阻相比（  ）\nA. 总电阻大于任何一个分电阻\nB. 总电阻小于任何一个分电阻\nC. 总电阻等于其中较大的一个电阻\nD. 总电阻等于其中较小的一个电阻","answer":"答案：A\n解析：电阻串联后，总电阻等于各串联电阻之和，即R总=R₁+R₂+...。因此，串联后的总电阻大于任何一个分电阻。这是因为电阻串联相当于增加了导体的长度，导体越长，电阻越大。"},{"id":"g3_physics_030_ex02","knowledge_id":"g3_physics_030","question":"选择题：两个电阻并联后，总电阻与其中任何一个电阻相比（  ）\nA. 总电阻大于任何一个分电阻\nB. 总电阻小于任何一个分电阻\nC. 总电阻等于其中较大的一个电阻\nD. 总电阻等于其中较小的一个电阻","answer":"答案：B\n解析：电阻并联后，总电阻的倒数等于各并联电阻的倒数之和，即1/R总=1/R₁+1/R₂+...。因此，并联后的总电阻小于任何一个分电阻。这是因为电阻并联相当于增加了导体的横截面积，横截面积越大，电阻越小。"},{"id":"g3_physics_030_ex03","knowledge_id":"g3_physics_030","question":"填空题：串联电路的总电阻等于______，数学表达式为______；并联电路总电阻的倒数等于______，数学表达式为______。n个相同的电阻R串联，总电阻为______；n个相同的电阻R并联，总电阻为______。","answer":"答案：各串联电阻之和；R总=R₁+R₂+...；各并联电阻的倒数之和；1/R总=1/R₁+1/R₂+...；nR；R/n\n解析：串联电阻相当于增加了导体的长度，所以总电阻等于各电阻之和；并联电阻相当于增加了导体的横截面积，所以总电阻比任何一个分电阻都小。n个相同电阻R串联，R总=nR；n个相同电阻R并联，R总=R/n。这些都是重要的规律。"},{"id":"g3_physics_030_ex04","knowledge_id":"g3_physics_030","question":"填空题：R₁=10Ω，R₂=20Ω，将它们串联后接在6V电源上，总电阻是______Ω，电路中的电流是______A；将它们并联后接在6V电源上，总电阻是______Ω，干路中的电流是______A。","answer":"答案：30；0.2；约6.67；0.9\n解析：串联时：\n总电阻R串=R₁+R₂=10Ω+20Ω=30Ω\n电路中的电流I串=U/R串=6V/30Ω=0.2A\n并联时：\n根据1/R并=1/R₁+1/R₂=1/10Ω+1/20Ω=3/20Ω⁻¹\n所以R并=20/3Ω≈6.67Ω\n干路电流I并=U/R并=6V/(20/3Ω)=0.9A\n也可以分别计算各支路电流再相加：\nI₁=U/R₁=6V/10Ω=0.6A，I₂=U/R₂=6V/20Ω=0.3A\nI并=I₁+I₂=0.6A+0.3A=0.9A"},{"id":"g3_physics_030_ex05","knowledge_id":"g3_physics_030","question":"选择题：将一个10Ω的电阻和一个______Ω的电阻并联，可得到4Ω的总电阻。\nA. 4Ω\nB. 6Ω\nC. 20/3Ω\nD. 25Ω","answer":"答案：C\n解析：设另一个电阻为R₂，根据并联电阻公式：\n1/R总=1/R₁+1/R₂\n代入数据：1/4Ω=1/10Ω+1/R₂\n1/R₂=1/4Ω-1/10Ω=(5-2)/20Ω=3/20Ω⁻¹\n所以R₂=20/3Ω≈6.67Ω\n也可以用公式：R总=R₁R₂/(R₁+R₂)，代入求解得同样结果。"},{"id":"g3_physics_030_ex06","knowledge_id":"g3_physics_030","question":"判断题：电阻串联后总电阻变大，是因为串联相当于增加了导体的长度。（  ）","answer":"答案：正确\n解析：导体的电阻与长度有关，在材料和横截面积相同时，长度越长，电阻越大。电阻串联后，相当于把几段导体接在一起，总长度变长了，所以总电阻变大，且大于任何一个分电阻。这就是串联电阻总电阻变大的微观解释。"},{"id":"g3_physics_030_ex07","knowledge_id":"g3_physics_030","question":"判断题：电阻并联后总电阻变小，是因为并联相当于增加了导体的横截面积。（  ）","answer":"答案：正确\n解析：导体的电阻与横截面积有关，在材料和长度相同时，横截面积越大，电阻越小。电阻并联后，相当于把几段导体并列在一起，总横截面积变大了，所以总电阻变小，且小于任何一个分电阻。这就是并联电阻总电阻变小的微观解释。"},{"id":"g3_physics_030_ex08","knowledge_id":"g3_physics_030","question":"解答题：有两个电阻，R₁=6Ω，R₂=12Ω。求：（1）将它们串联后的总电阻是多少？（2）将它们并联后的总电阻是多少？（3）如果将它们串联后接在9V的电源上，电路中的电流是多少？（4）如果将它们并联后接在9V的电源上，干路中的电流是多少？","answer":"答案：（1）串联总电阻是18Ω；（2）并联总电阻是4Ω；（3）串联时电路中的电流是0.5A；（4）并联时干路电流是2.25A。\n解析：（1）串联总电阻：R串=R₁+R₂=6Ω+12Ω=18Ω\n（2）并联总电阻：\n方法一：1/R并=1/R₁+1/R₂=1/6Ω+1/12Ω=2/12Ω+1/12Ω=3/12Ω=1/4Ω⁻¹\n所以R并=4Ω\n方法二：R并=R₁R₂/(R₁+R₂)=(6Ω×12Ω)/(6Ω+12Ω)=72Ω²/18Ω=4Ω\n（3）串联时电流：I串=U/R串=9V/18Ω=0.5A\n（4）并联时干路电流：\n方法一：I并=U/R并=9V/4Ω=2.25A\n方法二：分别求支路电流再相加\nI₁=U/R₁=9V/6Ω=1.5A\nI₂=U/R₂=9V/12Ω=0.75A\nI并=I₁+I₂=1.5A+0.75A=2.25A\n\n解析：串并联电阻的计算是电学计算的基础，要熟练掌握。并联电阻的计算可以用倒数公式，也可以用R=R₁R₂/(R₁+R₂)的公式（只适用于两个电阻并联）。"},{"id":"g3_physics_030_ex09","knowledge_id":"g3_physics_030","question":"选择题：下列四组电阻并联后，总电阻最小的是（  ）\nA. 10Ω和20Ω\nB. 10Ω和10Ω\nC. 5Ω和5Ω\nD. 100Ω和1Ω","answer":"答案：D\n解析：并联总电阻小于任何一个分电阻，所以可以快速判断。\nA选项：R并A=10×20/(10+20)=200/30≈6.67Ω\nB选项：R并B=10×10/(10+10)=100/20=5Ω\nC选项：R并C=5×5/(5+5)=25/10=2.5Ω\nD选项：R并D=100×1/(100+1)=100/101≈0.99Ω\n或者更简单的方法：并联总电阻比最小的分电阻还小，D选项中最小的电阻是1Ω，所以总电阻小于1Ω，显然是最小的。所以选D。"},{"id":"g3_physics_030_ex10","knowledge_id":"g3_physics_030","question":"解答题：在修理电子设备时，需要一个10Ω的电阻，但手边只有若干个2Ω和5Ω的电阻。请你设计两种不同的方案来得到10Ω的电阻，画出电路图并说明理由。","answer":"答案：方案一：用5个2Ω的电阻串联。\n因为串联总电阻等于各电阻之和，R总=5×2Ω=10Ω。\n电路图：五个2Ω电阻依次连接成一串。\n\n方案二：用2个5Ω的电阻串联。\nR总=5Ω+5Ω=10Ω。\n电路图：两个5Ω电阻依次连接。\n\n方案三：用2Ω和5Ω的电阻混联（例如5个2Ω并联得到0.4Ω，再串联...这种方法比较复杂，不推荐）。\n\n最简单的两种方案是：\n1. 两个5Ω电阻串联：R总=R₁+R₂=5Ω+5Ω=10Ω\n2. 五个2Ω电阻串联：R总=nR=5×2Ω=10Ω\n\n另外，也可以用并联的方式，但需要更多的电阻：\n如果用20Ω的电阻并联可以得到10Ω，但题目只有2Ω和5Ω的，所以并联方式需要更多电阻组合，不如串联简单。\n\n解析：串联电阻的总电阻等于各电阻之和，所以要得到更大的电阻，可以用电阻串联的方法。这道题考查了串联电阻规律的应用，培养了灵活运用知识解决实际问题的能力。"},{"id":"g3_physics_031_ex01","knowledge_id":"g3_physics_031","question":"选择题：下列关于电压表使用的说法中，正确的是（  ）\nA. 电压表要串联在被测电路中\nB. 电压表要并联在被测电路两端\nC. 电压表可以直接接在电源两端，测电源电压\nD. B和C都正确","answer":"答案：D\n解析：电压表的使用规则：（1）电压表要并联在被测电路两端；（2）电流要从正接线柱流入，负接线柱流出；（3）被测电压不要超过电压表的量程。在不超过量程的前提下，电压表可以直接接在电源两端，测电源电压，因为电压表内阻很大，电路中电流很小，不会烧坏电压表。所以B和C都正确，选D。"},{"id":"g3_physics_031_ex02","knowledge_id":"g3_physics_031","question":"选择题：学生用的电压表一般有两个量程，它们是（  ）\nA. 0~3V和0~15V\nB. 0~3V和0~30V\nC. 0~15V和0~220V\nD. 0~1V和0~5V","answer":"答案：A\n解析：学生实验室常用的电压表有三个接线柱，两个量程：0~3V和0~15V。0~3V量程的分度值是0.1V，0~15V量程的分度值是0.5V。两个量程使用的是同一个表盘，读数时要注意所选的量程。"},{"id":"g3_physics_031_ex03","knowledge_id":"g3_physics_031","question":"填空题：电压表的使用规则：（1）电压表要______在被测电路两端；（2）电流要从______接线柱流入，从______接线柱流出；（3）被测电压不要超过电压表的______。在不能预先估计被测电压大小时，应采用______的方法来判断电压是否超过量程。","answer":"答案：并联；正；负；量程；试触\n解析：电压表的使用规则可以简单记为：并联、正进负出、不超量程。试触的方法：先选大量程，用开关快速试触，观察指针偏转情况，如果指针偏转较小，说明电压在小量程范围内，为了测量更精确，可以换用小量程；如果指针偏转超过量程，就要换用更大量程的电压表。"},{"id":"g3_physics_031_ex04","knowledge_id":"g3_physics_031","question":"填空题：学生用电压表有0~3V和0~15V两个量程。使用0~3V量程时，分度值是______V；使用0~15V量程时，分度值是______V。如果指针指在第15个小格上，用0~3V量程读数是______V，用0~15V量程读数是______V。","answer":"答案：0.1；0.5；1.5；7.5\n解析：0~3V量程：表盘有30个小格，每大格1V，每大格分10小格，所以分度值=1V÷10=0.1V。\n0~15V量程：表盘同样有30个小格，每大格5V，每大格分10小格，所以分度值=5V÷10=0.5V。\n指针指在第15个小格：\n用0~3V量程：U=15×0.1V=1.5V\n用0~15V量程：U=15×0.5V=7.5V\n注意：同一指针位置，0~15V量程的读数是0~3V量程读数的5倍。"},{"id":"g3_physics_031_ex05","knowledge_id":"g3_physics_031","question":"选择题：某同学用电压表测电压时，应选用0~3V量程，但他误用了0~15V量程，这样做的结果是（  ）\nA. 指针偏转角度变大，可能损坏电压表\nB. 指针偏转角度变小，读数不准确\nC. 指针偏转角度变小，读数更准确\nD. 指针不动","answer":"答案：B\n解析：0~15V量程的分度值是0.5V，0~3V量程的分度值是0.1V。当被测电压较小时，用大量程测量，指针偏转角度小，分度值大，测量结果不够精确。但不会损坏电压表，因为实际电压没有超过小量程，当然也不会超过大量程。所以结果是指针偏转角度变小，读数不够准确，选B。"},{"id":"g3_physics_031_ex06","knowledge_id":"g3_physics_031","question":"判断题：电流表和电压表都不能直接接在电源两端。（  ）","answer":"答案：错误\n解析：电流表不能直接接在电源两端，因为电流表内阻很小，直接接在电源两端会造成短路，电流很大，烧坏电流表。但是电压表可以直接接在电源两端，因为电压表内阻很大，电路中电流很小，不会烧坏电压表，此时电压表测的是电源电压。所以题目中的说法是错误的。"},{"id":"g3_physics_031_ex07","knowledge_id":"g3_physics_031","question":"判断题：使用电压表测电压时，电流要从正接线柱流入，负接线柱流出。如果接反了，电压表指针会反向偏转，可能损坏电压表。（  ）","answer":"答案：正确\n解析：电压表的正负接线柱不能接反，必须让电流从正接线柱流入，负接线柱流出。如果接反了，指针会反向偏转（向左偏），不仅无法读数，还可能把指针打弯，损坏电压表。这也是电压表使用的重要注意事项之一。"},{"id":"g3_physics_031_ex08","knowledge_id":"g3_physics_031","question":"解答题：小红想测一节干电池的电压，她手边有一个电压表（0~3V、0~15V两个量程）。请回答：（1）她应该选用哪个量程？为什么？（2）电压表应该怎样连接在电池两端？（3）如果她不知道电池的正负极，如何用电压表判断电池的正负极？","answer":"答案：（1）应选用0~3V量程。因为一节干电池的电压是1.5V，在0~3V量程范围内，用小量程测量更精确。\n（2）电压表应该并联在电池两端，让电流从正接线柱流入，负接线柱流出，也就是电压表的正接线柱接电池的正极，负接线柱接电池的负极。\n（3）判断电池正负极的方法：\n将电压表的两个接线柱分别接在电池的两极上，采用试触的方法（快速接触一下）。如果指针正向偏转（向右偏），说明与电压表正接线柱相连的是电池的正极，与负接线柱相连的是电池的负极；如果指针反向偏转（向左偏），说明与电压表正接线柱相连的是电池的负极，与负接线柱相连的是电池的正极。\n\n解析：这道题综合考查了电压表的使用方法，包括量程选择、连接方式和正负极判断。试触法是电学实验中常用的方法，不仅可以判断正负接线柱是否接反，还可以判断电压是否超过量程。"},{"id":"g3_physics_031_ex09","knowledge_id":"g3_physics_031","question":"选择题：在并联电路中，用电压表分别测量各支路两端的电压和电源电压，测量结果是（  ）\nA. 各支路电压相等，电源电压等于各支路电压之和\nB. 各支路电压相等，且等于电源电压\nC. 各支路电压不相等，电源电压最大\nD. 无法确定","answer":"答案：B\n解析：并联电路的电压规律是：各支路两端的电压都相等，且等于电源电压。所以用电压表测量时，各支路电压相等，都等于电源电压。这是并联电路的基本规律之一，也是家庭电路中各用电器并联的原因之一——每个用电器都能得到220V的电压。"},{"id":"g3_physics_031_ex10","knowledge_id":"g3_physics_031","question":"解答题：小明在做\"用电压表测电压\"的实验时，连接好电路闭合开关后，发现电压表指针出现了以下几种异常情况。请你分别分析可能的原因。\n（1）指针不偏转；\n（2）指针反向偏转；\n（3）指针偏转超过量程；\n（4）指针偏转角度很小。","answer":"答案：（1）指针不偏转的可能原因：\n① 电路中没有电流（如电路断路、电源没电等）；\n② 电压表接线柱接触不良；\n③ 电压表内部断路；\n④ 被测部分电路短路（电压为零）。\n\n（2）指针反向偏转的原因：\n电压表的正负接线柱接反了，电流从负接线柱流入，正接线柱流出，导致指针反向偏转。\n\n（3）指针偏转超过量程的原因：\n① 被测电压超过了电压表所选的量程；\n② 量程选择太小，应该换用更大的量程。\n\n（4）指针偏转角度很小的原因：\n① 被测电压很小；\n② 电压表选择的量程太大，应该换用更小的量程（在不超过量程的前提下，用小量程测量更精确）。\n\n解析：电压表的异常现象分析是实验题的常考内容，关键是要结合电压表的使用规则和电路故障来综合分析。掌握这些常见故障的分析方法，对提高实验能力很有帮助。"},{"id":"g3_physics_032_ex01","knowledge_id":"g3_physics_032","question":"选择题：导体的电阻大小与下列哪个因素无关（  ）\nA. 导体的材料\nB. 导体的长度\nC. 导体两端的电压\nD. 导体的横截面积","answer":"答案：C\n解析：导体的电阻是导体本身的一种性质，它的大小取决于导体的材料、长度、横截面积和温度，与导体两端的电压和通过导体的电流无关。电压和电流只是用来计算电阻大小的，不能决定电阻的大小。所以选C。"},{"id":"g3_physics_032_ex02","knowledge_id":"g3_physics_032","question":"选择题：在温度一定时，比较两根镍铬合金线电阻的大小，下列说法正确的是（  ）\nA. 长导线的电阻一定大\nB. 粗导线的电阻一定大\nC. 长度相同时，粗导线的电阻大\nD. 横截面积相同时，长导线的电阻大","answer":"答案：D\n解析：在材料和温度相同时，导体的电阻与长度成正比，与横截面积成反比。A选项只说了长度，没说横截面积，无法比较；B选项只说了横截面积，没说长度，无法比较；C选项错误，长度相同时，横截面积越大（越粗），电阻越小；D选项正确，横截面积相同时，长度越长，电阻越大。"},{"id":"g3_physics_032_ex03","knowledge_id":"g3_physics_032","question":"填空题：导体的电阻是导体本身的一种性质，它的大小取决于导体的______、______、______和______。在探究影响电阻大小的因素时，常用的实验方法是______。","answer":"答案：材料；长度；横截面积；温度；控制变量法\n解析：影响电阻大小的因素有四个：材料、长度、横截面积和温度。电阻是导体本身的性质，与电压和电流无关。在探究多个因素对电阻的影响时，需要用控制变量法，即每次只改变一个因素，控制其他因素不变，来研究这个因素对电阻的影响。"},{"id":"g3_physics_032_ex04","knowledge_id":"g3_physics_032","question":"填空题：有三根相同材料制成的电阻丝，甲和乙粗细相同，但甲比乙长；乙和丙长度相同，但丙比乙粗。则三根电阻丝的电阻从大到小的顺序是______>______>______。","answer":"答案：甲；乙；丙\n解析：材料相同时，电阻与长度成正比（越长电阻越大），与横截面积成反比（越粗电阻越小）。\n甲和乙粗细相同（横截面积相同），甲比乙长，所以R甲>R乙；\n乙和丙长度相同，丙比乙粗（丙的横截面积大），所以R乙>R丙；\n综上可得：R甲>R乙>R丙。\n解题关键：运用控制变量的思想，两两比较，最后排序。"},{"id":"g3_physics_032_ex05","knowledge_id":"g3_physics_032","question":"选择题：关于温度对电阻的影响，下列说法正确的是（  ）\nA. 金属导体的电阻随温度升高而减小\nB. 金属导体的电阻随温度升高而增大\nC. 所有导体的电阻都随温度升高而增大\nD. 所有导体的电阻都不随温度变化","answer":"答案：B\n解析：大多数金属导体的电阻随温度升高而增大，因为温度升高时，金属内部的自由电子运动更剧烈，碰撞增多，电阻变大。但不是所有导体都这样，例如石墨的电阻随温度升高而减小，有些半导体材料的电阻随温度变化更明显。所以A、C、D都不正确，选B。"},{"id":"g3_physics_032_ex06","knowledge_id":"g3_physics_032","question":"判断题：导体越长，电阻一定越大。（  ）","answer":"答案：错误\n解析：导体的电阻由材料、长度、横截面积和温度共同决定。只说导体越长，没有说材料、横截面积和温度是否相同，无法判断电阻大小。正确的说法应该是：在材料、横截面积和温度相同时，导体越长，电阻越大。缺少前提条件的说法是不严谨的，所以题目中的说法是错误的。"},{"id":"g3_physics_032_ex07","knowledge_id":"g3_physics_032","question":"判断题：铜导线的电阻一定比铁导线的电阻小。（  ）","answer":"答案：错误\n解析：铜的电阻率比铁小，说明在相同长度、相同横截面积和相同温度下，铜导线的电阻比铁导线小。但题目中没有说长度、横截面积和温度是否相同，所以无法比较。如果铜导线很长很细，铁导线很短很粗，铜导线的电阻可能反而比铁导线大。因此缺少前提条件的说法是错误的。"},{"id":"g3_physics_032_ex08","knowledge_id":"g3_physics_032","question":"解答题：一根镍铬合金丝的电阻是100Ω。求：（1）如果将它均匀拉长到原来的2倍，电阻变为多少？（2）如果将它对折起来使用，电阻变为多少？（温度变化忽略不计）","answer":"答案：（1）均匀拉长到原来的2倍，电阻变为400Ω；（2）对折起来使用，电阻变为25Ω。\n解析：设原来的电阻丝长度为L，横截面积为S，电阻R=ρL/S=100Ω。\n（1）均匀拉长到原来的2倍后，长度L₁=2L。\n因为体积不变，V=SL=S₁L₁，所以横截面积S₁=SL/L₁=S×L/(2L)=S/2。\n新的电阻R₁=ρL₁/S₁=ρ×2L/(S/2)=4ρL/S=4R=4×100Ω=400Ω。\n（2）对折后，长度L₂=L/2，横截面积S₂=2S（因为两根并联）。\n新的电阻R₂=ρL₂/S₂=ρ×(L/2)/(2S)=ρL/(4S)=R/4=100Ω/4=25Ω。\n\n解析：这道题的关键是要理解：电阻丝均匀拉长时，体积不变，长度变长的同时横截面积变小；对折时，长度变短，横截面积变大。电阻与长度成正比，与横截面积成反比，所以拉长到n倍，电阻变为n²倍；对折n次，电阻变为原来的1/2ⁿ。"},{"id":"g3_physics_032_ex09","knowledge_id":"g3_physics_032","question":"选择题：在做\"探究影响电阻大小的因素\"实验时，为了研究电阻与材料的关系，应该选用的两根电阻丝是（  ）\nA. 长度相同、横截面积不同的镍铬合金丝\nB. 横截面积相同、长度不同的镍铬合金丝\nC. 长度和横截面积都相同的镍铬合金丝和铜丝\nD. 长度和材料都相同、横截面积不同的两根电阻丝","answer":"答案：C\n解析：探究电阻与材料的关系时，要用控制变量法，控制长度、横截面积和温度相同，只改变材料。A选项研究的是电阻与横截面积的关系；B选项研究的是电阻与长度的关系；C选项长度和横截面积都相同，材料不同，研究的是电阻与材料的关系，符合题意；D选项研究的是电阻与横截面积的关系。所以选C。"},{"id":"g3_physics_032_ex10","knowledge_id":"g3_physics_032","question":"解答题：请结合生活实际，举例说明人们是如何利用或应对电阻大小与材料、长度、横截面积、温度这四个因素的关系的。（每个因素至少举一个例子）","answer":"答案：一、材料因素的应用：\n1. 导线用铜或铝制作：铜和铝的电阻率小，电阻小，可以减少输电过程中的电能损耗。\n2. 电炉、电热水器的发热体用镍铬合金丝制作：镍铬合金的电阻率大，相同长度和粗细时电阻大，电流通过时产生的热量多。\n3. 保险丝用铅锑合金制作：铅锑合金的电阻率大、熔点低，电流过大时能及时熔断，保护电路。\n\n二、长度因素的应用：\n1. 滑动变阻器：通过改变接入电路中电阻丝的长度来改变电阻，从而改变电流。\n2. 高压输电：尽量缩短输电距离，因为导线越长电阻越大，损耗越多。\n\n三、横截面积因素的应用：\n1. 大功率用电器的电源线更粗：大功率用电器工作时电流大，用粗导线（横截面积大）可以减小电阻，减少发热，更安全。\n2. 高压输电线做得比较粗：减小电阻，减少输电线上的电能损耗。\n\n四、温度因素的应用和应对：\n1. 金属的电阻随温度升高而增大：白炽灯的灯丝在开灯瞬间温度低、电阻小，电流大，所以容易在开灯瞬间烧坏。\n2. 热敏电阻：利用半导体材料的电阻随温度变化明显的特性，制作温度传感器，用于测温、控温等。\n3. 电路中的散热设计：为了防止温度过高导致电阻增大、性能下降，电子设备中都有散热装置（如散热片、风扇等）。\n\n解析：影响电阻大小的四个因素在生活和生产中都有广泛的应用。理解这些因素对电阻的影响，可以帮助我们更好地利用电阻或减小电阻带来的不利影响。"},{"id":"g3_physics_033_ex01","knowledge_id":"g3_physics_033","question":"选择题：关于欧姆定律公式 I = U/R 的理解，下列说法正确的是（  ）\nA. 导体的电阻越大，通过它的电流一定越小\nB. 导体两端的电压越大，通过它的电流一定越大\nC. 导体的电阻与导体两端的电压成正比，与通过导体的电流成反比\nD. 当导体两端的电压一定时，导体中的电流与导体的电阻成反比","answer":"答案：D\n解析：\n欧姆定律公式：I = U/R，表示导体中的电流与导体两端的电压成正比，与导体的电阻成反比。\n\nA. 错误。电流不仅与电阻有关，还与电压有关。只有在电压一定时，电阻越大电流才越小。\nB. 错误。电流不仅与电压有关，还与电阻有关。只有在电阻一定时，电压越大电流才越大。\nC. 错误。电阻是导体本身的一种性质，只与导体的材料、长度、横截面积和温度有关，与电压和电流无关。\nD. 正确。当电压U一定时，电流I与电阻R成反比，这是欧姆定律的正确表述。"},{"id":"g3_physics_033_ex02","knowledge_id":"g3_physics_033","question":"选择题：某定值电阻两端电压为6V时，通过它的电流为0.3A。若该电阻两端电压变为2V时，通过它的电流和它的电阻分别是（  ）\nA. 0.1A，20Ω\nB. 0.3A，20Ω\nC. 0.1A，10Ω\nD. 0.3A，10Ω","answer":"答案：A\n解析：\n（1）先求电阻：\n由欧姆定律 I = U/R，得 R = U₁/I₁ = 6V / 0.3A = 20Ω\n\n（2）电阻是导体本身的性质，不随电压改变而改变，所以电压变为2V时，电阻仍为20Ω。\n\n（3）此时的电流：\nI₂ = U₂/R = 2V / 20Ω = 0.1A\n\n所以电流为0.1A，电阻为20Ω，选A。"},{"id":"g3_physics_033_ex03","knowledge_id":"g3_physics_033","question":"填空题：欧姆定律的内容是：导体中的电流，跟导体两端的______成正比，跟导体的______成反比。公式是______，其中I表示______，单位是______；U表示______，单位是______；R表示______，单位是______。","answer":"答案：电压；电阻；I = U/R；电流；安培（A）；电压；伏特（V）；电阻；欧姆（Ω）\n解析：\n欧姆定律是德国物理学家欧姆在19世纪初期经过大量实验得出的：\n- 内容：导体中的电流，跟导体两端的电压成正比，跟导体的电阻成反比。\n- 公式：I = U/R\n- 单位：电流I的单位是安培（A），电压U的单位是伏特（V），电阻R的单位是欧姆（Ω）。\n- 注意：欧姆定律适用于纯电阻电路，且I、U、R三个量必须对应同一导体、同一时刻。"},{"id":"g3_physics_033_ex04","knowledge_id":"g3_physics_033","question":"判断题：根据公式 R = U/I 可知，导体的电阻与导体两端的电压成正比，与通过导体的电流成反比。（  ）","answer":"答案：错误\n解析：\nR = U/I 是电阻的计算式，不是决定式。\n\n电阻是导体本身的一种性质，它的大小只与导体的材料、长度、横截面积和温度有关，与导体两端的电压和通过的电流无关。\n\n公式 R = U/I 只是用来计算电阻的大小，表示电阻等于电压与电流的比值。即使电压为0，电阻依然存在。\n\n类比：密度公式 ρ = m/V，密度是物质本身的属性，与质量和体积无关，只是可以用质量和体积的比值来计算。"},{"id":"g3_physics_033_ex05","knowledge_id":"g3_physics_033","question":"选择题：手电筒的小灯泡正常发光时的电压为2.5V，电阻约为10Ω，则该小灯泡正常发光时的电流约为（  ）\nA. 0.25mA\nB. 2.5mA\nC. 25mA\nD. 250mA","answer":"答案：D\n解析：\n已知：U = 2.5V，R = 10Ω\n\n根据欧姆定律 I = U/R：\nI = 2.5V / 10Ω = 0.25A = 250mA\n\n所以答案选D。\n\n实际生活中，手电筒小灯泡的工作电流通常在0.2~0.3A之间，与计算结果吻合。"},{"id":"g3_physics_033_ex06","knowledge_id":"g3_physics_033","question":"选择题：在探究电流与电压、电阻关系的实验中，下列说法错误的是（  ）\nA. 探究电流与电压的关系时，应保持电阻不变\nB. 探究电流与电阻的关系时，应保持电压不变\nC. 滑动变阻器在两个探究实验中的作用完全相同\nD. 实验中用到了控制变量法","answer":"答案：C\n解析：\nA. 正确。探究电流与电压的关系时，要控制电阻不变，改变电压，观察电流的变化。\nB. 正确。探究电流与电阻的关系时，要控制电压不变，改变电阻，观察电流的变化。\nC. 错误。滑动变阻器的作用不同：\n   - 探究电流与电压关系：改变电阻两端的电压，进行多次测量\n   - 探究电流与电阻关系：保持电阻两端的电压不变（控制变量）\nD. 正确。实验中分别控制电阻或电压不变，研究电流与另一个量的关系，使用了控制变量法。"},{"id":"g3_physics_033_ex07","knowledge_id":"g3_physics_033","question":"填空题：某家庭电路中，一盏节能灯正常工作时的电流约为100mA，则该节能灯的电阻约为______Ω（家庭电路电压为220V）。若把它接在110V的电路中，它的电阻为______Ω（不考虑温度影响）。","answer":"答案：2200；2200\n解析：\n（1）先统一单位：I = 100mA = 0.1A\n\n（2）由欧姆定律 I = U/R，得：\nR = U/I = 220V / 0.1A = 2200Ω\n\n（3）电阻是导体本身的性质，不随电压的改变而改变（不考虑温度影响时），所以接在110V电路中，电阻仍为2200Ω。\n\n注意：实际生活中，灯丝的电阻会随温度升高而增大，但题目中说不考虑温度影响，所以电阻不变。"},{"id":"g3_physics_033_ex08","knowledge_id":"g3_physics_033","question":"判断题：欧姆定律适用于所有的电路和用电器。（  ）","answer":"答案：错误\n解析：\n欧姆定律只适用于纯电阻电路，即电能全部转化为内能的电路。\n\n适用的用电器：电炉、电熨斗、电饭锅、电烙铁、白炽灯等。\n不适用的用电器：电动机、电风扇、电冰箱、电视机等（这些用电器工作时，电能除了转化为内能，还转化为其他形式的能，如机械能、光能等）。\n\n对于含有电动机的电路，不能直接用欧姆定律计算电流，需要用其他方法。"},{"id":"g3_physics_033_ex09","knowledge_id":"g3_physics_033","question":"选择题：人体的安全电压不高于36V，若某人的电阻为2000Ω，则当通过人体的电流达到多少时会有生命危险（  ）\nA. 36mA以上\nB. 18mA以上\nC. 10mA以上\nD. 5mA以上","answer":"答案：B\n解析：\n已知：人体安全电压U = 36V，人体电阻R = 2000Ω\n\n根据欧姆定律 I = U/R：\nI = 36V / 2000Ω = 0.018A = 18mA\n\n所以当通过人体的电流达到18mA以上时，就会有生命危险。\n\n补充知识：\n- 电流达到1mA左右人会有麻的感觉\n- 电流达到10mA左右人手就很难摆脱电源\n- 电流达到100mA左右短时间就会使人窒息、心跳停止"},{"id":"g3_physics_033_ex10","knowledge_id":"g3_physics_033","question":"解答题：在探究电流与电阻关系的实验中，电源电压为6V，定值电阻有5Ω、10Ω、15Ω三个。实验时，先将5Ω的电阻接入电路，调节滑动变阻器使电压表示数为2V，读出电流表示数。然后换用10Ω的电阻继续实验。\n（1）换上10Ω的电阻后，电压表的示数将如何变化？为什么？\n（2）接下来应如何调节滑动变阻器才能使电压表示数恢复为2V？\n（3）当电压表示数为2V时，10Ω电阻消耗的功率是多少？","answer":"答案：\n（1）电压表的示数将变大。\n原因：换上更大的电阻后，电路总电阻变大，电源电压不变，根据欧姆定律I = U/R，电路中的电流变小。滑动变阻器接入的电阻不变，由U = IR可知，滑动变阻器两端的电压变小。根据串联电路电压规律，定值电阻两端的电压 = 电源电压 - 滑动变阻器电压，所以定值电阻两端电压变大，即电压表示数变大。\n\n（2）应增大滑动变阻器接入电路的电阻（将滑片向阻值变大的方向移动）。\n原因：要使定值电阻两端电压从大于2V减小到2V，需要增大滑动变阻器的电阻，让它分担更多的电压，从而使定值电阻两端的电压降回2V。\n\n（3）当电压表示数为2V时，10Ω电阻消耗的功率：\n方法一：先求电流\nI = U/R = 2V / 10Ω = 0.2A\nP = UI = 2V × 0.2A = 0.4W\n\n方法二：直接用公式\nP = U²/R = (2V)² / 10Ω = 4V² / 10Ω = 0.4W\n\n答：消耗的功率是0.4W。"},{"id":"g3_physics_034_ex01","knowledge_id":"g3_physics_034","question":"选择题：如图所示电路，电源电压为6V，电阻R₁=10Ω，R₂=20Ω，开关闭合后，下列说法正确的是（  ）\nA. 通过R₁的电流为0.6A\nB. 通过R₂的电流为0.3A\nC. 电路的总电阻为30Ω\nD. R₁两端的电压为3V","answer":"答案：C\n解析：\n由图可知，R₁和R₂串联。\n\n（1）总电阻：\nR总 = R₁ + R₂ = 10Ω + 20Ω = 30Ω\n所以C正确。\n\n（2）电路中的电流：\nI = U/R总 = 6V / 30Ω = 0.2A\n串联电路电流处处相等，所以通过R₁和R₂的电流都是0.2A，A和B都错。\n\n（3）R₁两端的电压：\nU₁ = IR₁ = 0.2A × 10Ω = 2V，所以D错。\n\n（4）验证：R₂两端电压U₂ = IR₂ = 0.2A × 20Ω = 4V\nU₁ + U₂ = 2V + 4V = 6V = 电源电压，符合串联电路电压规律。"},{"id":"g3_physics_034_ex02","knowledge_id":"g3_physics_034","question":"选择题：某电熨斗的额定电压为220V，额定功率为1100W，则它正常工作时的电阻约为（  ）\nA. 44Ω\nB. 55Ω\nC. 220Ω\nD. 440Ω","answer":"答案：A\n解析：\n方法：利用电功率公式结合欧姆定律。\n\n已知：U = 220V，P = 1100W\n\n由 P = UI，得正常工作电流：\nI = P/U = 1100W / 220V = 5A\n\n由欧姆定律 I = U/R，得：\nR = U/I = 220V / 5A = 44Ω\n\n或者直接用推导公式：\nP = U²/R，所以 R = U²/P = (220V)² / 1100W = 48400V² / 1100W = 44Ω\n\n答案选A。\n\n注意：这是电熨斗正常工作时（热态）的电阻，不工作时（冷态）电阻会小很多。"},{"id":"g3_physics_034_ex03","knowledge_id":"g3_physics_034","question":"填空题：如图所示电路，电源电压保持不变。开关S闭合后，滑动变阻器的滑片P向右移动时，电流表的示数将______，电压表的示数将______。（选填变大、变小或不变）","answer":"答案：变小；变小\n解析：\n由图可知，定值电阻R与滑动变阻器串联，电流表测电路中的电流，电压表测定值电阻R两端的电压。\n\n（1）滑片P向右移动时，滑动变阻器接入电路的电阻变大，电路总电阻R总 = R + R滑 也变大。\n\n（2）电源电压不变，根据欧姆定律 I = U/R总，总电阻变大，电路中的电流变小，所以电流表示数变小。\n\n（3）定值电阻R的阻值不变，电流变小，由 U = IR 可知，定值电阻两端的电压变小，所以电压表示数变小。\n\n注意：也可以从分压角度理解：滑动变阻器电阻变大，分担的电压变多，定值电阻分担的电压就变少。"},{"id":"g3_physics_034_ex04","knowledge_id":"g3_physics_034","question":"判断题：两个电阻并联后的总电阻一定比其中任何一个电阻都小。（  ）","answer":"答案：正确\n解析：\n两个电阻并联后，相当于增大了导体的横截面积，所以总电阻比任何一个分电阻都小。\n\n公式验证：\n1/R总 = 1/R₁ + 1/R₂\n所以 R总 = R₁R₂/(R₁+R₂)\n\n例如：R₁=10Ω，R₂=10Ω，并联后 R总 = 10×10/(10+10) = 5Ω，比10Ω小。\n\n再如：R₁=5Ω，R₂=20Ω，并联后 R总 = 5×20/(5+20) = 100/25 = 4Ω，比5Ω还小。\n\n结论：并联后的总电阻一定小于最小的那个分电阻。"},{"id":"g3_physics_034_ex05","knowledge_id":"g3_physics_034","question":"选择题：某同学需要一个15Ω的电阻，但实验室里只有5Ω、10Ω、20Ω、60Ω的电阻各一个，下列做法能得到15Ω电阻的是（  ）\nA. 将5Ω和10Ω的电阻并联\nB. 将20Ω和60Ω的电阻并联\nC. 将5Ω和20Ω的电阻串联\nD. 将10Ω和60Ω的电阻并联","answer":"答案：B\n解析：\n我们逐一计算：\n\nA. 5Ω和10Ω并联：\n1/R = 1/5 + 1/10 = 2/10 + 1/10 = 3/10\nR = 10/3 ≈ 3.33Ω ≠ 15Ω，错。\n\nB. 20Ω和60Ω并联：\n1/R = 1/20 + 1/60 = 3/60 + 1/60 = 4/60 = 1/15\nR = 15Ω，正好符合要求。正确。\n\nC. 5Ω和20Ω串联：\nR = 5Ω + 20Ω = 25Ω ≠ 15Ω，错。\n\nD. 10Ω和60Ω并联：\n1/R = 1/10 + 1/60 = 6/60 + 1/60 = 7/60\nR = 60/7 ≈ 8.57Ω ≠ 15Ω，错。\n\n所以答案选B。"},{"id":"g3_physics_034_ex06","knowledge_id":"g3_physics_034","question":"选择题：如图所示，电源电压为12V且保持不变，R₁=20Ω，滑动变阻器R₂的最大阻值为40Ω。当滑片P从最左端移到最右端时，电压表的示数变化范围是（  ）\nA. 0~4V\nB. 4~12V\nC. 0~8V\nD. 8~12V","answer":"答案：B\n解析：\n由图可知，R₁和R₂串联，电压表测定值电阻R₁两端的电压。\n\n（1）当滑片P在最左端时，滑动变阻器接入电阻为0Ω：\n电路中只有R₁，电压表示数等于电源电压，即 U₁ = 12V。\n\n（2）当滑片P在最右端时，滑动变阻器全部接入，R₂=40Ω：\n总电阻 R = R₁ + R₂ = 20Ω + 40Ω = 60Ω\n电路电流 I = U/R = 12V / 60Ω = 0.2A\nR₁两端电压 U₁ = IR₁ = 0.2A × 20Ω = 4V\n\n（3）所以电压表示数从12V变到4V，变化范围是4~12V。\n\n答案选B。"},{"id":"g3_physics_034_ex07","knowledge_id":"g3_physics_034","question":"填空题：电阻R₁=6Ω，与R₂并联后的总电阻为4Ω，则R₂=______Ω。若将它们串联后接在电压为6V的电源两端，则电路中的电流为______A。","answer":"答案：12；0.33\n解析：\n（1）并联时：\n1/R总 = 1/R₁ + 1/R₂\n1/4Ω = 1/6Ω + 1/R₂\n1/R₂ = 1/4 - 1/6 = 3/12 - 2/12 = 1/12\nR₂ = 12Ω\n\n（2）串联时：\n总电阻 R总' = R₁ + R₂ = 6Ω + 12Ω = 18Ω\n电路中的电流 I = U/R总' = 6V / 18Ω ≈ 0.33A\n\n答案：R₂ = 12Ω，电流约为0.33A（或1/3 A）。"},{"id":"g3_physics_034_ex08","knowledge_id":"g3_physics_034","question":"判断题：在串联电路中，电阻越大，它两端的电压就越大。（  ）","answer":"答案：正确\n解析：\n串联电路中电流处处相等，即I相同。\n\n由欧姆定律 U = IR，当电流I相同时，电压U与电阻R成正比。\n\n所以电阻越大，它两端的电压就越大。\n\n这就是串联电路的分压原理：\nU₁/U₂ = R₁/R₂\n\n例如：R₁=10Ω，R₂=20Ω，串联在6V电源上：\n总电流 I = 6V/(10Ω+20Ω) = 0.2A\nU₁ = 0.2A×10Ω = 2V\nU₂ = 0.2A×20Ω = 4V\n电阻大的R₂两端电压也大。\n\n结论：串联分压，电阻大的分压大。"},{"id":"g3_physics_034_ex09","knowledge_id":"g3_physics_034","question":"选择题：在相距30km的甲、乙两地之间架设有两条输电线，每条输电线每千米的电阻为0.2Ω。现输电线在某处发生了短路，为了确定短路位置，检修员在甲地把电源、电流表和定值电阻R₀=16Ω串联后接在两条输电线的起点，测得电流为0.5A。已知电源电压为12V，则短路位置距离甲地（  ）\nA. 10km\nB. 20km\nC. 25km\nD. 30km","answer":"答案：B\n解析：\n这是利用欧姆定律解决实际问题的典型应用——短路故障定位。\n\n（1）先求电路总电阻：\n由欧姆定律 I = U/R，得\nR总 = U/I = 12V / 0.5A = 24Ω\n\n（2）输电线的总电阻（去和回两条线的总电阻）：\nR线 = R总 - R₀ = 24Ω - 16Ω = 8Ω\n\n（3）单条输电线的电阻：\n因为电流从甲地流到短路点，再从另一条线流回来，所以8Ω是两条输电线的总电阻。\n单条线电阻 R单 = 8Ω / 2 = 4Ω\n\n（4）短路位置距离甲地的距离：\n已知每千米电阻为0.2Ω，所以\ns = R单 / (0.2Ω/km) = 4Ω / 0.2Ω/km = 20km\n\n验证：20km < 30km，在甲乙两地之间，合理。\n所以答案选B。"},{"id":"g3_physics_034_ex10","knowledge_id":"g3_physics_034","question":"解答题：如图所示电路，电源电压为6V且保持不变，R₁=10Ω，R₂=20Ω，R₃=30Ω。求：\n（1）只闭合S₁时，电流表的示数是多少？\n（2）只闭合S₂时，R₂两端的电压是多少？\n（3）同时闭合S₁和S₃时，电路的总功率是多少？","answer":"答案：\n（1）只闭合S₁时，电路中只有R₁接入：\n电流 I₁ = U/R₁ = 6V / 10Ω = 0.6A\n电流表示数为0.6A。\n\n（2）只闭合S₂时，R₁和R₂串联：\n总电阻 R总 = R₁ + R₂ = 10Ω + 20Ω = 30Ω\n电路电流 I = U/R总 = 6V / 30Ω = 0.2A\nR₂两端的电压 U₂ = IR₂ = 0.2A × 20Ω = 4V\n\n（3）同时闭合S₁和S₃时，R₁和R₃并联：\n通过R₁的电流 I₁ = U/R₁ = 6V / 10Ω = 0.6A\n通过R₃的电流 I₃ = U/R₃ = 6V / 30Ω = 0.2A\n干路电流 I总 = I₁ + I₃ = 0.6A + 0.2A = 0.8A\n电路总功率 P = UI总 = 6V × 0.8A = 4.8W\n\n或者用 P = U²/R 分别计算再相加：\nP₁ = U²/R₁ = 36/10 = 3.6W\nP₃ = U²/R₃ = 36/30 = 1.2W\nP总 = P₁ + P₃ = 4.8W\n\n答：（1）只闭合S₁时电流表示数为0.6A；（2）只闭合S₂时R₂两端电压为4V；（3）同时闭合S₁和S₃时总功率为4.8W。"},{"id":"g3_physics_035_ex01","knowledge_id":"g3_physics_035","question":"选择题：用伏安法测电阻的实验中，下列说法正确的是（  ）\nA. 实验原理是P = UI\nB. 实验中需要用天平测量导体的质量\nC. 滑动变阻器的作用只是保护电路\nD. 需要多次测量取平均值来减小误差","answer":"答案：D\n解析：\nA. 错误。伏安法测电阻的实验原理是欧姆定律的变形公式 R = U/I，不是功率公式。\nB. 错误。伏安法测电阻需要测量电压和电流，用电压表和电流表，不需要天平。\nC. 错误。滑动变阻器的作用有两个：①保护电路；②改变待测电阻两端的电压和通过的电流，进行多次测量。\nD. 正确。定值电阻的阻值是不变的，多次测量取平均值可以减小误差。\n\n注意：如果是测小灯泡的电阻，由于灯丝电阻随温度变化，不能取平均值，只能观察电阻随温度的变化规律。"},{"id":"g3_physics_035_ex02","knowledge_id":"g3_physics_035","question":"选择题：在伏安法测电阻实验中，某同学连接完最后一根导线后，电流表和电压表指针立即偏转，且都超过了量程。造成这一现象的原因不可能是（  ）\nA. 连接电路时开关没有断开\nB. 滑动变阻器的滑片没有移到最大阻值处\nC. 电流表的量程选择太小\nD. 电压表的正负接线柱接反了","answer":"答案：D\n解析：\nA. 可能。连接电路时开关应该断开，如果没断开，连完最后一根导线电路就接通了。\nB. 可能。滑动变阻器滑片没有移到最大阻值处，电路总电阻太小，电流太大，会超过量程。\nC. 可能。电流表量程选小了，即使电流不是特别大，也会超过量程。\nD. 不可能。电压表正负接线柱接反了，指针会反向偏转，不会超过量程（正向偏转超量程）。\n\n题目问的是\"不可能\"的原因，所以选D。"},{"id":"g3_physics_035_ex03","knowledge_id":"g3_physics_035","question":"填空题：伏安法测电阻的实验原理是______，需要测量的物理量是______和______，分别用______和______测量。实验中滑动变阻器的作用是：①______；②______。","answer":"答案：R = U/I（或欧姆定律）；电压；电流；电压表；电流表；保护电路；改变待测电阻两端的电压（或改变电路中的电流），以便多次测量\n解析：\n伏安法测电阻：\n- 原理：欧姆定律的变形公式 R = U/I\n- 测量工具：电压表测电压U，电流表测电流I\n- 滑动变阻器的作用：\n  ① 保护电路：闭合开关前，滑片移到最大阻值处，防止电流过大烧坏元件\n  ② 改变待测电阻两端的电压和通过的电流，多次测量：\n     - 测定值电阻：多次测量取平均值，减小误差\n     - 测小灯泡电阻：观察灯丝电阻随温度的变化规律"},{"id":"g3_physics_035_ex04","knowledge_id":"g3_physics_035","question":"判断题：用伏安法测定值电阻和测小灯泡电阻时，都要多次测量取平均值来减小误差。（  ）","answer":"答案：错误\n解析：\n测定值电阻和测小灯泡电阻，多次测量的目的不同：\n\n（1）测定值电阻：\n定值电阻的阻值基本不变（不考虑温度影响时），多次测量不同电压下的电阻值，取平均值可以减小误差。\n\n（2）测小灯泡的电阻：\n灯丝的电阻随温度升高而增大，小灯泡两端电压不同时，灯丝温度不同，电阻也不同。\n所以测小灯泡电阻时，多次测量是为了观察灯丝电阻随温度变化的规律，不能取平均值。\n\n总结：同样是多次测量，目的可能不同。\n- 测长度、测质量、测定值电阻：取平均值减小误差\n- 探究规律的实验（如小灯泡电阻、重力与质量关系）：找普遍规律"},{"id":"g3_physics_035_ex05","knowledge_id":"g3_physics_035","question":"选择题：在伏安法测电阻实验中，若待测电阻Rₓ约为10Ω，电源电压为3V，滑动变阻器标有\"20Ω 1A\"字样，则电流表和电压表的量程应选（  ）\nA. 0~0.6A，0~3V\nB. 0~3A，0~3V\nC. 0~0.6A，0~15V\nD. 0~3A，0~15V","answer":"答案：A\n解析：\n选择量程的原则：在不超过量程的前提下，尽量选小量程，这样读数更准确。\n\n（1）电压表：测待测电阻两端的电压，电源电压为3V，所以待测电阻两端电压最大不超过3V，选0~3V量程即可。\n\n（2）电流表：电路中的最大电流出现在滑动变阻器阻值为0时，此时只有Rₓ接入：\nI最大 = U/Rₓ = 3V / 10Ω = 0.3A\n0.3A < 0.6A，所以电流表选0~0.6A量程就够了。\n\n所以选A：0~0.6A，0~3V。"},{"id":"g3_physics_035_ex06","knowledge_id":"g3_physics_035","question":"选择题：小明用伏安法测电阻时，误将电流表和电压表的位置接反了，如图所示。闭合开关后，会出现的现象是（  ）\nA. 电流表和电压表都被烧坏\nB. 电流表被烧坏，电压表不会被烧坏\nC. 电压表被烧坏，电流表不会被烧坏\nD. 电压表有示数，电流表几乎无示数","answer":"答案：D\n解析：\n电压表的电阻非常大（相当于开路），电流表的电阻非常小（相当于导线）。\n\n当电压表和电流表位置接反时，电压表串联在电路中：\n- 由于电压表电阻极大，电路中电流极小，几乎为0，所以电流表几乎无示数，也不会被烧坏。\n- 电压表串联在电路中，相当于直接接在电源两端，测的是电源电压，所以电压表有示数（约等于电源电压），也不会被烧坏。\n\n所以选D：电压表有示数，电流表几乎无示数。\n\n记忆口诀：电压表串入电路，电流几乎为零，电压表示数接近电源电压。"},{"id":"g3_physics_035_ex07","knowledge_id":"g3_physics_035","question":"填空题：在伏安法测电阻实验中，第一次测量时电压表示数为2.4V，电流表示数为0.3A，则待测电阻的阻值为______Ω。第二次测量时，调节滑动变阻器使电压表示数变为3V，此时电流表示数为______A，待测电阻的阻值为______Ω。两次测量的平均值为______Ω。","answer":"答案：8；0.375；8；8\n解析：\n（1）第一次测量：\nR₁ = U₁/I₁ = 2.4V / 0.3A = 8Ω\n\n（2）第二次测量：\n定值电阻阻值不变，仍为8Ω（不考虑温度影响）。\n当电压为3V时：\nI₂ = U₂/R = 3V / 8Ω = 0.375A\n此时电阻 R₂ = U₂/I₂ = 3V / 0.375A = 8Ω\n\n（3）两次测量的平均值：\nR平均 = (R₁ + R₂)/2 = (8Ω + 8Ω)/2 = 8Ω\n\n注意：因为是定值电阻，所以两次测量阻值相同，平均值也是8Ω。实际实验中由于误差，测量值会略有不同。"},{"id":"g3_physics_035_ex08","knowledge_id":"g3_physics_035","question":"判断题：伏安法测电阻时，电流表必须串联在电路中，电压表必须并联在待测电阻两端。（  ）","answer":"答案：正确\n解析：\n电流表和电压表的使用规则：\n\n（1）电流表：\n- 必须串联在电路中\n- 电流从正接线柱流入，从负接线柱流出\n- 不能直接接在电源两端（相当于短路）\n\n（2）电压表：\n- 必须并联在待测电路（或用电器）两端\n- 正接线柱接靠近电源正极的一端，负接线柱接靠近负极的一端\n- 可以直接接在电源两端，测电源电压\n\n伏安法测电阻时，电流表串联测通过待测电阻的电流，电压表并联测待测电阻两端的电压。所以正确。"},{"id":"g3_physics_035_ex09","knowledge_id":"g3_physics_035","question":"选择题：在伏安法测电阻实验中，某同学闭合开关后，发现电流表有示数，电压表无示数，则故障原因可能是（  ）\nA. 待测电阻断路\nB. 待测电阻短路\nC. 滑动变阻器断路\nD. 电流表断路","answer":"答案：B\n解析：\n电流表有示数，说明电路是通路；电压表无示数，说明电压表测的那部分电路有问题。\n\n逐一分析：\nA. 待测电阻断路：电路断开，电流表无示数，不符合。\nB. 待测电阻短路：电路是通路，电流表有示数；电压表测短路的电阻，相当于测导线电压，电压表示数为0（无示数）。符合题意。\nC. 滑动变阻器断路：整个电路断开，电流表无示数，不符合。\nD. 电流表断路：整个电路断开，电流表无示数，不符合。\n\n所以选B。\n\n补充：如果是待测电阻断路，会出现：电流表无示数，电压表有示数（接近电源电压）。这是另一种常见故障。"},{"id":"g3_physics_035_ex10","knowledge_id":"g3_physics_035","question":"解答题：在伏安法测电阻的实验中：\n（1）连接电路时，开关应处于______状态，滑动变阻器的滑片应移到______处。\n（2）若电源电压为6V，待测电阻约为10Ω，滑动变阻器规格为\"20Ω 1A\"，则电压表应选______量程，电流表应选______量程。\n（3）实验中，某同学测得多组数据如下表，请计算每次的电阻值，并求平均值。\n| 实验次数 | 电压U/V | 电流I/A | 电阻R/Ω |\n|----------|---------|---------|----------|\n| 1        | 2.0     | 0.20    |          |\n| 2        | 3.0     | 0.30    |          |\n| 3        | 4.0     | 0.39    |          |\n（4）另一位同学测小灯泡的电阻，也测了三组数据，他能不能用取平均值的方法减小误差？为什么？","answer":"答案：\n（1）断开；最大阻值（或阻值最大）\n\n（2）电源电压6V，所以待测电阻两端电压最大不超过6V，电压表选0~15V量程。\n最大电流：当滑动变阻器阻值为0时，I = U/R = 6V/10Ω = 0.6A，所以电流表选0~0.6A量程。\n答案：0~15V；0~0.6A\n\n（3）计算每次的电阻：\n第1次：R₁ = U₁/I₁ = 2.0V / 0.20A = 10.0Ω\n第2次：R₂ = U₂/I₂ = 3.0V / 0.30A = 10.0Ω\n第3次：R₃ = U₃/I₃ = 4.0V / 0.39A ≈ 10.3Ω\n\n平均值：R平均 = (R₁ + R₂ + R₃)/3 = (10.0Ω + 10.0Ω + 10.3Ω)/3 = 30.3Ω/3 ≈ 10.1Ω\n\n（4）不能。\n因为灯丝的电阻随温度的升高而增大，小灯泡两端电压不同时，灯丝温度不同，电阻也不同，所以小灯泡的电阻不是一个定值，不能取平均值减小误差。多次测量的目的是观察灯丝电阻随温度变化的规律。\n\n答：（1）断开，最大阻值；（2）0~15V，0~0.6A；（3）三次电阻分别为10.0Ω、10.0Ω、10.3Ω，平均值约为10.1Ω；（4）不能，因为灯丝电阻随温度变化。"},{"id":"g3_physics_036_ex01","knowledge_id":"g3_physics_036","question":"选择题：两个电阻R₁=5Ω，R₂=15Ω，将它们串联后的总电阻是（  ）\nA. 3.75Ω\nB. 10Ω\nC. 20Ω\nD. 75Ω","answer":"答案：C\n解析：\n串联电路的总电阻等于各串联电阻之和，即：\nR总 = R₁ + R₂\n\n代入数据：\nR总 = 5Ω + 15Ω = 20Ω\n\n所以答案选C。\n\n补充：串联后总电阻比任何一个分电阻都大，因为相当于增加了导体的长度。"},{"id":"g3_physics_036_ex02","knowledge_id":"g3_physics_036","question":"选择题：将n个阻值都是R的电阻串联起来，总电阻为（  ）\nA. nR\nB. R/n\nC. R\nD. n²R","answer":"答案：A\n解析：\n串联电路总电阻等于各电阻之和。\nn个相同电阻R串联：\nR总 = R + R + ... + R（共n个） = nR\n\n所以选A。\n\n例如：3个10Ω的电阻串联，总电阻 = 3×10Ω = 30Ω。\n\n对比：n个相同电阻并联，总电阻 = R/n。"},{"id":"g3_physics_036_ex03","knowledge_id":"g3_physics_036","question":"填空题：有三个电阻串联，R₁=4Ω，R₂=6Ω，R₃=10Ω，则总电阻R总=______Ω。若它们两端的总电压为10V，则电路中的电流为______A，R₂两端的电压为______V。","answer":"答案：20；0.5；3\n解析：\n（1）串联总电阻：\nR总 = R₁ + R₂ + R₃ = 4Ω + 6Ω + 10Ω = 20Ω\n\n（2）电路中的电流：\n由欧姆定律 I = U/R总 = 10V / 20Ω = 0.5A\n串联电路电流处处相等，所以通过每个电阻的电流都是0.5A。\n\n（3）R₂两端的电压：\nU₂ = IR₂ = 0.5A × 6Ω = 3V\n\n验证：U₁ = 0.5×4 = 2V，U₃ = 0.5×10 = 5V\nU₁+U₂+U₃ = 2+3+5 = 10V = 总电压，符合串联电路电压规律。"},{"id":"g3_physics_036_ex04","knowledge_id":"g3_physics_036","question":"判断题：串联电路中，电阻越大，它两端的电压就越大，消耗的功率也越大。（  ）","answer":"答案：正确\n解析：\n串联电路中电流处处相等（I相同）。\n\n（1）电压：由U = IR，电流I相同，电压U与电阻R成正比。所以电阻越大，两端电压越大。\n\n（2）功率：由P = I²R，电流I相同，功率P与电阻R成正比。所以电阻越大，消耗的功率越大。\n\n举例：R₁=10Ω，R₂=20Ω，串联在6V电源上：\n电流 I = 6V/(10+20)Ω = 0.2A\nU₁ = 0.2×10 = 2V，U₂ = 0.2×20 = 4V（电阻大的电压大）\nP₁ = I²R₁ = 0.04×10 = 0.4W，P₂ = 0.04×20 = 0.8W（电阻大的功率大）\n\n结论：串联分压，电阻大的分压大；串联功率，电阻大的功率大。"},{"id":"g3_physics_036_ex05","knowledge_id":"g3_physics_036","question":"选择题：电阻R₁=20Ω，R₂=30Ω，它们串联在电压为10V的电源两端，则R₁与R₂两端的电压之比和功率之比分别是（  ）\nA. 2:3，2:3\nB. 3:2，3:2\nC. 1:1，1:1\nD. 2:3，3:2","answer":"答案：A\n解析：\n串联电路中电流处处相等。\n\n（1）电压之比：\nU₁/U₂ = (IR₁)/(IR₂) = R₁/R₂ = 20Ω/30Ω = 2/3 = 2:3\n\n（2）功率之比：\nP₁/P₂ = (I²R₁)/(I²R₂) = R₁/R₂ = 20Ω/30Ω = 2/3 = 2:3\n\n所以电压之比和功率之比都是2:3，选A。\n\n总结：串联电路中，电压之比 = 功率之比 = 电阻之比（都等于电阻的正比）。"},{"id":"g3_physics_036_ex06","knowledge_id":"g3_physics_036","question":"选择题：有一个电阻为10Ω的小灯泡，正常工作时的电压为6V。现要把它接在9V的电源上，为使小灯泡正常发光，需要给它（  ）\nA. 串联一个5Ω的电阻\nB. 并联一个5Ω的电阻\nC. 串联一个15Ω的电阻\nD. 并联一个15Ω的电阻","answer":"答案：A\n解析：\n电源电压9V大于灯泡正常工作电压6V，需要分压，所以应该串联一个电阻（并联不能分压，电压相等）。\n\n（1）小灯泡正常发光时的电流：\nI = U灯/R灯 = 6V / 10Ω = 0.6A\n\n（2）串联电阻需要分担的电压：\nU阻 = U总 - U灯 = 9V - 6V = 3V\n\n（3）串联电路电流相等，所以通过电阻的电流也是0.6A。\n串联电阻的阻值：\nR阻 = U阻/I = 3V / 0.6A = 5Ω\n\n所以需要串联一个5Ω的电阻，选A。\n\n这就是串联分压的应用：当电源电压高于用电器额定电压时，串联一个电阻来分担多余的电压。"},{"id":"g3_physics_036_ex07","knowledge_id":"g3_physics_036","question":"填空题：把一根粗细均匀的电阻丝截成长度相等的三段，然后把这三段串联起来使用，则总电阻与原来电阻丝的电阻之比为______。","answer":"答案：1:1\n解析：\n设原来电阻丝的电阻为R。\n\n（1）截成相等的三段，每段的电阻：\n导体电阻与长度成正比，截成三段，每段长度为原来的1/3，所以每段电阻为 R/3。\n\n（2）三段串联的总电阻：\nR总 = R/3 + R/3 + R/3 = R\n\n所以总电阻与原来相等，比值为1:1。\n\n想象：一根电阻丝剪了再串起来，总长度不变，所以电阻不变。\n\n对比：如果把三段并联起来，总电阻就是R/9了。"},{"id":"g3_physics_036_ex08","knowledge_id":"g3_physics_036","question":"判断题：两个电阻串联，总电阻一定大于其中任何一个电阻。（  ）","answer":"答案：正确\n解析：\n串联电路总电阻等于各电阻之和：R总 = R₁ + R₂\n\n因为R₁ > 0，R₂ > 0，所以：\nR总 = R₁ + R₂ > R₁\nR总 = R₁ + R₂ > R₂\n\n即总电阻大于任何一个分电阻。\n\n从电阻的决定因素理解：电阻串联相当于增加了导体的长度，导体越长电阻越大，所以总电阻比任何一个分电阻都大。\n\n对比：并联电路总电阻小于任何一个分电阻。"},{"id":"g3_physics_036_ex09","knowledge_id":"g3_physics_036","question":"选择题：如图所示，R₁与R₂串联，电压表测R₂两端电压，电流表测电路电流。电源电压保持不变，当开关S闭合（S并联在R₂两端）时，下列说法正确的是（  ）\nA. 电压表示数变大，电流表示数变大\nB. 电压表示数变小，电流表示数变小\nC. 电压表示数变大，电流表示数变小\nD. 电压表示数变小，电流表示数变大","answer":"答案：D\n解析：\n分析电路：\n- 开关S断开时，R₁与R₂串联，电压表测R₂两端电压，电流表测串联电路电流。\n- 开关S闭合后，R₂被短路，电路中只有R₁。\n\n（1）总电阻变化：\n断开时：R总 = R₁ + R₂\n闭合时：R总' = R₁\n所以总电阻变小。\n\n（2）电流变化：\n电源电压不变，总电阻变小，由欧姆定律 I = U/R，电流变大。所以电流表示数变大。\n\n（3）电压变化：\n断开时：电压表测R₂电压，U₂ = IR₂ > 0\n闭合时：R₂被短路，电压表测被短路的R₂，电压表示数变为0，即变小。\n\n所以电压表示数变小，电流表示数变大，选D。"},{"id":"g3_physics_036_ex10","knowledge_id":"g3_physics_036","question":"解答题：如图所示电路，R₁=10Ω，R₂=20Ω，电源电压为6V且保持不变。\n（1）当开关S断开时，电流表和电压表的示数各是多少？\n（2）当开关S闭合时，电流表和电压表的示数各是多少？\n（3）开关闭合前后，R₁消耗的功率之比是多少？","answer":"答案：\n首先分析电路：\n- S断开时，R₁与R₂串联，电压表测R₂两端电压，电流表测串联电路电流。\n- S闭合时，R₂被短路，电路中只有R₁，电压表测被短路的R₂（电压为0）。\n\n（1）S断开时：\n总电阻 R总 = R₁ + R₂ = 10Ω + 20Ω = 30Ω\n电流表示数 I = U/R总 = 6V / 30Ω = 0.2A\n电压表示数（R₂两端电压）U₂ = IR₂ = 0.2A × 20Ω = 4V\n\n（2）S闭合时：\nR₂被短路，电路中只有R₁\n电流表示数 I' = U/R₁ = 6V / 10Ω = 0.6A\n电压表测被短路的R₂，电压表示数为0V\n\n（3）开关闭合前后，R₁消耗的功率之比：\n方法：用P = I²R（R₁不变，用电流比方便）\n闭合前：P₁ = I²R₁ = (0.2A)² × 10Ω = 0.04 × 10 = 0.4W\n闭合后：P₁' = (I')²R₁ = (0.6A)² × 10Ω = 0.36 × 10 = 3.6W\n功率之比：P₁/P₁' = 0.4W / 3.6W = 1/9 = 1:9\n\n或直接用电流比的平方：\nP₁/P₁' = (I²R₁)/(I'²R₁) = (I/I')² = (0.2/0.6)² = (1/3)² = 1/9 = 1:9\n\n答：（1）S断开时，电流表示数0.2A，电压表示数4V；（2）S闭合时，电流表示数0.6A，电压表示数0V；（3）R₁消耗的功率之比为1:9。"},{"id":"g3_physics_037_ex01","knowledge_id":"g3_physics_037","question":"选择题：两个电阻R₁=10Ω，R₂=15Ω，将它们并联后的总电阻约为（  ）\nA. 25Ω\nB. 12.5Ω\nC. 6Ω\nD. 5Ω","answer":"答案：C\n解析：\n并联电路总电阻的倒数等于各并联电阻的倒数之和：\n1/R总 = 1/R₁ + 1/R₂\n\n变形得：R总 = R₁R₂/(R₁+R₂)\n\n代入数据：\nR总 = (10Ω × 15Ω) / (10Ω + 15Ω) = 150Ω² / 25Ω = 6Ω\n\n所以答案选C。\n\n注意：并联总电阻比任何一个分电阻都小（6Ω < 10Ω < 15Ω），因为并联相当于增大了导体的横截面积。"},{"id":"g3_physics_037_ex02","knowledge_id":"g3_physics_037","question":"选择题：将n个阻值都是R的电阻并联起来，总电阻为（  ）\nA. nR\nB. R/n\nC. R\nD. R/n²","answer":"答案：B\n解析：\n并联电路总电阻的倒数等于各电阻倒数之和。\nn个相同电阻R并联：\n1/R总 = 1/R + 1/R + ... + 1/R（共n个） = n/R\n\n所以 R总 = R/n\n\n答案选B。\n\n例如：3个12Ω的电阻并联，总电阻 = 12Ω/3 = 4Ω。\n\n对比：n个相同电阻串联，总电阻 = nR。"},{"id":"g3_physics_037_ex03","knowledge_id":"g3_physics_037","question":"填空题：三个电阻R₁=3Ω，R₂=6Ω，R₃=2Ω，将它们并联后的总电阻R总=______Ω。若并联后接在6V的电源上，则干路电流为______A，通过R₂的电流为______A。","answer":"答案：1；6；1\n解析：\n（1）并联总电阻：\n1/R总 = 1/R₁ + 1/R₂ + 1/R₃ = 1/3Ω + 1/6Ω + 1/2Ω = 2/6Ω + 1/6Ω + 3/6Ω = 6/6Ω = 1/Ω\n所以 R总 = 1Ω\n\n（2）干路电流：\nI总 = U/R总 = 6V / 1Ω = 6A\n\n（3）通过R₂的电流：\n并联电路各支路电压相等，都等于电源电压6V。\nI₂ = U/R₂ = 6V / 6Ω = 1A\n\n验证：I₁ = 6/3 = 2A，I₂ = 6/6 = 1A，I₃ = 6/2 = 3A\nI总 = 2+1+3 = 6A，符合并联电路电流规律。"},{"id":"g3_physics_037_ex04","knowledge_id":"g3_physics_037","question":"判断题：并联电路中，电阻越大，通过它的电流就越小，它消耗的功率也越小。（  ）","answer":"答案：正确\n解析：\n并联电路中各支路两端电压相等（U相同）。\n\n（1）电流：由I = U/R，电压U相同，电流I与电阻R成反比。所以电阻越大，通过的电流越小。\n\n（2）功率：由P = U²/R，电压U相同，功率P与电阻R成反比。所以电阻越大，消耗的功率越小。\n\n举例：R₁=10Ω，R₂=20Ω，并联在6V电源上：\nU₁ = U₂ = 6V\nI₁ = 6/10 = 0.6A，I₂ = 6/20 = 0.3A（电阻大的电流小）\nP₁ = 6²/10 = 3.6W，P₂ = 6²/20 = 1.8W（电阻大的功率小）\n\n结论：并联分流，电阻大的分流小；并联功率，电阻大的功率小。"},{"id":"g3_physics_037_ex05","knowledge_id":"g3_physics_037","question":"选择题：电阻R₁=20Ω，R₂=30Ω，它们并联在电压为6V的电源两端，则通过R₁与R₂的电流之比和它们消耗的功率之比分别是（  ）\nA. 2:3，2:3\nB. 3:2，3:2\nC. 1:1，1:1\nD. 3:2，2:3","answer":"答案：B\n解析：\n并联电路中各支路两端电压相等。\n\n（1）电流之比：\nI₁/I₂ = (U/R₁)/(U/R₂) = R₂/R₁ = 30Ω/20Ω = 3/2 = 3:2\n\n（2）功率之比：\nP₁/P₂ = (U²/R₁)/(U²/R₂) = R₂/R₁ = 30Ω/20Ω = 3/2 = 3:2\n\n所以电流之比和功率之比都是3:2，选B。\n\n总结：并联电路中，电流之比 = 功率之比 = 电阻的反比（都与电阻成反比）。"},{"id":"g3_physics_037_ex06","knowledge_id":"g3_physics_037","question":"选择题：一只小灯泡正常工作时的电压为6V，电阻为12Ω。要把它接在8V的电源上，为使小灯泡正常发光，下列做法正确的是（  ）\nA. 串联一个4Ω的电阻\nB. 并联一个4Ω的电阻\nC. 串联一个24Ω的电阻\nD. 并联一个24Ω的电阻","answer":"答案：A\n解析：\n电源电压8V大于灯泡额定电压6V，需要分压，所以应该串联一个电阻（并联不能分压）。排除B、D。\n\n（1）小灯泡正常发光时的电流：\nI = U灯/R灯 = 6V / 12Ω = 0.5A\n\n（2）串联电阻需要分担的电压：\nU阻 = U总 - U灯 = 8V - 6V = 2V\n\n（3）串联电路电流相等，通过电阻的电流也是0.5A。\n串联电阻的阻值：\nR阻 = U阻/I = 2V / 0.5A = 4Ω\n\n所以需要串联一个4Ω的电阻，选A。\n\n这是串联分压的典型应用——给额定电压低于电源电压的用电器串联分压电阻。"},{"id":"g3_physics_037_ex07","knowledge_id":"g3_physics_037","question":"填空题：一根粗细均匀的电阻丝，阻值为R。将它对折后拧成一股使用，其电阻变为______。","answer":"答案：R/4\n解析：\n将电阻丝对折后：\n- 长度变为原来的1/2 → 电阻变为原来的1/2（电阻与长度成正比）\n- 横截面积变为原来的2倍 → 电阻变为原来的1/2（电阻与横截面积成反比）\n\n综合起来：新电阻 = R × 1/2 × 1/2 = R/4\n\n也可以用并联来理解：\n对折后相当于两个阻值为R/2的电阻并联：\nR总 = (R/2 × R/2) / (R/2 + R/2) = (R²/4) / R = R/4\n\n所以答案是R/4。"},{"id":"g3_physics_037_ex08","knowledge_id":"g3_physics_037","question":"判断题：两个电阻并联，总电阻一定小于其中任何一个电阻。（  ）","answer":"答案：正确\n解析：\n并联电路总电阻的倒数等于各电阻倒数之和：\n1/R总 = 1/R₁ + 1/R₂\n\n因为1/R₁ > 0，1/R₂ > 0，所以：\n1/R总 > 1/R₁ → R总 < R₁\n1/R总 > 1/R₂ → R总 < R₂\n\n即总电阻小于任何一个分电阻。\n\n从电阻的决定因素理解：电阻并联相当于增大了导体的横截面积，导体横截面积越大电阻越小，所以总电阻比任何一个分电阻都小。\n\n对比：串联总电阻大于任何一个分电阻。"},{"id":"g3_physics_037_ex09","knowledge_id":"g3_physics_037","question":"选择题：如图所示电路，电源电压保持不变。当开关S由断开到闭合时，下列说法正确的是（  ）\nA. 电压表示数变大，电流表示数变大\nB. 电压表示数不变，电流表示数变大\nC. 电压表示数变大，电流表示数不变\nD. 电压表示数不变，电流表示数不变","answer":"答案：B\n解析：\n分析电路：\n- 开关S断开时，电路中只有R₁，电压表测电源电压（R₁两端电压），电流表测通过R₁的电流。\n- 开关S闭合后，R₁与R₂并联，电压表仍测电源电压，电流表测干路电流。\n\n（1）电压表示数：\n断开和闭合时，电压表都是测电源电压，所以电压表示数不变。\n\n（2）电流表示数：\n断开时：I = U/R₁\n闭合后：干路电流 I总 = I₁ + I₂ = U/R₁ + U/R₂ > U/R₁ = I\n所以电流表示数变大。\n\n所以电压表示数不变，电流表示数变大，选B。\n\n补充：并联电路中，支路越多，总电阻越小，干路电流越大。"},{"id":"g3_physics_037_ex10","knowledge_id":"g3_physics_037","question":"解答题：如图所示电路，R₁=10Ω，R₂=15Ω，电源电压为6V且保持不变。\n（1）当开关S断开时，电流表和电压表的示数各是多少？\n（2）当开关S闭合时，电流表和电压表的示数各是多少？\n（3）开关闭合前后，整个电路消耗的总功率之比是多少？","answer":"答案：\n首先分析电路：\n- S断开时，电路中只有R₁，电压表测电源电压（即R₁两端电压），电流表测通过R₁的电流。\n- S闭合时，R₁与R₂并联，电压表测电源电压，电流表测干路电流。\n\n（1）S断开时：\n电压表示数 = 电源电压 = 6V\n电流表示数 I = U/R₁ = 6V / 10Ω = 0.6A\n\n（2）S闭合时：\nR₁、R₂并联，各支路电压都等于电源电压6V。\n电压表示数 = 6V（不变）\n通过R₁的电流 I₁ = U/R₁ = 6V / 10Ω = 0.6A\n通过R₂的电流 I₂ = U/R₂ = 6V / 15Ω = 0.4A\n干路电流（电流表示数）I总 = I₁ + I₂ = 0.6A + 0.4A = 1A\n\n（3）开关闭合前后，总功率之比：\n方法：用P = UI（电压不变，用电流比方便）\n断开时总功率：P = UI = 6V × 0.6A = 3.6W\n闭合时总功率：P' = UI总 = 6V × 1A = 6W\n功率之比：P/P' = 3.6W / 6W = 3/5 = 3:5\n\n或直接用总电流之比（电压相同）：\nP/P' = (UI)/(UI总) = I/I总 = 0.6A / 1A = 3/5 = 3:5\n\n答：（1）S断开时，电流表示数0.6A，电压表示数6V；（2）S闭合时，电流表示数1A，电压表示数6V；（3）总功率之比为3:5。"},{"id":"g3_physics_038_ex01","knowledge_id":"g3_physics_038","question":"选择题：如图是A、B两个电阻的I-U图像，由图可知（  ）\nA. R_A > R_B\nB. R_A < R_B\nC. R_A = R_B\nD. 无法比较","answer":"答案：B\n解析：\nI-U图像中，横坐标是电压U，纵坐标是电流I。\n\n电阻 R = U/I，在I-U图像中，电阻等于横坐标与纵坐标的比值（或斜率的倒数）。\n\n方法一：取相同电压，比较电流。\n取相同的U₀，从图上读出对应的电流I_A和I_B。\n从图中可看出，相同电压下，I_A > I_B。\n由 R = U/I，U相同，电流大的电阻小，所以R_A < R_B。\n\n方法二：取相同电流，比较电压。\n取相同的I₀，读出对应的电压U_A和U_B。\nU_A < U_B，由 R = U/I，I相同，电压小的电阻小，所以R_A < R_B。\n\n方法三：看斜率。\nI-U图像的斜率 k = I/U = 1/R，斜率越大，电阻越小。\nA的斜率大，所以R_A小。\n\n结论：R_A < R_B，选B。"},{"id":"g3_physics_038_ex02","knowledge_id":"g3_physics_038","question":"选择题：某同学做\"探究电流与电压的关系\"实验，得到了如图所示的图像。下列说法错误的是（  ）\nA. 该图像是一条过原点的直线\nB. 电阻一定时，电流与电压成正比\nC. 该电阻的阻值为5Ω\nD. 电压为3V时，电流为0.5A","answer":"答案：D\n解析：\nA. 正确。I-U图像是过原点的直线，说明电流与电压成正比。\nB. 正确。图像是过原点的直线，说明电阻一定时，电流与电压成正比。\nC. 正确。取图像上一点，比如U=2V时I=0.4A，R = U/I = 2V/0.4A = 5Ω。\n   再验证：U=3V时，I=U/R=3V/5Ω=0.6A。\nD. 错误。电压为3V时，电流应为0.6A，不是0.5A。\n\n题目问错误的，所以选D。\n\n总结：I-U图像是过原点的直线 → 定值电阻 → 电流与电压成正比。"},{"id":"g3_physics_038_ex03","knowledge_id":"g3_physics_038","question":"填空题：如图是小灯泡的I-U图像，它不是一条直线，这是因为______。当小灯泡两端电压为2V时，通过它的电流为0.3A，此时小灯泡的电阻为______Ω（结果保留一位小数）。当电压增大时，小灯泡的电阻将______（选填变大、变小或不变）。","answer":"答案：灯丝的电阻随温度的升高而增大；6.7；变大\n解析：\n（1）小灯泡的I-U图像不是直线，因为灯丝的电阻随温度升高而增大。\n电压升高时，电流增大，灯丝温度升高，电阻增大，所以电流增长变慢，图像向下弯曲。\n\n（2）电压为2V，电流为0.3A时：\nR = U/I = 2V / 0.3A ≈ 6.7Ω\n\n（3）当电压增大时，灯丝温度升高，电阻变大。\n可以用I-U图像验证：取U₁=2V，I₁=0.3A，R₁=2/0.3≈6.7Ω\n取U₂=4V，假设I₂=0.5A，则R₂=4/0.5=8Ω > 6.7Ω\n所以电压增大，电阻变大。"},{"id":"g3_physics_038_ex04","knowledge_id":"g3_physics_038","question":"判断题：在U-I图像中，图线的斜率表示电阻的大小，斜率越大，电阻越大。（  ）","answer":"答案：正确\n解析：\n注意区分I-U图像和U-I图像：\n\n（1）U-I图像：横坐标是电流I，纵坐标是电压U。\n   由欧姆定律 U = IR，所以U-I图像的斜率 k = U/I = R。\n   斜率越大，电阻越大。\n\n（2）I-U图像：横坐标是电压U，纵坐标是电流I。\n   由欧姆定律 I = U/R，所以I-U图像的斜率 k = I/U = 1/R。\n   斜率越大，电阻越小（因为斜率是电阻的倒数）。\n\n题目说的是U-I图像，斜率表示电阻，斜率越大电阻越大，所以正确。\n\n记忆：看纵轴是什么。纵轴是U → 斜率=R；纵轴是I → 斜率=1/R。"},{"id":"g3_physics_038_ex05","knowledge_id":"g3_physics_038","question":"选择题：甲、乙两电阻的电流与电压关系如图所示。若将甲、乙串联后接在电压为6V的电源两端，则电路中的电流为（  ）\nA. 0.2A\nB. 0.3A\nC. 0.4A\nD. 0.6A","answer":"答案：A\n解析：\n串联电路中电流处处相等，总电压等于各部分电压之和，即 U甲 + U乙 = 6V。\n\n方法：先从图像求出两个电阻的阻值。\n\n（1）求R甲：从甲的图线取一点，如U甲=2V时I甲=0.2A\nR甲 = U甲/I甲 = 2V / 0.2A = 10Ω\n\n（2）求R乙：从乙的图线取一点，如U乙=4V时I乙=0.2A\nR乙 = U乙/I乙 = 4V / 0.2A = 20Ω\n\n（3）甲、乙串联后的总电阻：\nR总 = R甲 + R乙 = 10Ω + 20Ω = 30Ω\n\n（4）接在6V电源上，电路中的电流：\nI = U/R总 = 6V / 30Ω = 0.2A\n\n验证：\nU甲 = IR甲 = 0.2A × 10Ω = 2V\nU乙 = IR乙 = 0.2A × 20Ω = 4V\nU甲 + U乙 = 2V + 4V = 6V = 电源电压 ✓\n\n所以答案选A。"},{"id":"g3_physics_038_ex06","knowledge_id":"g3_physics_038","question":"选择题：如图是电阻R和小灯泡L的I-U图像。下列说法正确的是（  ）\nA. R的阻值随电压的增大而增大\nB. L的阻值随电压的增大而减小\nC. 将R和L串联，当电流为0.3A时，电源电压为3V\nD. 将R和L并联，当电压为2V时，干路电流为0.5A","answer":"答案：D\n解析：\nA. 错误。R的I-U图像是过原点的直线，说明R是定值电阻，阻值不随电压变化。\nB. 错误。L的I-U图像向下弯曲（斜率越来越小），说明相同电压增加量对应的电流增加量越来越小，即 L的电阻随电压增大而增大（灯丝温度升高）。\nC. 错误。串联时电流相等，都是0.3A。从图像读出：\n   I=0.3A时，U_R = 3V，U_L = 2V（L的电阻大，曲线下弯）\n   总电压 = U_R + U_L = 3V + 2V = 5V ≠ 3V\nD. 正确。并联时电压相等，都是2V。从图像读出：\n   U=2V时，I_R = 0.2A，I_L = 0.3A\n   干路电流 = I_R + I_L = 0.2A + 0.3A = 0.5A\n\n所以选D。"},{"id":"g3_physics_038_ex07","knowledge_id":"g3_physics_038","question":"填空题：在\"探究电流与电阻的关系\"实验中，多次改变电阻的阻值，调节滑动变阻器保持电阻两端电压不变，记录数据后画出了I-R图像，如图所示。由图像可知，实验中保持的电压是______V；当电阻为10Ω时，电流为______A；当电流为0.1A时，电阻为______Ω。","answer":"答案：2；0.2；20\n解析：\n探究电流与电阻关系时，电压不变，电流与电阻成反比，I-R图像是双曲线（反比例函数）。\n\n（1）保持的电压：\n从图像上任取一点，比如R=5Ω时I=0.4A\nU = IR = 0.4A × 5Ω = 2V\n验证：R=10Ω时I=0.2A，U=0.2×10=2V ✓\n      R=20Ω时I=0.1A，U=0.1×20=2V ✓\n所以保持的电压是2V。\n\n（2）当电阻为10Ω时：\n从图像读出，或计算：I = U/R = 2V / 10Ω = 0.2A\n\n（3）当电流为0.1A时：\nR = U/I = 2V / 0.1A = 20Ω\n\n总结：电压一定时，电流与电阻成反比 → I-R图像是双曲线。"},{"id":"g3_physics_038_ex08","knowledge_id":"g3_physics_038","question":"判断题：如果导体的I-U图像是一条过原点的直线，说明该导体的电阻是定值，电流与电压成正比。（  ）","answer":"答案：正确\n解析：\nI-U图像是过原点的直线，说明 I = kU，即电流与电压成正比。\n\n对比欧姆定律 I = U/R = (1/R)U\n可以看出斜率 k = 1/R，是一个定值，说明电阻R是定值。\n\n所以：\n- I-U图像是过原点的直线 → 定值电阻 → 电流与电压成正比\n- I-U图像是曲线（向下弯）→ 电阻变化（变大）→ 如小灯泡\n\n常见例子：\n- 定值电阻：I-U图像是直线\n- 小灯泡：I-U图像是曲线，电阻随温度升高而增大\n\n所以题目说法正确。"},{"id":"g3_physics_038_ex09","knowledge_id":"g3_physics_038","question":"选择题：在如图所示的电路中，电源电压保持不变。闭合开关S，将滑动变阻器的滑片从左向右移动，下列图像中能正确表示定值电阻R两端电压U与电流表示数I关系的是（  ）\n（四个图像的横坐标都是I，纵坐标都是U）\nA. 过原点的倾斜直线\nB. 不过原点的倾斜直线，与纵轴有交点\nC. 水平直线\nD. 曲线，向下弯曲","answer":"答案：A\n解析：\n定值电阻R的阻值不变，由欧姆定律 U = IR，R是定值，所以U与I成正比。\n\nU-I图像是过原点的倾斜直线，斜率等于电阻R。\n\n滑片移动时，滑动变阻器阻值变化，电路总电阻变化，电流变化，定值电阻两端电压也变化，但U与I的比值（即R）不变，所以图像仍是过原点的直线。\n\n电流变大（滑片左移，总电阻变小），U也变大；\n电流变小（滑片右移，总电阻变大），U也变小。\n但只要R是定值，U-I图像就是过原点的直线。\n\n所以选A。\n\n注意：如果问的是滑动变阻器的U-I图像，那就是另一种情况了（U滑 = U总 - IR，是一条向下倾斜的直线）。"},{"id":"g3_physics_038_ex10","knowledge_id":"g3_physics_038","question":"解答题：如图甲所示电路，电源电压保持不变。闭合开关后，滑动变阻器的滑片从一端移到另一端，得到了电压表示数U与电流表示数I的关系图像如图乙所示。求：\n（1）电源电压是多少？\n（2）定值电阻R₀的阻值是多少？\n（3）滑动变阻器的最大阻值是多少？","answer":"答案：\n首先分析电路：R₀与滑动变阻器串联，电压表测滑动变阻器两端的电压，电流表测电路电流。\n\n分析图像：\n- 电流最大时（I=0.6A），滑动变阻器阻值为0，电压表示数为0，此时只有R₀接入。\n- 电流最小时（I=0.2A），滑动变阻器阻值最大，电压表示数最大（4V）。\n\n（1）电源电压：\n当电流I₁=0.6A时，滑动变阻器阻值为0，R₀两端电压等于电源电压。\nU总 = I₁R₀ ...①\n\n当电流I₂=0.2A时，滑动变阻器电压U滑=4V，\nU总 = I₂R₀ + U滑 ...②\n\n电源电压不变，①=②：\n0.6A × R₀ = 0.2A × R₀ + 4V\n0.4A × R₀ = 4V\nR₀ = 10Ω\n\n代入①：U总 = 0.6A × 10Ω = 6V\n\n（2）定值电阻R₀ = 10Ω（上面已求出）\n\n验证：I₂=0.2A时，U₀ = I₂R₀ = 0.2×10 = 2V\nU总 = U₀ + U滑 = 2V + 4V = 6V ✓\n\n（3）滑动变阻器的最大阻值：\n电流最小时（I₂=0.2A），滑动变阻器阻值最大。\n此时滑动变阻器电压U滑=4V，\nR滑大 = U滑/I₂ = 4V / 0.2A = 20Ω\n\n答：（1）电源电压为6V；（2）定值电阻R₀为10Ω；（3）滑动变阻器最大阻值为20Ω。"},{"id":"g3_physics_039_ex01","knowledge_id":"g3_physics_039","question":"选择题：小明家的电能表上标有\"3000 r/(kW·h)\"的字样，他让家中一个用电器单独工作，观察到电能表转盘在10分钟内转了300转。则该用电器消耗的电能是（  ）\nA. 0.1 kW·h\nB. 0.3 kW·h\nC. 1 kW·h\nD. 3 kW·h","answer":"答案：A\n解析：\n电能表参数\"3000 r/(kW·h)\"表示每消耗1 kW·h的电能，转盘转3000转。\n消耗的电能 W = n / N = 300 r / 3000 r/(kW·h) = 0.1 kW·h\n故选A。"},{"id":"g3_physics_039_ex02","knowledge_id":"g3_physics_039","question":"填空题：某家庭用电器正常工作时，通过的电流为5 A，电压为220 V，工作2小时消耗的电能为______ kW·h。","answer":"答案：2.2\n解析：\n已知 U = 220 V，I = 5 A，t = 2 h = 7200 s\n方法一：W = UIt = 220 V × 5 A × 7200 s = 7 920 000 J = 2.2 kW·h\n方法二：P = UI = 220 V × 5 A = 1100 W = 1.1 kW\nW = Pt = 1.1 kW × 2 h = 2.2 kW·h"},{"id":"g3_physics_039_ex03","knowledge_id":"g3_physics_039","question":"选择题：下列单位中，属于电能单位的是（  ）\nA. 瓦特（W）\nB. 焦耳（J）\nC. 安培（A）\nD. 欧姆（Ω）","answer":"答案：B\n解析：\nA. 瓦特（W）是电功率的单位\nB. 焦耳（J）是电能的国际单位，此外还有千瓦时（kW·h）也是电能单位\nC. 安培（A）是电流的单位\nD. 欧姆（Ω）是电阻的单位\n故选B。"},{"id":"g3_physics_039_ex04","knowledge_id":"g3_physics_039","question":"判断题：电流做功的过程就是电能转化为其他形式能的过程，电流做了多少功，就有多少电能转化为其他形式的能。","answer":"答案：正确\n解析：电流做功的实质是电能转化为其他形式能的过程，电流做了多少功，就有多少电能转化为其他形式的能。例如：电流通过电灯，电能转化为内能和光能；电流通过电动机，电能主要转化为机械能。"},{"id":"g3_physics_039_ex05","knowledge_id":"g3_physics_039","question":"解答题：一个电阻为44 Ω的电热水壶，接在220 V的家庭电路中，正常工作30分钟。求：（1）通过电热水壶的电流；（2）电流做的功。","answer":"答案：（1）5 A；（2）1.98×10⁶ J（或0.55 kW·h）\n解析：\n（1）由欧姆定律 I = U/R = 220 V / 44 Ω = 5 A\n（2）电流做的功（电功）：\n   W = UIt = 220 V × 5 A × 30 × 60 s = 220 × 5 × 1800 J = 1 980 000 J = 1.98×10⁶ J\n   或 W = Pt = (U²/R)t = (220²/44) × 1800 = 1100 × 1800 = 1.98×10⁶ J\n   换算成千瓦时：1.98×10⁶ J ÷ (3.6×10⁶ J/kW·h) = 0.55 kW·h"},{"id":"g3_physics_039_ex06","knowledge_id":"g3_physics_039","question":"选择题：关于电功，下列说法正确的是（  ）\nA. 通电时间越长，电流做的功越多\nB. 电流越大，电流做的功越多\nC. 电压越高，电流做的功越多\nD. 电压、电流和通电时间的乘积越大，电流做的功越多","answer":"答案：D\n解析：\n电功的公式是 W = UIt，即电流做的功与电压、电流和通电时间都有关系。\nA. 只说通电时间长，不知道电压和电流，无法确定电功多少\nB. 只说电流大，不知道电压和时间，无法确定电功多少\nC. 只说电压高，不知道电流和时间，无法确定电功多少\nD. 电压、电流和通电时间的乘积就是UIt，等于电功，所以乘积越大，电流做的功越多\n故选D。"},{"id":"g3_physics_039_ex07","knowledge_id":"g3_physics_039","question":"填空题：1度电 = ______ kW·h = ______ J。","answer":"答案：1；3.6×10⁶\n解析：\n日常生活中说的\"1度电\"就是1千瓦时（1 kW·h）。\n1 kW·h = 1000 W × 3600 s = 3 600 000 J = 3.6×10⁶ J"},{"id":"g3_physics_039_ex08","knowledge_id":"g3_physics_039","question":"判断题：在家庭电路中，电能表是用来测量用电器电功率大小的仪表。（  ）","answer":"答案：错误\n解析：电能表是测量电功（消耗电能多少）的仪表，不是测量电功率的。电功率可以通过电能表和秒表间接测量。"},{"id":"g3_physics_039_ex09","knowledge_id":"g3_physics_039","question":"选择题：某同学家的电能表月初示数是0245.6，月末示数是0268.3，则该同学家这个月消耗的电能是（  ）\nA. 22.7度\nB. 227度\nC. 2.27度\nD. 2270度","answer":"答案：A\n解析：\n电能表的读数单位是kW·h（度），最后一位是小数位。\n本月消耗电能 = 月末示数 - 月初示数 = 268.3 kW·h - 245.6 kW·h = 22.7 kW·h = 22.7度\n故选A。"},{"id":"g3_physics_039_ex10","knowledge_id":"g3_physics_039","question":"解答题：某教室里有8盏\"220V 40W\"的日光灯，平均每天使用4小时。求：（1）每盏灯正常工作时的电流；（2）一个月（按30天计算）这8盏灯共消耗多少电能？合多少度？","answer":"答案：（1）约0.18 A；（2）38.4 kW·h，合38.4度\n解析：\n（1）由 P = UI 得每盏灯的电流：\n   I = P/U = 40 W / 220 V ≈ 0.18 A\n（2）8盏灯的总功率：P总 = 8 × 40 W = 320 W = 0.32 kW\n   一个月总工作时间：t = 4 h × 30 = 120 h\n   总消耗电能：W = P总t = 0.32 kW × 120 h = 38.4 kW·h = 38.4度"},{"id":"g3_physics_040_ex01","knowledge_id":"g3_physics_040","question":"选择题：下列关于电功率的说法，正确的是（  ）\nA. 电功率越大的用电器，消耗的电能越多\nB. 电功率是表示电流做功快慢的物理量\nC. 电功率的单位是焦耳（J）\nD. 用电器工作时间越短，电功率越大","answer":"答案：B\n解析：\nA. 错误，消耗的电能 W = Pt，电能多少与电功率和时间都有关，电功率大但时间短，电能不一定多\nB. 正确，电功率是表示电流做功快慢（消耗电能快慢）的物理量\nC. 错误，电功率的单位是瓦特（W），焦耳是电能的单位\nD. 错误，电功率 P = W/t，电功率与电能和时间都有关，只说时间短不能确定电功率大\n故选B。"},{"id":"g3_physics_040_ex02","knowledge_id":"g3_physics_040","question":"填空题：某电热水器的额定功率是2000 W，它正常工作5分钟消耗的电能是______ J。","answer":"答案：6×10⁵\n解析：\n已知 P = 2000 W，t = 5 min = 300 s\n由 P = W/t 得：\nW = Pt = 2000 W × 300 s = 600 000 J = 6×10⁵ J"},{"id":"g3_physics_040_ex03","knowledge_id":"g3_physics_040","question":"选择题：甲、乙两个用电器，甲的电功率比乙大，这说明（  ）\nA. 甲用电器消耗的电
