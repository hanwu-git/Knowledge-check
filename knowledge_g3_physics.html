能一定比乙多\nB. 甲用电器工作的时间一定比乙短\nC. 甲用电器消耗电能一定比乙快\nD. 甲用电器做的功一定比乙多","answer":"答案：C\n解析：\n电功率是表示电流做功快慢（消耗电能快慢）的物理量。电功率大，说明做功快、消耗电能快，但不代表消耗的电能一定多，因为电能还与时间有关。\nA. 电能 W = Pt，不知道时间，无法确定电能多少\nB. 时间长短与电功率大小无关\nC. 电功率大表示消耗电能快，正确\nD. 做功多少即电能多少，与时间有关，无法确定\n故选C。"},{"id":"g3_physics_040_ex04","knowledge_id":"g3_physics_040","question":"判断题：额定电压相同的两个用电器，额定功率大的电阻大。","answer":"答案：错误\n解析：\n由公式 P = U²/R 得 R = U²/P，在额定电压U相同时，额定功率P越大，电阻R越小。\n例如：\"220V 100W\"的灯泡电阻 R = 220²/100 = 484 Ω\n\"220V 40W\"的灯泡电阻 R = 220²/40 = 1210 Ω\n所以额定功率大的电阻反而小。"},{"id":"g3_physics_040_ex05","knowledge_id":"g3_physics_040","question":"解答题：一个标有\"220V 1100W\"的电饭锅，求：（1）它正常工作时的电流；（2）它正常工作时的电阻；（3）正常工作30分钟消耗的电能。","answer":"答案：（1）5 A；（2）44 Ω；（3）1.98×10⁶ J（或0.55 kW·h）\n解析：\n已知 U额 = 220 V，P额 = 1100 W，t = 30 min = 1800 s\n（1）由 P = UI 得正常工作电流：\n   I = P/U = 1100 W / 220 V = 5 A\n（2）由 P = U²/R 得电阻：\n   R = U²/P = (220 V)² / 1100 W = 48400 / 1100 = 44 Ω\n   或 R = U/I = 220 V / 5 A = 44 Ω\n（3）消耗的电能：\n   W = Pt = 1100 W × 1800 s = 1 980 000 J = 1.98×10⁶ J\n   或 W = Pt = 1.1 kW × 0.5 h = 0.55 kW·h"},{"id":"g3_physics_040_ex06","knowledge_id":"g3_physics_040","question":"选择题：将\"220V 100W\"和\"220V 40W\"的两个灯泡串联在220V的电路中，下列说法正确的是（  ）\nA. 100W的灯泡较亮\nB. 40W的灯泡较亮\nC. 两个灯泡一样亮\nD. 无法判断","answer":"答案：B\n解析：\n灯泡的亮度由实际功率决定。串联电路中电流相等，实际功率 P = I²R，电阻大的实际功率大。\n由 R = U额²/P额 可知：\n100W灯泡电阻 R1 = 220²/100 = 484 Ω\n40W灯泡电阻 R2 = 220²/40 = 1210 Ω\n因为 R2 > R1，串联时电流相同，P = I²R，所以40W灯泡的实际功率更大，更亮。\n故选B。"},{"id":"g3_physics_040_ex07","knowledge_id":"g3_physics_040","question":"填空题：1 kW·h的电能可以供一个额定功率为100 W的用电器正常工作______小时。","answer":"答案：10\n解析：\n已知 W = 1 kW·h，P = 100 W = 0.1 kW\n由 P = W/t 得：\nt = W/P = 1 kW·h / 0.1 kW = 10 h"},{"id":"g3_physics_040_ex08","knowledge_id":"g3_physics_040","question":"判断题：用电器的实际功率一定等于它的额定功率。","answer":"答案：错误\n解析：\n用电器只有在额定电压下工作时，实际功率才等于额定功率。当实际电压高于额定电压时，实际功率大于额定功率；当实际电压低于额定电压时，实际功率小于额定功率。\n例如：\"220V 100W\"的灯泡接在110V的电路中，实际功率只有25W（因为 P实 = U实²/R = (U实/U额)²·P额 = (110/220)²×100 = 25W）。"},{"id":"g3_physics_040_ex09","knowledge_id":"g3_physics_040","question":"选择题：甲用电器2分钟消耗电能6000 J，乙用电器10秒消耗电能2000 J，比较它们的电功率，下列说法正确的是（  ）\nA. 甲用电器的功率大\nB. 乙用电器的功率大\nC. 两个用电器功率一样大\nD. 无法比较","answer":"答案：B\n解析：\n电功率 P = W/t\n甲用电器：P甲 = W甲/t甲 = 6000 J / 120 s = 50 W\n乙用电器：P乙 = W乙/t乙 = 2000 J / 10 s = 200 W\n因为 200 W > 50 W，所以乙用电器的功率大。\n故选B。"},{"id":"g3_physics_040_ex10","knowledge_id":"g3_physics_040","question":"解答题：一个标有\"12V 6W\"的小灯泡，接在电压为9V的电路中，求它的实际功率是多少？（假设灯丝电阻不变）","answer":"答案：3.375 W\n解析：\n灯泡的灯丝电阻不变，先根据额定电压和额定功率求出电阻。\n由 P = U²/R 得灯丝电阻：\nR = U额²/P额 = (12 V)² / 6 W = 144 / 6 = 24 Ω\n当电压为9V时，实际功率：\nP实 = U实²/R = (9 V)² / 24 Ω = 81 / 24 = 3.375 W\n也可以用比例法：P实/P额 = (U实/U额)²\nP实 = P额 × (U实/U额)² = 6W × (9/12)² = 6W × 9/16 = 3.375 W"},{"id":"g3_physics_041_ex01","knowledge_id":"g3_physics_041","question":"选择题：在\"测量小灯泡的电功率\"实验中，需要测量的物理量是（  ）\nA. 电流和电阻\nB. 电压和电阻\nC. 电压和电流\nD. 电能和时间","answer":"答案：C\n解析：\n测量小灯泡电功率的实验原理是 P = UI，所以需要用电压表测量小灯泡两端的电压，用电流表测量通过小灯泡的电流，然后计算出电功率。\n故选C。"},{"id":"g3_physics_041_ex02","knowledge_id":"g3_physics_041","question":"填空题：在\"测量小灯泡的电功率\"实验中，滑动变阻器的作用是：（1）保护电路；（2）______。","answer":"答案：改变小灯泡两端的电压（或改变通过小灯泡的电流）\n解析：\n滑动变阻器在实验中的作用有两个：\n（1）保护电路，防止电流过大损坏元件；\n（2）通过改变自身电阻来改变电路中的电流，从而改变小灯泡两端的电压，使小灯泡在不同电压下工作，以便测量小灯泡在额定电压、高于额定电压和低于额定电压时的电功率。"},{"id":"g3_physics_041_ex03","knowledge_id":"g3_physics_041","question":"选择题：在\"测量小灯泡电功率\"的实验中，某同学闭合开关后，发现小灯泡不亮，电流表无示数，电压表有示数且接近电源电压。则故障原因可能是（  ）\nA. 小灯泡短路\nB. 小灯泡断路\nC. 滑动变阻器短路\nD. 滑动变阻器断路","answer":"答案：B\n解析：\nA. 小灯泡短路时，电压表也被短路，示数为0，不符合题意\nB. 小灯泡断路时，电路中没有电流（电流表无示数），电压表串联在电路中，由于电压表内阻很大，其示数接近电源电压，符合题意\nC. 滑动变阻器短路时，电路是通路，灯泡应发光，电流表有示数，不符合题意\nD. 滑动变阻器断路时，整个电路断路，电压表也没有示数，不符合题意\n故选B。"},{"id":"g3_physics_041_ex04","knowledge_id":"g3_physics_041","question":"判断题：测量小灯泡电功率时，要多次测量取平均值以减小误差。","answer":"答案：错误\n解析：\n测量小灯泡电功率的实验目的是研究小灯泡在不同电压下的电功率（亮度）变化规律，而不是为了精确测量某个固定值。小灯泡在不同电压下的实际功率本来就是不同的，所以不能通过多次测量取平均值来减小误差。\n注意与\"测量定值电阻的阻值\"实验区分：测定值电阻时，电阻是定值，多次测量取平均值可以减小误差；而测小灯泡功率时，小灯泡的功率随电压变化而变化，取平均值没有意义。"},{"id":"g3_physics_041_ex05","knowledge_id":"g3_physics_041","question":"解答题：在\"测量小灯泡电功率\"的实验中，小灯泡上标有\"2.5V 0.3A\"的字样。实验中，当电压表的示数为2.5 V时，电流表的示数如图所示（电流表量程为0~0.6A，指针指在0.28A的位置）。求：（1）小灯泡的额定功率；（2）若电压表的示数为2 V时，电流表的示数为0.25 A，此时小灯泡的实际功率是多少？","answer":"答案：（1）0.7 W；（2）0.5 W\n解析：\n（1）额定功率是指小灯泡在额定电压下的功率。\n   额定电压 U额 = 2.5 V，额定电流 I额 = 0.28 A（题目说电流表量程0~0.6A，指针在0.28A）\n   P额 = U额I额 = 2.5 V × 0.28 A = 0.7 W\n   （如果题目中灯泡标有\"2.5V 0.3A\"，则额定功率也可以是 P = UI = 2.5V × 0.3A = 0.75W，具体以实验测量为准）\n（2）当电压 U实 = 2 V，电流 I实 = 0.25 A 时：\n   P实 = U实I实 = 2 V × 0.25 A = 0.5 W\n   可见，实际电压低于额定电压时，实际功率小于额定功率，灯泡较暗。"},{"id":"g3_physics_041_ex06","knowledge_id":"g3_physics_041","question":"选择题：在\"测量小灯泡的电功率\"实验中，下列说法正确的是（  ）\nA. 闭合开关前，滑动变阻器的滑片应放在阻值最小的位置\nB. 连接电路时，开关应该是闭合的\nC. 电流表要串联在电路中，电压表要并联在灯泡两端\nD. 实验时，小灯泡两端的电压只能等于额定电压","answer":"答案：C\n解析：\nA. 错误，闭合开关前，滑动变阻器应放在阻值最大的位置，以保护电路\nB. 错误，连接电路时开关应断开，防止短路\nC. 正确，电流表要串联，电压表要并联\nD. 错误，实验时要测量三种情况：低于额定电压、等于额定电压、高于额定电压（约1.2倍）\n故选C。"},{"id":"g3_physics_041_ex07","knowledge_id":"g3_physics_041","question":"填空题：某小灯泡的额定电压是3.8 V，在测量它的额定功率时，电压表应选用______量程（选填\"0~3V\"或\"0~15V\"）；若电源电压为6 V，滑动变阻器应至少分得______ V的电压。","answer":"答案：0~15V；2.2\n解析：\n额定电压是3.8 V，超过了3 V，所以电压表应选用0~15V的量程。\n电源电压为6 V，小灯泡两端电压为3.8 V，根据串联电路电压规律：\nU滑 = U总 - U灯 = 6 V - 3.8 V = 2.2 V"},{"id":"g3_physics_041_ex08","knowledge_id":"g3_physics_041","question":"判断题：在测量小灯泡电功率的实验中，小灯泡越亮，说明它的实际功率越大。","answer":"答案：正确\n解析：\n小灯泡的亮度由实际功率决定，实际功率越大，灯泡越亮。在实验中可以观察到：当电压高于额定电压时，实际功率大于额定功率，灯泡比正常发光更亮；当电压低于额定电压时，实际功率小于额定功率，灯泡比正常发光暗。"},{"id":"g3_physics_041_ex09","knowledge_id":"g3_physics_041","question":"选择题：在做\"测量小灯泡电功率\"的实验时，有位同学连接好电路后，闭合开关，小灯泡发出明亮的光并很快熄灭。检查发现灯泡烧坏了。造成这一现象的原因不可能是（  ）\nA. 滑动变阻器的滑片没有放在最大阻值处\nB. 电源电压过高\nC. 电压表的量程选小了\nD. 电路中发生了短路","answer":"答案：C\n解析：\nA. 滑动变阻器阻值太小，电路中电流过大，可能烧坏灯泡\nB. 电源电压过高，灯泡实际功率过大，可能烧坏灯泡\nC. 电压表量程选小了，只会导致电压表损坏，不会烧坏灯泡，因为电压表并联在灯泡两端，内阻很大\nD. 电路短路时，电流过大，可能烧坏灯泡\n故选C。"},{"id":"g3_physics_041_ex10","knowledge_id":"g3_physics_041","question":"解答题：在\"测量小灯泡的电功率\"实验中，电源电压为6 V恒定不变，小灯泡的额定电压为2.5 V，电阻约为10 Ω。实验室有三个滑动变阻器，规格分别为：A. 10Ω 1A、B. 20Ω 0.5A、C. 50Ω 0.2A。（1）请通过计算说明应选择哪个滑动变阻器；（2）实验中测得三组数据如下表，求小灯泡的额定功率。\n| 实验次数 | 电压U/V | 电流I/A |\n|---------|---------|---------|\n| 1 | 2.0 | 0.26 |\n| 2 | 2.5 | 0.30 |\n| 3 | 3.0 | 0.34 |","answer":"答案：（1）选B（20Ω 0.5A）；（2）0.75 W\n解析：\n（1）灯泡正常发光时，电路中的电流约为：\n   I = U灯/R灯 = 2.5 V / 10 Ω = 0.25 A\n   此时滑动变阻器两端的电压：\n   U滑 = U总 - U灯 = 6 V - 2.5 V = 3.5 V\n   滑动变阻器接入的电阻：\n   R滑 = U滑/I = 3.5 V / 0.25 A = 14 Ω\n   所以滑动变阻器的最大阻值应大于14 Ω，排除A（10Ω）。\n   电路中的最大电流约为0.25A < 0.5A，B的电流满足；C的额定电流只有0.2A，小于0.25A，会烧坏。\n   故选B（20Ω 0.5A）。\n（2）额定电压为2.5V，对应的电流为0.30A\n   额定功率 P额 = U额I额 = 2.5 V × 0.30 A = 0.75 W"},{"id":"g3_physics_042_ex01","knowledge_id":"g3_physics_042","question":"选择题：焦耳定律的内容是：电流通过导体产生的热量跟电流的二次方成正比，跟导体的电阻成正比，跟通电时间成正比。下列公式中，能正确表示焦耳定律的是（  ）\nA. Q = I²Rt\nB. Q = UIt\nC. Q = U²t/R\nD. Q = Pt","answer":"答案：A\n解析：\n焦耳定律的数学表达式是 Q = I²Rt，这是焦耳通过实验总结出来的规律，是普遍适用的。\n而 Q = UIt、Q = U²t/R、Q = Pt 只适用于纯电阻电路（电能全部转化为内能的电路），它们是由欧姆定律推导出来的，不是焦耳定律的原始表达式。\n故选A。"},{"id":"g3_physics_042_ex02","knowledge_id":"g3_physics_042","question":"填空题：一个阻值为50 Ω的电阻丝，通过的电流为2 A，通电1分钟产生的热量是______ J。","answer":"答案：12000\n解析：\n已知 R = 50 Ω，I = 2 A，t = 1 min = 60 s\n根据焦耳定律 Q = I²Rt：\nQ = (2 A)² × 50 Ω × 60 s = 4 × 50 × 60 J = 12 000 J"},{"id":"g3_physics_042_ex03","knowledge_id":"g3_physics_042","question":"选择题：在探究电流产生的热量与哪些因素有关的实验中，为了研究电流产生的热量与电阻的关系，应该（  ）\nA. 保持电流和电阻相同，改变通电时间\nB. 保持电流和时间相同，改变电阻\nC. 保持电阻和时间相同，改变电流\nD. 保持电流、电阻和时间都相同","answer":"答案：B\n解析：\n电流产生的热量与电流、电阻和通电时间三个因素有关，研究时要用控制变量法。\n要研究电流产生的热量与电阻的关系，需要控制电流和通电时间相同，改变电阻。\n通常采用串联电路，因为串联电路中电流处处相等，通电时间也相同。\n故选B。"},{"id":"g3_physics_042_ex04","knowledge_id":"g3_physics_042","question":"判断题：电流通过导体时，产生的热量越多，电功率越大。","answer":"答案：错误\n解析：\n电流产生的热量 Q = I²Rt，热量多少与电流、电阻和时间都有关系。\n如果时间相同时，产生热量越多，电功率越大。\n但如果时间不同，就无法直接比较。\n例如：一个100W的灯泡工作1分钟产生的热量，可能比一个200W的灯泡工作10秒产生的热量多，但200W的灯泡的电功率更大。"},{"id":"g3_physics_042_ex05","knowledge_id":"g3_physics_042","question":"解答题：一个电热水壶的额定电压为220 V，额定功率为1100 W，其发热体电阻为44 Ω。求：（1）电热水壶正常工作时的电流；（2）正常工作5分钟产生的热量。（假设电能全部转化为内能）","answer":"答案：（1）5 A；（2）3.3×10⁵ J\n解析：\n已知 U = 220 V，P = 1100 W，R = 44 Ω，t = 5 min = 300 s\n（1）由 P = UI 得：\n   I = P/U = 1100 W / 220 V = 5 A\n（2）方法一：Q = I²Rt = (5 A)² × 44 Ω × 300 s = 25 × 44 × 300 = 330 000 J = 3.3×10⁵ J\n   方法二：因为是纯电阻电路，Q = W = Pt = 1100 W × 300 s = 3.3×10⁵ J\n   方法三：Q = UIt = 220 V × 5 A × 300 s = 3.3×10⁵ J\n   方法四：Q = U²t/R = (220 V)² × 300 s / 44 Ω = 48400 × 300 / 44 = 3.3×10⁵ J"},{"id":"g3_physics_042_ex06","knowledge_id":"g3_physics_042","question":"选择题：甲、乙两个电阻，R甲 > R乙，将它们串联在电路中，相同时间内产生的热量分别为Q甲和Q乙，则（  ）\nA. Q甲 > Q乙\nB. Q甲 < Q乙\nC. Q甲 = Q乙\nD. 无法判断","answer":"答案：A\n解析：\n甲、乙串联，电流相同，通电时间相同。\n根据焦耳定律 Q = I²Rt，在电流I和时间t相同时，热量Q与电阻R成正比。\n因为 R甲 > R乙，所以 Q甲 > Q乙。\n故选A。"},{"id":"g3_physics_042_ex07","knowledge_id":"g3_physics_042","question":"填空题：两根电阻丝的电阻之比为2:3，通过它们的电流之比为3:2，在相同时间内它们产生的热量之比为______。","answer":"答案：3:2\n解析：\n已知 R1:R2 = 2:3，I1:I2 = 3:2，t1:t2 = 1:1\n根据焦耳定律 Q = I²Rt\nQ1/Q2 = (I1²R1t1)/(I2²R2t2) = (3²×2×1)/(2²×3×1) = (9×2)/(4×3) = 18/12 = 3/2\n所以 Q1:Q2 = 3:2"},{"id":"g3_physics_042_ex08","knowledge_id":"g3_physics_042","question":"判断题：在任何电路中，电流做的电功W总是等于产生的电热Q。（  ）","answer":"答案：错误\n解析：\n只有在纯电阻电路中（电能全部转化为内能的电路，如电热水器、电熨斗、电烙铁等），电功才等于电热，即W = Q。\n在非纯电阻电路中（如电动机、电风扇、电冰箱等），电能主要转化为机械能，只有一部分转化为内能，此时电功大于电热，即W > Q。\n例如：电动机工作时，W = UIt，Q = I²Rt，W = Q + W机械。"},{"id":"g3_physics_042_ex09","knowledge_id":"g3_physics_042","question":"选择题：电炉丝热得发热，而跟电炉丝连接的铜导线却不怎么热，这是因为（  ）\nA. 通过电炉丝的电流大，通过铜导线的电流小\nB. 电炉丝的电阻比铜导线的电阻大得多\nC. 电炉丝的通电时间比铜导线长\nD. 以上说法都不对","answer":"答案：B\n解析：\n电炉丝和铜导线是串联的，通过它们的电流相等，通电时间也相同。\n根据焦耳定律 Q = I²Rt，在电流和时间相同的情况下，电阻大的产生的热量多。\n电炉丝的电阻比铜导线大得多，所以电炉丝产生大量的热，而铜导线产生的热量很少。\n故选B。"},{"id":"g3_physics_042_ex10","knowledge_id":"g3_physics_042","question":"解答题：某电动机的额定电压为220 V，正常工作时的电流为10 A，线圈电阻为2 Ω。求：（1）电动机正常工作1分钟消耗的电能；（2）电动机线圈1分钟产生的热量；（3）电动机工作1分钟转化为机械能的能量是多少？","answer":"答案：（1）1.32×10⁵ J；（2）1.2×10⁴ J；（3）1.2×10⁵ J\n解析：\n已知 U = 220 V，I = 10 A，R = 2 Ω，t = 1 min = 60 s\n（1）电动机消耗的电能（电功）：\n   W = UIt = 220 V × 10 A × 60 s = 132 000 J = 1.32×10⁵ J\n（2）线圈产生的热量：\n   Q = I²Rt = (10 A)² × 2 Ω × 60 s = 100 × 2 × 60 = 12 000 J = 1.2×10⁴ J\n（3）转化为机械能的能量：\n   W机械 = W - Q = 1.32×10⁵ J - 1.2×10⁴ J = 1.2×10⁵ J\n   注意：电动机是非纯电阻用电器，不能用Q = UIt或Q = U²t/R计算热量，只能用Q = I²Rt。"},{"id":"g3_physics_043_ex01","knowledge_id":"g3_physics_043","question":"选择题：下列用电器中，利用电流热效应工作的是（  ）\nA. 电风扇\nB. 电熨斗\nC. 电视机\nD. 电冰箱","answer":"答案：B\n解析：\n电流的热效应是指电流通过导体时，导体会发热的现象，将电能主要转化为内能。\nA. 电风扇主要将电能转化为机械能，只有很少一部分转化为内能\nB. 电熨斗工作时将电能主要转化为内能，利用电流的热效应工作\nC. 电视机主要将电能转化为光能和声能\nD. 电冰箱主要将电能转化为机械能（压缩机）\n故选B。"},{"id":"g3_physics_043_ex02","knowledge_id":"g3_physics_043","question":"填空题：电流通过导体时电能转化为内能的现象叫做电流的______效应；电热器就是利用电流的______效应制成的加热设备。","answer":"答案：热；热\n解析：\n电流通过导体时，导体会发热，电能转化为内能，这种现象叫做电流的热效应。\n电热器（如电热水器、电熨斗、电烙铁、电饭锅、电暖器等）就是利用电流的热效应制成的，它们主要将电能转化为内能。"},{"id":"g3_physics_043_ex03","knowledge_id":"g3_physics_043","question":"选择题：下列措施中，属于防止电热危害的是（  ）\nA. 用电饭锅煮饭\nB. 用电熨斗熨衣服\nC. 电视机后盖有许多小孔\nD. 用电热孵卵器孵小鸡","answer":"答案：C\n解析：\n电热既有有利的一面，也有有害的一面。\nA、B、D都是利用电热为人类服务的例子，属于电热的利用。\nC. 电视机工作时会产生热量，如果热量不及时散发，会损坏元件。电视机后盖的小孔是为了通风散热，属于防止电热危害的措施。\n类似的防止电热危害的例子还有：电脑机箱内有小风扇散热、电动机外壳有散热片、变压器有散热片等。\n故选C。"},{"id":"g3_physics_043_ex04","knowledge_id":"g3_physics_043","question":"判断题：电热器的发热体要用电阻率大、熔点高的合金丝制成。","answer":"答案：正确\n解析：\n电热器的发热体需要满足两个条件：\n（1）电阻率大：根据Q = I²Rt，在相同电流和时间下，电阻大的产生的热量多。用电阻率大的材料，可以在较短的长度内获得较大的电阻。\n（2）熔点高：发热体工作时温度很高，需要熔点高的材料才不会被熔化。\n所以发热体通常用电阻率大、熔点高的镍铬合金等材料制成。"},{"id":"g3_physics_043_ex05","knowledge_id":"g3_physics_043","question":"解答题：一个标有\"220V 1100W\"的电热水器，装有50 kg的水，正常工作时将水从20℃加热到60℃。求：（1）电热水器正常工作时的电流；（2）正常工作20分钟产生的热量；（3）这些热量能使水的温度升高多少？[水的比热容c水 = 4.2×10³ J/(kg·℃)]","answer":"答案：（1）5 A；（2）1.32×10⁶ J；（3）约6.3℃（或实际加热20分钟水温升高的温度）\n解析：\n已知 U = 220 V，P = 1100 W，m水 = 50 kg，t = 20 min = 1200 s\n（1）由 P = UI 得：\n   I = P/U = 1100 W / 220 V = 5 A\n（2）电热水器是纯电阻用电器，产生的热量等于消耗的电能：\n   Q = W = Pt = 1100 W × 1200 s = 1 320 000 J = 1.32×10⁶ J\n（3）由 Q吸 = cmΔt 得：\n   Δt = Q吸/(cm) = 1.32×10⁶ J / [4.2×10³ J/(kg·℃) × 50 kg]\n      = 1.32×10⁶ / (2.1×10⁵) ℃ ≈ 6.3 ℃\n   （如果是从20℃加热到60℃，需要的热量 Q = cmΔt = 4.2×10³ × 50 × 40 = 8.4×10⁶ J，\n    需要时间 t = Q/P = 8.4×10⁶ / 1100 ≈ 7636 s ≈ 127分钟）"},{"id":"g3_physics_043_ex06","knowledge_id":"g3_physics_043","question":"选择题：下列用电器中，主要利用电流热效应工作的是（  ）\nA. 电脑\nB. 电冰箱\nC. 电烙铁\nD. 洗衣机","answer":"答案：C\n解析：\nA. 电脑工作时主要将电能转化为光能、声能等，只有少部分转化为内能\nB. 电冰箱工作时主要将电能转化为机械能（压缩机）\nC. 电烙铁工作时主要将电能转化为内能，利用电流的热效应\nD. 洗衣机工作时主要将电能转化为机械能（电动机）\n故选C。"},{"id":"g3_physics_043_ex07","knowledge_id":"g3_physics_043","question":"填空题：保险丝是用电阻率______、熔点______的铅锑合金制成的，当电路中电流过大时，保险丝由于温度升高而熔断，切断电路，起到保护作用。这是利用了电流的______效应。","answer":"答案：大；低；热\n解析：\n保险丝的作用是当电路中电流过大时自动熔断，保护电路。\n保险丝需要满足：\n（1）电阻率大：根据Q = I²Rt，在相同电流下，电阻大的产生的热量多，温度升高快，容易熔断。\n（2）熔点低：温度升高时容易熔化，及时切断电路。\n保险丝的工作原理就是利用电流的热效应。"},{"id":"g3_physics_043_ex08","knowledge_id":"g3_physics_043","question":"判断题：电动机工作时产生的热量越少越好，所以电动机的线圈应该用超导材料制作，这样就不会产生热量了。","answer":"答案：正确\n解析：\n电动机工作时，线圈有电阻，会产生热量。这些热量不仅浪费电能，还可能烧坏电动机。\n如果用超导材料（电阻为零）制作线圈，根据Q = I²Rt，R = 0，则Q = 0，不会产生热量，电能可以全部转化为机械能，大大提高效率。\n目前超导材料还需要在很低的温度下才能实现，还不能广泛应用。如果能在常温下实现超导，将给电动机等电器带来革命性的变化。"},{"id":"g3_physics_043_ex09","knowledge_id":"g3_physics_043","question":"选择题：下列关于电热的说法中，正确的是（  ）\nA. 电热对我们总是有用的\nB. 电热对我们总是有害的\nC. 电饭锅是利用电流热效应工作的\nD. 电视机工作时不产生电热","answer":"答案：C\n解析：\nA. 错误，电热有时是有害的，如电视机发热过多会损坏元件\nB. 错误，电热有时是有用的，如电热水器、电饭锅等利用电热工作\nC. 正确，电饭锅就是利用电流的热效应，将电能转化为内能来煮饭的\nD. 错误，任何用电器工作时，只要有电阻，就会产生电热。电视机工作时也会发热\n故选C。"},{"id":"g3_physics_043_ex10","knowledge_id":"g3_physics_043","question":"解答题：某电热水壶的铭牌上标有\"220V 1000W\"的字样，用它来烧水。求：（1）电热水壶正常工作时的电阻；（2）正常工作7分钟产生的热量；（3）这些热量全部被质量为2 kg、温度为20℃的水吸收，水的温度能升高到多少℃？[c水 = 4.2×10³ J/(kg·℃)]","answer":"答案：（1）48.4 Ω；（2）4.2×10⁵ J；（3）70℃\n解析：\n已知 U额 = 220 V，P额 = 1000 W，t = 7 min = 420 s，m = 2 kg，t0 = 20℃\n（1）由 P = U²/R 得：\n   R = U额²/P额 = (220 V)² / 1000 W = 48400 / 1000 = 48.4 Ω\n（2）产生的热量（纯电阻电路）：\n   Q = W = Pt = 1000 W × 420 s = 420 000 J = 4.2×10⁵ J\n（3）由 Q吸 = cm(t - t0) 得：\n   t = t0 + Q吸/(cm) = 20℃ + 4.2×10⁵ J / [4.2×10³ J/(kg·℃) × 2 kg]\n     = 20℃ + 4.2×10⁵ / 8400 ℃\n     = 20℃ + 50℃ = 70℃"},{"id":"g3_physics_044_ex01","knowledge_id":"g3_physics_044","question":"选择题：两个电阻R1和R2，R1 = 10 Ω，R2 = 20 Ω，将它们串联后接在电压为6 V的电源上，则电路的总功率是（  ）\nA. 0.2 W\nB. 1.2 W\nC. 3.6 W\nD. 0.6 W","answer":"答案：B\n解析：\n两电阻串联，总电阻 R总 = R1 + R2 = 10 Ω + 20 Ω = 30 Ω\n方法一：总功率 P总 = U²/R总 = (6 V)² / 30 Ω = 36 / 30 = 1.2 W\n方法二：电路中的电流 I = U/R总 = 6 V / 30 Ω = 0.2 A\n       总功率 P总 = UI = 6 V × 0.2 A = 1.2 W\n方法三：P1 = I²R1 = (0.2 A)² × 10 Ω = 0.4 W\n       P2 = I²R2 = (0.2 A)² × 20 Ω = 0.8 W\n       P总 = P1 + P2 = 0.4 W + 0.8 W = 1.2 W\n故选B。"},{"id":"g3_physics_044_ex02","knowledge_id":"g3_physics_044","question":"填空题：两个电阻R1 = 6 Ω和R2 = 3 Ω并联后接在电压为3 V的电源上，则通过R1的电流是______ A，R2的功率是______ W，电路的总功率是______ W。","answer":"答案：0.5；3；4.5\n解析：\n并联电路，各支路电压相等，都等于电源电压U = 3 V\n（1）通过R1的电流：I1 = U/R1 = 3 V / 6 Ω = 0.5 A\n（2）R2的功率：P2 = U²/R2 = (3 V)² / 3 Ω = 9 / 3 = 3 W\n     或 I2 = U/R2 = 3 V / 3 Ω = 1 A，P2 = UI2 = 3 V × 1 A = 3 W\n（3）总功率：P总 = P1 + P2\n     P1 = UI1 = 3 V × 0.5 A = 1.5 W\n     P总 = 1.5 W + 3 W = 4.5 W\n     或 P总 = U²/R总，其中 R总 = R1R2/(R1+R2) = 6×3/(6+3) = 2 Ω\n     P总 = 3² / 2 = 9/2 = 4.5 W"},{"id":"g3_physics_044_ex03","knowledge_id":"g3_physics_044","question":"选择题：将标有\"6V 3W\"和\"6V 6W\"的两个小灯泡串联在电路中，要使其中一个灯泡正常发光，且不损坏另一个灯泡，则电路两端的总电压应为（  ）\nA. 6 V\nB. 9 V\nC. 12 V\nD. 18 V","answer":"答案：B\n解析：\n先求两灯的额定电流和电阻：\n灯1：I1额 = P1额/U1额 = 3W/6V = 0.5 A，R1 = U1额/I1额 = 6V/0.5A = 12 Ω\n灯2：I2额 = P2额/U2额 = 6W/6V = 1 A，R2 = U2额/I2额 = 6V/1A = 6 Ω\n两灯串联，电流相等。要使一个灯正常发光且不损坏另一个，电路中的最大电流只能是较小的额定电流，即I = 0.5 A（灯1正常发光，灯2较暗）\n此时总电压：U = I(R1 + R2) = 0.5 A × (12 Ω + 6 Ω) = 0.5 × 18 = 9 V\n验证：灯1的电压U1 = IR1 = 0.5×12 = 6V（正常发光），灯2的电压U2 = IR2 = 0.5×6 = 3V（低于额定电压，安全）\n故选B。"},{"id":"g3_physics_044_ex04","knowledge_id":"g3_physics_044","question":"判断题：两个用电器串联，电阻大的用电器功率大；两个用电器并联，电阻大的用电器功率小。","answer":"答案：正确\n解析：\n串联电路中，电流处处相等，由P = I²R可知，功率P与电阻R成正比，所以电阻大的功率大。\n并联电路中，各支路电压相等，由P = U²/R可知，功率P与电阻R成反比，所以电阻大的功率小。\n总结：串联时P与R成正比，并联时P与R成反比。"},{"id":"g3_physics_044_ex05","knowledge_id":"g3_physics_044","question":"解答题：一个标有\"220V 880W\"的电饭锅，在用电高峰期，由于电压降低，电饭锅的实际功率只有810 W。求：（1）电饭锅的电阻；（2）此时的实际电压；（3）此时电路中的电流。（假设电阻不变）","answer":"答案：（1）55 Ω；（2）约211 V；（3）约3.84 A\n解析：\n已知 U额 = 220 V，P额 = 880 W，P实 = 810 W\n（1）电饭锅的电阻：\n   R = U额²/P额 = (220 V)² / 880 W = 48400 / 880 = 55 Ω\n（2）由 P实 = U实²/R 得：\n   U实² = P实 × R = 810 W × 55 Ω = 44550\n   U实 = √44550 ≈ 211 V\n   或用比例法：P实/P额 = (U实/U额)²\n   U实 = U额 × √(P实/P额) = 220 × √(810/880) = 220 × √(81/88) = 220 × 9/√88 ≈ 220 × 9/9.38 ≈ 211 V\n（3）此时的电流：\n   I实 = U实/R = 211 V / 55 Ω ≈ 3.84 A\n   或 I实 = P实/U实 = 810 W / 211 V ≈ 3.84 A"},{"id":"g3_physics_044_ex06","knowledge_id":"g3_physics_044","question":"选择题：将L1\"12V 6W\"和L2\"12V 12W\"的两个灯泡串联在12 V的电源上，下列说法正确的是（  ）\nA. L1更亮，因为L1的电阻大\nB. L2更亮，因为L2的额定功率大\nC. 两灯一样亮\nD. 无法判断","answer":"答案：A\n解析：\n灯泡的亮度由实际功率决定。串联时电流相等，P = I²R，电阻大的实际功率大。\n先求两灯的电阻：\nR1 = U额²/P1额 = 12²/6 = 144/6 = 24 Ω\nR2 = U额²/P2额 = 12²/12 = 144/12 = 12 Ω\n因为 R1 > R2，串联时P1实 > P2实，所以L1更亮。\n注意：额定功率大的灯泡，在串联时实际功率反而小，因为它的电阻小。\n故选A。"},{"id":"g3_physics_044_ex07","knowledge_id":"g3_physics_044","question":"填空题：一个标有\"6V 3W\"的小灯泡，与一个阻值为6 Ω的定值电阻串联后接在电源上，小灯泡恰好正常发光。则电源电压是______ V，电路的总功率是______ W。","answer":"答案：9；4.5\n解析：\n小灯泡正常发光时，电压为额定电压U灯 = 6 V，电流为额定电流：\nI灯 = P灯/U灯 = 3 W / 6 V = 0.5 A\n因为串联，电流处处相等，所以电阻中的电流 I阻 = I灯 = 0.5 A\n电阻两端的电压：U阻 = I阻 × R阻 = 0.5 A × 6 Ω = 3 V\n电源电压：U总 = U灯 + U阻 = 6 V + 3 V = 9 V\n电路的总功率：\n方法一：P总 = U总 × I = 9 V × 0.5 A = 4.5 W\n方法二：P总 = P灯 + P阻 = 3 W + (I²R) = 3 W + (0.5²×6) = 3 + 1.5 = 4.5 W"},{"id":"g3_physics_044_ex08","knowledge_id":"g3_physics_044","question":"判断题：用电器的实际功率越大，它消耗的电能就越多。","answer":"答案：错误\n解析：\n消耗的电能 W = Pt，电能多少与电功率和时间都有关系。\n如果用电器的实际功率大，但工作时间短，消耗的电能不一定多。\n例如：一个1000W的空调工作1小时，消耗电能1 kW·h；\n一个100W的电灯工作12小时，消耗电能1.2 kW·h。\n虽然空调功率大，但电灯工作时间长，消耗的电能更多。"},{"id":"g3_physics_044_ex09","knowledge_id":"g3_physics_044","question":"选择题：甲、乙两个用电器的电功率之比为3:2，工作时间之比为1:3，则它们消耗的电能之比为（  ）\nA. 3:2\nB. 1:2\nC. 2:1\nD. 1:3","answer":"答案：B\n解析：\n消耗的电能 W = Pt\nW甲/W乙 = (P甲t甲)/(P乙t乙) = (P甲/P乙) × (t甲/t乙) = (3/2) × (1/3) = 3/6 = 1/2\n所以 W甲:W乙 = 1:2\n故选B。"},{"id":"g3_physics_044_ex10","knowledge_id":"g3_physics_044","question":"解答题：如图所示的电路中，电源电压为12 V保持不变，R1 = 20 Ω，滑动变阻器R2的最大阻值为40 Ω。求：（1）当滑片P在最左端时，电路中的电流和R1的功率；（2）当滑片P在最右端时，电路中的电流和R1的功率；（3）滑动变阻器的功率最大为多少？","answer":"答案：（1）0.6 A，7.2 W；（2）0.2 A，0.8 W；（3）1.8 W\n解析：\n（1）滑片P在最左端时，R2 = 0，电路中只有R1\n   电流 I = U/R1 = 12 V / 20 Ω = 0.6 A\n   R1的功率 P1 = UI = 12 V × 0.6 A = 7.2 W\n   （或P1 = U²/R1 = 12²/20 = 144/20 = 7.2 W）\n（2）滑片P在最右端时，R2最大，两电阻串联\n   总电阻 R总 = R1 + R2 = 20 Ω + 40 Ω = 60 Ω\n   电流 I = U/R总 = 12 V / 60 Ω = 0.2 A\n   R1的功率 P1 = I²R1 = (0.2 A)² × 20 Ω = 0.04 × 20 = 0.8 W\n（3）滑动变阻器的功率 P2 = I²R2 = (U/(R1+R2))² × R2 = U²R2/(R1+R2)²\n   当R2 = R1 = 20 Ω时，滑动变阻器的功率最大（这是一个重要结论：当滑动变阻器阻值与定值电阻相等时，滑动变阻器的功率最大）\n   此时 I = U/(R1+R2) = 12 V / 40 Ω = 0.3 A\n   P2最大 = I²R2 = (0.3 A)² × 20 Ω = 0.09 × 20 = 1.8 W"},{"id":"g3_physics_045_ex01","knowledge_id":"g3_physics_045","question":"选择题：在家庭电路中，同时工作的用电器越多，电路的（  ）\nA. 总电阻越大\nB. 总电压越大\nC. 总电流越大\nD. 总功率越小","answer":"答案：C\n解析：\n家庭电路中各用电器是并联的。\nA. 错误，并联的用电器越多，相当于横截面积越大，总电阻越小\nB. 错误，家庭电路的电压是220 V，保持不变\nC. 正确，并联电路中，各支路电压相等，总电流等于各支路电流之和。用电器越多，支路越多，总电流越大\nD. 错误，总功率P = UI，电压U不变，总电流I越大，总功率P越大\n故选C。"},{"id":"g3_physics_045_ex02","knowledge_id":"g3_physics_045","question":"填空题：我国家庭电路的电压是______ V；一个家庭中同时使用的用电器总功率不能超过电能表允许的最大总功率，若电能表上标有\"220V 10A\"的字样，则这个家庭电路的总功率不能超过______ W。","answer":"答案：220；2200\n解析：\n我国家庭电路的电压是220 V。\n电能表上的\"220V\"表示额定电压，\"10A\"表示允许通过的最大电流。\n最大总功率 P最大 = UI最大 = 220 V × 10 A = 2200 W\n即同时使用的用电器总功率不能超过2200 W，否则电流过大，可能烧坏电能表或保险丝。"},{"id":"g3_physics_045_ex03","knowledge_id":"g3_physics_045","question":"选择题：在家庭电路中，以下哪种情况不会造成电流过大（  ）\nA. 发生短路\nB. 用电器总功率过大\nC. 开关短路\nD. 同时使用多个大功率用电器","answer":"答案：C\n解析：\n家庭电路中电流过大的原因有两个：短路和总功率过大。\nA. 短路时，电阻极小，电流极大，会造成电流过大\nB. 用电器总功率过大，由 P = UI 得 I = P/U，电压不变，功率越大，电流越大\nC. 开关短路只是开关失去控制作用，用电器仍然正常工作，不会造成电流过大\nD. 同时使用多个大功率用电器，总功率过大，会造成电流过大\n故选C。"},{"id":"g3_physics_045_ex04","knowledge_id":"g3_physics_045","question":"判断题：家庭电路中，保险丝熔断了，一定是发生了短路。","answer":"答案：错误\n解析：\n保险丝熔断的原因是电路中电流过大。而电流过大的原因有两个：\n（1）发生短路：火线和零线直接连通，电阻极小，电流极大；\n（2）用电器总功率过大：同时工作的用电器太多或功率太大，由 I = P/U 可知电流过大。\n所以保险丝熔断，可能是短路，也可能是总功率过大，不一定是短路。"},{"id":"g3_physics_045_ex05","knowledge_id":"g3_physics_045","question":"解答题：小明家的电能表上标有\"220V 10(20)A 50Hz 3000r/kW·h\"的字样。求：（1）这个家庭电路中同时使用的用电器总功率不能超过多少？（2）小明家已有用电器的总功率为1500 W，能否再使用一个额定功率为1000 W的电热水器？（3）若所有用电器同时正常工作，1分钟内电能表转盘转多少转？","answer":"答案：（1）4400 W；（2）能；（3）125转\n解析：\n（1）电能表上的\"10(20)A\"表示：额定电流10 A，最大电流20 A\n   允许的最大总功率：P最大 = UI最大 = 220 V × 20 A = 4400 W\n   （注意：有时也用额定电流计算 P = 220 × 10 = 2200 W，但一般指最大电流）\n（2）现有总功率1500 W，加上1000 W后：\n   P总 = 1500 W + 1000 W = 2500 W\n   因为 2500 W < 4400 W，所以能使用。\n（3）所有用电器总功率 P = 2500 W = 2.5 kW\n   工作时间 t = 1 min = 1/60 h\n   消耗电能 W = Pt = 2.5 kW × 1/60 h = 2.5/60 kW·h = 1/24 kW·h\n   转盘转数 n = W × N = (1/24) kW·h × 3000 r/kW·h = 3000/24 = 125 r\n   （或 W = Pt = 2500 W × 60 s = 150000 J = 150000/(3.6×10⁶) kW·h = 1/24 kW·h，结果一样）"},{"id":"g3_physics_045_ex06","knowledge_id":"g3_physics_045","question":"选择题：关于家庭电路，下列说法正确的是（  ）\nA. 家庭电路中的用电器都是串联的\nB. 家庭电路中，保险丝越粗越好\nC. 控制电灯的开关应接在火线上\nD. 使用测电笔时，手不能接触笔尾金属体","answer":"答案：C\n解析：\nA. 错误，家庭电路中的用电器都是并联的，这样各用电器可以独立工作、互不影响，且电压都是220 V\nB. 错误，保险丝要选择合适的规格，太粗了起不到保护作用，太细了容易经常断电\nC. 正确，控制电灯的开关应接在火线上，这样断开开关时，电灯不带电，更安全\nD. 错误，使用测电笔时，手必须接触笔尾金属体，这样才能形成回路，使氖管发光\n故选C。"},{"id":"g3_physics_045_ex07","knowledge_id":"g3_physics_045","question":"填空题：某家庭中有\"220V 40W\"的日光灯5盏，\"220V 100W\"的电视机一台，\"220V 150W\"的电冰箱一台，\"220V 700W\"的电饭锅一个。这些用电器的连接方式是______联的；它们同时正常工作时，电路中的总电流是______ A（结果保留一位小数）。","answer":"答案：并；5.2\n解析：\n家庭电路中的用电器都是并联的，这样各用电器可以独立工作、互不影响。\n先计算总功率：\n日光灯总功率：P1 = 5 × 40 W = 200 W\n电视机：P2 = 100 W\n电冰箱：P3 = 150 W\n电饭锅：P4 = 700 W\n总功率 P总 = P1 + P2 + P3 + P4 = 200 + 100 + 150 + 700 = 1150 W\n由 P = UI 得总电流：\nI总 = P总/U = 1150 W / 220 V ≈ 5.2 A"},{"id":"g3_physics_045_ex08","knowledge_id":"g3_physics_045","question":"判断题：三孔插座中，有一个孔是接地的，三脚插头中较长的脚与用电器的金属外壳相连。","answer":"答案：正确\n解析：\n三孔插座的接法是：左零右火上接地。\n三脚插头中，较长的那个脚（上面的）与用电器的金属外壳相连，插入插座后，金属外壳就与大地相连了。\n这样，如果用电器漏电，使金属外壳带电，电流会通过接地线流入大地，不会对人造成伤害，起到保护作用。\n三脚插头的脚稍长一些，是为了插入时先接通地线，拔出时后断开地线，更安全。"},{"id":"g3_physics_045_ex09","knowledge_id":"g3_physics_045","question":"选择题：某同学家的保险丝经常熔断，其原因可能是（  ）\nA. 保险丝的额定电流太大\nB. 用电器的总功率过大\nC. 保险丝太粗\nD. 电路中出现断路","answer":"答案：B\n解析：\n保险丝熔断是因为电流过大。\nA. 保险丝额定电流太大，不容易熔断，不会经常熔断\nB. 用电器总功率过大，由 I = P/U 可知电流过大，会导致保险丝经常熔断\nC. 保险丝太粗，额定电流大，不容易熔断\nD. 电路中断路，没有电流，保险丝不会熔断\n故选B。"},{"id":"g3_physics_045_ex10","knowledge_id":"g3_physics_045","question":"解答题：某家庭电路中，电能表的参数是\"220V 15A 3000r/kW·h\"。请回答：（1）该家庭最多能接多大总功率的用电器？（2）若家中只有一个电热水壶在工作，电能表转盘3分钟转了150转，求电热水壶的实际功率；（3）若电热水壶的额定电压为220 V，额定功率为1000 W，通过计算说明此时电热水壶是否正常工作，实际电压比额定电压高还是低？","answer":"答案：（1）3300 W；（2）1000 W；（3）正常工作，实际电压等于额定电压\n解析：\n（1）最大总功率：P最大 = UI最大 = 220 V × 15 A = 3300 W\n（2）电热水壶3分钟消耗的电能：\n   W = n/N = 150 r / 3000 r/kW·h = 0.05 kW·h\n   工作时间：t = 3 min = 0.05 h\n   实际功率：P实 = W/t = 0.05 kW·h / 0.05 h = 1 kW = 1000 W\n   （或 W = 0.05 × 3.6×10⁶ J = 1.8×10⁵ J，t = 180 s，P = W/t = 1.8×10⁵/180 = 1000 W）\n（3）因为 P实 = 1000 W = P额，所以电热水壶正常工作，实际电压等于额定电压220 V。\n   （如果实际功率大于额定功率，则实际电压高于额定电压；如果实际功率小于额定功率，则实际电压低于额定电压。）"},{"id":"g3_physics_046_ex01","knowledge_id":"g3_physics_046","question":"选择题：在家庭电路中，电能表应该安装在什么位置？\nA. 总开关之后\nB. 总开关之前，进户线之后\nC. 保险丝之后\nD. 插座之后","answer":"答案：B\n解析：电能表是测量用户在一段时间内消耗电能多少的仪表，必须安装在家庭电路的最前端（进户线之后，总开关之前），这样才能测量整个家庭电路消耗的电能。如果安装在总开关或保险丝之后，就无法准确测量全部电能消耗。"},{"id":"g3_physics_046_ex02","knowledge_id":"g3_physics_046","question":"填空题：家庭电路的两条进户线中，一条叫做______，另一条叫做______，它们之间的电压是______V。三孔插座的接法是：左______右______上接______。","answer":"答案：火线，零线，220，零，火，地\n解析：家庭电路的进户线有两条：火线和零线。火线与零线之间的电压是220 V。三孔插座的正确接法是\"左零右火上接地\"，即左边孔接零线，右边孔接火线，上边孔接地线，这样可以防止用电器金属外壳漏电时发生触电事故。"},{"id":"g3_physics_046_ex03","knowledge_id":"g3_physics_046","question":"选择题：关于家庭电路中开关和灯泡的连接，下列说法正确的是\nA. 开关应该接在零线上\nB. 开关应该接在火线上\nC. 开关接在火线或零线上都可以\nD. 灯泡的螺旋套应该接火线","answer":"答案：B\n解析：在家庭电路中，开关必须接在火线上。这样当开关断开时，灯泡与火线断开连接，人接触灯泡时不会触电，更安全。灯泡的顶端金属点接火线，螺旋套接零线，这样更换灯泡时更安全。"},{"id":"g3_physics_046_ex04","knowledge_id":"g3_physics_046","question":"判断题：家庭电路中的各用电器之间是串联连接的。（  ）","answer":"答案：错误\n解析：家庭电路中的各用电器之间是并联连接的。并联的好处是：各用电器两端电压都等于电源电压220 V，都能正常工作；各用电器可以独立工作，互不影响，一个用电器坏了，其他用电器仍能正常工作。如果是串联，一个用电器不工作，其他都不能工作，且电压分配不合理。"},{"id":"g3_physics_046_ex05","knowledge_id":"g3_physics_046","question":"选择题：小明家的三孔插座，其中接地线的那个孔应该\nA. 接零线\nB. 接火线\nC. 与大地相连\nD. 与用电器外壳相连","answer":"答案：C\n解析：三孔插座的上孔是接地线的，这个孔要与大地相连。当有金属外壳的用电器插入三孔插座时，用电器的金属外壳通过三脚插头的上脚与大地相连。万一用电器漏电使外壳带电，电流会通过地线流入大地，不会对人体造成伤害，起到保护作用。"},{"id":"g3_physics_046_ex06","knowledge_id":"g3_physics_046","question":"填空题：家庭电路中，保险丝（或空气开关）的作用是当电路中电流过大时，自动______电路，起到保护作用。保险丝应该______联在______线上。","answer":"答案：切断（断开），串，火\n解析：保险丝的作用是当电路中电流过大时，由于电流的热效应，保险丝温度升高达到熔点而熔断，自动切断电路，保护用电器和电路安全。保险丝应该串联在火线上，这样保险丝熔断后，后面的电路与火线断开，更安全。"},{"id":"g3_physics_046_ex07","knowledge_id":"g3_physics_046","question":"解答题：某同学安装家庭电路时，将开关接在了零线上，灯泡仍然能发光。请分析这样做有什么安全隐患，并说明正确的接法应该是怎样的。","answer":"答案：有安全隐患，开关接在零线上时，断开开关后灯泡仍然与火线相连，人接触灯泡时可能触电。正确接法是开关接火线。\n解析：开关接在零线上的安全隐患：\n1. 断开开关后，灯泡虽然不发光，但灯泡仍然与火线相连，灯泡两端带电\n2. 此时如果人接触灯泡的金属部分（如更换灯泡时），电流会通过人体流入大地，造成触电事故\n\n正确接法：\n1. 开关应该接在火线上\n2. 开关一端接火线，另一端接灯泡顶端的金属点\n3. 灯泡的螺旋套接零线\n\n这样断开开关后，灯泡与火线断开，人接触灯泡就不会触电，更安全。"},{"id":"g3_physics_046_ex08","knowledge_id":"g3_physics_046","question":"选择题：下列关于家庭电路组成的说法，错误的是\nA. 进户线包括火线和零线两根线\nB. 电能表用来测量消耗的电能\nC. 保险丝可以用铜丝代替\nD. 各用电器之间是并联的","answer":"答案：C\n解析：保险丝不能用铜丝代替。保险丝是由电阻率大、熔点低的铅锑合金制成的，当电流过大时能自动熔断。铜丝的熔点高、电阻率小，电流过大时不容易熔断，起不到保护电路的作用，可能导致用电器烧坏甚至引发火灾。其他选项都是正确的。"},{"id":"g3_physics_046_ex09","knowledge_id":"g3_physics_046","question":"填空题：使用试电笔时，手必须接触笔尾的______，笔尖接触导线，如果氖管发光，说明接触的是______线；如果氖管不发光，说明接触的是______线。","answer":"答案：金属体（金属帽），火，零\n解析：试电笔是辨别火线和零线的工具。使用时，手必须接触笔尾的金属体（或金属帽），这样人体、试电笔和大地才能形成通路。笔尖接触火线时，有微弱电流通过试电笔和人体，氖管发光；接触零线时，零线与大地之间电压为0，没有电流，氖管不发光。注意：使用试电笔时手不能接触笔尖金属体。"},{"id":"g3_physics_046_ex10","knowledge_id":"g3_physics_046","question":"判断题：家庭电路中，同时工作的用电器越多，总电阻越大。（  ）","answer":"答案：错误\n解析：家庭电路中各用电器是并联的。并联电路的总电阻特点是：并联的用电器越多，总电阻越小，且总电阻比任何一个支路的电阻都小。这是因为并联相当于增大了导体的横截面积，横截面积越大，电阻越小。同时工作的用电器越多，总功率越大，总电流也越大，这是因为总电阻变小了（I=U/R，U不变，R变小，I变大）。"},{"id":"g3_physics_047_ex01","knowledge_id":"g3_physics_047","question":"选择题：家庭电路中电流过大的原因是\nA. 只有短路\nB. 只有用电器总功率过大\nC. 短路和用电器总功率过大\nD. 用电器电阻太大","answer":"答案：C\n解析：家庭电路中电流过大的原因有两个：一是短路，即火线和零线直接相连，此时电路中电阻很小，根据欧姆定律I=U/R，电压U不变（220 V），电阻R很小，所以电流I很大；二是用电器总功率过大，根据公式I=P总/U，电压U不变，总功率P总越大，电流I越大。这两种情况都会导致电流过大，可能烧坏用电器甚至引发火灾。"},{"id":"g3_physics_047_ex02","knowledge_id":"g3_physics_047","question":"填空题：小明家的电能表上标有\"220 V 10 A\"的字样，那么他家同时使用的用电器总功率不能超过______W。如果他家已有用电器总功率是1500 W，最多还能再接入______W的用电器。","answer":"答案：2200，700\n解析：电能表上的\"220 V 10 A\"表示额定电压220 V，允许通过的最大电流是10 A。根据公式P=UI，最大总功率P最大=220 V×10 A=2200 W。已有用电器总功率1500 W，所以还能接入的用电器功率为2200 W-1500 W=700 W。超过这个值，电路中电流就会过大，可能烧坏电能表或保险丝。"},{"id":"g3_physics_047_ex03","knowledge_id":"g3_physics_047","question":"选择题：某同学家的保险丝经常熔断，可能的原因是\nA. 电路中某处短路\nB. 同时使用的用电器总功率过大\nC. 保险丝的额定电流太小\nD. 以上都有可能","answer":"答案：D\n解析：保险丝熔断是因为电路中电流过大，超过了保险丝的额定电流。导致电流过大的原因有：电路中某处短路（电阻极小，电流极大）；同时使用的用电器总功率过大（P总过大，I=P总/U过大）。另外，如果保险丝的额定电流选得太小，即使电路正常工作的电流也超过了它的额定电流，也会频繁熔断。所以三种情况都有可能。"},{"id":"g3_physics_047_ex04","knowledge_id":"g3_physics_047","question":"判断题：发现保险丝熔断后，可以用铜丝代替保险丝接上，这样更耐用。（  ）","answer":"答案：错误\n解析：保险丝是用电阻率大、熔点低的铅锑合金制成的，当电流过大时，由于电流的热效应，保险丝温度升高达到熔点而熔断，自动切断电路，起到保护作用。铜丝的电阻率小、熔点高，在电流过大时不容易熔断，起不到保护电路的作用，可能会烧坏用电器甚至引发火灾。所以绝对不能用铜丝或铁丝代替保险丝。"},{"id":"g3_physics_047_ex05","knowledge_id":"g3_physics_047","question":"选择题：某家庭电路中有一台1000 W的空调、一台200 W的电冰箱、一台800 W的电饭锅、4盏40 W的日光灯。如果这些用电器同时工作，总功率是多少？电路中的总电流是多少？（计算结果保留一位小数）\nA. 2160 W，9.8 A\nB. 2000 W，9.1 A\nC. 2160 W，10.0 A\nD. 2000 W，8.9 A","answer":"答案：A\n解析：总功率是各用电器功率之和：\nP总 = 1000 W + 200 W + 800 W + 4×40 W = 1000 + 200 + 800 + 160 = 2160 W\n\n根据公式P=UI，总电流I = P总/U = 2160 W / 220 V ≈ 9.8 A\n\n所以总功率是2160 W，总电流约为9.8 A。"},{"id":"g3_physics_047_ex06","knowledge_id":"g3_physics_047","question":"填空题：短路是指火线和零线不经过______而直接连通的现象。短路时电路中______很小，根据欧姆定律，电流会______，可能烧坏电源和导线，甚至引起火灾。","answer":"答案：用电器，电阻，很大（过大）\n解析：短路是家庭电路中非常危险的故障，指火线和零线不经过用电器而直接连在一起。由于导线的电阻很小，根据欧姆定律I=U/R，电压U=220 V不变，电阻R很小，所以电流I会非常大。巨大的电流会在短时间内产生大量的热，使导线温度急剧升高，可能烧坏电源、导线绝缘层，甚至引发火灾。"},{"id":"g3_physics_047_ex07","knowledge_id":"g3_physics_047","question":"解答题：小明家的电能表上标有\"220 V 10 A\"的字样。家中有：1500 W的电热水器一台、200 W的冰箱一台、100 W的电视机一台、800 W的电饭锅一个、25 W的照明灯4盏。请通过计算回答：（1）这些用电器能不能同时使用？（2）如果电热水器必须使用，最多还能同时使用多大功率的用电器？请写出两种具体的组合方案。","answer":"答案：（1）不能同时使用，因为总功率超过电能表允许的最大功率；（2）电热水器必须使用时，最多还能同时使用700 W的用电器。\n解析：\n（1）计算电能表允许的最大功率：\nP最大 = UI = 220 V × 10 A = 2200 W\n\n计算所有用电器的总功率：\nP总 = 1500 + 200 + 100 + 800 + 4×25\n     = 1500 + 200 + 100 + 800 + 100\n     = 2700 W\n\n因为 2700 W > 2200 W，所以这些用电器不能同时使用。\n\n（2）电热水器功率为1500 W，电能表允许的最大功率为2200 W，\n所以还能使用的功率为：\nP剩 = P最大 - P热水器 = 2200 W - 1500 W = 700 W\n\n组合方案（总功率≤700 W即可）：\n方案一：冰箱(200W) + 电视机(100W) + 4盏灯(100W) = 400 W（400 W < 700 W，可行）\n方案二：冰箱(200W) + 4盏灯(100W) = 300 W（300 W < 700 W，可行）\n方案三：电视机(100W) + 4盏灯(100W) + 冰箱(200W) = 400 W（可行）\n\n注意：电饭锅功率800 W > 700 W，所以电饭锅不能与电热水器同时使用。"},{"id":"g3_physics_047_ex08","knowledge_id":"g3_physics_047","question":"选择题：关于家庭电路中电流过大的原因，下列说法正确的是\nA. 接入的用电器越多，电流一定越大\nB. 开关闭合的越多，电流一定越大\nC. 短路会导致电流过大，是非常危险的\nD. 灯泡的灯丝断了再搭上使用，会导致电流过小","answer":"答案：C\n解析：A和B选项错误，因为家庭电路中用电器是并联的，如果只是开关闭合但用电器不工作（如灯泡坏了），不会增加电流。只有接入的工作用电器总功率越大，电流才越大。C选项正确，短路时电阻极小，电流极大，会烧坏导线甚至引发火灾，非常危险。D选项错误，灯丝断了再搭上，灯丝长度变短，电阻变小，根据P=U²/R，电压不变，电阻变小，功率变大，电流也变大。"},{"id":"g3_physics_047_ex09","knowledge_id":"g3_physics_047","question":"填空题：新建楼房的供电线路已经不再使用保险丝，而用带有保险装置的______代替。当电路中的电流过大时，它会自动______，俗称跳闸，切断电路，起到保护作用。它的原理是利用电流的______效应。","answer":"答案：空气开关（断路器），断开（跳闸），磁\n解析：空气开关（也叫断路器）是现代家庭电路中常用的保护装置，代替了传统的保险丝。它的优点是：断开后可以手动复位，不需要更换，使用方便。当电路中电流过大时（短路或总功率过大），空气开关会自动断开，俗称\"跳闸\"。与保险丝利用电流的热效应不同，空气开关主要利用电流的磁效应（电磁铁）来工作，当电流过大时，电磁铁产生足够大的磁性，吸引衔铁，使开关断开。"},{"id":"g3_physics_047_ex10","knowledge_id":"g3_physics_047","question":"判断题：保险丝越粗越好，越不容易熔断，更安全。（  ）","answer":"答案：错误\n解析：保险丝不是越粗越好，也不是越不容易熔断就越安全。保险丝的选择原则是：保险丝的额定电流等于或稍大于电路中正常工作的最大电流。如果保险丝太粗（额定电流太大），即使电路中电流过大（比如短路），它也不会熔断，就起不到保护电路的作用，反而更危险。当然，保险丝也不能太细，额定电流太小，正常工作时就会熔断，影响正常用电。所以要选择合适规格的保险丝。"},{"id":"g3_physics_048_ex01","knowledge_id":"g3_physics_048","question":"选择题：关于安全用电，下列说法正确的是\nA. 对人体的安全电压是36 V\nB. 家庭电路中的触电事故都是人体直接或间接与火线相连造成的\nC. 只要不接触高压带电体就不会触电\nD. 用湿手扳开关不会触电","answer":"答案：B\n解析：A选项错误，对人体的安全电压是不高于36 V，而不是等于36 V。B选项正确，家庭电路中的触电事故都是人体直接或间接与火线相连，使电流通过人体造成的。C选项错误，安全用电原则是\"不接触低压带电体，不靠近高压带电体\"，靠近高压带电体也可能发生电弧触电或跨步电压触电。D选项错误，湿手的电阻变小，而且水是导体，用湿手扳开关容易触电。"},{"id":"g3_physics_048_ex02","knowledge_id":"g3_physics_048","question":"填空题：安全用电的原则是：不接触______带电体，不靠近______带电体。对人体安全的电压是______。发现有人触电时，应先______，再救人。","answer":"答案：低压，高压，不高于36 V，切断电源（断开开关）\n解析：安全用电的基本原则是：不接触低压带电体，不靠近高压带电体。家庭电路电压220 V远高于安全电压，属于低压带电体，不能直接接触；高压带电体即使不接触，靠近时也可能发生电弧触电，所以不能靠近。对人体的安全电压是不高于36 V，即等于或低于36 V的电压对人体才是安全的。发现有人触电时，必须先切断电源或用干燥的绝缘体将电线挑开，使触电者脱离电源，然后再进行施救。"},{"id":"g3_physics_048_ex03","knowledge_id":"g3_physics_048","question":"选择题：下列做法中，符合安全用电要求的是\nA. 用湿抹布擦正在发光的灯泡\nB. 发现有人触电，立即用手把人拉开\nC. 保险丝熔断后，用铜丝代替\nD. 有金属外壳的用电器使用三脚插头","answer":"答案：D\n解析：A选项错误，湿抹布是导体，用湿抹布擦正在发光的灯泡，容易触电。B选项错误，发现有人触电，不能直接用手把人拉开，因为人是导体，施救者也会触电，应该先切断电源。C选项错误，铜丝熔点高、电阻小，电流过大时不容易熔断，起不到保护作用，不能用铜丝代替保险丝。D选项正确，有金属外壳的用电器使用三脚插头，这样金属外壳可以接地，万一用电器漏电，电流会通过地线流入大地，防止触电事故。"},{"id":"g3_physics_048_ex04","knowledge_id":"g3_physics_048","question":"判断题：打雷下雨时，可以在大树下避雨。（  ）","answer":"答案：错误\n解析：打雷下雨时，不能在大树下避雨。因为大树比较高，容易被雷电击中，而且大树被淋湿后变成导体，电流会通过大树流入地下。如果人在大树下避雨，雷电可能通过人体造成触电，非常危险。正确的做法是：打雷时尽量待在室内，关好门窗；如果在室外，要远离高大建筑物、大树、电线杆等，找低洼处蹲下，双脚并拢。"},{"id":"g3_physics_048_ex05","knowledge_id":"g3_physics_048","question":"选择题：小明家的洗衣机使用三脚插头，但是家中插座只有两孔的。于是他将三脚插头的接地脚掰弯，插入两孔插座中使用。这样做会有什么后果？\nA. 洗衣机不能正常工作\nB. 洗衣机消耗的电能会增多\nC. 洗衣机的功率会变大\nD. 洗衣机外壳漏电时人会触电","answer":"答案：D\n解析：三脚插头的接地脚是与用电器的金属外壳相连的，插入三孔插座后，金属外壳就与大地相连。万一用电器内部漏电，使外壳带电，电流会通过地线流入大地，不会对人体造成伤害。如果掰弯接地脚插入两孔插座，金属外壳没有接地，一旦漏电，人接触外壳时电流就会通过人体，造成触电事故。A、B、C选项错误，掰弯接地脚不影响用电器正常工作，功率和电能消耗也不会改变。"},{"id":"g3_physics_048_ex06","knowledge_id":"g3_physics_048","question":"填空题：家庭电路中的触电类型主要有两种：一种是______触电，即人站在地上，手接触______线，电流通过人体流入大地；另一种是______触电，即人同时接触______线和______线，电流通过人体。","answer":"答案：单线，火，双线，火，零\n解析：家庭电路中常见的触电类型有两种：\n1. 单线触电：人站在地面上，一只手接触火线，电流通过人体流入大地，形成回路，造成触电。这是最常见的触电方式。\n2. 双线触电：人同时接触火线和零线，电流从火线经过人体流回零线，形成回路，造成触电。这种情况下即使人站在绝缘物体上，也会触电。\n两种触电都是因为有电流通过人体，且电流达到一定大小才会造成伤害。"},{"id":"g3_physics_048_ex07","knowledge_id":"g3_physics_048","question":"解答题：暑假的一天，小明在家写作业时，突然发现客厅的电灯不亮了。他想检查一下灯泡是不是坏了，于是他搬来椅子站上去，准备拧下灯泡。他的妈妈看见了，赶紧制止了他。请你分析：小明这样做有什么危险？正确的做法应该是怎样的？","answer":"答案：小明这样做有触电的危险。正确做法是先断开开关，切断电源，再更换灯泡。\n解析：\n小明做法的危险之处：\n1. 电灯不亮不一定是灯泡坏了，也可能是开关没有断开，灯泡与火线仍然相连\n2. 即使开关断开了，如果开关接在了零线上，灯泡也可能与火线相连\n3. 小明站在椅子上，如果手接触到灯泡的金属部分，而身体其他部位不小心碰到墙壁或其他导体，电流就会通过人体流入大地，造成触电\n\n正确的做法：\n1. 先断开控制电灯的开关，切断电源\n2. 如果不确定开关是否接在火线上，可以先断开总开关\n3. 等灯泡冷却后（防止烫伤），再拧下灯泡进行检查或更换\n4. 更换时手最好不要接触灯泡的金属部分，更不要接触灯座内部的金属片"},{"id":"g3_physics_048_ex08","knowledge_id":"g3_physics_048","question":"选择题：下列关于安全用电的说法中，错误的是\nA. 更换灯泡前应断开电源开关\nB. 不弄湿用电器，不损坏绝缘层\nC. 可以在电线上晾晒衣服\nD. 保险装置、插座、导线等达到使用寿命应及时更换","answer":"答案：C\n解析：A选项正确，更换灯泡前断开电源开关，可以防止触电。B选项正确，弄湿用电器或损坏绝缘层，都容易导致漏电，造成触电。C选项错误，绝对不能在电线上晾晒衣服。因为湿衣服是导体，电线如果绝缘层破损，人接触湿衣服就会触电；另外，衣服的重量还可能把电线拉断，造成危险。D选项正确，保险装置、插座、导线等都有使用寿命，老化后绝缘性能下降，容易发生漏电或短路，应及时更换。"},{"id":"g3_physics_048_ex09","knowledge_id":"g3_physics_048","question":"填空题：如果发现有人触电，应该立即采取的措施是：首先______，或者用干燥的______等绝缘体将电线挑开，使触电者尽快脱离电源。如果触电者呼吸停止，应该立即进行______。千万不能直接用______去拉触电的人。","answer":"答案：切断电源（断开开关），木棒（竹竿、塑料棒等），人工呼吸（心肺复苏），手\n解析：发现有人触电时，正确的急救步骤是：\n1. 立即切断电源（断开开关或拔掉插头），这是最安全的方法\n2. 如果找不到开关或距离太远，可以用干燥的木棒、竹竿、塑料棒等绝缘体将电线挑开，使触电者脱离电源\n3. 触电者脱离电源后，如果呼吸停止，应立即进行人工呼吸和胸外心脏按压（心肺复苏），同时拨打120急救电话\n4. 绝对不能直接用手去拉触电的人，因为人体是导体，施救者也会触电，造成更大的伤害"},{"id":"g3_physics_048_ex10","knowledge_id":"g3_physics_048","question":"判断题：只要站在干燥的木凳上，人就绝对不会触电。（  ）","answer":"答案：错误\n解析：站在干燥的木凳上，虽然与大地绝缘，但如果人同时接触火线和零线，电流会从火线经过人体流回零线，形成双线触电，仍然会触电。另外，如果木凳潮湿，绝缘性能下降，或者身体其他部位接触到墙壁、其他导体，也可能触电。所以即使站在绝缘物体上，也不能同时接触火线和零线，更不能接触火线。安全用电的根本原则是不要接触带电体。"},{"id":"g3_physics_049_ex01","knowledge_id":"g3_physics_049","question":"选择题：关于磁体和磁极，下列说法正确的是\nA. 磁体之间只有相互接触时才能产生力的作用\nB. 一个磁体可以只有一个磁极\nC. 同名磁极相互吸引，异名磁极相互排斥\nD. 磁体上磁性最强的部分叫做磁极","answer":"答案：D\n解析：A选项错误，磁体之间不接触也能产生力的作用，因为磁体周围存在磁场，磁场可以传递磁力。B选项错误，任何磁体都有两个磁极，即N极和S极，即使把磁体分成几段，每一段仍然有两个磁极，不存在只有一个磁极的磁体。C选项错误，正确的说法是：同名磁极相互排斥，异名磁极相互吸引。D选项正确，磁体上磁性最强的部分叫做磁极，磁体两端的磁性最强，中间最弱。"},{"id":"g3_physics_049_ex02","knowledge_id":"g3_physics_049","question":"填空题：磁体上磁性最强的部分叫做______。可以自由转动的磁体，静止时指南的那个磁极叫做______极，又叫______极；指北的那个磁极叫做______极，又叫______极。同名磁极相互______，异名磁极相互______。","answer":"答案：磁极，南，S，北，N，排斥，吸引\n解析：磁体上磁性最强的部分叫做磁极，每个磁体都有两个磁极。把条形磁体悬挂起来，让它可以自由转动，静止时总是一端指南，一端指北。指南的那个磁极叫做南极，又叫S极；指北的那个磁极叫做北极，又叫N极。磁极间的相互作用规律是：同名磁极相互排斥，异名磁极相互吸引。这是磁体的基本性质之一。"},{"id":"g3_physics_049_ex03","knowledge_id":"g3_physics_049","question":"选择题：关于磁场和磁感线，下列说法正确的是\nA. 磁场是人们假想的，实际并不存在\nB. 磁感线是磁场中真实存在的曲线\nC. 在磁体外部，磁感线都是从磁体的N极出发，回到S极\nD. 磁感线越密的地方，磁场越弱","answer":"答案：C\n解析：A选项错误，磁场是真实存在的一种物质，虽然看不见、摸不着，但它能对放入其中的磁体产生磁力的作用，我们可以通过它的作用来认识它。B选项错误，磁感线是为了形象描述磁场而假想的曲线，实际并不存在。C选项正确，在磁体外部，磁感线都是从N极出发，回到S极；在磁体内部，磁感线从S极到N极。D选项错误，磁感线的疏密表示磁场的强弱，磁感线越密的地方，磁场越强；磁感线越疏的地方，磁场越弱。"},{"id":"g3_physics_049_ex04","knowledge_id":"g3_physics_049","question":"判断题：指南针能指南北，是因为地球本身是一个巨大的磁体。（  ）","answer":"答案：正确\n解析：地球本身就是一个巨大的磁体，地球周围存在着地磁场。地磁的北极在地理的南极附近，地磁的南极在地理的北极附近。根据异名磁极相互吸引的原理，指南针的N极会指向地磁的南极，也就是地理的北极附近；指南针的S极会指向地磁的北极，也就是地理的南极附近。所以指南针能指南北，就是因为受到地磁场的作用。不过地磁的两极与地理的两极并不完全重合，存在磁偏角。"},{"id":"g3_physics_049_ex05","knowledge_id":"g3_physics_049","question":"选择题：将一根条形磁体从中间锯断，得到的两段磁体是\nA. 一段只有N极，另一段只有S极\nB. 两段都没有磁性\nC. 两段各有一个N极和一个S极\nD. 两段都有两个N极","answer":"答案：C\n解析：任何磁体都有两个磁极，即N极和S极。把一根条形磁体从中间锯断，得到的不是两个单磁极，而是两段各有N极和S极的小磁体。也就是说，无论把磁体分成多少段，每一段都是一个完整的磁体，都有两个磁极。这是磁体的一个重要性质，目前还没有发现只有一个磁极的磁体（磁单极子）。所以C选项正确。"},{"id":"g3_physics_049_ex06","knowledge_id":"g3_physics_049","question":"填空题：一些物体在磁体或电流的作用下获得磁性的现象叫做______。钢棒被磁化后，磁性能够长期保持，叫做______磁体；铁棒被磁化后，磁性容易消失，叫做______磁体。磁体周围存在着一种看不见、摸不着的特殊物质，叫做______。","answer":"答案：磁化，硬（永久），软（暂时），磁场\n解析：磁化是指使原来没有磁性的物体获得磁性的过程。不同的物体磁化后保持磁性的能力不同：钢等硬磁性材料磁化后，磁性能够长期保持，叫做硬磁体或永磁体；铁等软磁性材料磁化后，磁性容易消失，叫做软磁体或暂时磁体。磁体周围存在着磁场，磁场是一种特殊的物质，它虽然看不见、摸不着，但真实存在，其基本性质是对放入其中的磁体产生磁力的作用。"},{"id":"g3_physics_049_ex07","knowledge_id":"g3_physics_049","question":"解答题：小明在做实验时，将一根条形磁体靠近一堆大头针，发现磁体两端吸引的大头针多，中间吸引的大头针少，甚至几乎不吸引。请解释这个现象，并说明大头针被吸引后为什么会\"挂\"在磁体上，而且下端会张开。","answer":"答案：因为磁体两端磁性最强，中间最弱；大头针被磁化后，下端是同名磁极，相互排斥而张开。\n解析：\n（1）磁体上磁性强弱分布不均匀：\n磁体两端（磁极）的磁性最强，中间的磁性最弱。所以磁体两端吸引的大头针数量多，中间吸引的少甚至不吸引。这说明磁极是磁体上磁性最强的部分。\n\n（2）大头针\"挂\"在磁体上的原因：\n大头针本身没有磁性，但当它接触磁体后，会被磁化，获得磁性。靠近磁体的一端被磁化为异名磁极，由于异名磁极相互吸引，所以大头针会被\"挂\"在磁体上。\n\n（3）大头针下端张开的原因：\n每根大头针被磁化后，下端的磁极都是相同的（都与磁体接触端的磁极同名）。根据同名磁极相互排斥的原理，这些大头针的下端因为相互排斥而张开，呈现出放射状。"},{"id":"g3_physics_049_ex08","knowledge_id":"g3_physics_049","question":"选择题：关于地磁场，下列说法错误的是\nA. 地球本身是一个巨大的磁体\nB. 地磁的北极在地理的北极附近\nC. 地磁场的磁感线从地磁北极出发回到地磁南极\nD. 地理的两极和地磁的两极并不重合","answer":"答案：B\n解析：A选项正确，地球本身是一个巨大的磁体，地球周围存在着地磁场。B选项错误，地磁的北极在地理的南极附近，地磁的南极在地理的北极附近，要注意区分。C选项正确，地磁场的磁感线和其他磁体一样，在外部从N极（地磁北极）出发，回到S极（地磁南极）。D选项正确，地理的两极和地磁的两极并不完全重合，它们之间存在一个夹角，叫做磁偏角，这是我国宋代学者沈括最早发现的。"},{"id":"g3_physics_049_ex09","knowledge_id":"g3_physics_049","question":"填空题：磁场的基本性质是对放入其中的______产生______的作用。磁场是有方向的，人们规定：在磁场中的某一点，小磁针静止时______极所指的方向就是该点的磁场方向。为了形象地描述磁场，我们引入了______线。","answer":"答案：磁体，磁力，N（北），磁感\n解析：磁场的基本性质是对放入其中的磁体产生磁力的作用。虽然磁场看不见、摸不着，但我们可以通过它对磁体的作用来认识它，这是一种转换法。磁场是有方向的，在磁场中的不同位置，磁场方向一般不同。物理学中规定：在磁场中的某一点，小磁针静止时N极（北极）所指的方向就是该点的磁场方向。为了形象、直观地描述磁场，我们引入了磁感线，用磁感线的方向表示磁场方向，用磁感线的疏密表示磁场强弱。"},{"id":"g3_physics_049_ex10","knowledge_id":"g3_physics_049","question":"判断题：磁感线是从磁体的S极出发，回到N极。（  ）","answer":"答案：错误\n解析：磁感线的方向在磁体外部和内部是不同的。在磁体的外部，磁感线是从磁体的N极出发，回到S极；在磁体的内部，磁感线是从S极到N极。这样磁感线就形成了闭合的曲线。题目中没有说明是外部还是内部，笼统地说\"从S极出发，回到N极\"是错误的。在初中阶段，我们主要研究的是磁体外部的磁场，所以通常说磁感线从N极出发，回到S极。"},{"id":"g3_physics_050_ex01","knowledge_id":"g3_physics_050","question":"选择题：首先发现电流磁效应的科学家是\nA. 法拉第\nB. 奥斯特\nC. 安培\nD. 焦耳","answer":"答案：B\n解析：1820年，丹麦物理学家奥斯特首先通过实验发现了电流的磁效应，即电流周围存在磁场，也就是电生磁现象。这个发现揭示了电和磁之间的联系，具有重要的历史意义。法拉第发现了电磁感应现象（磁生电）；安培总结出了安培定则（右手螺旋定则）；焦耳发现了焦耳定律。所以正确答案是B。"},{"id":"g3_physics_050_ex02","knowledge_id":"g3_physics_050","question":"填空题：奥斯特实验表明：通电导线周围存在______，这就是电流的______效应。电流的磁场方向与______方向有关。通电螺线管外部的磁场与______磁体的磁场相似。","answer":"答案：磁场，磁，电流，条形\n解析：奥斯特实验是物理学史上一个非常重要的实验，它表明通电导线周围存在磁场，这种现象叫做电流的磁效应，也就是通常所说的\"电生磁\"。实验还发现，当电流方向改变时，小磁针的偏转方向也会改变，说明电流的磁场方向与电流方向有关。通电螺线管外部的磁场分布与条形磁体的磁场非常相似，两端相当于两个磁极，它的极性也与电流方向有关。"},{"id":"g3_physics_050_ex03","knowledge_id":"g3_physics_050","question":"选择题：关于通电螺线管，下列说法正确的是\nA. 通电螺线管的磁性强弱与电流大小无关\nB. 通电螺线管的极性与线圈匝数有关\nC. 用安培定则判断通电螺线管的极性时，大拇指指向的是S极\nD. 在通电螺线管中插入铁芯，磁性会增强","answer":"答案：D\n解析：A选项错误，通电螺线管的磁性强弱与电流大小有关，电流越大，磁性越强；还与线圈匝数有关，匝数越多，磁性越强。B选项错误，通电螺线管的极性与电流方向有关，与线圈匝数无关；匝数影响磁性强弱，不影响极性。C选项错误，用安培定则（右手螺旋定则）判断时，四指弯曲指向电流方向，大拇指所指的那端是N极，不是S极。D选项正确，在通电螺线管中插入铁芯，铁芯被磁化，磁性会大大增强，这就是电磁铁的原理。"},{"id":"g3_physics_050_ex04","knowledge_id":"g3_physics_050","question":"判断题：通电导线周围的磁场方向与电流方向无关。（  ）","answer":"答案：错误\n解析：通电导线周围的磁场方向与电流方向有关。奥斯特实验中，当电流方向改变时，小磁针的偏转方向也会改变，这说明电流的磁场方向随电流方向的改变而改变。对于通电直导线，可以用安培定则（右手螺旋定则）来判断磁场方向：右手握住导线，大拇指指向电流方向，四指弯曲的方向就是磁感线的环绕方向。对于通电螺线管，也可以用安培定则来判断磁极方向。所以磁场方向与电流方向密切相关。"},{"id":"g3_physics_050_ex05","knowledge_id":"g3_physics_050","question":"选择题：一个通电螺线管的N极和S极取决于\nA. 螺线管的匝数\nB. 螺线管中电流的方向\nC. 螺线管中有无铁芯\nD. 螺线管中电流的大小","answer":"答案：B\n解析：通电螺线管的N极和S极取决于螺线管中电流的方向。根据安培定则（右手螺旋定则），用右手握住螺线管，让四指弯曲指向电流的方向，那么大拇指所指的那端就是螺线管的N极。所以电流方向改变，螺线管的极性也会改变。A选项匝数影响磁性强弱，不影响极性；C选项有无铁芯也影响磁性强弱，不影响极性；D选项电流大小同样影响磁性强弱，不影响极性。"},{"id":"g3_physics_050_ex06","knowledge_id":"g3_physics_050","question":"填空题：安培定则（右手螺旋定则）：对于通电直导线，用______手握住导线，让伸直的大拇指所指的方向跟______方向一致，那么弯曲的四指所指的方向就是______的环绕方向。对于通电螺线管，用______手握住螺线管，让四指弯曲跟______方向一致，那么大拇指所指的那端就是螺线管的______极。","answer":"答案：右，电流，磁感线，右，电流，N（北）\n解析：安培定则，也叫右手螺旋定则，是判断电流产生的磁场方向的重要方法。对于通电直导线：右手握住导线，大拇指指向电流方向，四指弯曲的方向就是磁感线的环绕方向。对于通电螺线管：右手握住螺线管，四指弯曲指向电流的环绕方向（也就是电流从螺线管的哪端流入、哪端流出），大拇指所指的那端就是螺线管的N极。两种情况都是用右手，不要用左手。"},{"id":"g3_physics_050_ex07","knowledge_id":"g3_physics_050","question":"解答题：小明在探究\"通电螺线管的外部磁场\"实验中，在螺线管周围的不同位置放置了一些小磁针。请回答下列问题：（1）通电后，小磁针发生偏转，说明了什么？（2）小明发现改变电流方向，小磁针的偏转方向也改变了，这又说明了什么？（3）请说出两种可以增强通电螺线管磁性的方法。","answer":"答案：（1）说明通电螺线管周围存在磁场；（2）说明电流的磁场方向与电流方向有关；（3）增大电流、增加线圈匝数、插入铁芯（任选两种）。\n解析：\n（1）小磁针发生偏转，说明小磁针受到了磁力的作用，而磁力是通过磁场传递的，所以这说明通电螺线管周围存在磁场。这就是电流的磁效应，即电生磁。\n\n（2）改变电流方向，小磁针的偏转方向也改变，说明磁场的方向发生了改变。这表明电流的磁场方向与电流方向有关，电流方向改变，磁场方向也随之改变。\n\n（3）增强通电螺线管磁性的方法有：\n方法一：增大螺线管中的电流。电流越大，磁性越强。\n方法二：增加螺线管的线圈匝数。在电流相同时，匝数越多，磁性越强。\n方法三：在螺线管中插入铁芯。铁芯被磁化，磁性会大大增强。\n\n这三种方法中，插入铁芯的效果最明显。"},{"id":"g3_physics_050_ex08","knowledge_id":"g3_physics_050","question":"选择题：下列四个装置中，利用电流磁效应工作的是\nA. 电炉子\nB. 发电机\nC. 电铃\nD. 白炽灯","answer":"答案：C\n解析：电流的磁效应是指电流周围存在磁场的现象。电铃的主要部件是电磁铁，电磁铁就是利用电流的磁效应工作的：通电时，电磁铁有磁性，吸引衔铁，带动小锤敲击铃碗；断电时，电磁铁失去磁性，衔铁弹回，电路又接通，如此反复，电铃就不断发声。A选项电炉子利用的是电流的热效应；B选项发电机利用的是电磁感应现象（磁生电）；D选项白炽灯也是利用电流的热效应，灯丝发热发光。所以正确答案是C。"},{"id":"g3_physics_050_ex09","knowledge_id":"g3_physics_050","question":"判断题：奥斯特实验首次证明了磁能生电。（  ）","answer":"答案：错误\n解析：奥斯特实验首次证明了电流周围存在磁场，也就是电能生磁（电流的磁效应），而不是磁能生电。磁能生电是电磁感应现象，是由英国科学家法拉第在1831年发现的，比奥斯特实验晚了约11年。注意区分：奥斯特实验——电生磁（电流的磁效应）；法拉第电磁感应——磁生电。两者不要混淆。"},{"id":"g3_physics_050_ex10","knowledge_id":"g3_physics_050","question":"填空题：通电螺线管周围的磁场与______磁体的磁场相似，它的两端相当于两个______。通电螺线管的极性可以用______定则来判断。如果要使通电螺线管的磁性增强，可以采取的措施有______、______、______。","answer":"答案：条形，磁极，安培（右手螺旋），增大电流，增加线圈匝数，插入铁芯\n解析：通电螺线管外部的磁场分布与条形磁体非常相似，两端磁性最强，相当于两个磁极（N极和S极），中间磁性较弱。通电螺线管的极性可以用安培定则（右手螺旋定则）来判断：右手握住螺线管，四指弯曲指向电流方向，大拇指所指的那端就是N极。要增强通电螺线管的磁性，可以从三个方面入手：增大电流大小、增加线圈的匝数、在螺线管内插入铁芯。其中插入铁芯的效果最明显，因为铁芯被磁化后，磁性会大大增强。"},{"id":"g3_physics_051_ex01","knowledge_id":"g3_physics_051","question":"选择题：关于电磁铁，下列说法正确的是\nA. 电磁铁的磁性强弱与电流大小无关\nB. 电磁铁的磁性强弱与线圈匝数无关\nC. 电磁铁是利用电流的磁效应工作的\nD. 电磁铁中插入铁芯后，磁性会减弱","answer":"答案：C\n解析：A选项错误，电磁铁的磁性强弱与电流大小有关，电流越大，磁性越强。B选项错误，电磁铁的磁性强弱与线圈匝数有关，在电流相同时，匝数越多，磁性越强。C选项正确，电磁铁的工作原理是电流的磁效应：通电螺线管周围存在磁场，插入铁芯后，铁芯被磁化，磁性大大增强。D选项错误，电磁铁中插入铁芯后，铁芯被磁化，磁性会大大增强，而不是减弱。电磁铁的优点是：磁性有无可以由通断电控制，磁性强弱可以由电流大小控制，磁极方向可以由电流方向控制。"},{"id":"g3_physics_051_ex02","knowledge_id":"g3_physics_051","question":"填空题：电磁铁由______和______两部分组成。电磁铁的优点是：磁性的有无可以由______来控制；磁性的强弱可以由______来控制；磁极的方向可以由______来控制。","answer":"答案：螺线管，铁芯，通断电（开关），电流大小，电流方向\n解析：电磁铁是在通电螺线管内插入铁芯构成的。铁芯在通电螺线管的磁场中被磁化，使电磁铁的磁性大大增强。电磁铁有三个主要优点：第一，磁性的有无可以由通断电来控制——通电时有磁性，断电时磁性消失；第二，磁性的强弱可以由电流大小来控制——电流越大，磁性越强；第三，磁极的方向可以由电流方向来控制——改变电流方向，电磁铁的N极和S极也随之改变。这些优点使电磁铁在生产生活中有广泛的应用。"},{"id":"g3_physics_051_ex03","knowledge_id":"g3_physics_051","question":"选择题：电磁继电器的作用是\nA. 直接测量电流大小\nB. 利用低电压、弱电流控制高电压、强电流\nC. 直接测量电压大小\nD. 改变电路中的电阻","answer":"答案：B\n解析：电磁继电器是利用电磁铁来控制工作电路的一种开关。它的主要作用是可以用低电压、弱电流的控制电路来间接控制高电压、强电流的工作电路，这样可以避免人直接操作高电压、强电流，保证操作安全。同时，电磁继电器还可以实现远距离操纵和自动控制。A和C选项错误，电磁继电器不是测量仪器；D选项错误，电磁继电器不是改变电阻的装置。"},{"id":"g3_physics_051_ex04","knowledge_id":"g3_physics_051","question":"判断题：电磁铁的铁芯可以用钢来制作。（  ）","answer":"答案：错误\n解析：电磁铁的铁芯不能用钢来制作，应该用软铁（铁棒）来制作。这是因为电磁铁需要在通电时有磁性，断电时磁性很快消失。软铁是软磁性材料，磁化后磁性容易消失，断电后很快就没有磁性了，符合电磁铁的要求。而钢是硬磁性材料，磁化后磁性能够长期保持，断电后仍然有磁性，这样电磁铁就失去了\"通断电控制磁性有无\"的优点。所以电磁铁的铁芯要用软铁，不能用钢。"},{"id":"g3_physics_051_ex05","knowledge_id":"g3_physics_051","question":"选择题：要使电磁铁的磁性增强，下列方法中不可行的是\nA. 增加线圈的匝数\nB. 增大线圈中的电流\nC. 换用更粗的铁芯\nD. 改变线圈中的电流方向","answer":"答案：D\n解析：电磁铁的磁性强弱与三个因素有关：电流大小、线圈匝数、有无铁芯（或铁芯粗细）。A选项增加线圈匝数，磁性增强；B选项增大电流，磁性增强；C选项换用更粗的铁芯，被磁化的铁更多，磁性也会增强。D选项改变电流方向，只能改变电磁铁的磁极方向（N极和S极互换），不能改变磁性的强弱。所以改变电流方向不能增强磁性，正确答案是D。"},{"id":"g3_physics_051_ex06","knowledge_id":"g3_physics_051","question":"填空题：电磁继电器主要由______、______、弹簧、触点等部分组成。它的工作电路可以分为两部分：______电路和______电路。电磁继电器的实质是利用______来控制工作电路的一种开关。","answer":"答案：电磁铁，衔铁，控制，工作，电磁铁\n解析：电磁继电器主要由电磁铁、衔铁、弹簧、触点等部分组成。它的电路由两部分构成：控制电路和工作电路。控制电路是接电磁铁的那部分电路，通常是低电压、弱电流；工作电路是接用电器的那部分电路，通常是高电压、强电流。电磁继电器的工作原理是：控制电路接通时，电磁铁有磁性，吸引衔铁，使工作电路接通；控制电路断开时，电磁铁失去磁性，弹簧把衔铁拉起来，工作电路断开。所以电磁继电器的实质就是利用电磁铁来控制工作电路的一种间接开关。"},{"id":"g3_physics_051_ex07","knowledge_id":"g3_physics_051","question":"解答题：某同学在探究\"影响电磁铁磁性强弱的因素\"实验中，设计了如下实验：用相同的漆包线在两个相同的铁钉上绕制线圈，甲线圈匝数为50匝，乙线圈匝数为100匝。将它们串联后接入电路，再用电磁铁吸引大头针，比较吸引大头针的数量。请回答：（1）实验中通过观察什么来判断电磁铁磁性的强弱？这种方法叫什么？（2）将两个电磁铁串联的目的是什么？（3）实验中预计哪个电磁铁吸引的大头针更多？这说明了什么？","answer":"答案：（1）通过比较吸引大头针的数量来判断磁性强弱，这种方法叫转换法；（2）串联是为了控制电流大小相同；（3）乙电磁铁（100匝）吸引的大头针更多，说明在电流相同、有铁芯时，线圈匝数越多，电磁铁磁性越强。\n解析：\n（1）电磁铁的磁性强弱看不见、摸不着，我们通过它吸引大头针数量的多少来间接判断磁性强弱——吸引的大头针越多，说明磁性越强。这种将不易观察的量转换为容易观察的量的研究方法叫做转换法。\n\n（2）将两个电磁铁串联接入电路，根据串联电路电流相等的特点，可以保证通过两个电磁铁的电流大小相同。这样在探究磁性强弱与匝数的关系时，就控制了电流这个变量，符合控制变量法的要求。\n\n（3）因为两个电磁铁电流相同、都有铁芯，而乙的匝数（100匝）比甲的匝数（50匝）多，所以乙的磁性更强，吸引的大头针更多。这说明：在电流大小相同、都有铁芯的情况下，线圈的匝数越多，电磁铁的磁性越强。"},{"id":"g3_physics_051_ex08","knowledge_id":"g3_physics_051","question":"选择题：下列应用中，没有用到电磁铁的是\nA. 电磁起重机\nB. 电铃\nC. 电烙铁\nD. 电磁继电器","answer":"答案：C\n解析：A选项电磁起重机利用电磁铁的磁性来吸引钢铁等铁磁性材料，通电时有磁性能吊起重物，断电时磁性消失放下重物。B选项电铃利用电磁铁的通断电，反复吸引和释放衔铁，带动小锤敲击铃碗发声。C选项电烙铁是利用电流的热效应工作的，电流通过发热体产生热量来熔化焊锡，它里面没有用到电磁铁。D选项电磁继电器就是利用电磁铁来控制工作电路的开关。所以正确答案是C。"},{"id":"g3_physics_051_ex09","knowledge_id":"g3_physics_051","question":"填空题：探究电磁铁磁性强弱实验中，常用的研究方法有______法和______法。电磁铁与永磁体相比，有三个突出的优点：一是磁性有无可以通过______来控制；二是磁性强弱可以通过______来控制；三是磁极方向可以通过______来控制。","answer":"答案：控制变量，转换，通断电，电流大小，电流方向\n解析：探究电磁铁磁性强弱的实验中，因为影响因素有多个（电流大小、匝数多少、有无铁芯），所以需要用控制变量法，每次只改变一个因素，控制其他因素不变。同时，磁性强弱不能直接观察，所以用吸引大头针数量的多少来表示，这是转换法。电磁铁与永磁体（如条形磁铁）相比，有三大优点：第一，磁性有无可以控制——通电有磁，断电无磁；第二，磁性强弱可以控制——电流大磁性强，电流小磁性弱；第三，磁极方向可以控制——改变电流方向，磁极也改变。这些优点使电磁铁在很多领域得到广泛应用。"},{"id":"g3_physics_051_ex10","knowledge_id":"g3_physics_051","question":"判断题：电磁继电器可以实现远距离操纵和自动控制。（  ）","answer":"答案：正确\n解析：电磁继电器的一个重要应用就是实现远距离操纵和自动控制。因为控制电路和工作电路是分开的，控制电路通常是低电压、弱电流，比较安全。我们可以在安全的地方操作控制电路，让工作电路在远处或危险的环境中工作，实现远距离操纵。另外，利用温度、光线、压力等传感器控制控制电路的通断，还可以实现各种自动控制，比如温度自动报警、水位自动控制、路灯自动开关等。所以电磁继电器在自动控制领域有非常广泛的应用。"},{"id":"g3_physics_052_ex01","knowledge_id":"g3_physics_052","question":"选择题：电动机的工作原理是\nA. 电磁感应现象\nB. 通电线圈在磁场中受力转动\nC. 电流的磁效应\nD. 电流的热效应","answer":"答案：B\n解析：电动机的工作原理是通电线圈在磁场中受力转动。当电流通过电动机的线圈时，线圈作为通电导体在磁场中会受到力的作用，从而发生转动，将电能转化为机械能。A选项电磁感应现象是发电机的工作原理（磁生电）；C选项电流的磁效应是电磁铁、电铃等的工作原理；D选项电流的热效应是电热器（如电炉子、电热水器）的工作原理。所以正确答案是B。"},{"id":"g3_physics_052_ex02","knowledge_id":"g3_physics_052","question":"填空题：电动机工作时，把______能转化为______能。电动机的两个基本组成部分是______和______。直流电动机中，______的作用是当线圈转过平衡位置时自动改变线圈中的电流方向，使线圈能够持续转动。","answer":"答案：电，机械，定子，转子，换向器\n解析：电动机是消耗电能、输出机械能的装置，工作时把电能转化为机械能。电动机主要由两部分组成：固定不动的定子（通常是磁体）和能够转动的转子（通常是线圈）。直流电动机中，换向器是一个非常重要的部件，它由两个铜半环组成，与电刷配合。当线圈转过平衡位置时，换向器自动改变线圈中的电流方向，从而改变线圈两边的受力方向，使线圈能够持续转动下去。如果没有换向器，线圈转过平衡位置后会受到反向的力，最终停在平衡位置。"},{"id":"g3_physics_052_ex03","knowledge_id":"g3_physics_052","question":"选择题：关于通电导体在磁场中受力的方向，下列说法正确的是\nA. 只与电流方向有关\nB. 只与磁场方向有关\nC. 与电流方向和磁场方向都有关\nD. 与电流方向和磁场方向都无关","answer":"答案：C\n解析：通电导体在磁场中受力的方向与两个因素有关：一是电流的方向，二是磁场的方向（磁感线的方向）。只改变其中一个因素（比如只改变电流方向，或只改变磁场方向），导体受力方向就会改变；如果同时改变两个因素（既改变电流方向又改变磁场方向），则导体受力方向不变。这是一个重要的规律，可以用左手定则来判断（初中阶段一般不要求掌握左手定则，但要求知道受力方向与这两个因素都有关）。所以正确答案是C。"},{"id":"g3_physics_052_ex04","knowledge_id":"g3_physics_052","question":"判断题：电动机工作时只将电能转化为机械能，不会产生任何热量。（  ）","answer":"答案：错误\n解析：电动机工作时也会发热。因为电动机的线圈是有电阻的，电流通过线圈时，根据焦耳定律，会产生热量（电流的热效应），所以电动机工作一段时间后外壳会发热。理想情况下我们希望电动机把电能全部转化为机械能，但实际上总有一部分电能转化为内能（热量）损失掉了。所以电动机的效率总是小于100%。不过，电动机的效率比热机要高得多，一般可以达到80%以上。"},{"id":"g3_physics_052_ex05","knowledge_id":"g3_physics_052","question":"选择题：要改变直流电动机的转动方向，可以\nA. 增大电流\nB. 改变电流方向或改变磁场方向\nC. 同时改变电流方向和磁场方向\nD. 增大磁场强度","answer":"答案：B\n解析：电动机的转动方向与线圈的受力方向有关，而受力方向又与电流方向和磁场方向都有关。要改变转动方向，可以改变电流方向，或者改变磁场方向（二者选其一）。如果同时改变电流方向和磁场方向，则转动方向不变。所以B正确，C错误。A选项增大电流和D选项增大磁场强度，都只能改变受力的大小，使电动机转得更快，不能改变转动方向。所以正确答案是B。"},{"id":"g3_physics_052_ex06","knowledge_id":"g3_physics_052","question":"填空题：通电导体在磁场中会受到______的作用。当电流方向与磁场方向平行时，导体受到的力为______；当电流方向与磁场方向垂直时，导体受到的力最______。电动机就是根据这个原理制成的，它工作时将______能转化为______能。","answer":"答案：力，零，大，电，机械\n解析：通电导体在磁场中会受到力的作用，这是电动机的原理。但是，并不是所有情况下通电导体在磁场中都受力。当电流方向与磁场方向平行（即导体沿着磁感线方向放置）时，导体不受力，受力为零；当电流方向与磁场方向垂直时，导体受到的力最大；其他情况下受力介于零和最大值之间。电动机就是利用通电线圈在磁场中受力转动的原理制成的，它消耗电能，输出机械能，将电能转化为机械能。"},{"id":"g3_physics_052_ex07","knowledge_id":"g3_physics_052","question":"解答题：小明在制作简易电动机的实验中，把一个线圈放在磁场中，通电后线圈却没有转动。请你帮他分析一下可能的原因有哪些？（至少说出三种）","answer":"答案：可能的原因有：电路中没有电流（断路）、磁体磁性太弱、线圈刚好停在平衡位置、电流太小、轴的摩擦力太大等。\n解析：\n简易电动机不转动的可能原因有：\n\n1. 电路断路，线圈中没有电流：\n   - 开关没有闭合\n   - 导线连接处接触不良\n   - 电源没电了\n   没有电流，线圈就不会受力，自然不转动。\n\n2. 线圈刚好停在平衡位置：\n   当线圈平面与磁感线垂直时，线圈两边受力大小相等、方向相反，在同一直线上，是一对平衡力，此时线圈受到的合力为零，不会转动。这是线圈的平衡位置。只要用手轻轻拨动一下线圈，让它转过平衡位置，就能持续转动了。\n\n3. 磁体磁性太弱：\n   磁场太弱，线圈受到的力太小，不足以克服摩擦，线圈就不转。可以换用磁性更强的磁体试试。\n\n4. 线圈中电流太小：\n   电流太小，受力太小，也转不起来。可以增大电源电压，或者减少线圈的电阻。\n\n5. 线圈轴处摩擦力太大：\n   轴与支架之间摩擦太大，即使受力也转不动。可以把轴打磨光滑，或加润滑油减小摩擦。"},{"id":"g3_physics_052_ex08","knowledge_id":"g3_physics_052","question":"选择题：下列家用电器中，利用电动机工作的是\nA. 电饭锅\nB. 电熨斗\nC. 电风扇\nD. 电热水器","answer":"答案：C\n解析：电动机的特点是通电后会转动，把电能转化为机械能。电风扇通电后扇叶转动，就是利用电动机工作的。A选项电饭锅、B选项电熨斗、D选项电热水器都是利用电流的热效应工作的，把电能转化为内能（热能），它们的主要部件是发热体，而不是电动机。所以正确答案是C。生活中利用电动机工作的用电器还有很多，比如洗衣机、空调（压缩机）、电冰箱（压缩机）、吸尘器、电动自行车等。"},{"id":"g3_physics_052_ex09","knowledge_id":"g3_physics_052","question":"填空题：直流电动机中，换向器的作用是：每当线圈转过______位置时，自动改变线圈中的______方向，从而改变线圈的______方向，使线圈能够持续地转动下去。要使电动机的转速加快，可以采取的措施有______或______。","answer":"答案：平衡，电流，受力，增大电流，增强磁场（减少摩擦也算对）\n解析：在直流电动机中，换向器是由两个铜半环和电刷组成的装置。当线圈转过平衡位置（线圈平面与磁感线垂直的位置）时，如果电流方向不变，线圈受力方向会反过来，阻碍线圈继续转动。换向器的作用就是在这个关键时刻自动改变线圈中的电流方向，从而改变线圈两边的受力方向，使线圈能够继续沿原来的方向转动。要使电动机的转速加快，就是要增大线圈受到的力，可以通过增大线圈中的电流、增强磁体的磁场来实现。另外，减小摩擦也可以让电机转得更快。"},{"id":"g3_physics_052_ex10","knowledge_id":"g3_physics_052","question":"判断题：发电机和电动机的工作原理是一样的，都是电磁感应。（  ）","answer":"答案：错误\n解析：发电机和电动机的工作原理是不同的。发电机的工作原理是电磁感应现象（磁生电）：闭合电路的一部分导体在磁场中做切割磁感线运动，产生感应电流，发电机工作时把机械能转化为电能。电动机的工作原理是通电线圈在磁场中受力转动（电生力）：通电后线圈在磁场中受到力的作用而转动，电动机工作时把电能转化为机械能。简单区分：电动机是\"通电就转\"（电→机械），发电机是\"转动发电\"（机械→电）。二者原理相反，不要混淆。"},{"id":"g3_physics_053_ex01","knowledge_id":"g3_physics_053","question":"选择题：首先发现电磁感应现象的科学家是\nA. 奥斯特\nB. 法拉第\nC. 安培\nD. 焦耳","answer":"答案：B\n解析：1831年，英国物理学家法拉第经过十年的不懈努力，终于发现了电磁感应现象：闭合电路的一部分导体在磁场中做切割磁感线运动时，导体中会产生感应电流。这一发现揭示了电和磁之间的更深层次联系，导致了发电机的发明，使人类大规模用电成为可能，开创了电气时代。奥斯特发现了电流的磁效应（电生磁）；安培总结出了安培定则；焦耳发现了焦耳定律。所以正确答案是B。"},{"id":"g3_physics_053_ex02","knowledge_id":"g3_physics_053","question":"填空题：电磁感应现象：______电路的______导体在磁场中做______运动时，导体中产生感应电流。感应电流的方向与______方向和______方向都有关。发电机就是利用______现象制成的，工作时把______能转化为______能。","answer":"答案：闭合，一部分，切割磁感线，导体运动，磁场，电磁感应，机械，电\n解析：电磁感应现象是指：闭合电路的一部分导体在磁场中做切割磁感线运动时，导体中会产生感应电流。产生感应电流的条件有三个：一是电路必须闭合；二是只是电路的一部分导体在磁场中（不是全部）；三是导体必须做切割磁感线运动（导体运动方向与磁感线方向不平行）。感应电流的方向与导体运动方向和磁场方向都有关，只改变其中一个方向，感应电流方向改变；同时改变两个方向，感应电流方向不变。发电机就是利用电磁感应现象制成的，工作时把机械能转化为电能。"},{"id":"g3_physics_053_ex03","knowledge_id":"g3_physics_053","question":"选择题：下列情况中，能产生感应电流的是\nA. 导体在磁场中运动\nB. 一段导体在磁场中做切割磁感线运动\nC. 闭合电路的一部分导体在磁场中运动\nD. 闭合电路的一部分导体在磁场中做切割磁感线运动","answer":"答案：D\n解析：产生感应电流必须同时满足三个条件：（1）电路必须是闭合的；（2）只是电路的一部分导体在磁场中；（3）这部分导体必须做切割磁感线运动。三个条件缺一不可。A选项缺少\"闭合电路\"、\"一部分导体\"、\"切割磁感线\"等条件；B选项缺少\"闭合电路\"；C选项缺少\"切割磁感线运动\"；D选项三个条件都满足，能产生感应电流。所以正确答案是D。"},{"id":"g3_physics_053_ex04","knowledge_id":"g3_physics_053","question":"判断题：发电机是利用通电线圈在磁场中受力转动的原理制成的。（  ）","answer":"答案：错误\n解析：发电机的工作原理是电磁感应现象（磁生电）：闭合电路的一部分导体在磁场中做切割磁感线运动，产生感应电流。发电机工作时把机械能转化为电能。而\"通电线圈在磁场中受力转动\"是电动机的工作原理，电动机工作时把电能转化为机械能。注意区分：发电机是\"动而生电\"（机械能→电能），电动机是\"电而动\"（电能→机械能）。二者不要混淆。"},{"id":"g3_physics_053_ex05","knowledge_id":"g3_physics_053","question":"选择题：关于电磁感应，下列说法正确的是\nA. 感应电流的大小与磁场强弱无关\nB. 感应电流的方向只与导体运动方向有关\nC. 导体不切割磁感线也可能产生感应电流\nD. 电磁感应现象中，机械能转化为电能","answer":"答案：D\n解析：A选项错误，感应电流的大小与磁场强弱、导体运动速度、导体匝数等因素有关，磁场越强、速度越快、匝数越多，感应电流越大。B选项错误，感应电流的方向与导体运动方向和磁场方向都有关。C选项错误，只有导体做切割磁感线运动才可能产生感应电流，不切割磁感线就不会产生感应电流。D选项正确，电磁感应现象中，消耗了机械能，得到了电能，所以是机械能转化为电能，发电机就是应用这个原理。"},{"id":"g3_physics_053_ex06","knowledge_id":"g3_physics_053","question":"填空题：交流电是指______和______都随时间做周期性变化的电流。我国供生产和生活用的交流电，频率是______Hz，周期是______s，电流方向每秒改变______次。发电机主要由______和______两部分组成。","answer":"答案：大小，方向，50，0.02，100，定子，转子\n解析：交流电（交变电流）是指大小和方向都随时间做周期性变化的电流。我国电网供给的交流电，频率是50 Hz（赫兹），即每秒有50个周期，周期是0.02秒。因为每个周期电流方向改变2次，所以50 Hz的交流电，电流方向每秒改变100次。发电机主要由定子（固定不动的部分，通常是磁体或线圈）和转子（转动的部分，通常是线圈或磁体）两部分组成。实际的大型发电机一般采用线圈不动、磁极旋转的方式，这样可以输出更高的电压和更大的电流。"},{"id":"g3_physics_053_ex07","knowledge_id":"g3_physics_053","question":"解答题：小明在探究\"电磁感应现象\"实验中，将一根导体棒用两根细线悬挂在蹄形磁体的磁场中，导体棒的两端通过导线与电流表组成闭合回路。请回答：（1）小明应该怎样操作，才能观察到电流表指针偏转？（2）要使电流表指针偏转方向改变，可以采取什么方法？（说出两种方法）（3）这个实验说明了什么物理原理？生活中有什么应用？","answer":"答案：（1）让导体棒做切割磁感线运动（左右运动）；（2）改变导体运动方向，或改变磁场方向；（3）电磁感应原理，应用是发电机。\n解析：\n（1）要产生感应电流，必须满足三个条件：闭合电路、一部分导体、做切割磁感线运动。所以小明应该让导体棒在磁场中左右运动，切割磁感线，这样电流表指针就会偏转，说明产生了感应电流。如果导体棒上下运动（沿着磁感线方向），不切割磁感线，就不会产生感应电流，电流表指针不偏转。\n\n（2）感应电流的方向与导体运动方向和磁场方向都有关。要改变感应电流方向（使电流表指针偏转方向改变），可以：\n方法一：保持磁场方向不变，改变导体棒的运动方向（比如原来向右，改为向左）。\n方法二：保持导体运动方向不变，对调磁体的N极和S极，改变磁场方向。\n注意：如果同时改变导体运动方向和磁场方向，感应电流方向不变。\n\n（3）这个实验说明了电磁感应原理：闭合电路的一部分导体在磁场中做切割磁感线运动时，导体中会产生感应电流。\n电磁感应原理在生活中的最重要应用是发电机，发电机就是利用这个原理将机械能转化为电能的。此外，变压器、动圈式话筒等也用到了电磁感应原理。"},{"id":"g3_physics_053_ex08","knowledge_id":"g3_physics_053","question":"选择题：下列设备中，利用电磁感应现象工作的是\nA. 电铃\nB. 发电机\nC. 电动机\nD. 电磁铁","answer":"答案：B\n解析：A选项电铃是利用电流的磁效应（电磁铁）工作的；B选项发电机是利用电磁感应现象工作的，将机械能转化为电能；C选项电动机是利用通电线圈在磁场中受力转动的原理工作的，将电能转化为机械能；D选项电磁铁也是利用电流的磁效应工作的。所以正确答案是B。注意区分这几个原理：电磁感应（发电机）、通电导体在磁场中受力（电动机）、电流的磁效应（电磁铁、电铃）。"},{"id":"g3_physics_053_ex09","knowledge_id":"g3_physics_053","question":"填空题：在电磁感应现象中，感应电流的方向与______方向和______方向有关。如果这两个方向同时改变，则感应电流方向______（选填\"改变\"或\"不变\"）。在电磁感应现象中，______能转化为______能。","answer":"答案：导体运动，磁场，不变，机械，电\n解析：感应电流的方向由两个因素决定：导体的运动方向和磁场方向（磁感线方向）。只改变其中一个因素，感应电流方向就会改变；如果同时改变两个因素，则感应电流方向不变。这与通电导体在磁场中受力方向的规律类似。在电磁感应现象中，导体运动消耗了机械能，电路中产生了电能，所以能量转化是机械能转化为电能。这就是发电机的原理。"},{"id":"g3_physics_053_ex10","knowledge_id":"g3_physics_053","question":"判断题：只要导体在磁场中运动，就一定能产生感应电流。（  ）","answer":"答案：错误\n解析：产生感应电流必须同时满足三个条件：第一，电路必须是闭合的（形成回路）；第二，只是电路的一部分导体在磁场中；第三，这部分导体必须做切割磁感线运动。三个条件缺一不可。如果电路不闭合，即使导体做切割磁感线运动，也只会在导体两端产生感应电压，不会有感应电流。如果导体沿着磁感线方向运动（不切割），也不会产生感应电流。所以\"只要导体在磁场中运动就一定产生感应电流\"的说法是错误的。"},{"id":"g3_physics_054_ex01","knowledge_id":"g3_physics_054","question":"选择题：关于磁场对通电导线的作用，下列说法正确的是\nA. 通电导线在磁场中一定受到力的作用\nB. 通电导线在磁场中受力方向只与电流方向有关\nC. 通电导线在磁场中受力方向只与磁场方向有关\nD. 通电导线中的电流方向与磁场方向平行时，不受力","answer":"答案：D\n解析：A选项错误，通电导线在磁场中不一定都受力。当电流方向与磁场方向平行时，导线不受力；只有当电流方向与磁场方向不平行时，导线才受力。B和C选项都错误，通电导线在磁场中的受力方向与电流方向和磁场方向都有关系，只改变其中一个方向，受力方向改变；同时改变两个方向，受力方向不变。D选项正确，当导线中的电流方向与磁场方向平行时，导线不受力；当电流方向与磁场方向垂直时，受力最大。"},{"id":"g3_physics_054_ex02","knowledge_id":"g3_physics_054","question":"填空题：通电导线在磁场中会受到______的作用。受力方向与______方向和______方向都有关。只改变其中一个方向，受力方向______；同时改变两个方向，受力方向______。能量转化：______能转化为______能。","answer":"答案：力，电流，磁场，改变，不变，电，机械\n解析：通电导线在磁场中会受到力的作用，这是电动机的基本原理。受力方向与两个因素有关：电流方向和磁场方向（磁感线方向）。只改变其中一个方向（比如只改变电流方向，或只改变磁场方向），受力方向就会改变；如果同时改变电流方向和磁场方向，受力方向反而不变。在这个过程中，消耗了电能，得到了机械能，所以能量转化是电能转化为机械能。"},{"id":"g3_physics_054_ex03","knowledge_id":"g3_physics_054","question":"选择题：要使通电导线在磁场中受到的力变大，下列方法中不可行的是\nA. 增大导线中的电流\nB. 增强磁场\nC. 让导线更粗一些\nD. 让导线与磁场方向平行","answer":"答案：D\n解析：通电导线在磁场中受力的大小与电流大小、磁场强弱、导线长度等因素有关。A选项增大电流，受力变大；B选项增强磁场，受力变大；C选项导线更粗，横截面积更大，在相同电流密度下受力也更大（或者说有效受力的导体更多）。D选项让导线与磁场方向平行，此时导线不受力（受力为零），所以不是变大，而是变为零。所以正确答案是D。当导线与磁场方向垂直时，受力最大。"},{"id":"g3_physics_054_ex04","knowledge_id":"g3_physics_054","question":"判断题：磁场对通电导线的作用力方向与电流方向和磁场方向都有关。（  ）","answer":"答案：正确\n解析：这句话是正确的。通电导线在磁场中受到的力的方向，既与电流方向有关，又与磁场方向有关。用左手定则可以判断：伸开左手，让磁感线穿入手心，四指指向电流方向，那么大拇指所指的方向就是受力方向。只改变电流方向，或者只改变磁场方向，受力方向都会改变；如果同时改变电流方向和磁场方向，受力方向不变。电动机就是利用这个原理工作的。"},{"id":"g3_physics_054_ex05","knowledge_id":"g3_physics_054","question":"选择题：下列关于通电导线在磁场中受力的说法，错误的是\nA. 受力方向与电流方向有关\nB. 受力方向与磁场方向有关\nC. 电流越大，受力一定越大\nD. 导线与磁场平行时受力为零","answer":"答案：C\n解析：A和B选项正确，受力方向与电流方向和磁场方向都有关。C选项错误，电流越大受力越大，这句话是有前提的——其他条件不变时。如果只是电流变大，但同时导线方向从垂直变成了平行，受力可能反而变小甚至为零。而且受力大小还与磁场强弱、导线长度、导线与磁场的夹角等因素有关。所以不能说\"电流越大，受力一定越大\"。D选项正确，导线与磁场平行时，不受力，受力为零。"},{"id":"g3_physics_054_ex06","knowledge_id":"g3_physics_054","question":"填空题：通电线圈在磁场中会发生______。当线圈平面与磁感线______时，线圈受到一对平衡力，这个位置叫做______位置。直流电动机中的______就是利用这个原理，当线圈转过平衡位置时自动改变电流方向，使线圈持续转动。","answer":"答案：转动，垂直，平衡，换向器\n解析：通电线圈在磁场中会受到力的作用而发生转动。当线圈转到平面与磁感线垂直的位置时，线圈的两个对边受到的力大小相等、方向相反、作用在同一直线上，是一对平衡力，所以线圈会在这个位置附近摆动几下后停下来。这个位置叫做平衡位置。直流电动机中安装了换向器（两个铜半环），它的作用就是当线圈由于惯性刚转过平衡位置时，自动改变线圈中的电流方向，从而改变受力方向，使线圈能够持续转动下去。"},{"id":"g3_physics_054_ex07","knowledge_id":"g3_physics_054","question":"解答题：在探究\"磁场对通电导线的作用\"实验中，小明将一根直导线放在光滑的金属导轨上，导轨放在蹄形磁体的磁场中，导线与电源、开关组成闭合回路。请回答：（1）闭合开关后，导线会发生什么现象？这说明了什么？（2）如果只对调磁体的N、S极，再闭合开关，导线的运动方向会怎样？这说明了什么？（3）如果同时改变电流方向和磁场方向，导线的运动方向又会怎样？","answer":"答案：（1）导线会沿导轨运动，说明通电导线在磁场中受到力的作用；（2）导线运动方向改变，说明受力方向与磁场方向有关；（3）导线运动方向不变。\n解析：\n（1）闭合开关后，导线中有电流通过，会观察到导线由静止开始沿导轨运动。这说明：通电导线在磁场中会受到力的作用。这就是磁场对电流的作用。\n\n（2）只对调磁体的N、S极，也就是只改变磁场方向，再闭合开关，会发现导线运动的方向与原来相反。这说明：通电导线在磁场中受力的方向与磁场方向有关。磁场方向改变，受力方向也改变。\n\n（3）如果同时改变电流方向（比如调换电源正负极）和磁场方向（对调N、S极），会发现导线的运动方向不变。这是因为受力方向由电流方向和磁场方向共同决定，同时改变两个因素，受力方向不变。\n\n这个原理的重要应用是电动机，电动机就是利用通电线圈在磁场中受力转动的原理制成的。"},{"id":"g3_physics_054_ex08","knowledge_id":"g3_physics_054","question":"选择题：下列现象中，属于磁场对电流作用的是\nA. 通电螺线管产生磁场\nB. 通电导线周围的小磁针发生偏转\nC. 通电线圈在磁场中转动\nD. 闭合电路的一部分导体在磁场中运动产生电流","answer":"答案：C\n解析：A选项通电螺线管产生磁场，这是电流的磁效应（电生磁），不是磁场对电流的作用。B选项通电导线周围的小磁针发生偏转，这也是电流的磁效应（奥斯特实验），说明电流周围有磁场。C选项通电线圈在磁场中转动，是因为线圈受到了磁场的作用力，这正是磁场对电流的作用，也就是电动机的原理。D选项闭合电路的一部分导体在磁场中运动产生电流，这是电磁感应现象（磁生电），是发电机的原理。所以正确答案是C。"},{"id":"g3_physics_054_ex09","knowledge_id":"g3_physics_054","question":"填空题：通电导体在磁场中受力的大小与______大小、______强弱以及导体在磁场中的______和导体与磁场的______有关。当电流方向与磁场方向______时，受力最大；当电流方向与磁场方向______时，受力为零。","answer":"答案：电流，磁场，长度，夹角，垂直，平行\n解析：通电导体在磁场中受力的大小与多个因素有关：电流越大，受力越大；磁场越强，受力越大；导体在磁场中的长度越长，受力越大；另外，受力大小还与导体和磁场方向的夹角有关。当电流方向与磁场方向垂直时，导体受到的力最大；当电流方向与磁场方向平行时，导体不受力，受力为零；在其他角度时，受力介于零和最大值之间。这些都是磁场对电流作用的基本规律。"},{"id":"g3_physics_054_ex10","knowledge_id":"g3_physics_054","question":"判断题：电磁感应和磁场对电流的作用，其实是一回事，都是电和磁的相互作用。（  ）","answer":"答案：错误\n解析：电磁感应和磁场对电流的作用是两个不同的物理现象，虽然都涉及电和磁，但本质不同。\n电磁感应（磁生电）：是运动的导体（或变化的磁场）产生电流，原因是磁场和相对运动，结果是产生电流，能量转化是机械能→电能，应用是发电机。\n磁场对电流的作用（电生力）：是通电的导体在磁场中受到力，原因是电流和磁场，结果是导体受力运动，能量转化是电能→机械能，应用是电动机。\n简单说：一个是\"动而生电\"，一个是\"电而动\"，过程相反，原理不同，应用也不同。所以不能说它们是一回事。"}];
        const HAS_EXAMPLES = true;

        const WrongBookManager = {
            STORAGE_KEY_PREFIX: 'wrongbook_',
            getWrongBook(grade, subject) {
                const key = this.STORAGE_KEY_PREFIX + grade + '_' + subject;
                return JSON.parse(localStorage.getItem(key) || '[]');
            },
            addWrongBook(item) {
                const key = this.STORAGE_KEY_PREFIX + item.grade + '_' + item.subject;
                let wrongBook = this.getWrongBook(item.grade, item.subject);
                const exists = wrongBook.some(w => w.question === item.question);
                if (exists) return false;
                wrongBook.push({...item, id: item.knowledgeId + '_' + Date.now(), addedAt: new Date().toISOString()});
                localStorage.setItem(key, JSON.stringify(wrongBook));
                return true;

        // 学习进度管理器
        const ProgressManager = {
            STORAGE_KEY: 'study_progress',
            
            getProgress() {
                try {
                    return JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
                } catch(e) {
                    return {};
                }
            },
            
            saveProgress(progress) {
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(progress));
            },
            
            recordStudy(grade, subject, subjectName, semester, semesterName, knowledgeId, knowledgeName) {
                const progress = this.getProgress();
                const now = new Date().toISOString();
                const today = new Date().toISOString().split('T')[0];
                
                if (!progress.learnedKnowledge) progress.learnedKnowledge = {};
                if (!progress.dailyStats) progress.dailyStats = {};
                if (!progress.dailyStats[today]) {
                    progress.dailyStats[today] = { learnedCount: 0, subjects: [] };
                }
                
                const isNew = !progress.learnedKnowledge[knowledgeId];
                progress.learnedKnowledge[knowledgeId] = { learnedAt: now };
                
                if (isNew) {
                    progress.dailyStats[today].learnedCount++;
                    if (!progress.dailyStats[today].subjects.includes(subject)) {
                        progress.dailyStats[today].subjects.push(subject);
                    }
                }
                
                progress.lastStudy = {
                    grade, subject, subjectName, semester, semesterName,
                    knowledgeId, knowledgeName, timestamp: now
                };
                
                this.saveProgress(progress);
            },
            
            isLearned(knowledgeId) {
                const progress = this.getProgress();
                return !!(progress.learnedKnowledge && progress.learnedKnowledge[knowledgeId]);
            },
            
            getLastStudy() {
                const progress = this.getProgress();
                return progress.lastStudy || null;
            },
            
            getSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                if (!progress.learnedKnowledge) return { learned: 0, total: 0, percent: 0 };
                const prefix = grade + '_' + subject + '_';
                const learned = Object.keys(progress.learnedKnowledge).filter(k => k.startsWith(prefix)).length;
                const total = DATA_KNOWLEDGE.length;
                const percent = total > 0 ? Math.round((learned / total) * 100) : 0;
                return { learned, total, percent };
            },
            
            clearSubjectProgress(grade, subject) {
                const progress = this.getProgress();
                const prefix = grade + '_' + subject + '_';
                
                if (progress.learnedKnowledge) {
                    Object.keys(progress.learnedKnowledge).forEach(k => {
                        if (k.startsWith(prefix)) {
                            delete progress.learnedKnowledge[k];
                        }
                    });
                }
                
                if (progress.lastStudy && progress.lastStudy.grade === grade && progress.lastStudy.subject === subject) {
                    delete progress.lastStudy;
                }
                
                this.saveProgress(progress);
                return true;
            }
        };

        // URL参数解析
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                grade: 'g3',
                subject: 'physics',
                semester: params.get('semester') || 'upper'
            };
        }

        const gradeNames = {'g1':'初一','g2':'初二','g3':'初三'};
        const subjectNames = {'physics':'物理'};
        const semesterNames = {'upper':'上册','lower':'下册'};

        let currentParams = getUrlParams();
        let knowledgeList = [];
        let expandedIds = new Set();
        let currentExample = null;

        const pageTitle = document.getElementById('page-title');
        const pageSubtitle = document.getElementById('page-subtitle');
        const knowledgeListEl = document.getElementById('knowledge-list');
        const emptyStateEl = document.getElementById('empty-state');
        const searchResultsInfo = document.getElementById('search-results-info');
        const searchCountEl = document.getElementById('search-count');
        const searchInput = document.getElementById('search-input');

        function initPage() {
            const {grade, subject, semester} = currentParams;
            pageTitle.textContent = gradeNames[grade] + ' · ' + subjectNames[subject] + ' · ' + semesterNames[semester];
            loadKnowledge();
            updateProgressStat();
            
            const hash = window.location.hash.replace('#', '');
            if (hash && knowledgeList.some(k => k.id === hash)) {
                setTimeout(() => {
                    toggleExpand(hash);
                    const card = document.querySelector('[data-id="' + hash + '"]');
                    if (card) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
        }

        function updateProgressStat() {
            const {grade, subject} = currentParams;
            const learnedInSemester = knowledgeList.filter(k => ProgressManager.isLearned(k.id)).length;
            document.getElementById('progress-learned').textContent = learnedInSemester;
            document.getElementById('progress-total').textContent = knowledgeList.length;
        }

        function loadKnowledge() {
            const {grade, subject, semester} = currentParams;
            knowledgeList = DATA_KNOWLEDGE.filter(k => {
                return k.semester === semester;
            });
            renderKnowledgeList();
        }

        function renderKnowledgeList(items = knowledgeList) {
            if (items.length === 0) {
                knowledgeListEl.innerHTML = '';
                emptyStateEl.classList.remove('hidden');
                return;
            }
            emptyStateEl.classList.add('hidden');
            knowledgeListEl.innerHTML = items.map(item => {
                const isExpanded = expandedIds.has(item.id);
                const isLearned = ProgressManager.isLearned(item.id);
                return '<div class="card knowledge-card ' + (isLearned ? 'learned' : '') + '" data-id="' + item.id + '">' +
                    '<div class="knowledge-header p-4 flex items-center justify-between" onclick="toggleExpand(\'' + item.id + '\')">' +
                        '<div class="flex items-center gap-3 flex-1 min-w-0">' +
                            '<div class="expand-icon ' + (isExpanded ? 'expanded' : 'collapsed') + '">' + (isExpanded ? '−' : '+') + '</div>' +
                            '<div class="flex-1 min-w-0">' +
                                '<h3 class="text-lg font-semibold text-gray-800 flex items-center gap-2">' + escapeHtml(item.name) + (isLearned ? '<span class="text-green-500 text-sm">✓ 已学习</span>' : '') + '</h3>' +
                                '<p class="text-xs text-gray-500 mt-1">' + escapeHtml(item.chapter) + '</p>' +
                            '</div>' +
                        '</div>' +
                        (HAS_EXAMPLES ? '<button class="btn btn-secondary text-sm px-3 py-1" onclick="event.stopPropagation(); showExample(\'' + item.id + '\', \'' + escapeHtml(item.name) + '\')">例题</button>' : '') +
                    '</div>' +
                    '<div id="content-' + item.id + '" class="px-6 pb-4 ' + (isExpanded ? '' : 'hidden') + '">' +
                        (item.formula ? '<div class="mb-4"><h4 class="text-sm font-medium text-gray-500 mb-2">📐 公式</h4><p class="formula-box text-gray-800 text-lg bg-gray-50 p-3 rounded-lg">' + escapeHtml(item.formula) + '</p></div>' : '') +
                        (item.explanation ? '<div><h4 class="text-sm font-medium text-gray-500 mb-2">📝 解释</h4><p class="text-gray-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(item.explanation) + '</p></div>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function toggleExpand(id) {
            const isNewLearn = !expandedIds.has(id) && !ProgressManager.isLearned(id);
            if (expandedIds.has(id)) {
                expandedIds.delete(id);
            } else {
                expandedIds.add(id);
                const {grade, subject, semester} = currentParams;
                const item = knowledgeList.find(k => k.id === id);
                if (item) {
                    ProgressManager.recordStudy(
                        grade, subject, subjectNames[subject],
                        semester, semesterNames[semester],
                        id, item.name
                    );
                }
            }
            const card = document.querySelector('[data-id="' + id + '"]');
            const content = document.getElementById('content-' + id);
            const icon = card.querySelector('.expand-icon');
            const header = card.querySelector('.knowledge-header');
            const title = card.querySelector('h3');
            if (expandedIds.has(id)) {
                content.classList.remove('hidden');
                icon.classList.remove('collapsed');
                icon.classList.add('expanded');
                icon.textContent = '−';
                header.classList.add('expanded');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('expanded');
                icon.classList.add('collapsed');
                icon.textContent = '+';
                header.classList.remove('expanded');
            }
            if (isNewLearn) {
                card.classList.add('learned');
                if (!title.querySelector('.text-green-500')) {
                    title.innerHTML += '<span class="text-green-500 text-sm">✓ 已学习</span>';
                }
                updateProgressStat();
            }
        }

        function expandAll() {
            knowledgeList.forEach(item => expandedIds.add(item.id));
            renderKnowledgeList();
        }

        function collapseAll() {
            expandedIds.clear();
            renderKnowledgeList();
        }

        function searchKnowledge(keyword, list) {
            if (!keyword) return [];
            const lower = keyword.toLowerCase();
            return list.filter(k =>
                k.name.toLowerCase().includes(lower) ||
                k.chapter.toLowerCase().includes(lower)
            );
        }

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                searchResultsInfo.classList.add('hidden');
                renderKnowledgeList();
                return;
            }
            const results = searchKnowledge(keyword, knowledgeList);
            searchCountEl.textContent = results.length;
            searchResultsInfo.classList.remove('hidden');
            renderKnowledgeList(results);
        }

        function showExample(knowledgeId, knowledgeName) {
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === knowledgeId);
            if (examples.length === 0) {
                alert('暂无例题');
                return;
            }
            const example = examples[Math.floor(Math.random() * examples.length)];
            currentExample = {...example, knowledgeId, knowledgeName, ...currentParams};
            document.getElementById('example-knowledge-name').textContent = knowledgeName;
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
            document.getElementById('example-modal').classList.remove('hidden');
        }

        function nextExample() {
            if (!currentExample) return;
            const examples = DATA_EXAMPLES.filter(e => e.knowledge_id === currentExample.knowledgeId);
            const otherExamples = examples.filter(e => e !== currentExample);
            if (otherExamples.length === 0) {
                alert('没有更多例题了');
                return;
            }
            const example = otherExamples[Math.floor(Math.random() * otherExamples.length)];
            currentExample = {...example, knowledgeId: currentExample.knowledgeId, knowledgeName: currentExample.knowledgeName, ...currentParams};
            document.getElementById('example-question').textContent = example.question;
            document.getElementById('example-answer').textContent = example.answer;
            document.getElementById('example-answer-section').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
        }

        function addToWrongBook() {
            if (!currentExample) return;
            const item = {
                knowledgeId: currentExample.knowledgeId,
                knowledgeName: currentExample.knowledgeName,
                question: currentExample.question,
                answer: currentExample.answer,
                grade: currentParams.grade,
                subject: currentParams.subject
            };
            if (WrongBookManager.addWrongBook(item)) {
                alert('已加入错题本！');
            } else {
                alert('该题目已在错题本中');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearProgress() {
            const {grade, subject} = currentParams;
            const subjectName = subjectNames[subject];
            var msg = '确定要清除【' + subjectName + '】科目的所有学习进度吗？';
            msg += '\n\n';
            msg += '此操作将清除该科目所有已学习标记，且不可恢复。';
            if (!confirm(msg)) {
                return;
            }
            ProgressManager.clearSubjectProgress(grade, subject);
            updateProgressStat();
            renderKnowledgeList();
            alert('学习进度已清除');
        }

        document.getElementById('btn-expand-all').addEventListener('click', expandAll);
        document.getElementById('btn-collapse-all').addEventListener('click', collapseAll);
        document.getElementById('btn-clear-progress').addEventListener('click', clearProgress);
        searchInput.addEventListener('keyup', e => { if (e.key === 'Enter') performSearch(); });
        searchInput.addEventListener('input', () => { if (!searchInput.value) { searchResultsInfo.classList.add('hidden'); renderKnowledgeList(); }});
        document.getElementById('close-example').addEventListener('click', () => document.getElementById('example-modal').classList.add('hidden'));
        document.getElementById('btn-show-answer').addEventListener('click', () => {
            document.getElementById('example-answer-section').classList.remove('hidden');
            document.getElementById('btn-show-answer').classList.add('hidden');
        });
        document.getElementById('btn-next-example').addEventListener('click', nextExample);
        document.getElementById('btn-add-wrong').addEventListener('click', addToWrongBook);
        document.getElementById('example-modal').addEventListener('click', e => { if (e.target.id === 'example-modal') document.getElementById('example-modal').classList.add('hidden'); });

        initPage();
    </script>
</body>
</html>
